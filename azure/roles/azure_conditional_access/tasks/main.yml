---
# tasks file for azure_conditional_access - Azure AD Conditional Access Policies
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_conditional_access']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_conditional_access_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_conditional_access | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_conditional_access_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_conditional_access_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_conditional_access_status: "running"
    fe_azure_azure_conditional_access_preflight_passed: false
    fe_azure_azure_conditional_access_postflight_passed: false
    fe_azure_azure_conditional_access_failed_task: ""
    fe_azure_azure_conditional_access_error: ""
    fe_azure_azure_conditional_access_stats_published: false
  tags:
    - always

- name: "azure/azure_conditional_access | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_conditional_access | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_conditional_access: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_conditional_access: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_conditional_access | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_conditional_access: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_conditional_access: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_conditional_access_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_conditional_access | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_conditional_access_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate conditional access configuration
      ansible.builtin.assert:
        that:
          - azure_tenant_id is defined
          - azure_cloud_environment is defined
        fail_msg: "Azure tenant configuration required"

    - name: Create conditional access policies
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: identity/conditionalAccess/policies
        resource_name: "{{ item.name }}"
        api_version: "v1.0"
        body:
          displayName: "{{ item.display_name }}"
          state: "{{ item.state | default('enabled') }}"
          conditions:
            applications:
              includeApplications: "{{ item.include_applications | default(['All']) }}"
              excludeApplications: "{{ item.exclude_applications | default([]) }}"
            users:
              includeUsers: "{{ item.include_users | default(['All']) }}"
              excludeUsers: "{{ item.exclude_users | default([]) }}"
              includeGroups: "{{ item.include_groups | default([]) }}"
              excludeGroups: "{{ item.exclude_groups | default([]) }}"
            locations:
              includeLocations: "{{ item.include_locations | default(['All']) }}"
              excludeLocations: "{{ item.exclude_locations | default(['AllTrusted']) }}"
            platforms:
              includePlatforms: "{{ item.include_platforms | default(['all']) }}"
              excludePlatforms: "{{ item.exclude_platforms | default([]) }}"
            clientAppTypes: "{{ item.client_app_types | default(['all']) }}"
            signInRiskLevels: "{{ item.signin_risk_levels | default(['high', 'medium']) }}"
            userRiskLevels: "{{ item.user_risk_levels | default(['high']) }}"
          grantControls:
            operator: "{{ item.grant_operator | default('AND') }}"
            builtInControls: "{{ item.grant_controls | default(['mfa', 'compliantDevice']) }}"
            customAuthenticationFactors: "{{ item.custom_auth_factors | default([]) }}"
          sessionControls:
            signInFrequency:
              value: "{{ item.signin_frequency_value | default(1) }}"
              type: "{{ item.signin_frequency_type | default('hours') }}"
            persistentBrowser:
              mode: "{{ item.persistent_browser_mode | default('never') }}"
            cloudAppSecurity:
              isEnabled: "{{ item.cloud_app_security_enabled | default(true) }}"
              cloudAppSecurityType: "{{ item.cloud_app_security_type | default('monitorOnly') }}"
        state: "{{ item.policy_state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_conditional_access_policies }}"
      when: azure_conditional_access_policies is defined
      register: ca_policies_result
      notify: Log conditional access changes

    - name: Create Fourth Estate baseline conditional access policies
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: identity/conditionalAccess/policies
        resource_name: "{{ item.name }}"
        api_version: "v1.0"
        body: "{{ item.policy }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop:
        - name: "4E-RequireMFA-AllUsers"
          policy:
            displayName: "Fourth Estate: Require MFA for All Users"
            state: enabled
            conditions:
              applications:
                includeApplications: ["All"]
              users:
                includeUsers: ["All"]
                excludeUsers: []
                excludeGroups: ["{{ azure_breakglass_group_id | default('') }}"]
              locations:
                includeLocations: ["All"]
            grantControls:
              operator: "OR"
              builtInControls: ["mfa"]
        - name: "4E-BlockLegacyAuth"
          policy:
            displayName: "Fourth Estate: Block Legacy Authentication"
            state: enabled
            conditions:
              applications:
                includeApplications: ["All"]
              users:
                includeUsers: ["All"]
              clientAppTypes: ["exchangeActiveSync", "other"]
            grantControls:
              operator: "OR"
              builtInControls: ["block"]
        - name: "4E-RequireCompliantDevice"
          policy:
            displayName: "Fourth Estate: Require Compliant or Hybrid Joined Device"
            state: enabled
            conditions:
              applications:
                includeApplications: ["All"]
              users:
                includeUsers: ["All"]
                excludeGroups: ["{{ azure_breakglass_group_id | default('') }}"]
              platforms:
                includePlatforms: ["all"]
            grantControls:
              operator: "OR"
              builtInControls: ["compliantDevice", "domainJoinedDevice"]
        - name: "4E-BlockHighRiskSignIns"
          policy:
            displayName: "Fourth Estate: Block High Risk Sign-ins"
            state: enabled
            conditions:
              applications:
                includeApplications: ["All"]
              users:
                includeUsers: ["All"]
              signInRiskLevels: ["high"]
            grantControls:
              operator: "OR"
              builtInControls: ["block"]
        - name: "4E-RequireMFA-HighRiskUsers"
          policy:
            displayName: "Fourth Estate: Require MFA and Password Change for High Risk Users"
            state: enabled
            conditions:
              applications:
                includeApplications: ["All"]
              users:
                includeUsers: ["All"]
              userRiskLevels: ["high"]
            grantControls:
              operator: "AND"
              builtInControls: ["mfa", "passwordChange"]
      when: azure_ca_deploy_baseline_policies | default(true)
      register: baseline_policies_result
      notify: Log conditional access changes

    - name: Configure named locations for conditional access
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: identity/conditionalAccess/namedLocations
        resource_name: "{{ item.name }}"
        api_version: "v1.0"
        body:
          displayName: "{{ item.display_name }}"
          isTrusted: "{{ item.is_trusted | default(false) }}"
          ipRanges: "{{ item.ip_ranges }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_ca_named_locations }}"
      when: azure_ca_named_locations is defined
      register: named_locations_result
      notify: Log conditional access changes

    - name: Configure authentication strength policies
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: identity/conditionalAccess/authenticationStrength/policies
        resource_name: "{{ item.name }}"
        api_version: "beta"
        body:
          displayName: "{{ item.display_name }}"
          description: "{{ item.description }}"
          policyType: custom
          requirementsSatisfied: "{{ item.requirements_satisfied | default(['mfa']) }}"
          allowedCombinations: "{{ item.allowed_combinations }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_ca_auth_strength_policies }}"
      when: azure_ca_auth_strength_policies is defined
      register: auth_strength_result
      notify: Log conditional access changes

    - name: Enable conditional access audit logging
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: conditional-access-diagnostics
        resource_uri: "/providers/Microsoft.AADIAM/conditionalAccess"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        logs:
          - category: ConditionalAccessPolicyApplication
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_ca_enable_diagnostics | default(true)
      register: diagnostics_result
      notify: Log conditional access changes

    - name: Display conditional access summary
      ansible.builtin.debug:
        msg:
          - "Conditional Access Configuration Complete"
          - "Custom policies created: {{ (ca_policies_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Baseline policies deployed: {{ (baseline_policies_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Named locations configured: {{ (named_locations_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Audit logging enabled: {{ azure_ca_enable_diagnostics | default(true) }}"
      when: azure_ca_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_conditional_access | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_conditional_access_preflight_passed | bool
          - fe_azure_azure_conditional_access_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_conditional_access: postflight validation failed - preflight passed
          ={{ fe_azure_azure_conditional_access_preflight_passed | default(false) }},
          status={{ fe_azure_azure_conditional_access_status | default('unknown') }}.
        success_msg: "azure/azure_conditional_access: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_conditional_access | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_conditional_access_postflight_passed: true
        fe_azure_azure_conditional_access_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_conditional_access | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_conditional_access_status: "failed"
        fe_azure_azure_conditional_access_postflight_passed: false
        fe_azure_azure_conditional_access_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_conditional_access_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_conditional_access | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_conditional_access: FAILED at '{{ fe_azure_azure_conditional_access_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_conditional_access_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_conditional_access | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_conditional_access failed at '{{ fe_azure_azure_conditional_access_failed_task }}': {{ fe_azure_azure_conditional_access_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_conditional_access | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_conditional_access_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_conditional_access_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_conditional_access_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_conditional_access | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_conditional_access":
              component: "azure/azure_conditional_access"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_conditional_access_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_conditional_access_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_conditional_access_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_conditional_access_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_conditional_access_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_conditional_access_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_conditional_access_failed_task | default('') }}"
              error: "{{ fe_azure_azure_conditional_access_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_conditional_access_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_conditional_access_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_conditional_access_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_conditional_access_status | default('') == 'succeeded' else ['azure/azure_conditional_access'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_conditional_access | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_conditional_access_stats_published: true
      tags:
        - always
