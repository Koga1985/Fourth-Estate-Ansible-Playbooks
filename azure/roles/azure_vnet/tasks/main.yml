---
# tasks file for azure_vnet - Azure Virtual Networks
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_vnet']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_vnet_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_vnet | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_vnet_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_vnet_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_vnet_status: "running"
    fe_azure_azure_vnet_preflight_passed: false
    fe_azure_azure_vnet_postflight_passed: false
    fe_azure_azure_vnet_failed_task: ""
    fe_azure_azure_vnet_error: ""
    fe_azure_azure_vnet_stats_published: false
  tags:
    - always

- name: "azure/azure_vnet | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_vnet | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_vnet: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_vnet: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_vnet | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_vnet: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_vnet: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_vnet_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_vnet | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_vnet_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate network configuration
      ansible.builtin.assert:
        that:
          - azure_resource_group is defined
          - azure_region is defined
          - azure_vnets is defined or (azure_vnet_name is defined and azure_vnet_address_prefixes is defined)
        fail_msg: "Virtual network configuration required"

    - name: Create Azure Virtual Networks
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ azure_resource_group }}"
        name: "{{ item.name }}"
        location: "{{ item.location | default(azure_region) }}"
        address_prefixes_cidr: "{{ item.address_prefixes }}"
        dns_servers: "{{ item.dns_servers | default(omit) }}"
        tags: "{{ azure_resource_tags | combine(item.tags | default({})) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_vnets | default([{'name': azure_vnet_name, 'address_prefixes': azure_vnet_address_prefixes}]) }}"
      register: vnet_result
      notify: Log network changes

    - name: Enable DDoS protection for VNets
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Network
        resource_type: ddosProtectionPlans
        resource_name: "{{ azure_ddos_plan_name | default('ddos-plan-prod') }}"
        api_version: "2023-05-01"
        body:
          location: "{{ azure_region }}"
          properties: {}
          tags: "{{ azure_resource_tags }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_vnet_enable_ddos_protection | default(true)
      register: ddos_plan_result
      notify: Log network changes

    - name: Link DDoS protection to VNets
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ azure_resource_group }}"
        name: "{{ item.name }}"
        location: "{{ item.location | default(azure_region) }}"
        address_prefixes_cidr: "{{ item.address_prefixes }}"
        ddos_protection_plan:
          id: "{{ ddos_plan_result.response.id }}"
          enabled: true
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_vnets | default([{'name': azure_vnet_name, 'address_prefixes': azure_vnet_address_prefixes}]) }}"
      when:
        - azure_vnet_enable_ddos_protection | default(true)
        - ddos_plan_result is defined
      register: ddos_link_result
      notify: Log network changes

    - name: Create VNet peerings
      azure.azcollection.azure_rm_virtualnetworkpeering:
        resource_group: "{{ item.0.resource_group | default(azure_resource_group) }}"
        virtual_network: "{{ item.0.name }}"
        name: "peer-{{ item.0.name }}-to-{{ item.1.name }}"
        remote_virtual_network:
          resource_group: "{{ item.1.resource_group | default(azure_resource_group) }}"
          name: "{{ item.1.name }}"
        allow_virtual_network_access: "{{ item.1.allow_vnet_access | default(true) }}"
        allow_forwarded_traffic: "{{ item.1.allow_forwarded_traffic | default(true) }}"
        allow_gateway_transit: "{{ item.1.allow_gateway_transit | default(false) }}"
        use_remote_gateways: "{{ item.1.use_remote_gateways | default(false) }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_vnets | subelements('peerings', skip_missing=True) }}"
      when: azure_vnet_configure_peering | default(false)
      register: peering_result
      notify: Log network changes

    - name: Enable VNet flow logs
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_network_watcher_rg | default('NetworkWatcherRG') }}"
        provider: Microsoft.Network
        resource_type: networkWatchers/flowLogs
        resource_name: "NetworkWatcher_{{ azure_region }}/{{ item.name }}-flowlog"
        api_version: "2023-05-01"
        body:
          location: "{{ azure_region }}"
          properties:
            targetResourceId: "{{ item.id }}"
            storageId: "{{ azure_flow_logs_storage_account_id }}"
            enabled: true
            retentionPolicy:
              days: "{{ azure_flow_logs_retention_days | default(90) }}"
              enabled: true
            format:
              type: JSON
              version: 2
            flowAnalyticsConfiguration:
              networkWatcherFlowAnalyticsConfiguration:
                enabled: true
                workspaceId: "{{ azure_log_analytics_workspace_id }}"
                workspaceRegion: "{{ azure_region }}"
                workspaceResourceId: "{{ azure_log_analytics_workspace_resource_id }}"
                trafficAnalyticsInterval: 10
          tags: "{{ azure_resource_tags }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ vnet_result.results | default([]) }}"
      when:
        - azure_vnet_enable_flow_logs | default(true)
        - item.state is defined
      register: flow_logs_result
      notify: Log network changes

    - name: Configure VNet diagnostic settings
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: "{{ item.name }}-diagnostics"
        resource_uri: "{{ item.id }}"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        logs:
          - category: VMProtectionAlerts
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        metrics:
          - category: AllMetrics
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ vnet_result.results | default([]) }}"
      when:
        - azure_vnet_enable_diagnostics | default(true)
        - item.state is defined
      register: vnet_diagnostics_result
      notify: Log network changes

    - name: Display VNet configuration summary
      ansible.builtin.debug:
        msg:
          - "Virtual Network Configuration Complete"
          - "VNets created: {{ (vnet_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "DDoS protection enabled: {{ azure_vnet_enable_ddos_protection | default(true) }}"
          - "Peerings configured: {{ (peering_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Flow logs enabled: {{ azure_vnet_enable_flow_logs | default(true) }}"
      when: azure_vnet_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_vnet | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_vnet_preflight_passed | bool
          - fe_azure_azure_vnet_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_vnet: postflight validation failed - preflight passed
          ={{ fe_azure_azure_vnet_preflight_passed | default(false) }},
          status={{ fe_azure_azure_vnet_status | default('unknown') }}.
        success_msg: "azure/azure_vnet: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_vnet | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_vnet_postflight_passed: true
        fe_azure_azure_vnet_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_vnet | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_vnet_status: "failed"
        fe_azure_azure_vnet_postflight_passed: false
        fe_azure_azure_vnet_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_vnet_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_vnet | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_vnet: FAILED at '{{ fe_azure_azure_vnet_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_vnet_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_vnet | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_vnet failed at '{{ fe_azure_azure_vnet_failed_task }}': {{ fe_azure_azure_vnet_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_vnet | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_vnet_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_vnet_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_vnet_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_vnet | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_vnet":
              component: "azure/azure_vnet"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_vnet_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_vnet_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_vnet_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_vnet_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_vnet_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_vnet_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_vnet_failed_task | default('') }}"
              error: "{{ fe_azure_azure_vnet_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_vnet_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_vnet_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_vnet_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_vnet_status | default('') == 'succeeded' else ['azure/azure_vnet'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_vnet | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_vnet_stats_published: true
      tags:
        - always
