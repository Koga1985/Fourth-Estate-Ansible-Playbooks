---
# tasks file for azure_subnets - Azure Subnets
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_subnets']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_subnets_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_subnets | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_subnets_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_subnets_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_subnets_status: "running"
    fe_azure_azure_subnets_preflight_passed: false
    fe_azure_azure_subnets_postflight_passed: false
    fe_azure_azure_subnets_failed_task: ""
    fe_azure_azure_subnets_error: ""
    fe_azure_azure_subnets_stats_published: false
  tags:
    - always

- name: "azure/azure_subnets | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_subnets | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_subnets: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_subnets: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_subnets | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_subnets: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_subnets: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_subnets_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_subnets | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_subnets_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate subnet configuration
      ansible.builtin.assert:
        that:
          - azure_resource_group is defined
          - azure_vnet_name is defined
          - azure_subnets is defined
        fail_msg: "Subnet configuration required"

    - name: Create Azure Subnets
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ azure_resource_group }}"
        virtual_network_name: "{{ azure_vnet_name }}"
        name: "{{ item.name }}"
        address_prefix_cidr: "{{ item.address_prefix }}"
        service_endpoints: "{{ item.service_endpoints | default(azure_subnet_default_service_endpoints) }}"
        private_endpoint_network_policies: "{{ item.private_endpoint_network_policies | default(azure_subnet_private_endpoint_network_policies) }}"
        private_link_service_network_policies: "{{ item.private_link_service_network_policies | default('Disabled') }}"
        route_table: "{{ item.route_table | default(omit) }}"
        security_group: "{{ item.security_group | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_subnets }}"
      register: subnet_result
      notify: Log subnet changes

    - name: Configure subnet delegations
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Network
        resource_type: virtualNetworks/subnets
        resource_name: "{{ azure_vnet_name }}/{{ item.0.name }}"
        api_version: "2023-05-01"
        body:
          properties:
            addressPrefix: "{{ item.0.address_prefix }}"
            delegations:
              - name: "{{ item.1.name }}"
                properties:
                  serviceName: "{{ item.1.service_name }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_subnets | subelements('delegations', skip_missing=True) }}"
      when: item.0.delegations is defined
      register: delegation_result
      notify: Log subnet changes

    - name: Configure NAT Gateway for subnets
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Network
        resource_type: natGateways
        resource_name: "{{ item.nat_gateway_name }}"
        api_version: "2023-05-01"
        body:
          location: "{{ azure_region }}"
          sku:
            name: Standard
          properties:
            idleTimeoutInMinutes: "{{ item.nat_gateway_idle_timeout | default(10) }}"
          tags: "{{ azure_resource_tags }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_subnets }}"
      when:
        - item.enable_nat_gateway | default(false)
        - item.nat_gateway_name is defined
      register: nat_gateway_result
      notify: Log subnet changes

    - name: Associate NAT Gateway with subnets
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Network
        resource_type: virtualNetworks/subnets
        resource_name: "{{ azure_vnet_name }}/{{ item.name }}"
        api_version: "2023-05-01"
        body:
          properties:
            addressPrefix: "{{ item.address_prefix }}"
            natGateway:
              id: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Network/natGateways/{{ item.nat_gateway_name }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_subnets }}"
      when:
        - item.enable_nat_gateway | default(false)
        - nat_gateway_result is defined
      register: nat_assoc_result
      notify: Log subnet changes

    - name: Configure subnet diagnostic settings
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: "{{ item.name }}-diagnostics"
        resource_uri: "/subscriptions/{{ azure_subscription_id }}/resourceGroups/{{ azure_resource_group }}/providers/Microsoft.Network/virtualNetworks/{{ azure_vnet_name }}/subnets/{{ item.name }}"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        metrics:
          - category: AllMetrics
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_subnets }}"
      when: azure_subnet_enable_diagnostics | default(true)
      register: subnet_diagnostics_result
      notify: Log subnet changes

    - name: Display subnet configuration summary
      ansible.builtin.debug:
        msg:
          - "Subnet Configuration Complete"
          - "Subnets created: {{ (subnet_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Service endpoints enabled: {{ azure_subnet_default_service_endpoints | join(', ') }}"
          - "Private endpoints enabled: {{ azure_subnet_enable_private_endpoints }}"
      when: azure_subnet_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_subnets | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_subnets_preflight_passed | bool
          - fe_azure_azure_subnets_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_subnets: postflight validation failed - preflight passed
          ={{ fe_azure_azure_subnets_preflight_passed | default(false) }},
          status={{ fe_azure_azure_subnets_status | default('unknown') }}.
        success_msg: "azure/azure_subnets: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_subnets | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_subnets_postflight_passed: true
        fe_azure_azure_subnets_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_subnets | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_subnets_status: "failed"
        fe_azure_azure_subnets_postflight_passed: false
        fe_azure_azure_subnets_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_subnets_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_subnets | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_subnets: FAILED at '{{ fe_azure_azure_subnets_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_subnets_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_subnets | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_subnets failed at '{{ fe_azure_azure_subnets_failed_task }}': {{ fe_azure_azure_subnets_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_subnets | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_subnets_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_subnets_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_subnets_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_subnets | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_subnets":
              component: "azure/azure_subnets"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_subnets_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_subnets_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_subnets_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_subnets_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_subnets_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_subnets_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_subnets_failed_task | default('') }}"
              error: "{{ fe_azure_azure_subnets_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_subnets_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_subnets_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_subnets_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_subnets_status | default('') == 'succeeded' else ['azure/azure_subnets'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_subnets | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_subnets_stats_published: true
      tags:
        - always
