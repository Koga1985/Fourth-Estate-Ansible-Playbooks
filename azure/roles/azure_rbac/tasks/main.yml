---
# tasks file for azure_rbac - Azure Role-Based Access Control
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_rbac']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_rbac_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_rbac | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_rbac_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_rbac_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_rbac_status: "running"
    fe_azure_azure_rbac_preflight_passed: false
    fe_azure_azure_rbac_postflight_passed: false
    fe_azure_azure_rbac_failed_task: ""
    fe_azure_azure_rbac_error: ""
    fe_azure_azure_rbac_stats_published: false
  tags:
    - always

- name: "azure/azure_rbac | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_rbac | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_rbac: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_rbac: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_rbac | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_rbac: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_rbac: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_rbac_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_rbac | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_rbac_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate RBAC configuration
      ansible.builtin.assert:
        that:
          - azure_subscription_id is defined
          - azure_tenant_id is defined
        fail_msg: "Azure subscription and tenant required for RBAC"

    - name: Create custom RBAC roles
      azure.azcollection.azure_rm_roledefinition:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        scope: "{{ item.scope | default('/subscriptions/' + azure_subscription_id) }}"
        permissions:
          - actions: "{{ item.actions }}"
            not_actions: "{{ item.not_actions | default([]) }}"
            data_actions: "{{ item.data_actions | default([]) }}"
            not_data_actions: "{{ item.not_data_actions | default([]) }}"
        assignable_scopes: "{{ item.assignable_scopes | default(['/subscriptions/' + azure_subscription_id]) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_custom_roles }}"
      when: azure_rbac_custom_roles is defined
      register: custom_roles_result
      notify: Log RBAC changes

    - name: Assign built-in roles to users
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ item.scope | default('/subscriptions/' + azure_subscription_id) }}"
        assignee_object_id: "{{ item.assignee_object_id }}"
        role_definition_name: "{{ item.role_name }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_user_assignments }}"
      when: azure_rbac_user_assignments is defined
      register: user_assignments_result
      notify: Log RBAC changes

    - name: Assign roles to groups
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ item.scope | default('/subscriptions/' + azure_subscription_id) }}"
        assignee_object_id: "{{ item.group_object_id }}"
        role_definition_name: "{{ item.role_name }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_group_assignments }}"
      when: azure_rbac_group_assignments is defined
      register: group_assignments_result
      notify: Log RBAC changes

    - name: Assign roles to service principals
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ item.scope | default('/subscriptions/' + azure_subscription_id) }}"
        assignee_object_id: "{{ item.sp_object_id }}"
        role_definition_name: "{{ item.role_name }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_sp_assignments }}"
      when: azure_rbac_sp_assignments is defined
      register: sp_assignments_result
      notify: Log RBAC changes

    - name: Configure Privileged Identity Management (PIM)
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Authorization
        resource_type: roleAssignmentScheduleRequests
        api_version: "2020-10-01"
        body:
          properties:
            principalId: "{{ item.principal_id }}"
            roleDefinitionId: "{{ item.role_definition_id }}"
            requestType: AdminAssign
            scheduleInfo:
              startDateTime: "{{ item.start_datetime | default(ansible_date_time.iso8601) }}"
              expiration:
                type: "{{ item.expiration_type | default('AfterDuration') }}"
                duration: "{{ item.duration | default('PT8H') }}"
            justification: "{{ item.justification }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_pim_assignments }}"
      when:
        - azure_rbac_pim_assignments is defined
        - azure_rbac_enable_pim | default(true)
      register: pim_result
      notify: Log RBAC changes

    - name: Deny assignments for least privilege
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Authorization
        resource_type: denyAssignments
        resource_name: "{{ item.name }}"
        api_version: "2022-01-01-preview"
        body:
          properties:
            principalId: "{{ item.principal_id }}"
            permissions:
              - actions: "{{ item.denied_actions }}"
            scope: "{{ item.scope | default('/subscriptions/' + azure_subscription_id) }}"
            condition: "{{ item.condition | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_rbac_deny_assignments }}"
      when: azure_rbac_deny_assignments is defined
      register: deny_assignments_result
      notify: Log RBAC changes

    - name: Configure RBAC audit logging
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: rbac-audit-diagnostics
        resource_uri: "/subscriptions/{{ azure_subscription_id }}"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        logs:
          - category: Administrative
            enabled: true
            retention_policy:
              enabled: true
              days: 365
          - category: Policy
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_rbac_enable_audit_logging | default(true)
      register: audit_result
      notify: Log RBAC changes

    - name: Create RBAC compliance report
      ansible.builtin.template:
        src: rbac_compliance_report.j2
        dest: "{{ azure_rbac_report_path | default('/tmp/rbac_compliance_report.json') }}"
        mode: '0600'
      when: azure_rbac_generate_report | default(true)
      delegate_to: localhost

    - name: Display RBAC configuration summary
      ansible.builtin.debug:
        msg:
          - "RBAC Configuration Complete"
          - "Custom roles created: {{ (custom_roles_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "User assignments: {{ (user_assignments_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Group assignments: {{ (group_assignments_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Service principal assignments: {{ (sp_assignments_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "PIM enabled: {{ azure_rbac_enable_pim | default(true) }}"
      when: azure_rbac_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_rbac | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_rbac_preflight_passed | bool
          - fe_azure_azure_rbac_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_rbac: postflight validation failed - preflight passed
          ={{ fe_azure_azure_rbac_preflight_passed | default(false) }},
          status={{ fe_azure_azure_rbac_status | default('unknown') }}.
        success_msg: "azure/azure_rbac: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_rbac | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_rbac_postflight_passed: true
        fe_azure_azure_rbac_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_rbac | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_rbac_status: "failed"
        fe_azure_azure_rbac_postflight_passed: false
        fe_azure_azure_rbac_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_rbac_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_rbac | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_rbac: FAILED at '{{ fe_azure_azure_rbac_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_rbac_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_rbac | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_rbac failed at '{{ fe_azure_azure_rbac_failed_task }}': {{ fe_azure_azure_rbac_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_rbac | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_rbac_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_rbac_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_rbac_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_rbac | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_rbac":
              component: "azure/azure_rbac"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_rbac_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_rbac_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_rbac_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_rbac_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_rbac_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_rbac_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_rbac_failed_task | default('') }}"
              error: "{{ fe_azure_azure_rbac_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_rbac_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_rbac_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_rbac_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_rbac_status | default('') == 'succeeded' else ['azure/azure_rbac'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_rbac | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_rbac_stats_published: true
      tags:
        - always
