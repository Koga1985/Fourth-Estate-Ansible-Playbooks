---
# tasks file for azure_ad_mfa - Azure AD Multi-Factor Authentication
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_ad_mfa']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_ad_mfa_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_ad_mfa | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_ad_mfa_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_ad_mfa_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_ad_mfa_status: "running"
    fe_azure_azure_ad_mfa_preflight_passed: false
    fe_azure_azure_ad_mfa_postflight_passed: false
    fe_azure_azure_ad_mfa_failed_task: ""
    fe_azure_azure_ad_mfa_error: ""
    fe_azure_azure_ad_mfa_stats_published: false
  tags:
    - always

- name: "azure/azure_ad_mfa | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_ad_mfa | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_ad_mfa: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_ad_mfa: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_ad_mfa | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_ad_mfa: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_ad_mfa: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_ad_mfa_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_ad_mfa | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_ad_mfa_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate MFA configuration
      ansible.builtin.assert:
        that:
          - azure_tenant_id is defined
          - azure_cloud_environment is defined
        fail_msg: "Azure tenant configuration required for MFA setup"

    - name: Enable Azure AD MFA service settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: policies/authenticationMethodsPolicy
        api_version: "v1.0"
        body:
          registrationEnforcement:
            authenticationMethodsRegistrationCampaign:
              snoozeDurationInDays: 0
              state: enabled
              includeTargets:
                - id: all_users
                  targetType: group
                  targetedAuthenticationMethod: microsoftAuthenticator
          authenticationMethodConfigurations: "{{ azure_mfa_method_configurations }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_enable_service | default(true)
      register: mfa_service_result
      notify: Log MFA changes

    - name: Configure Microsoft Authenticator settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: policies/authenticationMethodsPolicy/authenticationMethodConfigurations/microsoftAuthenticator
        api_version: "v1.0"
        body:
          state: enabled
          featureSettings:
            displayAppInformationRequiredState:
              state: "{{ azure_mfa_display_app_info | default('enabled') }}"
              includeTarget:
                targetType: group
                id: all_users
            displayLocationInformationRequiredState:
              state: "{{ azure_mfa_display_location | default('enabled') }}"
              includeTarget:
                targetType: group
                id: all_users
            numberMatchingRequiredState:
              state: "{{ azure_mfa_number_matching | default('enabled') }}"
              includeTarget:
                targetType: group
                id: all_users
          includeTargets:
            - id: all_users
              targetType: group
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_configure_authenticator | default(true)
      register: authenticator_result
      notify: Log MFA changes

    - name: Configure FIDO2 security key settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: policies/authenticationMethodsPolicy/authenticationMethodConfigurations/fido2
        api_version: "v1.0"
        body:
          state: "{{ azure_mfa_fido2_enabled | default('enabled') }}"
          isSelfServiceRegistrationAllowed: "{{ azure_mfa_fido2_self_service | default(true) }}"
          isAttestationEnforced: "{{ azure_mfa_fido2_attestation | default(true) }}"
          keyRestrictions:
            isEnforced: true
            enforcementType: "{{ azure_mfa_fido2_restriction_type | default('allow') }}"
            aaGuids: "{{ azure_mfa_fido2_allowed_guids | default([]) }}"
          includeTargets:
            - id: "{{ azure_mfa_fido2_target_group | default('all_users') }}"
              targetType: group
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_enable_fido2 | default(true)
      register: fido2_result
      notify: Log MFA changes

    - name: Configure phone authentication settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: policies/authenticationMethodsPolicy/authenticationMethodConfigurations/sms
        api_version: "v1.0"
        body:
          state: "{{ azure_mfa_sms_enabled | default('disabled') }}"
          includeTargets:
            - id: "{{ azure_mfa_sms_target_group | default('none') }}"
              targetType: group
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_configure_sms | default(true)
      register: sms_result
      notify: Log MFA changes

    - name: Configure MFA registration policy
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: policies/identitySecurityDefaultsEnforcementPolicy
        api_version: "v1.0"
        body:
          isEnabled: "{{ azure_mfa_security_defaults | default(true) }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_configure_registration | default(true)
      register: registration_result
      notify: Log MFA changes

    - name: Configure per-user MFA settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: users/{{ item.user_id }}/authentication/requirements
        api_version: "beta"
        body:
          perUserMfaState: "{{ item.mfa_state | default('enforced') }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_mfa_per_user_settings }}"
      when: azure_mfa_per_user_settings is defined
      register: per_user_result
      notify: Log MFA changes

    - name: Enable MFA fraud alert
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: organization/{{ azure_tenant_id }}/settings/mfa
        api_version: "v1.0"
        body:
          fraudAlertSettings:
            state: enabled
            autoBlockEnabled: "{{ azure_mfa_fraud_auto_block | default(true) }}"
            autoReportEnabled: "{{ azure_mfa_fraud_auto_report | default(true) }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_enable_fraud_alert | default(true)
      register: fraud_alert_result
      notify: Log MFA changes

    - name: Configure MFA remember devices settings
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.Graph
        resource_type: organization/{{ azure_tenant_id }}/settings/mfa
        api_version: "v1.0"
        body:
          rememberDevicesSettings:
            state: "{{ azure_mfa_remember_devices | default('disabled') }}"
            daysToRemember: "{{ azure_mfa_remember_days | default(0) }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_configure_remember | default(false)
      register: remember_result
      notify: Log MFA changes

    - name: Enable MFA audit logging
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: mfa-diagnostics
        resource_uri: "/providers/Microsoft.AADIAM/mfa"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        logs:
          - category: MFALogs
            enabled: true
            retention_policy:
              enabled: true
              days: 365
          - category: UserAuthenticationLogs
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      when: azure_mfa_enable_diagnostics | default(true)
      register: mfa_diagnostics_result
      notify: Log MFA changes

    - name: Display MFA configuration summary
      ansible.builtin.debug:
        msg:
          - "MFA Configuration Complete"
          - "MFA service enabled: {{ azure_mfa_enable_service | default(true) }}"
          - "Microsoft Authenticator configured: {{ azure_mfa_configure_authenticator | default(true) }}"
          - "FIDO2 enabled: {{ azure_mfa_enable_fido2 | default(true) }}"
          - "SMS authentication: {{ azure_mfa_sms_enabled | default('disabled') }}"
          - "Fraud alert enabled: {{ azure_mfa_enable_fraud_alert | default(true) }}"
          - "Number matching: {{ azure_mfa_number_matching | default('enabled') }}"
      when: azure_mfa_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_ad_mfa | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_ad_mfa_preflight_passed | bool
          - fe_azure_azure_ad_mfa_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_ad_mfa: postflight validation failed - preflight passed
          ={{ fe_azure_azure_ad_mfa_preflight_passed | default(false) }},
          status={{ fe_azure_azure_ad_mfa_status | default('unknown') }}.
        success_msg: "azure/azure_ad_mfa: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_ad_mfa | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_ad_mfa_postflight_passed: true
        fe_azure_azure_ad_mfa_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_ad_mfa | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_ad_mfa_status: "failed"
        fe_azure_azure_ad_mfa_postflight_passed: false
        fe_azure_azure_ad_mfa_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_ad_mfa_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_ad_mfa | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_ad_mfa: FAILED at '{{ fe_azure_azure_ad_mfa_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_ad_mfa_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_ad_mfa | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_ad_mfa failed at '{{ fe_azure_azure_ad_mfa_failed_task }}': {{ fe_azure_azure_ad_mfa_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_ad_mfa | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_ad_mfa_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_ad_mfa_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_ad_mfa_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_ad_mfa | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_ad_mfa":
              component: "azure/azure_ad_mfa"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_ad_mfa_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_ad_mfa_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_ad_mfa_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_ad_mfa_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_ad_mfa_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_ad_mfa_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_ad_mfa_failed_task | default('') }}"
              error: "{{ fe_azure_azure_ad_mfa_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_ad_mfa_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_ad_mfa_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_ad_mfa_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_ad_mfa_status | default('') == 'succeeded' else ['azure/azure_ad_mfa'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_ad_mfa | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_ad_mfa_stats_published: true
      tags:
        - always
