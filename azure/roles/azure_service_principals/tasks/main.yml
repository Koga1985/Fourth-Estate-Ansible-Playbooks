---
# tasks file for azure_service_principals - Azure Service Principal Management
# Fourth Estate Azure Government Cloud - FedRAMP High

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['azure/azure_service_principals']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_azure_azure_service_principals_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "azure/azure_service_principals | Initialize validation state"
  ansible.builtin.set_fact:
    fe_azure_azure_service_principals_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_azure_azure_service_principals_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_azure_azure_service_principals_status: "running"
    fe_azure_azure_service_principals_preflight_passed: false
    fe_azure_azure_service_principals_postflight_passed: false
    fe_azure_azure_service_principals_failed_task: ""
    fe_azure_azure_service_principals_error: ""
    fe_azure_azure_service_principals_stats_published: false
  tags:
    - always

- name: "azure/azure_service_principals | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "azure/azure_service_principals | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          azure/azure_service_principals: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          azure/azure_service_principals: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_service_principals | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "azure/azure_service_principals: required variable '{{ item }}' is not defined."
        success_msg: "azure/azure_service_principals: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_azure_azure_service_principals_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "azure/azure_service_principals | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_azure_azure_service_principals_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Azure Government Cloud configuration
      ansible.builtin.assert:
        that:
          - azure_cloud_environment is defined
          - azure_tenant_id is defined
        fail_msg: "Azure configuration required for Fourth Estate deployments"

    - name: Create Azure AD Application Registration
      azure.azcollection.azure_rm_adapplication:
        tenant: "{{ azure_tenant_id }}"
        display_name: "{{ item.display_name }}"
        identifier_uris: "{{ item.identifier_uris | default(omit) }}"
        homepage: "{{ item.homepage | default(omit) }}"
        reply_urls: "{{ item.reply_urls | default(omit) }}"
        available_to_other_tenants: "{{ item.available_to_other_tenants | default(false) }}"
        required_resource_accesses: "{{ item.required_resource_accesses | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when: azure_service_principals is defined
      register: app_registration_result
      notify: Log service principal changes

    - name: Create Service Principal for Application
      azure.azcollection.azure_rm_adserviceprincipal:
        tenant: "{{ azure_tenant_id }}"
        app_id: "{{ item.app_id | default(item.display_name) }}"
        state: "{{ item.state | default('present') }}"
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when: azure_service_principals is defined
      register: sp_result
      notify: Log service principal changes

    - name: Assign RBAC roles to service principals
      azure.azcollection.azure_rm_roleassignment:
        scope: "{{ item.0.scope | default('/subscriptions/' + azure_subscription_id) }}"
        assignee_object_id: "{{ item.0.object_id }}"
        role_definition_id: "{{ item.1 }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals | subelements('role_assignments', skip_missing=True) }}"
      when: azure_service_principals is defined
      register: sp_rbac_result
      notify: Log service principal changes

    - name: Create service principal credentials (certificate-based)
      azure.azcollection.azure_rm_adserviceprincipalcredential:
        tenant: "{{ azure_tenant_id }}"
        service_principal_object_id: "{{ item.object_id }}"
        value: "{{ item.certificate_value }}"
        end_date: "{{ item.end_date }}"
        type: AsymmetricX509Cert
        usage: Verify
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when:
        - azure_service_principals is defined
        - item.use_certificate | default(true)
        - item.certificate_value is defined
      no_log: true
      register: sp_cert_result
      notify: Log service principal changes

    - name: Configure managed identity for service principals
      azure.azcollection.azure_rm_resource:
        resource_group: "{{ azure_resource_group }}"
        provider: Microsoft.ManagedIdentity
        resource_type: userAssignedIdentities
        resource_name: "{{ item.managed_identity_name }}"
        api_version: "2023-01-31"
        body:
          location: "{{ azure_region }}"
          tags: "{{ azure_resource_tags }}"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when:
        - azure_service_principals is defined
        - item.use_managed_identity | default(false)
      register: managed_identity_result
      notify: Log service principal changes

    - name: Store service principal credentials in Key Vault
      azure.azcollection.azure_rm_keyvaultsecret:
        vault_uri: "{{ azure_key_vault_uri }}"
        secret_name: "sp-{{ item.display_name | lower | regex_replace('[^a-z0-9-]', '-') }}"
        secret_value: "{{ item.client_secret }}"
        content_type: "application/json"
        tags:
          ServicePrincipal: "{{ item.display_name }}"
          ManagedBy: "Ansible"
          Classification: "SECRET"
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when:
        - azure_service_principals is defined
        - item.client_secret is defined
        - azure_store_credentials_in_keyvault | default(true)
      no_log: true
      register: keyvault_secret_result
      notify: Log service principal changes

    - name: Configure service principal audit logging
      azure.azcollection.azure_rm_monitordiagnosticsetting:
        name: "sp-diagnostics-{{ item.display_name }}"
        resource_uri: "/providers/Microsoft.AADIAM/servicePrincipals/{{ item.object_id }}"
        workspace_id: "{{ azure_log_analytics_workspace_id }}"
        logs:
          - category: ServicePrincipalSignInLogs
            enabled: true
            retention_policy:
              enabled: true
              days: 365
        state: present
        cloud_environment: "{{ azure_cloud_environment }}"
      loop: "{{ azure_service_principals }}"
      when:
        - azure_service_principals is defined
        - azure_sp_enable_diagnostics | default(true)
      register: sp_diagnostics_result
      notify: Log service principal changes

    - name: Display service principal summary
      ansible.builtin.debug:
        msg:
          - "Service Principal Configuration Complete"
          - "Applications created: {{ (app_registration_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Service principals created: {{ (sp_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
          - "Certificate-based authentication: {{ azure_service_principals | selectattr('use_certificate', 'defined') | selectattr('use_certificate', 'equalto', true) | list | length }}"
          - "Managed identities configured: {{ (managed_identity_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length) }}"
      when: azure_sp_display_summary | default(true)

    # ----------------------------- postflight -------------------

    - name: "azure/azure_service_principals | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_azure_azure_service_principals_preflight_passed | bool
          - fe_azure_azure_service_principals_status in ['running', 'succeeded']
        fail_msg: >-
          azure/azure_service_principals: postflight validation failed - preflight passed
          ={{ fe_azure_azure_service_principals_preflight_passed | default(false) }},
          status={{ fe_azure_azure_service_principals_status | default('unknown') }}.
        success_msg: "azure/azure_service_principals: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "azure/azure_service_principals | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_azure_azure_service_principals_postflight_passed: true
        fe_azure_azure_service_principals_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "azure/azure_service_principals | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_azure_azure_service_principals_status: "failed"
        fe_azure_azure_service_principals_postflight_passed: false
        fe_azure_azure_service_principals_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_azure_azure_service_principals_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "azure/azure_service_principals | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          azure/azure_service_principals: FAILED at '{{ fe_azure_azure_service_principals_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_azure_azure_service_principals_error }}
      tags:
        - always
        - rescue

    - name: "azure/azure_service_principals | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          azure/azure_service_principals failed at '{{ fe_azure_azure_service_principals_failed_task }}': {{ fe_azure_azure_service_principals_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "azure/azure_service_principals | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_azure_azure_service_principals_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_azure_azure_service_principals_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_azure_azure_service_principals_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "azure/azure_service_principals | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "azure/azure_service_principals":
              component: "azure/azure_service_principals"
              type: "role"
              platform: "azure"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_azure_azure_service_principals_status | default('unknown') }}"
              preflight_passed: "{{ fe_azure_azure_service_principals_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_azure_azure_service_principals_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_azure_azure_service_principals_started_at | default('') }}"
              ended_at: "{{ fe_azure_azure_service_principals_ended_at | default('') }}"
              duration_seconds: "{{ fe_azure_azure_service_principals_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_azure_azure_service_principals_failed_task | default('') }}"
              error: "{{ fe_azure_azure_service_principals_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_azure_azure_service_principals_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_azure_azure_service_principals_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_azure_azure_service_principals_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_azure_azure_service_principals_status | default('') == 'succeeded' else ['azure/azure_service_principals'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "azure/azure_service_principals | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_azure_azure_service_principals_stats_published: true
      tags:
        - always
