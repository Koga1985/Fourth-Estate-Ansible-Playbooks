---
# Consolidated collection requirements for the Fourth Estate execution
# environment (EE). This is the union of every platform's requirements.yml,
# merged to the highest declared version floor, so one EE image can run any
# playbook in this repository.
#
# Regenerate the exact-version lock file (requirements-lock.yml) on a
# machine with Galaxy access: see generate-lock.sh. Build the image with
# build.sh, which prefers the lock file when it exists.

# automation-hub-only: ansible.controller ansible.hub
#
# The marker above follows the repo convention read by
# scripts/generate_online_baseline.sh: ansible.controller and ansible.hub
# have no stable release on community Galaxy (certified builds ship only
# from Red Hat Automation Hub). Building this EE against Galaxy alone will
# fail to resolve them -- either configure your Automation Hub server and
# token in ansible.cfg before building, or comment those two entries out if
# you do not manage AAP itself from this EE.

collections:
