---
# tasks file for apache_web_server_srg

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['app_web_server/apache_web_server_srg']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_app_web_server_apache_web_server_srg_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "app_web_server/apache_web_server_srg | Initialize validation state"
  ansible.builtin.set_fact:
    fe_app_web_server_apache_web_server_srg_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_app_web_server_apache_web_server_srg_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_app_web_server_apache_web_server_srg_status: "running"
    fe_app_web_server_apache_web_server_srg_preflight_passed: false
    fe_app_web_server_apache_web_server_srg_postflight_passed: false
    fe_app_web_server_apache_web_server_srg_failed_task: ""
    fe_app_web_server_apache_web_server_srg_error: ""
    fe_app_web_server_apache_web_server_srg_stats_published: false
  tags:
    - always

- name: "app_web_server/apache_web_server_srg | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "app_web_server/apache_web_server_srg | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          app_web_server/apache_web_server_srg: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          app_web_server/apache_web_server_srg: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/apache_web_server_srg | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "app_web_server/apache_web_server_srg: required variable '{{ item }}' is not defined."
        success_msg: "app_web_server/apache_web_server_srg: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_app_web_server_apache_web_server_srg_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/apache_web_server_srg | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists on control node
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: [always]

    - name: Show run mode
      ansible.builtin.debug:
        msg: >-
          apache_web_server_srg on {{ inventory_hostname }} -
          {{ 'ENFORCING' if apply_changes | bool else 'DRY-RUN / check mode only' }}
      tags: [always]

    - name: Apply Web Server SRG hardening
      ansible.builtin.import_tasks: hardening.yml
      when: stig_apache_hardening | bool
      tags: [stig, apache]

    - name: Compliance report
      ansible.builtin.import_tasks: compliance_report.yml
      when: stig_compliance_report | bool
      tags: [stig, report]

    # ----------------------------- postflight -------------------

    - name: "app_web_server/apache_web_server_srg | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_app_web_server_apache_web_server_srg_preflight_passed | bool
          - fe_app_web_server_apache_web_server_srg_status in ['running', 'succeeded']
        fail_msg: >-
          app_web_server/apache_web_server_srg: postflight validation failed - preflight passed
          ={{ fe_app_web_server_apache_web_server_srg_preflight_passed | default(false) }},
          status={{ fe_app_web_server_apache_web_server_srg_status | default('unknown') }}.
        success_msg: "app_web_server/apache_web_server_srg: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "app_web_server/apache_web_server_srg | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_postflight_passed: true
        fe_app_web_server_apache_web_server_srg_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "app_web_server/apache_web_server_srg | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_status: "failed"
        fe_app_web_server_apache_web_server_srg_postflight_passed: false
        fe_app_web_server_apache_web_server_srg_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_app_web_server_apache_web_server_srg_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "app_web_server/apache_web_server_srg | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          app_web_server/apache_web_server_srg: FAILED at '{{ fe_app_web_server_apache_web_server_srg_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_app_web_server_apache_web_server_srg_error }}
      tags:
        - always
        - rescue

    - name: "app_web_server/apache_web_server_srg | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          app_web_server/apache_web_server_srg failed at '{{ fe_app_web_server_apache_web_server_srg_failed_task }}': {{ fe_app_web_server_apache_web_server_srg_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "app_web_server/apache_web_server_srg | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_app_web_server_apache_web_server_srg_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_app_web_server_apache_web_server_srg_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "app_web_server/apache_web_server_srg | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "app_web_server/apache_web_server_srg":
              component: "app_web_server/apache_web_server_srg"
              type: "role"
              platform: "app_web_server"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_app_web_server_apache_web_server_srg_status | default('unknown') }}"
              preflight_passed: "{{ fe_app_web_server_apache_web_server_srg_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_app_web_server_apache_web_server_srg_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_app_web_server_apache_web_server_srg_started_at | default('') }}"
              ended_at: "{{ fe_app_web_server_apache_web_server_srg_ended_at | default('') }}"
              duration_seconds: "{{ fe_app_web_server_apache_web_server_srg_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_app_web_server_apache_web_server_srg_failed_task | default('') }}"
              error: "{{ fe_app_web_server_apache_web_server_srg_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_app_web_server_apache_web_server_srg_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_app_web_server_apache_web_server_srg_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_app_web_server_apache_web_server_srg_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_app_web_server_apache_web_server_srg_status | default('') == 'succeeded' else ['app_web_server/apache_web_server_srg'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "app_web_server/apache_web_server_srg | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_stats_published: true
      tags:
        - always
