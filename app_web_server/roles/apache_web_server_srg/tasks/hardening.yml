---
# Apache Web Server SRG hardening
# NIST AC-10, AU-3, CM-6, CM-7, SC-8, SC-23

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['app_web_server/apache_web_server_srg/hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_app_web_server_apache_web_server_srg_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "app_web_server/apache_web_server_srg/hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_app_web_server_apache_web_server_srg_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_app_web_server_apache_web_server_srg_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_app_web_server_apache_web_server_srg_hardening_status: "running"
    fe_app_web_server_apache_web_server_srg_hardening_preflight_passed: false
    fe_app_web_server_apache_web_server_srg_hardening_postflight_passed: false
    fe_app_web_server_apache_web_server_srg_hardening_failed_task: ""
    fe_app_web_server_apache_web_server_srg_hardening_error: ""
    fe_app_web_server_apache_web_server_srg_hardening_stats_published: false
  tags:
    - always

- name: "app_web_server/apache_web_server_srg/hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "app_web_server/apache_web_server_srg/hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          app_web_server/apache_web_server_srg/hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          app_web_server/apache_web_server_srg/hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/apache_web_server_srg/hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "app_web_server/apache_web_server_srg/hardening: required variable '{{ item }}' is not defined."
        success_msg: "app_web_server/apache_web_server_srg/hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_app_web_server_apache_web_server_srg_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/apache_web_server_srg/hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: SRG-APP-000516 - Verify Apache main configuration exists
      ansible.builtin.stat:
        path: "{{ apache_main_conf }}"
      register: apache_conf_stat
      tags: [apache]

    - name: Fail early if Apache is not installed at the expected path
      ansible.builtin.assert:
        that: apache_conf_stat.stat.exists
        fail_msg: "Apache main config not found at {{ apache_main_conf }} - set apache_main_conf/apache_conf_dir for this distro."
      tags: [apache]

    - name: SRG-APP-* - Deploy SRG hardening drop-in
      ansible.builtin.template:
        src: srg_hardening.conf.j2
        dest: "{{ apache_hardening_conf }}"
        owner: root
        group: root
        mode: "0644"
        validate: "apachectl -t -f %s 2>/dev/null || /usr/sbin/httpd -t -f %s"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: apache_dropin
      notify: reload apache
      tags:
        - stig_cat2
        - "SRG-APP-000516-WSR-000174"
        - "SRG-APP-000439-WSR-000156"

    - name: SRG-APP-000211-WSR-000031 - Disable directory listing modules
      ansible.builtin.lineinfile:
        path: "{{ apache_conf_dir }}/00-srg-disable-modules.conf"
        line: "# {{ item }} disabled by Web Server SRG (load line commented in module conf)"
        create: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ apache_disable_modules }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: apache_modules_marker
      tags: [stig_cat2, "SRG-APP-000211-WSR-000031"]

    - name: SRG-APP-000211-WSR-000031 - Comment out disabled LoadModule lines
      ansible.builtin.replace:
        path: "{{ apache_conf_dir }}/{{ item }}"
        regexp: '^(LoadModule\s+(?:{{ apache_disable_modules | join("|") }})\s+.*)$'
        replace: '#\1'
      loop:
        - autoindex.conf
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      failed_when: false
      register: apache_loadmodule
      notify: reload apache
      tags: [stig_cat2, "SRG-APP-000211-WSR-000031"]

    # ----------------------------- postflight -------------------

    - name: "app_web_server/apache_web_server_srg/hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_app_web_server_apache_web_server_srg_hardening_preflight_passed | bool
          - fe_app_web_server_apache_web_server_srg_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          app_web_server/apache_web_server_srg/hardening: postflight validation failed - preflight passed
          ={{ fe_app_web_server_apache_web_server_srg_hardening_preflight_passed | default(false) }},
          status={{ fe_app_web_server_apache_web_server_srg_hardening_status | default('unknown') }}.
        success_msg: "app_web_server/apache_web_server_srg/hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "app_web_server/apache_web_server_srg/hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_hardening_postflight_passed: true
        fe_app_web_server_apache_web_server_srg_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "app_web_server/apache_web_server_srg/hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_hardening_status: "failed"
        fe_app_web_server_apache_web_server_srg_hardening_postflight_passed: false
        fe_app_web_server_apache_web_server_srg_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_app_web_server_apache_web_server_srg_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "app_web_server/apache_web_server_srg/hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          app_web_server/apache_web_server_srg/hardening: FAILED at '{{ fe_app_web_server_apache_web_server_srg_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_app_web_server_apache_web_server_srg_hardening_error }}
      tags:
        - always
        - rescue

    - name: "app_web_server/apache_web_server_srg/hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          app_web_server/apache_web_server_srg/hardening failed at '{{ fe_app_web_server_apache_web_server_srg_hardening_failed_task }}': {{ fe_app_web_server_apache_web_server_srg_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "app_web_server/apache_web_server_srg/hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_app_web_server_apache_web_server_srg_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_app_web_server_apache_web_server_srg_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "app_web_server/apache_web_server_srg/hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "app_web_server/apache_web_server_srg/hardening":
              component: "app_web_server/apache_web_server_srg/hardening"
              type: "role-tasks"
              platform: "app_web_server"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_app_web_server_apache_web_server_srg_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_app_web_server_apache_web_server_srg_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_app_web_server_apache_web_server_srg_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_app_web_server_apache_web_server_srg_hardening_started_at | default('') }}"
              ended_at: "{{ fe_app_web_server_apache_web_server_srg_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_app_web_server_apache_web_server_srg_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_app_web_server_apache_web_server_srg_hardening_failed_task | default('') }}"
              error: "{{ fe_app_web_server_apache_web_server_srg_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_app_web_server_apache_web_server_srg_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_app_web_server_apache_web_server_srg_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_app_web_server_apache_web_server_srg_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_app_web_server_apache_web_server_srg_hardening_status | default('') == 'succeeded' else ['app_web_server/apache_web_server_srg/hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "app_web_server/apache_web_server_srg/hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_app_web_server_apache_web_server_srg_hardening_stats_published: true
      tags:
        - always
