---
# Apache Tomcat Application Server SRG hardening
# NIST AC-12, CM-6, CM-7, SC-8, SC-23, AU-3

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['app_web_server/tomcat_app_server_srg/hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_app_web_server_tomcat_app_server_srg_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "app_web_server/tomcat_app_server_srg/hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_app_web_server_tomcat_app_server_srg_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_app_web_server_tomcat_app_server_srg_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_app_web_server_tomcat_app_server_srg_hardening_status: "running"
    fe_app_web_server_tomcat_app_server_srg_hardening_preflight_passed: false
    fe_app_web_server_tomcat_app_server_srg_hardening_postflight_passed: false
    fe_app_web_server_tomcat_app_server_srg_hardening_failed_task: ""
    fe_app_web_server_tomcat_app_server_srg_hardening_error: ""
    fe_app_web_server_tomcat_app_server_srg_hardening_stats_published: false
  tags:
    - always

- name: "app_web_server/tomcat_app_server_srg/hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "app_web_server/tomcat_app_server_srg/hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          app_web_server/tomcat_app_server_srg/hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          app_web_server/tomcat_app_server_srg/hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/tomcat_app_server_srg/hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "app_web_server/tomcat_app_server_srg/hardening: required variable '{{ item }}' is not defined."
        success_msg: "app_web_server/tomcat_app_server_srg/hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "app_web_server/tomcat_app_server_srg/hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_app_web_server_tomcat_app_server_srg_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: SRG-APP-* - Confirm Tomcat server.xml exists
      ansible.builtin.stat:
        path: "{{ tomcat_server_xml }}"
      register: tomcat_server_stat
      tags: [tomcat]

    - name: Fail early if Tomcat is not at the expected path
      ansible.builtin.assert:
        that: tomcat_server_stat.stat.exists
        fail_msg: "server.xml not found at {{ tomcat_server_xml }} - set tomcat_home for this install."
      tags: [tomcat]

    - name: SRG-APP-000142-AS-000014 - Disable the Tomcat shutdown port
      community.general.xml:
        path: "{{ tomcat_server_xml }}"
        xpath: /Server
        attribute: port
        value: "-1"
      check_mode: "{{ not (apply_changes | bool) }}"
      when: tomcat_disable_shutdown_port | bool
      register: tomcat_shutdown
      notify: restart tomcat
      tags: [stig_cat2, "SRG-APP-000142-AS-000014"]

    - name: SRG-APP-000439-AS-000155 - Enforce TLS protocols on SSL connectors
      community.general.xml:
        path: "{{ tomcat_server_xml }}"
        xpath: "/Server/Service/Connector[@SSLEnabled='true']"
        attribute: sslEnabledProtocols
        value: "{{ tomcat_ssl_enabled_protocols }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      failed_when: false
      register: tomcat_tls
      notify: restart tomcat
      tags: [stig_cat2, "SRG-APP-000439-AS-000155"]

    - name: SRG-APP-000295-AS-000263 - Set default session timeout in web.xml
      community.general.xml:
        path: "{{ tomcat_web_xml }}"
        xpath: "/*[local-name()='web-app']/*[local-name()='session-config']/*[local-name()='session-timeout']"
        value: "{{ tomcat_session_timeout | string }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      failed_when: false
      register: tomcat_session
      notify: restart tomcat
      tags: [stig_cat2, "SRG-APP-000295-AS-000263"]

    - name: SRG-APP-000211-AS-000146 - Remove default/example web applications
      ansible.builtin.file:
        path: "{{ tomcat_webapps_dir }}/{{ item }}"
        state: absent
      loop: "{{ tomcat_remove_default_webapps }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      when: apply_changes | bool
      register: tomcat_webapps
      tags: [stig_cat2, "SRG-APP-000211-AS-000146"]

    - name: SRG-APP-000211-AS-000146 - Assess presence of default web applications (dry-run)
      ansible.builtin.stat:
        path: "{{ tomcat_webapps_dir }}/{{ item }}"
      loop: "{{ tomcat_remove_default_webapps }}"
      loop_control:
        label: "{{ item }}"
      register: tomcat_webapps_assess
      changed_when: false
      tags: [tomcat]

    - name: SRG-APP-000141 - Verify Tomcat is not running as root
      ansible.builtin.assert:
        that: tomcat_run_user != 'root'
        fail_msg: "Tomcat must run as a dedicated non-root account (tomcat_run_user is 'root')."
        success_msg: "Tomcat configured to run as '{{ tomcat_run_user }}'."
      tags: [tomcat, "SRG-APP-000141-AS-000095"]

    # ----------------------------- postflight -------------------

    - name: "app_web_server/tomcat_app_server_srg/hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_app_web_server_tomcat_app_server_srg_hardening_preflight_passed | bool
          - fe_app_web_server_tomcat_app_server_srg_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          app_web_server/tomcat_app_server_srg/hardening: postflight validation failed - preflight passed
          ={{ fe_app_web_server_tomcat_app_server_srg_hardening_preflight_passed | default(false) }},
          status={{ fe_app_web_server_tomcat_app_server_srg_hardening_status | default('unknown') }}.
        success_msg: "app_web_server/tomcat_app_server_srg/hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "app_web_server/tomcat_app_server_srg/hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_app_web_server_tomcat_app_server_srg_hardening_postflight_passed: true
        fe_app_web_server_tomcat_app_server_srg_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "app_web_server/tomcat_app_server_srg/hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_app_web_server_tomcat_app_server_srg_hardening_status: "failed"
        fe_app_web_server_tomcat_app_server_srg_hardening_postflight_passed: false
        fe_app_web_server_tomcat_app_server_srg_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_app_web_server_tomcat_app_server_srg_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "app_web_server/tomcat_app_server_srg/hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          app_web_server/tomcat_app_server_srg/hardening: FAILED at '{{ fe_app_web_server_tomcat_app_server_srg_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_app_web_server_tomcat_app_server_srg_hardening_error }}
      tags:
        - always
        - rescue

    - name: "app_web_server/tomcat_app_server_srg/hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          app_web_server/tomcat_app_server_srg/hardening failed at '{{ fe_app_web_server_tomcat_app_server_srg_hardening_failed_task }}': {{ fe_app_web_server_tomcat_app_server_srg_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "app_web_server/tomcat_app_server_srg/hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_app_web_server_tomcat_app_server_srg_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_app_web_server_tomcat_app_server_srg_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_app_web_server_tomcat_app_server_srg_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "app_web_server/tomcat_app_server_srg/hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "app_web_server/tomcat_app_server_srg/hardening":
              component: "app_web_server/tomcat_app_server_srg/hardening"
              type: "role-tasks"
              platform: "app_web_server"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_started_at | default('') }}"
              ended_at: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_failed_task | default('') }}"
              error: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_app_web_server_tomcat_app_server_srg_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_app_web_server_tomcat_app_server_srg_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_app_web_server_tomcat_app_server_srg_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_app_web_server_tomcat_app_server_srg_hardening_status | default('') == 'succeeded' else ['app_web_server/tomcat_app_server_srg/hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "app_web_server/tomcat_app_server_srg/hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_app_web_server_tomcat_app_server_srg_hardening_stats_published: true
      tags:
        - always
