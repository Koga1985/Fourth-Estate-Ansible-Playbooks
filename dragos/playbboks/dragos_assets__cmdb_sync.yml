---
# vars example:
# cmdb: { provider: servicenow, url: "...", token: "...", table: "cmdb_ci_computer",
#         jira_url: "...", jira_token: "...", jira_project: "OT" }

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_assets__cmdb_sync']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_assets__cmdb_sync_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_assets__cmdb_sync | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_assets__cmdb_sync_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_assets__cmdb_sync_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_assets__cmdb_sync_status: "running"
    fe_dragos_dragos_assets__cmdb_sync_preflight_passed: false
    fe_dragos_dragos_assets__cmdb_sync_postflight_passed: false
    fe_dragos_dragos_assets__cmdb_sync_failed_task: ""
    fe_dragos_dragos_assets__cmdb_sync_error: ""
    fe_dragos_dragos_assets__cmdb_sync_stats_published: false
  tags:
    - always

- name: "dragos/dragos_assets__cmdb_sync | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_assets__cmdb_sync | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_assets__cmdb_sync: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_assets__cmdb_sync: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_assets__cmdb_sync | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_assets__cmdb_sync: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_assets__cmdb_sync: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_assets__cmdb_sync_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_assets__cmdb_sync | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_assets__cmdb_sync_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load assets
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets?limit={{ page_size | default(500) }}"
        method: GET
        headers: { Authorization: "Bearer {{ dragos_token }}" }
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl | default(true) }}"
      register: assets_now

    - name: Upsert to ServiceNow
      when: cmdb.provider | lower == 'servicenow'
      ansible.builtin.uri:
        url: "{{ cmdb.url }}/api/now/table/{{ cmdb.table }}"
        method: POST
        headers: { Authorization: "Bearer {{ cmdb.token }}", Content-Type: "application/json" }
        body_format: json
        body:
          name: "{{ item.hostname | default(item.name) }}"
          ip_address: "{{ item.primary_ip | default(item.ip) }}"
          u_site: "{{ item.site | default('') }}"
          u_zone: "{{ item.zone | default('') }}"
          u_vendor: "{{ item.vendor | default('') }}"
          u_model: "{{ item.model | default('') }}"
        status_code: [200,201]
      loop: "{{ (assets_now.json.items if assets_now.json.items is defined else assets_now.json.data | default([])) }}"
      loop_control: { label: "{{ item.id | default('') }}" }

    - name: Create Jira issues (CI stand-in)
      when: cmdb.provider | lower == 'jira'
      ansible.builtin.uri:
        url: "{{ cmdb.jira_url }}/rest/api/2/issue"
        method: POST
        headers: { Authorization: "Bearer {{ cmdb.jira_token }}", Content-Type: "application/json" }
        body_format: json
        body:
          fields:
            project: { key: "{{ cmdb.jira_project }}" }
            summary: "Asset {{ item.hostname | default(item.name) }} ({{ item.primary_ip | default(item.ip) }})"
            issuetype: { name: "Task" }
            labels: [ "cmdb", "{{ item.site | default('unknown') }}" ]
        status_code: [200,201]
      loop: "{{ (assets_now.json.items if assets_now.json.items is defined else assets_now.json.data | default([])) }}"
      loop_control: { label: "{{ item.id | default('') }}" }

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_assets__cmdb_sync | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_assets__cmdb_sync_preflight_passed | bool
          - fe_dragos_dragos_assets__cmdb_sync_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_assets__cmdb_sync: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_assets__cmdb_sync_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_assets__cmdb_sync_status | default('unknown') }}.
        success_msg: "dragos/dragos_assets__cmdb_sync: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_assets__cmdb_sync | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_assets__cmdb_sync_postflight_passed: true
        fe_dragos_dragos_assets__cmdb_sync_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_assets__cmdb_sync | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_assets__cmdb_sync_status: "failed"
        fe_dragos_dragos_assets__cmdb_sync_postflight_passed: false
        fe_dragos_dragos_assets__cmdb_sync_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_assets__cmdb_sync_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_assets__cmdb_sync | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_assets__cmdb_sync: FAILED at '{{ fe_dragos_dragos_assets__cmdb_sync_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_assets__cmdb_sync_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_assets__cmdb_sync | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_assets__cmdb_sync failed at '{{ fe_dragos_dragos_assets__cmdb_sync_failed_task }}': {{ fe_dragos_dragos_assets__cmdb_sync_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_assets__cmdb_sync | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_assets__cmdb_sync_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_assets__cmdb_sync_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_assets__cmdb_sync_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_assets__cmdb_sync | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_assets__cmdb_sync":
              component: "dragos/dragos_assets__cmdb_sync"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_assets__cmdb_sync_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_assets__cmdb_sync_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_assets__cmdb_sync_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_assets__cmdb_sync_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_assets__cmdb_sync_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_assets__cmdb_sync_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_assets__cmdb_sync_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_assets__cmdb_sync_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_assets__cmdb_sync_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_assets__cmdb_sync_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_assets__cmdb_sync_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_assets__cmdb_sync_status | default('') == 'succeeded' else ['dragos/dragos_assets__cmdb_sync'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_assets__cmdb_sync | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_assets__cmdb_sync_stats_published: true
      tags:
        - always
