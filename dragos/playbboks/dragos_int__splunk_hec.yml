---
# vars: splunk: { hec_url: "https://splunk:8088/services/collector", hec_token: "xxx", sourcetype: "dragos:event", batch_size: 200 }
# alerts_json_path: "{{ artifacts_dir }}/alerts_filtered.json"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_int__splunk_hec']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_int__splunk_hec_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_int__splunk_hec | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_int__splunk_hec_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_int__splunk_hec_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_int__splunk_hec_status: "running"
    fe_dragos_dragos_int__splunk_hec_preflight_passed: false
    fe_dragos_dragos_int__splunk_hec_postflight_passed: false
    fe_dragos_dragos_int__splunk_hec_failed_task: ""
    fe_dragos_dragos_int__splunk_hec_error: ""
    fe_dragos_dragos_int__splunk_hec_stats_published: false
  tags:
    - always

- name: "dragos/dragos_int__splunk_hec | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_int__splunk_hec | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_int__splunk_hec: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_int__splunk_hec: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_int__splunk_hec | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_int__splunk_hec: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_int__splunk_hec: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_int__splunk_hec_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_int__splunk_hec | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__splunk_hec_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load alerts
      ansible.builtin.set_fact:
        _alerts: "{{ lookup('ansible.builtin.file', alerts_json_path) | from_json }}"
        _batch_size: "{{ splunk.batch_size | default(200) | int }}"

    - name: Prepare alert list
      ansible.builtin.set_fact:
        _items: "{{ (_alerts.items if _alerts.items is defined else _alerts.data | default([])) }}"

    - name: Send to Splunk HEC in batches
      vars:
        batch: "{{ _items[batch_start:batch_end] }}"
      loop: "{{ range(0, (_items | length), _batch_size) | list }}"
      loop_control:
        loop_var: batch_start
      vars_prompt:
        # (not used, keep clean)
      tasks:
        - name: Calc end index
          ansible.builtin.set_fact:
            batch_end: "{{ [batch_start + _batch_size, (_items | length)] | min }}"
        - name: Post batch
          ansible.builtin.uri:
            url: "{{ splunk.hec_url }}"
            method: POST
            headers: { Authorization: "Splunk {{ splunk.hec_token }}", Content-Type: "application/json" }
            body_format: json
            body: >
              { "event": {{ batch }}, "sourcetype": "{{ splunk.sourcetype | default('dragos:event') }}" }
            status_code: [200,201]

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_int__splunk_hec | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_int__splunk_hec_preflight_passed | bool
          - fe_dragos_dragos_int__splunk_hec_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_int__splunk_hec: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_int__splunk_hec_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_int__splunk_hec_status | default('unknown') }}.
        success_msg: "dragos/dragos_int__splunk_hec: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_int__splunk_hec | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__splunk_hec_postflight_passed: true
        fe_dragos_dragos_int__splunk_hec_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_int__splunk_hec | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__splunk_hec_status: "failed"
        fe_dragos_dragos_int__splunk_hec_postflight_passed: false
        fe_dragos_dragos_int__splunk_hec_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_int__splunk_hec_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_int__splunk_hec | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_int__splunk_hec: FAILED at '{{ fe_dragos_dragos_int__splunk_hec_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_int__splunk_hec_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_int__splunk_hec | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_int__splunk_hec failed at '{{ fe_dragos_dragos_int__splunk_hec_failed_task }}': {{ fe_dragos_dragos_int__splunk_hec_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_int__splunk_hec | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__splunk_hec_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_int__splunk_hec_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_int__splunk_hec_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_int__splunk_hec | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_int__splunk_hec":
              component: "dragos/dragos_int__splunk_hec"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_int__splunk_hec_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_int__splunk_hec_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_int__splunk_hec_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_int__splunk_hec_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_int__splunk_hec_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_int__splunk_hec_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_int__splunk_hec_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_int__splunk_hec_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_int__splunk_hec_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_int__splunk_hec_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_int__splunk_hec_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_int__splunk_hec_status | default('') == 'succeeded' else ['dragos/dragos_int__splunk_hec'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_int__splunk_hec | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__splunk_hec_stats_published: true
      tags:
        - always
