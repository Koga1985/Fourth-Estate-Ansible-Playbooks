---
# vars: itsm:
#   provider: servicenow|jira
#   url: "https://now.example"            # ServiceNow
#   token: "SNOW_TOKEN"
#   table: "incident"
#   jira_url: "https://jira.example"      # Jira
#   jira_token: "JIRA_TOKEN"
#   jira_project: "OT"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_vuln__ticket_create']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_vuln__ticket_create_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_vuln__ticket_create | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_vuln__ticket_create_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_vuln__ticket_create_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_vuln__ticket_create_status: "running"
    fe_dragos_dragos_vuln__ticket_create_preflight_passed: false
    fe_dragos_dragos_vuln__ticket_create_postflight_passed: false
    fe_dragos_dragos_vuln__ticket_create_failed_task: ""
    fe_dragos_dragos_vuln__ticket_create_error: ""
    fe_dragos_dragos_vuln__ticket_create_stats_published: false
  tags:
    - always

- name: "dragos/dragos_vuln__ticket_create | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_vuln__ticket_create | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_vuln__ticket_create: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_vuln__ticket_create: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_vuln__ticket_create | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_vuln__ticket_create: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_vuln__ticket_create: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_vuln__ticket_create_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_vuln__ticket_create | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_vuln__ticket_create_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load worklist
      ansible.builtin.set_fact:
        _work: "{{ lookup('ansible.builtin.file', artifacts_dir | default('/tmp/dragos-artifacts') + '/vuln_worklist_high.csv') | splitlines | list }}"

    - name: Create tickets in ServiceNow
      when: itsm.provider | lower == 'servicenow'
      ansible.builtin.uri:
        url: "{{ itsm.url }}/api/now/table/{{ itsm.table }}"
        method: POST
        headers: { Authorization: "Bearer {{ itsm.token }}", Content-Type: "application/json" }
        body_format: json
        body:
          short_description: "Dragos vuln {{ item.split(',')[0] }} on {{ item.split(',')[1] }}"
          severity: "2"
          description: "Risk={{ item.split(',')[2] }} Owner={{ item.split(',')[3] }}"
        status_code: [200,201]
      loop: "{{ _work[1:] }}"

    - name: Create tickets in Jira
      when: itsm.provider | lower == 'jira'
      ansible.builtin.uri:
        url: "{{ itsm.jira_url }}/rest/api/2/issue"
        method: POST
        headers: { Authorization: "Bearer {{ itsm.jira_token }}", Content-Type: "application/json" }
        body_format: json
        body:
          fields:
            project: { key: "{{ itsm.jira_project }}" }
            summary: "Remediate vuln {{ item.split(',')[0] }} on {{ item.split(',')[1] }}"
            issuetype: { name: "Task" }
            labels: [ "dragos", "vulnerability" ]
            description: "Risk={{ item.split(',')[2] | default('') }} Owner={{ item.split(',')[3] | default('') }}"
        status_code: [200,201]
      loop: "{{ _work[1:] }}"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_vuln__ticket_create | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_vuln__ticket_create_preflight_passed | bool
          - fe_dragos_dragos_vuln__ticket_create_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_vuln__ticket_create: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_vuln__ticket_create_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_vuln__ticket_create_status | default('unknown') }}.
        success_msg: "dragos/dragos_vuln__ticket_create: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_vuln__ticket_create | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_vuln__ticket_create_postflight_passed: true
        fe_dragos_dragos_vuln__ticket_create_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_vuln__ticket_create | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_vuln__ticket_create_status: "failed"
        fe_dragos_dragos_vuln__ticket_create_postflight_passed: false
        fe_dragos_dragos_vuln__ticket_create_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_vuln__ticket_create_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_vuln__ticket_create | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_vuln__ticket_create: FAILED at '{{ fe_dragos_dragos_vuln__ticket_create_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_vuln__ticket_create_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_vuln__ticket_create | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_vuln__ticket_create failed at '{{ fe_dragos_dragos_vuln__ticket_create_failed_task }}': {{ fe_dragos_dragos_vuln__ticket_create_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_vuln__ticket_create | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_vuln__ticket_create_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_vuln__ticket_create_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_vuln__ticket_create_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_vuln__ticket_create | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_vuln__ticket_create":
              component: "dragos/dragos_vuln__ticket_create"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_vuln__ticket_create_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_vuln__ticket_create_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_vuln__ticket_create_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_vuln__ticket_create_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_vuln__ticket_create_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_vuln__ticket_create_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_vuln__ticket_create_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_vuln__ticket_create_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_vuln__ticket_create_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_vuln__ticket_create_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_vuln__ticket_create_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_vuln__ticket_create_status | default('') == 'succeeded' else ['dragos/dragos_vuln__ticket_create'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_vuln__ticket_create | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_vuln__ticket_create_stats_published: true
      tags:
        - always
