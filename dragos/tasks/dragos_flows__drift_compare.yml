---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_flows__drift_compare']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_flows__drift_compare_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_flows__drift_compare | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_flows__drift_compare_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_flows__drift_compare_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_flows__drift_compare_status: "running"
    fe_dragos_dragos_flows__drift_compare_preflight_passed: false
    fe_dragos_dragos_flows__drift_compare_postflight_passed: false
    fe_dragos_dragos_flows__drift_compare_failed_task: ""
    fe_dragos_dragos_flows__drift_compare_error: ""
    fe_dragos_dragos_flows__drift_compare_stats_published: false
  tags:
    - always

- name: "dragos/dragos_flows__drift_compare | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_flows__drift_compare | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_flows__drift_compare: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_flows__drift_compare: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_flows__drift_compare | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_flows__drift_compare: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_flows__drift_compare: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_flows__drift_compare_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_flows__drift_compare | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_flows__drift_compare_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}"
        state: directory
        mode: "0755"

    # vars: deployed_policy_csv: "/path/to/deployed/policy.csv"
    - name: Load intent & deployed policy
      ansible.builtin.set_fact:
        intent: "{{ lookup('ansible.builtin.file', artifacts_dir | default('/tmp/dragos-artifacts') + '/allowlist.json') | from_json }}"
        deployed: "{{ lookup('ansible.builtin.file', deployed_policy_csv) }}"
    - name: Save drift JSON
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}/policy_drift.json"
        mode: "0644"
        content: |
          {%- set missing = [] -%}
          {%- for i in intent -%}
            {%- if i.service not in deployed -%}
              {%- set _ = missing.append(i) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {'missing': missing, 'extra': []} | to_nice_json }}

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_flows__drift_compare | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_flows__drift_compare_preflight_passed | bool
          - fe_dragos_dragos_flows__drift_compare_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_flows__drift_compare: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_flows__drift_compare_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_flows__drift_compare_status | default('unknown') }}.
        success_msg: "dragos/dragos_flows__drift_compare: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_flows__drift_compare | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_flows__drift_compare_postflight_passed: true
        fe_dragos_dragos_flows__drift_compare_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_flows__drift_compare | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_flows__drift_compare_status: "failed"
        fe_dragos_dragos_flows__drift_compare_postflight_passed: false
        fe_dragos_dragos_flows__drift_compare_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_flows__drift_compare_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_flows__drift_compare | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_flows__drift_compare: FAILED at '{{ fe_dragos_dragos_flows__drift_compare_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_flows__drift_compare_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_flows__drift_compare | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_flows__drift_compare failed at '{{ fe_dragos_dragos_flows__drift_compare_failed_task }}': {{ fe_dragos_dragos_flows__drift_compare_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_flows__drift_compare | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_flows__drift_compare_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_flows__drift_compare_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_flows__drift_compare_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_flows__drift_compare | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_flows__drift_compare":
              component: "dragos/dragos_flows__drift_compare"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_flows__drift_compare_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_flows__drift_compare_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_flows__drift_compare_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_flows__drift_compare_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_flows__drift_compare_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_flows__drift_compare_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_flows__drift_compare_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_flows__drift_compare_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_flows__drift_compare_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_flows__drift_compare_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_flows__drift_compare_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_flows__drift_compare_status | default('') == 'succeeded' else ['dragos/dragos_flows__drift_compare'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_flows__drift_compare | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_flows__drift_compare_stats_published: true
      tags:
        - always
