---
# vars: syslog: { use_logger: true, facility: "user", priority: "info", cef_vendor: "Dragos", cef_product: "xDome" }

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_alerts__forward_syslog']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_alerts__forward_syslog_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_alerts__forward_syslog | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_alerts__forward_syslog_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_alerts__forward_syslog_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_alerts__forward_syslog_status: "running"
    fe_dragos_dragos_alerts__forward_syslog_preflight_passed: false
    fe_dragos_dragos_alerts__forward_syslog_postflight_passed: false
    fe_dragos_dragos_alerts__forward_syslog_failed_task: ""
    fe_dragos_dragos_alerts__forward_syslog_error: ""
    fe_dragos_dragos_alerts__forward_syslog_stats_published: false
  tags:
    - always

- name: "dragos/dragos_alerts__forward_syslog | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_alerts__forward_syslog | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_alerts__forward_syslog: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_alerts__forward_syslog: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_alerts__forward_syslog | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_alerts__forward_syslog: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_alerts__forward_syslog: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_alerts__forward_syslog_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_alerts__forward_syslog | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_alerts__forward_syslog_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load alerts for syslog
      ansible.builtin.set_fact:
        _alerts: "{{ alerts_now.json if alerts_now is defined else (lookup('ansible.builtin.file', alerts_json_path) | from_json) }}"
    - name: Render CEF to file
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}/alerts.cef"
        mode: "0644"
        content: |
          {% set items = (_alerts.items if _alerts.items is defined else _alerts.data | default([])) %}
          {% for a in items %}
          CEF:0|{{ syslog.cef_vendor | default('Dragos') }}|{{ syslog.cef_product | default('xDome') }}|1.0|{{ a.category | default('') }}|{{ a.summary | default('') | regex_replace('\n',' ') }}|{{ (a.severity | default('low')) | lower }}|src={{ (a.asset.ip) | default('') }} cs1Label=site cs1={{ a.site | default('') }}
          {% endfor %}
    - name: Ship via logger (optional)
      when: syslog.use_logger | default(false)
      ansible.builtin.shell: |
        while IFS= read -r line; do logger -p {{ syslog.facility | default('user') }}.{{ syslog.priority | default('info') }} "$line"; done < "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}/alerts.cef"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_alerts__forward_syslog | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_alerts__forward_syslog_preflight_passed | bool
          - fe_dragos_dragos_alerts__forward_syslog_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_alerts__forward_syslog: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_alerts__forward_syslog_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_alerts__forward_syslog_status | default('unknown') }}.
        success_msg: "dragos/dragos_alerts__forward_syslog: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_alerts__forward_syslog | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_alerts__forward_syslog_postflight_passed: true
        fe_dragos_dragos_alerts__forward_syslog_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_alerts__forward_syslog | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_alerts__forward_syslog_status: "failed"
        fe_dragos_dragos_alerts__forward_syslog_postflight_passed: false
        fe_dragos_dragos_alerts__forward_syslog_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_alerts__forward_syslog_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_alerts__forward_syslog | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_alerts__forward_syslog: FAILED at '{{ fe_dragos_dragos_alerts__forward_syslog_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_alerts__forward_syslog_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_alerts__forward_syslog | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_alerts__forward_syslog failed at '{{ fe_dragos_dragos_alerts__forward_syslog_failed_task }}': {{ fe_dragos_dragos_alerts__forward_syslog_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_alerts__forward_syslog | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_alerts__forward_syslog_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_alerts__forward_syslog_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_alerts__forward_syslog_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_alerts__forward_syslog | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_alerts__forward_syslog":
              component: "dragos/dragos_alerts__forward_syslog"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_alerts__forward_syslog_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_alerts__forward_syslog_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_alerts__forward_syslog_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_alerts__forward_syslog_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_alerts__forward_syslog_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_alerts__forward_syslog_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_alerts__forward_syslog_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_alerts__forward_syslog_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_alerts__forward_syslog_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_alerts__forward_syslog_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_alerts__forward_syslog_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_alerts__forward_syslog_status | default('') == 'succeeded' else ['dragos/dragos_alerts__forward_syslog'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_alerts__forward_syslog | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_alerts__forward_syslog_stats_published: true
      tags:
        - always
