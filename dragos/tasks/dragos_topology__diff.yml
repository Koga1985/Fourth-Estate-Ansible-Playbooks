---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_topology__diff']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_topology__diff_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_topology__diff | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_topology__diff_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_topology__diff_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_topology__diff_status: "running"
    fe_dragos_dragos_topology__diff_preflight_passed: false
    fe_dragos_dragos_topology__diff_postflight_passed: false
    fe_dragos_dragos_topology__diff_failed_task: ""
    fe_dragos_dragos_topology__diff_error: ""
    fe_dragos_dragos_topology__diff_stats_published: false
  tags:
    - always

- name: "dragos/dragos_topology__diff | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_topology__diff | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_topology__diff: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_topology__diff: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_topology__diff | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_topology__diff: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_topology__diff: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_topology__diff_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_topology__diff | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_topology__diff_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}"
        state: directory
        mode: "0755"

    # vars: topology_gold_path: "/path/to/gold/topology.json"
    - name: Current topology
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/flows?limit={{ page_size | default(500) }}"
        method: GET
        headers: { Authorization: "Bearer {{ dragos_token }}" }
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl | default(true) }}"
      register: flows_now

    - name: Load gold
      ansible.builtin.set_fact:
        gold_topology: "{{ lookup('ansible.builtin.file', topology_gold_path) | from_json }}"

    - name: Diff edges (best-effort)
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/dragos-artifacts') }}/topology_drift.json"
        mode: "0644"
        content: |
          {{
            {
              'added': (
                (flows_now.json.items if flows_now.json.items is defined else flows_now.json.data | default([]))
                | map('extract', {'src':'src','dst':'dst','proto':'proto','port':'port'}) | list
              )
              | difference(
                (gold_topology.items if gold_topology.items is defined else gold_topology.data | default([]))
                | map('extract', {'src':'src','dst':'dst','proto':'proto','port':'port'}) | list
              ),
              'removed': (
                (gold_topology.items if gold_topology.items is defined else gold_topology.data | default([]))
                | map('extract', {'src':'src','dst':'dst','proto':'proto','port':'port'}) | list
              )
              | difference(
                (flows_now.json.items if flows_now.json.items is defined else flows_now.json.data | default([]))
                | map('extract', {'src':'src','dst':'dst','proto':'proto','port':'port'}) | list
              )
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_topology__diff | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_topology__diff_preflight_passed | bool
          - fe_dragos_dragos_topology__diff_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_topology__diff: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_topology__diff_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_topology__diff_status | default('unknown') }}.
        success_msg: "dragos/dragos_topology__diff: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_topology__diff | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_topology__diff_postflight_passed: true
        fe_dragos_dragos_topology__diff_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_topology__diff | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_topology__diff_status: "failed"
        fe_dragos_dragos_topology__diff_postflight_passed: false
        fe_dragos_dragos_topology__diff_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_topology__diff_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_topology__diff | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_topology__diff: FAILED at '{{ fe_dragos_dragos_topology__diff_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_topology__diff_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_topology__diff | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_topology__diff failed at '{{ fe_dragos_dragos_topology__diff_failed_task }}': {{ fe_dragos_dragos_topology__diff_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_topology__diff | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_topology__diff_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_topology__diff_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_topology__diff_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_topology__diff | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_topology__diff":
              component: "dragos/dragos_topology__diff"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_topology__diff_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_topology__diff_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_topology__diff_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_topology__diff_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_topology__diff_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_topology__diff_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_topology__diff_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_topology__diff_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_topology__diff_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_topology__diff_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_topology__diff_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_topology__diff_status | default('') == 'succeeded' else ['dragos/dragos_topology__diff'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_topology__diff | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_topology__diff_stats_published: true
      tags:
        - always
