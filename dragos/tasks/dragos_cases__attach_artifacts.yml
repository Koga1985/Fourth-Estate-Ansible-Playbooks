---
# vars: case_id: "abc123", artifacts: [ { path: "/tmp/pcap1.pcap", label: "pcap" } ]

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_cases__attach_artifacts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_cases__attach_artifacts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_cases__attach_artifacts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_cases__attach_artifacts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_cases__attach_artifacts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_cases__attach_artifacts_status: "running"
    fe_dragos_dragos_cases__attach_artifacts_preflight_passed: false
    fe_dragos_dragos_cases__attach_artifacts_postflight_passed: false
    fe_dragos_dragos_cases__attach_artifacts_failed_task: ""
    fe_dragos_dragos_cases__attach_artifacts_error: ""
    fe_dragos_dragos_cases__attach_artifacts_stats_published: false
  tags:
    - always

- name: "dragos/dragos_cases__attach_artifacts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_cases__attach_artifacts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_cases__attach_artifacts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_cases__attach_artifacts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_cases__attach_artifacts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_cases__attach_artifacts: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_cases__attach_artifacts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_cases__attach_artifacts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_cases__attach_artifacts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_cases__attach_artifacts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Attach artifacts
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/cases/{{ case_id }}/artifacts"
        method: POST
        headers: { Authorization: "Bearer {{ dragos_token }}" }
        body_format: form-multipart
        body:
          file: "{{ lookup('ansible.builtin.file', item.path) }}"
          label: "{{ item.label | default('evidence') }}"
        status_code: [200,201,202]
        validate_certs: "{{ dragos_verify_ssl | default(true) }}"
      loop: "{{ artifacts | default([]) }}"
      loop_control: { label: "{{ item.path }}" }

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_cases__attach_artifacts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_cases__attach_artifacts_preflight_passed | bool
          - fe_dragos_dragos_cases__attach_artifacts_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_cases__attach_artifacts: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_cases__attach_artifacts_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_cases__attach_artifacts_status | default('unknown') }}.
        success_msg: "dragos/dragos_cases__attach_artifacts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_cases__attach_artifacts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_cases__attach_artifacts_postflight_passed: true
        fe_dragos_dragos_cases__attach_artifacts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_cases__attach_artifacts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_cases__attach_artifacts_status: "failed"
        fe_dragos_dragos_cases__attach_artifacts_postflight_passed: false
        fe_dragos_dragos_cases__attach_artifacts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_cases__attach_artifacts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_cases__attach_artifacts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_cases__attach_artifacts: FAILED at '{{ fe_dragos_dragos_cases__attach_artifacts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_cases__attach_artifacts_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_cases__attach_artifacts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_cases__attach_artifacts failed at '{{ fe_dragos_dragos_cases__attach_artifacts_failed_task }}': {{ fe_dragos_dragos_cases__attach_artifacts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_cases__attach_artifacts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_cases__attach_artifacts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_cases__attach_artifacts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_cases__attach_artifacts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_cases__attach_artifacts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_cases__attach_artifacts":
              component: "dragos/dragos_cases__attach_artifacts"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_cases__attach_artifacts_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_cases__attach_artifacts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_cases__attach_artifacts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_cases__attach_artifacts_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_cases__attach_artifacts_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_cases__attach_artifacts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_cases__attach_artifacts_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_cases__attach_artifacts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_cases__attach_artifacts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_cases__attach_artifacts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_cases__attach_artifacts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_cases__attach_artifacts_status | default('') == 'succeeded' else ['dragos/dragos_cases__attach_artifacts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_cases__attach_artifacts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_cases__attach_artifacts_stats_published: true
      tags:
        - always
