---
# vars: jira: { url: "https://jira.example", token: "JIRA_TOKEN", project: "OT" }
# findings_csv_path: "{{ artifacts_dir }}/vuln_findings.csv"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_int__jira_issues']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_int__jira_issues_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_int__jira_issues | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_int__jira_issues_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_int__jira_issues_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_int__jira_issues_status: "running"
    fe_dragos_dragos_int__jira_issues_preflight_passed: false
    fe_dragos_dragos_int__jira_issues_postflight_passed: false
    fe_dragos_dragos_int__jira_issues_failed_task: ""
    fe_dragos_dragos_int__jira_issues_error: ""
    fe_dragos_dragos_int__jira_issues_stats_published: false
  tags:
    - always

- name: "dragos/dragos_int__jira_issues | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_int__jira_issues | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_int__jira_issues: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_int__jira_issues: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_int__jira_issues | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_int__jira_issues: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_int__jira_issues: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_int__jira_issues_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_int__jira_issues | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__jira_issues_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load findings CSV
      ansible.builtin.set_fact:
        _lines: "{{ lookup('ansible.builtin.file', findings_csv_path) | splitlines }}"

    - name: Create Jira issues with labels
      ansible.builtin.uri:
        url: "{{ jira.url }}/rest/api/2/issue"
        method: POST
        headers: { Authorization: "Bearer {{ jira.token }}", Content-Type: "application/json" }
        body_format: json
        body:
          fields:
            project: { key: "{{ jira.project }}" }
            summary: "Remediate vuln {{ item.split(',')[0] }} on {{ item.split(',')[1] }}"
            issuetype: { name: "Task" }
            labels: [ "dragos", "vuln", "{{ item.split(',')[4] | default('') }}" ]
            priority: { name: "{{ 'Highest' if (item.split(',')[2] | float) >= 9.0 else ('High' if (item.split(',')[2] | float) >= 7.0 else 'Medium') }}" }
            description: "Risk={{ item.split(',')[3] | default('') }}"
        status_code: [200,201]
      loop: "{{ _lines[1:] }}"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_int__jira_issues | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_int__jira_issues_preflight_passed | bool
          - fe_dragos_dragos_int__jira_issues_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_int__jira_issues: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_int__jira_issues_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_int__jira_issues_status | default('unknown') }}.
        success_msg: "dragos/dragos_int__jira_issues: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_int__jira_issues | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__jira_issues_postflight_passed: true
        fe_dragos_dragos_int__jira_issues_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_int__jira_issues | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__jira_issues_status: "failed"
        fe_dragos_dragos_int__jira_issues_postflight_passed: false
        fe_dragos_dragos_int__jira_issues_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_int__jira_issues_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_int__jira_issues | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_int__jira_issues: FAILED at '{{ fe_dragos_dragos_int__jira_issues_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_int__jira_issues_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_int__jira_issues | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_int__jira_issues failed at '{{ fe_dragos_dragos_int__jira_issues_failed_task }}': {{ fe_dragos_dragos_int__jira_issues_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_int__jira_issues | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__jira_issues_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_int__jira_issues_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_int__jira_issues_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_int__jira_issues | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_int__jira_issues":
              component: "dragos/dragos_int__jira_issues"
              type: "tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_int__jira_issues_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_int__jira_issues_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_int__jira_issues_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_int__jira_issues_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_int__jira_issues_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_int__jira_issues_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_int__jira_issues_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_int__jira_issues_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_int__jira_issues_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_int__jira_issues_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_int__jira_issues_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_int__jira_issues_status | default('') == 'succeeded' else ['dragos/dragos_int__jira_issues'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_int__jira_issues | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_int__jira_issues_stats_published: true
      tags:
        - always
