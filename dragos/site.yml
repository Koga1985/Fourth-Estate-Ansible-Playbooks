---
# Dragos Platform Deployment Playbook
# Entry point for Dragos OT security platform automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass
#
# Tags:
#   - sensors: Sensor deployment and configuration
#   - inventory: Asset inventory management
#   - alerts: Alert pipeline configuration
#   - integrations: SIEM/ITSM integrations
#   - governance: Compliance and governance

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Dragos Platform Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Deployment control - set to true to enable each component
    deploy_sensors: true
    deploy_inventory: true
    deploy_topology: true
    deploy_alerts: true
    deploy_intel: true
    deploy_vuln_mgmt: true
    deploy_integrations: true
    deploy_governance: true
    deploy_segmentation: false
    deploy_mssp: false

  tasks:
    # =========================================
    # Phase 1: Sensor Operations
    # =========================================
    - name: "dragos/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Sensor Operations
          ansible.builtin.include_role:
            name: dragos_sensor_ops
          when: deploy_sensors | bool
          tags: ['sensors', 'phase1']

        # =========================================
        # Phase 2: Asset Inventory
        # =========================================
        - name: Phase 2 - Inventory Model
          ansible.builtin.include_role:
            name: dragos_inventory_model
          when: deploy_inventory | bool
          tags: ['inventory', 'phase2']

        - name: Phase 2 - Topology Baseline
          ansible.builtin.include_role:
            name: dragos_topology_baseline
          when: deploy_topology | bool
          tags: ['topology', 'phase2']

        # =========================================
        # Phase 3: Threat Detection
        # =========================================
        - name: Phase 3 - Alerts Pipeline
          ansible.builtin.include_role:
            name: dragos_alerts_pipeline
          when: deploy_alerts | bool
          tags: ['alerts', 'phase3']

        - name: Phase 3 - Intel Operations
          ansible.builtin.include_role:
            name: dragos_intel_ops
          when: deploy_intel | bool
          tags: ['intel', 'phase3']

        # =========================================
        # Phase 4: Vulnerability Management
        # =========================================
        - name: Phase 4 - Vulnerability Management
          ansible.builtin.include_role:
            name: dragos_vulnerability_mgmt
          when: deploy_vuln_mgmt | bool
          tags: ['vulnerability', 'phase4']

        # =========================================
        # Phase 5: Case Management
        # =========================================
        - name: Phase 5 - Cases Workflow
          ansible.builtin.include_role:
            name: dragos_cases_workflow
          tags: ['cases', 'phase5']

        # =========================================
        # Phase 6: Integrations
        # =========================================
        - name: Phase 6 - ServiceNow Integration
          ansible.builtin.include_role:
            name: dragos_servicenow_integration
          when: deploy_integrations | bool and (dragos_servicenow_enabled | default(false) | bool)
          tags: ['integrations', 'servicenow', 'phase6']

        - name: Phase 6 - Jira Integration
          ansible.builtin.include_role:
            name: dragos_jira_integration
          when: deploy_integrations | bool and (dragos_jira_enabled | default(false) | bool)
          tags: ['integrations', 'jira', 'phase6']

        # =========================================
        # Phase 7: Governance & Compliance
        # =========================================
        - name: Phase 7 - Governance Pack
          ansible.builtin.include_role:
            name: dragos_governance_pack
          when: deploy_governance | bool
          tags: ['governance', 'compliance', 'phase7']

        # =========================================
        # Phase 8: Network Segmentation (Optional)
        # =========================================
        - name: Phase 8 - Segmentation Assist
          ansible.builtin.include_role:
            name: dragos_segmentation_assist
          when: deploy_segmentation | bool
          tags: ['segmentation', 'phase8']

        # =========================================
        # Phase 9: MSSP Operations (Optional)
        # =========================================
        - name: Phase 9 - MSSP Orchestrator
          ansible.builtin.include_role:
            name: dragos_mssp_orchestrator
          when: deploy_mssp | bool
          tags: ['mssp', 'phase9']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== Dragos Platform Deployment Complete ==="
              - "Platform URL: {{ dragos_api_url | default('https://dragos.example.com') }}"
              - "Sensors: {{ 'Configured' if deploy_sensors else 'Skipped' }}"
              - "Asset Inventory: {{ 'Configured' if deploy_inventory else 'Skipped' }}"
              - "Topology: {{ 'Configured' if deploy_topology else 'Skipped' }}"
              - "Alerts Pipeline: {{ 'Configured' if deploy_alerts else 'Skipped' }}"
              - "Threat Intel: {{ 'Configured' if deploy_intel else 'Skipped' }}"
              - "Vulnerability Mgmt: {{ 'Configured' if deploy_vuln_mgmt else 'Skipped' }}"
              - "Integrations: {{ 'Configured' if deploy_integrations else 'Skipped' }}"
              - "Governance: {{ 'Configured' if deploy_governance else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "dragos/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_dragos_site_status: "failed"
            fe_dragos_site_postflight_passed: false
            fe_dragos_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_dragos_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "dragos/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              dragos/site: FAILED at '{{ fe_dragos_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_dragos_site_error }}
          tags:
            - always
            - rescue

        - name: "dragos/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              dragos/site failed at '{{ fe_dragos_site_failed_task }}': {{ fe_dragos_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "dragos/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_dragos_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_dragos_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "dragos/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "dragos/site":
                  component: "dragos/site"
                  type: "playbook"
                  platform: "dragos"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_dragos_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_dragos_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_dragos_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_dragos_site_started_at | default('') }}"
                  ended_at: "{{ fe_dragos_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_dragos_site_failed_task | default('') }}"
                  error: "{{ fe_dragos_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_dragos_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_dragos_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_dragos_site_status | default('') == 'succeeded' else ['dragos/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_dragos_site_status | default('') == 'failed'
            - not (fe_dragos_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "dragos/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_dragos_site_stats_published: true
          when:
            - fe_dragos_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "dragos/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "dragos/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_dragos_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_dragos_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_dragos_site_status: "running"
            fe_dragos_site_preflight_passed: false
            fe_dragos_site_postflight_passed: false
            fe_dragos_site_failed_task: ""
            fe_dragos_site_error: ""
            fe_dragos_site_stats_published: false
          tags:
            - always

        - name: "dragos/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              dragos/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              dragos/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "dragos/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "dragos/site: required variable '{{ item }}' is not defined."
            success_msg: "dragos/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_dragos_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "dragos/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_dragos_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "dragos/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_dragos_site_status: "preflight_failed"
            fe_dragos_site_postflight_passed: false
            fe_dragos_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_dragos_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "dragos/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              dragos/site: FAILED at '{{ fe_dragos_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_dragos_site_error }}
          tags:
            - always
            - rescue

        - name: "dragos/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "dragos/site":
                  component: "dragos/site"
                  type: "playbook"
                  platform: "dragos"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_dragos_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_dragos_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_dragos_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_dragos_site_started_at | default('') }}"
                  ended_at: "{{ fe_dragos_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_dragos_site_failed_task | default('') }}"
                  error: "{{ fe_dragos_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_dragos_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_dragos_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_dragos_site_status | default('') == 'succeeded' else ['dragos/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "dragos/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_dragos_site_stats_published: true
          tags:
            - always

        - name: "dragos/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              dragos/site failed at '{{ fe_dragos_site_failed_task }}': {{ fe_dragos_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "dragos/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              dragos/site: preflight
              {{ 'passed' if fe_dragos_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "dragos/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "dragos/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_dragos_site_preflight_passed | bool
              - fe_dragos_site_status in ['running', 'succeeded']
            fail_msg: >-
              dragos/site: postflight validation failed - preflight passed
              ={{ fe_dragos_site_preflight_passed | default(false) }},
              status={{ fe_dragos_site_status | default('unknown') }}.
            success_msg: "dragos/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "dragos/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_dragos_site_postflight_passed: true
            fe_dragos_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "dragos/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_dragos_site_status: "failed"
            fe_dragos_site_postflight_passed: false
            fe_dragos_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_dragos_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "dragos/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              dragos/site: FAILED at '{{ fe_dragos_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_dragos_site_error }}
          tags:
            - always
            - rescue

        - name: "dragos/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              dragos/site failed at '{{ fe_dragos_site_failed_task }}': {{ fe_dragos_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "dragos/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_dragos_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_dragos_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "dragos/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "dragos/site":
                  component: "dragos/site"
                  type: "playbook"
                  platform: "dragos"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_dragos_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_dragos_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_dragos_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_dragos_site_started_at | default('') }}"
                  ended_at: "{{ fe_dragos_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_dragos_site_failed_task | default('') }}"
                  error: "{{ fe_dragos_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_dragos_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_dragos_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_dragos_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_dragos_site_status | default('') == 'succeeded' else ['dragos/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_dragos_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "dragos/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_dragos_site_stats_published: true
          tags:
            - always

        - name: "dragos/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              dragos/site: {{ fe_dragos_site_status | default('unknown') }} in
              {{ fe_dragos_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
