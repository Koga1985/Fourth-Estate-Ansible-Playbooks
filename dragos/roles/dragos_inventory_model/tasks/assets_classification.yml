---
# Classify OT assets by vendor, model, and function

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_inventory_model/assets_classification']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_inventory_model_assets_classification_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_inventory_model/assets_classification | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_inventory_model_assets_classification_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_inventory_model_assets_classification_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_inventory_model_assets_classification_status: "running"
    fe_dragos_dragos_inventory_model_assets_classification_preflight_passed: false
    fe_dragos_dragos_inventory_model_assets_classification_postflight_passed: false
    fe_dragos_dragos_inventory_model_assets_classification_failed_task: ""
    fe_dragos_dragos_inventory_model_assets_classification_error: ""
    fe_dragos_dragos_inventory_model_assets_classification_stats_published: false
  tags:
    - always

- name: "dragos/dragos_inventory_model/assets_classification | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_inventory_model/assets_classification | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_inventory_model/assets_classification: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_inventory_model/assets_classification: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_classification | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_inventory_model/assets_classification: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_inventory_model/assets_classification: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_inventory_model_assets_classification_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_classification | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_classification_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve assets for classification
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets?unclassified=true&limit={{ page_size }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: unclassified_assets

    - name: Apply vendor identification
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/classification"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          vendor: "{{ item.detected_vendor | default(item.vendor) }}"
          product_family: "{{ item.product_family | default(omit) }}"
          model: "{{ item.model | default(omit) }}"
          firmware_version: "{{ item.firmware_version | default(omit) }}"
          asset_type: "{{ item.asset_type | default(omit) }}"
          function: "{{ item.function | default(omit) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ unclassified_assets.json.items | default(unclassified_assets.json.data | default([])) }}"
      loop_control:
        label: "{{ item.ip_address | default(item.name) }} - {{ item.detected_vendor | default('Unknown') }}"
      when: not dry_run
      register: asset_classification

    - name: Apply custom classification rules
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.asset_id }}/classification"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ item }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ custom_classifications }}"
      loop_control:
        label: "{{ item.asset_id }} - Custom Rule"
      when: not dry_run and custom_classifications | length > 0
      register: custom_classification

    - name: Identify Siemens assets
      ansible.builtin.set_fact:
        siemens_assets: "{{ (unclassified_assets.json.items | default(unclassified_assets.json.data | default([]))) | selectattr('vendor', 'search', 'Siemens') | list }}"

    - name: Identify Rockwell assets
      ansible.builtin.set_fact:
        rockwell_assets: "{{ (unclassified_assets.json.items | default(unclassified_assets.json.data | default([]))) | selectattr('vendor', 'search', 'Rockwell|Allen-Bradley') | list }}"

    - name: Identify Schneider Electric assets
      ansible.builtin.set_fact:
        schneider_assets: "{{ (unclassified_assets.json.items | default(unclassified_assets.json.data | default([]))) | selectattr('vendor', 'search', 'Schneider') | list }}"

    - name: Identify ABB assets
      ansible.builtin.set_fact:
        abb_assets: "{{ (unclassified_assets.json.items | default(unclassified_assets.json.data | default([]))) | selectattr('vendor', 'search', 'ABB') | list }}"

    - name: Identify GE assets
      ansible.builtin.set_fact:
        ge_assets: "{{ (unclassified_assets.json.items | default(unclassified_assets.json.data | default([]))) | selectattr('vendor', 'search', 'GE|General Electric') | list }}"

    - name: Generate vendor classification report
      ansible.builtin.template:
        src: asset_classification_report.j2
        dest: "{{ artifacts_dir }}/asset_classification_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"

    - name: Save classification results
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/asset_classification_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'siemens': siemens_assets, 'rockwell': rockwell_assets, 'schneider': schneider_assets, 'abb': abb_assets, 'ge': ge_assets} | to_nice_json }}"
        mode: "0644"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_inventory_model/assets_classification | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_inventory_model_assets_classification_preflight_passed | bool
          - fe_dragos_dragos_inventory_model_assets_classification_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_inventory_model/assets_classification: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_inventory_model_assets_classification_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_inventory_model_assets_classification_status | default('unknown') }}.
        success_msg: "dragos/dragos_inventory_model/assets_classification: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_classification | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_classification_postflight_passed: true
        fe_dragos_dragos_inventory_model_assets_classification_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_inventory_model/assets_classification | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_classification_status: "failed"
        fe_dragos_dragos_inventory_model_assets_classification_postflight_passed: false
        fe_dragos_dragos_inventory_model_assets_classification_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_inventory_model_assets_classification_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_classification | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_inventory_model/assets_classification: FAILED at '{{ fe_dragos_dragos_inventory_model_assets_classification_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_inventory_model_assets_classification_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_classification | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_inventory_model/assets_classification failed at '{{ fe_dragos_dragos_inventory_model_assets_classification_failed_task }}': {{ fe_dragos_dragos_inventory_model_assets_classification_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_inventory_model/assets_classification | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_classification_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_inventory_model_assets_classification_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_inventory_model_assets_classification_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_classification | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_inventory_model/assets_classification":
              component: "dragos/dragos_inventory_model/assets_classification"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_inventory_model_assets_classification_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_classification_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_classification_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_inventory_model_assets_classification_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_inventory_model_assets_classification_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_classification_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_inventory_model_assets_classification_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_inventory_model_assets_classification_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_inventory_model_assets_classification_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_inventory_model_assets_classification_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_classification_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_inventory_model_assets_classification_status | default('') == 'succeeded' else ['dragos/dragos_inventory_model/assets_classification'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_classification | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_classification_stats_published: true
      tags:
        - always
