---
# Enrich OT assets with custom attributes and metadata

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_inventory_model/assets_enrichment']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_inventory_model_assets_enrichment_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_inventory_model/assets_enrichment | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_inventory_model_assets_enrichment_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_inventory_model_assets_enrichment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_inventory_model_assets_enrichment_status: "running"
    fe_dragos_dragos_inventory_model_assets_enrichment_preflight_passed: false
    fe_dragos_dragos_inventory_model_assets_enrichment_postflight_passed: false
    fe_dragos_dragos_inventory_model_assets_enrichment_failed_task: ""
    fe_dragos_dragos_inventory_model_assets_enrichment_error: ""
    fe_dragos_dragos_inventory_model_assets_enrichment_stats_published: false
  tags:
    - always

- name: "dragos/dragos_inventory_model/assets_enrichment | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_inventory_model/assets_enrichment | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_inventory_model/assets_enrichment: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_inventory_model/assets_enrichment: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_enrichment | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_inventory_model/assets_enrichment: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_inventory_model/assets_enrichment: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_enrichment | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_enrichment_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve assets for enrichment
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets?limit={{ page_size }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: assets_to_enrich

    - name: Apply custom attributes to assets
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/attributes"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          custom_attributes: "{{ item.custom_attributes | default({}) | combine(default_custom_attributes) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ assets_to_enrich.json.items | default(assets_to_enrich.json.data | default([])) }}"
      loop_control:
        label: "{{ item.name | default(item.ip_address) }}"
      when: not dry_run
      register: asset_enrichment

    - name: Add business context to assets
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/context"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          business_unit: "{{ item.business_unit | default(omit) }}"
          cost_center: "{{ item.cost_center | default(omit) }}"
          owner: "{{ item.owner | default(omit) }}"
          support_contact: "{{ item.support_contact | default(omit) }}"
          location: "{{ item.location | default(omit) }}"
          building: "{{ item.building | default(omit) }}"
          floor: "{{ item.floor | default(omit) }}"
          room: "{{ item.room | default(omit) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ assets_to_enrich.json.items | default(assets_to_enrich.json.data | default([])) }}"
      loop_control:
        label: "{{ item.name | default(item.ip_address) }} - Business Context"
      when: not dry_run and add_business_context
      register: asset_context

    - name: Add compliance tags to assets
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/compliance"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          compliance_frameworks:
            - framework: "NERC CIP"
              applicable: "{{ item.nerc_cip_applicable | default(true) }}"
              controls: "{{ item.nerc_cip_controls | default([]) }}"
            - framework: "IEC 62443"
              applicable: "{{ item.iec62443_applicable | default(true) }}"
              security_level: "{{ item.iec62443_level | default('SL2') }}"
            - framework: "NIST 800-82"
              applicable: "{{ item.nist_applicable | default(true) }}"
              controls: "{{ item.nist_controls | default([]) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ assets_to_enrich.json.items | default(assets_to_enrich.json.data | default([])) }}"
      loop_control:
        label: "{{ item.name | default(item.ip_address) }} - Compliance Tags"
      when: not dry_run and add_compliance_tags
      register: asset_compliance

    - name: Add lifecycle information
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/lifecycle"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          install_date: "{{ item.install_date | default(omit) }}"
          warranty_expiration: "{{ item.warranty_expiration | default(omit) }}"
          end_of_life: "{{ item.end_of_life | default(omit) }}"
          end_of_support: "{{ item.end_of_support | default(omit) }}"
          last_maintenance: "{{ item.last_maintenance | default(omit) }}"
          next_maintenance: "{{ item.next_maintenance | default(omit) }}"
          lifecycle_stage: "{{ item.lifecycle_stage | default('production') }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ assets_to_enrich.json.items | default(assets_to_enrich.json.data | default([])) }}"
      loop_control:
        label: "{{ item.name | default(item.ip_address) }} - Lifecycle"
      when: not dry_run and add_lifecycle_info
      register: asset_lifecycle

    - name: Save enrichment results
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/asset_enrichment_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'enrichment': asset_enrichment, 'context': asset_context, 'compliance': asset_compliance, 'lifecycle': asset_lifecycle} | to_nice_json }}"
        mode: "0644"
      when: asset_enrichment is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_inventory_model/assets_enrichment | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_inventory_model_assets_enrichment_preflight_passed | bool
          - fe_dragos_dragos_inventory_model_assets_enrichment_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_inventory_model/assets_enrichment: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_inventory_model_assets_enrichment_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_inventory_model_assets_enrichment_status | default('unknown') }}.
        success_msg: "dragos/dragos_inventory_model/assets_enrichment: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_enrichment | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_enrichment_postflight_passed: true
        fe_dragos_dragos_inventory_model_assets_enrichment_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_inventory_model/assets_enrichment | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_enrichment_status: "failed"
        fe_dragos_dragos_inventory_model_assets_enrichment_postflight_passed: false
        fe_dragos_dragos_inventory_model_assets_enrichment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_inventory_model_assets_enrichment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_enrichment | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_inventory_model/assets_enrichment: FAILED at '{{ fe_dragos_dragos_inventory_model_assets_enrichment_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_inventory_model_assets_enrichment_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_enrichment | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_inventory_model/assets_enrichment failed at '{{ fe_dragos_dragos_inventory_model_assets_enrichment_failed_task }}': {{ fe_dragos_dragos_inventory_model_assets_enrichment_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_inventory_model/assets_enrichment | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_enrichment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_inventory_model_assets_enrichment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_inventory_model_assets_enrichment_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_enrichment | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_inventory_model/assets_enrichment":
              component: "dragos/dragos_inventory_model/assets_enrichment"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_inventory_model_assets_enrichment_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_inventory_model_assets_enrichment_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_enrichment_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_inventory_model_assets_enrichment_status | default('') == 'succeeded' else ['dragos/dragos_inventory_model/assets_enrichment'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_enrichment | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_enrichment_stats_published: true
      tags:
        - always
