---
# Assign OT assets to network zones based on Purdue Model

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_inventory_model/assets_zones']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_inventory_model_assets_zones_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_inventory_model/assets_zones | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_inventory_model_assets_zones_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_inventory_model_assets_zones_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_inventory_model_assets_zones_status: "running"
    fe_dragos_dragos_inventory_model_assets_zones_preflight_passed: false
    fe_dragos_dragos_inventory_model_assets_zones_postflight_passed: false
    fe_dragos_dragos_inventory_model_assets_zones_failed_task: ""
    fe_dragos_dragos_inventory_model_assets_zones_error: ""
    fe_dragos_dragos_inventory_model_assets_zones_stats_published: false
  tags:
    - always

- name: "dragos/dragos_inventory_model/assets_zones | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_inventory_model/assets_zones | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_inventory_model/assets_zones: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_inventory_model/assets_zones: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_zones | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_inventory_model/assets_zones: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_inventory_model/assets_zones: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_inventory_model_assets_zones_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_zones | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_zones_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve assets for zone assignment
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets?limit={{ page_size }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: assets_for_zones

    - name: Apply network zone assignments
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/{{ item.id }}/zone"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          zone: "{{ item.zone | default(zone_assignment_rules[item.asset_type] | default('Unknown')) }}"
          purdue_level: "{{ item.purdue_level | default(purdue_level_mapping[item.asset_type] | default('L2')) }}"
          vlan_id: "{{ item.vlan_id | default(omit) }}"
          subnet: "{{ item.subnet | default(omit) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ assets_for_zones.json.items | default(assets_for_zones.json.data | default([])) }}"
      loop_control:
        label: "{{ item.name | default(item.ip_address) }} - Zone Assignment"
      when: not dry_run
      register: zone_assignments

    - name: Apply zone-based segmentation policies
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/zones/{{ item }}/policies"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          zone: "{{ item }}"
          allowed_communications: "{{ zone_policies[item].allowed_communications | default([]) }}"
          blocked_protocols: "{{ zone_policies[item].blocked_protocols | default([]) }}"
          isolation_level: "{{ zone_policies[item].isolation_level | default('medium') }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ network_zones }}"
      when: not dry_run and apply_zone_policies
      register: zone_policy_assignments

    - name: Identify zone boundary crossings
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/zones/boundary_crossings"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: zone_boundaries

    - name: Generate zone topology map
      ansible.builtin.template:
        src: zone_topology_map.j2
        dest: "{{ artifacts_dir }}/zone_topology_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"

    - name: Save zone assignments
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/zone_assignments_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'assignments': zone_assignments, 'policies': zone_policy_assignments, 'boundaries': zone_boundaries} | to_nice_json }}"
        mode: "0644"
      when: zone_assignments is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_inventory_model/assets_zones | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_inventory_model_assets_zones_preflight_passed | bool
          - fe_dragos_dragos_inventory_model_assets_zones_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_inventory_model/assets_zones: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_inventory_model_assets_zones_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_inventory_model_assets_zones_status | default('unknown') }}.
        success_msg: "dragos/dragos_inventory_model/assets_zones: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_zones | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_zones_postflight_passed: true
        fe_dragos_dragos_inventory_model_assets_zones_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_inventory_model/assets_zones | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_zones_status: "failed"
        fe_dragos_dragos_inventory_model_assets_zones_postflight_passed: false
        fe_dragos_dragos_inventory_model_assets_zones_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_inventory_model_assets_zones_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_zones | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_inventory_model/assets_zones: FAILED at '{{ fe_dragos_dragos_inventory_model_assets_zones_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_inventory_model_assets_zones_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_zones | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_inventory_model/assets_zones failed at '{{ fe_dragos_dragos_inventory_model_assets_zones_failed_task }}': {{ fe_dragos_dragos_inventory_model_assets_zones_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_inventory_model/assets_zones | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_zones_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_inventory_model_assets_zones_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_inventory_model_assets_zones_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_zones | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_inventory_model/assets_zones":
              component: "dragos/dragos_inventory_model/assets_zones"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_inventory_model_assets_zones_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_zones_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_zones_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_inventory_model_assets_zones_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_inventory_model_assets_zones_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_zones_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_inventory_model_assets_zones_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_inventory_model_assets_zones_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_inventory_model_assets_zones_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_inventory_model_assets_zones_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_zones_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_inventory_model_assets_zones_status | default('') == 'succeeded' else ['dragos/dragos_inventory_model/assets_zones'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_zones | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_zones_stats_published: true
      tags:
        - always
