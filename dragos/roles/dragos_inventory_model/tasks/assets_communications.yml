---
# Identify and analyze asset communication patterns

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_inventory_model/assets_communications']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_inventory_model_assets_communications_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_inventory_model/assets_communications | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_inventory_model_assets_communications_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_inventory_model_assets_communications_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_inventory_model_assets_communications_status: "running"
    fe_dragos_dragos_inventory_model_assets_communications_preflight_passed: false
    fe_dragos_dragos_inventory_model_assets_communications_postflight_passed: false
    fe_dragos_dragos_inventory_model_assets_communications_failed_task: ""
    fe_dragos_dragos_inventory_model_assets_communications_error: ""
    fe_dragos_dragos_inventory_model_assets_communications_stats_published: false
  tags:
    - always

- name: "dragos/dragos_inventory_model/assets_communications | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_inventory_model/assets_communications | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_inventory_model/assets_communications: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_inventory_model/assets_communications: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_communications | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_inventory_model/assets_communications: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_inventory_model/assets_communications: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_inventory_model_assets_communications_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_communications | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_communications_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve asset communication patterns
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications/patterns?timerange={{ communication_timerange }}&limit={{ page_size }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: communication_patterns

    - name: Analyze communication frequency
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications/frequency_analysis"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: frequency_analysis

    - name: Identify periodic communications
      ansible.builtin.set_fact:
        periodic_communications: "{{ communication_patterns.json.patterns | default([]) | selectattr('pattern_type', 'equalto', 'periodic') | list }}"

    - name: Identify sporadic communications
      ansible.builtin.set_fact:
        sporadic_communications: "{{ communication_patterns.json.patterns | default([]) | selectattr('pattern_type', 'equalto', 'sporadic') | list }}"

    - name: Identify anomalous communications
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications/anomalies?timerange={{ communication_timerange }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: communication_anomalies

    - name: Analyze inter-zone communications
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications/inter_zone"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: inter_zone_communications

    - name: Identify unexpected external communications
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications/external"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: external_communications

    - name: Flag suspicious external communications
      ansible.builtin.set_fact:
        suspicious_external_comms: "{{ external_communications.json.communications | default([]) | selectattr('expected', 'equalto', false) | list }}"

    - name: Generate communication pattern report
      ansible.builtin.template:
        src: communication_patterns_report.j2
        dest: "{{ artifacts_dir }}/communication_patterns_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"

    - name: Save communication analysis
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/communication_analysis_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'patterns': communication_patterns, 'frequency': frequency_analysis, 'anomalies': communication_anomalies, 'inter_zone': inter_zone_communications, 'external': external_communications, 'suspicious': suspicious_external_comms} | to_nice_json }}"
        mode: "0644"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_inventory_model/assets_communications | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_inventory_model_assets_communications_preflight_passed | bool
          - fe_dragos_dragos_inventory_model_assets_communications_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_inventory_model/assets_communications: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_inventory_model_assets_communications_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_inventory_model_assets_communications_status | default('unknown') }}.
        success_msg: "dragos/dragos_inventory_model/assets_communications: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_communications | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_communications_postflight_passed: true
        fe_dragos_dragos_inventory_model_assets_communications_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_inventory_model/assets_communications | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_communications_status: "failed"
        fe_dragos_dragos_inventory_model_assets_communications_postflight_passed: false
        fe_dragos_dragos_inventory_model_assets_communications_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_inventory_model_assets_communications_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_communications | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_inventory_model/assets_communications: FAILED at '{{ fe_dragos_dragos_inventory_model_assets_communications_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_inventory_model_assets_communications_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_communications | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_inventory_model/assets_communications failed at '{{ fe_dragos_dragos_inventory_model_assets_communications_failed_task }}': {{ fe_dragos_dragos_inventory_model_assets_communications_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_inventory_model/assets_communications | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_communications_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_inventory_model_assets_communications_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_inventory_model_assets_communications_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_communications | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_inventory_model/assets_communications":
              component: "dragos/dragos_inventory_model/assets_communications"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_inventory_model_assets_communications_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_communications_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_communications_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_inventory_model_assets_communications_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_inventory_model_assets_communications_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_communications_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_inventory_model_assets_communications_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_inventory_model_assets_communications_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_inventory_model_assets_communications_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_inventory_model_assets_communications_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_communications_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_inventory_model_assets_communications_status | default('') == 'succeeded' else ['dragos/dragos_inventory_model/assets_communications'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_communications | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_communications_stats_published: true
      tags:
        - always
