---
# Map asset relationships and dependencies in OT environments

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_inventory_model/assets_relationships']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_inventory_model_assets_relationships_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_inventory_model/assets_relationships | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_inventory_model_assets_relationships_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_inventory_model_assets_relationships_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_inventory_model_assets_relationships_status: "running"
    fe_dragos_dragos_inventory_model_assets_relationships_preflight_passed: false
    fe_dragos_dragos_inventory_model_assets_relationships_postflight_passed: false
    fe_dragos_dragos_inventory_model_assets_relationships_failed_task: ""
    fe_dragos_dragos_inventory_model_assets_relationships_error: ""
    fe_dragos_dragos_inventory_model_assets_relationships_stats_published: false
  tags:
    - always

- name: "dragos/dragos_inventory_model/assets_relationships | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_inventory_model/assets_relationships | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_inventory_model/assets_relationships: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_inventory_model/assets_relationships: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_relationships | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_inventory_model/assets_relationships: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_inventory_model/assets_relationships: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_inventory_model_assets_relationships_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_relationships | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_relationships_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve asset communication data
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/communications?timerange={{ relationship_timerange }}&limit={{ page_size }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: asset_communications

    - name: Build asset relationship graph
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/graph"
        method: POST
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          timerange: "{{ relationship_timerange }}"
          include_protocols: true
          include_frequency: true
          min_communication_count: "{{ min_communication_count }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      when: not dry_run
      register: relationship_graph

    - name: Identify master-slave relationships
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/master_slave"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: master_slave_relationships

    - name: Identify HMI-PLC relationships
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/hmi_plc"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: hmi_plc_relationships

    - name: Identify engineering station access patterns
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/engineering_access"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: engineering_access

    - name: Identify historian data sources
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/historian_sources"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: historian_sources

    - name: Detect dependency chains
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/assets/relationships/dependency_chains"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: dependency_chains

    - name: Identify single points of failure
      ansible.builtin.set_fact:
        single_points_of_failure: "{{ dependency_chains.json.chains | selectattr('redundancy', 'equalto', false) | selectattr('critical', 'equalto', true) | list }}"

    - name: Generate relationship diagram
      ansible.builtin.template:
        src: asset_relationships_diagram.j2
        dest: "{{ artifacts_dir }}/asset_relationships_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"

    - name: Save relationship data
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/asset_relationships_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'graph': relationship_graph, 'master_slave': master_slave_relationships, 'hmi_plc': hmi_plc_relationships, 'engineering': engineering_access, 'historian': historian_sources, 'spof': single_points_of_failure} | to_nice_json }}"
        mode: "0644"
      when: relationship_graph is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_inventory_model/assets_relationships | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_inventory_model_assets_relationships_preflight_passed | bool
          - fe_dragos_dragos_inventory_model_assets_relationships_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_inventory_model/assets_relationships: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_inventory_model_assets_relationships_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_inventory_model_assets_relationships_status | default('unknown') }}.
        success_msg: "dragos/dragos_inventory_model/assets_relationships: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_inventory_model/assets_relationships | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_relationships_postflight_passed: true
        fe_dragos_dragos_inventory_model_assets_relationships_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_inventory_model/assets_relationships | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_relationships_status: "failed"
        fe_dragos_dragos_inventory_model_assets_relationships_postflight_passed: false
        fe_dragos_dragos_inventory_model_assets_relationships_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_inventory_model_assets_relationships_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_relationships | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_inventory_model/assets_relationships: FAILED at '{{ fe_dragos_dragos_inventory_model_assets_relationships_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_inventory_model_assets_relationships_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_inventory_model/assets_relationships | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_inventory_model/assets_relationships failed at '{{ fe_dragos_dragos_inventory_model_assets_relationships_failed_task }}': {{ fe_dragos_dragos_inventory_model_assets_relationships_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_inventory_model/assets_relationships | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_relationships_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_inventory_model_assets_relationships_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_inventory_model_assets_relationships_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_relationships | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_inventory_model/assets_relationships":
              component: "dragos/dragos_inventory_model/assets_relationships"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_inventory_model_assets_relationships_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_relationships_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_inventory_model_assets_relationships_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_inventory_model_assets_relationships_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_inventory_model_assets_relationships_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_relationships_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_inventory_model_assets_relationships_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_inventory_model_assets_relationships_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_inventory_model_assets_relationships_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_inventory_model_assets_relationships_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_inventory_model_assets_relationships_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_inventory_model_assets_relationships_status | default('') == 'succeeded' else ['dragos/dragos_inventory_model/assets_relationships'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_inventory_model/assets_relationships | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_inventory_model_assets_relationships_stats_published: true
      tags:
        - always
