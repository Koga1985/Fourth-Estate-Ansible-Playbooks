
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_governance_pack/audit_compliance_pack']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_governance_pack_audit_compliance_pack_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_governance_pack/audit_compliance_pack | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_governance_pack_audit_compliance_pack_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_governance_pack_audit_compliance_pack_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_governance_pack_audit_compliance_pack_status: "running"
    fe_dragos_dragos_governance_pack_audit_compliance_pack_preflight_passed: false
    fe_dragos_dragos_governance_pack_audit_compliance_pack_postflight_passed: false
    fe_dragos_dragos_governance_pack_audit_compliance_pack_failed_task: ""
    fe_dragos_dragos_governance_pack_audit_compliance_pack_error: ""
    fe_dragos_dragos_governance_pack_audit_compliance_pack_stats_published: false
  tags:
    - always

- name: "dragos/dragos_governance_pack/audit_compliance_pack | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_governance_pack/audit_compliance_pack: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_governance_pack/audit_compliance_pack: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_governance_pack/audit_compliance_pack: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_governance_pack/audit_compliance_pack: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_governance_pack_audit_compliance_pack_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Bundle CSVs
      ansible.builtin.archive:
        path:
          - "{{ artifacts_dir }}/alerts_filtered.csv"
          - "{{ artifacts_dir }}/audit_events.csv"
          - "{{ artifacts_dir }}/rbac_violations.csv"
        dest: "{{ artifacts_dir }}/compliance_pack.zip"
        format: zip

    # --------------------------- evidence delivery --------------------------
    # Writing the report to artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}"
        patterns: "compliance_pack.zip"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "dragos/dragos_governance_pack/audit_compliance_pack":
              component: "dragos/dragos_governance_pack/audit_compliance_pack"
              platform: "dragos"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_governance_pack_audit_compliance_pack_preflight_passed | bool
          - fe_dragos_dragos_governance_pack_audit_compliance_pack_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_governance_pack/audit_compliance_pack: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_governance_pack_audit_compliance_pack_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_governance_pack_audit_compliance_pack_status | default('unknown') }}.
        success_msg: "dragos/dragos_governance_pack/audit_compliance_pack: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_governance_pack_audit_compliance_pack_postflight_passed: true
        fe_dragos_dragos_governance_pack_audit_compliance_pack_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_governance_pack_audit_compliance_pack_status: "failed"
        fe_dragos_dragos_governance_pack_audit_compliance_pack_postflight_passed: false
        fe_dragos_dragos_governance_pack_audit_compliance_pack_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_governance_pack_audit_compliance_pack_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_governance_pack/audit_compliance_pack: FAILED at '{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_governance_pack_audit_compliance_pack_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_governance_pack/audit_compliance_pack failed at '{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_failed_task }}': {{ fe_dragos_dragos_governance_pack_audit_compliance_pack_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_governance_pack_audit_compliance_pack_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_governance_pack_audit_compliance_pack_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_governance_pack_audit_compliance_pack_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_governance_pack/audit_compliance_pack":
              component: "dragos/dragos_governance_pack/audit_compliance_pack"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_governance_pack_audit_compliance_pack_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_governance_pack_audit_compliance_pack_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_governance_pack_audit_compliance_pack_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_governance_pack_audit_compliance_pack_status | default('') == 'succeeded' else ['dragos/dragos_governance_pack/audit_compliance_pack'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_governance_pack/audit_compliance_pack | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_governance_pack_audit_compliance_pack_stats_published: true
      tags:
        - always
