---
# Update Dragos sensor software for security and feature enhancements

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_update']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_update_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_update | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_update_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_update_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_update_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_update_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_update_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_update_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_update_error: ""
    fe_dragos_dragos_sensor_ops_sensor_update_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_update | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_update | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_update: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_update: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_update | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_update: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_update: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_update_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_update | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_update_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check current sensor versions
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/version"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Version Check"
      register: sensor_versions

    - name: Retrieve available updates
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/updates/available"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      register: available_updates

    - name: Validate update version exists
      ansible.builtin.assert:
        that:
          - sensor_update_version in (available_updates.json.versions | map(attribute='version') | list)
        fail_msg: "Update version {{ sensor_update_version }} is not available"
        success_msg: "Update version {{ sensor_update_version }} is available"

    - name: Create sensor backup before update
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/backup"
        method: POST
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          backup_type: "pre_update"
          description: "Backup before update to {{ sensor_update_version }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Backup"
      when: not dry_run and backup_before_update
      register: sensor_backups

    - name: Schedule sensor updates
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/update"
        method: POST
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          target_version: "{{ sensor_update_version }}"
          schedule_time: "{{ item.update_schedule | default(update_schedule) }}"
          maintenance_window: "{{ maintenance_window }}"
          rollback_on_failure: "{{ auto_rollback }}"
        status_code: [200, 201, 202]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Schedule Update"
      when: not dry_run
      register: sensor_update_jobs

    - name: Monitor update progress
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/update/status"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Update Status"
      register: update_status
      until: update_status.json.status in ['completed', 'failed']
      retries: "{{ update_max_retries }}"
      delay: "{{ update_check_interval }}"
      when: not dry_run and wait_for_completion

    - name: Verify sensor versions after update
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/version"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Post-Update Version"
      register: sensor_versions_post
      when: not dry_run and wait_for_completion

    - name: Generate update report
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_update_report_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'pre_versions': sensor_versions, 'update_jobs': sensor_update_jobs, 'post_versions': sensor_versions_post, 'status': update_status} | to_nice_json }}"
        mode: "0644"
      when: sensor_update_jobs is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_update | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_update_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_update_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_update: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_update_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_update_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_update: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_update | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_update_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_update_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_update | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_update_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_update_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_update_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_update_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_update | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_update: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_update_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_update_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_update | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_update failed at '{{ fe_dragos_dragos_sensor_ops_sensor_update_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_update_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_update | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_update_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_update_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_update_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_update | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_update":
              component: "dragos/dragos_sensor_ops/sensor_update"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_update_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_update_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_update_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_update_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_update_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_update_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_update_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_update_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_update_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_update_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_update_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_update_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_update'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_update | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_update_stats_published: true
      tags:
        - always
