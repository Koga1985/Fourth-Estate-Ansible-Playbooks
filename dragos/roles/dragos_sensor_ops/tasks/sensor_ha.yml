---
# Configure Dragos sensor high availability for mission-critical OT monitoring

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_ha']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_ha_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_ha | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_ha_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_ha_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_ha_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_ha_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_ha_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_ha_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_ha_error: ""
    fe_dragos_dragos_sensor_ops_sensor_ha_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_ha | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_ha | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_ha: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_ha: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_ha | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_ha: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_ha: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_ha | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_ha_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure sensor clustering
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/ha/cluster"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          cluster_enabled: true
          cluster_id: "{{ item.cluster_id }}"
          node_role: "{{ item.node_role | default('active') }}"
          peer_sensors: "{{ item.peer_sensors | default([]) }}"
          heartbeat_interval: "{{ ha_heartbeat_interval }}"
          failover_timeout: "{{ ha_failover_timeout }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - HA Clustering"
      when: not dry_run and item.cluster_id is defined
      register: sensor_clustering

    - name: Configure state synchronization
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/ha/sync"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          sync_enabled: true
          sync_interval: "{{ state_sync_interval }}"
          sync_components:
            - flows
            - assets
            - alerts
            - configuration
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - State Sync"
      when: not dry_run and item.cluster_id is defined
      register: sensor_state_sync

    - name: Configure automatic failover
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/ha/failover"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          auto_failover_enabled: true
          failback_enabled: "{{ auto_failback }}"
          health_check_interval: "{{ health_check_interval }}"
          failure_threshold: "{{ failure_threshold }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Auto Failover"
      when: not dry_run and item.cluster_id is defined
      register: sensor_failover

    - name: Configure virtual IP for HA
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/ha/vip"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          virtual_ip: "{{ item.virtual_ip }}"
          vip_interface: "{{ item.vip_interface | default('eth0') }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Virtual IP"
      when: not dry_run and item.virtual_ip is defined
      register: sensor_vip

    - name: Verify HA cluster status
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/clusters/{{ item.cluster_id }}/status"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors | selectattr('cluster_id', 'defined') | unique(attribute='cluster_id') | list }}"
      loop_control:
        label: "Cluster {{ item.cluster_id }}"
      register: cluster_status

    - name: Save HA configuration
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_ha_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'clustering': sensor_clustering, 'state_sync': sensor_state_sync, 'failover': sensor_failover, 'vip': sensor_vip, 'cluster_status': cluster_status} | to_nice_json }}"
        mode: "0644"
      when: sensor_clustering is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_ha | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_ha_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_ha_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_ha: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_ha_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_ha_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_ha: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_ha | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_ha_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_ha_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_ha | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_ha_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_ha_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_ha_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_ha_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_ha | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_ha: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_ha_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_ha_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_ha | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_ha failed at '{{ fe_dragos_dragos_sensor_ops_sensor_ha_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_ha_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_ha | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_ha_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_ha_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_ha_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_ha | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_ha":
              component: "dragos/dragos_sensor_ops/sensor_ha"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_ha_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_ha_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_ha_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_ha_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_ha'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_ha | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_ha_stats_published: true
      tags:
        - always
