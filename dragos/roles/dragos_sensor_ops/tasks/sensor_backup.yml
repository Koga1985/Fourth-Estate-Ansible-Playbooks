---
# Backup Dragos sensor configurations for disaster recovery

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_backup']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_backup_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_backup | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_backup_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_backup_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_backup_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_backup_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_backup_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_backup_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_backup_error: ""
    fe_dragos_dragos_sensor_ops_sensor_backup_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_backup | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_backup | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_backup: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_backup: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_backup | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_backup: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_backup: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_backup | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_backup_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create sensor configuration backup
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/backup"
        method: POST
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          backup_type: "full"
          description: "{{ backup_description | default('Scheduled backup') }}"
          include_pcap: "{{ backup_include_pcap }}"
          include_logs: "{{ backup_include_logs }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Create Backup"
      when: not dry_run
      register: sensor_backup_jobs

    - name: Wait for backup completion
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/backups/{{ item.json.backup_id }}/status"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensor_backup_jobs.results }}"
      loop_control:
        label: "{{ item.item.name }} - Backup Status"
      register: backup_status
      until: backup_status.json.status in ['completed', 'failed']
      retries: 30
      delay: 10
      when: not dry_run and wait_for_backup

    - name: Download sensor backups
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/backups/{{ item.json.backup_id }}/download"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        dest: "{{ artifacts_dir }}/sensor_backup_{{ item.item.name }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensor_backup_jobs.results }}"
      loop_control:
        label: "{{ item.item.name }} - Download Backup"
      when: not dry_run and download_backups

    - name: List existing backups
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/backups"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - List Backups"
      register: existing_backups

    - name: Cleanup old backups
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/backups/{{ item.1.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        status_code: [200, 204]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ existing_backups.results | subelements('json.backups', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.item.name }} - Delete backup {{ item.1.id }}"
      when:
        - not dry_run
        - cleanup_old_backups
        - item.1.created_at < (ansible_date_time.epoch | int - (backup_retention_days * 86400)) | string

    - name: Save backup report
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_backup_report_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'backup_jobs': sensor_backup_jobs, 'backup_status': backup_status, 'existing_backups': existing_backups} | to_nice_json }}"
        mode: "0644"
      when: sensor_backup_jobs is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_backup | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_backup_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_backup_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_backup: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_backup_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_backup_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_backup: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_backup | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_backup_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_backup_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_backup | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_backup_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_backup_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_backup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_backup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_backup | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_backup: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_backup_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_backup_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_backup | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_backup failed at '{{ fe_dragos_dragos_sensor_ops_sensor_backup_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_backup_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_backup | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_backup_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_backup_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_backup_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_backup | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_backup":
              component: "dragos/dragos_sensor_ops/sensor_backup"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_backup_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_backup_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_backup_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_backup_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_backup'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_backup | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_backup_stats_published: true
      tags:
        - always
