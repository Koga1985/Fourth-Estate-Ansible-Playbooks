---
# Optimize Dragos sensor performance for high-traffic OT environments

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_performance']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_performance_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_performance | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_performance_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_performance_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_performance_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_performance_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_performance_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_performance_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_performance_error: ""
    fe_dragos_dragos_sensor_ops_sensor_performance_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_performance | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_performance | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_performance: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_performance: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_performance | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_performance: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_performance: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_performance | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_performance_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure CPU affinity for packet processing
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/performance/cpu"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          cpu_affinity_enabled: true
          capture_cpus: "{{ item.capture_cpus | default(capture_cpu_cores) }}"
          analysis_cpus: "{{ item.analysis_cpus | default(analysis_cpu_cores) }}"
          numa_aware: "{{ numa_aware_processing }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - CPU Affinity"
      when: not dry_run
      register: sensor_cpu_config

    - name: Configure memory allocation
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/performance/memory"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          packet_buffer_mb: "{{ item.packet_buffer_mb | default(packet_buffer_mb) }}"
          flow_cache_mb: "{{ item.flow_cache_mb | default(flow_cache_mb) }}"
          asset_cache_mb: "{{ item.asset_cache_mb | default(asset_cache_mb) }}"
          protocol_cache_mb: "{{ item.protocol_cache_mb | default(protocol_cache_mb) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Memory Allocation"
      when: not dry_run
      register: sensor_memory_config

    - name: Configure packet processing threads
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/performance/threads"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          capture_threads: "{{ item.capture_threads | default(capture_threads) }}"
          worker_threads: "{{ item.worker_threads | default(worker_threads) }}"
          analysis_threads: "{{ item.analysis_threads | default(analysis_threads) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Thread Config"
      when: not dry_run
      register: sensor_thread_config

    - name: Enable kernel bypass for high-performance capture
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/performance/kernel_bypass"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: "{{ kernel_bypass_enabled }}"
          method: "{{ kernel_bypass_method }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Kernel Bypass"
      when: not dry_run and kernel_bypass_enabled
      register: sensor_kernel_bypass

    - name: Configure flow timeouts for OT protocols
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/performance/flow_timeouts"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          tcp_timeout: "{{ tcp_flow_timeout }}"
          udp_timeout: "{{ udp_flow_timeout }}"
          icmp_timeout: "{{ icmp_flow_timeout }}"
          ot_protocol_timeout: "{{ ot_protocol_timeout }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Flow Timeouts"
      when: not dry_run
      register: sensor_flow_timeouts

    - name: Save performance configuration
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_performance_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'cpu': sensor_cpu_config, 'memory': sensor_memory_config, 'threads': sensor_thread_config, 'kernel_bypass': sensor_kernel_bypass, 'flow_timeouts': sensor_flow_timeouts} | to_nice_json }}"
        mode: "0644"
      when: sensor_cpu_config is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_performance | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_performance_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_performance_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_performance: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_performance_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_performance_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_performance: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_performance | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_performance_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_performance_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_performance | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_performance_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_performance_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_performance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_performance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_performance | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_performance: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_performance_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_performance_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_performance | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_performance failed at '{{ fe_dragos_dragos_sensor_ops_sensor_performance_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_performance_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_performance | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_performance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_performance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_performance_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_performance | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_performance":
              component: "dragos/dragos_sensor_ops/sensor_performance"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_performance_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_performance_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_performance_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_performance_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_performance'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_performance | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_performance_stats_published: true
      tags:
        - always
