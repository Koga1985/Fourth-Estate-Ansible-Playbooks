---
# Configure Dragos sensor storage for PCAP and metadata retention

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_storage']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_storage_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_storage | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_storage_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_storage_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_storage_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_storage_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_storage_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_storage_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_storage_error: ""
    fe_dragos_dragos_sensor_ops_sensor_storage_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_storage | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_storage | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_storage: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_storage: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_storage | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_storage: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_storage: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_storage | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_storage_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure PCAP storage settings
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/storage/pcap"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          retention_days: "{{ item.pcap_retention_days | default(pcap_retention_days) }}"
          max_storage_gb: "{{ item.pcap_max_storage_gb | default(pcap_max_storage_gb) }}"
          compression_enabled: "{{ pcap_compression }}"
          rotation_policy: "{{ pcap_rotation_policy }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - PCAP Storage"
      when: not dry_run
      register: sensor_pcap_storage

    - name: Configure metadata storage settings
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/storage/metadata"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          retention_days: "{{ item.metadata_retention_days | default(metadata_retention_days) }}"
          max_storage_gb: "{{ item.metadata_max_storage_gb | default(metadata_max_storage_gb) }}"
          indexing_enabled: true
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Metadata Storage"
      when: not dry_run
      register: sensor_metadata_storage

    - name: Configure storage cleanup policies
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/storage/cleanup"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          auto_cleanup_enabled: true
          disk_threshold_percent: "{{ disk_threshold_percent }}"
          cleanup_priority: "{{ cleanup_priority }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Cleanup Policy"
      when: not dry_run
      register: sensor_cleanup

    - name: Configure storage alerting thresholds
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/storage/alerts"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          warning_threshold_percent: "{{ storage_warning_threshold }}"
          critical_threshold_percent: "{{ storage_critical_threshold }}"
          alert_frequency: "{{ storage_alert_frequency }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Storage Alerts"
      when: not dry_run
      register: sensor_storage_alerts

    - name: Save storage configuration
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_storage_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'pcap': sensor_pcap_storage, 'metadata': sensor_metadata_storage, 'cleanup': sensor_cleanup, 'alerts': sensor_storage_alerts} | to_nice_json }}"
        mode: "0644"
      when: sensor_pcap_storage is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_storage | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_storage_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_storage_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_storage: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_storage_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_storage_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_storage: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_storage | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_storage_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_storage_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_storage | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_storage_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_storage_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_storage_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_storage_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_storage | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_storage: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_storage_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_storage_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_storage | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_storage failed at '{{ fe_dragos_dragos_sensor_ops_sensor_storage_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_storage_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_storage | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_storage_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_storage_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_storage_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_storage | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_storage":
              component: "dragos/dragos_sensor_ops/sensor_storage"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_storage_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_storage_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_storage_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_storage_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_storage'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_storage | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_storage_stats_published: true
      tags:
        - always
