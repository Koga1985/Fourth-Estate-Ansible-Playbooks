---
# Monitor Dragos sensor health and performance metrics

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_health']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_health_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_health | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_health_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_health_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_health_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_health_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_health_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_health_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_health_error: ""
    fe_dragos_dragos_sensor_ops_sensor_health_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_health | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_health | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_health: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_health: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_health | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_health: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_health: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_health_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_health | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_health_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve sensor health status
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/health"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Health Check"
      register: sensor_health

    - name: Check sensor connectivity to platform
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/connectivity"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Connectivity"
      register: sensor_connectivity

    - name: Retrieve sensor resource utilization
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/metrics"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Metrics"
      register: sensor_metrics

    - name: Check sensor packet capture statistics
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/capture/stats"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Capture Stats"
      register: sensor_capture_stats

    - name: Check sensor storage utilization
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/storage"
        method: GET
        headers:
          Authorization: "Bearer {{ dragos_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Storage"
      register: sensor_storage_stats

    - name: Identify unhealthy sensors
      ansible.builtin.set_fact:
        unhealthy_sensors: "{{ sensor_health.results | selectattr('json.status', 'ne', 'healthy') | map(attribute='json.sensor_name') | list }}"

    - name: Alert on unhealthy sensors
      ansible.builtin.debug:
        msg: "WARNING: Unhealthy sensors detected: {{ unhealthy_sensors | join(', ') }}"
      when: unhealthy_sensors | length > 0
      changed_when: true
      notify: Alert on sensor health issues

    - name: Identify sensors with high packet drop rate
      ansible.builtin.set_fact:
        high_drop_sensors: "{{ sensor_capture_stats.results | selectattr('json.drop_rate', '>', packet_drop_threshold) | map(attribute='json.sensor_name') | list }}"

    - name: Alert on high packet drop
      ansible.builtin.debug:
        msg: "WARNING: High packet drop rate on sensors: {{ high_drop_sensors | join(', ') }}"
      when: high_drop_sensors | length > 0
      changed_when: true
      notify: Alert on packet drop

    - name: Generate sensor health report
      ansible.builtin.template:
        src: sensor_health_report.j2
        dest: "{{ artifacts_dir }}/sensor_health_report_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"

    - name: Save sensor health data
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_health_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'health': sensor_health, 'connectivity': sensor_connectivity, 'metrics': sensor_metrics, 'capture_stats': sensor_capture_stats, 'storage': sensor_storage_stats} | to_nice_json }}"
        mode: "0644"

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_health | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_health_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_health_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_health: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_health_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_health_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_health: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_health | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_health_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_health_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_health | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_health_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_health_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_health_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_health_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_health | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_health: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_health_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_health_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_health | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_health failed at '{{ fe_dragos_dragos_sensor_ops_sensor_health_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_health_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_health | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_health_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_health_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_health_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_health | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_health":
              component: "dragos/dragos_sensor_ops/sensor_health"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_health_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_health_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_health_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_health_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_health_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_health_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_health_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_health_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_health_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_health_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_health_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_health_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_health'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_health | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_health_stats_published: true
      tags:
        - always
