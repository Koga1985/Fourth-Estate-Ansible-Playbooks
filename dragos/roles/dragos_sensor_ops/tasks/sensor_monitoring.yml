---
# Configure Dragos sensor monitoring interfaces for industrial protocols

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_sensor_ops/sensor_monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_sensor_ops_sensor_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_sensor_ops/sensor_monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_sensor_ops_sensor_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_sensor_ops_sensor_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_sensor_ops_sensor_monitoring_status: "running"
    fe_dragos_dragos_sensor_ops_sensor_monitoring_preflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_monitoring_postflight_passed: false
    fe_dragos_dragos_sensor_ops_sensor_monitoring_failed_task: ""
    fe_dragos_dragos_sensor_ops_sensor_monitoring_error: ""
    fe_dragos_dragos_sensor_ops_sensor_monitoring_stats_published: false
  tags:
    - always

- name: "dragos/dragos_sensor_ops/sensor_monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_sensor_ops/sensor_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_sensor_ops/sensor_monitoring: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_sensor_ops/sensor_monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure monitoring interface packet capture
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/capture"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: true
          snapshot_length: "{{ snapshot_length }}"
          buffer_size: "{{ capture_buffer_size }}"
          pcap_filter: "{{ item.pcap_filter | default(default_pcap_filter) }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Packet Capture"
      when: not dry_run
      register: sensor_capture

    - name: Enable industrial protocol parsers
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/protocols"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          protocols: "{{ ot_protocols }}"
          deep_inspection: "{{ deep_protocol_inspection }}"
          metadata_extraction: true
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Protocol Parsers"
      when: not dry_run
      register: sensor_protocols

    - name: Configure traffic sampling
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/sampling"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          sampling_enabled: "{{ enable_sampling }}"
          sampling_rate: "{{ sampling_rate }}"
          sample_all_ics: true
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Traffic Sampling"
      when: not dry_run and enable_sampling
      register: sensor_sampling

    - name: Configure flow export
      ansible.builtin.uri:
        url: "{{ dragos_base_url }}/api/sensors/{{ item.id }}/flow_export"
        method: PUT
        headers:
          Authorization: "Bearer {{ dragos_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: "{{ export_flows }}"
          flow_timeout: "{{ flow_timeout }}"
          active_timeout: "{{ active_flow_timeout }}"
        status_code: [200, 201]
        validate_certs: "{{ dragos_verify_ssl }}"
      loop: "{{ sensors }}"
      loop_control:
        label: "{{ item.name }} - Flow Export"
      when: not dry_run and export_flows
      register: sensor_flows

    - name: Save monitoring configuration
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sensor_monitoring_{{ ansible_date_time.iso8601_basic_short }}.json"
        content: "{{ {'capture': sensor_capture, 'protocols': sensor_protocols, 'sampling': sensor_sampling, 'flows': sensor_flows} | to_nice_json }}"
        mode: "0644"
      when: sensor_capture is defined

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_sensor_ops_sensor_monitoring_preflight_passed | bool
          - fe_dragos_dragos_sensor_ops_sensor_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_sensor_ops/sensor_monitoring: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_sensor_ops_sensor_monitoring_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_sensor_ops_sensor_monitoring_status | default('unknown') }}.
        success_msg: "dragos/dragos_sensor_ops/sensor_monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_monitoring_postflight_passed: true
        fe_dragos_dragos_sensor_ops_sensor_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_monitoring_status: "failed"
        fe_dragos_dragos_sensor_ops_sensor_monitoring_postflight_passed: false
        fe_dragos_dragos_sensor_ops_sensor_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_sensor_ops_sensor_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_sensor_ops/sensor_monitoring: FAILED at '{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_sensor_ops_sensor_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_sensor_ops/sensor_monitoring failed at '{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_failed_task }}': {{ fe_dragos_dragos_sensor_ops_sensor_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_sensor_ops_sensor_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_sensor_ops_sensor_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_sensor_ops/sensor_monitoring":
              component: "dragos/dragos_sensor_ops/sensor_monitoring"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_sensor_ops_sensor_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_sensor_ops_sensor_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_sensor_ops_sensor_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_sensor_ops_sensor_monitoring_status | default('') == 'succeeded' else ['dragos/dragos_sensor_ops/sensor_monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_sensor_ops/sensor_monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_sensor_ops_sensor_monitoring_stats_published: true
      tags:
        - always
