---
# No-op: this scenario runs against the control node, so there is no instance
# to cleanup. Present so 'molecule test' completes without missing-playbook
# warnings.
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Nothing to cleanup for a delegated scenario
      ansible.builtin.debug:
        msg: "No managed instance; nothing to cleanup."
