
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['dragos/dragos_servicenow_integration/servicenow_incidents']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_dragos_dragos_servicenow_integration_servicenow_incidents_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "dragos/dragos_servicenow_integration/servicenow_incidents | Initialize validation state"
  ansible.builtin.set_fact:
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_status: "running"
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_preflight_passed: false
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_postflight_passed: false
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_failed_task: ""
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_error: ""
    fe_dragos_dragos_servicenow_integration_servicenow_incidents_stats_published: false
  tags:
    - always

- name: "dragos/dragos_servicenow_integration/servicenow_incidents | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          dragos/dragos_servicenow_integration/servicenow_incidents: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          dragos/dragos_servicenow_integration/servicenow_incidents: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "dragos/dragos_servicenow_integration/servicenow_incidents: required variable '{{ item }}' is not defined."
        success_msg: "dragos/dragos_servicenow_integration/servicenow_incidents: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Load alerts JSON
      ansible.builtin.set_fact:
        _alerts: "{{ lookup('ansible.builtin.file', artifacts_dir + '/alerts_filtered.json') | from_json }}"

    - name: Create incidents for high/critical alerts
      ansible.builtin.uri:
        url: "{{ servicenow.url }}/api/now/table/{{ servicenow.incident_table | default('incident') }}"
        method: POST
        headers: { Authorization: "Bearer {{ servicenow.token }}", Content-Type: "application/json" }
        body_format: json
        body:
          short_description: "Dragos alert {{ item.id }}: {{ item.summary | default('') }}"
          severity: "{{ '1' if (item.severity | default('low')) in ['critical'] else ('2' if (item.severity | default('low')) in ['high'] else '3') }}"
          description: "Category={{ item.category | default('') }}, Site={{ item.site | default('') }}"
        status_code: [200,201]
      loop: "{{ (_alerts.items if _alerts.items is defined else _alerts.data | default([])) | selectattr('severity','in',['high','critical']) | list }}"
      loop_control: { label: "{{ item.id }}" }

    # ----------------------------- postflight -------------------

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_dragos_dragos_servicenow_integration_servicenow_incidents_preflight_passed | bool
          - fe_dragos_dragos_servicenow_integration_servicenow_incidents_status in ['running', 'succeeded']
        fail_msg: >-
          dragos/dragos_servicenow_integration/servicenow_incidents: postflight validation failed - preflight passed
          ={{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_preflight_passed | default(false) }},
          status={{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_status | default('unknown') }}.
        success_msg: "dragos/dragos_servicenow_integration/servicenow_incidents: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_postflight_passed: true
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_status: "failed"
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_postflight_passed: false
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          dragos/dragos_servicenow_integration/servicenow_incidents: FAILED at '{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_error }}
      tags:
        - always
        - rescue

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          dragos/dragos_servicenow_integration/servicenow_incidents failed at '{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_failed_task }}': {{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_dragos_dragos_servicenow_integration_servicenow_incidents_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "dragos/dragos_servicenow_integration/servicenow_incidents":
              component: "dragos/dragos_servicenow_integration/servicenow_incidents"
              type: "role-tasks"
              platform: "dragos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_status | default('unknown') }}"
              preflight_passed: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_started_at | default('') }}"
              ended_at: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_ended_at | default('') }}"
              duration_seconds: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_failed_task | default('') }}"
              error: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_dragos_dragos_servicenow_integration_servicenow_incidents_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_dragos_dragos_servicenow_integration_servicenow_incidents_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_dragos_dragos_servicenow_integration_servicenow_incidents_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_dragos_dragos_servicenow_integration_servicenow_incidents_status | default('') == 'succeeded' else ['dragos/dragos_servicenow_integration/servicenow_incidents'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "dragos/dragos_servicenow_integration/servicenow_incidents | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_dragos_dragos_servicenow_integration_servicenow_incidents_stats_published: true
      tags:
        - always
