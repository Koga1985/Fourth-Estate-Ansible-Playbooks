---
# ServiceNow Integration Playbook
# Entry point for ServiceNow ITSM automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ServiceNow Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_integration: true
    deploy_cmdb: true
    deploy_incidents: true
    deploy_changes: true
    deploy_assets: true
    deploy_reporting: true

  tasks:
    - name: "servicenow/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - ServiceNow Integration
          ansible.builtin.include_role:
            name: servicenow_integration
          when: deploy_integration | bool
          tags: ['integration', 'phase1']

        - name: Phase 2 - CMDB Configuration
          ansible.builtin.include_role:
            name: servicenow_cmdb_config
          when: deploy_cmdb | bool
          tags: ['cmdb', 'phase2']

        - name: Phase 3 - CI Discovery
          ansible.builtin.include_role:
            name: servicenow_ci_discovery
          when: deploy_cmdb | bool
          tags: ['cmdb', 'discovery', 'phase3']

        - name: Phase 4 - CI Updates
          ansible.builtin.include_role:
            name: servicenow_ci_updates
          when: deploy_cmdb | bool
          tags: ['cmdb', 'phase4']

        - name: Phase 5 - Incident Management
          ansible.builtin.include_role:
            name: servicenow_incident_management
          when: deploy_incidents | bool
          tags: ['incidents', 'phase5']

        - name: Phase 6 - Change Management
          ansible.builtin.include_role:
            name: servicenow_change_management
          when: deploy_changes | bool
          tags: ['changes', 'phase6']

        - name: Phase 7 - Asset Management
          ansible.builtin.include_role:
            name: servicenow_asset_management
          when: deploy_assets | bool
          tags: ['assets', 'phase7']

        - name: Phase 8 - Reporting
          ansible.builtin.include_role:
            name: servicenow_reporting
          when: deploy_reporting | bool
          tags: ['reporting', 'phase8']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== ServiceNow Integration Complete ==="
              - "Instance: {{ servicenow_instance }}"
          tags: ['always']

      rescue:

        - name: "servicenow/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_servicenow_site_status: "failed"
            fe_servicenow_site_postflight_passed: false
            fe_servicenow_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_servicenow_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "servicenow/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              servicenow/site: FAILED at '{{ fe_servicenow_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_servicenow_site_error }}
          tags:
            - always
            - rescue

        - name: "servicenow/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              servicenow/site failed at '{{ fe_servicenow_site_failed_task }}': {{ fe_servicenow_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "servicenow/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_servicenow_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_servicenow_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_servicenow_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "servicenow/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "servicenow/site":
                  component: "servicenow/site"
                  type: "playbook"
                  platform: "servicenow"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_servicenow_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_servicenow_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_servicenow_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_servicenow_site_started_at | default('') }}"
                  ended_at: "{{ fe_servicenow_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_servicenow_site_failed_task | default('') }}"
                  error: "{{ fe_servicenow_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_servicenow_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_servicenow_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_servicenow_site_status | default('') == 'succeeded' else ['servicenow/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_servicenow_site_status | default('') == 'failed'
            - not (fe_servicenow_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "servicenow/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_servicenow_site_stats_published: true
          when:
            - fe_servicenow_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "servicenow/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "servicenow/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_servicenow_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_servicenow_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_servicenow_site_status: "running"
            fe_servicenow_site_preflight_passed: false
            fe_servicenow_site_postflight_passed: false
            fe_servicenow_site_failed_task: ""
            fe_servicenow_site_error: ""
            fe_servicenow_site_stats_published: false
          tags:
            - always

        - name: "servicenow/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              servicenow/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              servicenow/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "servicenow/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "servicenow/site: required variable '{{ item }}' is not defined."
            success_msg: "servicenow/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_servicenow_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "servicenow/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_servicenow_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "servicenow/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_servicenow_site_status: "preflight_failed"
            fe_servicenow_site_postflight_passed: false
            fe_servicenow_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_servicenow_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "servicenow/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              servicenow/site: FAILED at '{{ fe_servicenow_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_servicenow_site_error }}
          tags:
            - always
            - rescue

        - name: "servicenow/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "servicenow/site":
                  component: "servicenow/site"
                  type: "playbook"
                  platform: "servicenow"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_servicenow_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_servicenow_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_servicenow_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_servicenow_site_started_at | default('') }}"
                  ended_at: "{{ fe_servicenow_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_servicenow_site_failed_task | default('') }}"
                  error: "{{ fe_servicenow_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_servicenow_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_servicenow_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_servicenow_site_status | default('') == 'succeeded' else ['servicenow/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "servicenow/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_servicenow_site_stats_published: true
          tags:
            - always

        - name: "servicenow/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              servicenow/site failed at '{{ fe_servicenow_site_failed_task }}': {{ fe_servicenow_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "servicenow/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              servicenow/site: preflight
              {{ 'passed' if fe_servicenow_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "servicenow/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "servicenow/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_servicenow_site_preflight_passed | bool
              - fe_servicenow_site_status in ['running', 'succeeded']
            fail_msg: >-
              servicenow/site: postflight validation failed - preflight passed
              ={{ fe_servicenow_site_preflight_passed | default(false) }},
              status={{ fe_servicenow_site_status | default('unknown') }}.
            success_msg: "servicenow/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "servicenow/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_servicenow_site_postflight_passed: true
            fe_servicenow_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "servicenow/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_servicenow_site_status: "failed"
            fe_servicenow_site_postflight_passed: false
            fe_servicenow_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_servicenow_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "servicenow/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              servicenow/site: FAILED at '{{ fe_servicenow_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_servicenow_site_error }}
          tags:
            - always
            - rescue

        - name: "servicenow/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              servicenow/site failed at '{{ fe_servicenow_site_failed_task }}': {{ fe_servicenow_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "servicenow/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_servicenow_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_servicenow_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_servicenow_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "servicenow/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "servicenow/site":
                  component: "servicenow/site"
                  type: "playbook"
                  platform: "servicenow"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_servicenow_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_servicenow_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_servicenow_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_servicenow_site_started_at | default('') }}"
                  ended_at: "{{ fe_servicenow_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_servicenow_site_failed_task | default('') }}"
                  error: "{{ fe_servicenow_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_servicenow_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_servicenow_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_servicenow_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_servicenow_site_status | default('') == 'succeeded' else ['servicenow/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_servicenow_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "servicenow/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_servicenow_site_stats_published: true
          tags:
            - always

        - name: "servicenow/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              servicenow/site: {{ fe_servicenow_site_status | default('unknown') }} in
              {{ fe_servicenow_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
