---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Configure MLAG on a pair (on each device)
  hosts: arista
  gather_facts: false
  collections:
    - arista.eos
    - arista.cvp
    - ansible.utils
  vars:
    apply_changes: false
    artifacts_dir: "/tmp/arista-artifacts"
    mlag:
      domain_id: "MLAG1"
      peer_link: "Port-Channel100"
      local_interface: "Vlan4094"
      local_ip: "169.254.0.1/30"
      peer_address: "169.254.0.2"
      peer_link_members: ["Ethernet47","Ethernet48"]
  pre_tasks:
    - name: "arista/tasks/arista_mlag__pair | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "arista/tasks/arista_mlag__pair | Initialize validation state"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_arista_tasks_arista_mlag__pair_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_mlag__pair_status: "running"
            fe_arista_tasks_arista_mlag__pair_preflight_passed: false
            fe_arista_tasks_arista_mlag__pair_postflight_passed: false
            fe_arista_tasks_arista_mlag__pair_failed_task: ""
            fe_arista_tasks_arista_mlag__pair_error: ""
            fe_arista_tasks_arista_mlag__pair_stats_published: false
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              arista/tasks/arista_mlag__pair: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              arista/tasks/arista_mlag__pair: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_mlag__pair | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "arista/tasks/arista_mlag__pair: required variable '{{ item }}' is not defined."
            success_msg: "arista/tasks/arista_mlag__pair: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_arista_tasks_arista_mlag__pair_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_mlag__pair | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "arista/tasks/arista_mlag__pair | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_status: "preflight_failed"
            fe_arista_tasks_arista_mlag__pair_postflight_passed: false
            fe_arista_tasks_arista_mlag__pair_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_mlag__pair_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_mlag__pair: FAILED at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_mlag__pair_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_mlag__pair":
                  component: "arista/tasks/arista_mlag__pair"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_mlag__pair_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_mlag__pair_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_mlag__pair_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_mlag__pair_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_mlag__pair_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else ['arista/tasks/arista_mlag__pair'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_mlag__pair failed at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}': {{ fe_arista_tasks_arista_mlag__pair_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_mlag__pair | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_mlag__pair: preflight
              {{ 'passed' if fe_arista_tasks_arista_mlag__pair_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "arista/arista_mlag__pair | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts dir
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0755"

        - name: "arista/arista_mlag__pair | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "arista/arista_mlag__pair | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_arista_mlag__pair_status: "failed"
            fe_arista_arista_mlag__pair_postflight_passed: false
            fe_arista_arista_mlag__pair_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_arista_mlag__pair_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/arista_mlag__pair | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/arista_mlag__pair: FAILED at '{{ fe_arista_arista_mlag__pair_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_arista_mlag__pair_error }}
          tags:
            - always
            - rescue

        - name: "arista/arista_mlag__pair | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/arista_mlag__pair failed at '{{ fe_arista_arista_mlag__pair_failed_task }}': {{ fe_arista_arista_mlag__pair_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/arista_mlag__pair | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_arista_mlag__pair_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_arista_mlag__pair_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_arista_mlag__pair_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/arista_mlag__pair | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/arista_mlag__pair":
                  component: "arista/arista_mlag__pair"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_arista_mlag__pair_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_arista_mlag__pair_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_arista_mlag__pair_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_arista_mlag__pair_started_at | default('') }}"
                  ended_at: "{{ fe_arista_arista_mlag__pair_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_arista_mlag__pair_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_arista_mlag__pair_failed_task | default('') }}"
                  error: "{{ fe_arista_arista_mlag__pair_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_arista_mlag__pair_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_arista_mlag__pair_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_arista_mlag__pair_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_arista_mlag__pair_status | default('') == 'succeeded' else ['arista/arista_mlag__pair'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_arista_mlag__pair_status | default('') == 'failed'
            - not (fe_arista_arista_mlag__pair_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/arista_mlag__pair | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_arista_mlag__pair_stats_published: true
          when:
            - fe_arista_arista_mlag__pair_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "arista/tasks/arista_mlag__pair | Guarded execution with rescue and always handling"
      block:

        - name: Plan MLAG
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/mlag_plan.json"
            content: "{{ mlag | to_nice_json }}"
            mode: "0644"

        - name: Peer-link LAG
          when: apply_changes | bool
          arista.eos.eos_lag_interfaces:
            config:
              - name: "{{ mlag.peer_link }}"
                members: "{{ mlag.peer_link_members }}"
                mode: active
            state: merged

        - name: SVI for MLAG
          when: apply_changes | bool
          arista.eos.eos_l3_interfaces:
            config:
              - { name: "{{ mlag.local_interface }}", ipv4: ["{{ mlag.local_ip }}"] }
            state: merged

        - name: MLAG configuration
          when: apply_changes | bool
          arista.eos.eos_config:
            lines:
              - "mlag configuration"
              - "domain-id {{ mlag.domain_id }}"
              - "local-interface {{ mlag.local_interface }}"
              - "peer-address {{ mlag.peer_address }}"
              - "peer-link {{ mlag.peer_link }}"

        - name: "arista/tasks/arista_mlag__pair | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "arista/tasks/arista_mlag__pair | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_status: "failed"
            fe_arista_tasks_arista_mlag__pair_postflight_passed: false
            fe_arista_tasks_arista_mlag__pair_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_mlag__pair_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_mlag__pair: FAILED at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_mlag__pair_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_mlag__pair failed at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}': {{ fe_arista_tasks_arista_mlag__pair_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_mlag__pair | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_mlag__pair_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_mlag__pair_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_mlag__pair":
                  component: "arista/tasks/arista_mlag__pair"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_mlag__pair_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_mlag__pair_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_mlag__pair_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_mlag__pair_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_mlag__pair_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else ['arista/tasks/arista_mlag__pair'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_tasks_arista_mlag__pair_status | default('') == 'failed'
            - not (fe_arista_tasks_arista_mlag__pair_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_stats_published: true
          when:
            - fe_arista_tasks_arista_mlag__pair_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "arista/tasks/arista_mlag__pair | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "arista/tasks/arista_mlag__pair | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_arista_tasks_arista_mlag__pair_preflight_passed | bool
              - fe_arista_tasks_arista_mlag__pair_status in ['running', 'succeeded']
            fail_msg: >-
              arista/tasks/arista_mlag__pair: postflight validation failed - preflight passed
              ={{ fe_arista_tasks_arista_mlag__pair_preflight_passed | default(false) }},
              status={{ fe_arista_tasks_arista_mlag__pair_status | default('unknown') }}.
            success_msg: "arista/tasks/arista_mlag__pair: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "arista/tasks/arista_mlag__pair | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_postflight_passed: true
            fe_arista_tasks_arista_mlag__pair_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "arista/tasks/arista_mlag__pair | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_status: "failed"
            fe_arista_tasks_arista_mlag__pair_postflight_passed: false
            fe_arista_tasks_arista_mlag__pair_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_mlag__pair_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_mlag__pair: FAILED at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_mlag__pair_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_mlag__pair | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_mlag__pair failed at '{{ fe_arista_tasks_arista_mlag__pair_failed_task }}': {{ fe_arista_tasks_arista_mlag__pair_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_mlag__pair | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_mlag__pair_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_mlag__pair_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_mlag__pair":
                  component: "arista/tasks/arista_mlag__pair"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_mlag__pair_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_mlag__pair_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_mlag__pair_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_mlag__pair_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_mlag__pair_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_mlag__pair_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_mlag__pair_status | default('') == 'succeeded' else ['arista/tasks/arista_mlag__pair'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_arista_tasks_arista_mlag__pair_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_mlag__pair_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_mlag__pair | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_mlag__pair: {{ fe_arista_tasks_arista_mlag__pair_status | default('unknown') }} in
              {{ fe_arista_tasks_arista_mlag__pair_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
