---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Syslog + sFlow + optional gNMI/IPFIX
  hosts: arista
  gather_facts: false
  collections:
    - arista.eos
    - arista.cvp
    - ansible.utils
  vars:
    apply_changes: false
    artifacts_dir: "/tmp/arista-artifacts"
    logging:
      hosts: [{ host: "10.0.0.20", port: 514, protocol: "udp", vrf: "MGMT" }]
    sflow:
      enabled: true
      agent: "Management1"
      collectors: [{ host: "10.0.0.30", port: 6343 }]
    gnmi: { enabled: false, port: 6030 }
    ipfix: { enabled: false, exporter: { destination: "10.0.0.40", port: 2055, source: "Vlan10" } }
  pre_tasks:
    - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Initialize validation state"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status: "running"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed: false
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed: false
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task: ""
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error: ""
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published: false
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "arista/tasks/arista_telemetry__logging_sflow_gnmi: required variable '{{ item }}' is not defined."
            success_msg: "arista/tasks/arista_telemetry__logging_sflow_gnmi: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status: "preflight_failed"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed: false
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: FAILED at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_telemetry__logging_sflow_gnmi":
                  component: "arista/tasks/arista_telemetry__logging_sflow_gnmi"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else ['arista/tasks/arista_telemetry__logging_sflow_gnmi'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi failed at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}': {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: preflight
              {{ 'passed' if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Guarded execution with rescue and always handling"
      block:

        - name: Plan telemetry
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/telemetry_plan.json"
            content: "{{ {'logging': logging, 'sflow': sflow, 'gnmi': gnmi, 'ipfix': ipfix} | to_nice_json }}"
            mode: "0644"

        - name: Syslog
          when: apply_changes | bool
          arista.eos.eos_logging:
            config: { hosts: "{{ logging.hosts }}" }
            state: merged

        - name: sFlow
          when: apply_changes | bool and sflow.enabled | default(false)
          arista.eos.eos_config:
            lines:
              - "sflow agent {{ sflow.agent }}"
              - "{% for c in sflow.collectors %}sflow destination {{ c.host }} {{ c.port | default(6343) }}{% endfor %}"

        - name: gNMI (optional)
          when: apply_changes | bool and gnmi.enabled | default(false)
          arista.eos.eos_config:
            lines:
              - "management api gnmi"
              - "transport grpc default"
              - "port {{ gnmi.port | default(6030) }}"
              - "no shutdown"

        - name: IPFIX (optional)
          when: apply_changes | bool and ipfix.enabled | default(false)
          arista.eos.eos_config:
            lines:
              - "ip flow-export destination {{ ipfix.exporter.destination }} {{ ipfix.exporter.port | default(2055) }} source {{ ipfix.exporter.source }}"

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status: "failed"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed: false
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: FAILED at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi failed at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}': {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_telemetry__logging_sflow_gnmi":
                  component: "arista/tasks/arista_telemetry__logging_sflow_gnmi"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else ['arista/tasks/arista_telemetry__logging_sflow_gnmi'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'failed'
            - not (fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published: true
          when:
            - fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | bool
              - fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status in ['running', 'succeeded']
            fail_msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: postflight validation failed - preflight passed
              ={{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | default(false) }},
              status={{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('unknown') }}.
            success_msg: "arista/tasks/arista_telemetry__logging_sflow_gnmi: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed: true
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status: "failed"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed: false
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: FAILED at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi failed at '{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task }}': {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_telemetry__logging_sflow_gnmi":
                  component: "arista/tasks/arista_telemetry__logging_sflow_gnmi"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('') == 'succeeded' else ['arista/tasks/arista_telemetry__logging_sflow_gnmi'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_telemetry__logging_sflow_gnmi | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_telemetry__logging_sflow_gnmi: {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_status | default('unknown') }} in
              {{ fe_arista_tasks_arista_telemetry__logging_sflow_gnmi_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
