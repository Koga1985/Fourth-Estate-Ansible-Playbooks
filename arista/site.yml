                  postflight_passed: "{{ fe_arista_site_play2_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_site_play2_started_at | default('') }}"
                  ended_at: "{{ fe_arista_site_play2_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_site_play2_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_site_play2_failed_task | default('') }}"
                  error: "{{ fe_arista_site_play2_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_site_play2_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_site_play2_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_site_play2_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_site_play2_status | default('') == 'succeeded' else ['arista/site#play2'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_site_play2_status | default('') == 'failed'
            - not (fe_arista_site_play2_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/site#play2 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_site_play2_stats_published: true
          when:
            - fe_arista_site_play2_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
