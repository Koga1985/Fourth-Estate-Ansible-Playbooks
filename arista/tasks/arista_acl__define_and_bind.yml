---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Define IPv4 ACLs and bind to interfaces
  hosts: arista
  gather_facts: false
  collections:
    - arista.eos
    - arista.cvp
    - ansible.utils
  vars:
    apply_changes: false
    artifacts_dir: "/tmp/arista-artifacts"
    acls:
      - name: "MGMT-IN"
        afi: "ipv4"
        entries:
          - { sequence: 10, action: "permit", source: "10.0.0.0/8" }
          - { sequence: 99, action: "deny", source: "any" }
    bindings:
      - { interface: "Vlan10", direction: "in", acl: "MGMT-IN" }
  pre_tasks:
    - name: "arista/tasks/arista_acl__define_and_bind | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "arista/tasks/arista_acl__define_and_bind | Initialize validation state"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_arista_tasks_arista_acl__define_and_bind_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_acl__define_and_bind_status: "running"
            fe_arista_tasks_arista_acl__define_and_bind_preflight_passed: false
            fe_arista_tasks_arista_acl__define_and_bind_postflight_passed: false
            fe_arista_tasks_arista_acl__define_and_bind_failed_task: ""
            fe_arista_tasks_arista_acl__define_and_bind_error: ""
            fe_arista_tasks_arista_acl__define_and_bind_stats_published: false
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              arista/tasks/arista_acl__define_and_bind: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              arista/tasks/arista_acl__define_and_bind: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_acl__define_and_bind | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "arista/tasks/arista_acl__define_and_bind: required variable '{{ item }}' is not defined."
            success_msg: "arista/tasks/arista_acl__define_and_bind: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_arista_tasks_arista_acl__define_and_bind_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_acl__define_and_bind | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_status: "preflight_failed"
            fe_arista_tasks_arista_acl__define_and_bind_postflight_passed: false
            fe_arista_tasks_arista_acl__define_and_bind_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_acl__define_and_bind_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_acl__define_and_bind: FAILED at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_acl__define_and_bind":
                  component: "arista/tasks/arista_acl__define_and_bind"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_acl__define_and_bind_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_acl__define_and_bind_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else ['arista/tasks/arista_acl__define_and_bind'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_acl__define_and_bind failed at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}': {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_acl__define_and_bind: preflight
              {{ 'passed' if fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: "arista/tasks/arista_acl__define_and_bind | Guarded execution with rescue and always handling"
      block:

        - name: Plan ACLs
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/acl_plan.json"
            content: "{{ {'acls': acls, 'bindings': bindings} | to_nice_json }}"
            mode: "0644"

        - name: Configure ACLs
          when: apply_changes | bool
          arista.eos.eos_acls:
            config: "{{ acls }}"
            state: merged

        - name: Bind ACLs
          when: apply_changes | bool and (bindings | length) > 0
          loop: "{{ bindings }}"
          loop_control: { label: "{{ item.interface }} {{ item.direction }}" }
          arista.eos.eos_config:
            lines:
              - "interface {{ item.interface }}"
              - "ip access-group {{ item.acl }} {{ item.direction }}"

        - name: "arista/tasks/arista_acl__define_and_bind | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_status: "failed"
            fe_arista_tasks_arista_acl__define_and_bind_postflight_passed: false
            fe_arista_tasks_arista_acl__define_and_bind_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_acl__define_and_bind_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_acl__define_and_bind: FAILED at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_acl__define_and_bind failed at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}': {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_acl__define_and_bind_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_acl__define_and_bind_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_acl__define_and_bind":
                  component: "arista/tasks/arista_acl__define_and_bind"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_acl__define_and_bind_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_acl__define_and_bind_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else ['arista/tasks/arista_acl__define_and_bind'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'failed'
            - not (fe_arista_tasks_arista_acl__define_and_bind_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_stats_published: true
          when:
            - fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "arista/tasks/arista_acl__define_and_bind | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "arista/tasks/arista_acl__define_and_bind | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | bool
              - fe_arista_tasks_arista_acl__define_and_bind_status in ['running', 'succeeded']
            fail_msg: >-
              arista/tasks/arista_acl__define_and_bind: postflight validation failed - preflight passed
              ={{ fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | default(false) }},
              status={{ fe_arista_tasks_arista_acl__define_and_bind_status | default('unknown') }}.
            success_msg: "arista/tasks/arista_acl__define_and_bind: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "arista/tasks/arista_acl__define_and_bind | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_postflight_passed: true
            fe_arista_tasks_arista_acl__define_and_bind_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_status: "failed"
            fe_arista_tasks_arista_acl__define_and_bind_postflight_passed: false
            fe_arista_tasks_arista_acl__define_and_bind_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_acl__define_and_bind_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_acl__define_and_bind: FAILED at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_acl__define_and_bind | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_acl__define_and_bind failed at '{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task }}': {{ fe_arista_tasks_arista_acl__define_and_bind_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_acl__define_and_bind_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_acl__define_and_bind_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_acl__define_and_bind":
                  component: "arista/tasks/arista_acl__define_and_bind"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_acl__define_and_bind_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_acl__define_and_bind_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_acl__define_and_bind_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_acl__define_and_bind_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_acl__define_and_bind_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_acl__define_and_bind_status | default('') == 'succeeded' else ['arista/tasks/arista_acl__define_and_bind'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_arista_tasks_arista_acl__define_and_bind_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_acl__define_and_bind_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_acl__define_and_bind | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_acl__define_and_bind: {{ fe_arista_tasks_arista_acl__define_and_bind_status | default('unknown') }} in
              {{ fe_arista_tasks_arista_acl__define_and_bind_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
