---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: "CloudVision: containers, configlets, device placement"
  hosts: arista
  gather_facts: false
  collections:
    - arista.eos
    - arista.cvp
    - ansible.utils
  vars:
    apply_changes: false
    artifacts_dir: "/tmp/arista-artifacts"
    cvp:
      containers: [{ name: "DC1", parent: "Tenant" }]
      configlets: []
      devices: []   # [{ fqdn: "sw1", parentContainerName: "DC1" }]
  pre_tasks:
    - name: "arista/tasks/arista_cvp__inventory_model | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "arista/tasks/arista_cvp__inventory_model | Initialize validation state"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_arista_tasks_arista_cvp__inventory_model_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_cvp__inventory_model_status: "running"
            fe_arista_tasks_arista_cvp__inventory_model_preflight_passed: false
            fe_arista_tasks_arista_cvp__inventory_model_postflight_passed: false
            fe_arista_tasks_arista_cvp__inventory_model_failed_task: ""
            fe_arista_tasks_arista_cvp__inventory_model_error: ""
            fe_arista_tasks_arista_cvp__inventory_model_stats_published: false
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              arista/tasks/arista_cvp__inventory_model: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              arista/tasks/arista_cvp__inventory_model: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_cvp__inventory_model | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "arista/tasks/arista_cvp__inventory_model: required variable '{{ item }}' is not defined."
            success_msg: "arista/tasks/arista_cvp__inventory_model: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_arista_tasks_arista_cvp__inventory_model_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "arista/tasks/arista_cvp__inventory_model | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_status: "preflight_failed"
            fe_arista_tasks_arista_cvp__inventory_model_postflight_passed: false
            fe_arista_tasks_arista_cvp__inventory_model_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_cvp__inventory_model_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_cvp__inventory_model: FAILED at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_cvp__inventory_model":
                  component: "arista/tasks/arista_cvp__inventory_model"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_cvp__inventory_model_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_cvp__inventory_model_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else ['arista/tasks/arista_cvp__inventory_model'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_cvp__inventory_model failed at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}': {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_cvp__inventory_model: preflight
              {{ 'passed' if fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: "arista/tasks/arista_cvp__inventory_model | Guarded execution with rescue and always handling"
      block:

        - name: Plan CVP inventory
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/cvp_plan.json"
            content: "{{ cvp | to_nice_json }}"
            mode: "0644"

        - name: Create containers
          when: apply_changes | bool and (cvp.containers | length) > 0
          arista.cvp.cv_container_v3:
            state: present
            containers: "{{ cvp.containers }}"

        - name: Create configlets
          when: apply_changes | bool and (cvp.configlets | length) > 0
          arista.cvp.cv_configlet_v3:
            state: present
            configlets: "{{ cvp.configlets }}"

        - name: Assign devices
          when: apply_changes | bool and (cvp.devices | length) > 0
          arista.cvp.cv_device_v3:
            state: present
            devices: "{{ cvp.devices }}"

        - name: "arista/tasks/arista_cvp__inventory_model | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_status: "failed"
            fe_arista_tasks_arista_cvp__inventory_model_postflight_passed: false
            fe_arista_tasks_arista_cvp__inventory_model_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_cvp__inventory_model_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_cvp__inventory_model: FAILED at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_cvp__inventory_model failed at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}': {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_cvp__inventory_model_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_cvp__inventory_model_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_cvp__inventory_model":
                  component: "arista/tasks/arista_cvp__inventory_model"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_cvp__inventory_model_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_cvp__inventory_model_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else ['arista/tasks/arista_cvp__inventory_model'] }}
            aggregate: true
            per_host: false
          when:
            - fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'failed'
            - not (fe_arista_tasks_arista_cvp__inventory_model_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_stats_published: true
          when:
            - fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "arista/tasks/arista_cvp__inventory_model | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "arista/tasks/arista_cvp__inventory_model | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | bool
              - fe_arista_tasks_arista_cvp__inventory_model_status in ['running', 'succeeded']
            fail_msg: >-
              arista/tasks/arista_cvp__inventory_model: postflight validation failed - preflight passed
              ={{ fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | default(false) }},
              status={{ fe_arista_tasks_arista_cvp__inventory_model_status | default('unknown') }}.
            success_msg: "arista/tasks/arista_cvp__inventory_model: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "arista/tasks/arista_cvp__inventory_model | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_postflight_passed: true
            fe_arista_tasks_arista_cvp__inventory_model_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_status: "failed"
            fe_arista_tasks_arista_cvp__inventory_model_postflight_passed: false
            fe_arista_tasks_arista_cvp__inventory_model_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_arista_tasks_arista_cvp__inventory_model_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_cvp__inventory_model: FAILED at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          tags:
            - always
            - rescue

        - name: "arista/tasks/arista_cvp__inventory_model | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              arista/tasks/arista_cvp__inventory_model failed at '{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task }}': {{ fe_arista_tasks_arista_cvp__inventory_model_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_arista_tasks_arista_cvp__inventory_model_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_tasks_arista_cvp__inventory_model_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "arista/tasks/arista_cvp__inventory_model":
                  component: "arista/tasks/arista_cvp__inventory_model"
                  type: "playbook"
                  platform: "arista"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_arista_tasks_arista_cvp__inventory_model_status | default('unknown') }}"
                  preflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_arista_tasks_arista_cvp__inventory_model_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_started_at | default('') }}"
                  ended_at: "{{ fe_arista_tasks_arista_cvp__inventory_model_ended_at | default('') }}"
                  duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_arista_tasks_arista_cvp__inventory_model_failed_task | default('') }}"
                  error: "{{ fe_arista_tasks_arista_cvp__inventory_model_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_arista_tasks_arista_cvp__inventory_model_status | default('') == 'succeeded' else ['arista/tasks/arista_cvp__inventory_model'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_arista_tasks_arista_cvp__inventory_model_stats_published | default(false) | bool)
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_arista_tasks_arista_cvp__inventory_model_stats_published: true
          tags:
            - always

        - name: "arista/tasks/arista_cvp__inventory_model | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              arista/tasks/arista_cvp__inventory_model: {{ fe_arista_tasks_arista_cvp__inventory_model_status | default('unknown') }} in
              {{ fe_arista_tasks_arista_cvp__inventory_model_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
