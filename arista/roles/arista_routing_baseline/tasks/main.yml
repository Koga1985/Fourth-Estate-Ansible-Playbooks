---
# tasks file for arista_routing_baseline
# Production-ready routing configuration (BGP, OSPF, ISIS) for Fourth Estate agencies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['arista/arista_routing_baseline']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_arista_arista_routing_baseline_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "arista/arista_routing_baseline | Initialize validation state"
  ansible.builtin.set_fact:
    fe_arista_arista_routing_baseline_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_arista_arista_routing_baseline_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_arista_arista_routing_baseline_status: "running"
    fe_arista_arista_routing_baseline_preflight_passed: false
    fe_arista_arista_routing_baseline_postflight_passed: false
    fe_arista_arista_routing_baseline_failed_task: ""
    fe_arista_arista_routing_baseline_error: ""
    fe_arista_arista_routing_baseline_stats_published: false
  tags:
    - always

- name: "arista/arista_routing_baseline | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "arista/arista_routing_baseline | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          arista/arista_routing_baseline: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          arista/arista_routing_baseline: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_routing_baseline | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "arista/arista_routing_baseline: required variable '{{ item }}' is not defined."
        success_msg: "arista/arista_routing_baseline: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_arista_arista_routing_baseline_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_routing_baseline | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_arista_arista_routing_baseline_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ arista_artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Save routing configuration plan
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/{{ inventory_hostname }}_routing_plan.json"
        content: "{{ routing_config | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    # Loopback Configuration
    - name: Configure loopback interfaces for routing
      when: arista_apply_changes | bool and routing_loopbacks | length > 0
      arista.eos.eos_l3_interfaces:
        config: "{{ routing_loopbacks }}"
        state: merged
      notify: save eos configuration

    # Static Routes
    - name: Configure static routes
      when: arista_apply_changes | bool and static_routes | length > 0
      arista.eos.eos_static_routes:
        config: "{{ static_routes }}"
        state: merged
      notify: save eos configuration

    # Prefix Lists
    - name: Configure prefix lists
      when: arista_apply_changes | bool and prefix_lists | length > 0
      loop: "{{ prefix_lists }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_prefix_lists:
        config:
          - afi: "{{ item.afi | default('ipv4') }}"
            prefix_lists:
              - name: "{{ item.name }}"
                entries: "{{ item.entries }}"
        state: merged
      notify: save eos configuration

    # Route Maps
    - name: Configure route maps
      when: arista_apply_changes | bool and route_maps | length > 0
      loop: "{{ route_maps }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_route_maps:
        config:
          - map: "{{ item.name }}"
            entries: "{{ item.entries }}"
        state: merged
      notify: save eos configuration

    # BGP Configuration
    - name: Configure BGP global settings
      when: arista_apply_changes | bool and bgp_config.enabled | default(false)
      arista.eos.eos_bgp_global:
        config:
          as_number: "{{ bgp_config.asn }}"
          router_id: "{{ bgp_config.router_id | default(fabric_router_id) }}"
          log_neighbor_changes: true
          maximum_paths:
            max_paths: "{{ bgp_config.max_paths | default(4) }}"
            max_paths_ibgp: "{{ bgp_config.max_paths_ibgp | default(4) }}"
        state: merged
      notify: save eos configuration

    - name: Configure BGP address families
      when: arista_apply_changes | bool and bgp_config.enabled | default(false)
      arista.eos.eos_bgp_address_family:
        config:
          as_number: "{{ bgp_config.asn }}"
          address_family: "{{ bgp_address_families }}"
        state: merged
      notify: save eos configuration

    - name: Configure BGP neighbors
      when: arista_apply_changes | bool and bgp_config.enabled | default(false) and bgp_neighbors | length > 0
      loop: "{{ bgp_neighbors }}"
      loop_control:
        label: "{{ item.neighbor }}"
      arista.eos.eos_config:
        lines:
          - "router bgp {{ bgp_config.asn }}"
          - "neighbor {{ item.neighbor }} remote-as {{ item.remote_as }}"
          - "neighbor {{ item.neighbor }} description {{ item.description | default('BGP Peer') }}"
          - "neighbor {{ item.neighbor }} send-community {{ item.send_community | default('extended') }}"
          - "{% if item.update_source is defined %}neighbor {{ item.neighbor }} update-source {{ item.update_source }}{% endif %}"
          - "{% if item.ebgp_multihop is defined %}neighbor {{ item.neighbor }} ebgp-multihop {{ item.ebgp_multihop }}{% endif %}"
          - "{% if item.password is defined %}neighbor {{ item.neighbor }} password {{ item.password }}{% endif %}"
          - "neighbor {{ item.neighbor }} maximum-routes {{ item.max_routes | default(12000) }}"
      notify: save eos configuration

    - name: Configure BGP peer groups
      when: arista_apply_changes | bool and bgp_config.enabled | default(false) and bgp_peer_groups | length > 0
      loop: "{{ bgp_peer_groups }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "router bgp {{ bgp_config.asn }}"
          - "neighbor {{ item.name }} peer group"
          - "neighbor {{ item.name }} remote-as {{ item.remote_as }}"
          - "{% if item.update_source is defined %}neighbor {{ item.name }} update-source {{ item.update_source }}{% endif %}"
          - "neighbor {{ item.name }} send-community extended"
          - "neighbor {{ item.name }} maximum-routes {{ item.max_routes | default(12000) }}"
      notify: save eos configuration

    # EVPN Configuration for VXLAN
    - name: Configure BGP EVPN address family
      when: arista_apply_changes | bool and bgp_config.enabled | default(false) and bgp_evpn.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "router bgp {{ bgp_config.asn }}"
          - "address-family evpn"
          - "neighbor {{ bgp_evpn.peer_group }} activate"
          - "neighbor {{ bgp_evpn.peer_group }} encapsulation vxlan"
      notify: save eos configuration

    - name: Configure BGP VRF instances
      when: arista_apply_changes | bool and bgp_config.enabled | default(false) and bgp_vrfs | length > 0
      loop: "{{ bgp_vrfs }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "router bgp {{ bgp_config.asn }}"
          - "vrf {{ item.name }}"
          - "rd {{ item.rd }}"
          - "route-target import {{ item.rt_import | join(' ') }}"
          - "route-target export {{ item.rt_export | join(' ') }}"
          - "redistribute connected"
      notify: save eos configuration

    # OSPF Configuration
    - name: Configure OSPF global settings
      when: arista_apply_changes | bool and ospf_config.enabled | default(false)
      arista.eos.eos_ospfv2:
        config:
          processes:
            - process_id: "{{ ospf_config.process_id | default(1) }}"
              router_id: "{{ ospf_config.router_id | default(fabric_router_id) }}"
              passive_interface:
                default: "{{ ospf_config.passive_default | default(true) }}"
              max_lsa: "{{ ospf_config.max_lsa | default(12000) }}"
              redistribute:
                - routes: "connected"
        state: merged
      notify: save eos configuration

    - name: Configure OSPF on interfaces
      when: arista_apply_changes | bool and ospf_config.enabled | default(false) and ospf_interfaces | length > 0
      arista.eos.eos_ospf_interfaces:
        config: "{{ ospf_interfaces }}"
        state: merged
      notify: save eos configuration

    - name: Configure OSPF areas
      when: arista_apply_changes | bool and ospf_config.enabled | default(false) and ospf_areas | length > 0
      loop: "{{ ospf_areas }}"
      loop_control:
        label: "Area {{ item.area_id }}"
      arista.eos.eos_config:
        lines:
          - "router ospf {{ ospf_config.process_id | default(1) }}"
          - "area {{ item.area_id }} {% if item.type is defined %}{{ item.type }}{% endif %}"
          - "{% if item.authentication is defined %}area {{ item.area_id }} authentication {{ item.authentication }}{% endif %}"
      notify: save eos configuration

    # ISIS Configuration
    - name: Configure ISIS global settings
      when: arista_apply_changes | bool and isis_config.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "router isis {{ isis_config.instance | default('CORE') }}"
          - "net {{ isis_config.net }}"
          - "is-type {{ isis_config.is_type | default('level-2') }}"
          - "log-adjacency-changes"
          - "set-overload-bit on-startup wait-for-bgp timeout {{ isis_config.overload_timeout | default(180) }}"
          - "authentication mode {{ isis_config.auth_mode | default('md5') }} level-2"
          - "!
            address-family ipv4 unicast"
      notify: save eos configuration

    - name: Configure ISIS on interfaces
      when: arista_apply_changes | bool and isis_config.enabled | default(false) and isis_interfaces | length > 0
      loop: "{{ isis_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item.name }}"
          - "isis enable {{ isis_config.instance | default('CORE') }}"
          - "isis circuit-type {{ item.circuit_type | default('level-2') }}"
          - "isis network {{ item.network_type | default('point-to-point') }}"
          - "{% if item.metric is defined %}isis metric {{ item.metric }}{% endif %}"
          - "{% if item.passive is defined and item.passive %}isis passive{% endif %}"
      notify: save eos configuration

    # BFD Configuration for fast failover
    - name: Configure BFD global settings
      when: arista_apply_changes | bool and bfd_config.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "bfd interval {{ bfd_config.interval | default(300) }} min-rx {{ bfd_config.min_rx | default(300) }} multiplier {{ bfd_config.multiplier | default(3) }}"
      notify: save eos configuration

    - name: Save routing state to artifacts
      when: arista_apply_changes | bool
      arista.eos.eos_command:
        commands:
          - show ip route summary
          - show bgp summary
          - show bgp evpn summary
          - show ospf neighbor
          - show isis neighbors
      register: routing_state
      ignore_errors: true

    - name: Write routing state to artifacts
      when: arista_apply_changes | bool and routing_state is defined
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/{{ inventory_hostname }}_routing_state.json"
        content: "{{ routing_state | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "arista/arista_routing_baseline | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_arista_arista_routing_baseline_preflight_passed | bool
          - fe_arista_arista_routing_baseline_status in ['running', 'succeeded']
        fail_msg: >-
          arista/arista_routing_baseline: postflight validation failed - preflight passed
          ={{ fe_arista_arista_routing_baseline_preflight_passed | default(false) }},
          status={{ fe_arista_arista_routing_baseline_status | default('unknown') }}.
        success_msg: "arista/arista_routing_baseline: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "arista/arista_routing_baseline | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_arista_arista_routing_baseline_postflight_passed: true
        fe_arista_arista_routing_baseline_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "arista/arista_routing_baseline | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_arista_arista_routing_baseline_status: "failed"
        fe_arista_arista_routing_baseline_postflight_passed: false
        fe_arista_arista_routing_baseline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_arista_arista_routing_baseline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "arista/arista_routing_baseline | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          arista/arista_routing_baseline: FAILED at '{{ fe_arista_arista_routing_baseline_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_arista_arista_routing_baseline_error }}
      tags:
        - always
        - rescue

    - name: "arista/arista_routing_baseline | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          arista/arista_routing_baseline failed at '{{ fe_arista_arista_routing_baseline_failed_task }}': {{ fe_arista_arista_routing_baseline_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "arista/arista_routing_baseline | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_arista_arista_routing_baseline_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_arista_arista_routing_baseline_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_arista_routing_baseline_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "arista/arista_routing_baseline | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "arista/arista_routing_baseline":
              component: "arista/arista_routing_baseline"
              type: "role"
              platform: "arista"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_arista_arista_routing_baseline_status | default('unknown') }}"
              preflight_passed: "{{ fe_arista_arista_routing_baseline_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_arista_arista_routing_baseline_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_arista_arista_routing_baseline_started_at | default('') }}"
              ended_at: "{{ fe_arista_arista_routing_baseline_ended_at | default('') }}"
              duration_seconds: "{{ fe_arista_arista_routing_baseline_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_arista_arista_routing_baseline_failed_task | default('') }}"
              error: "{{ fe_arista_arista_routing_baseline_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_arista_arista_routing_baseline_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_arista_arista_routing_baseline_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_arista_arista_routing_baseline_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_arista_arista_routing_baseline_status | default('') == 'succeeded' else ['arista/arista_routing_baseline'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "arista/arista_routing_baseline | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_arista_arista_routing_baseline_stats_published: true
      tags:
        - always
