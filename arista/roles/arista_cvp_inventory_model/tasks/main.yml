---
# tasks file for arista_cvp_inventory_model
# Production-ready CloudVision Portal (CVP) integration for Fourth Estate agencies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['arista/arista_cvp_inventory_model']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_arista_arista_cvp_inventory_model_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "arista/arista_cvp_inventory_model | Initialize validation state"
  ansible.builtin.set_fact:
    fe_arista_arista_cvp_inventory_model_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_arista_arista_cvp_inventory_model_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_arista_arista_cvp_inventory_model_status: "running"
    fe_arista_arista_cvp_inventory_model_preflight_passed: false
    fe_arista_arista_cvp_inventory_model_postflight_passed: false
    fe_arista_arista_cvp_inventory_model_failed_task: ""
    fe_arista_arista_cvp_inventory_model_error: ""
    fe_arista_arista_cvp_inventory_model_stats_published: false
  tags:
    - always

- name: "arista/arista_cvp_inventory_model | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "arista/arista_cvp_inventory_model | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          arista/arista_cvp_inventory_model: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          arista/arista_cvp_inventory_model: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_cvp_inventory_model | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "arista/arista_cvp_inventory_model: required variable '{{ item }}' is not defined."
        success_msg: "arista/arista_cvp_inventory_model: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_arista_arista_cvp_inventory_model_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_cvp_inventory_model | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_arista_arista_cvp_inventory_model_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ arista_artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Validate CVP connection parameters
      ansible.builtin.assert:
        that:
          - cvp_host is defined
          - cvp_username is defined
          - cvp_password is defined
        fail_msg: "CVP connection parameters (cvp_host, cvp_username, cvp_password) must be defined"
        quiet: true

    - name: Save CVP configuration plan
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/cvp_inventory_plan.json"
        content: "{{ cvp_inventory | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    - name: Create CVP container topology
      when: arista_apply_changes | bool and cvp_containers | length > 0
      arista.cvp.cv_container_v3:
        topology: "{{ cvp_containers }}"
        state: present
        apply_mode: "{{ cvp_apply_mode | default('strict') }}"
      register: cvp_container_result
      delegate_to: localhost

    - name: Display container creation results
      when: arista_apply_changes | bool and cvp_container_result is defined
      ansible.builtin.debug:
        msg: "Container topology created: {{ cvp_container_result }}"
        verbosity: 1

    - name: Upload configlets to CVP
      when: arista_apply_changes | bool and cvp_configlets | length > 0
      arista.cvp.cv_configlet_v3:
        configlets: "{{ cvp_configlets }}"
        state: present
        configlets_notes: "Managed by Ansible - {{ ansible_date_time.iso8601 }}"
      register: cvp_configlet_result
      delegate_to: localhost

    - name: Display configlet upload results
      when: arista_apply_changes | bool and cvp_configlet_result is defined
      ansible.builtin.debug:
        msg: "Configlets uploaded: {{ cvp_configlet_result }}"
        verbosity: 1

    - name: Register devices in CVP inventory
      when: arista_apply_changes | bool and cvp_devices | length > 0
      arista.cvp.cv_device_v3:
        devices: "{{ cvp_devices }}"
        state: present
        apply_mode: "{{ cvp_apply_mode | default('strict') }}"
        search_key: "{{ cvp_search_key | default('hostname') }}"
      register: cvp_device_result
      delegate_to: localhost

    - name: Display device registration results
      when: arista_apply_changes | bool and cvp_device_result is defined
      ansible.builtin.debug:
        msg: "Devices registered: {{ cvp_device_result }}"
        verbosity: 1

    - name: Apply configlets to devices
      when: arista_apply_changes | bool and cvp_device_configlets | length > 0
      loop: "{{ cvp_device_configlets }}"
      loop_control:
        label: "{{ item.device }}"
      arista.cvp.cv_device_v3:
        devices:
          - fqdn: "{{ item.device }}"
            configlets: "{{ item.configlets }}"
        state: present
      register: cvp_configlet_apply_result
      delegate_to: localhost

    - name: Create change controls for CVP tasks
      when: (arista_apply_changes | bool and cvp_change_control.enabled | default(false)) and (cvp_task_ids is defined and cvp_task_ids | length > 0)
      arista.cvp.cv_change_control_v3:
        state: "{{ cvp_change_control.state | default('set') }}"
        change:
          name: "{{ cvp_change_control.name }}"
          notes: "{{ cvp_change_control.notes | default('Automated change via Ansible') }}"
          activities:
            - task_id: "{{ item }}"
              stage: "{{ cvp_change_control.stage | default('main') }}"
          stages:
            - name: "{{ cvp_change_control.stage | default('main') }}"
              mode: "{{ cvp_change_control.mode | default('series') }}"
        schedule:
          type: "{{ cvp_change_control.schedule_type | default('immediate') }}"
          start_time: "{{ cvp_change_control.start_time | default(omit) }}"
      loop: "{{ cvp_task_ids | default([]) }}"
      register: cvp_change_control_result
      delegate_to: localhost

    - name: Execute change control
      when: arista_apply_changes | bool and cvp_change_control.auto_execute | default(false)
      arista.cvp.cv_change_control_v3:
        state: approve
        change:
          name: "{{ cvp_change_control.name }}"
      delegate_to: localhost

    - name: Collect device facts from CVP
      when: cvp_collect_facts | default(true)
      arista.cvp.cv_facts_v3:
        facts:
          - devices
          - containers
          - configlets
          - tasks
        regexp_filter: "{{ cvp_facts_filter | default('.*') }}"
      register: cvp_facts
      delegate_to: localhost

    - name: Save CVP facts to artifacts
      when: cvp_collect_facts | default(true) and cvp_facts is defined
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/cvp_facts.json"
        content: "{{ cvp_facts | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    - name: Validate device compliance in CVP
      when: cvp_validate_compliance | default(true) and arista_apply_changes | bool
      arista.cvp.cv_validate_v3:
        mode: "{{ cvp_validation_mode | default('stop_on_error') }}"
        validate_mode: "{{ cvp_validation_type | default('valid') }}"
      register: cvp_validation_result
      delegate_to: localhost
      ignore_errors: true

    - name: Display compliance validation results
      when: cvp_validate_compliance | default(true) and cvp_validation_result is defined
      ansible.builtin.debug:
        msg: "Compliance validation: {{ cvp_validation_result }}"

    - name: Generate CVP deployment report
      when: arista_apply_changes | bool
      ansible.builtin.template:
        src: cvp_deployment_report.j2
        dest: "{{ arista_artifacts_dir }}/cvp_deployment_report_{{ ansible_date_time.epoch }}.html"
        mode: "0644"
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "arista/arista_cvp_inventory_model | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_arista_arista_cvp_inventory_model_preflight_passed | bool
          - fe_arista_arista_cvp_inventory_model_status in ['running', 'succeeded']
        fail_msg: >-
          arista/arista_cvp_inventory_model: postflight validation failed - preflight passed
          ={{ fe_arista_arista_cvp_inventory_model_preflight_passed | default(false) }},
          status={{ fe_arista_arista_cvp_inventory_model_status | default('unknown') }}.
        success_msg: "arista/arista_cvp_inventory_model: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "arista/arista_cvp_inventory_model | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_arista_arista_cvp_inventory_model_postflight_passed: true
        fe_arista_arista_cvp_inventory_model_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "arista/arista_cvp_inventory_model | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_arista_arista_cvp_inventory_model_status: "failed"
        fe_arista_arista_cvp_inventory_model_postflight_passed: false
        fe_arista_arista_cvp_inventory_model_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_arista_arista_cvp_inventory_model_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "arista/arista_cvp_inventory_model | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          arista/arista_cvp_inventory_model: FAILED at '{{ fe_arista_arista_cvp_inventory_model_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_arista_arista_cvp_inventory_model_error }}
      tags:
        - always
        - rescue

    - name: "arista/arista_cvp_inventory_model | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          arista/arista_cvp_inventory_model failed at '{{ fe_arista_arista_cvp_inventory_model_failed_task }}': {{ fe_arista_arista_cvp_inventory_model_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "arista/arista_cvp_inventory_model | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_arista_arista_cvp_inventory_model_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_arista_arista_cvp_inventory_model_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_arista_cvp_inventory_model_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "arista/arista_cvp_inventory_model | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "arista/arista_cvp_inventory_model":
              component: "arista/arista_cvp_inventory_model"
              type: "role"
              platform: "arista"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_arista_arista_cvp_inventory_model_status | default('unknown') }}"
              preflight_passed: "{{ fe_arista_arista_cvp_inventory_model_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_arista_arista_cvp_inventory_model_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_arista_arista_cvp_inventory_model_started_at | default('') }}"
              ended_at: "{{ fe_arista_arista_cvp_inventory_model_ended_at | default('') }}"
              duration_seconds: "{{ fe_arista_arista_cvp_inventory_model_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_arista_arista_cvp_inventory_model_failed_task | default('') }}"
              error: "{{ fe_arista_arista_cvp_inventory_model_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_arista_arista_cvp_inventory_model_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_arista_arista_cvp_inventory_model_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_arista_arista_cvp_inventory_model_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_arista_arista_cvp_inventory_model_status | default('') == 'succeeded' else ['arista/arista_cvp_inventory_model'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "arista/arista_cvp_inventory_model | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_arista_arista_cvp_inventory_model_stats_published: true
      tags:
        - always
