---
# tasks file for arista_acl_qos_security
# Production-ready ACL, QoS, and security configuration with DISA STIG compliance

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['arista/arista_acl_qos_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_arista_arista_acl_qos_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "arista/arista_acl_qos_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_arista_arista_acl_qos_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_arista_arista_acl_qos_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_arista_arista_acl_qos_security_status: "running"
    fe_arista_arista_acl_qos_security_preflight_passed: false
    fe_arista_arista_acl_qos_security_postflight_passed: false
    fe_arista_arista_acl_qos_security_failed_task: ""
    fe_arista_arista_acl_qos_security_error: ""
    fe_arista_arista_acl_qos_security_stats_published: false
  tags:
    - always

- name: "arista/arista_acl_qos_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "arista/arista_acl_qos_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          arista/arista_acl_qos_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          arista/arista_acl_qos_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_acl_qos_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "arista/arista_acl_qos_security: required variable '{{ item }}' is not defined."
        success_msg: "arista/arista_acl_qos_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_arista_arista_acl_qos_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "arista/arista_acl_qos_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_arista_arista_acl_qos_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ arista_artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Save security configuration plan
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/{{ inventory_hostname }}_security_plan.json"
        content: "{{ security_config | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    # ACL Configuration
    - name: Configure IPv4 ACLs
      when: arista_apply_changes | bool and ipv4_acls | length > 0
      arista.eos.eos_acls:
        config: "{{ ipv4_acls }}"
        state: merged
      notify: save eos configuration

    - name: Apply ACLs to interfaces
      when: arista_apply_changes | bool and acl_interfaces | length > 0
      loop: "{{ acl_interfaces }}"
      loop_control:
        label: "{{ item.name }} - {{ item.direction }}"
      arista.eos.eos_acl_interfaces:
        config:
          - name: "{{ item.name }}"
            access_groups:
              - afi: "{{ item.afi | default('ipv4') }}"
                acls:
                  - name: "{{ item.acl }}"
                    direction: "{{ item.direction }}"
        state: merged
      notify: save eos configuration

    # QoS Configuration
    - name: Configure QoS class maps
      when: arista_apply_changes | bool and qos_class_maps | length > 0
      loop: "{{ qos_class_maps }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "class-map {{ item.type | default('match-any') }} {{ item.name }}"
          - "{% for match in item.match %}match {{ match }}{% endfor %}"
      notify: save eos configuration

    - name: Configure QoS policy maps
      when: arista_apply_changes | bool and qos_policy_maps | length > 0
      loop: "{{ qos_policy_maps }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "policy-map {{ item.type | default('type qos') }} {{ item.name }}"
          - "{% for class_policy in item.classes %}class {{ class_policy.class }} set dscp {{ class_policy.dscp }} set cos {{ class_policy.cos }}{% endfor %}"
      notify: save eos configuration

    - name: Apply QoS policies to interfaces
      when: arista_apply_changes | bool and qos_interfaces | length > 0
      loop: "{{ qos_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item.name }}"
          - "service-policy {{ item.direction }} {{ item.policy }}"
      notify: save eos configuration

    # Storm Control (DISA STIG)
    - name: Configure storm control
      when: arista_apply_changes | bool and storm_control_interfaces | length > 0
      loop: "{{ storm_control_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item.name }}"
          - "storm-control broadcast level {{ item.broadcast_level | default('10') }}"
          - "storm-control multicast level {{ item.multicast_level | default('10') }}"
          - "storm-control unknown-unicast level {{ item.unknown_unicast_level | default('10') }}"
      notify: save eos configuration

    # Port Security
    - name: Configure port security
      when: arista_apply_changes | bool and port_security_interfaces | length > 0
      loop: "{{ port_security_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item.name }}"
          - "switchport port-security"
          - "switchport port-security maximum {{ item.max_addresses | default(3) }}"
          - "switchport port-security violation {{ item.violation_mode | default('restrict') }}"
          - "{% if item.sticky | default(false) %}switchport port-security mac-address sticky{% endif %}"
      notify: save eos configuration

    # DHCP Snooping
    - name: Enable DHCP snooping globally
      when: arista_apply_changes | bool and dhcp_snooping.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "ip dhcp snooping"
          - "ip dhcp snooping vlan {{ dhcp_snooping.vlans | join(',') }}"
      notify: save eos configuration

    - name: Configure DHCP snooping trusted interfaces
      when: arista_apply_changes | bool and dhcp_snooping.enabled | default(false)
      loop: "{{ dhcp_snooping.trusted_interfaces | default([]) }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item }}"
          - "ip dhcp snooping trust"
      notify: save eos configuration

    # Dynamic ARP Inspection
    - name: Enable Dynamic ARP Inspection
      when: arista_apply_changes | bool and arp_inspection.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "ip arp inspection vlan {{ arp_inspection.vlans | join(',') }}"
          - "ip arp inspection validate {{ arp_inspection.validation | default('src-mac dst-mac ip') }}"
      notify: save eos configuration

    - name: Configure ARP inspection trusted interfaces
      when: arista_apply_changes | bool and arp_inspection.enabled | default(false)
      loop: "{{ arp_inspection.trusted_interfaces | default([]) }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item }}"
          - "ip arp inspection trust"
      notify: save eos configuration

    # IP Source Guard
    - name: Configure IP source guard
      when: arista_apply_changes | bool and ip_source_guard_interfaces | length > 0
      loop: "{{ ip_source_guard_interfaces }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item }}"
          - "ip verify source"
      notify: save eos configuration

    # 802.1X Port-Based Authentication
    - name: Configure 802.1X globally
      when: arista_apply_changes | bool and dot1x_config.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "aaa authentication dot1x default group {{ dot1x_config.server_group | default('radius') }}"
          - "dot1x system-auth-control"
      notify: save eos configuration

    - name: Configure 802.1X on interfaces
      when: arista_apply_changes | bool and dot1x_interfaces | length > 0
      loop: "{{ dot1x_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item.name }}"
          - "dot1x pae {{ item.pae | default('authenticator') }}"
          - "dot1x reauthentication"
          - "dot1x port-control {{ item.port_control | default('auto') }}"
          - "dot1x timeout reauth-period {{ item.reauth_period | default(3600) }}"
      notify: save eos configuration

    # MAC Address Filtering
    - name: Configure static MAC addresses
      when: arista_apply_changes | bool and static_mac_addresses | length > 0
      loop: "{{ static_mac_addresses }}"
      loop_control:
        label: "{{ item.mac }}"
      arista.eos.eos_config:
        lines:
          - "mac address-table static {{ item.mac }} vlan {{ item.vlan }} interface {{ item.interface }}"
      notify: save eos configuration

    # Secure Unused Ports (DISA STIG)
    - name: Shutdown unused ports
      when: arista_apply_changes | bool and unused_ports | length > 0
      loop: "{{ unused_ports }}"
      arista.eos.eos_interfaces:
        config:
          - name: "{{ item }}"
            description: "UNUSED - SECURITY SHUTDOWN"
            enabled: false
        state: merged
      notify: save eos configuration

    - name: Place unused ports in blackhole VLAN
      when: arista_apply_changes | bool and unused_ports | length > 0 and blackhole_vlan is defined
      loop: "{{ unused_ports }}"
      arista.eos.eos_l2_interfaces:
        config:
          - name: "{{ item }}"
            mode: "access"
            access:
              vlan: "{{ blackhole_vlan }}"
        state: merged
      notify: save eos configuration

    # BPDU Guard and Root Guard
    - name: Configure BPDU guard on edge ports
      when: arista_apply_changes | bool and bpdu_guard_interfaces | length > 0
      loop: "{{ bpdu_guard_interfaces }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item }}"
          - "spanning-tree bpduguard enable"
          - "spanning-tree portfast"
      notify: save eos configuration

    - name: Configure root guard on uplinks
      when: arista_apply_changes | bool and root_guard_interfaces | length > 0
      loop: "{{ root_guard_interfaces }}"
      arista.eos.eos_config:
        lines:
          - "interface {{ item }}"
          - "spanning-tree guard root"
      notify: save eos configuration

    # Rate Limiting
    - name: Configure rate limiting for control plane
      when: arista_apply_changes | bool and rate_limiting.enabled | default(false)
      arista.eos.eos_config:
        lines:
          - "control-plane"
          - "ip access-group {{ rate_limiting.acl | default('RATE_LIMIT_ACL') }} in"
      notify: save eos configuration

    - name: Save security state to artifacts
      when: arista_apply_changes | bool
      arista.eos.eos_command:
        commands:
          - show ip access-lists
          - show port-security
          - show ip dhcp snooping
          - show ip arp inspection
          - show dot1x all
      register: security_state
      ignore_errors: true

    - name: Write security state to artifacts
      when: arista_apply_changes | bool and security_state is defined
      ansible.builtin.copy:
        dest: "{{ arista_artifacts_dir }}/{{ inventory_hostname }}_security_state.json"
        content: "{{ security_state | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "arista/arista_acl_qos_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_arista_arista_acl_qos_security_preflight_passed | bool
          - fe_arista_arista_acl_qos_security_status in ['running', 'succeeded']
        fail_msg: >-
          arista/arista_acl_qos_security: postflight validation failed - preflight passed
          ={{ fe_arista_arista_acl_qos_security_preflight_passed | default(false) }},
          status={{ fe_arista_arista_acl_qos_security_status | default('unknown') }}.
        success_msg: "arista/arista_acl_qos_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "arista/arista_acl_qos_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_arista_arista_acl_qos_security_postflight_passed: true
        fe_arista_arista_acl_qos_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "arista/arista_acl_qos_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_arista_arista_acl_qos_security_status: "failed"
        fe_arista_arista_acl_qos_security_postflight_passed: false
        fe_arista_arista_acl_qos_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_arista_arista_acl_qos_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "arista/arista_acl_qos_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          arista/arista_acl_qos_security: FAILED at '{{ fe_arista_arista_acl_qos_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_arista_arista_acl_qos_security_error }}
      tags:
        - always
        - rescue

    - name: "arista/arista_acl_qos_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          arista/arista_acl_qos_security failed at '{{ fe_arista_arista_acl_qos_security_failed_task }}': {{ fe_arista_arista_acl_qos_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "arista/arista_acl_qos_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_arista_arista_acl_qos_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_arista_arista_acl_qos_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_arista_arista_acl_qos_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "arista/arista_acl_qos_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "arista/arista_acl_qos_security":
              component: "arista/arista_acl_qos_security"
              type: "role"
              platform: "arista"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_arista_arista_acl_qos_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_arista_arista_acl_qos_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_arista_arista_acl_qos_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_arista_arista_acl_qos_security_started_at | default('') }}"
              ended_at: "{{ fe_arista_arista_acl_qos_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_arista_arista_acl_qos_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_arista_arista_acl_qos_security_failed_task | default('') }}"
              error: "{{ fe_arista_arista_acl_qos_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_arista_arista_acl_qos_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_arista_arista_acl_qos_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_arista_arista_acl_qos_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_arista_arista_acl_qos_security_status | default('') == 'succeeded' else ['arista/arista_acl_qos_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "arista/arista_acl_qos_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_arista_arista_acl_qos_security_stats_published: true
      tags:
        - always
