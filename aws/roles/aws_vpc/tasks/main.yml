---
# tasks file for aws_vpc

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_vpc']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_vpc_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_vpc | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_vpc_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_vpc_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_vpc_status: "running"
    fe_aws_aws_vpc_preflight_passed: false
    fe_aws_aws_vpc_postflight_passed: false
    fe_aws_aws_vpc_failed_task: ""
    fe_aws_aws_vpc_error: ""
    fe_aws_aws_vpc_stats_published: false
  tags:
    - always

- name: "aws/aws_vpc | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_vpc | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_vpc: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_vpc: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_vpc | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_vpc: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_vpc: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_vpc_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_vpc | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_vpc_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ vpc_region }}"
        dns_support: "{{ vpc_enable_dns_support }}"
        dns_hostnames: "{{ vpc_enable_dns_hostnames }}"
        tenancy: "{{ vpc_instance_tenancy }}"
        state: "{{ vpc_state }}"
        tags: "{{ vpc_tags }}"
      register: vpc_result

    - name: Set VPC ID fact
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_result.vpc.id }}"
      when: vpc_result.vpc is defined

    - name: Display VPC information
      ansible.builtin.debug:
        msg:
          - "VPC Created: {{ vpc_name }}"
          - "VPC ID: {{ vpc_id | default('N/A') }}"
          - "CIDR Block: {{ vpc_cidr }}"
          - "Region: {{ vpc_region }}"

    - name: Create DHCP options set
      amazon.aws.ec2_vpc_dhcp_option:
        domain_name: "{{ vpc_dhcp_options_domain_name }}"
        dns_servers: "{{ vpc_dhcp_options_domain_name_servers }}"
        vpc_id: "{{ vpc_id }}"
        region: "{{ vpc_region }}"
        tags: "{{ vpc_tags }}"
        state: "{{ vpc_state }}"
      when:
        - vpc_dhcp_options_domain_name | length > 0
        - vpc_id is defined

    - name: Enable VPC Flow Logs
      community.aws.ec2_vpc_flow_log:
        vpc_id: "{{ vpc_id }}"
        log_destination_type: "{{ vpc_flow_logs_destination_type }}"
        log_destination: "{{ vpc_flow_logs_log_group_name }}"
        traffic_type: "{{ vpc_flow_logs_traffic_type }}"
        region: "{{ vpc_region }}"
        state: "{{ vpc_state }}"
      when:
        - vpc_enable_flow_logs | bool
        - vpc_id is defined

    - name: Save VPC ID to file
      ansible.builtin.copy:
        content: "{{ vpc_id }}"
        dest: "/tmp/{{ vpc_name }}_vpc_id.txt"
        mode: '0644'
      delegate_to: localhost
      when: vpc_id is defined

    # ----------------------------- postflight -------------------

    - name: "aws/aws_vpc | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_vpc_preflight_passed | bool
          - fe_aws_aws_vpc_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_vpc: postflight validation failed - preflight passed
          ={{ fe_aws_aws_vpc_preflight_passed | default(false) }},
          status={{ fe_aws_aws_vpc_status | default('unknown') }}.
        success_msg: "aws/aws_vpc: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_vpc | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_vpc_postflight_passed: true
        fe_aws_aws_vpc_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_vpc | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_vpc_status: "failed"
        fe_aws_aws_vpc_postflight_passed: false
        fe_aws_aws_vpc_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_vpc_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_vpc | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_vpc: FAILED at '{{ fe_aws_aws_vpc_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_vpc_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_vpc | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_vpc failed at '{{ fe_aws_aws_vpc_failed_task }}': {{ fe_aws_aws_vpc_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_vpc | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_vpc_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_vpc_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_vpc_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_vpc | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_vpc":
              component: "aws/aws_vpc"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_vpc_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_vpc_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_vpc_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_vpc_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_vpc_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_vpc_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_vpc_failed_task | default('') }}"
              error: "{{ fe_aws_aws_vpc_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_vpc_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_vpc_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_vpc_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_vpc_status | default('') == 'succeeded' else ['aws/aws_vpc'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_vpc | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_vpc_stats_published: true
      tags:
        - always
