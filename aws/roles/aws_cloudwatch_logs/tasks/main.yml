---
# tasks file for aws_cloudwatch_logs

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_cloudwatch_logs']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_cloudwatch_logs_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_cloudwatch_logs | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_cloudwatch_logs_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_cloudwatch_logs_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_cloudwatch_logs_status: "running"
    fe_aws_aws_cloudwatch_logs_preflight_passed: false
    fe_aws_aws_cloudwatch_logs_postflight_passed: false
    fe_aws_aws_cloudwatch_logs_failed_task: ""
    fe_aws_aws_cloudwatch_logs_error: ""
    fe_aws_aws_cloudwatch_logs_stats_published: false
  tags:
    - always

- name: "aws/aws_cloudwatch_logs | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_cloudwatch_logs | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_cloudwatch_logs: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_cloudwatch_logs: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_cloudwatch_logs | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_cloudwatch_logs: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_cloudwatch_logs: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_cloudwatch_logs_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_cloudwatch_logs | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudwatch_logs_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create CloudWatch log groups
      community.aws.cloudwatchlogs_log_group:
        log_group_name: "{{ item.name }}"
        retention_in_days: "{{ item.retention_days | default(cloudwatch_log_retention_days) }}"
        kms_key_id: "{{ item.kms_key_id | default(kms_key_id) }}"
        tags: "{{ item.tags | default(cloudwatch_log_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        state: "{{ item.state | default(cloudwatch_log_state) }}"
      loop: "{{ cloudwatch_log_groups }}"
      when: cloudwatch_log_groups is defined
      register: log_group_result

    - name: Create log group metric filters
      community.aws.cloudwatchlogs_log_group_metric_filter:
        log_group_name: "{{ item.log_group }}"
        filter_name: "{{ item.name }}"
        filter_pattern: "{{ item.pattern }}"
        metric_transformation:
          metric_name: "{{ item.metric_name }}"
          metric_namespace: "{{ item.metric_namespace }}"
          metric_value: "{{ item.metric_value | default('1') }}"
        state: "{{ item.state | default(cloudwatch_log_state) }}"
      loop: "{{ cloudwatch_metric_filters }}"
      when: cloudwatch_metric_filters is defined

    - name: Create subscription filters for log aggregation
      community.aws.cloudwatchlogs_log_group_subscription_filter:
        log_group_name: "{{ item.log_group }}"
        filter_name: "{{ item.name }}"
        filter_pattern: "{{ item.pattern }}"
        destination_arn: "{{ item.destination_arn }}"
        role_arn: "{{ item.role_arn }}"
        state: "{{ item.state | default(cloudwatch_log_state) }}"
      loop: "{{ cloudwatch_subscription_filters }}"
      when: cloudwatch_subscription_filters is defined

    - name: Display CloudWatch logs summary
      ansible.builtin.debug:
        msg:
          - "Log Groups Created: {{ log_group_result.results | selectattr('changed', 'equalto', true) | list | length if log_group_result is defined else 0 }}"

    # ----------------------------- postflight -------------------

    - name: "aws/aws_cloudwatch_logs | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_cloudwatch_logs_preflight_passed | bool
          - fe_aws_aws_cloudwatch_logs_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_cloudwatch_logs: postflight validation failed - preflight passed
          ={{ fe_aws_aws_cloudwatch_logs_preflight_passed | default(false) }},
          status={{ fe_aws_aws_cloudwatch_logs_status | default('unknown') }}.
        success_msg: "aws/aws_cloudwatch_logs: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_cloudwatch_logs | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudwatch_logs_postflight_passed: true
        fe_aws_aws_cloudwatch_logs_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_cloudwatch_logs | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudwatch_logs_status: "failed"
        fe_aws_aws_cloudwatch_logs_postflight_passed: false
        fe_aws_aws_cloudwatch_logs_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_cloudwatch_logs_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_cloudwatch_logs | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_cloudwatch_logs: FAILED at '{{ fe_aws_aws_cloudwatch_logs_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_cloudwatch_logs_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_cloudwatch_logs | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_cloudwatch_logs failed at '{{ fe_aws_aws_cloudwatch_logs_failed_task }}': {{ fe_aws_aws_cloudwatch_logs_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_cloudwatch_logs | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudwatch_logs_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_cloudwatch_logs_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_cloudwatch_logs_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_cloudwatch_logs | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_cloudwatch_logs":
              component: "aws/aws_cloudwatch_logs"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_cloudwatch_logs_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_cloudwatch_logs_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_cloudwatch_logs_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_cloudwatch_logs_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_cloudwatch_logs_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_cloudwatch_logs_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_cloudwatch_logs_failed_task | default('') }}"
              error: "{{ fe_aws_aws_cloudwatch_logs_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_cloudwatch_logs_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_cloudwatch_logs_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_cloudwatch_logs_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_cloudwatch_logs_status | default('') == 'succeeded' else ['aws/aws_cloudwatch_logs'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_cloudwatch_logs | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudwatch_logs_stats_published: true
      tags:
        - always
