---
# tasks file for aws_s3_lifecycle

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_s3_lifecycle']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_s3_lifecycle_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_s3_lifecycle | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_s3_lifecycle_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_s3_lifecycle_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_s3_lifecycle_status: "running"
    fe_aws_aws_s3_lifecycle_preflight_passed: false
    fe_aws_aws_s3_lifecycle_postflight_passed: false
    fe_aws_aws_s3_lifecycle_failed_task: ""
    fe_aws_aws_s3_lifecycle_error: ""
    fe_aws_aws_s3_lifecycle_stats_published: false
  tags:
    - always

- name: "aws/aws_s3_lifecycle | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_s3_lifecycle | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_s3_lifecycle: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_s3_lifecycle: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_s3_lifecycle | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_s3_lifecycle: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_s3_lifecycle: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_s3_lifecycle_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_s3_lifecycle | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_s3_lifecycle_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure S3 bucket lifecycle policies
      amazon.aws.s3_lifecycle:
        name: "{{ item.bucket_name }}"
        state: "{{ item.state | default(s3_lifecycle_state) }}"
        rule_id: "{{ item.rule_id }}"
        prefix: "{{ item.prefix | default('') }}"
        status: "{{ item.status | default('enabled') }}"
        expiration_days: "{{ item.expiration_days | default(omit) }}"
        expiration_date: "{{ item.expiration_date | default(omit) }}"
        noncurrent_version_expiration_days: "{{ item.noncurrent_version_expiration_days | default(omit) }}"
        transitions: "{{ item.transitions | default([]) }}"
        noncurrent_version_transitions: "{{ item.noncurrent_version_transitions | default([]) }}"
        abort_incomplete_multipart_upload_days: "{{ item.abort_incomplete_multipart_upload_days | default(7) }}"
      loop: "{{ s3_lifecycle_rules }}"
      when: s3_lifecycle_rules is defined
      register: lifecycle_result

    - name: Configure intelligent tiering for cost optimization
      amazon.aws.s3_lifecycle:
        name: "{{ item.bucket_name }}"
        rule_id: "intelligent-tiering-{{ item.bucket_name }}"
        status: "enabled"
        transitions:
          - days: 0
            storage_class: "INTELLIGENT_TIERING"
        state: present
      loop: "{{ s3_buckets_for_tiering }}"
      when:
        - s3_buckets_for_tiering is defined
        - s3_enable_intelligent_tiering | bool

    - name: Display S3 lifecycle summary
      ansible.builtin.debug:
        msg:
          - "Lifecycle Rules Configured: {{ lifecycle_result.results | selectattr('changed', 'equalto', true) | list | length if lifecycle_result is defined else 0 }}"

    - name: Notify S3 lifecycle changes
      ansible.builtin.debug:
        msg: "S3 lifecycle configuration completed"
      changed_when: true
      notify: notify s3 lifecycle changes
      when:
        - lifecycle_result is defined
        - lifecycle_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_s3_lifecycle | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_s3_lifecycle_preflight_passed | bool
          - fe_aws_aws_s3_lifecycle_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_s3_lifecycle: postflight validation failed - preflight passed
          ={{ fe_aws_aws_s3_lifecycle_preflight_passed | default(false) }},
          status={{ fe_aws_aws_s3_lifecycle_status | default('unknown') }}.
        success_msg: "aws/aws_s3_lifecycle: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_s3_lifecycle | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_s3_lifecycle_postflight_passed: true
        fe_aws_aws_s3_lifecycle_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_s3_lifecycle | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_s3_lifecycle_status: "failed"
        fe_aws_aws_s3_lifecycle_postflight_passed: false
        fe_aws_aws_s3_lifecycle_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_s3_lifecycle_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_s3_lifecycle | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_s3_lifecycle: FAILED at '{{ fe_aws_aws_s3_lifecycle_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_s3_lifecycle_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_s3_lifecycle | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_s3_lifecycle failed at '{{ fe_aws_aws_s3_lifecycle_failed_task }}': {{ fe_aws_aws_s3_lifecycle_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_s3_lifecycle | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_s3_lifecycle_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_s3_lifecycle_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_s3_lifecycle_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_s3_lifecycle | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_s3_lifecycle":
              component: "aws/aws_s3_lifecycle"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_s3_lifecycle_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_s3_lifecycle_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_s3_lifecycle_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_s3_lifecycle_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_s3_lifecycle_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_s3_lifecycle_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_s3_lifecycle_failed_task | default('') }}"
              error: "{{ fe_aws_aws_s3_lifecycle_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_s3_lifecycle_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_s3_lifecycle_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_s3_lifecycle_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_s3_lifecycle_status | default('') == 'succeeded' else ['aws/aws_s3_lifecycle'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_s3_lifecycle | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_s3_lifecycle_stats_published: true
      tags:
        - always
