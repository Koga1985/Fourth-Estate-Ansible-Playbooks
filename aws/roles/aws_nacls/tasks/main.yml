---
# tasks file for aws_nacls

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_nacls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_nacls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_nacls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_nacls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_nacls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_nacls_status: "running"
    fe_aws_aws_nacls_preflight_passed: false
    fe_aws_aws_nacls_postflight_passed: false
    fe_aws_aws_nacls_failed_task: ""
    fe_aws_aws_nacls_error: ""
    fe_aws_aws_nacls_stats_published: false
  tags:
    - always

- name: "aws/aws_nacls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_nacls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_nacls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_nacls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_nacls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_nacls: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_nacls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_nacls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_nacls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_nacls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create Network ACLs
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ item.vpc_id | default(vpc_id) }}"
        name: "{{ item.name }}"
        region: "{{ item.region | default(aws_region) }}"
        subnets: "{{ item.subnets | default([]) }}"
        ingress: "{{ item.ingress | default([]) }}"
        egress: "{{ item.egress | default([]) }}"
        tags: "{{ item.tags | default(nacl_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        state: "{{ item.state | default(nacl_state) }}"
      loop: "{{ network_acls }}"
      when: network_acls is defined
      register: nacl_result

    - name: Create public subnet NACL with strict rules
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ vpc_id }}"
        name: "{{ nacl_public_name }}"
        region: "{{ aws_region }}"
        subnets: "{{ public_subnet_ids }}"
        ingress:
          - [100, 'tcp', 'allow', '0.0.0.0/0', null, null, 80, 80]
          - [110, 'tcp', 'allow', '0.0.0.0/0', null, null, 443, 443]
          - [120, 'tcp', 'allow', '0.0.0.0/0', null, null, 1024, 65535]
          - [130, 'icmp', 'allow', '0.0.0.0/0', 0, 0]
        egress:
          - [100, 'tcp', 'allow', '0.0.0.0/0', null, null, 80, 80]
          - [110, 'tcp', 'allow', '0.0.0.0/0', null, null, 443, 443]
          - [120, 'tcp', 'allow', '0.0.0.0/0', null, null, 1024, 65535]
          - [130, 'icmp', 'allow', '0.0.0.0/0', 0, 0]
        tags: "{{ nacl_tags | combine({'Name': nacl_public_name, 'Type': 'Public'}) }}"
        state: "{{ nacl_state }}"
      when:
        - create_public_nacl | bool
        - public_subnet_ids is defined
      register: public_nacl

    - name: Create private subnet NACL with restrictive rules
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ vpc_id }}"
        name: "{{ nacl_private_name }}"
        region: "{{ aws_region }}"
        subnets: "{{ private_subnet_ids }}"
        ingress:
          - [100, 'tcp', 'allow', '{{ vpc_cidr }}', null, null, 0, 65535]
          - [110, 'tcp', 'allow', '0.0.0.0/0', null, null, 1024, 65535]
          - [120, 'icmp', 'allow', '{{ vpc_cidr }}', 0, 0]
        egress:
          - [100, 'tcp', 'allow', '0.0.0.0/0', null, null, 80, 80]
          - [110, 'tcp', 'allow', '0.0.0.0/0', null, null, 443, 443]
          - [120, 'tcp', 'allow', '{{ vpc_cidr }}', null, null, 0, 65535]
          - [130, 'tcp', 'allow', '0.0.0.0/0', null, null, 1024, 65535]
        tags: "{{ nacl_tags | combine({'Name': nacl_private_name, 'Type': 'Private'}) }}"
        state: "{{ nacl_state }}"
      when:
        - create_private_nacl | bool
        - private_subnet_ids is defined
      register: private_nacl

    - name: Create database subnet NACL with strict isolation
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ vpc_id }}"
        name: "{{ nacl_database_name }}"
        region: "{{ aws_region }}"
        subnets: "{{ database_subnet_ids }}"
        ingress:
          - [100, 'tcp', 'allow', '{{ app_subnet_cidr }}', null, null, 3306, 3306]
          - [110, 'tcp', 'allow', '{{ app_subnet_cidr }}', null, null, 5432, 5432]
          - [120, 'tcp', 'allow', '{{ vpc_cidr }}', null, null, 1024, 65535]
        egress:
          - [100, 'tcp', 'allow', '{{ vpc_cidr }}', null, null, 1024, 65535]
          - [110, 'tcp', 'allow', '0.0.0.0/0', null, null, 443, 443]
        tags: "{{ nacl_tags | combine({'Name': nacl_database_name, 'Type': 'Database'}) }}"
        state: "{{ nacl_state }}"
      when:
        - create_database_nacl | bool
        - database_subnet_ids is defined
      register: database_nacl

    - name: Add FedRAMP compliance deny rules
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ vpc_id }}"
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        nacl_id: "{{ item.nacl_id }}"
        ingress: "{{ item.ingress + nacl_fedramp_deny_rules }}"
        lookup: id
        state: "{{ nacl_state }}"
      loop: "{{ nacl_result.results }}"
      when:
        - nacl_result is defined
        - apply_fedramp_deny_rules | bool
        - item.nacl is defined

    - name: Create NACL for DMZ with enhanced security
      amazon.aws.ec2_vpc_nacl:
        vpc_id: "{{ vpc_id }}"
        name: "{{ nacl_dmz_name }}"
        region: "{{ aws_region }}"
        subnets: "{{ dmz_subnet_ids }}"
        ingress: "{{ nacl_dmz_ingress_rules }}"
        egress: "{{ nacl_dmz_egress_rules }}"
        tags: "{{ nacl_tags | combine({'Name': nacl_dmz_name, 'Type': 'DMZ', 'SecurityZone': 'Internet-Facing'}) }}"
        state: "{{ nacl_state }}"
      when:
        - create_dmz_nacl | bool
        - dmz_subnet_ids is defined
      register: dmz_nacl

    - name: Display NACL summary
      ansible.builtin.debug:
        msg:
          - "Network ACLs Created: {{ nacl_result.results | selectattr('changed', 'equalto', true) | list | length if nacl_result is defined else 0 }}"
          - "Public NACL ID: {{ public_nacl.nacl_id if public_nacl is defined and public_nacl.nacl_id is defined else 'N/A' }}"
          - "Private NACL ID: {{ private_nacl.nacl_id if private_nacl is defined and private_nacl.nacl_id is defined else 'N/A' }}"
          - "Database NACL ID: {{ database_nacl.nacl_id if database_nacl is defined and database_nacl.nacl_id is defined else 'N/A' }}"

    - name: Notify NACL changes
      ansible.builtin.debug:
        msg: "Network ACL configuration completed"
      changed_when: true
      notify: notify nacl changes
      when:
        - nacl_result is defined
        - nacl_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_nacls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_nacls_preflight_passed | bool
          - fe_aws_aws_nacls_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_nacls: postflight validation failed - preflight passed
          ={{ fe_aws_aws_nacls_preflight_passed | default(false) }},
          status={{ fe_aws_aws_nacls_status | default('unknown') }}.
        success_msg: "aws/aws_nacls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_nacls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_nacls_postflight_passed: true
        fe_aws_aws_nacls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_nacls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_nacls_status: "failed"
        fe_aws_aws_nacls_postflight_passed: false
        fe_aws_aws_nacls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_nacls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_nacls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_nacls: FAILED at '{{ fe_aws_aws_nacls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_nacls_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_nacls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_nacls failed at '{{ fe_aws_aws_nacls_failed_task }}': {{ fe_aws_aws_nacls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_nacls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_nacls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_nacls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_nacls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_nacls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_nacls":
              component: "aws/aws_nacls"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_nacls_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_nacls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_nacls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_nacls_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_nacls_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_nacls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_nacls_failed_task | default('') }}"
              error: "{{ fe_aws_aws_nacls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_nacls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_nacls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_nacls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_nacls_status | default('') == 'succeeded' else ['aws/aws_nacls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_nacls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_nacls_stats_published: true
      tags:
        - always
