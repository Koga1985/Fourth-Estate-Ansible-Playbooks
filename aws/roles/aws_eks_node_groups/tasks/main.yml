---
# tasks file for aws_eks_node_groups

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_eks_node_groups']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_eks_node_groups_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_eks_node_groups | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_eks_node_groups_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_eks_node_groups_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_eks_node_groups_status: "running"
    fe_aws_aws_eks_node_groups_preflight_passed: false
    fe_aws_aws_eks_node_groups_postflight_passed: false
    fe_aws_aws_eks_node_groups_failed_task: ""
    fe_aws_aws_eks_node_groups_error: ""
    fe_aws_aws_eks_node_groups_stats_published: false
  tags:
    - always

- name: "aws/aws_eks_node_groups | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_eks_node_groups | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_eks_node_groups: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_eks_node_groups: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_eks_node_groups | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_eks_node_groups: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_eks_node_groups: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_eks_node_groups_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_eks_node_groups | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_eks_node_groups_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create EKS node groups
      community.aws.eks_nodegroup:
        name: "{{ item.name }}"
        cluster_name: "{{ item.cluster_name | default(eks_cluster_name) }}"
        node_role: "{{ item.node_role }}"
        subnets: "{{ item.subnets }}"
        scaling_config: "{{ item.scaling_config }}"
        instance_types: "{{ item.instance_types | default(['t3.medium']) }}"
        ami_type: "{{ item.ami_type | default('AL2_x86_64') }}"
        disk_size: "{{ item.disk_size | default(20) }}"
        remote_access: "{{ item.remote_access | default(omit) }}"
        labels: "{{ item.labels | default({}) }}"
        taints: "{{ item.taints | default([]) }}"
        tags: "{{ item.tags | default(node_group_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        launch_template: "{{ item.launch_template | default(omit) }}"
        capacity_type: "{{ item.capacity_type | default('ON_DEMAND') }}"
        state: "{{ item.state | default(node_group_state) }}"
      loop: "{{ eks_node_groups }}"
      when: eks_node_groups is defined
      register: node_group_result

    - name: Create launch template for node groups with FedRAMP compliance
      amazon.aws.ec2_launch_template:
        name: "{{ item.name }}-lt"
        description: "Launch template for {{ item.name }} with FedRAMP compliance"
        image_id: "{{ item.ami_id }}"
        instance_type: "{{ item.instance_types[0] }}"
        key_name: "{{ item.key_name | default(omit) }}"
        network_interfaces:
          - associate_public_ip_address: false
            delete_on_termination: true
            device_index: 0
            groups: "{{ item.security_groups }}"
        block_device_mappings:
          - device_name: "/dev/xvda"
            ebs:
              volume_size: "{{ item.disk_size | default(20) }}"
              volume_type: "gp3"
              encrypted: true
              kms_key_id: "{{ kms_key_id }}"
              delete_on_termination: true
        metadata_options:
          http_endpoint: "enabled"
          http_tokens: "required"
          http_put_response_hop_limit: 1
        user_data: "{{ lookup('template', 'node_userdata.sh.j2') | b64encode }}"
        tags: "{{ node_group_tags }}"
      loop: "{{ eks_node_groups }}"
      when:
        - eks_node_groups is defined
        - item.use_launch_template | default(true) | bool
        - node_group_enforce_imdsv2 | bool

    - name: Tag node group instances for compliance
      amazon.aws.ec2_tag:
        resource: "{{ item.1 }}"
        region: "{{ aws_region }}"
        tags: "{{ node_group_tags | combine({'Compliance': 'FedRAMP-High', 'PodSecurityStandard': 'restricted'}) }}"
      loop: "{{ node_group_result.results | subelements('resources.autoscaling_groups[0].instances', skip_missing=True) }}"
      when: node_group_result is defined

    - name: Configure node group auto-scaling
      community.aws.autoscaling_policy:
        name: "{{ item.item.name }}-scaling-policy"
        asg_name: "{{ item.resources.autoscaling_groups[0].name }}"
        policy_type: "TargetTrackingScaling"
        target_tracking_config:
          predefined_metric_type: "ASGAverageCPUUtilization"
          target_value: "{{ item.item.target_cpu_utilization | default(70) }}"
        region: "{{ aws_region }}"
      loop: "{{ node_group_result.results }}"
      when:
        - node_group_result is defined
        - node_group_enable_autoscaling | bool
        - item.resources is defined

    - name: Display node group summary
      ansible.builtin.debug:
        msg:
          - "Node Groups Created: {{ node_group_result.results | selectattr('changed', 'equalto', true) | list | length if node_group_result is defined else 0 }}"
          - "Total Node Groups: {{ eks_node_groups | length if eks_node_groups is defined else 0 }}"

    - name: Notify node group changes
      ansible.builtin.debug:
        msg: "EKS node group configuration completed"
      changed_when: true
      notify: notify node group changes
      when:
        - node_group_result is defined
        - node_group_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_eks_node_groups | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_eks_node_groups_preflight_passed | bool
          - fe_aws_aws_eks_node_groups_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_eks_node_groups: postflight validation failed - preflight passed
          ={{ fe_aws_aws_eks_node_groups_preflight_passed | default(false) }},
          status={{ fe_aws_aws_eks_node_groups_status | default('unknown') }}.
        success_msg: "aws/aws_eks_node_groups: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_eks_node_groups | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_eks_node_groups_postflight_passed: true
        fe_aws_aws_eks_node_groups_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_eks_node_groups | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_eks_node_groups_status: "failed"
        fe_aws_aws_eks_node_groups_postflight_passed: false
        fe_aws_aws_eks_node_groups_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_eks_node_groups_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_eks_node_groups | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_eks_node_groups: FAILED at '{{ fe_aws_aws_eks_node_groups_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_eks_node_groups_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_eks_node_groups | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_eks_node_groups failed at '{{ fe_aws_aws_eks_node_groups_failed_task }}': {{ fe_aws_aws_eks_node_groups_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_eks_node_groups | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_eks_node_groups_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_eks_node_groups_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_eks_node_groups_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_eks_node_groups | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_eks_node_groups":
              component: "aws/aws_eks_node_groups"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_eks_node_groups_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_eks_node_groups_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_eks_node_groups_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_eks_node_groups_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_eks_node_groups_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_eks_node_groups_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_eks_node_groups_failed_task | default('') }}"
              error: "{{ fe_aws_aws_eks_node_groups_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_eks_node_groups_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_eks_node_groups_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_eks_node_groups_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_eks_node_groups_status | default('') == 'succeeded' else ['aws/aws_eks_node_groups'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_eks_node_groups | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_eks_node_groups_stats_published: true
      tags:
        - always
