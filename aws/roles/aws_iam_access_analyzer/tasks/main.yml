---
# tasks file for aws_iam_access_analyzer

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_iam_access_analyzer']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_iam_access_analyzer_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_iam_access_analyzer | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_iam_access_analyzer_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_iam_access_analyzer_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_iam_access_analyzer_status: "running"
    fe_aws_aws_iam_access_analyzer_preflight_passed: false
    fe_aws_aws_iam_access_analyzer_postflight_passed: false
    fe_aws_aws_iam_access_analyzer_failed_task: ""
    fe_aws_aws_iam_access_analyzer_error: ""
    fe_aws_aws_iam_access_analyzer_stats_published: false
  tags:
    - always

- name: "aws/aws_iam_access_analyzer | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_iam_access_analyzer | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_iam_access_analyzer: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_iam_access_analyzer: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_access_analyzer | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_iam_access_analyzer: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_iam_access_analyzer: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_iam_access_analyzer_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_access_analyzer | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_access_analyzer_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create IAM Access Analyzer
      community.aws.accessanalyzer_analyzer:
        name: "{{ iam_access_analyzer_name }}"
        type: "{{ iam_access_analyzer_type }}"
        tags: "{{ iam_access_analyzer_tags | combine({'ManagedBy': 'Ansible'}) }}"
        state: "{{ iam_access_analyzer_state }}"
      register: access_analyzer_result

    - name: Create archive rules for Access Analyzer
      community.aws.accessanalyzer_archive_rule:
        analyzer_name: "{{ iam_access_analyzer_name }}"
        rule_name: "{{ item.name }}"
        filter: "{{ item.filter }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ iam_access_analyzer_archive_rules }}"
      when: iam_access_analyzer_archive_rules is defined

    - name: Get Access Analyzer findings
      community.aws.accessanalyzer_finding_info:
        analyzer_arn: "{{ access_analyzer_result.analyzer.arn }}"
        filter: "{{ iam_access_analyzer_finding_filter | default(omit) }}"
        max_results: "{{ iam_access_analyzer_max_findings | default(100) }}"
      register: access_analyzer_findings
      when:
        - access_analyzer_result is defined
        - access_analyzer_result.analyzer is defined

    - name: Create findings report
      ansible.builtin.template:
        src: "access_analyzer_findings_report.html.j2"
        dest: "/tmp/access_analyzer_findings_{{ ansible_date_time.date }}.html"
        mode: '0644'
      delegate_to: localhost
      when:
        - access_analyzer_findings is defined
        - iam_generate_findings_report | bool

    - name: Tag high-risk findings
      community.aws.accessanalyzer_finding:
        analyzer_arn: "{{ access_analyzer_result.analyzer.arn }}"
        id: "{{ item.id }}"
        status: "{{ 'ACTIVE' if item.status == 'ACTIVE' else item.status }}"
      loop: "{{ access_analyzer_findings.findings | default([]) }}"
      when:
        - access_analyzer_findings is defined
        - item.resource_type in iam_high_risk_resource_types

    - name: Send critical findings notification
      ansible.builtin.uri:
        url: "{{ security_webhook_url }}"
        method: POST
        body_format: json
        body:
          analyzer: "{{ iam_access_analyzer_name }}"
          critical_findings: "{{ access_analyzer_findings.findings | selectattr('status', 'equalto', 'ACTIVE') | list | length }}"
          findings: "{{ access_analyzer_findings.findings | default([]) | map(attribute='resource') | list }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 201, 204]
      when:
        - security_webhook_url is defined
        - access_analyzer_findings is defined
        - access_analyzer_findings.findings | selectattr('status', 'equalto', 'ACTIVE') | list | length > 0
      delegate_to: localhost

    - name: Create CloudWatch metric for findings
      community.aws.cloudwatch_metric_alarm:
        name: "{{ iam_access_analyzer_name }}-CriticalFindings"
        description: "Alert on critical IAM Access Analyzer findings"
        namespace: "AWS/AccessAnalyzer"
        metric_name: "FindingCount"
        statistic: "Sum"
        comparison: "GreaterThanThreshold"
        threshold: "{{ iam_access_analyzer_alert_threshold }}"
        period: 300
        evaluation_periods: 1
        alarm_actions: "{{ iam_access_analyzer_sns_topic }}"
        dimensions:
          AnalyzerName: "{{ iam_access_analyzer_name }}"
        state: "{{ iam_access_analyzer_state }}"
      when:
        - iam_create_cloudwatch_alarms | bool
        - iam_access_analyzer_sns_topic is defined

    - name: Enable Access Analyzer for organization
      community.aws.accessanalyzer_analyzer:
        name: "{{ iam_access_analyzer_name }}-Organization"
        type: "ORGANIZATION"
        tags: "{{ iam_access_analyzer_tags | combine({'Scope': 'Organization'}) }}"
        state: "{{ iam_access_analyzer_state }}"
      when: iam_enable_organization_analyzer | bool

    - name: Display Access Analyzer summary
      ansible.builtin.debug:
        msg:
          - "Access Analyzer Created: {{ iam_access_analyzer_name }}"
          - "Analyzer ARN: {{ access_analyzer_result.analyzer.arn if access_analyzer_result.analyzer is defined else 'N/A' }}"
          - "Total Findings: {{ access_analyzer_findings.findings | length if access_analyzer_findings is defined else 0 }}"
          - "Active Findings: {{ access_analyzer_findings.findings | selectattr('status', 'equalto', 'ACTIVE') | list | length if access_analyzer_findings is defined else 0 }}"
      when: access_analyzer_result is defined

    - name: Notify Access Analyzer changes
      ansible.builtin.debug:
        msg: "Access Analyzer configuration completed"
      changed_when: true
      notify: notify access analyzer changes
      when:
        - access_analyzer_result is defined
        - access_analyzer_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_iam_access_analyzer | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_iam_access_analyzer_preflight_passed | bool
          - fe_aws_aws_iam_access_analyzer_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_iam_access_analyzer: postflight validation failed - preflight passed
          ={{ fe_aws_aws_iam_access_analyzer_preflight_passed | default(false) }},
          status={{ fe_aws_aws_iam_access_analyzer_status | default('unknown') }}.
        success_msg: "aws/aws_iam_access_analyzer: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_iam_access_analyzer | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_access_analyzer_postflight_passed: true
        fe_aws_aws_iam_access_analyzer_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_iam_access_analyzer | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_access_analyzer_status: "failed"
        fe_aws_aws_iam_access_analyzer_postflight_passed: false
        fe_aws_aws_iam_access_analyzer_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_iam_access_analyzer_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_access_analyzer | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_iam_access_analyzer: FAILED at '{{ fe_aws_aws_iam_access_analyzer_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_iam_access_analyzer_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_access_analyzer | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_iam_access_analyzer failed at '{{ fe_aws_aws_iam_access_analyzer_failed_task }}': {{ fe_aws_aws_iam_access_analyzer_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_iam_access_analyzer | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_access_analyzer_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_iam_access_analyzer_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_iam_access_analyzer_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_iam_access_analyzer | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_iam_access_analyzer":
              component: "aws/aws_iam_access_analyzer"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_iam_access_analyzer_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_iam_access_analyzer_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_iam_access_analyzer_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_iam_access_analyzer_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_iam_access_analyzer_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_iam_access_analyzer_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_iam_access_analyzer_failed_task | default('') }}"
              error: "{{ fe_aws_aws_iam_access_analyzer_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_iam_access_analyzer_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_iam_access_analyzer_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_iam_access_analyzer_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_iam_access_analyzer_status | default('') == 'succeeded' else ['aws/aws_iam_access_analyzer'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_iam_access_analyzer | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_access_analyzer_stats_published: true
      tags:
        - always
