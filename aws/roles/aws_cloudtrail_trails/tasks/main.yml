---
# tasks file for aws_cloudtrail_trails

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_cloudtrail_trails']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_cloudtrail_trails_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_cloudtrail_trails | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_cloudtrail_trails_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_cloudtrail_trails_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_cloudtrail_trails_status: "running"
    fe_aws_aws_cloudtrail_trails_preflight_passed: false
    fe_aws_aws_cloudtrail_trails_postflight_passed: false
    fe_aws_aws_cloudtrail_trails_failed_task: ""
    fe_aws_aws_cloudtrail_trails_error: ""
    fe_aws_aws_cloudtrail_trails_stats_published: false
  tags:
    - always

- name: "aws/aws_cloudtrail_trails | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_cloudtrail_trails | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_cloudtrail_trails: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_cloudtrail_trails: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_cloudtrail_trails | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_cloudtrail_trails: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_cloudtrail_trails: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_cloudtrail_trails_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_cloudtrail_trails | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudtrail_trails_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create CloudTrail trails
      community.aws.cloudtrail:
        name: "{{ item.name }}"
        s3_bucket_name: "{{ item.s3_bucket }}"
        s3_key_prefix: "{{ item.s3_prefix | default('cloudtrail') }}"
        sns_topic_name: "{{ item.sns_topic | default(omit) }}"
        include_global_service_events: "{{ item.include_global_events | default(true) }}"
        is_multi_region_trail: "{{ item.multi_region | default(true) }}"
        enable_log_file_validation: "{{ item.log_file_validation | default(true) }}"
        kms_key_id: "{{ item.kms_key_id | default(kms_key_id) }}"
        cloudwatch_logs_log_group_arn: "{{ item.cloudwatch_log_group | default(omit) }}"
        cloudwatch_logs_role_arn: "{{ item.cloudwatch_role | default(omit) }}"
        tags: "{{ item.tags | default(cloudtrail_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        state: "{{ item.state | default(cloudtrail_state) }}"
      loop: "{{ cloudtrail_trails }}"
      when: cloudtrail_trails is defined
      register: trail_result

    - name: Enable CloudTrail logging
      community.aws.cloudtrail:
        name: "{{ item.item.name }}"
        state: present
        enable_logging: true
      loop: "{{ trail_result.results }}"
      when: trail_result is defined

    - name: Display CloudTrail summary
      ansible.builtin.debug:
        msg:
          - "Trails Created: {{ trail_result.results | selectattr('changed', 'equalto', true) | list | length if trail_result is defined else 0 }}"

    # ----------------------------- postflight -------------------

    - name: "aws/aws_cloudtrail_trails | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_cloudtrail_trails_preflight_passed | bool
          - fe_aws_aws_cloudtrail_trails_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_cloudtrail_trails: postflight validation failed - preflight passed
          ={{ fe_aws_aws_cloudtrail_trails_preflight_passed | default(false) }},
          status={{ fe_aws_aws_cloudtrail_trails_status | default('unknown') }}.
        success_msg: "aws/aws_cloudtrail_trails: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_cloudtrail_trails | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudtrail_trails_postflight_passed: true
        fe_aws_aws_cloudtrail_trails_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_cloudtrail_trails | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudtrail_trails_status: "failed"
        fe_aws_aws_cloudtrail_trails_postflight_passed: false
        fe_aws_aws_cloudtrail_trails_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_cloudtrail_trails_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_cloudtrail_trails | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_cloudtrail_trails: FAILED at '{{ fe_aws_aws_cloudtrail_trails_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_cloudtrail_trails_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_cloudtrail_trails | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_cloudtrail_trails failed at '{{ fe_aws_aws_cloudtrail_trails_failed_task }}': {{ fe_aws_aws_cloudtrail_trails_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_cloudtrail_trails | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudtrail_trails_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_cloudtrail_trails_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_cloudtrail_trails_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_cloudtrail_trails | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_cloudtrail_trails":
              component: "aws/aws_cloudtrail_trails"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_cloudtrail_trails_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_cloudtrail_trails_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_cloudtrail_trails_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_cloudtrail_trails_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_cloudtrail_trails_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_cloudtrail_trails_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_cloudtrail_trails_failed_task | default('') }}"
              error: "{{ fe_aws_aws_cloudtrail_trails_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_cloudtrail_trails_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_cloudtrail_trails_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_cloudtrail_trails_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_cloudtrail_trails_status | default('') == 'succeeded' else ['aws/aws_cloudtrail_trails'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_cloudtrail_trails | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_cloudtrail_trails_stats_published: true
      tags:
        - always
