---
# tasks file for aws_config_rules

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_config_rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_config_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_config_rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_config_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_config_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_config_rules_status: "running"
    fe_aws_aws_config_rules_preflight_passed: false
    fe_aws_aws_config_rules_postflight_passed: false
    fe_aws_aws_config_rules_failed_task: ""
    fe_aws_aws_config_rules_error: ""
    fe_aws_aws_config_rules_stats_published: false
  tags:
    - always

- name: "aws/aws_config_rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_config_rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_config_rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_config_rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_config_rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_config_rules: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_config_rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_config_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_config_rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_config_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create AWS Config rules
      community.aws.config_rule:
        name: "{{ item.name }}"
        description: "{{ item.description | default('Config rule managed by Ansible') }}"
        source: "{{ item.source }}"
        scope: "{{ item.scope | default(omit) }}"
        input_parameters: "{{ item.input_parameters | default(omit) }}"
        state: "{{ item.state | default(config_rule_state) }}"
      loop: "{{ config_rules }}"
      when: config_rules is defined
      register: config_rule_result

    - name: Create FedRAMP compliance rules
      community.aws.config_rule:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        source:
          owner: "AWS"
          source_identifier: "{{ item.source_identifier }}"
        state: present
      loop: "{{ fedramp_config_rules }}"
      when: config_enable_fedramp_rules | bool

    - name: Display AWS Config summary
      ansible.builtin.debug:
        msg:
          - "Config Rules Created: {{ config_rule_result.results | selectattr('changed', 'equalto', true) | list | length if config_rule_result is defined else 0 }}"

    # ----------------------------- postflight -------------------

    - name: "aws/aws_config_rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_config_rules_preflight_passed | bool
          - fe_aws_aws_config_rules_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_config_rules: postflight validation failed - preflight passed
          ={{ fe_aws_aws_config_rules_preflight_passed | default(false) }},
          status={{ fe_aws_aws_config_rules_status | default('unknown') }}.
        success_msg: "aws/aws_config_rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_config_rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_config_rules_postflight_passed: true
        fe_aws_aws_config_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_config_rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_config_rules_status: "failed"
        fe_aws_aws_config_rules_postflight_passed: false
        fe_aws_aws_config_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_config_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_config_rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_config_rules: FAILED at '{{ fe_aws_aws_config_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_config_rules_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_config_rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_config_rules failed at '{{ fe_aws_aws_config_rules_failed_task }}': {{ fe_aws_aws_config_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_config_rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_config_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_config_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_config_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_config_rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_config_rules":
              component: "aws/aws_config_rules"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_config_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_config_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_config_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_config_rules_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_config_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_config_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_config_rules_failed_task | default('') }}"
              error: "{{ fe_aws_aws_config_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_config_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_config_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_config_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_config_rules_status | default('') == 'succeeded' else ['aws/aws_config_rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_config_rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_config_rules_stats_published: true
      tags:
        - always
