---
# tasks file for aws_iam_policies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_iam_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_iam_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_iam_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_iam_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_iam_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_iam_policies_status: "running"
    fe_aws_aws_iam_policies_preflight_passed: false
    fe_aws_aws_iam_policies_postflight_passed: false
    fe_aws_aws_iam_policies_failed_task: ""
    fe_aws_aws_iam_policies_error: ""
    fe_aws_aws_iam_policies_stats_published: false
  tags:
    - always

- name: "aws/aws_iam_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_iam_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_iam_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_iam_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_iam_policies: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_iam_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_iam_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create customer managed IAM policies
      community.aws.iam_managed_policy:
        policy_name: "{{ item.name }}"
        policy_description: "{{ item.description | default('Managed by Ansible') }}"
        policy: "{{ lookup('template', item.template) if item.template is defined else item.policy }}"
        state: "{{ item.state | default(iam_policy_state) }}"
        tags: "{{ item.tags | default(iam_policy_tags) | combine({'ManagedBy': 'Ansible'}) }}"
      loop: "{{ iam_policies }}"
      when: iam_policies is defined
      register: iam_policy_result

    - name: Create FedRAMP compliance policies
      community.aws.iam_managed_policy:
        policy_name: "{{ item.name }}"
        policy_description: "{{ item.description }}"
        policy: "{{ lookup('template', item.template) }}"
        state: present
        tags: "{{ iam_policy_tags | combine({'Compliance': 'FedRAMP-High', 'Required': 'true'}) }}"
      loop: "{{ iam_fedramp_policies }}"
      when: iam_create_fedramp_policies | bool
      register: fedramp_policy_result

    - name: Create permissions boundary policies
      community.aws.iam_managed_policy:
        policy_name: "{{ item.name }}-Boundary"
        policy_description: "Permissions boundary for {{ item.name }}"
        policy: "{{ lookup('template', 'permissions_boundary.json.j2') }}"
        state: "{{ item.state | default(iam_policy_state) }}"
        tags: "{{ iam_policy_tags | combine({'PolicyType': 'PermissionsBoundary'}) }}"
      loop: "{{ iam_boundary_policies }}"
      when: iam_boundary_policies is defined
      register: boundary_result

    - name: Create service control policies for least privilege
      community.aws.iam_managed_policy:
        policy_name: "{{ item.service }}-LeastPrivilege"
        policy_description: "Least privilege policy for {{ item.service }}"
        policy: "{{ lookup('template', item.template) }}"
        state: present
        tags: "{{ iam_policy_tags | combine({'Service': item.service, 'Principle': 'LeastPrivilege'}) }}"
      loop: "{{ iam_service_policies }}"
      when: iam_service_policies is defined

    - name: Create encryption enforcement policies
      community.aws.iam_managed_policy:
        policy_name: "EnforceEncryptionAtRest"
        policy_description: "Enforce encryption at rest for all storage services"
        policy: "{{ lookup('template', 'enforce_encryption.json.j2') }}"
        state: present
        tags: "{{ iam_policy_tags | combine({'SecurityControl': 'Encryption', 'Compliance': 'FedRAMP-High'}) }}"
      when: iam_enforce_encryption | bool

    - name: Create region restriction policies
      community.aws.iam_managed_policy:
        policy_name: "RestrictToGovCloudRegions"
        policy_description: "Restrict operations to GovCloud regions only"
        policy: "{{ lookup('template', 'region_restriction.json.j2') }}"
        state: present
        tags: "{{ iam_policy_tags | combine({'SecurityControl': 'RegionRestriction', 'Compliance': 'FedRAMP-High'}) }}"
      when: iam_restrict_regions | bool

    - name: Attach policies to roles
      community.aws.iam_role:
        name: "{{ item.0.role }}"
        managed_policies: "{{ item.0.policies }}"
        state: present
      loop: "{{ iam_policy_attachments | subelements('policies', skip_missing=True) }}"
      when: iam_policy_attachments is defined

    - name: Create policy versions for audit trail
      community.aws.iam_managed_policy:
        policy_name: "{{ item.name }}"
        policy: "{{ lookup('template', item.template) }}"
        state: present
        make_default: true
      loop: "{{ iam_policies }}"
      when:
        - iam_policies is defined
        - item.versioning | default(true) | bool
        - iam_policy_result.changed | default(false)

    - name: Display IAM policy creation summary
      ansible.builtin.debug:
        msg:
          - "IAM Policies Created: {{ iam_policy_result.results | selectattr('changed', 'equalto', true) | list | length }}"
          - "Total Policies Managed: {{ iam_policies | length }}"
          - "FedRAMP Policies: {{ fedramp_policy_result.results | selectattr('changed', 'equalto', true) | list | length if fedramp_policy_result is defined else 0 }}"
      when:
        - iam_policies is defined
        - iam_policy_result is defined

    - name: Notify IAM policy changes
      ansible.builtin.debug:
        msg: "IAM policy changes completed"
      changed_when: true
      notify: notify iam policy changes
      when:
        - iam_policy_result is defined
        - iam_policy_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_iam_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_iam_policies_preflight_passed | bool
          - fe_aws_aws_iam_policies_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_iam_policies: postflight validation failed - preflight passed
          ={{ fe_aws_aws_iam_policies_preflight_passed | default(false) }},
          status={{ fe_aws_aws_iam_policies_status | default('unknown') }}.
        success_msg: "aws/aws_iam_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_iam_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_policies_postflight_passed: true
        fe_aws_aws_iam_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_iam_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_policies_status: "failed"
        fe_aws_aws_iam_policies_postflight_passed: false
        fe_aws_aws_iam_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_iam_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_iam_policies: FAILED at '{{ fe_aws_aws_iam_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_iam_policies_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_iam_policies failed at '{{ fe_aws_aws_iam_policies_failed_task }}': {{ fe_aws_aws_iam_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_iam_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_iam_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_iam_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_iam_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_iam_policies":
              component: "aws/aws_iam_policies"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_iam_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_iam_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_iam_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_iam_policies_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_iam_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_iam_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_iam_policies_failed_task | default('') }}"
              error: "{{ fe_aws_aws_iam_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_iam_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_iam_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_iam_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_iam_policies_status | default('') == 'succeeded' else ['aws/aws_iam_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_iam_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_policies_stats_published: true
      tags:
        - always
