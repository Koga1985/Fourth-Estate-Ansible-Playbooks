---
# tasks file for aws_iam_groups

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_iam_groups']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_iam_groups_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_iam_groups | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_iam_groups_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_iam_groups_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_iam_groups_status: "running"
    fe_aws_aws_iam_groups_preflight_passed: false
    fe_aws_aws_iam_groups_postflight_passed: false
    fe_aws_aws_iam_groups_failed_task: ""
    fe_aws_aws_iam_groups_error: ""
    fe_aws_aws_iam_groups_stats_published: false
  tags:
    - always

- name: "aws/aws_iam_groups | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_iam_groups | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_iam_groups: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_iam_groups: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_groups | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_iam_groups: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_iam_groups: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_iam_groups_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_iam_groups | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_groups_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create IAM groups
      community.aws.iam_group:
        name: "{{ item.name }}"
        state: "{{ item.state | default(iam_group_state) }}"
        managed_policies: "{{ item.managed_policies | default([]) }}"
      loop: "{{ iam_groups }}"
      when: iam_groups is defined
      register: iam_group_result

    - name: Attach inline policies to groups
      community.aws.iam_policy:
        iam_type: group
        iam_name: "{{ item.0.name }}"
        policy_name: "{{ item.1.name }}"
        policy_document: "{{ lookup('template', item.1.template) }}"
        state: "{{ item.0.state | default(iam_group_state) }}"
      loop: "{{ iam_groups | subelements('inline_policies', skip_missing=True) }}"
      when: iam_groups is defined

    - name: Add users to groups
      community.aws.iam_group:
        name: "{{ item.0.name }}"
        state: present
        users: "{{ item.0.users | default([]) }}"
        purge_users: "{{ item.0.purge_users | default(false) }}"
      loop: "{{ iam_groups }}"
      when:
        - iam_groups is defined
        - item.users is defined

    - name: Create group-specific permissions boundaries
      community.aws.iam_managed_policy:
        policy_name: "{{ item.name }}-Boundary"
        policy_description: "Permissions boundary for {{ item.name }} group"
        policy: "{{ lookup('template', item.boundary_template | default('group_boundary.json.j2')) }}"
        state: "{{ item.state | default(iam_group_state) }}"
      loop: "{{ iam_groups }}"
      when:
        - iam_groups is defined
        - item.create_boundary | default(false) | bool
      register: boundary_policies

    - name: Configure group MFA requirements
      community.aws.iam_policy:
        iam_type: group
        iam_name: "{{ item.name }}"
        policy_name: "EnforceMFA"
        policy_document: "{{ lookup('template', 'enforce_mfa_policy.json.j2') }}"
        state: "{{ item.state | default(iam_group_state) }}"
      loop: "{{ iam_groups }}"
      when:
        - iam_groups is defined
        - item.enforce_mfa | default(iam_enforce_mfa) | bool

    - name: Apply service control policies to groups
      community.aws.iam_policy:
        iam_type: group
        iam_name: "{{ item.0.name }}"
        policy_name: "{{ item.1.name }}"
        policy_document: "{{ item.1.policy }}"
        state: "{{ item.0.state | default(iam_group_state) }}"
      loop: "{{ iam_groups | subelements('service_policies', skip_missing=True) }}"
      when: iam_groups is defined

    - name: Tag IAM groups for compliance
      community.aws.iam_group:
        name: "{{ item.name }}"
        state: present
        tags: "{{ item.tags | default(iam_group_tags) | combine({'ManagedBy': 'Ansible'}) }}"
      loop: "{{ iam_groups }}"
      when:
        - iam_groups is defined
        - item.state | default(iam_group_state) == 'present'

    - name: Display IAM group creation summary
      ansible.builtin.debug:
        msg:
          - "IAM Groups Created: {{ iam_group_result.results | selectattr('changed', 'equalto', true) | list | length }}"
          - "Total Groups Managed: {{ iam_groups | length }}"
          - "Groups with MFA Enforcement: {{ iam_groups | selectattr('enforce_mfa', 'defined') | selectattr('enforce_mfa', 'equalto', true) | list | length }}"
      when:
        - iam_groups is defined
        - iam_group_result is defined

    - name: Notify IAM group changes
      ansible.builtin.debug:
        msg: "IAM group changes completed"
      changed_when: true
      notify: notify iam group changes
      when:
        - iam_group_result is defined
        - iam_group_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_iam_groups | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_iam_groups_preflight_passed | bool
          - fe_aws_aws_iam_groups_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_iam_groups: postflight validation failed - preflight passed
          ={{ fe_aws_aws_iam_groups_preflight_passed | default(false) }},
          status={{ fe_aws_aws_iam_groups_status | default('unknown') }}.
        success_msg: "aws/aws_iam_groups: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_iam_groups | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_groups_postflight_passed: true
        fe_aws_aws_iam_groups_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_iam_groups | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_groups_status: "failed"
        fe_aws_aws_iam_groups_postflight_passed: false
        fe_aws_aws_iam_groups_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_iam_groups_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_groups | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_iam_groups: FAILED at '{{ fe_aws_aws_iam_groups_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_iam_groups_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_iam_groups | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_iam_groups failed at '{{ fe_aws_aws_iam_groups_failed_task }}': {{ fe_aws_aws_iam_groups_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_iam_groups | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_groups_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_iam_groups_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_iam_groups_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_iam_groups | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_iam_groups":
              component: "aws/aws_iam_groups"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_iam_groups_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_iam_groups_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_iam_groups_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_iam_groups_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_iam_groups_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_iam_groups_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_iam_groups_failed_task | default('') }}"
              error: "{{ fe_aws_aws_iam_groups_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_iam_groups_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_iam_groups_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_iam_groups_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_iam_groups_status | default('') == 'succeeded' else ['aws/aws_iam_groups'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_iam_groups | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_iam_groups_stats_published: true
      tags:
        - always
