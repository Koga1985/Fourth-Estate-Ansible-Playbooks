---
# tasks file for aws_ec2_amis

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_ec2_amis']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_ec2_amis_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_ec2_amis | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_ec2_amis_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_ec2_amis_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_ec2_amis_status: "running"
    fe_aws_aws_ec2_amis_preflight_passed: false
    fe_aws_aws_ec2_amis_postflight_passed: false
    fe_aws_aws_ec2_amis_failed_task: ""
    fe_aws_aws_ec2_amis_error: ""
    fe_aws_aws_ec2_amis_stats_published: false
  tags:
    - always

- name: "aws/aws_ec2_amis | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_ec2_amis | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_ec2_amis: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_ec2_amis: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_ec2_amis | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_ec2_amis: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_ec2_amis: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_ec2_amis_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_ec2_amis | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_amis_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create AMI from EC2 instance
      amazon.aws.ec2_ami:
        instance_id: "{{ item.instance_id }}"
        name: "{{ item.name }}"
        description: "{{ item.description | default('AMI created by Ansible') }}"
        region: "{{ item.region | default(aws_region) }}"
        wait: "{{ item.wait | default(true) }}"
        wait_timeout: "{{ item.wait_timeout | default(1800) }}"
        tags: "{{ item.tags | default(ami_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        device_mapping: "{{ item.device_mapping | default([]) }}"
        no_reboot: "{{ item.no_reboot | default(true) }}"
        state: "{{ item.state | default(ami_state) }}"
      loop: "{{ ec2_amis }}"
      when: ec2_amis is defined
      register: ami_result

    - name: Create AMI with encrypted snapshots
      amazon.aws.ec2_ami:
        instance_id: "{{ item.instance_id }}"
        name: "{{ item.name }}-encrypted"
        description: "{{ item.description | default('Encrypted AMI created by Ansible') }}"
        region: "{{ item.region | default(aws_region) }}"
        wait: true
        tags: "{{ item.tags | default(ami_tags) | combine({'Name': item.name, 'Encrypted': 'true', 'ManagedBy': 'Ansible'}) }}"
        device_mapping:
          - device_name: /dev/sda1
            volume_type: gp3
            delete_on_termination: true
            encrypted: true
            kms_key_id: "{{ kms_key_id }}"
        no_reboot: true
        state: "{{ item.state | default(ami_state) }}"
      loop: "{{ ec2_amis }}"
      when:
        - ec2_amis is defined
        - ami_enforce_encryption | bool
        - kms_key_id is defined
      register: encrypted_ami_result

    - name: Copy AMI to other regions
      amazon.aws.ec2_ami_copy:
        source_image_id: "{{ item.0.image_id }}"
        source_region: "{{ item.0.item.region | default(aws_region) }}"
        region: "{{ item.1 }}"
        name: "{{ item.0.item.name }}-{{ item.1 }}"
        description: "Copy of {{ item.0.item.name }} in {{ item.1 }}"
        encrypted: true
        kms_key_id: "{{ kms_key_id }}"
        tags: "{{ ami_tags | combine({'SourceRegion': item.0.item.region | default(aws_region), 'TargetRegion': item.1}) }}"
        wait: true
      loop: "{{ ami_result.results | subelements('item.copy_to_regions', skip_missing=True) }}"
      when:
        - ami_result is defined
        - ami_enable_cross_region_copy | bool
      register: ami_copy_result

    - name: Share AMI with other accounts
      amazon.aws.ec2_ami:
        image_id: "{{ item.0.image_id }}"
        region: "{{ item.0.item.region | default(aws_region) }}"
        launch_permissions:
          user_ids: "{{ item.0.item.share_with_accounts }}"
        state: present
      loop: "{{ ami_result.results }}"
      when:
        - ami_result is defined
        - item.item.share_with_accounts is defined
        - item.image_id is defined

    - name: Set AMI deprecation time
      amazon.aws.ec2_ami:
        image_id: "{{ item.image_id }}"
        region: "{{ item.item.region | default(aws_region) }}"
        deprecation_time: "{{ ami_deprecation_time }}"
        state: present
      loop: "{{ ami_result.results }}"
      when:
        - ami_result is defined
        - ami_enable_deprecation | bool
        - item.image_id is defined

    - name: Create lifecycle policy for AMI cleanup
      community.aws.ec2_ami_info:
        image_ids: "{{ ami_result.results | map(attribute='image_id') | list }}"
        region: "{{ aws_region }}"
      register: ami_info
      when:
        - ami_result is defined
        - ami_enable_lifecycle_policy | bool

    - name: Deregister old AMIs
      amazon.aws.ec2_ami:
        image_id: "{{ item.image_id }}"
        region: "{{ aws_region }}"
        delete_snapshot: true
        state: absent
      loop: "{{ ami_info.images | default([]) }}"
      when:
        - ami_info is defined
        - item.creation_date | to_datetime('%Y-%m-%dT%H:%M:%S.%fZ') < (ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%S%z')) - timedelta(days=ami_retention_days)
        - ami_enable_lifecycle_policy | bool

    - name: Tag AMIs for compliance
      amazon.aws.ec2_ami:
        image_id: "{{ item.image_id }}"
        region: "{{ item.item.region | default(aws_region) }}"
        tags: "{{ ami_tags | combine({'Compliance': 'FedRAMP-High', 'Encrypted': 'true', 'BackupRetention': ami_retention_days | string}) }}"
        state: present
      loop: "{{ ami_result.results }}"
      when:
        - ami_result is defined
        - item.image_id is defined

    - name: Display AMI summary
      ansible.builtin.debug:
        msg:
          - "AMIs Created: {{ ami_result.results | selectattr('changed', 'equalto', true) | list | length if ami_result is defined else 0 }}"
          - "Encrypted AMIs: {{ encrypted_ami_result.results | selectattr('changed', 'equalto', true) | list | length if encrypted_ami_result is defined else 0 }}"
          - "Cross-Region Copies: {{ ami_copy_result.results | selectattr('changed', 'equalto', true) | list | length if ami_copy_result is defined else 0 }}"

    - name: Notify AMI changes
      ansible.builtin.debug:
        msg: "AMI creation and management completed"
      changed_when: true
      notify: notify ami changes
      when:
        - ami_result is defined
        - ami_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_ec2_amis | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_ec2_amis_preflight_passed | bool
          - fe_aws_aws_ec2_amis_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_ec2_amis: postflight validation failed - preflight passed
          ={{ fe_aws_aws_ec2_amis_preflight_passed | default(false) }},
          status={{ fe_aws_aws_ec2_amis_status | default('unknown') }}.
        success_msg: "aws/aws_ec2_amis: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_ec2_amis | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_amis_postflight_passed: true
        fe_aws_aws_ec2_amis_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_ec2_amis | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_amis_status: "failed"
        fe_aws_aws_ec2_amis_postflight_passed: false
        fe_aws_aws_ec2_amis_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_ec2_amis_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_ec2_amis | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_ec2_amis: FAILED at '{{ fe_aws_aws_ec2_amis_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_ec2_amis_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_ec2_amis | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_ec2_amis failed at '{{ fe_aws_aws_ec2_amis_failed_task }}': {{ fe_aws_aws_ec2_amis_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_ec2_amis | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_amis_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_ec2_amis_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_ec2_amis_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_ec2_amis | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_ec2_amis":
              component: "aws/aws_ec2_amis"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_ec2_amis_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_ec2_amis_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_ec2_amis_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_ec2_amis_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_ec2_amis_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_ec2_amis_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_ec2_amis_failed_task | default('') }}"
              error: "{{ fe_aws_aws_ec2_amis_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_ec2_amis_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_ec2_amis_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_ec2_amis_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_ec2_amis_status | default('') == 'succeeded' else ['aws/aws_ec2_amis'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_ec2_amis | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_amis_stats_published: true
      tags:
        - always
