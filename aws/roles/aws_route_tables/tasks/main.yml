---
# tasks file for aws_route_tables

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_route_tables']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_route_tables_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_route_tables | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_route_tables_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_route_tables_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_route_tables_status: "running"
    fe_aws_aws_route_tables_preflight_passed: false
    fe_aws_aws_route_tables_postflight_passed: false
    fe_aws_aws_route_tables_failed_task: ""
    fe_aws_aws_route_tables_error: ""
    fe_aws_aws_route_tables_stats_published: false
  tags:
    - always

- name: "aws/aws_route_tables | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_route_tables | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_route_tables: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_route_tables: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_route_tables | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_route_tables: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_route_tables: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_route_tables_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_route_tables | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_route_tables_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create route tables
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ item.vpc_id | default(vpc_id) }}"
        region: "{{ item.region | default(aws_region) }}"
        tags: "{{ item.tags | default(route_table_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        routes: "{{ item.routes | default([]) }}"
        subnets: "{{ item.subnets | default([]) }}"
        purge_routes: "{{ item.purge_routes | default(true) }}"
        purge_subnets: "{{ item.purge_subnets | default(false) }}"
        state: "{{ item.state | default(route_table_state) }}"
      loop: "{{ route_tables }}"
      when: route_tables is defined
      register: route_table_result

    - name: Create public route table with Internet Gateway
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        tags: "{{ route_table_tags | combine({'Name': route_table_public_name, 'Type': 'Public', 'ManagedBy': 'Ansible'}) }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ internet_gateway_id }}"
        subnets: "{{ public_subnet_ids }}"
        state: "{{ route_table_state }}"
      when:
        - create_public_route_table | bool
        - internet_gateway_id is defined
        - public_subnet_ids is defined
      register: public_route_table

    - name: Create private route tables with NAT Gateway
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        tags: "{{ route_table_tags | combine({'Name': item.name, 'Type': 'Private', 'AvailabilityZone': item.az, 'ManagedBy': 'Ansible'}) }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ item.nat_gateway_id }}"
        subnets: "{{ item.subnets }}"
        state: "{{ route_table_state }}"
      loop: "{{ private_route_tables }}"
      when:
        - create_private_route_tables | bool
        - private_route_tables is defined
      register: private_route_table_results

    - name: Create route table for VPN connectivity
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        tags: "{{ route_table_tags | combine({'Name': route_table_vpn_name, 'Type': 'VPN', 'ManagedBy': 'Ansible'}) }}"
        routes:
          - dest: "{{ item.destination }}"
            gateway_id: "{{ vpn_gateway_id }}"
        subnets: "{{ vpn_subnet_ids | default([]) }}"
        state: "{{ route_table_state }}"
      loop: "{{ vpn_routes }}"
      when:
        - create_vpn_route_table | bool
        - vpn_gateway_id is defined
        - vpn_routes is defined
      register: vpn_route_table

    - name: Add routes to Transit Gateway
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        route_table_id: "{{ item.route_table_id }}"
        routes:
          - dest: "{{ item.destination }}"
            gateway_id: "{{ transit_gateway_id }}"
        lookup: id
        state: "{{ route_table_state }}"
      loop: "{{ transit_gateway_routes }}"
      when:
        - enable_transit_gateway | bool
        - transit_gateway_id is defined
        - transit_gateway_routes is defined

    - name: Enable route propagation for VPN
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        route_table_id: "{{ item.route_table_id }}"
        propagating_vgw_ids:
          - "{{ vpn_gateway_id }}"
        lookup: id
        state: "{{ route_table_state }}"
      loop: "{{ route_tables_with_propagation }}"
      when:
        - enable_route_propagation | bool
        - vpn_gateway_id is defined
        - route_tables_with_propagation is defined

    - name: Tag route tables for compliance
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        route_table_id: "{{ item.route_table_id }}"
        tags: "{{ route_table_tags | combine({'Compliance': 'FedRAMP-High', 'DataFlow': item.data_flow}) }}"
        lookup: id
        state: "{{ route_table_state }}"
      loop: "{{ route_table_result.results }}"
      when:
        - route_table_result is defined
        - item.route_table is defined

    - name: Display route table summary
      ansible.builtin.debug:
        msg:
          - "Route Tables Created: {{ route_table_result.results | selectattr('changed', 'equalto', true) | list | length if route_table_result is defined else 0 }}"
          - "Public Route Table ID: {{ public_route_table.route_table.id if public_route_table is defined and public_route_table.route_table is defined else 'N/A' }}"
          - "Private Route Tables: {{ private_route_table_results.results | length if private_route_table_results is defined else 0 }}"

    - name: Notify route table changes
      ansible.builtin.debug:
        msg: "Route table configuration completed"
      changed_when: true
      notify: notify route table changes
      when:
        - route_table_result is defined
        - route_table_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_route_tables | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_route_tables_preflight_passed | bool
          - fe_aws_aws_route_tables_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_route_tables: postflight validation failed - preflight passed
          ={{ fe_aws_aws_route_tables_preflight_passed | default(false) }},
          status={{ fe_aws_aws_route_tables_status | default('unknown') }}.
        success_msg: "aws/aws_route_tables: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_route_tables | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_route_tables_postflight_passed: true
        fe_aws_aws_route_tables_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_route_tables | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_route_tables_status: "failed"
        fe_aws_aws_route_tables_postflight_passed: false
        fe_aws_aws_route_tables_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_route_tables_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_route_tables | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_route_tables: FAILED at '{{ fe_aws_aws_route_tables_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_route_tables_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_route_tables | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_route_tables failed at '{{ fe_aws_aws_route_tables_failed_task }}': {{ fe_aws_aws_route_tables_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_route_tables | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_route_tables_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_route_tables_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_route_tables_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_route_tables | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_route_tables":
              component: "aws/aws_route_tables"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_route_tables_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_route_tables_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_route_tables_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_route_tables_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_route_tables_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_route_tables_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_route_tables_failed_task | default('') }}"
              error: "{{ fe_aws_aws_route_tables_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_route_tables_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_route_tables_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_route_tables_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_route_tables_status | default('') == 'succeeded' else ['aws/aws_route_tables'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_route_tables | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_route_tables_stats_published: true
      tags:
        - always
