---
# tasks file for aws_ec2_ebs_volumes

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['aws/aws_ec2_ebs_volumes']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_aws_aws_ec2_ebs_volumes_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "aws/aws_ec2_ebs_volumes | Initialize validation state"
  ansible.builtin.set_fact:
    fe_aws_aws_ec2_ebs_volumes_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_aws_aws_ec2_ebs_volumes_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_aws_aws_ec2_ebs_volumes_status: "running"
    fe_aws_aws_ec2_ebs_volumes_preflight_passed: false
    fe_aws_aws_ec2_ebs_volumes_postflight_passed: false
    fe_aws_aws_ec2_ebs_volumes_failed_task: ""
    fe_aws_aws_ec2_ebs_volumes_error: ""
    fe_aws_aws_ec2_ebs_volumes_stats_published: false
  tags:
    - always

- name: "aws/aws_ec2_ebs_volumes | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "aws/aws_ec2_ebs_volumes | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          aws/aws_ec2_ebs_volumes: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          aws/aws_ec2_ebs_volumes: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_ec2_ebs_volumes | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "aws/aws_ec2_ebs_volumes: required variable '{{ item }}' is not defined."
        success_msg: "aws/aws_ec2_ebs_volumes: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_aws_aws_ec2_ebs_volumes_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "aws/aws_ec2_ebs_volumes | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_ebs_volumes_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create EBS volumes
      amazon.aws.ec2_vol:
        volume_size: "{{ item.size }}"
        volume_type: "{{ item.type | default('gp3') }}"
        iops: "{{ item.iops | default(omit) }}"
        throughput: "{{ item.throughput | default(omit) }}"
        encrypted: "{{ item.encrypted | default(true) }}"
        kms_key_id: "{{ item.kms_key_id | default(kms_key_id) }}"
        zone: "{{ item.zone }}"
        region: "{{ item.region | default(aws_region) }}"
        snapshot: "{{ item.snapshot | default(omit) }}"
        tags: "{{ item.tags | default(ebs_tags) | combine({'Name': item.name, 'ManagedBy': 'Ansible'}) }}"
        state: "{{ item.state | default(ebs_state) }}"
      loop: "{{ ebs_volumes }}"
      when: ebs_volumes is defined
      register: ebs_volume_result

    - name: Attach EBS volumes to instances
      amazon.aws.ec2_vol:
        id: "{{ item.0.volume_id }}"
        instance: "{{ item.0.item.instance_id }}"
        device_name: "{{ item.0.item.device_name }}"
        region: "{{ item.0.item.region | default(aws_region) }}"
        delete_on_termination: "{{ item.0.item.delete_on_termination | default(false) }}"
        state: present
      loop: "{{ ebs_volume_result.results }}"
      when:
        - ebs_volume_result is defined
        - item.volume_id is defined
        - item.item.instance_id is defined

    - name: Enable EBS encryption by default
      amazon.aws.ec2_ebs_encryption_by_default:
        state: enabled
        region: "{{ aws_region }}"
      when: ebs_enforce_encryption_by_default | bool

    - name: Set default KMS key for EBS encryption
      amazon.aws.ec2_ebs_default_kms_key:
        kms_key_id: "{{ kms_key_id }}"
        region: "{{ aws_region }}"
        state: present
      when:
        - ebs_set_default_kms_key | bool
        - kms_key_id is defined

    - name: Create volume snapshots for backup
      amazon.aws.ec2_snapshot:
        volume_id: "{{ item.volume_id }}"
        description: "Automated snapshot of {{ item.item.name }}"
        region: "{{ item.item.region | default(aws_region) }}"
        snapshot_tags: "{{ ebs_tags | combine({'VolumeId': item.volume_id, 'VolumeName': item.item.name, 'BackupType': 'Automated'}) }}"
        state: present
      loop: "{{ ebs_volume_result.results }}"
      when:
        - ebs_volume_result is defined
        - ebs_enable_automatic_snapshots | bool
        - item.volume_id is defined
      register: snapshot_result

    - name: Tag EBS volumes for compliance
      amazon.aws.ec2_vol:
        id: "{{ item.volume_id }}"
        region: "{{ item.item.region | default(aws_region) }}"
        tags: "{{ ebs_tags | combine({'Compliance': 'FedRAMP-High', 'Encrypted': 'true', 'BackupEnabled': 'true'}) }}"
      loop: "{{ ebs_volume_result.results }}"
      when:
        - ebs_volume_result is defined
        - item.volume_id is defined

    - name: Create CloudWatch alarms for volume metrics
      community.aws.cloudwatch_metric_alarm:
        name: "{{ item.item.name }}-HighIOWait"
        description: "Alert when volume {{ item.item.name }} has high IO wait"
        namespace: "AWS/EBS"
        metric_name: "VolumeQueueLength"
        statistic: "Average"
        comparison: "GreaterThanThreshold"
        threshold: 10
        period: 300
        evaluation_periods: 2
        dimensions:
          VolumeId: "{{ item.volume_id }}"
        alarm_actions: "{{ ebs_alarm_sns_topic }}"
        region: "{{ item.item.region | default(aws_region) }}"
        state: present
      loop: "{{ ebs_volume_result.results }}"
      when:
        - ebs_volume_result is defined
        - ebs_enable_cloudwatch_alarms | bool
        - ebs_alarm_sns_topic is defined
        - item.volume_id is defined

    - name: Display EBS volume summary
      ansible.builtin.debug:
        msg:
          - "EBS Volumes Created: {{ ebs_volume_result.results | selectattr('changed', 'equalto', true) | list | length if ebs_volume_result is defined else 0 }}"
          - "Total Volume Size: {{ ebs_volume_result.results | map(attribute='item.size') | sum if ebs_volume_result is defined else 0 }} GB"
          - "Snapshots Created: {{ snapshot_result.results | selectattr('changed', 'equalto', true) | list | length if snapshot_result is defined else 0 }}"

    - name: Notify EBS volume changes
      ansible.builtin.debug:
        msg: "EBS volume configuration completed"
      changed_when: true
      notify: notify ebs volume changes
      when:
        - ebs_volume_result is defined
        - ebs_volume_result.changed | default(false)

    # ----------------------------- postflight -------------------

    - name: "aws/aws_ec2_ebs_volumes | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_aws_aws_ec2_ebs_volumes_preflight_passed | bool
          - fe_aws_aws_ec2_ebs_volumes_status in ['running', 'succeeded']
        fail_msg: >-
          aws/aws_ec2_ebs_volumes: postflight validation failed - preflight passed
          ={{ fe_aws_aws_ec2_ebs_volumes_preflight_passed | default(false) }},
          status={{ fe_aws_aws_ec2_ebs_volumes_status | default('unknown') }}.
        success_msg: "aws/aws_ec2_ebs_volumes: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "aws/aws_ec2_ebs_volumes | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_ebs_volumes_postflight_passed: true
        fe_aws_aws_ec2_ebs_volumes_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "aws/aws_ec2_ebs_volumes | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_ebs_volumes_status: "failed"
        fe_aws_aws_ec2_ebs_volumes_postflight_passed: false
        fe_aws_aws_ec2_ebs_volumes_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_aws_aws_ec2_ebs_volumes_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "aws/aws_ec2_ebs_volumes | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          aws/aws_ec2_ebs_volumes: FAILED at '{{ fe_aws_aws_ec2_ebs_volumes_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_aws_aws_ec2_ebs_volumes_error }}
      tags:
        - always
        - rescue

    - name: "aws/aws_ec2_ebs_volumes | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          aws/aws_ec2_ebs_volumes failed at '{{ fe_aws_aws_ec2_ebs_volumes_failed_task }}': {{ fe_aws_aws_ec2_ebs_volumes_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "aws/aws_ec2_ebs_volumes | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_ebs_volumes_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_aws_aws_ec2_ebs_volumes_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_aws_ec2_ebs_volumes_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "aws/aws_ec2_ebs_volumes | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "aws/aws_ec2_ebs_volumes":
              component: "aws/aws_ec2_ebs_volumes"
              type: "role"
              platform: "aws"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_aws_aws_ec2_ebs_volumes_status | default('unknown') }}"
              preflight_passed: "{{ fe_aws_aws_ec2_ebs_volumes_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_aws_aws_ec2_ebs_volumes_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_aws_aws_ec2_ebs_volumes_started_at | default('') }}"
              ended_at: "{{ fe_aws_aws_ec2_ebs_volumes_ended_at | default('') }}"
              duration_seconds: "{{ fe_aws_aws_ec2_ebs_volumes_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_aws_aws_ec2_ebs_volumes_failed_task | default('') }}"
              error: "{{ fe_aws_aws_ec2_ebs_volumes_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_aws_aws_ec2_ebs_volumes_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_aws_aws_ec2_ebs_volumes_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_aws_aws_ec2_ebs_volumes_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_aws_aws_ec2_ebs_volumes_status | default('') == 'succeeded' else ['aws/aws_ec2_ebs_volumes'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "aws/aws_ec2_ebs_volumes | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_aws_aws_ec2_ebs_volumes_stats_published: true
      tags:
        - always
