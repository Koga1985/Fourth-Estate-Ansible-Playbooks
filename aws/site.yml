---
# AWS Infrastructure Deployment Playbook
# Entry point for AWS platform automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml
#
# Tags:
#   - iam: Identity and Access Management only
#   - network: VPC, subnets, routing only
#   - compute: EC2, EKS only
#   - storage: S3, EBS only
#   - database: RDS only
#   - security: Security services only
#   - monitoring: CloudWatch, CloudTrail only
#   - compliance: FedRAMP/NIST compliance checks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: AWS Infrastructure Deployment
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Deployment control - set to true to enable each component
    deploy_iam: true
    deploy_network: true
    deploy_compute: false
    deploy_eks: false
    deploy_storage: true
    deploy_database: false
    deploy_security: true
    deploy_monitoring: true
    deploy_compliance: true

  tasks:
    # =========================================
    # Phase 1: Identity & Access Management
    # =========================================
    - name: "aws/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - IAM Policies
          ansible.builtin.include_role:
            name: aws_iam_policies
          when: deploy_iam | bool
          tags: ['iam', 'phase1']

        - name: Phase 1 - IAM Roles
          ansible.builtin.include_role:
            name: aws_iam_roles
          when: deploy_iam | bool
          tags: ['iam', 'phase1']

        - name: Phase 1 - IAM Groups
          ansible.builtin.include_role:
            name: aws_iam_groups
          when: deploy_iam | bool
          tags: ['iam', 'phase1']

        - name: Phase 1 - IAM Users
          ansible.builtin.include_role:
            name: aws_iam_users
          when: deploy_iam | bool
          tags: ['iam', 'phase1']

        - name: Phase 1 - IAM MFA Enforcement
          ansible.builtin.include_role:
            name: aws_iam_mfa
          when: deploy_iam | bool
          tags: ['iam', 'phase1']

        # =========================================
        # Phase 2: Networking
        # =========================================
        - name: Phase 2 - VPC
          ansible.builtin.include_role:
            name: aws_vpc
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 2 - Subnets
          ansible.builtin.include_role:
            name: aws_subnets
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 2 - Route Tables
          ansible.builtin.include_role:
            name: aws_route_tables
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 2 - Network ACLs
          ansible.builtin.include_role:
            name: aws_nacls
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 2 - Security Groups
          ansible.builtin.include_role:
            name: aws_security_groups
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 2 - VPN Configuration
          ansible.builtin.include_role:
            name: aws_vpn
          when: deploy_network | bool
          tags: ['network', 'phase2']

        # =========================================
        # Phase 3: Security Services
        # =========================================
        - name: Phase 3 - KMS Key Management
          ansible.builtin.include_role:
            name: aws_kms
          when: deploy_security | bool
          tags: ['security', 'phase3']

        - name: Phase 3 - GuardDuty
          ansible.builtin.include_role:
            name: aws_guardduty_detector
          when: deploy_security | bool
          tags: ['security', 'phase3']

        - name: Phase 3 - IAM Access Analyzer
          ansible.builtin.include_role:
            name: aws_iam_access_analyzer
          when: deploy_security | bool
          tags: ['security', 'phase3']

        # =========================================
        # Phase 4: Storage
        # =========================================
        - name: Phase 4 - S3 Buckets
          ansible.builtin.include_role:
            name: aws_s3_buckets
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        - name: Phase 4 - S3 Lifecycle Policies
          ansible.builtin.include_role:
            name: aws_s3_lifecycle
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        - name: Phase 4 - EBS Volumes
          ansible.builtin.include_role:
            name: aws_ec2_ebs_volumes
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        # =========================================
        # Phase 5: Compute (Optional)
        # =========================================
        - name: Phase 5 - EC2 Key Pairs
          ansible.builtin.include_role:
            name: aws_ec2_key_pairs
          when: deploy_compute | bool
          tags: ['compute', 'phase5']

        - name: Phase 5 - EC2 Instances
          ansible.builtin.include_role:
            name: aws_ec2_instances
          when: deploy_compute | bool
          tags: ['compute', 'phase5']

        - name: Phase 5 - EC2 AMIs
          ansible.builtin.include_role:
            name: aws_ec2_amis
          when: deploy_compute | bool
          tags: ['compute', 'phase5']

        # =========================================
        # Phase 6: EKS (Optional)
        # =========================================
        - name: Phase 6 - EKS Clusters
          ansible.builtin.include_role:
            name: aws_eks_clusters
          when: deploy_eks | bool
          tags: ['eks', 'phase6']

        - name: Phase 6 - EKS Node Groups
          ansible.builtin.include_role:
            name: aws_eks_node_groups
          when: deploy_eks | bool
          tags: ['eks', 'phase6']

        # =========================================
        # Phase 7: Databases (Optional)
        # =========================================
        - name: Phase 7 - RDS Databases
          ansible.builtin.include_role:
            name: aws_rds
          when: deploy_database | bool
          tags: ['database', 'phase7']

        # =========================================
        # Phase 8: Monitoring & Logging
        # =========================================
        - name: Phase 8 - CloudTrail
          ansible.builtin.include_role:
            name: aws_cloudtrail_trails
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase8']

        - name: Phase 8 - CloudWatch Logs
          ansible.builtin.include_role:
            name: aws_cloudwatch_logs
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase8']

        - name: Phase 8 - CloudWatch Alarms
          ansible.builtin.include_role:
            name: aws_cloudwatch_alarms
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase8']

        - name: Phase 8 - AWS Config Rules
          ansible.builtin.include_role:
            name: aws_config_rules
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase8']

        # =========================================
        # Phase 9: Compliance Validation
        # =========================================
        - name: Phase 9 - FedRAMP Compliance Check
          ansible.builtin.include_role:
            name: aws_fedramp_compliance
          when: deploy_compliance | bool
          tags: ['compliance', 'phase9']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== AWS Deployment Complete ==="
              - "Region: {{ aws_region | default('us-east-1') }}"
              - "Environment: {{ aws_environment | default('production') }}"
              - "IAM: {{ 'Configured' if deploy_iam else 'Skipped' }}"
              - "Network: {{ 'Configured' if deploy_network else 'Skipped' }}"
              - "Security: {{ 'Configured' if deploy_security else 'Skipped' }}"
              - "Storage: {{ 'Configured' if deploy_storage else 'Skipped' }}"
              - "Compute: {{ 'Configured' if deploy_compute else 'Skipped' }}"
              - "EKS: {{ 'Configured' if deploy_eks else 'Skipped' }}"
              - "Database: {{ 'Configured' if deploy_database else 'Skipped' }}"
              - "Monitoring: {{ 'Configured' if deploy_monitoring else 'Skipped' }}"
              - "Compliance: {{ 'Validated' if deploy_compliance else 'Skipped' }}"
          tags: ['always']

        - name: "aws/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "aws/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_aws_site_status: "failed"
            fe_aws_site_postflight_passed: false
            fe_aws_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_aws_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "aws/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              aws/site: FAILED at '{{ fe_aws_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_aws_site_error }}
          tags:
            - always
            - rescue

        - name: "aws/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              aws/site failed at '{{ fe_aws_site_failed_task }}': {{ fe_aws_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "aws/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_aws_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_aws_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "aws/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "aws/site":
                  component: "aws/site"
                  type: "playbook"
                  platform: "aws"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_aws_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_aws_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_aws_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_aws_site_started_at | default('') }}"
                  ended_at: "{{ fe_aws_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_aws_site_failed_task | default('') }}"
                  error: "{{ fe_aws_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_aws_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_aws_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_aws_site_status | default('') == 'succeeded' else ['aws/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_aws_site_status | default('') == 'failed'
            - not (fe_aws_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "aws/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_aws_site_stats_published: true
          when:
            - fe_aws_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "aws/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "aws/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_aws_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_aws_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_aws_site_status: "running"
            fe_aws_site_preflight_passed: false
            fe_aws_site_postflight_passed: false
            fe_aws_site_failed_task: ""
            fe_aws_site_error: ""
            fe_aws_site_stats_published: false
          tags:
            - always

        - name: "aws/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              aws/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              aws/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "aws/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "aws/site: required variable '{{ item }}' is not defined."
            success_msg: "aws/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_aws_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "aws/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_aws_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "aws/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_aws_site_status: "preflight_failed"
            fe_aws_site_postflight_passed: false
            fe_aws_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_aws_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "aws/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              aws/site: FAILED at '{{ fe_aws_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_aws_site_error }}
          tags:
            - always
            - rescue

        - name: "aws/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "aws/site":
                  component: "aws/site"
                  type: "playbook"
                  platform: "aws"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_aws_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_aws_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_aws_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_aws_site_started_at | default('') }}"
                  ended_at: "{{ fe_aws_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_aws_site_failed_task | default('') }}"
                  error: "{{ fe_aws_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_aws_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_aws_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_aws_site_status | default('') == 'succeeded' else ['aws/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "aws/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_aws_site_stats_published: true
          tags:
            - always

        - name: "aws/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              aws/site failed at '{{ fe_aws_site_failed_task }}': {{ fe_aws_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "aws/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              aws/site: preflight
              {{ 'passed' if fe_aws_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "aws/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "aws/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_aws_site_preflight_passed | bool
              - fe_aws_site_status in ['running', 'succeeded']
            fail_msg: >-
              aws/site: postflight validation failed - preflight passed
              ={{ fe_aws_site_preflight_passed | default(false) }},
              status={{ fe_aws_site_status | default('unknown') }}.
            success_msg: "aws/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "aws/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_aws_site_postflight_passed: true
            fe_aws_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "aws/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_aws_site_status: "failed"
            fe_aws_site_postflight_passed: false
            fe_aws_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_aws_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "aws/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              aws/site: FAILED at '{{ fe_aws_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_aws_site_error }}
          tags:
            - always
            - rescue

        - name: "aws/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              aws/site failed at '{{ fe_aws_site_failed_task }}': {{ fe_aws_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "aws/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_aws_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_aws_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_aws_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "aws/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "aws/site":
                  component: "aws/site"
                  type: "playbook"
                  platform: "aws"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_aws_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_aws_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_aws_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_aws_site_started_at | default('') }}"
                  ended_at: "{{ fe_aws_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_aws_site_failed_task | default('') }}"
                  error: "{{ fe_aws_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_aws_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_aws_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_aws_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_aws_site_status | default('') == 'succeeded' else ['aws/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_aws_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "aws/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_aws_site_stats_published: true
          tags:
            - always

        - name: "aws/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              aws/site: {{ fe_aws_site_status | default('unknown') }} in
              {{ fe_aws_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
