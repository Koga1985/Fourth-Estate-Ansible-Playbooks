---
# ScienceLogic SL1 Deployment Playbook
# Entry point for SL1 monitoring platform automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: SL1 Platform Installation
  hosts: sl1_all
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_install: false
    deploy_config: true
    deploy_hardening: true
    deploy_database: true

  tasks:
    - name: "sciencelogic/site#play1 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Platform Installation
          ansible.builtin.include_role:
            name: sl1_platform_install
          when: deploy_install | bool
          tags: ['install', 'phase1']

        - name: Phase 2 - Platform Configuration
          ansible.builtin.include_role:
            name: sl1_platform_config
          when: deploy_config | bool
          tags: ['config', 'phase2']

        - name: Phase 3 - Platform Hardening
          ansible.builtin.include_role:
            name: sl1_platform_hardening
          when: deploy_hardening | bool
          tags: ['hardening', 'phase3']

        - name: Phase 4 - Database Baseline
          ansible.builtin.include_role:
            name: sl1_database_baseline
          when: deploy_database | bool and inventory_hostname in groups['sl1_database']
          tags: ['database', 'phase4']

      rescue:

        - name: "sciencelogic/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_status: "failed"
            fe_sciencelogic_site_play1_postflight_passed: false
            fe_sciencelogic_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sciencelogic_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play1: FAILED at '{{ fe_sciencelogic_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sciencelogic_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sciencelogic/site#play1 failed at '{{ fe_sciencelogic_site_play1_failed_task }}': {{ fe_sciencelogic_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sciencelogic/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sciencelogic_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sciencelogic/site#play1":
                  component: "sciencelogic/site#play1"
                  type: "playbook"
                  platform: "sciencelogic"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sciencelogic_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sciencelogic_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sciencelogic_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sciencelogic_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_sciencelogic_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sciencelogic_site_play1_failed_task | default('') }}"
                  error: "{{ fe_sciencelogic_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else ['sciencelogic/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - fe_sciencelogic_site_play1_status | default('') == 'failed'
            - not (fe_sciencelogic_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_stats_published: true
          when:
            - fe_sciencelogic_site_play1_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "sciencelogic/site#play1 | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "sciencelogic/site#play1 | Initialize validation state"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_sciencelogic_site_play1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sciencelogic_site_play1_status: "running"
            fe_sciencelogic_site_play1_preflight_passed: false
            fe_sciencelogic_site_play1_postflight_passed: false
            fe_sciencelogic_site_play1_failed_task: ""
            fe_sciencelogic_site_play1_error: ""
            fe_sciencelogic_site_play1_stats_published: false
          tags:
            - always

        - name: "sciencelogic/site#play1 | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              sciencelogic/site#play1: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              sciencelogic/site#play1: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "sciencelogic/site#play1 | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "sciencelogic/site#play1: required variable '{{ item }}' is not defined."
            success_msg: "sciencelogic/site#play1: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_sciencelogic_site_play1_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "sciencelogic/site#play1 | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "sciencelogic/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_status: "preflight_failed"
            fe_sciencelogic_site_play1_postflight_passed: false
            fe_sciencelogic_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sciencelogic_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play1: FAILED at '{{ fe_sciencelogic_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sciencelogic_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sciencelogic/site#play1":
                  component: "sciencelogic/site#play1"
                  type: "playbook"
                  platform: "sciencelogic"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sciencelogic_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sciencelogic_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sciencelogic_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sciencelogic_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_sciencelogic_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sciencelogic_site_play1_failed_task | default('') }}"
                  error: "{{ fe_sciencelogic_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else ['sciencelogic/site#play1'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_stats_published: true
          tags:
            - always

        - name: "sciencelogic/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sciencelogic/site#play1 failed at '{{ fe_sciencelogic_site_play1_failed_task }}': {{ fe_sciencelogic_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sciencelogic/site#play1 | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play1: preflight
              {{ 'passed' if fe_sciencelogic_site_play1_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "sciencelogic/site#play1 | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "sciencelogic/site#play1 | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_sciencelogic_site_play1_preflight_passed | bool
              - fe_sciencelogic_site_play1_status in ['running', 'succeeded']
            fail_msg: >-
              sciencelogic/site#play1: postflight validation failed - preflight passed
              ={{ fe_sciencelogic_site_play1_preflight_passed | default(false) }},
              status={{ fe_sciencelogic_site_play1_status | default('unknown') }}.
            success_msg: "sciencelogic/site#play1: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "sciencelogic/site#play1 | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_postflight_passed: true
            fe_sciencelogic_site_play1_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "sciencelogic/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_status: "failed"
            fe_sciencelogic_site_play1_postflight_passed: false
            fe_sciencelogic_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sciencelogic_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play1: FAILED at '{{ fe_sciencelogic_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sciencelogic_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sciencelogic/site#play1 failed at '{{ fe_sciencelogic_site_play1_failed_task }}': {{ fe_sciencelogic_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sciencelogic/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sciencelogic_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sciencelogic/site#play1":
                  component: "sciencelogic/site#play1"
                  type: "playbook"
                  platform: "sciencelogic"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sciencelogic_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sciencelogic_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sciencelogic_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sciencelogic_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_sciencelogic_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sciencelogic_site_play1_failed_task | default('') }}"
                  error: "{{ fe_sciencelogic_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sciencelogic_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sciencelogic_site_play1_status | default('') == 'succeeded' else ['sciencelogic/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_sciencelogic_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play1_stats_published: true
          tags:
            - always

        - name: "sciencelogic/site#play1 | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play1: {{ fe_sciencelogic_site_play1_status | default('unknown') }} in
              {{ fe_sciencelogic_site_play1_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always


- name: SL1 Monitoring Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_inventory: true
    deploy_discovery: true
    deploy_monitoring: true
    deploy_events: true
    deploy_dashboards: true
    deploy_itsm: true
    deploy_collectors: true
    deploy_retention: true
    deploy_governance: true

  tasks:
    - name: "sciencelogic/site#play2 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 5 - Inventory Model
          ansible.builtin.include_role:
            name: sl1_inventory_model
          when: deploy_inventory | bool
          tags: ['inventory', 'phase5']

        - name: Phase 6 - Discovery Pipelines
          ansible.builtin.include_role:
            name: sl1_discovery_pipelines
          when: deploy_discovery | bool
          tags: ['discovery', 'phase6']

        - name: Phase 7 - Monitoring Baseline
          ansible.builtin.include_role:
            name: sl1_monitoring_baseline
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase7']

        - name: Phase 7 - Server Baseline
          ansible.builtin.include_role:
            name: sl1_server_baseline
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase7']

        - name: Phase 7 - Network Baseline
          ansible.builtin.include_role:
            name: sl1_network_baseline
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase7']

        - name: Phase 8 - Thresholds
          ansible.builtin.include_role:
            name: sl1_thresholds_baseline
          tags: ['thresholds', 'phase8']

        - name: Phase 9 - Event Policies
          ansible.builtin.include_role:
            name: sl1_event_policy_hygiene
          when: deploy_events | bool
          tags: ['events', 'phase9']

        - name: Phase 9 - Notification Routing
          ansible.builtin.include_role:
            name: sl1_notify_routing
          when: deploy_events | bool
          tags: ['events', 'phase9']

        - name: Phase 10 - Dashboard Catalog
          ansible.builtin.include_role:
            name: sl1_dashboard_catalog
          when: deploy_dashboards | bool
          tags: ['dashboards', 'phase10']

        - name: Phase 10 - KPI Scorecards
          ansible.builtin.include_role:
            name: sl1_kpi_scorecards
          when: deploy_dashboards | bool
          tags: ['dashboards', 'phase10']

        - name: Phase 11 - ITSM Pipeline
          ansible.builtin.include_role:
            name: sl1_itsm_pipeline
          when: deploy_itsm | bool
          tags: ['itsm', 'phase11']

        - name: Phase 11 - ITSM Enrichment
          ansible.builtin.include_role:
            name: sl1_itsm_enrichment
          when: deploy_itsm | bool
          tags: ['itsm', 'phase11']

        - name: Phase 12 - Collector Fleet
          ansible.builtin.include_role:
            name: sl1_collector_fleet
          when: deploy_collectors | bool
          tags: ['collectors', 'phase12']

        - name: Phase 13 - Data Retention
          ansible.builtin.include_role:
            name: sl1_data_retention
          when: deploy_retention | bool
          tags: ['retention', 'phase13']

        - name: Phase 14 - Governance Pack
          ansible.builtin.include_role:
            name: sl1_governance_pack
          when: deploy_governance | bool
          tags: ['governance', 'phase14']

        - name: Phase 14 - Audit Governance
          ansible.builtin.include_role:
            name: sl1_audit_governance
          when: deploy_governance | bool
          tags: ['governance', 'phase14']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== ScienceLogic SL1 Deployment Complete ==="
              - "Version: {{ sl1_version | default('11.3') }}"
              - "API URL: {{ sl1_api_url }}"
          tags: ['always']

      rescue:

        - name: "sciencelogic/site#play2 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play2_status: "failed"
            fe_sciencelogic_site_play2_postflight_passed: false
            fe_sciencelogic_site_play2_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sciencelogic_site_play2_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play2 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sciencelogic/site#play2: FAILED at '{{ fe_sciencelogic_site_play2_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sciencelogic_site_play2_error }}
          tags:
            - always
            - rescue

        - name: "sciencelogic/site#play2 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sciencelogic/site#play2 failed at '{{ fe_sciencelogic_site_play2_failed_task }}': {{ fe_sciencelogic_site_play2_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sciencelogic/site#play2 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sciencelogic_site_play2_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sciencelogic_site_play2_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_site_play2_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sciencelogic/site#play2 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sciencelogic/site#play2":
                  component: "sciencelogic/site#play2"
                  type: "playbook"
                  platform: "sciencelogic"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sciencelogic_site_play2_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sciencelogic_site_play2_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sciencelogic_site_play2_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sciencelogic_site_play2_started_at | default('') }}"
                  ended_at: "{{ fe_sciencelogic_site_play2_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sciencelogic_site_play2_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sciencelogic_site_play2_failed_task | default('') }}"
                  error: "{{ fe_sciencelogic_site_play2_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
