---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_itsm_enrichment role
      ansible.builtin.include_role:
        name: sl1_itsm_enrichment

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_itsm_enrichment_preflight_passed | bool
          - fe_sciencelogic_sl1_itsm_enrichment_postflight_passed | bool
          - fe_sciencelogic_sl1_itsm_enrichment_status == 'succeeded'
        fail_msg: >-
          sl1_itsm_enrichment did not complete cleanly:
          status={{ fe_sciencelogic_sl1_itsm_enrichment_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_itsm_enrichment_failed_task | default('') }}
        success_msg: "sl1_itsm_enrichment completed and the validation harness reported success."
