---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_install_status: "running"
    fe_sciencelogic_sl1_platform_install_preflight_passed: false
    fe_sciencelogic_sl1_platform_install_postflight_passed: false
    fe_sciencelogic_sl1_platform_install_failed_task: ""
    fe_sciencelogic_sl1_platform_install_error: ""
    fe_sciencelogic_sl1_platform_install_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_install: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

    - name: Pre-installation validation
      import_tasks: tasks/10_pre_install_checks.yml

    - name: Install prerequisites
      import_tasks: tasks/20_prerequisites.yml
      when: sl1_install_options.install_prerequisites

    - name: Configure system settings
      import_tasks: tasks/30_system_config.yml

    - name: Install SL1 Database Server
      import_tasks: tasks/40_database_server.yml
      when: sl1_install_mode in ['database_server', 'all_in_one'] and sl1_db_server.install

    - name: Configure Database Cluster
      import_tasks: tasks/45_database_cluster.yml
      when: sl1_db_cluster.enabled

    - name: Install SL1 All-In-One Appliance
      import_tasks: tasks/50_all_in_one.yml
      when: sl1_install_mode == 'all_in_one' and sl1_aio.install

    - name: Install Message Collectors
      import_tasks: tasks/60_message_collectors.yml
      when: sl1_message_collectors | selectattr('install', 'equalto', true) | list | length > 0

    - name: Install Data Collectors
      import_tasks: tasks/70_data_collectors.yml
      when: sl1_data_collectors | selectattr('install', 'equalto', true) | list | length > 0

    - name: Configure High Availability
      import_tasks: tasks/75_high_availability.yml
      when: sl1_ha.enabled

    - name: Configure Network Settings
      import_tasks: tasks/80_network_config.yml
      when: sl1_network.configure

    - name: Install SSL/TLS Certificates
      import_tasks: tasks/85_ssl_certificates.yml
      when: sl1_ssl.enabled

    - name: Activate License
      import_tasks: tasks/90_license_activation.yml
      when: sl1_license.activate

    - name: Run Initial Setup Wizard
      import_tasks: tasks/95_setup_wizard.yml
      when: sl1_setup_wizard.run

    - name: Post-installation tasks
      import_tasks: tasks/99_post_install.yml
      when: sl1_post_install.restart_services

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_install_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_install_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_install: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_install_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_install_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_postflight_passed: true
        fe_sciencelogic_sl1_platform_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_status: "failed"
        fe_sciencelogic_sl1_platform_install_postflight_passed: false
        fe_sciencelogic_sl1_platform_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_install: FAILED at '{{ fe_sciencelogic_sl1_platform_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_install_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_install failed at '{{ fe_sciencelogic_sl1_platform_install_failed_task }}': {{ fe_sciencelogic_sl1_platform_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_install":
              component: "sciencelogic/sl1_platform_install"
              type: "role"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_install_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_install_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_install_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_stats_published: true
      tags:
        - always
