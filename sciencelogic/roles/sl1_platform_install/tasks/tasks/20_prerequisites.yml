---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_install/20_prerequisites']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_install_20_prerequisites_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_install/20_prerequisites | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_install_20_prerequisites_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_install_20_prerequisites_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_install_20_prerequisites_status: "running"
    fe_sciencelogic_sl1_platform_install_20_prerequisites_preflight_passed: false
    fe_sciencelogic_sl1_platform_install_20_prerequisites_postflight_passed: false
    fe_sciencelogic_sl1_platform_install_20_prerequisites_failed_task: ""
    fe_sciencelogic_sl1_platform_install_20_prerequisites_error: ""
    fe_sciencelogic_sl1_platform_install_20_prerequisites_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_install/20_prerequisites | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_install/20_prerequisites: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_install/20_prerequisites: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_install/20_prerequisites: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_install/20_prerequisites: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_20_prerequisites_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install required system packages
      ansible.builtin.yum:
        name:
          - python3
          - python3-pip
          - python3-requests
          - wget
          - curl
          - net-tools
          - bind-utils
          - ntp
          - ntpdate
          - openssl
          - perl
          - perl-Time-HiRes
          - perl-DBI
          - perl-DBD-MySQL
          - libaio
          - numactl
          - sysstat
          - iotop
          - iftop
          - tcpdump
          - traceroute
          - telnet
          - nc
        state: present
      when: not dry_run

    - name: Disable SELinux (if required)
      ansible.builtin.selinux:
        state: "{{ 'enforcing' if sl1_install_options.configure_selinux else 'disabled' }}"
      when: ansible_selinux.status != 'disabled'
      notify: Reboot system

    - name: Configure firewall rules
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - "443/tcp"   # HTTPS
        - "7700/tcp"  # SL1 API
        - "7705/tcp"  # SL1 Collector
        - "162/udp"   # SNMP Traps
        - "514/udp"   # Syslog
        - "514/tcp"   # Syslog TCP
        - "3306/tcp"  # MySQL (for collectors)
        - "9200/tcp"  # Elasticsearch
      when:
        - sl1_network.firewall_enabled
        - not dry_run

    - name: Set system limits
      ansible.builtin.pam_limits:
        domain: '*'
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { type: 'soft', item: 'nofile', value: '{{ sl1_system.max_open_files }}' }
        - { type: 'hard', item: 'nofile', value: '{{ sl1_system.max_open_files }}' }
        - { type: 'soft', item: 'nproc', value: '65536' }
        - { type: 'hard', item: 'nproc', value: '65536' }
      when: not dry_run

    - name: Configure sysctl parameters
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: 'vm.max_map_count', value: '{{ sl1_system.vm_max_map_count }}' }
        - { name: 'vm.swappiness', value: '10' }
        - { name: 'net.ipv4.tcp_max_syn_backlog', value: '4096' }
        - { name: 'net.core.somaxconn', value: '4096' }
        - { name: 'net.ipv4.ip_local_port_range', value: '10000 65535' }
        - { name: 'net.ipv4.tcp_tw_reuse', value: '1' }
      when: not dry_run

    - name: Configure NTP
      ansible.builtin.template:
        src: ntp.conf.j2
        dest: /etc/ntp.conf
        owner: root
        group: root
        mode: '0644'
      when: not dry_run
      notify: Restart ntpd

    - name: Start and enable NTP service
      ansible.builtin.service:
        name: ntpd
        state: started
        enabled: true
      when: not dry_run

    - name: Synchronize time
      ansible.builtin.command: ntpdate -u {{ sl1_aio.ntp_servers[0] }}
      changed_when: true
      when: not dry_run

    - name: Create SL1 installation directory
      ansible.builtin.file:
        path: /opt/em7
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not dry_run

    - name: Download SL1 installer (if not present)
      ansible.builtin.get_url:
        url: "https://updates.sciencelogic.com/releases/{{ sl1_version }}/sl1_installer_{{ sl1_version }}.bin"
        dest: "{{ sl1_package_path }}"
        mode: '0755'
      when:
        - sl1_install_options.download_installer | default(false)
        - not dry_run

    - name: Make installer executable
      ansible.builtin.file:
        path: "{{ sl1_package_path }}"
        mode: '0755'
      when: not dry_run

    - name: Prerequisites installation summary
      ansible.builtin.debug:
        msg:
          - "Prerequisites installation completed"
          - "System limits configured"
          - "Firewall rules applied"
          - "NTP synchronized"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_install_20_prerequisites_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_install_20_prerequisites_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_install/20_prerequisites: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_install_20_prerequisites_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_install_20_prerequisites_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_install/20_prerequisites: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_20_prerequisites_postflight_passed: true
        fe_sciencelogic_sl1_platform_install_20_prerequisites_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_20_prerequisites_status: "failed"
        fe_sciencelogic_sl1_platform_install_20_prerequisites_postflight_passed: false
        fe_sciencelogic_sl1_platform_install_20_prerequisites_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_install_20_prerequisites_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_install/20_prerequisites: FAILED at '{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_install_20_prerequisites_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_install/20_prerequisites failed at '{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_failed_task }}': {{ fe_sciencelogic_sl1_platform_install_20_prerequisites_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_20_prerequisites_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_install_20_prerequisites_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_install_20_prerequisites_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_install/20_prerequisites":
              component: "sciencelogic/sl1_platform_install/20_prerequisites"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_install_20_prerequisites_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_install_20_prerequisites_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_20_prerequisites_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_install_20_prerequisites_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_install/20_prerequisites'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/20_prerequisites | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_20_prerequisites_stats_published: true
      tags:
        - always
