---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_install/99_post_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_install_99_post_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_install/99_post_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_install_99_post_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_install_99_post_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_install_99_post_install_status: "running"
    fe_sciencelogic_sl1_platform_install_99_post_install_preflight_passed: false
    fe_sciencelogic_sl1_platform_install_99_post_install_postflight_passed: false
    fe_sciencelogic_sl1_platform_install_99_post_install_failed_task: ""
    fe_sciencelogic_sl1_platform_install_99_post_install_error: ""
    fe_sciencelogic_sl1_platform_install_99_post_install_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_install/99_post_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_install/99_post_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_install/99_post_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_install/99_post_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/99_post_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_install/99_post_install: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_install/99_post_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/99_post_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_99_post_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Restart SL1 services
      ansible.builtin.service:
        name: "{{ item.name }}"
        state: restarted
        enabled: "{{ item.enabled }}"
      loop: "{{ sl1_services }}"
      when:
        - sl1_post_install.restart_services
        - not dry_run

    - name: Wait for SL1 to be fully operational
      ansible.builtin.wait_for:
        port: 443
        host: "{{ sl1_aio.hostname }}"
        timeout: 600
        delay: 30
      when: not dry_run

    - name: Run health check
      ansible.builtin.uri:
        url: "https://{{ sl1_aio.hostname }}/api/system/health"
        method: GET
        headers:
          X-EM7-API-Username: "{{ sl1_setup_wizard.admin_user }}"
          X-EM7-API-Password: "{{ sl1_setup_wizard.admin_password }}"
        validate_certs: "{{ sl1_ssl.enabled }}"
        status_code: 200
      register: health_check
      when:
        - sl1_post_install.run_healthcheck
        - not dry_run

    - name: Display health check results
      ansible.builtin.debug:
        var: health_check.json
      when:
        - sl1_post_install.run_healthcheck
        - not dry_run

    - name: Configure automated backup
      ansible.builtin.template:
        src: backup_config.j2
        dest: /opt/em7/conf/backup.conf
        owner: em7admin
        group: em7admin
        mode: '0644'
      when:
        - sl1_post_install.configure_backup
        - not dry_run

    - name: Create backup cron job
      ansible.builtin.cron:
        name: "SL1 Daily Backup"
        hour: "2"
        minute: "0"
        job: "/opt/em7/bin/em7_backup.sh"
        user: em7admin
      when:
        - sl1_post_install.configure_backup
        - not dry_run

    - name: Post-installation summary
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "SL1 Platform Installation Completed Successfully"
          - "================================================"
          - "Access URL: https://{{ sl1_aio.hostname }}"
          - "Admin User: {{ sl1_setup_wizard.admin_user }}"
          - "Version: {{ sl1_version }}"
          - "Organization: {{ sl1_setup_wizard.organization }}"
          - "Health Status: {{ health_check.json.status | default('OK') if not dry_run else 'DRY RUN' }}"
          - "================================================"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_install/99_post_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_install_99_post_install_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_install_99_post_install_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_install/99_post_install: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_install_99_post_install_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_install_99_post_install_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_install/99_post_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_install/99_post_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_99_post_install_postflight_passed: true
        fe_sciencelogic_sl1_platform_install_99_post_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_install/99_post_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_99_post_install_status: "failed"
        fe_sciencelogic_sl1_platform_install_99_post_install_postflight_passed: false
        fe_sciencelogic_sl1_platform_install_99_post_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_install_99_post_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/99_post_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_install/99_post_install: FAILED at '{{ fe_sciencelogic_sl1_platform_install_99_post_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_install_99_post_install_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/99_post_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_install/99_post_install failed at '{{ fe_sciencelogic_sl1_platform_install_99_post_install_failed_task }}': {{ fe_sciencelogic_sl1_platform_install_99_post_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_install/99_post_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_99_post_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_install_99_post_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_install_99_post_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/99_post_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_install/99_post_install":
              component: "sciencelogic/sl1_platform_install/99_post_install"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_install_99_post_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_install_99_post_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_99_post_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_install_99_post_install_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_install/99_post_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/99_post_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_99_post_install_stats_published: true
      tags:
        - always
