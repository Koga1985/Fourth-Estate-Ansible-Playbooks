---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_install/95_setup_wizard']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_install_95_setup_wizard_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_install/95_setup_wizard | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_status: "running"
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_preflight_passed: false
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_postflight_passed: false
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_failed_task: ""
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_error: ""
    fe_sciencelogic_sl1_platform_install_95_setup_wizard_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_install/95_setup_wizard | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_install/95_setup_wizard: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_install/95_setup_wizard: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_install/95_setup_wizard: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_install/95_setup_wizard: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure initial admin user
      ansible.builtin.uri:
        url: "https://{{ sl1_aio.hostname }}/api/account/user"
        method: POST
        body:
          username: "{{ sl1_setup_wizard.admin_user }}"
          password: "{{ sl1_setup_wizard.admin_password }}"
          email: "{{ sl1_setup_wizard.admin_email }}"
          role: "Administrator"
          active: 1
        body_format: json
        headers:
          Content-Type: "application/json"
        validate_certs: "{{ sl1_ssl.enabled }}"
        status_code: [200, 201, 409]
      no_log: true
      register: admin_user_result
      when: not dry_run

    - name: Configure organization
      ansible.builtin.uri:
        url: "https://{{ sl1_aio.hostname }}/api/organization"
        method: POST
        body:
          company: "{{ sl1_setup_wizard.organization }}"
          timezone: "{{ sl1_setup_wizard.timezone }}"
          locale: "{{ sl1_setup_wizard.locale }}"
        body_format: json
        headers:
          Content-Type: "application/json"
          X-EM7-API-Username: "{{ sl1_setup_wizard.admin_user }}"
          X-EM7-API-Password: "{{ sl1_setup_wizard.admin_password }}"
        validate_certs: "{{ sl1_ssl.enabled }}"
        status_code: [200, 201, 409]
      when: not dry_run

    - name: Run post-setup configuration script
      ansible.builtin.shell: /opt/em7/bin/em7_post_setup.sh
      changed_when: true
      when: not dry_run

    - name: Setup wizard completion summary
      ansible.builtin.debug:
        msg:
          - "SL1 setup wizard completed"
          - "Organization: {{ sl1_setup_wizard.organization }}"
          - "Admin Email: {{ sl1_setup_wizard.admin_email }}"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_install_95_setup_wizard_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_install_95_setup_wizard_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_install/95_setup_wizard: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_install/95_setup_wizard: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_postflight_passed: true
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_status: "failed"
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_postflight_passed: false
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_install/95_setup_wizard: FAILED at '{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_install/95_setup_wizard failed at '{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_failed_task }}': {{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_install_95_setup_wizard_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_install/95_setup_wizard":
              component: "sciencelogic/sl1_platform_install/95_setup_wizard"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_install_95_setup_wizard_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_install_95_setup_wizard_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_95_setup_wizard_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_install_95_setup_wizard_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_install/95_setup_wizard'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/95_setup_wizard | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_95_setup_wizard_stats_published: true
      tags:
        - always
