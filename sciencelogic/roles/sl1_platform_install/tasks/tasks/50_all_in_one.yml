---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_install/50_all_in_one']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_install_50_all_in_one_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_install/50_all_in_one | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_install_50_all_in_one_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_install_50_all_in_one_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_install_50_all_in_one_status: "running"
    fe_sciencelogic_sl1_platform_install_50_all_in_one_preflight_passed: false
    fe_sciencelogic_sl1_platform_install_50_all_in_one_postflight_passed: false
    fe_sciencelogic_sl1_platform_install_50_all_in_one_failed_task: ""
    fe_sciencelogic_sl1_platform_install_50_all_in_one_error: ""
    fe_sciencelogic_sl1_platform_install_50_all_in_one_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_install/50_all_in_one | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_install/50_all_in_one: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_install/50_all_in_one: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_install/50_all_in_one: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_install/50_all_in_one: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_50_all_in_one_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create SL1 installation configuration file
      ansible.builtin.template:
        src: install_config_aio.j2
        dest: "{{ artifacts_dir }}/sl1_install_config.conf"
        mode: '0600'
      when: not dry_run

    - name: Run SL1 All-In-One installer
      ansible.builtin.shell: |
        {{ sl1_package_path }} --unattended \
          --config {{ artifacts_dir }}/sl1_install_config.conf \
          --accept-eula \
          --install-type all-in-one \
          --hostname {{ sl1_aio.hostname }} \
          --ip-address {{ sl1_aio.ip_address }} \
          --netmask {{ sl1_aio.netmask }} \
          --gateway {{ sl1_aio.gateway }} \
          --dns {{ sl1_aio.dns_servers | join(',') }} \
          --admin-password {{ sl1_setup_wizard.admin_password }} \
          --db-root-password {{ sl1_db_server.root_password }} \
          --log-file {{ artifacts_dir }}/sl1_install.log
      args:
        creates: /opt/em7/em7.version
      register: sl1_install_result
      when: not dry_run
      notify: Restart SL1 services

    - name: Wait for SL1 services to start
      ansible.builtin.wait_for:
        port: 443
        host: "{{ sl1_aio.ip_address }}"
        timeout: 600
        delay: 30
      when: not dry_run

    - name: Check SL1 installation status
      ansible.builtin.shell: /opt/em7/bin/em7_status.sh
      register: sl1_status
      changed_when: false
      when: not dry_run

    - name: Display installation status
      ansible.builtin.debug:
        var: sl1_status.stdout_lines
      when: not dry_run

    - name: Save installation log
      ansible.builtin.fetch:
        src: "{{ artifacts_dir }}/sl1_install.log"
        dest: "{{ artifacts_dir }}/install_logs/"
        flat: false
      when: not dry_run

    - name: AIO installation summary
      ansible.builtin.debug:
        msg:
          - "SL1 All-In-One installation completed"
          - "Access URL: https://{{ sl1_aio.hostname }}"
          - "Admin User: {{ sl1_setup_wizard.admin_user }}"
          - "Version: {{ sl1_version }}"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_install_50_all_in_one_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_install_50_all_in_one_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_install/50_all_in_one: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_install_50_all_in_one_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_install_50_all_in_one_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_install/50_all_in_one: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_50_all_in_one_postflight_passed: true
        fe_sciencelogic_sl1_platform_install_50_all_in_one_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_50_all_in_one_status: "failed"
        fe_sciencelogic_sl1_platform_install_50_all_in_one_postflight_passed: false
        fe_sciencelogic_sl1_platform_install_50_all_in_one_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_install_50_all_in_one_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_install/50_all_in_one: FAILED at '{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_install_50_all_in_one_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_install/50_all_in_one failed at '{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_failed_task }}': {{ fe_sciencelogic_sl1_platform_install_50_all_in_one_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_50_all_in_one_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_install_50_all_in_one_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_install_50_all_in_one_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_install/50_all_in_one":
              component: "sciencelogic/sl1_platform_install/50_all_in_one"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_install_50_all_in_one_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_install_50_all_in_one_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_install_50_all_in_one_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_install_50_all_in_one_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_install/50_all_in_one'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_install/50_all_in_one | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_install_50_all_in_one_stats_published: true
      tags:
        - always
