---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_perf_intervals role
      ansible.builtin.include_role:
        name: sl1_perf_intervals

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_perf_intervals_preflight_passed | bool
          - fe_sciencelogic_sl1_perf_intervals_postflight_passed | bool
          - fe_sciencelogic_sl1_perf_intervals_status == 'succeeded'
        fail_msg: >-
          sl1_perf_intervals did not complete cleanly:
          status={{ fe_sciencelogic_sl1_perf_intervals_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_perf_intervals_failed_task | default('') }}
        success_msg: "sl1_perf_intervals completed and the validation harness reported success."
