---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_event_policy_hygiene role
      ansible.builtin.include_role:
        name: sl1_event_policy_hygiene

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_event_policy_hygiene_preflight_passed | bool
          - fe_sciencelogic_sl1_event_policy_hygiene_postflight_passed | bool
          - fe_sciencelogic_sl1_event_policy_hygiene_status == 'succeeded'
        fail_msg: >-
          sl1_event_policy_hygiene did not complete cleanly:
          status={{ fe_sciencelogic_sl1_event_policy_hygiene_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_event_policy_hygiene_failed_task | default('') }}
        success_msg: "sl1_event_policy_hygiene completed and the validation harness reported success."
