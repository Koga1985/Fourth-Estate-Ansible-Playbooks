---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_powerflow_ops role
      ansible.builtin.include_role:
        name: sl1_powerflow_ops

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_powerflow_ops_preflight_passed | bool
          - fe_sciencelogic_sl1_powerflow_ops_postflight_passed | bool
          - fe_sciencelogic_sl1_powerflow_ops_status == 'succeeded'
        fail_msg: >-
          sl1_powerflow_ops did not complete cleanly:
          status={{ fe_sciencelogic_sl1_powerflow_ops_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_powerflow_ops_failed_task | default('') }}
        success_msg: "sl1_powerflow_ops completed and the validation harness reported success."
