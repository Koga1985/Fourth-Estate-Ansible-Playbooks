---
# Delegated scenario: the role runs against the control node, so this works on
# any runner with no container or VM. Only roles that make no system changes
# are onboarded here -- see docs/TESTING.md for the selection rule.
driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: localhost
provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: default
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
scenario:
  # Nothing to create or destroy, so the sequence is the part that has value:
  # syntax proves the role parses, converge proves it runs, and idempotence
  # proves a second run reports no changes.
  test_sequence:
    - syntax
    - converge
    - idempotence
