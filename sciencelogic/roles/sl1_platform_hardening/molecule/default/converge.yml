---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_platform_hardening role
      ansible.builtin.include_role:
        name: sl1_platform_hardening

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_hardening_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_hardening_postflight_passed | bool
          - fe_sciencelogic_sl1_platform_hardening_status == 'succeeded'
        fail_msg: >-
          sl1_platform_hardening did not complete cleanly:
          status={{ fe_sciencelogic_sl1_platform_hardening_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_platform_hardening_failed_task | default('') }}
        success_msg: "sl1_platform_hardening completed and the validation harness reported success."
