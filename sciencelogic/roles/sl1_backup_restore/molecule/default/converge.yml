---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_backup_restore role
      ansible.builtin.include_role:
        name: sl1_backup_restore

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_backup_restore_preflight_passed | bool
          - fe_sciencelogic_sl1_backup_restore_postflight_passed | bool
          - fe_sciencelogic_sl1_backup_restore_status == 'succeeded'
        fail_msg: >-
          sl1_backup_restore did not complete cleanly:
          status={{ fe_sciencelogic_sl1_backup_restore_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_backup_restore_failed_task | default('') }}
        success_msg: "sl1_backup_restore completed and the validation harness reported success."
