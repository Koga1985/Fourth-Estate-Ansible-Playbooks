---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_server_baseline role
      ansible.builtin.include_role:
        name: sl1_server_baseline

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_server_baseline_preflight_passed | bool
          - fe_sciencelogic_sl1_server_baseline_postflight_passed | bool
          - fe_sciencelogic_sl1_server_baseline_status == 'succeeded'
        fail_msg: >-
          sl1_server_baseline did not complete cleanly:
          status={{ fe_sciencelogic_sl1_server_baseline_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_server_baseline_failed_task | default('') }}
        success_msg: "sl1_server_baseline completed and the validation harness reported success."
