---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_kubernetes_observability role
      ansible.builtin.include_role:
        name: sl1_kubernetes_observability

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_kubernetes_observability_preflight_passed | bool
          - fe_sciencelogic_sl1_kubernetes_observability_postflight_passed | bool
          - fe_sciencelogic_sl1_kubernetes_observability_status == 'succeeded'
        fail_msg: >-
          sl1_kubernetes_observability did not complete cleanly:
          status={{ fe_sciencelogic_sl1_kubernetes_observability_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_kubernetes_observability_failed_task | default('') }}
        success_msg: "sl1_kubernetes_observability completed and the validation harness reported success."
