---
# No-op: this scenario runs against the control node, so there is no instance
# to destroy. Present so 'molecule test' completes without missing-playbook
# warnings.
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Nothing to destroy for a delegated scenario
      ansible.builtin.debug:
        msg: "No managed instance; nothing to destroy."
