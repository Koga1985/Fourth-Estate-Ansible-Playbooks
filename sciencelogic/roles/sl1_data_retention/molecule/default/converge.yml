---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_data_retention role
      ansible.builtin.include_role:
        name: sl1_data_retention

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_data_retention_preflight_passed | bool
          - fe_sciencelogic_sl1_data_retention_postflight_passed | bool
          - fe_sciencelogic_sl1_data_retention_status == 'succeeded'
        fail_msg: >-
          sl1_data_retention did not complete cleanly:
          status={{ fe_sciencelogic_sl1_data_retention_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_data_retention_failed_task | default('') }}
        success_msg: "sl1_data_retention completed and the validation harness reported success."
