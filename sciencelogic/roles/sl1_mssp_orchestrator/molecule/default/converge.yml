---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_mssp_orchestrator role
      ansible.builtin.include_role:
        name: sl1_mssp_orchestrator

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_mssp_orchestrator_preflight_passed | bool
          - fe_sciencelogic_sl1_mssp_orchestrator_postflight_passed | bool
          - fe_sciencelogic_sl1_mssp_orchestrator_status == 'succeeded'
        fail_msg: >-
          sl1_mssp_orchestrator did not complete cleanly:
          status={{ fe_sciencelogic_sl1_mssp_orchestrator_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_mssp_orchestrator_failed_task | default('') }}
        success_msg: "sl1_mssp_orchestrator completed and the validation harness reported success."
