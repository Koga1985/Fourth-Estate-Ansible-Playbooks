---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_governance_pack role
      ansible.builtin.include_role:
        name: sl1_governance_pack

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_governance_pack_preflight_passed | bool
          - fe_sciencelogic_sl1_governance_pack_postflight_passed | bool
          - fe_sciencelogic_sl1_governance_pack_status == 'succeeded'
        fail_msg: >-
          sl1_governance_pack did not complete cleanly:
          status={{ fe_sciencelogic_sl1_governance_pack_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_governance_pack_failed_task | default('') }}
        success_msg: "sl1_governance_pack completed and the validation harness reported success."
