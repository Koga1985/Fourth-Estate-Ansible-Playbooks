---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_config/10_system_settings']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_config_10_system_settings_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_config/10_system_settings | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_config_10_system_settings_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_config_10_system_settings_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_config_10_system_settings_status: "running"
    fe_sciencelogic_sl1_platform_config_10_system_settings_preflight_passed: false
    fe_sciencelogic_sl1_platform_config_10_system_settings_postflight_passed: false
    fe_sciencelogic_sl1_platform_config_10_system_settings_failed_task: ""
    fe_sciencelogic_sl1_platform_config_10_system_settings_error: ""
    fe_sciencelogic_sl1_platform_config_10_system_settings_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_config/10_system_settings | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_config/10_system_settings: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_config/10_system_settings: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_config/10_system_settings: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_config/10_system_settings: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_10_system_settings_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure system settings via API
      ansible.builtin.uri:
        url: "{{ sl1.url }}/api/system/settings"
        method: PUT
        body:
          company_name: "{{ sl1_system_settings.company_name }}"
          system_name: "{{ sl1_system_settings.system_name }}"
          session_timeout: "{{ sl1_system_settings.session_timeout }}"
          login_banner: "{{ sl1_system_settings.login_banner }}"
          enable_audit_log: "{{ sl1_system_settings.enable_audit_log }}"
          log_level: "{{ sl1_system_settings.log_level }}"
          max_concurrent_users: "{{ sl1_system_settings.max_concurrent_users }}"
        body_format: json
        headers:
          Content-Type: "application/json"
          X-EM7-API-Username: "{{ sl1.api_user }}"
          X-EM7-API-Password: "{{ sl1.api_password }}"
        validate_certs: "{{ sl1.verify_ssl }}"
        status_code: [200, 201]
      register: system_settings_result
      when: not dry_run

    - name: Configure password policy
      ansible.builtin.uri:
        url: "{{ sl1.url }}/api/account/password_policy"
        method: PUT
        body: "{{ sl1_system_settings.password_policy }}"
        body_format: json
        headers:
          Content-Type: "application/json"
          X-EM7-API-Username: "{{ sl1.api_user }}"
          X-EM7-API-Password: "{{ sl1.api_password }}"
        validate_certs: "{{ sl1.verify_ssl }}"
        status_code: [200, 201]
      when: not dry_run

    - name: System settings configuration summary
      ansible.builtin.debug:
        msg:
          - "System settings configured"
          - "Company: {{ sl1_system_settings.company_name }}"
          - "Session Timeout: {{ sl1_system_settings.session_timeout }} minutes"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_config_10_system_settings_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_config_10_system_settings_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_config/10_system_settings: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_config_10_system_settings_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_config_10_system_settings_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_config/10_system_settings: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_10_system_settings_postflight_passed: true
        fe_sciencelogic_sl1_platform_config_10_system_settings_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_10_system_settings_status: "failed"
        fe_sciencelogic_sl1_platform_config_10_system_settings_postflight_passed: false
        fe_sciencelogic_sl1_platform_config_10_system_settings_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_config_10_system_settings_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_config/10_system_settings: FAILED at '{{ fe_sciencelogic_sl1_platform_config_10_system_settings_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_config_10_system_settings_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_config/10_system_settings failed at '{{ fe_sciencelogic_sl1_platform_config_10_system_settings_failed_task }}': {{ fe_sciencelogic_sl1_platform_config_10_system_settings_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_10_system_settings_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_config_10_system_settings_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_config_10_system_settings_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_config/10_system_settings":
              component: "sciencelogic/sl1_platform_config/10_system_settings"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_config_10_system_settings_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_config_10_system_settings_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_config_10_system_settings_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_config_10_system_settings_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_config/10_system_settings'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_config/10_system_settings | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_10_system_settings_stats_published: true
      tags:
        - always
