---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_platform_config/20_smtp_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_platform_config_20_smtp_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_platform_config/20_smtp_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_platform_config_20_smtp_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_platform_config_20_smtp_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_platform_config_20_smtp_config_status: "running"
    fe_sciencelogic_sl1_platform_config_20_smtp_config_preflight_passed: false
    fe_sciencelogic_sl1_platform_config_20_smtp_config_postflight_passed: false
    fe_sciencelogic_sl1_platform_config_20_smtp_config_failed_task: ""
    fe_sciencelogic_sl1_platform_config_20_smtp_config_error: ""
    fe_sciencelogic_sl1_platform_config_20_smtp_config_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_platform_config/20_smtp_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_platform_config/20_smtp_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_platform_config/20_smtp_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_platform_config/20_smtp_config: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_platform_config/20_smtp_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_20_smtp_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure SMTP server
      ansible.builtin.uri:
        url: "{{ sl1.url }}/api/system/smtp"
        method: PUT
        body:
          server: "{{ sl1_smtp.server }}"
          port: "{{ sl1_smtp.port }}"
          use_tls: "{{ sl1_smtp.use_tls }}"
          use_auth: "{{ sl1_smtp.use_auth }}"
          username: "{{ sl1_smtp.username }}"
          password: "{{ sl1_smtp.password }}"
          from_address: "{{ sl1_smtp.from_address }}"
          from_name: "{{ sl1_smtp.from_name }}"
        body_format: json
        headers:
          Content-Type: "application/json"
          X-EM7-API-Username: "{{ sl1.api_user }}"
          X-EM7-API-Password: "{{ sl1.api_password }}"
        validate_certs: "{{ sl1.verify_ssl }}"
        status_code: [200, 201]
      no_log: true
      when: not dry_run

    - name: Test SMTP configuration
      ansible.builtin.uri:
        url: "{{ sl1.url }}/api/system/smtp/test"
        method: POST
        body:
          recipient: "{{ sl1_smtp.test_email }}"
          subject: "SL1 SMTP Test"
          message: "This is a test email from SL1 SMTP configuration"
        body_format: json
        headers:
          Content-Type: "application/json"
          X-EM7-API-Username: "{{ sl1.api_user }}"
          X-EM7-API-Password: "{{ sl1.api_password }}"
        validate_certs: "{{ sl1.verify_ssl }}"
        status_code: [200, 201]
      register: smtp_test_result
      when: not dry_run

    - name: SMTP configuration summary
      ansible.builtin.debug:
        msg:
          - "SMTP configured successfully"
          - "Server: {{ sl1_smtp.server }}:{{ sl1_smtp.port }}"
          - "Test email sent to: {{ sl1_smtp.test_email }}"

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_platform_config_20_smtp_config_preflight_passed | bool
          - fe_sciencelogic_sl1_platform_config_20_smtp_config_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_platform_config/20_smtp_config: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_platform_config_20_smtp_config_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_platform_config_20_smtp_config_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_platform_config/20_smtp_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_20_smtp_config_postflight_passed: true
        fe_sciencelogic_sl1_platform_config_20_smtp_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_20_smtp_config_status: "failed"
        fe_sciencelogic_sl1_platform_config_20_smtp_config_postflight_passed: false
        fe_sciencelogic_sl1_platform_config_20_smtp_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_platform_config_20_smtp_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_platform_config/20_smtp_config: FAILED at '{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_platform_config_20_smtp_config_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_platform_config/20_smtp_config failed at '{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_failed_task }}': {{ fe_sciencelogic_sl1_platform_config_20_smtp_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_20_smtp_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_platform_config_20_smtp_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_platform_config_20_smtp_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_platform_config/20_smtp_config":
              component: "sciencelogic/sl1_platform_config/20_smtp_config"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_platform_config_20_smtp_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_platform_config_20_smtp_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_platform_config_20_smtp_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_platform_config_20_smtp_config_status | default('') == 'succeeded' else ['sciencelogic/sl1_platform_config/20_smtp_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_platform_config/20_smtp_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_platform_config_20_smtp_config_stats_published: true
      tags:
        - always
