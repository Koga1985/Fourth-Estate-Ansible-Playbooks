---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_upgrade_window role
      ansible.builtin.include_role:
        name: sl1_upgrade_window

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_upgrade_window_preflight_passed | bool
          - fe_sciencelogic_sl1_upgrade_window_postflight_passed | bool
          - fe_sciencelogic_sl1_upgrade_window_status == 'succeeded'
        fail_msg: >-
          sl1_upgrade_window did not complete cleanly:
          status={{ fe_sciencelogic_sl1_upgrade_window_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_upgrade_window_failed_task | default('') }}
        success_msg: "sl1_upgrade_window completed and the validation harness reported success."
