---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sciencelogic/sl1_coverage_hygiene/20_fix']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sciencelogic_sl1_coverage_hygiene_20_fix_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sciencelogic/sl1_coverage_hygiene/20_fix | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_status: "running"
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_preflight_passed: false
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_postflight_passed: false
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_failed_task: ""
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_error: ""
    fe_sciencelogic_sl1_coverage_hygiene_20_fix_stats_published: false
  tags:
    - always

- name: "sciencelogic/sl1_coverage_hygiene/20_fix | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sciencelogic/sl1_coverage_hygiene/20_fix: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sciencelogic/sl1_coverage_hygiene/20_fix: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sciencelogic/sl1_coverage_hygiene/20_fix: required variable '{{ item }}' is not defined."
        success_msg: "sciencelogic/sl1_coverage_hygiene/20_fix: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Remediation plan
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/coverage_remediation_plan.json"
        mode: "0644"
        content: "{{ remediation | to_nice_json }}"
    - name: Guard auto-remediate
      ansible.builtin.assert:
        that: [ not auto_remediate | bool ]
        fail_msg: "Set auto_remediate=true only after reviewing the plan."

    # ----------------------------- postflight -------------------

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_coverage_hygiene_20_fix_preflight_passed | bool
          - fe_sciencelogic_sl1_coverage_hygiene_20_fix_status in ['running', 'succeeded']
        fail_msg: >-
          sciencelogic/sl1_coverage_hygiene/20_fix: postflight validation failed - preflight passed
          ={{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_preflight_passed | default(false) }},
          status={{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_status | default('unknown') }}.
        success_msg: "sciencelogic/sl1_coverage_hygiene/20_fix: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_postflight_passed: true
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_status: "failed"
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_postflight_passed: false
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sciencelogic/sl1_coverage_hygiene/20_fix: FAILED at '{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_error }}
      tags:
        - always
        - rescue

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sciencelogic/sl1_coverage_hygiene/20_fix failed at '{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_failed_task }}': {{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sciencelogic_sl1_coverage_hygiene_20_fix_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sciencelogic/sl1_coverage_hygiene/20_fix":
              component: "sciencelogic/sl1_coverage_hygiene/20_fix"
              type: "role-tasks"
              platform: "sciencelogic"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_status | default('unknown') }}"
              preflight_passed: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_started_at | default('') }}"
              ended_at: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_ended_at | default('') }}"
              duration_seconds: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_failed_task | default('') }}"
              error: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sciencelogic_sl1_coverage_hygiene_20_fix_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sciencelogic_sl1_coverage_hygiene_20_fix_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sciencelogic_sl1_coverage_hygiene_20_fix_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sciencelogic_sl1_coverage_hygiene_20_fix_status | default('') == 'succeeded' else ['sciencelogic/sl1_coverage_hygiene/20_fix'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sciencelogic/sl1_coverage_hygiene/20_fix | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sciencelogic_sl1_coverage_hygiene_20_fix_stats_published: true
      tags:
        - always
