---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_rba_runbooks role
      ansible.builtin.include_role:
        name: sl1_rba_runbooks

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_rba_runbooks_preflight_passed | bool
          - fe_sciencelogic_sl1_rba_runbooks_postflight_passed | bool
          - fe_sciencelogic_sl1_rba_runbooks_status == 'succeeded'
        fail_msg: >-
          sl1_rba_runbooks did not complete cleanly:
          status={{ fe_sciencelogic_sl1_rba_runbooks_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_rba_runbooks_failed_task | default('') }}
        success_msg: "sl1_rba_runbooks completed and the validation harness reported success."
