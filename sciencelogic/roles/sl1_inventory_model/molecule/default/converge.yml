---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_inventory_model role
      ansible.builtin.include_role:
        name: sl1_inventory_model

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_inventory_model_preflight_passed | bool
          - fe_sciencelogic_sl1_inventory_model_postflight_passed | bool
          - fe_sciencelogic_sl1_inventory_model_status == 'succeeded'
        fail_msg: >-
          sl1_inventory_model did not complete cleanly:
          status={{ fe_sciencelogic_sl1_inventory_model_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_inventory_model_failed_task | default('') }}
        success_msg: "sl1_inventory_model completed and the validation harness reported success."
