---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the sl1_dashboard_catalog role
      ansible.builtin.include_role:
        name: sl1_dashboard_catalog

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_sciencelogic_sl1_dashboard_catalog_preflight_passed | bool
          - fe_sciencelogic_sl1_dashboard_catalog_postflight_passed | bool
          - fe_sciencelogic_sl1_dashboard_catalog_status == 'succeeded'
        fail_msg: >-
          sl1_dashboard_catalog did not complete cleanly:
          status={{ fe_sciencelogic_sl1_dashboard_catalog_status | default('unset') }}
          failed_task={{ fe_sciencelogic_sl1_dashboard_catalog_failed_task | default('') }}
        success_msg: "sl1_dashboard_catalog completed and the validation harness reported success."
