---
# Fortinet Deployment Playbook
# Entry point for FortiGate firewall automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: FortiGate Configuration
  hosts: fortigate
  gather_facts: false
  any_errors_fatal: true

  vars:
    deploy_system: true
    deploy_interfaces: true

  tasks:
    - name: "fortinet/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - System Configuration
          ansible.builtin.include_role:
            name: fortigate_system_config
          when: deploy_system | bool
          tags: ['system', 'phase1']

        - name: Phase 2 - Interface Configuration
          ansible.builtin.include_role:
            name: fortigate_interfaces
          when: deploy_interfaces | bool
          tags: ['interfaces', 'phase2']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== FortiGate Deployment Complete ==="
              - "HA Mode: {{ fortios_ha_mode | default('a-p') }}"
          tags: ['always']

        - name: "fortinet/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "fortinet/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_fortinet_site_status: "failed"
            fe_fortinet_site_postflight_passed: false
            fe_fortinet_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_fortinet_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "fortinet/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              fortinet/site: FAILED at '{{ fe_fortinet_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_fortinet_site_error }}
          tags:
            - always
            - rescue

        - name: "fortinet/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              fortinet/site failed at '{{ fe_fortinet_site_failed_task }}': {{ fe_fortinet_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "fortinet/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_fortinet_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_fortinet_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_fortinet_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "fortinet/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "fortinet/site":
                  component: "fortinet/site"
                  type: "playbook"
                  platform: "fortinet"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_fortinet_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_fortinet_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_fortinet_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_fortinet_site_started_at | default('') }}"
                  ended_at: "{{ fe_fortinet_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_fortinet_site_failed_task | default('') }}"
                  error: "{{ fe_fortinet_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_fortinet_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_fortinet_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_fortinet_site_status | default('') == 'succeeded' else ['fortinet/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_fortinet_site_status | default('') == 'failed'
            - not (fe_fortinet_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "fortinet/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_fortinet_site_stats_published: true
          when:
            - fe_fortinet_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "fortinet/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "fortinet/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_fortinet_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_fortinet_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_fortinet_site_status: "running"
            fe_fortinet_site_preflight_passed: false
            fe_fortinet_site_postflight_passed: false
            fe_fortinet_site_failed_task: ""
            fe_fortinet_site_error: ""
            fe_fortinet_site_stats_published: false
          tags:
            - always

        - name: "fortinet/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              fortinet/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              fortinet/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "fortinet/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "fortinet/site: required variable '{{ item }}' is not defined."
            success_msg: "fortinet/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_fortinet_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "fortinet/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_fortinet_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "fortinet/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_fortinet_site_status: "preflight_failed"
            fe_fortinet_site_postflight_passed: false
            fe_fortinet_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_fortinet_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "fortinet/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              fortinet/site: FAILED at '{{ fe_fortinet_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_fortinet_site_error }}
          tags:
            - always
            - rescue

        - name: "fortinet/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "fortinet/site":
                  component: "fortinet/site"
                  type: "playbook"
                  platform: "fortinet"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_fortinet_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_fortinet_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_fortinet_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_fortinet_site_started_at | default('') }}"
                  ended_at: "{{ fe_fortinet_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_fortinet_site_failed_task | default('') }}"
                  error: "{{ fe_fortinet_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_fortinet_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_fortinet_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_fortinet_site_status | default('') == 'succeeded' else ['fortinet/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "fortinet/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_fortinet_site_stats_published: true
          tags:
            - always

        - name: "fortinet/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              fortinet/site failed at '{{ fe_fortinet_site_failed_task }}': {{ fe_fortinet_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "fortinet/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              fortinet/site: preflight
              {{ 'passed' if fe_fortinet_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "fortinet/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "fortinet/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_fortinet_site_preflight_passed | bool
              - fe_fortinet_site_status in ['running', 'succeeded']
            fail_msg: >-
              fortinet/site: postflight validation failed - preflight passed
              ={{ fe_fortinet_site_preflight_passed | default(false) }},
              status={{ fe_fortinet_site_status | default('unknown') }}.
            success_msg: "fortinet/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "fortinet/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_fortinet_site_postflight_passed: true
            fe_fortinet_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "fortinet/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_fortinet_site_status: "failed"
            fe_fortinet_site_postflight_passed: false
            fe_fortinet_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_fortinet_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "fortinet/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              fortinet/site: FAILED at '{{ fe_fortinet_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_fortinet_site_error }}
          tags:
            - always
            - rescue

        - name: "fortinet/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              fortinet/site failed at '{{ fe_fortinet_site_failed_task }}': {{ fe_fortinet_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "fortinet/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_fortinet_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_fortinet_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_fortinet_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "fortinet/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "fortinet/site":
                  component: "fortinet/site"
                  type: "playbook"
                  platform: "fortinet"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_fortinet_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_fortinet_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_fortinet_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_fortinet_site_started_at | default('') }}"
                  ended_at: "{{ fe_fortinet_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_fortinet_site_failed_task | default('') }}"
                  error: "{{ fe_fortinet_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_fortinet_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_fortinet_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_fortinet_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_fortinet_site_status | default('') == 'succeeded' else ['fortinet/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_fortinet_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "fortinet/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_fortinet_site_stats_published: true
          tags:
            - always

        - name: "fortinet/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              fortinet/site: {{ fe_fortinet_site_status | default('unknown') }} in
              {{ fe_fortinet_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
