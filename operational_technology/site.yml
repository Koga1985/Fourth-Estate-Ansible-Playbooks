---
# Operational Technology (OT) Deployment Playbook
# Entry point for OT/ICS infrastructure automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass
#
# Tags:
#   - inventory: Asset inventory
#   - network: Network configuration
#   - security: Security hardening
#   - backup: Backup operations
#   - compliance: Compliance checks
#   - patching: Windows HMI patching

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: OT Infrastructure - Pre-Flight Checks
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: "operational_technology/site#play1 | Guarded execution with rescue and always handling"
      block:

        - name: Check for emergency freeze
          ansible.builtin.fail:
            msg: "EMERGENCY FREEZE ACTIVE - All OT changes are halted. Set ot_emergency_freeze=false to proceed."
          when: ot_emergency_freeze | default(false) | bool
          tags: ['always']

        - name: Verify change window
          ansible.builtin.include_role:
            name: ot_change_window_guard
          when: ot_change_window_enabled | default(true) | bool
          tags: ['always']

      rescue:

        - name: "operational_technology/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_status: "failed"
            fe_operational_technology_site_play1_postflight_passed: false
            fe_operational_technology_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_operational_technology_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              operational_technology/site#play1: FAILED at '{{ fe_operational_technology_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_operational_technology_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              operational_technology/site#play1 failed at '{{ fe_operational_technology_site_play1_failed_task }}': {{ fe_operational_technology_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "operational_technology/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_operational_technology_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "operational_technology/site#play1":
                  component: "operational_technology/site#play1"
                  type: "playbook"
                  platform: "operational_technology"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_operational_technology_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_operational_technology_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_operational_technology_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_operational_technology_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_operational_technology_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_operational_technology_site_play1_failed_task | default('') }}"
                  error: "{{ fe_operational_technology_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_operational_technology_site_play1_status | default('') == 'succeeded' else ['operational_technology/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - fe_operational_technology_site_play1_status | default('') == 'failed'
            - not (fe_operational_technology_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_stats_published: true
          when:
            - fe_operational_technology_site_play1_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "operational_technology/site#play1 | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "operational_technology/site#play1 | Initialize validation state"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_operational_technology_site_play1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_operational_technology_site_play1_status: "running"
            fe_operational_technology_site_play1_preflight_passed: false
            fe_operational_technology_site_play1_postflight_passed: false
            fe_operational_technology_site_play1_failed_task: ""
            fe_operational_technology_site_play1_error: ""
            fe_operational_technology_site_play1_stats_published: false
          tags:
            - always

        - name: "operational_technology/site#play1 | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              operational_technology/site#play1: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              operational_technology/site#play1: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "operational_technology/site#play1 | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "operational_technology/site#play1: required variable '{{ item }}' is not defined."
            success_msg: "operational_technology/site#play1: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_operational_technology_site_play1_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "operational_technology/site#play1 | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "operational_technology/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_status: "preflight_failed"
            fe_operational_technology_site_play1_postflight_passed: false
            fe_operational_technology_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_operational_technology_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              operational_technology/site#play1: FAILED at '{{ fe_operational_technology_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_operational_technology_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "operational_technology/site#play1":
                  component: "operational_technology/site#play1"
                  type: "playbook"
                  platform: "operational_technology"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_operational_technology_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_operational_technology_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_operational_technology_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_operational_technology_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_operational_technology_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_operational_technology_site_play1_failed_task | default('') }}"
                  error: "{{ fe_operational_technology_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_operational_technology_site_play1_status | default('') == 'succeeded' else ['operational_technology/site#play1'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_stats_published: true
          tags:
            - always

        - name: "operational_technology/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              operational_technology/site#play1 failed at '{{ fe_operational_technology_site_play1_failed_task }}': {{ fe_operational_technology_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "operational_technology/site#play1 | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              operational_technology/site#play1: preflight
              {{ 'passed' if fe_operational_technology_site_play1_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "operational_technology/site#play1 | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "operational_technology/site#play1 | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_operational_technology_site_play1_preflight_passed | bool
              - fe_operational_technology_site_play1_status in ['running', 'succeeded']
            fail_msg: >-
              operational_technology/site#play1: postflight validation failed - preflight passed
              ={{ fe_operational_technology_site_play1_preflight_passed | default(false) }},
              status={{ fe_operational_technology_site_play1_status | default('unknown') }}.
            success_msg: "operational_technology/site#play1: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "operational_technology/site#play1 | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_postflight_passed: true
            fe_operational_technology_site_play1_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "operational_technology/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_status: "failed"
            fe_operational_technology_site_play1_postflight_passed: false
            fe_operational_technology_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_operational_technology_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              operational_technology/site#play1: FAILED at '{{ fe_operational_technology_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_operational_technology_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "operational_technology/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              operational_technology/site#play1 failed at '{{ fe_operational_technology_site_play1_failed_task }}': {{ fe_operational_technology_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "operational_technology/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_operational_technology_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "operational_technology/site#play1":
                  component: "operational_technology/site#play1"
                  type: "playbook"
                  platform: "operational_technology"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_operational_technology_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_operational_technology_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_operational_technology_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_operational_technology_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_operational_technology_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_operational_technology_site_play1_failed_task | default('') }}"
                  error: "{{ fe_operational_technology_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_operational_technology_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_operational_technology_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_operational_technology_site_play1_status | default('') == 'succeeded' else ['operational_technology/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_operational_technology_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_operational_technology_site_play1_stats_published: true
          tags:
            - always

        - name: "operational_technology/site#play1 | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              operational_technology/site#play1: {{ fe_operational_technology_site_play1_status | default('unknown') }} in
              {{ fe_operational_technology_site_play1_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always


- name: OT Zone Model & Inventory
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    deploy_zone_model: true
    deploy_inventory: true
    deploy_topology: true

  tasks:
    # =========================================
    # Phase 1: Zone Model
    # =========================================
    - name: "operational_technology/site#play2 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Zone Model Definition
          ansible.builtin.include_role:
            name: ot_zone_model
          when: deploy_zone_model | bool
          tags: ['zones', 'phase1']

        # =========================================
        # Phase 2: Asset Inventory
        # =========================================
        - name: Phase 2 - Inventory Model
          ansible.builtin.include_role:
            name: ot_inventory_model
          when: deploy_inventory | bool
          tags: ['inventory', 'phase2']

        - name: Phase 2 - Asset Lifecycle
          ansible.builtin.include_role:
            name: ot_asset_lifecycle
          when: deploy_inventory | bool
          tags: ['inventory', 'phase2']

        - name: Phase 2 - Firmware Register
          ansible.builtin.include_role:
            name: ot_firmware_register
          when: deploy_inventory | bool
          tags: ['inventory', 'firmware', 'phase2']

        # =========================================
        # Phase 3: Network Topology
        # =========================================
        - name: Phase 3 - Topology Baseline
          ansible.builtin.include_role:
            name: ot_topology_baseline
          when: deploy_topology | bool
          tags: ['topology', 'phase3']

      rescue:

        - name: "operational_technology/site#play2 | Rescue | Capture the failing task and error detail"
