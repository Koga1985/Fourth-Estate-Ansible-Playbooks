---
# Open ServiceNow/Jira tasks per item.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_vuln__tickets_create']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_vuln__tickets_create_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_vuln__tickets_create | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_vuln__tickets_create_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_vuln__tickets_create_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_vuln__tickets_create_status: "running"
    fe_operational_technology_ot_vuln__tickets_create_preflight_passed: false
    fe_operational_technology_ot_vuln__tickets_create_postflight_passed: false
    fe_operational_technology_ot_vuln__tickets_create_failed_task: ""
    fe_operational_technology_ot_vuln__tickets_create_error: ""
    fe_operational_technology_ot_vuln__tickets_create_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_vuln__tickets_create | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_vuln__tickets_create | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_vuln__tickets_create: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_vuln__tickets_create: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_vuln__tickets_create | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_vuln__tickets_create: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_vuln__tickets_create: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_vuln__tickets_create_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_vuln__tickets_create | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_vuln__tickets_create_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/ot-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Load worklist
      ansible.builtin.slurp:
        src: "{{ artifacts_dir }}/vuln_worklist.csv"
      register: _wl

    - name: Open tickets (ServiceNow example)
      when: itsm.type | default('servicenow') == 'servicenow'
      ansible.builtin.uri:
        url: "{{ itsm.url }}/api/now/table/{{ itsm.table | default('incident') }}"
        method: POST
        force_basic_auth: true
        url_username: "{{ itsm.user }}"
        url_password: "{{ itsm.token }}"
        headers: { "Content-Type": "application/json" }
        body_format: json
        body: "{{ item }}"
        status_code: 200,201,409
      loop: "{{ vuln_ticket_payloads | default([]) }}"
      loop_control: { label: "{{ item.short_description | default(item.id) }}" }

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_vuln__tickets_create | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_vuln__tickets_create_preflight_passed | bool
          - fe_operational_technology_ot_vuln__tickets_create_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_vuln__tickets_create: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_vuln__tickets_create_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_vuln__tickets_create_status | default('unknown') }}.
        success_msg: "operational_technology/ot_vuln__tickets_create: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_vuln__tickets_create | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_vuln__tickets_create_postflight_passed: true
        fe_operational_technology_ot_vuln__tickets_create_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_vuln__tickets_create | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_vuln__tickets_create_status: "failed"
        fe_operational_technology_ot_vuln__tickets_create_postflight_passed: false
        fe_operational_technology_ot_vuln__tickets_create_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_vuln__tickets_create_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_vuln__tickets_create | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_vuln__tickets_create: FAILED at '{{ fe_operational_technology_ot_vuln__tickets_create_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_vuln__tickets_create_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_vuln__tickets_create | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_vuln__tickets_create failed at '{{ fe_operational_technology_ot_vuln__tickets_create_failed_task }}': {{ fe_operational_technology_ot_vuln__tickets_create_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_vuln__tickets_create | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_vuln__tickets_create_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_vuln__tickets_create_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_vuln__tickets_create_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_vuln__tickets_create | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_vuln__tickets_create":
              component: "operational_technology/ot_vuln__tickets_create"
              type: "tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_vuln__tickets_create_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_vuln__tickets_create_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_vuln__tickets_create_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_vuln__tickets_create_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_vuln__tickets_create_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_vuln__tickets_create_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_vuln__tickets_create_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_vuln__tickets_create_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_vuln__tickets_create_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_vuln__tickets_create_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_vuln__tickets_create_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_vuln__tickets_create_status | default('') == 'succeeded' else ['operational_technology/ot_vuln__tickets_create'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_vuln__tickets_create | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_vuln__tickets_create_stats_published: true
      tags:
        - always
