---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_remote_access_bastion role
      ansible.builtin.include_role:
        name: ot_remote_access_bastion

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_remote_access_bastion_preflight_passed | bool
          - fe_operational_technology_ot_remote_access_bastion_postflight_passed | bool
          - fe_operational_technology_ot_remote_access_bastion_status == 'succeeded'
        fail_msg: >-
          ot_remote_access_bastion did not complete cleanly:
          status={{ fe_operational_technology_ot_remote_access_bastion_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_remote_access_bastion_failed_task | default('') }}
        success_msg: "ot_remote_access_bastion completed and the validation harness reported success."
