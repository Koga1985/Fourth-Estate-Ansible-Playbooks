---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_metrics_reporting role
      ansible.builtin.include_role:
        name: ot_metrics_reporting

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_metrics_reporting_preflight_passed | bool
          - fe_operational_technology_ot_metrics_reporting_postflight_passed | bool
          - fe_operational_technology_ot_metrics_reporting_status == 'succeeded'
        fail_msg: >-
          ot_metrics_reporting did not complete cleanly:
          status={{ fe_operational_technology_ot_metrics_reporting_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_metrics_reporting_failed_task | default('') }}
        success_msg: "ot_metrics_reporting completed and the validation harness reported success."
