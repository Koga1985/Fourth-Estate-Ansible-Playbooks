---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_firewall_policy_panos role
      ansible.builtin.include_role:
        name: ot_firewall_policy_panos

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_firewall_policy_panos_preflight_passed | bool
          - fe_operational_technology_ot_firewall_policy_panos_postflight_passed | bool
          - fe_operational_technology_ot_firewall_policy_panos_status == 'succeeded'
        fail_msg: >-
          ot_firewall_policy_panos did not complete cleanly:
          status={{ fe_operational_technology_ot_firewall_policy_panos_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_firewall_policy_panos_failed_task | default('') }}
        success_msg: "ot_firewall_policy_panos completed and the validation harness reported success."
