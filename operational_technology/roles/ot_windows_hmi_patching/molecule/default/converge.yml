---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_windows_hmi_patching role
      ansible.builtin.include_role:
        name: ot_windows_hmi_patching

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_windows_hmi_patching_preflight_passed | bool
          - fe_operational_technology_ot_windows_hmi_patching_postflight_passed | bool
          - fe_operational_technology_ot_windows_hmi_patching_status == 'succeeded'
        fail_msg: >-
          ot_windows_hmi_patching did not complete cleanly:
          status={{ fe_operational_technology_ot_windows_hmi_patching_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_windows_hmi_patching_failed_task | default('') }}
        success_msg: "ot_windows_hmi_patching completed and the validation harness reported success."
