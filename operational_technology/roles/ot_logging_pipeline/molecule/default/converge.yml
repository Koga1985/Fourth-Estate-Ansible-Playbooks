---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_logging_pipeline role
      ansible.builtin.include_role:
        name: ot_logging_pipeline

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_logging_pipeline_preflight_passed | bool
          - fe_operational_technology_ot_logging_pipeline_postflight_passed | bool
          - fe_operational_technology_ot_logging_pipeline_status == 'succeeded'
        fail_msg: >-
          ot_logging_pipeline did not complete cleanly:
          status={{ fe_operational_technology_ot_logging_pipeline_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_logging_pipeline_failed_task | default('') }}
        success_msg: "ot_logging_pipeline completed and the validation harness reported success."
