---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_nac_visibility role
      ansible.builtin.include_role:
        name: ot_nac_visibility

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_nac_visibility_preflight_passed | bool
          - fe_operational_technology_ot_nac_visibility_postflight_passed | bool
          - fe_operational_technology_ot_nac_visibility_status == 'succeeded'
        fail_msg: >-
          ot_nac_visibility did not complete cleanly:
          status={{ fe_operational_technology_ot_nac_visibility_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_nac_visibility_failed_task | default('') }}
        success_msg: "ot_nac_visibility completed and the validation harness reported success."
