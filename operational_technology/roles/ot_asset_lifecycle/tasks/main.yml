---
# OT Asset Lifecycle Management - Main Tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_status: "running"
    fe_operational_technology_ot_asset_lifecycle_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_error: ""
    fe_operational_technology_ot_asset_lifecycle_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ot_asset_api_url is defined
          - ot_asset_api_url | length > 0
          - ot_asset_operation in ['register', 'update', 'decommission', 'dispose', 'commission', 'maintain']
        fail_msg: "Required variables not properly configured"
        success_msg: "Configuration validation passed"

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
        owner: root
        group: root
      loop:
        - "{{ ot_asset_artifacts_dir }}"
        - "{{ ot_asset_log_dir }}"
        - "{{ ot_asset_backup_dir }}"
        - "{{ ot_asset_report_destination }}"

    - name: Include asset registration workflow
      ansible.builtin.include_tasks: includes/register.yml
      when: ot_asset_operation == 'register'

    - name: Include asset commissioning workflow
      ansible.builtin.include_tasks: includes/commission.yml
      when: ot_asset_operation == 'commission'

    - name: Include asset update workflow
      ansible.builtin.include_tasks: includes/update.yml
      when: ot_asset_operation == 'update'

    - name: Include maintenance scheduling workflow
      ansible.builtin.include_tasks: includes/maintenance.yml
      when: ot_asset_operation == 'maintain'

    - name: Include asset decommissioning workflow
      ansible.builtin.include_tasks: includes/decommission.yml
      when: ot_asset_operation == 'decommission'

    - name: Include asset disposal workflow
      ansible.builtin.include_tasks: includes/dispose.yml
      when: ot_asset_operation == 'dispose'

    - name: Include warranty and support tracking
      ansible.builtin.include_tasks: includes/warranty_tracking.yml
      when: ot_asset_operation in ['register', 'update']

    - name: Include end-of-life tracking
      ansible.builtin.include_tasks: includes/eol_tracking.yml
      when: ot_asset_operation in ['register', 'update']

    - name: Sync to CMDB
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id | default('') }}"
        method: "{{ 'POST' if ot_asset_operation == 'register' else 'PUT' }}"
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          asset_id: "{{ ot_asset_id }}"
          name: "{{ ot_asset_name }}"
          type: "{{ ot_asset_type }}"
          vendor: "{{ ot_asset_vendor }}"
          model: "{{ ot_asset_model }}"
          serial_number: "{{ ot_asset_serial_number }}"
          firmware_version: "{{ ot_asset_firmware_version }}"
          ip_address: "{{ ot_asset_ip_address }}"
          mac_address: "{{ ot_asset_mac_address }}"
          criticality: "{{ ot_asset_criticality }}"
          purdue_level: "{{ ot_asset_purdue_level }}"
          zone: "{{ ot_asset_zone }}"
          protocols: "{{ ot_asset_protocols }}"
          owner: "{{ ot_asset_owner }}"
          custodian: "{{ ot_asset_custodian }}"
          facility: "{{ ot_asset_facility }}"
          building: "{{ ot_asset_building }}"
          room: "{{ ot_asset_room }}"
          state: "{{ ot_asset_state }}"
          commission_date: "{{ ot_asset_commission_date }}"
          warranty_expiry: "{{ ot_asset_warranty_expiry }}"
          eol_date: "{{ ot_asset_eol_date }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        timeout: "{{ ot_asset_api_timeout }}"
        status_code: [200, 201]
      when:
        - ot_asset_cmdb_sync
        - not ot_asset_dry_run
        - ot_asset_api_token | length > 0
      register: cmdb_sync_result

    - name: Generate asset lifecycle report
      ansible.builtin.template:
        src: "asset_report.{{ ot_asset_report_format }}.j2"
        dest: "{{ ot_asset_report_destination }}/asset_{{ ot_asset_id }}_{{ ansible_date_time.iso8601_basic_short }}.{{ ot_asset_report_format }}"
        mode: '0640'
      when: ot_asset_generate_reports

    - name: Send notification to stakeholders
      ansible.builtin.debug:
        msg: |
          Asset Lifecycle Event:
          Operation: {{ ot_asset_operation }}
          Asset ID: {{ ot_asset_id }}
          Asset Name: {{ ot_asset_name }}
          Type: {{ ot_asset_type }}
          Criticality: {{ ot_asset_criticality }}
          Status: Completed
      when: ot_asset_notification_recipients | length > 0

    - name: Log asset lifecycle event
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/asset_lifecycle.log"
        line: "{{ ansible_date_time.iso8601 }} | {{ ot_asset_operation | upper }} | {{ ot_asset_id }} | {{ ot_asset_name }} | {{ ot_asset_state }}"
        create: true
        mode: '0640'

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle failed at '{{ fe_operational_technology_ot_asset_lifecycle_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle":
              component: "operational_technology/ot_asset_lifecycle"
              type: "role"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_stats_published: true
      tags:
        - always
