---
# Asset Maintenance Scheduling

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle/includes/maintenance']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_includes_maintenance_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status: "running"
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_error: ""
    fe_operational_technology_ot_asset_lifecycle_includes_maintenance_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/maintenance: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle/includes/maintenance: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle/includes/maintenance: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle/includes/maintenance: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate maintenance parameters
      ansible.builtin.assert:
        that:
          - ot_asset_id is defined and ot_asset_id | length > 0
          - ot_asset_maintenance_schedule is defined
        fail_msg: "Asset ID and maintenance schedule required"

    - name: Calculate next maintenance date
      ansible.builtin.set_fact:
        ot_asset_next_maintenance: "{{ ansible_date_time.iso8601 }}"
      when: ot_asset_next_maintenance is not defined or ot_asset_next_maintenance | length == 0

    - name: Create maintenance schedule record
      ansible.builtin.set_fact:
        maintenance_schedule:
          asset_id: "{{ ot_asset_id }}"
          schedule: "{{ ot_asset_maintenance_schedule }}"
          maintenance_window: "{{ ot_asset_maintenance_window }}"
          last_maintenance: "{{ ot_asset_last_maintenance }}"
          next_maintenance: "{{ ot_asset_next_maintenance }}"
          contact: "{{ ot_asset_maintenance_contact }}"
          created_by: "{{ ansible_user_id }}"
          created_at: "{{ ansible_date_time.iso8601 }}"

    - name: Register maintenance schedule
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/maintenance/schedule"
        method: POST
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ maintenance_schedule }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200, 201]
      when:
        - ot_asset_api_token | length > 0
        - not ot_asset_dry_run

    - name: Save maintenance schedule locally
      ansible.builtin.copy:
        content: "{{ maintenance_schedule | to_nice_json }}"
        dest: "{{ ot_asset_artifacts_dir }}/maintenance_{{ ot_asset_id }}.json"
        mode: '0640'

    - name: Update asset with maintenance info
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          maintenance_schedule: "{{ ot_asset_maintenance_schedule }}"
          next_maintenance: "{{ ot_asset_next_maintenance }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200, 204]
      when:
        - ot_asset_api_token | length > 0
        - not ot_asset_dry_run

    - name: Log maintenance scheduling
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/maintenance.log"
        line: "{{ ansible_date_time.iso8601 }} | SCHEDULE | {{ ot_asset_id }} | Next: {{ ot_asset_next_maintenance }}"
        create: yes
        mode: '0640'

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_includes_maintenance_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/maintenance: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle/includes/maintenance: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/maintenance: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/maintenance failed at '{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_includes_maintenance_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle/includes/maintenance":
              component: "operational_technology/ot_asset_lifecycle/includes/maintenance"
              type: "role-tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_maintenance_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_includes_maintenance_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle/includes/maintenance'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/maintenance | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_maintenance_stats_published: true
      tags:
        - always
