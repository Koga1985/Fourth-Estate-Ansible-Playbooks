---
# Asset Registration Workflow

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle/includes/register']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_includes_register_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle/includes/register | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_includes_register_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_includes_register_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_includes_register_status: "running"
    fe_operational_technology_ot_asset_lifecycle_includes_register_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_register_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_register_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_includes_register_error: ""
    fe_operational_technology_ot_asset_lifecycle_includes_register_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle/includes/register | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/register: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle/includes/register: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle/includes/register: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle/includes/register: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_register_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate asset registration data
      ansible.builtin.assert:
        that:
          - ot_asset_name is defined and ot_asset_name | length > 0
          - ot_asset_type is defined and ot_asset_type | length > 0
          - ot_asset_vendor is defined and ot_asset_vendor | length > 0
          - ot_asset_model is defined and ot_asset_model | length > 0
          - (not ot_asset_require_serial_number) or (ot_asset_serial_number is defined and ot_asset_serial_number | length > 0)
          - (not ot_asset_require_ip_address) or (ot_asset_ip_address is defined and ot_asset_ip_address | length > 0)
          - (not ot_asset_require_purdue_level) or (ot_asset_purdue_level is defined and ot_asset_purdue_level | length > 0)
          - (not ot_asset_require_criticality) or (ot_asset_criticality is defined)
        fail_msg: "Required asset registration data is missing"

    - name: Generate unique asset ID if not provided
      ansible.builtin.set_fact:
        ot_asset_id: "{{ ot_asset_type | upper }}-{{ ot_asset_serial_number | default(ansible_date_time.epoch) }}"
      when: ot_asset_id is not defined or ot_asset_id | length == 0

    - name: Check if asset already exists
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        timeout: "{{ ot_asset_api_timeout }}"
        status_code: [200, 404]
      register: asset_check
      when:
        - not ot_asset_dry_run
        - ot_asset_api_token | length > 0
      failed_when: false

    - name: Fail if asset already exists
      ansible.builtin.fail:
        msg: "Asset {{ ot_asset_id }} already exists. Use update operation instead."
      when:
        - asset_check is defined
        - asset_check.status == 200

    - name: Validate criticality rating
      ansible.builtin.assert:
        that:
          - ot_asset_criticality in ['critical', 'high', 'medium', 'low']
        fail_msg: "Invalid criticality rating: {{ ot_asset_criticality }}"

    - name: Validate Purdue level
      ansible.builtin.assert:
        that:
          - ot_asset_purdue_level in ['level_0', 'level_1', 'level_2', 'level_3', 'level_4', 'level_5', '']
        fail_msg: "Invalid Purdue level: {{ ot_asset_purdue_level }}"
      when: ot_asset_purdue_level is defined and ot_asset_purdue_level | length > 0

    - name: Create asset registration payload
      ansible.builtin.set_fact:
        asset_registration_payload:
          asset_id: "{{ ot_asset_id }}"
          name: "{{ ot_asset_name }}"
          type: "{{ ot_asset_type }}"
          vendor: "{{ ot_asset_vendor }}"
          model: "{{ ot_asset_model }}"
          serial_number: "{{ ot_asset_serial_number }}"
          firmware_version: "{{ ot_asset_firmware_version }}"
          ip_address: "{{ ot_asset_ip_address }}"
          mac_address: "{{ ot_asset_mac_address }}"
          criticality: "{{ ot_asset_criticality }}"
          purdue_level: "{{ ot_asset_purdue_level }}"
          zone: "{{ ot_asset_zone }}"
          function: "{{ ot_asset_function }}"
          protocols: "{{ ot_asset_protocols }}"
          owner: "{{ ot_asset_owner }}"
          custodian: "{{ ot_asset_custodian }}"
          support_contact: "{{ ot_asset_support_contact }}"
          facility: "{{ ot_asset_facility }}"
          building: "{{ ot_asset_building }}"
          room: "{{ ot_asset_room }}"
          rack: "{{ ot_asset_rack }}"
          purchase_date: "{{ ot_asset_purchase_date }}"
          install_date: "{{ ot_asset_install_date }}"
          state: "registered"
          registered_by: "{{ ansible_user_id }}"
          registered_at: "{{ ansible_date_time.iso8601 }}"

    - name: Save asset registration locally
      ansible.builtin.copy:
        content: "{{ asset_registration_payload | to_nice_json }}"
        dest: "{{ ot_asset_artifacts_dir }}/{{ ot_asset_id }}_registration.json"
        mode: '0640'

    - name: Log asset registration
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/registrations.log"
        line: "{{ ansible_date_time.iso8601 }} | REGISTER | {{ ot_asset_id }} | {{ ot_asset_name }} | {{ ot_asset_type }} | {{ ot_asset_criticality }}"
        create: yes
        mode: '0640'

    - name: Display registration summary
      ansible.builtin.debug:
        msg:
          - "Asset Registration Completed"
          - "Asset ID: {{ ot_asset_id }}"
          - "Name: {{ ot_asset_name }}"
          - "Type: {{ ot_asset_type }}"
          - "Vendor: {{ ot_asset_vendor }}"
          - "Model: {{ ot_asset_model }}"
          - "Criticality: {{ ot_asset_criticality }}"
          - "Purdue Level: {{ ot_asset_purdue_level }}"
          - "IP Address: {{ ot_asset_ip_address }}"

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_includes_register_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_includes_register_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/register: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_includes_register_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_includes_register_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle/includes/register: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_register_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_includes_register_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_register_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_includes_register_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_includes_register_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_register_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/register: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_includes_register_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_includes_register_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/register failed at '{{ fe_operational_technology_ot_asset_lifecycle_includes_register_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_includes_register_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_register_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_register_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_includes_register_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle/includes/register":
              component: "operational_technology/ot_asset_lifecycle/includes/register"
              type: "role-tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_includes_register_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_includes_register_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_register_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_includes_register_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle/includes/register'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/register | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_register_stats_published: true
      tags:
        - always
