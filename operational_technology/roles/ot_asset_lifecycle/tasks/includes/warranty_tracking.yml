---
# Warranty and Support Contract Tracking

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle/includes/warranty_tracking']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status: "running"
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_error: ""
    fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/warranty_tracking: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle/includes/warranty_tracking: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check warranty expiration status
      ansible.builtin.set_fact:
        warranty_expired: "{{ (ot_asset_warranty_expiry | default('') | length > 0) and ((ot_asset_warranty_expiry | to_datetime) < (ansible_date_time.iso8601 | to_datetime)) }}"
        support_expired: "{{ (ot_asset_support_expiry | default('') | length > 0) and ((ot_asset_support_expiry | to_datetime) < (ansible_date_time.iso8601 | to_datetime)) }}"
      when: ot_asset_warranty_expiry is defined or ot_asset_support_expiry is defined

    - name: Calculate days until warranty expiration
      ansible.builtin.set_fact:
        warranty_days_remaining: "{{ ((ot_asset_warranty_expiry | to_datetime) - (ansible_date_time.iso8601 | to_datetime)).days }}"
      when:
        - ot_asset_warranty_expiry is defined
        - ot_asset_warranty_expiry | length > 0
        - not warranty_expired | default(false)

    - name: Calculate days until support expiration
      ansible.builtin.set_fact:
        support_days_remaining: "{{ ((ot_asset_support_expiry | to_datetime) - (ansible_date_time.iso8601 | to_datetime)).days }}"
      when:
        - ot_asset_support_expiry is defined
        - ot_asset_support_expiry | length > 0
        - not support_expired | default(false)

    - name: Create warranty tracking record
      ansible.builtin.set_fact:
        warranty_record:
          asset_id: "{{ ot_asset_id }}"
          warranty_expiry: "{{ ot_asset_warranty_expiry }}"
          warranty_expired: "{{ warranty_expired | default(false) }}"
          warranty_days_remaining: "{{ warranty_days_remaining | default('N/A') }}"
          support_contract: "{{ ot_asset_support_contract_number }}"
          support_expiry: "{{ ot_asset_support_expiry }}"
          support_expired: "{{ support_expired | default(false) }}"
          support_days_remaining: "{{ support_days_remaining | default('N/A') }}"
          checked_at: "{{ ansible_date_time.iso8601 }}"

    - name: Save warranty tracking record
      ansible.builtin.copy:
        content: "{{ warranty_record | to_nice_json }}"
        dest: "{{ ot_asset_artifacts_dir }}/warranty_{{ ot_asset_id }}.json"
        mode: '0640'

    - name: Alert if warranty expiring soon
      ansible.builtin.debug:
        msg: "WARNING: Warranty for {{ ot_asset_id }} expires in {{ warranty_days_remaining }} days"
      when:
        - warranty_days_remaining is defined
        - warranty_days_remaining | int < 90
        - warranty_days_remaining | int > 0

    - name: Alert if support contract expiring soon
      ansible.builtin.debug:
        msg: "WARNING: Support contract for {{ ot_asset_id }} expires in {{ support_days_remaining }} days"
      when:
        - support_days_remaining is defined
        - support_days_remaining | int < 90
        - support_days_remaining | int > 0

    - name: Log warranty status
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/warranty_tracking.log"
        line: "{{ ansible_date_time.iso8601 }} | {{ ot_asset_id }} | Warranty: {{ warranty_expired | default('unknown') }} | Support: {{ support_expired | default('unknown') }}"
        create: true
        mode: '0640'

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/warranty_tracking: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/warranty_tracking: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/warranty_tracking failed at '{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle/includes/warranty_tracking":
              component: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking"
              type: "role-tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle/includes/warranty_tracking'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/warranty_tracking | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_warranty_tracking_stats_published: true
      tags:
        - always
