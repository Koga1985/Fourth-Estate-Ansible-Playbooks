---
# Asset Disposal Workflow

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle/includes/dispose']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_includes_dispose_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle/includes/dispose | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_status: "running"
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_error: ""
    fe_operational_technology_ot_asset_lifecycle_includes_dispose_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle/includes/dispose | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/dispose: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle/includes/dispose: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle/includes/dispose: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle/includes/dispose: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate disposal requirements
      ansible.builtin.assert:
        that:
          - ot_asset_id is defined and ot_asset_id | length > 0
          - ot_asset_disposal_method is defined and ot_asset_disposal_method | length > 0
          - ot_asset_disposal_method in ['recycle', 'destroy', 'return_to_vendor', 'archive']
          - not ot_asset_dry_run
        fail_msg: "Disposal requires asset_id, valid disposal method, and dry_run must be false"

    - name: Verify asset is decommissioned
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200]
      register: asset_status
      when: ot_asset_api_token | length > 0

    - name: Fail if asset not decommissioned
      ansible.builtin.fail:
        msg: "Asset must be decommissioned before disposal"
      when:
        - asset_status is defined
        - asset_status.json.state != 'decommissioned'

    - name: Create final asset snapshot
      ansible.builtin.copy:
        content: "{{ asset_status.json | to_nice_json }}"
        dest: "{{ ot_asset_backup_dir }}/{{ ot_asset_id }}_final_snapshot.json"
        mode: '0640'
      when: asset_status is defined

    - name: Data sanitization record
      ansible.builtin.set_fact:
        sanitization_record:
          asset_id: "{{ ot_asset_id }}"
          sanitization_required: "{{ ot_asset_data_sanitization_required }}"
          sanitization_date: "{{ ansible_date_time.iso8601 if ot_asset_data_sanitization_required else 'N/A' }}"
          sanitization_method: "{{ 'DoD 5220.22-M' if ot_asset_data_sanitization_required else 'N/A' }}"
          verified_by: "{{ ansible_user_id if ot_asset_data_sanitization_required else 'N/A' }}"

    - name: Create disposal record
      ansible.builtin.set_fact:
        disposal_record:
          asset_id: "{{ ot_asset_id }}"
          disposal_date: "{{ ansible_date_time.iso8601 }}"
          disposal_method: "{{ ot_asset_disposal_method }}"
          disposed_by: "{{ ansible_user_id }}"
          data_sanitization: "{{ sanitization_record }}"
          final_snapshot: "{{ ot_asset_backup_dir }}/{{ ot_asset_id }}_final_snapshot.json"

    - name: Save disposal record
      ansible.builtin.copy:
        content: "{{ disposal_record | to_nice_json }}"
        dest: "{{ ot_asset_artifacts_dir }}/disposal_{{ ot_asset_id }}_{{ ansible_date_time.iso8601_basic_short }}.json"
        mode: '0640'

    - name: Update asset to disposed state
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          state: "disposed"
          disposal_date: "{{ ansible_date_time.iso8601 }}"
          disposal_method: "{{ ot_asset_disposal_method }}"
          disposed_by: "{{ ansible_user_id }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200, 204]
      when: ot_asset_api_token | length > 0

    - name: Log disposal event
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/disposals.log"
        line: "{{ ansible_date_time.iso8601 }} | DISPOSE | {{ ot_asset_id }} | {{ ot_asset_disposal_method }}"
        create: true
        mode: '0640'

    - name: Display disposal summary
      ansible.builtin.debug:
        msg:
          - "Asset Disposal Completed"
          - "Asset ID: {{ ot_asset_id }}"
          - "Method: {{ ot_asset_disposal_method }}"
          - "Data Sanitization: {{ ot_asset_data_sanitization_required }}"
          - "Date: {{ ansible_date_time.iso8601 }}"

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_includes_dispose_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_includes_dispose_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/dispose: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle/includes/dispose: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/dispose: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/dispose failed at '{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_includes_dispose_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle/includes/dispose":
              component: "operational_technology/ot_asset_lifecycle/includes/dispose"
              type: "role-tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_includes_dispose_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_includes_dispose_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_dispose_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_includes_dispose_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle/includes/dispose'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/dispose | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_dispose_stats_published: true
      tags:
        - always
