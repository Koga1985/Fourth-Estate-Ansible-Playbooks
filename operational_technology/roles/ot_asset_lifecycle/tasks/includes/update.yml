---
# Asset Update Workflow

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['operational_technology/ot_asset_lifecycle/includes/update']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_operational_technology_ot_asset_lifecycle_includes_update_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "operational_technology/ot_asset_lifecycle/includes/update | Initialize validation state"
  ansible.builtin.set_fact:
    fe_operational_technology_ot_asset_lifecycle_includes_update_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_operational_technology_ot_asset_lifecycle_includes_update_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_operational_technology_ot_asset_lifecycle_includes_update_status: "running"
    fe_operational_technology_ot_asset_lifecycle_includes_update_preflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_update_postflight_passed: false
    fe_operational_technology_ot_asset_lifecycle_includes_update_failed_task: ""
    fe_operational_technology_ot_asset_lifecycle_includes_update_error: ""
    fe_operational_technology_ot_asset_lifecycle_includes_update_stats_published: false
  tags:
    - always

- name: "operational_technology/ot_asset_lifecycle/includes/update | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/update: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          operational_technology/ot_asset_lifecycle/includes/update: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "operational_technology/ot_asset_lifecycle/includes/update: required variable '{{ item }}' is not defined."
        success_msg: "operational_technology/ot_asset_lifecycle/includes/update: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_update_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate update requirements
      ansible.builtin.assert:
        that:
          - ot_asset_id is defined and ot_asset_id | length > 0
        fail_msg: "Asset ID required for update"

    - name: Retrieve current asset data
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200]
      register: current_asset
      when: ot_asset_api_token | length > 0

    - name: Backup current asset state
      ansible.builtin.copy:
        content: "{{ current_asset.json | to_nice_json }}"
        dest: "{{ ot_asset_backup_dir }}/{{ ot_asset_id }}_pre_update_{{ ansible_date_time.iso8601_basic_short }}.json"
        mode: '0640'
      when: current_asset is defined

    - name: Prepare update payload
      ansible.builtin.set_fact:
        asset_update_payload:
          asset_id: "{{ ot_asset_id }}"
          name: "{{ ot_asset_name | default(current_asset.json.name) }}"
          firmware_version: "{{ ot_asset_firmware_version | default(current_asset.json.firmware_version) }}"
          ip_address: "{{ ot_asset_ip_address | default(current_asset.json.ip_address) }}"
          owner: "{{ ot_asset_owner | default(current_asset.json.owner) }}"
          custodian: "{{ ot_asset_custodian | default(current_asset.json.custodian) }}"
          criticality: "{{ ot_asset_criticality | default(current_asset.json.criticality) }}"
          location:
            facility: "{{ ot_asset_facility | default(current_asset.json.facility) }}"
            building: "{{ ot_asset_building | default(current_asset.json.building) }}"
            room: "{{ ot_asset_room | default(current_asset.json.room) }}"
          updated_by: "{{ ansible_user_id }}"
          updated_at: "{{ ansible_date_time.iso8601 }}"

    - name: Update asset in CMDB
      ansible.builtin.uri:
        url: "{{ ot_asset_api_url }}/assets/{{ ot_asset_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ ot_asset_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ asset_update_payload }}"
        validate_certs: "{{ ot_asset_verify_ssl }}"
        status_code: [200, 204]
      when:
        - ot_asset_api_token | length > 0
        - not ot_asset_dry_run

    - name: Save update record locally
      ansible.builtin.copy:
        content: "{{ asset_update_payload | to_nice_json }}"
        dest: "{{ ot_asset_artifacts_dir }}/update_{{ ot_asset_id }}_{{ ansible_date_time.iso8601_basic_short }}.json"
        mode: '0640'

    - name: Log asset update
      ansible.builtin.lineinfile:
        path: "{{ ot_asset_log_dir }}/updates.log"
        line: "{{ ansible_date_time.iso8601 }} | UPDATE | {{ ot_asset_id }} | {{ ansible_user_id }}"
        create: yes
        mode: '0640'

    # ----------------------------- postflight -------------------

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_asset_lifecycle_includes_update_preflight_passed | bool
          - fe_operational_technology_ot_asset_lifecycle_includes_update_status in ['running', 'succeeded']
        fail_msg: >-
          operational_technology/ot_asset_lifecycle/includes/update: postflight validation failed - preflight passed
          ={{ fe_operational_technology_ot_asset_lifecycle_includes_update_preflight_passed | default(false) }},
          status={{ fe_operational_technology_ot_asset_lifecycle_includes_update_status | default('unknown') }}.
        success_msg: "operational_technology/ot_asset_lifecycle/includes/update: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_update_postflight_passed: true
        fe_operational_technology_ot_asset_lifecycle_includes_update_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_update_status: "failed"
        fe_operational_technology_ot_asset_lifecycle_includes_update_postflight_passed: false
        fe_operational_technology_ot_asset_lifecycle_includes_update_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_update_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/update: FAILED at '{{ fe_operational_technology_ot_asset_lifecycle_includes_update_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_operational_technology_ot_asset_lifecycle_includes_update_error }}
      tags:
        - always
        - rescue

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          operational_technology/ot_asset_lifecycle/includes/update failed at '{{ fe_operational_technology_ot_asset_lifecycle_includes_update_failed_task }}': {{ fe_operational_technology_ot_asset_lifecycle_includes_update_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_update_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_operational_technology_ot_asset_lifecycle_includes_update_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_operational_technology_ot_asset_lifecycle_includes_update_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "operational_technology/ot_asset_lifecycle/includes/update":
              component: "operational_technology/ot_asset_lifecycle/includes/update"
              type: "role-tasks"
              platform: "operational_technology"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_status | default('unknown') }}"
              preflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_started_at | default('') }}"
              ended_at: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_ended_at | default('') }}"
              duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_failed_task | default('') }}"
              error: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_operational_technology_ot_asset_lifecycle_includes_update_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_operational_technology_ot_asset_lifecycle_includes_update_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_operational_technology_ot_asset_lifecycle_includes_update_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_operational_technology_ot_asset_lifecycle_includes_update_status | default('') == 'succeeded' else ['operational_technology/ot_asset_lifecycle/includes/update'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "operational_technology/ot_asset_lifecycle/includes/update | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_operational_technology_ot_asset_lifecycle_includes_update_stats_published: true
      tags:
        - always
