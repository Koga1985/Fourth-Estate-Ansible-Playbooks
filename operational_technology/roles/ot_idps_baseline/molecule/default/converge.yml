---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_idps_baseline role
      ansible.builtin.include_role:
        name: ot_idps_baseline

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_idps_baseline_preflight_passed | bool
          - fe_operational_technology_ot_idps_baseline_postflight_passed | bool
          - fe_operational_technology_ot_idps_baseline_status == 'succeeded'
        fail_msg: >-
          ot_idps_baseline did not complete cleanly:
          status={{ fe_operational_technology_ot_idps_baseline_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_idps_baseline_failed_task | default('') }}
        success_msg: "ot_idps_baseline completed and the validation harness reported success."
