---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_zone_model role
      ansible.builtin.include_role:
        name: ot_zone_model

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_zone_model_preflight_passed | bool
          - fe_operational_technology_ot_zone_model_postflight_passed | bool
          - fe_operational_technology_ot_zone_model_status == 'succeeded'
        fail_msg: >-
          ot_zone_model did not complete cleanly:
          status={{ fe_operational_technology_ot_zone_model_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_zone_model_failed_task | default('') }}
        success_msg: "ot_zone_model completed and the validation harness reported success."
