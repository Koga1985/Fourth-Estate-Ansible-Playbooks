---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ot_scada_historians_backup role
      ansible.builtin.include_role:
        name: ot_scada_historians_backup

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_operational_technology_ot_scada_historians_backup_preflight_passed | bool
          - fe_operational_technology_ot_scada_historians_backup_postflight_passed | bool
          - fe_operational_technology_ot_scada_historians_backup_status == 'succeeded'
        fail_msg: >-
          ot_scada_historians_backup did not complete cleanly:
          status={{ fe_operational_technology_ot_scada_historians_backup_status | default('unset') }}
          failed_task={{ fe_operational_technology_ot_scada_historians_backup_failed_task | default('') }}
        success_msg: "ot_scada_historians_backup completed and the validation harness reported success."
