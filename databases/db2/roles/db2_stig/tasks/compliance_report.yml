---
# Per-host DB2 STIG compliance artifact (JSON).
# Drift lists populated during assessment indicate non-compliant parameters.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['databases/db2/db2_stig/compliance_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_databases_db2_db2_stig_compliance_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "databases/db2/db2_stig/compliance_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_databases_db2_db2_stig_compliance_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_databases_db2_db2_stig_compliance_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_databases_db2_db2_stig_compliance_report_status: "running"
    fe_databases_db2_db2_stig_compliance_report_preflight_passed: false
    fe_databases_db2_db2_stig_compliance_report_postflight_passed: false
    fe_databases_db2_db2_stig_compliance_report_failed_task: ""
    fe_databases_db2_db2_stig_compliance_report_error: ""
    fe_databases_db2_db2_stig_compliance_report_stats_published: false
  tags:
    - always

- name: "databases/db2/db2_stig/compliance_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "databases/db2/db2_stig/compliance_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          databases/db2/db2_stig/compliance_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          databases/db2/db2_stig/compliance_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/compliance_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "databases/db2/db2_stig/compliance_report: required variable '{{ item }}' is not defined."
        success_msg: "databases/db2/db2_stig/compliance_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_databases_db2_db2_stig_compliance_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/compliance_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_compliance_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assemble result map
      ansible.builtin.set_fact:
        db2_stig_results:
          meta:
            host: "{{ inventory_hostname }}"
            instance: "{{ db2_instance_owner }}"
            database: "{{ db2_database }}"
            timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
            benchmark: "{{ stig_benchmark }}"
            version: "{{ stig_version }}"
            mode: "{{ 'enforce' if apply_changes | bool else 'dry-run' }}"
            compliance_frameworks: "{{ compliance_frameworks }}"
          findings:
            dbm_cfg_noncompliant: "{{ db2_dbm_drift | default([]) }}"
            db_cfg_noncompliant: "{{ db2_db_drift | default([]) }}"
            audit_categories_target: "{{ db2_audit_categories }}"
            public_revokes_target: "{{ db2_revoke_public_statements | length }}"
            ssl_enabled_target: "{{ db2_ssl_enable }}"
          controls:
            - { id: "DB2X-00-000700", title: "AUTHENTICATION SERVER_ENCRYPT", compliant: "{{ 'AUTHENTICATION' not in (db2_dbm_drift | default([])) }}" }
            - { id: "DB2X-00-000800", title: "Do not trust all clients", compliant: "{{ 'TRUST_ALLCLNTS' not in (db2_dbm_drift | default([])) }}" }
            - { id: "DB2X-00-001100", title: "CATALOG_NOAUTH = NO", compliant: "{{ 'CATALOG_NOAUTH' not in (db2_dbm_drift | default([])) }}" }
            - { id: "DB2X-00-001300", title: "Archival logging (LOGARCHMETH1)", compliant: "{{ 'LOGARCHMETH1' not in (db2_db_drift | default([])) }}" }
            - { id: "DB2X-00-001600", title: "Data-at-rest encryption (ENCRLIB)", compliant: "{{ 'ENCRLIB' not in (db2_db_drift | default([])) }}" }
            - { id: "DB2X-00-001700", title: "DIAGLEVEL diagnostic logging", compliant: "{{ 'DIAGLEVEL' not in (db2_dbm_drift | default([])) }}" }
      tags: [report]

    - name: Write JSON compliance artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}_db2_stig.json"
        mode: "0640"
        content: "{{ db2_stig_results | to_nice_json }}"
      delegate_to: localhost
      tags: [report]

    - name: Summarize compliance state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ db2_database }}):
          dbm cfg drift={{ db2_dbm_drift | default([]) | length }},
          db cfg drift={{ db2_db_drift | default([]) | length }}
          ({{ 'assessment only' if not (apply_changes | bool) else 'enforced' }}).
      tags: [report]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "databases/db2/db2_stig/compliance_report | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}"
        patterns: "*_db2_stig.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, evidence]

    - name: "databases/db2/db2_stig/compliance_report | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "databases/db2/db2_stig/compliance_report | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, evidence]

    - name: "databases/db2/db2_stig/compliance_report | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "databases/db2/db2_stig/compliance_report":
              component: "databases/db2/db2_stig/compliance_report"
              platform: "databases"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, evidence]

    # ----------------------------- postflight -------------------

    - name: "databases/db2/db2_stig/compliance_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_databases_db2_db2_stig_compliance_report_preflight_passed | bool
          - fe_databases_db2_db2_stig_compliance_report_status in ['running', 'succeeded']
        fail_msg: >-
          databases/db2/db2_stig/compliance_report: postflight validation failed - preflight passed
          ={{ fe_databases_db2_db2_stig_compliance_report_preflight_passed | default(false) }},
          status={{ fe_databases_db2_db2_stig_compliance_report_status | default('unknown') }}.
        success_msg: "databases/db2/db2_stig/compliance_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "databases/db2/db2_stig/compliance_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_compliance_report_postflight_passed: true
        fe_databases_db2_db2_stig_compliance_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "databases/db2/db2_stig/compliance_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_compliance_report_status: "failed"
        fe_databases_db2_db2_stig_compliance_report_postflight_passed: false
        fe_databases_db2_db2_stig_compliance_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_databases_db2_db2_stig_compliance_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/compliance_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          databases/db2/db2_stig/compliance_report: FAILED at '{{ fe_databases_db2_db2_stig_compliance_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_databases_db2_db2_stig_compliance_report_error }}
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/compliance_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          databases/db2/db2_stig/compliance_report failed at '{{ fe_databases_db2_db2_stig_compliance_report_failed_task }}': {{ fe_databases_db2_db2_stig_compliance_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "databases/db2/db2_stig/compliance_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_compliance_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_databases_db2_db2_stig_compliance_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_db2_db2_stig_compliance_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "databases/db2/db2_stig/compliance_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "databases/db2/db2_stig/compliance_report":
              component: "databases/db2/db2_stig/compliance_report"
              type: "role-tasks"
              platform: "databases"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_databases_db2_db2_stig_compliance_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_databases_db2_db2_stig_compliance_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_databases_db2_db2_stig_compliance_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_databases_db2_db2_stig_compliance_report_started_at | default('') }}"
              ended_at: "{{ fe_databases_db2_db2_stig_compliance_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_databases_db2_db2_stig_compliance_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_databases_db2_db2_stig_compliance_report_failed_task | default('') }}"
              error: "{{ fe_databases_db2_db2_stig_compliance_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_databases_db2_db2_stig_compliance_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_databases_db2_db2_stig_compliance_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_databases_db2_db2_stig_compliance_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_databases_db2_db2_stig_compliance_report_status | default('') == 'succeeded' else ['databases/db2/db2_stig/compliance_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "databases/db2/db2_stig/compliance_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_compliance_report_stats_published: true
      tags:
        - always
