---
# Database-level (db cfg) hardening
# DB2X-00-001300 (LOGARCHMETH1), 001600 (native encryption / data-at-rest)
# NIST AU-9, CP-9, SC-28

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['databases/db2/db2_stig/db_cfg']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_databases_db2_db2_stig_db_cfg_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "databases/db2/db2_stig/db_cfg | Initialize validation state"
  ansible.builtin.set_fact:
    fe_databases_db2_db2_stig_db_cfg_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_databases_db2_db2_stig_db_cfg_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_databases_db2_db2_stig_db_cfg_status: "running"
    fe_databases_db2_db2_stig_db_cfg_preflight_passed: false
    fe_databases_db2_db2_stig_db_cfg_postflight_passed: false
    fe_databases_db2_db2_stig_db_cfg_failed_task: ""
    fe_databases_db2_db2_stig_db_cfg_error: ""
    fe_databases_db2_db2_stig_db_cfg_stats_published: false
  tags:
    - always

- name: "databases/db2/db2_stig/db_cfg | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "databases/db2/db2_stig/db_cfg | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          databases/db2/db2_stig/db_cfg: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          databases/db2/db2_stig/db_cfg: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/db_cfg | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "databases/db2/db2_stig/db_cfg: required variable '{{ item }}' is not defined."
        success_msg: "databases/db2/db2_stig/db_cfg: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_databases_db2_db2_stig_db_cfg_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/db_cfg | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_db_cfg_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Capture current db cfg
      ansible.builtin.shell: "{{ db2_clp }} db2 get db cfg for {{ db2_database }}"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ db2_instance_owner }}"
      register: db2_db_current
      changed_when: false
      check_mode: false
      tags: [db_cfg]

    - name: Compute db cfg drift
      ansible.builtin.set_fact:
        db2_db_drift: "{{ db2_db_drift | default([]) + [item.key] }}"
      loop: "{{ db2_db_cfg | dict2items | selectattr('value', 'ne', '') | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: ('(' + item.key + ') = ' + (item.value | string)) not in db2_db_current.stdout
      tags: [db_cfg]

    - name: Apply compliant db cfg parameters
      ansible.builtin.shell: "{{ db2_clp }} db2 update db cfg for {{ db2_database }} using {{ item.key }} {{ item.value }}"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ db2_instance_owner }}"
      loop: "{{ db2_db_cfg | dict2items | selectattr('value', 'ne', '') | list }}"
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      when:
        - apply_changes | bool
        - ('(' + item.key + ') = ' + (item.value | string)) not in db2_db_current.stdout
      register: db2_db_apply
      changed_when: db2_db_apply.rc == 0
      tags: [db_cfg]

    # ----------------------------- postflight -------------------

    - name: "databases/db2/db2_stig/db_cfg | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_databases_db2_db2_stig_db_cfg_preflight_passed | bool
          - fe_databases_db2_db2_stig_db_cfg_status in ['running', 'succeeded']
        fail_msg: >-
          databases/db2/db2_stig/db_cfg: postflight validation failed - preflight passed
          ={{ fe_databases_db2_db2_stig_db_cfg_preflight_passed | default(false) }},
          status={{ fe_databases_db2_db2_stig_db_cfg_status | default('unknown') }}.
        success_msg: "databases/db2/db2_stig/db_cfg: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "databases/db2/db2_stig/db_cfg | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_db_cfg_postflight_passed: true
        fe_databases_db2_db2_stig_db_cfg_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "databases/db2/db2_stig/db_cfg | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_db_cfg_status: "failed"
        fe_databases_db2_db2_stig_db_cfg_postflight_passed: false
        fe_databases_db2_db2_stig_db_cfg_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_databases_db2_db2_stig_db_cfg_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/db_cfg | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          databases/db2/db2_stig/db_cfg: FAILED at '{{ fe_databases_db2_db2_stig_db_cfg_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_databases_db2_db2_stig_db_cfg_error }}
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/db_cfg | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          databases/db2/db2_stig/db_cfg failed at '{{ fe_databases_db2_db2_stig_db_cfg_failed_task }}': {{ fe_databases_db2_db2_stig_db_cfg_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "databases/db2/db2_stig/db_cfg | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_db_cfg_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_databases_db2_db2_stig_db_cfg_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_db2_db2_stig_db_cfg_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "databases/db2/db2_stig/db_cfg | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "databases/db2/db2_stig/db_cfg":
              component: "databases/db2/db2_stig/db_cfg"
              type: "role-tasks"
              platform: "databases"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_databases_db2_db2_stig_db_cfg_status | default('unknown') }}"
              preflight_passed: "{{ fe_databases_db2_db2_stig_db_cfg_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_databases_db2_db2_stig_db_cfg_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_databases_db2_db2_stig_db_cfg_started_at | default('') }}"
              ended_at: "{{ fe_databases_db2_db2_stig_db_cfg_ended_at | default('') }}"
              duration_seconds: "{{ fe_databases_db2_db2_stig_db_cfg_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_databases_db2_db2_stig_db_cfg_failed_task | default('') }}"
              error: "{{ fe_databases_db2_db2_stig_db_cfg_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_databases_db2_db2_stig_db_cfg_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_databases_db2_db2_stig_db_cfg_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_databases_db2_db2_stig_db_cfg_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_databases_db2_db2_stig_db_cfg_status | default('') == 'succeeded' else ['databases/db2/db2_stig/db_cfg'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "databases/db2/db2_stig/db_cfg | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_db_cfg_stats_published: true
      tags:
        - always
