---
# SSL/TLS for client communication
# DB2X-00-0014xx - transmission confidentiality/integrity | NIST SC-8, SC-23

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['databases/db2/db2_stig/ssl']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_databases_db2_db2_stig_ssl_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "databases/db2/db2_stig/ssl | Initialize validation state"
  ansible.builtin.set_fact:
    fe_databases_db2_db2_stig_ssl_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_databases_db2_db2_stig_ssl_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_databases_db2_db2_stig_ssl_status: "running"
    fe_databases_db2_db2_stig_ssl_preflight_passed: false
    fe_databases_db2_db2_stig_ssl_postflight_passed: false
    fe_databases_db2_db2_stig_ssl_failed_task: ""
    fe_databases_db2_db2_stig_ssl_error: ""
    fe_databases_db2_db2_stig_ssl_stats_published: false
  tags:
    - always

- name: "databases/db2/db2_stig/ssl | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "databases/db2/db2_stig/ssl | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          databases/db2/db2_stig/ssl: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          databases/db2/db2_stig/ssl: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/ssl | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "databases/db2/db2_stig/ssl: required variable '{{ item }}' is not defined."
        success_msg: "databases/db2/db2_stig/ssl: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_databases_db2_db2_stig_ssl_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig/ssl | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ssl_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure DB2 SSL dbm cfg parameters
      ansible.builtin.shell: "{{ db2_clp }} db2 update dbm cfg using {{ item.key }} {{ item.value }}"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ db2_instance_owner }}"
      loop:
        - { key: "SSL_SVR_LABEL", value: "{{ db2_ssl_svr_label }}" }
        - { key: "SSL_SVR_KEYDB", value: "{{ db2_ssl_svr_keydb }}" }
        - { key: "SSL_SVR_STASH", value: "{{ db2_ssl_svr_stash }}" }
        - { key: "SSL_VERSIONS", value: "{{ db2_ssl_versions }}" }
        - { key: "SSL_SVCENAME", value: "{{ db2_ssl_svcename }}" }
      loop_control:
        label: "{{ item.key }}"
      when:
        - db2_ssl_enable | bool
        - apply_changes | bool
      register: db2_ssl_cfg
      changed_when: db2_ssl_cfg.rc == 0
      notify: restart db2 instance
      tags: [ssl]

    - name: Enable SSL in DB2COMM
      ansible.builtin.shell: "{{ db2_clp }} db2set DB2COMM=TCPIP,SSL"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ db2_instance_owner }}"
      when:
        - db2_ssl_enable | bool
        - apply_changes | bool
      register: db2_ssl_comm
      changed_when: db2_ssl_comm.rc == 0
      notify: restart db2 instance
      tags: [ssl]

    # ----------------------------- postflight -------------------

    - name: "databases/db2/db2_stig/ssl | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_databases_db2_db2_stig_ssl_preflight_passed | bool
          - fe_databases_db2_db2_stig_ssl_status in ['running', 'succeeded']
        fail_msg: >-
          databases/db2/db2_stig/ssl: postflight validation failed - preflight passed
          ={{ fe_databases_db2_db2_stig_ssl_preflight_passed | default(false) }},
          status={{ fe_databases_db2_db2_stig_ssl_status | default('unknown') }}.
        success_msg: "databases/db2/db2_stig/ssl: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "databases/db2/db2_stig/ssl | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ssl_postflight_passed: true
        fe_databases_db2_db2_stig_ssl_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "databases/db2/db2_stig/ssl | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ssl_status: "failed"
        fe_databases_db2_db2_stig_ssl_postflight_passed: false
        fe_databases_db2_db2_stig_ssl_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_databases_db2_db2_stig_ssl_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/ssl | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          databases/db2/db2_stig/ssl: FAILED at '{{ fe_databases_db2_db2_stig_ssl_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_databases_db2_db2_stig_ssl_error }}
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig/ssl | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          databases/db2/db2_stig/ssl failed at '{{ fe_databases_db2_db2_stig_ssl_failed_task }}': {{ fe_databases_db2_db2_stig_ssl_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "databases/db2/db2_stig/ssl | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ssl_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_databases_db2_db2_stig_ssl_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_db2_db2_stig_ssl_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "databases/db2/db2_stig/ssl | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "databases/db2/db2_stig/ssl":
              component: "databases/db2/db2_stig/ssl"
              type: "role-tasks"
              platform: "databases"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_databases_db2_db2_stig_ssl_status | default('unknown') }}"
              preflight_passed: "{{ fe_databases_db2_db2_stig_ssl_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_databases_db2_db2_stig_ssl_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_databases_db2_db2_stig_ssl_started_at | default('') }}"
              ended_at: "{{ fe_databases_db2_db2_stig_ssl_ended_at | default('') }}"
              duration_seconds: "{{ fe_databases_db2_db2_stig_ssl_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_databases_db2_db2_stig_ssl_failed_task | default('') }}"
              error: "{{ fe_databases_db2_db2_stig_ssl_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_databases_db2_db2_stig_ssl_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_databases_db2_db2_stig_ssl_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_databases_db2_db2_stig_ssl_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_databases_db2_db2_stig_ssl_status | default('') == 'succeeded' else ['databases/db2/db2_stig/ssl'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "databases/db2/db2_stig/ssl | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ssl_stats_published: true
      tags:
        - always
