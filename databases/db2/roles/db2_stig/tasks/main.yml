---
# tasks file for db2_stig

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['databases/db2/db2_stig']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_databases_db2_db2_stig_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "databases/db2/db2_stig | Initialize validation state"
  ansible.builtin.set_fact:
    fe_databases_db2_db2_stig_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_databases_db2_db2_stig_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_databases_db2_db2_stig_status: "running"
    fe_databases_db2_db2_stig_preflight_passed: false
    fe_databases_db2_db2_stig_postflight_passed: false
    fe_databases_db2_db2_stig_failed_task: ""
    fe_databases_db2_db2_stig_error: ""
    fe_databases_db2_db2_stig_stats_published: false
  tags:
    - always

- name: "databases/db2/db2_stig | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "databases/db2/db2_stig | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          databases/db2/db2_stig: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          databases/db2/db2_stig: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "databases/db2/db2_stig: required variable '{{ item }}' is not defined."
        success_msg: "databases/db2/db2_stig: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_databases_db2_db2_stig_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "databases/db2/db2_stig | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure local artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: [always]

    - name: Set DB2 CLP command prefix (source db2profile)
      ansible.builtin.set_fact:
        db2_clp: ". {{ db2_profile_path }} >/dev/null 2>&1 &&"
      tags: [always]

    - name: Show run mode
      ansible.builtin.debug:
        msg: >-
          db2_stig on {{ inventory_hostname }} (instance {{ db2_instance_owner }},
          db {{ db2_database }}) -
          {{ 'ENFORCING' if apply_changes | bool else 'DRY-RUN / assessment only' }}
      tags: [always]

    - name: Instance (dbm cfg) hardening (DB2X-00-000xxx)
      ansible.builtin.import_tasks: dbm_cfg.yml
      when: stig_dbm_cfg | bool
      tags: [stig, dbm_cfg]

    - name: Database (db cfg) hardening (DB2X-00-001xxx)
      ansible.builtin.import_tasks: db_cfg.yml
      when: stig_db_cfg | bool
      tags: [stig, db_cfg]

    - name: Audit policy (DB2X-00-0007xx)
      ansible.builtin.import_tasks: audit.yml
      when: stig_audit | bool
      tags: [stig, audit]

    - name: Privilege hygiene - revoke from PUBLIC (DB2X-00-00xxxx)
      ansible.builtin.import_tasks: privileges.yml
      when: stig_privileges | bool
      tags: [stig, privileges]

    - name: SSL/TLS for client communication (DB2X-00-0014xx)
      ansible.builtin.import_tasks: ssl.yml
      when: stig_ssl | bool
      tags: [stig, ssl]

    - name: Compliance report
      ansible.builtin.import_tasks: compliance_report.yml
      when: stig_compliance_report | bool
      tags: [stig, report]

    # ----------------------------- postflight -------------------

    - name: "databases/db2/db2_stig | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_databases_db2_db2_stig_preflight_passed | bool
          - fe_databases_db2_db2_stig_status in ['running', 'succeeded']
        fail_msg: >-
          databases/db2/db2_stig: postflight validation failed - preflight passed
          ={{ fe_databases_db2_db2_stig_preflight_passed | default(false) }},
          status={{ fe_databases_db2_db2_stig_status | default('unknown') }}.
        success_msg: "databases/db2/db2_stig: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "databases/db2/db2_stig | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_postflight_passed: true
        fe_databases_db2_db2_stig_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "databases/db2/db2_stig | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_status: "failed"
        fe_databases_db2_db2_stig_postflight_passed: false
        fe_databases_db2_db2_stig_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_databases_db2_db2_stig_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          databases/db2/db2_stig: FAILED at '{{ fe_databases_db2_db2_stig_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_databases_db2_db2_stig_error }}
      tags:
        - always
        - rescue

    - name: "databases/db2/db2_stig | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          databases/db2/db2_stig failed at '{{ fe_databases_db2_db2_stig_failed_task }}': {{ fe_databases_db2_db2_stig_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "databases/db2/db2_stig | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_databases_db2_db2_stig_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_db2_db2_stig_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "databases/db2/db2_stig | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "databases/db2/db2_stig":
              component: "databases/db2/db2_stig"
              type: "role"
              platform: "databases"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_databases_db2_db2_stig_status | default('unknown') }}"
              preflight_passed: "{{ fe_databases_db2_db2_stig_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_databases_db2_db2_stig_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_databases_db2_db2_stig_started_at | default('') }}"
              ended_at: "{{ fe_databases_db2_db2_stig_ended_at | default('') }}"
              duration_seconds: "{{ fe_databases_db2_db2_stig_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_databases_db2_db2_stig_failed_task | default('') }}"
              error: "{{ fe_databases_db2_db2_stig_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_databases_db2_db2_stig_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_databases_db2_db2_stig_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_databases_db2_db2_stig_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_databases_db2_db2_stig_status | default('') == 'succeeded' else ['databases/db2/db2_stig'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "databases/db2/db2_stig | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_databases_db2_db2_stig_stats_published: true
      tags:
        - always
