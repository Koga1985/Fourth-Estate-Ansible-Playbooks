---
# tasks file for postgresql_backup
# PostgreSQL backup configuration with pg_dump, pg_basebackup, and automation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['databases/postgresql/postgresql_backup']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_databases_postgresql_postgresql_backup_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "databases/postgresql/postgresql_backup | Initialize validation state"
  ansible.builtin.set_fact:
    fe_databases_postgresql_postgresql_backup_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_databases_postgresql_postgresql_backup_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_databases_postgresql_postgresql_backup_status: "running"
    fe_databases_postgresql_postgresql_backup_preflight_passed: false
    fe_databases_postgresql_postgresql_backup_postflight_passed: false
    fe_databases_postgresql_postgresql_backup_failed_task: ""
    fe_databases_postgresql_postgresql_backup_error: ""
    fe_databases_postgresql_postgresql_backup_stats_published: false
  tags:
    - always

- name: "databases/postgresql/postgresql_backup | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "databases/postgresql/postgresql_backup | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          databases/postgresql/postgresql_backup: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          databases/postgresql/postgresql_backup: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "databases/postgresql/postgresql_backup | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "databases/postgresql/postgresql_backup: required variable '{{ item }}' is not defined."
        success_msg: "databases/postgresql/postgresql_backup: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_databases_postgresql_postgresql_backup_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "databases/postgresql/postgresql_backup | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_databases_postgresql_postgresql_backup_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include OS-specific variables
      include_vars: "{{ ansible_os_family }}.yml"
      when: ansible_os_family in ['RedHat', 'Debian']
      failed_when: false

    - name: Create backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
      loop:
        - "{{ postgresql_backup_directory }}"
        - "{{ postgresql_backup_directory }}/full"
        - "{{ postgresql_backup_directory }}/dump"
        - "{{ postgresql_backup_directory }}/wal"
        - "{{ postgresql_backup_directory }}/logs"

    - name: Create backup retention directory structure
      ansible.builtin.file:
        path: "{{ postgresql_backup_directory }}/{{ item }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
      loop:
        - daily
        - weekly
        - monthly

    - name: Deploy full backup script (pg_basebackup)
      ansible.builtin.template:
        src: pg_full_backup.sh.j2
        dest: /usr/local/bin/pg_full_backup.sh
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Deploy logical backup script (pg_dump/pg_dumpall)
      ansible.builtin.template:
        src: pg_logical_backup.sh.j2
        dest: /usr/local/bin/pg_logical_backup.sh
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Deploy backup cleanup script
      ansible.builtin.template:
        src: pg_backup_cleanup.sh.j2
        dest: /usr/local/bin/pg_backup_cleanup.sh
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Deploy backup verification script
      ansible.builtin.template:
        src: pg_backup_verify.sh.j2
        dest: /usr/local/bin/pg_backup_verify.sh
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Configure WAL archiving for PITR
      ansible.builtin.lineinfile:
        path: "{{ postgresql_config_directory }}/postgresql.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        owner: postgres
        group: postgres
        mode: '0600'
      loop:
        - regexp: '^archive_mode = '
          line: "archive_mode = on"
        - regexp: '^archive_command = '
          line: "archive_command = 'test ! -f {{ postgresql_backup_directory }}/wal/%f && cp %p {{ postgresql_backup_directory }}/wal/%f'"
        - regexp: '^archive_timeout = '
          line: "archive_timeout = {{ postgresql_archive_timeout | default('300') }}"
      notify: reload postgresql
      when: postgresql_enable_wal_archiving | default(true)

    - name: Setup automated daily full backups
      ansible.builtin.cron:
        name: "PostgreSQL daily full backup"
        minute: "{{ postgresql_backup_daily_minute | default('0') }}"
        hour: "{{ postgresql_backup_daily_hour | default('2') }}"
        user: postgres
        job: "/usr/local/bin/pg_full_backup.sh daily >> {{ postgresql_backup_directory }}/logs/full_backup.log 2>&1"
        state: "{{ 'present' if postgresql_enable_daily_backup | default(true) else 'absent' }}"

    - name: Setup automated daily logical backups
      ansible.builtin.cron:
        name: "PostgreSQL daily logical backup"
        minute: "{{ postgresql_backup_logical_minute | default('30') }}"
        hour: "{{ postgresql_backup_logical_hour | default('1') }}"
        user: postgres
        job: "/usr/local/bin/pg_logical_backup.sh daily >> {{ postgresql_backup_directory }}/logs/logical_backup.log 2>&1"
        state: "{{ 'present' if postgresql_enable_logical_backup | default(true) else 'absent' }}"

    - name: Setup weekly full backups
      ansible.builtin.cron:
        name: "PostgreSQL weekly full backup"
        minute: "{{ postgresql_backup_weekly_minute | default('0') }}"
        hour: "{{ postgresql_backup_weekly_hour | default('3') }}"
        weekday: "{{ postgresql_backup_weekly_day | default('0') }}"
        user: postgres
        job: "/usr/local/bin/pg_full_backup.sh weekly >> {{ postgresql_backup_directory }}/logs/full_backup.log 2>&1"
        state: "{{ 'present' if postgresql_enable_weekly_backup | default(true) else 'absent' }}"

    - name: Setup monthly full backups
      ansible.builtin.cron:
        name: "PostgreSQL monthly full backup"
        minute: "{{ postgresql_backup_monthly_minute | default('0') }}"
        hour: "{{ postgresql_backup_monthly_hour | default('4') }}"
        day: "{{ postgresql_backup_monthly_day | default('1') }}"
        user: postgres
        job: "/usr/local/bin/pg_full_backup.sh monthly >> {{ postgresql_backup_directory }}/logs/full_backup.log 2>&1"
        state: "{{ 'present' if postgresql_enable_monthly_backup | default(true) else 'absent' }}"

    - name: Setup backup cleanup job
      ansible.builtin.cron:
        name: "PostgreSQL backup cleanup"
        minute: "0"
        hour: "5"
        user: postgres
        job: "/usr/local/bin/pg_backup_cleanup.sh >> {{ postgresql_backup_directory }}/logs/cleanup.log 2>&1"
        state: "{{ 'present' if postgresql_enable_backup_cleanup | default(true) else 'absent' }}"

    - name: Setup backup verification job
      ansible.builtin.cron:
        name: "PostgreSQL backup verification"
        minute: "0"
        hour: "6"
        weekday: "1"
        user: postgres
        job: "/usr/local/bin/pg_backup_verify.sh >> {{ postgresql_backup_directory }}/logs/verification.log 2>&1"
        state: "{{ 'present' if postgresql_enable_backup_verification | default(true) else 'absent' }}"

    - name: Create backup configuration file
      ansible.builtin.template:
        src: backup_config.conf.j2
        dest: "{{ postgresql_backup_directory }}/backup.conf"
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Setup backup monitoring and alerting
      ansible.builtin.template:
        src: backup_monitor.sh.j2
        dest: /usr/local/bin/pg_backup_monitor.sh
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Configure backup monitoring cron
      ansible.builtin.cron:
        name: "PostgreSQL backup monitoring"
        minute: "*/30"
        user: postgres
        job: "/usr/local/bin/pg_backup_monitor.sh >> {{ postgresql_backup_directory }}/logs/monitor.log 2>&1"
        state: "{{ 'present' if postgresql_enable_backup_monitoring | default(true) else 'absent' }}"

    - name: Create .pgpass file for automated backups
      ansible.builtin.template:
        src: pgpass.j2
        dest: "{{ postgresql_home_directory }}/.pgpass"
        owner: postgres
        group: postgres
        mode: '0600'
      when: postgresql_backup_password is defined
      no_log: true

    - name: Display backup configuration summary
      ansible.builtin.debug:
        msg:
          - "PostgreSQL backup configuration completed"
          - "Backup Directory: {{ postgresql_backup_directory }}"
          - "Daily Backups: {{ postgresql_enable_daily_backup | default(true) }}"
          - "Weekly Backups: {{ postgresql_enable_weekly_backup | default(true) }}"
          - "Monthly Backups: {{ postgresql_enable_monthly_backup | default(true) }}"
          - "WAL Archiving: {{ postgresql_enable_wal_archiving | default(true) }}"
          - "Retention: Daily={{ postgresql_backup_retention_daily }}d, Weekly={{ postgresql_backup_retention_weekly }}w, Monthly={{ postgresql_backup_retention_monthly }}m"

    # ----------------------------- postflight -------------------

    - name: "databases/postgresql/postgresql_backup | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_databases_postgresql_postgresql_backup_preflight_passed | bool
          - fe_databases_postgresql_postgresql_backup_status in ['running', 'succeeded']
        fail_msg: >-
          databases/postgresql/postgresql_backup: postflight validation failed - preflight passed
          ={{ fe_databases_postgresql_postgresql_backup_preflight_passed | default(false) }},
          status={{ fe_databases_postgresql_postgresql_backup_status | default('unknown') }}.
        success_msg: "databases/postgresql/postgresql_backup: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "databases/postgresql/postgresql_backup | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_databases_postgresql_postgresql_backup_postflight_passed: true
        fe_databases_postgresql_postgresql_backup_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "databases/postgresql/postgresql_backup | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_databases_postgresql_postgresql_backup_status: "failed"
        fe_databases_postgresql_postgresql_backup_postflight_passed: false
        fe_databases_postgresql_postgresql_backup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_databases_postgresql_postgresql_backup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "databases/postgresql/postgresql_backup | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          databases/postgresql/postgresql_backup: FAILED at '{{ fe_databases_postgresql_postgresql_backup_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_databases_postgresql_postgresql_backup_error }}
      tags:
        - always
        - rescue

    - name: "databases/postgresql/postgresql_backup | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          databases/postgresql/postgresql_backup failed at '{{ fe_databases_postgresql_postgresql_backup_failed_task }}': {{ fe_databases_postgresql_postgresql_backup_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "databases/postgresql/postgresql_backup | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_databases_postgresql_postgresql_backup_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_databases_postgresql_postgresql_backup_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_postgresql_postgresql_backup_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "databases/postgresql/postgresql_backup | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "databases/postgresql/postgresql_backup":
              component: "databases/postgresql/postgresql_backup"
              type: "role"
              platform: "databases"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_databases_postgresql_postgresql_backup_status | default('unknown') }}"
              preflight_passed: "{{ fe_databases_postgresql_postgresql_backup_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_databases_postgresql_postgresql_backup_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_databases_postgresql_postgresql_backup_started_at | default('') }}"
              ended_at: "{{ fe_databases_postgresql_postgresql_backup_ended_at | default('') }}"
              duration_seconds: "{{ fe_databases_postgresql_postgresql_backup_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_databases_postgresql_postgresql_backup_failed_task | default('') }}"
              error: "{{ fe_databases_postgresql_postgresql_backup_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_databases_postgresql_postgresql_backup_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_databases_postgresql_postgresql_backup_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_databases_postgresql_postgresql_backup_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_databases_postgresql_postgresql_backup_status | default('') == 'succeeded' else ['databases/postgresql/postgresql_backup'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "databases/postgresql/postgresql_backup | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_databases_postgresql_postgresql_backup_stats_published: true
      tags:
        - always
