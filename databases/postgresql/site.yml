            aggregate: true
            per_host: false
          when:
            - fe_databases_postgresql_site_play2_status | default('') == 'failed'
            - not (fe_databases_postgresql_site_play2_stats_published | default(false) | bool)
          tags:
            - always

        - name: "databases/postgresql/site#play2 | Always | Mark the validation statistics as published"
