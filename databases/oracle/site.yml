                  duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_databases_oracle_site_play1_failed_task | default('') }}"
                  error: "{{ fe_databases_oracle_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else ['databases/oracle/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_databases_oracle_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "databases/oracle/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
