          tags:
            - always

        - name: "databases/oracle/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_stats_published: true
          tags:
            - always

        - name: "databases/oracle/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              databases/oracle/site#play1 failed at '{{ fe_databases_oracle_site_play1_failed_task }}': {{ fe_databases_oracle_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "databases/oracle/site#play1 | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              databases/oracle/site#play1: preflight
              {{ 'passed' if fe_databases_oracle_site_play1_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "databases/oracle/site#play1 | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "databases/oracle/site#play1 | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_databases_oracle_site_play1_preflight_passed | bool
              - fe_databases_oracle_site_play1_status in ['running', 'succeeded']
            fail_msg: >-
              databases/oracle/site#play1: postflight validation failed - preflight passed
              ={{ fe_databases_oracle_site_play1_preflight_passed | default(false) }},
              status={{ fe_databases_oracle_site_play1_status | default('unknown') }}.
            success_msg: "databases/oracle/site#play1: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "databases/oracle/site#play1 | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_postflight_passed: true
            fe_databases_oracle_site_play1_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "databases/oracle/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_status: "failed"
