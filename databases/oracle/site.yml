---
# Oracle Database Deployment Playbook
# Entry point for Oracle database automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Oracle Database Installation
  hosts: oracle_primary
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_install: true
    deploy_database: true
    deploy_security: true
    deploy_audit: true
    deploy_data_guard: true
    deploy_rman: true
    deploy_flashback: true

  tasks:
    - name: "databases/oracle/site#play1 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Oracle Installation
          ansible.builtin.include_role:
            name: oracle_install
          when: deploy_install | bool
          tags: ['install', 'phase1']

        - name: Phase 2 - Database Creation
          ansible.builtin.include_role:
            name: oracle_database_create
          when: deploy_database | bool
          tags: ['database', 'phase2']

        - name: Phase 3 - Security Configuration
          ansible.builtin.include_role:
            name: oracle_security
          when: deploy_security | bool
          tags: ['security', 'phase3']

        - name: Phase 4 - Audit Configuration
          ansible.builtin.include_role:
            name: oracle_audit
          when: deploy_audit | bool
          tags: ['audit', 'phase4']

        - name: Phase 5 - Data Guard (Primary)
          ansible.builtin.include_role:
            name: oracle_data_guard
          vars:
            data_guard_role: primary
          when: deploy_data_guard | bool
          tags: ['dataguard', 'phase5']

        - name: Phase 6 - RMAN Backup
          ansible.builtin.include_role:
            name: oracle_rman
          when: deploy_rman | bool
          tags: ['rman', 'backup', 'phase6']

        - name: Phase 7 - Flashback
          ansible.builtin.include_role:
            name: oracle_flashback
          when: deploy_flashback | bool
          tags: ['flashback', 'phase7']

        - name: "databases/oracle/site#play1 | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "databases/oracle/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_status: "failed"
            fe_databases_oracle_site_play1_postflight_passed: false
            fe_databases_oracle_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_databases_oracle_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "databases/oracle/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              databases/oracle/site#play1: FAILED at '{{ fe_databases_oracle_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_databases_oracle_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "databases/oracle/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              databases/oracle/site#play1 failed at '{{ fe_databases_oracle_site_play1_failed_task }}': {{ fe_databases_oracle_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "databases/oracle/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_databases_oracle_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_databases_oracle_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "databases/oracle/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "databases/oracle/site#play1":
                  component: "databases/oracle/site#play1"
                  type: "playbook"
                  platform: "databases"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_databases_oracle_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_databases_oracle_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_databases_oracle_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_databases_oracle_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_databases_oracle_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_databases_oracle_site_play1_failed_task | default('') }}"
                  error: "{{ fe_databases_oracle_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else ['databases/oracle/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - fe_databases_oracle_site_play1_status | default('') == 'failed'
            - not (fe_databases_oracle_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "databases/oracle/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_stats_published: true
          when:
            - fe_databases_oracle_site_play1_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "databases/oracle/site#play1 | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "databases/oracle/site#play1 | Initialize validation state"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_databases_oracle_site_play1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_databases_oracle_site_play1_status: "running"
            fe_databases_oracle_site_play1_preflight_passed: false
            fe_databases_oracle_site_play1_postflight_passed: false
            fe_databases_oracle_site_play1_failed_task: ""
            fe_databases_oracle_site_play1_error: ""
            fe_databases_oracle_site_play1_stats_published: false
          tags:
            - always

        - name: "databases/oracle/site#play1 | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              databases/oracle/site#play1: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              databases/oracle/site#play1: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "databases/oracle/site#play1 | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "databases/oracle/site#play1: required variable '{{ item }}' is not defined."
            success_msg: "databases/oracle/site#play1: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_databases_oracle_site_play1_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "databases/oracle/site#play1 | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "databases/oracle/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_databases_oracle_site_play1_status: "preflight_failed"
            fe_databases_oracle_site_play1_postflight_passed: false
            fe_databases_oracle_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_databases_oracle_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "databases/oracle/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              databases/oracle/site#play1: FAILED at '{{ fe_databases_oracle_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_databases_oracle_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "databases/oracle/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "databases/oracle/site#play1":
                  component: "databases/oracle/site#play1"
                  type: "playbook"
                  platform: "databases"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_databases_oracle_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_databases_oracle_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_databases_oracle_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_databases_oracle_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_databases_oracle_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_databases_oracle_site_play1_failed_task | default('') }}"
                  error: "{{ fe_databases_oracle_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_databases_oracle_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_databases_oracle_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
