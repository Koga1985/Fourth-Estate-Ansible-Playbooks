          tags:
            - always
            - rescue

        - name: "databases/oracle/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              databases/oracle/site#play1 failed at '{{ fe_databases_oracle_site_play1_failed_task }}': {{ fe_databases_oracle_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
