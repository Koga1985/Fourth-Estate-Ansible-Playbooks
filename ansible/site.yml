---
# Ansible Automation Platform Configuration Playbook
# Entry point for AAP/Controller/Hub automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass
#
# Tags:
#   - controller: Controller configuration
#   - hub: Private Automation Hub
#   - ee: Execution Environments
#   - rbac: Access control
#   - workflows: Workflow templates

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Ansible Automation Platform Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_core: true
    deploy_inventory: true
    deploy_credentials: true
    deploy_projects: true
    deploy_templates: true
    deploy_workflows: true
    deploy_schedules: true
    deploy_rbac: true
    deploy_ee: true
    deploy_hub: true
    deploy_sso: true
    deploy_backup: true

  tasks:
    # =========================================
    # Phase 1: Core Configuration
    # =========================================
    - name: "ansible/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Runtime Baseline
          ansible.builtin.include_role:
            name: ans_core_runtime_baseline
          when: deploy_core | bool
          tags: ['controller', 'core', 'phase1']

        - name: Phase 1 - Secrets & Identity
          ansible.builtin.include_role:
            name: ans_core_secrets_identity
          when: deploy_core | bool
          tags: ['controller', 'core', 'phase1']

        # =========================================
        # Phase 2: Inventory Management
        # =========================================
        - name: Phase 2 - Inventory Model
          ansible.builtin.include_role:
            name: ans_ctrl_inventory_model
          when: deploy_inventory | bool
          tags: ['controller', 'inventory', 'phase2']

        - name: Phase 2 - Inventory Hygiene
          ansible.builtin.include_role:
            name: ans_core_inventory_hygiene
          when: deploy_inventory | bool
          tags: ['controller', 'inventory', 'phase2']

        # =========================================
        # Phase 3: Content Management
        # =========================================
        - name: Phase 3 - PAH Bootstrap
          ansible.builtin.include_role:
            name: ans_content_pah_bootstrap
          when: deploy_hub | bool
          tags: ['hub', 'content', 'phase3']

        - name: Phase 3 - Content Trust & Lock
          ansible.builtin.include_role:
            name: ans_content_trust_and_lock
          when: deploy_hub | bool
          tags: ['hub', 'content', 'phase3']

        - name: Phase 3 - Content QA CI
          ansible.builtin.include_role:
            name: ans_content_qa_ci
          when: deploy_hub | bool
          tags: ['hub', 'content', 'phase3']

        # =========================================
        # Phase 4: Execution Environments
        # =========================================
        - name: Phase 4 - EE Factory
          ansible.builtin.include_role:
            name: ans_ee_factory
          when: deploy_ee | bool
          tags: ['ee', 'phase4']

        # =========================================
        # Phase 5: Controller Configuration
        # =========================================
        - name: Phase 5 - Job Lifecycle
          ansible.builtin.include_role:
            name: ans_ctrl_job_lifecycle
          when: deploy_templates | bool
          tags: ['controller', 'jobs', 'phase5']

        - name: Phase 5 - Workflow Pipelines
          ansible.builtin.include_role:
            name: ans_ctrl_workflow_pipelines
          when: deploy_workflows | bool
          tags: ['controller', 'workflows', 'phase5']

        - name: Phase 5 - Policy Guardrails
          ansible.builtin.include_role:
            name: ans_ctrl_policy_guardrails
          when: deploy_templates | bool
          tags: ['controller', 'policy', 'phase5']

        # =========================================
        # Phase 6: SSO & Access
        # =========================================
        - name: Phase 6 - SSO Directory Integration
          ansible.builtin.include_role:
            name: ans_access_sso_directory
          when: deploy_sso | bool
          tags: ['controller', 'sso', 'phase6']

        # =========================================
        # Phase 7: CI/CD Pipelines
        # =========================================
        - name: Phase 7 - CI Pipelines
          ansible.builtin.include_role:
            name: ans_ci_pipelines
          tags: ['ci', 'phase7']

        # =========================================
        # Phase 8: Operations
        # =========================================
        - name: Phase 8 - Backup & Audit
          ansible.builtin.include_role:
            name: ans_ctrl_backup_and_audit
          when: deploy_backup | bool
          tags: ['controller', 'backup', 'phase8']

        - name: Phase 8 - Artifacts Retention
          ansible.builtin.include_role:
            name: ans_ops_artifacts_retention
          tags: ['operations', 'phase8']

        - name: Phase 8 - Upgrade Window
          ansible.builtin.include_role:
            name: ans_ops_upgrade_window
          tags: ['operations', 'phase8']

        # =========================================
        # Phase 9: Performance
        # =========================================
        - name: Phase 9 - Performance Scaling
          ansible.builtin.include_role:
            name: ans_perf_scaling
          tags: ['performance', 'phase9']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== AAP Configuration Complete ==="
              - "Controller: {{ controller_hostname }}"
              - "Hub: {{ ah_hostname | default('Not configured') }}"
              - "Organization: {{ aap_organization }}"
              - "Core: {{ 'Configured' if deploy_core else 'Skipped' }}"
              - "Inventory: {{ 'Configured' if deploy_inventory else 'Skipped' }}"
              - "Content/Hub: {{ 'Configured' if deploy_hub else 'Skipped' }}"
              - "Execution Environments: {{ 'Configured' if deploy_ee else 'Skipped' }}"
              - "Workflows: {{ 'Configured' if deploy_workflows else 'Skipped' }}"
              - "SSO: {{ 'Configured' if deploy_sso else 'Skipped' }}"
              - "Backup: {{ 'Configured' if deploy_backup else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "ansible/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_site_status: "failed"
            fe_ansible_site_postflight_passed: false
            fe_ansible_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/site: FAILED at '{{ fe_ansible_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/site failed at '{{ fe_ansible_site_failed_task }}': {{ fe_ansible_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/site":
                  component: "ansible/site"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_site_status | default('') == 'succeeded' else ['ansible/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_site_status | default('') == 'failed'
            - not (fe_ansible_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_site_stats_published: true
          when:
            - fe_ansible_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "ansible/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_site_status: "running"
            fe_ansible_site_preflight_passed: false
            fe_ansible_site_postflight_passed: false
            fe_ansible_site_failed_task: ""
            fe_ansible_site_error: ""
            fe_ansible_site_stats_published: false
          tags:
            - always

        - name: "ansible/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/site: required variable '{{ item }}' is not defined."
            success_msg: "ansible/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_site_status: "preflight_failed"
            fe_ansible_site_postflight_passed: false
            fe_ansible_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/site: FAILED at '{{ fe_ansible_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/site":
                  component: "ansible/site"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_site_status | default('') == 'succeeded' else ['ansible/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_site_stats_published: true
          tags:
            - always

        - name: "ansible/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/site failed at '{{ fe_ansible_site_failed_task }}': {{ fe_ansible_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/site: preflight
              {{ 'passed' if fe_ansible_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "ansible/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_site_preflight_passed | bool
              - fe_ansible_site_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/site: postflight validation failed - preflight passed
              ={{ fe_ansible_site_preflight_passed | default(false) }},
              status={{ fe_ansible_site_status | default('unknown') }}.
            success_msg: "ansible/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_site_postflight_passed: true
            fe_ansible_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_site_status: "failed"
            fe_ansible_site_postflight_passed: false
            fe_ansible_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/site: FAILED at '{{ fe_ansible_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/site failed at '{{ fe_ansible_site_failed_task }}': {{ fe_ansible_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/site":
                  component: "ansible/site"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_site_status | default('') == 'succeeded' else ['ansible/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_site_stats_published: true
          tags:
            - always

        - name: "ansible/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/site: {{ fe_ansible_site_status | default('unknown') }} in
              {{ fe_ansible_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
