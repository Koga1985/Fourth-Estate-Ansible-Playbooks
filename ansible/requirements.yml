---
# Ansible Automation Platform (AAP) Collections Requirements
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # Certified builds >=4.5.0 come from Red Hat Automation Hub; community
  # Galaxy only hosts older releases. No version floor so the install
  # resolves on both -- AAP customers with Automation Hub configured still
  # get the latest certified build.
  - name: ansible.controller

  - name: ansible.hub
    version: ">=1.0.0"

  - name: infra.ah_configuration
    version: ">=2.0.0"

  - name: infra.controller_configuration
    version: ">=2.5.0"

  - name: infra.ee_utilities
    version: ">=3.0.0"

  - name: community.general
    version: ">=8.0.0"

  - name: ansible.posix
    version: ">=1.5.0"

  # Used by this platform's roles/tasks; previously undeclared here.
  - name: amazon.aws
    version: ">=7.0.0"
