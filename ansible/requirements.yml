---
# Ansible Automation Platform (AAP) Collections Requirements
# Install with: ansible-galaxy collection install -r requirements.yml

# automation-hub-only: ansible.controller ansible.hub
#
# The marker above is read by scripts/generate_online_baseline.sh, the CI
# "ansible-lint with collections" job and
# execution_environment/compose-requirements.py: neither ansible.controller nor
# ansible.hub has a stable release on community Galaxy (certified builds ship
# only from Red Hat Automation Hub), so those tools treat an install failure of
# this file as expected rather than aborting. Both are named because
# execution_environment/generate-lock.sh reads the list to decide what to leave
# out of a Galaxy-only lock; naming only one left the other to fail the retry. Customers install it from Automation Hub
# (configure the hub server in ansible.cfg); see
# https://console.redhat.com/ansible/automation-hub

collections:
  - name: ansible.controller
    version: ">=4.5.0"

  - name: ansible.hub
    version: ">=1.0.0"

  - name: infra.ah_configuration
    version: ">=2.0.0"

  - name: infra.controller_configuration
    version: ">=2.5.0"

  - name: infra.ee_utilities
    version: ">=3.0.0"

  - name: community.general
    version: ">=8.0.0"

  - name: ansible.posix
    version: ">=1.5.0"

  # Used by this platform's roles/tasks; previously undeclared here.
  - name: amazon.aws
    version: ">=7.0.0"
