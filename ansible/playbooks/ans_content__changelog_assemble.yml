---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__changelog_assemble.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    # Expect a list of dicts like: repos=[{"path":"/repo1"}, {"path":"./role_foo"}]
    repos: "{{ repos | default([]) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__changelog_assemble | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__changelog_assemble | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__changelog_assemble_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_status: "running"
            fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed: false
            fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed: false
            fe_ansible_tasks_ans_content__changelog_assemble_failed_task: ""
            fe_ansible_tasks_ans_content__changelog_assemble_error: ""
            fe_ansible_tasks_ans_content__changelog_assemble_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__changelog_assemble: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__changelog_assemble: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__changelog_assemble | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__changelog_assemble: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__changelog_assemble: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__changelog_assemble_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__changelog_assemble | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_status: "preflight_failed"
            fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed: false
            fe_ansible_tasks_ans_content__changelog_assemble_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble: FAILED at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__changelog_assemble":
                  component: "ansible/tasks/ans_content__changelog_assemble"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__changelog_assemble_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__changelog_assemble_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__changelog_assemble'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble failed at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}': {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory (least privilege)
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"

    - name: Validate repos is a list
      ansible.builtin.assert:
        that:
          - repos is iterable
        fail_msg: "repos must be a list of objects with a 'path' key."

    - name: Validate each repo item has a 'path'
      ansible.builtin.assert:
        that:
          - item.path is defined
          - item.path | length > 0
        fail_msg: "Each repos[] item must have a non-empty 'path'."
      loop: "{{ repos }}"

  tasks:
    - name: "ansible/tasks/ans_content__changelog_assemble | Guarded execution with rescue and always handling"
      block:

        - name: Gather repo path stats (no symlink following)
          ansible.builtin.stat:
            path: "{{ item.path }}"
            follow: false
          loop: "{{ repos }}"
          register: repo_stats

        - name: Assert repo paths exist and are directories (and not symlinks)
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.isdir
              - not item.stat.islnk
            fail_msg: "Invalid repo path: {{ item.stat.path }} (must exist, be a directory, and not be a symlink)."
          loop: "{{ repo_stats.results }}"

        - name: Initialize bundle parts
          ansible.builtin.set_fact:
            bundle_parts: []

        - name: For each repo, pick a changelog file if present
          vars:
            repo_path: "{{ item.stat.path }}"
            candidate_files:
              - "{{ repo_path }}/CHANGELOG.md"
              - "{{ repo_path }}/CHANGELOG.rst"
              - "{{ repo_path }}/changelog.md"
          ansible.builtin.set_fact:
            selected_changelog: >-
              {{
                (candidate_files | select('fileglob') | select('ansible.builtin.file_exists') | list) | first
                if (candidate_files | select('fileglob') | select('ansible.builtin.file_exists') | list) | length > 0
                else None
              }}
          loop: "{{ repo_stats.results }}"
          loop_control:
            label: "{{ item.stat.path }}"
          register: chosen

        - name: Read and append changelog snippet (first 200 lines) or placeholder
          vars:
            repo_path: "{{ item.0.stat.path }}"
            chosen_path: "{{ item.1.ansible_facts.selected_changelog }}"
            header: "=== {{ (repo_path | basename) }} ===\n"
          block:
            - name: Slurp changelog
              when: chosen_path is not none
              ansible.builtin.slurp:
                path: "{{ chosen_path }}"
              register: sl

            - name: Add entry with snippet
              when: chosen_path is not none
              ansible.builtin.set_fact:
                bundle_parts: >-
                  {{
                    bundle_parts
                    + [
                        header
                        + ((sl.content | b64decode).splitlines()[0:200] | join('\n'))
                        + "\n\n"
                      ]
                  }}

            - name: Add placeholder when no changelog
              when: chosen_path is none
              ansible.builtin.set_fact:
                bundle_parts: "{{ bundle_parts + [ header + 'No changelog found\n\n' ] }}"
          loop: "{{ zip(repo_stats.results, chosen.results) | list }}"
          loop_control:
            label: "{{ item.0.stat.path }}"

        - name: Compose final bundle content
          ansible.builtin.set_fact:
            bundle_content: "{{ bundle_parts | join('') }}"

        - name: Write plan (always) with declared repos
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/changelog_plan.json"
            mode: "0640"
            owner: root
            group: root
            content: "{{ repos | to_nice_json }}"

        - name: Write changelogs bundle (only when applying)
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/changelogs_bundle.txt"
            mode: "0640"
            owner: root
            group: root
            backup: true
            content: "{{ bundle_content }}"

        - name: Show preview (dry run)
          when: not apply_changes | bool
          ansible.builtin.debug:
            msg: "{{ (bundle_content | truncate(1000, end='\\n[...truncated...]')) if bundle_content else 'No content gathered' }}"

        - name: Compute checksum
          when: apply_changes | bool
          ansible.builtin.stat:
            path: "{{ artifacts_dir }}/changelogs_bundle.txt"
            checksum_algorithm: sha256
          register: bundle_stat

        - name: Write checksum sidecar
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/changelogs_bundle.txt.sha256"
            mode: "0640"
            owner: root
            group: root
            content: "{{ bundle_stat.stat.checksum }}  changelogs_bundle.txt\n"

        - name: "ansible/tasks/ans_content__changelog_assemble | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_status: "failed"
            fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed: false
            fe_ansible_tasks_ans_content__changelog_assemble_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble: FAILED at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble failed at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}': {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__changelog_assemble_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__changelog_assemble":
                  component: "ansible/tasks/ans_content__changelog_assemble"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__changelog_assemble_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__changelog_assemble_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__changelog_assemble'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__changelog_assemble_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__changelog_assemble | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__changelog_assemble | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | bool
              - fe_ansible_tasks_ans_content__changelog_assemble_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__changelog_assemble: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__changelog_assemble_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__changelog_assemble: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__changelog_assemble | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed: true
            fe_ansible_tasks_ans_content__changelog_assemble_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_status: "failed"
            fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed: false
            fe_ansible_tasks_ans_content__changelog_assemble_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble: FAILED at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__changelog_assemble | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble failed at '{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task }}': {{ fe_ansible_tasks_ans_content__changelog_assemble_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__changelog_assemble_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__changelog_assemble":
                  component: "ansible/tasks/ans_content__changelog_assemble"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__changelog_assemble_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__changelog_assemble_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__changelog_assemble_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__changelog_assemble_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__changelog_assemble_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__changelog_assemble_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__changelog_assemble'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_content__changelog_assemble_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__changelog_assemble_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__changelog_assemble | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__changelog_assemble: {{ fe_ansible_tasks_ans_content__changelog_assemble_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_content__changelog_assemble_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
