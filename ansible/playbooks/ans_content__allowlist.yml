---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__allowlist.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    # Inputs (can be overridden via -e or inventory)
    allowlist: "{{ allowlist | default([]) }}"
    blocklist: "{{ blocklist | default([]) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__allowlist | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__allowlist | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__allowlist_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__allowlist_status: "running"
            fe_ansible_tasks_ans_content__allowlist_preflight_passed: false
            fe_ansible_tasks_ans_content__allowlist_postflight_passed: false
            fe_ansible_tasks_ans_content__allowlist_failed_task: ""
            fe_ansible_tasks_ans_content__allowlist_error: ""
            fe_ansible_tasks_ans_content__allowlist_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__allowlist: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__allowlist: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__allowlist | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__allowlist: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__allowlist: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__allowlist_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__allowlist | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_status: "preflight_failed"
            fe_ansible_tasks_ans_content__allowlist_postflight_passed: false
            fe_ansible_tasks_ans_content__allowlist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__allowlist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__allowlist: FAILED at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__allowlist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__allowlist":
                  component: "ansible/tasks/ans_content__allowlist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__allowlist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__allowlist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__allowlist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__allowlist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__allowlist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__allowlist'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__allowlist failed at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}': {{ fe_ansible_tasks_ans_content__allowlist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__allowlist | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__allowlist: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__allowlist_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_content__allowlist | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts directory (least privilege)
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0750"

        - name: Validate input types are lists
          ansible.builtin.assert:
            that:
              - allowlist is iterable
              - blocklist is iterable
            fail_msg: "allowlist and blocklist must be lists."

        - name: Optional schema check for collection names (namespace.collection)
          ansible.builtin.assert:
            that:
              - (allowlist | default([])) | difference(
                  (allowlist | select('match', '^[a-z0-9_]+\\.[a-z0-9_]+$') | list)
                ) | length == 0
              - (blocklist | default([])) | difference(
                  (blocklist | select('match', '^[a-z0-9_]+\\.[a-z0-9_]+$') | list)
                ) | length == 0
            fail_msg: "Items must match 'namespace.collection' (lowercase letters, digits, underscore)."
            quiet: true

        - name: Normalize inputs (dedupe + sort)
          ansible.builtin.set_fact:
            _allow_norm: "{{ (allowlist | unique | sort) | list }}"
            _block_norm: "{{ (blocklist | unique | sort) | list }}"

        - name: Prevent overlap between allow and block
          ansible.builtin.assert:
            that:
              - (_allow_norm | intersect(_block_norm)) | length == 0
            fail_msg: "An item cannot be in both allowlist and blocklist: {{ (_allow_norm | intersect(_block_norm)) | join(', ') }}"

        - name: "ansible/ans_content__allowlist | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_content__allowlist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__allowlist_status: "failed"
            fe_ansible_ans_content__allowlist_postflight_passed: false
            fe_ansible_ans_content__allowlist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_ans_content__allowlist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__allowlist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_content__allowlist: FAILED at '{{ fe_ansible_ans_content__allowlist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_ans_content__allowlist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__allowlist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/ans_content__allowlist failed at '{{ fe_ansible_ans_content__allowlist_failed_task }}': {{ fe_ansible_ans_content__allowlist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_content__allowlist | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__allowlist_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_content__allowlist_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_content__allowlist_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_content__allowlist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_content__allowlist":
                  component: "ansible/ans_content__allowlist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_ans_content__allowlist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_ans_content__allowlist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_ans_content__allowlist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_ans_content__allowlist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_ans_content__allowlist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_ans_content__allowlist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_ans_content__allowlist_failed_task | default('') }}"
                  error: "{{ fe_ansible_ans_content__allowlist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_ans_content__allowlist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_ans_content__allowlist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_ans_content__allowlist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_ans_content__allowlist_status | default('') == 'succeeded' else ['ansible/ans_content__allowlist'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_content__allowlist_status | default('') == 'failed'
            - not (fe_ansible_ans_content__allowlist_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_content__allowlist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__allowlist_stats_published: true
          when:
            - fe_ansible_ans_content__allowlist_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_content__allowlist | Guarded execution with rescue and always handling"
      block:

        - name: Build JSON payload
          ansible.builtin.set_fact:
            _allowblock_json: "{{ {'allow': _allow_norm, 'block': _block_norm} | to_nice_json }}"

        - name: Write allow/block lists JSON (fail closed unless apply_changes=true)
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/collections_allowblock.json"
            mode: "0640"
            owner: root
            group: root
            backup: true
            content: "{{ _allowblock_json }}"

        - name: Show planned JSON (dry-run output)  # visible even if apply_changes=false
          ansible.builtin.debug:
            msg: "{{ _allowblock_json }}"
          when: not apply_changes | bool

        - name: Compute checksum of JSON
          when: apply_changes | bool
          ansible.builtin.stat:
            path: "{{ artifacts_dir }}/collections_allowblock.json"
            checksum_algorithm: sha256
          register: _ab_stat

        - name: Write checksum sidecar
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/collections_allowblock.json.sha256"
            mode: "0640"
            owner: root
            group: root
            content: "{{ _ab_stat.stat.checksum }}  collections_allowblock.json\n"

        - name: "ansible/tasks/ans_content__allowlist | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_status: "failed"
            fe_ansible_tasks_ans_content__allowlist_postflight_passed: false
            fe_ansible_tasks_ans_content__allowlist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__allowlist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__allowlist: FAILED at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__allowlist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__allowlist failed at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}': {{ fe_ansible_tasks_ans_content__allowlist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__allowlist | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__allowlist_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__allowlist_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__allowlist":
                  component: "ansible/tasks/ans_content__allowlist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__allowlist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__allowlist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__allowlist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__allowlist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__allowlist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__allowlist'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__allowlist_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__allowlist_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__allowlist_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__allowlist | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__allowlist | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__allowlist_preflight_passed | bool
              - fe_ansible_tasks_ans_content__allowlist_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__allowlist: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__allowlist_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__allowlist_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__allowlist: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__allowlist | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_postflight_passed: true
            fe_ansible_tasks_ans_content__allowlist_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_status: "failed"
            fe_ansible_tasks_ans_content__allowlist_postflight_passed: false
            fe_ansible_tasks_ans_content__allowlist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__allowlist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__allowlist: FAILED at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__allowlist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__allowlist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__allowlist failed at '{{ fe_ansible_tasks_ans_content__allowlist_failed_task }}': {{ fe_ansible_tasks_ans_content__allowlist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__allowlist | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__allowlist_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__allowlist_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__allowlist":
                  component: "ansible/tasks/ans_content__allowlist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__allowlist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__allowlist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__allowlist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__allowlist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__allowlist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__allowlist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__allowlist_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__allowlist'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_content__allowlist_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__allowlist_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__allowlist | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__allowlist: {{ fe_ansible_tasks_ans_content__allowlist_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_content__allowlist_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
