---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__sync_and_sign.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    ah_url: "{{ ah_url | default('https://pah.example.mil') }}"
    ah_username: "{{ ah_username | default('admin') }}"
    ah_password: "{{ ah_password | default('') }}"
    validate_certs: "{{ validate_certs | default(true) }}"

    # Expect:
    # repos:
    #   - name: community
    #     promote_to: "org/pah/community"   # (optional) distribution base_path
    #     sync: true                        # default: true
    # signing_service:
    #   name: ""                            # OPTIONAL – refuse unless properly implemented
    repos: "{{ repos | default([]) }}"
    signing_service: "{{ signing_service | default({}) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__sync_and_sign | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__sync_and_sign | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sync_and_sign_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__sync_and_sign_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__sync_and_sign_status: "running"
            fe_ansible_tasks_ans_content__sync_and_sign_preflight_passed: false
            fe_ansible_tasks_ans_content__sync_and_sign_postflight_passed: false
            fe_ansible_tasks_ans_content__sync_and_sign_failed_task: ""
            fe_ansible_tasks_ans_content__sync_and_sign_error: ""
            fe_ansible_tasks_ans_content__sync_and_sign_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__sync_and_sign | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__sync_and_sign: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__sync_and_sign: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__sync_and_sign | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__sync_and_sign: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__sync_and_sign: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__sync_and_sign_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__sync_and_sign | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sync_and_sign_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sync_and_sign_status: "preflight_failed"
            fe_ansible_tasks_ans_content__sync_and_sign_postflight_passed: false
            fe_ansible_tasks_ans_content__sync_and_sign_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__sync_and_sign_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sync_and_sign: FAILED at '{{ fe_ansible_tasks_ans_content__sync_and_sign_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__sync_and_sign_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sync_and_sign | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__sync_and_sign":
                  component: "ansible/tasks/ans_content__sync_and_sign"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__sync_and_sign_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__sync_and_sign_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__sync_and_sign_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__sync_and_sign_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__sync_and_sign_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__sync_and_sign_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__sync_and_sign_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__sync_and_sign_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__sync_and_sign_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__sync_and_sign_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__sync_and_sign_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__sync_and_sign_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__sync_and_sign'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__sync_and_sign | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sync_and_sign_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__sync_and_sign failed at '{{ fe_ansible_tasks_ans_content__sync_and_sign_failed_task }}': {{ fe_ansible_tasks_ans_content__sync_and_sign_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__sync_and_sign | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sync_and_sign: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__sync_and_sign_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_content__sync_and_sign | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts dir (least privilege - fourth estate compliant)
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0750"
            owner: "{{ ansible_user_id }}"
            group: "{{ ansible_user_gid }}"

        - name: Validate inputs
          ansible.builtin.assert:
            that:
              - repos is iterable
              - repos | length > 0
              - repos | map(attribute='name') | select('string') | list | length == (repos | length)
            fail_msg: "Provide repos as a list of dicts with 'name' (string) and optional 'promote_to' (string)."

        - name: Write plan (no secrets)
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/sync_sign_plan.json"
            mode: "0640"
            content: "{{ {'repos': repos, 'signing_service': (signing_service | combine({'secret':'<redacted>'}, recursive=True)) } | to_nice_json }}"

        - name: "ansible/ans_content__sync_and_sign | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_content__sync_and_sign | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__sync_and_sign_status: "failed"
            fe_ansible_ans_content__sync_and_sign_postflight_passed: false
            fe_ansible_ans_content__sync_and_sign_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_ans_content__sync_and_sign_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__sync_and_sign | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_content__sync_and_sign: FAILED at '{{ fe_ansible_ans_content__sync_and_sign_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_ans_content__sync_and_sign_error }}
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__sync_and_sign | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/ans_content__sync_and_sign failed at '{{ fe_ansible_ans_content__sync_and_sign_failed_task }}': {{ fe_ansible_ans_content__sync_and_sign_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_content__sync_and_sign | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__sync_and_sign_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_content__sync_and_sign_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_content__sync_and_sign_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_content__sync_and_sign | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_content__sync_and_sign":
                  component: "ansible/ans_content__sync_and_sign"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_ans_content__sync_and_sign_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_ans_content__sync_and_sign_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_ans_content__sync_and_sign_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_ans_content__sync_and_sign_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_ans_content__sync_and_sign_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_ans_content__sync_and_sign_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_ans_content__sync_and_sign_failed_task | default('') }}"
                  error: "{{ fe_ansible_ans_content__sync_and_sign_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_ans_content__sync_and_sign_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_ans_content__sync_and_sign_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_ans_content__sync_and_sign_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_ans_content__sync_and_sign_status | default('') == 'succeeded' else ['ansible/ans_content__sync_and_sign'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_content__sync_and_sign_status | default('') == 'failed'
            - not (fe_ansible_ans_content__sync_and_sign_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_content__sync_and_sign | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__sync_and_sign_stats_published: true
          when:
            - fe_ansible_ans_content__sync_and_sign_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_content__sync_and_sign | Guarded execution with rescue and always handling"
      block:

        - name: Helper | function to poll a Pulp task URL until finished
          vars:
            _dummy: ""
          ansible.builtin.set_fact:
            __poll_task_defined: true
          no_log: true

        - name: Sync/Publish/Promote per repo (PAH/Pulp API)
          when: apply_changes | bool
          no_log: true   # protect creds and responses
          block:
            - name: Initialize result list
              ansible.builtin.set_fact:
                _results: []

            - name: Process repo {{ item.name }}
              vars:
                _repo_name: "{{ item.name }}"
                _promote_to: "{{ item.promote_to | default(omit) }}"
                _do_sync: "{{ item.sync | default(true) | bool }}"
                _headers:
                  Content-Type: application/json
              block:
                # ---------- LOOKUP REPOSITORY ----------
                - name: Lookup repository by name
                  ansible.builtin.uri:
                    url: "{{ ah_url }}/pulp/api/v3/repositories/ansible/ansible/?name={{ _repo_name | urlencode }}"
                    method: GET
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: repo_q
                  changed_when: false

                - name: Assert repository exists
                  ansible.builtin.assert:
                    that:
                      - (repo_q.json.count | default(0)) | int > 0
                    fail_msg: "Repository '{{ _repo_name }}' not found in PAH."
                - name: Set repo href
                  ansible.builtin.set_fact:
                    _repo_href: "{{ repo_q.json.results[0].pulp_href }}"

                # ---------- SYNC (OPTIONAL) ----------
                - name: Trigger sync from remote (if enabled)
                  when: _do_sync
                  ansible.builtin.uri:
                    url: "{{ _repo_href }}sync/"
                    method: POST
                    headers: "{{ _headers }}"
                    body_format: json
                    body: {}
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: sync_task

                - name: Wait for sync task
                  when: _do_sync
                  ansible.builtin.uri:
                    url: "{{ sync_task.json.task }}"
                    method: GET
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: sync_status
                  retries: 120
                  delay: 5
                  until: sync_status.json.state in ['completed', 'failed', 'canceled']
                  changed_when: false

                - name: Fail if sync failed
                  when: _do_sync and sync_status.json.state != 'completed'
                  ansible.builtin.fail:
                    msg: "Sync failed for {{ _repo_name }}: {{ sync_status.json.error | default('unknown error') }}"

                # ---------- CREATE PUBLICATION ----------
                - name: Get latest repository version
                  ansible.builtin.uri:
                    url: "{{ _repo_href }}versions/?limit=1&offset=0&ordering=-number"
                    method: GET
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: rv_q
                  changed_when: false

                - name: Assert version exists
                  ansible.builtin.assert:
                    that:
                      - (rv_q.json.count | default(0)) | int > 0
                    fail_msg: "No repository version found for {{ _repo_name }} (did you sync or upload content?)."

                - name: Create publication for latest version
                  ansible.builtin.uri:
                    url: "{{ ah_url }}/pulp/api/v3/publications/ansible/ansible/"
                    method: POST
                    headers: "{{ _headers }}"
                    body_format: json
                    body:
                      repository_version: "{{ rv_q.json.results[0].pulp_href }}"
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: pub_task

                - name: Wait for publication task
                  ansible.builtin.uri:
                    url: "{{ pub_task.json.task }}"
                    method: GET
                    force_basic_auth: true
                    url_username: "{{ ah_username }}"
                    url_password: "{{ ah_password }}"
                    validate_certs: "{{ validate_certs | bool }}"
                  register: pub_status
                  retries: 120
                  delay: 5
                  until: pub_status.json.state in ['completed', 'failed', 'canceled']
                  changed_when: false

                - name: Fail if publication failed
                  when: pub_status.json.state != 'completed'
                  ansible.builtin.fail:
                    msg: "Publication failed for {{ _repo_name }}: {{ pub_status.json.error | default('unknown error') }}"

                - name: Capture publication href
                  ansible.builtin.set_fact:
                    _publication_href: "{{ pub_status.json.created_resources[0] | default('') }}"

                # ---------- (OPTIONAL) SIGNING ----------
                - name: Refuse to sign unless a vetted signing implementation is wired
                  when: signing_service is mapping and (signing_service.name | default('')) | length > 0
                  ansible.builtin.fail:
                    msg: >-
                      Signing requested (service='{{ signing_service.name }}') but no approved signing workflow is
                      implemented here. Provide your PAH signing service details/KMS flow and I will implement it
                      (with no_log, cert pinning, and task polling).

                # ---------- PROMOTE (DISTRIBUTION UPDATE) ----------
                - name: Promote by updating distribution (when promote_to provided)
                  when: _promote_to is string
                  block:
                    - name: Lookup distribution by base_path
                      ansible.builtin.uri:
                        url: "{{ ah_url }}/pulp/api/v3/distributions/ansible/ansible/?base_path={{ _promote_to | urlencode }}"
                        method: GET
                        force_basic_auth: true
                        url_username: "{{ ah_username }}"
                        url_password: "{{ ah_password }}"
                        validate_certs: "{{ validate_certs | bool }}"
                      register: dist_q
                      changed_when: false

                    - name: Ensure distribution exists (create if missing)
                      when: (dist_q.json.count | default(0)) | int == 0
                      ansible.builtin.uri:
                        url: "{{ ah_url }}/pulp/api/v3/distributions/ansible/ansible/"
                        method: POST
                        headers: "{{ _headers }}"
                        body_format: json
                        body:
                          name: "{{ _repo_name }}"
                          base_path: "{{ _promote_to }}"
                          publication: "{{ _publication_href }}"
                        force_basic_auth: true
                        url_username: "{{ ah_username }}"
                        url_password: "{{ ah_password }}"
                        validate_certs: "{{ validate_certs | bool }}"
                      register: dist_task_create

                    - name: Update existing distribution to new publication
                      when: (dist_q.json.count | default(0)) | int > 0
                      ansible.builtin.uri:
                        url: "{{ dist_q.json.results[0].pulp_href }}"
                        method: PATCH
                        headers: "{{ _headers }}"
                        body_format: json
                        body:
                          publication: "{{ _publication_href }}"
                        force_basic_auth: true
                        url_username: "{{ ah_username }}"
                        url_password: "{{ ah_password }}"
                        validate_certs: "{{ validate_certs | bool }}"
                      register: dist_task_patch

                    - name: Wait for distribution task (create/patch)
                      ansible.builtin.uri:
                        url: "{{ (dist_task_create.json.task if dist_task_create is defined else dist_task_patch.json.task) }}"
                        method: GET
                        force_basic_auth: true
                        url_username: "{{ ah_username }}"
                        url_password: "{{ ah_password }}"
                        validate_certs: "{{ validate_certs | bool }}"
                      register: dist_status
                      retries: 120
                      delay: 5
                      until: dist_status.json.state in ['completed', 'failed', 'canceled']
                      changed_when: false

                    - name: Fail if distribution operation failed
                      when: dist_status.json.state != 'completed'
                      ansible.builtin.fail:
                        msg: "Distribution update failed for {{ _repo_name }} -> {{ _promote_to }}"

                # ---------- COLLECT RESULT ----------
                - name: Append result
                  ansible.builtin.set_fact:
                    _results: >-
                      {{ _results + [ {
                          'name': _repo_name,
                          'synced': _do_sync,
                          'publication': _publication_href,
                          'promoted_to': (_promote_to | default(None))
                        } ] }}

              loop: "{{ repos }}"
              loop_control:
                label: "{{ item.name }}"

            - name: Write summary (JSON)
              no_log: false
              ansible.builtin.copy:
                dest: "{{ artifacts_dir }}/sync_sign_summary.json"
                mode: "0640"
                content: "{{ _results | to_nice_json }}"

            - name: Checksum summary
              no_log: false
              ansible.builtin.stat:
                path: "{{ artifacts_dir }}/sync_sign_summary.json"
                checksum_algorithm: sha256
              register: sum
              changed_when: false

            - name: Write checksum sidecar
              no_log: false
              ansible.builtin.copy:
                dest: "{{ artifacts_dir }}/sync_sign_summary.json.sha256"
                mode: "0640"
                content: "{{ sum.stat.checksum }}  sync_sign_summary.json\n"

        - name: Dry-run note
          when: not apply_changes | bool
          ansible.builtin.debug:
            msg: "apply_changes=false → planned only; no sync/publish/promote actions executed."

        - name: "ansible/tasks/ans_content__sync_and_sign | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sync_and_sign_status: "failed"
            fe_ansible_tasks_ans_content__sync_and_sign_postflight_passed: false
            fe_ansible_tasks_ans_content__sync_and_sign_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__sync_and_sign_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sync_and_sign: FAILED at '{{ fe_ansible_tasks_ans_content__sync_and_sign_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__sync_and_sign_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sync_and_sign | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__sync_and_sign failed at '{{ fe_ansible_tasks_ans_content__sync_and_sign_failed_task }}': {{ fe_ansible_tasks_ans_content__sync_and_sign_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

