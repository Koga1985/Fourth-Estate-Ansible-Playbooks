---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__pah_bootstrap.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    # Private Automation Hub inputs
    ah_url: "{{ ah_url | default('https://pah.example.mil') }}"
    ah_username: "{{ ah_username | default('admin') }}"
    ah_password: "{{ ah_password | default('') }}"
    validate_certs: "{{ validate_certs | default(true) }}"

    # Optional bootstrap data (only planned here)
    sso: "{{ sso | default({}) }}"
    groups: "{{ groups | default([]) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__pah_bootstrap | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_status: "running"
            fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed: false
            fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed: false
            fe_ansible_tasks_ans_content__pah_bootstrap_failed_task: ""
            fe_ansible_tasks_ans_content__pah_bootstrap_error: ""
            fe_ansible_tasks_ans_content__pah_bootstrap_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__pah_bootstrap: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__pah_bootstrap: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__pah_bootstrap | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__pah_bootstrap: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__pah_bootstrap: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__pah_bootstrap | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_status: "preflight_failed"
            fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed: false
            fe_ansible_tasks_ans_content__pah_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap: FAILED at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__pah_bootstrap":
                  component: "ansible/tasks/ans_content__pah_bootstrap"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__pah_bootstrap'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap failed at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}': {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_content__pah_bootstrap | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts directory (least privilege)
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0750"

        - name: Validate inputs
          ansible.builtin.assert:
            that:
              - ah_url is string
              - ah_url | length > 0
              - groups is iterable
              - sso is mapping
            fail_msg: "Invalid inputs: ensure ah_url string, groups list, sso mapping."

        - name: Write PAH bootstrap plan (no secrets)
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/pah_bootstrap_plan.json"
            mode: "0640"
            content: "{{ {'url': ah_url, 'sso': sso, 'groups': groups} | to_nice_json }}"

        - name: "ansible/ans_content__pah_bootstrap | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_content__pah_bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__pah_bootstrap_status: "failed"
            fe_ansible_ans_content__pah_bootstrap_postflight_passed: false
            fe_ansible_ans_content__pah_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_ans_content__pah_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__pah_bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_content__pah_bootstrap: FAILED at '{{ fe_ansible_ans_content__pah_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_ans_content__pah_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__pah_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/ans_content__pah_bootstrap failed at '{{ fe_ansible_ans_content__pah_bootstrap_failed_task }}': {{ fe_ansible_ans_content__pah_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_content__pah_bootstrap | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__pah_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_content__pah_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_content__pah_bootstrap_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_content__pah_bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_content__pah_bootstrap":
                  component: "ansible/ans_content__pah_bootstrap"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_ans_content__pah_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_ans_content__pah_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_ans_content__pah_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_ans_content__pah_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_ans_content__pah_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_ans_content__pah_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_ansible_ans_content__pah_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_ans_content__pah_bootstrap_status | default('') == 'succeeded' else ['ansible/ans_content__pah_bootstrap'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_content__pah_bootstrap_status | default('') == 'failed'
            - not (fe_ansible_ans_content__pah_bootstrap_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_content__pah_bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__pah_bootstrap_stats_published: true
          when:
            - fe_ansible_ans_content__pah_bootstrap_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_content__pah_bootstrap | Guarded execution with rescue and always handling"
      block:

        - name: Initialize status holder
          ansible.builtin.set_fact:
            _pah_status: {}

        - name: Probe PAH status (primary path)
          when: apply_changes | bool
          no_log: true  # protect creds in stdout/stderr and registered vars
          block:
            - name: GET {{ ah_url }}/pulp/api/v3/status/
              ansible.builtin.uri:
                url: "{{ ah_url }}/pulp/api/v3/status/"
                method: GET
                return_content: true
                force_basic_auth: true
                url_username: "{{ ah_username }}"
                url_password: "{{ ah_password }}"
                validate_certs: "{{ validate_certs | bool }}"
                status_code: 200
                timeout: 30
              register: pah_status_primary
              changed_when: false

          rescue:
            - name: Fallback to galaxy-prefixed path
              ansible.builtin.uri:
                url: "{{ ah_url }}/api/galaxy/pulp/api/v3/status/"
                method: GET
                return_content: true
                force_basic_auth: true
                url_username: "{{ ah_username }}"
                url_password: "{{ ah_password }}"
                validate_certs: "{{ validate_certs | bool }}"
                status_code: 200
                timeout: 30
              register: pah_status_fallback
              changed_when: false

        - name: Consolidate PAH status
          when: apply_changes | bool
          ansible.builtin.set_fact:
            _pah_status: >-
              {{
                (
                  pah_status_primary.json
                  if (pah_status_primary is defined and pah_status_primary.status == 200)
                  else (pah_status_fallback.json
                        if (pah_status_fallback is defined and pah_status_fallback.status == 200)
                        else {'ok': false}
                  )
                )
              }}

        - name: Write PAH status artifact
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/pah_status.json"
            mode: "0640"
            content: "{{ (_pah_status if apply_changes | bool else {'ok': false, 'note': 'apply_changes=false'}) | to_nice_json }}"

        - name: Compute checksum of status artifact
          ansible.builtin.stat:
            path: "{{ artifacts_dir }}/pah_status.json"
            checksum_algorithm: sha256
          register: pah_status_stat
          changed_when: false

        - name: Write checksum sidecar
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/pah_status.json.sha256"
            mode: "0640"
            content: "{{ pah_status_stat.stat.checksum }}  pah_status.json\n"

        - name: "ansible/tasks/ans_content__pah_bootstrap | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_status: "failed"
            fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed: false
            fe_ansible_tasks_ans_content__pah_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap: FAILED at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap failed at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}': {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__pah_bootstrap_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__pah_bootstrap":
                  component: "ansible/tasks/ans_content__pah_bootstrap"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__pah_bootstrap'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__pah_bootstrap_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__pah_bootstrap | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | bool
              - fe_ansible_tasks_ans_content__pah_bootstrap_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__pah_bootstrap: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__pah_bootstrap_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__pah_bootstrap: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__pah_bootstrap | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed: true
            fe_ansible_tasks_ans_content__pah_bootstrap_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_status: "failed"
            fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed: false
            fe_ansible_tasks_ans_content__pah_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap: FAILED at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__pah_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap failed at '{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task }}': {{ fe_ansible_tasks_ans_content__pah_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__pah_bootstrap_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__pah_bootstrap":
                  component: "ansible/tasks/ans_content__pah_bootstrap"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__pah_bootstrap_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__pah_bootstrap'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_content__pah_bootstrap_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__pah_bootstrap_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__pah_bootstrap | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__pah_bootstrap: {{ fe_ansible_tasks_ans_content__pah_bootstrap_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_content__pah_bootstrap_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always

