---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__lint_molecule.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    # Expect: repos=[{"path":"/path/to/repo1"},{"path":"./role_foo"}]
    repos: "{{ repos | default([]) }}"
    fail_on_error: "{{ fail_on_error | default(true) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__lint_molecule | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__lint_molecule | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__lint_molecule_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__lint_molecule_status: "running"
            fe_ansible_tasks_ans_content__lint_molecule_preflight_passed: false
            fe_ansible_tasks_ans_content__lint_molecule_postflight_passed: false
            fe_ansible_tasks_ans_content__lint_molecule_failed_task: ""
            fe_ansible_tasks_ans_content__lint_molecule_error: ""
            fe_ansible_tasks_ans_content__lint_molecule_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__lint_molecule | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__lint_molecule: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__lint_molecule: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__lint_molecule | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__lint_molecule: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__lint_molecule: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__lint_molecule_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__lint_molecule | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_status: "preflight_failed"
            fe_ansible_tasks_ans_content__lint_molecule_postflight_passed: false
            fe_ansible_tasks_ans_content__lint_molecule_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__lint_molecule_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__lint_molecule: FAILED at '{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__lint_molecule_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__lint_molecule":
                  component: "ansible/tasks/ans_content__lint_molecule"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__lint_molecule_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__lint_molecule_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__lint_molecule_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__lint_molecule_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__lint_molecule_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__lint_molecule_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__lint_molecule'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__lint_molecule failed at '{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task }}': {{ fe_ansible_tasks_ans_content__lint_molecule_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__lint_molecule: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__lint_molecule_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_content__lint_molecule | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts directory (least privilege)
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0750"

        - name: Validate repos is a list with path keys
          ansible.builtin.assert:
            that:
              - repos is iterable
              - repos | length > 0
              - repos | map(attribute='path') | select('string') | list | length == (repos | length)
            fail_msg: "Provide repos as a list of dicts with a 'path' string, e.g., repos=[{'path':'/repo1'}]."

        - name: "ansible/ans_content__lint_molecule | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_content__lint_molecule | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__lint_molecule_status: "failed"
            fe_ansible_ans_content__lint_molecule_postflight_passed: false
            fe_ansible_ans_content__lint_molecule_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_ans_content__lint_molecule_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__lint_molecule | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_content__lint_molecule: FAILED at '{{ fe_ansible_ans_content__lint_molecule_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_ans_content__lint_molecule_error }}
          tags:
            - always
            - rescue

        - name: "ansible/ans_content__lint_molecule | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/ans_content__lint_molecule failed at '{{ fe_ansible_ans_content__lint_molecule_failed_task }}': {{ fe_ansible_ans_content__lint_molecule_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_content__lint_molecule | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__lint_molecule_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_content__lint_molecule_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_content__lint_molecule_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_content__lint_molecule | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_content__lint_molecule":
                  component: "ansible/ans_content__lint_molecule"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_ans_content__lint_molecule_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_ans_content__lint_molecule_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_ans_content__lint_molecule_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_ans_content__lint_molecule_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_ans_content__lint_molecule_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_ans_content__lint_molecule_failed_task | default('') }}"
                  error: "{{ fe_ansible_ans_content__lint_molecule_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_ans_content__lint_molecule_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_ans_content__lint_molecule_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_ans_content__lint_molecule_status | default('') == 'succeeded' else ['ansible/ans_content__lint_molecule'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_content__lint_molecule_status | default('') == 'failed'
            - not (fe_ansible_ans_content__lint_molecule_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_content__lint_molecule | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_content__lint_molecule_stats_published: true
          when:
            - fe_ansible_ans_content__lint_molecule_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_content__lint_molecule | Guarded execution with rescue and always handling"
      block:

        - name: Stat each repo (no symlink follow)
          ansible.builtin.stat:
            path: "{{ item.path }}"
            follow: false
          loop: "{{ repos }}"
          register: repo_stats

        - name: Assert each repo exists, is a directory, not a symlink
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.isdir
              - not item.stat.islnk
            fail_msg: "Invalid repo path: {{ item.stat.path }} (must exist, be a directory, and not a symlink)."
          loop: "{{ repo_stats.results }}"

        - name: Write plan (always)
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/lint_molecule_plan.json"
            mode: "0640"
            content: "{{ repos | to_nice_json }}"

        - name: Check for ansible-lint presence
          ansible.builtin.command: ansible-lint --version
          register: lint_ver
          changed_when: false
          failed_when: false

        - name: Check for molecule presence
          ansible.builtin.command: molecule --version
          register: mol_ver
          changed_when: false
          failed_when: false

        - name: Initialize results
          ansible.builtin.set_fact:
            lm_results: []

        - name: Lint + Molecule per repo
          when: apply_changes | bool
          vars:
            repo_path: "{{ item.stat.path }}"
          block:
            - name: Determine if repo has molecule/default scenario
              ansible.builtin.stat:
                path: "{{ repo_path }}/molecule/default/molecule.yml"
                follow: false
              register: has_molecule

            - name: Run ansible-lint
              ansible.builtin.command:
                cmd: ansible-lint -q
                chdir: "{{ repo_path }}"
              register: lint_run
              changed_when: false
              failed_when: false

            - name: Run molecule test (if scenario exists and molecule installed)
              when: has_molecule.stat.exists and mol_ver.rc == 0
              ansible.builtin.command:
                cmd: molecule test
                chdir: "{{ repo_path }}"
              register: mol_run
              changed_when: false
              failed_when: false

            - name: Append result for this repo
              ansible.builtin.set_fact:
                lm_results: >-
                  {{ lm_results + [ {
                      'path': repo_path,
                      'ansible_lint': {
                        'rc': lint_run.rc | default(127),
                        'stdout': (lint_run.stdout | default(''))[:2000],
                        'stderr': (lint_run.stderr | default(''))[:2000]
                      },
                      'molecule': {
                        'skipped': (not has_molecule.stat.exists) or (mol_ver.rc != 0),
                        'rc': (mol_run.rc | default(0)) if (has_molecule.stat.exists and mol_ver.rc == 0) else None,
                        'stdout': (mol_run.stdout | default(''))[:2000] if (has_molecule.stat.exists and mol_ver.rc == 0) else '',
                        'stderr': (mol_run.stderr | default(''))[:2000] if (has_molecule.stat.exists and mol_ver.rc == 0) else ''
                      }
                    } ] }}

          loop: "{{ repo_stats.results }}"
          loop_control:
            label: "{{ item.stat.path }}"

        - name: Write JSON summary
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/lint_molecule_summary.json"
            mode: "0640"
            content: "{{ lm_results | to_nice_json }}"

        - name: Write text summary
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/lint_molecule_summary.txt"
            mode: "0640"
            content: |
              Ansible-lint & Molecule summary
              {{ 'ansible-lint: ' ~ (lint_ver.stdout | default('not found')) }}
              {{ 'molecule: ' ~ (mol_ver.stdout | default('not found')) }}

              {% for r in lm_results %}
              === {{ r.path }} ===
              ansible-lint: rc={{ r.ansible_lint.rc }} {{ 'OK' if r.ansible_lint.rc == 0 else 'FAIL' }}
              molecule: {% if r.molecule.skipped %}SKIPPED{% else %}rc={{ r.molecule.rc }} {{ 'OK' if r.molecule.rc == 0 else 'FAIL' }}{% endif %}
              {% endfor %}

        - name: Compute checksum for JSON
          when: apply_changes | bool
          ansible.builtin.stat:
            path: "{{ artifacts_dir }}/lint_molecule_summary.json"
            checksum_algorithm: sha256
          register: sum_json

        - name: Write checksum sidecar
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/lint_molecule_summary.json.sha256"
            mode: "0640"
            content: "{{ sum_json.stat.checksum }}  lint_molecule_summary.json\n"

        - name: Optionally fail the play if any repo failed
          when: apply_changes | bool and fail_on_error | bool
          ansible.builtin.assert:
            that:
              - lm_results | selectattr('ansible_lint.rc','eq',0) | list | length == (lm_results | length)
              - lm_results | selectattr('molecule.skipped','equalto',True) | list | length
                + (lm_results | selectattr('molecule.rc','defined') | selectattr('molecule.rc','eq',0) | list | length)
                == (lm_results | length)
            fail_msg: "One or more repos failed lint or molecule. See {{ artifacts_dir }}/lint_molecule_summary.json"

        - name: "ansible/tasks/ans_content__lint_molecule | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_status: "failed"
            fe_ansible_tasks_ans_content__lint_molecule_postflight_passed: false
            fe_ansible_tasks_ans_content__lint_molecule_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__lint_molecule_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__lint_molecule: FAILED at '{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__lint_molecule_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__lint_molecule failed at '{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task }}': {{ fe_ansible_tasks_ans_content__lint_molecule_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__lint_molecule_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__lint_molecule_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__lint_molecule":
                  component: "ansible/tasks/ans_content__lint_molecule"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__lint_molecule_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__lint_molecule_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__lint_molecule_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__lint_molecule_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__lint_molecule_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__lint_molecule_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__lint_molecule_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__lint_molecule_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__lint_molecule'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__lint_molecule_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__lint_molecule | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__lint_molecule_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__lint_molecule | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__lint_molecule | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__lint_molecule_preflight_passed | bool
              - fe_ansible_tasks_ans_content__lint_molecule_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__lint_molecule: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__lint_molecule_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__lint_molecule_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__lint_molecule: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__lint_molecule | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_postflight_passed: true
            fe_ansible_tasks_ans_content__lint_molecule_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__lint_molecule_status: "failed"
            fe_ansible_tasks_ans_content__lint_molecule_postflight_passed: false
            fe_ansible_tasks_ans_content__lint_molecule_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__lint_molecule_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__lint_molecule | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
