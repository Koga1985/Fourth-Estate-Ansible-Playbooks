---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_perf__ssh_controlpersist.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-core-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    ssh_config_path: "{{ ssh_config_path | default('~/.ssh/config') }}"
    control_path: "{{ control_path | default('~/.ssh/ansible-%r@%h:%p') }}"
    control_persist: "{{ control_persist | default('600s') }}"
  pre_tasks:
    - name: "ansible/tasks/ans_perf__ssh_controlpersist | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_status: "running"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed: false
            fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed: false
            fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task: ""
            fe_ansible_tasks_ans_perf__ssh_controlpersist_error: ""
            fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_perf__ssh_controlpersist: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_perf__ssh_controlpersist: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_status: "preflight_failed"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed: false
            fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: FAILED at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_perf__ssh_controlpersist":
                  component: "ansible/tasks/ans_perf__ssh_controlpersist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else ['ansible/tasks/ans_perf__ssh_controlpersist'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist failed at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}': {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: preflight
              {{ 'passed' if fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: "ansible/tasks/ans_perf__ssh_controlpersist | Guarded execution with rescue and always handling"
      block:

        - name: Plan SSH multiplexing
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/ssh_multiplex_plan.json"
            mode: "0644"
            content: "{{ {'config': ssh_config_path, 'control_path': control_path, 'persist': control_persist} | to_nice_json }}"

        - name: Ensure SSH config directory
          when: apply_changes | bool
          ansible.builtin.file:
            path: "{{ ssh_config_path | dirname }}"
            state: directory
            mode: "0700"

        - name: Configure SSH multiplexing
          when: apply_changes | bool
          ansible.builtin.blockinfile:
            path: "{{ ssh_config_path }}"
            mode: "0600"
            create: true
            block: |
              Host *
                ControlMaster auto
                ControlPersist {{ control_persist }}
                ControlPath {{ control_path }}
                ServerAliveInterval 30
                ServerAliveCountMax 10

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_status: "failed"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed: false
            fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: FAILED at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist failed at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}': {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_perf__ssh_controlpersist_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_perf__ssh_controlpersist":
                  component: "ansible/tasks/ans_perf__ssh_controlpersist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else ['ansible/tasks/ans_perf__ssh_controlpersist'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published: true
          when:
            - fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_perf__ssh_controlpersist | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | bool
              - fe_ansible_tasks_ans_perf__ssh_controlpersist_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_perf__ssh_controlpersist: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed: true
            fe_ansible_tasks_ans_perf__ssh_controlpersist_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_status: "failed"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed: false
            fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: FAILED at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist failed at '{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task }}': {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_perf__ssh_controlpersist_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_perf__ssh_controlpersist":
                  component: "ansible/tasks/ans_perf__ssh_controlpersist"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('') == 'succeeded' else ['ansible/tasks/ans_perf__ssh_controlpersist'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__ssh_controlpersist_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_perf__ssh_controlpersist | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__ssh_controlpersist: {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_perf__ssh_controlpersist_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
