---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_core__fact_caching.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-core-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    ansible_cfg_path: "{{ ansible_cfg_path | default('.ansible.cfg') }}"
    cache_backend: "{{ cache_backend | default('redis') }}"
    cache_connection: "{{ cache_connection | default('redis://localhost:6379/0') }}"
    cache_ttl: "{{ cache_ttl | default(86400) }}"
  pre_tasks:
    - name: "ansible/tasks/ans_core__fact_caching | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_core__fact_caching | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_core__fact_caching_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_core__fact_caching_status: "running"
            fe_ansible_tasks_ans_core__fact_caching_preflight_passed: false
            fe_ansible_tasks_ans_core__fact_caching_postflight_passed: false
            fe_ansible_tasks_ans_core__fact_caching_failed_task: ""
            fe_ansible_tasks_ans_core__fact_caching_error: ""
            fe_ansible_tasks_ans_core__fact_caching_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_core__fact_caching: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_core__fact_caching: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_core__fact_caching | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_core__fact_caching: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_core__fact_caching: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_core__fact_caching_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_core__fact_caching | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_status: "preflight_failed"
            fe_ansible_tasks_ans_core__fact_caching_postflight_passed: false
            fe_ansible_tasks_ans_core__fact_caching_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_core__fact_caching_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_core__fact_caching: FAILED at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_core__fact_caching":
                  component: "ansible/tasks/ans_core__fact_caching"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_core__fact_caching_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_core__fact_caching_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_core__fact_caching_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_core__fact_caching_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_core__fact_caching_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else ['ansible/tasks/ans_core__fact_caching'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_core__fact_caching failed at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}': {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_core__fact_caching | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_core__fact_caching: preflight
              {{ 'passed' if fe_ansible_tasks_ans_core__fact_caching_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_core__fact_caching | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts directory
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0755"

        - name: "ansible/ans_core__fact_caching | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_core__fact_caching | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_ans_core__fact_caching_status: "failed"
            fe_ansible_ans_core__fact_caching_postflight_passed: false
            fe_ansible_ans_core__fact_caching_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_ans_core__fact_caching_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_core__fact_caching | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_core__fact_caching: FAILED at '{{ fe_ansible_ans_core__fact_caching_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_ans_core__fact_caching_error }}
          tags:
            - always
            - rescue

        - name: "ansible/ans_core__fact_caching | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/ans_core__fact_caching failed at '{{ fe_ansible_ans_core__fact_caching_failed_task }}': {{ fe_ansible_ans_core__fact_caching_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_core__fact_caching | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_core__fact_caching_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_core__fact_caching_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_core__fact_caching_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_core__fact_caching | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_core__fact_caching":
                  component: "ansible/ans_core__fact_caching"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_ans_core__fact_caching_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_ans_core__fact_caching_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_ans_core__fact_caching_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_ans_core__fact_caching_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_ans_core__fact_caching_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_ans_core__fact_caching_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_ans_core__fact_caching_failed_task | default('') }}"
                  error: "{{ fe_ansible_ans_core__fact_caching_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_ans_core__fact_caching_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_ans_core__fact_caching_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_ans_core__fact_caching_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_ans_core__fact_caching_status | default('') == 'succeeded' else ['ansible/ans_core__fact_caching'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_core__fact_caching_status | default('') == 'failed'
            - not (fe_ansible_ans_core__fact_caching_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_core__fact_caching | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_core__fact_caching_stats_published: true
          when:
            - fe_ansible_ans_core__fact_caching_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_core__fact_caching | Guarded execution with rescue and always handling"
      block:

        - name: Plan fact cache settings
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/fact_cache_plan.json"
            mode: "0644"
            content: "{{ {'cache_backend': cache_backend,'cache_connection': cache_connection,'cache_ttl': cache_ttl} | to_nice_json }}"

        - name: Apply cache settings to ansible.cfg
          when: apply_changes | bool
          loop:
            - { section: 'defaults', option: 'fact_caching', value: '{{ cache_backend }}' }
            - { section: 'defaults', option: 'fact_caching_connection', value: '{{ cache_connection }}' }
            - { section: 'defaults', option: 'fact_caching_timeout', value: '{{ cache_ttl }}' }
          loop_control: { label: "{{ item.option }}" }
          community.general.ini_file:
            path: "{{ ansible_cfg_path }}"
            section: "{{ item.section }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            no_extra_spaces: true
            mode: "0644"

        - name: "ansible/tasks/ans_core__fact_caching | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_status: "failed"
            fe_ansible_tasks_ans_core__fact_caching_postflight_passed: false
            fe_ansible_tasks_ans_core__fact_caching_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_core__fact_caching_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_core__fact_caching: FAILED at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_core__fact_caching failed at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}': {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_core__fact_caching | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_core__fact_caching_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_core__fact_caching_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_core__fact_caching":
                  component: "ansible/tasks/ans_core__fact_caching"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_core__fact_caching_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_core__fact_caching_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_core__fact_caching_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_core__fact_caching_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_core__fact_caching_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else ['ansible/tasks/ans_core__fact_caching'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_core__fact_caching_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_stats_published: true
          when:
            - fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_core__fact_caching | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_core__fact_caching | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_core__fact_caching_preflight_passed | bool
              - fe_ansible_tasks_ans_core__fact_caching_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_core__fact_caching: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_core__fact_caching_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_core__fact_caching_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_core__fact_caching: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_core__fact_caching | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_postflight_passed: true
            fe_ansible_tasks_ans_core__fact_caching_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_status: "failed"
            fe_ansible_tasks_ans_core__fact_caching_postflight_passed: false
            fe_ansible_tasks_ans_core__fact_caching_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_core__fact_caching_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_core__fact_caching: FAILED at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_core__fact_caching | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_core__fact_caching failed at '{{ fe_ansible_tasks_ans_core__fact_caching_failed_task }}': {{ fe_ansible_tasks_ans_core__fact_caching_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_core__fact_caching | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_core__fact_caching_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_core__fact_caching_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_core__fact_caching":
                  component: "ansible/tasks/ans_core__fact_caching"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_core__fact_caching_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_core__fact_caching_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_core__fact_caching_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_core__fact_caching_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_core__fact_caching_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_core__fact_caching_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_core__fact_caching_status | default('') == 'succeeded' else ['ansible/tasks/ans_core__fact_caching'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_core__fact_caching_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_core__fact_caching_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_core__fact_caching | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_core__fact_caching: {{ fe_ansible_tasks_ans_core__fact_caching_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_core__fact_caching_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
