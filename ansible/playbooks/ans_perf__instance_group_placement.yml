            fe_ansible_ans_perf__instance_group_placement_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/ans_perf__instance_group_placement | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/ans_perf__instance_group_placement: FAILED at '{{ fe_ansible_ans_perf__instance_group_placement_failed_task }}' on
