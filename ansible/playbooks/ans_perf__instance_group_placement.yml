                  failed_task: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
