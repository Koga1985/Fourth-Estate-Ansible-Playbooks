---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_perf__instance_group_placement.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-core-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    controller_host: "{{ controller_host | default('https://controller.example.mil') }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(lookup('env','TOWER_TOKEN')) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    placements: "{{ placements | default([]) }}"
  pre_tasks:
    - name: "ansible/tasks/ans_perf__instance_group_placement | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_perf__instance_group_placement | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__instance_group_placement_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_perf__instance_group_placement_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_perf__instance_group_placement_status: "running"
            fe_ansible_tasks_ans_perf__instance_group_placement_preflight_passed: false
            fe_ansible_tasks_ans_perf__instance_group_placement_postflight_passed: false
            fe_ansible_tasks_ans_perf__instance_group_placement_failed_task: ""
            fe_ansible_tasks_ans_perf__instance_group_placement_error: ""
            fe_ansible_tasks_ans_perf__instance_group_placement_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_perf__instance_group_placement | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_perf__instance_group_placement: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_perf__instance_group_placement: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_perf__instance_group_placement | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_perf__instance_group_placement: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_perf__instance_group_placement: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_perf__instance_group_placement | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__instance_group_placement_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_perf__instance_group_placement | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__instance_group_placement_status: "preflight_failed"
            fe_ansible_tasks_ans_perf__instance_group_placement_postflight_passed: false
            fe_ansible_tasks_ans_perf__instance_group_placement_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_perf__instance_group_placement_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__instance_group_placement | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__instance_group_placement: FAILED at '{{ fe_ansible_tasks_ans_perf__instance_group_placement_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_perf__instance_group_placement_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_perf__instance_group_placement | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_perf__instance_group_placement":
                  component: "ansible/tasks/ans_perf__instance_group_placement"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_perf__instance_group_placement_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_perf__instance_group_placement_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_perf__instance_group_placement_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_perf__instance_group_placement_status | default('') == 'succeeded' else ['ansible/tasks/ans_perf__instance_group_placement'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_perf__instance_group_placement | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_perf__instance_group_placement_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_perf__instance_group_placement | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_perf__instance_group_placement failed at '{{ fe_ansible_tasks_ans_perf__instance_group_placement_failed_task }}': {{ fe_ansible_tasks_ans_perf__instance_group_placement_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_perf__instance_group_placement | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_perf__instance_group_placement: preflight
              {{ 'passed' if fe_ansible_tasks_ans_perf__instance_group_placement_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "ansible/ans_perf__instance_group_placement | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Ensure artifacts directory
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0755"

        - name: "ansible/ans_perf__instance_group_placement | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/ans_perf__instance_group_placement | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
