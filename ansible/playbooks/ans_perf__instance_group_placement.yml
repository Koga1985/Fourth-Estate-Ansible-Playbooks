          tags:
            - always
            - rescue

      always:

        - name: "ansible/ans_perf__instance_group_placement | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_ans_perf__instance_group_placement_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_ans_perf__instance_group_placement_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_perf__instance_group_placement_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/ans_perf__instance_group_placement | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/ans_perf__instance_group_placement":
