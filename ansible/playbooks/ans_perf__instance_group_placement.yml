    - name: "ansible/tasks/ans_perf__instance_group_placement | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_perf__instance_group_placement | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_perf__instance_group_placement_preflight_passed | bool
              - fe_ansible_tasks_ans_perf__instance_group_placement_status in ['running', 'succeeded']
