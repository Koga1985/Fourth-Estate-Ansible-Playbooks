                {{ [] if fe_ansible_ans_perf__instance_group_placement_status | default('') == 'succeeded' else ['ansible/ans_perf__instance_group_placement'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_ans_perf__instance_group_placement_status | default('') == 'failed'
            - not (fe_ansible_ans_perf__instance_group_placement_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/ans_perf__instance_group_placement | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_ans_perf__instance_group_placement_stats_published: true
          when:
            - fe_ansible_ans_perf__instance_group_placement_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "ansible/tasks/ans_perf__instance_group_placement | Guarded execution with rescue and always handling"
      block:

        - name: Plan JT→instance group placements
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/instance_group_placements.json"
            mode: "0644"
            content: "{{ placements | to_nice_json }}"

        - name: Apply placements to Job Templates
          when: apply_changes | bool
          loop: "{{ placements }}"
          loop_control: { label: "{{ item.job_template }} → {{ (item.instance_groups | join(',')) if (item.instance_groups|length>0) else 'default' }}" }
          ansible.controller.job_template:
            controller_host: "{{ controller_host }}"
            controller_oauthtoken: "{{ controller_oauthtoken }}"
            validate_certs: "{{ validate_certs }}"
            name: "{{ item.job_template }}"
            organization: "{{ item.organization | default(omit) }}"
            instance_groups: "{{ item.instance_groups | default(omit) }}"
            state: present

        - name: "ansible/tasks/ans_perf__instance_group_placement | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_perf__instance_group_placement | Rescue | Capture the failing task and error detail"
