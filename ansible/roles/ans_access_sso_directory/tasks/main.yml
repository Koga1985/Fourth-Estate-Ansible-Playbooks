---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_access_sso_directory']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_access_sso_directory_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_access_sso_directory | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_access_sso_directory_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_access_sso_directory_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_access_sso_directory_status: "running"
    fe_ansible_ans_access_sso_directory_preflight_passed: false
    fe_ansible_ans_access_sso_directory_postflight_passed: false
    fe_ansible_ans_access_sso_directory_failed_task: ""
    fe_ansible_ans_access_sso_directory_error: ""
    fe_ansible_ans_access_sso_directory_stats_published: false
  tags:
    - always

- name: "ansible/ans_access_sso_directory | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_access_sso_directory | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_access_sso_directory: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_access_sso_directory: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_access_sso_directory | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_access_sso_directory: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_access_sso_directory: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_access_sso_directory_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_access_sso_directory | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_access_sso_directory_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Build SSO settings based on provider
      ansible.builtin.set_fact:
        sso_settings: "{{ lookup('template', 'sso_settings_' + sso_provider + '.yml.j2') | from_yaml }}"
      when: sso_enabled | bool

    - name: Plan SSO configuration
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/sso_plan_{{ sso_provider }}.json"
        mode: "0644"
        content: "{{ sso_settings | to_nice_json }}"
      delegate_to: localhost

    - name: Configure LDAP authentication
      when: apply_changes | bool and sso_provider == 'ldap'
      ansible.controller.settings:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        settings: "{{ sso_settings }}"

    - name: Configure SAML authentication
      when: apply_changes | bool and sso_provider == 'saml'
      ansible.controller.settings:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        settings: "{{ sso_settings }}"

    - name: Configure OIDC authentication
      when: apply_changes | bool and sso_provider == 'oidc'
      ansible.controller.settings:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        settings: "{{ sso_settings }}"

    - name: Create Fourth Estate organizations
      when: (apply_changes | bool) and (fourth_estate_team_mappings | length > 0)
      ansible.controller.organization:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.ansible_org }}"
        state: present
      loop: "{{ fourth_estate_team_mappings }}"
      loop_control:
        label: "{{ item.ansible_org }}"

    - name: Create Fourth Estate teams
      when: (apply_changes | bool) and (fourth_estate_team_mappings | length > 0)
      ansible.controller.team:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.ansible_team }}"
        organization: "{{ item.ansible_org }}"
        state: present
      loop: "{{ fourth_estate_team_mappings }}"
      loop_control:
        label: "{{ item.ansible_team }}"

    - name: Export user data for access review
      when: access_reviews | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/users/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        return_content: true
      register: users_data
      delegate_to: localhost

    - name: Export role assignments for access review
      when: access_reviews | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/role_user_assignments/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        return_content: true
      register: role_assignments
      delegate_to: localhost

    - name: Export team memberships for access review
      when: access_reviews | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/teams/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        return_content: true
      register: teams_data
      delegate_to: localhost

    - name: Generate comprehensive access review report (CSV)
      when: access_reviews | bool and access_review_output_format == 'csv'
      ansible.builtin.template:
        src: access_review.csv.j2
        dest: "{{ artifacts_dir }}/access_review_{{ ansible_date_time.date }}.csv"
        mode: "0644"
      delegate_to: localhost

    - name: Generate comprehensive access review report (JSON)
      when: access_reviews | bool and access_review_output_format == 'json'
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/access_review_{{ ansible_date_time.date }}.json"
        mode: "0644"
        content: |
          {
            "generated": "{{ ansible_date_time.iso8601 }}",
            "users": {{ users_data.json | default({}) | to_nice_json }},
            "role_assignments": {{ role_assignments.json | default({}) | to_nice_json }},
            "teams": {{ teams_data.json | default({}) | to_nice_json }}
          }
      delegate_to: localhost

    - name: Archive old access review reports
      when: access_reviews | bool
      ansible.builtin.shell: |
        find "{{ artifacts_dir }}" -name "access_review_*.{{ access_review_output_format }}" -type f -mtime +{{ access_review_retention_days }} -delete
      delegate_to: localhost
      changed_when: false

    - name: Display SSO configuration summary
      ansible.builtin.debug:
        msg:
          - "SSO Provider: {{ sso_provider }}"
          - "SSO Enabled: {{ sso_enabled }}"
          - "Access Reviews: {{ access_reviews }}"
          - "Review Output: {{ artifacts_dir }}/access_review_{{ ansible_date_time.date }}.{{ access_review_output_format }}"
          - "Team Mappings Configured: {{ fourth_estate_team_mappings | length }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_access_sso_directory | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_access_sso_directory_preflight_passed | bool
          - fe_ansible_ans_access_sso_directory_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_access_sso_directory: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_access_sso_directory_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_access_sso_directory_status | default('unknown') }}.
        success_msg: "ansible/ans_access_sso_directory: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_access_sso_directory | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_access_sso_directory_postflight_passed: true
        fe_ansible_ans_access_sso_directory_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_access_sso_directory | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_access_sso_directory_status: "failed"
        fe_ansible_ans_access_sso_directory_postflight_passed: false
        fe_ansible_ans_access_sso_directory_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_access_sso_directory_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_access_sso_directory | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_access_sso_directory: FAILED at '{{ fe_ansible_ans_access_sso_directory_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_access_sso_directory_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_access_sso_directory | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_access_sso_directory failed at '{{ fe_ansible_ans_access_sso_directory_failed_task }}': {{ fe_ansible_ans_access_sso_directory_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_access_sso_directory | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_access_sso_directory_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_access_sso_directory_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_access_sso_directory_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_access_sso_directory | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_access_sso_directory":
              component: "ansible/ans_access_sso_directory"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_access_sso_directory_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_access_sso_directory_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_access_sso_directory_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_access_sso_directory_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_access_sso_directory_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_access_sso_directory_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_access_sso_directory_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_access_sso_directory_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_access_sso_directory_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_access_sso_directory_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_access_sso_directory_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_access_sso_directory_status | default('') == 'succeeded' else ['ansible/ans_access_sso_directory'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_access_sso_directory | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_access_sso_directory_stats_published: true
      tags:
        - always
