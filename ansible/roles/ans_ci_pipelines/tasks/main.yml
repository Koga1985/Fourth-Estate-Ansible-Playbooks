---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ci_pipelines']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ci_pipelines_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ci_pipelines | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ci_pipelines_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ci_pipelines_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ci_pipelines_status: "running"
    fe_ansible_ans_ci_pipelines_preflight_passed: false
    fe_ansible_ans_ci_pipelines_postflight_passed: false
    fe_ansible_ans_ci_pipelines_failed_task: ""
    fe_ansible_ans_ci_pipelines_error: ""
    fe_ansible_ans_ci_pipelines_stats_published: false
  tags:
    - always

- name: "ansible/ans_ci_pipelines | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ci_pipelines | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ci_pipelines: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ci_pipelines: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ci_pipelines | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ci_pipelines: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ci_pipelines: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ci_pipelines_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ci_pipelines | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ci_pipelines_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Create CI configuration directory
      ansible.builtin.file:
        path: "{{ repo_root }}/ci"
        state: directory
        mode: "0755"
      when: apply_changes | bool

    - name: Generate GitLab CI configuration
      when: apply_changes | bool and ci_platform == 'gitlab' and gitlab_ci_enabled
      ansible.builtin.template:
        src: gitlab-ci.yml.j2
        dest: "{{ repo_root }}/.gitlab-ci.yml"
        mode: "0644"

    - name: Generate GitHub Actions workflows
      when: apply_changes | bool and ci_platform == 'github' and github_actions_enabled
      block:
        - name: Create GitHub workflows directory
          ansible.builtin.file:
            path: "{{ repo_root }}/{{ github_workflows_dir }}"
            state: directory
            mode: "0755"

        - name: Generate GitHub Actions main workflow
          ansible.builtin.template:
            src: github-actions-main.yml.j2
            dest: "{{ repo_root }}/{{ github_workflows_dir }}/main.yml"
            mode: "0644"

    - name: Generate ansible-lint configuration
      when: apply_changes | bool and ci_pipeline_lint_enabled
      ansible.builtin.copy:
        dest: "{{ repo_root }}/.ansible-lint"
        mode: "0644"
        content: |
          ---
          skip_list:
            - yaml[line-length]
          warn_list:
            - no-handler
          use_default_rules: true
          parseable: true

    - name: Create job templates for CI/CD in Controller
      when: apply_changes | bool and deploy_to_controller
      ansible.controller.job_template:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "CI/CD - {{ item.name }}"
        job_type: "run"
        inventory: "Localhost"
        project: "Ansible Content Repository"
        playbook: "{{ item.playbook }}"
        state: present
      loop:
        - name: "Lint Content"
          playbook: "ci/playbooks/lint.yml"
        - name: "Test Content"
          playbook: "ci/playbooks/test.yml"
        - name: "Build Execution Environments"
          playbook: "ci/playbooks/build-ee.yml"
      loop_control:
        label: "{{ item.name }}"

    - name: Generate CI/CD pipeline summary report
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/ci_pipeline_summary.json"
        mode: "0644"
        content: |
          {
            "platform": "{{ ci_platform }}",
            "lint_enabled": {{ ci_pipeline_lint_enabled | bool | lower }},
            "test_enabled": {{ ci_pipeline_test_enabled | bool | lower }},
            "build_ee_enabled": {{ ci_pipeline_build_ee_enabled | bool | lower }},
            "fourth_estate_features": {
              "content_signing": {{ fourth_estate_content_signing | bool | lower }},
              "compliance_checks": {{ fourth_estate_compliance_checks | bool | lower }},
              "audit_logging": {{ fourth_estate_audit_logging | bool | lower }}
            }
          }
      delegate_to: localhost

    - name: Display CI/CD configuration summary
      ansible.builtin.debug:
        msg:
          - "CI/CD Platform: {{ ci_platform }}"
          - "Pipeline Stages: Lint={{ ci_pipeline_lint_enabled }}, Test={{ ci_pipeline_test_enabled }}, Build={{ ci_pipeline_build_ee_enabled }}"
          - "Summary Report: {{ artifacts_dir }}/ci_pipeline_summary.json"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ci_pipelines | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ci_pipelines_preflight_passed | bool
          - fe_ansible_ans_ci_pipelines_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ci_pipelines: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ci_pipelines_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ci_pipelines_status | default('unknown') }}.
        success_msg: "ansible/ans_ci_pipelines: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ci_pipelines | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ci_pipelines_postflight_passed: true
        fe_ansible_ans_ci_pipelines_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ci_pipelines | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ci_pipelines_status: "failed"
        fe_ansible_ans_ci_pipelines_postflight_passed: false
        fe_ansible_ans_ci_pipelines_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ci_pipelines_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ci_pipelines | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ci_pipelines: FAILED at '{{ fe_ansible_ans_ci_pipelines_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ci_pipelines_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ci_pipelines | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ci_pipelines failed at '{{ fe_ansible_ans_ci_pipelines_failed_task }}': {{ fe_ansible_ans_ci_pipelines_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ci_pipelines | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ci_pipelines_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ci_pipelines_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ci_pipelines_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ci_pipelines | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ci_pipelines":
              component: "ansible/ans_ci_pipelines"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ci_pipelines_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ci_pipelines_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ci_pipelines_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ci_pipelines_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ci_pipelines_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ci_pipelines_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ci_pipelines_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ci_pipelines_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ci_pipelines_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ci_pipelines_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ci_pipelines_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ci_pipelines_status | default('') == 'succeeded' else ['ansible/ans_ci_pipelines'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ci_pipelines | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ci_pipelines_stats_published: true
      tags:
        - always
