---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ctrl_policy_guardrails']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ctrl_policy_guardrails_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ctrl_policy_guardrails | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ctrl_policy_guardrails_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ctrl_policy_guardrails_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ctrl_policy_guardrails_status: "running"
    fe_ansible_ans_ctrl_policy_guardrails_preflight_passed: false
    fe_ansible_ans_ctrl_policy_guardrails_postflight_passed: false
    fe_ansible_ans_ctrl_policy_guardrails_failed_task: ""
    fe_ansible_ans_ctrl_policy_guardrails_error: ""
    fe_ansible_ans_ctrl_policy_guardrails_stats_published: false
  tags:
    - always

- name: "ansible/ans_ctrl_policy_guardrails | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ctrl_policy_guardrails | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ctrl_policy_guardrails: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ctrl_policy_guardrails: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ctrl_policy_guardrails | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ctrl_policy_guardrails: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ctrl_policy_guardrails: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ctrl_policy_guardrails_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ctrl_policy_guardrails | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_policy_guardrails_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Enable policy enforcement
      when: apply_changes | bool
      ansible.controller.settings:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        settings:
          AWX_ISOLATION_SHOW_PATHS: []
          AWX_PROOT_ENABLED: false

    - name: Create approval workflow
      when: apply_changes | bool and require_approval_for_production | bool
      ansible.controller.workflow_approval:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        name: "Production Deployment Approval"
        description: "Requires approval for production deployments"
        timeout: 3600

    - name: Display policy summary
      ansible.builtin.debug:
        msg:
          - "Policy Mode: {{ policy_mode }}"
          - "Production Approval: {{ require_approval_for_production }}"
          - "MFA Required: {{ fourth_estate_mandatory_mfa }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ctrl_policy_guardrails | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ctrl_policy_guardrails_preflight_passed | bool
          - fe_ansible_ans_ctrl_policy_guardrails_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ctrl_policy_guardrails: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ctrl_policy_guardrails_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ctrl_policy_guardrails_status | default('unknown') }}.
        success_msg: "ansible/ans_ctrl_policy_guardrails: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ctrl_policy_guardrails | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_policy_guardrails_postflight_passed: true
        fe_ansible_ans_ctrl_policy_guardrails_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ctrl_policy_guardrails | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_policy_guardrails_status: "failed"
        fe_ansible_ans_ctrl_policy_guardrails_postflight_passed: false
        fe_ansible_ans_ctrl_policy_guardrails_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ctrl_policy_guardrails_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ctrl_policy_guardrails | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ctrl_policy_guardrails: FAILED at '{{ fe_ansible_ans_ctrl_policy_guardrails_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ctrl_policy_guardrails_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ctrl_policy_guardrails | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ctrl_policy_guardrails failed at '{{ fe_ansible_ans_ctrl_policy_guardrails_failed_task }}': {{ fe_ansible_ans_ctrl_policy_guardrails_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ctrl_policy_guardrails | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_policy_guardrails_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ctrl_policy_guardrails_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ctrl_policy_guardrails_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ctrl_policy_guardrails | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ctrl_policy_guardrails":
              component: "ansible/ans_ctrl_policy_guardrails"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ctrl_policy_guardrails_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ctrl_policy_guardrails_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ctrl_policy_guardrails_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ctrl_policy_guardrails_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ctrl_policy_guardrails_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ctrl_policy_guardrails_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ctrl_policy_guardrails_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ctrl_policy_guardrails_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ctrl_policy_guardrails_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ctrl_policy_guardrails_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ctrl_policy_guardrails_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ctrl_policy_guardrails_status | default('') == 'succeeded' else ['ansible/ans_ctrl_policy_guardrails'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ctrl_policy_guardrails | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_policy_guardrails_stats_published: true
      tags:
        - always
