---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_core_inventory_hygiene']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_core_inventory_hygiene_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_core_inventory_hygiene | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_core_inventory_hygiene_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_core_inventory_hygiene_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_core_inventory_hygiene_status: "running"
    fe_ansible_ans_core_inventory_hygiene_preflight_passed: false
    fe_ansible_ans_core_inventory_hygiene_postflight_passed: false
    fe_ansible_ans_core_inventory_hygiene_failed_task: ""
    fe_ansible_ans_core_inventory_hygiene_error: ""
    fe_ansible_ans_core_inventory_hygiene_stats_published: false
  tags:
    - always

- name: "ansible/ans_core_inventory_hygiene | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_core_inventory_hygiene | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_core_inventory_hygiene: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_core_inventory_hygiene: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_core_inventory_hygiene | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_core_inventory_hygiene: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_core_inventory_hygiene: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_core_inventory_hygiene_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_core_inventory_hygiene | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_core_inventory_hygiene_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get all inventories
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/inventories/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
      register: inventories

    - name: Find stale hosts
      when: cleanup_stale_hosts | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/hosts/?last_job__lt={{ stale_days }}"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
      register: stale_hosts

    - name: Remove stale hosts
      when: apply_changes | bool and cleanup_stale_hosts | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/hosts/{{ item.id }}/"
        method: DELETE
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        status_code: [204]
      loop: "{{ stale_hosts.json.results | default([]) }}"

    - name: Find empty groups
      when: cleanup_empty_groups | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/groups/?hosts__count=0"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
      register: empty_groups

    - name: Generate hygiene report
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/inventory_hygiene_report.json"
        mode: "0644"
        content: |
          {
            "stale_hosts": {{ stale_hosts.json.count | default(0) }},
            "empty_groups": {{ empty_groups.json.count | default(0) }},
            "total_inventories": {{ inventories.json.count | default(0) }}
          }

    - name: Display hygiene summary
      ansible.builtin.debug:
        msg:
          - "Stale Hosts Found: {{ stale_hosts.json.count | default(0) }}"
          - "Empty Groups Found: {{ empty_groups.json.count | default(0) }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_core_inventory_hygiene | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_core_inventory_hygiene_preflight_passed | bool
          - fe_ansible_ans_core_inventory_hygiene_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_core_inventory_hygiene: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_core_inventory_hygiene_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_core_inventory_hygiene_status | default('unknown') }}.
        success_msg: "ansible/ans_core_inventory_hygiene: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_core_inventory_hygiene | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_core_inventory_hygiene_postflight_passed: true
        fe_ansible_ans_core_inventory_hygiene_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_core_inventory_hygiene | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_core_inventory_hygiene_status: "failed"
        fe_ansible_ans_core_inventory_hygiene_postflight_passed: false
        fe_ansible_ans_core_inventory_hygiene_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_core_inventory_hygiene_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_core_inventory_hygiene | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_core_inventory_hygiene: FAILED at '{{ fe_ansible_ans_core_inventory_hygiene_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_core_inventory_hygiene_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_core_inventory_hygiene | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_core_inventory_hygiene failed at '{{ fe_ansible_ans_core_inventory_hygiene_failed_task }}': {{ fe_ansible_ans_core_inventory_hygiene_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_core_inventory_hygiene | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_core_inventory_hygiene_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_core_inventory_hygiene_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_core_inventory_hygiene_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_core_inventory_hygiene | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_core_inventory_hygiene":
              component: "ansible/ans_core_inventory_hygiene"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_core_inventory_hygiene_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_core_inventory_hygiene_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_core_inventory_hygiene_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_core_inventory_hygiene_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_core_inventory_hygiene_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_core_inventory_hygiene_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_core_inventory_hygiene_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_core_inventory_hygiene_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_core_inventory_hygiene_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_core_inventory_hygiene_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_core_inventory_hygiene_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_core_inventory_hygiene_status | default('') == 'succeeded' else ['ansible/ans_core_inventory_hygiene'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_core_inventory_hygiene | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_core_inventory_hygiene_stats_published: true
      tags:
        - always
