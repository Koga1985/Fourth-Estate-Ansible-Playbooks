---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ee_factory']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ee_factory_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ee_factory | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ee_factory_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ee_factory_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ee_factory_status: "running"
    fe_ansible_ans_ee_factory_preflight_passed: false
    fe_ansible_ans_ee_factory_postflight_passed: false
    fe_ansible_ans_ee_factory_failed_task: ""
    fe_ansible_ans_ee_factory_error: ""
    fe_ansible_ans_ee_factory_stats_published: false
  tags:
    - always

- name: "ansible/ans_ee_factory | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ee_factory | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ee_factory: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ee_factory: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ee_factory | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ee_factory: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ee_factory: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ee_factory_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ee_factory | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ee_factory_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/ee_builds"
        state: directory
        mode: "0755"

    - name: Generate execution-environment.yml files
      ansible.builtin.template:
        src: execution-environment.yml.j2
        dest: "{{ artifacts_dir }}/ee_builds/{{ item.name }}/execution-environment.yml"
        mode: "0644"
      loop: "{{ ee_definitions }}"
      loop_control:
        label: "{{ item.name }}"
      when: apply_changes | bool

    - name: Generate requirements files
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/ee_builds/{{ item.0.name }}/{{ item.1.type }}"
        content: "{{ item.1.content }}"
        mode: "0644"
      loop: "{{ ee_definitions | subelements('dependencies', skip_missing=True) }}"
      when: apply_changes | bool

    - name: Build execution environments
      when: apply_changes | bool
      ansible.builtin.command:
        cmd: "ansible-builder build -t {{ item.image }}:{{ item.tag }} -c {{ artifacts_dir }}/ee_builds/{{ item.name }}"
        chdir: "{{ artifacts_dir }}/ee_builds/{{ item.name }}"
      loop: "{{ ee_definitions }}"
      loop_control:
        label: "{{ item.name }}"
      register: build_result
      timeout: "{{ ee_build_timeout }}"

    - name: Scan images for vulnerabilities
      when: ee_scanning_enabled | bool
      ansible.builtin.command:
        cmd: "{{ ee_scanner }} image {{ item.image }}:{{ item.tag }}"
      loop: "{{ ee_definitions }}"
      register: scan_result
      failed_when: ee_scan_fail_on_critical | bool and 'CRITICAL' in scan_result.stdout

    - name: Push images to registry
      when: apply_changes | bool and registry_push | bool
      ansible.builtin.command:
        cmd: "podman push {{ item.image }}:{{ item.tag }}"
      loop: "{{ ee_definitions }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Register EEs in Controller
      when: apply_changes | bool and ee_register_in_controller | bool
      ansible.controller.execution_environment:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name }}"
        image: "{{ item.image }}:{{ item.tag }}"
        state: present
      loop: "{{ ee_definitions }}"

    - name: Display build summary
      ansible.builtin.debug:
        msg:
          - "Built {{ ee_definitions | length }} execution environments"
          - "Registry: {{ ee_registry }}"
          - "Scanning: {{ 'Enabled' if ee_scanning_enabled else 'Disabled' }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ee_factory | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ee_factory_preflight_passed | bool
          - fe_ansible_ans_ee_factory_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ee_factory: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ee_factory_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ee_factory_status | default('unknown') }}.
        success_msg: "ansible/ans_ee_factory: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ee_factory | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ee_factory_postflight_passed: true
        fe_ansible_ans_ee_factory_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ee_factory | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ee_factory_status: "failed"
        fe_ansible_ans_ee_factory_postflight_passed: false
        fe_ansible_ans_ee_factory_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ee_factory_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ee_factory | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ee_factory: FAILED at '{{ fe_ansible_ans_ee_factory_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ee_factory_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ee_factory | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ee_factory failed at '{{ fe_ansible_ans_ee_factory_failed_task }}': {{ fe_ansible_ans_ee_factory_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ee_factory | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ee_factory_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ee_factory_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ee_factory_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ee_factory | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ee_factory":
              component: "ansible/ans_ee_factory"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ee_factory_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ee_factory_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ee_factory_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ee_factory_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ee_factory_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ee_factory_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ee_factory_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ee_factory_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ee_factory_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ee_factory_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ee_factory_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ee_factory_status | default('') == 'succeeded' else ['ansible/ans_ee_factory'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ee_factory | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ee_factory_stats_published: true
      tags:
        - always
