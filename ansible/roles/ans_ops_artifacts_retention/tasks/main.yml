---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ops_artifacts_retention']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ops_artifacts_retention_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ops_artifacts_retention | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ops_artifacts_retention_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ops_artifacts_retention_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ops_artifacts_retention_status: "running"
    fe_ansible_ans_ops_artifacts_retention_preflight_passed: false
    fe_ansible_ans_ops_artifacts_retention_postflight_passed: false
    fe_ansible_ans_ops_artifacts_retention_failed_task: ""
    fe_ansible_ans_ops_artifacts_retention_error: ""
    fe_ansible_ans_ops_artifacts_retention_stats_published: false
  tags:
    - always

- name: "ansible/ans_ops_artifacts_retention | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ops_artifacts_retention | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ops_artifacts_retention: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ops_artifacts_retention: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ops_artifacts_retention | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ops_artifacts_retention: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ops_artifacts_retention: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ops_artifacts_retention_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ops_artifacts_retention | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_artifacts_retention_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Find old artifacts
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}"
        age: "{{ artifact_retention_days }}d"
        recurse: true
      register: old_artifacts

    - name: Archive old artifacts
      when: apply_changes | bool and fourth_estate_evidence_archival | bool
      community.general.archive:
        path: "{{ item.path }}"
        dest: "{{ artifacts_dir }}/archives/{{ item.path | basename }}.tar.gz"
        format: gz
      loop: "{{ old_artifacts.files }}"

    - name: Remove archived artifacts
      when: apply_changes | bool and cleanup_enabled | bool
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_artifacts.files }}"

    - name: Display retention summary
      ansible.builtin.debug:
        msg:
          - "Old Artifacts: {{ old_artifacts.matched }}"
          - "Retention: {{ artifact_retention_days }} days"
          - "Compliance Retention: {{ fourth_estate_compliance_retention }} days"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ops_artifacts_retention | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ops_artifacts_retention_preflight_passed | bool
          - fe_ansible_ans_ops_artifacts_retention_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ops_artifacts_retention: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ops_artifacts_retention_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ops_artifacts_retention_status | default('unknown') }}.
        success_msg: "ansible/ans_ops_artifacts_retention: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ops_artifacts_retention | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_artifacts_retention_postflight_passed: true
        fe_ansible_ans_ops_artifacts_retention_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ops_artifacts_retention | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_artifacts_retention_status: "failed"
        fe_ansible_ans_ops_artifacts_retention_postflight_passed: false
        fe_ansible_ans_ops_artifacts_retention_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ops_artifacts_retention_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ops_artifacts_retention | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ops_artifacts_retention: FAILED at '{{ fe_ansible_ans_ops_artifacts_retention_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ops_artifacts_retention_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ops_artifacts_retention | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ops_artifacts_retention failed at '{{ fe_ansible_ans_ops_artifacts_retention_failed_task }}': {{ fe_ansible_ans_ops_artifacts_retention_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ops_artifacts_retention | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_artifacts_retention_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ops_artifacts_retention_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ops_artifacts_retention_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ops_artifacts_retention | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ops_artifacts_retention":
              component: "ansible/ans_ops_artifacts_retention"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ops_artifacts_retention_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ops_artifacts_retention_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ops_artifacts_retention_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ops_artifacts_retention_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ops_artifacts_retention_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ops_artifacts_retention_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ops_artifacts_retention_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ops_artifacts_retention_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ops_artifacts_retention_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ops_artifacts_retention_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ops_artifacts_retention_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ops_artifacts_retention_status | default('') == 'succeeded' else ['ansible/ans_ops_artifacts_retention'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ops_artifacts_retention | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_artifacts_retention_stats_published: true
      tags:
        - always
