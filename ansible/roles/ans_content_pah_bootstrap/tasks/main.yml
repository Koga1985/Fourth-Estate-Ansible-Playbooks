---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_content_pah_bootstrap']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_content_pah_bootstrap_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_content_pah_bootstrap | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_content_pah_bootstrap_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_content_pah_bootstrap_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_content_pah_bootstrap_status: "running"
    fe_ansible_ans_content_pah_bootstrap_preflight_passed: false
    fe_ansible_ans_content_pah_bootstrap_postflight_passed: false
    fe_ansible_ans_content_pah_bootstrap_failed_task: ""
    fe_ansible_ans_content_pah_bootstrap_error: ""
    fe_ansible_ans_content_pah_bootstrap_stats_published: false
  tags:
    - always

- name: "ansible/ans_content_pah_bootstrap | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_content_pah_bootstrap | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_content_pah_bootstrap: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_content_pah_bootstrap: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_content_pah_bootstrap | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_content_pah_bootstrap: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_content_pah_bootstrap: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_content_pah_bootstrap_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_content_pah_bootstrap | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_content_pah_bootstrap_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Check Private Automation Hub status
      ansible.builtin.uri:
        url: "{{ ah_url }}/api/galaxy/pulp/api/v3/status/"
        method: GET
        force_basic_auth: true
        url_username: "{{ ah_username }}"
        url_password: "{{ ah_password }}"
        validate_certs: "{{ validate_certs }}"
        return_content: true
      register: ah_status
      failed_when: false

    - name: Create namespaces
      when: apply_changes | bool
      ansible.builtin.uri:
        url: "{{ ah_url }}/api/galaxy/_ui/v1/namespaces/"
        method: POST
        force_basic_auth: true
        url_username: "{{ ah_username }}"
        url_password: "{{ ah_password }}"
        validate_certs: "{{ validate_certs }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
        status_code: [201, 400]
      loop: "{{ ah_namespaces }}"
      loop_control:
        label: "{{ item.name }}"
      register: namespace_result

    - name: Create groups
      when: apply_changes | bool
      ansible.builtin.uri:
        url: "{{ ah_url }}/api/galaxy/_ui/v1/groups/"
        method: POST
        force_basic_auth: true
        url_username: "{{ ah_username }}"
        url_password: "{{ ah_password }}"
        validate_certs: "{{ validate_certs }}"
        body_format: json
        body:
          name: "{{ item.name }}"
        status_code: [201, 400]
      loop: "{{ ah_groups }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Configure remote repositories
      when: apply_changes | bool
      ansible.builtin.uri:
        url: "{{ ah_url }}/api/galaxy/pulp/api/v3/remotes/ansible/collection/"
        method: POST
        force_basic_auth: true
        url_username: "{{ ah_username }}"
        url_password: "{{ ah_password }}"
        validate_certs: "{{ validate_certs }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          url: "{{ item.url }}"
          requirements_file: "{{ item.requirements | to_yaml }}"
        status_code: [201, 400]
      loop: "{{ ah_remotes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Sync remote repositories
      when: apply_changes | bool and ah_sync_on_bootstrap
      ansible.builtin.uri:
        url: "{{ ah_url }}/api/galaxy/pulp/api/v3/remotes/ansible/collection/{{ item.name }}/sync/"
        method: POST
        force_basic_auth: true
        url_username: "{{ ah_username }}"
        url_password: "{{ ah_password }}"
        validate_certs: "{{ validate_certs }}"
        status_code: [202]
      loop: "{{ ah_remotes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Generate PAH bootstrap summary
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/pah_bootstrap_summary.json"
        mode: "0644"
        content: |
          {
            "automation_hub_url": "{{ ah_url }}",
            "namespaces": {{ ah_namespaces | to_nice_json }},
            "groups": {{ ah_groups | to_nice_json }},
            "remotes": {{ ah_remotes | to_nice_json }},
            "repositories": {{ ah_repositories | to_nice_json }},
            "signing_enabled": {{ ah_collection_signing_enabled | bool | lower }}
          }
      delegate_to: localhost

    - name: Display PAH configuration summary
      ansible.builtin.debug:
        msg:
          - "Private Automation Hub URL: {{ ah_url }}"
          - "Namespaces Created: {{ ah_namespaces | length }}"
          - "Groups Created: {{ ah_groups | length }}"
          - "Remote Repositories: {{ ah_remotes | length }}"
          - "Collection Signing: {{ ah_collection_signing_enabled }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_content_pah_bootstrap | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_content_pah_bootstrap_preflight_passed | bool
          - fe_ansible_ans_content_pah_bootstrap_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_content_pah_bootstrap: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_content_pah_bootstrap_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_content_pah_bootstrap_status | default('unknown') }}.
        success_msg: "ansible/ans_content_pah_bootstrap: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_content_pah_bootstrap | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_content_pah_bootstrap_postflight_passed: true
        fe_ansible_ans_content_pah_bootstrap_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_content_pah_bootstrap | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_content_pah_bootstrap_status: "failed"
        fe_ansible_ans_content_pah_bootstrap_postflight_passed: false
        fe_ansible_ans_content_pah_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_content_pah_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_content_pah_bootstrap | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_content_pah_bootstrap: FAILED at '{{ fe_ansible_ans_content_pah_bootstrap_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_content_pah_bootstrap_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_content_pah_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_content_pah_bootstrap failed at '{{ fe_ansible_ans_content_pah_bootstrap_failed_task }}': {{ fe_ansible_ans_content_pah_bootstrap_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_content_pah_bootstrap | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_content_pah_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_content_pah_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_content_pah_bootstrap_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_content_pah_bootstrap | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_content_pah_bootstrap":
              component: "ansible/ans_content_pah_bootstrap"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_content_pah_bootstrap_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_content_pah_bootstrap_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_content_pah_bootstrap_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_content_pah_bootstrap_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_content_pah_bootstrap_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_content_pah_bootstrap_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_content_pah_bootstrap_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_content_pah_bootstrap_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_content_pah_bootstrap_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_content_pah_bootstrap_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_content_pah_bootstrap_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_content_pah_bootstrap_status | default('') == 'succeeded' else ['ansible/ans_content_pah_bootstrap'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_content_pah_bootstrap | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_content_pah_bootstrap_stats_published: true
      tags:
        - always
