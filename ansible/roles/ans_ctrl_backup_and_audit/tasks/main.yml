---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ctrl_backup_and_audit']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ctrl_backup_and_audit_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ctrl_backup_and_audit | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ctrl_backup_and_audit_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ctrl_backup_and_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ctrl_backup_and_audit_status: "running"
    fe_ansible_ans_ctrl_backup_and_audit_preflight_passed: false
    fe_ansible_ans_ctrl_backup_and_audit_postflight_passed: false
    fe_ansible_ans_ctrl_backup_and_audit_failed_task: ""
    fe_ansible_ans_ctrl_backup_and_audit_error: ""
    fe_ansible_ans_ctrl_backup_and_audit_stats_published: false
  tags:
    - always

- name: "ansible/ans_ctrl_backup_and_audit | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ctrl_backup_and_audit | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ctrl_backup_and_audit: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ctrl_backup_and_audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ctrl_backup_and_audit | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ctrl_backup_and_audit: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ctrl_backup_and_audit: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ctrl_backup_and_audit_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ctrl_backup_and_audit | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_backup_and_audit_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_path }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Export Controller configuration
      when: backup_enabled | bool
      ansible.builtin.command:
        cmd: "awx-manage export_config --output {{ backup_path }}/{{ backup_filename }}"
      register: backup_result
      changed_when: true

    - name: Compress backup
      when: backup_enabled | bool and backup_compression | bool
      community.general.archive:
        path: "{{ backup_path }}/{{ backup_filename }}"
        dest: "{{ backup_path }}/{{ backup_filename }}.gz"
        format: gz
        remove: false

    - name: Upload to S3
      when: dr_enabled | bool and dr_remote_storage == 's3'
      amazon.aws.s3_object:
        bucket: "{{ dr_s3_bucket }}"
        object: "{{ backup_filename }}.gz"
        src: "{{ backup_path }}/{{ backup_filename }}.gz"
        mode: put

    - name: Cleanup old backups
      ansible.builtin.find:
        paths: "{{ backup_path }}"
        age: "{{ backup_retention_days }}d"
        patterns: "controller_backup_*.json*"
      register: old_backups

    - name: Remove old backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.files | length > 0

    - name: Collect audit logs
      when: audit_enabled | bool
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/activity_stream/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        return_content: true
      register: audit_logs
      no_log: true

    - name: Save audit logs
      when: audit_enabled | bool
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/audit_{{ ansible_date_time.date }}.json"
        content: "{{ audit_logs.json | to_nice_json }}"
        mode: "0640"

    - name: Display backup summary
      ansible.builtin.debug:
        msg:
          - "Backup Location: {{ backup_path }}/{{ backup_filename }}"
          - "DR Storage: {{ dr_remote_storage if dr_enabled else 'Disabled' }}"
          - "Audit Logs: {{ artifacts_dir }}/audit_{{ ansible_date_time.date }}.json"

    # --------------------------- evidence delivery --------------------------
    # Writing the report to artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "ansible/ans_ctrl_backup_and_audit | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}"
        patterns: "audit_*.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "ansible/ans_ctrl_backup_and_audit | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "ansible/ans_ctrl_backup_and_audit | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "ansible/ans_ctrl_backup_and_audit | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "ansible/ans_ctrl_backup_and_audit":
              component: "ansible/ans_ctrl_backup_and_audit"
              platform: "ansible"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ctrl_backup_and_audit | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ctrl_backup_and_audit_preflight_passed | bool
          - fe_ansible_ans_ctrl_backup_and_audit_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ctrl_backup_and_audit: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ctrl_backup_and_audit_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ctrl_backup_and_audit_status | default('unknown') }}.
        success_msg: "ansible/ans_ctrl_backup_and_audit: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ctrl_backup_and_audit | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_backup_and_audit_postflight_passed: true
        fe_ansible_ans_ctrl_backup_and_audit_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ctrl_backup_and_audit | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_backup_and_audit_status: "failed"
        fe_ansible_ans_ctrl_backup_and_audit_postflight_passed: false
        fe_ansible_ans_ctrl_backup_and_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ctrl_backup_and_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ctrl_backup_and_audit | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ctrl_backup_and_audit: FAILED at '{{ fe_ansible_ans_ctrl_backup_and_audit_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ctrl_backup_and_audit_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ctrl_backup_and_audit | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ctrl_backup_and_audit failed at '{{ fe_ansible_ans_ctrl_backup_and_audit_failed_task }}': {{ fe_ansible_ans_ctrl_backup_and_audit_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ctrl_backup_and_audit | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_backup_and_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ctrl_backup_and_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ctrl_backup_and_audit_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ctrl_backup_and_audit | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ctrl_backup_and_audit":
              component: "ansible/ans_ctrl_backup_and_audit"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ctrl_backup_and_audit_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ctrl_backup_and_audit_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ctrl_backup_and_audit_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ctrl_backup_and_audit_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ctrl_backup_and_audit_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ctrl_backup_and_audit_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ctrl_backup_and_audit_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ctrl_backup_and_audit_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ctrl_backup_and_audit_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ctrl_backup_and_audit_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ctrl_backup_and_audit_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ctrl_backup_and_audit_status | default('') == 'succeeded' else ['ansible/ans_ctrl_backup_and_audit'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ctrl_backup_and_audit | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ctrl_backup_and_audit_stats_published: true
      tags:
        - always
