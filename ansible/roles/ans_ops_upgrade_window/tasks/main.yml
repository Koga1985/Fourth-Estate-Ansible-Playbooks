---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible/ans_ops_upgrade_window']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_ans_ops_upgrade_window_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible/ans_ops_upgrade_window | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_ans_ops_upgrade_window_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_ans_ops_upgrade_window_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_ans_ops_upgrade_window_status: "running"
    fe_ansible_ans_ops_upgrade_window_preflight_passed: false
    fe_ansible_ans_ops_upgrade_window_postflight_passed: false
    fe_ansible_ans_ops_upgrade_window_failed_task: ""
    fe_ansible_ans_ops_upgrade_window_error: ""
    fe_ansible_ans_ops_upgrade_window_stats_published: false
  tags:
    - always

- name: "ansible/ans_ops_upgrade_window | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible/ans_ops_upgrade_window | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible/ans_ops_upgrade_window: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible/ans_ops_upgrade_window: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ops_upgrade_window | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible/ans_ops_upgrade_window: required variable '{{ item }}' is not defined."
        success_msg: "ansible/ans_ops_upgrade_window: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_ans_ops_upgrade_window_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible/ans_ops_upgrade_window | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_upgrade_window_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check for available upgrades
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/config/"
        method: GET
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
      register: current_version

    - name: Create maintenance schedule
      when: apply_changes | bool
      ansible.controller.schedule:
        controller_host: "{{ controller_host }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name }}"
        rrule: "DTSTART:20260101T000000Z RRULE:FREQ=MONTHLY;INTERVAL=1"
        state: present
      loop: "{{ maintenance_windows }}"

    - name: Send upgrade notification
      when: upgrade_window_enabled | bool
      ansible.builtin.debug:
        msg: "Upgrade window scheduled - {{ upgrade_schedule }}"

    - name: Display upgrade summary
      ansible.builtin.debug:
        msg:
          - "Upgrade Window: {{ upgrade_schedule }}"
          - "Change Control: {{ fourth_estate_change_control }}"

    # ----------------------------- postflight -------------------

    - name: "ansible/ans_ops_upgrade_window | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_ans_ops_upgrade_window_preflight_passed | bool
          - fe_ansible_ans_ops_upgrade_window_status in ['running', 'succeeded']
        fail_msg: >-
          ansible/ans_ops_upgrade_window: postflight validation failed - preflight passed
          ={{ fe_ansible_ans_ops_upgrade_window_preflight_passed | default(false) }},
          status={{ fe_ansible_ans_ops_upgrade_window_status | default('unknown') }}.
        success_msg: "ansible/ans_ops_upgrade_window: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible/ans_ops_upgrade_window | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_upgrade_window_postflight_passed: true
        fe_ansible_ans_ops_upgrade_window_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible/ans_ops_upgrade_window | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_upgrade_window_status: "failed"
        fe_ansible_ans_ops_upgrade_window_postflight_passed: false
        fe_ansible_ans_ops_upgrade_window_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_ans_ops_upgrade_window_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible/ans_ops_upgrade_window | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible/ans_ops_upgrade_window: FAILED at '{{ fe_ansible_ans_ops_upgrade_window_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_ans_ops_upgrade_window_error }}
      tags:
        - always
        - rescue

    - name: "ansible/ans_ops_upgrade_window | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible/ans_ops_upgrade_window failed at '{{ fe_ansible_ans_ops_upgrade_window_failed_task }}': {{ fe_ansible_ans_ops_upgrade_window_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible/ans_ops_upgrade_window | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_upgrade_window_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_ans_ops_upgrade_window_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_ans_ops_upgrade_window_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible/ans_ops_upgrade_window | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible/ans_ops_upgrade_window":
              component: "ansible/ans_ops_upgrade_window"
              type: "role"
              platform: "ansible"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_ans_ops_upgrade_window_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_ans_ops_upgrade_window_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_ans_ops_upgrade_window_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_ans_ops_upgrade_window_started_at | default('') }}"
              ended_at: "{{ fe_ansible_ans_ops_upgrade_window_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_ans_ops_upgrade_window_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_ans_ops_upgrade_window_failed_task | default('') }}"
              error: "{{ fe_ansible_ans_ops_upgrade_window_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_ans_ops_upgrade_window_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_ans_ops_upgrade_window_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_ans_ops_upgrade_window_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_ans_ops_upgrade_window_status | default('') == 'succeeded' else ['ansible/ans_ops_upgrade_window'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible/ans_ops_upgrade_window | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_ans_ops_upgrade_window_stats_published: true
      tags:
        - always
