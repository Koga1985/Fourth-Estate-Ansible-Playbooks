---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__sbom_vuln_scan.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    # Expect: repos=[{"path":"/path/to/repo1"}, {"path":"./role_foo"}]
    repos: "{{ repos | default([]) }}"
    # If true, fail the play when a scan command returns non-zero (tool error).
    # (This does NOT fail on found vulns; use a policy step downstream to enforce thresholds.)
    fail_on_error: "{{ fail_on_error | default(true) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__sbom_vuln_scan | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_status: "running"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed: false
            fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed: false
            fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task: ""
            fe_ansible_tasks_ans_content__sbom_vuln_scan_error: ""
            fe_ansible_tasks_ans_content__sbom_vuln_scan_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__sbom_vuln_scan: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__sbom_vuln_scan: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_status: "preflight_failed"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed: false
            fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: FAILED at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__sbom_vuln_scan":
                  component: "ansible/tasks/ans_content__sbom_vuln_scan"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__sbom_vuln_scan'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan failed at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}': {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory (least privilege - fourth estate compliant)
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"

    - name: Validate repos list
      ansible.builtin.assert:
        that:
          - repos is iterable
          - repos | length > 0
          - repos | map(attribute='path') | select('string') | list | length == (repos | length)
        fail_msg: "Provide repos as a list of dicts with a 'path' string, e.g., repos=[{'path':'/repo1'}]."

  tasks:
    - name: "ansible/tasks/ans_content__sbom_vuln_scan | Guarded execution with rescue and always handling"
      block:

        - name: Stat each repo (no symlink follow)
          ansible.builtin.stat:
            path: "{{ item.path }}"
            follow: false
          loop: "{{ repos }}"
          register: repo_stats

        - name: Assert each repo exists, is a directory, and not a symlink
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.isdir
              - not item.stat.islnk
            fail_msg: "Invalid repo path: {{ item.stat.path }} (must exist, be a directory, and not be a symlink)."
          loop: "{{ repo_stats.results }}"

        - name: Write scan plan (always)
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/sbom_scan_plan.json"
            mode: "0640"
            content: "{{ repos | to_nice_json }}"

        - name: Check syft availability
          ansible.builtin.command: syft version
          register: syft_ver
          changed_when: false
          failed_when: false

        - name: Check grype availability
          ansible.builtin.command: grype version
          register: grype_ver
          changed_when: false
          failed_when: false

        - name: Initialize results accumulator
          ansible.builtin.set_fact:
            scan_results: []

        - name: SBOM + vuln scan per repo
          when: apply_changes | bool
          vars:
            repo_path: "{{ item.stat.path }}"
            repo_name: "{{ (item.stat.path | basename) | regex_replace('[^A-Za-z0-9_.-]+','_') }}"
            sbom_file: "{{ artifacts_dir }}/{{ repo_name }}_sbom.json"
            vulns_file: "{{ artifacts_dir }}/{{ repo_name }}_vulns.json"
          block:
            - name: Run Syft to produce SBOM (if available)
              when: syft_ver.rc == 0
              ansible.builtin.command:
                cmd: syft dir:. -o json
                chdir: "{{ repo_path }}"
              register: syft_out
              changed_when: false
              failed_when: false

            - name: Write SBOM file
              when: syft_ver.rc == 0 and (syft_out.rc is defined)
              ansible.builtin.copy:
                dest: "{{ sbom_file }}"
                mode: "0640"
                content: "{{ syft_out.stdout | default('') }}"
              register: sbom_write
              changed_when: false

            - name: Run Grype to scan (if available)
              when: grype_ver.rc == 0
              ansible.builtin.command:
                cmd: grype dir:. -o json
                chdir: "{{ repo_path }}"
              register: grype_out
              changed_when: false
              failed_when: false

            - name: Write vulnerability report
              when: grype_ver.rc == 0 and (grype_out.rc is defined)
              ansible.builtin.copy:
                dest: "{{ vulns_file }}"
                mode: "0640"
                content: "{{ grype_out.stdout | default('') }}"
              register: vulns_write
              changed_when: false

            - name: Compute checksums for written files
              ansible.builtin.stat:
                path: "{{ item }}"
                checksum_algorithm: sha256
              loop: >-
                {{
                  ([sbom_file] if (sbom_write is defined and sbom_write.dest is defined) else [])
                  + ([vulns_file] if (vulns_write is defined and vulns_write.dest is defined) else [])
                }}
              register: hashes
              changed_when: false

            - name: Write .sha256 sidecars
              when: hashes.results | length > 0
              ansible.builtin.copy:
                dest: "{{ item.stat.path }}.sha256"
                mode: "0640"
                content: "{{ item.stat.checksum }}  {{ item.stat.path | basename }}\n"
              loop: "{{ hashes.results }}"
              loop_control:
                label: "{{ item.stat.path | basename }}"
              changed_when: false

            - name: Append per-repo result
              ansible.builtin.set_fact:
                scan_results: >-
                  {{ scan_results + [ {
                      'repo': repo_path,
                      'syft_available': (syft_ver.rc == 0),
                      'grype_available': (grype_ver.rc == 0),
                      'syft_rc': (syft_out.rc if syft_out is defined else None),
                      'grype_rc': (grype_out.rc if grype_out is defined else None),
                      'sbom_file': (sbom_file if (sbom_write is defined and sbom_write.dest is defined) else None),
                      'vulns_file': (vulns_file if (vulns_write is defined and vulns_write.dest is defined) else None)
                    } ] }}
          loop: "{{ repo_stats.results }}"
          loop_control:
            label: "{{ item.stat.path }}"

        - name: Write summary (JSON)
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/sbom_scan_summary.json"
            mode: "0640"
            content: "{{ scan_results | to_nice_json if apply_changes | bool else '[]' }}"

        - name: Compute checksum for summary
          ansible.builtin.stat:
            path: "{{ artifacts_dir }}/sbom_scan_summary.json"
            checksum_algorithm: sha256
          register: sum_stat
          changed_when: false

        - name: Write checksum sidecar
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/sbom_scan_summary.json.sha256"
            mode: "0640"
            content: "{{ sum_stat.stat.checksum }}  sbom_scan_summary.json\n"

        - name: Optionally fail on tool errors (not on found vulns)
          when: apply_changes | bool and fail_on_error | bool
          ansible.builtin.assert:
            that:
              - scan_results | length == (repos | length)
              - (scan_results | selectattr('syft_available','equalto',true) | selectattr('syft_rc','ne',0) | list | length) == 0
              - (scan_results | selectattr('grype_available','equalto',true) | selectattr('grype_rc','ne',0) | list | length) == 0
            fail_msg: "Syft/Grype returned non-zero for one or more repos. See sbom_scan_summary.json for details."

      rescue:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_status: "failed"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed: false
            fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: FAILED at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan failed at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}': {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__sbom_vuln_scan_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__sbom_vuln_scan":
                  component: "ansible/tasks/ans_content__sbom_vuln_scan"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__sbom_vuln_scan'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__sbom_vuln_scan_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__sbom_vuln_scan | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | bool
              - fe_ansible_tasks_ans_content__sbom_vuln_scan_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__sbom_vuln_scan: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed: true
            fe_ansible_tasks_ans_content__sbom_vuln_scan_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_status: "failed"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed: false
            fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan: FAILED at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__sbom_vuln_scan failed at '{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_failed_task }}': {{ fe_ansible_tasks_ans_content__sbom_vuln_scan_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__sbom_vuln_scan_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__sbom_vuln_scan_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__sbom_vuln_scan | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__sbom_vuln_scan":
                  component: "ansible/tasks/ans_content__sbom_vuln_scan"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__sbom_vuln_scan_duration_seconds | default(0) | int }}"
