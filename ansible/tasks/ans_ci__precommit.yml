---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_ci__precommit.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    apply_changes: "{{ apply_changes | default(false) }}"
    repo_root: "{{ repo_root | default('.') }}"

  tasks:
    - name: "ansible/tasks/ans_ci__precommit | Guarded execution with rescue and always handling"
      block:

        - name: Create pre-commit config
          ansible.builtin.copy:
            dest: "{{ repo_root }}/.pre-commit-config.yaml"
            mode: "0644"
            content: |
              minimum_pre_commit_version: "3.7.0"
              default_language_version:
                python: python3.11
              files: ^(?!(.git/|.venv/|venv/|.tox/|.mypy_cache/|.pytest_cache/|.cache/|node_modules/|dist/|build/|collections/)).*
              exclude: >
                (?x)^(
                  .git/|
                  .venv/|venv/|
                  .tox/|
                  .mypy_cache/|
                  .pytest_cache/|
                  .cache/|
                  node_modules/|
                  dist/|build/|
                  collections/|
                  ^molecule/.+/state\.yml
                )

              repos:
                # General hygiene
                - repo: https://github.com/pre-commit/pre-commit-hooks
                  rev: v4.6.0
                  hooks:
                    - id: trailing-whitespace
                    - id: end-of-file-fixer
                    - id: check-yaml
                    - id: check-json
                    - id: check-xml
                    - id: mixed-line-ending
                    - id: check-added-large-files
                    - id: detect-private-key

                # YAML lint
                - repo: https://github.com/adrienverge/yamllint
                  rev: v1.35.1
                  hooks:
                    - id: yamllint
                      additional_dependencies: []  # keep fast; config via .yamllint if present

                # Ansible lint (align major with CI)
                - repo: https://github.com/ansible-community/ansible-lint
                  rev: v25.9.0
                  hooks:
                    - id: ansible-lint
                      additional_dependencies:
                        - "ansible>=9,<13"

        - name: Install pre-commit client locally (optional)
          when: apply_changes | bool
          ansible.builtin.shell: |
            set -euo pipefail
            cd "{{ repo_root }}"
            if command -v pre-commit >/dev/null 2>&1; then
              pre-commit install --install-hooks
            else
              echo "pre-commit not installed; skipping client install"
            fi
          args:
            executable: /bin/bash
          changed_when: false

      rescue:

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_status: "failed"
            fe_ansible_tasks_ans_ci__precommit_postflight_passed: false
            fe_ansible_tasks_ans_ci__precommit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__precommit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__precommit: FAILED at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__precommit_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__precommit failed at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}': {{ fe_ansible_tasks_ans_ci__precommit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__precommit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__precommit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ci__precommit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__precommit":
                  component: "ansible/tasks/ans_ci__precommit"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__precommit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__precommit_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__precommit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__precommit_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__precommit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__precommit'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_ci__precommit_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_ci__precommit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_stats_published: true
          when:
            - fe_ansible_tasks_ans_ci__precommit_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "ansible/tasks/ans_ci__precommit | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_ci__precommit | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_ci__precommit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__precommit_status: "running"
            fe_ansible_tasks_ans_ci__precommit_preflight_passed: false
            fe_ansible_tasks_ans_ci__precommit_postflight_passed: false
            fe_ansible_tasks_ans_ci__precommit_failed_task: ""
            fe_ansible_tasks_ans_ci__precommit_error: ""
            fe_ansible_tasks_ans_ci__precommit_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_ci__precommit: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_ci__precommit: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ci__precommit | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_ci__precommit: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_ci__precommit: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_ci__precommit_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ci__precommit | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_status: "preflight_failed"
            fe_ansible_tasks_ans_ci__precommit_postflight_passed: false
            fe_ansible_tasks_ans_ci__precommit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__precommit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__precommit: FAILED at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__precommit_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__precommit":
                  component: "ansible/tasks/ans_ci__precommit"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__precommit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__precommit_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__precommit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__precommit_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__precommit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__precommit'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__precommit failed at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}': {{ fe_ansible_tasks_ans_ci__precommit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__precommit | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__precommit: preflight
              {{ 'passed' if fe_ansible_tasks_ans_ci__precommit_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_ci__precommit | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_ci__precommit | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_ci__precommit_preflight_passed | bool
              - fe_ansible_tasks_ans_ci__precommit_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_ci__precommit: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_ci__precommit_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_ci__precommit_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_ci__precommit: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_ci__precommit | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_postflight_passed: true
            fe_ansible_tasks_ans_ci__precommit_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_status: "failed"
            fe_ansible_tasks_ans_ci__precommit_postflight_passed: false
            fe_ansible_tasks_ans_ci__precommit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__precommit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__precommit: FAILED at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__precommit_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__precommit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__precommit failed at '{{ fe_ansible_tasks_ans_ci__precommit_failed_task }}': {{ fe_ansible_tasks_ans_ci__precommit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__precommit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__precommit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ci__precommit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__precommit":
                  component: "ansible/tasks/ans_ci__precommit"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__precommit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__precommit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__precommit_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__precommit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__precommit_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__precommit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__precommit_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__precommit'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_ci__precommit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__precommit_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ci__precommit | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__precommit: {{ fe_ansible_tasks_ans_ci__precommit_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_ci__precommit_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
