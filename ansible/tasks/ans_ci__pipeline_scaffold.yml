---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Scaffold CI for Ansible repo (GitHub Actions or GitLab CI)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-core-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    repo_root: "{{ repo_root | default('.') }}"
    use_github_actions: "{{ use_github_actions | default(true) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_ci__pipeline_scaffold | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_status: "running"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed: false
            fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed: false
            fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task: ""
            fe_ansible_tasks_ans_ci__pipeline_scaffold_error: ""
            fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_ci__pipeline_scaffold: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_ci__pipeline_scaffold: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_status: "preflight_failed"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed: false
            fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: FAILED at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__pipeline_scaffold":
                  component: "ansible/tasks/ans_ci__pipeline_scaffold"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__pipeline_scaffold'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold failed at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}': {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: preflight
              {{ 'passed' if fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: "ansible/tasks/ans_ci__pipeline_scaffold | Guarded execution with rescue and always handling"
      block:

        - name: Create GitHub Actions workflow
          when: apply_changes | bool and use_github_actions | bool
          ansible.builtin.copy:
            dest: "{{ repo_root }}/.github/workflows/ansible-ci.yml"
            mode: "0644"
            content: |
              name: Ansible CI
              on:
                pull_request:
                push:
                  branches: [ main, master ]
              permissions:
                contents: read
              jobs:
                lint-test:
                  runs-on: ubuntu-latest
                  steps:
                    - uses: actions/checkout@v4
                    - uses: actions/setup-python@v5
                      with:
                        python-version: '3.11'
                        cache: 'pip'
                    - name: Install dependencies
                      run: |
                        python -m pip install --upgrade pip
                        pip install \
                          "ansible>=9,<13" \
                          "ansible-lint>=25,<26" \
                          "pytest>=8,<9" \
                          "yamllint>=1.35,<2" \
                          "molecule>=6,<7" \
                          "molecule-plugins[docker]>=24,<25"
                    - name: Lint (ansible-lint)
                      run: ansible-lint
                    - name: Lint (yamllint)
                      run: yamllint .
                    - name: Unit tests (pytest)
                      run: |
                        if compgen -G "tests/test_*.py" > /dev/null; then pytest -q; else echo "No unit tests"; fi
                    - name: Molecule (Docker)
                      env:
                        MOLECULE_NO_LOG: "false"
                      run: |
                        if [ -f molecule/default/molecule.yml ]; then molecule test; else echo "No Molecule scenario"; fi

                build-ee:
                  if: ${{ always() }}
                  runs-on: ubuntu-latest
                  needs: [lint-test]
                  steps:
                    - uses: actions/checkout@v4
                    - uses: actions/setup-python@v5
                      with:
                        python-version: '3.11'
                        cache: 'pip'
                    - name: Build Execution Environment (optional)
                      run: |
                        if [ -f execution-environment.yml ] || [ -f ansible-builder.yml ]; then
                          python -m pip install --upgrade pip
                          pip install "ansible-builder>=3,<4"
                          ansible-builder build -t ghcr.io/${{ github.repository_owner }}/ee:ci
                        else
                          echo "No execution-environment.yml found"
                        fi

        - name: Create GitLab CI pipeline
          when: apply_changes | bool and not use_github_actions | bool
          ansible.builtin.copy:
            dest: "{{ repo_root }}/.gitlab-ci.yml"
            mode: "0644"
            content: |
              image: python:3.11

              variables:
                PIP_DISABLE_PIP_VERSION_CHECK: "1"
                PIP_NO_COLOR: "1"
                PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
                DOCKER_TLS_CERTDIR: ""    # allow docker:dind without TLS
                PYTHONDONTWRITEBYTECODE: "1"

              cache:
                paths:
                  - .pip-cache/

              services:
                - name: docker:dind
                  command: ["--mtu=1460"]

              stages: [lint, test, build]

              before_script:
                - python -m pip install --upgrade pip
                - pip install \
                    "ansible>=9,<13" \
                    "ansible-lint>=25,<26" \
                    "pytest>=8,<9" \
                    "yamllint>=1.35,<2" \
                    "molecule>=6,<7" \
                    "molecule-plugins[docker]>=24,<25"
                - apt-get update && apt-get install -y --no-install-recommends docker.io && rm -rf /var/lib/apt/lists/*

              lint:
                stage: lint
                script:
                  - ansible-lint
                  - yamllint .

              test:
                stage: test
                script:
                  - if compgen -G "tests/test_*.py" > /dev/null; then pytest -q; else echo "No unit tests"; fi
                  - if [ -f molecule/default/molecule.yml ]; then molecule test; else echo "No Molecule scenario"; fi

              build-ee:
                stage: build
                script:
                  - if [ -f execution-environment.yml ] || [ -f ansible-builder.yml ]; then
                      pip install "ansible-builder>=3,<4" &&
                      ansible-builder build -t ${CI_REGISTRY_IMAGE:-ee}:ci ;
                    else
                      echo "No execution-environment.yml found" ;
                    fi

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_status: "failed"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed: false
            fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: FAILED at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold failed at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}': {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ci__pipeline_scaffold_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__pipeline_scaffold":
                  component: "ansible/tasks/ans_ci__pipeline_scaffold"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__pipeline_scaffold'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published: true
          when:
            - fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_ci__pipeline_scaffold | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | bool
              - fe_ansible_tasks_ans_ci__pipeline_scaffold_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_ci__pipeline_scaffold: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed: true
            fe_ansible_tasks_ans_ci__pipeline_scaffold_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_status: "failed"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed: false
            fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: FAILED at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold failed at '{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task }}': {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ci__pipeline_scaffold_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ci__pipeline_scaffold":
                  component: "ansible/tasks/ans_ci__pipeline_scaffold"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('') == 'succeeded' else ['ansible/tasks/ans_ci__pipeline_scaffold'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ci__pipeline_scaffold_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ci__pipeline_scaffold | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ci__pipeline_scaffold: {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_ci__pipeline_scaffold_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
