---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_content__mirror_lock.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"
    requirements: "{{ requirements | default('requirements.yml') }}"
    lockfile_path: "{{ lockfile_path | default(artifacts_dir ~ '/collections.lock.json') }}"
    work_dir: "{{ artifacts_dir ~ '/_galaxy_tmp' }}"

  pre_tasks:
    - name: "ansible/tasks/ans_content__mirror_lock | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__mirror_lock | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_content__mirror_lock_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__mirror_lock_status: "running"
            fe_ansible_tasks_ans_content__mirror_lock_preflight_passed: false
            fe_ansible_tasks_ans_content__mirror_lock_postflight_passed: false
            fe_ansible_tasks_ans_content__mirror_lock_failed_task: ""
            fe_ansible_tasks_ans_content__mirror_lock_error: ""
            fe_ansible_tasks_ans_content__mirror_lock_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_content__mirror_lock: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_content__mirror_lock: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__mirror_lock | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_content__mirror_lock: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_content__mirror_lock: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_content__mirror_lock_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_content__mirror_lock | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_status: "preflight_failed"
            fe_ansible_tasks_ans_content__mirror_lock_postflight_passed: false
            fe_ansible_tasks_ans_content__mirror_lock_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__mirror_lock_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__mirror_lock: FAILED at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__mirror_lock":
                  component: "ansible/tasks/ans_content__mirror_lock"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__mirror_lock_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__mirror_lock_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__mirror_lock'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__mirror_lock failed at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}': {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__mirror_lock: preflight
              {{ 'passed' if fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory (least privilege)
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"

    - name: Validate requirements file exists and is a file
      ansible.builtin.stat:
        path: "{{ requirements }}"
        follow: false
      register: req_stat

    - name: Assert requirements is present
      ansible.builtin.assert:
        that:
          - req_stat.stat.exists
          - req_stat.stat.isreg
        fail_msg: "Requirements file not found: {{ requirements }}"

    - name: Load requirements content
      ansible.builtin.set_fact:
        _req_data: "{{ lookup('file', requirements) | from_yaml }}"

    - name: Normalize requested collections list
      ansible.builtin.set_fact:
        _req_collections: >-
          {{
            (
              _req_data.collections
              | default([])
              | map('community.general.to_yaml') | list  # harmless if collection absent; helps normalize
            ) if _req_data is mapping else []
          }}
      failed_when: false
      changed_when: false

    - name: Write plan (declared requirements)
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/mirror_lock_plan.json"
        mode: "0640"
        content: "{{ _req_data | to_nice_json }}"

  tasks:
    - name: "ansible/tasks/ans_content__mirror_lock | Guarded execution with rescue and always handling"
      block:

        - name: Prepare isolated install directory
          when: apply_changes | bool
          ansible.builtin.file:
            path: "{{ work_dir }}"
            state: directory
            mode: "0700"

        - name: Install collections into isolated path (no cache, deterministic)
          when: apply_changes | bool
          ansible.builtin.command:
            cmd: >
              ansible-galaxy collection install
              -r {{ requirements | quote }}
              -p {{ work_dir | quote }}
              --no-cache
          register: galaxy_install
          changed_when: false

        - name: List installed collections from isolated path
          when: apply_changes | bool
          ansible.builtin.command:
            cmd: ansible-galaxy collection list -p {{ work_dir | quote }}
          register: galaxy_list
          changed_when: false

        - name: Parse installed versions into lock map
          when: apply_changes | bool
          ansible.builtin.set_fact:
            _lock_entries: >-
              {%- set lines = galaxy_list.stdout_lines | default([]) -%}
              {%- set out = [] -%}
              {%- set start = false -%}
              {%- for ln in lines -%}
                {%- if ln|trim == 'Collection       Version' -%}
                  {%- set start = true -%}
                {%- elif start and (ln|trim) and ('---' not in ln) -%}
                  {%- set parts = (ln | regex_replace('\\s+', ' ') | trim).split(' ') -%}
                  {%- if parts|length >= 2 -%}
                    {%- set _ = out.append({'name': parts[0], 'version': parts[1]}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out | sort(attribute='name') }}
          changed_when: false

        - name: Write lockfile JSON (name/version pairs)
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ lockfile_path }}"
            mode: "0640"
            content: "{{ {'generated_at': ansible_date_time.iso8601, 'entries': _lock_entries} | to_nice_json }}"
            backup: true

        - name: Compute SHA-256 of lockfile
          when: apply_changes | bool
          ansible.builtin.stat:
            path: "{{ lockfile_path }}"
            checksum_algorithm: sha256
          register: _lf_stat

        - name: Write checksum sidecar
          when: apply_changes | bool
          ansible.builtin.copy:
            dest: "{{ lockfile_path }}.sha256"
            mode: "0640"
            content: "{{ _lf_stat.stat.checksum }}  {{ (lockfile_path | basename) }}\n"

        # Optional cleanup of isolated install dir (keep for audit by default)
        - name: Remove isolated work dir
          when: apply_changes | bool and (cleanup_workdir | default(false)) | bool
          ansible.builtin.file:
            path: "{{ work_dir }}"
            state: absent

      rescue:

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_status: "failed"
            fe_ansible_tasks_ans_content__mirror_lock_postflight_passed: false
            fe_ansible_tasks_ans_content__mirror_lock_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__mirror_lock_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__mirror_lock: FAILED at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__mirror_lock failed at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}': {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__mirror_lock_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__mirror_lock_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__mirror_lock":
                  component: "ansible/tasks/ans_content__mirror_lock"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__mirror_lock_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__mirror_lock_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__mirror_lock'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_content__mirror_lock_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_stats_published: true
          when:
            - fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_content__mirror_lock | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_content__mirror_lock | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | bool
              - fe_ansible_tasks_ans_content__mirror_lock_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_content__mirror_lock: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_content__mirror_lock_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_content__mirror_lock: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_content__mirror_lock | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_postflight_passed: true
            fe_ansible_tasks_ans_content__mirror_lock_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_status: "failed"
            fe_ansible_tasks_ans_content__mirror_lock_postflight_passed: false
            fe_ansible_tasks_ans_content__mirror_lock_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_content__mirror_lock_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__mirror_lock: FAILED at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_content__mirror_lock | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_content__mirror_lock failed at '{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task }}': {{ fe_ansible_tasks_ans_content__mirror_lock_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_content__mirror_lock_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_content__mirror_lock_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_content__mirror_lock":
                  component: "ansible/tasks/ans_content__mirror_lock"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_content__mirror_lock_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_content__mirror_lock_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_content__mirror_lock_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_content__mirror_lock_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_content__mirror_lock_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_content__mirror_lock_status | default('') == 'succeeded' else ['ansible/tasks/ans_content__mirror_lock'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_content__mirror_lock_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_content__mirror_lock_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_content__mirror_lock | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_content__mirror_lock: {{ fe_ansible_tasks_ans_content__mirror_lock_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_content__mirror_lock_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
