---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ans_ctrl__rbac_baseline.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_host: "{{ controller_host | default('https://controller.example.mil') }}"
    controller_oauthtoken: "{{ controller_oauthtoken | default(lookup('env','TOWER_TOKEN')) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ansible-controller-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

  pre_tasks:
    - name: "ansible/tasks/ans_ctrl__rbac_baseline | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_status: "running"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed: false
            fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed: false
            fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task: ""
            fe_ansible_tasks_ans_ctrl__rbac_baseline_error: ""
            fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published: false
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible/tasks/ans_ctrl__rbac_baseline: required variable '{{ item }}' is not defined."
            success_msg: "ansible/tasks/ans_ctrl__rbac_baseline: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_status: "preflight_failed"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed: false
            fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: FAILED at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ctrl__rbac_baseline":
                  component: "ansible/tasks/ans_ctrl__rbac_baseline"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else ['ansible/tasks/ans_ctrl__rbac_baseline'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline failed at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}': {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: preflight
              {{ 'passed' if fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"

  tasks:
    - name: "ansible/tasks/ans_ctrl__rbac_baseline | Guarded execution with rescue and always handling"
      block:

        - name: Plan RBAC baseline
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/rbac_baseline_plan.json"
            mode: "0640"
          content: "{{ {'bindings': iam_bindings | default([])} | to_nice_json }}"

        - name: Apply RBAC bindings
          when: apply_changes | bool
          loop: "{{ iam_bindings | default([]) }}"
          loop_control: { label: "{{ item.principal }} → {{ item.role }} on {{ item.object_type }} {{ item.object_name }}" }
          ansible.controller.role:
            controller_host: "{{ controller_host }}"
            controller_oauthtoken: "{{ controller_oauthtoken }}"
            validate_certs: "{{ validate_certs }}"
            user: "{{ (item.kind == 'user') | ternary(item.principal, omit) }}"
            team: "{{ (item.kind == 'team') | ternary(item.principal, omit) }}"
            role: "{{ item.role }}"
            target_organization: "{{ (item.object_type == 'organization') | ternary(item.object_name, omit) }}"
            target_project: "{{ (item.object_type == 'project') | ternary(item.object_name, omit) }}"
            target_inventory: "{{ (item.object_type == 'inventory') | ternary(item.object_name, omit) }}"
            target_credential: "{{ (item.object_type == 'credential') | ternary(item.object_name, omit) }}"
            target_job_template: "{{ (item.object_type == 'job_template') | ternary(item.object_name, omit) }}"
            state: present

      rescue:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_status: "failed"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed: false
            fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: FAILED at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline failed at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}': {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ctrl__rbac_baseline_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ctrl__rbac_baseline":
                  component: "ansible/tasks/ans_ctrl__rbac_baseline"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else ['ansible/tasks/ans_ctrl__rbac_baseline'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'failed'
            - not (fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published: true
          when:
            - fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'failed'
          tags:
            - always
  post_tasks:
    - name: "ansible/tasks/ans_ctrl__rbac_baseline | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | bool
              - fe_ansible_tasks_ans_ctrl__rbac_baseline_status in ['running', 'succeeded']
            fail_msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: postflight validation failed - preflight passed
              ={{ fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | default(false) }},
              status={{ fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('unknown') }}.
            success_msg: "ansible/tasks/ans_ctrl__rbac_baseline: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed: true
            fe_ansible_tasks_ans_ctrl__rbac_baseline_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_status: "failed"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed: false
            fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: FAILED at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          tags:
            - always
            - rescue

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline failed at '{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task }}': {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tasks_ans_ctrl__rbac_baseline_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible/tasks/ans_ctrl__rbac_baseline":
                  component: "ansible/tasks/ans_ctrl__rbac_baseline"
                  type: "playbook"
                  platform: "ansible"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_failed_task | default('') }}"
                  error: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('') == 'succeeded' else ['ansible/tasks/ans_ctrl__rbac_baseline'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tasks_ans_ctrl__rbac_baseline_stats_published: true
          tags:
            - always

        - name: "ansible/tasks/ans_ctrl__rbac_baseline | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible/tasks/ans_ctrl__rbac_baseline: {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_status | default('unknown') }} in
              {{ fe_ansible_tasks_ans_ctrl__rbac_baseline_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
