---
# Prometheus Configuration Role - Main Tasks
# Fourth Estate Agency - Infrastructure Monitoring

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['prometheus_grafana/prometheus_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_prometheus_grafana_prometheus_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "prometheus_grafana/prometheus_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_prometheus_grafana_prometheus_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_prometheus_grafana_prometheus_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_prometheus_grafana_prometheus_config_status: "running"
    fe_prometheus_grafana_prometheus_config_preflight_passed: false
    fe_prometheus_grafana_prometheus_config_postflight_passed: false
    fe_prometheus_grafana_prometheus_config_failed_task: ""
    fe_prometheus_grafana_prometheus_config_error: ""
    fe_prometheus_grafana_prometheus_config_stats_published: false
  tags:
    - always

- name: "prometheus_grafana/prometheus_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "prometheus_grafana/prometheus_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          prometheus_grafana/prometheus_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          prometheus_grafana/prometheus_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "prometheus_grafana/prometheus_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "prometheus_grafana/prometheus_config: required variable '{{ item }}' is not defined."
        success_msg: "prometheus_grafana/prometheus_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_prometheus_grafana_prometheus_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "prometheus_grafana/prometheus_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_prometheus_grafana_prometheus_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure Prometheus configuration directory exists
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - "{{ prometheus_config_dir }}"
        - "{{ prometheus_config_dir }}/rules"
        - "{{ prometheus_config_dir }}/file_sd"
      tags:
        - prometheus
        - prometheus_config

    - name: Create Prometheus main configuration file
      template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
        backup: true
        validate: "{{ prometheus_install_dir }}/promtool check config %s"
      notify:
        - validate prometheus config
        - reload prometheus
      tags:
        - prometheus
        - prometheus_config

    - name: Create recording rules files
      template:
        src: recording_rules.yml.j2
        dest: "{{ prometheus_config_dir }}/rules/{{ item.name }}.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
        backup: true
        validate: "{{ prometheus_install_dir }}/promtool check rules %s"
      loop: "{{ prometheus_recording_rules_files }}"
      when: prometheus_recording_rules_enabled
      notify:
        - validate prometheus config
        - reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - recording_rules

    - name: Create alert rules files
      template:
        src: alert_rules.yml.j2
        dest: "{{ prometheus_config_dir }}/rules/{{ item.name }}.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
        backup: true
        validate: "{{ prometheus_install_dir }}/promtool check rules %s"
      loop: "{{ prometheus_alert_rules_files }}"
      when: prometheus_alert_rules_enabled
      notify:
        - validate prometheus config
        - reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - alert_rules

    - name: Create service discovery files for node exporters
      template:
        src: file_sd_node_exporter.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/node_exporter.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_node_exporter_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for blackbox exporters
      template:
        src: file_sd_blackbox.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/blackbox_http.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_blackbox_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for PostgreSQL exporters
      template:
        src: file_sd_postgresql.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/postgresql.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_postgresql_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for MySQL exporters
      template:
        src: file_sd_mysql.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/mysql.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_mysql_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for Redis exporters
      template:
        src: file_sd_redis.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/redis.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_redis_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for NGINX exporters
      template:
        src: file_sd_nginx.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/nginx.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_nginx_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Create service discovery files for HAProxy exporters
      template:
        src: file_sd_haproxy.yml.j2
        dest: "{{ prometheus_config_dir }}/file_sd/haproxy.yml"
        owner: prometheus
        group: prometheus
        mode: "0644"
      when: prometheus_haproxy_targets is defined
      notify: reload prometheus
      tags:
        - prometheus
        - prometheus_config
        - service_discovery

    - name: Validate Prometheus configuration
      command: "{{ prometheus_install_dir }}/promtool check config {{ prometheus_config_dir }}/prometheus.yml"
      changed_when: false
      register: prometheus_config_validation
      tags:
        - prometheus
        - prometheus_config
        - validation

    - name: Display configuration validation results
      debug:
        msg: "{{ prometheus_config_validation.stdout_lines }}"
      tags:
        - prometheus
        - prometheus_config
        - validation

    - name: Check Prometheus rules
      command: "{{ prometheus_install_dir }}/promtool check rules {{ prometheus_config_dir }}/rules/*.yml"
      changed_when: false
      register: prometheus_rules_validation
      failed_when: false
      tags:
        - prometheus
        - prometheus_config
        - validation

    - name: Display rules validation results
      debug:
        msg: "{{ prometheus_rules_validation.stdout_lines }}"
      when: prometheus_rules_validation.stdout_lines is defined
      tags:
        - prometheus
        - prometheus_config
        - validation

    - name: Test alert rules
      command: "{{ prometheus_install_dir }}/promtool test rules {{ prometheus_config_dir }}/rules/*.yml"
      changed_when: false
      register: prometheus_rules_test
      failed_when: false
      tags:
        - prometheus
        - prometheus_config
        - testing

    - name: Ensure Prometheus service is running
      systemd:
        name: prometheus
        state: started
        enabled: true
      tags:
        - prometheus
        - prometheus_config
        - service

    - name: Wait for Prometheus to be ready
      uri:
        url: "http://localhost:9090/-/ready"
        status_code: 200
      retries: 10
      delay: 5
      tags:
        - prometheus
        - prometheus_config
        - service

    # ----------------------------- postflight -------------------

    - name: "prometheus_grafana/prometheus_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_prometheus_grafana_prometheus_config_preflight_passed | bool
          - fe_prometheus_grafana_prometheus_config_status in ['running', 'succeeded']
        fail_msg: >-
          prometheus_grafana/prometheus_config: postflight validation failed - preflight passed
          ={{ fe_prometheus_grafana_prometheus_config_preflight_passed | default(false) }},
          status={{ fe_prometheus_grafana_prometheus_config_status | default('unknown') }}.
        success_msg: "prometheus_grafana/prometheus_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "prometheus_grafana/prometheus_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_prometheus_grafana_prometheus_config_postflight_passed: true
        fe_prometheus_grafana_prometheus_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "prometheus_grafana/prometheus_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_prometheus_grafana_prometheus_config_status: "failed"
        fe_prometheus_grafana_prometheus_config_postflight_passed: false
        fe_prometheus_grafana_prometheus_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_prometheus_grafana_prometheus_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "prometheus_grafana/prometheus_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          prometheus_grafana/prometheus_config: FAILED at '{{ fe_prometheus_grafana_prometheus_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_prometheus_grafana_prometheus_config_error }}
      tags:
        - always
        - rescue

    - name: "prometheus_grafana/prometheus_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          prometheus_grafana/prometheus_config failed at '{{ fe_prometheus_grafana_prometheus_config_failed_task }}': {{ fe_prometheus_grafana_prometheus_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "prometheus_grafana/prometheus_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_prometheus_grafana_prometheus_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_prometheus_grafana_prometheus_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_prometheus_grafana_prometheus_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "prometheus_grafana/prometheus_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "prometheus_grafana/prometheus_config":
              component: "prometheus_grafana/prometheus_config"
              type: "role"
              platform: "prometheus_grafana"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_prometheus_grafana_prometheus_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_prometheus_grafana_prometheus_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_prometheus_grafana_prometheus_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_prometheus_grafana_prometheus_config_started_at | default('') }}"
              ended_at: "{{ fe_prometheus_grafana_prometheus_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_prometheus_grafana_prometheus_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_prometheus_grafana_prometheus_config_failed_task | default('') }}"
              error: "{{ fe_prometheus_grafana_prometheus_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_prometheus_grafana_prometheus_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_prometheus_grafana_prometheus_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_prometheus_grafana_prometheus_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_prometheus_grafana_prometheus_config_status | default('') == 'succeeded' else ['prometheus_grafana/prometheus_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "prometheus_grafana/prometheus_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_prometheus_grafana_prometheus_config_stats_published: true
      tags:
        - always
