---
# tasks file for veeam_repositories
# Manages Veeam Backup & Replication repositories including SOBR, object storage, and immutable backups

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['veeam/veeam_repositories']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_veeam_veeam_repositories_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "veeam/veeam_repositories | Initialize validation state"
  ansible.builtin.set_fact:
    fe_veeam_veeam_repositories_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_veeam_veeam_repositories_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_veeam_veeam_repositories_status: "running"
    fe_veeam_veeam_repositories_preflight_passed: false
    fe_veeam_veeam_repositories_postflight_passed: false
    fe_veeam_veeam_repositories_failed_task: ""
    fe_veeam_veeam_repositories_error: ""
    fe_veeam_veeam_repositories_stats_published: false
  tags:
    - always

- name: "veeam/veeam_repositories | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "veeam/veeam_repositories | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          veeam/veeam_repositories: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          veeam/veeam_repositories: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "veeam/veeam_repositories | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "veeam/veeam_repositories: required variable '{{ item }}' is not defined."
        success_msg: "veeam/veeam_repositories: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_veeam_veeam_repositories_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "veeam/veeam_repositories | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repositories_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Import Veeam PowerShell module
      ansible.windows.win_powershell:
        script: |
          Import-Module Veeam.Backup.PowerShell -ErrorAction SilentlyContinue
          if (-not (Get-Module Veeam.Backup.PowerShell)) {
            throw "Veeam PowerShell module not loaded"
          }
      tags: [veeam, repositories]

    - name: Create backup repository directories
      ansible.windows.win_file:
        path: "{{ item.path }}"
        state: directory
      loop: "{{ veeam_repositories }}"
      when:
        - item.type == 'windows'
        - item.path is defined
      tags: [veeam, repositories]

    - name: Configure Windows backup repositories
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_windows_repository.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          Path: "{{ item.path }}"
          Description: "{{ item.description | default('Backup repository for ' + item.name) }}"
          MaxConcurrentTasks: "{{ item.max_concurrent_tasks | default(4) }}"
          UsePerVMBackupFiles: "{{ item.per_vm_backup_files | default(true) }}"
          EnableDeduplication: "{{ item.enable_deduplication | default(false) }}"
          CompressionLevel: "{{ item.compression_level | default(5) }}"
          RotateVBKMonthly: "{{ item.rotate_vbk_monthly | default(false) }}"
      loop: "{{ veeam_repositories }}"
      when:
        - item.type == 'windows'
        - item.state | default('present') == 'present'
      register: windows_repo_result
      tags: [veeam, repositories]

    - name: Configure Linux backup repositories
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_linux_repository.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          HostName: "{{ item.host }}"
          Path: "{{ item.path }}"
          Username: "{{ item.username }}"
          Password: "{{ item.password }}"
          Description: "{{ item.description | default('Linux backup repository') }}"
          MaxConcurrentTasks: "{{ item.max_concurrent_tasks | default(4) }}"
          UseImmutability: "{{ item.immutable | default(true) }}"
          ImmutabilityPeriod: "{{ item.immutability_period_days | default(14) }}"
      loop: "{{ veeam_repositories }}"
      when:
        - item.type == 'linux'
        - item.state | default('present') == 'present'
      no_log: "{{ veeam_no_log | default(true) }}"
      register: linux_repo_result
      tags: [veeam, repositories, hardened]

    - name: Configure Scale-Out Backup Repository (SOBR)
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_sobr.ps1.j2') }}"
        parameters:
          SOBRName: "{{ item.name }}"
          Description: "{{ item.description | default('Scale-Out Backup Repository') }}"
          PerformanceTier: "{{ item.performance_tier_repos | to_json }}"
          PolicyType: "{{ item.policy_type | default('DataLocality') }}"
          EnableCapacityTier: "{{ item.enable_capacity_tier | default(false) }}"
          CapacityTierType: "{{ item.capacity_tier_type | default('') }}"
          OperationalRestorePeriod: "{{ item.operational_restore_days | default(7) }}"
          OverrideTransferPolicy: "{{ item.override_transfer_policy | default(false) }}"
          ImmediateCapacityTierCopy: "{{ item.immediate_capacity_copy | default(false) }}"
          EnableArchiveTier: "{{ item.enable_archive_tier | default(false) }}"
          ArchiveTierType: "{{ item.archive_tier_type | default('') }}"
          ArchivePeriod: "{{ item.archive_period_days | default(365) }}"
      loop: "{{ veeam_sobr_repositories }}"
      when:
        - veeam_sobr_repositories is defined
        - item.state | default('present') == 'present'
      register: sobr_result
      tags: [veeam, repositories, sobr]

    - name: Configure object storage repositories (S3/Azure/GCS)
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_object_storage.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          StorageType: "{{ item.storage_type }}"
          ServicePoint: "{{ item.service_point }}"
          Region: "{{ item.region | default('') }}"
          BucketName: "{{ item.bucket_name }}"
          AccessKey: "{{ item.access_key }}"
          SecretKey: "{{ item.secret_key }}"
          FolderPath: "{{ item.folder_path | default('/') }}"
          Description: "{{ item.description | default('Object storage repository') }}"
          SizeLimit: "{{ item.size_limit_gb | default(0) }}"
          EnableImmutability: "{{ item.immutable | default(false) }}"
          ImmutabilityPeriod: "{{ item.immutability_period_days | default(14) }}"
      loop: "{{ veeam_object_storage_repositories }}"
      when:
        - veeam_object_storage_repositories is defined
        - item.state | default('present') == 'present'
      no_log: "{{ veeam_no_log | default(true) }}"
      register: object_storage_result
      tags: [veeam, repositories, object-storage]

    - name: Configure repository encryption
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_repository_encryption.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          EnableEncryption: "{{ item.encryption_enabled | default(true) }}"
          EncryptionPassword: "{{ item.encryption_password }}"
          Description: "{{ item.encryption_description | default('AES-256 encryption') }}"
      loop: "{{ veeam_repositories + (veeam_object_storage_repositories | default([])) }}"
      when:
        - item.encryption_enabled | default(false)
        - item.encryption_password is defined
        - item.state | default('present') == 'present'
      no_log: "{{ veeam_no_log | default(true) }}"
      tags: [veeam, repositories, encryption]

    - name: Configure repository maintenance settings
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_repository_maintenance.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          EnableCompactFullBackup: "{{ item.compact_full_backup | default(true) }}"
          CompactScheduleEnabled: "{{ item.compact_schedule_enabled | default(true) }}"
          CompactScheduleTime: "{{ item.compact_schedule_time | default('22:00') }}"
          RemoveDeletedItemsAfterDays: "{{ item.remove_deleted_items_days | default(7) }}"
          HealthCheckEnabled: "{{ item.health_check_enabled | default(true) }}"
          HealthCheckSchedule: "{{ item.health_check_schedule | default('Weekly') }}"
      loop: "{{ veeam_repositories }}"
      when:
        - item.enable_maintenance | default(true)
        - item.state | default('present') == 'present'
      tags: [veeam, repositories, maintenance]

    - name: Verify repository capacity and status
      ansible.windows.win_powershell:
        script: |
          Import-Module Veeam.Backup.PowerShell
          $repos = Get-VBRBackupRepository
          $results = @()
          foreach ($repo in $repos) {
            $results += [PSCustomObject]@{
              Name = $repo.Name
              Type = $repo.Type
              Path = $repo.Path
              TotalSpaceGB = [math]::Round($repo.GetContainer().CachedTotalSpace.InGigabytes, 2)
              FreeSpaceGB = [math]::Round($repo.GetContainer().CachedFreeSpace.InGigabytes, 2)
              UsedSpacePercent = [math]::Round((($repo.GetContainer().CachedTotalSpace.InGigabytes - $repo.GetContainer().CachedFreeSpace.InGigabytes) / $repo.GetContainer().CachedTotalSpace.InGigabytes) * 100, 2)
            }
          }
          $results | ConvertTo-Json -Depth 3
      register: repository_status
      changed_when: false
      tags: [veeam, repositories, verify]

    - name: Display repository status
      ansible.builtin.debug:
        msg: "{{ repository_status.output | from_json }}"
      when: veeam_debug | default(false)
      tags: [veeam, repositories, verify]

    - name: Configure capacity planning alerts
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_capacity_alerts.ps1.j2') }}"
        parameters:
          WarningThresholdPercent: "{{ veeam_capacity_warning_threshold | default(80) }}"
          CriticalThresholdPercent: "{{ veeam_capacity_critical_threshold | default(90) }}"
          EmailNotification: "{{ veeam_capacity_alert_email | default('') }}"
      when: veeam_enable_capacity_alerts | default(true)
      tags: [veeam, repositories, alerts]

    - name: Configure immutable backup storage (hardened repository)
      ansible.windows.win_powershell:
        script: "{{ lookup('template', 'configure_immutable_storage.ps1.j2') }}"
        parameters:
          RepositoryName: "{{ item.name }}"
          ImmutabilityEnabled: true
          ImmutabilityPeriodDays: "{{ item.immutability_period_days | default(14) }}"
          EnableCompliance: "{{ item.compliance_mode | default(false) }}"
      loop: "{{ veeam_repositories }}"
      when:
        - item.type == 'linux'
        - item.immutable | default(false)
        - item.state | default('present') == 'present'
      register: immutable_config
      tags: [veeam, repositories, immutable, ransomware-protection]

    - name: Test repository connectivity and permissions
      ansible.windows.win_powershell:
        script: |
          Import-Module Veeam.Backup.PowerShell
          $repo = Get-VBRBackupRepository -Name "{{ item.name }}"
          if ($repo) {
            try {
              $testFile = Join-Path $repo.Path "veeam_connectivity_test_$(Get-Date -Format 'yyyyMMddHHmmss').tmp"
              "Test" | Out-File -FilePath $testFile -Force
              Remove-Item -Path $testFile -Force
              Write-Output "SUCCESS: Repository {{ item.name }} is accessible and writable"
            } catch {
              Write-Error "FAILED: Repository {{ item.name }} connectivity test failed: $_"
            }
          } else {
            Write-Error "Repository {{ item.name }} not found"
          }
      loop: "{{ veeam_repositories }}"
      when:
        - item.type == 'windows'
        - item.test_connectivity | default(true)
      register: connectivity_test
      failed_when: "'FAILED' in connectivity_test.error"
      tags: [veeam, repositories, test]

    - name: Generate repository documentation
      ansible.windows.win_copy:
        content: "{{ lookup('template', 'repository_documentation.md.j2') }}"
        dest: "{{ veeam_documentation_path | default('C:\\VeeamConfig\\Docs') }}\\repositories_{{ ansible_date_time.date }}.md"
      when: veeam_generate_documentation | default(true)
      tags: [veeam, repositories, documentation]

    # ----------------------------- postflight -------------------

    - name: "veeam/veeam_repositories | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_veeam_veeam_repositories_preflight_passed | bool
          - fe_veeam_veeam_repositories_status in ['running', 'succeeded']
        fail_msg: >-
          veeam/veeam_repositories: postflight validation failed - preflight passed
          ={{ fe_veeam_veeam_repositories_preflight_passed | default(false) }},
          status={{ fe_veeam_veeam_repositories_status | default('unknown') }}.
        success_msg: "veeam/veeam_repositories: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "veeam/veeam_repositories | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repositories_postflight_passed: true
        fe_veeam_veeam_repositories_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "veeam/veeam_repositories | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repositories_status: "failed"
        fe_veeam_veeam_repositories_postflight_passed: false
        fe_veeam_veeam_repositories_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_veeam_veeam_repositories_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "veeam/veeam_repositories | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          veeam/veeam_repositories: FAILED at '{{ fe_veeam_veeam_repositories_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_veeam_veeam_repositories_error }}
      tags:
        - always
        - rescue

    - name: "veeam/veeam_repositories | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          veeam/veeam_repositories failed at '{{ fe_veeam_veeam_repositories_failed_task }}': {{ fe_veeam_veeam_repositories_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "veeam/veeam_repositories | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repositories_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_veeam_veeam_repositories_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_veeam_veeam_repositories_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "veeam/veeam_repositories | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "veeam/veeam_repositories":
              component: "veeam/veeam_repositories"
              type: "role"
              platform: "veeam"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_veeam_veeam_repositories_status | default('unknown') }}"
              preflight_passed: "{{ fe_veeam_veeam_repositories_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_veeam_veeam_repositories_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_veeam_veeam_repositories_started_at | default('') }}"
              ended_at: "{{ fe_veeam_veeam_repositories_ended_at | default('') }}"
              duration_seconds: "{{ fe_veeam_veeam_repositories_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_veeam_veeam_repositories_failed_task | default('') }}"
              error: "{{ fe_veeam_veeam_repositories_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_veeam_veeam_repositories_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_veeam_veeam_repositories_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_veeam_veeam_repositories_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_veeam_veeam_repositories_status | default('') == 'succeeded' else ['veeam/veeam_repositories'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "veeam/veeam_repositories | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repositories_stats_published: true
      tags:
        - always
