---
# Minimal example for a Windows repo. For Linux hardened, change type and add immutability settings.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['veeam/veeam_repository_ensure']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_veeam_veeam_repository_ensure_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "veeam/veeam_repository_ensure | Initialize validation state"
  ansible.builtin.set_fact:
    fe_veeam_veeam_repository_ensure_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_veeam_veeam_repository_ensure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_veeam_veeam_repository_ensure_status: "running"
    fe_veeam_veeam_repository_ensure_preflight_passed: false
    fe_veeam_veeam_repository_ensure_postflight_passed: false
    fe_veeam_veeam_repository_ensure_failed_task: ""
    fe_veeam_veeam_repository_ensure_error: ""
    fe_veeam_veeam_repository_ensure_stats_published: false
  tags:
    - always

- name: "veeam/veeam_repository_ensure | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "veeam/veeam_repository_ensure | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          veeam/veeam_repository_ensure: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          veeam/veeam_repository_ensure: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "veeam/veeam_repository_ensure | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "veeam/veeam_repository_ensure: required variable '{{ item }}' is not defined."
        success_msg: "veeam/veeam_repository_ensure: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_veeam_veeam_repository_ensure_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "veeam/veeam_repository_ensure | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repository_ensure_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get repositories
      ansible.builtin.uri:
        url: "{{ veeam_base_url }}/api/v1/backupInfrastructure/repositories"
        method: GET
        headers: { Authorization: "Bearer {{ veeam_token }}" }
        status_code: [200]
        return_content: true
        validate_certs: "{{ veeam_verify_tls }}"
      register: repos

    - name: Create/Update repository
      vars:
        current: "{{ (repos.json.data | default([])) | selectattr('name','equalto', repo_name) | list | first }}"
      ansible.builtin.uri:
        url: >-
          {{
            veeam_base_url ~ '/api/v1/backupInfrastructure/repositories' if (current is not defined)
            else veeam_base_url ~ '/api/v1/backupInfrastructure/repositories/' ~ current.id
          }}
        method: "{{ 'POST' if (current is not defined) else 'PUT' }}"
        headers:
          Authorization: "Bearer {{ veeam_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "WinLocal"
          name: "{{ repo_name }}"
          description: "Ansible-managed Windows repo"
          hostId: "{{ windows_host_id }}"     # pre-added managed server GUID
          path: "{{ repo_path }}"             # e.g. D:\\Backups
          limitConcurrentTasks: true
          maxConcurrentTasks: 4
          rotateDrives: false
        status_code: [200,201,204]
        validate_certs: "{{ veeam_verify_tls }}"

    # ----------------------------- postflight -------------------

    - name: "veeam/veeam_repository_ensure | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_veeam_veeam_repository_ensure_preflight_passed | bool
          - fe_veeam_veeam_repository_ensure_status in ['running', 'succeeded']
        fail_msg: >-
          veeam/veeam_repository_ensure: postflight validation failed - preflight passed
          ={{ fe_veeam_veeam_repository_ensure_preflight_passed | default(false) }},
          status={{ fe_veeam_veeam_repository_ensure_status | default('unknown') }}.
        success_msg: "veeam/veeam_repository_ensure: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "veeam/veeam_repository_ensure | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repository_ensure_postflight_passed: true
        fe_veeam_veeam_repository_ensure_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "veeam/veeam_repository_ensure | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repository_ensure_status: "failed"
        fe_veeam_veeam_repository_ensure_postflight_passed: false
        fe_veeam_veeam_repository_ensure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_veeam_veeam_repository_ensure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "veeam/veeam_repository_ensure | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          veeam/veeam_repository_ensure: FAILED at '{{ fe_veeam_veeam_repository_ensure_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_veeam_veeam_repository_ensure_error }}
      tags:
        - always
        - rescue

    - name: "veeam/veeam_repository_ensure | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          veeam/veeam_repository_ensure failed at '{{ fe_veeam_veeam_repository_ensure_failed_task }}': {{ fe_veeam_veeam_repository_ensure_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "veeam/veeam_repository_ensure | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repository_ensure_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_veeam_veeam_repository_ensure_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_veeam_veeam_repository_ensure_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "veeam/veeam_repository_ensure | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "veeam/veeam_repository_ensure":
              component: "veeam/veeam_repository_ensure"
              type: "tasks"
              platform: "veeam"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_veeam_veeam_repository_ensure_status | default('unknown') }}"
              preflight_passed: "{{ fe_veeam_veeam_repository_ensure_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_veeam_veeam_repository_ensure_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_veeam_veeam_repository_ensure_started_at | default('') }}"
              ended_at: "{{ fe_veeam_veeam_repository_ensure_ended_at | default('') }}"
              duration_seconds: "{{ fe_veeam_veeam_repository_ensure_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_veeam_veeam_repository_ensure_failed_task | default('') }}"
              error: "{{ fe_veeam_veeam_repository_ensure_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_veeam_veeam_repository_ensure_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_veeam_veeam_repository_ensure_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_veeam_veeam_repository_ensure_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_veeam_veeam_repository_ensure_status | default('') == 'succeeded' else ['veeam/veeam_repository_ensure'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "veeam/veeam_repository_ensure | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_veeam_veeam_repository_ensure_stats_published: true
      tags:
        - always
