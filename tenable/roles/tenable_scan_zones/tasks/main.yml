---
# tenable_scan_zones/tasks/main.yml
# Tenable Scan Zone Management for Fourth Estate Agencies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['tenable/tenable_scan_zones']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_tenable_tenable_scan_zones_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "tenable/tenable_scan_zones | Initialize validation state"
  ansible.builtin.set_fact:
    fe_tenable_tenable_scan_zones_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_tenable_tenable_scan_zones_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_tenable_tenable_scan_zones_status: "running"
    fe_tenable_tenable_scan_zones_preflight_passed: false
    fe_tenable_tenable_scan_zones_postflight_passed: false
    fe_tenable_tenable_scan_zones_failed_task: ""
    fe_tenable_tenable_scan_zones_error: ""
    fe_tenable_tenable_scan_zones_stats_published: false
  tags:
    - always

- name: "tenable/tenable_scan_zones | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "tenable/tenable_scan_zones | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          tenable/tenable_scan_zones: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          tenable/tenable_scan_zones: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_scan_zones | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "tenable/tenable_scan_zones: required variable '{{ item }}' is not defined."
        success_msg: "tenable/tenable_scan_zones: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_tenable_tenable_scan_zones_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_scan_zones | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_tenable_tenable_scan_zones_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get API token for Security Center
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/token"
        method: POST
        body_format: json
        body:
          username: "{{ tsc_username }}"
          password: "{{ tsc_password }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      register: token_response
      no_log: true

    - name: Set API token fact
      ansible.builtin.set_fact:
        tsc_token: "{{ token_response.json.response.token }}"
      no_log: true

    # Create Scan Zones
    - name: Create scan zones
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/zone"
        method: POST
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          ipList: "{{ item.ip_list }}"
          activeScanners: "{{ item.active_scanners | default([]) }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: [200, 400]
      loop: "{{ tsc_scan_zones }}"
      when: tsc_scan_zones | length > 0
      register: zone_result

    - name: Store zone IDs for reference
      ansible.builtin.set_fact:
        tsc_zone_ids: "{{ tsc_zone_ids | default({}) | combine({item.item.name: item.json.response.id}) }}"
      loop: "{{ zone_result.results }}"
      when:
        - not zone_result.skipped | default(false)
        - item.json.response.id is defined

    # Assign Scanners to Zones
    - name: Get list of all scanners
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/scanner"
        method: GET
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      register: scanner_list

    - name: Assign scanners to zones
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/scanner/{{ item.0.id }}"
        method: PATCH
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          zones:
            - id: "{{ tsc_zone_ids[item.1] }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      with_subelements:
        - "{{ scanner_list.json.response.usable }}"
        - zones
        - skip_missing: true
      when:
        - scanner_list.json.response.usable is defined
        - tsc_zone_ids is defined

    # Configure Zone Permissions
    - name: Configure zone access for organizations
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/zone/{{ tsc_zone_ids[item.0.name] }}/organization"
        method: POST
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          organizationID: "{{ item.1 }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: [200, 400]
      with_subelements:
        - "{{ tsc_scan_zones }}"
        - organizations
        - skip_missing: true
      when:
        - tsc_scan_zones | length > 0
        - tsc_zone_ids is defined

    # Validate Zone Configuration
    - name: Validate scan zone configuration
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/zone/{{ tsc_zone_ids[item.name] }}"
        method: GET
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      loop: "{{ tsc_scan_zones }}"
      when:
        - tsc_scan_zones | length > 0
        - tsc_zone_ids is defined
      register: zone_validation

    # Revoke API token
    - name: Revoke API token
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/token"
        method: DELETE
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      no_log: true

    - name: Display scan zone summary
      ansible.builtin.debug:
        msg: |
          Tenable Scan Zone Configuration Complete
          Zones Created: {{ tsc_scan_zones | length }}
          Zone Details:
          {% for zone in tsc_scan_zones %}
          - {{ zone.name }}: {{ zone.ip_list }}
          {% endfor %}

    # ----------------------------- postflight -------------------

    - name: "tenable/tenable_scan_zones | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_tenable_tenable_scan_zones_preflight_passed | bool
          - fe_tenable_tenable_scan_zones_status in ['running', 'succeeded']
        fail_msg: >-
          tenable/tenable_scan_zones: postflight validation failed - preflight passed
          ={{ fe_tenable_tenable_scan_zones_preflight_passed | default(false) }},
          status={{ fe_tenable_tenable_scan_zones_status | default('unknown') }}.
        success_msg: "tenable/tenable_scan_zones: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "tenable/tenable_scan_zones | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_tenable_tenable_scan_zones_postflight_passed: true
        fe_tenable_tenable_scan_zones_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "tenable/tenable_scan_zones | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_tenable_tenable_scan_zones_status: "failed"
        fe_tenable_tenable_scan_zones_postflight_passed: false
        fe_tenable_tenable_scan_zones_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_tenable_tenable_scan_zones_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "tenable/tenable_scan_zones | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          tenable/tenable_scan_zones: FAILED at '{{ fe_tenable_tenable_scan_zones_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_tenable_tenable_scan_zones_error }}
      tags:
        - always
        - rescue

    - name: "tenable/tenable_scan_zones | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          tenable/tenable_scan_zones failed at '{{ fe_tenable_tenable_scan_zones_failed_task }}': {{ fe_tenable_tenable_scan_zones_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "tenable/tenable_scan_zones | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_tenable_tenable_scan_zones_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_tenable_tenable_scan_zones_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_tenable_scan_zones_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "tenable/tenable_scan_zones | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "tenable/tenable_scan_zones":
              component: "tenable/tenable_scan_zones"
              type: "role"
              platform: "tenable"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_tenable_tenable_scan_zones_status | default('unknown') }}"
              preflight_passed: "{{ fe_tenable_tenable_scan_zones_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_tenable_tenable_scan_zones_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_tenable_tenable_scan_zones_started_at | default('') }}"
              ended_at: "{{ fe_tenable_tenable_scan_zones_ended_at | default('') }}"
              duration_seconds: "{{ fe_tenable_tenable_scan_zones_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_tenable_tenable_scan_zones_failed_task | default('') }}"
              error: "{{ fe_tenable_tenable_scan_zones_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_tenable_tenable_scan_zones_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_tenable_tenable_scan_zones_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_tenable_tenable_scan_zones_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_tenable_tenable_scan_zones_status | default('') == 'succeeded' else ['tenable/tenable_scan_zones'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "tenable/tenable_scan_zones | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_tenable_tenable_scan_zones_stats_published: true
      tags:
        - always
