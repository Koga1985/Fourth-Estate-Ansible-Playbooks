---
# tenable_security_center_install/tasks/main.yml
# Tenable Security Center Installation for Fourth Estate Agencies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['tenable/tenable_security_center_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_tenable_tenable_security_center_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "tenable/tenable_security_center_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_tenable_tenable_security_center_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_tenable_tenable_security_center_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_tenable_tenable_security_center_install_status: "running"
    fe_tenable_tenable_security_center_install_preflight_passed: false
    fe_tenable_tenable_security_center_install_postflight_passed: false
    fe_tenable_tenable_security_center_install_failed_task: ""
    fe_tenable_tenable_security_center_install_error: ""
    fe_tenable_tenable_security_center_install_stats_published: false
  tags:
    - always

- name: "tenable/tenable_security_center_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "tenable/tenable_security_center_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          tenable/tenable_security_center_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          tenable/tenable_security_center_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "tenable/tenable_security_center_install: required variable '{{ item }}' is not defined."
        success_msg: "tenable/tenable_security_center_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_tenable_tenable_security_center_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include OS-specific variables
      ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
      when: ansible_os_family in ['RedHat', 'Debian']

    - name: Validate installation prerequisites
      ansible.builtin.assert:
        that:
          - tsc_version is defined
          - tsc_license_file is defined or tsc_license_content is defined
          - tsc_db_type in ['postgresql', 'mysql']
          - tsc_admin_password | length >= 12
        fail_msg: "Required installation parameters are missing or invalid"

    - name: Create Tenable installation directory
      ansible.builtin.file:
        path: "{{ tsc_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create Tenable data directory
      ansible.builtin.file:
        path: "{{ tsc_data_dir }}"
        state: directory
        owner: tns
        group: tns
        mode: '0750'
      when: tsc_create_data_dir | bool

    # Database Setup
    - name: Include PostgreSQL setup tasks
      ansible.builtin.include_tasks: postgresql.yml
      when: tsc_db_type == 'postgresql'

    - name: Include MySQL setup tasks
      ansible.builtin.include_tasks: mysql.yml
      when: tsc_db_type == 'mysql'

    # Security Center Installation
    - name: Check if Security Center is already installed
      ansible.builtin.stat:
        path: /opt/sc/support/bin/scmanager
      register: tsc_installed

    - name: Download Security Center package
      ansible.builtin.get_url:
        url: "{{ tsc_download_url }}/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        dest: "/tmp/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        checksum: "{{ tsc_checksum | default(omit) }}"
        mode: '0644'
        timeout: 600
      when: not tsc_installed.stat.exists and tsc_download_enabled | bool

    - name: Copy Security Center package from local
      ansible.builtin.copy:
        src: "{{ tsc_package_path }}"
        dest: "/tmp/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        mode: '0644'
      when: not tsc_installed.stat.exists and not tsc_download_enabled | bool

    - name: Install Security Center (RPM)
      ansible.builtin.yum:
        name: "/tmp/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        state: present
        disable_gpg_check: yes
      when:
        - ansible_os_family == 'RedHat'
        - not tsc_installed.stat.exists
      notify: restart security center

    - name: Install Security Center (DEB)
      ansible.builtin.apt:
        deb: "/tmp/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        state: present
      when:
        - ansible_os_family == 'Debian'
        - not tsc_installed.stat.exists
      notify: restart security center

    # License Configuration
    - name: Copy license file
      ansible.builtin.copy:
        src: "{{ tsc_license_file }}"
        dest: /opt/sc/license.txt
        owner: tns
        group: tns
        mode: '0640'
      when: tsc_license_file is defined
      notify: restart security center

    - name: Create license file from content
      ansible.builtin.copy:
        content: "{{ tsc_license_content }}"
        dest: /opt/sc/license.txt
        owner: tns
        group: tns
        mode: '0640'
      when: tsc_license_content is defined
      notify: restart security center

    # SSL/TLS Configuration
    - name: Create SSL directory
      ansible.builtin.file:
        path: /opt/sc/support/conf/ssl
        state: directory
        owner: tns
        group: tns
        mode: '0750'

    - name: Copy SSL certificate
      ansible.builtin.copy:
        src: "{{ tsc_ssl_cert }}"
        dest: /opt/sc/support/conf/ssl/server.crt
        owner: tns
        group: tns
        mode: '0640'
      when: tsc_ssl_cert is defined
      notify: restart security center

    - name: Copy SSL private key
      ansible.builtin.copy:
        src: "{{ tsc_ssl_key }}"
        dest: /opt/sc/support/conf/ssl/server.key
        owner: tns
        group: tns
        mode: '0600'
      when: tsc_ssl_key is defined
      notify: restart security center

    - name: Generate self-signed certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:4096
          -keyout /opt/sc/support/conf/ssl/server.key
          -out /opt/sc/support/conf/ssl/server.crt
          -subj "/C=US/ST={{ tsc_ssl_state }}/L={{ tsc_ssl_city }}/O={{ tsc_ssl_org }}/CN={{ tsc_hostname }}"
        creates: /opt/sc/support/conf/ssl/server.crt
      when:
        - tsc_ssl_cert is not defined
        - tsc_generate_self_signed | bool
      notify: restart security center

    # Service Configuration
    - name: Template Security Center configuration
      ansible.builtin.template:
        src: sc_config.conf.j2
        dest: /opt/sc/support/conf/sc_config.conf
        owner: tns
        group: tns
        mode: '0640'
      notify: restart security center

    - name: Configure Security Center systemd service
      ansible.builtin.template:
        src: tenable-sc.service.j2
        dest: /etc/systemd/system/tenable-sc.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart security center

    # Firewall Configuration
    - name: Configure firewalld for Security Center
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - "{{ tsc_https_port }}/tcp"
        - "{{ tsc_http_port }}/tcp"
      when:
        - ansible_os_family == 'RedHat'
        - tsc_configure_firewall | bool

    - name: Configure UFW for Security Center
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ tsc_https_port }}"
        - "{{ tsc_http_port }}"
      when:
        - ansible_os_family == 'Debian'
        - tsc_configure_firewall | bool

    # SELinux Configuration
    - name: Set SELinux contexts for Security Center
      community.general.sefcontext:
        target: "{{ item.target }}"
        setype: "{{ item.type }}"
        state: present
      loop:
        - { target: '/opt/sc(/.*)?', type: 'usr_t' }
        - { target: '/opt/sc/support/bin(/.*)?', type: 'bin_t' }
        - { target: '{{ tsc_data_dir }}(/.*)?', type: 'var_lib_t' }
      when:
        - ansible_selinux.status == 'enabled'
        - tsc_configure_selinux | bool

    - name: Apply SELinux file contexts
      ansible.builtin.command:
        cmd: restorecon -Rv {{ item }}
      loop:
        - /opt/sc
        - "{{ tsc_data_dir }}"
      when:
        - ansible_selinux.status == 'enabled'
        - tsc_configure_selinux | bool
      changed_when: false

    - name: Configure SELinux boolean for network connections
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes
      when:
        - ansible_selinux.status == 'enabled'
        - tsc_configure_selinux | bool

    # Initial Admin Setup
    - name: Wait for Security Center to initialize
      ansible.builtin.wait_for:
        port: "{{ tsc_https_port }}"
        host: localhost
        delay: 30
        timeout: 300
      when: not tsc_installed.stat.exists

    - name: Configure initial admin account
      ansible.builtin.uri:
        url: "https://{{ tsc_hostname }}:{{ tsc_https_port }}/rest/system/init"
        method: POST
        body_format: json
        body:
          username: "{{ tsc_admin_username }}"
          password: "{{ tsc_admin_password }}"
          email: "{{ tsc_admin_email }}"
          firstName: "{{ tsc_admin_firstname }}"
          lastName: "{{ tsc_admin_lastname }}"
          role: "SecurityManager"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: [200, 400]
      register: admin_setup
      when: not tsc_installed.stat.exists
      no_log: true

    # Plugin Feed Configuration
    - name: Configure plugin feed settings
      ansible.builtin.template:
        src: plugin_feed.conf.j2
        dest: /opt/sc/support/conf/plugin_feed.conf
        owner: tns
        group: tns
        mode: '0640'
      notify: restart security center

    - name: Enable automatic plugin updates
      ansible.builtin.cron:
        name: "Tenable plugin feed update"
        minute: "{{ tsc_plugin_update_minute }}"
        hour: "{{ tsc_plugin_update_hour }}"
        job: "/opt/sc/support/bin/scmanager update plugins"
        user: tns
      when: tsc_auto_plugin_update | bool

    # Log Rotation
    - name: Configure log rotation for Security Center
      ansible.builtin.template:
        src: tenable-sc-logrotate.j2
        dest: /etc/logrotate.d/tenable-sc
        owner: root
        group: root
        mode: '0644'

    # Health Check
    - name: Verify Security Center is running
      ansible.builtin.uri:
        url: "https://{{ tsc_hostname }}:{{ tsc_https_port }}/rest/status"
        method: GET
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200

    - name: Display installation status
      ansible.builtin.debug:
        msg: |
          Tenable Security Center Installation Complete
          Version: {{ tsc_version }}
          URL: https://{{ tsc_hostname }}:{{ tsc_https_port }}
          Admin Username: {{ tsc_admin_username }}
          Database: {{ tsc_db_type }}
          Data Directory: {{ tsc_data_dir }}
          SSL Enabled: Yes
          Plugin Auto-Update: {{ tsc_auto_plugin_update }}

    - name: Clean up installation package
      ansible.builtin.file:
        path: "/tmp/SecurityCenter-{{ tsc_version }}.{{ tsc_package_ext }}"
        state: absent
      when: tsc_cleanup_package | bool

    # ----------------------------- postflight -------------------

    - name: "tenable/tenable_security_center_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_tenable_tenable_security_center_install_preflight_passed | bool
          - fe_tenable_tenable_security_center_install_status in ['running', 'succeeded']
        fail_msg: >-
          tenable/tenable_security_center_install: postflight validation failed - preflight passed
          ={{ fe_tenable_tenable_security_center_install_preflight_passed | default(false) }},
          status={{ fe_tenable_tenable_security_center_install_status | default('unknown') }}.
        success_msg: "tenable/tenable_security_center_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "tenable/tenable_security_center_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postflight_passed: true
        fe_tenable_tenable_security_center_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "tenable/tenable_security_center_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_status: "failed"
        fe_tenable_tenable_security_center_install_postflight_passed: false
        fe_tenable_tenable_security_center_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_tenable_tenable_security_center_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          tenable/tenable_security_center_install: FAILED at '{{ fe_tenable_tenable_security_center_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_tenable_tenable_security_center_install_error }}
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          tenable/tenable_security_center_install failed at '{{ fe_tenable_tenable_security_center_install_failed_task }}': {{ fe_tenable_tenable_security_center_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "tenable/tenable_security_center_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_tenable_tenable_security_center_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_tenable_security_center_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "tenable/tenable_security_center_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "tenable/tenable_security_center_install":
              component: "tenable/tenable_security_center_install"
              type: "role"
              platform: "tenable"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_tenable_tenable_security_center_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_tenable_tenable_security_center_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_tenable_tenable_security_center_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_tenable_tenable_security_center_install_started_at | default('') }}"
              ended_at: "{{ fe_tenable_tenable_security_center_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_tenable_tenable_security_center_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_tenable_tenable_security_center_install_failed_task | default('') }}"
              error: "{{ fe_tenable_tenable_security_center_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_tenable_tenable_security_center_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_tenable_tenable_security_center_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_tenable_tenable_security_center_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_tenable_tenable_security_center_install_status | default('') == 'succeeded' else ['tenable/tenable_security_center_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "tenable/tenable_security_center_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_stats_published: true
      tags:
        - always
