---
# tenable_security_center_install/tasks/postgresql.yml
# PostgreSQL Database Setup for Tenable Security Center

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['tenable/tenable_security_center_install/postgresql']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_tenable_tenable_security_center_install_postgresql_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "tenable/tenable_security_center_install/postgresql | Initialize validation state"
  ansible.builtin.set_fact:
    fe_tenable_tenable_security_center_install_postgresql_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_tenable_tenable_security_center_install_postgresql_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_tenable_tenable_security_center_install_postgresql_status: "running"
    fe_tenable_tenable_security_center_install_postgresql_preflight_passed: false
    fe_tenable_tenable_security_center_install_postgresql_postflight_passed: false
    fe_tenable_tenable_security_center_install_postgresql_failed_task: ""
    fe_tenable_tenable_security_center_install_postgresql_error: ""
    fe_tenable_tenable_security_center_install_postgresql_stats_published: false
  tags:
    - always

- name: "tenable/tenable_security_center_install/postgresql | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "tenable/tenable_security_center_install/postgresql | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          tenable/tenable_security_center_install/postgresql: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          tenable/tenable_security_center_install/postgresql: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install/postgresql | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "tenable/tenable_security_center_install/postgresql: required variable '{{ item }}' is not defined."
        success_msg: "tenable/tenable_security_center_install/postgresql: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_tenable_tenable_security_center_install_postgresql_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install/postgresql | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postgresql_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install PostgreSQL server (RedHat)
      ansible.builtin.yum:
        name:
          - postgresql-server
          - postgresql-contrib
          - python3-psycopg2
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install PostgreSQL server (Debian)
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
      when: ansible_os_family == 'Debian'

    - name: Initialize PostgreSQL database
      ansible.builtin.command:
        cmd: postgresql-setup --initdb
        creates: /var/lib/pgsql/data/PG_VERSION
      when: ansible_os_family == 'RedHat'

    - name: Ensure PostgreSQL is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Configure PostgreSQL authentication
      ansible.builtin.lineinfile:
        path: "{{ postgresql_config_dir }}/pg_hba.conf"
        line: "host    {{ tsc_db_name }}    {{ tsc_db_user }}    127.0.0.1/32    md5"
        insertafter: "# IPv4 local connections:"
      notify: restart postgresql

    - name: Configure PostgreSQL to listen on localhost
      ansible.builtin.lineinfile:
        path: "{{ postgresql_config_dir }}/postgresql.conf"
        regexp: "^#?listen_addresses"
        line: "listen_addresses = 'localhost'"
      notify: restart postgresql

    - name: Create Security Center database
      community.postgresql.postgresql_db:
        name: "{{ tsc_db_name }}"
        encoding: UTF8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        template: template0
      become: true
      become_user: postgres

    - name: Create Security Center database user
      community.postgresql.postgresql_user:
        name: "{{ tsc_db_user }}"
        password: "{{ tsc_db_password }}"
        db: "{{ tsc_db_name }}"
        priv: ALL
        encrypted: true
      become: true
      become_user: postgres
      no_log: true

    - name: Grant all privileges to Security Center user
      community.postgresql.postgresql_privs:
        database: "{{ tsc_db_name }}"
        state: present
        privs: ALL
        type: database
        role: "{{ tsc_db_user }}"
      become: true
      become_user: postgres

    - name: Configure PostgreSQL performance settings
      ansible.builtin.blockinfile:
        path: "{{ postgresql_config_dir }}/postgresql.conf"
        block: |
          # Tenable Security Center Performance Settings
          shared_buffers = {{ tsc_pg_shared_buffers }}
          effective_cache_size = {{ tsc_pg_effective_cache_size }}
          maintenance_work_mem = {{ tsc_pg_maintenance_work_mem }}
          checkpoint_completion_target = 0.9
          wal_buffers = 16MB
          default_statistics_target = 100
          random_page_cost = 1.1
          effective_io_concurrency = 200
          work_mem = 4MB
          min_wal_size = 1GB
          max_wal_size = 4GB
          max_worker_processes = 4
          max_parallel_workers_per_gather = 2
          max_parallel_workers = 4
        marker: "# {mark} TENABLE SC SETTINGS"
      notify: restart postgresql

    # ----------------------------- postflight -------------------

    - name: "tenable/tenable_security_center_install/postgresql | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_tenable_tenable_security_center_install_postgresql_preflight_passed | bool
          - fe_tenable_tenable_security_center_install_postgresql_status in ['running', 'succeeded']
        fail_msg: >-
          tenable/tenable_security_center_install/postgresql: postflight validation failed - preflight passed
          ={{ fe_tenable_tenable_security_center_install_postgresql_preflight_passed | default(false) }},
          status={{ fe_tenable_tenable_security_center_install_postgresql_status | default('unknown') }}.
        success_msg: "tenable/tenable_security_center_install/postgresql: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "tenable/tenable_security_center_install/postgresql | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postgresql_postflight_passed: true
        fe_tenable_tenable_security_center_install_postgresql_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "tenable/tenable_security_center_install/postgresql | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postgresql_status: "failed"
        fe_tenable_tenable_security_center_install_postgresql_postflight_passed: false
        fe_tenable_tenable_security_center_install_postgresql_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_tenable_tenable_security_center_install_postgresql_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install/postgresql | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          tenable/tenable_security_center_install/postgresql: FAILED at '{{ fe_tenable_tenable_security_center_install_postgresql_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_tenable_tenable_security_center_install_postgresql_error }}
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install/postgresql | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          tenable/tenable_security_center_install/postgresql failed at '{{ fe_tenable_tenable_security_center_install_postgresql_failed_task }}': {{ fe_tenable_tenable_security_center_install_postgresql_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "tenable/tenable_security_center_install/postgresql | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postgresql_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_tenable_tenable_security_center_install_postgresql_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_tenable_security_center_install_postgresql_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "tenable/tenable_security_center_install/postgresql | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "tenable/tenable_security_center_install/postgresql":
              component: "tenable/tenable_security_center_install/postgresql"
              type: "role-tasks"
              platform: "tenable"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_tenable_tenable_security_center_install_postgresql_status | default('unknown') }}"
              preflight_passed: "{{ fe_tenable_tenable_security_center_install_postgresql_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_tenable_tenable_security_center_install_postgresql_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_tenable_tenable_security_center_install_postgresql_started_at | default('') }}"
              ended_at: "{{ fe_tenable_tenable_security_center_install_postgresql_ended_at | default('') }}"
              duration_seconds: "{{ fe_tenable_tenable_security_center_install_postgresql_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_tenable_tenable_security_center_install_postgresql_failed_task | default('') }}"
              error: "{{ fe_tenable_tenable_security_center_install_postgresql_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_tenable_tenable_security_center_install_postgresql_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_tenable_tenable_security_center_install_postgresql_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_tenable_tenable_security_center_install_postgresql_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_tenable_tenable_security_center_install_postgresql_status | default('') == 'succeeded' else ['tenable/tenable_security_center_install/postgresql'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "tenable/tenable_security_center_install/postgresql | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_postgresql_stats_published: true
      tags:
        - always
