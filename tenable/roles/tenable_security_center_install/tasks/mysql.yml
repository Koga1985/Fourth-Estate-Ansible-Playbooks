---
# tenable_security_center_install/tasks/mysql.yml
# MySQL Database Setup for Tenable Security Center

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['tenable/tenable_security_center_install/mysql']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_tenable_tenable_security_center_install_mysql_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "tenable/tenable_security_center_install/mysql | Initialize validation state"
  ansible.builtin.set_fact:
    fe_tenable_tenable_security_center_install_mysql_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_tenable_tenable_security_center_install_mysql_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_tenable_tenable_security_center_install_mysql_status: "running"
    fe_tenable_tenable_security_center_install_mysql_preflight_passed: false
    fe_tenable_tenable_security_center_install_mysql_postflight_passed: false
    fe_tenable_tenable_security_center_install_mysql_failed_task: ""
    fe_tenable_tenable_security_center_install_mysql_error: ""
    fe_tenable_tenable_security_center_install_mysql_stats_published: false
  tags:
    - always

- name: "tenable/tenable_security_center_install/mysql | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "tenable/tenable_security_center_install/mysql | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          tenable/tenable_security_center_install/mysql: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          tenable/tenable_security_center_install/mysql: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install/mysql | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "tenable/tenable_security_center_install/mysql: required variable '{{ item }}' is not defined."
        success_msg: "tenable/tenable_security_center_install/mysql: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_tenable_tenable_security_center_install_mysql_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_install/mysql | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_mysql_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install MySQL server (RedHat)
      ansible.builtin.yum:
        name:
          - mysql-server
          - mysql
          - python3-PyMySQL
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install MySQL server (Debian)
      ansible.builtin.apt:
        name:
          - mysql-server
          - mysql-client
          - python3-pymysql
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure MySQL is started and enabled
      ansible.builtin.service:
        name: "{{ mysql_service_name }}"
        state: started
        enabled: true

    - name: Set MySQL root password
      community.mysql.mysql_user:
        name: root
        password: "{{ tsc_mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_user: root
        login_password: ""
        check_implicit_admin: true
        priv: '*.*:ALL,GRANT'
        state: present
      no_log: true
      ignore_errors: true

    - name: Create MySQL configuration file for root
      ansible.builtin.template:
        src: my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Remove anonymous MySQL users
      community.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent
        login_user: root
        login_password: "{{ tsc_mysql_root_password }}"
      no_log: true

    - name: Remove MySQL test database
      community.mysql.mysql_db:
        name: test
        state: absent
        login_user: root
        login_password: "{{ tsc_mysql_root_password }}"

    - name: Create Security Center database
      community.mysql.mysql_db:
        name: "{{ tsc_db_name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        login_user: root
        login_password: "{{ tsc_mysql_root_password }}"

    - name: Create Security Center database user
      community.mysql.mysql_user:
        name: "{{ tsc_db_user }}"
        password: "{{ tsc_db_password }}"
        priv: "{{ tsc_db_name }}.*:ALL"
        host: localhost
        state: present
        login_user: root
        login_password: "{{ tsc_mysql_root_password }}"
      no_log: true

    - name: Configure MySQL performance settings
      ansible.builtin.blockinfile:
        path: "{{ mysql_config_file }}"
        block: |
          # Tenable Security Center Performance Settings
          [mysqld]
          max_connections = 200
          innodb_buffer_pool_size = {{ tsc_mysql_buffer_pool_size }}
          innodb_log_file_size = 256M
          innodb_flush_log_at_trx_commit = 2
          innodb_flush_method = O_DIRECT
          query_cache_type = 1
          query_cache_size = 64M
          tmp_table_size = 64M
          max_heap_table_size = 64M
          key_buffer_size = 32M
          thread_cache_size = 8
          table_open_cache = 400
          max_allowed_packet = 64M
        marker: "# {mark} TENABLE SC SETTINGS"
      notify: restart mysql

    # ----------------------------- postflight -------------------

    - name: "tenable/tenable_security_center_install/mysql | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_tenable_tenable_security_center_install_mysql_preflight_passed | bool
          - fe_tenable_tenable_security_center_install_mysql_status in ['running', 'succeeded']
        fail_msg: >-
          tenable/tenable_security_center_install/mysql: postflight validation failed - preflight passed
          ={{ fe_tenable_tenable_security_center_install_mysql_preflight_passed | default(false) }},
          status={{ fe_tenable_tenable_security_center_install_mysql_status | default('unknown') }}.
        success_msg: "tenable/tenable_security_center_install/mysql: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "tenable/tenable_security_center_install/mysql | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_mysql_postflight_passed: true
        fe_tenable_tenable_security_center_install_mysql_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "tenable/tenable_security_center_install/mysql | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_mysql_status: "failed"
        fe_tenable_tenable_security_center_install_mysql_postflight_passed: false
        fe_tenable_tenable_security_center_install_mysql_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_tenable_tenable_security_center_install_mysql_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install/mysql | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          tenable/tenable_security_center_install/mysql: FAILED at '{{ fe_tenable_tenable_security_center_install_mysql_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_tenable_tenable_security_center_install_mysql_error }}
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_install/mysql | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          tenable/tenable_security_center_install/mysql failed at '{{ fe_tenable_tenable_security_center_install_mysql_failed_task }}': {{ fe_tenable_tenable_security_center_install_mysql_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "tenable/tenable_security_center_install/mysql | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_mysql_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_tenable_tenable_security_center_install_mysql_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_tenable_security_center_install_mysql_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "tenable/tenable_security_center_install/mysql | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "tenable/tenable_security_center_install/mysql":
              component: "tenable/tenable_security_center_install/mysql"
              type: "role-tasks"
              platform: "tenable"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_tenable_tenable_security_center_install_mysql_status | default('unknown') }}"
              preflight_passed: "{{ fe_tenable_tenable_security_center_install_mysql_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_tenable_tenable_security_center_install_mysql_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_tenable_tenable_security_center_install_mysql_started_at | default('') }}"
              ended_at: "{{ fe_tenable_tenable_security_center_install_mysql_ended_at | default('') }}"
              duration_seconds: "{{ fe_tenable_tenable_security_center_install_mysql_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_tenable_tenable_security_center_install_mysql_failed_task | default('') }}"
              error: "{{ fe_tenable_tenable_security_center_install_mysql_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_tenable_tenable_security_center_install_mysql_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_tenable_tenable_security_center_install_mysql_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_tenable_tenable_security_center_install_mysql_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_tenable_tenable_security_center_install_mysql_status | default('') == 'succeeded' else ['tenable/tenable_security_center_install/mysql'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "tenable/tenable_security_center_install/mysql | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_install_mysql_stats_published: true
      tags:
        - always
