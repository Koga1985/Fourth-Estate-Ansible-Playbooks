---
# tenable_security_center_config/tasks/ldap_config.yml
# LDAP/Active Directory Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['tenable/tenable_security_center_config/ldap_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_tenable_tenable_security_center_config_ldap_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "tenable/tenable_security_center_config/ldap_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_tenable_tenable_security_center_config_ldap_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_tenable_tenable_security_center_config_ldap_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_tenable_tenable_security_center_config_ldap_config_status: "running"
    fe_tenable_tenable_security_center_config_ldap_config_preflight_passed: false
    fe_tenable_tenable_security_center_config_ldap_config_postflight_passed: false
    fe_tenable_tenable_security_center_config_ldap_config_failed_task: ""
    fe_tenable_tenable_security_center_config_ldap_config_error: ""
    fe_tenable_tenable_security_center_config_ldap_config_stats_published: false
  tags:
    - always

- name: "tenable/tenable_security_center_config/ldap_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "tenable/tenable_security_center_config/ldap_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          tenable/tenable_security_center_config/ldap_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          tenable/tenable_security_center_config/ldap_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_config/ldap_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "tenable/tenable_security_center_config/ldap_config: required variable '{{ item }}' is not defined."
        success_msg: "tenable/tenable_security_center_config/ldap_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_tenable_tenable_security_center_config_ldap_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "tenable/tenable_security_center_config/ldap_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_config_ldap_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure LDAP server connection
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/ldap"
        method: POST
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          host: "{{ item.host }}"
          port: "{{ item.port | default('389') }}"
          encryption: "{{ item.encryption | default('tls') }}"
          searchBase: "{{ item.search_base }}"
          searchString: "{{ item.search_string | default('(&(objectClass=user)(sAMAccountName=%USERNAME%))') }}"
          bindDN: "{{ item.bind_dn }}"
          bindPassword: "{{ item.bind_password }}"
          groupSearchBase: "{{ item.group_search_base | default(item.search_base) }}"
          groupSearchString: "{{ item.group_search_string | default('(&(objectClass=group)(member=%USER_DN%))') }}"
          userNameAttribute: "{{ item.username_attribute | default('sAMAccountName') }}"
          emailAttribute: "{{ item.email_attribute | default('mail') }}"
          firstNameAttribute: "{{ item.firstname_attribute | default('givenName') }}"
          lastNameAttribute: "{{ item.lastname_attribute | default('sn') }}"
          enabled: "{{ item.enabled | default('true') }}"
          referral: "{{ item.referral | default('follow') }}"
          timeout: "{{ item.timeout | default('30') }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: [200, 400]
      loop: "{{ tsc_ldap_servers }}"
      when: tsc_ldap_servers | length > 0
      no_log: true

    - name: Map LDAP groups to Security Center roles
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/ldap/{{ item.0.id }}/groupMapping"
        method: POST
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          groupDN: "{{ item.1.group_dn }}"
          roleID: "{{ item.1.role_id }}"
          organizationID: "{{ item.1.organization_id | default('0') }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: [200, 400]
      with_subelements:
        - "{{ tsc_ldap_servers }}"
        - group_mappings
        - skip_missing: true
      when: tsc_ldap_servers | length > 0

    - name: Test LDAP connection
      ansible.builtin.uri:
        url: "https://{{ tsc_host }}:{{ tsc_port }}/rest/ldap/{{ item.id }}/test"
        method: POST
        headers:
          X-SecurityCenter: "{{ tsc_token }}"
        body_format: json
        body:
          username: "{{ tsc_ldap_test_user }}"
          password: "{{ tsc_ldap_test_password }}"
        validate_certs: "{{ tsc_validate_certs }}"
        status_code: 200
      loop: "{{ tsc_ldap_servers }}"
      when:
        - tsc_ldap_servers | length > 0
        - tsc_ldap_test_user is defined
      no_log: true
      register: ldap_test_result

    - name: Display LDAP test results
      ansible.builtin.debug:
        msg: "LDAP server {{ item.item.name }}: {{ 'SUCCESS' if item.json.response.success else 'FAILED' }}"
      loop: "{{ ldap_test_result.results }}"
      when:
        - ldap_test_result is defined
        - not ldap_test_result.skipped | default(false)

    # ----------------------------- postflight -------------------

    - name: "tenable/tenable_security_center_config/ldap_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_tenable_tenable_security_center_config_ldap_config_preflight_passed | bool
          - fe_tenable_tenable_security_center_config_ldap_config_status in ['running', 'succeeded']
        fail_msg: >-
          tenable/tenable_security_center_config/ldap_config: postflight validation failed - preflight passed
          ={{ fe_tenable_tenable_security_center_config_ldap_config_preflight_passed | default(false) }},
          status={{ fe_tenable_tenable_security_center_config_ldap_config_status | default('unknown') }}.
        success_msg: "tenable/tenable_security_center_config/ldap_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "tenable/tenable_security_center_config/ldap_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_config_ldap_config_postflight_passed: true
        fe_tenable_tenable_security_center_config_ldap_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "tenable/tenable_security_center_config/ldap_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_config_ldap_config_status: "failed"
        fe_tenable_tenable_security_center_config_ldap_config_postflight_passed: false
        fe_tenable_tenable_security_center_config_ldap_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_tenable_tenable_security_center_config_ldap_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_config/ldap_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          tenable/tenable_security_center_config/ldap_config: FAILED at '{{ fe_tenable_tenable_security_center_config_ldap_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_tenable_tenable_security_center_config_ldap_config_error }}
      tags:
        - always
        - rescue

    - name: "tenable/tenable_security_center_config/ldap_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          tenable/tenable_security_center_config/ldap_config failed at '{{ fe_tenable_tenable_security_center_config_ldap_config_failed_task }}': {{ fe_tenable_tenable_security_center_config_ldap_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "tenable/tenable_security_center_config/ldap_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_config_ldap_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_tenable_tenable_security_center_config_ldap_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_tenable_security_center_config_ldap_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "tenable/tenable_security_center_config/ldap_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "tenable/tenable_security_center_config/ldap_config":
              component: "tenable/tenable_security_center_config/ldap_config"
              type: "role-tasks"
              platform: "tenable"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_tenable_tenable_security_center_config_ldap_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_tenable_tenable_security_center_config_ldap_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_tenable_tenable_security_center_config_ldap_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_tenable_tenable_security_center_config_ldap_config_started_at | default('') }}"
              ended_at: "{{ fe_tenable_tenable_security_center_config_ldap_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_tenable_tenable_security_center_config_ldap_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_tenable_tenable_security_center_config_ldap_config_failed_task | default('') }}"
              error: "{{ fe_tenable_tenable_security_center_config_ldap_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_tenable_tenable_security_center_config_ldap_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_tenable_tenable_security_center_config_ldap_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_tenable_tenable_security_center_config_ldap_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_tenable_tenable_security_center_config_ldap_config_status | default('') == 'succeeded' else ['tenable/tenable_security_center_config/ldap_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "tenable/tenable_security_center_config/ldap_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_tenable_tenable_security_center_config_ldap_config_stats_published: true
      tags:
        - always
