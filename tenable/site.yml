---
# Tenable Security Center Deployment Playbook
# Entry point for Tenable vulnerability management automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Tenable Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_install: false
    deploy_config: true
    deploy_scan_zones: true
    deploy_scan_policies: true
    deploy_schedules: true
    deploy_compliance: true
    deploy_reporting: true
    deploy_vuln_mgmt: true

  tasks:
    - name: "tenable/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Security Center Installation
          ansible.builtin.include_role:
            name: tenable_security_center_install
          when: deploy_install | bool
          tags: ['install', 'phase1']

        - name: Phase 2 - Security Center Configuration
          ansible.builtin.include_role:
            name: tenable_security_center_config
          when: deploy_config | bool
          tags: ['config', 'phase2']

        - name: Phase 3 - Scan Zones
          ansible.builtin.include_role:
            name: tenable_scan_zones
          when: deploy_scan_zones | bool
          tags: ['zones', 'phase3']

        - name: Phase 4 - Scan Policies
          ansible.builtin.include_role:
            name: tenable_scan_policies
          when: deploy_scan_policies | bool
          tags: ['policies', 'phase4']

        - name: Phase 5 - Scan Schedules
          ansible.builtin.include_role:
            name: tenable_scan_schedules
          when: deploy_schedules | bool
          tags: ['schedules', 'phase5']

        - name: Phase 6 - Compliance Checks
          ansible.builtin.include_role:
            name: tenable_compliance_checks
          when: deploy_compliance | bool
          tags: ['compliance', 'phase6']

        - name: Phase 7 - Vulnerability Management
          ansible.builtin.include_role:
            name: tenable_vulnerability_management
          when: deploy_vuln_mgmt | bool
          tags: ['vulnerability', 'phase7']

        - name: Phase 8 - Reporting
          ansible.builtin.include_role:
            name: tenable_reporting
          when: deploy_reporting | bool
          tags: ['reporting', 'phase8']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== Tenable Deployment Complete ==="
              - "Security Center: {{ tenable_sc_url }}"
          tags: ['always']

        - name: "tenable/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "tenable/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_tenable_site_status: "failed"
            fe_tenable_site_postflight_passed: false
            fe_tenable_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_tenable_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "tenable/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              tenable/site: FAILED at '{{ fe_tenable_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_tenable_site_error }}
          tags:
            - always
            - rescue

        - name: "tenable/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              tenable/site failed at '{{ fe_tenable_site_failed_task }}': {{ fe_tenable_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "tenable/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_tenable_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_tenable_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "tenable/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "tenable/site":
                  component: "tenable/site"
                  type: "playbook"
                  platform: "tenable"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_tenable_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_tenable_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_tenable_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_tenable_site_started_at | default('') }}"
                  ended_at: "{{ fe_tenable_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_tenable_site_failed_task | default('') }}"
                  error: "{{ fe_tenable_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_tenable_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_tenable_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_tenable_site_status | default('') == 'succeeded' else ['tenable/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_tenable_site_status | default('') == 'failed'
            - not (fe_tenable_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "tenable/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_tenable_site_stats_published: true
          when:
            - fe_tenable_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "tenable/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "tenable/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_tenable_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_tenable_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_tenable_site_status: "running"
            fe_tenable_site_preflight_passed: false
            fe_tenable_site_postflight_passed: false
            fe_tenable_site_failed_task: ""
            fe_tenable_site_error: ""
            fe_tenable_site_stats_published: false
          tags:
            - always

        - name: "tenable/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              tenable/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              tenable/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "tenable/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "tenable/site: required variable '{{ item }}' is not defined."
            success_msg: "tenable/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_tenable_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "tenable/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_tenable_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "tenable/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_tenable_site_status: "preflight_failed"
            fe_tenable_site_postflight_passed: false
            fe_tenable_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_tenable_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "tenable/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              tenable/site: FAILED at '{{ fe_tenable_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_tenable_site_error }}
          tags:
            - always
            - rescue

        - name: "tenable/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "tenable/site":
                  component: "tenable/site"
                  type: "playbook"
                  platform: "tenable"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_tenable_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_tenable_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_tenable_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_tenable_site_started_at | default('') }}"
                  ended_at: "{{ fe_tenable_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_tenable_site_failed_task | default('') }}"
                  error: "{{ fe_tenable_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_tenable_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_tenable_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_tenable_site_status | default('') == 'succeeded' else ['tenable/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "tenable/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_tenable_site_stats_published: true
          tags:
            - always

        - name: "tenable/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              tenable/site failed at '{{ fe_tenable_site_failed_task }}': {{ fe_tenable_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "tenable/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              tenable/site: preflight
              {{ 'passed' if fe_tenable_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "tenable/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "tenable/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_tenable_site_preflight_passed | bool
              - fe_tenable_site_status in ['running', 'succeeded']
            fail_msg: >-
              tenable/site: postflight validation failed - preflight passed
              ={{ fe_tenable_site_preflight_passed | default(false) }},
              status={{ fe_tenable_site_status | default('unknown') }}.
            success_msg: "tenable/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "tenable/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_tenable_site_postflight_passed: true
            fe_tenable_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "tenable/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_tenable_site_status: "failed"
            fe_tenable_site_postflight_passed: false
            fe_tenable_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_tenable_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "tenable/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              tenable/site: FAILED at '{{ fe_tenable_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_tenable_site_error }}
          tags:
            - always
            - rescue

        - name: "tenable/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              tenable/site failed at '{{ fe_tenable_site_failed_task }}': {{ fe_tenable_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "tenable/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_tenable_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_tenable_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_tenable_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "tenable/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "tenable/site":
                  component: "tenable/site"
                  type: "playbook"
                  platform: "tenable"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_tenable_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_tenable_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_tenable_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_tenable_site_started_at | default('') }}"
                  ended_at: "{{ fe_tenable_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_tenable_site_failed_task | default('') }}"
                  error: "{{ fe_tenable_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_tenable_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_tenable_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_tenable_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_tenable_site_status | default('') == 'succeeded' else ['tenable/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_tenable_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "tenable/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_tenable_site_stats_published: true
          tags:
            - always

        - name: "tenable/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              tenable/site: {{ fe_tenable_site_status | default('unknown') }} in
              {{ fe_tenable_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
