---
# SentinelOne Agent Installation Test
# Validates agent installation and configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Test SentinelOne Agent Installation
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    s1_site_token: "test-token-12345"
    s1_console_url: "https://usgoveast1.sentinelone.net"

  tasks:
    - name: "sentinelone/tests/test_agent_installation | Guarded execution with rescue and always handling"
      block:

        - name: Test - Validate agent installation prerequisites
          ansible.builtin.assert:
            that:
              - s1_site_token is defined
              - s1_console_url is defined
            success_msg: "✓ Prerequisites validated"
            fail_msg: "✗ Prerequisites validation failed"

        - name: Test - Check if sentinelctl command would exist
          ansible.builtin.debug:
            msg: "Would check for /opt/sentinelone/bin/sentinelctl existence"

        - name: Test - Verify agent configuration variables
          ansible.builtin.assert:
            that:
              - s1_site_token | length > 0
              - s1_console_url | length > 0
              - "'sentinelone.net' in s1_console_url"
            success_msg: "✓ Configuration variables valid"

        - name: Test - Simulate agent health check
          ansible.builtin.debug:
            msg: "Would execute: /opt/sentinelone/bin/sentinelctl status"

        - name: Test Summary
          ansible.builtin.debug:
            msg:
              - "================================"
              - "SentinelOne Agent Installation Test"
              - "✓ All tests passed"
              - "================================"

        - name: "sentinelone/tests/test_agent_installation | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "sentinelone/tests/test_agent_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_status: "failed"
            fe_sentinelone_tests_test_agent_installation_postflight_passed: false
            fe_sentinelone_tests_test_agent_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_tests_test_agent_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/tests/test_agent_installation: FAILED at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_tests_test_agent_installation_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/tests/test_agent_installation failed at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}': {{ fe_sentinelone_tests_test_agent_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/tests/test_agent_installation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_tests_test_agent_installation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_tests_test_agent_installation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/tests/test_agent_installation":
                  component: "sentinelone/tests/test_agent_installation"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_tests_test_agent_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_tests_test_agent_installation_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_tests_test_agent_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_tests_test_agent_installation_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_tests_test_agent_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else ['sentinelone/tests/test_agent_installation'] }}
            aggregate: true
            per_host: false
          when:
            - fe_sentinelone_tests_test_agent_installation_status | default('') == 'failed'
            - not (fe_sentinelone_tests_test_agent_installation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_stats_published: true
          when:
            - fe_sentinelone_tests_test_agent_installation_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "sentinelone/tests/test_agent_installation | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "sentinelone/tests/test_agent_installation | Initialize validation state"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_sentinelone_tests_test_agent_installation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_tests_test_agent_installation_status: "running"
            fe_sentinelone_tests_test_agent_installation_preflight_passed: false
            fe_sentinelone_tests_test_agent_installation_postflight_passed: false
            fe_sentinelone_tests_test_agent_installation_failed_task: ""
            fe_sentinelone_tests_test_agent_installation_error: ""
            fe_sentinelone_tests_test_agent_installation_stats_published: false
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              sentinelone/tests/test_agent_installation: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              sentinelone/tests/test_agent_installation: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "sentinelone/tests/test_agent_installation | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "sentinelone/tests/test_agent_installation: required variable '{{ item }}' is not defined."
            success_msg: "sentinelone/tests/test_agent_installation: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_sentinelone_tests_test_agent_installation_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "sentinelone/tests/test_agent_installation | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "sentinelone/tests/test_agent_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_status: "preflight_failed"
            fe_sentinelone_tests_test_agent_installation_postflight_passed: false
            fe_sentinelone_tests_test_agent_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_tests_test_agent_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/tests/test_agent_installation: FAILED at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_tests_test_agent_installation_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/tests/test_agent_installation":
                  component: "sentinelone/tests/test_agent_installation"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_tests_test_agent_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_tests_test_agent_installation_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_tests_test_agent_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_tests_test_agent_installation_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_tests_test_agent_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else ['sentinelone/tests/test_agent_installation'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_stats_published: true
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/tests/test_agent_installation failed at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}': {{ fe_sentinelone_tests_test_agent_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/tests/test_agent_installation | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              sentinelone/tests/test_agent_installation: preflight
              {{ 'passed' if fe_sentinelone_tests_test_agent_installation_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "sentinelone/tests/test_agent_installation | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "sentinelone/tests/test_agent_installation | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_sentinelone_tests_test_agent_installation_preflight_passed | bool
              - fe_sentinelone_tests_test_agent_installation_status in ['running', 'succeeded']
            fail_msg: >-
              sentinelone/tests/test_agent_installation: postflight validation failed - preflight passed
              ={{ fe_sentinelone_tests_test_agent_installation_preflight_passed | default(false) }},
              status={{ fe_sentinelone_tests_test_agent_installation_status | default('unknown') }}.
            success_msg: "sentinelone/tests/test_agent_installation: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "sentinelone/tests/test_agent_installation | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_postflight_passed: true
            fe_sentinelone_tests_test_agent_installation_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "sentinelone/tests/test_agent_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_status: "failed"
            fe_sentinelone_tests_test_agent_installation_postflight_passed: false
            fe_sentinelone_tests_test_agent_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_tests_test_agent_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/tests/test_agent_installation: FAILED at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_tests_test_agent_installation_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/tests/test_agent_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/tests/test_agent_installation failed at '{{ fe_sentinelone_tests_test_agent_installation_failed_task }}': {{ fe_sentinelone_tests_test_agent_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/tests/test_agent_installation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_tests_test_agent_installation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_tests_test_agent_installation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/tests/test_agent_installation":
                  component: "sentinelone/tests/test_agent_installation"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_tests_test_agent_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_tests_test_agent_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_tests_test_agent_installation_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_tests_test_agent_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_tests_test_agent_installation_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_tests_test_agent_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_tests_test_agent_installation_status | default('') == 'succeeded' else ['sentinelone/tests/test_agent_installation'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_sentinelone_tests_test_agent_installation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_tests_test_agent_installation_stats_published: true
          tags:
            - always

        - name: "sentinelone/tests/test_agent_installation | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              sentinelone/tests/test_agent_installation: {{ fe_sentinelone_tests_test_agent_installation_status | default('unknown') }} in
              {{ fe_sentinelone_tests_test_agent_installation_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
