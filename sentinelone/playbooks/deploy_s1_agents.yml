---
# SentinelOne Agent Deployment Playbook
# Fourth Estate production-ready EDR deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy SentinelOne Agents
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Override these variables at runtime or in inventory
    # ansible-playbook deploy_s1_agents.yml -e "s1_site_token=YOUR_TOKEN"
    s1_site_token: "{{ lookup('env', 'S1_SITE_TOKEN') }}"
    s1_console_url: "https://usgoveast1.sentinelone.net"
    s1_fourth_estate_enabled: true
    s1_enable_deep_visibility: true

  pre_tasks:
    - name: "sentinelone/deploy_s1_agents | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "sentinelone/deploy_s1_agents | Initialize validation state"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_sentinelone_deploy_s1_agents_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_deploy_s1_agents_status: "running"
            fe_sentinelone_deploy_s1_agents_preflight_passed: false
            fe_sentinelone_deploy_s1_agents_postflight_passed: false
            fe_sentinelone_deploy_s1_agents_failed_task: ""
            fe_sentinelone_deploy_s1_agents_error: ""
            fe_sentinelone_deploy_s1_agents_stats_published: false
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              sentinelone/deploy_s1_agents: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              sentinelone/deploy_s1_agents: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "sentinelone/deploy_s1_agents | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "sentinelone/deploy_s1_agents: required variable '{{ item }}' is not defined."
            success_msg: "sentinelone/deploy_s1_agents: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_sentinelone_deploy_s1_agents_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "sentinelone/deploy_s1_agents | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "sentinelone/deploy_s1_agents | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_status: "preflight_failed"
            fe_sentinelone_deploy_s1_agents_postflight_passed: false
            fe_sentinelone_deploy_s1_agents_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_deploy_s1_agents_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: FAILED at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_deploy_s1_agents_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/deploy_s1_agents":
                  component: "sentinelone/deploy_s1_agents"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_deploy_s1_agents_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_deploy_s1_agents_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_deploy_s1_agents_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_deploy_s1_agents_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_deploy_s1_agents_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else ['sentinelone/deploy_s1_agents'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_stats_published: true
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/deploy_s1_agents failed at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}': {{ fe_sentinelone_deploy_s1_agents_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/deploy_s1_agents | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: preflight
              {{ 'passed' if fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "sentinelone/deploy_s1_agents | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Validate SentinelOne site token is provided
          ansible.builtin.assert:
            that:
              - s1_site_token is defined
              - s1_site_token | length > 0
            fail_msg: "SentinelOne site token must be provided via -e s1_site_token=YOUR_TOKEN or S1_SITE_TOKEN env var"

        - name: Display deployment information
          ansible.builtin.debug:
            msg:
              - "Deploying SentinelOne agents"
              - "Target hosts: {{ ansible_play_hosts | length }}"
              - "Console URL: {{ s1_console_url }}"
              - "Fourth Estate Mode: {{ s1_fourth_estate_enabled }}"
              - "Deep Visibility: {{ s1_enable_deep_visibility }}"

        - name: "sentinelone/deploy_s1_agents | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "sentinelone/deploy_s1_agents | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_status: "failed"
            fe_sentinelone_deploy_s1_agents_postflight_passed: false
            fe_sentinelone_deploy_s1_agents_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_deploy_s1_agents_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: FAILED at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_deploy_s1_agents_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/deploy_s1_agents failed at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}': {{ fe_sentinelone_deploy_s1_agents_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/deploy_s1_agents | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_deploy_s1_agents_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_deploy_s1_agents_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/deploy_s1_agents":
                  component: "sentinelone/deploy_s1_agents"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_deploy_s1_agents_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_deploy_s1_agents_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_deploy_s1_agents_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_deploy_s1_agents_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_deploy_s1_agents_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else ['sentinelone/deploy_s1_agents'] }}
            aggregate: true
            per_host: false
          when:
            - fe_sentinelone_deploy_s1_agents_status | default('') == 'failed'
            - not (fe_sentinelone_deploy_s1_agents_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_stats_published: true
          when:
            - fe_sentinelone_deploy_s1_agents_status | default('') == 'failed'
          tags:
            - always

  roles:
    - role: s1_agent_install

  post_tasks:
    - name: Verify agent deployment
      ansible.builtin.command: /opt/sentinelone/bin/sentinelctl status
      register: deployment_verify
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Display deployment results
      ansible.builtin.debug:
        msg: "SentinelOne agent deployed successfully on {{ inventory_hostname }}"
    - name: "sentinelone/deploy_s1_agents | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "sentinelone/deploy_s1_agents | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_sentinelone_deploy_s1_agents_preflight_passed | bool
              - fe_sentinelone_deploy_s1_agents_status in ['running', 'succeeded']
            fail_msg: >-
              sentinelone/deploy_s1_agents: postflight validation failed - preflight passed
              ={{ fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) }},
              status={{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }}.
            success_msg: "sentinelone/deploy_s1_agents: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "sentinelone/deploy_s1_agents | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_postflight_passed: true
            fe_sentinelone_deploy_s1_agents_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "sentinelone/deploy_s1_agents | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_status: "failed"
            fe_sentinelone_deploy_s1_agents_postflight_passed: false
            fe_sentinelone_deploy_s1_agents_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_deploy_s1_agents_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: FAILED at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_deploy_s1_agents_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/deploy_s1_agents failed at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}': {{ fe_sentinelone_deploy_s1_agents_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/deploy_s1_agents | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_deploy_s1_agents_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_deploy_s1_agents_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/deploy_s1_agents":
                  component: "sentinelone/deploy_s1_agents"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_deploy_s1_agents_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_deploy_s1_agents_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_deploy_s1_agents_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_deploy_s1_agents_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_deploy_s1_agents_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else ['sentinelone/deploy_s1_agents'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_sentinelone_deploy_s1_agents_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_stats_published: true
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: {{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }} in
              {{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "sentinelone/deploy_s1_agents | Guarded execution with rescue and always handling"
      block:

        - name: "sentinelone/deploy_s1_agents | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "sentinelone/deploy_s1_agents | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_status: "failed"
            fe_sentinelone_deploy_s1_agents_postflight_passed: false
            fe_sentinelone_deploy_s1_agents_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_sentinelone_deploy_s1_agents_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              sentinelone/deploy_s1_agents: FAILED at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_sentinelone_deploy_s1_agents_error }}
          tags:
            - always
            - rescue

        - name: "sentinelone/deploy_s1_agents | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              sentinelone/deploy_s1_agents failed at '{{ fe_sentinelone_deploy_s1_agents_failed_task }}': {{ fe_sentinelone_deploy_s1_agents_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "sentinelone/deploy_s1_agents | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_sentinelone_deploy_s1_agents_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_deploy_s1_agents_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "sentinelone/deploy_s1_agents":
                  component: "sentinelone/deploy_s1_agents"
                  type: "playbook"
                  platform: "sentinelone"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_sentinelone_deploy_s1_agents_status | default('unknown') }}"
                  preflight_passed: "{{ fe_sentinelone_deploy_s1_agents_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_sentinelone_deploy_s1_agents_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_sentinelone_deploy_s1_agents_started_at | default('') }}"
                  ended_at: "{{ fe_sentinelone_deploy_s1_agents_ended_at | default('') }}"
                  duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_sentinelone_deploy_s1_agents_failed_task | default('') }}"
                  error: "{{ fe_sentinelone_deploy_s1_agents_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_sentinelone_deploy_s1_agents_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_sentinelone_deploy_s1_agents_status | default('') == 'succeeded' else ['sentinelone/deploy_s1_agents'] }}
            aggregate: true
            per_host: false
          when:
            - fe_sentinelone_deploy_s1_agents_status | default('') == 'failed'
            - not (fe_sentinelone_deploy_s1_agents_stats_published | default(false) | bool)
          tags:
            - always

        - name: "sentinelone/deploy_s1_agents | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_sentinelone_deploy_s1_agents_stats_published: true
          when:
            - fe_sentinelone_deploy_s1_agents_status | default('') == 'failed'
          tags:
            - always
