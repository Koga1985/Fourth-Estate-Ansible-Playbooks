---
# SentinelOne Agent Verification

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sentinelone/s1_agent_install/verify']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sentinelone_s1_agent_install_verify_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sentinelone/s1_agent_install/verify | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sentinelone_s1_agent_install_verify_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sentinelone_s1_agent_install_verify_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sentinelone_s1_agent_install_verify_status: "running"
    fe_sentinelone_s1_agent_install_verify_preflight_passed: false
    fe_sentinelone_s1_agent_install_verify_postflight_passed: false
    fe_sentinelone_s1_agent_install_verify_failed_task: ""
    fe_sentinelone_s1_agent_install_verify_error: ""
    fe_sentinelone_s1_agent_install_verify_stats_published: false
  tags:
    - always

- name: "sentinelone/s1_agent_install/verify | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sentinelone/s1_agent_install/verify | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sentinelone/s1_agent_install/verify: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sentinelone/s1_agent_install/verify: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/verify | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sentinelone/s1_agent_install/verify: required variable '{{ item }}' is not defined."
        success_msg: "sentinelone/s1_agent_install/verify: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sentinelone_s1_agent_install_verify_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/verify | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_verify_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check agent status (Linux)
      ansible.builtin.command: /opt/sentinelone/bin/sentinelctl status
      register: s1_status
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Check agent version (Linux)
      ansible.builtin.command: /opt/sentinelone/bin/sentinelctl version
      register: s1_version
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Check management connectivity (Linux)
      ansible.builtin.command: /opt/sentinelone/bin/sentinelctl management status
      register: s1_mgmt_status
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Display verification results
      ansible.builtin.debug:
        msg:
          - "Agent Status: {{ s1_status.stdout_lines if ansible_os_family != 'Windows' else 'Check Windows service' }}"
          - "Agent Version: {{ s1_version.stdout if ansible_os_family != 'Windows' else 'N/A' }}"
          - "Management Status: {{ s1_mgmt_status.stdout if ansible_os_family != 'Windows' else 'N/A' }}"

    - name: Verify agent service is running
      ansible.builtin.systemd:
        name: "{{ s1_linux_service_name }}"
      register: s1_service_status
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Assert agent is operational
      ansible.builtin.assert:
        that:
          - s1_service_status.status.ActiveState == 'active'
        fail_msg: "SentinelOne agent is not running"
        success_msg: "SentinelOne agent is operational"
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    # ----------------------------- postflight -------------------

    - name: "sentinelone/s1_agent_install/verify | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sentinelone_s1_agent_install_verify_preflight_passed | bool
          - fe_sentinelone_s1_agent_install_verify_status in ['running', 'succeeded']
        fail_msg: >-
          sentinelone/s1_agent_install/verify: postflight validation failed - preflight passed
          ={{ fe_sentinelone_s1_agent_install_verify_preflight_passed | default(false) }},
          status={{ fe_sentinelone_s1_agent_install_verify_status | default('unknown') }}.
        success_msg: "sentinelone/s1_agent_install/verify: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sentinelone/s1_agent_install/verify | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_verify_postflight_passed: true
        fe_sentinelone_s1_agent_install_verify_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sentinelone/s1_agent_install/verify | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_verify_status: "failed"
        fe_sentinelone_s1_agent_install_verify_postflight_passed: false
        fe_sentinelone_s1_agent_install_verify_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sentinelone_s1_agent_install_verify_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/verify | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sentinelone/s1_agent_install/verify: FAILED at '{{ fe_sentinelone_s1_agent_install_verify_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sentinelone_s1_agent_install_verify_error }}
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/verify | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sentinelone/s1_agent_install/verify failed at '{{ fe_sentinelone_s1_agent_install_verify_failed_task }}': {{ fe_sentinelone_s1_agent_install_verify_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sentinelone/s1_agent_install/verify | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_verify_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sentinelone_s1_agent_install_verify_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_s1_agent_install_verify_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sentinelone/s1_agent_install/verify | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sentinelone/s1_agent_install/verify":
              component: "sentinelone/s1_agent_install/verify"
              type: "role-tasks"
              platform: "sentinelone"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sentinelone_s1_agent_install_verify_status | default('unknown') }}"
              preflight_passed: "{{ fe_sentinelone_s1_agent_install_verify_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sentinelone_s1_agent_install_verify_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sentinelone_s1_agent_install_verify_started_at | default('') }}"
              ended_at: "{{ fe_sentinelone_s1_agent_install_verify_ended_at | default('') }}"
              duration_seconds: "{{ fe_sentinelone_s1_agent_install_verify_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sentinelone_s1_agent_install_verify_failed_task | default('') }}"
              error: "{{ fe_sentinelone_s1_agent_install_verify_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sentinelone_s1_agent_install_verify_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sentinelone_s1_agent_install_verify_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sentinelone_s1_agent_install_verify_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sentinelone_s1_agent_install_verify_status | default('') == 'succeeded' else ['sentinelone/s1_agent_install/verify'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sentinelone/s1_agent_install/verify | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_verify_stats_published: true
      tags:
        - always
