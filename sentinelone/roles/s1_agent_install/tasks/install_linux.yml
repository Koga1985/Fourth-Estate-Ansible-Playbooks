---
# SentinelOne Agent Linux Installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sentinelone/s1_agent_install/install_linux']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sentinelone_s1_agent_install_install_linux_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sentinelone/s1_agent_install/install_linux | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sentinelone_s1_agent_install_install_linux_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sentinelone_s1_agent_install_install_linux_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sentinelone_s1_agent_install_install_linux_status: "running"
    fe_sentinelone_s1_agent_install_install_linux_preflight_passed: false
    fe_sentinelone_s1_agent_install_install_linux_postflight_passed: false
    fe_sentinelone_s1_agent_install_install_linux_failed_task: ""
    fe_sentinelone_s1_agent_install_install_linux_error: ""
    fe_sentinelone_s1_agent_install_install_linux_stats_published: false
  tags:
    - always

- name: "sentinelone/s1_agent_install/install_linux | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sentinelone/s1_agent_install/install_linux | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sentinelone/s1_agent_install/install_linux: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sentinelone/s1_agent_install/install_linux: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/install_linux | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sentinelone/s1_agent_install/install_linux: required variable '{{ item }}' is not defined."
        success_msg: "sentinelone/s1_agent_install/install_linux: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sentinelone_s1_agent_install_install_linux_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/install_linux | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_linux_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Download SentinelOne agent installer (URL method)
      ansible.builtin.get_url:
        url: "{{ s1_agent_download_url }}"
        dest: "{{ s1_agent_download_path }}/SentinelAgent.{{ 'rpm' if ansible_os_family == 'RedHat' else 'deb' }}"
        mode: '0644'
      when:
        - s1_install_method == 'url'
        - s1_agent_download_url | length > 0

    - name: Install SentinelOne agent (RHEL/CentOS)
      ansible.builtin.yum:
        name: "{{ s1_agent_download_path }}/SentinelAgent.rpm"
        state: present
        disable_gpg_check: "{{ s1_air_gapped }}"
      when:
        - ansible_os_family == 'RedHat'
        - s1_linux_install_method == 'rpm'

    - name: Install SentinelOne agent (Debian/Ubuntu)
      ansible.builtin.apt:
        deb: "{{ s1_agent_download_path }}/SentinelAgent.deb"
        state: present
      when:
        - ansible_os_family == 'Debian'
        - s1_linux_install_method == 'deb'

    - name: Set site token
      ansible.builtin.command: >
        /opt/sentinelone/bin/sentinelctl management token set {{ s1_site_token }}
      changed_when: true
      no_log: true

    - name: Set management URL
      ansible.builtin.command: >
        /opt/sentinelone/bin/sentinelctl config server.url {{ s1_management_url }}
      changed_when: true

    - name: Configure proxy (if enabled)
      ansible.builtin.command: >
        /opt/sentinelone/bin/sentinelctl config proxy.address {{ s1_proxy_host }}:{{ s1_proxy_port }}
      when: s1_proxy_enabled | bool
      changed_when: true

    - name: Start agent registration
      ansible.builtin.command: /opt/sentinelone/bin/sentinelctl management start
      changed_when: true

    - name: Enable and start SentinelOne agent service
      ansible.builtin.systemd:
        name: "{{ s1_linux_service_name }}"
        state: started
        enabled: true
      when:
        - s1_service_enable | bool
        - s1_service_start | bool

    # ----------------------------- postflight -------------------

    - name: "sentinelone/s1_agent_install/install_linux | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sentinelone_s1_agent_install_install_linux_preflight_passed | bool
          - fe_sentinelone_s1_agent_install_install_linux_status in ['running', 'succeeded']
        fail_msg: >-
          sentinelone/s1_agent_install/install_linux: postflight validation failed - preflight passed
          ={{ fe_sentinelone_s1_agent_install_install_linux_preflight_passed | default(false) }},
          status={{ fe_sentinelone_s1_agent_install_install_linux_status | default('unknown') }}.
        success_msg: "sentinelone/s1_agent_install/install_linux: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sentinelone/s1_agent_install/install_linux | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_linux_postflight_passed: true
        fe_sentinelone_s1_agent_install_install_linux_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sentinelone/s1_agent_install/install_linux | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_linux_status: "failed"
        fe_sentinelone_s1_agent_install_install_linux_postflight_passed: false
        fe_sentinelone_s1_agent_install_install_linux_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sentinelone_s1_agent_install_install_linux_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/install_linux | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sentinelone/s1_agent_install/install_linux: FAILED at '{{ fe_sentinelone_s1_agent_install_install_linux_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sentinelone_s1_agent_install_install_linux_error }}
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/install_linux | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sentinelone/s1_agent_install/install_linux failed at '{{ fe_sentinelone_s1_agent_install_install_linux_failed_task }}': {{ fe_sentinelone_s1_agent_install_install_linux_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sentinelone/s1_agent_install/install_linux | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_linux_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sentinelone_s1_agent_install_install_linux_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_s1_agent_install_install_linux_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sentinelone/s1_agent_install/install_linux | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sentinelone/s1_agent_install/install_linux":
              component: "sentinelone/s1_agent_install/install_linux"
              type: "role-tasks"
              platform: "sentinelone"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sentinelone_s1_agent_install_install_linux_status | default('unknown') }}"
              preflight_passed: "{{ fe_sentinelone_s1_agent_install_install_linux_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sentinelone_s1_agent_install_install_linux_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sentinelone_s1_agent_install_install_linux_started_at | default('') }}"
              ended_at: "{{ fe_sentinelone_s1_agent_install_install_linux_ended_at | default('') }}"
              duration_seconds: "{{ fe_sentinelone_s1_agent_install_install_linux_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sentinelone_s1_agent_install_install_linux_failed_task | default('') }}"
              error: "{{ fe_sentinelone_s1_agent_install_install_linux_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sentinelone_s1_agent_install_install_linux_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sentinelone_s1_agent_install_install_linux_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sentinelone_s1_agent_install_install_linux_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sentinelone_s1_agent_install_install_linux_status | default('') == 'succeeded' else ['sentinelone/s1_agent_install/install_linux'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sentinelone/s1_agent_install/install_linux | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_linux_stats_published: true
      tags:
        - always
