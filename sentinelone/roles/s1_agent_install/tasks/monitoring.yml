---
# SentinelOne Agent Monitoring

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sentinelone/s1_agent_install/monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sentinelone_s1_agent_install_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sentinelone/s1_agent_install/monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sentinelone_s1_agent_install_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sentinelone_s1_agent_install_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sentinelone_s1_agent_install_monitoring_status: "running"
    fe_sentinelone_s1_agent_install_monitoring_preflight_passed: false
    fe_sentinelone_s1_agent_install_monitoring_postflight_passed: false
    fe_sentinelone_s1_agent_install_monitoring_failed_task: ""
    fe_sentinelone_s1_agent_install_monitoring_error: ""
    fe_sentinelone_s1_agent_install_monitoring_stats_published: false
  tags:
    - always

- name: "sentinelone/s1_agent_install/monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sentinelone/s1_agent_install/monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sentinelone/s1_agent_install/monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sentinelone/s1_agent_install/monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sentinelone/s1_agent_install/monitoring: required variable '{{ item }}' is not defined."
        success_msg: "sentinelone/s1_agent_install/monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sentinelone_s1_agent_install_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create agent health check script
      ansible.builtin.copy:
        dest: /usr/local/bin/s1-health-check.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # SentinelOne Agent Health Check

          echo "Checking SentinelOne agent status..."

          # Check if service is running
          if systemctl is-active --quiet sentinelone; then
            echo "✓ SentinelOne agent service is running"
          else
            echo "✗ SentinelOne agent service is NOT running"
            exit 1
          fi

          # Check agent status
          STATUS=$(/opt/sentinelone/bin/sentinelctl status 2>/dev/null)
          echo "  Agent Status: $STATUS"

          # Check management connectivity
          MGMT=$(/opt/sentinelone/bin/sentinelctl management status 2>/dev/null)
          if echo "$MGMT" | grep -q "connected"; then
            echo "✓ Agent is connected to management console"
          else
            echo "✗ Agent is NOT connected to management console"
            exit 1
          fi

          echo "SentinelOne agent health check complete"
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Create agent health check cron job
      ansible.builtin.cron:
        name: "SentinelOne agent health check"
        minute: "0"
        hour: "*"
        job: "/usr/local/bin/s1-health-check.sh > /var/log/s1-health.log 2>&1"
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Configure syslog export (if enabled)
      ansible.builtin.command: >
        /opt/sentinelone/bin/sentinelctl config syslog.server {{ s1_syslog_server }}:{{ s1_syslog_port }}
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - s1_syslog_enabled | bool
      changed_when: true

    - name: Display monitoring configuration
      ansible.builtin.debug:
        msg: "SentinelOne agent monitoring configured"

    # ----------------------------- postflight -------------------

    - name: "sentinelone/s1_agent_install/monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sentinelone_s1_agent_install_monitoring_preflight_passed | bool
          - fe_sentinelone_s1_agent_install_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          sentinelone/s1_agent_install/monitoring: postflight validation failed - preflight passed
          ={{ fe_sentinelone_s1_agent_install_monitoring_preflight_passed | default(false) }},
          status={{ fe_sentinelone_s1_agent_install_monitoring_status | default('unknown') }}.
        success_msg: "sentinelone/s1_agent_install/monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sentinelone/s1_agent_install/monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_monitoring_postflight_passed: true
        fe_sentinelone_s1_agent_install_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sentinelone/s1_agent_install/monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_monitoring_status: "failed"
        fe_sentinelone_s1_agent_install_monitoring_postflight_passed: false
        fe_sentinelone_s1_agent_install_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sentinelone_s1_agent_install_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sentinelone/s1_agent_install/monitoring: FAILED at '{{ fe_sentinelone_s1_agent_install_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sentinelone_s1_agent_install_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sentinelone/s1_agent_install/monitoring failed at '{{ fe_sentinelone_s1_agent_install_monitoring_failed_task }}': {{ fe_sentinelone_s1_agent_install_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sentinelone/s1_agent_install/monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sentinelone_s1_agent_install_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_s1_agent_install_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sentinelone/s1_agent_install/monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sentinelone/s1_agent_install/monitoring":
              component: "sentinelone/s1_agent_install/monitoring"
              type: "role-tasks"
              platform: "sentinelone"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sentinelone_s1_agent_install_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_sentinelone_s1_agent_install_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sentinelone_s1_agent_install_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sentinelone_s1_agent_install_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_sentinelone_s1_agent_install_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_sentinelone_s1_agent_install_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sentinelone_s1_agent_install_monitoring_failed_task | default('') }}"
              error: "{{ fe_sentinelone_s1_agent_install_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sentinelone_s1_agent_install_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sentinelone_s1_agent_install_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sentinelone_s1_agent_install_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sentinelone_s1_agent_install_monitoring_status | default('') == 'succeeded' else ['sentinelone/s1_agent_install/monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sentinelone/s1_agent_install/monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_monitoring_stats_published: true
      tags:
        - always
