---
# SentinelOne Agent Windows Installation
# Mirrors install_linux.yml using the Windows MSI installer and site token.
# Requires the ansible.windows collection (declared in requirements.yml).

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['sentinelone/s1_agent_install/install_windows']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_sentinelone_s1_agent_install_install_windows_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "sentinelone/s1_agent_install/install_windows | Initialize validation state"
  ansible.builtin.set_fact:
    fe_sentinelone_s1_agent_install_install_windows_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_sentinelone_s1_agent_install_install_windows_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_sentinelone_s1_agent_install_install_windows_status: "running"
    fe_sentinelone_s1_agent_install_install_windows_preflight_passed: false
    fe_sentinelone_s1_agent_install_install_windows_postflight_passed: false
    fe_sentinelone_s1_agent_install_install_windows_failed_task: ""
    fe_sentinelone_s1_agent_install_install_windows_error: ""
    fe_sentinelone_s1_agent_install_install_windows_stats_published: false
  tags:
    - always

- name: "sentinelone/s1_agent_install/install_windows | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "sentinelone/s1_agent_install/install_windows | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          sentinelone/s1_agent_install/install_windows: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          sentinelone/s1_agent_install/install_windows: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/install_windows | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "sentinelone/s1_agent_install/install_windows: required variable '{{ item }}' is not defined."
        success_msg: "sentinelone/s1_agent_install/install_windows: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_sentinelone_s1_agent_install_install_windows_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "sentinelone/s1_agent_install/install_windows | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_windows_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Download SentinelOne agent installer (URL method)
      ansible.windows.win_get_url:
        url: "{{ s1_agent_download_url }}"
        dest: "{{ s1_windows_installer_path | default('C:\\Windows\\Temp\\SentinelInstaller.msi') }}"
      when:
        - s1_install_method == 'url'
        - s1_agent_download_url | length > 0

    - name: Install SentinelOne agent (MSI)
      ansible.windows.win_package:
        path: "{{ s1_windows_installer_path | default('C:\\Windows\\Temp\\SentinelInstaller.msi') }}"
        state: present
        arguments: "/quiet /norestart SITE_TOKEN={{ s1_site_token }}"
      register: s1_win_install
      no_log: true

    - name: Verify SentinelOne agent service is running
      ansible.windows.win_service:
        name: SentinelAgent
        state: started
      register: s1_win_service
      failed_when: false

    # ----------------------------- postflight -------------------

    - name: "sentinelone/s1_agent_install/install_windows | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_sentinelone_s1_agent_install_install_windows_preflight_passed | bool
          - fe_sentinelone_s1_agent_install_install_windows_status in ['running', 'succeeded']
        fail_msg: >-
          sentinelone/s1_agent_install/install_windows: postflight validation failed - preflight passed
          ={{ fe_sentinelone_s1_agent_install_install_windows_preflight_passed | default(false) }},
          status={{ fe_sentinelone_s1_agent_install_install_windows_status | default('unknown') }}.
        success_msg: "sentinelone/s1_agent_install/install_windows: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "sentinelone/s1_agent_install/install_windows | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_windows_postflight_passed: true
        fe_sentinelone_s1_agent_install_install_windows_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "sentinelone/s1_agent_install/install_windows | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_windows_status: "failed"
        fe_sentinelone_s1_agent_install_install_windows_postflight_passed: false
        fe_sentinelone_s1_agent_install_install_windows_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_sentinelone_s1_agent_install_install_windows_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/install_windows | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          sentinelone/s1_agent_install/install_windows: FAILED at '{{ fe_sentinelone_s1_agent_install_install_windows_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_sentinelone_s1_agent_install_install_windows_error }}
      tags:
        - always
        - rescue

    - name: "sentinelone/s1_agent_install/install_windows | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          sentinelone/s1_agent_install/install_windows failed at '{{ fe_sentinelone_s1_agent_install_install_windows_failed_task }}': {{ fe_sentinelone_s1_agent_install_install_windows_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "sentinelone/s1_agent_install/install_windows | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_windows_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_sentinelone_s1_agent_install_install_windows_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_sentinelone_s1_agent_install_install_windows_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "sentinelone/s1_agent_install/install_windows | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "sentinelone/s1_agent_install/install_windows":
              component: "sentinelone/s1_agent_install/install_windows"
              type: "role-tasks"
              platform: "sentinelone"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_sentinelone_s1_agent_install_install_windows_status | default('unknown') }}"
              preflight_passed: "{{ fe_sentinelone_s1_agent_install_install_windows_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_sentinelone_s1_agent_install_install_windows_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_sentinelone_s1_agent_install_install_windows_started_at | default('') }}"
              ended_at: "{{ fe_sentinelone_s1_agent_install_install_windows_ended_at | default('') }}"
              duration_seconds: "{{ fe_sentinelone_s1_agent_install_install_windows_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_sentinelone_s1_agent_install_install_windows_failed_task | default('') }}"
              error: "{{ fe_sentinelone_s1_agent_install_install_windows_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_sentinelone_s1_agent_install_install_windows_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_sentinelone_s1_agent_install_install_windows_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_sentinelone_s1_agent_install_install_windows_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_sentinelone_s1_agent_install_install_windows_status | default('') == 'succeeded' else ['sentinelone/s1_agent_install/install_windows'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "sentinelone/s1_agent_install/install_windows | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_sentinelone_s1_agent_install_install_windows_stats_published: true
      tags:
        - always
