---
# Ansible Tower Configuration Playbook
# Entry point for Tower automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Ansible Tower Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Dry run by default, like every other playbook here. Nothing on the
    # controller changes until this is true; the roles still write their plans.
    apply_changes: false

    aap_artifacts_dir: "/tmp/aap-artifacts"

    # Which parts of the controller configuration this run owns. Turn one off
    # when another team owns that part, or to apply the configuration in
    # stages.
    deploy_organizations: true
    deploy_credentials: true
    deploy_projects: true
    deploy_templates: true
    deploy_workflows: true

  tasks:
    - name: "ansible_tower/site | Guarded execution with rescue and always handling"
      block:

        - name: Ensure the artifacts directory exists
          ansible.builtin.file:
            path: "{{ aap_artifacts_dir }}"
            state: directory
            mode: "0750"
          tags: ['always']

        - name: Report what this run will do
          ansible.builtin.debug:
            msg:
              - "Controller: {{ aap_controller_host | default('<aap_controller_host unset>') }}"
              - >-
                Mode: {{ apply_changes | bool | ternary('APPLY - the controller will be changed',
                'DRY RUN - plans are written, nothing is changed') }}
              - "Plans and evidence: {{ aap_artifacts_dir }}/"
              - "Set apply_changes=true to apply."
          tags: ['always']

        # Ordered by dependency: a job template cannot reference a project that
        # does not exist yet, and a workflow node cannot reference a job
        # template that does not exist yet.
        - name: Organizations, teams and role bindings
          ansible.builtin.include_role:
            name: aap_controller_organizations
          when: deploy_organizations | bool
          tags: ['organizations', 'rbac']

        - name: Credential types and credentials
          ansible.builtin.include_role:
            name: aap_controller_credentials
          when: deploy_credentials | bool
          tags: ['credentials']

        - name: Projects, inventories and execution environments
          ansible.builtin.include_role:
            name: aap_controller_projects
          when: deploy_projects | bool
          tags: ['projects', 'inventories']

        - name: Job templates and surveys
          ansible.builtin.include_role:
            name: aap_controller_job_templates
          when: deploy_templates | bool
          tags: ['job_templates']

        - name: Workflows with approval nodes
          ansible.builtin.include_role:
            name: aap_controller_workflows
          when: deploy_workflows | bool
          tags: ['workflows']

        - name: "ansible_tower/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "ansible_tower/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_status: "failed"
            fe_ansible_tower_site_postflight_passed: false
            fe_ansible_tower_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tower_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible_tower/site: FAILED at '{{ fe_ansible_tower_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tower_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible_tower/site failed at '{{ fe_ansible_tower_site_failed_task }}': {{ fe_ansible_tower_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible_tower/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tower_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible_tower/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible_tower/site":
                  component: "ansible_tower/site"
                  type: "playbook"
                  platform: "ansible_tower"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tower_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tower_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tower_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tower_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tower_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tower_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_tower_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tower_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tower_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tower_site_status | default('') == 'succeeded' else ['ansible_tower/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_ansible_tower_site_status | default('') == 'failed'
            - not (fe_ansible_tower_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible_tower/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_stats_published: true
          when:
            - fe_ansible_tower_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "ansible_tower/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "ansible_tower/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_ansible_tower_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tower_site_status: "running"
            fe_ansible_tower_site_preflight_passed: false
            fe_ansible_tower_site_postflight_passed: false
            fe_ansible_tower_site_failed_task: ""
            fe_ansible_tower_site_error: ""
            fe_ansible_tower_site_stats_published: false
          tags:
            - always

        - name: "ansible_tower/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              ansible_tower/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              ansible_tower/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "ansible_tower/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "ansible_tower/site: required variable '{{ item }}' is not defined."
            success_msg: "ansible_tower/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_ansible_tower_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "ansible_tower/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "ansible_tower/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_status: "preflight_failed"
            fe_ansible_tower_site_postflight_passed: false
            fe_ansible_tower_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tower_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible_tower/site: FAILED at '{{ fe_ansible_tower_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tower_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible_tower/site":
                  component: "ansible_tower/site"
                  type: "playbook"
                  platform: "ansible_tower"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tower_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tower_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tower_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tower_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tower_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tower_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_tower_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tower_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tower_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tower_site_status | default('') == 'succeeded' else ['ansible_tower/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "ansible_tower/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_stats_published: true
          tags:
            - always

        - name: "ansible_tower/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible_tower/site failed at '{{ fe_ansible_tower_site_failed_task }}': {{ fe_ansible_tower_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible_tower/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              ansible_tower/site: preflight
              {{ 'passed' if fe_ansible_tower_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "ansible_tower/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "ansible_tower/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_ansible_tower_site_preflight_passed | bool
              - fe_ansible_tower_site_status in ['running', 'succeeded']
            fail_msg: >-
              ansible_tower/site: postflight validation failed - preflight passed
              ={{ fe_ansible_tower_site_preflight_passed | default(false) }},
              status={{ fe_ansible_tower_site_status | default('unknown') }}.
            success_msg: "ansible_tower/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "ansible_tower/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_postflight_passed: true
            fe_ansible_tower_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "ansible_tower/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_status: "failed"
            fe_ansible_tower_site_postflight_passed: false
            fe_ansible_tower_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_ansible_tower_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              ansible_tower/site: FAILED at '{{ fe_ansible_tower_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_ansible_tower_site_error }}
          tags:
            - always
            - rescue

        - name: "ansible_tower/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              ansible_tower/site failed at '{{ fe_ansible_tower_site_failed_task }}': {{ fe_ansible_tower_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "ansible_tower/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_ansible_tower_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "ansible_tower/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "ansible_tower/site":
                  component: "ansible_tower/site"
                  type: "playbook"
                  platform: "ansible_tower"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_ansible_tower_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_ansible_tower_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_ansible_tower_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_ansible_tower_site_started_at | default('') }}"
                  ended_at: "{{ fe_ansible_tower_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_ansible_tower_site_failed_task | default('') }}"
                  error: "{{ fe_ansible_tower_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_ansible_tower_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_ansible_tower_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_ansible_tower_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_ansible_tower_site_status | default('') == 'succeeded' else ['ansible_tower/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_ansible_tower_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "ansible_tower/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_ansible_tower_site_stats_published: true
          tags:
            - always

        - name: "ansible_tower/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              ansible_tower/site: {{ fe_ansible_tower_site_status | default('unknown') }} in
              {{ fe_ansible_tower_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
