---
# Ansible Automation Platform collections requirements
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # Drives the controller configuration. It dispatches to ansible.controller on
  # AAP and to awx.awx on AWX, which is why the roles here work against both.
  - name: infra.controller_configuration
    version: ">=2.5.0"

  # The AWX module set. On AAP the certified equivalent is ansible.controller,
  # which ships only from Red Hat Automation Hub -- see ansible/requirements.yml
  # and its "# automation-hub-only:" marker.
  - name: awx.awx
    version: ">=23.0.0"

  - name: community.general
    version: ">=8.0.0"

  - name: ansible.posix
    version: ">=1.5.0"
