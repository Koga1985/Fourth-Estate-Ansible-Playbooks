---
# defaults file for aap_controller_workflows
# Workflow job templates, with approval nodes, on an Automation Controller.

# ============================================================
# Safety
# ============================================================
apply_changes: false
aap_artifacts_dir: "/tmp/aap-artifacts"

# The reason to build a workflow here is the approval node: a dry-run job, a
# human decision the controller records in its audit log, then the apply job.
# A workflow that applies changes with no approval node throws that away, so
# the preflight rejects it unless this is set.
aap_allow_workflow_without_approval: false

# ============================================================
# Controller connection
# ============================================================
aap_controller_host: ""
aap_controller_username: ""
aap_controller_password: ""
aap_controller_validate_certs: true

# ============================================================
# Desired state
# ============================================================
# Workflows. Shape matches
# infra.controller_configuration.workflow_job_templates.
#
# The dry-run-then-approve-then-apply shape below is the one worth copying. It
# is a stronger control than a survey checkbox, because the approval and the
# person who gave it are recorded by the controller rather than inferred from
# a job's extra vars.
#
#   aap_workflows:
#     - name: "RHEL 9 STIG - assess, approve, apply"
#       organization: "Fourth Estate"
#       survey_enabled: false
#       simplified_workflow_nodes:
#         - identifier: assess
#           unified_job_template: "RHEL 9 STIG - assess"
#           extra_data:
#             apply_changes: false
#           success_nodes: [approve]
#         - identifier: approve
#           approval_node:
#             name: "Approve applying the RHEL 9 STIG baseline"
#             description: >-
#               The assess job above has run. Review its evidence before
#               approving; approving applies the baseline to every host in the
#               chosen limit.
#             timeout: 86400
#           success_nodes: [apply]
#         - identifier: apply
#           unified_job_template: "RHEL 9 STIG - apply"
#           extra_data:
#             apply_changes: true
aap_workflows: []
