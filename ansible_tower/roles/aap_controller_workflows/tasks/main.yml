---
# tasks file for aap_controller_workflows
# -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible_tower/aap_controller_workflows']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_tower_aap_controller_workflows_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible_tower/aap_controller_workflows | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_tower_aap_controller_workflows_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_tower_aap_controller_workflows_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_tower_aap_controller_workflows_status: "running"
    fe_ansible_tower_aap_controller_workflows_preflight_passed: false
    fe_ansible_tower_aap_controller_workflows_postflight_passed: false
    fe_ansible_tower_aap_controller_workflows_failed_task: ""
    fe_ansible_tower_aap_controller_workflows_error: ""
    fe_ansible_tower_aap_controller_workflows_stats_published: false
  tags:
    - always

- name: "ansible_tower/aap_controller_workflows | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible_tower/aap_controller_workflows | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible_tower/aap_controller_workflows: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible_tower/aap_controller_workflows: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_workflows | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible_tower/aap_controller_workflows: required variable '{{ item }}' is not defined."
        success_msg: "ansible_tower/aap_controller_workflows: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_tower_aap_controller_workflows_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_workflows | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_workflows_preflight_passed: true
      tags:
        - always
        - preflight
        - validation


    # ----------------------------- execute ----------------------

    # The point of a workflow here is the approval node: a dry-run job, a human
    # decision recorded in the controller's audit log, then the apply job. A
    # workflow that applies changes with no approval node throws that away, so
    # it has to be waived deliberately.
    - name: Preflight | Verify each applying workflow carries an approval node
      ansible.builtin.assert:
        that:
          - (item.simplified_workflow_nodes | default([])
             | selectattr('approval_node', 'defined') | list | length > 0)
            or (aap_allow_workflow_without_approval | bool)
        fail_msg: >-
          Workflow '{{ item.name }}' has no approval node. A workflow that applies
          changes to production infrastructure should pause for a human decision,
          which the controller records in its audit log. Set
          aap_allow_workflow_without_approval=true to accept this.
        success_msg: "Workflow '{{ item.name }}' carries an approval node."
        quiet: true
      loop: "{{ aap_workflows | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      tags: [aap, controller, workflows, preflight]

    - name: Build the desired-state plan for workflows
      ansible.builtin.set_fact:
        _aap_wf_plan:
          workflows: "{{ aap_workflows | default([]) }}"
          approval_nodes: >-
            {{ aap_workflows | default([])
               | map(attribute='simplified_workflow_nodes') | flatten
               | selectattr('approval_node', 'defined')
               | map(attribute='identifier') | list }}
      tags: [aap, controller, workflows, plan]

    - name: Write the workflow plan
      ansible.builtin.copy:
        dest: "{{ aap_artifacts_dir }}/aap_workflow_plan.json"
        mode: "0640"
        content: "{{ _aap_wf_plan | to_nice_json }}\n"
      tags: [aap, controller, workflows, plan, report, artifact]

    - name: Report what a dry run would change
      ansible.builtin.debug:
        msg:
          - "Dry run: no workflow was created or modified."
          - "Planned: {{ (aap_workflows | default([])) | length }} workflow(s),"
          - "         {{ _aap_wf_plan.approval_nodes | length }} approval node(s)."
          - "Set apply_changes=true to apply it."
      when: not (apply_changes | bool)
      tags: [aap, controller, workflows, plan]

    - name: Apply workflow job templates
      ansible.builtin.include_role:
        name: infra.controller_configuration.workflow_job_templates
      vars:
        controller_workflows: "{{ aap_workflows | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_workflows | default([])) | length > 0
      tags: [aap, controller, workflows]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to aap_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry controller configuration state, not credentials: the
    # writer below redacts every secret before the file is created.
    # See VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "ansible_tower/aap_controller_workflows | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ aap_artifacts_dir }}"
        patterns: "aap_workflow_plan.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_workflows | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_workflows | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "ansible_tower/aap_controller_workflows":
              component: "ansible_tower/aap_controller_workflows"
              platform: "ansible_tower"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ aap_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "ansible_tower/aap_controller_workflows | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_tower_aap_controller_workflows_preflight_passed | bool
          - fe_ansible_tower_aap_controller_workflows_status in ['running', 'succeeded']
        fail_msg: >-
          ansible_tower/aap_controller_workflows: postflight validation failed - preflight passed
          ={{ fe_ansible_tower_aap_controller_workflows_preflight_passed | default(false) }},
          status={{ fe_ansible_tower_aap_controller_workflows_status | default('unknown') }}.
        success_msg: "ansible_tower/aap_controller_workflows: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible_tower/aap_controller_workflows | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_workflows_postflight_passed: true
        fe_ansible_tower_aap_controller_workflows_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible_tower/aap_controller_workflows | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_workflows_status: "failed"
        fe_ansible_tower_aap_controller_workflows_postflight_passed: false
        fe_ansible_tower_aap_controller_workflows_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_tower_aap_controller_workflows_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_workflows | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible_tower/aap_controller_workflows: FAILED at '{{ fe_ansible_tower_aap_controller_workflows_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_tower_aap_controller_workflows_error }}
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_workflows | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible_tower/aap_controller_workflows failed at '{{ fe_ansible_tower_aap_controller_workflows_failed_task }}': {{ fe_ansible_tower_aap_controller_workflows_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible_tower/aap_controller_workflows | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_workflows_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_tower_aap_controller_workflows_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_aap_controller_workflows_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible_tower/aap_controller_workflows | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible_tower/aap_controller_workflows":
              component: "ansible_tower/aap_controller_workflows"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_tower_aap_controller_workflows_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_tower_aap_controller_workflows_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_tower_aap_controller_workflows_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_tower_aap_controller_workflows_started_at | default('') }}"
              ended_at: "{{ fe_ansible_tower_aap_controller_workflows_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_tower_aap_controller_workflows_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_tower_aap_controller_workflows_failed_task | default('') }}"
              error: "{{ fe_ansible_tower_aap_controller_workflows_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_tower_aap_controller_workflows_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_tower_aap_controller_workflows_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_tower_aap_controller_workflows_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_tower_aap_controller_workflows_status | default('') == 'succeeded' else ['ansible_tower/aap_controller_workflows'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible_tower/aap_controller_workflows | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_workflows_stats_published: true
      tags:
        - always
