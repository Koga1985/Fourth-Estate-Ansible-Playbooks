---
# tasks file for aap_controller_job_templates
# -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible_tower/aap_controller_job_templates']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_tower_aap_controller_job_templates_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible_tower/aap_controller_job_templates | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_tower_aap_controller_job_templates_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_tower_aap_controller_job_templates_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_tower_aap_controller_job_templates_status: "running"
    fe_ansible_tower_aap_controller_job_templates_preflight_passed: false
    fe_ansible_tower_aap_controller_job_templates_postflight_passed: false
    fe_ansible_tower_aap_controller_job_templates_failed_task: ""
    fe_ansible_tower_aap_controller_job_templates_error: ""
    fe_ansible_tower_aap_controller_job_templates_stats_published: false
  tags:
    - always

- name: "ansible_tower/aap_controller_job_templates | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible_tower/aap_controller_job_templates | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible_tower/aap_controller_job_templates: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible_tower/aap_controller_job_templates: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_job_templates | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible_tower/aap_controller_job_templates: required variable '{{ item }}' is not defined."
        success_msg: "ansible_tower/aap_controller_job_templates: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_tower_aap_controller_job_templates_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_job_templates | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_job_templates_preflight_passed: true
      tags:
        - always
        - preflight
        - validation


    # ----------------------------- execute ----------------------

    # Every template in this repository defaults to a dry run. A job template
    # that hides apply_changes behind a default the operator cannot see removes
    # that safeguard, so require it to be on the survey or explicitly waived.
    - name: Preflight | Verify each job template exposes apply_changes or waives it
      ansible.builtin.assert:
        that:
          - (item.survey_spec is defined
             and (item.survey_spec.spec | default([]) | map(attribute='variable') | list) is contains('apply_changes'))
            or (item.extra_vars is defined and 'apply_changes' in item.extra_vars)
            or (aap_allow_template_without_apply_gate | bool)
        fail_msg: >-
          Job template '{{ item.name }}' neither surveys apply_changes nor sets it
          in extra_vars. The playbooks in this repository default to a dry run;
          an operator must be able to see and choose when a run applies changes.
          Set aap_allow_template_without_apply_gate=true to accept this.
        success_msg: "Job template '{{ item.name }}' exposes the apply_changes gate."
        quiet: true
      loop: "{{ aap_job_templates | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      tags: [aap, controller, job_templates, preflight]

    - name: Build the desired-state plan for job templates
      ansible.builtin.set_fact:
        _aap_jt_plan:
          job_templates: "{{ aap_job_templates | default([]) }}"
          surveys_enabled: >-
            {{ aap_job_templates | default([])
               | selectattr('survey_enabled', 'defined')
               | selectattr('survey_enabled') | map(attribute='name') | list }}
      tags: [aap, controller, job_templates, plan]

    - name: Write the job template plan
      ansible.builtin.copy:
        dest: "{{ aap_artifacts_dir }}/aap_job_template_plan.json"
        mode: "0640"
        content: "{{ _aap_jt_plan | to_nice_json }}\n"
      tags: [aap, controller, job_templates, plan, report, artifact]

    - name: Report what a dry run would change
      ansible.builtin.debug:
        msg:
          - "Dry run: no job template was created or modified."
          - "Planned: {{ (aap_job_templates | default([])) | length }} job template(s),"
          - "         {{ _aap_jt_plan.surveys_enabled | length }} with a survey."
          - "Set apply_changes=true to apply it."
      when: not (apply_changes | bool)
      tags: [aap, controller, job_templates, plan]

    - name: Apply job templates
      ansible.builtin.include_role:
        name: infra.controller_configuration.job_templates
      vars:
        controller_templates: "{{ aap_job_templates | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_job_templates | default([])) | length > 0
      tags: [aap, controller, job_templates]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to aap_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry controller configuration state, not credentials: the
    # writer below redacts every secret before the file is created.
    # See VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "ansible_tower/aap_controller_job_templates | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ aap_artifacts_dir }}"
        patterns: "aap_job_template_plan.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_job_templates | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_job_templates | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "ansible_tower/aap_controller_job_templates":
              component: "ansible_tower/aap_controller_job_templates"
              platform: "ansible_tower"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ aap_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "ansible_tower/aap_controller_job_templates | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_tower_aap_controller_job_templates_preflight_passed | bool
          - fe_ansible_tower_aap_controller_job_templates_status in ['running', 'succeeded']
        fail_msg: >-
          ansible_tower/aap_controller_job_templates: postflight validation failed - preflight passed
          ={{ fe_ansible_tower_aap_controller_job_templates_preflight_passed | default(false) }},
          status={{ fe_ansible_tower_aap_controller_job_templates_status | default('unknown') }}.
        success_msg: "ansible_tower/aap_controller_job_templates: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible_tower/aap_controller_job_templates | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_job_templates_postflight_passed: true
        fe_ansible_tower_aap_controller_job_templates_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible_tower/aap_controller_job_templates | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_job_templates_status: "failed"
        fe_ansible_tower_aap_controller_job_templates_postflight_passed: false
        fe_ansible_tower_aap_controller_job_templates_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_tower_aap_controller_job_templates_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_job_templates | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible_tower/aap_controller_job_templates: FAILED at '{{ fe_ansible_tower_aap_controller_job_templates_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_tower_aap_controller_job_templates_error }}
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_job_templates | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible_tower/aap_controller_job_templates failed at '{{ fe_ansible_tower_aap_controller_job_templates_failed_task }}': {{ fe_ansible_tower_aap_controller_job_templates_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible_tower/aap_controller_job_templates | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_job_templates_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_tower_aap_controller_job_templates_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_aap_controller_job_templates_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible_tower/aap_controller_job_templates | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible_tower/aap_controller_job_templates":
              component: "ansible_tower/aap_controller_job_templates"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_tower_aap_controller_job_templates_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_tower_aap_controller_job_templates_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_tower_aap_controller_job_templates_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_tower_aap_controller_job_templates_started_at | default('') }}"
              ended_at: "{{ fe_ansible_tower_aap_controller_job_templates_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_tower_aap_controller_job_templates_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_tower_aap_controller_job_templates_failed_task | default('') }}"
              error: "{{ fe_ansible_tower_aap_controller_job_templates_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_tower_aap_controller_job_templates_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_tower_aap_controller_job_templates_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_tower_aap_controller_job_templates_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_tower_aap_controller_job_templates_status | default('') == 'succeeded' else ['ansible_tower/aap_controller_job_templates'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible_tower/aap_controller_job_templates | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_job_templates_stats_published: true
      tags:
        - always
