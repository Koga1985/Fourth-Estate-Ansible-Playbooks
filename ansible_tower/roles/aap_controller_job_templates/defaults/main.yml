---
# defaults file for aap_controller_job_templates
# Job templates and surveys on an Automation Controller.

# ============================================================
# Safety
# ============================================================
apply_changes: false
aap_artifacts_dir: "/tmp/aap-artifacts"

# Every playbook in this repository defaults to apply_changes: false. A job
# template that neither surveys apply_changes nor sets it in extra_vars hides
# that safeguard from the operator, so the preflight rejects it unless this is
# set.
aap_allow_template_without_apply_gate: false

# ============================================================
# Controller connection
# ============================================================
aap_controller_host: ""
aap_controller_username: ""
aap_controller_password: ""
aap_controller_validate_certs: true

# ============================================================
# Desired state
# ============================================================
# Job templates. Shape matches infra.controller_configuration.job_templates.
#
# A survey is the supported way to expose a role's documented variables to an
# operator. The flat, defaulted variables this repository uses map onto survey
# questions almost one to one -- see each role's defaults/main.yml for what is
# worth surveying.
#
#   aap_job_templates:
#     - name: "RHEL 9 STIG - assess"
#       job_type: run
#       organization: "Fourth Estate"
#       project: "Fourth Estate Playbooks"
#       playbook: "rhel/playbooks/compliance-check.yml"
#       inventory: "RHEL Servers"
#       execution_environment: "Fourth Estate EE"
#       credentials: ["RHEL SSH"]
#       ask_limit_on_launch: true
#       survey_enabled: true
#       survey_spec:
#         name: "RHEL 9 STIG"
#         description: "Assess or apply the RHEL 9 STIG baseline"
#         spec:
#           - question_name: "Apply changes? Leave false for a dry run."
#             variable: apply_changes
#             type: multiplechoice
#             choices: ["false", "true"]
#             default: "false"
#             required: true
aap_job_templates: []
