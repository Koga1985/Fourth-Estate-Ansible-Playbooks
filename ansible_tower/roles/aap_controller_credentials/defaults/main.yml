---
# defaults file for aap_controller_credentials
# Credential types and credentials on an Automation Controller.

# ============================================================
# Safety
# ============================================================
apply_changes: false
aap_artifacts_dir: "/tmp/aap-artifacts"

# ============================================================
# Controller connection
# ============================================================
aap_controller_host: ""
aap_controller_username: ""
aap_controller_password: ""
aap_controller_validate_certs: true

# ============================================================
# Desired state
# ============================================================
# Custom credential types for the vendor APIs this repository drives. A custom
# type is what lets an operator launch a job template without ever seeing the
# secret: the controller injects it as an extra var or an environment variable
# at launch time.
#
#   aap_credential_types:
#     - name: "Cisco ISE API"
#       kind: cloud
#       inputs:
#         fields:
#           - id: ise_hostname
#             type: string
#             label: "ISE hostname"
#           - id: ise_password
#             type: string
#             label: "ISE password"
#             secret: true
#         required: [ise_hostname, ise_password]
#       injectors:
#         extra_vars:
#           ise_hostname: "{{ '{{' }} ise_hostname {{ '}}' }}"
#           ise_password: "{{ '{{' }} ise_password {{ '}}' }}"
aap_credential_types: []

# Credentials. `inputs` carries the secret material and is never written to the
# plan; supply it from Ansible Vault or an external secrets manager.
aap_credentials: []
