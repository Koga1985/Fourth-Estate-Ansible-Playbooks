---
# defaults file for aap_controller_organizations
# Organizations, teams, users and role bindings on an Automation Controller.

# ============================================================
# Safety
# ============================================================
# Every role in this repository defaults to a dry run. With apply_changes false
# the role writes its plan and changes nothing on the controller.
apply_changes: false

# Where the plan and evidence are written. Under AAP this directory does not
# outlive the job, which is why the evidence tasks also publish it through
# set_stats -- see VALIDATION_AND_STATS.md#compliance-evidence-delivery.
aap_artifacts_dir: "/tmp/aap-artifacts"

# ============================================================
# Controller connection
# ============================================================
# Supply these from the controller's own credential store, from Ansible Vault,
# or from the environment. Never commit them.
aap_controller_host: ""
aap_controller_username: ""
aap_controller_password: ""
aap_controller_validate_certs: true

# ============================================================
# Desired state
# ============================================================
# Organizations. Shape matches infra.controller_configuration.organizations.
#
#   aap_organizations:
#     - name: "Fourth Estate"
#       description: "Newsroom infrastructure automation"
#       max_hosts: 0
#       galaxy_credentials:
#         - "Ansible Galaxy"
aap_organizations: []

# Teams, scoped to an organization.
#
#   aap_teams:
#     - name: "Network Engineering"
#       organization: "Fourth Estate"
#       description: "Owns the Cisco, Arista and Palo Alto templates"
aap_teams: []

# User accounts. A password here is dropped before the plan is written, so it
# never reaches an artifact -- prefer an external identity provider over
# managing local users at all.
aap_users: []

# Role bindings: who may use what. This is the part that decides whether an
# operator can launch a job template that changes production.
#
#   aap_roles:
#     - team: "Network Engineering"
#       organization: "Fourth Estate"
#       role: execute
#       job_templates:
#         - "Cisco ISE - Policy - dry run"
aap_roles: []
