---
# tasks file for aap_controller_organizations
# -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible_tower/aap_controller_organizations']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_tower_aap_controller_organizations_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible_tower/aap_controller_organizations | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_tower_aap_controller_organizations_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_tower_aap_controller_organizations_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_tower_aap_controller_organizations_status: "running"
    fe_ansible_tower_aap_controller_organizations_preflight_passed: false
    fe_ansible_tower_aap_controller_organizations_postflight_passed: false
    fe_ansible_tower_aap_controller_organizations_failed_task: ""
    fe_ansible_tower_aap_controller_organizations_error: ""
    fe_ansible_tower_aap_controller_organizations_stats_published: false
  tags:
    - always

- name: "ansible_tower/aap_controller_organizations | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible_tower/aap_controller_organizations | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible_tower/aap_controller_organizations: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible_tower/aap_controller_organizations: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_organizations | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible_tower/aap_controller_organizations: required variable '{{ item }}' is not defined."
        success_msg: "ansible_tower/aap_controller_organizations: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_tower_aap_controller_organizations_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_organizations | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_organizations_preflight_passed: true
      tags:
        - always
        - preflight
        - validation


    # ----------------------------- execute ----------------------

    - name: Build the desired-state plan for organizations, teams and access
      ansible.builtin.set_fact:
        _aap_org_plan:
          organizations: "{{ aap_organizations | default([]) }}"
          teams: "{{ aap_teams | default([]) }}"
          users: >-
            {{ aap_users | default([])
               | map('dict2items') | map('rejectattr', 'key', 'eq', 'password')
               | map('items2dict') | list }}
          roles: "{{ aap_roles | default([]) }}"
      tags: [aap, controller, organizations, plan]

    # The plan is written on every run, including a dry run, because it is the
    # record of what the controller was asked to look like. User passwords are
    # dropped above rather than redacted here, so a secret never reaches the
    # file in the first place.
    - name: Write the access plan
      ansible.builtin.copy:
        dest: "{{ aap_artifacts_dir }}/aap_access_plan.json"
        mode: "0640"
        content: "{{ _aap_org_plan | to_nice_json }}\n"
      tags: [aap, controller, organizations, plan, report, artifact]

    - name: Report what a dry run would change
      ansible.builtin.debug:
        msg:
          - "Dry run: no controller object was created or modified."
          - "Planned: {{ (aap_organizations | default([])) | length }} organization(s),"
          - "         {{ (aap_teams | default([])) | length }} team(s),"
          - "         {{ (aap_users | default([])) | length }} user(s),"
          - "         {{ (aap_roles | default([])) | length }} role binding(s)."
          - "Plan written to {{ aap_artifacts_dir }}/aap_access_plan.json"
          - "Set apply_changes=true to apply it."
      when: not (apply_changes | bool)
      tags: [aap, controller, organizations, plan]

    - name: Apply organizations
      ansible.builtin.include_role:
        name: infra.controller_configuration.organizations
      vars:
        controller_organizations: "{{ aap_organizations | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_organizations | default([])) | length > 0
      tags: [aap, controller, organizations]

    - name: Apply teams
      ansible.builtin.include_role:
        name: infra.controller_configuration.teams
      vars:
        controller_teams: "{{ aap_teams | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_teams | default([])) | length > 0
      tags: [aap, controller, teams]

    - name: Apply user accounts
      ansible.builtin.include_role:
        name: infra.controller_configuration.users
      vars:
        controller_user_accounts: "{{ aap_users | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_users | default([])) | length > 0
      tags: [aap, controller, users]

    - name: Apply role bindings
      ansible.builtin.include_role:
        name: infra.controller_configuration.roles
      vars:
        controller_roles: "{{ aap_roles | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_roles | default([])) | length > 0
      tags: [aap, controller, rbac]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to aap_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry controller configuration state, not credentials: the
    # writer below redacts every secret before the file is created.
    # See VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "ansible_tower/aap_controller_organizations | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ aap_artifacts_dir }}"
        patterns: "aap_access_plan.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_organizations | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_organizations | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "ansible_tower/aap_controller_organizations":
              component: "ansible_tower/aap_controller_organizations"
              platform: "ansible_tower"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ aap_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "ansible_tower/aap_controller_organizations | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_tower_aap_controller_organizations_preflight_passed | bool
          - fe_ansible_tower_aap_controller_organizations_status in ['running', 'succeeded']
        fail_msg: >-
          ansible_tower/aap_controller_organizations: postflight validation failed - preflight passed
          ={{ fe_ansible_tower_aap_controller_organizations_preflight_passed | default(false) }},
          status={{ fe_ansible_tower_aap_controller_organizations_status | default('unknown') }}.
        success_msg: "ansible_tower/aap_controller_organizations: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible_tower/aap_controller_organizations | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_organizations_postflight_passed: true
        fe_ansible_tower_aap_controller_organizations_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible_tower/aap_controller_organizations | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_organizations_status: "failed"
        fe_ansible_tower_aap_controller_organizations_postflight_passed: false
        fe_ansible_tower_aap_controller_organizations_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_tower_aap_controller_organizations_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_organizations | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible_tower/aap_controller_organizations: FAILED at '{{ fe_ansible_tower_aap_controller_organizations_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_tower_aap_controller_organizations_error }}
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_organizations | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible_tower/aap_controller_organizations failed at '{{ fe_ansible_tower_aap_controller_organizations_failed_task }}': {{ fe_ansible_tower_aap_controller_organizations_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible_tower/aap_controller_organizations | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_organizations_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_tower_aap_controller_organizations_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_aap_controller_organizations_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible_tower/aap_controller_organizations | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible_tower/aap_controller_organizations":
              component: "ansible_tower/aap_controller_organizations"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_tower_aap_controller_organizations_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_tower_aap_controller_organizations_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_tower_aap_controller_organizations_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_tower_aap_controller_organizations_started_at | default('') }}"
              ended_at: "{{ fe_ansible_tower_aap_controller_organizations_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_tower_aap_controller_organizations_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_tower_aap_controller_organizations_failed_task | default('') }}"
              error: "{{ fe_ansible_tower_aap_controller_organizations_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_tower_aap_controller_organizations_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_tower_aap_controller_organizations_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_tower_aap_controller_organizations_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_tower_aap_controller_organizations_status | default('') == 'succeeded' else ['ansible_tower/aap_controller_organizations'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible_tower/aap_controller_organizations | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_organizations_stats_published: true
      tags:
        - always
