---
# tasks file for aap_controller_projects
# -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ansible_tower/aap_controller_projects']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ansible_tower_aap_controller_projects_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ansible_tower/aap_controller_projects | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ansible_tower_aap_controller_projects_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ansible_tower_aap_controller_projects_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ansible_tower_aap_controller_projects_status: "running"
    fe_ansible_tower_aap_controller_projects_preflight_passed: false
    fe_ansible_tower_aap_controller_projects_postflight_passed: false
    fe_ansible_tower_aap_controller_projects_failed_task: ""
    fe_ansible_tower_aap_controller_projects_error: ""
    fe_ansible_tower_aap_controller_projects_stats_published: false
  tags:
    - always

- name: "ansible_tower/aap_controller_projects | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ansible_tower/aap_controller_projects | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ansible_tower/aap_controller_projects: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ansible_tower/aap_controller_projects: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_projects | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ansible_tower/aap_controller_projects: required variable '{{ item }}' is not defined."
        success_msg: "ansible_tower/aap_controller_projects: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ansible_tower_aap_controller_projects_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ansible_tower/aap_controller_projects | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_projects_preflight_passed: true
      tags:
        - always
        - preflight
        - validation


    # ----------------------------- execute ----------------------

    # A project tracking a branch turns every commit in the content repository
    # into an immediate change in the control plane. Refuse to plan one unless
    # the caller has said so explicitly.
    - name: Preflight | Verify every project is pinned to a tag or commit
      ansible.builtin.assert:
        that:
          - item.scm_branch is defined
          - item.scm_branch | length > 0
          - (item.scm_branch is not match('^(main|master|devel|development)$'))
            or (aap_allow_branch_tracking | bool)
        fail_msg: >-
          Project '{{ item.name }}' tracks '{{ item.scm_branch | default('<unset>') }}'.
          Pin it to a release tag or a commit, or set
          aap_allow_branch_tracking=true to accept that every commit on that
          branch reaches this controller.
        success_msg: "Project '{{ item.name }}' is pinned to '{{ item.scm_branch }}'."
        quiet: true
      loop: "{{ aap_projects | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      tags: [aap, controller, projects, preflight]

    - name: Build the desired-state plan for projects, inventories and execution environments
      ansible.builtin.set_fact:
        _aap_content_plan:
          projects: "{{ aap_projects | default([]) }}"
          inventories: "{{ aap_inventories | default([]) }}"
          inventory_sources: "{{ aap_inventory_sources | default([]) }}"
          execution_environments: "{{ aap_execution_environments | default([]) }}"
      tags: [aap, controller, projects, plan]

    - name: Write the content plan
      ansible.builtin.copy:
        dest: "{{ aap_artifacts_dir }}/aap_content_plan.json"
        mode: "0640"
        content: "{{ _aap_content_plan | to_nice_json }}\n"
      tags: [aap, controller, projects, plan, report, artifact]

    - name: Report what a dry run would change
      ansible.builtin.debug:
        msg:
          - "Dry run: no project, inventory or execution environment was changed."
          - "Planned: {{ (aap_projects | default([])) | length }} project(s),"
          - "         {{ (aap_inventories | default([])) | length }} inventory/ies,"
          - "         {{ (aap_execution_environments | default([])) | length }} execution environment(s)."
          - "Set apply_changes=true to apply it."
      when: not (apply_changes | bool)
      tags: [aap, controller, projects, plan]

    - name: Apply execution environments
      ansible.builtin.include_role:
        name: infra.controller_configuration.execution_environments
      vars:
        controller_execution_environments: "{{ aap_execution_environments | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_execution_environments | default([])) | length > 0
      tags: [aap, controller, execution_environments]

    - name: Apply projects
      ansible.builtin.include_role:
        name: infra.controller_configuration.projects
      vars:
        controller_projects: "{{ aap_projects | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_projects | default([])) | length > 0
      tags: [aap, controller, projects]

    - name: Apply inventories
      ansible.builtin.include_role:
        name: infra.controller_configuration.inventories
      vars:
        controller_inventories: "{{ aap_inventories | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_inventories | default([])) | length > 0
      tags: [aap, controller, inventories]

    - name: Apply inventory sources
      ansible.builtin.include_role:
        name: infra.controller_configuration.inventory_sources
      vars:
        controller_inventory_sources: "{{ aap_inventory_sources | default([]) }}"
      when:
        - apply_changes | bool
        - (aap_inventory_sources | default([])) | length > 0
      tags: [aap, controller, inventories]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to aap_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry controller configuration state, not credentials: the
    # writer below redacts every secret before the file is created.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "ansible_tower/aap_controller_projects | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ aap_artifacts_dir }}"
        patterns: "aap_content_plan.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_projects | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "ansible_tower/aap_controller_projects | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "ansible_tower/aap_controller_projects":
              component: "ansible_tower/aap_controller_projects"
              platform: "ansible_tower"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ aap_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "ansible_tower/aap_controller_projects | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ansible_tower_aap_controller_projects_preflight_passed | bool
          - fe_ansible_tower_aap_controller_projects_status in ['running', 'succeeded']
        fail_msg: >-
          ansible_tower/aap_controller_projects: postflight validation failed - preflight passed
          ={{ fe_ansible_tower_aap_controller_projects_preflight_passed | default(false) }},
          status={{ fe_ansible_tower_aap_controller_projects_status | default('unknown') }}.
        success_msg: "ansible_tower/aap_controller_projects: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ansible_tower/aap_controller_projects | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_projects_postflight_passed: true
        fe_ansible_tower_aap_controller_projects_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ansible_tower/aap_controller_projects | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_projects_status: "failed"
        fe_ansible_tower_aap_controller_projects_postflight_passed: false
        fe_ansible_tower_aap_controller_projects_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ansible_tower_aap_controller_projects_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_projects | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ansible_tower/aap_controller_projects: FAILED at '{{ fe_ansible_tower_aap_controller_projects_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ansible_tower_aap_controller_projects_error }}
      tags:
        - always
        - rescue

    - name: "ansible_tower/aap_controller_projects | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ansible_tower/aap_controller_projects failed at '{{ fe_ansible_tower_aap_controller_projects_failed_task }}': {{ fe_ansible_tower_aap_controller_projects_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ansible_tower/aap_controller_projects | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_projects_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ansible_tower_aap_controller_projects_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ansible_tower_aap_controller_projects_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ansible_tower/aap_controller_projects | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ansible_tower/aap_controller_projects":
              component: "ansible_tower/aap_controller_projects"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ansible_tower_aap_controller_projects_status | default('unknown') }}"
              preflight_passed: "{{ fe_ansible_tower_aap_controller_projects_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ansible_tower_aap_controller_projects_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ansible_tower_aap_controller_projects_started_at | default('') }}"
              ended_at: "{{ fe_ansible_tower_aap_controller_projects_ended_at | default('') }}"
              duration_seconds: "{{ fe_ansible_tower_aap_controller_projects_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ansible_tower_aap_controller_projects_failed_task | default('') }}"
              error: "{{ fe_ansible_tower_aap_controller_projects_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ansible_tower_aap_controller_projects_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ansible_tower_aap_controller_projects_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ansible_tower_aap_controller_projects_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ansible_tower_aap_controller_projects_status | default('') == 'succeeded' else ['ansible_tower/aap_controller_projects'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ansible_tower/aap_controller_projects | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ansible_tower_aap_controller_projects_stats_published: true
      tags:
        - always
