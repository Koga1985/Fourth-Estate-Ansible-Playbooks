---
# defaults file for aap_controller_projects
# Projects, inventories and execution environments on an Automation Controller.

# ============================================================
# Safety
# ============================================================
apply_changes: false
aap_artifacts_dir: "/tmp/aap-artifacts"

# A project that tracks a branch turns every commit in the content repository
# into an immediate change in the control plane. The preflight refuses to plan
# one unless this is set, which makes accepting that risk a deliberate act.
aap_allow_branch_tracking: false

# ============================================================
# Controller connection
# ============================================================
aap_controller_host: ""
aap_controller_username: ""
aap_controller_password: ""
aap_controller_validate_certs: true

# ============================================================
# Desired state
# ============================================================
# Projects. scm_branch should be a release tag of this repository, not a branch:
# see docs/CHANGELOG.md before moving a pin.
#
#   aap_projects:
#     - name: "Fourth Estate Playbooks"
#       organization: "Fourth Estate"
#       scm_type: git
#       scm_url: "https://github.com/Koga1985/Fourth-Estate-Ansible-Playbooks.git"
#       scm_branch: "1.1.0"
#       scm_update_on_launch: false
#       scm_clean: true
#       default_environment: "Fourth Estate EE"
aap_projects: []

# Execution environments. Build the image from execution_environment/ in this
# repository and push it to a registry the controller can reach; that is what
# makes a given repository tag behave the same way in every environment.
#
#   aap_execution_environments:
#     - name: "Fourth Estate EE"
#       image: "registry.example.mil/fourth-estate-ee:1.1.0"
#       pull: missing
#       credential: "Registry pull"
aap_execution_environments: []

# Inventories and their sources.
aap_inventories: []
aap_inventory_sources: []
