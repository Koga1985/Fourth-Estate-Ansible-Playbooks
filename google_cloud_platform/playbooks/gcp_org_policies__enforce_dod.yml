---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_org_policies__enforce_dod']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_org_policies__enforce_dod_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_org_policies__enforce_dod | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_status: "running"
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_preflight_passed: false
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_postflight_passed: false
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_failed_task: ""
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_error: ""
    fe_google_cloud_platform_gcp_org_policies__enforce_dod_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_org_policies__enforce_dod | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_org_policies__enforce_dod: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_org_policies__enforce_dod: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_org_policies__enforce_dod: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_org_policies__enforce_dod: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - vars:
        artifacts_dir: "/tmp/gcp-artifacts"
        apply_changes: false
        gcloud_bin: "gcloud"
        org_id: ""
        folder_id: ""
        billing_account: ""
        labels_common: {}
      block:
        - name: Ensure artifacts directory
          ansible.builtin.file:
            path: "{{ artifacts_dir }}"
            state: directory
            mode: "0755"

    - name: Render DoD org-policy constraints
      vars:
        constraints: "{{ dod_constraints | default({
          'compute.disableSerialPortAccess': True,
          'compute.requireOsLogin': True,
          'compute.requireShieldedVm': True,
          'iam.disableServiceAccountKeyCreation': True,
          'iam.allowedPolicyMemberDomains': ['dod.mil'],
          'storage.uniformBucketLevelAccess': True
        }) }}"
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/org_policies_dod.json"
        mode: "0644"
        content: "{{ constraints | to_nice_json }}"
    - name: Apply (org-policies)
      when: apply_changes | bool
      ansible.builtin.shell: |
        set -euo pipefail
        jq -r 'to_entries[] | "\(.key)=\(.value)"' "{{ artifacts_dir }}/org_policies_dod.json" | while IFS='=' read -r key val; do
          if [[ "$val" == "true" ]]; then
            {{ gcloud_bin }} org-policies enable-enforce "$key" --organization="{{ org_id }}"
          else
            {{ gcloud_bin }} org-policies disable-enforce "$key" --organization="{{ org_id }}"
          fi
        done
      args: { executable: /bin/bash }

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_org_policies__enforce_dod_preflight_passed | bool
          - fe_google_cloud_platform_gcp_org_policies__enforce_dod_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_org_policies__enforce_dod: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_org_policies__enforce_dod: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_postflight_passed: true
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_status: "failed"
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_postflight_passed: false
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_org_policies__enforce_dod: FAILED at '{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_org_policies__enforce_dod failed at '{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_failed_task }}': {{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_org_policies__enforce_dod_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_org_policies__enforce_dod":
              component: "google_cloud_platform/gcp_org_policies__enforce_dod"
              type: "tasks"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_org_policies__enforce_dod_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_org_policies__enforce_dod_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_org_policies__enforce_dod_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_org_policies__enforce_dod_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_org_policies__enforce_dod'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_org_policies__enforce_dod | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_org_policies__enforce_dod_stats_published: true
      tags:
        - always
