---
# Google Cloud Platform Enterprise Deployment Playbook
# Entry point for comprehensive GCP automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: GCP Enterprise Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_landing_zone: true
    deploy_iam: true
    deploy_network: true
    deploy_security: true
    deploy_gke: true
    deploy_logging: true
    deploy_monitoring: true
    deploy_storage: true
    deploy_databases: true
    deploy_compliance: true
    deploy_finops: true

  tasks:
    # =========================================
    # Phase 1: Landing Zone & Foundation
    # =========================================
    - name: "google_cloud_platform/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Landing Zone (DoD)
          ansible.builtin.include_role:
            name: gcp_landing_zone_dod
          when: deploy_landing_zone | bool
          tags: ['landing_zone', 'phase1']

        - name: Phase 1 - Assured Workloads
          ansible.builtin.include_role:
            name: gcp_assured_workloads_operations
          when: deploy_landing_zone | bool
          tags: ['landing_zone', 'assured', 'phase1']

        # =========================================
        # Phase 2: IAM & Identity
        # =========================================
        - name: Phase 2 - IAM Foundations
          ansible.builtin.include_role:
            name: gcp_iam_foundations
          when: deploy_iam | bool
          tags: ['iam', 'phase2']

        - name: Phase 2 - Service Accounts Broker
          ansible.builtin.include_role:
            name: gcp_service_accounts_broker
          when: deploy_iam | bool
          tags: ['iam', 'phase2']

        - name: Phase 2 - SSO Directory Sync
          ansible.builtin.include_role:
            name: gcp_sso_directory_sync
          when: deploy_iam | bool
          tags: ['iam', 'sso', 'phase2']

        # =========================================
        # Phase 3: Networking
        # =========================================
        - name: Phase 3 - Inventory Baseline
          ansible.builtin.include_role:
            name: gcp_inventory_baseline
          when: deploy_network | bool
          tags: ['network', 'phase3']

        - name: Phase 3 - Private Service Connect
          ansible.builtin.include_role:
            name: gcp_private_service_connect_fabric
          when: deploy_network | bool
          tags: ['network', 'phase3']

        - name: Phase 3 - DNS Enterprise
          ansible.builtin.include_role:
            name: gcp_dns_enterprise
          when: deploy_network | bool
          tags: ['network', 'dns', 'phase3']

        - name: Phase 3 - Ingress/Egress Controls
          ansible.builtin.include_role:
            name: gcp_ingress_egress_controls
          when: deploy_network | bool
          tags: ['network', 'security', 'phase3']

        - name: Phase 3 - Perimeter Protection
          ansible.builtin.include_role:
            name: gcp_perimeter_protection
          when: deploy_network | bool
          tags: ['network', 'security', 'phase3']

        # =========================================
        # Phase 4: Security
        # =========================================
        - name: Phase 4 - CMEK Everywhere
          ansible.builtin.include_role:
            name: gcp_cmek_everywhere
          when: deploy_security | bool
          tags: ['security', 'cmek', 'phase4']

        - name: Phase 4 - SCC SecOps Pipeline
          ansible.builtin.include_role:
            name: gcp_scc_secops_pipeline
          when: deploy_security | bool
          tags: ['security', 'scc', 'phase4']

        - name: Phase 4 - SCC Response Playbooks
          ansible.builtin.include_role:
            name: gcp_scc_response_playbooks
          when: deploy_security | bool
          tags: ['security', 'scc', 'phase4']

        - name: Phase 4 - Supply Chain Attestations
          ansible.builtin.include_role:
            name: gcp_supply_chain_attestations
          when: deploy_security | bool
          tags: ['security', 'supply_chain', 'phase4']

        # =========================================
        # Phase 5: GKE
        # =========================================
        - name: Phase 5 - GKE Workload Identity
          ansible.builtin.include_role:
            name: gcp_gke_workload_identity_rollout
          when: deploy_gke | bool
          tags: ['gke', 'phase5']

        - name: Phase 5 - GKE Runtime Policy
          ansible.builtin.include_role:
            name: gcp_gke_runtime_policy
          when: deploy_gke | bool
          tags: ['gke', 'phase5']

        - name: Phase 5 - GKE Secure Supply Chain
          ansible.builtin.include_role:
            name: gcp_gke_secure_supplychain
          when: deploy_gke | bool
          tags: ['gke', 'phase5']

        # =========================================
        # Phase 6: Logging & Monitoring
        # =========================================
        - name: Phase 6 - Logging Routing
          ansible.builtin.include_role:
            name: gcp_logging_routing_tiers
          when: deploy_logging | bool
          tags: ['logging', 'phase6']

        - name: Phase 6 - Monitoring SRE Baseline
          ansible.builtin.include_role:
            name: gcp_monitoring_sre_baseline
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase6']

        - name: Phase 6 - Audit Governance
          ansible.builtin.include_role:
            name: gcp_audit_governance_pack
          when: deploy_logging | bool
          tags: ['logging', 'audit', 'phase6']

        # =========================================
        # Phase 7: Data Services
        # =========================================
        - name: Phase 7 - Storage Governance
          ansible.builtin.include_role:
            name: gcp_storage_governance
          when: deploy_storage | bool
          tags: ['storage', 'phase7']

        - name: Phase 7 - BigQuery Governance
          ansible.builtin.include_role:
            name: gcp_bigquery_governance
          when: deploy_storage | bool
          tags: ['bigquery', 'phase7']

        - name: Phase 7 - Cloud SQL Baseline
          ansible.builtin.include_role:
            name: gcp_sql_baseline
          when: deploy_databases | bool
          tags: ['database', 'phase7']

        - name: Phase 7 - Pub/Sub Guardrails
          ansible.builtin.include_role:
            name: gcp_pubsub_guardrails
          when: deploy_storage | bool
          tags: ['pubsub', 'phase7']

        # =========================================
        # Phase 8: Serverless
        # =========================================
        - name: Phase 8 - Cloud Run Locked Down
          ansible.builtin.include_role:
            name: gcp_cloudrun_locked_down
          tags: ['serverless', 'phase8']

        # =========================================
        # Phase 9: Compliance
        # =========================================
        - name: Phase 9 - NIST 800-53 Controls
          ansible.builtin.include_role:
            name: gcp_nist80053_controls_map
          when: deploy_compliance | bool
          tags: ['compliance', 'nist', 'phase9']

        - name: Phase 9 - Quota Safeguards
          ansible.builtin.include_role:
            name: gcp_quota_safeguards
          when: deploy_compliance | bool
          tags: ['compliance', 'phase9']

        # =========================================
        # Phase 10: FinOps
        # =========================================
        - name: Phase 10 - FinOps Budgets
          ansible.builtin.include_role:
            name: gcp_finops_budgets
          when: deploy_finops | bool
          tags: ['finops', 'phase10']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== GCP Enterprise Deployment Complete ==="
              - "Project: {{ gcp_project }}"
              - "Organization: {{ gcp_organization_id }}"
              - "Region: {{ gcp_region }}"
              - "Landing Zone: {{ 'Configured' if deploy_landing_zone else 'Skipped' }}"
              - "IAM: {{ 'Configured' if deploy_iam else 'Skipped' }}"
              - "Network: {{ 'Configured' if deploy_network else 'Skipped' }}"
              - "Security: {{ 'Configured' if deploy_security else 'Skipped' }}"
              - "GKE: {{ 'Configured' if deploy_gke else 'Skipped' }}"
              - "Compliance: {{ 'Configured' if deploy_compliance else 'Skipped' }}"
          tags: ['always']

        - name: "google_cloud_platform/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "google_cloud_platform/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_status: "failed"
            fe_google_cloud_platform_site_postflight_passed: false
            fe_google_cloud_platform_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/site: FAILED at '{{ fe_google_cloud_platform_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_site_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/site failed at '{{ fe_google_cloud_platform_site_failed_task }}': {{ fe_google_cloud_platform_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/site":
                  component: "google_cloud_platform/site"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_site_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_site_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_site_status | default('') == 'succeeded' else ['google_cloud_platform/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_google_cloud_platform_site_status | default('') == 'failed'
            - not (fe_google_cloud_platform_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_stats_published: true
          when:
            - fe_google_cloud_platform_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "google_cloud_platform/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "google_cloud_platform/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_google_cloud_platform_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_site_status: "running"
            fe_google_cloud_platform_site_preflight_passed: false
            fe_google_cloud_platform_site_postflight_passed: false
            fe_google_cloud_platform_site_failed_task: ""
            fe_google_cloud_platform_site_error: ""
            fe_google_cloud_platform_site_stats_published: false
          tags:
            - always

        - name: "google_cloud_platform/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              google_cloud_platform/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              google_cloud_platform/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "google_cloud_platform/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "google_cloud_platform/site: required variable '{{ item }}' is not defined."
            success_msg: "google_cloud_platform/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_google_cloud_platform_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "google_cloud_platform/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "google_cloud_platform/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_status: "preflight_failed"
            fe_google_cloud_platform_site_postflight_passed: false
            fe_google_cloud_platform_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/site: FAILED at '{{ fe_google_cloud_platform_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_site_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/site":
                  component: "google_cloud_platform/site"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_site_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_site_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_site_status | default('') == 'succeeded' else ['google_cloud_platform/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_stats_published: true
          tags:
            - always

        - name: "google_cloud_platform/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/site failed at '{{ fe_google_cloud_platform_site_failed_task }}': {{ fe_google_cloud_platform_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/site: preflight
              {{ 'passed' if fe_google_cloud_platform_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "google_cloud_platform/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "google_cloud_platform/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_google_cloud_platform_site_preflight_passed | bool
              - fe_google_cloud_platform_site_status in ['running', 'succeeded']
            fail_msg: >-
              google_cloud_platform/site: postflight validation failed - preflight passed
              ={{ fe_google_cloud_platform_site_preflight_passed | default(false) }},
              status={{ fe_google_cloud_platform_site_status | default('unknown') }}.
            success_msg: "google_cloud_platform/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "google_cloud_platform/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_postflight_passed: true
            fe_google_cloud_platform_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "google_cloud_platform/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_status: "failed"
            fe_google_cloud_platform_site_postflight_passed: false
            fe_google_cloud_platform_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/site: FAILED at '{{ fe_google_cloud_platform_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_site_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/site failed at '{{ fe_google_cloud_platform_site_failed_task }}': {{ fe_google_cloud_platform_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/site":
                  component: "google_cloud_platform/site"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_site_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_site_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_site_status | default('') == 'succeeded' else ['google_cloud_platform/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_google_cloud_platform_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_site_stats_published: true
          tags:
            - always

        - name: "google_cloud_platform/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/site: {{ fe_google_cloud_platform_site_status | default('unknown') }} in
              {{ fe_google_cloud_platform_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
