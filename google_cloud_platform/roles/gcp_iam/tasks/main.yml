---
# tasks file for gcp_iam
# Fourth Estate GCP IAM Management
# Manages service accounts, IAM policies, custom roles, and Workload Identity

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_iam']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_iam_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_iam | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_iam_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_iam_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_iam_status: "running"
    fe_google_cloud_platform_gcp_iam_preflight_passed: false
    fe_google_cloud_platform_gcp_iam_postflight_passed: false
    fe_google_cloud_platform_gcp_iam_failed_task: ""
    fe_google_cloud_platform_gcp_iam_error: ""
    fe_google_cloud_platform_gcp_iam_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_iam | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_iam | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_iam: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_iam: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_iam | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_iam: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_iam: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_iam_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_iam | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_iam_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - gcp_project_id is defined
          - gcp_iam_service_accounts is defined or gcp_iam_custom_roles is defined or gcp_iam_policy_bindings is defined
        fail_msg: "Required variables missing: gcp_project_id and at least one IAM configuration"
        quiet: true

    - name: Create service accounts
      google.cloud.gcp_iam_service_account:
        name: "{{ item.name }}"
        display_name: "{{ item.display_name | default(item.name) }}"
        description: "{{ item.description | default(omit) }}"
        project: "{{ gcp_project_id }}"
        state: present
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      loop: "{{ gcp_iam_service_accounts }}"
      register: gcp_service_accounts_created
      when: gcp_iam_service_accounts | length > 0

    - name: Create service account keys
      ansible.builtin.command:
        cmd: >
          gcloud iam service-accounts keys create
          {{ gcp_iam_keys_output_dir }}/{{ item.name }}-key.json
          --iam-account={{ item.name }}@{{ gcp_project_id }}.iam.gserviceaccount.com
          --project={{ gcp_project_id }}
      loop: "{{ gcp_iam_service_accounts }}"
      when:
        - gcp_iam_service_accounts | length > 0
        - item.create_key | default(false)
        - gcp_iam_keys_output_dir is defined
      register: sa_key_creation
      changed_when: "'created key' in sa_key_creation.stdout"
      failed_when:
        - sa_key_creation.rc != 0
        - "'already exists' not in sa_key_creation.stderr"

    - name: Set service account key permissions
      ansible.builtin.file:
        path: "{{ gcp_iam_keys_output_dir }}/{{ item.name }}-key.json"
        mode: '0600'
      loop: "{{ gcp_iam_service_accounts }}"
      when:
        - gcp_iam_service_accounts | length > 0
        - item.create_key | default(false)
        - gcp_iam_keys_output_dir is defined

    - name: Create custom IAM roles
      ansible.builtin.command:
        cmd: >
          gcloud iam roles create {{ item.role_id }}
          --project={{ gcp_project_id }}
          --title="{{ item.title }}"
          --description="{{ item.description }}"
          --permissions={{ item.permissions | join(',') }}
          --stage={{ item.stage | default('GA') }}
      loop: "{{ gcp_iam_custom_roles }}"
      when: gcp_iam_custom_roles | length > 0
      register: custom_role_creation
      changed_when: "'Created role' in custom_role_creation.stdout"
      failed_when:
        - custom_role_creation.rc != 0
        - "'already exists' not in custom_role_creation.stderr"

    - name: Update existing custom IAM roles
      ansible.builtin.command:
        cmd: >
          gcloud iam roles update {{ item.role_id }}
          --project={{ gcp_project_id }}
          --permissions={{ item.permissions | join(',') }}
      loop: "{{ gcp_iam_custom_roles }}"
      when:
        - gcp_iam_custom_roles | length > 0
        - item.update_if_exists | default(true)
      register: custom_role_update
      changed_when: "'Updated role' in custom_role_update.stdout"
      failed_when:
        - custom_role_update.rc != 0
        - "'does not exist' not in custom_role_update.stderr"

    - name: Apply IAM policy bindings at project level
      google.cloud.gcp_resourcemanager_project_iam_member:
        project: "{{ gcp_project_id }}"
        role: "{{ item.role }}"
        member: "{{ item.member }}"
        state: present
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      loop: "{{ gcp_iam_policy_bindings }}"
      when: gcp_iam_policy_bindings | length > 0

    - name: Apply conditional IAM policy bindings
      ansible.builtin.include_tasks: conditional_bindings.yml
      when:
        - gcp_iam_conditional_bindings is defined
        - gcp_iam_conditional_bindings | length > 0

    - name: Configure Workload Identity for GKE
      ansible.builtin.include_tasks: workload_identity.yml
      when:
        - gcp_iam_enable_workload_identity | bool
        - gcp_iam_workload_identity_bindings is defined

    - name: Grant service account impersonation permissions
      ansible.builtin.command:
        cmd: >
          gcloud iam service-accounts add-iam-policy-binding
          {{ item.service_account }}@{{ gcp_project_id }}.iam.gserviceaccount.com
          --member={{ item.member }}
          --role=roles/iam.serviceAccountTokenCreator
          --project={{ gcp_project_id }}
      loop: "{{ gcp_iam_impersonation_bindings }}"
      when: gcp_iam_impersonation_bindings | length > 0
      register: impersonation_binding
      changed_when: "'Updated IAM policy' in impersonation_binding.stdout"

    - name: Configure organization-level IAM policies
      ansible.builtin.include_tasks: organization_policies.yml
      when:
        - gcp_organization_id is defined
        - gcp_iam_org_policy_bindings is defined
        - gcp_iam_org_policy_bindings | length > 0

    - name: Configure folder-level IAM policies
      ansible.builtin.include_tasks: folder_policies.yml
      when:
        - gcp_iam_folder_policy_bindings is defined
        - gcp_iam_folder_policy_bindings | length > 0

    - name: Enable service account key rotation policy
      ansible.builtin.template:
        src: key_rotation_policy.json.j2
        dest: "{{ gcp_iam_artifacts_dir }}/key_rotation_policy.json"
        mode: '0644'
      when:
        - gcp_iam_enable_key_rotation | bool
        - gcp_iam_artifacts_dir is defined

    - name: Audit IAM policy inheritance
      ansible.builtin.command:
        cmd: >
          gcloud projects get-iam-policy {{ gcp_project_id }}
          --flatten="bindings[].members"
          --format="table(bindings.role,bindings.members)"
      register: iam_audit
      changed_when: false
      when: gcp_iam_enable_audit | bool

    - name: Save IAM audit report
      ansible.builtin.copy:
        content: "{{ iam_audit.stdout }}"
        dest: "{{ gcp_iam_artifacts_dir }}/iam_audit_{{ ansible_date_time.date }}.txt"
        mode: '0644'
      when:
        - gcp_iam_enable_audit | bool
        - gcp_iam_artifacts_dir is defined
        - iam_audit.stdout is defined

    - name: Configure IAM audit logging
      ansible.builtin.template:
        src: audit_config.json.j2
        dest: "{{ gcp_iam_artifacts_dir }}/audit_config.json"
        mode: '0644'
      when: gcp_iam_artifacts_dir is defined

    - name: Apply audit logging configuration
      ansible.builtin.command:
        cmd: >
          gcloud projects set-iam-policy {{ gcp_project_id }}
          {{ gcp_iam_artifacts_dir }}/audit_config.json
      when:
        - gcp_iam_enable_audit_logging | bool
        - gcp_iam_artifacts_dir is defined
      register: audit_config_apply
      changed_when: "'Updated IAM policy' in audit_config_apply.stdout"

    - name: Create Fourth Estate compliance IAM policies
      ansible.builtin.template:
        src: fourth_estate_iam_policies.json.j2
        dest: "{{ gcp_iam_artifacts_dir }}/fourth_estate_policies.json"
        mode: '0644'
      when: gcp_iam_artifacts_dir is defined

    - name: Display IAM configuration summary
      ansible.builtin.debug:
        msg:
          - "GCP IAM configuration completed"
          - "Service Accounts Created: {{ gcp_service_accounts_created.results | length if gcp_service_accounts_created.results is defined else 0 }}"
          - "Custom Roles Created: {{ gcp_iam_custom_roles | length }}"
          - "Policy Bindings Applied: {{ gcp_iam_policy_bindings | length }}"
          - "Workload Identity: {{ gcp_iam_enable_workload_identity }}"
          - "Audit Logging: {{ gcp_iam_enable_audit_logging }}"

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_iam | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_iam_preflight_passed | bool
          - fe_google_cloud_platform_gcp_iam_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_iam: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_iam_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_iam_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_iam: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_iam | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_iam_postflight_passed: true
        fe_google_cloud_platform_gcp_iam_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_iam | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_iam_status: "failed"
        fe_google_cloud_platform_gcp_iam_postflight_passed: false
        fe_google_cloud_platform_gcp_iam_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_iam_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_iam | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_iam: FAILED at '{{ fe_google_cloud_platform_gcp_iam_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_iam_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_iam | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_iam failed at '{{ fe_google_cloud_platform_gcp_iam_failed_task }}': {{ fe_google_cloud_platform_gcp_iam_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_iam | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_iam_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_iam_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_iam_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_iam | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_iam":
              component: "google_cloud_platform/gcp_iam"
              type: "role"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_iam_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_iam_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_iam_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_iam_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_iam_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_iam_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_iam_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_iam_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_iam_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_iam_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_iam_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_iam_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_iam'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_iam | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_iam_stats_published: true
      tags:
        - always
