---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: gcp_landing_zone_dod | orchestrate
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Guarded execution with rescue and always handling"
      block:

        - import_tasks: gcp_org_policies__enforce_dod.yml
        - import_tasks: gcp_locations__restrict_regions.yml
        - import_tasks: gcp_projects__create_and_label.yml
        - import_tasks: gcp_apis__allowlist_enable.yml
        - import_tasks: gcp_logging__sinks_and_retention.yml

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status: "failed"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed: false
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: FAILED at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main failed at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}': {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/gcp_landing_zone_dod/tasks/main":
                  component: "google_cloud_platform/gcp_landing_zone_dod/tasks/main"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_landing_zone_dod/tasks/main'] }}
            aggregate: true
            per_host: false
          when:
            - fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'failed'
            - not (fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published | default(false) | bool)
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published: true
          when:
            - fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Initialize validation state"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status: "running"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed: false
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed: false
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task: ""
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error: ""
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published: false
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "google_cloud_platform/gcp_landing_zone_dod/tasks/main: required variable '{{ item }}' is not defined."
            success_msg: "google_cloud_platform/gcp_landing_zone_dod/tasks/main: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status: "preflight_failed"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed: false
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: FAILED at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/gcp_landing_zone_dod/tasks/main":
                  component: "google_cloud_platform/gcp_landing_zone_dod/tasks/main"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_landing_zone_dod/tasks/main'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published: true
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main failed at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}': {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: preflight
              {{ 'passed' if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | bool
              - fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status in ['running', 'succeeded']
            fail_msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: postflight validation failed - preflight passed
              ={{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | default(false) }},
              status={{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('unknown') }}.
            success_msg: "google_cloud_platform/gcp_landing_zone_dod/tasks/main: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed: true
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status: "failed"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed: false
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: FAILED at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          tags:
            - always
            - rescue

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main failed at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task }}': {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "google_cloud_platform/gcp_landing_zone_dod/tasks/main":
                  component: "google_cloud_platform/gcp_landing_zone_dod/tasks/main"
                  type: "playbook"
                  platform: "google_cloud_platform"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('unknown') }}"
                  preflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_started_at | default('') }}"
                  ended_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_ended_at | default('') }}"
                  duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_failed_task | default('') }}"
                  error: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_landing_zone_dod/tasks/main'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published | default(false) | bool)
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_stats_published: true
          tags:
            - always

        - name: "google_cloud_platform/gcp_landing_zone_dod/tasks/main | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              google_cloud_platform/gcp_landing_zone_dod/tasks/main: {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_status | default('unknown') }} in
              {{ fe_google_cloud_platform_gcp_landing_zone_dod_tasks_main_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
