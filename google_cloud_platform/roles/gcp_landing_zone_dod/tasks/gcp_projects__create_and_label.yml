---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status: "running"
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_preflight_passed: false
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_postflight_passed: false
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_failed_task: ""
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_error: ""
    fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/gcp-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Plan projects create/label/budget
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/projects_plan.json"
        mode: "0644"
        content: "{{ {'projects': projects | default([]), 'labels_common': labels_common | default({}), 'billing': billing_account} | to_nice_json }}"

    - name: Apply create/link/label
      when: apply_changes | bool
      ansible.builtin.shell: |
        set -euo pipefail
        jq -c '.projects[]?' "{{ artifacts_dir }}/projects_plan.json" | while read -r p; do
          id=$(jq -r '.project_id' <<<"$p"); name=$(jq -r '.name' <<<"$p")
          fold="{{ folder_id }}"; bill="{{ billing_account }}"
          {{ gcloud_bin }} projects create "$id" --name="$name" ${fold:+--folder=$fold} || true
          {{ gcloud_bin }} beta billing projects link "$id" --billing-account "$bill"
          labels=$(jq -r '.labels // {}' <<<"$p")
          all=$(jq -n --argjson a "{{ labels_common | default({}) | to_json | replace('"','\"') }}" --argjson b "$labels" '$a + $b')
          {{ gcloud_bin }} alpha projects update "$id" --update-labels "$(jq -r 'to_entries|map("\(.key)=\(.value)")|join(",")' <<<"$all")"
        done
      args: { executable: /bin/bash }

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_preflight_passed | bool
          - fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_postflight_passed: true
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status: "failed"
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_postflight_passed: false
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label: FAILED at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label failed at '{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_failed_task }}': {{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label":
              component: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label"
              type: "role-tasks"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_landing_zone_dod/gcp_projects__create_and_label | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_landing_zone_dod_gcp_projects__create_and_label_stats_published: true
      tags:
        - always
