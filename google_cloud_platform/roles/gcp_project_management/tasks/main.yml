---
# tasks file for gcp_project_management
# Fourth Estate GCP Project Management
# Manages GCP projects with enterprise governance and Fourth Estate security controls

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_project_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_project_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_project_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_project_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_project_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_project_management_status: "running"
    fe_google_cloud_platform_gcp_project_management_preflight_passed: false
    fe_google_cloud_platform_gcp_project_management_postflight_passed: false
    fe_google_cloud_platform_gcp_project_management_failed_task: ""
    fe_google_cloud_platform_gcp_project_management_error: ""
    fe_google_cloud_platform_gcp_project_management_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_project_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_project_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_project_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_project_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_project_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_project_management: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_project_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_project_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_project_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - gcp_project_id is defined
          - gcp_project_name is defined
          - gcp_organization_id is defined or gcp_folder_id is defined
        fail_msg: "Required variables missing: gcp_project_id, gcp_project_name, and either gcp_organization_id or gcp_folder_id"
        quiet: true

    - name: Create GCP project
      google.cloud.gcp_resourcemanager_project:
        name: "{{ gcp_project_name }}"
        project_id: "{{ gcp_project_id }}"
        parent:
          type: "{{ 'organization' if gcp_organization_id is defined else 'folder' }}"
          id: "{{ gcp_organization_id | default(gcp_folder_id) }}"
        labels: "{{ gcp_project_labels }}"
        state: present
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      register: gcp_project

    - name: Link billing account to project
      google.cloud.gcp_billing_project_info:
        project_id: "{{ gcp_project_id }}"
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      register: billing_info
      when: gcp_billing_account_id is defined

    - name: Associate billing account
      ansible.builtin.command:
        cmd: >
          gcloud beta billing projects link {{ gcp_project_id }}
          --billing-account={{ gcp_billing_account_id }}
      when:
        - gcp_billing_account_id is defined
        - billing_info.resources[0].billingAccountName | default('') != gcp_billing_account_id
      changed_when: true

    - name: Enable required APIs
      google.cloud.gcp_serviceusage_service:
        name: "{{ item }}"
        project: "{{ gcp_project_id }}"
        state: present
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      loop: "{{ gcp_required_apis }}"
      register: api_enable
      retries: 3
      delay: 10
      until: api_enable is succeeded

    - name: Configure organization policies for Fourth Estate compliance
      ansible.builtin.include_tasks: org_policies.yml
      when: gcp_enforce_org_policies | bool

    - name: Set project IAM policy
      google.cloud.gcp_resourcemanager_project_iam_policy:
        project: "{{ gcp_project_id }}"
        bindings: "{{ gcp_project_iam_bindings }}"
        auth_kind: "{{ gcp_auth_kind }}"
        service_account_file: "{{ gcp_service_account_file | default(omit) }}"
      when: gcp_project_iam_bindings | length > 0

    - name: Configure essential contacts for security notifications
      ansible.builtin.command:
        cmd: >
          gcloud essential-contacts create
          --email={{ item.email }}
          --notification-categories={{ item.categories | join(',') }}
          --project={{ gcp_project_id }}
      loop: "{{ gcp_essential_contacts }}"
      register: essential_contacts_result
      changed_when: "'Created' in essential_contacts_result.stdout"
      failed_when:
        - essential_contacts_result.rc != 0
        - "'already exists' not in essential_contacts_result.stderr"
      when: gcp_essential_contacts | length > 0

    - name: Enable deletion protection
      ansible.builtin.command:
        cmd: >
          gcloud resource-manager liens create
          --restrictions=resourcemanager.projects.delete
          --reason="Fourth Estate production project protection"
          --project={{ gcp_project_id }}
      register: lien_result
      changed_when: "'Created' in lien_result.stdout"
      failed_when:
        - lien_result.rc != 0
        - "'already exists' not in lien_result.stderr"
      when: gcp_enable_deletion_protection | bool

    - name: Apply project labels for governance
      ansible.builtin.command:
        cmd: >
          gcloud projects update {{ gcp_project_id }}
          --update-labels={{ item.key }}={{ item.value }}
      loop: "{{ gcp_project_labels | dict2items }}"
      changed_when: true
      when: gcp_project_labels | length > 0

    - name: Configure budget alerts
      ansible.builtin.include_tasks: budget_alerts.yml
      when:
        - gcp_enable_budget_alerts | bool
        - gcp_billing_account_id is defined

    - name: Create project metadata for Fourth Estate tracking
      ansible.builtin.template:
        src: project_metadata.json.j2
        dest: "{{ gcp_artifacts_dir }}/{{ gcp_project_id }}_metadata.json"
        mode: '0644'
      when: gcp_artifacts_dir is defined

    - name: Enable Assured Workloads compliance
      ansible.builtin.include_tasks: assured_workloads.yml
      when: gcp_enable_assured_workloads | bool

    - name: Configure VPC Service Controls perimeter
      ansible.builtin.include_tasks: vpc_service_controls.yml
      when: gcp_enable_vpc_service_controls | bool

    - name: Display project information
      ansible.builtin.debug:
        msg:
          - "GCP Project created successfully"
          - "Project ID: {{ gcp_project_id }}"
          - "Project Name: {{ gcp_project_name }}"
          - "Project Number: {{ gcp_project.projectNumber | default('N/A') }}"
          - "Parent: {{ gcp_organization_id | default(gcp_folder_id) }}"
          - "Deletion Protection: {{ gcp_enable_deletion_protection }}"
          - "Assured Workloads: {{ gcp_enable_assured_workloads }}"

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_project_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_project_management_preflight_passed | bool
          - fe_google_cloud_platform_gcp_project_management_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_project_management: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_project_management_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_project_management_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_project_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_project_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_postflight_passed: true
        fe_google_cloud_platform_gcp_project_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_project_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_status: "failed"
        fe_google_cloud_platform_gcp_project_management_postflight_passed: false
        fe_google_cloud_platform_gcp_project_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_project_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_project_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_project_management: FAILED at '{{ fe_google_cloud_platform_gcp_project_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_project_management_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_project_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_project_management failed at '{{ fe_google_cloud_platform_gcp_project_management_failed_task }}': {{ fe_google_cloud_platform_gcp_project_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_project_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_project_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_project_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_project_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_project_management":
              component: "google_cloud_platform/gcp_project_management"
              type: "role"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_project_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_project_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_project_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_project_management_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_project_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_project_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_project_management_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_project_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_project_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_project_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_project_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_project_management_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_project_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_project_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_stats_published: true
      tags:
        - always
