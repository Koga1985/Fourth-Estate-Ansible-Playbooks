---
# VPC Service Controls for data exfiltration prevention

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_project_management/vpc_service_controls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_project_management_vpc_service_controls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status: "running"
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_preflight_passed: false
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_postflight_passed: false
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_failed_task: ""
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_error: ""
    fe_google_cloud_platform_gcp_project_management_vpc_service_controls_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_project_management/vpc_service_controls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_project_management/vpc_service_controls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_project_management/vpc_service_controls: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_project_management/vpc_service_controls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create VPC Service Controls access policy (if not exists)
      ansible.builtin.command:
        cmd: >
          gcloud access-context-manager policies create
          --organization={{ gcp_organization_id }}
          --title="{{ gcp_project_id }}-access-policy"
      register: policy_result
      changed_when: "'Created access policy' in policy_result.stdout"
      failed_when:
        - policy_result.rc != 0
        - "'already exists' not in policy_result.stderr"
      when: gcp_organization_id is defined

    - name: Create access level for Fourth Estate personnel
      ansible.builtin.command:
        cmd: >
          gcloud access-context-manager levels create {{ gcp_access_level_name }}
          --policy={{ gcp_access_policy_name }}
          --basic-level-spec=/tmp/access_level.yaml
      args:
        stdin: |
          ---
          conditions:
            - ipSubnetworks: {{ gcp_allowed_ip_ranges | to_json }}
            - members: {{ gcp_allowed_members | to_json }}
            - regions: {{ gcp_allowed_regions | to_json }}
          combiningFunction: AND
      register: level_result
      changed_when: "'Created access level' in level_result.stdout"
      failed_when:
        - level_result.rc != 0
        - "'already exists' not in level_result.stderr"

    - name: Create VPC Service Controls perimeter
      ansible.builtin.command:
        cmd: >
          gcloud access-context-manager perimeters create {{ gcp_perimeter_name }}
          --policy={{ gcp_access_policy_name }}
          --resources=projects/{{ gcp_project_number }}
          --restricted-services={{ gcp_restricted_services | join(',') }}
          --access-levels={{ gcp_access_level_name }}
          --vpc-allowed-services={{ gcp_vpc_allowed_services | join(',') }}
      register: perimeter_result
      changed_when: "'Created perimeter' in perimeter_result.stdout"
      failed_when:
        - perimeter_result.rc != 0
        - "'already exists' not in perimeter_result.stderr"

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_project_management_vpc_service_controls_preflight_passed | bool
          - fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_project_management/vpc_service_controls: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_project_management/vpc_service_controls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_postflight_passed: true
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status: "failed"
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_postflight_passed: false
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_project_management/vpc_service_controls: FAILED at '{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_project_management/vpc_service_controls failed at '{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_failed_task }}': {{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_project_management_vpc_service_controls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_project_management/vpc_service_controls":
              component: "google_cloud_platform/gcp_project_management/vpc_service_controls"
              type: "role-tasks"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_project_management_vpc_service_controls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_project_management_vpc_service_controls_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_project_management/vpc_service_controls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_project_management/vpc_service_controls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_project_management_vpc_service_controls_stats_published: true
      tags:
        - always
