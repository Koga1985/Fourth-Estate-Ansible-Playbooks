---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the gcp_nist80053_controls_map role
      ansible.builtin.include_role:
        name: gcp_nist80053_controls_map

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_nist80053_controls_map_preflight_passed | bool
          - fe_google_cloud_platform_gcp_nist80053_controls_map_postflight_passed | bool
          - fe_google_cloud_platform_gcp_nist80053_controls_map_status == 'succeeded'
        fail_msg: >-
          gcp_nist80053_controls_map did not complete cleanly:
          status={{ fe_google_cloud_platform_gcp_nist80053_controls_map_status | default('unset') }}
          failed_task={{ fe_google_cloud_platform_gcp_nist80053_controls_map_failed_task | default('') }}
        success_msg: "gcp_nist80053_controls_map completed and the validation harness reported success."
