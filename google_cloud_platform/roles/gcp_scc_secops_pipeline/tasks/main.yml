---
# tasks file for gcp_scc_secops_pipeline
# Entrypoint for the gcp_scc_secops_pipeline role.
# NOTE: this was previously written as a standalone play, which made the
# role unusable via include_role (site.yml calls it as a role). It is now a
# plain task list so the role works as its callers expect.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_scc_secops_pipeline']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_scc_secops_pipeline_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_scc_secops_pipeline | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_scc_secops_pipeline_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_scc_secops_pipeline_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_scc_secops_pipeline_status: "running"
    fe_google_cloud_platform_gcp_scc_secops_pipeline_preflight_passed: false
    fe_google_cloud_platform_gcp_scc_secops_pipeline_postflight_passed: false
    fe_google_cloud_platform_gcp_scc_secops_pipeline_failed_task: ""
    fe_google_cloud_platform_gcp_scc_secops_pipeline_error: ""
    fe_google_cloud_platform_gcp_scc_secops_pipeline_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_scc_secops_pipeline | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_scc_secops_pipeline: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_scc_secops_pipeline: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_scc_secops_pipeline: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_scc_secops_pipeline: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_scc_secops_pipeline_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "gcp_scc_secops_pipeline | Import gcp_scc__enable_sources"
      ansible.builtin.import_tasks: gcp_scc__enable_sources.yml

    - name: "gcp_scc_secops_pipeline | Import gcp_scc__findings_policies"
      ansible.builtin.import_tasks: gcp_scc__findings_policies.yml

    - name: "gcp_scc_secops_pipeline | Import gcp_monitoring__baseline"
      ansible.builtin.import_tasks: gcp_monitoring__baseline.yml

    - name: "gcp_scc_secops_pipeline | Import gcp_audit__export_bundle"
      ansible.builtin.import_tasks: gcp_audit__export_bundle.yml

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_scc_secops_pipeline_preflight_passed | bool
          - fe_google_cloud_platform_gcp_scc_secops_pipeline_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_scc_secops_pipeline: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_scc_secops_pipeline_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_scc_secops_pipeline_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_scc_secops_pipeline: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_scc_secops_pipeline_postflight_passed: true
        fe_google_cloud_platform_gcp_scc_secops_pipeline_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_scc_secops_pipeline_status: "failed"
        fe_google_cloud_platform_gcp_scc_secops_pipeline_postflight_passed: false
        fe_google_cloud_platform_gcp_scc_secops_pipeline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_scc_secops_pipeline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_scc_secops_pipeline: FAILED at '{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_scc_secops_pipeline_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_scc_secops_pipeline failed at '{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_failed_task }}': {{ fe_google_cloud_platform_gcp_scc_secops_pipeline_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_scc_secops_pipeline_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_scc_secops_pipeline_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_scc_secops_pipeline_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_scc_secops_pipeline":
              component: "google_cloud_platform/gcp_scc_secops_pipeline"
              type: "role"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_scc_secops_pipeline_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_scc_secops_pipeline_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_scc_secops_pipeline_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_scc_secops_pipeline_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_scc_secops_pipeline'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_scc_secops_pipeline | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_scc_secops_pipeline_stats_published: true
      tags:
        - always
