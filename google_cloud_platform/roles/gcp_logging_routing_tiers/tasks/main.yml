---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['google_cloud_platform/gcp_logging_routing_tiers']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_google_cloud_platform_gcp_logging_routing_tiers_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "google_cloud_platform/gcp_logging_routing_tiers | Initialize validation state"
  ansible.builtin.set_fact:
    fe_google_cloud_platform_gcp_logging_routing_tiers_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_google_cloud_platform_gcp_logging_routing_tiers_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_google_cloud_platform_gcp_logging_routing_tiers_status: "running"
    fe_google_cloud_platform_gcp_logging_routing_tiers_preflight_passed: false
    fe_google_cloud_platform_gcp_logging_routing_tiers_postflight_passed: false
    fe_google_cloud_platform_gcp_logging_routing_tiers_failed_task: ""
    fe_google_cloud_platform_gcp_logging_routing_tiers_error: ""
    fe_google_cloud_platform_gcp_logging_routing_tiers_stats_published: false
  tags:
    - always

- name: "google_cloud_platform/gcp_logging_routing_tiers | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          google_cloud_platform/gcp_logging_routing_tiers: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          google_cloud_platform/gcp_logging_routing_tiers: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "google_cloud_platform/gcp_logging_routing_tiers: required variable '{{ item }}' is not defined."
        success_msg: "google_cloud_platform/gcp_logging_routing_tiers: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_logging_routing_tiers_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/gcp-artifacts') }}"
        state: directory
        mode: "0755"


    - name: Plan logging routing tiers
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/logging_routing_tiers_plan.json"
        mode: "0644"
        content: "{{ { 'sinks': sinks | default([]), 'retention': retention | default({}) } | to_nice_json }}"


    - name: Apply sinks/retention (scaffold)
      when: apply_changes | bool
      ansible.builtin.shell: |
        echo 'Create aggregated sinks and set retention per tier'
      args: { executable: /bin/bash }

    # ----------------------------- postflight -------------------

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_google_cloud_platform_gcp_logging_routing_tiers_preflight_passed | bool
          - fe_google_cloud_platform_gcp_logging_routing_tiers_status in ['running', 'succeeded']
        fail_msg: >-
          google_cloud_platform/gcp_logging_routing_tiers: postflight validation failed - preflight passed
          ={{ fe_google_cloud_platform_gcp_logging_routing_tiers_preflight_passed | default(false) }},
          status={{ fe_google_cloud_platform_gcp_logging_routing_tiers_status | default('unknown') }}.
        success_msg: "google_cloud_platform/gcp_logging_routing_tiers: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_logging_routing_tiers_postflight_passed: true
        fe_google_cloud_platform_gcp_logging_routing_tiers_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_logging_routing_tiers_status: "failed"
        fe_google_cloud_platform_gcp_logging_routing_tiers_postflight_passed: false
        fe_google_cloud_platform_gcp_logging_routing_tiers_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_google_cloud_platform_gcp_logging_routing_tiers_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          google_cloud_platform/gcp_logging_routing_tiers: FAILED at '{{ fe_google_cloud_platform_gcp_logging_routing_tiers_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_google_cloud_platform_gcp_logging_routing_tiers_error }}
      tags:
        - always
        - rescue

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          google_cloud_platform/gcp_logging_routing_tiers failed at '{{ fe_google_cloud_platform_gcp_logging_routing_tiers_failed_task }}': {{ fe_google_cloud_platform_gcp_logging_routing_tiers_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_logging_routing_tiers_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_google_cloud_platform_gcp_logging_routing_tiers_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_google_cloud_platform_gcp_logging_routing_tiers_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "google_cloud_platform/gcp_logging_routing_tiers":
              component: "google_cloud_platform/gcp_logging_routing_tiers"
              type: "role"
              platform: "google_cloud_platform"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_status | default('unknown') }}"
              preflight_passed: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_started_at | default('') }}"
              ended_at: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_ended_at | default('') }}"
              duration_seconds: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_failed_task | default('') }}"
              error: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_google_cloud_platform_gcp_logging_routing_tiers_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_google_cloud_platform_gcp_logging_routing_tiers_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_google_cloud_platform_gcp_logging_routing_tiers_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_google_cloud_platform_gcp_logging_routing_tiers_status | default('') == 'succeeded' else ['google_cloud_platform/gcp_logging_routing_tiers'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "google_cloud_platform/gcp_logging_routing_tiers | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_google_cloud_platform_gcp_logging_routing_tiers_stats_published: true
      tags:
        - always
