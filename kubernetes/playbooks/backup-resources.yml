---
# Reusable task: Backup Kubernetes resources

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/backup-resources']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_backup_resources_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/backup-resources | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_backup_resources_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_backup_resources_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_backup_resources_status: "running"
    fe_kubernetes_backup_resources_preflight_passed: false
    fe_kubernetes_backup_resources_postflight_passed: false
    fe_kubernetes_backup_resources_failed_task: ""
    fe_kubernetes_backup_resources_error: ""
    fe_kubernetes_backup_resources_stats_published: false
  tags:
    - always

- name: "kubernetes/backup-resources | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/backup-resources | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/backup-resources: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/backup-resources: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/backup-resources | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/backup-resources: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/backup-resources: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_backup_resources_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/backup-resources | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_backup_resources_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ k8s_backup_dir | default('/var/backups/kubernetes') }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Backup all namespaces
      ansible.builtin.shell: |
        kubectl get namespaces -o yaml > {{ k8s_backup_dir }}/namespaces-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup all deployments
      ansible.builtin.shell: |
        kubectl get deployments --all-namespaces -o yaml > {{ k8s_backup_dir }}/deployments-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup all services
      ansible.builtin.shell: |
        kubectl get services --all-namespaces -o yaml > {{ k8s_backup_dir }}/services-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup all configmaps
      ansible.builtin.shell: |
        kubectl get configmaps --all-namespaces -o yaml > {{ k8s_backup_dir }}/configmaps-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup all secrets (encrypted)
      ansible.builtin.shell: |
        kubectl get secrets --all-namespaces -o yaml > {{ k8s_backup_dir }}/secrets-{{ ansible_date_time.date }}.yaml
        chmod 600 {{ k8s_backup_dir }}/secrets-{{ ansible_date_time.date }}.yaml
      changed_when: true
      no_log: true

    - name: Backup all PVCs
      ansible.builtin.shell: |
        kubectl get pvc --all-namespaces -o yaml > {{ k8s_backup_dir }}/pvcs-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup all network policies
      ansible.builtin.shell: |
        kubectl get networkpolicies --all-namespaces -o yaml > {{ k8s_backup_dir }}/networkpolicies-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Backup RBAC resources
      ansible.builtin.shell: |
        kubectl get roles,rolebindings,clusterroles,clusterrolebindings --all-namespaces -o yaml > \
        {{ k8s_backup_dir }}/rbac-{{ ansible_date_time.date }}.yaml
      changed_when: true

    - name: Create backup archive
      ansible.builtin.archive:
        path: "{{ k8s_backup_dir }}/*-{{ ansible_date_time.date }}.yaml"
        dest: "{{ k8s_backup_dir }}/k8s-backup-{{ ansible_date_time.date }}.tar.gz"
        format: gz
        remove: false

    - name: Remove old backups
      ansible.builtin.find:
        paths: "{{ k8s_backup_dir }}"
        patterns: "k8s-backup-*.tar.gz"
        age: "{{ k8s_backup_retention_days | default(30) }}d"
      register: old_backups

    - name: Delete old backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"

    - name: Display backup summary
      ansible.builtin.debug:
        msg:
          - "Backup completed successfully"
          - "Backup location: {{ k8s_backup_dir }}/k8s-backup-{{ ansible_date_time.date }}.tar.gz"
          - "Retention period: {{ k8s_backup_retention_days | default(30) }} days"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/backup-resources | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_backup_resources_preflight_passed | bool
          - fe_kubernetes_backup_resources_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/backup-resources: postflight validation failed - preflight passed
          ={{ fe_kubernetes_backup_resources_preflight_passed | default(false) }},
          status={{ fe_kubernetes_backup_resources_status | default('unknown') }}.
        success_msg: "kubernetes/backup-resources: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/backup-resources | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_backup_resources_postflight_passed: true
        fe_kubernetes_backup_resources_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/backup-resources | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_backup_resources_status: "failed"
        fe_kubernetes_backup_resources_postflight_passed: false
        fe_kubernetes_backup_resources_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_backup_resources_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/backup-resources | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/backup-resources: FAILED at '{{ fe_kubernetes_backup_resources_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_backup_resources_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/backup-resources | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/backup-resources failed at '{{ fe_kubernetes_backup_resources_failed_task }}': {{ fe_kubernetes_backup_resources_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/backup-resources | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_backup_resources_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_backup_resources_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_backup_resources_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/backup-resources | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/backup-resources":
              component: "kubernetes/backup-resources"
              type: "tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_backup_resources_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_backup_resources_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_backup_resources_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_backup_resources_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_backup_resources_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_backup_resources_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_backup_resources_failed_task | default('') }}"
              error: "{{ fe_kubernetes_backup_resources_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_backup_resources_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_backup_resources_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_backup_resources_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_backup_resources_status | default('') == 'succeeded' else ['kubernetes/backup-resources'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/backup-resources | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_backup_resources_stats_published: true
      tags:
        - always
