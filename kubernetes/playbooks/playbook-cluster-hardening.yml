---
# Kubernetes Cluster Hardening Playbook
# Applies DoD STIG V1R11 and NIST SP 800-190 security controls

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Harden Kubernetes Cluster
  hosts: k8s_control_plane
  become: true
  gather_facts: true

  vars:
    k8s_pod_security_standard: restricted
    k8s_enable_encryption_at_rest: true
    k8s_api_server_audit_log_enabled: true
    k8s_default_network_policy_enabled: true

  pre_tasks:
    - name: "kubernetes/playbook-cluster-hardening | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "kubernetes/playbook-cluster-hardening | Initialize validation state"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_kubernetes_playbook_cluster_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_cluster_hardening_status: "running"
            fe_kubernetes_playbook_cluster_hardening_preflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_failed_task: ""
            fe_kubernetes_playbook_cluster_hardening_error: ""
            fe_kubernetes_playbook_cluster_hardening_stats_published: false
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              kubernetes/playbook-cluster-hardening: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              kubernetes/playbook-cluster-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-cluster-hardening | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "kubernetes/playbook-cluster-hardening: required variable '{{ item }}' is not defined."
            success_msg: "kubernetes/playbook-cluster-hardening: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_kubernetes_playbook_cluster_hardening_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-cluster-hardening | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_status: "preflight_failed"
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_cluster_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: FAILED at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_cluster_hardening_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-cluster-hardening":
                  component: "kubernetes/playbook-cluster-hardening"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_cluster_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_cluster_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_cluster_hardening_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_cluster_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else ['kubernetes/playbook-cluster-hardening'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-cluster-hardening failed at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}': {{ fe_kubernetes_playbook_cluster_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-cluster-hardening | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: preflight
              {{ 'passed' if fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "kubernetes/playbook-cluster-hardening | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display hardening information
          ansible.builtin.debug:
            msg:
              - "Starting Kubernetes cluster hardening"
              - "Target: {{ inventory_hostname }}"
              - "Pod Security Standard: {{ k8s_pod_security_standard }}"

        - name: "kubernetes/playbook-cluster-hardening | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_status: "failed"
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_cluster_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: FAILED at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_cluster_hardening_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-cluster-hardening failed at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}': {{ fe_kubernetes_playbook_cluster_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-cluster-hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_cluster_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_cluster_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-cluster-hardening":
                  component: "kubernetes/playbook-cluster-hardening"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_cluster_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_cluster_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_cluster_hardening_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_cluster_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else ['kubernetes/playbook-cluster-hardening'] }}
            aggregate: true
            per_host: false
          when:
            - fe_kubernetes_playbook_cluster_hardening_status | default('') == 'failed'
            - not (fe_kubernetes_playbook_cluster_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_stats_published: true
          when:
            - fe_kubernetes_playbook_cluster_hardening_status | default('') == 'failed'
          tags:
            - always

  roles:
    - role: kubernetes/roles/k8s-cluster-hardening
      tags: ['hardening', 'security']

  post_tasks:
    - name: Run compliance validation
      ansible.builtin.include_role:
        name: kubernetes/roles/k8s-cluster-hardening
        tasks_from: compliance-validation
      tags: ['validation', 'never']

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "Cluster hardening completed"
          - "Review compliance report at /tmp/k8s-compliance-report.html"
          - "Run validation with: ansible-playbook playbook-cluster-hardening.yml --tags validation"
    - name: "kubernetes/playbook-cluster-hardening | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "kubernetes/playbook-cluster-hardening | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_kubernetes_playbook_cluster_hardening_preflight_passed | bool
              - fe_kubernetes_playbook_cluster_hardening_status in ['running', 'succeeded']
            fail_msg: >-
              kubernetes/playbook-cluster-hardening: postflight validation failed - preflight passed
              ={{ fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) }},
              status={{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }}.
            success_msg: "kubernetes/playbook-cluster-hardening: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "kubernetes/playbook-cluster-hardening | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: true
            fe_kubernetes_playbook_cluster_hardening_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_status: "failed"
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_cluster_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: FAILED at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_cluster_hardening_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-cluster-hardening failed at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}': {{ fe_kubernetes_playbook_cluster_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-cluster-hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_cluster_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_cluster_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-cluster-hardening":
                  component: "kubernetes/playbook-cluster-hardening"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_cluster_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_cluster_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_cluster_hardening_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_cluster_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else ['kubernetes/playbook-cluster-hardening'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_kubernetes_playbook_cluster_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: {{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }} in
              {{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "kubernetes/playbook-cluster-hardening | Guarded execution with rescue and always handling"
      block:

        - name: "kubernetes/playbook-cluster-hardening | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_status: "failed"
            fe_kubernetes_playbook_cluster_hardening_postflight_passed: false
            fe_kubernetes_playbook_cluster_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_cluster_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-cluster-hardening: FAILED at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_cluster_hardening_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-cluster-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-cluster-hardening failed at '{{ fe_kubernetes_playbook_cluster_hardening_failed_task }}': {{ fe_kubernetes_playbook_cluster_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-cluster-hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_cluster_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_cluster_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-cluster-hardening":
                  component: "kubernetes/playbook-cluster-hardening"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_cluster_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_cluster_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_cluster_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_cluster_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_cluster_hardening_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_cluster_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_cluster_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_cluster_hardening_status | default('') == 'succeeded' else ['kubernetes/playbook-cluster-hardening'] }}
            aggregate: true
            per_host: false
          when:
            - fe_kubernetes_playbook_cluster_hardening_status | default('') == 'failed'
            - not (fe_kubernetes_playbook_cluster_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-cluster-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_cluster_hardening_stats_published: true
          when:
            - fe_kubernetes_playbook_cluster_hardening_status | default('') == 'failed'
          tags:
            - always
