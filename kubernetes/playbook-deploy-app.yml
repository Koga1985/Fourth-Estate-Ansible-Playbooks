---
# Secure Application Deployment Playbook
# Deploys applications with STIG-compliant security contexts

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy Secure Application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Application configuration
    app_name: secure-webapp
    app_namespace: production
    app_image: registry1.dso.mil/ironbank/opensource/nginx/nginx:1.23
    app_replicas: 3
    app_port: 8080

    # Resource limits
    app_cpu_request: "200m"
    app_memory_request: "256Mi"
    app_cpu_limit: "1000m"
    app_memory_limit: "1Gi"

    # Security
    app_pod_security_standard: restricted

  tasks:
    - name: "kubernetes/playbook-deploy-app | Guarded execution with rescue and always handling"
      block:

        - name: Include namespace management role
          ansible.builtin.include_role:
            name: kubernetes/roles/k8s-namespace-management
          vars:
            k8s_namespaces:
              - name: "{{ app_namespace }}"
                labels:
                  environment: production
                  pod-security.kubernetes.io/enforce: "{{ app_pod_security_standard }}"

        - name: Deploy application
          ansible.builtin.include_tasks: tasks/deploy-application.yml

        - name: Verify deployment
          ansible.builtin.command: >
            kubectl rollout status deployment/{{ app_name }} -n {{ app_namespace }}
          register: rollout_status
          changed_when: false

        - name: Display deployment information
          ansible.builtin.debug:
            msg:
              - "Application deployed successfully"
              - "Name: {{ app_name }}"
              - "Namespace: {{ app_namespace }}"
              - "Replicas: {{ app_replicas }}"
              - "Status: {{ rollout_status.stdout }}"

      rescue:

        - name: "kubernetes/playbook-deploy-app | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_status: "failed"
            fe_kubernetes_playbook_deploy_app_postflight_passed: false
            fe_kubernetes_playbook_deploy_app_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_deploy_app_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-deploy-app: FAILED at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_deploy_app_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-deploy-app failed at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}': {{ fe_kubernetes_playbook_deploy_app_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-deploy-app | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_deploy_app_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_deploy_app_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-deploy-app":
                  component: "kubernetes/playbook-deploy-app"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_deploy_app_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_deploy_app_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_deploy_app_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_deploy_app_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_deploy_app_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_deploy_app_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_deploy_app_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else ['kubernetes/playbook-deploy-app'] }}
            aggregate: true
            per_host: false
          when:
            - fe_kubernetes_playbook_deploy_app_status | default('') == 'failed'
            - not (fe_kubernetes_playbook_deploy_app_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_stats_published: true
          when:
            - fe_kubernetes_playbook_deploy_app_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "kubernetes/playbook-deploy-app | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "kubernetes/playbook-deploy-app | Initialize validation state"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_kubernetes_playbook_deploy_app_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_deploy_app_status: "running"
            fe_kubernetes_playbook_deploy_app_preflight_passed: false
            fe_kubernetes_playbook_deploy_app_postflight_passed: false
            fe_kubernetes_playbook_deploy_app_failed_task: ""
            fe_kubernetes_playbook_deploy_app_error: ""
            fe_kubernetes_playbook_deploy_app_stats_published: false
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              kubernetes/playbook-deploy-app: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              kubernetes/playbook-deploy-app: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-deploy-app | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "kubernetes/playbook-deploy-app: required variable '{{ item }}' is not defined."
            success_msg: "kubernetes/playbook-deploy-app: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_kubernetes_playbook_deploy_app_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-deploy-app | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "kubernetes/playbook-deploy-app | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_status: "preflight_failed"
            fe_kubernetes_playbook_deploy_app_postflight_passed: false
            fe_kubernetes_playbook_deploy_app_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_deploy_app_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-deploy-app: FAILED at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_deploy_app_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-deploy-app":
                  component: "kubernetes/playbook-deploy-app"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_deploy_app_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_deploy_app_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_deploy_app_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_deploy_app_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_deploy_app_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_deploy_app_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_deploy_app_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else ['kubernetes/playbook-deploy-app'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-deploy-app failed at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}': {{ fe_kubernetes_playbook_deploy_app_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-deploy-app | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-deploy-app: preflight
              {{ 'passed' if fe_kubernetes_playbook_deploy_app_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "kubernetes/playbook-deploy-app | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "kubernetes/playbook-deploy-app | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_kubernetes_playbook_deploy_app_preflight_passed | bool
              - fe_kubernetes_playbook_deploy_app_status in ['running', 'succeeded']
            fail_msg: >-
              kubernetes/playbook-deploy-app: postflight validation failed - preflight passed
              ={{ fe_kubernetes_playbook_deploy_app_preflight_passed | default(false) }},
              status={{ fe_kubernetes_playbook_deploy_app_status | default('unknown') }}.
            success_msg: "kubernetes/playbook-deploy-app: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "kubernetes/playbook-deploy-app | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_postflight_passed: true
            fe_kubernetes_playbook_deploy_app_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "kubernetes/playbook-deploy-app | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_status: "failed"
            fe_kubernetes_playbook_deploy_app_postflight_passed: false
            fe_kubernetes_playbook_deploy_app_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_deploy_app_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-deploy-app: FAILED at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_deploy_app_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-deploy-app | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-deploy-app failed at '{{ fe_kubernetes_playbook_deploy_app_failed_task }}': {{ fe_kubernetes_playbook_deploy_app_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-deploy-app | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_deploy_app_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_deploy_app_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-deploy-app":
                  component: "kubernetes/playbook-deploy-app"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_deploy_app_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_deploy_app_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_deploy_app_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_deploy_app_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_deploy_app_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_deploy_app_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_deploy_app_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_deploy_app_status | default('') == 'succeeded' else ['kubernetes/playbook-deploy-app'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_kubernetes_playbook_deploy_app_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_deploy_app_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-deploy-app | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-deploy-app: {{ fe_kubernetes_playbook_deploy_app_status | default('unknown') }} in
              {{ fe_kubernetes_playbook_deploy_app_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
