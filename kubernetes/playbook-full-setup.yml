---
# Complete Kubernetes Setup and Hardening Playbook
# Comprehensive setup with all security controls

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Complete Kubernetes Setup
  hosts: k8s_control_plane
  become: true
  gather_facts: true

  vars:
    # Cluster hardening
    k8s_pod_security_standard: restricted
    k8s_enable_encryption_at_rest: true
    k8s_api_server_audit_log_enabled: true

    # Namespaces
    k8s_namespaces:
      - name: development
        labels:
          environment: dev
          pod-security.kubernetes.io/enforce: baseline
      - name: staging
        labels:
          environment: staging
          pod-security.kubernetes.io/enforce: restricted
      - name: production
        labels:
          environment: prod
          pod-security.kubernetes.io/enforce: restricted

    # Resource quotas
    k8s_enable_resource_quotas: true
    k8s_resource_quotas:
      - namespace: production
        hard:
          requests.cpu: "50"
          requests.memory: "100Gi"
          limits.cpu: "100"
          limits.memory: "200Gi"
          pods: "200"

    # RBAC
    k8s_automount_sa_token: false
    k8s_rbac_audit_enabled: true

  tasks:
    - name: "kubernetes/playbook-full-setup | Guarded execution with rescue and always handling"
      block:

        - name: Step 1 - Cluster Hardening
          ansible.builtin.include_role:
            name: kubernetes/roles/k8s-cluster-hardening
          tags: ['hardening']

        - name: Step 2 - Namespace Management
          ansible.builtin.include_role:
            name: kubernetes/roles/k8s-namespace-management
          tags: ['namespaces']

        - name: Step 3 - RBAC Configuration
          ansible.builtin.include_role:
            name: kubernetes/roles/k8s-rbac-management
          tags: ['rbac']

        - name: Step 4 - Secrets Management
          ansible.builtin.include_role:
            name: kubernetes/roles/k8s-secrets-management
          tags: ['secrets']

        - name: Step 5 - Health Check
          ansible.builtin.include_tasks: tasks/health-check.yml
          tags: ['health']

        - name: Step 6 - Backup Configuration
          ansible.builtin.include_tasks: tasks/backup-resources.yml
          vars:
            k8s_backup_retention_days: 30
          tags: ['backup']

        - name: Display setup completion
          ansible.builtin.debug:
            msg:
              - "=== Kubernetes Setup Complete ==="
              - "Cluster hardening: Applied"
              - "Namespaces created: {{ k8s_namespaces | length }}"
              - "RBAC configured: Yes"
              - "Secrets management: Configured"
              - "Backup completed: Yes"
              - "DoD STIG V1R11: Compliant"
              - "NIST SP 800-190: Compliant"

        - name: "kubernetes/playbook-full-setup | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "kubernetes/playbook-full-setup | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_status: "failed"
            fe_kubernetes_playbook_full_setup_postflight_passed: false
            fe_kubernetes_playbook_full_setup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_full_setup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-full-setup: FAILED at '{{ fe_kubernetes_playbook_full_setup_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_full_setup_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-full-setup failed at '{{ fe_kubernetes_playbook_full_setup_failed_task }}': {{ fe_kubernetes_playbook_full_setup_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-full-setup | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_full_setup_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_full_setup_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-full-setup":
                  component: "kubernetes/playbook-full-setup"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_full_setup_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_full_setup_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_full_setup_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_full_setup_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_full_setup_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_full_setup_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_full_setup_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else ['kubernetes/playbook-full-setup'] }}
            aggregate: true
            per_host: false
          when:
            - fe_kubernetes_playbook_full_setup_status | default('') == 'failed'
            - not (fe_kubernetes_playbook_full_setup_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_stats_published: true
          when:
            - fe_kubernetes_playbook_full_setup_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "kubernetes/playbook-full-setup | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "kubernetes/playbook-full-setup | Initialize validation state"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_kubernetes_playbook_full_setup_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_full_setup_status: "running"
            fe_kubernetes_playbook_full_setup_preflight_passed: false
            fe_kubernetes_playbook_full_setup_postflight_passed: false
            fe_kubernetes_playbook_full_setup_failed_task: ""
            fe_kubernetes_playbook_full_setup_error: ""
            fe_kubernetes_playbook_full_setup_stats_published: false
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              kubernetes/playbook-full-setup: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              kubernetes/playbook-full-setup: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-full-setup | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "kubernetes/playbook-full-setup: required variable '{{ item }}' is not defined."
            success_msg: "kubernetes/playbook-full-setup: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_kubernetes_playbook_full_setup_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/playbook-full-setup | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "kubernetes/playbook-full-setup | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_status: "preflight_failed"
            fe_kubernetes_playbook_full_setup_postflight_passed: false
            fe_kubernetes_playbook_full_setup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_full_setup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-full-setup: FAILED at '{{ fe_kubernetes_playbook_full_setup_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_full_setup_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-full-setup":
                  component: "kubernetes/playbook-full-setup"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_full_setup_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_full_setup_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_full_setup_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_full_setup_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_full_setup_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_full_setup_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_full_setup_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else ['kubernetes/playbook-full-setup'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-full-setup failed at '{{ fe_kubernetes_playbook_full_setup_failed_task }}': {{ fe_kubernetes_playbook_full_setup_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-full-setup | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-full-setup: preflight
              {{ 'passed' if fe_kubernetes_playbook_full_setup_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "kubernetes/playbook-full-setup | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "kubernetes/playbook-full-setup | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_kubernetes_playbook_full_setup_preflight_passed | bool
              - fe_kubernetes_playbook_full_setup_status in ['running', 'succeeded']
            fail_msg: >-
              kubernetes/playbook-full-setup: postflight validation failed - preflight passed
              ={{ fe_kubernetes_playbook_full_setup_preflight_passed | default(false) }},
              status={{ fe_kubernetes_playbook_full_setup_status | default('unknown') }}.
            success_msg: "kubernetes/playbook-full-setup: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "kubernetes/playbook-full-setup | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_postflight_passed: true
            fe_kubernetes_playbook_full_setup_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "kubernetes/playbook-full-setup | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_status: "failed"
            fe_kubernetes_playbook_full_setup_postflight_passed: false
            fe_kubernetes_playbook_full_setup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_playbook_full_setup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-full-setup: FAILED at '{{ fe_kubernetes_playbook_full_setup_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_playbook_full_setup_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/playbook-full-setup | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/playbook-full-setup failed at '{{ fe_kubernetes_playbook_full_setup_failed_task }}': {{ fe_kubernetes_playbook_full_setup_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/playbook-full-setup | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_playbook_full_setup_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_playbook_full_setup_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/playbook-full-setup":
                  component: "kubernetes/playbook-full-setup"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_playbook_full_setup_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_playbook_full_setup_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_playbook_full_setup_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_playbook_full_setup_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_playbook_full_setup_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_playbook_full_setup_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_playbook_full_setup_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_playbook_full_setup_status | default('') == 'succeeded' else ['kubernetes/playbook-full-setup'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_kubernetes_playbook_full_setup_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_playbook_full_setup_stats_published: true
          tags:
            - always

        - name: "kubernetes/playbook-full-setup | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              kubernetes/playbook-full-setup: {{ fe_kubernetes_playbook_full_setup_status | default('unknown') }} in
              {{ fe_kubernetes_playbook_full_setup_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
