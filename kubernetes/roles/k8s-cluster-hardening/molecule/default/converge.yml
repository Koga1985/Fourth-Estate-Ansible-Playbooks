---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Initialize validation state"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status: "running"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task: ""
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error: ""
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_stats_published: false
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "kubernetes/k8s-cluster-hardening/molecule/default/converge: required variable '{{ item }}' is not defined."
            success_msg: "kubernetes/k8s-cluster-hardening/molecule/default/converge: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status: "preflight_failed"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/k8s-cluster-hardening/molecule/default/converge":
                  component: "kubernetes/k8s-cluster-hardening/molecule/default/converge"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/molecule/default/converge'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_stats_published: true
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge failed at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: preflight
              {{ 'passed' if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == "Debian"
      changed_when: false

  roles:
    - role: k8s-cluster-hardening
      vars:
        k8s_pod_security_standard: restricted
        k8s_enable_encryption_at_rest: true
        k8s_run_kube_bench: false
  post_tasks:
    - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed | bool
              - fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status in ['running', 'succeeded']
            fail_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: postflight validation failed - preflight passed
              ={{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed | default(false) }},
              status={{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('unknown') }}.
            success_msg: "kubernetes/k8s-cluster-hardening/molecule/default/converge: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed: true
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status: "failed"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge failed at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/k8s-cluster-hardening/molecule/default/converge":
                  component: "kubernetes/k8s-cluster-hardening/molecule/default/converge"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/molecule/default/converge'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_stats_published: true
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/converge | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/converge: {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_status | default('unknown') }} in
              {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_converge_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
