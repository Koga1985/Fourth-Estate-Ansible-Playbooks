---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Guarded execution with rescue and always handling"
      block:

        - name: Verify audit policy file exists
          ansible.builtin.stat:
            path: /etc/kubernetes/audit-policy.yaml
          register: audit_policy
          failed_when: not audit_policy.stat.exists

        - name: Verify encryption config exists
          ansible.builtin.stat:
            path: /etc/kubernetes/encryption-config.yaml
          register: encryption_config
          failed_when: not encryption_config.stat.exists

        - name: Verify kubelet config exists
          ansible.builtin.stat:
            path: /var/lib/kubelet/config.yaml
          register: kubelet_config
          failed_when: not kubelet_config.stat.exists

        - name: Display verification results
          ansible.builtin.debug:
            msg:
              - "Audit policy: {{ 'Present' if audit_policy.stat.exists else 'Missing' }}"
              - "Encryption config: {{ 'Present' if encryption_config.stat.exists else 'Missing' }}"
              - "Kubelet config: {{ 'Present' if kubelet_config.stat.exists else 'Missing' }}"

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status: "failed"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify failed at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/k8s-cluster-hardening/molecule/default/verify":
                  component: "kubernetes/k8s-cluster-hardening/molecule/default/verify"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/molecule/default/verify'] }}
            aggregate: true
            per_host: false
          when:
            - fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'failed'
            - not (fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published: true
          when:
            - fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Initialize validation state"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status: "running"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task: ""
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error: ""
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published: false
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "kubernetes/k8s-cluster-hardening/molecule/default/verify: required variable '{{ item }}' is not defined."
            success_msg: "kubernetes/k8s-cluster-hardening/molecule/default/verify: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status: "preflight_failed"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/k8s-cluster-hardening/molecule/default/verify":
                  component: "kubernetes/k8s-cluster-hardening/molecule/default/verify"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/molecule/default/verify'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published: true
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify failed at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: preflight
              {{ 'passed' if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | bool
              - fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status in ['running', 'succeeded']
            fail_msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: postflight validation failed - preflight passed
              ={{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | default(false) }},
              status={{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('unknown') }}.
            success_msg: "kubernetes/k8s-cluster-hardening/molecule/default/verify: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed: true
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status: "failed"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed: false
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          tags:
            - always
            - rescue

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify failed at '{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "kubernetes/k8s-cluster-hardening/molecule/default/verify":
                  component: "kubernetes/k8s-cluster-hardening/molecule/default/verify"
                  type: "playbook"
                  platform: "kubernetes"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('unknown') }}"
                  preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_started_at | default('') }}"
                  ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_ended_at | default('') }}"
                  duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_failed_task | default('') }}"
                  error: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/molecule/default/verify'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published | default(false) | bool)
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_stats_published: true
          tags:
            - always

        - name: "kubernetes/k8s-cluster-hardening/molecule/default/verify | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              kubernetes/k8s-cluster-hardening/molecule/default/verify: {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_status | default('unknown') }} in
              {{ fe_kubernetes_k8s_cluster_hardening_molecule_default_verify_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
