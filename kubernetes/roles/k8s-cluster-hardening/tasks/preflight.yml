---
# Pre-flight checks for Kubernetes cluster hardening

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/preflight']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_preflight_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/preflight | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_preflight_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_preflight_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_preflight_status: "running"
    fe_kubernetes_k8s_cluster_hardening_preflight_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_preflight_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_preflight_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_preflight_error: ""
    fe_kubernetes_k8s_cluster_hardening_preflight_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/preflight | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/preflight | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/preflight: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/preflight: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/preflight | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/preflight: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/preflight: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/preflight | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Verify Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.14', '>=')
        fail_msg: "Ansible version must be 2.14 or higher"
        success_msg: "Ansible version check passed"

    - name: Check if kubectl is installed
      ansible.builtin.command: kubectl version --client --short
      register: kubectl_version
      changed_when: false
      failed_when: false

    - name: Fail if kubectl is not installed
      ansible.builtin.fail:
        msg: "kubectl is not installed or not in PATH"
      when: kubectl_version.rc != 0

    - name: Check Kubernetes cluster connectivity
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      failed_when: cluster_info.rc != 0

    - name: Get Kubernetes version
      ansible.builtin.command: kubectl version --short -o json
      register: k8s_version_output
      changed_when: false

    - name: Parse Kubernetes version
      ansible.builtin.set_fact:
        k8s_server_version: "{{ (k8s_version_output.stdout | from_json).serverVersion.gitVersion }}"

    - name: Verify Kubernetes version (minimum 1.24)
      ansible.builtin.assert:
        that:
          - k8s_server_version is version('v1.24', '>=')
        fail_msg: "Kubernetes version must be 1.24 or higher for Pod Security Standards"
        success_msg: "Kubernetes version {{ k8s_server_version }} is supported"

    - name: Check if running with appropriate privileges
      ansible.builtin.stat:
        path: /etc/kubernetes
      register: k8s_config_dir
      failed_when: false

    - name: Display pre-flight check summary
      ansible.builtin.debug:
        msg:
          - "Pre-flight checks completed successfully"
          - "Kubectl version: {{ kubectl_version.stdout }}"
          - "Kubernetes cluster version: {{ k8s_server_version }}"
          - "Cluster connectivity: OK"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/preflight | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_preflight_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_preflight_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/preflight: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_preflight_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_preflight_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/preflight: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/preflight | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_preflight_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/preflight | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_preflight_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_preflight_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_preflight_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/preflight | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/preflight: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_preflight_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_preflight_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/preflight | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/preflight failed at '{{ fe_kubernetes_k8s_cluster_hardening_preflight_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_preflight_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/preflight | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_preflight_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_preflight_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/preflight | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/preflight":
              component: "kubernetes/k8s-cluster-hardening/preflight"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_preflight_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_preflight_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_preflight_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/preflight'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/preflight | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_stats_published: true
      tags:
        - always
