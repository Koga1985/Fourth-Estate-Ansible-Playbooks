---
# Main tasks file for k8s-cluster-hardening role
# DoD STIG V1R11 and NIST SP 800-190 Compliant

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_status: "running"
    fe_kubernetes_k8s_cluster_hardening_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_error: ""
    fe_kubernetes_k8s_cluster_hardening_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include pre-flight checks
      ansible.builtin.include_tasks: preflight.yml
      tags:
        - preflight
        - always

    - name: Harden API Server configuration
      ansible.builtin.include_tasks: api-server-hardening.yml
      tags:
        - api-server
        - hardening

    - name: Harden kubelet configuration
      ansible.builtin.include_tasks: kubelet-hardening.yml
      tags:
        - kubelet
        - hardening

    - name: Harden ETCD configuration
      ansible.builtin.include_tasks: etcd-hardening.yml
      tags:
        - etcd
        - hardening

    - name: Configure audit logging
      ansible.builtin.include_tasks: audit-logging.yml
      tags:
        - audit
        - logging
        - compliance

    - name: Apply file permissions (STIG V-242450+)
      ansible.builtin.include_tasks: file-permissions.yml
      tags:
        - permissions
        - stig

    - name: Configure encryption at rest
      ansible.builtin.include_tasks: encryption-at-rest.yml
      when: k8s_enable_encryption_at_rest | bool
      tags:
        - encryption
        - secrets

    - name: Deploy Pod Security Standards
      ansible.builtin.include_tasks: pod-security-standards.yml
      when: k8s_enforce_pod_security_standards | bool
      tags:
        - pod-security
        - pss

    - name: Configure network policies
      ansible.builtin.include_tasks: network-policies.yml
      when: k8s_default_network_policy_enabled | bool
      tags:
        - network
        - policies

    - name: Apply security contexts
      ansible.builtin.include_tasks: security-contexts.yml
      tags:
        - security-context
        - hardening

    - name: Run compliance validation
      ansible.builtin.include_tasks: compliance-validation.yml
      tags:
        - validation
        - compliance
        - never

    - name: Display hardening summary
      ansible.builtin.debug:
        msg:
          - "Kubernetes Cluster Hardening Complete"
          - "DoD STIG V1R11: Applied"
          - "NIST SP 800-190: Applied"
          - "TLS Version: {{ k8s_tls_min_version }}"
          - "Pod Security Standard: {{ k8s_pod_security_standard }}"
          - "Audit Logging: {{ 'Enabled' if k8s_api_server_audit_log_enabled else 'Disabled' }}"
          - "Encryption at Rest: {{ 'Enabled' if k8s_enable_encryption_at_rest else 'Disabled' }}"
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening failed at '{{ fe_kubernetes_k8s_cluster_hardening_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening":
              component: "kubernetes/k8s-cluster-hardening"
              type: "role"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_stats_published: true
      tags:
        - always
