---
# File Permissions Hardening
# STIG V-242450 through V-242458

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/file-permissions']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_file_permissions_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/file-permissions | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_file_permissions_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_file_permissions_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_file_permissions_status: "running"
    fe_kubernetes_k8s_cluster_hardening_file_permissions_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_file_permissions_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_file_permissions_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_file_permissions_error: ""
    fe_kubernetes_k8s_cluster_hardening_file_permissions_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/file-permissions | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/file-permissions: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/file-permissions: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/file-permissions: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/file-permissions: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_file_permissions_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set permissions on Kubernetes configuration files (STIG V-242450)
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ k8s_config_file_owner }}"
        group: "{{ k8s_config_file_group }}"
        mode: "{{ k8s_config_file_permissions }}"
      loop:
        - /etc/kubernetes/admin.conf
        - /etc/kubernetes/controller-manager.conf
        - /etc/kubernetes/scheduler.conf
        - /etc/kubernetes/kubelet.conf
      when: item is exists
      failed_when: false

    - name: Set permissions on PKI directory (STIG V-242454)
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        owner: root
        group: root
        mode: '0700'
        recurse: false

    - name: Set permissions on PKI certificate files (STIG V-242455)
      ansible.builtin.shell: |
        find /etc/kubernetes/pki -name "*.crt" -exec chmod 644 {} \;
        find /etc/kubernetes/pki -name "*.key" -exec chmod 600 {} \;
      changed_when: false

    - name: Set ownership on PKI files
      ansible.builtin.shell: |
        chown -R root:root /etc/kubernetes/pki
      changed_when: false

    - name: Set permissions on manifest directory (STIG V-242456)
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Set permissions on manifest files (STIG V-242457)
      ansible.builtin.shell: |
        find /etc/kubernetes/manifests -type f -exec chmod 600 {} \;
      changed_when: false

    - name: Set permissions on kubelet config and service files (STIG V-242451, V-242452)
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: '/var/lib/kubelet/config.yaml', mode: '0600' }
        - { path: '/var/lib/kubelet/kubeconfig', mode: '0600' }
        - { path: '/etc/systemd/system/kubelet.service', mode: '0644' }
        - { path: '/etc/systemd/system/kubelet.service.d', mode: '0755' }
      when: item.path is exists
      failed_when: false

    - name: Set permissions on etcd data directory (STIG V-242453)
      ansible.builtin.file:
        path: /var/lib/etcd
        state: directory
        owner: etcd
        group: etcd
        mode: '0700'
      when: etcd_manifest.stat.exists | default(false)
      failed_when: false

    - name: Set permissions on container runtime socket (STIG V-242458)
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0660'
      loop:
        - /var/run/docker.sock
        - /var/run/containerd/containerd.sock
        - /var/run/crio/crio.sock
      when: item is exists
      failed_when: false

    - name: Verify all critical file permissions
      ansible.builtin.shell: |
        ls -la {{ item }}
      loop:
        - /etc/kubernetes/admin.conf
        - /etc/kubernetes/pki
        - /etc/kubernetes/manifests
        - /var/lib/kubelet/config.yaml
      register: file_permissions_check
      changed_when: false
      failed_when: false

    - name: Display file permissions status
      ansible.builtin.debug:
        msg:
          - "File permissions hardening applied"
          - "Kubernetes config files: 0600"
          - "PKI directory: 0700"
          - "Certificate files: 0644"
          - "Private key files: 0600"
          - "Manifest files: 0600"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_file_permissions_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_file_permissions_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/file-permissions: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_file_permissions_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_file_permissions_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/file-permissions: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_file_permissions_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_file_permissions_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_file_permissions_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_file_permissions_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_file_permissions_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_file_permissions_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/file-permissions: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_file_permissions_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/file-permissions failed at '{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_file_permissions_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_file_permissions_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_file_permissions_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_file_permissions_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/file-permissions":
              component: "kubernetes/k8s-cluster-hardening/file-permissions"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_file_permissions_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_file_permissions_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_file_permissions_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_file_permissions_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/file-permissions'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/file-permissions | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_file_permissions_stats_published: true
      tags:
        - always
