---
# Audit Logging Configuration
# STIG V-242459, V-242460, V-242461 and NIST SP 800-92

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/audit-logging']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_audit_logging_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/audit-logging | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_audit_logging_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_audit_logging_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_audit_logging_status: "running"
    fe_kubernetes_k8s_cluster_hardening_audit_logging_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_audit_logging_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_audit_logging_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_audit_logging_error: ""
    fe_kubernetes_k8s_cluster_hardening_audit_logging_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/audit-logging | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/audit-logging: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/audit-logging: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/audit-logging: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/audit-logging: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_audit_logging_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure audit log directory exists
      ansible.builtin.file:
        path: "{{ k8s_api_server_audit_log_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy audit policy
      ansible.builtin.template:
        src: audit-policy.yaml.j2
        dest: "{{ k8s_api_server_audit_policy_file }}"
        owner: root
        group: root
        mode: '0600'
        backup: true
      notify: restart kube-apiserver

    - name: Configure log rotation for audit logs
      ansible.builtin.template:
        src: audit-log-rotation.conf.j2
        dest: /etc/logrotate.d/kubernetes-audit
        owner: root
        group: root
        mode: '0644'

    - name: Verify audit log file exists and has correct permissions (STIG V-242459)
      ansible.builtin.file:
        path: "{{ k8s_api_server_audit_log_path }}"
        state: touch
        owner: root
        group: root
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    - name: Check if audit logging is active
      ansible.builtin.stat:
        path: "{{ k8s_api_server_audit_log_path }}"
      register: audit_log_file

    - name: Verify audit logs are being written (STIG V-242460)
      ansible.builtin.shell: |
        if [ -f "{{ k8s_api_server_audit_log_path }}" ]; then
          find "{{ k8s_api_server_audit_log_path }}" -mmin -5 | grep -q .
          echo $?
        else
          echo "1"
        fi
      register: audit_log_recent
      changed_when: false
      failed_when: false

    - name: Configure audit webhook (optional)
      when: k8s_audit_webhook_enabled | default(false)
      block:
        - name: Deploy audit webhook configuration
          ansible.builtin.template:
            src: audit-webhook-config.yaml.j2
            dest: /etc/kubernetes/audit-webhook-config.yaml
            owner: root
            group: root
            mode: '0600'
          notify: restart kube-apiserver

    - name: Set up audit log monitoring with auditd
      when: ansible_os_family in ['RedHat', 'Debian']
      block:
        - name: Ensure auditd is installed
          ansible.builtin.package:
            name: "{{ 'audit' if ansible_os_family == 'RedHat' else 'auditd' }}"
            state: present

        - name: Configure auditd rules for Kubernetes
          ansible.builtin.template:
            src: kubernetes-audit.rules.j2
            dest: /etc/audit/rules.d/kubernetes.rules
            owner: root
            group: root
            mode: '0600'
          notify: restart auditd

        - name: Ensure auditd service is enabled and running
          ansible.builtin.systemd:
            name: auditd
            enabled: true
            state: started

    - name: Configure rsyslog for centralized logging (NIST SP 800-92)
      when: k8s_centralized_logging_enabled | default(false)
      block:
        - name: Deploy rsyslog configuration for Kubernetes
          ansible.builtin.template:
            src: rsyslog-kubernetes.conf.j2
            dest: /etc/rsyslog.d/30-kubernetes.conf
            owner: root
            group: root
            mode: '0644'
          notify: restart rsyslog

    - name: Verify audit policy compliance
      ansible.builtin.shell: |
        if [ -f "{{ k8s_api_server_audit_policy_file }}" ]; then
          grep -q "level: RequestResponse" "{{ k8s_api_server_audit_policy_file }}"
          echo $?
        else
          echo "1"
        fi
      register: audit_policy_check
      changed_when: false
      failed_when: false

    - name: Display audit logging status
      ansible.builtin.debug:
        msg:
          - "Audit logging configuration applied"
          - "Audit log path: {{ k8s_api_server_audit_log_path }}"
          - "Audit policy file: {{ k8s_api_server_audit_policy_file }}"
          - "Log max age: {{ k8s_api_server_audit_log_maxage }} days"
          - "Log max backups: {{ k8s_api_server_audit_log_maxbackup }}"
          - "Audit logs active: {{ 'Yes' if audit_log_file.stat.exists else 'No' }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_audit_logging_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_audit_logging_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/audit-logging: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_audit_logging_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_audit_logging_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/audit-logging: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_audit_logging_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_audit_logging_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_audit_logging_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_audit_logging_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_audit_logging_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_audit_logging_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/audit-logging: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_audit_logging_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/audit-logging failed at '{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_audit_logging_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_audit_logging_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_audit_logging_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_audit_logging_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/audit-logging":
              component: "kubernetes/k8s-cluster-hardening/audit-logging"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_audit_logging_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_audit_logging_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_audit_logging_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_audit_logging_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/audit-logging'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/audit-logging | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_audit_logging_stats_published: true
      tags:
        - always
