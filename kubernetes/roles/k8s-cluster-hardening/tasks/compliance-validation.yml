---
# Compliance Validation Tasks
# Validates DoD STIG and NIST SP 800-190 compliance

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/compliance-validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_compliance_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/compliance-validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_status: "running"
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_error: ""
    fe_kubernetes_k8s_cluster_hardening_compliance_validation_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/compliance-validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/compliance-validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/compliance-validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/compliance-validation: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/compliance-validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Run kube-bench for STIG compliance
      when: k8s_run_kube_bench | default(true)
      block:
        - name: Check if kube-bench is installed
          ansible.builtin.command: which kube-bench
          register: kube_bench_installed
          changed_when: false
          failed_when: false

        - name: Run kube-bench compliance scan
          ansible.builtin.command: >
            kube-bench run --targets master,node,etcd,policies
            --json --outputfile /tmp/kube-bench-results.json
          when: kube_bench_installed.rc == 0
          register: kube_bench_results
          changed_when: false
          failed_when: false

        - name: Display kube-bench summary
          ansible.builtin.shell: |
            jq '.Totals' /tmp/kube-bench-results.json
          when: kube_bench_installed.rc == 0
          register: bench_summary
          changed_when: false
          failed_when: false

    - name: Validate STIG controls checklist
      ansible.builtin.set_fact:
        stig_controls:
          V-242381: "{{ 'PASS' if k8s_api_server_audit_log_enabled else 'FAIL' }}"
          V-242382: "{{ 'PASS' if k8s_api_server_audit_log_maxage >= 30 else 'FAIL' }}"
          V-242400: "{{ 'PASS' if k8s_tls_min_version == 'VersionTLS12' else 'FAIL' }}"
          V-242402: "{{ 'PASS' if not k8s_anonymous_auth_enabled else 'FAIL' }}"
          V-242417: "{{ 'PASS' if 'NodeRestriction' in k8s_enable_admission_plugins else 'FAIL' }}"
          V-242424: "{{ 'PASS' if not k8s_kubelet_anonymous_auth else 'FAIL' }}"
          V-242425: "{{ 'PASS' if k8s_kubelet_read_only_port == 0 else 'FAIL' }}"
          V-242434: "{{ 'PASS' if k8s_etcd_client_cert_auth else 'FAIL' }}"
          V-242450: "{{ 'PASS' if k8s_config_file_permissions == '0600' else 'FAIL' }}"
          V-242462: "{{ 'PASS' if k8s_enable_encryption_at_rest else 'FAIL' }}"

    - name: Validate NIST SP 800-190 controls
      ansible.builtin.set_fact:
        nist_controls:
          container_isolation: "{{ 'PASS' if k8s_enforce_pod_security_standards else 'FAIL' }}"
          network_segmentation: "{{ 'PASS' if k8s_default_network_policy_enabled else 'FAIL' }}"
          secure_orchestration: "{{ 'PASS' if 'RBAC' in k8s_authorization_mode else 'FAIL' }}"
          logging_monitoring: "{{ 'PASS' if k8s_api_server_audit_log_enabled else 'FAIL' }}"
          runtime_defense: "{{ 'PASS' if k8s_security_context_defaults.seccomp_profile.type == 'RuntimeDefault' else 'FAIL' }}"

    - name: Run kubectl security audit
      ansible.builtin.shell: |
        kubectl get all --all-namespaces -o json | \
        jq -r '[.items[] |
        select(.spec.securityContext == null or
               .spec.securityContext.runAsNonRoot != true)] | length'
      register: insecure_pods
      changed_when: false
      failed_when: false

    - name: Check for privileged containers
      ansible.builtin.shell: |
        kubectl get pods --all-namespaces -o json | \
        jq -r '[.items[].spec.containers[] |
        select(.securityContext.privileged == true)] | length'
      register: privileged_containers
      changed_when: false
      failed_when: false

    - name: Check for containers running as root
      ansible.builtin.shell: |
        kubectl get pods --all-namespaces -o json | \
        jq -r '[.items[] |
        select(.spec.securityContext.runAsNonRoot != true)] | length'
      register: root_containers
      changed_when: false
      failed_when: false

    - name: Generate compliance report
      ansible.builtin.template:
        src: compliance-report.html.j2
        dest: /tmp/k8s-compliance-report.html
        owner: root
        group: root
        mode: '0600'

    - name: Display compliance validation summary
      ansible.builtin.debug:
        msg:
          - "=== Compliance Validation Summary ==="
          - "STIG Controls Passed: {{ stig_controls.values() | select('equalto', 'PASS') | list | length }}/{{ stig_controls | length }}"
          - "NIST Controls Passed: {{ nist_controls.values() | select('equalto', 'PASS') | list | length }}/{{ nist_controls | length }}"
          - "Insecure pods found: {{ insecure_pods.stdout | default('N/A') }}"
          - "Privileged containers: {{ privileged_containers.stdout | default('N/A') }}"
          - "Containers running as root: {{ root_containers.stdout | default('N/A') }}"
          - "Compliance report: /tmp/k8s-compliance-report.html"

    - name: Fail if critical STIG controls are not met
      ansible.builtin.fail:
        msg: "Critical STIG controls failed: {{ stig_controls | dict2items | selectattr('value', 'equalto', 'FAIL') | map(attribute='key') | list }}"
      when:
        - k8s_fail_on_compliance_error | default(false)
        - stig_controls.values() | select('equalto', 'FAIL') | list | length > 0

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_compliance_validation_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_compliance_validation_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/compliance-validation: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/compliance-validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/compliance-validation: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/compliance-validation failed at '{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_compliance_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/compliance-validation":
              component: "kubernetes/k8s-cluster-hardening/compliance-validation"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_compliance_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_compliance_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_compliance_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_compliance_validation_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/compliance-validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/compliance-validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_compliance_validation_stats_published: true
      tags:
        - always
