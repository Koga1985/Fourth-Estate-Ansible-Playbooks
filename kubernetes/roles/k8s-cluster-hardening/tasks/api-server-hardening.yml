---
# API Server Hardening Tasks
# STIG V-242381 through V-242420

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/api-server-hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_api_server_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status: "running"
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_error: ""
    fe_kubernetes_k8s_cluster_hardening_api_server_hardening_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/api-server-hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/api-server-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/api-server-hardening: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/api-server-hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create audit policy directory
      ansible.builtin.file:
        path: "{{ k8s_api_server_audit_policy_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy audit policy configuration
      ansible.builtin.template:
        src: audit-policy.yaml.j2
        dest: "{{ k8s_api_server_audit_policy_file }}"
        owner: root
        group: root
        mode: '0600'
      notify: restart kube-apiserver

    - name: Create audit log directory
      ansible.builtin.file:
        path: "{{ k8s_api_server_audit_log_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Check if API server manifest exists
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: api_server_manifest

    - name: Update API server configuration (kubeadm)
      when: api_server_manifest.stat.exists
      block:
        - name: Read current API server manifest
          ansible.builtin.slurp:
            src: /etc/kubernetes/manifests/kube-apiserver.yaml
          register: api_server_current

        - name: Parse API server manifest
          ansible.builtin.set_fact:
            api_server_config: "{{ api_server_current.content | b64decode | from_yaml }}"

        - name: Apply API server hardening parameters
          ansible.builtin.template:
            src: kube-apiserver-flags.yaml.j2
            dest: /etc/kubernetes/kube-apiserver-flags.yaml
            owner: root
            group: root
            mode: '0600'
          notify: restart kube-apiserver

    - name: Verify anonymous auth is disabled (STIG V-242402)
      ansible.builtin.command: >
        kubectl get --raw /api/v1/namespaces/default
      register: anon_auth_test
      changed_when: false
      failed_when: false

    - name: Check API server TLS configuration (STIG V-242400)
      ansible.builtin.shell: |
        openssl s_client -connect {{ ansible_default_ipv4.address }}:6443 </dev/null 2>/dev/null | \
        openssl x509 -noout -text | grep -A 2 "Signature Algorithm"
      register: api_server_tls
      changed_when: false
      failed_when: false

    - name: Validate admission controllers (STIG V-242417)
      ansible.builtin.command: >
        kubectl get --raw /api/v1
      register: admission_check
      changed_when: false
      failed_when: false

    - name: Display API server hardening status
      ansible.builtin.debug:
        msg:
          - "API Server hardening applied"
          - "Audit logging: Enabled"
          - "Anonymous auth: Disabled"
          - "TLS Min Version: {{ k8s_tls_min_version }}"
          - "Authorization modes: {{ k8s_authorization_mode | join(', ') }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_api_server_hardening_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/api-server-hardening: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/api-server-hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/api-server-hardening: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/api-server-hardening failed at '{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_api_server_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/api-server-hardening":
              component: "kubernetes/k8s-cluster-hardening/api-server-hardening"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_api_server_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_api_server_hardening_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/api-server-hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/api-server-hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_api_server_hardening_stats_published: true
      tags:
        - always
