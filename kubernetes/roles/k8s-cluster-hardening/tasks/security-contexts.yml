---
# Security Context Enforcement
# NIST SP 800-190 - Container Runtime Security

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/security-contexts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_security_contexts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/security-contexts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_security_contexts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_security_contexts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_security_contexts_status: "running"
    fe_kubernetes_k8s_cluster_hardening_security_contexts_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_security_contexts_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_security_contexts_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_security_contexts_error: ""
    fe_kubernetes_k8s_cluster_hardening_security_contexts_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/security-contexts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/security-contexts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/security-contexts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/security-contexts: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/security-contexts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_security_contexts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create security context admission configuration
      ansible.builtin.template:
        src: security-context-admission.yaml.j2
        dest: /etc/kubernetes/security-context-admission.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Deploy LimitRange with security defaults
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: security-context-defaults
            namespace: "{{ item }}"
          spec:
            limits:
              - type: Container
                defaultRequest:
                  cpu: "100m"
                  memory: "128Mi"
                default:
                  cpu: "200m"
                  memory: "256Mi"
                max:
                  cpu: "2"
                  memory: "2Gi"
      loop:
        - default
      when: k8s_enable_limit_ranges | bool

    - name: Create example secure pod template
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: secure-pod-template
            namespace: kube-system
          data:
            pod-template.yaml: |
              apiVersion: v1
              kind: Pod
              metadata:
                name: secure-app
              spec:
                securityContext:
                  runAsNonRoot: {{ k8s_security_context_defaults.run_as_non_root }}
                  runAsUser: {{ k8s_security_context_defaults.run_as_user }}
                  fsGroup: {{ k8s_security_context_defaults.fs_group }}
                  seccompProfile:
                    type: {{ k8s_security_context_defaults.seccomp_profile.type }}
                containers:
                - name: app
                  image: registry1.dso.mil/ironbank/opensource/nginx/nginx:latest
                  securityContext:
                    allowPrivilegeEscalation: {{ k8s_security_context_defaults.allow_privilege_escalation }}
                    readOnlyRootFilesystem: {{ k8s_security_context_defaults.read_only_root_filesystem }}
                    runAsNonRoot: true
                    capabilities:
                      drop:
                      {% for cap in k8s_security_context_defaults.drop_capabilities %}
                      - {{ cap }}
                      {% endfor %}

    - name: Display security context configuration
      ansible.builtin.debug:
        msg:
          - "Security contexts configured"
          - "Run as non-root: {{ k8s_security_context_defaults.run_as_non_root }}"
          - "Default UID: {{ k8s_security_context_defaults.run_as_user }}"
          - "Privilege escalation: {{ k8s_security_context_defaults.allow_privilege_escalation }}"
          - "Read-only root FS: {{ k8s_security_context_defaults.read_only_root_filesystem }}"
          - "Seccomp profile: {{ k8s_security_context_defaults.seccomp_profile.type }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_security_contexts_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_security_contexts_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/security-contexts: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_security_contexts_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_security_contexts_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/security-contexts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_security_contexts_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_security_contexts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_security_contexts_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_security_contexts_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_security_contexts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_security_contexts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/security-contexts: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_security_contexts_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/security-contexts failed at '{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_security_contexts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_security_contexts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_security_contexts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_security_contexts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/security-contexts":
              component: "kubernetes/k8s-cluster-hardening/security-contexts"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_security_contexts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_security_contexts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_security_contexts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_security_contexts_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/security-contexts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/security-contexts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_security_contexts_stats_published: true
      tags:
        - always
