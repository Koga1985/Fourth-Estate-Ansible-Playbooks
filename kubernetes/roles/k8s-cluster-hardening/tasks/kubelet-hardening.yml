---
# Kubelet Hardening Tasks
# STIG V-242424 through V-242433

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/kubelet-hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status: "running"
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_error: ""
    fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/kubelet-hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/kubelet-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/kubelet-hardening: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/kubelet-hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create kubelet configuration directory
      ansible.builtin.file:
        path: /var/lib/kubelet
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy hardened kubelet configuration
      ansible.builtin.template:
        src: kubelet-config.yaml.j2
        dest: /var/lib/kubelet/config.yaml
        owner: root
        group: root
        mode: '0600'
      notify: restart kubelet

    - name: Ensure kubelet service drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Apply kubelet security settings via drop-in
      ansible.builtin.template:
        src: 10-kubelet-hardening.conf.j2
        dest: /etc/systemd/system/kubelet.service.d/10-kubelet-hardening.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart kubelet

    - name: Disable kubelet read-only port (STIG V-242425)
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^readOnlyPort:'
        line: 'readOnlyPort: 0'
        create: false
      notify: restart kubelet

    - name: Enable kubelet certificate rotation
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^rotateCertificates:'
        line: 'rotateCertificates: true'
        create: false
      notify: restart kubelet

    - name: Set kubelet TLS cipher suites (STIG V-242426)
      ansible.builtin.blockinfile:
        path: /var/lib/kubelet/config.yaml
        marker: "# {mark} ANSIBLE MANAGED - TLS Configuration"
        block: |
          tlsCipherSuites:
          {% for cipher in k8s_tls_cipher_suites %}
            - {{ cipher }}
          {% endfor %}
        create: false
      notify: restart kubelet

    - name: Verify kubelet is using webhook authorization (STIG V-242428)
      ansible.builtin.command: >
        grep -q "authorization-mode=Webhook" /var/lib/kubelet/config.yaml ||
        grep -q "mode: Webhook" /var/lib/kubelet/config.yaml
      register: kubelet_webhook_auth
      changed_when: false
      failed_when: false

    - name: Set file permissions on kubelet config (STIG V-242451)
      ansible.builtin.file:
        path: /var/lib/kubelet/config.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Set file permissions on kubelet service file (STIG V-242452)
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
        owner: root
        group: root
        mode: '0644'
      failed_when: false

    - name: Ensure kubelet certificate files have correct permissions
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ k8s_kubelet_tls_cert_file }}"
        - "{{ k8s_kubelet_tls_private_key_file }}"
      when: item is exists
      failed_when: false

    - name: Display kubelet hardening status
      ansible.builtin.debug:
        msg:
          - "Kubelet hardening applied"
          - "Anonymous auth: {{ 'Disabled' if not k8s_kubelet_anonymous_auth else 'Enabled' }}"
          - "Authorization mode: {{ k8s_kubelet_authorization_mode }}"
          - "Read-only port: {{ k8s_kubelet_read_only_port }}"
          - "Protect kernel defaults: {{ 'Enabled' if k8s_kubelet_protect_kernel_defaults else 'Disabled' }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/kubelet-hardening: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/kubelet-hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/kubelet-hardening: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/kubelet-hardening failed at '{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/kubelet-hardening":
              component: "kubernetes/k8s-cluster-hardening/kubelet-hardening"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/kubelet-hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/kubelet-hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_kubelet_hardening_stats_published: true
      tags:
        - always
