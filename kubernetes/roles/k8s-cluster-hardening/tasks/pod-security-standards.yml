---
# Pod Security Standards (PSS) Configuration
# Replaces deprecated Pod Security Policies
# NIST SP 800-190 Container Security

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/pod-security-standards']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_pod_security_standards_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status: "running"
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_error: ""
    fe_kubernetes_k8s_cluster_hardening_pod_security_standards_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/pod-security-standards: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/pod-security-standards: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/pod-security-standards: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/pod-security-standards: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check Kubernetes version for PSS support
      ansible.builtin.assert:
        that:
          - k8s_server_version is version('v1.23', '>=')
        fail_msg: "Pod Security Standards require Kubernetes 1.23 or higher"
        success_msg: "Kubernetes version supports Pod Security Standards"

    - name: Apply Pod Security Standards labels to namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item.name }}"
            labels:
              pod-security.kubernetes.io/enforce: "{{ item.enforce | default(k8s_pod_security_standard) }}"
              pod-security.kubernetes.io/audit: "{{ item.audit | default(k8s_pod_security_standard) }}"
              pod-security.kubernetes.io/warn: "{{ item.warn | default(k8s_pod_security_standard) }}"
      loop:
        - { name: 'default', enforce: 'restricted' }
        - { name: 'kube-system', enforce: 'privileged' }
        - { name: 'kube-public', enforce: 'restricted' }
        - { name: 'kube-node-lease', enforce: 'restricted' }
      when: k8s_enforce_pod_security_standards | bool

    - name: Create restricted Pod Security Standard policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pod-security-standards-restricted
            namespace: kube-system
          data:
            description: |
              Restricted Pod Security Standard
              - No privilege escalation
              - Non-root containers
              - Seccomp, AppArmor, SELinux enforced
              - Capabilities dropped
              - Host namespaces denied

    - name: Deploy Pod Security admission configuration
      ansible.builtin.template:
        src: pod-security-admission-config.yaml.j2
        dest: /etc/kubernetes/pod-security-admission-config.yaml
        owner: root
        group: root
        mode: '0600'
      notify: restart kube-apiserver

    - name: Create baseline security context constraints
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: baseline-security-context
            namespace: kube-system
          data:
            securityContext: |
              securityContext:
                runAsNonRoot: true
                runAsUser: {{ k8s_security_context_defaults.run_as_user }}
                fsGroup: {{ k8s_security_context_defaults.fs_group }}
                seccompProfile:
                  type: {{ k8s_security_context_defaults.seccomp_profile.type }}
                capabilities:
                  drop:
                  {% for cap in k8s_security_context_defaults.drop_capabilities %}
                    - {{ cap }}
                  {% endfor %}

    - name: Verify Pod Security Standards are enforced
      ansible.builtin.shell: |
        kubectl get ns -o json | \
        jq -r '.items[] |
        select(.metadata.labels["pod-security.kubernetes.io/enforce"] != null) |
        .metadata.name + ": " + .metadata.labels["pod-security.kubernetes.io/enforce"]'
      register: pss_verification
      changed_when: false

    - name: Test restricted policy with sample pod
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: pss-test-pod
            namespace: default
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              fsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: test-container
                image: registry1.dso.mil/ironbank/opensource/nginx/nginx:1.23
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
      register: pss_test
      failed_when: false

    - name: Clean up test pod
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        name: pss-test-pod
        namespace: default
      when: pss_test is succeeded

    - name: Display Pod Security Standards status
      ansible.builtin.debug:
        msg:
          - "Pod Security Standards applied"
          - "Standard level: {{ k8s_pod_security_standard }}"
          - "Enforcement: {{ 'Enabled' if k8s_enforce_pod_security_standards else 'Disabled' }}"
          - "Protected namespaces: {{ k8s_protected_namespaces | length }}"
          - "Test pod deployment: {{ 'Successful' if pss_test is succeeded else 'Failed (expected for restrictive policies)' }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_pod_security_standards_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/pod-security-standards: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/pod-security-standards: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/pod-security-standards: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/pod-security-standards failed at '{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_pod_security_standards_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/pod-security-standards":
              component: "kubernetes/k8s-cluster-hardening/pod-security-standards"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_pod_security_standards_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_pod_security_standards_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/pod-security-standards'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/pod-security-standards | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_pod_security_standards_stats_published: true
      tags:
        - always
