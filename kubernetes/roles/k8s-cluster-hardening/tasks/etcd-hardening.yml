---
# ETCD Hardening Tasks
# STIG V-242434 through V-242437

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/etcd-hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_etcd_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status: "running"
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_error: ""
    fe_kubernetes_k8s_cluster_hardening_etcd_hardening_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/etcd-hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/etcd-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/etcd-hardening: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/etcd-hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if etcd is running on this node
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/etcd.yaml
      register: etcd_manifest

    - name: ETCD hardening tasks
      when: etcd_manifest.stat.exists
      block:
        - name: Ensure etcd data directory exists with correct permissions
          ansible.builtin.file:
            path: /var/lib/etcd
            state: directory
            owner: etcd
            group: etcd
            mode: '0700'
          failed_when: false

        - name: Set file permissions on etcd configuration (STIG V-242453)
          ansible.builtin.file:
            path: /etc/kubernetes/manifests/etcd.yaml
            owner: root
            group: root
            mode: '0600'

        - name: Set file permissions on etcd certificates (STIG V-242434)
          ansible.builtin.file:
            path: "{{ item }}"
            owner: root
            group: root
            mode: '0600'
          loop:
            - "{{ k8s_etcd_cert_file }}"
            - "{{ k8s_etcd_key_file }}"
            - /etc/kubernetes/pki/etcd/ca.crt
            - /etc/kubernetes/pki/etcd/ca.key
          when: item is exists
          failed_when: false

        - name: Read current etcd manifest
          ansible.builtin.slurp:
            src: /etc/kubernetes/manifests/etcd.yaml
          register: etcd_current

        - name: Parse etcd manifest
          ansible.builtin.set_fact:
            etcd_config: "{{ etcd_current.content | b64decode | from_yaml }}"

        - name: Verify etcd client cert auth is enabled (STIG V-242435)
          ansible.builtin.assert:
            that:
              - "'--client-cert-auth=true' in etcd_config.spec.containers[0].command | default([])"
            fail_msg: "ETCD client certificate authentication must be enabled"
            success_msg: "ETCD client cert auth is properly configured"
          failed_when: false

        - name: Verify etcd peer client cert auth is enabled (STIG V-242436)
          ansible.builtin.assert:
            that:
              - "'--peer-client-cert-auth=true' in etcd_config.spec.containers[0].command | default([])"
            fail_msg: "ETCD peer client certificate authentication must be enabled"
            success_msg: "ETCD peer client cert auth is properly configured"
          failed_when: false

        - name: Verify etcd auto-tls is disabled (STIG V-242437)
          ansible.builtin.shell: |
            grep -q "auto-tls=false" /etc/kubernetes/manifests/etcd.yaml && \
            grep -q "peer-auto-tls=false" /etc/kubernetes/manifests/etcd.yaml
          register: etcd_autotls
          changed_when: false
          failed_when: false

        - name: Check etcd encryption
          ansible.builtin.command: >
            kubectl get secrets --all-namespaces -o json
          register: etcd_secrets
          changed_when: false
          failed_when: false

        - name: Display etcd hardening status
          ansible.builtin.debug:
            msg:
              - "ETCD hardening applied"
              - "Client cert auth: {{ 'Enabled' if k8s_etcd_client_cert_auth else 'Disabled' }}"
              - "Peer cert auth: {{ 'Enabled' if k8s_etcd_peer_client_cert_auth else 'Disabled' }}"
              - "Auto TLS: {{ 'Disabled' if not k8s_etcd_auto_tls else 'Enabled' }}"

    - name: Display etcd not found message
      ansible.builtin.debug:
        msg: "ETCD manifest not found on this node - skipping ETCD hardening"
      when: not etcd_manifest.stat.exists

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_etcd_hardening_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/etcd-hardening: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/etcd-hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/etcd-hardening: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/etcd-hardening failed at '{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_etcd_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/etcd-hardening":
              component: "kubernetes/k8s-cluster-hardening/etcd-hardening"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_etcd_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_etcd_hardening_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/etcd-hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/etcd-hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_etcd_hardening_stats_published: true
      tags:
        - always
