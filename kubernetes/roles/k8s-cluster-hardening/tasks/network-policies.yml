---
# Network Policy Configuration
# NIST SP 800-190 - Network Segmentation and Isolation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-cluster-hardening/network-policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_hardening_network_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-cluster-hardening/network-policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_hardening_network_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_hardening_network_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_hardening_network_policies_status: "running"
    fe_kubernetes_k8s_cluster_hardening_network_policies_preflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_network_policies_postflight_passed: false
    fe_kubernetes_k8s_cluster_hardening_network_policies_failed_task: ""
    fe_kubernetes_k8s_cluster_hardening_network_policies_error: ""
    fe_kubernetes_k8s_cluster_hardening_network_policies_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-cluster-hardening/network-policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/network-policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-cluster-hardening/network-policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-cluster-hardening/network-policies: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-cluster-hardening/network-policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_network_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Verify network policy provider is installed
      ansible.builtin.command: >
        kubectl get pods -n kube-system -l k8s-app={{ k8s_network_policy_provider }}
      register: network_provider_check
      changed_when: false
      failed_when: false

    - name: Deploy default deny-all network policy for namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny-all
            namespace: "{{ item }}"
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
      loop:
        - default
        - kube-public
      when: k8s_default_network_policy_enabled | bool

    - name: Create allow-dns network policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-dns
            namespace: "{{ item }}"
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
      loop:
        - default
        - kube-public
      when: k8s_default_network_policy_enabled | bool

    - name: Create allow-to-apiserver network policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-to-apiserver
            namespace: "{{ item }}"
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector: {}
                ports:
                  - protocol: TCP
                    port: 6443
      loop:
        - default
      when: k8s_default_network_policy_enabled | bool

    - name: Protect kube-system namespace with network policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: kube-system-deny-ingress
            namespace: kube-system
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        name: kube-system

    - name: Verify network policies are applied
      ansible.builtin.command: >
        kubectl get networkpolicies --all-namespaces
      register: netpol_verification
      changed_when: false

    - name: Display network policy status
      ansible.builtin.debug:
        msg:
          - "Network policies configured"
          - "Provider: {{ k8s_network_policy_provider }}"
          - "Default deny-all: {{ 'Enabled' if k8s_default_network_policy_enabled else 'Disabled' }}"
          - "DNS access: Allowed"
          - "API server access: Allowed"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_hardening_network_policies_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_hardening_network_policies_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-cluster-hardening/network-policies: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_hardening_network_policies_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_hardening_network_policies_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-cluster-hardening/network-policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_network_policies_postflight_passed: true
        fe_kubernetes_k8s_cluster_hardening_network_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_network_policies_status: "failed"
        fe_kubernetes_k8s_cluster_hardening_network_policies_postflight_passed: false
        fe_kubernetes_k8s_cluster_hardening_network_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_hardening_network_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-cluster-hardening/network-policies: FAILED at '{{ fe_kubernetes_k8s_cluster_hardening_network_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_hardening_network_policies_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-cluster-hardening/network-policies failed at '{{ fe_kubernetes_k8s_cluster_hardening_network_policies_failed_task }}': {{ fe_kubernetes_k8s_cluster_hardening_network_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_network_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_hardening_network_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_hardening_network_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-cluster-hardening/network-policies":
              component: "kubernetes/k8s-cluster-hardening/network-policies"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_hardening_network_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_hardening_network_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_hardening_network_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_hardening_network_policies_status | default('') == 'succeeded' else ['kubernetes/k8s-cluster-hardening/network-policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-cluster-hardening/network-policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_hardening_network_policies_stats_published: true
      tags:
        - always
