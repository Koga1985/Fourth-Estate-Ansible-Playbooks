---
# Main tasks for secrets management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-secrets-management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_secrets_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-secrets-management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_secrets_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_secrets_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_secrets_management_status: "running"
    fe_kubernetes_k8s_secrets_management_preflight_passed: false
    fe_kubernetes_k8s_secrets_management_postflight_passed: false
    fe_kubernetes_k8s_secrets_management_failed_task: ""
    fe_kubernetes_k8s_secrets_management_error: ""
    fe_kubernetes_k8s_secrets_management_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-secrets-management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-secrets-management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-secrets-management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-secrets-management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-secrets-management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-secrets-management: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-secrets-management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_secrets_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-secrets-management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_secrets_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Verify encryption at rest is enabled
      ansible.builtin.stat:
        path: /etc/kubernetes/encryption-config.yaml
      register: encryption_config
      failed_when:
        - k8s_secrets_encryption_enabled | bool
        - not encryption_config.stat.exists
      tags:
        - validation

    - name: Create generic secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default('default') }}"
          type: "{{ item.type | default('Opaque') }}"
          data: "{{ item.data }}"
      loop: "{{ k8s_secrets }}"
      when: k8s_secrets | length > 0
      no_log: true
      tags:
        - secrets

    - name: Create Docker registry secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default('default') }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ lookup('template', 'docker-config.json.j2') | b64encode }}"
      loop: "{{ k8s_image_pull_secrets }}"
      when: k8s_image_pull_secrets | length > 0
      no_log: true
      tags:
        - secrets
        - image-pull

    - name: Create TLS secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default('default') }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', item.cert_path) | b64encode }}"
            tls.key: "{{ lookup('file', item.key_path) | b64encode }}"
      loop: "{{ k8s_tls_secrets }}"
      when: k8s_tls_secrets | length > 0
      no_log: true
      tags:
        - secrets
        - tls

    - name: Scan for exposed secrets in ConfigMaps
      ansible.builtin.shell: |
        kubectl get configmaps --all-namespaces -o json | \
        jq -r '.items[] | select(.data | to_entries[] | .value | test("password|secret|key|token"; "i")) |
        .metadata.namespace + "/" + .metadata.name'
      register: exposed_secrets
      changed_when: false
      failed_when: false
      when: k8s_scan_for_exposed_secrets | bool
      tags:
        - audit

    - name: Warn about potential exposed secrets
      ansible.builtin.debug:
        msg: "WARNING: Potential secrets found in ConfigMaps: {{ exposed_secrets.stdout_lines }}"
      when:
        - k8s_scan_for_exposed_secrets | bool
        - exposed_secrets.stdout_lines | length > 0
      tags:
        - audit

    - name: Create RBAC for secret access restriction
      when: k8s_restrict_secret_access | bool
      block:
        - name: Create role for secret read-only access
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: secret-reader
                namespace: "{{ item.name }}"
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "list"]
          loop: "{{ k8s_namespaces | default([]) }}"
      tags:
        - rbac

    - name: Audit secret access
      ansible.builtin.shell: |
        kubectl get secrets --all-namespaces -o json | \
        jq -r '.items | length'
      register: total_secrets
      changed_when: false
      when: k8s_audit_secret_access | bool
      tags:
        - audit

    - name: Display secrets management summary
      ansible.builtin.debug:
        msg:
          - "Secrets management complete"
          - "Encryption at rest: {{ 'Enabled' if encryption_config.stat.exists else 'Disabled' }}"
          - "Total secrets in cluster: {{ total_secrets.stdout | default('N/A') }}"
          - "Secrets created: {{ k8s_secrets | length }}"
          - "Image pull secrets: {{ k8s_image_pull_secrets | length }}"
          - "TLS secrets: {{ k8s_tls_secrets | length }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-secrets-management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_secrets_management_preflight_passed | bool
          - fe_kubernetes_k8s_secrets_management_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-secrets-management: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_secrets_management_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_secrets_management_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-secrets-management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-secrets-management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_secrets_management_postflight_passed: true
        fe_kubernetes_k8s_secrets_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-secrets-management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_secrets_management_status: "failed"
        fe_kubernetes_k8s_secrets_management_postflight_passed: false
        fe_kubernetes_k8s_secrets_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_secrets_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-secrets-management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-secrets-management: FAILED at '{{ fe_kubernetes_k8s_secrets_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_secrets_management_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-secrets-management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-secrets-management failed at '{{ fe_kubernetes_k8s_secrets_management_failed_task }}': {{ fe_kubernetes_k8s_secrets_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-secrets-management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_secrets_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_secrets_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_secrets_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-secrets-management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-secrets-management":
              component: "kubernetes/k8s-secrets-management"
              type: "role"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_secrets_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_secrets_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_secrets_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_secrets_management_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_secrets_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_secrets_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_secrets_management_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_secrets_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_secrets_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_secrets_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_secrets_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_secrets_management_status | default('') == 'succeeded' else ['kubernetes/k8s-secrets-management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-secrets-management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_secrets_management_stats_published: true
      tags:
        - always
