---
# Pre-flight checks for Kubernetes installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/preflight']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_preflight_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/preflight | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_preflight_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_preflight_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_preflight_status: "running"
    fe_kubernetes_k8s_cluster_install_preflight_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_preflight_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_preflight_failed_task: ""
    fe_kubernetes_k8s_cluster_install_preflight_error: ""
    fe_kubernetes_k8s_cluster_install_preflight_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/preflight | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/preflight | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/preflight: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/preflight: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/preflight | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/preflight: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/preflight: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_preflight_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/preflight | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_preflight_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check OS compatibility
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['RedHat', 'Debian']
          - ansible_distribution_major_version | int >= 8
        fail_msg: "Unsupported OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
        success_msg: "OS compatibility check passed"

    - name: Check minimum hardware requirements
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb >= 2048
          - ansible_processor_vcpus >= 2
        fail_msg: "Insufficient hardware resources. Need at least 2 CPUs and 2GB RAM"
        success_msg: "Hardware requirements met"

    - name: Check disk space for control plane nodes
      ansible.builtin.assert:
        that:
          - ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first > 20 * 1024 * 1024 * 1024
        fail_msg: "Insufficient disk space. Control plane nodes need at least 20GB available"
        success_msg: "Disk space check passed"
      when: inventory_hostname in groups['k8s_control_plane']

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*([^#\s]+\s+){1}(\S+\s+){1}swap\s+'
        state: absent

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }
        - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
        - { name: 'vm.overcommit_memory', value: '1' }
        - { name: 'kernel.panic', value: '10' }
        - { name: 'kernel.panic_on_oops', value: '1' }

    - name: Disable SELinux (if present and required)
      ansible.posix.selinux:
        state: permissive
        policy: targeted
      when:
        - ansible_selinux is defined
        - ansible_selinux.status == 'enabled'

    - name: Configure firewalld for Kubernetes (RedHat)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - "6443/tcp"      # API server
        - "2379-2380/tcp" # etcd
        - "10250/tcp"     # Kubelet
        - "10251/tcp"     # Scheduler
        - "10252/tcp"     # Controller Manager
        - "10255/tcp"     # Read-only Kubelet
      when:
        - ansible_os_family == 'RedHat'
        - inventory_hostname in groups['k8s_control_plane']
      ignore_errors: true

    - name: Configure firewalld for worker nodes (RedHat)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - "10250/tcp"     # Kubelet
        - "30000-32767/tcp" # NodePort services
      when:
        - ansible_os_family == 'RedHat'
        - inventory_hostname in groups['k8s_workers']
      ignore_errors: true

    - name: Ensure /etc/hosts has all cluster nodes
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_default_ipv4.address }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_control_plane'] + groups['k8s_workers'] }}"

    - name: Create Kubernetes directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/kubernetes
        - /etc/kubernetes/pki
        - /etc/kubernetes/manifests
        - /var/lib/kubelet
        - /var/log/kubernetes

    - name: Check if cluster already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Set initialization flag
      ansible.builtin.set_fact:
        k8s_cluster_initialized: "{{ k8s_admin_conf.stat.exists }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/preflight | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_preflight_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_preflight_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/preflight: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_preflight_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_preflight_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/preflight: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/preflight | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_preflight_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_preflight_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/preflight | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_preflight_status: "failed"
        fe_kubernetes_k8s_cluster_install_preflight_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_preflight_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_preflight_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/preflight | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/preflight: FAILED at '{{ fe_kubernetes_k8s_cluster_install_preflight_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_preflight_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/preflight | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/preflight failed at '{{ fe_kubernetes_k8s_cluster_install_preflight_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_preflight_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/preflight | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_preflight_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_preflight_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_preflight_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/preflight | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/preflight":
              component: "kubernetes/k8s_cluster_install/preflight"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_preflight_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_preflight_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_preflight_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_preflight_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_preflight_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_preflight_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_preflight_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_preflight_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_preflight_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_preflight_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_preflight_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_preflight_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/preflight'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/preflight | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_preflight_stats_published: true
      tags:
        - always
