---
# Initialize the first control plane node

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/init_control_plane']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_init_control_plane_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/init_control_plane | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_init_control_plane_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_init_control_plane_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_init_control_plane_status: "running"
    fe_kubernetes_k8s_cluster_install_init_control_plane_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_init_control_plane_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_init_control_plane_failed_task: ""
    fe_kubernetes_k8s_cluster_install_init_control_plane_error: ""
    fe_kubernetes_k8s_cluster_install_init_control_plane_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/init_control_plane | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/init_control_plane: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/init_control_plane: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/init_control_plane: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/init_control_plane: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_init_control_plane_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Skip if cluster already initialized
      when: k8s_cluster_initialized | bool
      block:
        - name: Display skip message
          ansible.builtin.debug:
            msg: "Cluster already initialized, skipping initialization"
        - name: End play for this host
          ansible.builtin.meta: end_host

    - name: Generate kubeadm config file
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: '0600'

    - name: Pull Kubernetes images
      ansible.builtin.command: kubeadm config images pull --config /etc/kubernetes/kubeadm-config.yaml
      changed_when: true
      register: image_pull

    - name: Initialize first control plane node
      ansible.builtin.command: >
        kubeadm init
        --config /etc/kubernetes/kubeadm-config.yaml
        --upload-certs
        {{ k8s_kubeadm_init_extra_args }}
      register: kubeadm_init
      changed_when: true
      retries: 3
      delay: 10
      until: kubeadm_init.rc == 0

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Copy admin.conf to root's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    - name: Extract certificate key from init output
      ansible.builtin.set_fact:
        k8s_certificate_key: "{{ kubeadm_init.stdout | regex_search('--certificate-key ([a-f0-9]+)', '\\1') | first }}"
      when: kubeadm_init.stdout is defined

    - name: Extract join command for workers
      ansible.builtin.set_fact:
        k8s_join_command: "{{ kubeadm_init.stdout_lines | select('search', 'kubeadm join') | first | trim }}"
      when: kubeadm_init.stdout_lines is defined

    - name: Extract discovery token ca cert hash
      ansible.builtin.set_fact:
        k8s_discovery_token_ca_cert_hash: "{{ kubeadm_init.stdout | regex_search('--discovery-token-ca-cert-hash (sha256:[a-f0-9]+)', '\\1') | first }}"
      when: kubeadm_init.stdout is defined

    - name: Save join command to file
      ansible.builtin.copy:
        content: |
          # Worker join command
          {{ k8s_join_command }}

          # Control plane join command
          {{ k8s_join_command }} --control-plane --certificate-key {{ k8s_certificate_key }}
        dest: /etc/kubernetes/join-command.sh
        mode: '0600'

    - name: Create certificate expiration check script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Check certificate expiration
          kubeadm certs check-expiration
        dest: /usr/local/bin/check-k8s-certs.sh
        mode: '0755'

    - name: Configure certificate auto-renewal cron job
      ansible.builtin.cron:
        name: "Kubernetes certificate auto-renewal"
        minute: "0"
        hour: "2"
        day: "1"
        month: "*"
        job: "/usr/local/bin/kubeadm certs renew all && systemctl restart kubelet"
        user: root
      when: k8s_cert_auto_renew | bool

    - name: Wait for API server to be ready
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 6443
        timeout: 300

    - name: Wait for control plane pods to be ready
      ansible.builtin.command: >
        kubectl get pods -n kube-system
        -l tier=control-plane
        -o jsonpath='{.items[*].status.phase}'
      register: control_plane_status
      until: control_plane_status.stdout.split() | select('match', '^Running$') | list | length >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: Get cluster info
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Display cluster information
      ansible.builtin.debug:
        msg: "{{ cluster_info.stdout_lines }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_init_control_plane_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_init_control_plane_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/init_control_plane: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_init_control_plane_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_init_control_plane_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/init_control_plane: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_init_control_plane_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_init_control_plane_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_init_control_plane_status: "failed"
        fe_kubernetes_k8s_cluster_install_init_control_plane_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_init_control_plane_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_init_control_plane_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/init_control_plane: FAILED at '{{ fe_kubernetes_k8s_cluster_install_init_control_plane_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_init_control_plane_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/init_control_plane failed at '{{ fe_kubernetes_k8s_cluster_install_init_control_plane_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_init_control_plane_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_init_control_plane_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_init_control_plane_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_init_control_plane_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/init_control_plane":
              component: "kubernetes/k8s_cluster_install/init_control_plane"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_init_control_plane_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_init_control_plane_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_init_control_plane_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_init_control_plane_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/init_control_plane'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/init_control_plane | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_init_control_plane_stats_published: true
      tags:
        - always
