---
# Install Kubernetes packages (kubeadm, kubelet, kubectl)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/install_packages']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_install_packages_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/install_packages | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_install_packages_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_install_packages_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_install_packages_status: "running"
    fe_kubernetes_k8s_cluster_install_install_packages_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_install_packages_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_install_packages_failed_task: ""
    fe_kubernetes_k8s_cluster_install_install_packages_error: ""
    fe_kubernetes_k8s_cluster_install_install_packages_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/install_packages | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/install_packages | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/install_packages: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/install_packages: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/install_packages | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/install_packages: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/install_packages: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_install_packages_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/install_packages | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_install_packages_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Add Kubernetes GPG key (Debian)
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add Kubernetes repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        state: present
        filename: kubernetes
      when: ansible_os_family == 'Debian'

    - name: Install Kubernetes packages (Debian)
      ansible.builtin.apt:
        name:
          - "kubelet={{ k8s_version }}-*"
          - "kubeadm={{ k8s_version }}-*"
          - "kubectl={{ k8s_version }}-*"
        state: present
        update_cache: true
        allow_change_held_packages: true
      when: ansible_os_family == 'Debian'

    - name: Hold Kubernetes packages at current version (Debian)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      when: ansible_os_family == 'Debian'

    - name: Add Kubernetes repository (RedHat)
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes Repository
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.28/rpm/repodata/repomd.xml.key
        exclude:
          - kubelet
          - kubeadm
          - kubectl
      when: ansible_os_family == 'RedHat'

    - name: Install Kubernetes packages (RedHat)
      ansible.builtin.yum:
        name:
          - "kubelet-{{ k8s_version }}"
          - "kubeadm-{{ k8s_version }}"
          - "kubectl-{{ k8s_version }}"
        state: present
        disable_excludes: kubernetes
      when: ansible_os_family == 'RedHat'

    - name: Create kubelet configuration directory
      ansible.builtin.file:
        path: /var/lib/kubelet
        state: directory
        mode: '0755'

    - name: Configure kubelet extra args
      ansible.builtin.template:
        src: kubelet-extra-args.j2
        dest: /etc/default/kubelet
        mode: '0644'
      notify: Restart kubelet

    - name: Enable kubelet service (do not start yet)
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        daemon_reload: true

    - name: Verify kubeadm installation
      ansible.builtin.command: kubeadm version
      changed_when: false
      register: kubeadm_version

    - name: Display kubeadm version
      ansible.builtin.debug:
        msg: "{{ kubeadm_version.stdout }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/install_packages | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_install_packages_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_install_packages_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/install_packages: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_install_packages_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_install_packages_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/install_packages: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/install_packages | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_install_packages_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_install_packages_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/install_packages | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_install_packages_status: "failed"
        fe_kubernetes_k8s_cluster_install_install_packages_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_install_packages_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_install_packages_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/install_packages | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/install_packages: FAILED at '{{ fe_kubernetes_k8s_cluster_install_install_packages_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_install_packages_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/install_packages | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/install_packages failed at '{{ fe_kubernetes_k8s_cluster_install_install_packages_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_install_packages_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/install_packages | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_install_packages_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_install_packages_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_install_packages_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/install_packages | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/install_packages":
              component: "kubernetes/k8s_cluster_install/install_packages"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_install_packages_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_install_packages_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_install_packages_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_install_packages_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_install_packages_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_install_packages_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_install_packages_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_install_packages_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_install_packages_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_install_packages_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_install_packages_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_install_packages_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/install_packages'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/install_packages | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_install_packages_stats_published: true
      tags:
        - always
