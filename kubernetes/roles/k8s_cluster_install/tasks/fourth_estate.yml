---
# Fourth Estate specific cluster configuration (run on the first control-plane node).
# Creates a dedicated namespace and enforces the restricted Pod Security Standards
# baseline expected for Fourth Estate workloads.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/fourth_estate']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_fourth_estate_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/fourth_estate | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_fourth_estate_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_fourth_estate_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_fourth_estate_status: "running"
    fe_kubernetes_k8s_cluster_install_fourth_estate_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_fourth_estate_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_fourth_estate_failed_task: ""
    fe_kubernetes_k8s_cluster_install_fourth_estate_error: ""
    fe_kubernetes_k8s_cluster_install_fourth_estate_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/fourth_estate | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/fourth_estate: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/fourth_estate: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/fourth_estate: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/fourth_estate: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_fourth_estate_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Render Fourth Estate namespace manifest
      ansible.builtin.command: >-
        kubectl create namespace {{ k8s_fourth_estate_namespace | default('fourth-estate') }}
        --dry-run=client -o yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: _fe_ns_manifest
      changed_when: false

    - name: Apply Fourth Estate namespace
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ _fe_ns_manifest.stdout }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: _fe_ns_apply
      changed_when: >-
        'created' in _fe_ns_apply.stdout or 'configured' in _fe_ns_apply.stdout

    - name: Enforce restricted Pod Security Standards on the namespace
      ansible.builtin.command:
        cmd: >-
          kubectl label namespace {{ k8s_fourth_estate_namespace | default('fourth-estate') }}
          pod-security.kubernetes.io/enforce=restricted
          pod-security.kubernetes.io/audit=restricted
          pod-security.kubernetes.io/warn=restricted
          --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: _fe_psa
      changed_when: "'labeled' in _fe_psa.stdout"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_fourth_estate_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_fourth_estate_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/fourth_estate: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_fourth_estate_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_fourth_estate_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/fourth_estate: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_fourth_estate_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_fourth_estate_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_fourth_estate_status: "failed"
        fe_kubernetes_k8s_cluster_install_fourth_estate_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_fourth_estate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_fourth_estate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/fourth_estate: FAILED at '{{ fe_kubernetes_k8s_cluster_install_fourth_estate_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_fourth_estate_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/fourth_estate failed at '{{ fe_kubernetes_k8s_cluster_install_fourth_estate_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_fourth_estate_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_fourth_estate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_fourth_estate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_fourth_estate_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/fourth_estate":
              component: "kubernetes/k8s_cluster_install/fourth_estate"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_fourth_estate_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_fourth_estate_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_fourth_estate_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_fourth_estate_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/fourth_estate'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/fourth_estate | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_fourth_estate_stats_published: true
      tags:
        - always
