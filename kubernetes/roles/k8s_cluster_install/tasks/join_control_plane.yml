---
# Join additional control-plane nodes to the cluster.
# Uses the join command and certificate key produced by init_control_plane.yml
# on the first control-plane node (exposed via hostvars).

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/join_control_plane']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_join_control_plane_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/join_control_plane | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_join_control_plane_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_join_control_plane_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_join_control_plane_status: "running"
    fe_kubernetes_k8s_cluster_install_join_control_plane_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_join_control_plane_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_join_control_plane_failed_task: ""
    fe_kubernetes_k8s_cluster_install_join_control_plane_error: ""
    fe_kubernetes_k8s_cluster_install_join_control_plane_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/join_control_plane | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/join_control_plane: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/join_control_plane: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/join_control_plane: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/join_control_plane: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_join_control_plane_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set first control-plane host
      ansible.builtin.set_fact:
        _k8s_first_cp: "{{ groups['k8s_control_plane'][0] }}"

    - name: Build control-plane join command
      ansible.builtin.set_fact:
        _k8s_cp_join_command: >-
          {{ hostvars[_k8s_first_cp].k8s_join_command }}
          --control-plane --certificate-key {{ hostvars[_k8s_first_cp].k8s_certificate_key }}
      when:
        - hostvars[_k8s_first_cp].k8s_join_command is defined
        - hostvars[_k8s_first_cp].k8s_certificate_key is defined

    - name: Fail clearly if the join command is unavailable
      ansible.builtin.fail:
        msg: >-
          No join command / certificate-key found on {{ _k8s_first_cp }}.
          Ensure init_control_plane.yml ran successfully on the first control-plane node.
      when: _k8s_cp_join_command is not defined

    - name: Check whether this node has already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: _k8s_kubelet_conf

    - name: Join node to the cluster as a control-plane node
      ansible.builtin.command: "{{ _k8s_cp_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: _k8s_cp_join
      changed_when: _k8s_cp_join.rc == 0
      when: not _k8s_kubelet_conf.stat.exists

    - name: Ensure root kube config directory exists
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Install admin kubeconfig for kubectl
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_join_control_plane_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_join_control_plane_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/join_control_plane: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_join_control_plane_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_join_control_plane_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/join_control_plane: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_join_control_plane_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_join_control_plane_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_join_control_plane_status: "failed"
        fe_kubernetes_k8s_cluster_install_join_control_plane_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_join_control_plane_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_join_control_plane_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/join_control_plane: FAILED at '{{ fe_kubernetes_k8s_cluster_install_join_control_plane_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_join_control_plane_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/join_control_plane failed at '{{ fe_kubernetes_k8s_cluster_install_join_control_plane_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_join_control_plane_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_join_control_plane_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_join_control_plane_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_join_control_plane_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/join_control_plane":
              component: "kubernetes/k8s_cluster_install/join_control_plane"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_join_control_plane_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_join_control_plane_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_join_control_plane_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_join_control_plane_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/join_control_plane'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/join_control_plane | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_join_control_plane_stats_published: true
      tags:
        - always
