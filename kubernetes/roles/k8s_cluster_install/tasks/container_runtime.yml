---
# Container Runtime (containerd) installation and configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_cluster_install/container_runtime']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_cluster_install_container_runtime_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_cluster_install/container_runtime | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_cluster_install_container_runtime_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_cluster_install_container_runtime_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_cluster_install_container_runtime_status: "running"
    fe_kubernetes_k8s_cluster_install_container_runtime_preflight_passed: false
    fe_kubernetes_k8s_cluster_install_container_runtime_postflight_passed: false
    fe_kubernetes_k8s_cluster_install_container_runtime_failed_task: ""
    fe_kubernetes_k8s_cluster_install_container_runtime_error: ""
    fe_kubernetes_k8s_cluster_install_container_runtime_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_cluster_install/container_runtime | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_cluster_install/container_runtime | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_cluster_install/container_runtime: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_cluster_install/container_runtime: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/container_runtime | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_cluster_install/container_runtime: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_cluster_install/container_runtime: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_cluster_install/container_runtime | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_container_runtime_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install containerd dependencies (Debian)
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Add Docker GPG key (Debian)
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (Debian)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install containerd (Debian)
      ansible.builtin.apt:
        name: "containerd.io={{ k8s_containerd_version }}-1"
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install containerd dependencies (RedHat)
      ansible.builtin.yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Add Docker repository (RedHat)
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: true
      when: ansible_os_family == 'RedHat'

    - name: Install containerd (RedHat)
      ansible.builtin.yum:
        name: "containerd.io-{{ k8s_containerd_version }}"
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: "{{ k8s_containerd_config_dir }}"
        state: directory
        mode: '0755'

    - name: Generate default containerd configuration
      ansible.builtin.shell: containerd config default > {{ k8s_containerd_config_dir }}/config.toml
      args:
        creates: "{{ k8s_containerd_config_dir }}/config.toml"

    - name: Configure containerd to use systemd cgroup driver
      ansible.builtin.lineinfile:
        path: "{{ k8s_containerd_config_dir }}/config.toml"
        regexp: '^\s*SystemdCgroup\s*='
        line: '            SystemdCgroup = true'
        insertafter: '.*\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\]'

    - name: Configure containerd sandbox image
      ansible.builtin.lineinfile:
        path: "{{ k8s_containerd_config_dir }}/config.toml"
        regexp: '^\s*sandbox_image\s*='
        line: '    sandbox_image = "registry.k8s.io/pause:3.9"'

    - name: Configure containerd registry mirrors
      ansible.builtin.blockinfile:
        path: "{{ k8s_containerd_config_dir }}/config.toml"
        marker: "# {mark} ANSIBLE MANAGED REGISTRY MIRRORS"
        insertafter: '^\[plugins."io.containerd.grpc.v1.cri".registry\]'
        block: |
          {% if k8s_airgap_mode | bool and k8s_airgap_registry %}
            [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
                endpoint = ["https://{{ k8s_airgap_registry }}"]
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
                endpoint = ["https://{{ k8s_airgap_registry }}"]
            [plugins."io.containerd.grpc.v1.cri".registry.configs]
              [plugins."io.containerd.grpc.v1.cri".registry.configs."{{ k8s_airgap_registry }}".tls]
                insecure_skip_verify = false
          {% endif %}
      when: k8s_airgap_mode | bool

    - name: Create containerd service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/containerd.service.d
        state: directory
        mode: '0755'

    - name: Configure containerd service limits
      ansible.builtin.copy:
        content: |
          [Service]
          LimitNOFILE=1048576
          LimitNPROC=infinity
          LimitCORE=infinity
          TasksMax=infinity
          Delegate=yes
          KillMode=process
        dest: /etc/systemd/system/containerd.service.d/override.conf
        mode: '0644'
      notify: Restart containerd

    - name: Enable and start containerd service
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started
        daemon_reload: true

    - name: Install crictl tool
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.28.0/crictl-v1.28.0-linux-amd64.tar.gz"
        dest: /tmp/crictl.tar.gz
        mode: '0644'

    - name: Extract crictl
      ansible.builtin.unarchive:
        src: /tmp/crictl.tar.gz
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/crictl

    - name: Configure crictl to use containerd
      ansible.builtin.copy:
        content: |
          runtime-endpoint: unix://{{ k8s_containerd_socket }}
          image-endpoint: unix://{{ k8s_containerd_socket }}
          timeout: 10
          debug: false
        dest: /etc/crictl.yaml
        mode: '0644'

    - name: Verify containerd is running
      ansible.builtin.command: crictl info
      changed_when: false
      register: crictl_info

    - name: Display containerd info
      ansible.builtin.debug:
        msg: "Containerd is running successfully"
      when: crictl_info.rc == 0

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_cluster_install/container_runtime | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_cluster_install_container_runtime_preflight_passed | bool
          - fe_kubernetes_k8s_cluster_install_container_runtime_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_cluster_install/container_runtime: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_cluster_install_container_runtime_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_cluster_install_container_runtime_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_cluster_install/container_runtime: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_cluster_install/container_runtime | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_container_runtime_postflight_passed: true
        fe_kubernetes_k8s_cluster_install_container_runtime_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_cluster_install/container_runtime | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_container_runtime_status: "failed"
        fe_kubernetes_k8s_cluster_install_container_runtime_postflight_passed: false
        fe_kubernetes_k8s_cluster_install_container_runtime_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_cluster_install_container_runtime_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/container_runtime | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_cluster_install/container_runtime: FAILED at '{{ fe_kubernetes_k8s_cluster_install_container_runtime_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_cluster_install_container_runtime_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_cluster_install/container_runtime | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_cluster_install/container_runtime failed at '{{ fe_kubernetes_k8s_cluster_install_container_runtime_failed_task }}': {{ fe_kubernetes_k8s_cluster_install_container_runtime_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_cluster_install/container_runtime | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_container_runtime_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_cluster_install_container_runtime_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_cluster_install_container_runtime_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/container_runtime | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_cluster_install/container_runtime":
              component: "kubernetes/k8s_cluster_install/container_runtime"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_cluster_install_container_runtime_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_cluster_install_container_runtime_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_cluster_install_container_runtime_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_cluster_install_container_runtime_status | default('') == 'succeeded' else ['kubernetes/k8s_cluster_install/container_runtime'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_cluster_install/container_runtime | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_cluster_install_container_runtime_stats_published: true
      tags:
        - always
