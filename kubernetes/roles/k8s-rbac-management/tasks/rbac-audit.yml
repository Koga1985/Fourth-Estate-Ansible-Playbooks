---
# RBAC Audit and Compliance Checks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s-rbac-management/rbac-audit']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_rbac_management_rbac_audit_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s-rbac-management/rbac-audit | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_rbac_management_rbac_audit_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_rbac_management_rbac_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_rbac_management_rbac_audit_status: "running"
    fe_kubernetes_k8s_rbac_management_rbac_audit_preflight_passed: false
    fe_kubernetes_k8s_rbac_management_rbac_audit_postflight_passed: false
    fe_kubernetes_k8s_rbac_management_rbac_audit_failed_task: ""
    fe_kubernetes_k8s_rbac_management_rbac_audit_error: ""
    fe_kubernetes_k8s_rbac_management_rbac_audit_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s-rbac-management/rbac-audit | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s-rbac-management/rbac-audit: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s-rbac-management/rbac-audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s-rbac-management/rbac-audit: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s-rbac-management/rbac-audit: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_rbac_management_rbac_audit_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get all role bindings
      ansible.builtin.command: >
        kubectl get rolebindings --all-namespaces -o json
      register: all_rolebindings
      changed_when: false

    - name: Get all cluster role bindings
      ansible.builtin.command: >
        kubectl get clusterrolebindings -o json
      register: all_clusterrolebindings
      changed_when: false

    - name: Find bindings with system:masters group
      ansible.builtin.shell: |
        kubectl get clusterrolebindings -o json | \
        jq -r '.items[] | select(.subjects[]?.name == "system:masters") | .metadata.name'
      register: system_masters_bindings
      changed_when: false
      failed_when: false

    - name: Warn about system:masters usage
      ansible.builtin.debug:
        msg: "WARNING: Found {{ system_masters_bindings.stdout_lines | length }} bindings using system:masters group"
      when: system_masters_bindings.stdout_lines | length > 0

    - name: Find service accounts with cluster-admin
      ansible.builtin.shell: |
        kubectl get clusterrolebindings -o json | \
        jq -r '.items[] | select(.roleRef.name == "cluster-admin" and .subjects[]?.kind == "ServiceAccount") |
        .subjects[].namespace + "/" + .subjects[].name'
      register: sa_cluster_admin
      changed_when: false
      failed_when: false

    - name: Check for wildcard permissions
      ansible.builtin.shell: |
        kubectl get clusterroles -o json | \
        jq -r '.items[] | select(.rules[]? | .verbs[]? == "*" or .resources[]? == "*") | .metadata.name'
      register: wildcard_permissions
      changed_when: false

    - name: Generate RBAC audit report
      ansible.builtin.template:
        src: rbac-audit-report.j2
        dest: /tmp/k8s-rbac-audit-report.txt
        mode: '0600'

    - name: Display RBAC audit summary
      ansible.builtin.debug:
        msg:
          - "RBAC Audit Complete"
          - "Total role bindings: {{ (all_rolebindings.stdout | from_json).items | length }}"
          - "Total cluster role bindings: {{ (all_clusterrolebindings.stdout | from_json).items | length }}"
          - "System:masters bindings: {{ system_masters_bindings.stdout_lines | length }}"
          - "ServiceAccounts with cluster-admin: {{ sa_cluster_admin.stdout_lines | length }}"
          - "Roles with wildcard permissions: {{ wildcard_permissions.stdout_lines | length }}"
          - "Full report: /tmp/k8s-rbac-audit-report.txt"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_rbac_management_rbac_audit_preflight_passed | bool
          - fe_kubernetes_k8s_rbac_management_rbac_audit_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s-rbac-management/rbac-audit: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_rbac_management_rbac_audit_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_rbac_management_rbac_audit_status | default('unknown') }}.
        success_msg: "kubernetes/k8s-rbac-management/rbac-audit: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_rbac_management_rbac_audit_postflight_passed: true
        fe_kubernetes_k8s_rbac_management_rbac_audit_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_rbac_management_rbac_audit_status: "failed"
        fe_kubernetes_k8s_rbac_management_rbac_audit_postflight_passed: false
        fe_kubernetes_k8s_rbac_management_rbac_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_rbac_management_rbac_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s-rbac-management/rbac-audit: FAILED at '{{ fe_kubernetes_k8s_rbac_management_rbac_audit_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_rbac_management_rbac_audit_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s-rbac-management/rbac-audit failed at '{{ fe_kubernetes_k8s_rbac_management_rbac_audit_failed_task }}': {{ fe_kubernetes_k8s_rbac_management_rbac_audit_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_rbac_management_rbac_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_rbac_management_rbac_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_rbac_management_rbac_audit_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s-rbac-management/rbac-audit":
              component: "kubernetes/k8s-rbac-management/rbac-audit"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_rbac_management_rbac_audit_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_rbac_management_rbac_audit_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_rbac_management_rbac_audit_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_rbac_management_rbac_audit_status | default('') == 'succeeded' else ['kubernetes/k8s-rbac-management/rbac-audit'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s-rbac-management/rbac-audit | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_rbac_management_rbac_audit_stats_published: true
      tags:
        - always
