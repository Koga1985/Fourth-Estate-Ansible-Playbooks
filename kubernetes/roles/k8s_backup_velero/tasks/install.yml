---
# Velero Installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_backup_velero/install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_backup_velero_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_backup_velero/install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_backup_velero_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_backup_velero_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_backup_velero_install_status: "running"
    fe_kubernetes_k8s_backup_velero_install_preflight_passed: false
    fe_kubernetes_k8s_backup_velero_install_postflight_passed: false
    fe_kubernetes_k8s_backup_velero_install_failed_task: ""
    fe_kubernetes_k8s_backup_velero_install_error: ""
    fe_kubernetes_k8s_backup_velero_install_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_backup_velero/install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_backup_velero/install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_backup_velero/install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_backup_velero/install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_backup_velero/install: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_backup_velero/install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_backup_velero_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Add Velero Helm repository
      kubernetes.core.helm_repository:
        name: vmware-tanzu
        repo_url: "{{ velero_helm_repo }}"
      when: velero_install_method == 'helm'

    - name: Create Velero Helm values file
      ansible.builtin.template:
        src: velero-values.yml.j2
        dest: "/tmp/velero-values.yml"
        mode: '0600'
      when: velero_install_method == 'helm'

    - name: Install Velero via Helm
      kubernetes.core.helm:
        name: velero
        chart_ref: "{{ velero_helm_repo }}/{{ velero_helm_chart }}"
        chart_version: "{{ velero_version }}"
        release_namespace: "{{ velero_namespace }}"
        create_namespace: true
        values_files:
          - "/tmp/velero-values.yml"
        wait: true
        wait_timeout: "10m"
      when: velero_install_method == 'helm'

    - name: Download Velero CLI (CLI installation method)
      ansible.builtin.get_url:
        url: "https://github.com/vmware-tanzu/velero/releases/download/v{{ velero_cli_version }}/velero-v{{ velero_cli_version }}-linux-amd64.tar.gz"
        dest: "/tmp/velero-v{{ velero_cli_version }}-linux-amd64.tar.gz"
        mode: '0644'
      when: velero_install_method == 'cli'

    - name: Extract Velero CLI
      ansible.builtin.unarchive:
        src: "/tmp/velero-v{{ velero_cli_version }}-linux-amd64.tar.gz"
        dest: "/tmp/"
        remote_src: true
      when: velero_install_method == 'cli'

    - name: Install Velero via CLI
      ansible.builtin.command: >
        /tmp/velero-v{{ velero_cli_version }}-linux-amd64/velero install
        --provider {{ velero_provider }}
        --plugins {{ velero_plugins | map(attribute='image') | join(',') }}
        --bucket {{ velero_aws_bucket if velero_provider == 'aws' else (velero_azure_container if velero_provider == 'azure' else velero_gcp_bucket) }}
        --secret-file /tmp/velero-credentials
        --use-node-agent={{ velero_use_restic | lower }}
        --use-volume-snapshots={{ velero_use_volume_snapshots | lower }}
        --backup-location-config region={{ velero_aws_region if velero_provider == 'aws' else 'default' }}
        --namespace {{ velero_namespace }}
        --wait
      when: velero_install_method == 'cli'
      changed_when: true

    - name: Wait for Velero deployment to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: velero
        namespace: "{{ velero_namespace }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300

    - name: Wait for Restic DaemonSet to be ready
      kubernetes.core.k8s_info:
        kind: DaemonSet
        name: restic
        namespace: "{{ velero_namespace }}"
        wait: true
        wait_timeout: 300
      when: velero_use_restic | bool

    - name: Create BackupStorageLocation
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: velero.io/v1
          kind: BackupStorageLocation
          metadata:
            name: "{{ velero_aws_backup_location }}"
            namespace: "{{ velero_namespace }}"
          spec:
            provider: "{{ velero_provider }}"
            objectStorage:
              bucket: "{{ velero_aws_bucket if velero_provider == 'aws' else (velero_azure_container if velero_provider == 'azure' else (velero_gcp_bucket if velero_provider == 'gcp' else velero_minio_bucket)) }}"
              prefix: "{{ velero_namespace }}"
            config:
              region: "{{ velero_aws_region if velero_provider == 'aws' else 'default' }}"
              s3Url: "{{ velero_aws_s3_url if velero_aws_s3_url else (velero_minio_endpoint if velero_minio_enabled else omit) }}"
              s3ForcePathStyle: "{{ velero_aws_s3_force_path_style | string if velero_provider == 'aws' else (velero_minio_enabled | string) }}"
              kmsKeyId: "{{ velero_aws_kms_key_id if velero_aws_kms_key_id else omit }}"
            credential:
              name: "{{ velero_aws_credentials_secret }}"
              key: cloud

    - name: Create VolumeSnapshotLocation (if enabled)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: velero.io/v1
          kind: VolumeSnapshotLocation
          metadata:
            name: "{{ velero_snapshot_location_name }}"
            namespace: "{{ velero_namespace }}"
          spec:
            provider: "{{ velero_provider }}"
            config:
              region: "{{ velero_aws_region if velero_provider == 'aws' else 'default' }}"
      when: velero_use_volume_snapshots | bool

    - name: Verify Velero installation
      ansible.builtin.command: kubectl get deployment velero -n {{ velero_namespace }}
      register: velero_status
      changed_when: false
      failed_when: velero_status.rc != 0

    - name: Display Velero installation status
      ansible.builtin.debug:
        msg: "Velero {{ velero_version }} installed successfully in {{ velero_namespace }} namespace"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_backup_velero/install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_backup_velero_install_preflight_passed | bool
          - fe_kubernetes_k8s_backup_velero_install_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_backup_velero/install: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_backup_velero_install_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_backup_velero_install_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_backup_velero/install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_backup_velero/install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_install_postflight_passed: true
        fe_kubernetes_k8s_backup_velero_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_backup_velero/install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_install_status: "failed"
        fe_kubernetes_k8s_backup_velero_install_postflight_passed: false
        fe_kubernetes_k8s_backup_velero_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_backup_velero_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_backup_velero/install: FAILED at '{{ fe_kubernetes_k8s_backup_velero_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_backup_velero_install_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_backup_velero/install failed at '{{ fe_kubernetes_k8s_backup_velero_install_failed_task }}': {{ fe_kubernetes_k8s_backup_velero_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_backup_velero/install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_backup_velero_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_backup_velero_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_backup_velero/install":
              component: "kubernetes/k8s_backup_velero/install"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_backup_velero_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_backup_velero_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_backup_velero_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_backup_velero_install_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_backup_velero_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_backup_velero_install_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_backup_velero_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_backup_velero_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_backup_velero_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_backup_velero_install_status | default('') == 'succeeded' else ['kubernetes/k8s_backup_velero/install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_install_stats_published: true
      tags:
        - always
