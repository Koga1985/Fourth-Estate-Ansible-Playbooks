---
# Velero Credentials Setup

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_backup_velero/credentials']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_backup_velero_credentials_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_backup_velero/credentials | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_backup_velero_credentials_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_backup_velero_credentials_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_backup_velero_credentials_status: "running"
    fe_kubernetes_k8s_backup_velero_credentials_preflight_passed: false
    fe_kubernetes_k8s_backup_velero_credentials_postflight_passed: false
    fe_kubernetes_k8s_backup_velero_credentials_failed_task: ""
    fe_kubernetes_k8s_backup_velero_credentials_error: ""
    fe_kubernetes_k8s_backup_velero_credentials_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_backup_velero/credentials | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_backup_velero/credentials | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_backup_velero/credentials: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_backup_velero/credentials: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/credentials | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_backup_velero/credentials: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_backup_velero/credentials: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_backup_velero_credentials_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/credentials | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_credentials_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create Velero namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ velero_namespace }}"
            labels:
              app.kubernetes.io/name: velero
              app.kubernetes.io/component: backup
              pod-security.kubernetes.io/enforce: privileged

    - name: Create AWS credentials secret (AWS provider)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ velero_aws_credentials_secret }}"
            namespace: "{{ velero_namespace }}"
          type: Opaque
          stringData:
            cloud: |
              [default]
              aws_access_key_id={{ lookup('env', 'AWS_ACCESS_KEY_ID') }}
              aws_secret_access_key={{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}
      when: velero_provider == 'aws'
      no_log: true

    - name: Create Azure credentials secret (Azure provider)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ velero_aws_credentials_secret }}"
            namespace: "{{ velero_namespace }}"
          type: Opaque
          stringData:
            cloud: |
              AZURE_SUBSCRIPTION_ID={{ velero_azure_subscription_id }}
              AZURE_TENANT_ID={{ lookup('env', 'AZURE_TENANT_ID') }}
              AZURE_CLIENT_ID={{ lookup('env', 'AZURE_CLIENT_ID') }}
              AZURE_CLIENT_SECRET={{ lookup('env', 'AZURE_CLIENT_SECRET') }}
              AZURE_RESOURCE_GROUP={{ velero_azure_resource_group }}
              AZURE_STORAGE_ACCOUNT_ID={{ velero_azure_storage_account }}
              AZURE_STORAGE_KEY={{ velero_azure_storage_key }}
      when: velero_provider == 'azure'
      no_log: true

    - name: Create GCP credentials secret (GCP provider)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ velero_aws_credentials_secret }}"
            namespace: "{{ velero_namespace }}"
          type: Opaque
          data:
            cloud: "{{ velero_gcp_service_account_key | b64encode }}"
      when: velero_provider == 'gcp'
      no_log: true

    - name: Create MinIO credentials secret (MinIO provider)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ velero_aws_credentials_secret }}"
            namespace: "{{ velero_namespace }}"
          type: Opaque
          stringData:
            cloud: |
              [default]
              aws_access_key_id={{ velero_minio_access_key }}
              aws_secret_access_key={{ velero_minio_secret_key }}
      when: velero_minio_enabled | bool
      no_log: true

    - name: Create encryption key secret (if encryption enabled)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: velero-encryption-key
            namespace: "{{ velero_namespace }}"
          type: Opaque
          data:
            encryption-key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') | b64encode }}"
      when: velero_encryption_enabled | bool
      no_log: true

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_backup_velero/credentials | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_backup_velero_credentials_preflight_passed | bool
          - fe_kubernetes_k8s_backup_velero_credentials_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_backup_velero/credentials: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_backup_velero_credentials_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_backup_velero_credentials_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_backup_velero/credentials: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_backup_velero/credentials | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_credentials_postflight_passed: true
        fe_kubernetes_k8s_backup_velero_credentials_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_backup_velero/credentials | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_credentials_status: "failed"
        fe_kubernetes_k8s_backup_velero_credentials_postflight_passed: false
        fe_kubernetes_k8s_backup_velero_credentials_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_backup_velero_credentials_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/credentials | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_backup_velero/credentials: FAILED at '{{ fe_kubernetes_k8s_backup_velero_credentials_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_backup_velero_credentials_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/credentials | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_backup_velero/credentials failed at '{{ fe_kubernetes_k8s_backup_velero_credentials_failed_task }}': {{ fe_kubernetes_k8s_backup_velero_credentials_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_backup_velero/credentials | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_credentials_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_backup_velero_credentials_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_backup_velero_credentials_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/credentials | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_backup_velero/credentials":
              component: "kubernetes/k8s_backup_velero/credentials"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_backup_velero_credentials_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_backup_velero_credentials_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_backup_velero_credentials_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_backup_velero_credentials_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_backup_velero_credentials_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_credentials_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_backup_velero_credentials_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_backup_velero_credentials_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_backup_velero_credentials_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_backup_velero_credentials_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_credentials_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_backup_velero_credentials_status | default('') == 'succeeded' else ['kubernetes/k8s_backup_velero/credentials'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/credentials | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_credentials_stats_published: true
      tags:
        - always
