---
# Velero Security Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_backup_velero/security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_backup_velero_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_backup_velero/security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_backup_velero_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_backup_velero_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_backup_velero_security_status: "running"
    fe_kubernetes_k8s_backup_velero_security_preflight_passed: false
    fe_kubernetes_k8s_backup_velero_security_postflight_passed: false
    fe_kubernetes_k8s_backup_velero_security_failed_task: ""
    fe_kubernetes_k8s_backup_velero_security_error: ""
    fe_kubernetes_k8s_backup_velero_security_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_backup_velero/security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_backup_velero/security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_backup_velero/security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_backup_velero/security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_backup_velero/security: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_backup_velero/security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_backup_velero_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create NetworkPolicy for Velero
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: velero
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        name: monitoring
                ports:
                  - protocol: TCP
                    port: "{{ velero_metrics_port }}"
            egress:
              - to:
                  - namespaceSelector: {}
                ports:
                  - protocol: TCP
                    port: 443
                  - protocol: TCP
                    port: 6443
              - to:
                  - podSelector:
                      matchLabels:
                        app.kubernetes.io/name: minio
                ports:
                  - protocol: TCP
                    port: 9000
      when: velero_enable_network_policy | bool

    - name: Apply Pod Security Standard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ velero_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

    - name: Display security configuration
      ansible.builtin.debug:
        msg: "Velero security hardening applied"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_backup_velero/security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_backup_velero_security_preflight_passed | bool
          - fe_kubernetes_k8s_backup_velero_security_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_backup_velero/security: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_backup_velero_security_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_backup_velero_security_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_backup_velero/security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_backup_velero/security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_security_postflight_passed: true
        fe_kubernetes_k8s_backup_velero_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_backup_velero/security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_security_status: "failed"
        fe_kubernetes_k8s_backup_velero_security_postflight_passed: false
        fe_kubernetes_k8s_backup_velero_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_backup_velero_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_backup_velero/security: FAILED at '{{ fe_kubernetes_k8s_backup_velero_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_backup_velero_security_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_backup_velero/security failed at '{{ fe_kubernetes_k8s_backup_velero_security_failed_task }}': {{ fe_kubernetes_k8s_backup_velero_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_backup_velero/security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_backup_velero_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_backup_velero_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_backup_velero/security":
              component: "kubernetes/k8s_backup_velero/security"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_backup_velero_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_backup_velero_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_backup_velero_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_backup_velero_security_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_backup_velero_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_backup_velero_security_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_backup_velero_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_backup_velero_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_backup_velero_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_backup_velero_security_status | default('') == 'succeeded' else ['kubernetes/k8s_backup_velero/security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_security_stats_published: true
      tags:
        - always
