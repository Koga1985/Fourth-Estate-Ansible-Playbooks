---
# Velero Pre-flight Checks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_backup_velero/preflight']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_backup_velero_preflight_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_backup_velero/preflight | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_backup_velero_preflight_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_backup_velero_preflight_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_backup_velero_preflight_status: "running"
    fe_kubernetes_k8s_backup_velero_preflight_preflight_passed: false
    fe_kubernetes_k8s_backup_velero_preflight_postflight_passed: false
    fe_kubernetes_k8s_backup_velero_preflight_failed_task: ""
    fe_kubernetes_k8s_backup_velero_preflight_error: ""
    fe_kubernetes_k8s_backup_velero_preflight_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_backup_velero/preflight | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_backup_velero/preflight | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_backup_velero/preflight: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_backup_velero/preflight: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/preflight | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_backup_velero/preflight: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_backup_velero/preflight: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_backup_velero_preflight_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_backup_velero/preflight | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_preflight_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if kubectl is available
      ansible.builtin.command: kubectl version --client --short
      register: kubectl_version
      changed_when: false
      failed_when: false

    - name: Fail if kubectl is not available
      ansible.builtin.fail:
        msg: "kubectl is not installed or not in PATH"
      when: kubectl_version.rc != 0

    - name: Check Kubernetes cluster connectivity
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      failed_when: cluster_info.rc != 0

    - name: Check if Velero namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ velero_namespace }}"
      register: velero_ns_check

    - name: Verify required storage provider credentials
      ansible.builtin.assert:
        that:
          - (velero_provider == 'aws' and velero_aws_bucket is defined and velero_aws_bucket | length > 0) or
            (velero_provider == 'azure' and velero_azure_storage_account is defined and velero_azure_storage_account | length > 0) or
            (velero_provider == 'gcp' and velero_gcp_bucket is defined and velero_gcp_bucket | length > 0) or
            (velero_minio_enabled | bool)
        fail_msg: "Storage provider credentials are not properly configured"
        success_msg: "Storage provider configuration validated"

    - name: Check if Helm is installed (when using Helm installation)
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false
      failed_when: false
      when: velero_install_method == 'helm'

    - name: Fail if Helm is not available
      ansible.builtin.fail:
        msg: "Helm is not installed or not in PATH"
      when:
        - velero_install_method == 'helm'
        - helm_version.rc != 0

    - name: Check cluster storage classes
      kubernetes.core.k8s_info:
        kind: StorageClass
      register: storage_classes

    - name: Verify at least one storage class exists
      ansible.builtin.assert:
        that:
          - storage_classes.resources | length > 0
        fail_msg: "No storage classes found in cluster"
        success_msg: "Storage classes available"
      when: velero_use_volume_snapshots | bool

    - name: Display pre-flight check results
      ansible.builtin.debug:
        msg:
          - "Kubectl version: {{ kubectl_version.stdout }}"
          - "Velero provider: {{ velero_provider }}"
          - "Velero version: {{ velero_version }}"
          - "Installation method: {{ velero_install_method }}"
          - "Restic enabled: {{ velero_use_restic }}"
          - "Volume snapshots enabled: {{ velero_use_volume_snapshots }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_backup_velero/preflight | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_backup_velero_preflight_preflight_passed | bool
          - fe_kubernetes_k8s_backup_velero_preflight_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_backup_velero/preflight: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_backup_velero_preflight_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_backup_velero_preflight_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_backup_velero/preflight: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_backup_velero/preflight | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_preflight_postflight_passed: true
        fe_kubernetes_k8s_backup_velero_preflight_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_backup_velero/preflight | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_preflight_status: "failed"
        fe_kubernetes_k8s_backup_velero_preflight_postflight_passed: false
        fe_kubernetes_k8s_backup_velero_preflight_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_backup_velero_preflight_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/preflight | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_backup_velero/preflight: FAILED at '{{ fe_kubernetes_k8s_backup_velero_preflight_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_backup_velero_preflight_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_backup_velero/preflight | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_backup_velero/preflight failed at '{{ fe_kubernetes_k8s_backup_velero_preflight_failed_task }}': {{ fe_kubernetes_k8s_backup_velero_preflight_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_backup_velero/preflight | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_preflight_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_backup_velero_preflight_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_backup_velero_preflight_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/preflight | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_backup_velero/preflight":
              component: "kubernetes/k8s_backup_velero/preflight"
              type: "role-tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_backup_velero_preflight_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_backup_velero_preflight_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_backup_velero_preflight_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_backup_velero_preflight_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_backup_velero_preflight_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_preflight_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_backup_velero_preflight_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_backup_velero_preflight_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_backup_velero_preflight_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_backup_velero_preflight_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_backup_velero_preflight_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_backup_velero_preflight_status | default('') == 'succeeded' else ['kubernetes/k8s_backup_velero/preflight'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_backup_velero/preflight | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_backup_velero_preflight_stats_published: true
      tags:
        - always
