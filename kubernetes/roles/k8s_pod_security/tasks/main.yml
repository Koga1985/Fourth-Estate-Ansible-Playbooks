---
# Main tasks file for k8s_pod_security role
# Pod Security Standards and Admission Control

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/k8s_pod_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_k8s_pod_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/k8s_pod_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_k8s_pod_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_k8s_pod_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_k8s_pod_security_status: "running"
    fe_kubernetes_k8s_pod_security_preflight_passed: false
    fe_kubernetes_k8s_pod_security_postflight_passed: false
    fe_kubernetes_k8s_pod_security_failed_task: ""
    fe_kubernetes_k8s_pod_security_error: ""
    fe_kubernetes_k8s_pod_security_stats_published: false
  tags:
    - always

- name: "kubernetes/k8s_pod_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/k8s_pod_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/k8s_pod_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/k8s_pod_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_pod_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/k8s_pod_security: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/k8s_pod_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_k8s_pod_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/k8s_pod_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_pod_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Kubernetes version for Pod Security Admission
      ansible.builtin.assert:
        that:
          - k8s_version is version('1.23', '>=')
        fail_msg: "Pod Security Admission requires Kubernetes 1.23 or higher"
      when: k8s_version is defined
      tags:
        - preflight

    - name: Create Pod Security Admission configuration
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'pod-security-admission-config.yaml.j2') }}"
      when: k8s_pod_security_admission_enabled | bool
      tags:
        - pod-security-admission

    - name: Apply Pod Security Standards to namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item.namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "{{ item.enforce | default(k8s_pod_security_default_enforce) }}"
              pod-security.kubernetes.io/enforce-version: "{{ item.enforce_version | default('latest') }}"
              pod-security.kubernetes.io/audit: "{{ item.audit | default(k8s_pod_security_default_audit) }}"
              pod-security.kubernetes.io/warn: "{{ item.warn | default(k8s_pod_security_default_warn) }}"
      loop: "{{ k8s_pod_security_namespaces }}"
      tags:
        - pod-security-standards
        - namespaces

    - name: Create restricted Pod Security Policy template
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'psp-restricted.yaml.j2') }}"
      when:
        - k8s_pod_security_psp_enabled | bool
        - k8s_version is version('1.25', '<')  # PSP deprecated in 1.25
      tags:
        - pod-security-policy
        - restricted

    - name: Create baseline Pod Security Policy template
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'psp-baseline.yaml.j2') }}"
      when:
        - k8s_pod_security_psp_enabled | bool
        - k8s_version is version('1.25', '<')
      tags:
        - pod-security-policy
        - baseline

    - name: Deploy Security Context Constraints
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'security-context-template.yaml.j2') }}"
        namespace: "{{ item }}"
      loop: "{{ k8s_pod_security_namespaces | map(attribute='namespace') | list }}"
      tags:
        - security-context

    - name: Create AppArmor profiles ConfigMap
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'apparmor-profiles.yaml.j2') }}"
      when: k8s_pod_security_apparmor_enabled | bool
      tags:
        - apparmor

    - name: Deploy seccomp profiles
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'seccomp-profiles.yaml.j2') }}"
      when: k8s_pod_security_seccomp_enabled | bool
      tags:
        - seccomp

    - name: Configure SELinux contexts
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'selinux-context.yaml.j2') }}"
      when: k8s_pod_security_selinux_enabled | bool
      tags:
        - selinux

    - name: Create RuntimeClass configurations
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'runtime-class.yaml.j2') }}"
      loop: "{{ k8s_pod_security_runtime_classes }}"
      when: k8s_pod_security_runtime_classes is defined
      tags:
        - runtime-class

    - name: Deploy Pod Security webhook
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'pod-security-webhook.yaml.j2') }}"
      when: k8s_pod_security_webhook_enabled | bool
      tags:
        - webhook

    - name: Create capability drop policies
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'capability-policies.yaml.j2') }}"
      tags:
        - capabilities

    - name: Apply non-root enforcement policies
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'non-root-enforcement.yaml.j2') }}"
      when: k8s_pod_security_enforce_non_root | bool
      tags:
        - non-root

    - name: Configure read-only root filesystem
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'readonly-rootfs.yaml.j2') }}"
      when: k8s_pod_security_readonly_rootfs | bool
      tags:
        - readonly-rootfs

    - name: Validate Pod Security configurations
      kubernetes.core.k8s_info:
        kind: Namespace
        label_selectors:
          - "pod-security.kubernetes.io/enforce"
      register: pod_security_validation
      tags:
        - validation

    - name: Display Pod Security summary
      ansible.builtin.debug:
        msg:
          - "Pod Security Standards Applied"
          - "Default Enforce Level: {{ k8s_pod_security_default_enforce }}"
          - "Default Audit Level: {{ k8s_pod_security_default_audit }}"
          - "Namespaces Configured: {{ pod_security_validation.resources | length }}"
          - "Non-root Enforcement: {{ k8s_pod_security_enforce_non_root }}"
          - "Read-only Root FS: {{ k8s_pod_security_readonly_rootfs }}"
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "kubernetes/k8s_pod_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_k8s_pod_security_preflight_passed | bool
          - fe_kubernetes_k8s_pod_security_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/k8s_pod_security: postflight validation failed - preflight passed
          ={{ fe_kubernetes_k8s_pod_security_preflight_passed | default(false) }},
          status={{ fe_kubernetes_k8s_pod_security_status | default('unknown') }}.
        success_msg: "kubernetes/k8s_pod_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/k8s_pod_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_pod_security_postflight_passed: true
        fe_kubernetes_k8s_pod_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/k8s_pod_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_pod_security_status: "failed"
        fe_kubernetes_k8s_pod_security_postflight_passed: false
        fe_kubernetes_k8s_pod_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_k8s_pod_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_pod_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/k8s_pod_security: FAILED at '{{ fe_kubernetes_k8s_pod_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_k8s_pod_security_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/k8s_pod_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/k8s_pod_security failed at '{{ fe_kubernetes_k8s_pod_security_failed_task }}': {{ fe_kubernetes_k8s_pod_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/k8s_pod_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_pod_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_k8s_pod_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_k8s_pod_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/k8s_pod_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/k8s_pod_security":
              component: "kubernetes/k8s_pod_security"
              type: "role"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_k8s_pod_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_k8s_pod_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_k8s_pod_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_k8s_pod_security_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_k8s_pod_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_k8s_pod_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_k8s_pod_security_failed_task | default('') }}"
              error: "{{ fe_kubernetes_k8s_pod_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_k8s_pod_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_k8s_pod_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_k8s_pod_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_k8s_pod_security_status | default('') == 'succeeded' else ['kubernetes/k8s_pod_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/k8s_pod_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_k8s_pod_security_stats_published: true
      tags:
        - always
