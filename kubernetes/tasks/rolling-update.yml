---
# Reusable task: Perform rolling update of deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/rolling-update']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_rolling_update_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/rolling-update | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_rolling_update_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_rolling_update_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_rolling_update_status: "running"
    fe_kubernetes_rolling_update_preflight_passed: false
    fe_kubernetes_rolling_update_postflight_passed: false
    fe_kubernetes_rolling_update_failed_task: ""
    fe_kubernetes_rolling_update_error: ""
    fe_kubernetes_rolling_update_stats_published: false
  tags:
    - always

- name: "kubernetes/rolling-update | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/rolling-update | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/rolling-update: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/rolling-update: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/rolling-update | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/rolling-update: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/rolling-update: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_rolling_update_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/rolling-update | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_rolling_update_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get current deployment image
      ansible.builtin.shell: |
        kubectl get deployment {{ deployment_name }} -n {{ deployment_namespace | default('default') }} \
        -o jsonpath='{.spec.template.spec.containers[0].image}'
      register: current_image
      changed_when: false

    - name: Update deployment image
      ansible.builtin.command: >
        kubectl set image deployment/{{ deployment_name }}
        {{ container_name | default(deployment_name) }}={{ new_image }}
        -n {{ deployment_namespace | default('default') }}
        --record
      when: current_image.stdout != new_image
      register: update_result

    - name: Wait for rollout to complete
      ansible.builtin.command: >
        kubectl rollout status deployment/{{ deployment_name }}
        -n {{ deployment_namespace | default('default') }}
        --timeout={{ rollout_timeout | default('10m') }}
      when: update_result is changed
      register: rollout_result
      changed_when: false

    - name: Check rollout history
      ansible.builtin.command: >
        kubectl rollout history deployment/{{ deployment_name }}
        -n {{ deployment_namespace | default('default') }}
      register: rollout_history
      changed_when: false

    - name: Verify deployment health
      ansible.builtin.shell: |
        kubectl get deployment {{ deployment_name }} -n {{ deployment_namespace | default('default') }} \
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: deployment_available
      changed_when: false

    - name: Rollback if deployment failed
      when:
        - update_result is changed
        - deployment_available.stdout != "True"
        - auto_rollback | default(false)
      block:
        - name: Perform rollback
          ansible.builtin.command: >
            kubectl rollout undo deployment/{{ deployment_name }}
            -n {{ deployment_namespace | default('default') }}

        - name: Fail after rollback
          ansible.builtin.fail:
            msg: "Deployment update failed and was rolled back"

    - name: Display update result
      ansible.builtin.debug:
        msg:
          - "Rolling update complete"
          - "Deployment: {{ deployment_name }}"
          - "Previous image: {{ current_image.stdout }}"
          - "New image: {{ new_image }}"
          - "Status: {{ 'Available' if deployment_available.stdout == 'True' else 'Unhealthy' }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/rolling-update | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_rolling_update_preflight_passed | bool
          - fe_kubernetes_rolling_update_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/rolling-update: postflight validation failed - preflight passed
          ={{ fe_kubernetes_rolling_update_preflight_passed | default(false) }},
          status={{ fe_kubernetes_rolling_update_status | default('unknown') }}.
        success_msg: "kubernetes/rolling-update: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/rolling-update | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_rolling_update_postflight_passed: true
        fe_kubernetes_rolling_update_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/rolling-update | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_rolling_update_status: "failed"
        fe_kubernetes_rolling_update_postflight_passed: false
        fe_kubernetes_rolling_update_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_rolling_update_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/rolling-update | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/rolling-update: FAILED at '{{ fe_kubernetes_rolling_update_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_rolling_update_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/rolling-update | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/rolling-update failed at '{{ fe_kubernetes_rolling_update_failed_task }}': {{ fe_kubernetes_rolling_update_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/rolling-update | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_rolling_update_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_rolling_update_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_rolling_update_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/rolling-update | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/rolling-update":
              component: "kubernetes/rolling-update"
              type: "tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_rolling_update_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_rolling_update_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_rolling_update_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_rolling_update_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_rolling_update_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_rolling_update_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_rolling_update_failed_task | default('') }}"
              error: "{{ fe_kubernetes_rolling_update_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_rolling_update_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_rolling_update_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_rolling_update_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_rolling_update_status | default('') == 'succeeded' else ['kubernetes/rolling-update'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/rolling-update | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_rolling_update_stats_published: true
      tags:
        - always
