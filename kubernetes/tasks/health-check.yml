---
# Reusable task: Kubernetes cluster health check

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/health-check']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_health_check_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/health-check | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_health_check_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_health_check_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_health_check_status: "running"
    fe_kubernetes_health_check_preflight_passed: false
    fe_kubernetes_health_check_postflight_passed: false
    fe_kubernetes_health_check_failed_task: ""
    fe_kubernetes_health_check_error: ""
    fe_kubernetes_health_check_stats_published: false
  tags:
    - always

- name: "kubernetes/health-check | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/health-check | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/health-check: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/health-check: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/health-check | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/health-check: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/health-check: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_health_check_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/health-check | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_health_check_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check cluster info
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Get node status
      ansible.builtin.command: kubectl get nodes -o json
      register: nodes_status
      changed_when: false

    - name: Parse node status
      ansible.builtin.set_fact:
        nodes_ready: "{{ (nodes_status.stdout | from_json).items | selectattr('status.conditions', 'defined') | selectattr('status.conditions', 'search', 'Ready.*True') | list | length }}"
        nodes_total: "{{ (nodes_status.stdout | from_json).items | length }}"

    - name: Check component status
      ansible.builtin.command: kubectl get componentstatuses
      register: component_status
      changed_when: false
      failed_when: false

    - name: Check pod status
      ansible.builtin.shell: |
        kubectl get pods --all-namespaces --field-selector=status.phase!=Running,status.phase!=Succeeded -o json
      register: unhealthy_pods
      changed_when: false

    - name: Count unhealthy pods
      ansible.builtin.set_fact:
        unhealthy_pod_count: "{{ (unhealthy_pods.stdout | from_json).items | length }}"

    - name: Check for pending PVCs
      ansible.builtin.shell: |
        kubectl get pvc --all-namespaces --field-selector=status.phase=Pending -o json
      register: pending_pvcs
      changed_when: false

    - name: Check API server health
      ansible.builtin.command: kubectl get --raw /healthz
      register: api_health
      changed_when: false
      failed_when: false

    - name: Check etcd health
      ansible.builtin.shell: |
        ETCDCTL_API=3 etcdctl \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          endpoint health
      register: etcd_health
      changed_when: false
      failed_when: false

    - name: Check for certificate expiration
      ansible.builtin.command: kubeadm certs check-expiration
      register: cert_expiration
      changed_when: false
      failed_when: false

    - name: Display health check summary
      ansible.builtin.debug:
        msg:
          - "=== Kubernetes Cluster Health Check ==="
          - "Cluster: {{ 'Healthy' if cluster_info.rc == 0 else 'Unhealthy' }}"
          - "Nodes: {{ nodes_ready }}/{{ nodes_total }} ready"
          - "Unhealthy pods: {{ unhealthy_pod_count }}"
          - "Pending PVCs: {{ (pending_pvcs.stdout | from_json).items | length }}"
          - "API server: {{ 'Healthy' if api_health.rc == 0 else 'Unhealthy' }}"
          - "ETCD: {{ 'Healthy' if etcd_health.rc == 0 else 'Check required' }}"

    - name: Fail if cluster is unhealthy
      ansible.builtin.fail:
        msg: "Cluster health check failed - please review above output"
      when:
        - k8s_fail_on_unhealthy | default(false)
        - (cluster_info.rc != 0 or nodes_ready|int != nodes_total|int or unhealthy_pod_count|int > 0)

    # ----------------------------- postflight -------------------

    - name: "kubernetes/health-check | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_health_check_preflight_passed | bool
          - fe_kubernetes_health_check_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/health-check: postflight validation failed - preflight passed
          ={{ fe_kubernetes_health_check_preflight_passed | default(false) }},
          status={{ fe_kubernetes_health_check_status | default('unknown') }}.
        success_msg: "kubernetes/health-check: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/health-check | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_health_check_postflight_passed: true
        fe_kubernetes_health_check_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/health-check | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_health_check_status: "failed"
        fe_kubernetes_health_check_postflight_passed: false
        fe_kubernetes_health_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_health_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/health-check | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/health-check: FAILED at '{{ fe_kubernetes_health_check_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_health_check_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/health-check | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/health-check failed at '{{ fe_kubernetes_health_check_failed_task }}': {{ fe_kubernetes_health_check_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/health-check | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_health_check_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_health_check_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_health_check_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/health-check | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/health-check":
              component: "kubernetes/health-check"
              type: "tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_health_check_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_health_check_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_health_check_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_health_check_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_health_check_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_health_check_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_health_check_failed_task | default('') }}"
              error: "{{ fe_kubernetes_health_check_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_health_check_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_health_check_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_health_check_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_health_check_status | default('') == 'succeeded' else ['kubernetes/health-check'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/health-check | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_health_check_stats_published: true
      tags:
        - always
