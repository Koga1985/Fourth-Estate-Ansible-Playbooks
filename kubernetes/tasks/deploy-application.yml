---
# Reusable task: Deploy application to Kubernetes
# This task deploys a containerized application with proper security contexts

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['kubernetes/deploy-application']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_kubernetes_deploy_application_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "kubernetes/deploy-application | Initialize validation state"
  ansible.builtin.set_fact:
    fe_kubernetes_deploy_application_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_kubernetes_deploy_application_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_kubernetes_deploy_application_status: "running"
    fe_kubernetes_deploy_application_preflight_passed: false
    fe_kubernetes_deploy_application_postflight_passed: false
    fe_kubernetes_deploy_application_failed_task: ""
    fe_kubernetes_deploy_application_error: ""
    fe_kubernetes_deploy_application_stats_published: false
  tags:
    - always

- name: "kubernetes/deploy-application | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "kubernetes/deploy-application | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          kubernetes/deploy-application: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          kubernetes/deploy-application: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/deploy-application | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "kubernetes/deploy-application: required variable '{{ item }}' is not defined."
        success_msg: "kubernetes/deploy-application: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_kubernetes_deploy_application_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "kubernetes/deploy-application | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_kubernetes_deploy_application_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create namespace for application
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
              pod-security.kubernetes.io/enforce: "{{ app_pod_security_standard | default('restricted') }}"

    - name: Create deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            replicas: "{{ app_replicas | default(3) }}"
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 2000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: "{{ app_name }}"
                    image: "{{ app_image }}"
                    imagePullPolicy: Always
                    ports:
                      - containerPort: "{{ app_port | default(8080) }}"
                        name: http
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: "{{ app_cpu_request | default('100m') }}"
                        memory: "{{ app_memory_request | default('128Mi') }}"
                      limits:
                        cpu: "{{ app_cpu_limit | default('500m') }}"
                        memory: "{{ app_memory_limit | default('512Mi') }}"
                    livenessProbe:
                      httpGet:
                        path: "{{ app_health_path | default('/health') }}"
                        port: http
                      initialDelaySeconds: 30
                      periodSeconds: 10
                    readinessProbe:
                      httpGet:
                        path: "{{ app_ready_path | default('/ready') }}"
                        port: http
                      initialDelaySeconds: 5
                      periodSeconds: 5
                imagePullSecrets:
                  - name: "{{ app_image_pull_secret | default('registry-credentials') }}"

    - name: Create service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - protocol: TCP
                port: 80
                targetPort: http
            type: "{{ app_service_type | default('ClusterIP') }}"

    - name: Display deployment info
      ansible.builtin.debug:
        msg:
          - "Application deployed successfully"
          - "Name: {{ app_name }}"
          - "Namespace: {{ app_namespace }}"
          - "Replicas: {{ app_replicas | default(3) }}"
          - "Image: {{ app_image }}"

    # ----------------------------- postflight -------------------

    - name: "kubernetes/deploy-application | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_kubernetes_deploy_application_preflight_passed | bool
          - fe_kubernetes_deploy_application_status in ['running', 'succeeded']
        fail_msg: >-
          kubernetes/deploy-application: postflight validation failed - preflight passed
          ={{ fe_kubernetes_deploy_application_preflight_passed | default(false) }},
          status={{ fe_kubernetes_deploy_application_status | default('unknown') }}.
        success_msg: "kubernetes/deploy-application: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "kubernetes/deploy-application | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_kubernetes_deploy_application_postflight_passed: true
        fe_kubernetes_deploy_application_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "kubernetes/deploy-application | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_kubernetes_deploy_application_status: "failed"
        fe_kubernetes_deploy_application_postflight_passed: false
        fe_kubernetes_deploy_application_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_kubernetes_deploy_application_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "kubernetes/deploy-application | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          kubernetes/deploy-application: FAILED at '{{ fe_kubernetes_deploy_application_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_kubernetes_deploy_application_error }}
      tags:
        - always
        - rescue

    - name: "kubernetes/deploy-application | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          kubernetes/deploy-application failed at '{{ fe_kubernetes_deploy_application_failed_task }}': {{ fe_kubernetes_deploy_application_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "kubernetes/deploy-application | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_kubernetes_deploy_application_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_kubernetes_deploy_application_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_kubernetes_deploy_application_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "kubernetes/deploy-application | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "kubernetes/deploy-application":
              component: "kubernetes/deploy-application"
              type: "tasks"
              platform: "kubernetes"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_kubernetes_deploy_application_status | default('unknown') }}"
              preflight_passed: "{{ fe_kubernetes_deploy_application_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_kubernetes_deploy_application_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_kubernetes_deploy_application_started_at | default('') }}"
              ended_at: "{{ fe_kubernetes_deploy_application_ended_at | default('') }}"
              duration_seconds: "{{ fe_kubernetes_deploy_application_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_kubernetes_deploy_application_failed_task | default('') }}"
              error: "{{ fe_kubernetes_deploy_application_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_kubernetes_deploy_application_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_kubernetes_deploy_application_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_kubernetes_deploy_application_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_kubernetes_deploy_application_status | default('') == 'succeeded' else ['kubernetes/deploy-application'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "kubernetes/deploy-application | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_kubernetes_deploy_application_stats_published: true
      tags:
        - always
