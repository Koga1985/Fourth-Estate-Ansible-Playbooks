---
# Exports vSphere object permissions (principal, role, propagate) to JSON + CSV.
# Safe to run read-only. Stores files on the controller.
#
# Vars you must set somewhere (vault/env/vars):
#   vcenter_hostname, vcenter_username, vcenter_password
#
# Optional:
#   vcenter_validate_certs (bool, default false)
#   export_json_path (default ./vsphere_permissions.json)
#   export_csv_path  (default ./vsphere_permissions.csv)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/export_vsphere_permissions']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_export_vsphere_permissions_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/export_vsphere_permissions | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_export_vsphere_permissions_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_export_vsphere_permissions_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_export_vsphere_permissions_status: "running"
    fe_vmware_export_vsphere_permissions_preflight_passed: false
    fe_vmware_export_vsphere_permissions_postflight_passed: false
    fe_vmware_export_vsphere_permissions_failed_task: ""
    fe_vmware_export_vsphere_permissions_error: ""
    fe_vmware_export_vsphere_permissions_stats_published: false
  tags:
    - always

- name: "vmware/export_vsphere_permissions | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/export_vsphere_permissions | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/export_vsphere_permissions: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/export_vsphere_permissions: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/export_vsphere_permissions | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/export_vsphere_permissions: required variable '{{ item }}' is not defined."
        success_msg: "vmware/export_vsphere_permissions: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_export_vsphere_permissions_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/export_vsphere_permissions | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_export_vsphere_permissions_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        export_json_path: "{{ export_json_path | default('./vsphere_permissions.json') }}"
        export_csv_path:  "{{ export_csv_path  | default('./vsphere_permissions.csv') }}"

    # --- Discover inventory we’ll read permissions from ---

    - name: Always include the vCenter root folder
      ansible.builtin.set_fact:
        _objects: [{ "object_type": "Folder", "object_name": "rootFolder" }]

    - name: Get all datacenters
      community.vmware.vmware_datacenter_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      delegate_to: localhost
      register: _dc

    - name: Add datacenters to target list
      ansible.builtin.set_fact:
        _objects: "{{ _objects + (_dc.datacenter_info | map(attribute='name') | list | map('community.general.dict_kv', 'object_type', 'Datacenter', 'object_name') | list) }}"
      vars:
        # helper filter: convert each name to {"object_type":"Datacenter","object_name":name}
        # if you don't have community.general, replace with a map('regex_replace',...) approach.
      when: _dc.datacenter_info is defined

    - name: For each DC, get all VM/Host/Datastore/Network folders
      community.vmware.vmware_folder_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ item.name }}"
      no_log: true
      loop: "{{ _dc.datacenter_info | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      register: _folders

    # Flatten the per-datacenter folder results, keep the folder path names,
    # and turn each into an {object_type: Folder, object_name: <path>} entry.
    - name: Add discovered folders to target list
      ansible.builtin.set_fact:
        _objects: >-
          {{
            _objects +
            (
              _folders.results
              | map(attribute='folders') | select('defined') | map('default', []) | list
              | sum(start=[])
              | map(attribute='folder') | select('defined') | list
              | unique
              | map('community.general.dict_kv', 'object_type', 'Folder', 'object_name')
              | list
            )
          }}

    # --- Collect permissions for each target object ---

    - name: Gather permissions for each object (VC root, DCs, and folders)
      community.vmware.vmware_object_role_permission_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        object_type: "{{ item.object_type }}"
        object_name: "{{ item.object_name }}"
      no_log: true
      loop: "{{ _objects | unique }}"
      loop_control:
        label: "{{ item.object_type }} {{ item.object_name }}"
      delegate_to: localhost
      register: _perm_info

    # Normalize into flat rows
    - name: Build flat permission rows
      ansible.builtin.set_fact:
        vsphere_permission_rows: >-
          {{
            _perm_info.results
            | selectattr('permission_info','defined')
            | map('combine', {'object_type': None, 'object_name': None})
            | map('combine', {
                'object_type': _.item.object_type,
                'object_name': _.item.object_name,
                'rows': (_.permission_info | default([]))
              })
            | list
            | map('community.general.json_query', '{object_type: object_type, object_name: object_name, principal: rows[].principal, role_name: rows[].role_name, propagate: rows[].propagate, role_id: rows[].role_id}')
            | list
            | map('community.general.flatten') | list
          }}

    # Optional: export all role definitions found on vCenter (role_id -> privileges)
    - name: Export vCenter local roles (role_id, role_name, privileges)
      community.vmware.vmware_local_role_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      delegate_to: localhost
      register: _roles

    - name: Compose final export object
      ansible.builtin.set_fact:
        vsphere_permissions_export:
          generated_at: "{{ ansible_date_time.iso8601 }}"
          vcenter: "{{ vcenter_hostname }}"
          objects_considered: "{{ _objects | length }}"
          rows: "{{ vsphere_permission_rows | default([]) }}"
          roles: "{{ _roles.local_role_info | default([]) }}"

    # --- Write files on the controller ---

    - name: Write JSON export
      ansible.builtin.copy:
        dest: "{{ export_json_path }}"
        content: "{{ vsphere_permissions_export | to_nice_json }}"
        mode: '0640'
      delegate_to: localhost

    - name: Render CSV body (header + rows)
      ansible.builtin.set_fact:
        _csv_lines: >-
          {%- set header = 'object_type,object_name,principal,role_name,role_id,propagate' -%}
          {%- set lines = [header] -%}
          {%- for r in (vsphere_permission_rows | default([])) -%}
          {%-   set _ = lines.append('%s,%s,%s,%s,%s,%s' | format(
                   (r.object_type|default(''))|replace(',',' '),
                   (r.object_name|default(''))|replace(',',' '),
                   (r.principal|default(''))|replace(',',' '),
                   (r.role_name|default(''))|replace(',',' '),
                   (r.role_id|default('')),
                   (r.propagate|default(''))
                 )) -%}
          {%- endfor -%}
          {{ lines | join('\n') }}

    - name: Write CSV export
      ansible.builtin.copy:
        dest: "{{ export_csv_path }}"
        content: "{{ _csv_lines }}\n"
        mode: '0640'
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        msg:
          json: "{{ export_json_path }}"
          csv:  "{{ export_csv_path }}"
          objects_scanned: "{{ _objects | length }}"
          entries: "{{ vsphere_permission_rows | length }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/export_vsphere_permissions | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_export_vsphere_permissions_preflight_passed | bool
          - fe_vmware_export_vsphere_permissions_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/export_vsphere_permissions: postflight validation failed - preflight passed
          ={{ fe_vmware_export_vsphere_permissions_preflight_passed | default(false) }},
          status={{ fe_vmware_export_vsphere_permissions_status | default('unknown') }}.
        success_msg: "vmware/export_vsphere_permissions: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/export_vsphere_permissions | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_export_vsphere_permissions_postflight_passed: true
        fe_vmware_export_vsphere_permissions_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/export_vsphere_permissions | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_export_vsphere_permissions_status: "failed"
        fe_vmware_export_vsphere_permissions_postflight_passed: false
        fe_vmware_export_vsphere_permissions_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_export_vsphere_permissions_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/export_vsphere_permissions | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/export_vsphere_permissions: FAILED at '{{ fe_vmware_export_vsphere_permissions_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_export_vsphere_permissions_error }}
      tags:
        - always
        - rescue

    - name: "vmware/export_vsphere_permissions | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/export_vsphere_permissions failed at '{{ fe_vmware_export_vsphere_permissions_failed_task }}': {{ fe_vmware_export_vsphere_permissions_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/export_vsphere_permissions | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_export_vsphere_permissions_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_export_vsphere_permissions_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_export_vsphere_permissions_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/export_vsphere_permissions | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/export_vsphere_permissions":
              component: "vmware/export_vsphere_permissions"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_export_vsphere_permissions_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_export_vsphere_permissions_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_export_vsphere_permissions_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_export_vsphere_permissions_started_at | default('') }}"
              ended_at: "{{ fe_vmware_export_vsphere_permissions_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_export_vsphere_permissions_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_export_vsphere_permissions_failed_task | default('') }}"
              error: "{{ fe_vmware_export_vsphere_permissions_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_export_vsphere_permissions_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_export_vsphere_permissions_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_export_vsphere_permissions_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_export_vsphere_permissions_status | default('') == 'succeeded' else ['vmware/export_vsphere_permissions'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/export_vsphere_permissions | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_export_vsphere_permissions_stats_published: true
      tags:
        - always
