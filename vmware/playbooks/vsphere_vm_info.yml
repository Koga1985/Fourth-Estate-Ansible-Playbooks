---
# Retrieve vSphere VM information and export to JSON + CSV.
#
# Set these vars (via vars, group_vars, or CLI -e):
#   vcenter_hostname: "vcenter.example.local"
#   vcenter_username: "{{ lookup('env','VCENTER_USERNAME') }}"
#   vcenter_password: "{{ lookup('env','VCENTER_PASSWORD') }}"
#   vcenter_validate_certs: false
#
# Optional filters (any can be blank to skip):
#   vcenter_datacenter: "DC1"
#   vcenter_cluster: ""
#   vcenter_folder: ""                 # e.g. "/DC1/vm/Production"
#   esxi_hostname: ""                  # query only VMs on this host
#   vm_name_regex: ""                  # e.g. "^prod-|win$"
#
# Output paths (controller filesystem):
#   vm_info_json_path: "./vm_info.json"
#   vm_info_csv_path:  "./vm_info.csv"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsphere_vm_info']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsphere_vm_info_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsphere_vm_info | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsphere_vm_info_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsphere_vm_info_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsphere_vm_info_status: "running"
    fe_vmware_vsphere_vm_info_preflight_passed: false
    fe_vmware_vsphere_vm_info_postflight_passed: false
    fe_vmware_vsphere_vm_info_failed_task: ""
    fe_vmware_vsphere_vm_info_error: ""
    fe_vmware_vsphere_vm_info_stats_published: false
  tags:
    - always

- name: "vmware/vsphere_vm_info | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsphere_vm_info | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsphere_vm_info: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsphere_vm_info: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_vm_info | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsphere_vm_info: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsphere_vm_info: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsphere_vm_info_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_vm_info | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_info_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        vm_info_json_path: "{{ vm_info_json_path | default('./vm_info.json') }}"
        vm_info_csv_path:  "{{ vm_info_csv_path  | default('./vm_info.csv') }}"
        vcenter_datacenter: "{{ vcenter_datacenter | default('') }}"
        vcenter_cluster: "{{ vcenter_cluster | default('') }}"
        vcenter_folder: "{{ vcenter_folder | default('') }}"
        esxi_hostname: "{{ esxi_hostname | default('') }}"
        vm_name_regex: "{{ vm_name_regex | default('') }}"

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
        fail_msg: "vCenter hostname/username/password are required."

    # Pull VM inventory (optionally scoping to DC/cluster/folder/host)
    - name: Gather VM inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ (vcenter_datacenter | length > 0) | ternary(vcenter_datacenter, omit) }}"
        cluster:    "{{ (vcenter_cluster    | length > 0) | ternary(vcenter_cluster,    omit) }}"
        folder:     "{{ (vcenter_folder     | length > 0) | ternary(vcenter_folder,     omit) }}"
        esxi_hostname: "{{ (esxi_hostname   | length > 0) | ternary(esxi_hostname,      omit) }}"
      no_log: true
      delegate_to: localhost
      register: vm_info_raw

    # Optional name filtering (regex on VM name)
    - name: Filter VM list by name regex (if provided)
      ansible.builtin.set_fact:
        vm_info_filtered: >-
          {%- set vms = (vm_info_raw.virtual_machines | default([]))
                | selectattr('guest_name', 'defined') | list -%}
          {%- if vm_name_regex | default('') | length > 0 -%}
          {{ vms | selectattr('guest_name', 'match', vm_name_regex) | list }}
          {%- else -%}
          {{ vms }}
          {%- endif -%}

    # Build flattened rows for CSV/JSON (robust to missing keys)
    - name: Normalize VM rows
      ansible.builtin.set_fact:
        vm_rows: >-
          {%- set rows = [] -%}
          {%- for v in (vm_info_filtered | default([])) -%}
          {%- set _ = rows.append({
                'name':           (v.guest_name       | default(v.name | default(''))),
                'power_state':    (v.power_state      | default('')),
                'os_fullname':    (v.guest_fullname   | default(v.config.guestFullName | default(''))),
                'ip_address':     (v.ip_address       | default(v.guest_ip_address | default(''))),
                'tools_status':   (v.tools_running_status | default(v.guest_tools_status | default(''))),
                'cpu':            (v.cpu              | default(v.config.hardware.numCPU | default(''))),
                'memory_mb':      (v.memory_mb        | default(v.config.hardware.memoryMB | default(''))),
                'datacenter':     (v.datacenter       | default('')),
                'cluster':        (v.cluster          | default('')),
                'esxi_host':      (v.esxi_hostname    | default('')),
                'datastores':     ((v.datastores | default([])) | join(';')),
                'path':           (v.path             | default('')),
                'uuid':           (v.uuid             | default('')),
                'moid':           (v.moid             | default('')),
                'annotation':     (v.annotation       | default('')),
                'snapshot':       ((v.snapshots | default([])) | length > 0)
            }) -%}
          {%- endfor -%}
          {{ rows }}

    - name: Compose JSON export
      ansible.builtin.set_fact:
        vm_info_export:
          generated_at: "{{ ansible_date_time.iso8601 }}"
          vcenter: "{{ vcenter_hostname }}"
          scope:
            datacenter: "{{ vcenter_datacenter }}"
            cluster: "{{ vcenter_cluster }}"
            folder: "{{ vcenter_folder }}"
            esxi_hostname: "{{ esxi_hostname }}"
            vm_name_regex: "{{ vm_name_regex }}"
          count: "{{ vm_rows | length }}"
          rows: "{{ vm_rows }}"

    - name: Write JSON file
      ansible.builtin.copy:
        dest: "{{ vm_info_json_path }}"
        content: "{{ vm_info_export | to_nice_json }}"
        mode: '0640'
      delegate_to: localhost

    - name: Render CSV lines
      ansible.builtin.set_fact:
        _csv_lines: >-
          {%- set header = 'name,power_state,os_fullname,ip_address,tools_status,cpu,memory_mb,datacenter,cluster,esxi_host,datastores,path,uuid,moid,annotation,snapshot' -%}
          {%- set lines = [header] -%}
          {%- for r in vm_rows -%}
          {%-   set _ = lines.append('%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s' | format(
                   (r.name|default(''))|replace(',',' '),
                   (r.power_state|default(''))|replace(',',' '),
                   (r.os_fullname|default(''))|replace(',',' '),
                   (r.ip_address|default(''))|replace(',',' '),
                   (r.tools_status|default(''))|replace(',',' '),
                   (r.cpu|default('')),
                   (r.memory_mb|default('')),
                   (r.datacenter|default(''))|replace(',',' '),
                   (r.cluster|default(''))|replace(',',' '),
                   (r.esxi_host|default(''))|replace(',',' '),
                   (r.datastores|default(''))|replace(',',';'),
                   (r.path|default(''))|replace(',',' '),
                   (r.uuid|default('')),
                   (r.moid|default('')),
                   (r.annotation|default(''))|replace(',',' '),
                   (r.snapshot|default(false))
                 )) -%}
          {%- endfor -%}
          {{ lines | join('\n') }}

    - name: Write CSV file
      ansible.builtin.copy:
        dest: "{{ vm_info_csv_path }}"
        content: "{{ _csv_lines }}\n"
        mode: '0640'
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        msg:
          total_vms: "{{ vm_rows | length }}"
          json: "{{ vm_info_json_path }}"
          csv:  "{{ vm_info_csv_path }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/vsphere_vm_info | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsphere_vm_info_preflight_passed | bool
          - fe_vmware_vsphere_vm_info_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsphere_vm_info: postflight validation failed - preflight passed
          ={{ fe_vmware_vsphere_vm_info_preflight_passed | default(false) }},
          status={{ fe_vmware_vsphere_vm_info_status | default('unknown') }}.
        success_msg: "vmware/vsphere_vm_info: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsphere_vm_info | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_info_postflight_passed: true
        fe_vmware_vsphere_vm_info_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsphere_vm_info | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_info_status: "failed"
        fe_vmware_vsphere_vm_info_postflight_passed: false
        fe_vmware_vsphere_vm_info_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsphere_vm_info_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_vm_info | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsphere_vm_info: FAILED at '{{ fe_vmware_vsphere_vm_info_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsphere_vm_info_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_vm_info | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsphere_vm_info failed at '{{ fe_vmware_vsphere_vm_info_failed_task }}': {{ fe_vmware_vsphere_vm_info_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsphere_vm_info | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_info_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsphere_vm_info_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsphere_vm_info_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsphere_vm_info | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsphere_vm_info":
              component: "vmware/vsphere_vm_info"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsphere_vm_info_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsphere_vm_info_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsphere_vm_info_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsphere_vm_info_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsphere_vm_info_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsphere_vm_info_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsphere_vm_info_failed_task | default('') }}"
              error: "{{ fe_vmware_vsphere_vm_info_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsphere_vm_info_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsphere_vm_info_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsphere_vm_info_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsphere_vm_info_status | default('') == 'succeeded' else ['vmware/vsphere_vm_info'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsphere_vm_info | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_info_stats_published: true
      tags:
        - always
