---
# tasks/find_all_vsphere_snapshots.yml
# Purpose: Enumerate all VMs in vCenter and collect their snapshot info into a single report.
# Notes:
#   - Runs entirely from the control node (delegated to localhost).
#   - Store creds in Ansible Vault or environment variables (recommended).
#   - Produces an in-memory "snapshot_report" fact and prints a summary.
#   - Optionally writes a JSON report file to the controller.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/find_all_vsphere_snapshots']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_find_all_vsphere_snapshots_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/find_all_vsphere_snapshots | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_find_all_vsphere_snapshots_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_find_all_vsphere_snapshots_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_find_all_vsphere_snapshots_status: "running"
    fe_vmware_find_all_vsphere_snapshots_preflight_passed: false
    fe_vmware_find_all_vsphere_snapshots_postflight_passed: false
    fe_vmware_find_all_vsphere_snapshots_failed_task: ""
    fe_vmware_find_all_vsphere_snapshots_error: ""
    fe_vmware_find_all_vsphere_snapshots_stats_published: false
  tags:
    - always

- name: "vmware/find_all_vsphere_snapshots | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/find_all_vsphere_snapshots | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/find_all_vsphere_snapshots: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/find_all_vsphere_snapshots: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/find_all_vsphere_snapshots | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/find_all_vsphere_snapshots: required variable '{{ item }}' is not defined."
        success_msg: "vmware/find_all_vsphere_snapshots: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_find_all_vsphere_snapshots_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/find_all_vsphere_snapshots | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_find_all_vsphere_snapshots_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Gather all VMs from vCenter
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        # datacenter: "{{ vcenter_datacenter | default(omit) }}"   # uncomment if you want to scope to a DC
      no_log: true
      delegate_to: localhost
      register: vminfo
      tags: [snapshots, discovery]

    - name: Build list of VM names to query for snapshots
      ansible.builtin.set_fact:
        vm_names: "{{ vminfo.virtual_machines | map(attribute='guest_name') | select('defined') | list }}"
      tags: [snapshots, discovery]

    - name: Get snapshot info for each VM
      community.vmware.vmware_guest_snapshot_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        name: "{{ item }}"
      no_log: true
      loop: "{{ vm_names }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: localhost
      register: snapshot_info_results
      tags: [snapshots, discovery]

    # snapshot_info_results.results[*] typically contains:
    #   - item: VM name
    #   - snapshots: [] or list of snapshot trees with name, description, create_time, state, etc.

    - name: Normalize snapshot data into a flat list
      ansible.builtin.set_fact:
        snapshot_report: >-
          {{
            snapshot_info_results.results
            | json_query('[].{vm:item, snapshots: snapshots}')
            | map('combine', {
                'snapshots': (
                  (.[].snapshots | default([]))
                )
              }) | list
          }}
      vars:
        # helper to flatten nested snapshot trees, if present
        # you can keep it simple if your environment doesn’t use nested trees
        # For complex trees, consider a custom filter; here we keep native structures.
      tags: [snapshots]

    - name: Filter to VMs that actually have snapshots
      ansible.builtin.set_fact:
        snapshot_report: "{{ snapshot_report | selectattr('snapshots', 'defined') | selectattr('snapshots', 'truthy') | list }}"
      tags: [snapshots]

    - name: Show summary of VMs with snapshots
      ansible.builtin.debug:
        msg:
          total_vms_checked: "{{ vm_names | length }}"
          vms_with_snapshots: "{{ snapshot_report | length }}"
      tags: [snapshots]

    - name: Pretty print snapshot details
      ansible.builtin.debug:
        var: snapshot_report
        verbosity: 1
      tags: [snapshots]

    # Optional: write a JSON file to the controller
    - name: Write snapshot report to JSON (controller)
      ansible.builtin.copy:
        dest: "{{ snapshot_report_path | default('./vsphere_snapshots.json') }}"
        content: "{{ snapshot_report | to_nice_json }}"
        mode: '0640'
      delegate_to: localhost
      when: snapshot_report | length > 0
      tags: [snapshots, report]

    # ----------------------------- postflight -------------------

    - name: "vmware/find_all_vsphere_snapshots | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_find_all_vsphere_snapshots_preflight_passed | bool
          - fe_vmware_find_all_vsphere_snapshots_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/find_all_vsphere_snapshots: postflight validation failed - preflight passed
          ={{ fe_vmware_find_all_vsphere_snapshots_preflight_passed | default(false) }},
          status={{ fe_vmware_find_all_vsphere_snapshots_status | default('unknown') }}.
        success_msg: "vmware/find_all_vsphere_snapshots: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/find_all_vsphere_snapshots | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_find_all_vsphere_snapshots_postflight_passed: true
        fe_vmware_find_all_vsphere_snapshots_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/find_all_vsphere_snapshots | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_find_all_vsphere_snapshots_status: "failed"
        fe_vmware_find_all_vsphere_snapshots_postflight_passed: false
        fe_vmware_find_all_vsphere_snapshots_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_find_all_vsphere_snapshots_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/find_all_vsphere_snapshots | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/find_all_vsphere_snapshots: FAILED at '{{ fe_vmware_find_all_vsphere_snapshots_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_find_all_vsphere_snapshots_error }}
      tags:
        - always
        - rescue

    - name: "vmware/find_all_vsphere_snapshots | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/find_all_vsphere_snapshots failed at '{{ fe_vmware_find_all_vsphere_snapshots_failed_task }}': {{ fe_vmware_find_all_vsphere_snapshots_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/find_all_vsphere_snapshots | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_find_all_vsphere_snapshots_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_find_all_vsphere_snapshots_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_find_all_vsphere_snapshots_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/find_all_vsphere_snapshots | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/find_all_vsphere_snapshots":
              component: "vmware/find_all_vsphere_snapshots"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_find_all_vsphere_snapshots_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_find_all_vsphere_snapshots_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_find_all_vsphere_snapshots_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_find_all_vsphere_snapshots_started_at | default('') }}"
              ended_at: "{{ fe_vmware_find_all_vsphere_snapshots_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_find_all_vsphere_snapshots_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_find_all_vsphere_snapshots_failed_task | default('') }}"
              error: "{{ fe_vmware_find_all_vsphere_snapshots_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_find_all_vsphere_snapshots_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_find_all_vsphere_snapshots_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_find_all_vsphere_snapshots_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_find_all_vsphere_snapshots_status | default('') == 'succeeded' else ['vmware/find_all_vsphere_snapshots'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/find_all_vsphere_snapshots | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_find_all_vsphere_snapshots_stats_published: true
      tags:
        - always
