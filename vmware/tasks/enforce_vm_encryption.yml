---
# Enforce VM Encryption in vSphere using a storage policy
#
# What this does
#  - (Optional) Creates/updates a Standard Key Provider (external KMS) and trusts it
#  - Confirms an encryption storage policy (default: "VM Encryption Policy") exists
#  - Applies the policy to VM Home + all VMDKs for each VM in vm_names
#
# Inputs you provide:
#   vcenter_hostname, vcenter_username, vcenter_password, vcenter_validate_certs
#   vcenter_datacenter
#   vm_names: [ "vm01", "vm02", ... ]
#
#   encryption_policy_name: "VM Encryption Policy"   # change if you use a custom policy
#
#   # Optional: define a Standard Key Provider and trust it (skip if KMS already configured)
#   kms_config:
#     enabled: false
#     name: "corp-standard-kp"
#     mark_default: true
#     kms_info:
#       - kms_name: "corp-kms1"
#         kms_ip: "10.10.10.50"
#         kms_port: 5696
#     # choose ONE trust path (see vcenter_standard_key_provider docs)
#     trust:
#       upload_client_cert: "/path/client_cert.pem"
#       upload_client_key:  "/path/client_key.pem"
#     # OR:
#     # trust:
#     #   download_client_csr: "/tmp/vc.csr"
#     #   upload_kms_signed_client_csr: "/path/kms_signed_vc_cert.pem"
#     # OR:
#     # trust:
#     #   download_self_signed_cert: "/tmp/vc_self_signed_client_cert.pem"
#
# Notes:
# - This task enforces encryption via a storage policy. vSphere handles keying.
# - Disks must be offline-resignature-safe for policy moves if your storage enforces that.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/enforce_vm_encryption']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_enforce_vm_encryption_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/enforce_vm_encryption | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_enforce_vm_encryption_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_enforce_vm_encryption_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_enforce_vm_encryption_status: "running"
    fe_vmware_enforce_vm_encryption_preflight_passed: false
    fe_vmware_enforce_vm_encryption_postflight_passed: false
    fe_vmware_enforce_vm_encryption_failed_task: ""
    fe_vmware_enforce_vm_encryption_error: ""
    fe_vmware_enforce_vm_encryption_stats_published: false
  tags:
    - always

- name: "vmware/enforce_vm_encryption | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/enforce_vm_encryption | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/enforce_vm_encryption: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/enforce_vm_encryption: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/enforce_vm_encryption | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/enforce_vm_encryption: required variable '{{ item }}' is not defined."
        success_msg: "vmware/enforce_vm_encryption: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_enforce_vm_encryption_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/enforce_vm_encryption | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_enforce_vm_encryption_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set sane defaults
      ansible.builtin.set_fact:
        encryption_policy_name: "{{ encryption_policy_name | default('VM Encryption Policy') }}"
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        kms_config: "{{ kms_config | default({'enabled': false}) }}"

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - vcenter_datacenter | length > 0
          - vm_names is defined
          - vm_names | length > 0
        fail_msg: "Missing required inputs: vCenter creds/datacenter and at least one VM name."

    # ------------------------------------------------------------------
    # (Optional) Configure a Standard Key Provider (external KMS)
    # ------------------------------------------------------------------
    - name: "KMS | Ensure Standard Key Provider exists and is trusted"
      community.vmware.vcenter_standard_key_provider:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        name: "{{ kms_config.name }}"
        state: present
        kms_info: "{{ kms_config.kms_info | default([]) }}"
        mark_default: "{{ kms_config.mark_default | default(true) }}"
        make_kms_trust_vc: "{{ kms_config.trust | default(omit) }}"
      no_log: true
      when: kms_config.enabled | default(false) | bool
      delegate_to: localhost
      register: kms_result

    # ------------------------------------------------------------------
    # Verify an encryption storage policy is available
    # ------------------------------------------------------------------
    - name: "Policy | Gather available VM storage policies"
      community.vmware.vmware_vm_storage_policy_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      delegate_to: localhost
      register: sp_info

    - name: "Policy | Fail if encryption policy not found"
      ansible.builtin.assert:
        that:
          - sp_info is defined
          - (sp_info.policies | selectattr('name','equalto', encryption_policy_name) | list | length) > 0
        fail_msg: "Storage policy '{{ encryption_policy_name }}' not found. Create or publish an encryption policy in vCenter."

    # ------------------------------------------------------------------
    # Apply policy to each VM: VM Home + all disks
    # ------------------------------------------------------------------
    - name: "VM | Gather disk layout for each VM (vsphere schema)"
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        schema: "vsphere"
        properties:
          - "config.hardware.device"
      no_log: true
      loop: "{{ vm_names }}"
      delegate_to: localhost
      register: vm_hw

    - name: "VM | Build disk maps (controller/unit) for each VM"
      ansible.builtin.set_fact:
        _vm_disks: >-
          {%- set m = {} -%}
          {%- for r in vm_hw.results -%}
            {%- set disks = [] -%}
            {%- for d in r.instance.config.hardware.device
                  | selectattr('_wsdlName', 'equalto', 'VirtualDisk') | list -%}
              {%- set _ = disks.append({'controllerKey': d.controllerKey, 'unitNumber': d.unitNumber}) -%}
            {%- endfor -%}
            {%- set _ = m.update({r.item: disks}) -%}
          {%- endfor -%}
          {{ m }}

    # Helper to translate controllerKey -> controller_number (0..3).
    # We derive by ordering controllers as they appear.
    - name: "VM | Map controller keys to (0..3) index"
      ansible.builtin.set_fact:
        _vm_ctrl_index: >-
          {%- set m = {} -%}
          {%- for r in vm_hw.results -%}
            {%- set km = {} -%}
            {%- for c in r.instance.config.hardware.device
                  | selectattr('_wsdlName', 'in',
                      ['VirtualLsiLogicController', 'ParaVirtualSCSIController', 'VirtualLsiLogicSASController'])
                  | list -%}
              {%- set _ = km.update({c.key | string: loop.index0}) -%}
            {%- endfor -%}
            {%- set _ = m.update({r.item: km}) -%}
          {%- endfor -%}
          {{ m }}

    - name: "VM | Apply encryption policy to VM Home + all disks"
      community.vmware.vmware_guest_storage_policy:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item.key }}"
        vm_home: "{{ encryption_policy_name }}"
        disk: >-
          {%- set disks = [] -%}
          {%- for d in item.value -%}
            {%- set ctrl = (_vm_ctrl_index[item.key] | default({}))[d.controllerKey | string] | default(0) -%}
            {%- set _ = disks.append({'policy': encryption_policy_name,
                                      'controller_number': ctrl,
                                      'unit_number': d.unitNumber}) -%}
          {%- endfor -%}
          {{ disks }}
      no_log: true
      loop: "{{ _vm_disks | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      delegate_to: localhost
      register: enc_apply

    # (Optional) Retrieve compliance after policy application (REST)
    # - Requires vmware.vmware_rest collection and vSphere 7.0.3+
    # - Uncomment to check compliance
    # - name: "VM | Check storage policy compliance"
    #   vmware.vmware_rest.vcenter_vm_storage_policy_compliance:
    #     vm: "{{ some_vm_id }}"
    #   delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "vmware/enforce_vm_encryption | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_enforce_vm_encryption_preflight_passed | bool
          - fe_vmware_enforce_vm_encryption_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/enforce_vm_encryption: postflight validation failed - preflight passed
          ={{ fe_vmware_enforce_vm_encryption_preflight_passed | default(false) }},
          status={{ fe_vmware_enforce_vm_encryption_status | default('unknown') }}.
        success_msg: "vmware/enforce_vm_encryption: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/enforce_vm_encryption | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_enforce_vm_encryption_postflight_passed: true
        fe_vmware_enforce_vm_encryption_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/enforce_vm_encryption | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_enforce_vm_encryption_status: "failed"
        fe_vmware_enforce_vm_encryption_postflight_passed: false
        fe_vmware_enforce_vm_encryption_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_enforce_vm_encryption_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/enforce_vm_encryption | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/enforce_vm_encryption: FAILED at '{{ fe_vmware_enforce_vm_encryption_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_enforce_vm_encryption_error }}
      tags:
        - always
        - rescue

    - name: "vmware/enforce_vm_encryption | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/enforce_vm_encryption failed at '{{ fe_vmware_enforce_vm_encryption_failed_task }}': {{ fe_vmware_enforce_vm_encryption_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/enforce_vm_encryption | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_enforce_vm_encryption_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_enforce_vm_encryption_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_enforce_vm_encryption_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/enforce_vm_encryption | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/enforce_vm_encryption":
              component: "vmware/enforce_vm_encryption"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_enforce_vm_encryption_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_enforce_vm_encryption_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_enforce_vm_encryption_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_enforce_vm_encryption_started_at | default('') }}"
              ended_at: "{{ fe_vmware_enforce_vm_encryption_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_enforce_vm_encryption_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_enforce_vm_encryption_failed_task | default('') }}"
              error: "{{ fe_vmware_enforce_vm_encryption_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_enforce_vm_encryption_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_enforce_vm_encryption_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_enforce_vm_encryption_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_enforce_vm_encryption_status | default('') == 'succeeded' else ['vmware/enforce_vm_encryption'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/enforce_vm_encryption | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_enforce_vm_encryption_stats_published: true
      tags:
        - always
