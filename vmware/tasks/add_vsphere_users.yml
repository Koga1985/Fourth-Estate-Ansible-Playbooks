---
# Purpose:
#  (A) Create local users on ESXi hosts
#  (B) Assign permissions (roles) to principals on vCenter/ESXi objects
#
# Requirements:
#  - collections: community.vmware
#
# Expected vars:
#  # ESXi section (A)
#  esxi_hostname: "esxi01.example.local"
#  esxi_username: "root"
#  esxi_password: "{{ vault_esxi_root_password }}"
#  esxi_validate_certs: false
#  esxi_local_users:
#    - name: "opsadmin"
#      password: "{{ vault_opsadmin_pwd }}"
#      description: "Ops admin"
#      state: present        # present|absent
#    - name: "readonly1"
#      password: "{{ vault_ro_pwd }}"
#      description: "Read-only user"
#      state: present
#
#  # Permissions section (B)
#  vcenter_hostname: "vcenter.example.local"
#  vcenter_username: "{{ lookup('env','VCENTER_USERNAME') }}"
#  vcenter_password: "{{ lookup('env','VCENTER_PASSWORD') }}"
#  vcenter_validate_certs: false
#  # Optional: create/update a custom local role at vCenter
#  vc_local_roles: []       # e.g. [{ name: "Ops-ReadOnly", privileges: ["System.View","System.Anonymous"] }]
#  # Assign principals to objects with roles
#  vc_permissions: []
#  # Example:
#  # vc_permissions:
#  #   - { object_type: "Folder", object_name: "Production", principal: "EXAMPLE\\vSphere-Admins", role_name: "Administrator", propagate: true, state: present }
#  #   - { object_type: "Datacenter", object_name: "DC1", principal: "readonly1", role_name: "Read-only", propagate: true, state: present }

# ----------------------------
# (A) ESXi: create local users
# ----------------------------

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/add_vsphere_users']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_add_vsphere_users_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/add_vsphere_users | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_add_vsphere_users_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_add_vsphere_users_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_add_vsphere_users_status: "running"
    fe_vmware_add_vsphere_users_preflight_passed: false
    fe_vmware_add_vsphere_users_postflight_passed: false
    fe_vmware_add_vsphere_users_failed_task: ""
    fe_vmware_add_vsphere_users_error: ""
    fe_vmware_add_vsphere_users_stats_published: false
  tags:
    - always

- name: "vmware/add_vsphere_users | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/add_vsphere_users | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/add_vsphere_users: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/add_vsphere_users: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/add_vsphere_users | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/add_vsphere_users: required variable '{{ item }}' is not defined."
        success_msg: "vmware/add_vsphere_users: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_add_vsphere_users_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/add_vsphere_users | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_add_vsphere_users_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "ESXi | Ensure local users exist/absent"
      community.vmware.vmware_local_user_manager:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ esxi_validate_certs | default(false) }}"
        local_user_name: "{{ item.name }}"
        local_user_password: "{{ item.password | default(omit) }}"
        local_user_description: "{{ item.description | default(omit) }}"
        state: "{{ item.state | default('present') }}"
      no_log: true
      loop: "{{ esxi_local_users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      when: esxi_local_users is defined and esxi_local_users | length > 0
      tags: [esxi_users]
      # Creates/removes ESXi local users via API. :contentReference[oaicite:3]{index=3}

    # -----------------------------------------------------
    # (B1) vCenter/ESXi: optional custom local role creation
    # -----------------------------------------------------
    - name: "VC/ESXi | Ensure custom local roles exist (optional)"
      community.vmware.vmware_local_role_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        local_role_name: "{{ item.name }}"
        privileges: "{{ item.privileges | default(omit) }}"
        state: present
      no_log: true
      loop: "{{ vc_local_roles | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      when: vc_local_roles is defined and vc_local_roles | length > 0
      tags: [roles]
      # Manages local roles & privileges on vCenter/ESXi. :contentReference[oaicite:4]{index=4}

    # --------------------------------------------------------
    # (B2) vCenter/ESXi: assign object permissions to principals
    # --------------------------------------------------------
    - name: "VC/ESXi | Assign object permissions to principals"
      community.vmware.vmware_object_role_permission:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        object_type: "{{ item.object_type }}"
        object_name: "{{ item.object_name }}"
        principal: "{{ item.principal }}"
        role: "{{ item.role_name }}"
        propagate: "{{ item.propagate | default(true) }}"
        state: "{{ item.state | default('present') }}"
      no_log: true
      loop: "{{ vc_permissions | default([]) }}"
      loop_control:
        label: "{{ item.object_type }} {{ item.object_name }} -> {{ item.principal }} : {{ item.role_name }}"
      delegate_to: localhost
      when: vc_permissions is defined and vc_permissions | length > 0
      tags: [permissions]
      # Assigns/removes permissions (present|absent) on folders, DCs, etc. :contentReference[oaicite:5]{index=5}

    # ----------------------------- postflight -------------------

    - name: "vmware/add_vsphere_users | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_add_vsphere_users_preflight_passed | bool
          - fe_vmware_add_vsphere_users_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/add_vsphere_users: postflight validation failed - preflight passed
          ={{ fe_vmware_add_vsphere_users_preflight_passed | default(false) }},
          status={{ fe_vmware_add_vsphere_users_status | default('unknown') }}.
        success_msg: "vmware/add_vsphere_users: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/add_vsphere_users | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_add_vsphere_users_postflight_passed: true
        fe_vmware_add_vsphere_users_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/add_vsphere_users | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_add_vsphere_users_status: "failed"
        fe_vmware_add_vsphere_users_postflight_passed: false
        fe_vmware_add_vsphere_users_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_add_vsphere_users_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/add_vsphere_users | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/add_vsphere_users: FAILED at '{{ fe_vmware_add_vsphere_users_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_add_vsphere_users_error }}
      tags:
        - always
        - rescue

    - name: "vmware/add_vsphere_users | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/add_vsphere_users failed at '{{ fe_vmware_add_vsphere_users_failed_task }}': {{ fe_vmware_add_vsphere_users_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/add_vsphere_users | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_add_vsphere_users_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_add_vsphere_users_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_add_vsphere_users_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/add_vsphere_users | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/add_vsphere_users":
              component: "vmware/add_vsphere_users"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_add_vsphere_users_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_add_vsphere_users_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_add_vsphere_users_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_add_vsphere_users_started_at | default('') }}"
              ended_at: "{{ fe_vmware_add_vsphere_users_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_add_vsphere_users_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_add_vsphere_users_failed_task | default('') }}"
              error: "{{ fe_vmware_add_vsphere_users_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_add_vsphere_users_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_add_vsphere_users_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_add_vsphere_users_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_add_vsphere_users_status | default('') == 'succeeded' else ['vmware/add_vsphere_users'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/add_vsphere_users | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_add_vsphere_users_stats_published: true
      tags:
        - always
