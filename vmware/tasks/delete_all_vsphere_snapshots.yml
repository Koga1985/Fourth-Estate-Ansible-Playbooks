---
# tasks/delete_all_vsphere_snapshots.yml
# Deletes ALL snapshots on ALL VMs in the specified vCenter/datacenter.
# Safety: Won't run unless confirm_delete_all_snapshots is true.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/delete_all_vsphere_snapshots']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_delete_all_vsphere_snapshots_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/delete_all_vsphere_snapshots | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_delete_all_vsphere_snapshots_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_delete_all_vsphere_snapshots_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_delete_all_vsphere_snapshots_status: "running"
    fe_vmware_delete_all_vsphere_snapshots_preflight_passed: false
    fe_vmware_delete_all_vsphere_snapshots_postflight_passed: false
    fe_vmware_delete_all_vsphere_snapshots_failed_task: ""
    fe_vmware_delete_all_vsphere_snapshots_error: ""
    fe_vmware_delete_all_vsphere_snapshots_stats_published: false
  tags:
    - always

- name: "vmware/delete_all_vsphere_snapshots | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/delete_all_vsphere_snapshots | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/delete_all_vsphere_snapshots: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/delete_all_vsphere_snapshots: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/delete_all_vsphere_snapshots | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/delete_all_vsphere_snapshots: required variable '{{ item }}' is not defined."
        success_msg: "vmware/delete_all_vsphere_snapshots: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_delete_all_vsphere_snapshots_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/delete_all_vsphere_snapshots | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_delete_all_vsphere_snapshots_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Safety check — explicit confirmation required
      ansible.builtin.assert:
        that:
          - confirm_delete_all_snapshots | default(false) | bool
        fail_msg: >
          Refusing to proceed. Set confirm_delete_all_snapshots=true to delete ALL VM snapshots.

    - name: Gather all VMs (to get MoIDs)
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
      no_log: true
      delegate_to: localhost
      register: vminfo
      tags: [snapshots, discovery]
      # vmware_vm_info returns a list with each VM's name and moid, among other fields. :contentReference[oaicite:1]{index=1}

    - name: Build list of {name, moid}
      ansible.builtin.set_fact:
        vm_moids: >-
          {{ vminfo.virtual_machines
             | map(attribute='moid')
             | list }}
        vm_names: >-
          {{ vminfo.virtual_machines
             | map(attribute='guest_name')
             | list }}

    - name: Remove ALL snapshots for each VM (throttled)
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        datacenter: "{{ vcenter_datacenter }}"
        moid: "{{ item }}"
        state: remove_all
      no_log: true
      loop: "{{ vm_moids }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: localhost
      throttle: "{{ snapshot_delete_concurrency | default(2) }}"
      register: snapshot_purge
      tags: [snapshots, delete]
      # state: remove_all is the supported way to delete all snapshots on a VM. :contentReference[oaicite:2]{index=2}

    - name: Show summary
      ansible.builtin.debug:
        msg:
          total_vms: "{{ vm_moids | length }}"
          changed_tasks: "{{ snapshot_purge.results | selectattr('changed','defined') | selectattr('changed') | list | length }}"
          failed_tasks:  "{{ snapshot_purge.results | selectattr('failed','defined')  | selectattr('failed')  | list | length }}"
      tags: [snapshots, report]

    # ----------------------------- postflight -------------------

    - name: "vmware/delete_all_vsphere_snapshots | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_delete_all_vsphere_snapshots_preflight_passed | bool
          - fe_vmware_delete_all_vsphere_snapshots_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/delete_all_vsphere_snapshots: postflight validation failed - preflight passed
          ={{ fe_vmware_delete_all_vsphere_snapshots_preflight_passed | default(false) }},
          status={{ fe_vmware_delete_all_vsphere_snapshots_status | default('unknown') }}.
        success_msg: "vmware/delete_all_vsphere_snapshots: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/delete_all_vsphere_snapshots | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_delete_all_vsphere_snapshots_postflight_passed: true
        fe_vmware_delete_all_vsphere_snapshots_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/delete_all_vsphere_snapshots | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_delete_all_vsphere_snapshots_status: "failed"
        fe_vmware_delete_all_vsphere_snapshots_postflight_passed: false
        fe_vmware_delete_all_vsphere_snapshots_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_delete_all_vsphere_snapshots_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/delete_all_vsphere_snapshots | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/delete_all_vsphere_snapshots: FAILED at '{{ fe_vmware_delete_all_vsphere_snapshots_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_delete_all_vsphere_snapshots_error }}
      tags:
        - always
        - rescue

    - name: "vmware/delete_all_vsphere_snapshots | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/delete_all_vsphere_snapshots failed at '{{ fe_vmware_delete_all_vsphere_snapshots_failed_task }}': {{ fe_vmware_delete_all_vsphere_snapshots_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/delete_all_vsphere_snapshots | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_delete_all_vsphere_snapshots_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_delete_all_vsphere_snapshots_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_delete_all_vsphere_snapshots_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/delete_all_vsphere_snapshots | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/delete_all_vsphere_snapshots":
              component: "vmware/delete_all_vsphere_snapshots"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_delete_all_vsphere_snapshots_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_delete_all_vsphere_snapshots_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_delete_all_vsphere_snapshots_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_delete_all_vsphere_snapshots_started_at | default('') }}"
              ended_at: "{{ fe_vmware_delete_all_vsphere_snapshots_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_delete_all_vsphere_snapshots_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_delete_all_vsphere_snapshots_failed_task | default('') }}"
              error: "{{ fe_vmware_delete_all_vsphere_snapshots_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_delete_all_vsphere_snapshots_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_delete_all_vsphere_snapshots_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_delete_all_vsphere_snapshots_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_delete_all_vsphere_snapshots_status | default('') == 'succeeded' else ['vmware/delete_all_vsphere_snapshots'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/delete_all_vsphere_snapshots | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_delete_all_vsphere_snapshots_stats_published: true
      tags:
        - always
