---
# Enforce VMware Host Profiles (classic) via PowerCLI + optional maintenance mode.
#
# Required vCenter vars:
#   vcenter_hostname, vcenter_username, vcenter_password, vcenter_validate_certs (bool)
#
# Required profile vars:
#   profile_name: "ESXi-Std"
#
# Optional capture (create/refresh profile from a reference host):
#   capture_from_reference: true|false
#   reference_host: "esxi01.lab.local"
#   replace_existing_profile: true|false   # if true and profile exists, delete & recapture
#
# Attach/apply scope (one of these):
#   attach_to_cluster: "Compute-Cluster"   # applies/attaches at cluster level
#   attach_to_hosts: ["esxi01.lab.local","esxi02.lab.local"]  # per-host
#
# Compliance + remediation:
#   remediate: true|false          # actually apply profile after test
#   ensure_maintenance_mode: true  # enter MM before apply, exit after
#   evacuate_vms: true             # try vMotion evacuation for MM
#   mm_timeout: 3600               # seconds
#
# Notes:
# - Applying a Host Profile requires the **target host/cluster in maintenance mode**. :contentReference[oaicite:2]{index=2}
# - This task runs PowerShell Core (`pwsh`) with **VMware.PowerCLI** installed on the controller (or your jump host).

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/host_profiles_enforce']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_host_profiles_enforce_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/host_profiles_enforce | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_host_profiles_enforce_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_host_profiles_enforce_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_host_profiles_enforce_status: "running"
    fe_vmware_host_profiles_enforce_preflight_passed: false
    fe_vmware_host_profiles_enforce_postflight_passed: false
    fe_vmware_host_profiles_enforce_failed_task: ""
    fe_vmware_host_profiles_enforce_error: ""
    fe_vmware_host_profiles_enforce_stats_published: false
  tags:
    - always

- name: "vmware/host_profiles_enforce | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/host_profiles_enforce | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/host_profiles_enforce: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/host_profiles_enforce: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/host_profiles_enforce | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/host_profiles_enforce: required variable '{{ item }}' is not defined."
        success_msg: "vmware/host_profiles_enforce: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_host_profiles_enforce_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/host_profiles_enforce | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_host_profiles_enforce_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required vars
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - profile_name | length > 0
          - (attach_to_cluster is defined) or (attach_to_hosts is defined and attach_to_hosts | length > 0)
        fail_msg: "Set vCenter creds, profile_name, and attach_to_cluster OR attach_to_hosts."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        capture_from_reference: "{{ capture_from_reference | default(false) }}"
        replace_existing_profile: "{{ replace_existing_profile | default(false) }}"
        remediate: "{{ remediate | default(true) }}"
        ensure_maintenance_mode: "{{ ensure_maintenance_mode | default(true) }}"
        evacuate_vms: "{{ evacuate_vms | default(true) }}"
        mm_timeout: "{{ mm_timeout | default(3600) }}"

    ##############################################################################
    # (Optional) Enter maintenance mode on target hosts before apply
    ##############################################################################
    - name: Build list of target hosts
      ansible.builtin.set_fact:
        _target_hosts: >-
          {{
            (attach_to_hosts | default([])) if (attach_to_hosts is defined)
            else []
          }}
      when: ensure_maintenance_mode | bool

    - name: If applying to a cluster, discover member hosts (simple collection call)
      community.vmware.vmware_cluster_host_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        cluster_name: "{{ attach_to_cluster }}"
      no_log: true
      register: _cluster_hosts
      when:
        - ensure_maintenance_mode | bool
        - attach_to_cluster is defined
      delegate_to: localhost

    - name: Combine host list (cluster + explicit)
      ansible.builtin.set_fact:
        _target_hosts: >-
          {{
            (_target_hosts | default([]))
            + ((_cluster_hosts.hosts | map(attribute='name') | list) if _cluster_hosts is defined else [])
          }}
      when: ensure_maintenance_mode | bool

    - name: Enter maintenance mode on target hosts (if requested)
      community.vmware.vmware_maintenancemode:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        esxi_hostname: "{{ item }}"
        state: present
        evacuate: "{{ evacuate_vms | bool }}"
        timeout: "{{ mm_timeout | int }}"
      no_log: true
      loop: "{{ _target_hosts | default([]) }}"
      when: ensure_maintenance_mode | bool
      delegate_to: localhost

    ##############################################################################
    # PowerCLI block: capture (optional), attach, test, remediate
    ##############################################################################
    # Script flow: look up (or capture) the host profile, resolve the attach
    # scope (cluster or host list), associate the profile, test compliance,
    # optionally remediate, and emit a compact JSON result.
    # NOTE: the >- block folds newlines to spaces, so every PowerShell statement
    # ends with ';' and line comments must not be used inside the script.
    - name: Enforce Host Profile via PowerCLI
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop';
          Import-Module VMware.PowerCLI -ErrorAction Stop;
          Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore', 'Fail') }} -Confirm:$false | Out-Null;
          $si = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

          $profile = Get-VMHostProfile -Name '{{ profile_name }}' -ErrorAction SilentlyContinue;
          if ({{ capture_from_reference | ternary('$true', '$false') }}) {
            if ('{{ reference_host | default('') }}' -eq '') { throw 'reference_host is required when capture_from_reference is true.' }
            if ($profile -and {{ replace_existing_profile | ternary('$true', '$false') }}) {
              Remove-VMHostProfile -VMHostProfile $profile -Confirm:$false;
              $profile = $null
            }
            if (-not $profile) {
              $ref = Get-VMHost -Name '{{ reference_host | default('') }}';
              $profile = New-VMHostProfile -Name '{{ profile_name }}' -ReferenceHost $ref
            }
          }

          if ('{{ attach_to_cluster | default('') }}' -ne '') {
            $scope = Get-Cluster -Name '{{ attach_to_cluster | default('') }}';
          } elseif (@('{{ (attach_to_hosts | default([])) | join("','") }}').Length -gt 0) {
            $scope = @('{{ (attach_to_hosts | default([])) | join("','") }}' | ForEach-Object { Get-VMHost -Name $_ });
          } else {
            throw 'Provide attach_to_cluster or attach_to_hosts.'
          }

          if (-not $profile) {
            $profile = Get-VMHostProfile -Name '{{ profile_name }}' -ErrorAction Stop;
          }

          Set-VMHostProfile -VMHostProfile $profile -AssociateEntity $scope | Out-Null;

          $comp = if ($scope -is [VMware.VimAutomation.ViCore.Impl.V1.Inventory.ClusterImpl]) {
            Test-VMHostProfileCompliance -Profile $profile
          } else {
            Test-VMHostProfileCompliance -VMHost $scope
          };

          if ({{ remediate | ternary('$true', '$false') }}) {
            Invoke-VMHostProfile -Entity $scope -Profile $profile | Out-Null;
            Start-Sleep -Seconds 5;
            $comp = if ($scope -is [VMware.VimAutomation.ViCore.Impl.V1.Inventory.ClusterImpl]) {
              Test-VMHostProfileCompliance -Profile $profile
            } else {
              Test-VMHostProfileCompliance -VMHost $scope
            };
          }

          $out = [pscustomobject]@{
            profile = '{{ profile_name }}';
            attached_to = if ('{{ attach_to_cluster | default('') }}' -ne '') { '{{ attach_to_cluster | default('') }}' } else { '{{ (attach_to_hosts | default([])) | join(',') }}' };
            remediate = {{ remediate | ternary('$true', '$false') }};
            compliant = -not ($comp | Where-Object { $_.Status -ne 'Compliant' });
          };
          $out | ConvertTo-Json -Depth 5;
          "
      register: hostprof_result
      changed_when: true
      delegate_to: localhost

    ##############################################################################
    # (Optional) Exit maintenance mode after apply
    ##############################################################################
    - name: Exit maintenance mode after apply (if requested)
      community.vmware.vmware_maintenancemode:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        esxi_hostname: "{{ item }}"
        state: absent
        timeout: "{{ mm_timeout | int }}"
      no_log: true
      loop: "{{ _target_hosts | default([]) }}"
      when: ensure_maintenance_mode | bool
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        var: hostprof_result.stdout

    # ----------------------------- postflight -------------------

    - name: "vmware/host_profiles_enforce | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_host_profiles_enforce_preflight_passed | bool
          - fe_vmware_host_profiles_enforce_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/host_profiles_enforce: postflight validation failed - preflight passed
          ={{ fe_vmware_host_profiles_enforce_preflight_passed | default(false) }},
          status={{ fe_vmware_host_profiles_enforce_status | default('unknown') }}.
        success_msg: "vmware/host_profiles_enforce: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/host_profiles_enforce | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_host_profiles_enforce_postflight_passed: true
        fe_vmware_host_profiles_enforce_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/host_profiles_enforce | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_host_profiles_enforce_status: "failed"
        fe_vmware_host_profiles_enforce_postflight_passed: false
        fe_vmware_host_profiles_enforce_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_host_profiles_enforce_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/host_profiles_enforce | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/host_profiles_enforce: FAILED at '{{ fe_vmware_host_profiles_enforce_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_host_profiles_enforce_error }}
      tags:
        - always
        - rescue

    - name: "vmware/host_profiles_enforce | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/host_profiles_enforce failed at '{{ fe_vmware_host_profiles_enforce_failed_task }}': {{ fe_vmware_host_profiles_enforce_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/host_profiles_enforce | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_host_profiles_enforce_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_host_profiles_enforce_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_host_profiles_enforce_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/host_profiles_enforce | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/host_profiles_enforce":
              component: "vmware/host_profiles_enforce"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_host_profiles_enforce_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_host_profiles_enforce_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_host_profiles_enforce_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_host_profiles_enforce_started_at | default('') }}"
              ended_at: "{{ fe_vmware_host_profiles_enforce_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_host_profiles_enforce_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_host_profiles_enforce_failed_task | default('') }}"
              error: "{{ fe_vmware_host_profiles_enforce_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_host_profiles_enforce_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_host_profiles_enforce_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_host_profiles_enforce_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_host_profiles_enforce_status | default('') == 'succeeded' else ['vmware/host_profiles_enforce'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/host_profiles_enforce | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_host_profiles_enforce_stats_published: true
      tags:
        - always
