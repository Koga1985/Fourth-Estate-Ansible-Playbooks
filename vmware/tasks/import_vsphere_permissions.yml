---
# Import vSphere object permissions from a JSON export
# (compatible with the export file we built earlier).
#
# Vars to set:
#   vcenter_hostname, vcenter_username, vcenter_password
#   import_json_path (path to exported JSON; default ./vsphere_permissions.json)
#
# Notes:
# - Recreates/updates local roles found in JSON (name + privileges).
# - Applies object permissions (principal ↔ role) with propagate flag.
# - Skips if arrays are empty.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/import_vsphere_permissions']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_import_vsphere_permissions_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/import_vsphere_permissions | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_import_vsphere_permissions_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_import_vsphere_permissions_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_import_vsphere_permissions_status: "running"
    fe_vmware_import_vsphere_permissions_preflight_passed: false
    fe_vmware_import_vsphere_permissions_postflight_passed: false
    fe_vmware_import_vsphere_permissions_failed_task: ""
    fe_vmware_import_vsphere_permissions_error: ""
    fe_vmware_import_vsphere_permissions_stats_published: false
  tags:
    - always

- name: "vmware/import_vsphere_permissions | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/import_vsphere_permissions | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/import_vsphere_permissions: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/import_vsphere_permissions: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/import_vsphere_permissions | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/import_vsphere_permissions: required variable '{{ item }}' is not defined."
        success_msg: "vmware/import_vsphere_permissions: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_import_vsphere_permissions_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/import_vsphere_permissions | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_import_vsphere_permissions_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        import_json_path: "{{ import_json_path | default('./vsphere_permissions.json') }}"

    - name: Read exported permissions JSON
      ansible.builtin.slurp:
        src: "{{ import_json_path }}"
      register: _perm_json_raw
      delegate_to: localhost

    - name: Parse JSON
      ansible.builtin.set_fact:
        _perm_json: "{{ _perm_json_raw.content | b64decode | from_json }}"
        _perm_roles: "{{ (_perm_json.roles | default([])) | list }}"
        _perm_rows: "{{ (_perm_json.rows  | default([])) | list }}"

    # ---------- Recreate/update local roles (custom roles) ----------
    # Skip system roles if your export includes them without a privilege list.
    - name: Ensure local roles exist with privileges
      community.vmware.vmware_local_role_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        local_role_name: "{{ item.name }}"
        state: present
        privileges: "{{ item.privileges | default(omit) }}"
      no_log: true
      loop: "{{ _perm_roles }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name is defined
      delegate_to: localhost
      # Creates/updates local roles; if 'privileges' omitted for system roles,
      # vCenter keeps them unchanged. :contentReference[oaicite:2]{index=2}

    # ---------- Apply object permissions ----------
    # Each row expected to have: object_type, object_name, principal, role_name, propagate
    - name: Assign permissions to objects
      community.vmware.vmware_object_role_permission:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        object_type: "{{ item.object_type }}"
        object_name: "{{ item.object_name }}"
        principal: "{{ item.principal }}"
        role: "{{ item.role_name }}"
        propagate: "{{ (item.propagate | default(true)) | bool }}"
        state: present
      no_log: true
      loop: "{{ _perm_rows }}"
      loop_control:
        label: "{{ item.object_type }} {{ item.object_name }} -> {{ item.principal }} : {{ item.role_name }}"
      delegate_to: localhost
      # Applies object-level permissions; this module handles present/absent & propagate. :contentReference[oaicite:3]{index=3}

    - name: Summary
      ansible.builtin.debug:
        msg:
          roles_processed: "{{ _perm_roles | length }}"
          permissions_applied: "{{ _perm_rows | length }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/import_vsphere_permissions | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_import_vsphere_permissions_preflight_passed | bool
          - fe_vmware_import_vsphere_permissions_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/import_vsphere_permissions: postflight validation failed - preflight passed
          ={{ fe_vmware_import_vsphere_permissions_preflight_passed | default(false) }},
          status={{ fe_vmware_import_vsphere_permissions_status | default('unknown') }}.
        success_msg: "vmware/import_vsphere_permissions: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/import_vsphere_permissions | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_import_vsphere_permissions_postflight_passed: true
        fe_vmware_import_vsphere_permissions_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/import_vsphere_permissions | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_import_vsphere_permissions_status: "failed"
        fe_vmware_import_vsphere_permissions_postflight_passed: false
        fe_vmware_import_vsphere_permissions_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_import_vsphere_permissions_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/import_vsphere_permissions | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/import_vsphere_permissions: FAILED at '{{ fe_vmware_import_vsphere_permissions_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_import_vsphere_permissions_error }}
      tags:
        - always
        - rescue

    - name: "vmware/import_vsphere_permissions | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/import_vsphere_permissions failed at '{{ fe_vmware_import_vsphere_permissions_failed_task }}': {{ fe_vmware_import_vsphere_permissions_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/import_vsphere_permissions | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_import_vsphere_permissions_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_import_vsphere_permissions_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_import_vsphere_permissions_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/import_vsphere_permissions | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/import_vsphere_permissions":
              component: "vmware/import_vsphere_permissions"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_import_vsphere_permissions_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_import_vsphere_permissions_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_import_vsphere_permissions_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_import_vsphere_permissions_started_at | default('') }}"
              ended_at: "{{ fe_vmware_import_vsphere_permissions_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_import_vsphere_permissions_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_import_vsphere_permissions_failed_task | default('') }}"
              error: "{{ fe_vmware_import_vsphere_permissions_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_import_vsphere_permissions_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_import_vsphere_permissions_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_import_vsphere_permissions_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_import_vsphere_permissions_status | default('') == 'succeeded' else ['vmware/import_vsphere_permissions'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/import_vsphere_permissions | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_import_vsphere_permissions_stats_published: true
      tags:
        - always
