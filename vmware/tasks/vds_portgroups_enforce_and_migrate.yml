---
# Enforce dvPortGroups on a VDS and migrate VMkernel / VM NICs.
#
# Required vars:
#   vcenter_hostname, vcenter_username, vcenter_password, vcenter_validate_certs
#   vcenter_datacenter
#   dvs_name
#
# Portgroups to ensure:
#   portgroups:
#     - name: "PG-Prod-10"
#       port_binding: "static"            # static | ephemeral | dynamic
#       num_ports: 128
#       vlan:
#         mode: "access"                  # access | trunk
#         id: 10                          # when mode=access
#         trunks: ["20-30","100"]         # when mode=trunk (ranges or single)
#       security:
#         allow_promiscuous: false
#         mac_changes: false
#         forged_transmits: false
#
# VMkernel migrations (VSS→VDS or DVS→DVS):
#   vmk_migrations:
#     - esxi_hostname: "esxi01.lab.local"
#       current_vmk: "vmk0"
#       dest_portgroup: "PG-Prod-10"
#       dest_dvs: "{{ dvs_name }}"
#
# VM NIC migrations (per VM):
#   vm_nic_migrations:
#     - vm: "app01"
#       id_method: "mac"                  # mac | label
#       id_value: "00:50:56:aa:bb:cc"     # NIC MAC or current label (e.g. "Network adapter 1")
#       dest_portgroup: "PG-Prod-10"
#
# Notes:
# - VMkernel moves may require host connectivity planning; test on a single host first.
# - VM NIC changes are done in-place (no power-off).

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vds_portgroups_enforce_and_migrate']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vds_portgroups_enforce_and_migrate_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vds_portgroups_enforce_and_migrate | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vds_portgroups_enforce_and_migrate_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vds_portgroups_enforce_and_migrate_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vds_portgroups_enforce_and_migrate_status: "running"
    fe_vmware_vds_portgroups_enforce_and_migrate_preflight_passed: false
    fe_vmware_vds_portgroups_enforce_and_migrate_postflight_passed: false
    fe_vmware_vds_portgroups_enforce_and_migrate_failed_task: ""
    fe_vmware_vds_portgroups_enforce_and_migrate_error: ""
    fe_vmware_vds_portgroups_enforce_and_migrate_stats_published: false
  tags:
    - always

- name: "vmware/vds_portgroups_enforce_and_migrate | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vds_portgroups_enforce_and_migrate | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vds_portgroups_enforce_and_migrate: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vds_portgroups_enforce_and_migrate: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vds_portgroups_enforce_and_migrate | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vds_portgroups_enforce_and_migrate: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vds_portgroups_enforce_and_migrate: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vds_portgroups_enforce_and_migrate | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vds_portgroups_enforce_and_migrate_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname|length > 0
          - vcenter_username|length > 0
          - vcenter_password|length > 0
          - vcenter_datacenter|length > 0
          - dvs_name|length > 0
        fail_msg: "vCenter creds + vcenter_datacenter + dvs_name are required."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        portgroups: "{{ portgroups | default([]) }}"
        vmk_migrations: "{{ vmk_migrations | default([]) }}"
        vm_nic_migrations: "{{ vm_nic_migrations | default([]) }}"

    ##############################################################################
    # 1) Ensure dvPortGroups exist with desired VLAN + security settings
    ##############################################################################
    - name: Enforce dvPortGroups on {{ dvs_name }}
      community.vmware.vmware_dvs_portgroup:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter_name: "{{ vcenter_datacenter }}"
        switch_name: "{{ dvs_name }}"
        portgroup_name: "{{ item.name }}"
        state: present
        port_binding: "{{ item.port_binding | default('static') }}"
        num_ports: "{{ item.num_ports | default(128) }}"
        vlan_id: "{{ (item.vlan.mode == 'access') | ternary(item.vlan.id, omit) }}"
        vlan_trunk_range: >-
          {{ (item.vlan.mode == 'trunk') | ternary(item.vlan.trunks | join(','), omit) }}
        # Security policies
        allow_promiscuous: "{{ item.security.allow_promiscuous | default(false) }}"
        mac_changes: "{{ item.security.mac_changes | default(false) }}"
        forged_transmits: "{{ item.security.forged_transmits | default(false) }}"
      no_log: true
      loop: "{{ portgroups }}"
      loop_control: { label: "{{ item.name }}" }
      delegate_to: localhost

    ##############################################################################
    # 2) Migrate VMkernel NICs to target dvPortGroups (safe, host-by-host)
    ##############################################################################
    - name: Migrate VMkernel NICs to dvPortGroups
      community.vmware.vmware_migrate_vmk:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        esxi_hostname: "{{ item.esxi_hostname }}"
        current_vmk: "{{ item.current_vmk }}"
        dvswitch_name: "{{ item.dest_dvs | default(dvs_name) }}"
        portgroup_name: "{{ item.dest_portgroup }}"
        # Optional: if moving from VSS, module handles uplink mapping internally
        # Optional params like 'migrate_subnet' can be added if your version supports them
        state: present
      no_log: true
      loop: "{{ vmk_migrations }}"
      loop_control: { label: "{{ item.esxi_hostname }}: {{ item.current_vmk }} → {{ item.dest_portgroup }}" }
      delegate_to: localhost

    ##############################################################################
    # 3) Migrate VM NICs to target dvPortGroups (no power-off)
    ##############################################################################
    - name: Build per-VM networks payload
      ansible.builtin.set_fact:
        _vm_network_map: >-
          {{
            vm_nic_migrations
            | groupby('vm')
            | items2dict(
                key_name='key',
                value_name='value',
                value_func=lambda l: l
              )
          }}

    - name: Migrate VM NICs to new dvPortGroups
      community.vmware.vmware_guest_network:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        name: "{{ item.key }}"             # VM name
        state: present
        networks: >-
          {{
            item.value | map('extract', {
              'mac': 'id_value' if (item2.id_method == 'mac') else None
            })
          }}
      no_log: true
      vars:
        # Build the "networks" structure expected by vmware_guest_network
        networks: >-
          {{
            item.value
            | map('combine', {
                'name': item2.dest_portgroup,
                # selector: choose mac or label to target the correct NIC
                (item2.id_method == 'mac') | ternary('mac', 'label'):
                  item2.id_value
              })
            | list
          }}
      with_items: "{{ _vm_network_map | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      delegate_to: localhost
      vars_prompt: []

    # ----------------------------- postflight -------------------

    - name: "vmware/vds_portgroups_enforce_and_migrate | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vds_portgroups_enforce_and_migrate_preflight_passed | bool
          - fe_vmware_vds_portgroups_enforce_and_migrate_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vds_portgroups_enforce_and_migrate: postflight validation failed - preflight passed
          ={{ fe_vmware_vds_portgroups_enforce_and_migrate_preflight_passed | default(false) }},
          status={{ fe_vmware_vds_portgroups_enforce_and_migrate_status | default('unknown') }}.
        success_msg: "vmware/vds_portgroups_enforce_and_migrate: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vds_portgroups_enforce_and_migrate | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vds_portgroups_enforce_and_migrate_postflight_passed: true
        fe_vmware_vds_portgroups_enforce_and_migrate_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vds_portgroups_enforce_and_migrate | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vds_portgroups_enforce_and_migrate_status: "failed"
        fe_vmware_vds_portgroups_enforce_and_migrate_postflight_passed: false
        fe_vmware_vds_portgroups_enforce_and_migrate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vds_portgroups_enforce_and_migrate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vds_portgroups_enforce_and_migrate | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vds_portgroups_enforce_and_migrate: FAILED at '{{ fe_vmware_vds_portgroups_enforce_and_migrate_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vds_portgroups_enforce_and_migrate_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vds_portgroups_enforce_and_migrate | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vds_portgroups_enforce_and_migrate failed at '{{ fe_vmware_vds_portgroups_enforce_and_migrate_failed_task }}': {{ fe_vmware_vds_portgroups_enforce_and_migrate_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vds_portgroups_enforce_and_migrate | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vds_portgroups_enforce_and_migrate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vds_portgroups_enforce_and_migrate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vds_portgroups_enforce_and_migrate_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vds_portgroups_enforce_and_migrate | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vds_portgroups_enforce_and_migrate":
              component: "vmware/vds_portgroups_enforce_and_migrate"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_failed_task | default('') }}"
              error: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vds_portgroups_enforce_and_migrate_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vds_portgroups_enforce_and_migrate_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vds_portgroups_enforce_and_migrate_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vds_portgroups_enforce_and_migrate_status | default('') == 'succeeded' else ['vmware/vds_portgroups_enforce_and_migrate'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vds_portgroups_enforce_and_migrate | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vds_portgroups_enforce_and_migrate_stats_published: true
      tags:
        - always
