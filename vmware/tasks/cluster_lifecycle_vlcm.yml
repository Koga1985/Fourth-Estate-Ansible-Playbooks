---
# Configure vLCM Desired Image for a cluster, then scan & report compliance.
#
# Requires:
#   - Controller has PowerShell Core (pwsh) + VMware.PowerCLI installed.
#   - vCenter privileges for vLCM image operations.
#
# Vars you provide:
#   vcenter_hostname: "vcsa.example.local"
#   vcenter_username: "administrator@vsphere.local"
#   vcenter_password: "..."
#   vcenter_validate_certs: false
#   cluster_name: "Compute-Cluster"
#
#   # Option A: build desired image by parts (base + optional vendor add-on + components):
#   vlcm_image:
#     base_image_version: "8.0 U3c"        # string matched against Get-LcmImage -Type BaseImage
#     vendor_addon_name: ""                # optional: e.g. "DellEMC Addon 8.0.3-xx"
#     components: []                       # optional list of strings matched against component names/versions
#
#   # Option B: import a saved desired-state JSON (from Export-LcmClusterDesiredState):
#   vlcm_desired_state_file: ""            # e.g. "/tmp/cluster-desired-state.json"
#
#   run_prechecks: true                    # Test-LcmClusterHealth before compliance
#   remediate: false                       # if true, Set-Cluster -Remediate -AcceptEULA
#   compliance_report_path: "/tmp/{{ cluster_name }}-vlcm-compliance.json"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/cluster_lifecycle_vlcm']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_cluster_lifecycle_vlcm_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/cluster_lifecycle_vlcm | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_cluster_lifecycle_vlcm_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_cluster_lifecycle_vlcm_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_cluster_lifecycle_vlcm_status: "running"
    fe_vmware_cluster_lifecycle_vlcm_preflight_passed: false
    fe_vmware_cluster_lifecycle_vlcm_postflight_passed: false
    fe_vmware_cluster_lifecycle_vlcm_failed_task: ""
    fe_vmware_cluster_lifecycle_vlcm_error: ""
    fe_vmware_cluster_lifecycle_vlcm_stats_published: false
  tags:
    - always

- name: "vmware/cluster_lifecycle_vlcm | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/cluster_lifecycle_vlcm | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/cluster_lifecycle_vlcm: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/cluster_lifecycle_vlcm: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/cluster_lifecycle_vlcm | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/cluster_lifecycle_vlcm: required variable '{{ item }}' is not defined."
        success_msg: "vmware/cluster_lifecycle_vlcm: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_cluster_lifecycle_vlcm_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/cluster_lifecycle_vlcm | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_cluster_lifecycle_vlcm_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - cluster_name | length > 0
        fail_msg: "Set vcenter_hostname/username/password and cluster_name."

    - name: Defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        run_prechecks: "{{ run_prechecks | default(true) }}"
        remediate: "{{ remediate | default(false) }}"
        compliance_report_path: "{{ compliance_report_path | default('/tmp/%s-vlcm-compliance.json' | format(cluster_name)) }}"

    #####################################################################
    # PowerCLI block: configure desired image (by parts OR import spec),
    # then run health & compliance checks and optional remediation.
    #####################################################################
    - name: Configure vLCM desired image, scan & report
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           $cluster = Get-Cluster -Name '{{ cluster_name }}' -ErrorAction Stop;

           # --- Desired Image configuration ---
           if ('{{ vlcm_desired_state_file | default('') }}' -ne '') {
             # Option B: import a saved desired-state spec JSON
             Import-LcmClusterDesiredState -Cluster $cluster -Path '{{ vlcm_desired_state_file }}' | Out-Null
           }
           elseif ({{ vlcm_image is defined | ternary('$true','$false') }}) {
             # Option A: pick BaseImage, optional VendorAddOn & Components
             $base = if ('{{ vlcm_image.base_image_version | default('') }}' -ne '') {
               Get-LcmImage -Type BaseImage -Version '{{ vlcm_image.base_image_version | default('') }}'
             } else { $null }

             $vendor = if ('{{ vlcm_image.vendor_addon_name | default('') }}' -ne '') {
               Get-LcmImage -Type VendorAddOn | Where-Object { $_.DisplayName -like '*{{ vlcm_image.vendor_addon_name | default('') }}*' } | Select-Object -First 1
             } else { $null }

             $components = @()
             {{ (vlcm_image.components | default([])) | length }}
             {{ (vlcm_image.components | default([])) | map('regex_replace','\'','\'\'') | list }}
             {{''}}
             {% for comp in (vlcm_image.components | default([])) %}
             $c = Get-LcmImage -Type Component | Where-Object { $_.DisplayName -like '*{{ comp }}*' -or $_.Version -like '*{{ comp }}*' } | Select-Object -First 1;
             if ($c) { $components += $c }
             {% endfor %}

             # Apply to cluster; this enables Image-based mgmt if needed
             if ($base -or $vendor -or $components.Count -gt 0) {
               Set-Cluster -Cluster $cluster `
                 {{ vlcm_image.base_image_version is defined and vlcm_image.base_image_version|length>0 | ternary('-BaseImage $base','') }} `
                 {{ vlcm_image.vendor_addon_name is defined and vlcm_image.vendor_addon_name|length>0 | ternary('-VendorAddOn $vendor','') }} `
                 {{ (vlcm_image.components | default([])) | length > 0 | ternary('-Component $components','') }} `
                 -Confirm:$false | Out-Null
             }
           }

           # --- Pre-checks (optional) ---
           $health = $null
           if ({{ run_prechecks | ternary('$true','$false') }}) {
             $health = Test-LcmClusterHealth -Cluster $cluster  # vLCM health precheck
           }

           # --- Compliance scan ---
           $comp = Test-LcmClusterCompliance -Cluster $cluster   # compliance w/ desired image

           # --- Optional remediation (cluster-wide) ---
           $remediateResult = $null
           if ({{ remediate | ternary('$true','$false') }}) {
             $remediateResult = ($cluster | Set-Cluster -Remediate -AcceptEULA -Confirm:$false)
           }

           # Build a compact report
           $report = [pscustomobject]@{
             vcenter   = '{{ vcenter_hostname }}';
             cluster   = '{{ cluster_name }}';
             precheck  = if ($health) { ($health | Select-Object -Property *) } else { $null };
             compliance= ($comp | Select-Object -Property * );
             remediated= {{ remediate | ternary('$true','$false') }};
             timestamp = (Get-Date).ToString('s');
           };

           $json = $report | ConvertTo-Json -Depth 6;
           Set-Content -Path '{{ compliance_report_path }}' -Value $json -Encoding UTF8;
           $json
          "
      register: vlcm_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show compliance summary
      ansible.builtin.debug:
        var: vlcm_cmd.stdout

    - name: Note where report was written
      ansible.builtin.debug:
        msg: "Compliance report saved to {{ compliance_report_path }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/cluster_lifecycle_vlcm | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_cluster_lifecycle_vlcm_preflight_passed | bool
          - fe_vmware_cluster_lifecycle_vlcm_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/cluster_lifecycle_vlcm: postflight validation failed - preflight passed
          ={{ fe_vmware_cluster_lifecycle_vlcm_preflight_passed | default(false) }},
          status={{ fe_vmware_cluster_lifecycle_vlcm_status | default('unknown') }}.
        success_msg: "vmware/cluster_lifecycle_vlcm: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/cluster_lifecycle_vlcm | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_cluster_lifecycle_vlcm_postflight_passed: true
        fe_vmware_cluster_lifecycle_vlcm_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/cluster_lifecycle_vlcm | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_cluster_lifecycle_vlcm_status: "failed"
        fe_vmware_cluster_lifecycle_vlcm_postflight_passed: false
        fe_vmware_cluster_lifecycle_vlcm_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_cluster_lifecycle_vlcm_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/cluster_lifecycle_vlcm | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/cluster_lifecycle_vlcm: FAILED at '{{ fe_vmware_cluster_lifecycle_vlcm_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_cluster_lifecycle_vlcm_error }}
      tags:
        - always
        - rescue

    - name: "vmware/cluster_lifecycle_vlcm | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/cluster_lifecycle_vlcm failed at '{{ fe_vmware_cluster_lifecycle_vlcm_failed_task }}': {{ fe_vmware_cluster_lifecycle_vlcm_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/cluster_lifecycle_vlcm | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_cluster_lifecycle_vlcm_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_cluster_lifecycle_vlcm_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_cluster_lifecycle_vlcm_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/cluster_lifecycle_vlcm | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/cluster_lifecycle_vlcm":
              component: "vmware/cluster_lifecycle_vlcm"
              type: "tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_cluster_lifecycle_vlcm_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_cluster_lifecycle_vlcm_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_cluster_lifecycle_vlcm_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_cluster_lifecycle_vlcm_started_at | default('') }}"
              ended_at: "{{ fe_vmware_cluster_lifecycle_vlcm_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_cluster_lifecycle_vlcm_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_cluster_lifecycle_vlcm_failed_task | default('') }}"
              error: "{{ fe_vmware_cluster_lifecycle_vlcm_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_cluster_lifecycle_vlcm_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_cluster_lifecycle_vlcm_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_cluster_lifecycle_vlcm_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_cluster_lifecycle_vlcm_status | default('') == 'succeeded' else ['vmware/cluster_lifecycle_vlcm'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/cluster_lifecycle_vlcm | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_cluster_lifecycle_vlcm_stats_published: true
      tags:
        - always
