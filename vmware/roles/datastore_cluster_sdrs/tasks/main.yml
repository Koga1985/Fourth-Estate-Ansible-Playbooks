---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/datastore_cluster_sdrs']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_datastore_cluster_sdrs_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/datastore_cluster_sdrs | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_datastore_cluster_sdrs_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_datastore_cluster_sdrs_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_datastore_cluster_sdrs_status: "running"
    fe_vmware_datastore_cluster_sdrs_preflight_passed: false
    fe_vmware_datastore_cluster_sdrs_postflight_passed: false
    fe_vmware_datastore_cluster_sdrs_failed_task: ""
    fe_vmware_datastore_cluster_sdrs_error: ""
    fe_vmware_datastore_cluster_sdrs_stats_published: false
  tags:
    - always

- name: "vmware/datastore_cluster_sdrs | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/datastore_cluster_sdrs | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/datastore_cluster_sdrs: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/datastore_cluster_sdrs: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/datastore_cluster_sdrs | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/datastore_cluster_sdrs: required variable '{{ item }}' is not defined."
        success_msg: "vmware/datastore_cluster_sdrs: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_datastore_cluster_sdrs_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/datastore_cluster_sdrs | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_datastore_cluster_sdrs_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - vcenter_datacenter | length > 0
          - sdrs.name | length > 0

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        sdrs: "{{ sdrs | default({}) }}"
        membership: "{{ membership | default({}) }}"
        apply_recommendations: "{{ apply_recommendations | default(false) }}"
        report_path: "{{ report_path | default('/tmp/%s-sdrs-report.json' | format(sdrs.name|default('datastore-cluster'))) }}"

    - name: Configure SDRS cluster and membership (PowerCLI)
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Scope Session -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           $dc = Get-Datacenter -Name '{{ vcenter_datacenter }}' -ErrorAction Stop
           $dsFolder = $dc | Get-Folder -Type Datastore | Select-Object -First 1
           if ('{{ target_folder | default('') }}' -ne '') {
             $f = Get-Folder -Name '{{ target_folder | default('') }}' -ErrorAction SilentlyContinue
             if (-not $f) { $f = New-Folder -Name '{{ target_folder | default('') }}' -Location ($dc | Get-Folder -Type Datastore) }
             $dsFolder = $f
           }

           $clusterName = '{{ sdrs.name }}'
           $pod = Get-DatastoreCluster -Name $clusterName -ErrorAction SilentlyContinue
           if (-not $pod -and {{ sdrs.create_if_missing | default(true) | ternary('$true','$false') }}) {
             $pod = New-DatastoreCluster -Name $clusterName -Location $dsFolder
           } elseif (-not $pod) { throw "DatastoreCluster $clusterName not found and create_if_missing=false" }

           try { Set-DatastoreCluster -DatastoreCluster $pod -StorageDrsEnabled:{{ sdrs.enabled | default(true) | ternary('$true','$false') }} -Confirm:$false | Out-Null } catch { }
           try { Set-DatastoreCluster -DatastoreCluster $pod -StorageDrsAutomationLevel {{ sdrs.automation_level | default('FullyAutomated') }} -Confirm:$false | Out-Null } catch { }
           try { Set-DatastoreCluster -DatastoreCluster $pod -IOLoadBalanceEnabled:{{ sdrs.io_balance.enabled | default(true) | ternary('$true','$false') }} -SpaceLoadBalanceEnabled:{{ sdrs.space_balance.enabled | default(true) | ternary('$true','$false') }} -Confirm:$false | Out-Null } catch { }

           # Membership ensure
           $ensure = @('{{ membership.ensure_datastores | default([]) | join("','") }}')
           $added = @(); $ejected = @()
           foreach ($dsName in $ensure) {
             if ([string]::IsNullOrWhiteSpace($dsName)) { continue }
             $ds = Get-Datastore -Name $dsName -ErrorAction SilentlyContinue
             if ($ds -and $ds.Parent.Name -ne $pod.Name) {
               try { Move-Datastore -Datastore $ds -Destination $pod -Confirm:$false | Out-Null; $added += $ds.Name } catch { }
             }
           }

           if ({{ membership.eject_nonlisted | default(false) | ternary('$true','$false') }}) {
             $destFolderName = '{{ membership.eject_destination_folder | default('') }}'
             if ($destFolderName -ne '') {
               $destFolder = Get-Folder -Name $destFolderName -ErrorAction SilentlyContinue
               if (-not $destFolder) { $destFolder = New-Folder -Name $destFolderName -Location ($dc | Get-Folder -Type Datastore) }
               $members = Get-Datastore -Location $pod
               foreach ($m in $members) {
                 if ($ensure -notcontains $m.Name) {
                   try { Move-Datastore -Datastore $m -Destination $destFolder -Confirm:$false | Out-Null; $ejected += $m.Name } catch { }
                 }
               }
             }
           }

           $recs = @(); try { $recs = Get-StorageDRSRecommendation -StoragePod $pod -ErrorAction SilentlyContinue } catch { }
           if ({{ apply_recommendations | default(false) | ternary('$true','$false') }}) {
             try { $recs | Apply-StorageDRSRecommendation -Confirm:$false | Out-Null } catch { }
           }

           $membersNow = (Get-Datastore -Location $pod | Select-Object -ExpandProperty Name)
           $out = [pscustomobject]@{ vcenter='{{ vcenter_hostname }}'; datacenter='{{ vcenter_datacenter }}'; cluster=$pod.Name;
             automation='{{ sdrs.automation_level | default('FullyAutomated') }}'; sdrs_enabled={{ sdrs.enabled | default(true) | ternary('$true','$false') }};
             members=$membersNow; added=$added; ejected=$ejected; timestamp=(Get-Date).ToString('s') }
           $json = $out | ConvertTo-Json -Depth 6
           Set-Content -Path '{{ report_path }}' -Value $json -Encoding UTF8
           $json"
      register: sdrs_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show summary JSON (truncated)
      ansible.builtin.debug:
        msg: "{{ sdrs_cmd.stdout[:1500] }}... (see full at {{ report_path }})"

    # ----------------------------- postflight -------------------

    - name: "vmware/datastore_cluster_sdrs | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_datastore_cluster_sdrs_preflight_passed | bool
          - fe_vmware_datastore_cluster_sdrs_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/datastore_cluster_sdrs: postflight validation failed - preflight passed
          ={{ fe_vmware_datastore_cluster_sdrs_preflight_passed | default(false) }},
          status={{ fe_vmware_datastore_cluster_sdrs_status | default('unknown') }}.
        success_msg: "vmware/datastore_cluster_sdrs: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/datastore_cluster_sdrs | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_datastore_cluster_sdrs_postflight_passed: true
        fe_vmware_datastore_cluster_sdrs_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/datastore_cluster_sdrs | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_datastore_cluster_sdrs_status: "failed"
        fe_vmware_datastore_cluster_sdrs_postflight_passed: false
        fe_vmware_datastore_cluster_sdrs_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_datastore_cluster_sdrs_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/datastore_cluster_sdrs | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/datastore_cluster_sdrs: FAILED at '{{ fe_vmware_datastore_cluster_sdrs_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_datastore_cluster_sdrs_error }}
      tags:
        - always
        - rescue

    - name: "vmware/datastore_cluster_sdrs | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/datastore_cluster_sdrs failed at '{{ fe_vmware_datastore_cluster_sdrs_failed_task }}': {{ fe_vmware_datastore_cluster_sdrs_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/datastore_cluster_sdrs | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_datastore_cluster_sdrs_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_datastore_cluster_sdrs_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_datastore_cluster_sdrs_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/datastore_cluster_sdrs | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/datastore_cluster_sdrs":
              component: "vmware/datastore_cluster_sdrs"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_datastore_cluster_sdrs_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_datastore_cluster_sdrs_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_datastore_cluster_sdrs_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_datastore_cluster_sdrs_started_at | default('') }}"
              ended_at: "{{ fe_vmware_datastore_cluster_sdrs_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_datastore_cluster_sdrs_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_datastore_cluster_sdrs_failed_task | default('') }}"
              error: "{{ fe_vmware_datastore_cluster_sdrs_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_datastore_cluster_sdrs_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_datastore_cluster_sdrs_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_datastore_cluster_sdrs_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_datastore_cluster_sdrs_status | default('') == 'succeeded' else ['vmware/datastore_cluster_sdrs'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/datastore_cluster_sdrs | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_datastore_cluster_sdrs_stats_published: true
      tags:
        - always
