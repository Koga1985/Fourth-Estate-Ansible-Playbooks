---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vm_tools_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vm_tools_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vm_tools_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vm_tools_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vm_tools_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vm_tools_config_status: "running"
    fe_vmware_vm_tools_config_preflight_passed: false
    fe_vmware_vm_tools_config_postflight_passed: false
    fe_vmware_vm_tools_config_failed_task: ""
    fe_vmware_vm_tools_config_error: ""
    fe_vmware_vm_tools_config_stats_published: false
  tags:
    - always

- name: "vmware/vm_tools_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vm_tools_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vm_tools_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vm_tools_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vm_tools_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vm_tools_config: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vm_tools_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vm_tools_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vm_tools_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vm_tools_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert vCenter inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
        fail_msg: "vcenter_hostname/username/password are required."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        vm_names: "{{ vm_names | default([]) }}"
        cluster_name: "{{ cluster_name | default('') }}"
        folder_name: "{{ folder_name | default('') }}"
        tag_name: "{{ tag_name | default('') }}"
        tools: "{{ tools | default({}) }}"
        report_path: "{{ report_path | default('/tmp/vmtools-report.json') }}"

    - name: Enforce VMware Tools settings and report stale tools (PowerCLI)
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           <# --- Resolve target VMs --- #>
           $targets = @();
           if (@('{{ vm_names | join("','") }}').Length -gt 0) {
             $targets += @('{{ vm_names | join("','") }}' | ForEach-Object { Get-VM -Name $_ -ErrorAction SilentlyContinue }) | Where-Object { $_ }
           }
           if ('{{ cluster_name }}' -ne '') {
             $targets += (Get-Cluster -Name '{{ cluster_name }}' | Get-VM)
           }
           if ('{{ folder_name }}' -ne '') {
             $targets += (Get-Folder -Name '{{ folder_name }}' | Get-VM)
           }
           if ('{{ tag_name }}' -ne '') {
             try { $targets += (Get-VM -Tag '{{ tag_name }}') } catch { }
           }
           $targets = $targets | Sort-Object -Unique

           <# --- Build desired Tools config --- #>
           $spec = New-Object VMware.Vim.VirtualMachineConfigSpec
           $spec.tools = New-Object VMware.Vim.ToolsConfigInfo

           <# Time sync #>
           $timeSync = [bool]{{ tools.time_sync | default(true) | ternary('1','0') }}
           $spec.tools.syncTimeWithHost = $timeSync

           <# Scripts controls #>
           $spec.tools.afterPowerOn = [bool]{{ tools.scripts.after_power_on | default(true) | ternary('1','0') }}
           $spec.tools.afterResume   = [bool]{{ tools.scripts.after_resume | default(true) | ternary('1','0') }}
           $spec.tools.beforeGuestStandby = [bool]{{ tools.scripts.before_guest_standby | default(true) | ternary('1','0') }}
           $spec.tools.beforeGuestShutdown = [bool]{{ tools.scripts.before_guest_shutdown | default(true) | ternary('1','0') }}

           <# Upgrade policy #>
           $upgradePolicy = '{{ tools.upgrade_policy | default('') }}'
           if ($upgradePolicy -ne '') {
             $spec.tools.toolsUpgradePolicy = $upgradePolicy  # e.g., UpgradeAtPowerCycle
           }

           <# Advanced setting: disk.EnableUUID (supports app-consistent snapshots) #>
           $setUUID = [bool]{{ tools.set_disk_enable_uuid | default(true) | ternary('1','0') }}

           function Set-AdvancedSetting($vm, $key, $val) {
             $cfg = New-Object VMware.Vim.VirtualMachineConfigSpec
             $opt = New-Object VMware.Vim.OptionValue
             $opt.Key = $key; $opt.Value = $val
             $cfg.ExtraConfig += $opt
             $vm.ExtensionData.ReconfigVM_Task($cfg) | Out-Null
           }

           <# Apply config to each VM (idempotent-ish; vSphere handles no-op) #>
           foreach ($vm in $targets) {
             try {
               $vm.ExtensionData.ReconfigVM_Task($spec) | Out-Null
               if ($setUUID) { Set-AdvancedSetting -vm $vm -key 'disk.enableUUID' -val 'TRUE' }
             } catch {
               Write-Host ('WARN: Failed to reconfigure VM ' + $vm.Name + ' : ' + $_.Exception.Message)
             }
           }

           <# --- Report VMware Tools status --- #>
           $report = @()
           foreach ($vm in $targets) {
             $ext = $vm.ExtensionData
             $guest = $ext.Guest
             $item = [pscustomobject]@{
               Name = $vm.Name
               PowerState = $vm.PowerState.ToString()
               ToolsStatus = $guest.ToolsStatus
               ToolsVersionStatus2 = $guest.ToolsVersionStatus2
               ToolsRunningStatus = $guest.ToolsRunningStatus
               ToolsVersion = $guest.ToolsVersion
               GuestFamily = $guest.GuestFamily
               TimeSyncWithHost = $ext.Config.Tools.SyncTimeWithHost
               Scripts = @{
                 AfterPowerOn = $ext.Config.Tools.AfterPowerOn
                 AfterResume = $ext.Config.Tools.AfterResume
                 BeforeGuestStandby = $ext.Config.Tools.BeforeGuestStandby
                 BeforeGuestShutdown = $ext.Config.Tools.BeforeGuestShutdown
               }
             }
             $report += $item
           }

           <# Stale tools = need upgrade or not running #>
           $stale = $report | Where-Object {
             $_.ToolsVersionStatus2 -in @('guestToolsNeedUpgrade','guestToolsSupportedOld') -or
             $_.ToolsRunningStatus -ne 'guestToolsRunning'
           }

           $out = [pscustomobject]@{
             vcenter = '{{ vcenter_hostname }}'
             total = $report.Count
             stale_count = $stale.Count
             stale = $stale
             details = $report
             timestamp = (Get-Date).ToString('s')
           }

           $json = $out | ConvertTo-Json -Depth 6
           Set-Content -Path '{{ report_path }}' -Value $json -Encoding UTF8
           $json"
      register: vmtools_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show summary JSON (truncated)
      ansible.builtin.debug:
        msg: "{{ vmtools_cmd.stdout[:1500] }}... (see full at {{ report_path }})"

    # ----------------------------- postflight -------------------

    - name: "vmware/vm_tools_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vm_tools_config_preflight_passed | bool
          - fe_vmware_vm_tools_config_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vm_tools_config: postflight validation failed - preflight passed
          ={{ fe_vmware_vm_tools_config_preflight_passed | default(false) }},
          status={{ fe_vmware_vm_tools_config_status | default('unknown') }}.
        success_msg: "vmware/vm_tools_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vm_tools_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vm_tools_config_postflight_passed: true
        fe_vmware_vm_tools_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vm_tools_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vm_tools_config_status: "failed"
        fe_vmware_vm_tools_config_postflight_passed: false
        fe_vmware_vm_tools_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vm_tools_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vm_tools_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vm_tools_config: FAILED at '{{ fe_vmware_vm_tools_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vm_tools_config_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vm_tools_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vm_tools_config failed at '{{ fe_vmware_vm_tools_config_failed_task }}': {{ fe_vmware_vm_tools_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vm_tools_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vm_tools_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vm_tools_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vm_tools_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vm_tools_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vm_tools_config":
              component: "vmware/vm_tools_config"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vm_tools_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vm_tools_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vm_tools_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vm_tools_config_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vm_tools_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vm_tools_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vm_tools_config_failed_task | default('') }}"
              error: "{{ fe_vmware_vm_tools_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vm_tools_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vm_tools_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vm_tools_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vm_tools_config_status | default('') == 'succeeded' else ['vmware/vm_tools_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vm_tools_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vm_tools_config_stats_published: true
      tags:
        - always
