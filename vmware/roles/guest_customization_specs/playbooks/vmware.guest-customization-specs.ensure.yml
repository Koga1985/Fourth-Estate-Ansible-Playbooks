        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_status: "preflight_failed"
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_postflight_passed: false
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: FAILED at '{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_error }}
          tags:
            - always
            - rescue

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure":
                  component: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure"
                  type: "playbook"
                  platform: "vmware"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_started_at | default('') }}"
                  ended_at: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_failed_task | default('') }}"
                  error: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
