              fe_validation_succeeded: "{{ 1 if fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_status | default('') == 'succeeded' else 1 }}"
