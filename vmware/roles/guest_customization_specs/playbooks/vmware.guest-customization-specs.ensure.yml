---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: localhost
  gather_facts: false
  roles:
    - role: guest_customization_specs
      vars:
        vcenter_hostname: "vcsa.example.local"
        vcenter_username: "{{ lookup('env','VCENTER_USERNAME') }}"
        vcenter_password: "{{ lookup('env','VCENTER_PASSWORD') }}"
        vcenter_validate_certs: false

        specs:
          - name: "win-std"
            type: "windows"
            description: "Windows Server base"
            overwrite: true
            windows:
              full_name: "Acme IT"
              org_name: "Acme Corp"
              time_zone: 035
              change_sid: true
              admin_password: "{{ lookup('env','WIN_ADMIN_PWD') }}"
              domain_join: { enabled: true, domain: "corp.example.com", username: 'CORP\svc_join', password: "{{ lookup('env','JOIN_PWD') }}", oupath: "OU=Servers,DC=corp,DC=example,DC=com" }
              hostname: "useVMName"
            nics:
              - { index: 0, type: "dhcp", dns_servers: ["10.10.10.10","10.10.10.11"], dns_domain: "corp.example.com" }

            no_log: true
          - name: "lin-std"
            type: "linux"
            description: "Linux base"
            overwrite: true
            linux:
              domain: "corp.example.com"
              time_zone: "UTC"
              hwclock_utc: true
            nics:
              - { index: 0, type: "static", ip: "10.30.0.25", subnet: "255.255.255.0", gateway: ["10.30.0.1"], dns_servers: ["10.10.10.10","10.10.10.11"], dns_domain: "corp.example.com" }
  pre_tasks:
    - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_status: "running"
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_preflight_passed: false
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_postflight_passed: false
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_failed_task: ""
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_error: ""
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_stats_published: false
          tags:
            - always

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: required variable '{{ item }}' is not defined."
            success_msg: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

