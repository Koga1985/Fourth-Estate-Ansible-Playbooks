            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_stats_published: true
          tags:
            - always

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vmware/guest_customization_specs/vmware.guest-customization-specs.ensure failed at '{{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_failed_task }}': {{ fe_vmware_guest_customization_specs_vmware_guest_customization_specs_ensure_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vmware/guest_customization_specs/vmware.guest-customization-specs.ensure | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vmware/guest_customization_specs/vmware.guest-customization-specs.ensure: preflight
