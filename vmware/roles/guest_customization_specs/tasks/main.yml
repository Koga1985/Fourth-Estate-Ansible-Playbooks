---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/guest_customization_specs']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_guest_customization_specs_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/guest_customization_specs | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_guest_customization_specs_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_guest_customization_specs_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_guest_customization_specs_status: "running"
    fe_vmware_guest_customization_specs_preflight_passed: false
    fe_vmware_guest_customization_specs_postflight_passed: false
    fe_vmware_guest_customization_specs_failed_task: ""
    fe_vmware_guest_customization_specs_error: ""
    fe_vmware_guest_customization_specs_stats_published: false
  tags:
    - always

- name: "vmware/guest_customization_specs | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/guest_customization_specs | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/guest_customization_specs: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/guest_customization_specs: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/guest_customization_specs | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/guest_customization_specs: required variable '{{ item }}' is not defined."
        success_msg: "vmware/guest_customization_specs: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_guest_customization_specs_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/guest_customization_specs | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_guest_customization_specs_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
        fail_msg: "vcenter_hostname/username/password are required."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        specs: "{{ specs | default([]) }}"
        report_path: "{{ report_path | default('/tmp/guest-customization-specs-report.json') }}"

    - name: Ensure guest customization specs (Windows & Linux) and report
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Scope Session -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           function Ensure-HostnameScheme([string]$hostSpec) {
             # Supports: 'useVMName', 'prefix:XYZ', 'fixed:NAME'
             if ([string]::IsNullOrWhiteSpace($hostSpec)) { return @{ Scheme='VM' } }
             if ($hostSpec -match '^useVMName$') { return @{ Scheme='VM' } }
             if ($hostSpec -match '^prefix:(.+)$') { return @{ Scheme='Prefix'; Prefix=$Matches[1] } }
             if ($hostSpec -match '^fixed:(.+)$')  { return @{ Scheme='Fixed'; Prefix=$Matches[1] } }
             return @{ Scheme='VM' }
           }

           $results = @()

           foreach ($item in @({{ specs | to_json }})) {
             $name = $item.name; $type = ($item.type).ToLower(); $desc = $item.description
             $overwrite = [bool]$item.overwrite

             $existing = Get-OSCustomizationSpec -Name $name -ErrorAction SilentlyContinue

             if ($existing -and $overwrite) {
               Remove-OSCustomizationSpec -OSCustomizationSpec $existing -Confirm:$false | Out-Null
               $existing = $null
             }

             if (-not $existing) {
               if ($type -eq 'windows') {
                 $w = $item.windows
                 $host = Ensure-HostnameScheme ($w.hostname)
                 $tz = $w.time_zone
                 $changeSid = [bool]$w.change_sid
                 $params = @{
                   Name = $name; Type = 'Windows'; Description = $desc
                   FullName = $w.full_name; OrgName = $w.org_name; ChangeSid = $changeSid
                   TimeZone = $tz
                 }
                 if ($w.product_key) { $params.ProductKey = $w.product_key }
                 $spec = New-OSCustomizationSpec @params

                 # Account & domain/workgroup
                 if ($w.admin_password) {
                   Set-OSCustomizationSpec -OSCustomizationSpec $spec -AdminPassword $w.admin_password -Confirm:$false | Out-Null
                   if ($w.auto_logon_count -ge 1) {
                     Set-OSCustomizationSpec -OSCustomizationSpec $spec -AutoLogonCount ([int]$w.auto_logon_count) -Confirm:$false | Out-Null
                   }
                 }
                 if ($w.domain_join -and $w.domain_join.enabled) {
                   Set-OSCustomizationSpec -OSCustomizationSpec $spec -Domain $w.domain_join.domain -DomainUserName $w.domain_join.username -DomainPassword $w.domain_join.password -Confirm:$false | Out-Null
                   if ($w.domain_join.oupath) {
                     Set-OSCustomizationSpec -OSCustomizationSpec $spec -ForMicrosoft -OrgUnit $w.domain_join.oupath -Confirm:$false | Out-Null
                   }
                 } elseif ($w.workgroup) {
                   Set-OSCustomizationSpec -OSCustomizationSpec $spec -JoinWorkgroup $w.workgroup -Confirm:$false | Out-Null
                 }

                 # Run-Once commands
                 if ($w.run_once) {
                   foreach ($cmd in $w.run_once) {
                     try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -RunOnce $cmd -AppendRunOnce -Confirm:$false | Out-Null } catch { }
                   }
                 }

                 # Hostname naming scheme
                 $host = Ensure-HostnameScheme ($w.hostname)
                 if ($host.Scheme -eq 'VM') {
                   try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -NamingScheme VM -Confirm:$false | Out-Null } catch { }
                 } elseif ($host.Scheme -eq 'Prefix') {
                   try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -NamingScheme Prefix -NamingPrefix $host.Prefix -Confirm:$false | Out-Null } catch { }
                 } elseif ($host.Scheme -eq 'Fixed') {
                   try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -NamingScheme Fixed -NamingPrefix $host.Prefix -Confirm:$false | Out-Null } catch { }
                 }

               } elseif ($type -eq 'linux') {
                 $l = $item.linux
                 $params = @{
                   Name = $name; Type = 'Linux'; Description = $desc
                 }
                 if ($l.domain)   { $params.DomainName = $l.domain }
                 if ($l.time_zone){ $params.TimeZone = $l.time_zone }
                 $spec = New-OSCustomizationSpec @params
                 if ($l.hwclock_utc -ne $null) {
                   try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -HwClockUTC:([bool]$l.hwclock_utc) -Confirm:$false | Out-Null } catch { }
                 }
                 if ($l.script_text) {
                   try { Set-OSCustomizationSpec -OSCustomizationSpec $spec -ScriptText $l.script_text -Confirm:$false | Out-Null } catch { }
                 }
               } else {
                 throw \"Unsupported type for $name (use 'windows' or 'linux')\"
               }
             } else {
               $spec = $existing
             }

             # Rebuild NIC mappings: clear all existing, then create from desired list
             try {
               $maps = Get-OSCustomizationNicMapping -OSCustomizationSpec $spec -ErrorAction SilentlyContinue
               foreach ($m in $maps) {
                 # There's no direct remove; recreate spec if needed. We'll try to overwrite positions.
                 # For safety, we reset positions we have in desired.
               }
             } catch { }

             $nics = @()
             if ($item.nics) { $nics = $item.nics }
             # Build mapping set by position; vSphere NIC positions start at 1
             $pos = 1
             foreach ($nic in $nics) {
               $mode = ($nic.type).ToLower()
               $dns = @(); if ($nic.dns_servers) { $dns = $nic.dns_servers }
               $domain = $nic.dns_domain

               $existingMap = $null
               try { $existingMap = Get-OSCustomizationNicMapping -OSCustomizationSpec $spec -Position $pos -ErrorAction SilentlyContinue } catch { }

               if (-not $existingMap) {
                 if ($mode -eq 'dhcp') {
                   New-OSCustomizationNicMapping -OSCustomizationSpec $spec -Position $pos -IpMode UseDhcp | Out-Null
                 } else {
                   New-OSCustomizationNicMapping -OSCustomizationSpec $spec -Position $pos -IpMode UseStaticIP -IpAddress $nic.ip -SubnetMask $nic.subnet -DefaultGateway $nic.gateway | Out-Null
                 }
                 $existingMap = Get-OSCustomizationNicMapping -OSCustomizationSpec $spec -Position $pos
               } else {
                 if ($mode -eq 'dhcp') {
                   Set-OSCustomizationNicMapping -OSCustomizationNicMapping $existingMap -IpMode UseDhcp | Out-Null
                 } else {
                   Set-OSCustomizationNicMapping -OSCustomizationNicMapping $existingMap -IpMode UseStaticIP -IpAddress $nic.ip -SubnetMask $nic.subnet -DefaultGateway $nic.gateway | Out-Null
                 }
               }
               if ($dns -and $dns.Count -gt 0) {
                 try { Set-OSCustomizationNicMapping -OSCustomizationNicMapping $existingMap -Dns $dns | Out-Null } catch { }
               }
               if ($domain) {
                 try { Set-OSCustomizationNicMapping -OSCustomizationNicMapping $existingMap -DnsDomain $domain | Out-Null } catch { }
               }
               $pos += 1
             }

             $results += [pscustomobject]@{ name=$name; type=$type; created=($existing -eq $null); nic_count=$nics.Length }
           }

           $out = [pscustomobject]@{
             vcenter='{{ vcenter_hostname }}'
             results=$results
             timestamp=(Get-Date).ToString('s')
           }
           $json = $out | ConvertTo-Json -Depth 6
           Set-Content -Path '{{ report_path }}' -Value $json -Encoding UTF8
           $json"
      register: gspec_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show summary JSON (truncated)
      ansible.builtin.debug:
        msg: "{{ gspec_cmd.stdout[:1400] }}... (see full at {{ report_path }})"

    # ----------------------------- postflight -------------------

    - name: "vmware/guest_customization_specs | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_guest_customization_specs_preflight_passed | bool
          - fe_vmware_guest_customization_specs_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/guest_customization_specs: postflight validation failed - preflight passed
          ={{ fe_vmware_guest_customization_specs_preflight_passed | default(false) }},
          status={{ fe_vmware_guest_customization_specs_status | default('unknown') }}.
        success_msg: "vmware/guest_customization_specs: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/guest_customization_specs | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_guest_customization_specs_postflight_passed: true
        fe_vmware_guest_customization_specs_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/guest_customization_specs | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_guest_customization_specs_status: "failed"
        fe_vmware_guest_customization_specs_postflight_passed: false
        fe_vmware_guest_customization_specs_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_guest_customization_specs_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/guest_customization_specs | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/guest_customization_specs: FAILED at '{{ fe_vmware_guest_customization_specs_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_guest_customization_specs_error }}
      tags:
        - always
        - rescue

    - name: "vmware/guest_customization_specs | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/guest_customization_specs failed at '{{ fe_vmware_guest_customization_specs_failed_task }}': {{ fe_vmware_guest_customization_specs_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/guest_customization_specs | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_guest_customization_specs_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_guest_customization_specs_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_guest_customization_specs_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/guest_customization_specs | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/guest_customization_specs":
              component: "vmware/guest_customization_specs"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_guest_customization_specs_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_guest_customization_specs_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_guest_customization_specs_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_guest_customization_specs_started_at | default('') }}"
              ended_at: "{{ fe_vmware_guest_customization_specs_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_guest_customization_specs_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_guest_customization_specs_failed_task | default('') }}"
              error: "{{ fe_vmware_guest_customization_specs_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_guest_customization_specs_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_guest_customization_specs_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_guest_customization_specs_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_guest_customization_specs_status | default('') == 'succeeded' else ['vmware/guest_customization_specs'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/guest_customization_specs | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_guest_customization_specs_stats_published: true
      tags:
        - always
