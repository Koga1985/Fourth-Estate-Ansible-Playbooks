---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/template_pipeline']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_template_pipeline_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/template_pipeline | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_template_pipeline_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_template_pipeline_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_template_pipeline_status: "running"
    fe_vmware_template_pipeline_preflight_passed: false
    fe_vmware_template_pipeline_postflight_passed: false
    fe_vmware_template_pipeline_failed_task: ""
    fe_vmware_template_pipeline_error: ""
    fe_vmware_template_pipeline_stats_published: false
  tags:
    - always

- name: "vmware/template_pipeline | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/template_pipeline | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/template_pipeline: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/template_pipeline: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/template_pipeline | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/template_pipeline: required variable '{{ item }}' is not defined."
        success_msg: "vmware/template_pipeline: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_template_pipeline_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/template_pipeline | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_template_pipeline_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - content_library.name | length > 0
        fail_msg: "vCenter creds and content_library.name are required."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        intake: "{{ intake | default([]) }}"
        report_path: "{{ report_path | default('/tmp/template-pipeline-report.json') }}"

    - name: Run template pipeline (Content Library + intake + pin + prune)
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           # --- Ensure Content Library ---
           $libName = '{{ content_library.name }}'
           $lib = Get-ContentLibrary -Name $libName -ErrorAction SilentlyContinue
           if (-not $lib) {
             if (-not {{ content_library.create_if_missing | default(true) | ternary('$true','$false') }}) {
               throw 'Content Library not found and create_if_missing=false'
             }
             $dsName = '{{ content_library.datastore | default('') }}'
             if ($dsName -eq '') { throw 'content_library.datastore is required to create a local library' }
             $ds = Get-Datastore -Name $dsName -ErrorAction Stop
             $pub = {{ content_library.publication | default(False) | ternary('$true','$false') }}
             $lib = New-ContentLibrary -Name $libName -Datastore $ds -Description '{{ content_library.description | default('Golden images') }}' -Publish $pub
           }

           function Resolve-Version([string]$v) { if ([string]::IsNullOrWhiteSpace($v)) { return (Get-Date -Format 'yyyy.MM.dd') } else { return $v } }

           function Update-AliasItem($Library, [string]$BaseName, [string]$Version, [string]$Alias) {
             $aliasName = \"$BaseName-$Alias\"; $verName = \"$BaseName-$Version\"
             $src = Get-ContentLibraryItem -ContentLibrary $Library -Name $verName -ErrorAction Stop
             $existing = Get-ContentLibraryItem -ContentLibrary $Library -Name $aliasName -ErrorAction SilentlyContinue
             if ($existing) { Remove-ContentLibraryItem -ContentLibraryItem $existing -Confirm:$false }
             Copy-ContentLibraryItem -ContentLibraryItem $src -Name $aliasName -ContentLibrary $Library | Out-Null
           }

           function Prune-Versions($Library, [string]$BaseName, [int]$Keep) {
             if ($Keep -lt 1) { return }
             $items = Get-ContentLibraryItem -ContentLibrary $Library | Where-Object { $_.Name -like \"$BaseName-*\" } | Sort-Object Name
             $versions = $items | Where-Object { $_.Name -notlike \"$BaseName-current\" }
             if ($versions.Count -gt $Keep) {
               $toRemove = $versions | Select-Object -First ($versions.Count - $Keep)
               foreach ($i in $toRemove) { try { Remove-ContentLibraryItem -ContentLibraryItem $i -Confirm:$false } catch { Write-Host \"WARN prune: $($i.Name) -> $_\" } }
             }
           }

           $report = @()

           {% for item in intake %}
           $name = '{{ item.name }}'
           $ver  = Resolve-Version('{{ item.version | default('') }}')
           $srcType = '{{ item.source_type | default('ova') }}'.ToLower()
           $srcPath = '{{ item.source_path | default('') }}'
           $pin = '{{ item.pin_alias | default('current') }}'
           $keep = [int]'{{ item.keep_versions | default(3) }}'

           if ([string]::IsNullOrWhiteSpace($name)) { throw 'intake.name is required' }
           if ([string]::IsNullOrWhiteSpace($srcPath)) { throw 'intake.source_path is required' }

           $destName = \"$name-$ver\"
           $exists = Get-ContentLibraryItem -ContentLibrary $lib -Name $destName -ErrorAction SilentlyContinue

           if (-not $exists) {
             if ($srcType -eq 'ova') {
               Import-ContentLibraryItem -ContentLibrary $lib -Name $destName -Source $srcPath | Out-Null
             } elseif ($srcType -eq 'ovf') {
               Import-ContentLibraryItem -ContentLibrary $lib -Name $destName -OvfPath $srcPath | Out-Null
             } else {
               throw 'Unsupported source_type (use ova|ovf)'
             }
           }

           if (-not [string]::IsNullOrWhiteSpace($pin)) { Update-AliasItem -Library $lib -BaseName $name -Version $ver -Alias $pin }
           if ($keep -gt 0) { Prune-Versions -Library $lib -BaseName $name -Keep $keep }

           $report += [pscustomobject]@{ name=$name; version=$ver; imported=$(-not $exists); alias=$pin; kept=$keep }
           {% endfor %}

           $all = Get-ContentLibraryItem -ContentLibrary $lib | Select-Object Name, SizeMB, Type
           $out = [pscustomobject]@{ vcenter='{{ vcenter_hostname }}'; library=$lib.Name; processed=$report; inventory=$all; timestamp=(Get-Date).ToString('s') }
           $json = $out | ConvertTo-Json -Depth 6
           Set-Content -Path '{{ report_path }}' -Value $json -Encoding UTF8
           $json"
      register: pipeline_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show summary JSON (truncated)
      ansible.builtin.debug:
        msg: "{{ pipeline_cmd.stdout[:1500] }}... (see full at {{ report_path }})"

    # ----------------------------- postflight -------------------

    - name: "vmware/template_pipeline | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_template_pipeline_preflight_passed | bool
          - fe_vmware_template_pipeline_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/template_pipeline: postflight validation failed - preflight passed
          ={{ fe_vmware_template_pipeline_preflight_passed | default(false) }},
          status={{ fe_vmware_template_pipeline_status | default('unknown') }}.
        success_msg: "vmware/template_pipeline: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/template_pipeline | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_template_pipeline_postflight_passed: true
        fe_vmware_template_pipeline_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/template_pipeline | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_template_pipeline_status: "failed"
        fe_vmware_template_pipeline_postflight_passed: false
        fe_vmware_template_pipeline_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_template_pipeline_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/template_pipeline | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/template_pipeline: FAILED at '{{ fe_vmware_template_pipeline_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_template_pipeline_error }}
      tags:
        - always
        - rescue

    - name: "vmware/template_pipeline | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/template_pipeline failed at '{{ fe_vmware_template_pipeline_failed_task }}': {{ fe_vmware_template_pipeline_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/template_pipeline | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_template_pipeline_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_template_pipeline_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_template_pipeline_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/template_pipeline | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/template_pipeline":
              component: "vmware/template_pipeline"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_template_pipeline_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_template_pipeline_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_template_pipeline_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_template_pipeline_started_at | default('') }}"
              ended_at: "{{ fe_vmware_template_pipeline_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_template_pipeline_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_template_pipeline_failed_task | default('') }}"
              error: "{{ fe_vmware_template_pipeline_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_template_pipeline_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_template_pipeline_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_template_pipeline_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_template_pipeline_status | default('') == 'succeeded' else ['vmware/template_pipeline'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/template_pipeline | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_template_pipeline_stats_published: true
      tags:
        - always
