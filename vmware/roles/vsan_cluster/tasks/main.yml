---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsan_cluster']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsan_cluster_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsan_cluster | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsan_cluster_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsan_cluster_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsan_cluster_status: "running"
    fe_vmware_vsan_cluster_preflight_passed: false
    fe_vmware_vsan_cluster_postflight_passed: false
    fe_vmware_vsan_cluster_failed_task: ""
    fe_vmware_vsan_cluster_error: ""
    fe_vmware_vsan_cluster_stats_published: false
  tags:
    - always

- name: "vmware/vsan_cluster | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsan_cluster | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsan_cluster: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsan_cluster: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsan_cluster | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsan_cluster: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsan_cluster: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsan_cluster_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsan_cluster | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsan_cluster_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - cluster_name | length > 0
        fail_msg: "vcenter_hostname/username/password and cluster_name are required."

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        run_health_checks: "{{ run_health_checks | default(true) }}"
        fault_domains: "{{ fault_domains | default([]) }}"
        vsan: "{{ vsan | default({'enabled': true, 'architecture': 'osa', 'auto_claim': false, 'data_reduction':'disabled', 'encryption': false, 'verbose': false}) }}"
        health_report_path: "{{ health_report_path | default('/tmp/%s-vsan-health.json' | format(cluster_name)) }}"

    - name: Configure vSAN (ESA/OSA), Fault Domains, Health (PowerCLI)
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Confirm:$false | Out-Null;

           $server = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}' -ErrorAction Stop;
           $cluster = Get-Cluster -Name '{{ cluster_name }}' -ErrorAction Stop;

           if ({{ vsan.enabled | ternary('$true','$false') }}) {
             if (-not $cluster.VsanEnabled) {
               if ({{ vsan.auto_claim | ternary('$true','$false') }}) {
                 Set-Cluster -Cluster $cluster -VsanEnabled:$true -VsanAutoClaimStorage:$true -Confirm:$false | Out-Null;
               } else {
                 Set-Cluster -Cluster $cluster -VsanEnabled:$true -Confirm:$false | Out-Null;
               }
             }
           } else {
             if ($cluster.VsanEnabled) { Set-Cluster -Cluster $cluster -VsanEnabled:$false -Confirm:$false | Out-Null }
           }

           try { $cfg = Get-VsanClusterConfiguration -Cluster $cluster -ErrorAction Stop } catch { $cfg = $null }

           if ($cfg) {
             if ('{{ vsan.architecture | lower }}' -eq 'esa') {
               try { Set-VsanClusterConfiguration -Cluster $cluster -ESAEnabled:$true -Confirm:$false | Out-Null } catch { }
               try { Set-VsanClusterConfiguration -Cluster $cluster -CompressionEnabled:{{ (vsan.data_reduction | lower) != 'disabled' | ternary('$true','$false') }} -Confirm:$false | Out-Null } catch { }
             } else {
               $dedup = $false; $compress = $false;
               switch ('{{ vsan.data_reduction | lower }}') {
                 'dedup_compress' { $dedup = $true; $compress = $true }
                 'compress_only'  { $dedup = $false; $compress = $true }
                 default          { $dedup = $false; $compress = $false }
               }
               try { Set-VsanClusterConfiguration -Cluster $cluster -DedupEnabled:$dedup -CompressionEnabled:$compress -Confirm:$false | Out-Null } catch { }
             }
             if ({{ vsan.encryption | ternary('$true','$false') }}) {
               try { Set-VsanClusterConfiguration -Cluster $cluster -EncryptionEnabled:$true -Confirm:$false | Out-Null } catch { }
             }
           }

           # Fault Domains
           $desired = @(
             {% for fd in fault_domains %}
             @{ Name='{{ fd.name }}'; Hosts=@({{ fd.hosts | map('quote') | join(', ') }}) },
             {% endfor %}
           );
           if ($desired.Count -gt 0) {
             try { $existing = Get-VsanFaultDomain -Cluster $cluster } catch { $existing = @() }
             foreach ($fd in $desired) {
               $cur = $existing | Where-Object { $_.Name -eq $fd.Name } | Select-Object -First 1
               $hostObjs = @()
               foreach ($hn in $fd.Hosts) { $h = Get-VMHost -Name $hn -ErrorAction SilentlyContinue; if ($h) { $hostObjs += $h } }
               if ($null -eq $cur) {
                 if ($hostObjs.Count -gt 0) { New-VsanFaultDomain -Cluster $cluster -Name $fd.Name -Hosts $hostObjs -Confirm:$false | Out-Null }
               } else {
                 try { Set-VsanFaultDomain -FaultDomain $cur -Hosts $hostObjs -Confirm:$false | Out-Null } catch { }
               }
             }
           }

           # Health
           $healthOut = $null
           if ({{ run_health_checks | ternary('$true','$false') }}) {
             try { $healthOut = Test-VsanClusterHealth -Cluster $cluster -IncludeOnlineHealth -TimeoutSeconds 900 }
             catch { try { $healthOut = Get-VsanClusterHealth -Cluster $cluster } catch { $healthOut = $null } }
           }

           $report = [pscustomobject]@{
             vcenter   = '{{ vcenter_hostname }}';
             cluster   = '{{ cluster_name }}';
             vsan      = @{
               enabled = $cluster.VsanEnabled
               architecture = '{{ vsan.architecture }}'
               encryption = {{ vsan.encryption | ternary('$true','$false') }}
             };
             faultDomains = @($desired | ForEach-Object { $_.Name });
             health    = if ($healthOut) { ($healthOut | Select-Object -Property *) } else { $null };
             timestamp = (Get-Date).ToString('s');
           }
           $json = $report | ConvertTo-Json -Depth 6;
           Set-Content -Path '{{ health_report_path }}' -Value $json -Encoding UTF8;
           $json"
      register: vsan_cmd
      changed_when: true
      delegate_to: localhost

    - name: Show health summary
      ansible.builtin.debug:
        var: vsan_cmd.stdout

    # ----------------------------- postflight -------------------

    - name: "vmware/vsan_cluster | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsan_cluster_preflight_passed | bool
          - fe_vmware_vsan_cluster_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsan_cluster: postflight validation failed - preflight passed
          ={{ fe_vmware_vsan_cluster_preflight_passed | default(false) }},
          status={{ fe_vmware_vsan_cluster_status | default('unknown') }}.
        success_msg: "vmware/vsan_cluster: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsan_cluster | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsan_cluster_postflight_passed: true
        fe_vmware_vsan_cluster_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsan_cluster | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsan_cluster_status: "failed"
        fe_vmware_vsan_cluster_postflight_passed: false
        fe_vmware_vsan_cluster_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsan_cluster_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsan_cluster | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsan_cluster: FAILED at '{{ fe_vmware_vsan_cluster_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsan_cluster_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsan_cluster | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsan_cluster failed at '{{ fe_vmware_vsan_cluster_failed_task }}': {{ fe_vmware_vsan_cluster_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsan_cluster | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsan_cluster_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsan_cluster_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsan_cluster_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsan_cluster | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsan_cluster":
              component: "vmware/vsan_cluster"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsan_cluster_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsan_cluster_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsan_cluster_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsan_cluster_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsan_cluster_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsan_cluster_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsan_cluster_failed_task | default('') }}"
              error: "{{ fe_vmware_vsan_cluster_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsan_cluster_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsan_cluster_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsan_cluster_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsan_cluster_status | default('') == 'succeeded' else ['vmware/vsan_cluster'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsan_cluster | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsan_cluster_stats_published: true
      tags:
        - always
