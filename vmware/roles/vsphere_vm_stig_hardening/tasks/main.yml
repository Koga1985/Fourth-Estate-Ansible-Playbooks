---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsphere_vm_stig_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsphere_vm_stig_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsphere_vm_stig_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsphere_vm_stig_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsphere_vm_stig_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsphere_vm_stig_hardening_status: "running"
    fe_vmware_vsphere_vm_stig_hardening_preflight_passed: false
    fe_vmware_vsphere_vm_stig_hardening_postflight_passed: false
    fe_vmware_vsphere_vm_stig_hardening_failed_task: ""
    fe_vmware_vsphere_vm_stig_hardening_error: ""
    fe_vmware_vsphere_vm_stig_hardening_stats_published: false
  tags:
    - always

- name: "vmware/vsphere_vm_stig_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsphere_vm_stig_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsphere_vm_stig_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsphere_vm_stig_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_vm_stig_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsphere_vm_stig_hardening: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsphere_vm_stig_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsphere_vm_stig_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_vm_stig_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_stig_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - vcenter_datacenter | length > 0
          - vm_name | length > 0
        fail_msg: "vCenter connection (host/user/pass/DC) and vm_name are required."

    - name: Gather VM facts
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        schema: "vsphere"
      no_log: true
      delegate_to: localhost
      register: vm_info

    - name: Fail if VM not found
      ansible.builtin.fail:
        msg: "VM '{{ vm_name }}' not found in datacenter '{{ vcenter_datacenter }}'."
      when: vm_info.instance is not defined

    # ----------------------------
    # Advanced configuration keys
    # ----------------------------
    - name: Build extraConfig map per switches
      ansible.builtin.set_fact:
        vm_extra_config: >-
          {{
            dict(
              # Copy/Paste + Drag&Drop
              ('isolation.tools.copy.disable', (stig_disable_copy_paste | bool) | ternary('true','false')),
              ('isolation.tools.paste.disable', (stig_disable_copy_paste | bool) | ternary('true','false')),
              ('isolation.tools.dnd.disable', (stig_disable_dnd | bool) | ternary('true','false')),
              # HGFS / Shared folders
              ('isolation.tools.hgfsServerSet.disable', (stig_disable_hgfs | bool) | ternary('true','false')),
              # VNC console
              ('RemoteDisplay.vnc.enabled', (stig_disable_vnc | bool) | ternary('false','false')),
              # Device hotplug
              ('devices.hotplug', (stig_disable_device_hotplug | bool) | ternary('false','true')),
              # Disk shrink/wiper
              ('isolation.tools.diskShrink.disable', (stig_disable_disk_shrink_wiper | bool) | ternary('true','false')),
              ('isolation.tools.diskWiper.disable', (stig_disable_disk_shrink_wiper | bool) | ternary('true','false')),
              # GUI options and guest initiated actions
              ('isolation.tools.setGUIOptions.enable', (stig_disable_gui_options | bool) | ternary('false','true')),
              ('isolation.tools.ghi.launchmenu.change', (stig_disable_console_interrupt | bool) | ternary('false','true')),
              ('isolation.tools.guestInitiatedRestart.exit', (stig_disable_guest_bounce | bool) | ternary('false','true')),
              # Hot-add
              ('vcpu.hotadd', (stig_disable_cpu_hotadd | bool) | ternary('false','true')),
              ('mem.hotadd', (stig_disable_mem_hotadd | bool) | ternary('false','true'))
            )
          }}

    - name: Apply advanced config (extraConfig)
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        state: present
        annotation: "{{ stig_banner_annotation | default(omit) }}"
        customvalues: >-
          {{
            vm_extra_config | dict2items(key_name='key', value_name='value')
          }}
      no_log: true
      delegate_to: localhost

    # ----------------------------
    # Firmware/Secure Boot (EFI)
    # ----------------------------
    - name: Ensure EFI firmware and Secure Boot (if enabled)
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        state: present
        hardware:
          boot_firmware: "{{ 'efi' if stig_require_efi_secure_boot else omit }}"
          secure_boot: "{{ true if stig_require_efi_secure_boot else omit }}"
      no_log: true
      when: stig_require_efi_secure_boot | bool
      delegate_to: localhost

    # ----------------------------
    # Remove/disable risky devices
    # ----------------------------
    - name: Remove CD-ROM device (if requested)
      community.vmware.vmware_guest_cdrom:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        state: absent
      no_log: true
      when: stig_remove_cdrom | bool
      delegate_to: localhost

    - name: Remove Floppy device (if requested)
      community.vmware.vmware_guest_floppy:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        state: absent
      no_log: true
      when: stig_remove_floppy | bool
      delegate_to: localhost

    - name: Disconnect serial/parallel at power on (if present)
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ vm_name }}"
        state: present
        hardware:
          serial:
            - type: "device"
              start_connected: false
          parallel:
            - start_connected: false
      no_log: true
      when: stig_disconnect_parallel_serial | bool
      delegate_to: localhost

    - name: Report applied hardening
      ansible.builtin.debug:
        msg:
          vm: "{{ vm_name }}"
          datacenter: "{{ vcenter_datacenter }}"
          efi_secureboot: "{{ stig_require_efi_secure_boot }}"
          removed_cdrom: "{{ stig_remove_cdrom }}"
          removed_floppy: "{{ stig_remove_floppy }}"
          advanced_keys: "{{ vm_extra_config | list }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/vsphere_vm_stig_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsphere_vm_stig_hardening_preflight_passed | bool
          - fe_vmware_vsphere_vm_stig_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsphere_vm_stig_hardening: postflight validation failed - preflight passed
          ={{ fe_vmware_vsphere_vm_stig_hardening_preflight_passed | default(false) }},
          status={{ fe_vmware_vsphere_vm_stig_hardening_status | default('unknown') }}.
        success_msg: "vmware/vsphere_vm_stig_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsphere_vm_stig_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_stig_hardening_postflight_passed: true
        fe_vmware_vsphere_vm_stig_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsphere_vm_stig_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_stig_hardening_status: "failed"
        fe_vmware_vsphere_vm_stig_hardening_postflight_passed: false
        fe_vmware_vsphere_vm_stig_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsphere_vm_stig_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_vm_stig_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsphere_vm_stig_hardening: FAILED at '{{ fe_vmware_vsphere_vm_stig_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsphere_vm_stig_hardening_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_vm_stig_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsphere_vm_stig_hardening failed at '{{ fe_vmware_vsphere_vm_stig_hardening_failed_task }}': {{ fe_vmware_vsphere_vm_stig_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsphere_vm_stig_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_stig_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsphere_vm_stig_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsphere_vm_stig_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsphere_vm_stig_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsphere_vm_stig_hardening":
              component: "vmware/vsphere_vm_stig_hardening"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsphere_vm_stig_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsphere_vm_stig_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsphere_vm_stig_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsphere_vm_stig_hardening_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsphere_vm_stig_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsphere_vm_stig_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsphere_vm_stig_hardening_failed_task | default('') }}"
              error: "{{ fe_vmware_vsphere_vm_stig_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsphere_vm_stig_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsphere_vm_stig_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsphere_vm_stig_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsphere_vm_stig_hardening_status | default('') == 'succeeded' else ['vmware/vsphere_vm_stig_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsphere_vm_stig_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_vm_stig_hardening_stats_published: true
      tags:
        - always
