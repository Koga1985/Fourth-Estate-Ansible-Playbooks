---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsphere_esxi_stig_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsphere_esxi_stig_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsphere_esxi_stig_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsphere_esxi_stig_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsphere_esxi_stig_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsphere_esxi_stig_hardening_status: "running"
    fe_vmware_vsphere_esxi_stig_hardening_preflight_passed: false
    fe_vmware_vsphere_esxi_stig_hardening_postflight_passed: false
    fe_vmware_vsphere_esxi_stig_hardening_failed_task: ""
    fe_vmware_vsphere_esxi_stig_hardening_error: ""
    fe_vmware_vsphere_esxi_stig_hardening_stats_published: false
  tags:
    - always

- name: "vmware/vsphere_esxi_stig_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsphere_esxi_stig_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsphere_esxi_stig_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsphere_esxi_stig_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_esxi_stig_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsphere_esxi_stig_hardening: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsphere_esxi_stig_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsphere_esxi_stig_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_esxi_stig_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_esxi_stig_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate scope
      ansible.builtin.assert:
        that:
          - harden_scope in ['single','cluster']
        fail_msg: "harden_scope must be 'single' or 'cluster'."

    - name: Validate inputs for single host
      ansible.builtin.assert:
        that:
          - esxi_hostname | length > 0
        fail_msg: "esxi_hostname is required for harden_scope=single."
      when: harden_scope == 'single'

    - name: Validate inputs for cluster scope
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - vcenter_datacenter | length > 0
          - vcenter_cluster | length > 0
        fail_msg: "vCenter vars (host/user/pass/DC/cluster) are required for harden_scope=cluster."
      when: harden_scope == 'cluster'

    # Build target hosts list
    - name: Set _targets for single host
      ansible.builtin.set_fact:
        _targets: ["{{ esxi_hostname }}"]
      when: harden_scope == 'single'

    - name: Discover hosts in cluster
      community.vmware.vmware_host_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        datacenter: "{{ vcenter_datacenter }}"
        cluster_name: "{{ vcenter_cluster }}"
      no_log: true
      register: _cluster_hosts
      delegate_to: localhost
      when: harden_scope == 'cluster'

    - name: Set _targets from cluster discovery
      ansible.builtin.set_fact:
        _targets: "{{ _cluster_hosts.hosts | map(attribute='name') | list }}"
      when: harden_scope == 'cluster'

    - name: Show target hosts
      ansible.builtin.debug:
        var: _targets

    # ---------------------- Controls ----------------------

    - name: Set acceptance level on each host
      community.vmware.vmware_host_acceptance:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        acceptance_level: "{{ acceptance_level }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Configure NTP servers
      community.vmware.vmware_host_ntp:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        ntp_servers: "{{ ntp_servers }}"
        state: present
      no_log: true
      when: ntp_servers | length > 0
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Ensure NTP service policy/state
      community.vmware.vmware_host_service_manager:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        service_name: "ntpd"
        service_policy: "{{ ntp_policy }}"
        state: "{{ (ntp_policy in ['on','automatic']) | ternary('on','off') }}"
      no_log: true
      when: ntp_servers | length > 0
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Configure remote syslog
      community.vmware.vmware_host_syslog:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        syslog_config:
          loghost: "{{ syslog_remote }}"
        state: present
      no_log: true
      when: syslog_remote | length > 0
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Set Syslog.global.logDirUnique via advanced config
      community.vmware.vmware_host_advanced_config:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        options:
          "Syslog.global.logDirUnique": "{{ 1 if syslog_dir_unique else 0 }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Apply advanced host configuration (bulk)
      community.vmware.vmware_host_advanced_config:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        options: "{{ advanced_config }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Set SSH service policy (Lock down remote shells)
      community.vmware.vmware_host_service_manager:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        service_name: "TSM-SSH"
        service_policy: "{{ ssh_policy }}"
        state: "{{ (ssh_policy in ['on','automatic']) | ternary('on','off') }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Set ESXi Shell service policy
      community.vmware.vmware_host_service_manager:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        service_name: "TSM"
        service_policy: "{{ esxi_shell_policy }}"
        state: "{{ (esxi_shell_policy in ['on','automatic']) | ternary('on','off') }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Configure firewall rulesets (optional list)
      community.vmware.vmware_host_firewall_manager:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ esxi_target if harden_scope == 'cluster' else omit }}"
        rules:
          - name: "{{ item.name }}"
            enabled: "{{ item.enabled | default(false) }}"
            allowed_hosts: "{{ item.allowed_hosts | default('ALL') }}"
      no_log: true
      vars:
        esxi_target: "{{ inventory_hostname | default('') }}"
      loop: "{{ firewall_rulesets }}"
      when: firewall_rulesets | length > 0
      delegate_to: localhost

    - name: Set Lockdown mode
      community.vmware.vmware_host_lockdown:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        state: "{{ 'present' if lockdown_enable else 'absent' }}"
        lockdown_mode: "{{ 'lockdown_strict' if lockdown_mode == 'strict' else 'lockdown_normal' }}"
        exception_users: "{{ lockdown_exception_users | default([]) }}"
      no_log: true
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Exit maintenance mode (if requested)
      community.vmware.vmware_maintenancemode:
        hostname: "{{ esxi_hostname if harden_scope == 'single' else vcenter_hostname }}"
        username: "{{ esxi_username if harden_scope == 'single' else vcenter_username }}"
        password: "{{ esxi_password if harden_scope == 'single' else vcenter_password }}"
        validate_certs: "{{ esxi_validate_certs if harden_scope == 'single' else vcenter_validate_certs }}"
        esxi_hostname: "{{ item if harden_scope == 'cluster' else omit }}"
        state: absent
      no_log: true
      when: ensure_exit_maintenance | bool
      loop: "{{ _targets }}"
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        msg:
          hardened_hosts: "{{ _targets }}"
          lockdown: "{{ lockdown_enable }} ({{ lockdown_mode }})"
          shells: { ssh: "{{ ssh_policy }}", esxi_shell: "{{ esxi_shell_policy }}" }
          ntp_servers: "{{ ntp_servers }}"
          syslog_remote: "{{ syslog_remote }}"
          acceptance_level: "{{ acceptance_level }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/vsphere_esxi_stig_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsphere_esxi_stig_hardening_preflight_passed | bool
          - fe_vmware_vsphere_esxi_stig_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsphere_esxi_stig_hardening: postflight validation failed - preflight passed
          ={{ fe_vmware_vsphere_esxi_stig_hardening_preflight_passed | default(false) }},
          status={{ fe_vmware_vsphere_esxi_stig_hardening_status | default('unknown') }}.
        success_msg: "vmware/vsphere_esxi_stig_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsphere_esxi_stig_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_esxi_stig_hardening_postflight_passed: true
        fe_vmware_vsphere_esxi_stig_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsphere_esxi_stig_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_esxi_stig_hardening_status: "failed"
        fe_vmware_vsphere_esxi_stig_hardening_postflight_passed: false
        fe_vmware_vsphere_esxi_stig_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsphere_esxi_stig_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_esxi_stig_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsphere_esxi_stig_hardening: FAILED at '{{ fe_vmware_vsphere_esxi_stig_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsphere_esxi_stig_hardening_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_esxi_stig_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsphere_esxi_stig_hardening failed at '{{ fe_vmware_vsphere_esxi_stig_hardening_failed_task }}': {{ fe_vmware_vsphere_esxi_stig_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsphere_esxi_stig_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_esxi_stig_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsphere_esxi_stig_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsphere_esxi_stig_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsphere_esxi_stig_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsphere_esxi_stig_hardening":
              component: "vmware/vsphere_esxi_stig_hardening"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsphere_esxi_stig_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsphere_esxi_stig_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsphere_esxi_stig_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsphere_esxi_stig_hardening_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsphere_esxi_stig_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsphere_esxi_stig_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsphere_esxi_stig_hardening_failed_task | default('') }}"
              error: "{{ fe_vmware_vsphere_esxi_stig_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsphere_esxi_stig_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsphere_esxi_stig_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsphere_esxi_stig_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsphere_esxi_stig_hardening_status | default('') == 'succeeded' else ['vmware/vsphere_esxi_stig_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsphere_esxi_stig_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_esxi_stig_hardening_stats_published: true
      tags:
        - always
