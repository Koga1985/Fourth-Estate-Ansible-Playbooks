---
# tasks/fourth_estate_config.yml - Fourth Estate Specific Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vcenter_config/fourth_estate_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vcenter_config_fourth_estate_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vcenter_config/fourth_estate_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vcenter_config_fourth_estate_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vcenter_config_fourth_estate_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vcenter_config_fourth_estate_config_status: "running"
    fe_vmware_vcenter_config_fourth_estate_config_preflight_passed: false
    fe_vmware_vcenter_config_fourth_estate_config_postflight_passed: false
    fe_vmware_vcenter_config_fourth_estate_config_failed_task: ""
    fe_vmware_vcenter_config_fourth_estate_config_error: ""
    fe_vmware_vcenter_config_fourth_estate_config_stats_published: false
  tags:
    - always

- name: "vmware/vcenter_config/fourth_estate_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vcenter_config/fourth_estate_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vcenter_config/fourth_estate_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vcenter_config/fourth_estate_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_config/fourth_estate_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vcenter_config/fourth_estate_config: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vcenter_config/fourth_estate_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vcenter_config_fourth_estate_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_config/fourth_estate_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_fourth_estate_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure enhanced audit logging
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/logging/forwarding"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          hostname: "{{ fourth_estate_syslog_server }}"
          port: "{{ fourth_estate_syslog_port }}"
          protocol: "{{ fourth_estate_syslog_protocol | upper }}"
      no_log: true
      when: fourth_estate_syslog_server | length > 0
      delegate_to: localhost

    - name: Configure ServiceNow CMDB integration
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/vcenter/servicenow/config"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          instance_url: "{{ fourth_estate_servicenow_url }}"
          username: "{{ fourth_estate_servicenow_user }}"
          password: "{{ fourth_estate_servicenow_password }}"
          sync_interval: "{{ fourth_estate_servicenow_sync_interval }}"
      when:
        - fourth_estate_servicenow_enabled | bool
        - fourth_estate_servicenow_url | length > 0
      delegate_to: localhost
      no_log: true

    - name: Create custom roles for Fourth Estate operations
      community.vmware.vmware_role:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        role_name: "{{ item.name }}"
        state: present
        privileges: "{{ item.privileges }}"
      no_log: true
      loop: "{{ fourth_estate_custom_roles }}"
      when: fourth_estate_custom_roles | length > 0
      delegate_to: localhost

    - name: Set advanced settings for source protection
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/access/consolecli"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: false
      no_log: true
      when: fourth_estate_disable_console | bool
      delegate_to: localhost

    - name: Configure evidence preservation policy
      ansible.builtin.debug:
        msg: "Evidence preservation settings configured for datastore: {{ fourth_estate_evidence_datastore }}"

    - name: Enable enhanced security mode
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/access/dcui"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: false
      no_log: true
      when: fourth_estate_disable_dcui | bool
      delegate_to: localhost

    - name: Configure journalist network isolation tags
      community.vmware.vmware_tag_manager:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        tag_names:
          - name: "{{ item }}"
            category: "Fourth_Estate_Security"
            description: "Fourth Estate security classification"
        state: present
      no_log: true
      loop:
        - "Journalist_Workload"
        - "Production_Workload"
        - "Source_Protection"
        - "Evidence_Preservation"
        - "CDN_Infrastructure"
      delegate_to: localhost

    - name: Fourth Estate configuration applied
      ansible.builtin.debug:
        msg: "Fourth Estate specific security and compliance configuration applied"

    # ----------------------------- postflight -------------------

    - name: "vmware/vcenter_config/fourth_estate_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vcenter_config_fourth_estate_config_preflight_passed | bool
          - fe_vmware_vcenter_config_fourth_estate_config_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vcenter_config/fourth_estate_config: postflight validation failed - preflight passed
          ={{ fe_vmware_vcenter_config_fourth_estate_config_preflight_passed | default(false) }},
          status={{ fe_vmware_vcenter_config_fourth_estate_config_status | default('unknown') }}.
        success_msg: "vmware/vcenter_config/fourth_estate_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vcenter_config/fourth_estate_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_fourth_estate_config_postflight_passed: true
        fe_vmware_vcenter_config_fourth_estate_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vcenter_config/fourth_estate_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_fourth_estate_config_status: "failed"
        fe_vmware_vcenter_config_fourth_estate_config_postflight_passed: false
        fe_vmware_vcenter_config_fourth_estate_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vcenter_config_fourth_estate_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_config/fourth_estate_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vcenter_config/fourth_estate_config: FAILED at '{{ fe_vmware_vcenter_config_fourth_estate_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vcenter_config_fourth_estate_config_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_config/fourth_estate_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vcenter_config/fourth_estate_config failed at '{{ fe_vmware_vcenter_config_fourth_estate_config_failed_task }}': {{ fe_vmware_vcenter_config_fourth_estate_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vcenter_config/fourth_estate_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_fourth_estate_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vcenter_config_fourth_estate_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vcenter_config_fourth_estate_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vcenter_config/fourth_estate_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vcenter_config/fourth_estate_config":
              component: "vmware/vcenter_config/fourth_estate_config"
              type: "role-tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vcenter_config_fourth_estate_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vcenter_config_fourth_estate_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vcenter_config_fourth_estate_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vcenter_config_fourth_estate_config_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vcenter_config_fourth_estate_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vcenter_config_fourth_estate_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vcenter_config_fourth_estate_config_failed_task | default('') }}"
              error: "{{ fe_vmware_vcenter_config_fourth_estate_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vcenter_config_fourth_estate_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vcenter_config_fourth_estate_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vcenter_config_fourth_estate_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vcenter_config_fourth_estate_config_status | default('') == 'succeeded' else ['vmware/vcenter_config/fourth_estate_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vcenter_config/fourth_estate_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_fourth_estate_config_stats_published: true
      tags:
        - always
