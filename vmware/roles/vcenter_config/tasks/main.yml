---
# tasks/main.yml - vCenter Server Post-Installation Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vcenter_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vcenter_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vcenter_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vcenter_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vcenter_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vcenter_config_status: "running"
    fe_vmware_vcenter_config_preflight_passed: false
    fe_vmware_vcenter_config_postflight_passed: false
    fe_vmware_vcenter_config_failed_task: ""
    fe_vmware_vcenter_config_error: ""
    fe_vmware_vcenter_config_stats_published: false
  tags:
    - always

- name: "vmware/vcenter_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vcenter_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vcenter_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vcenter_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vcenter_config: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vcenter_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vcenter_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vcenter_hostname is defined
          - vcenter_username is defined
          - vcenter_password is defined
        fail_msg: "Required vCenter connection variables are missing"

    - name: Verify vCenter connectivity
      community.vmware.vmware_about_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      register: vcenter_info
      delegate_to: localhost

    - name: Display vCenter information
      ansible.builtin.debug:
        msg:
          - "vCenter Version: {{ vcenter_info.about_info.version }}"
          - "Build: {{ vcenter_info.about_info.build }}"
          - "API Type: {{ vcenter_info.about_info.apiType }}"

    # Configure Advanced Settings
    - name: Configure vCenter advanced settings
      community.vmware.vmware_vcenter_settings:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        database:
          max_connections: "{{ vcenter_db_max_connections }}"
          task_retention: "{{ vcenter_task_retention_days }}"
          event_retention: "{{ vcenter_event_retention_days }}"
        runtime_settings:
          unique_id: "{{ vcenter_instance_id | default(omit) }}"
          managed_address: "{{ vcenter_hostname }}"
          vcenter_server_name: "{{ vcenter_server_name }}"
        timeout_settings:
          normal_operations: "{{ vcenter_timeout_normal }}"
          long_operations: "{{ vcenter_timeout_long }}"
        logging:
          log_level: "{{ vcenter_log_level }}"
      no_log: true
      delegate_to: localhost

    # Configure AD/LDAP Integration
    - name: Configure Active Directory identity source
      community.vmware.vmware_identity_source:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        state: present
        domain_name: "{{ item.domain }}"
        domain_alias: "{{ item.alias | default(omit) }}"
        ldap_host: "{{ item.ldap_host }}"
        ldap_port: "{{ item.ldap_port | default(389) }}"
        ldap_base_dn: "{{ item.base_dn }}"
        bind_user: "{{ item.bind_user }}"
        bind_password: "{{ item.bind_password }}"
        ssl_enabled: "{{ item.ssl_enabled | default(true) }}"
      loop: "{{ vcenter_identity_sources }}"
      when: vcenter_identity_sources | length > 0
      delegate_to: localhost
      no_log: true

    # Configure mail settings for alerts
    - name: Configure mail server settings
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/email/config"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          smtp_server: "{{ vcenter_smtp_server }}"
          smtp_port: "{{ vcenter_smtp_port }}"
          sender: "{{ vcenter_smtp_sender }}"
          auth_enabled: "{{ vcenter_smtp_auth_enabled }}"
          username: "{{ vcenter_smtp_username | default('') }}"
          password: "{{ vcenter_smtp_password | default('') }}"
          starttls_enabled: "{{ vcenter_smtp_starttls }}"
      no_log: true
      when: vcenter_smtp_server | length > 0
      delegate_to: localhost

    # Configure NTP
    - name: Configure NTP servers
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/ntp"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          servers: "{{ vcenter_ntp_servers }}"
      no_log: true
      when: vcenter_ntp_servers | length > 0
      delegate_to: localhost

    # Configure DNS
    - name: Configure DNS servers
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/networking/dns/servers"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          mode: "is_static"
          servers: "{{ vcenter_dns_servers }}"
      no_log: true
      when: vcenter_dns_servers | length > 0
      delegate_to: localhost

    # Configure syslog forwarding for Fourth Estate compliance
    - name: Configure remote syslog forwarding
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/logging/forwarding"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          hostname: "{{ vcenter_syslog_server }}"
          port: "{{ vcenter_syslog_port }}"
          protocol: "{{ vcenter_syslog_protocol | upper }}"
      no_log: true
      when: vcenter_syslog_server | length > 0
      delegate_to: localhost

    # Configure SNMP
    - name: Configure SNMP settings
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/snmp"
        method: PATCH
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          enable: "{{ vcenter_snmp_enabled }}"
          SNMPv3:
            users: "{{ vcenter_snmp_users }}"
          communities: "{{ vcenter_snmp_communities }}"
          syscontact: "{{ vcenter_snmp_syscontact }}"
          syslocation: "{{ vcenter_snmp_syslocation }}"
      no_log: true
      when: vcenter_snmp_enabled | bool
      delegate_to: localhost

    # Configure TLS/SSL settings for STIG compliance
    - name: Configure minimum TLS version (STIG requirement)
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/appliance/networking/tls"
        method: PUT
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          min_version: "{{ vcenter_tls_min_version }}"
      no_log: true
      when: vcenter_tls_enforcement | bool
      delegate_to: localhost

    # Configure session timeout (STIG requirement)
    - name: Configure session timeout settings
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/rest/com/vmware/vapi/session/timeout"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          timeout: "{{ vcenter_session_timeout }}"
      no_log: true
      delegate_to: localhost

    # Configure Fourth Estate specific settings
    - name: Apply Fourth Estate security baseline
      ansible.builtin.include_tasks: fourth_estate_config.yml
      when: fourth_estate_mode | bool

    - name: vCenter configuration complete
      ansible.builtin.debug:
        msg: "vCenter Server configuration completed successfully"

    # ----------------------------- postflight -------------------

    - name: "vmware/vcenter_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vcenter_config_preflight_passed | bool
          - fe_vmware_vcenter_config_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vcenter_config: postflight validation failed - preflight passed
          ={{ fe_vmware_vcenter_config_preflight_passed | default(false) }},
          status={{ fe_vmware_vcenter_config_status | default('unknown') }}.
        success_msg: "vmware/vcenter_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vcenter_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_postflight_passed: true
        fe_vmware_vcenter_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vcenter_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_status: "failed"
        fe_vmware_vcenter_config_postflight_passed: false
        fe_vmware_vcenter_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vcenter_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vcenter_config: FAILED at '{{ fe_vmware_vcenter_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vcenter_config_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vcenter_config failed at '{{ fe_vmware_vcenter_config_failed_task }}': {{ fe_vmware_vcenter_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vcenter_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vcenter_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vcenter_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vcenter_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vcenter_config":
              component: "vmware/vcenter_config"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vcenter_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vcenter_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vcenter_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vcenter_config_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vcenter_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vcenter_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vcenter_config_failed_task | default('') }}"
              error: "{{ fe_vmware_vcenter_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vcenter_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vcenter_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vcenter_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vcenter_config_status | default('') == 'succeeded' else ['vmware/vcenter_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vcenter_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_config_stats_published: true
      tags:
        - always
