---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsphere_snapshots_role/find']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsphere_snapshots_role_find_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsphere_snapshots_role/find | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsphere_snapshots_role_find_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsphere_snapshots_role_find_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsphere_snapshots_role_find_status: "running"
    fe_vmware_vsphere_snapshots_role_find_preflight_passed: false
    fe_vmware_vsphere_snapshots_role_find_postflight_passed: false
    fe_vmware_vsphere_snapshots_role_find_failed_task: ""
    fe_vmware_vsphere_snapshots_role_find_error: ""
    fe_vmware_vsphere_snapshots_role_find_stats_published: false
  tags:
    - always

- name: "vmware/vsphere_snapshots_role/find | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsphere_snapshots_role/find | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsphere_snapshots_role/find: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsphere_snapshots_role/find: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_snapshots_role/find | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsphere_snapshots_role/find: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsphere_snapshots_role/find: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsphere_snapshots_role_find_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_snapshots_role/find | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_find_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Gather VMs
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      delegate_to: localhost
      register: vminfo

    - name: Build VM list
      ansible.builtin.set_fact:
        _all_vm_names: "{{ vminfo.virtual_machines | map(attribute='guest_name') | select('defined') | list }}"
        _cand_vm_names: >
          {{ _all_vm_names | select('match', vsphere_include_name_regex if vsphere_include_name_regex|length>0 else '.*')
          | reject('match', vsphere_exclude_name_regex if vsphere_exclude_name_regex|length>0 else 'a^') | list }}

    - name: Gather snapshot info
      community.vmware.vmware_guest_snapshot_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
      no_log: true
      loop: "{{ _cand_vm_names }}"
      delegate_to: localhost
      register: snapshot_info_results

    - name: Normalize results
      ansible.builtin.set_fact:
        vsphere_snapshot_report: "{{ snapshot_info_results.results | map('extract', {'item':'item','snapshots':'snapshots'}) | map('combine') | selectattr('snapshots','defined') | list }}"

    - name: Filter VMs with snapshots
      ansible.builtin.set_fact:
        vsphere_snapshot_report: "{{ vsphere_snapshot_report | selectattr('snapshots','truthy') | list }}"

    - name: Summary
      ansible.builtin.debug:
        msg:
          total_vms: "{{ _all_vm_names | length }}"
          vms_with_snapshots: "{{ vsphere_snapshot_report | length }}"

    - name: Write report to JSON
      ansible.builtin.copy:
        dest: "{{ vsphere_snapshots_json_path }}"
        content: "{{ vsphere_snapshot_report | to_nice_json }}"
        mode: '0640'
      delegate_to: localhost
      when: vsphere_snapshots_write_json | bool

    # ----------------------------- postflight -------------------

    - name: "vmware/vsphere_snapshots_role/find | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsphere_snapshots_role_find_preflight_passed | bool
          - fe_vmware_vsphere_snapshots_role_find_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsphere_snapshots_role/find: postflight validation failed - preflight passed
          ={{ fe_vmware_vsphere_snapshots_role_find_preflight_passed | default(false) }},
          status={{ fe_vmware_vsphere_snapshots_role_find_status | default('unknown') }}.
        success_msg: "vmware/vsphere_snapshots_role/find: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsphere_snapshots_role/find | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_find_postflight_passed: true
        fe_vmware_vsphere_snapshots_role_find_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsphere_snapshots_role/find | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_find_status: "failed"
        fe_vmware_vsphere_snapshots_role_find_postflight_passed: false
        fe_vmware_vsphere_snapshots_role_find_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsphere_snapshots_role_find_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_snapshots_role/find | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsphere_snapshots_role/find: FAILED at '{{ fe_vmware_vsphere_snapshots_role_find_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsphere_snapshots_role_find_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_snapshots_role/find | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsphere_snapshots_role/find failed at '{{ fe_vmware_vsphere_snapshots_role_find_failed_task }}': {{ fe_vmware_vsphere_snapshots_role_find_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsphere_snapshots_role/find | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_find_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsphere_snapshots_role_find_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsphere_snapshots_role_find_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsphere_snapshots_role/find | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsphere_snapshots_role/find":
              component: "vmware/vsphere_snapshots_role/find"
              type: "role-tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsphere_snapshots_role_find_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsphere_snapshots_role_find_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsphere_snapshots_role_find_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsphere_snapshots_role_find_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsphere_snapshots_role_find_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsphere_snapshots_role_find_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsphere_snapshots_role_find_failed_task | default('') }}"
              error: "{{ fe_vmware_vsphere_snapshots_role_find_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsphere_snapshots_role_find_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsphere_snapshots_role_find_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsphere_snapshots_role_find_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsphere_snapshots_role_find_status | default('') == 'succeeded' else ['vmware/vsphere_snapshots_role/find'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsphere_snapshots_role/find | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_find_stats_published: true
      tags:
        - always
