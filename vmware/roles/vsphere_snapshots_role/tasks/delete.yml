---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsphere_snapshots_role/delete']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsphere_snapshots_role_delete_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsphere_snapshots_role/delete | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsphere_snapshots_role_delete_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsphere_snapshots_role_delete_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsphere_snapshots_role_delete_status: "running"
    fe_vmware_vsphere_snapshots_role_delete_preflight_passed: false
    fe_vmware_vsphere_snapshots_role_delete_postflight_passed: false
    fe_vmware_vsphere_snapshots_role_delete_failed_task: ""
    fe_vmware_vsphere_snapshots_role_delete_error: ""
    fe_vmware_vsphere_snapshots_role_delete_stats_published: false
  tags:
    - always

- name: "vmware/vsphere_snapshots_role/delete | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsphere_snapshots_role/delete | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsphere_snapshots_role/delete: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsphere_snapshots_role/delete: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_snapshots_role/delete | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsphere_snapshots_role/delete: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsphere_snapshots_role/delete: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsphere_snapshots_role_delete_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsphere_snapshots_role/delete | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_delete_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure datacenter is set
      ansible.builtin.assert:
        that: [ vcenter_datacenter | length > 0 ]
        fail_msg: "vcenter_datacenter must be set."

    - name: Safety check
      ansible.builtin.assert:
        that:
          - vsphere_snapshots_confirm_delete | bool or vsphere_snapshots_precheck_only | bool
        fail_msg: "Set vsphere_snapshots_confirm_delete=true or vsphere_snapshots_precheck_only=true."

    - name: Gather VMs
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      delegate_to: localhost
      register: vminfo

    - name: Build VM data
      ansible.builtin.set_fact:
        _vm_records: "{{ vminfo.virtual_machines | selectattr('guest_name','defined') | list }}"
        _vm_moids: "{{ _vm_records | map(attribute='moid') | list }}"
        _vm_names: "{{ _vm_records | map(attribute='guest_name') | list }}"

    - name: Probe snapshots
      community.vmware.vmware_guest_snapshot_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
      no_log: true
      loop: "{{ _vm_names }}"
      delegate_to: localhost
      register: _snap_probe

    - name: Filter VMs with snapshots
      ansible.builtin.set_fact:
        _vms_with_snaps: "{{ _snap_probe.results | selectattr('snapshots','defined') | selectattr('snapshots','truthy') | map(attribute='item') | list }}"
        _moids_with_snaps: "{{ _vm_records | selectattr('guest_name','in', _vms_with_snaps) | map(attribute='moid') | list }}"

    - name: Summary
      ansible.builtin.debug:
        msg:
          vms_with_snapshots: "{{ _vms_with_snaps | length }}"
          precheck_only: "{{ vsphere_snapshots_precheck_only | bool }}"

    - name: End if precheck
      ansible.builtin.meta: end_task
      when: vsphere_snapshots_precheck_only | bool

    - name: Remove all snapshots
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        moid: "{{ item }}"
        state: remove_all
      no_log: true
      loop: "{{ _moids_with_snaps }}"
      delegate_to: localhost
      throttle: "{{ vsphere_snapshots_delete_concurrency | int }}"
      register: _delete_results

    - name: Report
      ansible.builtin.debug:
        msg:
          attempted: "{{ _moids_with_snaps | length }}"
          changed: "{{ _delete_results.results | selectattr('changed','defined') | selectattr('changed') | list | length }}"
          failed: "{{ _delete_results.results | selectattr('failed','defined') | selectattr('failed') | list | length }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/vsphere_snapshots_role/delete | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsphere_snapshots_role_delete_preflight_passed | bool
          - fe_vmware_vsphere_snapshots_role_delete_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsphere_snapshots_role/delete: postflight validation failed - preflight passed
          ={{ fe_vmware_vsphere_snapshots_role_delete_preflight_passed | default(false) }},
          status={{ fe_vmware_vsphere_snapshots_role_delete_status | default('unknown') }}.
        success_msg: "vmware/vsphere_snapshots_role/delete: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsphere_snapshots_role/delete | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_delete_postflight_passed: true
        fe_vmware_vsphere_snapshots_role_delete_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsphere_snapshots_role/delete | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_delete_status: "failed"
        fe_vmware_vsphere_snapshots_role_delete_postflight_passed: false
        fe_vmware_vsphere_snapshots_role_delete_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsphere_snapshots_role_delete_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_snapshots_role/delete | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsphere_snapshots_role/delete: FAILED at '{{ fe_vmware_vsphere_snapshots_role_delete_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsphere_snapshots_role_delete_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsphere_snapshots_role/delete | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsphere_snapshots_role/delete failed at '{{ fe_vmware_vsphere_snapshots_role_delete_failed_task }}': {{ fe_vmware_vsphere_snapshots_role_delete_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsphere_snapshots_role/delete | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_delete_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsphere_snapshots_role_delete_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsphere_snapshots_role_delete_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsphere_snapshots_role/delete | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsphere_snapshots_role/delete":
              component: "vmware/vsphere_snapshots_role/delete"
              type: "role-tasks"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsphere_snapshots_role_delete_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsphere_snapshots_role_delete_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsphere_snapshots_role_delete_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsphere_snapshots_role_delete_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsphere_snapshots_role_delete_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsphere_snapshots_role_delete_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsphere_snapshots_role_delete_failed_task | default('') }}"
              error: "{{ fe_vmware_vsphere_snapshots_role_delete_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsphere_snapshots_role_delete_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsphere_snapshots_role_delete_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsphere_snapshots_role_delete_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsphere_snapshots_role_delete_status | default('') == 'succeeded' else ['vmware/vsphere_snapshots_role/delete'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsphere_snapshots_role/delete | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsphere_snapshots_role_delete_stats_published: true
      tags:
        - always
