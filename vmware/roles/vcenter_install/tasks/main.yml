---
# tasks/main.yml - vCenter Server Appliance (VCSA) Deployment
# Deploys VCSA using CLI installer or OVF deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vcenter_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vcenter_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vcenter_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vcenter_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vcenter_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vcenter_install_status: "running"
    fe_vmware_vcenter_install_preflight_passed: false
    fe_vmware_vcenter_install_postflight_passed: false
    fe_vmware_vcenter_install_failed_task: ""
    fe_vmware_vcenter_install_error: ""
    fe_vmware_vcenter_install_stats_published: false
  tags:
    - always

- name: "vmware/vcenter_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vcenter_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vcenter_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vcenter_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vcenter_install: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vcenter_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vcenter_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vcenter_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vcenter_hostname is defined
          - vcenter_deployment_size is defined
          - vcenter_sso_password is defined
          - vcenter_root_password is defined
          - esxi_deployment_host is defined
          - esxi_deployment_username is defined
          - esxi_deployment_password is defined
        fail_msg: "Required vCenter deployment variables are missing"

    - name: Check if vCenter is already deployed
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/ui"
        method: GET
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: [200, 302, -1]
      register: vcenter_check
      ignore_errors: true
      delegate_to: localhost

    - name: Set vCenter deployment status
      ansible.builtin.set_fact:
        vcenter_already_deployed: "{{ vcenter_check.status in [200, 302] }}"

    - name: Display vCenter status
      ansible.builtin.debug:
        msg: "vCenter at {{ vcenter_hostname }} is {{ 'already deployed' if vcenter_already_deployed else 'not deployed' }}"

    - name: Create temporary deployment directory
      ansible.builtin.tempfile:
        state: directory
        suffix: vcenter_deploy
      register: vcenter_deploy_temp
      when: not vcenter_already_deployed
      delegate_to: localhost

    - name: Generate VCSA deployment JSON configuration
      ansible.builtin.template:
        src: vcsa_deployment.json.j2
        dest: "{{ vcenter_deploy_temp.path }}/vcsa_deployment.json"
        mode: '0600'
      when: not vcenter_already_deployed
      delegate_to: localhost

    - name: Check for VCSA ISO mount or installer path
      ansible.builtin.stat:
        path: "{{ vcsa_installer_path }}/vcsa-deploy"
      register: vcsa_installer
      when: not vcenter_already_deployed
      delegate_to: localhost

    - name: Fail if VCSA installer not found
      ansible.builtin.fail:
        msg: "VCSA installer not found at {{ vcsa_installer_path }}. Mount ISO or provide correct path."
      when:
        - not vcenter_already_deployed
        - not vcsa_installer.stat.exists

    - name: Deploy vCenter Server Appliance (this may take 30-60 minutes)
      ansible.builtin.command:
        cmd: >
          {{ vcsa_installer_path }}/vcsa-deploy install
          --accept-eula
          --no-ssl-certificate-verification
          {{ '--acknowledge-ceip' if vcsa_ceip_enabled else '' }}
          {{ vcenter_deploy_temp.path }}/vcsa_deployment.json
        creates: /tmp/vcsa_deployed_{{ vcenter_hostname | replace('.', '_') }}
      register: vcsa_deployment
      when: not vcenter_already_deployed
      delegate_to: localhost
      async: 7200
      poll: 30

    - name: Create deployment marker file
      ansible.builtin.file:
        path: /tmp/vcsa_deployed_{{ vcenter_hostname | replace('.', '_') }}
        state: touch
        mode: '0644'
      when:
        - not vcenter_already_deployed
        - vcsa_deployment is success
      delegate_to: localhost

    - name: Wait for vCenter services to be ready (5-10 minutes)
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/ui"
        method: GET
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: [200, 302]
      register: vcenter_ready
      until: vcenter_ready.status in [200, 302]
      retries: 60
      delay: 10
      when: not vcenter_already_deployed
      delegate_to: localhost

    - name: Verify vCenter API is accessible
      community.vmware.vmware_about_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
      no_log: true
      register: vcenter_info
      delegate_to: localhost

    - name: Display vCenter version information
      ansible.builtin.debug:
        msg:
          - "vCenter Server deployed successfully"
          - "Version: {{ vcenter_info.about_info.version }}"
          - "Build: {{ vcenter_info.about_info.build }}"
          - "API Version: {{ vcenter_info.about_info.apiVersion }}"
          - "Hostname: {{ vcenter_hostname }}"

    - name: Configure vCenter basic settings
      community.vmware.vmware_vcenter_settings:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        database:
          max_connections: "{{ vcenter_db_max_connections }}"
        runtime_settings:
          unique_id: "{{ vcenter_unique_id | default(omit) }}"
          managed_address: "{{ vcenter_hostname }}"
          vcenter_server_name: "{{ vcenter_server_name | default(vcenter_hostname) }}"
      no_log: true
      delegate_to: localhost

    - name: Clean up temporary deployment files
      ansible.builtin.file:
        path: "{{ vcenter_deploy_temp.path }}"
        state: absent
      when:
        - not vcenter_already_deployed
        - vcenter_deploy_temp is defined
      delegate_to: localhost

    - name: vCenter installation complete
      ansible.builtin.debug:
        msg: "vCenter Server installation and configuration completed successfully"

    # ----------------------------- postflight -------------------

    - name: "vmware/vcenter_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vcenter_install_preflight_passed | bool
          - fe_vmware_vcenter_install_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vcenter_install: postflight validation failed - preflight passed
          ={{ fe_vmware_vcenter_install_preflight_passed | default(false) }},
          status={{ fe_vmware_vcenter_install_status | default('unknown') }}.
        success_msg: "vmware/vcenter_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vcenter_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_install_postflight_passed: true
        fe_vmware_vcenter_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vcenter_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_install_status: "failed"
        fe_vmware_vcenter_install_postflight_passed: false
        fe_vmware_vcenter_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vcenter_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vcenter_install: FAILED at '{{ fe_vmware_vcenter_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vcenter_install_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vcenter_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vcenter_install failed at '{{ fe_vmware_vcenter_install_failed_task }}': {{ fe_vmware_vcenter_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vcenter_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vcenter_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vcenter_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vcenter_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vcenter_install":
              component: "vmware/vcenter_install"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vcenter_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vcenter_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vcenter_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vcenter_install_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vcenter_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vcenter_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vcenter_install_failed_task | default('') }}"
              error: "{{ fe_vmware_vcenter_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vcenter_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vcenter_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vcenter_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vcenter_install_status | default('') == 'succeeded' else ['vmware/vcenter_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vcenter_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vcenter_install_stats_published: true
      tags:
        - always
