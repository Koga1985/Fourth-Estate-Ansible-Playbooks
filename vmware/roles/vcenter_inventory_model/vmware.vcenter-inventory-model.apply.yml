---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: localhost
  gather_facts: false
  roles:
    - role: vcenter_inventory_model
      vars:
        vcenter_hostname: "vcenter.example.local"
        vcenter_username: "{{ lookup('env','VCENTER_USERNAME') }}"
        vcenter_password: "{{ lookup('env','VCENTER_PASSWORD') }}"
        vcenter_validate_certs: false
        vcenter_datacenter: "DC1"
        vm_folders:
          - "/DC1/vm/Production"
          - "/DC1/vm/NonProd"
        create_app_tier_subfolders: true
        app_tiers: ["web","app","db"]
        resource_pools:
          - { path: "/DC1/host/Cluster01", name: "App" }
          - { path: "/DC1/host/Cluster01/Resources/DB", name: "DB-Heavy" }
  pre_tasks:
    - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status: "running"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed: false
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed: false
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task: ""
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error: ""
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_stats_published: false
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: required variable '{{ item }}' is not defined."
            success_msg: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status: "preflight_failed"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed: false
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: FAILED at '{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error }}
          tags:
            - always
            - rescue

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply":
                  component: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply"
                  type: "playbook"
                  platform: "vmware"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_started_at | default('') }}"
                  ended_at: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task | default('') }}"
                  error: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else ['vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_stats_published: true
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply failed at '{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task }}': {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: preflight
              {{ 'passed' if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed | bool
              - fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status in ['running', 'succeeded']
            fail_msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: postflight validation failed - preflight passed
              ={{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed | default(false) }},
              status={{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('unknown') }}.
            success_msg: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed: true
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status: "failed"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed: false
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: FAILED at '{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error }}
          tags:
            - always
            - rescue

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply failed at '{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task }}': {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply":
                  component: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply"
                  type: "playbook"
                  platform: "vmware"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_started_at | default('') }}"
                  ended_at: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_failed_task | default('') }}"
                  error: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('') == 'succeeded' else ['vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_stats_published: true
          tags:
            - always

        - name: "vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              vmware/vcenter_inventory_model/vmware.vcenter-inventory-model.apply: {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_status | default('unknown') }} in
              {{ fe_vmware_vcenter_inventory_model_vmware_vcenter_inventory_model_apply_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
