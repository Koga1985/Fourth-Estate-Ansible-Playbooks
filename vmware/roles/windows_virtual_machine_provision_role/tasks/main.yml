---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/windows_virtual_machine_provision_role']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_windows_virtual_machine_provision_role_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/windows_virtual_machine_provision_role | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_windows_virtual_machine_provision_role_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_windows_virtual_machine_provision_role_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_windows_virtual_machine_provision_role_status: "running"
    fe_vmware_windows_virtual_machine_provision_role_preflight_passed: false
    fe_vmware_windows_virtual_machine_provision_role_postflight_passed: false
    fe_vmware_windows_virtual_machine_provision_role_failed_task: ""
    fe_vmware_windows_virtual_machine_provision_role_error: ""
    fe_vmware_windows_virtual_machine_provision_role_stats_published: false
  tags:
    - always

- name: "vmware/windows_virtual_machine_provision_role | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/windows_virtual_machine_provision_role | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/windows_virtual_machine_provision_role: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/windows_virtual_machine_provision_role: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/windows_virtual_machine_provision_role | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/windows_virtual_machine_provision_role: required variable '{{ item }}' is not defined."
        success_msg: "vmware/windows_virtual_machine_provision_role: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_windows_virtual_machine_provision_role_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/windows_virtual_machine_provision_role | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_windows_virtual_machine_provision_role_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0
          - vm_template | length > 0
          - vm_name | length > 0
        fail_msg: "Missing one or more required variables (vCenter creds, vm_template, vm_name)."

    - name: Clone Windows VM from template (with network + optional customization)
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        cluster: "{{ vcenter_cluster | default(omit) }}"
        folder: "{{ vcenter_folder | default(omit) }}"
        datastore: "{{ vcenter_datastore | default(omit) }}"
        name: "{{ vm_name }}"
        template: "{{ vm_template }}"
        state: poweredon
        hardware:
          num_cpus: "{{ vm_cpu }}"
          memory_mb: "{{ vm_memory_mb }}"
        disk:
          - size_gb: "{{ vm_disk_gb }}"
        annotation: "{{ vm_annotation }}"
        networks: "{{ vm_networks }}"
        wait_for_ip_address: "{{ vm_wait_for_ip | bool }}"
        customization: >-
          {{
            (
              join_method == 'vmware'
              | ternary(
                  dict(
                    hostname=win_hostname,
                    timezone=win_timezone,
                    domain=ad_domain,
                    joindomain=ad_domain,
                    domainadmin=ad_domain_user,
                    domainadminpassword=ad_domain_password,
                    domain_ou=(ad_domain_ou if (ad_domain_ou | length > 0) else omit),
                    dns_servers=(vm_networks[0].dns_servers if (vm_networks[0] is mapping and vm_networks[0].get('dns_servers')) else omit)
                  ),
                  dict(
                    hostname=win_hostname,
                    timezone=win_timezone,
                    domain=ad_domain,
                    dns_servers=(vm_networks[0].dns_servers if (vm_networks[0] is mapping and vm_networks[0].get('dns_servers')) else omit)
                  )
                )
            )
          }}
      no_log: true
      delegate_to: localhost
      register: vm_result

    - name: Extract primary IPv4 address from clone result
      ansible.builtin.set_fact:
        new_vm_ipv4: >-
          {{
            vm_result.instance.ipv4 if (vm_result.instance is defined and vm_result.instance.ipv4 is defined)
            else (vm_result.instance.guest_ip_address if (vm_result.instance is defined and vm_result.instance.guest_ip_address is defined) else omit)
          }}

    - name: Show new VM details
      ansible.builtin.debug:
        msg:
          name: "{{ vm_name }}"
          ipv4: "{{ new_vm_ipv4 | default('unknown') }}"
          more: "{{ vm_result.instance | default({}) }}"

    - name: Stop here if join handled by VMware customization
      ansible.builtin.meta: end_play
      when: join_method == 'vmware'

    # ---- Ansible-driven domain join path (requires WinRM reachable on the guest) ----
    - name: Wait for WinRM to be available on the new VM
      ansible.builtin.wait_for:
        host: "{{ new_vm_ipv4 | default(vm_name) }}"
        port: "{{ win_port }}"
        timeout: 1200

    - name: Join domain using microsoft.ad.membership (delegated to the guest)
      microsoft.ad.membership:
        dns_domain_name: "{{ ad_domain }}"
        domain_admin_user: "{{ ad_domain_user }}"
        domain_admin_password: "{{ ad_domain_password }}"
        state: domain
        domain_ou_path: "{{ ad_domain_ou | default(omit) }}"
      vars:
        ansible_connection: winrm
        ansible_port: "{{ win_port }}"
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_winrm_scheme: "{{ 'https' if win_use_https else 'http' }}"
        ansible_winrm_server_cert_validation: "{{ 'validate' if win_validate_certs else 'ignore' }}"
      delegate_to: "{{ new_vm_ipv4 | default(vm_name) }}"
      register: ad_join

    - name: Reboot after domain join (if needed)
      ansible.windows.win_reboot:
        reboot_timeout: "{{ reboot_timeout }}"
      when: reboot_after_domain_join | bool
      vars:
        ansible_connection: winrm
        ansible_port: "{{ win_port }}"
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_winrm_scheme: "{{ 'https' if win_use_https else 'http' }}"
        ansible_winrm_server_cert_validation: "{{ 'validate' if win_validate_certs else 'ignore' }}"
      delegate_to: "{{ new_vm_ipv4 | default(vm_name) }}"

    # ----------------------------- postflight -------------------

    - name: "vmware/windows_virtual_machine_provision_role | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_windows_virtual_machine_provision_role_preflight_passed | bool
          - fe_vmware_windows_virtual_machine_provision_role_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/windows_virtual_machine_provision_role: postflight validation failed - preflight passed
          ={{ fe_vmware_windows_virtual_machine_provision_role_preflight_passed | default(false) }},
          status={{ fe_vmware_windows_virtual_machine_provision_role_status | default('unknown') }}.
        success_msg: "vmware/windows_virtual_machine_provision_role: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/windows_virtual_machine_provision_role | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_windows_virtual_machine_provision_role_postflight_passed: true
        fe_vmware_windows_virtual_machine_provision_role_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/windows_virtual_machine_provision_role | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_windows_virtual_machine_provision_role_status: "failed"
        fe_vmware_windows_virtual_machine_provision_role_postflight_passed: false
        fe_vmware_windows_virtual_machine_provision_role_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_windows_virtual_machine_provision_role_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/windows_virtual_machine_provision_role | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/windows_virtual_machine_provision_role: FAILED at '{{ fe_vmware_windows_virtual_machine_provision_role_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_windows_virtual_machine_provision_role_error }}
      tags:
        - always
        - rescue

    - name: "vmware/windows_virtual_machine_provision_role | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/windows_virtual_machine_provision_role failed at '{{ fe_vmware_windows_virtual_machine_provision_role_failed_task }}': {{ fe_vmware_windows_virtual_machine_provision_role_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/windows_virtual_machine_provision_role | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_windows_virtual_machine_provision_role_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_windows_virtual_machine_provision_role_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_windows_virtual_machine_provision_role_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/windows_virtual_machine_provision_role | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/windows_virtual_machine_provision_role":
              component: "vmware/windows_virtual_machine_provision_role"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_windows_virtual_machine_provision_role_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_windows_virtual_machine_provision_role_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_windows_virtual_machine_provision_role_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_windows_virtual_machine_provision_role_started_at | default('') }}"
              ended_at: "{{ fe_vmware_windows_virtual_machine_provision_role_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_windows_virtual_machine_provision_role_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_windows_virtual_machine_provision_role_failed_task | default('') }}"
              error: "{{ fe_vmware_windows_virtual_machine_provision_role_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_windows_virtual_machine_provision_role_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_windows_virtual_machine_provision_role_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_windows_virtual_machine_provision_role_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_windows_virtual_machine_provision_role_status | default('') == 'succeeded' else ['vmware/windows_virtual_machine_provision_role'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/windows_virtual_machine_provision_role | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_windows_virtual_machine_provision_role_stats_published: true
      tags:
        - always
