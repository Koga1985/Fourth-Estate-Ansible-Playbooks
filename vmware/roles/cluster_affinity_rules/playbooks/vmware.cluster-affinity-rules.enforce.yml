            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_preflight_passed: false
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_postflight_passed: false
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_failed_task: ""
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_error: ""
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_stats_published: false
          tags:
            - always

        - name: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce: required variable '{{ item }}' is not defined."
            success_msg: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_required_vars | default([]) }}"
          loop_control:
