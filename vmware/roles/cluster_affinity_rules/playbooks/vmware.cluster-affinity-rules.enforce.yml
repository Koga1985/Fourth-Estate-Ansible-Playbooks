---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: localhost
  gather_facts: false
  roles:
    - role: cluster_affinity_rules
      vars:
        vcenter_hostname: "vcenter.example.local"
        vcenter_username: "{{ lookup('env','VCENTER_USERNAME') }}"
        vcenter_password: "{{ lookup('env','VCENTER_PASSWORD') }}"
        vcenter_validate_certs: false
        vcenter_datacenter: "DC1"
        cluster_name: "Compute-Cluster"
        vm_vm_rules:
          - name: "Keep web VMs apart"
            enabled: true
            mandatory: false
            affinity: false
            vms: ["web01","web02","web03"]
        vm_host_rules:
          - name: "DBs on DB hosts"
            enabled: true
            mandatory: true
            vm_group: "DB-VMs"
            host_group: "DB-Hosts"
            vms:  ["db01","db02"]
            hosts: ["esxi01.lab.local","esxi02.lab.local"]
        remove_undeclared_rules: false
  pre_tasks:
    - name: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vmware/cluster_affinity_rules/vmware.cluster-affinity-rules.enforce | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vmware_cluster_affinity_rules_vmware_cluster_affinity_rules_enforce_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
