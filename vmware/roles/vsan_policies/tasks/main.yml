---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vmware/vsan_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vmware_vsan_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vmware/vsan_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vmware_vsan_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vmware_vsan_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vmware_vsan_policies_status: "running"
    fe_vmware_vsan_policies_preflight_passed: false
    fe_vmware_vsan_policies_postflight_passed: false
    fe_vmware_vsan_policies_failed_task: ""
    fe_vmware_vsan_policies_error: ""
    fe_vmware_vsan_policies_stats_published: false
  tags:
    - always

- name: "vmware/vsan_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vmware/vsan_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vmware/vsan_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vmware/vsan_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsan_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vmware/vsan_policies: required variable '{{ item }}' is not defined."
        success_msg: "vmware/vsan_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vmware_vsan_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vmware/vsan_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vmware_vsan_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - vcenter_hostname | length > 0
          - vcenter_username | length > 0
          - vcenter_password | length > 0

    - name: Set defaults
      ansible.builtin.set_fact:
        vcenter_validate_certs: "{{ vcenter_validate_certs | default(false) }}"
        policies: "{{ policies | default([]) }}"
        assignments: "{{ assignments | default([]) }}"
        report_path: "{{ report_path | default('/tmp/vsan-policies-report.json') }}"
        run_compliance_checks: "{{ run_compliance_checks | default(true) }}"

    - name: Ensure policies and assign (PowerCLI)
      ansible.builtin.command:
        cmd: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference='Stop';
           Import-Module VMware.PowerCLI -ErrorAction Stop;
           Set-PowerCLIConfiguration -InvalidCertificateAction {{ vcenter_validate_certs | ternary('Ignore','Fail') }} -Confirm:$false | Out-Null;
           $null = Connect-VIServer -Server '{{ vcenter_hostname }}' -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';

           function Get-VsanCapMap {
             $caps = Get-SpbmCapability | Where-Object { $_.Id.Namespace -match 'VSAN' -or $_.Name -match 'vSAN' }
             $map = @{};
             foreach ($c in $caps) {
               $n = $c.Name
               if ($n -match 'Number of failures to tolerate') { $map.ftt = $c }
               elseif ($n -match 'Failure tolerance method')   { $map.ftm = $c }
               elseif ($n -match 'Checksum')                    { $map.checksum = $c }
               elseif ($n -match 'Number of disk stripes')      { $map.stripe = $c }
               elseif ($n -match 'Object space reservation')    { $map.osr = $c }
               elseif ($n -match 'IOPS limit')                  { $map.iops = $c }
               elseif ($n -match 'Force provisioning')          { $map.force = $c }
             }
             return $map
           }

           function Build-RuleSet($ruleSpec) {
             $map = Get-VsanCapMap
             $rules = @()
             if ($ruleSpec.ContainsKey('ftt')) { $rules += New-SpbmRule -Capability $map.ftt -Value ([int]$ruleSpec.ftt) }
             if ($ruleSpec.ContainsKey('ftm')) {
               $ftm = ($ruleSpec.ftm).ToUpper()
               $val = switch ($ftm) { 'RAID1' {'RAID-1 (Mirroring)'} 'RAID5' {'RAID-5 (Erasure Coding)'} 'RAID6' {'RAID-6 (Erasure Coding)'} default {$ruleSpec.ftm} }
               $rules += New-SpbmRule -Capability $map.ftm -Value $val
             }
             if ($ruleSpec.ContainsKey('checksum')) { $rules += New-SpbmRule -Capability $map.checksum -Value ([bool]$ruleSpec.checksum) }
             if ($ruleSpec.ContainsKey('stripe_width')) { $rules += New-SpbmRule -Capability $map.stripe -Value ([int]$ruleSpec.stripe_width) }
             if ($ruleSpec.ContainsKey('obj_space_res_pct')) { $rules += New-SpbmRule -Capability $map.osr -Value ([int]$ruleSpec.obj_space_res_pct) }
             if ($ruleSpec.ContainsKey('iops_limit')) { $rules += New-SpbmRule -Capability $map.iops -Value ([int]$ruleSpec.iops_limit) }
             if ($ruleSpec.ContainsKey('force_provisioning')) { $rules += New-SpbmRule -Capability $map.force -Value ([bool]$ruleSpec.force_provisioning) }
             if ($rules.Count -eq 0) { return $null }
             return (New-SpbmRuleSet -Name 'vSAN' -AllOfRules $rules)
           }

           $policyResults = @()
           foreach ($p in @({{ policies | to_json }})) {
             $pName = $p.name; $pDesc = $p.description; $pRules = $p.rules
             $existing = Get-SpbmStoragePolicy -Name $pName -ErrorAction SilentlyContinue
             $rs = Build-RuleSet $pRules
             if ($existing) {
               if ($rs) { Set-SpbmStoragePolicy -StoragePolicy $existing -AnyOfRuleSets $rs -Description $pDesc | Out-Null; $policyResults += [pscustomobject]@{ name=$pName; action='updated' } }
               else { $policyResults += [pscustomobject]@{ name=$pName; action='noop' } }
             } else {
               if ($rs) { New-SpbmStoragePolicy -Name $pName -AnyOfRuleSets $rs -Description $pDesc | Out-Null; $policyResults += [pscustomobject]@{ name=$pName; action='created' } }
               else { throw "No rules for policy $pName" }
             }
           }

           $assignResults = @()
           foreach ($a in @({{ assignments | to_json }})) {
             $tagName = $a.tag; $polName = $a.policy; $scope = ($a.scope); if (-not $scope) { $scope = 'vm' }
             $pol = Get-SpbmStoragePolicy -Name $polName -ErrorAction Stop
             $vms = @(); try { $vms = Get-VM -Tag $tagName } catch { $vms = @() }
             foreach ($vm in $vms) {
               if ($scope -in @('vm','both')) {
                 try { Set-SpbmEntityConfiguration -VM $vm -StoragePolicy $pol -ErrorAction Stop | Out-Null; $assignResults += [pscustomobject]@{ vm=$vm.Name; scope='vm'; policy=$polName; status='ok' } }
                 catch { $assignResults += [pscustomobject]@{ vm=$vm.Name; scope='vm'; policy=$polName; status=('err: '+$_.Exception.Message) } }
               }
               if ($scope -in @('vmdk','both')) {
                 $disks = Get-HardDisk -VM $vm | Where-Object { $_.Persistence -ne $null }
                 foreach ($d in $disks) {
                   try { Set-SpbmEntityConfiguration -HardDisk $d -StoragePolicy $pol -ErrorAction Stop | Out-Null; $assignResults += [pscustomobject]@{ vm=$vm.Name; vmdk=$d.Name; scope='vmdk'; policy=$polName; status='ok' } }
                   catch { $assignResults += [pscustomobject]@{ vm=$vm.Name; vmdk=$d.Name; scope='vmdk'; policy=$polName; status=('err: '+$_.Exception.Message) } }
                 }
               }
             }
           }

           $compliance = @()
           if ({{ run_compliance_checks | ternary('$true','$false') }}) {
             $allTargets = @()
             foreach ($a in @({{ assignments | to_json }})) {
               try { $allTargets += (Get-VM -Tag $a.tag) } catch { }
             }
             $allTargets = $allTargets | Sort-Object -Unique
             foreach ($vm in $allTargets) {
               $vmCfg = Get-SpbmEntityConfiguration -VM $vm -ErrorAction SilentlyContinue
               $vmStatus = if ($vmCfg) { $vmCfg.ComplianceStatus } else { 'Unknown' }
               $disks = Get-HardDisk -VM $vm
               $diskStatuses = @()
               foreach ($d in $disks) {
                 $dcfg = Get-SpbmEntityConfiguration -HardDisk $d -ErrorAction SilentlyContinue
                 $diskStatuses += [pscustomobject]@{ name=$d.Name; status=(if ($dcfg) { $dcfg.ComplianceStatus } else { 'Unknown' }) }
               }
               $compliance += [pscustomobject]@{ vm=$vm.Name; vm_status=$vmStatus; disks=$diskStatuses }
             }
           }

           $out = [pscustomobject]@{ vcenter='{{ vcenter_hostname }}'; policies=$policyResults; assignments=$assignResults; compliance=$compliance; timestamp=(Get-Date).ToString('s') }
           $json = $out | ConvertTo-Json -Depth 8
           Set-Content -Path '{{ report_path }}' -Value $json -Encoding UTF8
           $json"
      args:
        stdin: ""
      register: vsan_policies_cmd
      changed_when: true
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "vmware/vsan_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vmware_vsan_policies_preflight_passed | bool
          - fe_vmware_vsan_policies_status in ['running', 'succeeded']
        fail_msg: >-
          vmware/vsan_policies: postflight validation failed - preflight passed
          ={{ fe_vmware_vsan_policies_preflight_passed | default(false) }},
          status={{ fe_vmware_vsan_policies_status | default('unknown') }}.
        success_msg: "vmware/vsan_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vmware/vsan_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vmware_vsan_policies_postflight_passed: true
        fe_vmware_vsan_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vmware/vsan_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vmware_vsan_policies_status: "failed"
        fe_vmware_vsan_policies_postflight_passed: false
        fe_vmware_vsan_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vmware_vsan_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vmware/vsan_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vmware/vsan_policies: FAILED at '{{ fe_vmware_vsan_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vmware_vsan_policies_error }}
      tags:
        - always
        - rescue

    - name: "vmware/vsan_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vmware/vsan_policies failed at '{{ fe_vmware_vsan_policies_failed_task }}': {{ fe_vmware_vsan_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vmware/vsan_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vmware_vsan_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vmware_vsan_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vmware_vsan_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vmware/vsan_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vmware/vsan_policies":
              component: "vmware/vsan_policies"
              type: "role"
              platform: "vmware"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vmware_vsan_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_vmware_vsan_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vmware_vsan_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vmware_vsan_policies_started_at | default('') }}"
              ended_at: "{{ fe_vmware_vsan_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_vmware_vsan_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vmware_vsan_policies_failed_task | default('') }}"
              error: "{{ fe_vmware_vsan_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vmware_vsan_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vmware_vsan_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vmware_vsan_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vmware_vsan_policies_status | default('') == 'succeeded' else ['vmware/vsan_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vmware/vsan_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vmware_vsan_policies_stats_published: true
      tags:
        - always
