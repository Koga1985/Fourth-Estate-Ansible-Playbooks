---
# Cisco Platform Deployment Playbook
# Entry point for Cisco ACI, ISE, and UCS automation
#
# Platforms:
#   - Cisco ACI     (5 roles  — Phases  1–5)
#   - Cisco ISE     (28 roles — Phases  1–9)
#   - Cisco UCS     (5 roles  — Phases 10–14)
#   - Cisco SD-WAN  (6 roles  — Phases 15–20)
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   pip install acicobra acimodel ciscoisesdk ucsmsdk intersight requests
#   ansible-playbook -i inventory site.yml --ask-vault-pass
#
# Selective execution (tags):
#   - aci        : Cisco ACI only
#   - ise        : Cisco ISE only
#   - ucs        : Cisco UCS only
#   - sdwan      : Cisco SD-WAN only
#   - policy     : Policy configuration
#   - security   : Security hardening (all platforms)
#   - stig       : DISA STIG controls only
#   - monitoring : Monitoring configuration
#   - reporting  : Reporting and audit tasks
#
# Dry-run (check mode):
#   ansible-playbook -i inventory site.yml --check --diff --ask-vault-pass
#
# Last Updated: 2026-04-08
# Maintained By: Fourth Estate Infrastructure Team

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cisco ACI Configuration
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    # ACI Deployment control
    deploy_aci_fabric: true
    deploy_aci_tenant: true
    deploy_aci_network: true
    deploy_aci_security: true
    deploy_aci_monitoring: true

  tasks:
    # =========================================
    # Phase 1: ACI Fabric Deployment
    # =========================================
    - name: "cisco/site#play1 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - ACI Fabric Deploy
          ansible.builtin.include_role:
            name: aci_fabric_deploy
          when: deploy_aci_fabric | bool
          tags: ['aci', 'fabric', 'phase1']

        # =========================================
        # Phase 2: ACI Tenant Configuration
        # =========================================
        - name: Phase 2 - ACI Tenant Config
          ansible.builtin.include_role:
            name: aci_tenant_config
          when: deploy_aci_tenant | bool
          tags: ['aci', 'tenant', 'phase2']

        # =========================================
        # Phase 3: ACI Network Configuration
        # =========================================
        - name: Phase 3 - ACI Network Config
          ansible.builtin.include_role:
            name: aci_network_config
          when: deploy_aci_network | bool
          tags: ['aci', 'networking', 'phase3']

        # =========================================
        # Phase 4: ACI Security Hardening
        # =========================================
        - name: Phase 4 - ACI Security Hardening
          ansible.builtin.include_role:
            name: aci_security_hardening
          when: deploy_aci_security | bool
          tags: ['aci', 'security', 'phase4']

        # =========================================
        # Phase 5: ACI Monitoring
        # =========================================
        - name: Phase 5 - ACI Monitoring
          ansible.builtin.include_role:
            name: aci_monitoring
          when: deploy_aci_monitoring | bool
          tags: ['aci', 'monitoring', 'phase5']

        - name: "cisco/site#play1 | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_status: "failed"
            fe_cisco_site_play1_postflight_passed: false
            fe_cisco_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/site#play1: FAILED at '{{ fe_cisco_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/site#play1 failed at '{{ fe_cisco_site_play1_failed_task }}': {{ fe_cisco_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/site#play1":
                  component: "cisco/site#play1"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_site_play1_failed_task | default('') }}"
                  error: "{{ fe_cisco_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_site_play1_status | default('') == 'succeeded' else ['cisco/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_site_play1_status | default('') == 'failed'
            - not (fe_cisco_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_stats_published: true
          when:
            - fe_cisco_site_play1_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "cisco/site#play1 | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/site#play1 | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_site_play1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_site_play1_status: "running"
            fe_cisco_site_play1_preflight_passed: false
            fe_cisco_site_play1_postflight_passed: false
            fe_cisco_site_play1_failed_task: ""
            fe_cisco_site_play1_error: ""
            fe_cisco_site_play1_stats_published: false
          tags:
            - always

        - name: "cisco/site#play1 | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/site#play1: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/site#play1: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/site#play1 | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/site#play1: required variable '{{ item }}' is not defined."
            success_msg: "cisco/site#play1: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_site_play1_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/site#play1 | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_status: "preflight_failed"
            fe_cisco_site_play1_postflight_passed: false
            fe_cisco_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/site#play1: FAILED at '{{ fe_cisco_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/site#play1":
                  component: "cisco/site#play1"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_site_play1_failed_task | default('') }}"
                  error: "{{ fe_cisco_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_site_play1_status | default('') == 'succeeded' else ['cisco/site#play1'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_stats_published: true
          tags:
            - always

        - name: "cisco/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/site#play1 failed at '{{ fe_cisco_site_play1_failed_task }}': {{ fe_cisco_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/site#play1 | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/site#play1: preflight
              {{ 'passed' if fe_cisco_site_play1_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "cisco/site#play1 | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/site#play1 | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_site_play1_preflight_passed | bool
              - fe_cisco_site_play1_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/site#play1: postflight validation failed - preflight passed
              ={{ fe_cisco_site_play1_preflight_passed | default(false) }},
              status={{ fe_cisco_site_play1_status | default('unknown') }}.
            success_msg: "cisco/site#play1: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/site#play1 | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_postflight_passed: true
            fe_cisco_site_play1_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_status: "failed"
            fe_cisco_site_play1_postflight_passed: false
            fe_cisco_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/site#play1: FAILED at '{{ fe_cisco_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "cisco/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/site#play1 failed at '{{ fe_cisco_site_play1_failed_task }}': {{ fe_cisco_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/site#play1":
                  component: "cisco/site#play1"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_site_play1_failed_task | default('') }}"
                  error: "{{ fe_cisco_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_site_play1_status | default('') == 'succeeded' else ['cisco/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_site_play1_stats_published: true
          tags:
            - always

        - name: "cisco/site#play1 | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/site#play1: {{ fe_cisco_site_play1_status | default('unknown') }} in
              {{ fe_cisco_site_play1_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always


- name: Cisco ISE Configuration
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    # ISE Deployment control
    deploy_ise_policy: true
    deploy_ise_profiling: true
    deploy_ise_posture: true
    deploy_ise_guest: true
    deploy_ise_pxgrid: true
    deploy_ise_byod: false
    deploy_ise_integrations: true
    deploy_ise_reporting: true

  tasks:
    # =========================================
    # Phase 1: ISE Policy Configuration
    # =========================================
    - name: "cisco/site#play2 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Policy Sets Scaffold
          ansible.builtin.include_role:
            name: ise_policy__policy_sets_scaffold
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        - name: Phase 1 - Conditions Library
          ansible.builtin.include_role:
            name: ise_policy__conditions_library
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        - name: Phase 1 - Authorization Profiles
          ansible.builtin.include_role:
            name: ise_policy__authz_profiles
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        - name: Phase 1 - RADIUS DACLs
          ansible.builtin.include_role:
            name: ise_policy__radius_dacls
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        - name: Phase 1 - Shell Profiles & Command Sets
          ansible.builtin.include_role:
            name: ise_policy__shell_profiles_cmdsets
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        - name: Phase 1 - Apply Policy Rules
          ansible.builtin.include_role:
            name: ise_policy__apply_rules
          when: deploy_ise_policy | bool
          tags: ['ise', 'policy', 'phase1']

        # =========================================
        # Phase 2: ISE Profiling
        # =========================================
        - name: Phase 2 - Profiler Probes
          ansible.builtin.include_role:
            name: ise_profiling__probes
          when: deploy_ise_profiling | bool
          tags: ['ise', 'profiling', 'phase2']

        - name: Phase 2 - Profiling Policies
          ansible.builtin.include_role:
            name: ise_profiling__policies
          when: deploy_ise_profiling | bool
          tags: ['ise', 'profiling', 'phase2']

        # =========================================
        # Phase 3: ISE Endpoints
        # =========================================
        - name: Phase 3 - Endpoint Registration (Bulk)
          ansible.builtin.include_role:
            name: ise_endpoints__register_bulk
          tags: ['ise', 'endpoints', 'phase3']

        - name: Phase 3 - Endpoint Group Membership
          ansible.builtin.include_role:
            name: ise_endpoints__group_membership
          tags: ['ise', 'endpoints', 'phase3']

        # =========================================
        # Phase 4: ISE Posture
        # =========================================
        - name: Phase 4 - Posture Conditions & Rules
          ansible.builtin.include_role:
            name: ise_posture__conditions_rules
          when: deploy_ise_posture | bool
          tags: ['ise', 'posture', 'phase4']

        - name: Phase 4 - Client Provisioning
          ansible.builtin.include_role:
            name: ise_posture__client_provisioning
          when: deploy_ise_posture | bool
          tags: ['ise', 'posture', 'phase4']

        - name: Phase 4 - Posture Updates Channel
          ansible.builtin.include_role:
            name: ise_posture__updates_channel
          when: deploy_ise_posture | bool
          tags: ['ise', 'posture', 'phase4']

        # =========================================
        # Phase 5: ISE Guest & BYOD
        # =========================================
        - name: Phase 5 - Guest Portal
          ansible.builtin.include_role:
            name: ise_guest__guest_portal
          when: deploy_ise_guest | bool
          tags: ['ise', 'guest', 'phase5']

        - name: Phase 5 - Sponsor Portal
          ansible.builtin.include_role:
            name: ise_guest__sponsor_portal
          when: deploy_ise_guest | bool
          tags: ['ise', 'guest', 'phase5']

        - name: Phase 5 - Guest Accounts (Bulk)
          ansible.builtin.include_role:
            name: ise_guest__accounts_bulk
          when: deploy_ise_guest | bool
          tags: ['ise', 'guest', 'phase5']

        - name: Phase 5 - BYOD Workflow
          ansible.builtin.include_role:
            name: ise_byod__workflow
          when: deploy_ise_byod | bool
          tags: ['ise', 'byod', 'phase5']

        # =========================================
        # Phase 6: ISE pxGrid & Integrations
        # =========================================
        - name: Phase 6 - pxGrid Enable Clients
          ansible.builtin.include_role:
            name: ise_pxgrid__enable_clients
          when: deploy_ise_pxgrid | bool
          tags: ['ise', 'pxgrid', 'phase6']

        - name: Phase 6 - MSE/DNAC Integration
          ansible.builtin.include_role:
            name: ise_integration__mse_dnac
          when: deploy_ise_integrations | bool
          tags: ['ise', 'integrations', 'phase6']

        - name: Phase 6 - Logging Integration
          ansible.builtin.include_role:
            name: ise_integration__logging
          when: deploy_ise_integrations | bool
          tags: ['ise', 'integrations', 'phase6']

        # =========================================
        # Phase 7: ISE Security
        # =========================================
        - name: Phase 7 - ANC Quarantine Rules
          ansible.builtin.include_role:
            name: ise_anc__quarantine_rules
          tags: ['ise', 'security', 'phase7']

        # =========================================
        # Phase 8: ISE Operations
        # =========================================
        - name: Phase 8 - Policy Hitcount Shadow Report
          ansible.builtin.include_role:
            name: ise_policy__hitcount_shadow_report
          when: deploy_ise_reporting | bool
          tags: ['ise', 'operations', 'phase8']

        - name: Phase 8 - Stale Objects Prune
          ansible.builtin.include_role:
            name: ise_hygiene__stale_objects_prune
          tags: ['ise', 'operations', 'phase8']

        - name: Phase 8 - Audit Config Changes
          ansible.builtin.include_role:
            name: ise_audit__config_changes
          tags: ['ise', 'audit', 'phase8']

        # =========================================
        # Phase 9: ISE Reporting
        # =========================================
        - name: Phase 9 - Auth Failures Report
          ansible.builtin.include_role:
            name: ise_report__auth_failures
          when: deploy_ise_reporting | bool
          tags: ['ise', 'reporting', 'phase9']

        - name: Phase 9 - Endpoint Catalog Report
          ansible.builtin.include_role:
            name: ise_report__endpoint_catalog
