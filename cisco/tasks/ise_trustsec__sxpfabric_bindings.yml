
---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ise_trustsec__sxpfabric_bindings — SXP peers & bindings
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - cisco.ise
    - community.general
  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ise-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    sxp_peers: []
    bindings: []
  tasks:
    - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Guarded execution with rescue and always handling"
      block:

        - name: Plan
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/sxp_plan.json"
            mode: "0644"
            content: "{{ {'peers': sxp_peers, 'bindings': bindings} | to_nice_json }}"
        - name: Ensure SXP peers
          when: apply_changes | bool
          loop: "{{ sxp_peers }}"
          loop_control:
            label: "{{ item.ip }} ({{ item.mode }})"
          cisco.ise.sxp_local_connections:
            state: present
            data:
              sXPDevice: "{{ item.ip }}"
              mode: "{{ item.mode }}"
              defaultPassword: "{{ item.password }}"
              description: "Managed by Ansible"
              retryCount: "{{ item.retry | default(60) }}"
        - name: Ensure SXP bindings
          when: apply_changes | bool
          loop: "{{ bindings }}"
          loop_control:
            label: "{{ item.ip }}→{{ item.sgt }}"
          cisco.ise.sgt_ip_sgt_mapping:
            state: present
            data:
              sgtName: "{{ item.sgt }}"
              ip: "{{ item.ip }}"

      rescue:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status: "failed"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed: false
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: FAILED at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings failed at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}': {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_trustsec__sxpfabric_bindings":
                  component: "cisco/tasks/ise_trustsec__sxpfabric_bindings"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else ['cisco/tasks/ise_trustsec__sxpfabric_bindings'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'failed'
            - not (fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published: true
          when:
            - fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status: "running"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed: false
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed: false
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task: ""
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error: ""
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published: false
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/tasks/ise_trustsec__sxpfabric_bindings: required variable '{{ item }}' is not defined."
            success_msg: "cisco/tasks/ise_trustsec__sxpfabric_bindings: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status: "preflight_failed"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed: false
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: FAILED at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_trustsec__sxpfabric_bindings":
                  component: "cisco/tasks/ise_trustsec__sxpfabric_bindings"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else ['cisco/tasks/ise_trustsec__sxpfabric_bindings'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published: true
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings failed at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}': {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: preflight
              {{ 'passed' if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | bool
              - fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: postflight validation failed - preflight passed
              ={{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | default(false) }},
              status={{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('unknown') }}.
            success_msg: "cisco/tasks/ise_trustsec__sxpfabric_bindings: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed: true
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status: "failed"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed: false
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: FAILED at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings failed at '{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task }}': {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_trustsec__sxpfabric_bindings":
                  component: "cisco/tasks/ise_trustsec__sxpfabric_bindings"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('') == 'succeeded' else ['cisco/tasks/ise_trustsec__sxpfabric_bindings'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_stats_published: true
          tags:
            - always

        - name: "cisco/tasks/ise_trustsec__sxpfabric_bindings | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_trustsec__sxpfabric_bindings: {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_status | default('unknown') }} in
              {{ fe_cisco_tasks_ise_trustsec__sxpfabric_bindings_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
