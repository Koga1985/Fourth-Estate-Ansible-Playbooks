---
# Cisco UCS Fourth Estate Production Deployment Task
# Quick deployment task file for inclusion in larger playbooks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_fourth_estate_deploy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_fourth_estate_deploy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_fourth_estate_deploy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_fourth_estate_deploy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_fourth_estate_deploy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_fourth_estate_deploy_status: "running"
    fe_cisco_ucs_fourth_estate_deploy_preflight_passed: false
    fe_cisco_ucs_fourth_estate_deploy_postflight_passed: false
    fe_cisco_ucs_fourth_estate_deploy_failed_task: ""
    fe_cisco_ucs_fourth_estate_deploy_error: ""
    fe_cisco_ucs_fourth_estate_deploy_stats_published: false
  tags:
    - always

- name: "cisco/ucs_fourth_estate_deploy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_fourth_estate_deploy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_fourth_estate_deploy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_fourth_estate_deploy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_fourth_estate_deploy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_fourth_estate_deploy: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_fourth_estate_deploy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_fourth_estate_deploy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_fourth_estate_deploy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_fourth_estate_deploy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Deploy Cisco UCS for Fourth Estate
      block:
        - name: Validate UCS connection parameters
          ansible.builtin.assert:
            that:
              - ucs_hostname is defined
              - ucs_username is defined
              - ucs_password is defined
            fail_msg: "UCS connection parameters must be defined"

        - name: Run UCS Fourth Estate production deployment
          ansible.builtin.import_playbook: ../playbooks/ucs_fourth_estate_production.yml
          vars:
            apply_changes: "{{ ucs_apply_changes | default(false) }}"

      tags:
        - cisco
        - ucs
        - fourth_estate

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_fourth_estate_deploy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_fourth_estate_deploy_preflight_passed | bool
          - fe_cisco_ucs_fourth_estate_deploy_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_fourth_estate_deploy: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_fourth_estate_deploy_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_fourth_estate_deploy_status | default('unknown') }}.
        success_msg: "cisco/ucs_fourth_estate_deploy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_fourth_estate_deploy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_fourth_estate_deploy_postflight_passed: true
        fe_cisco_ucs_fourth_estate_deploy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_fourth_estate_deploy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_fourth_estate_deploy_status: "failed"
        fe_cisco_ucs_fourth_estate_deploy_postflight_passed: false
        fe_cisco_ucs_fourth_estate_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_fourth_estate_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_fourth_estate_deploy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_fourth_estate_deploy: FAILED at '{{ fe_cisco_ucs_fourth_estate_deploy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_fourth_estate_deploy_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_fourth_estate_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_fourth_estate_deploy failed at '{{ fe_cisco_ucs_fourth_estate_deploy_failed_task }}': {{ fe_cisco_ucs_fourth_estate_deploy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_fourth_estate_deploy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_fourth_estate_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_fourth_estate_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_fourth_estate_deploy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_fourth_estate_deploy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_fourth_estate_deploy":
              component: "cisco/ucs_fourth_estate_deploy"
              type: "tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_fourth_estate_deploy_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_fourth_estate_deploy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_fourth_estate_deploy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_fourth_estate_deploy_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_fourth_estate_deploy_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_fourth_estate_deploy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_fourth_estate_deploy_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_fourth_estate_deploy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_fourth_estate_deploy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_fourth_estate_deploy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_fourth_estate_deploy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_fourth_estate_deploy_status | default('') == 'succeeded' else ['cisco/ucs_fourth_estate_deploy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_fourth_estate_deploy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_fourth_estate_deploy_stats_published: true
      tags:
        - always
