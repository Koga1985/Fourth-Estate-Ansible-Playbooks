
---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: ise_admin__certificates_rotate — system certs & trust bundles
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - cisco.ise
    - community.general
  vars:
    artifacts_dir: "{{ artifacts_dir | default('/tmp/ise-artifacts') }}"
    apply_changes: "{{ apply_changes | default(false) }}"

    trust_bundles: []
    system_certs:
      - purpose: "Admin"
        pem_file: ""
        key_file: ""
        key_pass: ""
      - purpose: "EAP"
        pem_file: ""
        key_file: ""
        key_pass: ""
      - purpose: "pxGrid"
        pem_file: ""
        key_file: ""
        key_pass: ""
  tasks:
    - name: "cisco/tasks/ise_admin__certificates_rotate | Guarded execution with rescue and always handling"
      block:

        - name: Emit plan
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/certs_rotate_plan.json"
            mode: "0644"
            content: "{{ {'trust_bundles': trust_bundles | length, 'system_certs': system_certs} | to_nice_json }}"

        - name: Import trust bundles (placeholder per ISE version)
          when: apply_changes | bool
          loop: "{{ trust_bundles }}"
          loop_control:
            label: "bundle-{{ loop.index }}"
          ansible.builtin.debug:
            msg: "Import CA bundle {{ item }} via appropriate ISE trust store API."

        - name: Cert expiry report (local openssl parse)
          ansible.builtin.shell: |
            set -euo pipefail
            for p in $(printf "%s\n" "{{ system_certs | map(attribute='pem_file') | list | join(' ') }}"); do
              [ -f "$p" ] || continue
              end="$(openssl x509 -enddate -noout -in "$p" | cut -d= -f2-)"
              printf "%s,%s\n" "$p" "$end"
            done | tee "{{ artifacts_dir }}/certs_expiry_report.csv"
          args:
            executable: /bin/bash
          changed_when: false

      rescue:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_status: "failed"
            fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed: false
            fe_cisco_tasks_ise_admin__certificates_rotate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate: FAILED at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate failed at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}': {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_tasks_ise_admin__certificates_rotate_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_admin__certificates_rotate":
                  component: "cisco/tasks/ise_admin__certificates_rotate"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else ['cisco/tasks/ise_admin__certificates_rotate'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'failed'
            - not (fe_cisco_tasks_ise_admin__certificates_rotate_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_stats_published: true
          when:
            - fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "cisco/tasks/ise_admin__certificates_rotate | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_status: "running"
            fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed: false
            fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed: false
            fe_cisco_tasks_ise_admin__certificates_rotate_failed_task: ""
            fe_cisco_tasks_ise_admin__certificates_rotate_error: ""
            fe_cisco_tasks_ise_admin__certificates_rotate_stats_published: false
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/tasks/ise_admin__certificates_rotate: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/tasks/ise_admin__certificates_rotate: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/tasks/ise_admin__certificates_rotate | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/tasks/ise_admin__certificates_rotate: required variable '{{ item }}' is not defined."
            success_msg: "cisco/tasks/ise_admin__certificates_rotate: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/tasks/ise_admin__certificates_rotate | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_status: "preflight_failed"
            fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed: false
            fe_cisco_tasks_ise_admin__certificates_rotate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate: FAILED at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_admin__certificates_rotate":
                  component: "cisco/tasks/ise_admin__certificates_rotate"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else ['cisco/tasks/ise_admin__certificates_rotate'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_stats_published: true
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate failed at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}': {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate: preflight
              {{ 'passed' if fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "cisco/tasks/ise_admin__certificates_rotate | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | bool
              - fe_cisco_tasks_ise_admin__certificates_rotate_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/tasks/ise_admin__certificates_rotate: postflight validation failed - preflight passed
              ={{ fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | default(false) }},
              status={{ fe_cisco_tasks_ise_admin__certificates_rotate_status | default('unknown') }}.
            success_msg: "cisco/tasks/ise_admin__certificates_rotate: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/tasks/ise_admin__certificates_rotate | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed: true
            fe_cisco_tasks_ise_admin__certificates_rotate_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_status: "failed"
            fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed: false
            fe_cisco_tasks_ise_admin__certificates_rotate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate: FAILED at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          tags:
            - always
            - rescue

        - name: "cisco/tasks/ise_admin__certificates_rotate | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate failed at '{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task }}': {{ fe_cisco_tasks_ise_admin__certificates_rotate_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_tasks_ise_admin__certificates_rotate_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/tasks/ise_admin__certificates_rotate":
                  component: "cisco/tasks/ise_admin__certificates_rotate"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_failed_task | default('') }}"
                  error: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_tasks_ise_admin__certificates_rotate_status | default('') == 'succeeded' else ['cisco/tasks/ise_admin__certificates_rotate'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_tasks_ise_admin__certificates_rotate_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_tasks_ise_admin__certificates_rotate_stats_published: true
          tags:
            - always

        - name: "cisco/tasks/ise_admin__certificates_rotate | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/tasks/ise_admin__certificates_rotate: {{ fe_cisco_tasks_ise_admin__certificates_rotate_status | default('unknown') }} in
              {{ fe_cisco_tasks_ise_admin__certificates_rotate_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
