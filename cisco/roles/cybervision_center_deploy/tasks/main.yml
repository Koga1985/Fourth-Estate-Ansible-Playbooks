---
# tasks file for cybervision_center_deploy
# Cisco Cyber Vision Center - initial deployment and base configuration

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_center_deploy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_center_deploy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_center_deploy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_center_deploy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_center_deploy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_center_deploy_status: "running"
    fe_cisco_cybervision_center_deploy_preflight_passed: false
    fe_cisco_cybervision_center_deploy_postflight_passed: false
    fe_cisco_cybervision_center_deploy_failed_task: ""
    fe_cisco_cybervision_center_deploy_error: ""
    fe_cisco_cybervision_center_deploy_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_center_deploy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_center_deploy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_center_deploy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_center_deploy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_center_deploy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_center_deploy: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_center_deploy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_center_deploy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_center_deploy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Run prerequisites and validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
            - validation
      tags:
        - always
        - prerequisites
        - validation

    # ============================================================
    # Initial System Setup
    # Center name, timezone, language
    # ============================================================
    - name: PHASE 1 - Initial system setup
      ansible.builtin.include_tasks:
        file: initial_setup.yml
        apply:
          tags:
            - cybervision
            - center
            - setup
            - phase1
      when: enable_initial_setup | bool
      tags:
        - cybervision
        - center
        - setup
        - phase1

    # ============================================================
    # Network Configuration
    # DNS, NTP, management interface
    # ============================================================
    - name: PHASE 1 - Network configuration (DNS, NTP)
      ansible.builtin.include_tasks:
        file: network_config.yml
        apply:
          tags:
            - cybervision
            - center
            - network
            - dns
            - ntp
            - phase1
      when: enable_network_config | bool
      tags:
        - cybervision
        - center
        - network
        - dns
        - ntp
        - phase1

    # ============================================================
    # License Activation
    # ============================================================
    - name: PHASE 1 - License activation
      ansible.builtin.include_tasks:
        file: license_activation.yml
        apply:
          tags:
            - cybervision
            - center
            - license
            - phase1
      when: enable_license_activation | bool
      tags:
        - cybervision
        - center
        - license
        - phase1

    # ============================================================
    # Local User Management
    # Admin and break-glass accounts only — operational users via LDAP
    # ============================================================
    - name: PHASE 1 - Local user management
      ansible.builtin.include_tasks:
        file: user_management.yml
        apply:
          tags:
            - cybervision
            - center
            - users
            - phase1
      when: enable_user_management | bool
      tags:
        - cybervision
        - center
        - users
        - phase1

    # ============================================================
    # Post-Deployment Validation
    # ============================================================
    - name: PHASE 1 - Post-deployment validation
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - cybervision
            - center
            - validation
            - phase1
      tags:
        - cybervision
        - center
        - validation
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_center_deploy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_center_deploy_preflight_passed | bool
          - fe_cisco_cybervision_center_deploy_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_center_deploy: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_center_deploy_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_center_deploy_status | default('unknown') }}.
        success_msg: "cisco/cybervision_center_deploy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_center_deploy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_postflight_passed: true
        fe_cisco_cybervision_center_deploy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_center_deploy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_status: "failed"
        fe_cisco_cybervision_center_deploy_postflight_passed: false
        fe_cisco_cybervision_center_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_center_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_center_deploy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_center_deploy: FAILED at '{{ fe_cisco_cybervision_center_deploy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_center_deploy_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_center_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_center_deploy failed at '{{ fe_cisco_cybervision_center_deploy_failed_task }}': {{ fe_cisco_cybervision_center_deploy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_center_deploy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_center_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_center_deploy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_center_deploy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_center_deploy":
              component: "cisco/cybervision_center_deploy"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_center_deploy_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_center_deploy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_center_deploy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_center_deploy_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_center_deploy_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_center_deploy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_center_deploy_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_center_deploy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_center_deploy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_center_deploy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_center_deploy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_center_deploy_status | default('') == 'succeeded' else ['cisco/cybervision_center_deploy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_center_deploy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_stats_published: true
      tags:
        - always
