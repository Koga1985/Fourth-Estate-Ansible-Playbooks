---
# tasks file for cybervision_center_deploy - License activation
# Applies Cyber Vision Center license key

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_center_deploy/license_activation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_center_deploy_license_activation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_center_deploy/license_activation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_center_deploy_license_activation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_center_deploy_license_activation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_center_deploy_license_activation_status: "running"
    fe_cisco_cybervision_center_deploy_license_activation_preflight_passed: false
    fe_cisco_cybervision_center_deploy_license_activation_postflight_passed: false
    fe_cisco_cybervision_center_deploy_license_activation_failed_task: ""
    fe_cisco_cybervision_center_deploy_license_activation_error: ""
    fe_cisco_cybervision_center_deploy_license_activation_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_center_deploy/license_activation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_center_deploy/license_activation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_center_deploy/license_activation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_center_deploy/license_activation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_center_deploy/license_activation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_center_deploy/license_activation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_center_deploy/license_activation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_center_deploy_license_activation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_center_deploy/license_activation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_license_activation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Query current license status
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/license"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_license_status
      failed_when: false

    - name: PHASE 1 - Display current license status
      ansible.builtin.debug:
        msg:
          - "License status:   {{ cv_license_status.json.status | default('unknown') }}"
          - "License type:     {{ cv_license_status.json.type | default('none') }}"
          - "Expiry:           {{ cv_license_status.json.expiry | default('N/A') }}"
          - "Max sensors:      {{ cv_license_status.json.max_sensors | default('N/A') }}"
      when: cv_license_status.status == 200

    - name: PHASE 1 - Activate license
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/license"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          license_key: "{{ cv_license_key }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 204]
      register: cv_license_result
      when:
        - apply_changes | bool
        - cv_license_status.json.status | default('none') != 'active'
      no_log: true    # License key is sensitive
      notify:
        - notify center deploy complete

    - name: PHASE 1 - Display license activation result
      ansible.builtin.debug:
        msg: "License activation: {{ 'succeeded' if cv_license_result.status in [200, 201, 204] else 'failed' }}"
      when: cv_license_result is not skipped

    - name: PHASE 1 - Display license plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would activate license type: {{ cv_license_type }}"
          - "Current status: {{ cv_license_status.json.status | default('unknown') }}"
      when: not apply_changes | bool

    - name: Save license artifact
      ansible.builtin.copy:
        content: "{{ license_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_license.json"
        mode: '0640'
      vars:
        license_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          license_type: "{{ cv_license_type }}"
          status_before: "{{ cv_license_status.json.status | default('unknown') }}"
          expiry_before: "{{ cv_license_status.json.expiry | default('N/A') }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_center_deploy/license_activation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_center_deploy_license_activation_preflight_passed | bool
          - fe_cisco_cybervision_center_deploy_license_activation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_center_deploy/license_activation: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_center_deploy_license_activation_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_center_deploy_license_activation_status | default('unknown') }}.
        success_msg: "cisco/cybervision_center_deploy/license_activation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_center_deploy/license_activation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_license_activation_postflight_passed: true
        fe_cisco_cybervision_center_deploy_license_activation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_center_deploy/license_activation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_license_activation_status: "failed"
        fe_cisco_cybervision_center_deploy_license_activation_postflight_passed: false
        fe_cisco_cybervision_center_deploy_license_activation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_center_deploy_license_activation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_center_deploy/license_activation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_center_deploy/license_activation: FAILED at '{{ fe_cisco_cybervision_center_deploy_license_activation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_center_deploy_license_activation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_center_deploy/license_activation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_center_deploy/license_activation failed at '{{ fe_cisco_cybervision_center_deploy_license_activation_failed_task }}': {{ fe_cisco_cybervision_center_deploy_license_activation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_center_deploy/license_activation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_license_activation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_center_deploy_license_activation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_center_deploy_license_activation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_center_deploy/license_activation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_center_deploy/license_activation":
              component: "cisco/cybervision_center_deploy/license_activation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_center_deploy_license_activation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_center_deploy_license_activation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_center_deploy_license_activation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_center_deploy_license_activation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_center_deploy_license_activation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_center_deploy_license_activation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_center_deploy_license_activation_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_center_deploy_license_activation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_center_deploy_license_activation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_center_deploy_license_activation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_center_deploy_license_activation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_center_deploy_license_activation_status | default('') == 'succeeded' else ['cisco/cybervision_center_deploy/license_activation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_center_deploy/license_activation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_center_deploy_license_activation_stats_published: true
      tags:
        - always
