---
# Apply data-driven ISE STIG operations via the ISE OpenAPI.
# Runs only when apply_changes=true. Each operation defines its own
# method/path/body so it stays correct across ISE versions.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ise_stig/apply_operations']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ise_stig_apply_operations_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ise_stig/apply_operations | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ise_stig_apply_operations_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ise_stig_apply_operations_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ise_stig_apply_operations_status: "running"
    fe_cisco_cisco_ise_stig_apply_operations_preflight_passed: false
    fe_cisco_cisco_ise_stig_apply_operations_postflight_passed: false
    fe_cisco_cisco_ise_stig_apply_operations_failed_task: ""
    fe_cisco_cisco_ise_stig_apply_operations_error: ""
    fe_cisco_cisco_ise_stig_apply_operations_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ise_stig/apply_operations | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ise_stig/apply_operations | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ise_stig/apply_operations: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ise_stig/apply_operations: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ise_stig/apply_operations | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ise_stig/apply_operations: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ise_stig/apply_operations: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ise_stig_apply_operations_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ise_stig/apply_operations | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_apply_operations_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Apply ISE STIG enforcement operation
      ansible.builtin.uri:
        url: "https://{{ ise_host }}/api/{{ item.path }}"
        method: "{{ item.method | default('PUT') }}"
        user: "{{ ise_username }}"
        password: "{{ ise_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
          Content-Type: application/json
        body_format: json
        body: "{{ item.body | default(omit) }}"
        validate_certs: "{{ ise_validate_certs }}"
        status_code: "{{ item.status_code | default([200, 201, 202, 204]) }}"
        timeout: 60
      no_log: true
      loop: "{{ ise_stig_operations }}"
      loop_control:
        label: "{{ item.id }} - {{ item.title }}"
      register: ise_apply_results
      tags: [apply]

    - name: Summarize applied operations
      ansible.builtin.debug:
        msg: >-
          Applied {{ ise_apply_results.results | selectattr('status', 'defined') | list | length }}
          ISE STIG enforcement operation(s) against {{ ise_host }}.
      tags: [apply]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ise_stig/apply_operations | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ise_stig_apply_operations_preflight_passed | bool
          - fe_cisco_cisco_ise_stig_apply_operations_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ise_stig/apply_operations: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ise_stig_apply_operations_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ise_stig_apply_operations_status | default('unknown') }}.
        success_msg: "cisco/cisco_ise_stig/apply_operations: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ise_stig/apply_operations | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_apply_operations_postflight_passed: true
        fe_cisco_cisco_ise_stig_apply_operations_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ise_stig/apply_operations | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_apply_operations_status: "failed"
        fe_cisco_cisco_ise_stig_apply_operations_postflight_passed: false
        fe_cisco_cisco_ise_stig_apply_operations_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ise_stig_apply_operations_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ise_stig/apply_operations | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ise_stig/apply_operations: FAILED at '{{ fe_cisco_cisco_ise_stig_apply_operations_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ise_stig_apply_operations_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ise_stig/apply_operations | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ise_stig/apply_operations failed at '{{ fe_cisco_cisco_ise_stig_apply_operations_failed_task }}': {{ fe_cisco_cisco_ise_stig_apply_operations_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ise_stig/apply_operations | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_apply_operations_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ise_stig_apply_operations_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ise_stig_apply_operations_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ise_stig/apply_operations | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ise_stig/apply_operations":
              component: "cisco/cisco_ise_stig/apply_operations"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ise_stig_apply_operations_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ise_stig_apply_operations_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ise_stig_apply_operations_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ise_stig_apply_operations_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ise_stig_apply_operations_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ise_stig_apply_operations_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ise_stig_apply_operations_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ise_stig_apply_operations_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ise_stig_apply_operations_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ise_stig_apply_operations_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ise_stig_apply_operations_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ise_stig_apply_operations_status | default('') == 'succeeded' else ['cisco/cisco_ise_stig/apply_operations'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ise_stig/apply_operations | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_apply_operations_stats_published: true
      tags:
        - always
