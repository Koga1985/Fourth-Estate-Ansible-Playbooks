---
# Read-only ISE NDM posture assessment via stable ERS endpoints.
# Safe in dry-run - GET requests only. Requires ERS to be enabled in ISE.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ise_stig/assess']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ise_stig_assess_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ise_stig/assess | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ise_stig_assess_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ise_stig_assess_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ise_stig_assess_status: "running"
    fe_cisco_cisco_ise_stig_assess_preflight_passed: false
    fe_cisco_cisco_ise_stig_assess_postflight_passed: false
    fe_cisco_cisco_ise_stig_assess_failed_task: ""
    fe_cisco_cisco_ise_stig_assess_error: ""
    fe_cisco_cisco_ise_stig_assess_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ise_stig/assess | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ise_stig/assess | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ise_stig/assess: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ise_stig/assess: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ise_stig/assess | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ise_stig/assess: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ise_stig/assess: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ise_stig_assess_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ise_stig/assess | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_assess_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Retrieve ISE deployment nodes
      ansible.builtin.uri:
        url: "https://{{ ise_host }}:{{ ise_ers_port }}/ers/config/node"
        method: GET
        user: "{{ ise_username }}"
        password: "{{ ise_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ ise_validate_certs }}"
        status_code: 200
        timeout: 30
      no_log: true
      register: ise_nodes
      tags: [assess]

    - name: Retrieve administrator accounts
      ansible.builtin.uri:
        url: "https://{{ ise_host }}:{{ ise_ers_port }}/ers/config/adminuser"
        method: GET
        user: "{{ ise_username }}"
        password: "{{ ise_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ ise_validate_certs }}"
        status_code: [200, 401, 404]
        timeout: 30
      no_log: true
      register: ise_admins
      tags: [assess]

    - name: Retrieve registered network devices (NADs)
      ansible.builtin.uri:
        url: "https://{{ ise_host }}:{{ ise_ers_port }}/ers/config/networkdevice"
        method: GET
        user: "{{ ise_username }}"
        password: "{{ ise_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        validate_certs: "{{ ise_validate_certs }}"
        status_code: 200
        timeout: 30
      no_log: true
      register: ise_nads
      tags: [assess]

    - name: Derive assessment findings
      ansible.builtin.set_fact:
        ise_assessment:
          node_count: "{{ ise_nodes.json.SearchResult.total | default(0) }}"
          admin_count: "{{ ise_admins.json.SearchResult.total | default('n/a (adminuser ERS not exposed)') }}"
          network_device_count: "{{ ise_nads.json.SearchResult.total | default(0) }}"
          ers_reachable: true
      tags: [assess]

    - name: Display assessment summary
      ansible.builtin.debug:
        msg:
          - "ISE NDM STIG assessment ({{ ise_host }}):"
          - "Deployment nodes:    {{ ise_assessment.node_count }}"
          - "Admin accounts:      {{ ise_assessment.admin_count }}"
          - "Network devices:     {{ ise_assessment.network_device_count }}"
          - "NOTE: banner, session timeout, syslog, NTP, SNMPv3 and external admin"
          - "auth (CISC-ND-000010/000090/000160/000280) are System Settings - verify"
          - "in the ISE admin UI or enforce via ise_stig_operations (OpenAPI)."
      tags: [assess]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ise_stig/assess | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ise_stig_assess_preflight_passed | bool
          - fe_cisco_cisco_ise_stig_assess_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ise_stig/assess: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ise_stig_assess_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ise_stig_assess_status | default('unknown') }}.
        success_msg: "cisco/cisco_ise_stig/assess: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ise_stig/assess | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_assess_postflight_passed: true
        fe_cisco_cisco_ise_stig_assess_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ise_stig/assess | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_assess_status: "failed"
        fe_cisco_cisco_ise_stig_assess_postflight_passed: false
        fe_cisco_cisco_ise_stig_assess_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ise_stig_assess_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ise_stig/assess | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ise_stig/assess: FAILED at '{{ fe_cisco_cisco_ise_stig_assess_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ise_stig_assess_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ise_stig/assess | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ise_stig/assess failed at '{{ fe_cisco_cisco_ise_stig_assess_failed_task }}': {{ fe_cisco_cisco_ise_stig_assess_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ise_stig/assess | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_assess_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ise_stig_assess_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ise_stig_assess_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ise_stig/assess | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ise_stig/assess":
              component: "cisco/cisco_ise_stig/assess"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ise_stig_assess_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ise_stig_assess_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ise_stig_assess_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ise_stig_assess_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ise_stig_assess_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ise_stig_assess_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ise_stig_assess_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ise_stig_assess_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ise_stig_assess_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ise_stig_assess_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ise_stig_assess_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ise_stig_assess_status | default('') == 'succeeded' else ['cisco/cisco_ise_stig/assess'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ise_stig/assess | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ise_stig_assess_stats_published: true
      tags:
        - always
