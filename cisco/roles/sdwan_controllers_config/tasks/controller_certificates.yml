---
# tasks file: controller_certificates.yml for sdwan_controllers_config
# Issue and install certificates on vBond and vSmart
# NIST SC-17, IA-3 | Device identity certificates

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_controllers_config/controller_certificates']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_controllers_config_controller_certificates_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_controllers_config/controller_certificates | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_controllers_config_controller_certificates_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_controllers_config_controller_certificates_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_controllers_config_controller_certificates_status: "running"
    fe_cisco_sdwan_controllers_config_controller_certificates_preflight_passed: false
    fe_cisco_sdwan_controllers_config_controller_certificates_postflight_passed: false
    fe_cisco_sdwan_controllers_config_controller_certificates_failed_task: ""
    fe_cisco_sdwan_controllers_config_controller_certificates_error: ""
    fe_cisco_sdwan_controllers_config_controller_certificates_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_controllers_config/controller_certificates | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_controllers_config/controller_certificates | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_controllers_config/controller_certificates: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_controllers_config/controller_certificates: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_controllers_config/controller_certificates | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_controllers_config/controller_certificates: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_controllers_config/controller_certificates: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_controllers_config/controller_certificates | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_controller_certificates_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Issue certificate for vBond
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/certificate/generate/csr"
        method: POST
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          deviceIP: "{{ sdwan_vbond_system_ip }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool and enable_controller_certificates | bool
      register: sdwan_vbond_csr
      tags: [sdwan, controllers, certificates, pki, phase17]

    - name: Issue certificate for vSmart
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/certificate/generate/csr"
        method: POST
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          deviceIP: "{{ sdwan_vsmart_system_ip }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool and enable_controller_certificates | bool
      register: sdwan_vsmart_csr
      tags: [sdwan, controllers, certificates, pki, phase17]

    - name: Display certificate status
      ansible.builtin.debug:
        msg:
          - "Controller certificate issuance:"
          - "  vBond CSR: {{ apply_changes | ternary('REQUESTED', 'SKIPPED (dry run)') }}"
          - "  vSmart CSR: {{ apply_changes | ternary('REQUESTED', 'SKIPPED (dry run)') }}"
      tags: [sdwan, controllers, certificates, pki, phase17]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_controllers_config/controller_certificates | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_controllers_config_controller_certificates_preflight_passed | bool
          - fe_cisco_sdwan_controllers_config_controller_certificates_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_controllers_config/controller_certificates: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_controllers_config_controller_certificates_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_controllers_config_controller_certificates_status | default('unknown') }}.
        success_msg: "cisco/sdwan_controllers_config/controller_certificates: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_controllers_config/controller_certificates | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_controller_certificates_postflight_passed: true
        fe_cisco_sdwan_controllers_config_controller_certificates_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_controllers_config/controller_certificates | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_controller_certificates_status: "failed"
        fe_cisco_sdwan_controllers_config_controller_certificates_postflight_passed: false
        fe_cisco_sdwan_controllers_config_controller_certificates_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_controllers_config_controller_certificates_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_controllers_config/controller_certificates | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_controllers_config/controller_certificates: FAILED at '{{ fe_cisco_sdwan_controllers_config_controller_certificates_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_controllers_config_controller_certificates_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_controllers_config/controller_certificates | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_controllers_config/controller_certificates failed at '{{ fe_cisco_sdwan_controllers_config_controller_certificates_failed_task }}': {{ fe_cisco_sdwan_controllers_config_controller_certificates_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_controllers_config/controller_certificates | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_controller_certificates_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_controllers_config_controller_certificates_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_controllers_config_controller_certificates_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_controllers_config/controller_certificates | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_controllers_config/controller_certificates":
              component: "cisco/sdwan_controllers_config/controller_certificates"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_controllers_config_controller_certificates_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_controllers_config_controller_certificates_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_controllers_config_controller_certificates_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_controllers_config_controller_certificates_status | default('') == 'succeeded' else ['cisco/sdwan_controllers_config/controller_certificates'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_controllers_config/controller_certificates | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_controller_certificates_stats_published: true
      tags:
        - always
