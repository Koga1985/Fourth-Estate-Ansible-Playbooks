---
# tasks file for sdwan_controllers_config
# Cisco SD-WAN Controller Configuration (vBond and vSmart)

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_controllers_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_controllers_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_controllers_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_controllers_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_controllers_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_controllers_config_status: "running"
    fe_cisco_sdwan_controllers_config_preflight_passed: false
    fe_cisco_sdwan_controllers_config_postflight_passed: false
    fe_cisco_sdwan_controllers_config_failed_task: ""
    fe_cisco_sdwan_controllers_config_error: ""
    fe_cisco_sdwan_controllers_config_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_controllers_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_controllers_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_controllers_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_controllers_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_controllers_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_controllers_config: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_controllers_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_controllers_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_controllers_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include prerequisites validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
      tags:
        - always
        - prerequisites

    # ============================================================
    # Phase 17 - vBond Orchestrator Configuration
    # ============================================================
    - name: PHASE 17 - Configure vBond orchestrator
      ansible.builtin.include_tasks:
        file: vbond.yml
        apply:
          tags:
            - sdwan
            - controllers
            - vbond
            - phase17
      when: enable_vbond_config | bool
      tags:
        - sdwan
        - controllers
        - vbond
        - phase17

    # ============================================================
    # Phase 17 - vSmart Controller Configuration
    # ============================================================
    - name: PHASE 17 - Configure vSmart controller
      ansible.builtin.include_tasks:
        file: vsmart.yml
        apply:
          tags:
            - sdwan
            - controllers
            - vsmart
            - phase17
      when: enable_vsmart_config | bool
      tags:
        - sdwan
        - controllers
        - vsmart
        - phase17

    # ============================================================
    # Phase 17 - Controller Certificates
    # NIST SC-17, IA-3 | Device identity certificates
    # ============================================================
    - name: PHASE 17 - Issue controller certificates
      ansible.builtin.include_tasks:
        file: controller_certificates.yml
        apply:
          tags:
            - sdwan
            - controllers
            - certificates
            - pki
            - phase17
      when: enable_controller_certificates | bool
      tags:
        - sdwan
        - controllers
        - certificates
        - pki
        - phase17

    # ============================================================
    # Phase 17 - OMP Configuration
    # ============================================================
    - name: PHASE 17 - Configure OMP route distribution
      ansible.builtin.include_tasks:
        file: omp_config.yml
        apply:
          tags:
            - sdwan
            - controllers
            - omp
            - routing
            - phase17
      when: enable_omp_config | bool
      tags:
        - sdwan
        - controllers
        - omp
        - routing
        - phase17

    # ============================================================
    # Phase 17 - Control Policies
    # ============================================================
    - name: PHASE 17 - Apply vSmart control policies
      ansible.builtin.include_tasks:
        file: control_policies.yml
        apply:
          tags:
            - sdwan
            - controllers
            - policies
            - phase17
      when: enable_control_policies | bool
      tags:
        - sdwan
        - controllers
        - policies
        - phase17

    # ============================================================
    # Phase 17 - Validation
    # ============================================================
    - name: PHASE 17 - Validate controller configuration
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - sdwan
            - controllers
            - validation
            - phase17
      tags:
        - sdwan
        - controllers
        - validation
        - phase17

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_controllers_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_controllers_config_preflight_passed | bool
          - fe_cisco_sdwan_controllers_config_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_controllers_config: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_controllers_config_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_controllers_config_status | default('unknown') }}.
        success_msg: "cisco/sdwan_controllers_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_controllers_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_postflight_passed: true
        fe_cisco_sdwan_controllers_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_controllers_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_status: "failed"
        fe_cisco_sdwan_controllers_config_postflight_passed: false
        fe_cisco_sdwan_controllers_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_controllers_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_controllers_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_controllers_config: FAILED at '{{ fe_cisco_sdwan_controllers_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_controllers_config_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_controllers_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_controllers_config failed at '{{ fe_cisco_sdwan_controllers_config_failed_task }}': {{ fe_cisco_sdwan_controllers_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_controllers_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_controllers_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_controllers_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_controllers_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_controllers_config":
              component: "cisco/sdwan_controllers_config"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_controllers_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_controllers_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_controllers_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_controllers_config_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_controllers_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_controllers_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_controllers_config_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_controllers_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_controllers_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_controllers_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_controllers_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_controllers_config_status | default('') == 'succeeded' else ['cisco/sdwan_controllers_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_controllers_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_controllers_config_stats_published: true
      tags:
        - always
