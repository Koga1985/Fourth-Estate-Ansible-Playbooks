---
# tasks file for aci_network_config - L2Out Configuration
# Configures L2Out bridged external connectivity and external EPGs

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/l2out']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_l2out_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/l2out | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_l2out_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_l2out_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_l2out_status: "running"
    fe_cisco_aci_network_config_l2out_preflight_passed: false
    fe_cisco_aci_network_config_l2out_postflight_passed: false
    fe_cisco_aci_network_config_l2out_failed_task: ""
    fe_cisco_aci_network_config_l2out_error: ""
    fe_cisco_aci_network_config_l2out_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/l2out | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/l2out | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/l2out: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/l2out: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/l2out | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/l2out: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/l2out: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_l2out_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/l2out | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l2out_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Create L2Out bridged connectivity objects
      cisco.aci.aci_l2out:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l2out: "{{ item.name }}"
        domain: "{{ item.domain }}"
        description: "{{ item.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l2outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: l2out_results
      tags:
        - aci
        - network
        - l2out
        - phase3

    - name: PHASE 3 - Create L2Out node profile
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/l2out-{{ item.name }}/lnodep-NodeProfile-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          l2extLNodeP:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/l2out-{{ item.name }}/lnodep-NodeProfile-{{ item.name }}"
              name: "NodeProfile-{{ item.name }}"
              descr: "Node profile for L2Out {{ item.name }}"
            children:
              - l2extLIfP:
                  attributes:
                    name: "IntProfile-{{ item.name }}"
                    descr: "Interface profile for L2Out {{ item.name }}"
      no_log: true
      loop: "{{ aci_l2outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: l2out_node_profile_results
      tags:
        - aci
        - network
        - l2out
        - phase3

    - name: PHASE 3 - Configure L2Out paths
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.0.tenant }}/l2out-{{ item.0.name }}/lnodep-NodeProfile-{{ item.0.name }}/lifp-IntProfile-{{ item.0.name }}/rspathL2OutAtt-[{{ item.1.path_dn }}].json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          l2extRsPathL2OutAtt:
            attributes:
              dn: "uni/tn-{{ item.0.tenant }}/l2out-{{ item.0.name }}/lnodep-NodeProfile-{{ item.0.name }}/lifp-IntProfile-{{ item.0.name }}/rspathL2OutAtt-[{{ item.1.path_dn }}]"
              tnPathEPDn: "{{ item.1.path_dn }}"
              encap: "{{ item.1.encap }}"
      no_log: true
      loop: "{{ aci_l2outs | subelements('paths') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }} path {{ item.1.path_dn }}"
      register: l2out_path_results
      tags:
        - aci
        - network
        - l2out
        - phase3

    - name: PHASE 3 - Create L2Out external EPGs
      cisco.aci.aci_l2out_extepg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l2out: "{{ item.0.name }}"
        extepg: "{{ item.1.name }}"
        description: "{{ item.1.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l2outs | subelements('external_epgs') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }}"
      register: l2out_extepg_results
      tags:
        - aci
        - network
        - l2out
        - phase3

    - name: PHASE 3 - Save L2Out configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_l2out_config.json"
        mode: "0640"
        content: "{{ l2out_artifact | to_nice_json }}"
      vars:
        l2out_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          l2outs_configured: "{{ aci_l2outs | map(attribute='name') | list }}"
          l2out_count: "{{ aci_l2outs | length }}"
          external_epg_count: "{{ aci_l2outs | map(attribute='external_epgs') | map('length') | sum }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - network
        - l2out
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/l2out | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_l2out_preflight_passed | bool
          - fe_cisco_aci_network_config_l2out_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/l2out: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_l2out_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_l2out_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/l2out: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/l2out | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l2out_postflight_passed: true
        fe_cisco_aci_network_config_l2out_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/l2out | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l2out_status: "failed"
        fe_cisco_aci_network_config_l2out_postflight_passed: false
        fe_cisco_aci_network_config_l2out_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_l2out_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/l2out | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/l2out: FAILED at '{{ fe_cisco_aci_network_config_l2out_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_l2out_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/l2out | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/l2out failed at '{{ fe_cisco_aci_network_config_l2out_failed_task }}': {{ fe_cisco_aci_network_config_l2out_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/l2out | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l2out_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_l2out_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_l2out_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/l2out | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/l2out":
              component: "cisco/aci_network_config/l2out"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_l2out_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_l2out_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_l2out_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_l2out_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_l2out_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_l2out_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_l2out_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_l2out_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_l2out_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_l2out_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_l2out_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_l2out_status | default('') == 'succeeded' else ['cisco/aci_network_config/l2out'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/l2out | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l2out_stats_published: true
      tags:
        - always
