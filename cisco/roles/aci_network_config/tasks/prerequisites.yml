---
# tasks file for aci_network_config - Prerequisites and Validation
# Validates connectivity, required variables, and creates artifact directory

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/prerequisites']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_prerequisites_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/prerequisites | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_prerequisites_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_prerequisites_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_prerequisites_status: "running"
    fe_cisco_aci_network_config_prerequisites_preflight_passed: false
    fe_cisco_aci_network_config_prerequisites_postflight_passed: false
    fe_cisco_aci_network_config_prerequisites_failed_task: ""
    fe_cisco_aci_network_config_prerequisites_error: ""
    fe_cisco_aci_network_config_prerequisites_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/prerequisites | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/prerequisites | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/prerequisites: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/prerequisites: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/prerequisites | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/prerequisites: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/prerequisites: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_prerequisites_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/prerequisites | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_prerequisites_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Display aci_network_config role banner
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - " Cisco ACI Network Configuration - Fourth Estate"
          - "================================================================"
          - " Role:            aci_network_config"
          - " APIC Host:       {{ aci_host }}"
          - " Apply Changes:   {{ apply_changes }}"
          - " Artifacts:       {{ artifacts_dir }}"
          - " Enable L3Out:    {{ enable_l3out }}"
          - " Enable L2Out:    {{ enable_l2out }}"
          - " Enable ExtEPGs:  {{ enable_external_epgs }}"
          - " Enable Routes:   {{ enable_static_routes }}"
          - " Enable BGP:      {{ enable_bgp_peers }}"
          - " Enable OSPF:     {{ enable_ospf_peers }}"
          - " Compliance:      {{ compliance_frameworks | join(', ') }}"
          - "================================================================"
          - " {{ 'DRY RUN MODE - No changes will be applied' if not (apply_changes | bool) else 'LIVE MODE - Changes WILL be applied' }}"
          - "================================================================"
      tags:
        - always
        - prerequisites

    - name: PHASE 3 - Validate required APIC connection variables are defined
      ansible.builtin.assert:
        that:
          - aci_host is defined
          - aci_host | length > 0
          - aci_username is defined
          - aci_username | length > 0
          - aci_password is defined
          - aci_password | length > 0
        fail_msg: "Required APIC connection parameters (aci_host, aci_username, aci_password) must be defined"
        quiet: true
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Validate L3Out configuration variables when enabled
      ansible.builtin.assert:
        that:
          - aci_l3outs is defined
          - aci_l3outs | length > 0
        fail_msg: "aci_l3outs must be defined and non-empty when enable_l3out is true"
        quiet: true
      when: enable_l3out | bool
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Validate L2Out configuration variables when enabled
      ansible.builtin.assert:
        that:
          - aci_l2outs is defined
          - aci_l2outs | length > 0
        fail_msg: "aci_l2outs must be defined and non-empty when enable_l2out is true"
        quiet: true
      when: enable_l2out | bool
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Validate static route configuration variables when enabled
      ansible.builtin.assert:
        that:
          - aci_static_routes is defined
          - aci_static_routes | length > 0
        fail_msg: "aci_static_routes must be defined and non-empty when enable_static_routes is true"
        quiet: true
      when: enable_static_routes | bool
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Test APIC connectivity
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni.json
        method: get
      no_log: true
      register: aci_connectivity_check
      failed_when: false
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Assert APIC is reachable
      ansible.builtin.assert:
        that:
          - aci_connectivity_check is defined
          - aci_connectivity_check.status is defined
          - aci_connectivity_check.status == 200
        fail_msg: "Unable to reach APIC at {{ aci_host }} - check connectivity and credentials"
        quiet: true
      tags:
        - always
        - prerequisites
        - validation

    - name: PHASE 3 - Create artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      tags:
        - always
        - prerequisites

    - name: PHASE 3 - Record role start time
      ansible.builtin.set_fact:
        aci_network_config_start_time: "{{ ansible_date_time.iso8601 }}"
        aci_network_config_epoch: "{{ ansible_date_time.epoch }}"
      tags:
        - always
        - prerequisites

    - name: PHASE 3 - Save deployment metadata artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_network_config_metadata.json"
        mode: "0640"
        content: "{{ deployment_metadata | to_nice_json }}"
      vars:
        deployment_metadata:
          role: "aci_network_config"
          timestamp: "{{ aci_network_config_start_time }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          features:
            enable_l3out: "{{ enable_l3out | bool }}"
            enable_l2out: "{{ enable_l2out | bool }}"
            enable_external_epgs: "{{ enable_external_epgs | bool }}"
            enable_static_routes: "{{ enable_static_routes | bool }}"
            enable_bgp_peers: "{{ enable_bgp_peers | bool }}"
            enable_ospf_peers: "{{ enable_ospf_peers | bool }}"
          l3out_count: "{{ aci_l3outs | length }}"
          l2out_count: "{{ aci_l2outs | length }}"
          static_route_count: "{{ aci_static_routes | length }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
          fourth_estate_org: "{{ fourth_estate_org }}"
          fourth_estate_environment: "{{ fourth_estate_environment }}"
      tags:
        - always
        - prerequisites

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/prerequisites | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_prerequisites_preflight_passed | bool
          - fe_cisco_aci_network_config_prerequisites_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/prerequisites: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_prerequisites_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_prerequisites_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/prerequisites: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/prerequisites | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_prerequisites_postflight_passed: true
        fe_cisco_aci_network_config_prerequisites_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/prerequisites | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_prerequisites_status: "failed"
        fe_cisco_aci_network_config_prerequisites_postflight_passed: false
        fe_cisco_aci_network_config_prerequisites_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_prerequisites_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/prerequisites | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/prerequisites: FAILED at '{{ fe_cisco_aci_network_config_prerequisites_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_prerequisites_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/prerequisites | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/prerequisites failed at '{{ fe_cisco_aci_network_config_prerequisites_failed_task }}': {{ fe_cisco_aci_network_config_prerequisites_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/prerequisites | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_prerequisites_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_prerequisites_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_prerequisites_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/prerequisites | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/prerequisites":
              component: "cisco/aci_network_config/prerequisites"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_prerequisites_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_prerequisites_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_prerequisites_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_prerequisites_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_prerequisites_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_prerequisites_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_prerequisites_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_prerequisites_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_prerequisites_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_prerequisites_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_prerequisites_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_prerequisites_status | default('') == 'succeeded' else ['cisco/aci_network_config/prerequisites'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/prerequisites | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_prerequisites_stats_published: true
      tags:
        - always
