---
# tasks file for aci_network_config - External EPG Configuration
# Configures L3Out external EPGs, subnets, and contract bindings

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/external_epgs']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_external_epgs_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/external_epgs | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_external_epgs_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_external_epgs_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_external_epgs_status: "running"
    fe_cisco_aci_network_config_external_epgs_preflight_passed: false
    fe_cisco_aci_network_config_external_epgs_postflight_passed: false
    fe_cisco_aci_network_config_external_epgs_failed_task: ""
    fe_cisco_aci_network_config_external_epgs_error: ""
    fe_cisco_aci_network_config_external_epgs_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/external_epgs | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/external_epgs | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/external_epgs: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/external_epgs: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/external_epgs | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/external_epgs: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/external_epgs: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_external_epgs_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/external_epgs | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_external_epgs_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Create L3Out external EPGs (inline with L3Out definitions)
      cisco.aci.aci_l3out_extepg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.name }}"
        extepg: "{{ item.1.name }}"
        description: "{{ item.1.description | default('') }}"
        preferred_group: false
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs | subelements('external_epgs') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }}"
      register: l3out_extepg_results
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    - name: PHASE 3 - Configure external EPG subnets (inline L3Out EPGs)
      cisco.aci.aci_l3out_extsubnet:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.l3out_name }}"
        extepg: "{{ item.0.epg_name }}"
        network: "{{ item.1.prefix }}"
        scope: "{{ item.1.scope | default('import-security') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: >-
        {{
          aci_l3outs
          | subelements('external_epgs')
          | map('combine', {'l3out_name': (item[0].name if item is defined else '')})
          | list
        }}
      vars:
        _extepg_subnets: >-
          {{
            aci_l3outs
            | map(attribute='external_epgs')
            | zip(aci_l3outs)
            | list
          }}
      loop_control:
        label: "subnet configuration"
      when: false
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    # Flatten the nested structure for subnet configuration
    - name: PHASE 3 - Build flattened external EPG subnet list
      ansible.builtin.set_fact:
        _flat_extepg_subnets: >-
          {{
            _flat_extepg_subnets | default([]) + [
              {
                'tenant': l3out_item.tenant,
                'l3out': l3out_item.name,
                'extepg': epg_item.name,
                'prefix': subnet_item.prefix,
                'scope': subnet_item.scope | default('import-security')
              }
            ]
          }}
      loop: "{{ aci_l3outs }}"
      loop_control:
        loop_var: l3out_item
        label: "{{ l3out_item.name }}"
      vars:
        _flat_extepg_subnets: []
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    - name: PHASE 3 - Configure L3Out external EPG subnets
      cisco.aci.aci_l3out_extsubnet:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.name }}"
        extepg: "{{ item.1.name }}"
        network: "{{ item.2.prefix }}"
        scope: "{{ item.2.scope | default('import-security') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: >-
        {{
          aci_l3outs
          | subelements('external_epgs')
          | subelements('1.subnets')
        }}
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }}: {{ item.2.prefix }}"
      register: extepg_subnet_results
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    - name: PHASE 3 - Bind provided contracts to inline L3Out external EPGs
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.0.tenant }}/out-{{ item.0.l3out }}/instP-{{ item.0.extepg }}/rsprov-{{ item.1 }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          fvRsProv:
            attributes:
              dn: "uni/tn-{{ item.0.tenant }}/out-{{ item.0.l3out }}/instP-{{ item.0.extepg }}/rsprov-{{ item.1 }}"
              tnVzBrCPName: "{{ item.1 }}"
      no_log: true
      loop: >-
        {{
          aci_l3outs
          | subelements('external_epgs')
          | map('combine', {'tenant': (item[0].tenant if item is defined else ''), 'l3out': (item[0].name if item is defined else ''), 'extepg': (item[1].name if item is defined else '')})
          | list
        }}
      when: false
      loop_control:
        label: "contract binding"
      tags:
        - aci
        - network
        - external_epgs
        - contracts
        - phase3

    - name: PHASE 3 - Bind provided contracts to external EPGs
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.0.tenant }}/out-{{ item.0.name }}/instP-{{ item.1.name }}/rsprov-{{ item.2 }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          fvRsProv:
            attributes:
              dn: "uni/tn-{{ item.0.tenant }}/out-{{ item.0.name }}/instP-{{ item.1.name }}/rsprov-{{ item.2 }}"
              tnVzBrCPName: "{{ item.2 }}"
      no_log: true
      loop: >-
        {{
          aci_l3outs
          | subelements('external_epgs')
          | subelements('1.provided_contracts')
        }}
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }} provides {{ item.2 }}"
      register: extepg_provided_contract_results
      when: (aci_l3outs | subelements('external_epgs') | subelements('1.provided_contracts') | list | length) > 0
      tags:
        - aci
        - network
        - external_epgs
        - contracts
        - phase3

    - name: PHASE 3 - Bind consumed contracts to external EPGs
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.0.tenant }}/out-{{ item.0.name }}/instP-{{ item.1.name }}/rscons-{{ item.2 }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          fvRsCons:
            attributes:
              dn: "uni/tn-{{ item.0.tenant }}/out-{{ item.0.name }}/instP-{{ item.1.name }}/rscons-{{ item.2 }}"
              tnVzBrCPName: "{{ item.2 }}"
      no_log: true
      loop: >-
        {{
          aci_l3outs
          | subelements('external_epgs')
          | subelements('1.consumed_contracts')
        }}
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }} consumes {{ item.2 }}"
      register: extepg_consumed_contract_results
      when: (aci_l3outs | subelements('external_epgs') | subelements('1.consumed_contracts') | list | length) > 0
      tags:
        - aci
        - network
        - external_epgs
        - contracts
        - phase3

    - name: PHASE 3 - Create standalone external EPGs (from aci_external_epgs list)
      cisco.aci.aci_l3out_extepg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.l3out }}"
        extepg: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        preferred_group: false
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_external_epgs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.l3out }}/{{ item.name }}"
      register: standalone_extepg_results
      when: aci_external_epgs | length > 0
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    - name: PHASE 3 - Configure standalone external EPG subnets
      cisco.aci.aci_l3out_extsubnet:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.l3out }}"
        extepg: "{{ item.0.name }}"
        network: "{{ item.1.prefix }}"
        scope: "{{ item.1.scope | default('import-security') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_external_epgs | subelements('subnets') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.l3out }}/{{ item.0.name }}: {{ item.1.prefix }}"
      register: standalone_extepg_subnet_results
      when: aci_external_epgs | length > 0
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    - name: PHASE 3 - Save external EPG configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_external_epgs.json"
        mode: "0640"
        content: "{{ extepg_artifact | to_nice_json }}"
      vars:
        extepg_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          inline_extepg_count: "{{ aci_l3outs | map(attribute='external_epgs') | map('length') | sum }}"
          standalone_extepg_count: "{{ aci_external_epgs | length }}"
          l3outs_with_extepgs: "{{ aci_l3outs | map(attribute='name') | list }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - network
        - external_epgs
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/external_epgs | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_external_epgs_preflight_passed | bool
          - fe_cisco_aci_network_config_external_epgs_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/external_epgs: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_external_epgs_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_external_epgs_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/external_epgs: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/external_epgs | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_external_epgs_postflight_passed: true
        fe_cisco_aci_network_config_external_epgs_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/external_epgs | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_external_epgs_status: "failed"
        fe_cisco_aci_network_config_external_epgs_postflight_passed: false
        fe_cisco_aci_network_config_external_epgs_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_external_epgs_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/external_epgs | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/external_epgs: FAILED at '{{ fe_cisco_aci_network_config_external_epgs_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_external_epgs_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/external_epgs | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/external_epgs failed at '{{ fe_cisco_aci_network_config_external_epgs_failed_task }}': {{ fe_cisco_aci_network_config_external_epgs_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/external_epgs | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_external_epgs_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_external_epgs_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_external_epgs_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/external_epgs | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/external_epgs":
              component: "cisco/aci_network_config/external_epgs"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_external_epgs_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_external_epgs_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_external_epgs_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_external_epgs_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_external_epgs_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_external_epgs_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_external_epgs_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_external_epgs_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_external_epgs_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_external_epgs_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_external_epgs_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_external_epgs_status | default('') == 'succeeded' else ['cisco/aci_network_config/external_epgs'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/external_epgs | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_external_epgs_stats_published: true
      tags:
        - always
