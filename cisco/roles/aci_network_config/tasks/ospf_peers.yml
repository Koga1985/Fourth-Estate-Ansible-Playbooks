---
# tasks file for aci_network_config - OSPF Interface Policy and Peer Configuration
# Configures OSPF interface policies, area settings, and interface-level OSPF timers

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/ospf_peers']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_ospf_peers_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/ospf_peers | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_ospf_peers_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_ospf_peers_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_ospf_peers_status: "running"
    fe_cisco_aci_network_config_ospf_peers_preflight_passed: false
    fe_cisco_aci_network_config_ospf_peers_postflight_passed: false
    fe_cisco_aci_network_config_ospf_peers_failed_task: ""
    fe_cisco_aci_network_config_ospf_peers_error: ""
    fe_cisco_aci_network_config_ospf_peers_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/ospf_peers | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/ospf_peers | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/ospf_peers: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/ospf_peers: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/ospf_peers | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/ospf_peers: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/ospf_peers: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_ospf_peers_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/ospf_peers | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_ospf_peers_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Create OSPF interface policies
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/ospfIfPol-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          ospfIfPol:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/ospfIfPol-{{ item.name }}"
              name: "{{ item.name }}"
              descr: "{{ item.description | default('') }}"
              nwT: "{{ item.network_type | default('p2p') }}"
              helloIntvl: "{{ item.hello_interval | default(10) | string }}"
              deadIntvl: "{{ item.dead_interval | default(40) | string }}"
              rexmitIntvl: "{{ item.retransmit_interval | default(5) | string }}"
              xmitDelay: "{{ item.transmit_delay | default(1) | string }}"
              prio: "{{ item.priority | default(1) | string }}"
      no_log: true
      loop: "{{ aci_ospf_interface_policies }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }} ({{ item.network_type | default('p2p') }})"
      register: ospf_if_policy_results
      tags:
        - aci
        - network
        - ospf
        - routing
        - phase3

    - name: PHASE 3 - Associate OSPF interface policy with L3Out interface profile
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/out-{{ item.l3out_name }}/lnodep-NodeProfile-{{ item.l3out_name }}/lifp-IntProfile-{{ item.l3out_name }}/ospfIfP.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          ospfIfP:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/out-{{ item.l3out_name }}/lnodep-NodeProfile-{{ item.l3out_name }}/lifp-IntProfile-{{ item.l3out_name }}/ospfIfP"
              descr: "OSPF interface profile for {{ item.l3out_name }}"
              authKey: ""
              authKeyId: "1"
              authType: "none"
            children:
              - ospfRsIfPol:
                  attributes:
                    tnOspfIfPolName: "{{ item.interface_policy }}"
      no_log: true
      loop: "{{ aci_ospf_configs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.l3out_name }} OSPF interface policy {{ item.interface_policy }}"
      register: ospf_if_profile_results
      tags:
        - aci
        - network
        - ospf
        - routing
        - phase3

    - name: PHASE 3 - Configure OSPF area policy on L3Out
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/out-{{ item.l3out_name }}/ospfExtP.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          ospfExtP:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/out-{{ item.l3out_name }}/ospfExtP"
              areaId: "{{ item.area_id | default('0.0.0.0') }}"
              areaType: "{{ item.area_type | default('regular') }}"
              areaCost: "{{ item.area_cost | default(1) | string }}"
              descr: "{{ item.description | default('') }}"
      no_log: true
      loop: "{{ aci_ospf_configs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.l3out_name }} OSPF area {{ item.area_id | default('0.0.0.0') }}"
      register: ospf_area_results
      tags:
        - aci
        - network
        - ospf
        - routing
        - phase3

    - name: PHASE 3 - Display OSPF configuration summary
      ansible.builtin.debug:
        msg:
          - "=== OSPF Configuration Summary ==="
          - "OSPF interface policies: {{ aci_ospf_interface_policies | length }}"
          - "OSPF L3Out configs:      {{ aci_ospf_configs | length }}"
          - "Apply changes:           {{ apply_changes | bool }}"
      tags:
        - aci
        - network
        - ospf
        - routing
        - phase3

    - name: PHASE 3 - Save OSPF configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_ospf_config.json"
        mode: "0640"
        content: "{{ ospf_artifact | to_nice_json }}"
      vars:
        ospf_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          ospf_interface_policies: "{{ aci_ospf_interface_policies | map(attribute='name') | list }}"
          ospf_l3out_configs: "{{ aci_ospf_configs | map(attribute='l3out_name') | list }}"
          ospf_areas: "{{ aci_ospf_configs | map(attribute='area_id') | list }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - network
        - ospf
        - routing
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/ospf_peers | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_ospf_peers_preflight_passed | bool
          - fe_cisco_aci_network_config_ospf_peers_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/ospf_peers: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_ospf_peers_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_ospf_peers_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/ospf_peers: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/ospf_peers | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_ospf_peers_postflight_passed: true
        fe_cisco_aci_network_config_ospf_peers_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/ospf_peers | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_ospf_peers_status: "failed"
        fe_cisco_aci_network_config_ospf_peers_postflight_passed: false
        fe_cisco_aci_network_config_ospf_peers_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_ospf_peers_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/ospf_peers | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/ospf_peers: FAILED at '{{ fe_cisco_aci_network_config_ospf_peers_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_ospf_peers_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/ospf_peers | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/ospf_peers failed at '{{ fe_cisco_aci_network_config_ospf_peers_failed_task }}': {{ fe_cisco_aci_network_config_ospf_peers_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/ospf_peers | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_ospf_peers_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_ospf_peers_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_ospf_peers_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/ospf_peers | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/ospf_peers":
              component: "cisco/aci_network_config/ospf_peers"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_ospf_peers_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_ospf_peers_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_ospf_peers_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_ospf_peers_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_ospf_peers_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_ospf_peers_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_ospf_peers_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_ospf_peers_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_ospf_peers_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_ospf_peers_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_ospf_peers_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_ospf_peers_status | default('') == 'succeeded' else ['cisco/aci_network_config/ospf_peers'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/ospf_peers | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_ospf_peers_stats_published: true
      tags:
        - always
