---
# tasks file for aci_network_config - L3Out Configuration
# Configures L3Out objects, logical node profiles, interface profiles, nodes, and paths

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/l3out']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_l3out_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/l3out | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_l3out_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_l3out_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_l3out_status: "running"
    fe_cisco_aci_network_config_l3out_preflight_passed: false
    fe_cisco_aci_network_config_l3out_postflight_passed: false
    fe_cisco_aci_network_config_l3out_failed_task: ""
    fe_cisco_aci_network_config_l3out_error: ""
    fe_cisco_aci_network_config_l3out_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/l3out | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/l3out | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/l3out: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/l3out: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/l3out | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/l3out: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/l3out: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_l3out_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/l3out | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l3out_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Create L3Out external connectivity objects
      cisco.aci.aci_l3out:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.name }}"
        vrf: "{{ item.vrf }}"
        domain: "{{ item.domain }}"
        description: "{{ item.description | default('') }}"
        route_control: export
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: l3out_results
      tags:
        - aci
        - network
        - l3out
        - phase3

    - name: PHASE 3 - Create L3Out logical node profiles
      cisco.aci.aci_l3out_logical_node_profile:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.name }}"
        node_profile: "{{ item.node_profile }}"
        description: "Logical node profile for {{ item.name }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}/{{ item.node_profile }}"
      register: node_profile_results
      tags:
        - aci
        - network
        - l3out
        - phase3

    - name: PHASE 3 - Create L3Out logical interface profiles
      cisco.aci.aci_l3out_logical_interface_profile:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.name }}"
        node_profile: "{{ item.node_profile }}"
        interface_profile: "{{ item.interface_profile }}"
        description: "Logical interface profile for {{ item.name }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}/{{ item.interface_profile }}"
      register: interface_profile_results
      tags:
        - aci
        - network
        - l3out
        - phase3

    - name: PHASE 3 - Configure L3Out logical nodes (router IDs)
      cisco.aci.aci_l3out_logical_node:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.name }}"
        node_profile: "{{ item.0.node_profile }}"
        pod_id: "{{ item.1.node_dn | regex_replace('topology/pod-(\\d+)/node-.*', '\\1') }}"
        node_id: "{{ item.1.node_dn | regex_replace('topology/pod-\\d+/node-(\\d+)', '\\1') }}"
        router_id: "{{ item.1.router_id }}"
        router_id_as_loopback: "{{ 'yes' if item.1.loopback | default(true) else 'no' }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }} node {{ item.1.node_dn }}"
      register: logical_node_results
      tags:
        - aci
        - network
        - l3out
        - phase3

    - name: PHASE 3 - Configure L3Out routed interfaces (paths)
      cisco.aci.aci_l3out_interface:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.name }}"
        node_profile: "{{ item.0.node_profile }}"
        interface_profile: "{{ item.0.interface_profile }}"
        pod_id: "{{ item.1.path_dn | regex_replace('topology/pod-(\\d+)/.*', '\\1') }}"
        node_id: "{{ item.1.path_dn | regex_replace('topology/pod-\\d+/paths-(\\d+)/.*', '\\1') }}"
        path_ep: "{{ item.1.path_dn | regex_replace('.*pathep-\\[(.*)\\]', '\\1') }}"
        ip_masking: "{{ item.1.addr }}"
        encap: "{{ item.1.encap }}"
        description: "{{ item.1.description | default('') }}"
        interface_type: l3-port
        mode: regular
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3outs | subelements('paths') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }} path {{ item.1.path_dn }}"
      register: l3out_interface_results
      tags:
        - aci
        - network
        - l3out
        - phase3

    - name: PHASE 3 - Configure L3Out OSPF external policy when OSPF is enabled
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/out-{{ item.name }}/ospfExtP.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          ospfExtP:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/out-{{ item.name }}/ospfExtP"
              areaId: "{{ item.ospf_area | default('0.0.0.0') }}"
              areaType: "{{ item.ospf_area_type | default('regular') }}"
              descr: "OSPF external policy for {{ item.name }}"
      no_log: true
      loop: "{{ aci_l3outs | selectattr('ospf_enabled', 'defined') | selectattr('ospf_enabled') | list }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }} OSPF area {{ item.ospf_area | default('0.0.0.0') }}"
      register: l3out_ospf_results
      tags:
        - aci
        - network
        - l3out
        - ospf
        - phase3

    - name: PHASE 3 - Configure L3Out BGP external policy when BGP is enabled
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/tn-{{ item.tenant }}/out-{{ item.name }}/bgpExtP.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          bgpExtP:
            attributes:
              dn: "uni/tn-{{ item.tenant }}/out-{{ item.name }}/bgpExtP"
              descr: "BGP external policy for {{ item.name }}"
      no_log: true
      loop: "{{ aci_l3outs | selectattr('bgp_enabled', 'defined') | selectattr('bgp_enabled') | list }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }} BGP"
      register: l3out_bgp_results
      tags:
        - aci
        - network
        - l3out
        - bgp
        - phase3

    - name: PHASE 3 - Save L3Out configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_l3out_config.json"
        mode: "0640"
        content: "{{ l3out_artifact | to_nice_json }}"
      vars:
        l3out_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          l3outs_configured: "{{ aci_l3outs | map(attribute='name') | list }}"
          l3out_details: "{{ aci_l3outs | map(attribute='name') | zip(aci_l3outs | map(attribute='tenant')) | map('join', '@') | list }}"
          l3out_count: "{{ aci_l3outs | length }}"
          node_count: "{{ aci_l3outs | map(attribute='nodes') | map('length') | sum }}"
          path_count: "{{ aci_l3outs | map(attribute='paths') | map('length') | sum }}"
          bgp_enabled_l3outs: "{{ aci_l3outs | selectattr('bgp_enabled', 'defined') | selectattr('bgp_enabled') | map(attribute='name') | list }}"
          ospf_enabled_l3outs: "{{ aci_l3outs | selectattr('ospf_enabled', 'defined') | selectattr('ospf_enabled') | map(attribute='name') | list }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - network
        - l3out
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/l3out | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_l3out_preflight_passed | bool
          - fe_cisco_aci_network_config_l3out_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/l3out: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_l3out_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_l3out_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/l3out: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/l3out | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l3out_postflight_passed: true
        fe_cisco_aci_network_config_l3out_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/l3out | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l3out_status: "failed"
        fe_cisco_aci_network_config_l3out_postflight_passed: false
        fe_cisco_aci_network_config_l3out_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_l3out_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/l3out | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/l3out: FAILED at '{{ fe_cisco_aci_network_config_l3out_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_l3out_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/l3out | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/l3out failed at '{{ fe_cisco_aci_network_config_l3out_failed_task }}': {{ fe_cisco_aci_network_config_l3out_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/l3out | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l3out_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_l3out_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_l3out_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/l3out | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/l3out":
              component: "cisco/aci_network_config/l3out"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_l3out_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_l3out_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_l3out_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_l3out_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_l3out_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_l3out_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_l3out_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_l3out_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_l3out_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_l3out_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_l3out_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_l3out_status | default('') == 'succeeded' else ['cisco/aci_network_config/l3out'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/l3out | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_l3out_stats_published: true
      tags:
        - always
