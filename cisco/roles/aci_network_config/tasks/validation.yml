---
# tasks file for aci_network_config - Validation and Verification
# Queries L3Out objects, checks for faults, and generates validation report

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_validation_status: "running"
    fe_cisco_aci_network_config_validation_preflight_passed: false
    fe_cisco_aci_network_config_validation_postflight_passed: false
    fe_cisco_aci_network_config_validation_failed_task: ""
    fe_cisco_aci_network_config_validation_error: ""
    fe_cisco_aci_network_config_validation_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Query all configured L3Outs for validation
      cisco.aci.aci_l3out:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.name }}"
        state: query
      no_log: true
      changed_when: false
      loop: "{{ aci_l3outs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: l3out_validation_results
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Assert all L3Outs are present
      ansible.builtin.assert:
        that:
          - item.current is defined
        fail_msg: "L3Out validation query failed for {{ item.item.name }}"
        success_msg: "L3Out {{ item.item.name }} validation query succeeded"
        quiet: true
      loop: "{{ l3out_validation_results.results }}"
      loop_control:
        label: "{{ item.item.tenant }}/{{ item.item.name }}"
      when: apply_changes | bool
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Query L3Out-related faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=and(or(eq(faultInst.severity,\"critical\"),eq(faultInst.severity,\"major\")),wcard(faultInst.dn,\"out-\"))&order-by=faultInst.severity|desc&page-size=50"
        method: get
      no_log: true
      register: l3out_faults
      failed_when: false
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Query static routes for validation
      cisco.aci.aci_l3out_static_routes:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.l3out_name | default('L3Out-Core-Routing') }}"
        node_profile: "{{ item.node_profile | default('NodeProfile-Core') }}"
        pod_id: "{{ item.node_dn | regex_replace('topology/pod-(\\d+)/.*', '\\1') }}"
        node_id: "{{ item.node_dn | regex_replace('topology/pod-\\d+/node-(\\d+)', '\\1') }}"
        prefix: "{{ item.prefix }}"
        state: query
      no_log: true
      changed_when: false
      loop: "{{ aci_static_routes }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.prefix }}"
      register: static_route_validation
      when: enable_static_routes | bool
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Display network configuration validation summary
      ansible.builtin.debug:
        msg:
          - "=== ACI Network Configuration Validation ==="
          - "APIC Host:              {{ aci_host }}"
          - "L3Outs configured:      {{ aci_l3outs | length }}"
          - "L3Out results queried:  {{ l3out_validation_results.results | length }}"
          - "L3Out faults found:     {{ l3out_faults.imdata | default([]) | length }}"
          - "Static routes:          {{ aci_static_routes | length }}"
          - "BGP-enabled L3Outs:     {{ aci_l3outs | selectattr('bgp_enabled', 'defined') | selectattr('bgp_enabled') | list | length }}"
          - "OSPF-enabled L3Outs:    {{ aci_l3outs | selectattr('ospf_enabled', 'defined') | selectattr('ospf_enabled') | list | length }}"
          - "Apply Changes Mode:     {{ apply_changes | bool }}"
          - "Deployment Start:       {{ aci_network_config_start_time | default('unknown') }}"
          - "Validation Time:        {{ ansible_date_time.iso8601 }}"
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Warn if L3Out faults detected
      ansible.builtin.debug:
        msg:
          - "WARNING: {{ l3out_faults.imdata | default([]) | length }} critical/major fault(s) detected on L3Out objects"
          - "Review faults at: https://{{ aci_host }}/index.html#bTenants:faults"
      when: (l3out_faults.imdata | default([]) | length) > 0
      tags:
        - validation
        - verification
        - phase3

    - name: PHASE 3 - Generate network configuration validation report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_network_validation_report.json"
        mode: "0640"
        content: "{{ validation_report | to_nice_json }}"
      vars:
        validation_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          deployment_start: "{{ aci_network_config_start_time | default('unknown') }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          l3out_count: "{{ aci_l3outs | length }}"
          l3out_names: "{{ aci_l3outs | map(attribute='name') | list }}"
          l3out_faults: "{{ l3out_faults.imdata | default([]) | length }}"
          static_route_count: "{{ aci_static_routes | length }}"
          bgp_l3out_count: "{{ aci_l3outs | selectattr('bgp_enabled', 'defined') | selectattr('bgp_enabled') | list | length }}"
          ospf_l3out_count: "{{ aci_l3outs | selectattr('ospf_enabled', 'defined') | selectattr('ospf_enabled') | list | length }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
          validation_status: "{{ 'PASSED' if (l3out_faults.imdata | default([]) | length) == 0 else 'WARNING - Faults Detected' }}"
      tags:
        - validation
        - verification
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_validation_preflight_passed | bool
          - fe_cisco_aci_network_config_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_validation_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_validation_postflight_passed: true
        fe_cisco_aci_network_config_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_validation_status: "failed"
        fe_cisco_aci_network_config_validation_postflight_passed: false
        fe_cisco_aci_network_config_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/validation: FAILED at '{{ fe_cisco_aci_network_config_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/validation failed at '{{ fe_cisco_aci_network_config_validation_failed_task }}': {{ fe_cisco_aci_network_config_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/validation":
              component: "cisco/aci_network_config/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_validation_status | default('') == 'succeeded' else ['cisco/aci_network_config/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_validation_stats_published: true
      tags:
        - always
