---
# tasks file for aci_network_config - Static Route Configuration
# Configures static routes and next-hop entries on L3Out logical nodes

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_network_config/static_routes']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_network_config_static_routes_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_network_config/static_routes | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_network_config_static_routes_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_network_config_static_routes_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_network_config_static_routes_status: "running"
    fe_cisco_aci_network_config_static_routes_preflight_passed: false
    fe_cisco_aci_network_config_static_routes_postflight_passed: false
    fe_cisco_aci_network_config_static_routes_failed_task: ""
    fe_cisco_aci_network_config_static_routes_error: ""
    fe_cisco_aci_network_config_static_routes_stats_published: false
  tags:
    - always

- name: "cisco/aci_network_config/static_routes | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_network_config/static_routes | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_network_config/static_routes: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_network_config/static_routes: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/static_routes | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_network_config/static_routes: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_network_config/static_routes: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_network_config_static_routes_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_network_config/static_routes | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_static_routes_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Configure static routes on L3Out logical nodes
      cisco.aci.aci_l3out_static_routes:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        l3out: "{{ item.l3out_name | default('L3Out-Core-Routing') }}"
        node_profile: "{{ item.node_profile | default('NodeProfile-Core') }}"
        pod_id: "{{ item.node_dn | regex_replace('topology/pod-(\\d+)/.*', '\\1') }}"
        node_id: "{{ item.node_dn | regex_replace('topology/pod-\\d+/node-(\\d+)', '\\1') }}"
        prefix: "{{ item.prefix }}"
        description: "{{ item.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_static_routes }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.vrf }} node {{ item.node_dn }} prefix {{ item.prefix }}"
      register: static_route_results
      tags:
        - aci
        - network
        - routing
        - static_routes
        - phase3

    - name: PHASE 3 - Configure static route next-hops
      cisco.aci.aci_l3out_static_routes_nexthop:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        l3out: "{{ item.0.l3out_name | default('L3Out-Core-Routing') }}"
        node_profile: "{{ item.0.node_profile | default('NodeProfile-Core') }}"
        pod_id: "{{ item.0.node_dn | regex_replace('topology/pod-(\\d+)/.*', '\\1') }}"
        node_id: "{{ item.0.node_dn | regex_replace('topology/pod-\\d+/node-(\\d+)', '\\1') }}"
        prefix: "{{ item.0.prefix }}"
        nexthop: "{{ item.1.next_hop }}"
        preference: "{{ item.1.preference | default(1) }}"
        description: "{{ item.1.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_static_routes | subelements('next_hops') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.prefix }} -> {{ item.1.next_hop }} (pref {{ item.1.preference | default(1) }})"
      register: nexthop_results
      tags:
        - aci
        - network
        - routing
        - static_routes
        - phase3

    - name: PHASE 3 - Display static route configuration summary
      ansible.builtin.debug:
        msg:
          - "=== Static Route Configuration Summary ==="
          - "Routes configured:   {{ aci_static_routes | length }}"
          - "Total next-hops:     {{ aci_static_routes | map(attribute='next_hops') | map('length') | sum }}"
          - "Apply changes:       {{ apply_changes | bool }}"
      tags:
        - aci
        - network
        - routing
        - static_routes
        - phase3

    - name: PHASE 3 - Save static routes configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_static_routes.json"
        mode: "0640"
        content: "{{ static_route_artifact | to_nice_json }}"
      vars:
        static_route_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          route_count: "{{ aci_static_routes | length }}"
          nexthop_count: "{{ aci_static_routes | map(attribute='next_hops') | map('length') | sum }}"
          routes: "{{ aci_static_routes | map(attribute='prefix') | list }}"
          tenants_configured: "{{ aci_static_routes | map(attribute='tenant') | unique | list }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - network
        - routing
        - static_routes
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_network_config/static_routes | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_network_config_static_routes_preflight_passed | bool
          - fe_cisco_aci_network_config_static_routes_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_network_config/static_routes: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_network_config_static_routes_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_network_config_static_routes_status | default('unknown') }}.
        success_msg: "cisco/aci_network_config/static_routes: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_network_config/static_routes | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_static_routes_postflight_passed: true
        fe_cisco_aci_network_config_static_routes_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_network_config/static_routes | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_static_routes_status: "failed"
        fe_cisco_aci_network_config_static_routes_postflight_passed: false
        fe_cisco_aci_network_config_static_routes_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_network_config_static_routes_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/static_routes | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_network_config/static_routes: FAILED at '{{ fe_cisco_aci_network_config_static_routes_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_network_config_static_routes_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_network_config/static_routes | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_network_config/static_routes failed at '{{ fe_cisco_aci_network_config_static_routes_failed_task }}': {{ fe_cisco_aci_network_config_static_routes_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_network_config/static_routes | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_static_routes_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_network_config_static_routes_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_network_config_static_routes_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_network_config/static_routes | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_network_config/static_routes":
              component: "cisco/aci_network_config/static_routes"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_network_config_static_routes_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_network_config_static_routes_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_network_config_static_routes_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_network_config_static_routes_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_network_config_static_routes_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_network_config_static_routes_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_network_config_static_routes_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_network_config_static_routes_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_network_config_static_routes_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_network_config_static_routes_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_network_config_static_routes_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_network_config_static_routes_status | default('') == 'succeeded' else ['cisco/aci_network_config/static_routes'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_network_config/static_routes | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_network_config_static_routes_stats_published: true
      tags:
        - always
