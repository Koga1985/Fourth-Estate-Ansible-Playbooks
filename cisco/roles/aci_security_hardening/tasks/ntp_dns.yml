---
# tasks file for aci_security_hardening - NTP and DNS Configuration
# NIST 800-53 AU Controls - Audit Accountability (time synchronization)
# DoD STIG: CISC-ND-001290, CISC-ND-001420

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/ntp_dns']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_ntp_dns_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/ntp_dns | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_ntp_dns_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_ntp_dns_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_ntp_dns_status: "running"
    fe_cisco_aci_security_hardening_ntp_dns_preflight_passed: false
    fe_cisco_aci_security_hardening_ntp_dns_postflight_passed: false
    fe_cisco_aci_security_hardening_ntp_dns_failed_task: ""
    fe_cisco_aci_security_hardening_ntp_dns_error: ""
    fe_cisco_aci_security_hardening_ntp_dns_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/ntp_dns | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/ntp_dns | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/ntp_dns: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/ntp_dns: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/ntp_dns | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/ntp_dns: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/ntp_dns: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_ntp_dns_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/ntp_dns | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ntp_dns_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-ND-001290 - Create NTP policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/time-FourthEstateNTP.json
        method: post
        content:
          datetimePol:
            attributes:
              name: FourthEstateNTP
              descr: "Fourth Estate NTP Policy - DoD STIG CISC-ND-001290"
              adminSt: enabled
              authSt: "{{ 'enabled' if aci_ntp_authenticate | bool else 'disabled' }}"
              serverState: enabled
              masterMode: disabled
              dn: uni/fabric/time-FourthEstateNTP
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - stig_cat3
        - nist_au
        - ntp
        - nist_au_8

    - name: CISC-ND-001290 - Configure NTP servers
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: "/api/mo/uni/fabric/time-FourthEstateNTP/ntpprov-{{ item.name | replace('.', '_') }}.json"
        method: post
        content:
          datetimeNtpProv:
            attributes:
              name: "{{ item.name }}"
              preferred: "{{ item.preferred | default('no') }}"
              minPoll: "4"
              maxPoll: "6"
              trueChimer: false
              epgDn: uni/tn-mgmt/mgmtp-default/oob-default
              dn: "uni/fabric/time-FourthEstateNTP/ntpprov-{{ item.name | replace('.', '_') }}"
      no_log: true
      loop: "{{ aci_ntp_servers }}"
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - stig_cat3
        - nist_au
        - ntp
        - nist_au_8

    - name: CISC-ND-001420 - Configure NTP authentication key
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/time-FourthEstateNTP/key-1.json
        method: post
        content:
          datetimeKey:
            attributes:
              id: "1"
              key: "{{ aci_ntp_key }}"
              authType: sha1
              trusted: "yes"
              dn: uni/fabric/time-FourthEstateNTP/key-1
      when:
        - apply_changes | bool
        - aci_ntp_authenticate | bool
      no_log: true
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_au
        - ntp
        - nist_au_8

    - name: CISC-ND-001290 - Apply NTP policy to fabric nodes
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/funcprof/grp-default.json
        method: post
        content:
          fabricFuncP:
            attributes:
              dn: uni/fabric/funcprof
            children:
              - fabricNodeBlk:
                  attributes:
                    name: default
                    from_: "101"
                    to_: "199"
              - datetimeRsNtpProvGrp:
                  attributes:
                    tnDatetimePol: FourthEstateNTP
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_au
        - ntp

    - name: CISC-ND-001290 - Query current NTP configuration (dry-run)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/class/datetimePol.json
        method: get
      no_log: true
      register: aci_ntp_policy_query
      when: not (apply_changes | bool)
      tags:
        - aci
        - security
        - ntp
        - query

    - name: DNS - Create DNS profile
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/dnsp-default.json
        method: post
        content:
          dnsProfile:
            attributes:
              name: default
              descr: "Fourth Estate DNS Configuration"
              IPVerPreference: IPv4
              dn: uni/fabric/dnsp-default
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - security
        - dns

    - name: DNS - Configure DNS servers
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: "/api/mo/uni/fabric/dnsp-default/prov-[{{ item }}].json"
        method: post
        content:
          dnsProv:
            attributes:
              addr: "{{ item }}"
              preferred: "{{ 'yes' if loop.index == 1 else 'no' }}"
              dn: "uni/fabric/dnsp-default/prov-[{{ item }}]"
      no_log: true
      loop: "{{ aci_dns_servers }}"
      loop_control:
        index_var: loop
      when: apply_changes | bool
      tags:
        - aci
        - security
        - dns

    - name: NTP/DNS - Save configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_ntp_dns_config.json"
        mode: '0640'
        content: |
          {
            "timestamp": "{{ ansible_date_time.iso8601 }}",
            "controls": ["CISC-ND-001290", "CISC-ND-001420"],
            "hostname": "{{ aci_host }}",
            "apply_changes": {{ apply_changes | bool | lower }},
            "ntp_config": {
              "policy_name": "FourthEstateNTP",
              "authentication_enabled": {{ aci_ntp_authenticate | bool | lower }},
              "servers": {{ aci_ntp_servers | to_json }}
            },
            "dns_config": {
              "servers": {{ aci_dns_servers | to_json }}
            },
            "stig_findings": [
              {
                "id": "CISC-ND-001290",
                "description": "NTP configured with DoD-approved servers",
                "severity": "CAT III",
                "nist": "AU-8",
                "status": "{{ 'Applied' if apply_changes | bool else 'Planned' }}"
              },
              {
                "id": "CISC-ND-001420",
                "description": "NTP authentication enabled",
                "severity": "CAT II",
                "nist": "AU-8(1)",
                "status": "{{ 'Applied' if apply_changes | bool and aci_ntp_authenticate | bool else 'Planned' if aci_ntp_authenticate | bool else 'Skipped' }}"
              }
            ]
          }
      tags:
        - aci
        - security
        - ntp
        - dns
        - artifact

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/ntp_dns | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_ntp_dns_preflight_passed | bool
          - fe_cisco_aci_security_hardening_ntp_dns_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/ntp_dns: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_ntp_dns_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_ntp_dns_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/ntp_dns: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/ntp_dns | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ntp_dns_postflight_passed: true
        fe_cisco_aci_security_hardening_ntp_dns_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/ntp_dns | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ntp_dns_status: "failed"
        fe_cisco_aci_security_hardening_ntp_dns_postflight_passed: false
        fe_cisco_aci_security_hardening_ntp_dns_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_ntp_dns_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/ntp_dns | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/ntp_dns: FAILED at '{{ fe_cisco_aci_security_hardening_ntp_dns_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_ntp_dns_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/ntp_dns | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/ntp_dns failed at '{{ fe_cisco_aci_security_hardening_ntp_dns_failed_task }}': {{ fe_cisco_aci_security_hardening_ntp_dns_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/ntp_dns | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ntp_dns_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_ntp_dns_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_ntp_dns_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/ntp_dns | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/ntp_dns":
              component: "cisco/aci_security_hardening/ntp_dns"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_ntp_dns_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_ntp_dns_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_ntp_dns_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_ntp_dns_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_ntp_dns_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_ntp_dns_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_ntp_dns_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_ntp_dns_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_ntp_dns_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_ntp_dns_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_ntp_dns_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_ntp_dns_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/ntp_dns'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/ntp_dns | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ntp_dns_stats_published: true
      tags:
        - always
