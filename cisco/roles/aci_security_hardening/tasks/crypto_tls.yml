---
# tasks file for aci_security_hardening - TLS and Cryptographic Controls
# DoD STIG CAT I - Enforce HTTPS/TLS 1.2+, disable HTTP/Telnet, configure SSH
# NIST SC-8, SC-28 | STIG CISC-ND-001440, CISC-ND-001400

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/crypto_tls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_crypto_tls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/crypto_tls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_crypto_tls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_crypto_tls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_crypto_tls_status: "running"
    fe_cisco_aci_security_hardening_crypto_tls_preflight_passed: false
    fe_cisco_aci_security_hardening_crypto_tls_postflight_passed: false
    fe_cisco_aci_security_hardening_crypto_tls_failed_task: ""
    fe_cisco_aci_security_hardening_crypto_tls_error: ""
    fe_cisco_aci_security_hardening_crypto_tls_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/crypto_tls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/crypto_tls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/crypto_tls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/crypto_tls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/crypto_tls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/crypto_tls: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/crypto_tls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_crypto_tls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/crypto_tls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_crypto_tls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 4 - CISC-ND-001440 - Disable HTTP, enforce HTTPS only
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/http.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commHttp:
            attributes:
              dn: uni/fabric/comm-default/http
              adminSt: "{{ 'disabled' if not aci_http_enabled else 'enabled' }}"
              port: "80"
      no_log: true
      register: http_disable_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    - name: PHASE 4 - CISC-ND-001440 - Enable HTTPS
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/https.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commHttps:
            attributes:
              dn: uni/fabric/comm-default/https
              adminSt: "{{ 'enabled' if aci_https_enabled else 'disabled' }}"
              port: "443"
              tlsProtocols: "{{ aci_min_tls_version }}"
              cipherSuite: "{{ aci_allowed_ciphers | join(',') }}"
              visibilityTimeout: "30"
              dhParamFlag: "no"
              keyRingName: "default"
              clientCertAuthState: "disabled"
      no_log: true
      register: https_enable_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    - name: PHASE 4 - CISC-ND-001440 - Configure minimum TLS version to TLS 1.2
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/https.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commHttps:
            attributes:
              dn: uni/fabric/comm-default/https
              tlsProtocols: "{{ aci_min_tls_version }}"
      no_log: true
      register: tls_version_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    - name: PHASE 4 - CISC-ND-001440 - Configure allowed TLS cipher suites
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/https.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commHttps:
            attributes:
              dn: uni/fabric/comm-default/https
              cipherSuite: "{{ aci_allowed_ciphers | join(',') }}"
      no_log: true
      register: cipher_suite_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    - name: PHASE 4 - CISC-ND-001400 - Disable Telnet, enforce SSH only
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/telnet.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commTelnet:
            attributes:
              dn: uni/fabric/comm-default/telnet
              adminSt: "{{ 'disabled' if not aci_telnet_enabled else 'enabled' }}"
              port: "23"
      no_log: true
      register: telnet_disable_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - ssh
        - phase4

    - name: PHASE 4 - CISC-ND-001400 - Enable SSH and configure SSH settings
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/ssh.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commSsh:
            attributes:
              dn: uni/fabric/comm-default/ssh
              adminSt: "{{ 'enabled' if aci_ssh_enabled else 'disabled' }}"
              port: "22"
              sshCiphers: "{{ aci_ssh_ciphers | join(',') }}"
              sshKexAlgos: "{{ aci_ssh_kex_algos | join(',') }}"
              sshMacs: "{{ aci_ssh_macs | join(',') }}"
      no_log: true
      register: ssh_config_result
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - ssh
        - phase4

    - name: PHASE 4 - Display crypto/TLS configuration summary
      ansible.builtin.debug:
        msg:
          - "=== STIG CAT I - Crypto/TLS Configuration ==="
          - "CISC-ND-001440 - HTTP disabled:     {{ not aci_http_enabled | bool }}"
          - "CISC-ND-001440 - HTTPS enabled:     {{ aci_https_enabled | bool }}"
          - "CISC-ND-001440 - Min TLS version:   {{ aci_min_tls_version }}"
          - "CISC-ND-001400 - Telnet disabled:   {{ not aci_telnet_enabled | bool }}"
          - "CISC-ND-001400 - SSH enabled:       {{ aci_ssh_enabled | bool }}"
          - "Cipher suites:                      {{ aci_allowed_ciphers | length }} configured"
          - "SSH ciphers:                        {{ aci_ssh_ciphers | length }} configured"
          - "Apply changes:                      {{ apply_changes | bool }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    - name: PHASE 4 - Save crypto/TLS configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_stig_crypto_tls.json"
        mode: "0640"
        content: "{{ crypto_artifact | to_nice_json }}"
      vars:
        crypto_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          stig_controls:
            - id: "CISC-ND-001440"
              description: "HTTP disabled, HTTPS enforced, TLS 1.2+ configured"
              http_disabled: "{{ not aci_http_enabled | bool }}"
              https_enabled: "{{ aci_https_enabled | bool }}"
              min_tls_version: "{{ aci_min_tls_version }}"
              cipher_count: "{{ aci_allowed_ciphers | length }}"
              status: "configured"
            - id: "CISC-ND-001400"
              description: "Telnet disabled, SSH enforced"
              telnet_disabled: "{{ not aci_telnet_enabled | bool }}"
              ssh_enabled: "{{ aci_ssh_enabled | bool }}"
              ssh_cipher_count: "{{ aci_ssh_ciphers | length }}"
              ssh_kex_count: "{{ aci_ssh_kex_algos | length }}"
              ssh_mac_count: "{{ aci_ssh_macs | length }}"
              status: "configured"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/crypto_tls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_crypto_tls_preflight_passed | bool
          - fe_cisco_aci_security_hardening_crypto_tls_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/crypto_tls: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_crypto_tls_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_crypto_tls_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/crypto_tls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/crypto_tls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_crypto_tls_postflight_passed: true
        fe_cisco_aci_security_hardening_crypto_tls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/crypto_tls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_crypto_tls_status: "failed"
        fe_cisco_aci_security_hardening_crypto_tls_postflight_passed: false
        fe_cisco_aci_security_hardening_crypto_tls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_crypto_tls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/crypto_tls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/crypto_tls: FAILED at '{{ fe_cisco_aci_security_hardening_crypto_tls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_crypto_tls_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/crypto_tls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/crypto_tls failed at '{{ fe_cisco_aci_security_hardening_crypto_tls_failed_task }}': {{ fe_cisco_aci_security_hardening_crypto_tls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/crypto_tls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_crypto_tls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_crypto_tls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_crypto_tls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/crypto_tls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/crypto_tls":
              component: "cisco/aci_security_hardening/crypto_tls"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_crypto_tls_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_crypto_tls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_crypto_tls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_crypto_tls_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_crypto_tls_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_crypto_tls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_crypto_tls_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_crypto_tls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_crypto_tls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_crypto_tls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_crypto_tls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_crypto_tls_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/crypto_tls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/crypto_tls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_crypto_tls_stats_published: true
      tags:
        - always
