---
# tasks file for aci_security_hardening - Compliance Report Generation
# Generates JSON and text STIG compliance artifacts for audit purposes
# NIST CA-7, CA-8 | Continuous monitoring and assessment

# ============================================================
# Collect current APIC security configuration for reporting
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/compliance_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_compliance_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/compliance_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_compliance_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_compliance_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_compliance_report_status: "running"
    fe_cisco_aci_security_hardening_compliance_report_preflight_passed: false
    fe_cisco_aci_security_hardening_compliance_report_postflight_passed: false
    fe_cisco_aci_security_hardening_compliance_report_failed_task: ""
    fe_cisco_aci_security_hardening_compliance_report_error: ""
    fe_cisco_aci_security_hardening_compliance_report_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/compliance_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/compliance_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/compliance_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/compliance_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/compliance_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/compliance_report: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/compliance_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_compliance_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/compliance_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_compliance_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query current APIC password policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/userext/pwdprofile.json
        method: get
      no_log: true
      register: query_pwd_policy
      failed_when: false

    - name: Query current APIC login domain
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/userext.json
        method: get
      no_log: true
      register: query_userext
      failed_when: false

    - name: Query current SNMP policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: get
      no_log: true
      register: query_snmp_policy
      failed_when: false

    - name: Query current faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/class/faultInst.json?query-target-filter=eq(faultInst.severity,"critical")&page-size=10
        method: get
      no_log: true
      register: query_critical_faults
      failed_when: false

    # ============================================================
    # Generate JSON compliance report artifact
    # ============================================================

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Generate STIG compliance report (JSON)
      ansible.builtin.copy:
        content: "{{ compliance_report | to_nice_json }}"
        dest: "{{ artifacts_dir }}/aci_stig_compliance_report.json"
        mode: '0640'
      vars:
        compliance_report:
          metadata:
            report_type: "DoD STIG Compliance Report"
            timestamp: "{{ ansible_date_time.iso8601 }}"
            apic_host: "{{ aci_host }}"
            mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
            frameworks:
              - "dod_stig"
              - "nist_800_53"
              - "nist_800_171"
          stig_controls:
            cat1_high:
              - id: "CISC-ND-001440"
                description: "Enforce HTTPS, disable HTTP"
                enabled: "{{ enable_crypto_tls | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000530"
                description: "Password encryption and strength policy"
                enabled: "{{ enable_auth_hardening | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  min_length: "{{ aci_password_min_length }}"
                  history_count: "{{ aci_password_history_count }}"
                  expiry_days: "{{ aci_password_expiry_days }}"
              - id: "CISC-ND-000570"
                description: "Minimum password length 15 characters"
                enabled: "{{ enable_auth_hardening | bool }}"
                compliant: "{{ aci_password_min_length | int >= 15 }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001190"
                description: "Centralized authentication (LDAP/RADIUS/TACACS+)"
                enabled: "{{ enable_auth_hardening | bool }}"
                auth_type: "{{ aci_auth_realm_type }}"
                applied: "{{ apply_changes | bool }}"
            cat2_medium:
              - id: "CISC-ND-000370"
                description: "Account lockout after 3 consecutive failures"
                enabled: "{{ enable_auth_hardening | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  max_attempts: "{{ aci_lockout_max_attempts }}"
                  lockout_duration_seconds: "{{ aci_lockout_duration_seconds }}"
              - id: "CISC-ND-000390"
                description: "Session idle timeout (10 minutes max)"
                enabled: "{{ enable_session_management | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  idle_timeout_seconds: "{{ aci_idle_timeout }}"
                  session_timeout_seconds: "{{ aci_session_timeout }}"
                  compliant: "{{ aci_idle_timeout | int <= 600 }}"
              - id: "CISC-ND-000360"
                description: "Concurrent session limits"
                enabled: "{{ enable_session_management | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  max_concurrent_sessions: "{{ aci_max_concurrent_sessions }}"
              - id: "CISC-ND-000700"
                description: "Comprehensive audit logging with timestamps"
                enabled: "{{ enable_audit_logging | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000090"
                description: "SNMPv3 required, disable SNMPv1/v2"
                enabled: "{{ enable_snmp_security | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  v1_disabled: "{{ not aci_snmp_v1_enabled | bool }}"
                  v2_disabled: "{{ not aci_snmp_v2_enabled | bool }}"
                  v3_enabled: "{{ aci_snmp_v3_enabled | bool }}"
              - id: "CISC-ND-001400"
                description: "SSH enforcement, Telnet disabled"
                enabled: "{{ enable_crypto_tls | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  ssh_enabled: "{{ aci_ssh_enabled | bool }}"
                  telnet_disabled: "{{ not aci_telnet_enabled | bool }}"
              - id: "CISC-ND-001420"
                description: "NTP with authentication"
                enabled: "{{ enable_ntp_dns | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  ntp_auth_enabled: "{{ aci_ntp_authenticate | bool }}"
            cat3_low:
              - id: "CISC-ND-000080"
                description: "DoD mandatory login banner"
                enabled: "{{ enable_banners | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001290"
                description: "NTP configuration"
                enabled: "{{ enable_ntp_dns | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001470"
                description: "System contact and location"
                enabled: "{{ enable_banners | bool }}"
                applied: "{{ apply_changes | bool }}"
                settings:
                  system_contact: "{{ aci_system_contact }}"
                  system_location: "{{ aci_system_location }}"
          critical_faults: "{{ query_critical_faults.imdata | default([]) | length }}"

    - name: Generate STIG compliance summary (text)
      ansible.builtin.copy:
        content: |
          ================================================================
           ACI DoD STIG Compliance Summary — Fourth Estate
          ================================================================
           Report Date:  {{ ansible_date_time.date }}
           APIC Host:    {{ aci_host }}
           Mode:         {{ 'CHANGES APPLIED' if apply_changes | bool else 'DRY RUN - no changes made' }}
          ----------------------------------------------------------------
           STIG Categories:
             CAT I  (High):   {{ 'ENABLED' if stig_cat1_enabled | bool else 'DISABLED' }}
             CAT II (Medium): {{ 'ENABLED' if stig_cat2_enabled | bool else 'DISABLED' }}
             CAT III (Low):   {{ 'ENABLED' if stig_cat3_enabled | bool else 'DISABLED' }}
          ----------------------------------------------------------------
           CAT I Controls (High Severity):
             CISC-ND-001440  HTTPS enforced / HTTP disabled:    {{ 'YES' if enable_crypto_tls | bool else 'SKIPPED' }}
             CISC-ND-000530  Password strength policy:          {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
             CISC-ND-000570  Min password length (15 chars):    {{ 'COMPLIANT' if aci_password_min_length | int >= 15 else 'NON-COMPLIANT' }} ({{ aci_password_min_length }} chars)
             CISC-ND-001190  Centralized auth ({{ aci_auth_realm_type }}):   {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
          ----------------------------------------------------------------
           CAT II Controls (Medium Severity):
             CISC-ND-000370  Account lockout ({{ aci_lockout_max_attempts }} attempts):    {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
             CISC-ND-000390  Session idle timeout ({{ aci_idle_timeout }}s):  {{ 'COMPLIANT' if aci_idle_timeout | int <= 600 else 'NON-COMPLIANT' }}
             CISC-ND-000360  Concurrent session limit ({{ aci_max_concurrent_sessions }}): {{ 'YES' if enable_session_management | bool else 'SKIPPED' }}
             CISC-ND-000700  Audit logging:                     {{ 'YES' if enable_audit_logging | bool else 'SKIPPED' }}
             CISC-ND-000090  SNMPv3 (v1/v2 disabled):          {{ 'YES' if enable_snmp_security | bool else 'SKIPPED' }}
             CISC-ND-001400  SSH enforced / Telnet disabled:    {{ 'YES' if enable_crypto_tls | bool else 'SKIPPED' }}
             CISC-ND-001420  NTP with authentication:           {{ 'YES' if enable_ntp_dns | bool else 'SKIPPED' }}
          ----------------------------------------------------------------
           CAT III Controls (Low Severity):
             CISC-ND-000080  DoD login banner:                  {{ 'YES' if enable_banners | bool else 'SKIPPED' }}
             CISC-ND-001290  NTP configured:                    {{ 'YES' if enable_ntp_dns | bool else 'SKIPPED' }}
             CISC-ND-001470  System contact/location:           {{ 'YES' if enable_banners | bool else 'SKIPPED' }}
          ----------------------------------------------------------------
           Critical Faults at time of report: {{ query_critical_faults.imdata | default([]) | length }}
          ================================================================
           Full report: {{ artifacts_dir }}/aci_stig_compliance_report.json
          ================================================================
        dest: "{{ artifacts_dir }}/aci_stig_compliance_summary.txt"
        mode: '0640'

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          - "STIG compliance report generated:"
          - "  JSON: {{ artifacts_dir }}/aci_stig_compliance_report.json"
          - "  Text: {{ artifacts_dir }}/aci_stig_compliance_summary.txt"
          - "  Mode: {{ 'CHANGES APPLIED' if apply_changes | bool else 'DRY RUN' }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/compliance_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_compliance_report_preflight_passed | bool
          - fe_cisco_aci_security_hardening_compliance_report_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/compliance_report: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_compliance_report_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_compliance_report_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/compliance_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/compliance_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_compliance_report_postflight_passed: true
        fe_cisco_aci_security_hardening_compliance_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/compliance_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_compliance_report_status: "failed"
        fe_cisco_aci_security_hardening_compliance_report_postflight_passed: false
        fe_cisco_aci_security_hardening_compliance_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_compliance_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/compliance_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/compliance_report: FAILED at '{{ fe_cisco_aci_security_hardening_compliance_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_compliance_report_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/compliance_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/compliance_report failed at '{{ fe_cisco_aci_security_hardening_compliance_report_failed_task }}': {{ fe_cisco_aci_security_hardening_compliance_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/compliance_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_compliance_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_compliance_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_compliance_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/compliance_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/compliance_report":
              component: "cisco/aci_security_hardening/compliance_report"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_compliance_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_compliance_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_compliance_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_compliance_report_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_compliance_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_compliance_report_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_compliance_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_compliance_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_compliance_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_compliance_report_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/compliance_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/compliance_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_compliance_report_stats_published: true
      tags:
        - always
