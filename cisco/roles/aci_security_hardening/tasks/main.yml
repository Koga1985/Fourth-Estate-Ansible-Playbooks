---
# tasks file for aci_security_hardening
# Cisco ACI Security Hardening - DoD STIG and NIST 800-53 compliance

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_status: "running"
    fe_cisco_aci_security_hardening_preflight_passed: false
    fe_cisco_aci_security_hardening_postflight_passed: false
    fe_cisco_aci_security_hardening_failed_task: ""
    fe_cisco_aci_security_hardening_error: ""
    fe_cisco_aci_security_hardening_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include prerequisites validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
      tags:
        - always
        - prerequisites

    # ============================================================
    # STIG CAT I - Authentication Hardening
    # NIST IA-2, IA-5 | CISC-ND-001190, CISC-ND-000530, CISC-ND-000570
    # ============================================================
    - name: STIG CAT I - Authentication hardening
      ansible.builtin.include_tasks:
        file: authentication.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat1
            - nist_ia
            - authentication
            - phase4
      when: enable_auth_hardening | bool and stig_cat1_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_ia
        - authentication
        - phase4

    # ============================================================
    # STIG CAT I - TLS/Cryptographic Controls
    # NIST SC-8, SC-28 | CISC-ND-001440, CISC-ND-001400
    # ============================================================
    - name: STIG CAT I - TLS/Cryptographic controls
      ansible.builtin.include_tasks:
        file: crypto_tls.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat1
            - nist_sc
            - crypto
            - tls
            - phase4
      when: enable_crypto_tls | bool and stig_cat1_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat1
        - nist_sc
        - crypto
        - tls
        - phase4

    # ============================================================
    # STIG CAT II - Access Control and RBAC
    # NIST AC-2, AC-3, AC-6, AC-7 | CISC-ND-000370, CISC-ND-000360
    # ============================================================
    - name: STIG CAT II - Access control and RBAC
      ansible.builtin.include_tasks:
        file: access_control.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat2
            - nist_ac
            - rbac
            - phase4
      when: enable_access_control | bool and stig_cat2_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    # ============================================================
    # STIG CAT II - Session Management
    # NIST AC-11, AC-12 | CISC-ND-000390
    # ============================================================
    - name: STIG CAT II - Session management
      ansible.builtin.include_tasks:
        file: session_management.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat2
            - nist_ac
            - sessions
            - phase4
      when: enable_session_management | bool and stig_cat2_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    # ============================================================
    # STIG CAT II - Audit Logging
    # NIST AU-2, AU-3, AU-9, AU-12 | CISC-ND-000700, CISC-ND-000710, CISC-ND-000720
    # ============================================================
    - name: STIG CAT II - Audit logging
      ansible.builtin.include_tasks:
        file: audit_logging.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat2
            - nist_au
            - audit
            - logging
            - phase4
      when: enable_audit_logging | bool and stig_cat2_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_au
        - audit
        - logging
        - phase4

    # ============================================================
    # STIG CAT II - SNMP Security (SNMPv3 required)
    # NIST SC-8 | CISC-ND-000090
    # ============================================================
    - name: STIG CAT II - SNMP security (SNMPv3)
      ansible.builtin.include_tasks:
        file: snmp_security.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat2
            - nist_sc
            - snmp
            - phase4
      when: enable_snmp_security | bool and stig_cat2_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_sc
        - snmp
        - phase4

    # ============================================================
    # STIG CAT II/III - NTP and DNS Configuration
    # NIST AU-8 | CISC-ND-001290, CISC-ND-001420
    # ============================================================
    - name: STIG CAT II - NTP and DNS configuration
      ansible.builtin.include_tasks:
        file: ntp_dns.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat2
            - nist_au
            - ntp
            - dns
            - phase4
      when: enable_ntp_dns | bool and stig_cat2_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_au
        - ntp
        - dns
        - phase4

    # ============================================================
    # STIG CAT III - DoD Login Banner
    # NIST AC-8 | CISC-ND-000080
    # ============================================================
    - name: STIG CAT III - DoD login banner
      ansible.builtin.include_tasks:
        file: banners.yml
        apply:
          tags:
            - aci
            - security
            - stig
            - stig_cat3
            - nist_ac
            - banners
            - phase4
      when: enable_banners | bool and stig_cat3_enabled | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat3
        - nist_ac
        - banners
        - phase4

    # ============================================================
    # Compliance Report Generation (always generates when enabled)
    # ============================================================
    - name: Generate compliance report
      ansible.builtin.include_tasks:
        file: compliance_report.yml
        apply:
          tags:
            - aci
            - security
            - compliance
            - report
            - artifact
            - always
      when: enable_compliance_report | bool
      tags:
        - aci
        - security
        - compliance
        - report
        - artifact
        - always

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_preflight_passed | bool
          - fe_cisco_aci_security_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_postflight_passed: true
        fe_cisco_aci_security_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_status: "failed"
        fe_cisco_aci_security_hardening_postflight_passed: false
        fe_cisco_aci_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening: FAILED at '{{ fe_cisco_aci_security_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening failed at '{{ fe_cisco_aci_security_hardening_failed_task }}': {{ fe_cisco_aci_security_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening":
              component: "cisco/aci_security_hardening"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_status | default('') == 'succeeded' else ['cisco/aci_security_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_stats_published: true
      tags:
        - always
