---
# tasks file for aci_security_hardening - Access Control and RBAC
# DoD STIG CAT II - Account lockout, concurrent sessions, security domains, RBAC
# NIST AC-2, AC-3, AC-6, AC-7 | STIG CISC-ND-000370, CISC-ND-000360

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/access_control']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_access_control_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/access_control | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_access_control_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_access_control_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_access_control_status: "running"
    fe_cisco_aci_security_hardening_access_control_preflight_passed: false
    fe_cisco_aci_security_hardening_access_control_postflight_passed: false
    fe_cisco_aci_security_hardening_access_control_failed_task: ""
    fe_cisco_aci_security_hardening_access_control_error: ""
    fe_cisco_aci_security_hardening_access_control_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/access_control | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/access_control | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/access_control: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/access_control: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/access_control | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/access_control: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/access_control: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_access_control_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/access_control | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_access_control_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 4 - CISC-ND-000370 - Configure account lockout after {{ aci_lockout_max_attempts }} failed attempts
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/userext.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaUserEp:
            attributes:
              dn: uni/userext
              blockDuration: "{{ aci_lockout_duration_seconds | string }}"
              enableLoginBlock: "{{ 'enable' if aci_lockout_enabled else 'disable' }}"
              maxFailedAttempts: "{{ aci_lockout_max_attempts | string }}"
              maxFailedAttemptsWindow: "{{ aci_lockout_window_seconds | string }}"
      no_log: true
      register: lockout_config_result
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - CISC-ND-000360 - Set maximum concurrent sessions to {{ aci_max_concurrent_sessions }}
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/userext.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaUserEp:
            attributes:
              dn: uni/userext
              maxSessions: "{{ aci_max_concurrent_sessions | string }}"
      no_log: true
      register: max_sessions_result
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - Configure security domains
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/userext/domain-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaDomain:
            attributes:
              dn: "uni/userext/domain-{{ item.name }}"
              name: "{{ item.name }}"
              descr: "{{ item.description | default('') }}"
      no_log: true
      loop: "{{ aci_security_domains }}"
      loop_control:
        label: "Security domain {{ item.name }}"
      register: security_domain_results
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - Configure local service accounts (break-glass and automation only)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/userext/user-{{ item.username }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaUser:
            attributes:
              dn: "uni/userext/user-{{ item.username }}"
              name: "{{ item.username }}"
              descr: "{{ item.description | default('') }}"
              email: "{{ item.email | default('') }}"
              firstName: "{{ item.first_name | default('') }}"
              lastName: "{{ item.last_name | default('') }}"
              phone: "{{ item.phone | default('') }}"
              expiration: "{{ item.expiry | default('never') }}"
              accountStatus: "active"
              clearPwdHistory: "no"
              pwdUpdateRequired: "yes"
      no_log: true
      loop: "{{ aci_local_users }}"
      loop_control:
        label: "Local user {{ item.username }}"
      register: local_user_results
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - Assign roles to local service accounts
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/userext/user-{{ item.0.username }}/role-{{ item.1.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaUserRole:
            attributes:
              dn: "uni/userext/user-{{ item.0.username }}/role-{{ item.1.name }}"
              name: "{{ item.1.name }}"
              privType: "{{ item.1.priv_type | default('writePriv') }}"
      no_log: true
      loop: "{{ aci_local_users | subelements('roles') }}"
      loop_control:
        label: "{{ item.0.username }} role {{ item.1.name }}"
      register: user_role_results
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - Display access control configuration summary
      ansible.builtin.debug:
        msg:
          - "=== STIG CAT II - Access Control Configuration ==="
          - "CISC-ND-000370 - Account lockout:   {{ aci_lockout_enabled }} ({{ aci_lockout_max_attempts }} attempts)"
          - "CISC-ND-000370 - Lockout duration:  {{ aci_lockout_duration_seconds }} seconds"
          - "CISC-ND-000360 - Max sessions:      {{ aci_max_concurrent_sessions }}"
          - "Security domains:                   {{ aci_security_domains | length }} configured"
          - "Local service accounts:             {{ aci_local_users | length }} configured"
          - "Apply changes:                      {{ apply_changes | bool }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    - name: PHASE 4 - Save access control configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_stig_access_control.json"
        mode: "0640"
        content: "{{ ac_artifact | to_nice_json }}"
      vars:
        ac_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          stig_controls:
            - id: "CISC-ND-000370"
              description: "Account lockout configured"
              lockout_enabled: "{{ aci_lockout_enabled | bool }}"
              max_attempts: "{{ aci_lockout_max_attempts }}"
              lockout_window_seconds: "{{ aci_lockout_window_seconds }}"
              lockout_duration_seconds: "{{ aci_lockout_duration_seconds }}"
              status: "configured"
            - id: "CISC-ND-000360"
              description: "Maximum concurrent sessions configured"
              max_sessions: "{{ aci_max_concurrent_sessions }}"
              status: "configured"
          security_domains: "{{ aci_security_domains | map(attribute='name') | list }}"
          local_accounts: "{{ aci_local_users | map(attribute='username') | list }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - rbac
        - phase4

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/access_control | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_access_control_preflight_passed | bool
          - fe_cisco_aci_security_hardening_access_control_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/access_control: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_access_control_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_access_control_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/access_control: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/access_control | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_access_control_postflight_passed: true
        fe_cisco_aci_security_hardening_access_control_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/access_control | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_access_control_status: "failed"
        fe_cisco_aci_security_hardening_access_control_postflight_passed: false
        fe_cisco_aci_security_hardening_access_control_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_access_control_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/access_control | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/access_control: FAILED at '{{ fe_cisco_aci_security_hardening_access_control_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_access_control_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/access_control | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/access_control failed at '{{ fe_cisco_aci_security_hardening_access_control_failed_task }}': {{ fe_cisco_aci_security_hardening_access_control_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/access_control | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_access_control_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_access_control_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_access_control_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/access_control | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/access_control":
              component: "cisco/aci_security_hardening/access_control"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_access_control_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_access_control_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_access_control_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_access_control_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_access_control_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_access_control_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_access_control_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_access_control_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_access_control_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_access_control_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_access_control_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_access_control_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/access_control'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/access_control | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_access_control_stats_published: true
      tags:
        - always
