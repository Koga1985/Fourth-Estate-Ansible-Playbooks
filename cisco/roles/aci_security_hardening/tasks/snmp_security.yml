---
# tasks file for aci_security_hardening - SNMP Security Configuration
# NIST 800-53 SC Controls - System and Communications Protection
# DoD STIG: CISC-ND-000090

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/snmp_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_snmp_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/snmp_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_snmp_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_snmp_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_snmp_security_status: "running"
    fe_cisco_aci_security_hardening_snmp_security_preflight_passed: false
    fe_cisco_aci_security_hardening_snmp_security_postflight_passed: false
    fe_cisco_aci_security_hardening_snmp_security_failed_task: ""
    fe_cisco_aci_security_hardening_snmp_security_error: ""
    fe_cisco_aci_security_hardening_snmp_security_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/snmp_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/snmp_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/snmp_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/snmp_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/snmp_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/snmp_security: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/snmp_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_snmp_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/snmp_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_snmp_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-ND-000090 - Configure SNMP policy (disable v1/v2, enable v3)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: post
        content:
          snmpPol:
            attributes:
              name: default
              descr: "Fourth Estate SNMP Policy - SNMPv3 Required - DoD STIG CISC-ND-000090"
              adminSt: enabled
              dn: uni/fabric/snmppol-default
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_sc
        - snmp
        - nist_sc_8

    - name: CISC-ND-000090 - Configure SNMPv3 user authentication
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: "/api/mo/uni/fabric/snmppol-default/user-{{ item.username }}.json"
        method: post
        content:
          snmpUserP:
            attributes:
              name: "{{ item.username }}"
              descr: "SNMPv3 user - CISC-ND-000090 compliance"
              privType: "{{ item.priv_type | default('aes-128') }}"
              privKey: "{{ item.priv_password }}"
              authType: "{{ item.auth_type | default('hmac-sha1-96') }}"
              authKey: "{{ item.auth_password }}"
              dn: "uni/fabric/snmppol-default/user-{{ item.username }}"
      loop: "{{ aci_snmp_v3_users | default([]) }}"
      when:
        - apply_changes | bool
        - aci_snmp_v3_enabled | bool
      no_log: true
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_sc
        - snmp
        - nist_sc_8

    - name: CISC-ND-000090 - Query current SNMP configuration (dry-run)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: get
      no_log: true
      register: aci_snmp_policy_query
      when: not (apply_changes | bool)
      tags:
        - aci
        - security
        - snmp
        - query

    - name: CISC-ND-000090 - Configure SNMP trap destinations
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: "/api/mo/uni/fabric/snmppol-default/trap-{{ item.host }}.json"
        method: post
        content:
          snmpTrapFwdServerP:
            attributes:
              addr: "{{ item.host }}"
              port: "{{ item.port | default('162') }}"
              dn: "uni/fabric/snmppol-default/trap-{{ item.host }}"
      no_log: true
      loop: "{{ aci_snmp_trap_destinations | default([]) }}"
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_sc
        - snmp

    - name: CISC-ND-000090 - Apply SNMP policy to fabric monitoring
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_validate_certs }}"
        use_ssl: "{{ aci_https_enabled }}"
        path: /api/mo/uni/fabric/moncommon/snmpsrc-default.json
        method: post
        content:
          snmpSrc:
            attributes:
              name: default
              descr: "NIST SC-8 - SNMP monitoring source"
              dn: uni/fabric/moncommon/snmpsrc-default
            children:
              - snmpRsDestGroup:
                  attributes:
                    tnSnmpGroupName: default
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_sc
        - snmp

    - name: SNMP - Save SNMP security configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_snmp_security_config.json"
        mode: '0640'
        content: |
          {
            "timestamp": "{{ ansible_date_time.iso8601 }}",
            "control": "DoD STIG CISC-ND-000090 / NIST SC-8",
            "hostname": "{{ aci_host }}",
            "apply_changes": {{ apply_changes | bool | lower }},
            "snmp_config": {
              "v1_enabled": {{ aci_snmp_v1_enabled | bool | lower }},
              "v2_enabled": {{ aci_snmp_v2_enabled | bool | lower }},
              "v3_enabled": {{ aci_snmp_v3_enabled | bool | lower }},
              "v3_user_count": {{ aci_snmp_v3_users | default([]) | length }},
              "trap_destination_count": {{ aci_snmp_trap_destinations | default([]) | length }}
            },
            "stig_finding": {
              "id": "CISC-ND-000090",
              "description": "SNMPv3 required - v1/v2 disabled",
              "severity": "CAT II",
              "nist_control": "SC-8",
              "status": "{{ 'Applied' if apply_changes | bool else 'Planned' }}"
            }
          }
      tags:
        - aci
        - security
        - snmp
        - artifact

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/snmp_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_snmp_security_preflight_passed | bool
          - fe_cisco_aci_security_hardening_snmp_security_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/snmp_security: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_snmp_security_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_snmp_security_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/snmp_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/snmp_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_snmp_security_postflight_passed: true
        fe_cisco_aci_security_hardening_snmp_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/snmp_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_snmp_security_status: "failed"
        fe_cisco_aci_security_hardening_snmp_security_postflight_passed: false
        fe_cisco_aci_security_hardening_snmp_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_snmp_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/snmp_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/snmp_security: FAILED at '{{ fe_cisco_aci_security_hardening_snmp_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_snmp_security_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/snmp_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/snmp_security failed at '{{ fe_cisco_aci_security_hardening_snmp_security_failed_task }}': {{ fe_cisco_aci_security_hardening_snmp_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/snmp_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_snmp_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_snmp_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_snmp_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/snmp_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/snmp_security":
              component: "cisco/aci_security_hardening/snmp_security"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_snmp_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_snmp_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_snmp_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_snmp_security_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_snmp_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_snmp_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_snmp_security_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_snmp_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_snmp_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_snmp_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_snmp_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_snmp_security_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/snmp_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/snmp_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_snmp_security_stats_published: true
      tags:
        - always
