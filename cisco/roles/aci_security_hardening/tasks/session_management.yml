---
# tasks file for aci_security_hardening - Session Management
# DoD STIG CAT II - Session idle timeout and maximum session duration
# NIST AC-11, AC-12 | STIG CISC-ND-000390

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_security_hardening/session_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_security_hardening_session_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_security_hardening/session_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_security_hardening_session_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_security_hardening_session_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_security_hardening_session_management_status: "running"
    fe_cisco_aci_security_hardening_session_management_preflight_passed: false
    fe_cisco_aci_security_hardening_session_management_postflight_passed: false
    fe_cisco_aci_security_hardening_session_management_failed_task: ""
    fe_cisco_aci_security_hardening_session_management_error: ""
    fe_cisco_aci_security_hardening_session_management_stats_published: false
  tags:
    - always

- name: "cisco/aci_security_hardening/session_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_security_hardening/session_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_security_hardening/session_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_security_hardening/session_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/session_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_security_hardening/session_management: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_security_hardening/session_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_security_hardening_session_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_security_hardening/session_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_session_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 4 - CISC-ND-000390 - Set session idle timeout to {{ aci_idle_timeout }} seconds
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commPol:
            attributes:
              dn: uni/fabric/comm-default
              name: "default"
      no_log: true
      register: session_idle_check
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    - name: PHASE 4 - CISC-ND-000390 - Configure HTTPS session timeout ({{ aci_session_timeout }} seconds)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/https.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commHttps:
            attributes:
              dn: uni/fabric/comm-default/https
              visibilityTimeout: "{{ (aci_session_timeout / 60) | int | string }}"
      no_log: true
      register: https_session_timeout_result
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    - name: PHASE 4 - CISC-ND-000390 - Configure web UI session idle timeout ({{ aci_idle_timeout }} seconds)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/userext.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          aaaUserEp:
            attributes:
              dn: uni/userext
              pwdStrengthCheck: "yes"
              sessionRecordFlags: "login,logout,refresh"
      no_log: true
      register: web_session_timeout_result
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    - name: PHASE 4 - CISC-ND-000390 - Configure CLI SSH session timeout
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/comm-default/ssh.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          commSsh:
            attributes:
              dn: uni/fabric/comm-default/ssh
              adminSt: "enabled"
      no_log: true
      register: ssh_session_timeout_result
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    - name: PHASE 4 - Display session management configuration summary
      ansible.builtin.debug:
        msg:
          - "=== STIG CAT II - Session Management Configuration ==="
          - "CISC-ND-000390 - Session timeout:  {{ aci_session_timeout }} seconds ({{ (aci_session_timeout / 60) | int }} min)"
          - "CISC-ND-000390 - Idle timeout:     {{ aci_idle_timeout }} seconds ({{ (aci_idle_timeout / 60) | int }} min)"
          - "CISC-ND-000360 - Max sessions:     {{ aci_max_concurrent_sessions }}"
          - "Apply changes:                     {{ apply_changes | bool }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    - name: PHASE 4 - Save session management configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_stig_session_management.json"
        mode: "0640"
        content: "{{ session_artifact | to_nice_json }}"
      vars:
        session_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          stig_controls:
            - id: "CISC-ND-000390"
              description: "Session timeout configured"
              session_timeout_seconds: "{{ aci_session_timeout }}"
              idle_timeout_seconds: "{{ aci_idle_timeout }}"
              max_concurrent_sessions: "{{ aci_max_concurrent_sessions }}"
              status: "configured"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - aci
        - security
        - stig
        - stig_cat2
        - nist_ac
        - sessions
        - phase4

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_security_hardening/session_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_security_hardening_session_management_preflight_passed | bool
          - fe_cisco_aci_security_hardening_session_management_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_security_hardening/session_management: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_security_hardening_session_management_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_security_hardening_session_management_status | default('unknown') }}.
        success_msg: "cisco/aci_security_hardening/session_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_security_hardening/session_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_session_management_postflight_passed: true
        fe_cisco_aci_security_hardening_session_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_security_hardening/session_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_session_management_status: "failed"
        fe_cisco_aci_security_hardening_session_management_postflight_passed: false
        fe_cisco_aci_security_hardening_session_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_security_hardening_session_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/session_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_security_hardening/session_management: FAILED at '{{ fe_cisco_aci_security_hardening_session_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_security_hardening_session_management_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_security_hardening/session_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_security_hardening/session_management failed at '{{ fe_cisco_aci_security_hardening_session_management_failed_task }}': {{ fe_cisco_aci_security_hardening_session_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_security_hardening/session_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_session_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_security_hardening_session_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_security_hardening_session_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_security_hardening/session_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_security_hardening/session_management":
              component: "cisco/aci_security_hardening/session_management"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_security_hardening_session_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_security_hardening_session_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_security_hardening_session_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_security_hardening_session_management_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_security_hardening_session_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_security_hardening_session_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_security_hardening_session_management_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_security_hardening_session_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_security_hardening_session_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_security_hardening_session_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_security_hardening_session_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_security_hardening_session_management_status | default('') == 'succeeded' else ['cisco/aci_security_hardening/session_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_security_hardening/session_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_security_hardening_session_management_stats_published: true
      tags:
        - always
