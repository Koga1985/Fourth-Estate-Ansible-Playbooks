---
# tasks file for ucs_prod_monitoring
# Cisco UCS Production Monitoring and Compliance

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_monitoring_status: "running"
    fe_cisco_ucs_prod_monitoring_preflight_passed: false
    fe_cisco_ucs_prod_monitoring_postflight_passed: false
    fe_cisco_ucs_prod_monitoring_failed_task: ""
    fe_cisco_ucs_prod_monitoring_error: ""
    fe_cisco_ucs_prod_monitoring_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_monitoring: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure SNMP for monitoring
      cisco.ucs.ucs_snmp:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        admin_state: "enabled"
        community: "{{ snmp_community }}"
        sys_contact: "{{ monitoring_contact }}"
        sys_location: "{{ monitoring_location }}"
      when:
        - apply_changes | bool
        - monitoring_enable_snmp | bool
      no_log: true
      tags:
        - monitoring
        - snmp

    - name: Configure SNMP traps
      cisco.ucs.ucs_snmp_trap:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        hostname_trap: "{{ item.host }}"
        community: "{{ item.community }}"
        port: "{{ item.port | default(162) }}"
        version: "{{ item.version | default('v2c') }}"
        state: present
      loop: "{{ snmp_trap_destinations }}"
      when:
        - apply_changes | bool
        - monitoring_enable_snmp | bool
      no_log: true
      tags:
        - monitoring
        - snmp

    - name: Configure Call Home for proactive monitoring
      cisco.ucs.ucs_callhome:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        admin_state: "{{ monitoring_callhome_enabled | ternary('on', 'off') }}"
        contact: "{{ monitoring_contact }}"
        phone: "{{ monitoring_phone }}"
        email: "{{ monitoring_email }}"
        addr: "{{ monitoring_address }}"
      no_log: true
      when: apply_changes | bool
      tags:
        - monitoring
        - callhome

    - name: Configure Call Home SMTP server
      cisco.ucs.ucs_callhome_smtp:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        smtp_host: "{{ monitoring_smtp_server }}"
        smtp_port: "{{ monitoring_smtp_port }}"
      no_log: true
      when:
        - apply_changes | bool
        - monitoring_callhome_enabled | bool
      tags:
        - monitoring
        - callhome

    - name: Query system health status
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: faultInst,computeBlade,fabricInterconnect
      no_log: true
      register: system_health
      tags:
        - monitoring
        - health_check

    - name: Query power and thermal status
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: equipmentPsu,processorEnvStats
      no_log: true
      register: power_thermal
      tags:
        - monitoring
        - power

    - name: Generate monitoring report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/monitoring_status.json"
        mode: '0640'
        content: |
          {
            "system_health": {{ system_health | to_json }},
            "power_thermal": {{ power_thermal | to_json }},
            "monitoring_config": {
              "snmp_enabled": {{ monitoring_enable_snmp | to_json }},
              "callhome_enabled": {{ monitoring_callhome_enabled | to_json }},
              "trap_destinations": {{ snmp_trap_destinations | length }}
            },
            "timestamp": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost
      tags:
        - monitoring
        - reporting

    - name: Generate compliance monitoring checklist
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/compliance_monitoring.txt"
        mode: '0640'
        content: |
          Cisco UCS Compliance Monitoring Checklist
          =========================================
          Date: {{ ansible_date_time.iso8601 }}

          MONITORING SYSTEMS
          -----------------
          SNMP: {{ monitoring_enable_snmp | ternary('ENABLED', 'DISABLED') }}
          Call Home: {{ monitoring_callhome_enabled | ternary('ENABLED', 'DISABLED') }}
          Syslog: Configured (see security hardening role)

          HEALTH CHECKS
          -------------
          - System faults monitored
          - Power supply status tracked
          - Thermal conditions monitored
          - Hardware health verified

          COMPLIANCE REQUIREMENTS
          ----------------------
          - NIST 800-53 SI-4: Information System Monitoring
          - NIST 800-53 AU-6: Audit Review, Analysis, and Reporting
          - DoD STIG: Continuous monitoring requirements

          RECOMMENDED ACTIONS
          ------------------
          - Review fault reports daily
          - Verify SNMP trap delivery
          - Test Call Home functionality
          - Integrate with SIEM for centralized monitoring
          - Schedule regular compliance audits
      delegate_to: localhost
      tags:
        - monitoring
        - compliance

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_monitoring_preflight_passed | bool
          - fe_cisco_ucs_prod_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_monitoring: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_monitoring_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_monitoring_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_postflight_passed: true
        fe_cisco_ucs_prod_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_status: "failed"
        fe_cisco_ucs_prod_monitoring_postflight_passed: false
        fe_cisco_ucs_prod_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_monitoring: FAILED at '{{ fe_cisco_ucs_prod_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_monitoring failed at '{{ fe_cisco_ucs_prod_monitoring_failed_task }}': {{ fe_cisco_ucs_prod_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_monitoring":
              component: "cisco/ucs_prod_monitoring"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_monitoring_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_monitoring_status | default('') == 'succeeded' else ['cisco/ucs_prod_monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_stats_published: true
      tags:
        - always
