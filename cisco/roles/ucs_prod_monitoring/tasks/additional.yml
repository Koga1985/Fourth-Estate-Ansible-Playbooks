---
# Additional tasks for ucs_prod_monitoring
# Cisco UCS Monitoring and Health Checks - Comprehensive monitoring and alerting

# Additional monitoring tasks for UCS

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_monitoring/additional']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_monitoring_additional_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_monitoring/additional | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_monitoring_additional_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_monitoring_additional_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_monitoring_additional_status: "running"
    fe_cisco_ucs_prod_monitoring_additional_preflight_passed: false
    fe_cisco_ucs_prod_monitoring_additional_postflight_passed: false
    fe_cisco_ucs_prod_monitoring_additional_failed_task: ""
    fe_cisco_ucs_prod_monitoring_additional_error: ""
    fe_cisco_ucs_prod_monitoring_additional_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_monitoring/additional | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_monitoring/additional | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_monitoring/additional: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_monitoring/additional: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_monitoring/additional | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_monitoring/additional: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_monitoring/additional: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_monitoring_additional_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_monitoring/additional | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_additional_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get current fault summary
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: faultInst
      no_log: true
      register: ucs_faults
      tags: [monitoring, faults]

    - name: Analyze fault severity
      ansible.builtin.set_fact:
        fault_summary:
          critical: "{{ ucs_faults.objects | selectattr('severity', 'equalto', 'critical') | list | length }}"
          major: "{{ ucs_faults.objects | selectattr('severity', 'equalto', 'major') | list | length }}"
          minor: "{{ ucs_faults.objects | selectattr('severity', 'equalto', 'minor') | list | length }}"
          warning: "{{ ucs_faults.objects | selectattr('severity', 'equalto', 'warning') | list | length }}"
      when: ucs_faults.objects is defined
      tags: [monitoring, analysis]

    - name: Alert on critical faults
      ansible.builtin.debug:
        msg: "CRITICAL: {{ fault_summary.critical }} critical faults detected in UCS"
      when:
        - fault_summary is defined
        - fault_summary.critical | int > 0
      tags: [monitoring, alerting]

    - name: Export monitoring data to SIEM
      ansible.builtin.uri:
        url: "{{ siem_endpoint }}/api/events"
        method: POST
        headers:
          Authorization: "Bearer {{ siem_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          source: "ucs_monitoring"
          hostname: "{{ ucs_hostname }}"
          faults: "{{ ucs_faults.objects | default([]) }}"
      when:
        - ucs_siem_integration_enabled | bool
        - siem_endpoint is defined
      ignore_errors: true
      tags: [siem, integration]

    - name: Generate monitoring report
      ansible.builtin.template:
        src: monitoring_report.json.j2
        dest: "{{ ucs_artifacts_dir }}/ucs_monitoring_{{ ansible_date_time.epoch }}.json"
        mode: "0640"
      tags: [reporting]

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_monitoring/additional | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_monitoring_additional_preflight_passed | bool
          - fe_cisco_ucs_prod_monitoring_additional_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_monitoring/additional: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_monitoring_additional_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_monitoring_additional_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_monitoring/additional: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_monitoring/additional | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_additional_postflight_passed: true
        fe_cisco_ucs_prod_monitoring_additional_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_monitoring/additional | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_additional_status: "failed"
        fe_cisco_ucs_prod_monitoring_additional_postflight_passed: false
        fe_cisco_ucs_prod_monitoring_additional_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_monitoring_additional_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_monitoring/additional | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_monitoring/additional: FAILED at '{{ fe_cisco_ucs_prod_monitoring_additional_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_monitoring_additional_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_monitoring/additional | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_monitoring/additional failed at '{{ fe_cisco_ucs_prod_monitoring_additional_failed_task }}': {{ fe_cisco_ucs_prod_monitoring_additional_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_monitoring/additional | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_additional_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_monitoring_additional_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_monitoring_additional_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_monitoring/additional | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_monitoring/additional":
              component: "cisco/ucs_prod_monitoring/additional"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_monitoring_additional_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_monitoring_additional_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_monitoring_additional_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_monitoring_additional_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_monitoring_additional_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_monitoring_additional_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_monitoring_additional_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_monitoring_additional_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_monitoring_additional_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_monitoring_additional_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_monitoring_additional_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_monitoring_additional_status | default('') == 'succeeded' else ['cisco/ucs_prod_monitoring/additional'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_monitoring/additional | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_monitoring_additional_stats_published: true
      tags:
        - always
