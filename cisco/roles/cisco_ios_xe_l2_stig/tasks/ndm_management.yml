---
# Management-plane (NDM) hardening for the Catalyst switch
# CISC-ND-000010 Banner | CISC-ND-000160 AAA | CISC-ND-000280 Idle timeout
# CISC-ND-000470/000490 NTP auth | CISC-ND-000090/000100 Logging
# CISC-ND-000150/000160 SNMPv3 | CISC-ND-001000/001210 SSH | CISC-ND-001310 Telnet off
# NIST AC-8, IA-2, AU-3, AU-8, SC-8, SC-23

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ios_xe_l2_stig/ndm_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ios_xe_l2_stig_ndm_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status: "running"
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_preflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_postflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_failed_task: ""
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_error: ""
    fe_cisco_cisco_ios_xe_l2_stig_ndm_management_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/ndm_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ios_xe_l2_stig/ndm_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ios_xe_l2_stig/ndm_management: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ios_xe_l2_stig/ndm_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-ND-000160 - Enable AAA new-model
      cisco.ios.ios_config:
        lines:
          - aaa new-model
      check_mode: "{{ not (apply_changes | bool) }}"
      when: ndm_aaa_new_model | bool
      register: ndm_aaa
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000160"]

    - name: CISC-ND-000160 - Configure TACACS+ servers
      cisco.ios.ios_config:
        parents: "tacacs server {{ item.name }}"
        lines:
          - "address ipv4 {{ item.address }}"
          - "key {{ item.key }}"
      loop: "{{ ndm_tacacs_servers }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_tacacs
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000160"]

    - name: CISC-ND-000160 - AAA authentication/authorization with local fallback
      cisco.ios.ios_config:
        lines:
          - aaa authentication login default group tacacs+ local
          - aaa authorization exec default group tacacs+ local
          - aaa accounting exec default start-stop group tacacs+
          - aaa accounting commands 15 default start-stop group tacacs+
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_aaa_methods
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000160", "CISC-ND-000550"]

    - name: CISC-ND-000010 - Configure DoD login banner
      cisco.ios.ios_config:
        lines:
          - "banner login ^C{{ ndm_login_banner }}^C"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_banner
      notify: save running-config
      tags: [stig_cat3, "CISC-ND-000010"]

    - name: CISC-ND-001000/001210 - Harden SSH and disable Telnet on VTY lines
      cisco.ios.ios_config:
        lines:
          - "ip ssh version {{ ndm_ssh_version }}"
          - "ip ssh time-out {{ ndm_ssh_timeout_seconds }}"
          - "ip ssh authentication-retries {{ ndm_ssh_auth_retries }}"
          - ip ssh dh min size 2048
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_ssh
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-001000", "CISC-ND-001210"]

    - name: CISC-ND-000490 - Restrict management access (VTY ACL)
      cisco.ios.ios_config:
        parents: "ip access-list standard {{ ndm_vty_access_class }}"
        lines: "{{ ndm_management_subnets | map('regex_replace', '^(.*)$', 'permit \\1') | list }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_vty_acl
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000490"]

    - name: CISC-ND-000280/001310 - Harden VTY lines (timeout, SSH only, ACL)
      cisco.ios.ios_config:
        parents: "line vty 0 15"
        lines:
          - "exec-timeout {{ ndm_exec_timeout_minutes }} 0"
          - "transport input ssh"
          - "access-class {{ ndm_vty_access_class }} in"
          - logging synchronous
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_vty
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000280", "CISC-ND-001310"]

    - name: CISC-ND-000280 - Harden console line idle timeout
      cisco.ios.ios_config:
        parents: "line con 0"
        lines:
          - "exec-timeout {{ ndm_exec_timeout_minutes }} 0"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_con
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000280"]

    - name: CISC-ND-000090/000100 - Configure syslog logging
      cisco.ios.ios_config:
        lines: "{{ ['logging buffered ' + (ndm_logging_buffer_size | string), 'logging trap ' + ndm_logging_trap_level, 'service timestamps log datetime localtime show-timezone', 'service timestamps debug datetime localtime show-timezone'] + (ndm_logging_hosts | map('regex_replace', '^(.*)$', 'logging host \\1') | list) }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_logging
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000090", "CISC-ND-000100"]

    - name: CISC-ND-000470/000490 - Configure authenticated NTP
      cisco.ios.ios_config:
        lines: "{{ ['ntp authenticate', 'ntp authentication-key ' + (ndm_ntp_key_id | string) + ' md5 ' + ndm_ntp_key, 'ntp trusted-key ' + (ndm_ntp_key_id | string)] + (ndm_ntp_servers | map('regex_replace', '^(.*)$', 'ntp server \\1 key ' + (ndm_ntp_key_id | string)) | list) }}"
      no_log: true
      when: ndm_ntp_authenticate | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_ntp
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000470"]

    - name: CISC-ND-000150/000160 - Configure SNMPv3 (auth+priv), disable v1/v2c
      cisco.ios.ios_config:
        lines:
          - "snmp-server group {{ ndm_snmp_v3_group }} v3 priv"
          - "snmp-server user {{ ndm_snmp_v3_user }} {{ ndm_snmp_v3_group }} v3 auth sha {{ ndm_snmp_v3_auth }} priv aes 128 {{ ndm_snmp_v3_priv }}"
      no_log: true
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_snmp
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000150", "CISC-ND-000160"]

    - name: CISC-ND-001440 - Disable unused/insecure management services
      cisco.ios.ios_config:
        lines:
          - no ip http server
          - ip http secure-server
          - no ip finger
          - no service config
          - no ip bootp server
          - no cdp run
          - service password-encryption
          - login on-failure log
          - login on-success log
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ndm_services
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-001440"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ios_xe_l2_stig_ndm_management_preflight_passed | bool
          - fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/ndm_management: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status | default('unknown') }}.
        success_msg: "cisco/cisco_ios_xe_l2_stig/ndm_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_postflight_passed: true
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status: "failed"
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_postflight_passed: false
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/ndm_management: FAILED at '{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/ndm_management failed at '{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_failed_task }}': {{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ios_xe_l2_stig_ndm_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ios_xe_l2_stig/ndm_management":
              component: "cisco/cisco_ios_xe_l2_stig/ndm_management"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_ndm_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ios_xe_l2_stig_ndm_management_status | default('') == 'succeeded' else ['cisco/cisco_ios_xe_l2_stig/ndm_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/ndm_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_ndm_management_stats_published: true
      tags:
        - always
