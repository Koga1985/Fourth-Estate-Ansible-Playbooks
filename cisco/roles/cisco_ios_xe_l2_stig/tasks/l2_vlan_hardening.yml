---
# VLAN / trunk hardening
# CISC-L2-000090 Disable DTP | CISC-L2-000110 Static trunks
# CISC-L2-000120 Disabled ports in unused VLAN | CISC-L2-000130 Default VLAN off host ports
# CISC-L2-000140 Prune default VLAN | CISC-L2-000160 Native VLAN != default
# CISC-L2-000170 No host ports on native VLAN
# NIST CM-7, SC-7

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status: "running"
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_preflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_postflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_failed_task: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_error: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-L2-000160 - Pre-create native and unused VLANs
      cisco.ios.ios_config:
        lines:
          - "name {{ item.name }}"
        parents: "vlan {{ item.id }}"
      loop:
        - { id: "{{ l2_native_vlan }}", name: "NATIVE-DROP" }
        - { id: "{{ l2_unused_vlan }}", name: "UNUSED-PARKING" }
      loop_control:
        label: "vlan {{ item.id }} ({{ item.name }})"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: vlan_create
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000160"]

    - name: CISC-L2-000170 - Park unused/parking VLAN SVI shutdown (no host traffic on native)
      cisco.ios.ios_config:
        parents: "interface Vlan{{ l2_unused_vlan }}"
        lines:
          - shutdown
      check_mode: "{{ not (apply_changes | bool) }}"
      register: unused_svi
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000170"]

    - name: CISC-L2-000090/000110/000140/000160 - Harden trunk interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - switchport mode trunk
          - switchport trunk encapsulation dot1q
          - switchport nonegotiate
          - "switchport trunk native vlan {{ l2_native_vlan }}"
          - "switchport trunk allowed vlan {{ l2_user_vlans | join(',') }},{{ l2_management_vlan }}"
      loop: "{{ l2_trunk_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: trunk_harden
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000090", "CISC-L2-000110", "CISC-L2-000140", "CISC-L2-000160"]

    - name: CISC-L2-000130 - Set access ports to a user VLAN and disable trunk negotiation
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - switchport mode access
          - "switchport access vlan {{ l2_user_vlans[0] }}"
          - switchport nonegotiate
        # NOTE: edit per-port access VLAN to match your design before enforcing.
      loop: "{{ l2_access_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: access_vlan
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000090", "CISC-L2-000130"]

    - name: CISC-L2-000120 - Shut disabled ports and park them in the unused VLAN
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - switchport mode access
          - "switchport access vlan {{ l2_unused_vlan }}"
          - switchport nonegotiate
          - shutdown
      loop: "{{ l2_unused_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: unused_ports
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000120"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_preflight_passed | bool
          - fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status | default('unknown') }}.
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_postflight_passed: true
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status: "failed"
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_postflight_passed: false
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening: FAILED at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening failed at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_failed_task }}': {{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening":
              component: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_status | default('') == 'succeeded' else ['cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_vlan_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_vlan_hardening_stats_published: true
      tags:
        - always
