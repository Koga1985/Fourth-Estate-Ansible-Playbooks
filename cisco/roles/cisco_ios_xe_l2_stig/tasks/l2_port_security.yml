---
# Port security and broadcast/storm controls
# CISC-L2-000020 Port security on access ports | CISC-L2-000080 Storm control
# NIST SC-5, AC-4

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ios_xe_l2_stig/l2_port_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status: "running"
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_preflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_postflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_failed_task: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_error: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_port_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_port_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ios_xe_l2_stig/l2_port_security: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_port_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-L2-000020 - Enable port security on access interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - switchport port-security
          - "switchport port-security maximum {{ l2_port_security_max_mac }}"
          - "switchport port-security violation {{ l2_port_security_violation }}"
          - switchport port-security aging time 5
          - switchport port-security aging type inactivity
      loop: "{{ l2_access_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: port_security
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000020"]

    - name: CISC-L2-000080 - Apply storm control on access interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - "storm-control broadcast level {{ l2_storm_control_broadcast_level }}"
          - "storm-control multicast level {{ l2_storm_control_multicast_level }}"
          - storm-control action shutdown
      loop: "{{ l2_access_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: storm_control
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000080"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_preflight_passed | bool
          - fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_port_security: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status | default('unknown') }}.
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_port_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_postflight_passed: true
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status: "failed"
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_postflight_passed: false
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_port_security: FAILED at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_port_security failed at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_failed_task }}': {{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ios_xe_l2_stig/l2_port_security":
              component: "cisco/cisco_ios_xe_l2_stig/l2_port_security"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_status | default('') == 'succeeded' else ['cisco/cisco_ios_xe_l2_stig/l2_port_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_port_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_port_security_stats_published: true
      tags:
        - always
