---
# Layer-2 data-plane integrity controls
# CISC-L2-000050 DHCP Snooping | CISC-L2-000070 Dynamic ARP Inspection
# CISC-L2-000060 IP Source Guard
# NIST SC-5, SC-7

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status: "running"
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_preflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_postflight_passed: false
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_failed_task: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_error: ""
    fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_stats_published: false
  tags:
    - always

- name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-L2-000050 - Enable DHCP snooping globally
      cisco.ios.ios_config:
        lines:
          - ip dhcp snooping
      check_mode: "{{ not (apply_changes | bool) }}"
      register: dhcp_snoop_global
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000050"]

    - name: CISC-L2-000050 - Enable DHCP snooping on user VLANs
      cisco.ios.ios_config:
        lines:
          - "ip dhcp snooping vlan {{ l2_user_vlans | join(',') }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: dhcp_snoop_vlans
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000050"]

    - name: CISC-L2-000050 - Mark upstream/server-facing interfaces as DHCP trusted
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - ip dhcp snooping trust
      loop: "{{ l2_dhcp_trusted_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: dhcp_trust
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000050"]

    - name: CISC-L2-000070 - Enable Dynamic ARP Inspection on user VLANs
      cisco.ios.ios_config:
        lines:
          - "ip arp inspection vlan {{ l2_user_vlans | join(',') }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: dai_vlans
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000070"]

    - name: CISC-L2-000070 - Trust ARP inspection on upstream interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - ip arp inspection trust
      loop: "{{ l2_dhcp_trusted_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: dai_trust
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000070"]

    - name: CISC-L2-000060 - Enable IP Source Guard on access interfaces
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - ip verify source
      loop: "{{ l2_access_interfaces }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: ip_source_guard
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000060"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_preflight_passed | bool
          - fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status | default('unknown') }}.
        success_msg: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_postflight_passed: true
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status: "failed"
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_postflight_passed: false
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp: FAILED at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp failed at '{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_failed_task }}': {{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp":
              component: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_status | default('') == 'succeeded' else ['cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_ios_xe_l2_stig/l2_dhcp_arp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_ios_xe_l2_stig_l2_dhcp_arp_stats_published: true
      tags:
        - always
