---
# tasks file for sdwan_vmanage_deploy
# Cisco SD-WAN vManage Controller Initial Deployment

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_vmanage_deploy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_vmanage_deploy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_vmanage_deploy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_vmanage_deploy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_vmanage_deploy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_vmanage_deploy_status: "running"
    fe_cisco_sdwan_vmanage_deploy_preflight_passed: false
    fe_cisco_sdwan_vmanage_deploy_postflight_passed: false
    fe_cisco_sdwan_vmanage_deploy_failed_task: ""
    fe_cisco_sdwan_vmanage_deploy_error: ""
    fe_cisco_sdwan_vmanage_deploy_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_vmanage_deploy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_vmanage_deploy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_vmanage_deploy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_vmanage_deploy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_vmanage_deploy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_vmanage_deploy: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_vmanage_deploy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_vmanage_deploy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_vmanage_deploy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_deploy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include prerequisites validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
      tags:
        - always
        - prerequisites

    # ============================================================
    # Phase 15 - vManage System Configuration
    # NIST CM-6 | Initial system settings
    # ============================================================
    - name: PHASE 15 - Configure vManage system settings
      ansible.builtin.include_tasks:
        file: system_config.yml
        apply:
          tags:
            - sdwan
            - vmanage
            - system
            - phase15
      when: enable_vmanage_system | bool
      tags:
        - sdwan
        - vmanage
        - system
        - phase15

    # ============================================================
    # Phase 15 - vManage Certificate Initialization
    # NIST SC-17, IA-3 | PKI certificate chain setup
    # ============================================================
    - name: PHASE 15 - Initialize vManage certificates
      ansible.builtin.include_tasks:
        file: certificates.yml
        apply:
          tags:
            - sdwan
            - vmanage
            - certificates
            - pki
            - phase15
      when: enable_vmanage_certificates | bool
      tags:
        - sdwan
        - vmanage
        - certificates
        - pki
        - phase15

    # ============================================================
    # Phase 15 - VPN and Interface Configuration
    # ============================================================
    - name: PHASE 15 - Configure VPN and management interface
      ansible.builtin.include_tasks:
        file: vpn_config.yml
        apply:
          tags:
            - sdwan
            - vmanage
            - vpn
            - networking
            - phase15
      when: enable_vmanage_vpn_config | bool
      tags:
        - sdwan
        - vmanage
        - vpn
        - networking
        - phase15

    # ============================================================
    # Phase 15 - vManage Cluster Setup (when HA is enabled)
    # ============================================================
    - name: PHASE 15 - Configure vManage cluster
      ansible.builtin.include_tasks:
        file: cluster.yml
        apply:
          tags:
            - sdwan
            - vmanage
            - cluster
            - ha
            - phase15
      when: enable_vmanage_cluster | bool and sdwan_vmanage_cluster_enabled | bool
      tags:
        - sdwan
        - vmanage
        - cluster
        - ha
        - phase15

    # ============================================================
    # Phase 15 - Validation
    # ============================================================
    - name: PHASE 15 - Validate vManage deployment
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - sdwan
            - vmanage
            - validation
            - phase15
      tags:
        - sdwan
        - vmanage
        - validation
        - phase15

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_vmanage_deploy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_vmanage_deploy_preflight_passed | bool
          - fe_cisco_sdwan_vmanage_deploy_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_vmanage_deploy: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_vmanage_deploy_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_vmanage_deploy_status | default('unknown') }}.
        success_msg: "cisco/sdwan_vmanage_deploy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_vmanage_deploy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_deploy_postflight_passed: true
        fe_cisco_sdwan_vmanage_deploy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_vmanage_deploy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_deploy_status: "failed"
        fe_cisco_sdwan_vmanage_deploy_postflight_passed: false
        fe_cisco_sdwan_vmanage_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_vmanage_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_vmanage_deploy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_vmanage_deploy: FAILED at '{{ fe_cisco_sdwan_vmanage_deploy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_vmanage_deploy_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_vmanage_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_vmanage_deploy failed at '{{ fe_cisco_sdwan_vmanage_deploy_failed_task }}': {{ fe_cisco_sdwan_vmanage_deploy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_vmanage_deploy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_vmanage_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_vmanage_deploy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_vmanage_deploy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_vmanage_deploy":
              component: "cisco/sdwan_vmanage_deploy"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_vmanage_deploy_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_vmanage_deploy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_vmanage_deploy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_vmanage_deploy_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_vmanage_deploy_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_vmanage_deploy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_vmanage_deploy_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_vmanage_deploy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_vmanage_deploy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_vmanage_deploy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_vmanage_deploy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_vmanage_deploy_status | default('') == 'succeeded' else ['cisco/sdwan_vmanage_deploy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_vmanage_deploy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_deploy_stats_published: true
      tags:
        - always
