---
# Physical and Environmental Protection (PE) - NIST 800-53 PE Family

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/physical_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_physical_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/physical_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_physical_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_physical_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_physical_security_status: "running"
    fe_cisco_ucs_security_hardening_physical_security_preflight_passed: false
    fe_cisco_ucs_security_hardening_physical_security_postflight_passed: false
    fe_cisco_ucs_security_hardening_physical_security_failed_task: ""
    fe_cisco_ucs_security_hardening_physical_security_error: ""
    fe_cisco_ucs_security_hardening_physical_security_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/physical_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/physical_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/physical_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/physical_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/physical_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/physical_security: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/physical_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_physical_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/physical_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_physical_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PE-2 - Document physical access controls
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/physical_security.txt"
        mode: '0640'
        content: |
          Physical Security Controls for {{ fourth_estate_org_name }}
          ========================================================

          PE-2: Physical Access Authorization
          - Data center access requires badge authentication
          - Two-person integrity for critical areas
          - Access logs maintained and reviewed

          PE-3: Physical Access Control
          - Physical access control systems installed
          - Visitor access requires escort
          - Entry/exit points monitored 24/7

          PE-6: Monitoring Physical Access
          - CCTV surveillance of data center
          - Access logs retained for {{ pe_access_log_retention_days }} days
          - Real-time alerting for unauthorized access attempts

          PE-8: Visitor Access Records
          - All visitors logged and badged
          - Visitor access requires authorization
          - Visitor logs retained for audit

          PE-13: Fire Protection
          - Fire suppression systems installed
          - Regular fire safety inspections
          - Emergency procedures documented

          PE-14: Temperature and Humidity Controls
          - HVAC systems maintain optimal conditions
          - Temperature: {{ pe_temperature_range }}
          - Humidity: {{ pe_humidity_range }}
          - Environmental monitoring and alerting

          PE-15: Water Damage Protection
          - Water detection systems installed
          - Regular leak inspections
          - Emergency shutoff procedures

          PE-16: Delivery and Removal
          - Equipment delivery requires authorization
          - Asset removal tracked and approved
          - Inventory verification on delivery/removal
      delegate_to: localhost

    - name: Configure chassis physical security settings
      ansible.builtin.debug:
        msg: "Physical security is enforced through data center controls"

    - name: Record physical security compliance
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/physical_security.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["PE-2", "PE-3", "PE-6", "PE-8", "PE-13", "PE-14", "PE-15", "PE-16"],
            "physical_access_controls": true,
            "monitoring_24x7": true,
            "environmental_controls": true,
            "access_log_retention_days": {{ pe_access_log_retention_days }},
            "documented_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/physical_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_physical_security_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_physical_security_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/physical_security: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_physical_security_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_physical_security_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/physical_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/physical_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_physical_security_postflight_passed: true
        fe_cisco_ucs_security_hardening_physical_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/physical_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_physical_security_status: "failed"
        fe_cisco_ucs_security_hardening_physical_security_postflight_passed: false
        fe_cisco_ucs_security_hardening_physical_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_physical_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/physical_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/physical_security: FAILED at '{{ fe_cisco_ucs_security_hardening_physical_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_physical_security_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/physical_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/physical_security failed at '{{ fe_cisco_ucs_security_hardening_physical_security_failed_task }}': {{ fe_cisco_ucs_security_hardening_physical_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/physical_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_physical_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_physical_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_physical_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/physical_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/physical_security":
              component: "cisco/ucs_security_hardening/physical_security"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_physical_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_physical_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_physical_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_physical_security_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_physical_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_physical_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_physical_security_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_physical_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_physical_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_physical_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_physical_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_physical_security_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/physical_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/physical_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_physical_security_stats_published: true
      tags:
        - always
