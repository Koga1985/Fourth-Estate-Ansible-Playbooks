---
# STIG Category II (Medium Severity) Findings Remediation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/stig_cat2']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_stig_cat2_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/stig_cat2 | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_stig_cat2_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_stig_cat2_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_stig_cat2_status: "running"
    fe_cisco_ucs_security_hardening_stig_cat2_preflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat2_postflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat2_failed_task: ""
    fe_cisco_ucs_security_hardening_stig_cat2_error: ""
    fe_cisco_ucs_security_hardening_stig_cat2_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/stig_cat2 | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/stig_cat2 | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat2: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/stig_cat2: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat2 | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/stig_cat2: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/stig_cat2: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_stig_cat2_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat2 | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat2_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: V-230525 - Configure account lockout threshold
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        lockout_enabled: "yes"
        max_login_attempts: "{{ ac_max_failed_login_attempts }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230527 - Configure account lockout duration
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        lockout_duration: "{{ ac_account_lockout_duration_minutes }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230530 - Enable audit logging for administrative actions
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        audit_log_enabled: "yes"
      no_log: true
      when: apply_changes | bool

    - name: V-230532 - Configure remote syslog servers
      cisco.ucs.ucs_syslog_server:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        syslog_server: "{{ item.server }}"
        severity: "{{ item.severity }}"
        facility: "{{ item.facility }}"
        state: present
      no_log: true
      loop: "{{ au_syslog_servers }}"
      when: apply_changes | bool

    - name: V-230535 - Configure NTP for time synchronization
      cisco.ucs.ucs_ntp_server:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        ntp_server: "{{ item }}"
        state: present
      no_log: true
      loop: "{{ ucs_ntp_servers }}"
      when: apply_changes | bool

    - name: V-230540 - Disable insecure protocols (HTTP)
      cisco.ucs.ucs_https_redirect:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        http_redirect: "enabled"
      no_log: true
      when: apply_changes | bool

    - name: V-230545 - Configure SNMP v3 (if SNMP enabled)
      cisco.ucs.ucs_snmp_user:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        auth_type: "{{ item.auth_type }}"
        auth_password: "{{ item.auth_password }}"
        privacy_type: "{{ item.privacy_type }}"
        privacy_password: "{{ item.privacy_password }}"
        state: present
      loop: "{{ snmp_v3_users }}"
      when:
        - apply_changes | bool
        - ucs_enable_snmp | bool
        - snmp_use_v3 | bool
      no_log: true

    - name: V-230550 - Disable unused management interfaces
      ansible.builtin.debug:
        msg: "Ensure only required management interfaces are enabled"

    - name: Record STIG CAT II remediation
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/stig_cat2_remediation.txt"
        mode: '0640'
        content: |
          STIG Category II (Medium) Remediation Applied
          ============================================
          Date: {{ ansible_date_time.iso8601 }}

          V-230525: Account lockout threshold: {{ ac_max_failed_login_attempts }} attempts
          V-230527: Account lockout duration: {{ ac_account_lockout_duration_minutes }} minutes
          V-230530: Audit logging: Enabled
          V-230532: Remote syslog: Configured
          V-230535: NTP synchronization: Configured
          V-230540: HTTP redirect to HTTPS: Enabled
          V-230545: SNMPv3: {{ snmp_use_v3 | ternary('Configured', 'N/A') }}
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/stig_cat2 | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_stig_cat2_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_stig_cat2_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat2: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_stig_cat2_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_stig_cat2_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/stig_cat2: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat2 | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat2_postflight_passed: true
        fe_cisco_ucs_security_hardening_stig_cat2_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/stig_cat2 | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat2_status: "failed"
        fe_cisco_ucs_security_hardening_stig_cat2_postflight_passed: false
        fe_cisco_ucs_security_hardening_stig_cat2_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_stig_cat2_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat2 | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/stig_cat2: FAILED at '{{ fe_cisco_ucs_security_hardening_stig_cat2_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_stig_cat2_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat2 | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/stig_cat2 failed at '{{ fe_cisco_ucs_security_hardening_stig_cat2_failed_task }}': {{ fe_cisco_ucs_security_hardening_stig_cat2_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/stig_cat2 | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat2_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_stig_cat2_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_stig_cat2_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat2 | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/stig_cat2":
              component: "cisco/ucs_security_hardening/stig_cat2"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_stig_cat2_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat2_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat2_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_stig_cat2_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_stig_cat2_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat2_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_stig_cat2_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_stig_cat2_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_stig_cat2_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_stig_cat2_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat2_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_stig_cat2_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/stig_cat2'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat2 | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat2_stats_published: true
      tags:
        - always
