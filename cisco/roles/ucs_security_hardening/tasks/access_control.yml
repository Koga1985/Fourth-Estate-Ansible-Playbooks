---
# Access Control (AC) - NIST 800-53 AC Family

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/access_control']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_access_control_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/access_control | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_access_control_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_access_control_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_access_control_status: "running"
    fe_cisco_ucs_security_hardening_access_control_preflight_passed: false
    fe_cisco_ucs_security_hardening_access_control_postflight_passed: false
    fe_cisco_ucs_security_hardening_access_control_failed_task: ""
    fe_cisco_ucs_security_hardening_access_control_error: ""
    fe_cisco_ucs_security_hardening_access_control_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/access_control | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/access_control | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/access_control: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/access_control: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/access_control | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/access_control: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/access_control: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_access_control_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/access_control | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_access_control_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: AC-2 - Create role-based access control roles
      cisco.ucs.ucs_role:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        descr: "{{ item.description }}"
        priv: "{{ item.privileges }}"
        state: present
      no_log: true
      loop: "{{ ucs_rbac_roles }}"
      when: apply_changes | bool

    - name: AC-2 - Create user accounts with RBAC
      cisco.ucs.ucs_user:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        first_name: "{{ item.first_name | default('') }}"
        last_name: "{{ item.last_name | default('') }}"
        email: "{{ item.email | default('') }}"
        phone: "{{ item.phone | default('') }}"
        account_status: "active"
        state: present
      loop: "{{ ucs_user_accounts }}"
      when: apply_changes | bool
      no_log: true

    - name: AC-2 - Assign users to roles
      cisco.ucs.ucs_user_role:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        user: "{{ item.user }}"
        role: "{{ item.role }}"
        org_dn: "{{ item.org_dn | default('org-root') }}"
        state: present
      no_log: true
      loop: "{{ ucs_user_role_assignments }}"
      when: apply_changes | bool

    - name: AC-7 - Enforce account lockout policy
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        lockout_enabled: "yes"
        max_login_attempts: "{{ ac_max_failed_login_attempts }}"
        lockout_duration: "{{ ac_account_lockout_duration_minutes }}"
      no_log: true
      when: apply_changes | bool

    - name: AC-11 - Configure session lock (timeout)
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        session_timeout: "{{ ac_session_timeout_minutes }}"
      no_log: true
      when: apply_changes | bool

    - name: AC-17 - Configure remote access restrictions
      cisco.ucs.ucs_ip_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "Management-IP-Pool"
        order: "sequential"
        first_addr: "{{ mgmt_pool_first_ip }}"
        last_addr: "{{ mgmt_pool_last_ip }}"
        subnet_mask: "{{ mgmt_pool_subnet_mask }}"
        default_gw: "{{ mgmt_pool_gateway }}"
      no_log: true
      when:
        - apply_changes | bool
        - ac_configure_mgmt_pool | bool

    - name: Record access control configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/access_control.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["AC-2", "AC-7", "AC-11", "AC-17"],
            "rbac_roles": {{ ucs_rbac_roles | to_json }},
            "user_accounts": {{ ucs_user_accounts | length }},
            "session_timeout": {{ ac_session_timeout_minutes }},
            "lockout_threshold": {{ ac_max_failed_login_attempts }},
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/access_control | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_access_control_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_access_control_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/access_control: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_access_control_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_access_control_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/access_control: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/access_control | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_access_control_postflight_passed: true
        fe_cisco_ucs_security_hardening_access_control_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/access_control | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_access_control_status: "failed"
        fe_cisco_ucs_security_hardening_access_control_postflight_passed: false
        fe_cisco_ucs_security_hardening_access_control_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_access_control_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/access_control | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/access_control: FAILED at '{{ fe_cisco_ucs_security_hardening_access_control_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_access_control_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/access_control | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/access_control failed at '{{ fe_cisco_ucs_security_hardening_access_control_failed_task }}': {{ fe_cisco_ucs_security_hardening_access_control_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/access_control | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_access_control_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_access_control_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_access_control_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/access_control | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/access_control":
              component: "cisco/ucs_security_hardening/access_control"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_access_control_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_access_control_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_access_control_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_access_control_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_access_control_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_access_control_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_access_control_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_access_control_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_access_control_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_access_control_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_access_control_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_access_control_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/access_control'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/access_control | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_access_control_stats_published: true
      tags:
        - always
