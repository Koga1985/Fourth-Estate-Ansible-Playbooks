---
# Configuration Management (CM) - NIST 800-53 CM Family

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/config_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_config_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/config_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_config_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_config_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_config_management_status: "running"
    fe_cisco_ucs_security_hardening_config_management_preflight_passed: false
    fe_cisco_ucs_security_hardening_config_management_postflight_passed: false
    fe_cisco_ucs_security_hardening_config_management_failed_task: ""
    fe_cisco_ucs_security_hardening_config_management_error: ""
    fe_cisco_ucs_security_hardening_config_management_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/config_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/config_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/config_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/config_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/config_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/config_management: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/config_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_config_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/config_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_config_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CM-2 - Establish baseline configuration
      ansible.builtin.debug:
        msg: "Baseline configuration established for {{ fourth_estate_org_name }}"

    - name: CM-3 - Enable configuration change control
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        audit_log_enabled: "yes"
      no_log: true
      when: apply_changes | bool

    - name: CM-5 - Restrict configuration changes to authorized users
      ansible.builtin.debug:
        msg: "RBAC policies enforce authorized configuration changes only"

    - name: CM-6 - Configure security settings
      ansible.builtin.debug:
        msg: "Security configuration settings per DoD STIG and NIST 800-53"

    - name: CM-7 - Disable unnecessary services and features
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        anonymous_reporting: "off"
      no_log: true
      when: apply_changes | bool

    - name: CM-8 - Maintain inventory of system components
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: computeBlade,computeRackUnit,fabricInterconnect
      no_log: true
      register: system_inventory

    - name: CM-8 - Save system inventory
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/system_inventory.json"
        mode: '0640'
        content: "{{ system_inventory | to_nice_json }}"
      delegate_to: localhost

    - name: CM-10 - Restrict software installation
      ansible.builtin.debug:
        msg: "Only authorized firmware updates permitted through controlled process"

    - name: CM-11 - Install security updates
      ansible.builtin.debug:
        msg: "Firmware updates follow fourth estate change management process"

    - name: Record configuration management
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/config_management.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["CM-2", "CM-3", "CM-5", "CM-6", "CM-7", "CM-8", "CM-10", "CM-11"],
            "baseline_established": true,
            "change_control_enabled": true,
            "inventory_maintained": true,
            "unnecessary_services_disabled": true,
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/config_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_config_management_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_config_management_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/config_management: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_config_management_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_config_management_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/config_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/config_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_config_management_postflight_passed: true
        fe_cisco_ucs_security_hardening_config_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/config_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_config_management_status: "failed"
        fe_cisco_ucs_security_hardening_config_management_postflight_passed: false
        fe_cisco_ucs_security_hardening_config_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_config_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/config_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/config_management: FAILED at '{{ fe_cisco_ucs_security_hardening_config_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_config_management_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/config_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/config_management failed at '{{ fe_cisco_ucs_security_hardening_config_management_failed_task }}': {{ fe_cisco_ucs_security_hardening_config_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/config_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_config_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_config_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_config_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/config_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/config_management":
              component: "cisco/ucs_security_hardening/config_management"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_config_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_config_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_config_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_config_management_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_config_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_config_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_config_management_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_config_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_config_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_config_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_config_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_config_management_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/config_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/config_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_config_management_stats_published: true
      tags:
        - always
