---
# Audit and Accountability (AU) - NIST 800-53 AU Family

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/audit_logging']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_audit_logging_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/audit_logging | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_audit_logging_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_audit_logging_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_audit_logging_status: "running"
    fe_cisco_ucs_security_hardening_audit_logging_preflight_passed: false
    fe_cisco_ucs_security_hardening_audit_logging_postflight_passed: false
    fe_cisco_ucs_security_hardening_audit_logging_failed_task: ""
    fe_cisco_ucs_security_hardening_audit_logging_error: ""
    fe_cisco_ucs_security_hardening_audit_logging_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/audit_logging | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/audit_logging | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/audit_logging: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/audit_logging: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/audit_logging | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/audit_logging: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/audit_logging: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_audit_logging_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/audit_logging | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_audit_logging_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: AU-2 - Enable comprehensive audit logging
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        audit_log_enabled: "yes"
      no_log: true
      when: apply_changes | bool

    - name: AU-3 - Configure audit content requirements
      ansible.builtin.debug:
        msg: "UCS audit logs include: event type, date/time, source, outcome, user identity"

    - name: AU-4 - Configure remote syslog servers for log storage
      cisco.ucs.ucs_syslog_server:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        syslog_server: "{{ item.server }}"
        severity: "{{ item.severity | default('information') }}"
        facility: "{{ item.facility | default('local7') }}"
        forwarding_facility: "{{ item.forwarding_facility | default('local7') }}"
        state: present
      no_log: true
      loop: "{{ au_syslog_servers }}"
      when: apply_changes | bool

    - name: AU-5 - Configure syslog local console logging
      cisco.ucs.ucs_syslog_console:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        admin_state: "enabled"
        level: "{{ au_console_log_level }}"
      no_log: true
      when: apply_changes | bool

    - name: AU-9 - Protect audit information
      ansible.builtin.debug:
        msg: "Ensure syslog servers have appropriate access controls and encryption"

    - name: AU-12 - Generate audit records for security events
      cisco.ucs.ucs_syslog_source:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        audits: "{{ item.audits | default('enabled') }}"
        events: "{{ item.events | default('enabled') }}"
        faults: "{{ item.faults | default('enabled') }}"
      no_log: true
      loop: "{{ au_log_sources }}"
      when: apply_changes | bool

    - name: Configure audit log rotation
      ansible.builtin.debug:
        msg: "Configure log retention period: {{ au_log_retention_days }} days"

    - name: Record audit logging configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/audit_logging.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["AU-2", "AU-3", "AU-4", "AU-5", "AU-9", "AU-12"],
            "comprehensive_logging": true,
            "syslog_servers": {{ au_syslog_servers | to_json }},
            "retention_days": {{ au_log_retention_days }},
            "console_level": "{{ au_console_log_level }}",
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # --------------------------- evidence delivery --------------------------
    # Writing the report to ucs_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "cisco/ucs_security_hardening/audit_logging | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ ucs_artifacts_dir }}"
        patterns: "audit_logging.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "cisco/ucs_security_hardening/audit_logging | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "cisco/ucs_security_hardening/audit_logging | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "cisco/ucs_security_hardening/audit_logging | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "cisco/ucs_security_hardening/audit_logging":
              component: "cisco/ucs_security_hardening/audit_logging"
              platform: "cisco"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ ucs_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/audit_logging | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_audit_logging_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_audit_logging_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/audit_logging: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_audit_logging_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_audit_logging_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/audit_logging: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/audit_logging | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_audit_logging_postflight_passed: true
        fe_cisco_ucs_security_hardening_audit_logging_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/audit_logging | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_audit_logging_status: "failed"
        fe_cisco_ucs_security_hardening_audit_logging_postflight_passed: false
        fe_cisco_ucs_security_hardening_audit_logging_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_audit_logging_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/audit_logging | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/audit_logging: FAILED at '{{ fe_cisco_ucs_security_hardening_audit_logging_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_audit_logging_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/audit_logging | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/audit_logging failed at '{{ fe_cisco_ucs_security_hardening_audit_logging_failed_task }}': {{ fe_cisco_ucs_security_hardening_audit_logging_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/audit_logging | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_audit_logging_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_audit_logging_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_audit_logging_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/audit_logging | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/audit_logging":
              component: "cisco/ucs_security_hardening/audit_logging"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_audit_logging_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_audit_logging_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_audit_logging_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_audit_logging_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_audit_logging_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_audit_logging_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_audit_logging_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_audit_logging_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_audit_logging_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_audit_logging_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_audit_logging_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_audit_logging_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/audit_logging'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/audit_logging | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_audit_logging_stats_published: true
      tags:
        - always
