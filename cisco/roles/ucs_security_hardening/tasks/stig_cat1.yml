---
# STIG Category I (High Severity) Findings Remediation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/stig_cat1']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_stig_cat1_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/stig_cat1 | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_stig_cat1_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_stig_cat1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_stig_cat1_status: "running"
    fe_cisco_ucs_security_hardening_stig_cat1_preflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat1_postflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat1_failed_task: ""
    fe_cisco_ucs_security_hardening_stig_cat1_error: ""
    fe_cisco_ucs_security_hardening_stig_cat1_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/stig_cat1 | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/stig_cat1 | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat1: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/stig_cat1: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat1 | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/stig_cat1: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/stig_cat1: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_stig_cat1_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat1 | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat1_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: V-230500 - Disable default admin account (if not in use)
      cisco.ucs.ucs_user:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "admin"
        account_status: "{{ stig_disable_default_admin | ternary('inactive', 'active') }}"
      no_log: true
      when:
        - apply_changes | bool
        - stig_disable_default_admin | bool

    - name: V-230502 - Enforce minimum password length
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        min_length: "{{ ia_password_min_length }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230503 - Enable password complexity requirements
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        complexity_check: "yes"
      no_log: true
      when: apply_changes | bool

    - name: V-230505 - Configure maximum password age
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        password_expiration: "yes"
        password_expiration_days: "{{ ia_password_max_age_days }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230507 - Enforce password history
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        password_history_count: "{{ ia_password_history_count }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230510 - Disable anonymous/guest access
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        anonymous_reporting: "off"
      no_log: true
      when: apply_changes | bool

    - name: V-230515 - Configure session timeout
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        session_timeout: "{{ ac_session_timeout_minutes }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230520 - Enable TLS 1.2 or higher only
      cisco.ucs.ucs_https_cipher:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        cipher_suite: "{{ sc_cipher_suite }}"
      no_log: true
      when: apply_changes | bool

    - name: Record STIG CAT I remediation
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/stig_cat1_remediation.txt"
        mode: '0640'
        content: |
          STIG Category I (High) Remediation Applied
          =========================================
          Date: {{ ansible_date_time.iso8601 }}

          V-230500: Default admin account status configured
          V-230502: Minimum password length: {{ ia_password_min_length }}
          V-230503: Password complexity: Enabled
          V-230505: Password expiration: {{ ia_password_max_age_days }} days
          V-230507: Password history: {{ ia_password_history_count }} passwords
          V-230510: Anonymous access: Disabled
          V-230515: Session timeout: {{ ac_session_timeout_minutes }} minutes
          V-230520: TLS enforcement: TLS 1.2+
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/stig_cat1 | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_stig_cat1_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_stig_cat1_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat1: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_stig_cat1_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_stig_cat1_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/stig_cat1: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat1 | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat1_postflight_passed: true
        fe_cisco_ucs_security_hardening_stig_cat1_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/stig_cat1 | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat1_status: "failed"
        fe_cisco_ucs_security_hardening_stig_cat1_postflight_passed: false
        fe_cisco_ucs_security_hardening_stig_cat1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_stig_cat1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat1 | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/stig_cat1: FAILED at '{{ fe_cisco_ucs_security_hardening_stig_cat1_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_stig_cat1_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat1 | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/stig_cat1 failed at '{{ fe_cisco_ucs_security_hardening_stig_cat1_failed_task }}': {{ fe_cisco_ucs_security_hardening_stig_cat1_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/stig_cat1 | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_stig_cat1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_stig_cat1_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat1 | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/stig_cat1":
              component: "cisco/ucs_security_hardening/stig_cat1"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_stig_cat1_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat1_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat1_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_stig_cat1_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_stig_cat1_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat1_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_stig_cat1_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_stig_cat1_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_stig_cat1_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_stig_cat1_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat1_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_stig_cat1_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/stig_cat1'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat1 | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat1_stats_published: true
      tags:
        - always
