---
# Compliance Verification Tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/compliance_verification']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_compliance_verification_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/compliance_verification | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_compliance_verification_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_compliance_verification_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_compliance_verification_status: "running"
    fe_cisco_ucs_security_hardening_compliance_verification_preflight_passed: false
    fe_cisco_ucs_security_hardening_compliance_verification_postflight_passed: false
    fe_cisco_ucs_security_hardening_compliance_verification_failed_task: ""
    fe_cisco_ucs_security_hardening_compliance_verification_error: ""
    fe_cisco_ucs_security_hardening_compliance_verification_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/compliance_verification | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/compliance_verification | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/compliance_verification: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/compliance_verification: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/compliance_verification | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/compliance_verification: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/compliance_verification: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_compliance_verification_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/compliance_verification | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_compliance_verification_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query system configuration for compliance check
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: topSystem,aaaUserEp,commSyslog
      no_log: true
      register: compliance_config

    - name: Query active faults
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: faultInst
      no_log: true
      register: active_faults

    - name: Query user accounts
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: aaaUser
      no_log: true
      register: user_accounts

    - name: Generate compliance report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/compliance_report.txt"
        mode: '0640'
        content: |
          Cisco UCS Security Hardening Compliance Report
          ==============================================
          Organization: {{ fourth_estate_org_name }}
          UCS Manager: {{ ucs_hostname }}
          Report Date: {{ ansible_date_time.iso8601 }}

          COMPLIANCE FRAMEWORKS
          --------------------
          {% for framework in compliance_frameworks %}
          - {{ framework }}
          {% endfor %}

          STIG COMPLIANCE
          ---------------
          Category I (High):   {{ stig_cat1_enabled | ternary('APPLIED', 'NOT APPLIED') }}
          Category II (Medium): {{ stig_cat2_enabled | ternary('APPLIED', 'NOT APPLIED') }}
          Category III (Low):   {{ stig_cat3_enabled | ternary('APPLIED', 'NOT APPLIED') }}

          NIST 800-53 CONTROLS
          -------------------
          Access Control (AC):            {{ ac_enforce_rbac | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          Identification & Auth (IA):     {{ ia_enable_strong_auth | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          Audit & Accountability (AU):    {{ au_enable_comprehensive_logging | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          System & Comm Protection (SC):  {{ sc_enforce_strong_crypto | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          Configuration Management (CM):  {{ cm_baseline_config | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          System Integrity (SI):          {{ si_enable_integrity_checks | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}
          Physical & Env Protection (PE): {{ pe_enable_physical_controls | ternary('IMPLEMENTED', 'NOT IMPLEMENTED') }}

          SYSTEM STATUS
          ------------
          Total Faults: {{ active_faults.objects | length }}
          Critical Faults: {{ active_faults.objects | selectattr('severity', 'equalto', 'critical') | list | length }}
          Major Faults: {{ active_faults.objects | selectattr('severity', 'equalto', 'major') | list | length }}

          USER ACCOUNTS
          -------------
          Total Accounts: {{ user_accounts.objects | length }}

          SECURITY SETTINGS
          ----------------
          Password Min Length: {{ ia_password_min_length }} characters
          Password Max Age: {{ ia_password_max_age_days }} days
          Password History: {{ ia_password_history_count }} passwords
          Session Timeout: {{ ac_session_timeout_minutes }} minutes
          Account Lockout: {{ ac_max_failed_login_attempts }} failed attempts
          Lockout Duration: {{ ac_account_lockout_duration_minutes }} minutes

          DoD Banner: {{ dod_banner_enabled | ternary('CONFIGURED', 'NOT CONFIGURED') }}

          RECOMMENDATIONS
          --------------
          {% if not apply_changes %}
          - This was a dry-run. Set apply_changes=true to apply configurations.
          {% endif %}
          - Review all critical and major faults
          - Verify external integrations (SIEM, backup, monitoring)
          - Schedule regular compliance audits
          - Maintain documentation of all changes
          - Ensure backup and disaster recovery procedures are tested

          END OF REPORT
      delegate_to: localhost

    - name: Display compliance summary
      ansible.builtin.debug:
        msg: |
          Compliance report generated: {{ ucs_artifacts_dir }}/compliance_report.txt
          Total faults: {{ active_faults.objects | length }}
          STIG compliance: {{ (stig_cat1_enabled and stig_cat2_enabled and stig_cat3_enabled) | ternary('FULL', 'PARTIAL') }}

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/compliance_verification | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_compliance_verification_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_compliance_verification_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/compliance_verification: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_compliance_verification_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_compliance_verification_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/compliance_verification: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/compliance_verification | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_compliance_verification_postflight_passed: true
        fe_cisco_ucs_security_hardening_compliance_verification_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/compliance_verification | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_compliance_verification_status: "failed"
        fe_cisco_ucs_security_hardening_compliance_verification_postflight_passed: false
        fe_cisco_ucs_security_hardening_compliance_verification_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_compliance_verification_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/compliance_verification | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/compliance_verification: FAILED at '{{ fe_cisco_ucs_security_hardening_compliance_verification_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_compliance_verification_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/compliance_verification | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/compliance_verification failed at '{{ fe_cisco_ucs_security_hardening_compliance_verification_failed_task }}': {{ fe_cisco_ucs_security_hardening_compliance_verification_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/compliance_verification | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_compliance_verification_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_compliance_verification_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_compliance_verification_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/compliance_verification | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/compliance_verification":
              component: "cisco/ucs_security_hardening/compliance_verification"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_compliance_verification_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_compliance_verification_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_compliance_verification_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_compliance_verification_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_compliance_verification_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_compliance_verification_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_compliance_verification_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_compliance_verification_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_compliance_verification_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_compliance_verification_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_compliance_verification_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_compliance_verification_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/compliance_verification'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/compliance_verification | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_compliance_verification_stats_published: true
      tags:
        - always
