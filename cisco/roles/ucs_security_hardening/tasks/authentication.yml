---
# Identification and Authentication (IA) - NIST 800-53 IA Family

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/authentication']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_authentication_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/authentication | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_authentication_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_authentication_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_authentication_status: "running"
    fe_cisco_ucs_security_hardening_authentication_preflight_passed: false
    fe_cisco_ucs_security_hardening_authentication_postflight_passed: false
    fe_cisco_ucs_security_hardening_authentication_failed_task: ""
    fe_cisco_ucs_security_hardening_authentication_error: ""
    fe_cisco_ucs_security_hardening_authentication_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/authentication | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/authentication | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/authentication: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/authentication: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/authentication | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/authentication: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/authentication: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_authentication_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/authentication | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_authentication_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: IA-2 - Configure LDAP/AD authentication providers
      cisco.ucs.ucs_ldap_provider:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        order: "{{ item.order }}"
        basedn: "{{ item.basedn }}"
        domain: "{{ item.domain }}"
        filter: "{{ item.filter | default('cn=$userid') }}"
        attribute: "{{ item.attribute | default('CiscoAvPair') }}"
        enable: "yes"
        state: present
      no_log: true
      loop: "{{ ia_ldap_providers }}"
      when:
        - apply_changes | bool
        - ia_enable_ldap | bool

    - name: IA-2 - Configure RADIUS authentication providers
      cisco.ucs.ucs_radius_provider:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        order: "{{ item.order }}"
        auth_port: "{{ item.auth_port | default(1812) }}"
        key: "{{ item.key }}"
        timeout: "{{ item.timeout | default(5) }}"
        retries: "{{ item.retries | default(1) }}"
        state: present
      loop: "{{ ia_radius_providers }}"
      when:
        - apply_changes | bool
        - ia_enable_radius | bool
      no_log: true

    - name: IA-2 - Configure TACACS+ authentication providers
      cisco.ucs.ucs_tacacs_provider:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        order: "{{ item.order }}"
        port: "{{ item.port | default(49) }}"
        key: "{{ item.key }}"
        timeout: "{{ item.timeout | default(5) }}"
        state: present
      loop: "{{ ia_tacacs_providers }}"
      when:
        - apply_changes | bool
        - ia_enable_tacacs | bool
      no_log: true

    - name: IA-5 - Configure password policy
      cisco.ucs.ucs_password_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        min_length: "{{ ia_password_min_length }}"
        complexity_check: "yes"
        password_expiration: "yes"
        password_expiration_days: "{{ ia_password_max_age_days }}"
        password_history_count: "{{ ia_password_history_count }}"
        change_during_interval: "disable"
        change_count: "{{ ia_password_change_count }}"
        change_interval: "{{ ia_password_change_interval }}"
      no_log: true
      when: apply_changes | bool

    - name: IA-8 - Configure certificate-based authentication
      cisco.ucs.ucs_certificate:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        cert_file: "{{ ia_certificate_file }}"
        key_file: "{{ ia_certificate_key_file }}"
      no_log: true
      when:
        - apply_changes | bool
        - ia_enable_certificate_auth | bool

    - name: Record authentication configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/authentication.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["IA-2", "IA-5", "IA-8"],
            "ldap_enabled": {{ ia_enable_ldap | to_json }},
            "radius_enabled": {{ ia_enable_radius | to_json }},
            "tacacs_enabled": {{ ia_enable_tacacs | to_json }},
            "certificate_auth": {{ ia_enable_certificate_auth | to_json }},
            "password_policy": {
              "min_length": {{ ia_password_min_length }},
              "complexity": true,
              "max_age_days": {{ ia_password_max_age_days }},
              "history_count": {{ ia_password_history_count }}
            },
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/authentication | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_authentication_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_authentication_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/authentication: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_authentication_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_authentication_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/authentication: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/authentication | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_authentication_postflight_passed: true
        fe_cisco_ucs_security_hardening_authentication_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/authentication | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_authentication_status: "failed"
        fe_cisco_ucs_security_hardening_authentication_postflight_passed: false
        fe_cisco_ucs_security_hardening_authentication_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_authentication_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/authentication | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/authentication: FAILED at '{{ fe_cisco_ucs_security_hardening_authentication_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_authentication_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/authentication | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/authentication failed at '{{ fe_cisco_ucs_security_hardening_authentication_failed_task }}': {{ fe_cisco_ucs_security_hardening_authentication_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/authentication | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_authentication_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_authentication_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_authentication_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/authentication | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/authentication":
              component: "cisco/ucs_security_hardening/authentication"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_authentication_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_authentication_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_authentication_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_authentication_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_authentication_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_authentication_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_authentication_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_authentication_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_authentication_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_authentication_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_authentication_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_authentication_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/authentication'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/authentication | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_authentication_stats_published: true
      tags:
        - always
