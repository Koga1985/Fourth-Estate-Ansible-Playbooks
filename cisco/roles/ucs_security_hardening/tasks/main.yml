---
# tasks file for ucs_security_hardening
# DoD STIG and NIST 800-53 Security Hardening for Cisco UCS

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_status: "running"
    fe_cisco_ucs_security_hardening_preflight_passed: false
    fe_cisco_ucs_security_hardening_postflight_passed: false
    fe_cisco_ucs_security_hardening_failed_task: ""
    fe_cisco_ucs_security_hardening_error: ""
    fe_cisco_ucs_security_hardening_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include STIG Category I (High) findings remediation
      ansible.builtin.include_tasks: stig_cat1.yml
      when: stig_cat1_enabled | bool
      tags:
        - security
        - stig
        - cat1
        - high

    - name: Include STIG Category II (Medium) findings remediation
      ansible.builtin.include_tasks: stig_cat2.yml
      when: stig_cat2_enabled | bool
      tags:
        - security
        - stig
        - cat2
        - medium

    - name: Include STIG Category III (Low) findings remediation
      ansible.builtin.include_tasks: stig_cat3.yml
      when: stig_cat3_enabled | bool
      tags:
        - security
        - stig
        - cat3
        - low

    - name: Include access control hardening
      ansible.builtin.include_tasks: access_control.yml
      when: ac_enforce_rbac | bool
      tags:
        - security
        - access_control
        - nist_ac

    - name: Include authentication hardening
      ansible.builtin.include_tasks: authentication.yml
      when: ia_enable_strong_auth | bool
      tags:
        - security
        - authentication
        - nist_ia

    - name: Include audit and logging configuration
      ansible.builtin.include_tasks: audit_logging.yml
      when: au_enable_comprehensive_logging | bool
      tags:
        - security
        - audit
        - logging
        - nist_au

    - name: Include cryptographic controls
      ansible.builtin.include_tasks: cryptography.yml
      when: sc_enforce_strong_crypto | bool
      tags:
        - security
        - cryptography
        - nist_sc

    - name: Include network security controls
      ansible.builtin.include_tasks: network_security.yml
      when: sc_restrict_network_access | bool
      tags:
        - security
        - network
        - nist_sc

    - name: Include configuration management controls
      ansible.builtin.include_tasks: config_management.yml
      when: cm_baseline_config | bool
      tags:
        - security
        - config_management
        - nist_cm

    - name: Include system integrity controls
      ansible.builtin.include_tasks: system_integrity.yml
      when: si_enable_integrity_checks | bool
      tags:
        - security
        - integrity
        - nist_si

    - name: Include physical security controls
      ansible.builtin.include_tasks: physical_security.yml
      when: pe_enable_physical_controls | bool
      tags:
        - security
        - physical
        - nist_pe

    - name: Include DoD banner configuration
      ansible.builtin.include_tasks: dod_banner.yml
      when: dod_banner_enabled | bool
      tags:
        - security
        - banner
        - compliance

    - name: Include compliance verification
      ansible.builtin.include_tasks: compliance_verification.yml
      tags:
        - security
        - compliance
        - verification

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_postflight_passed: true
        fe_cisco_ucs_security_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_status: "failed"
        fe_cisco_ucs_security_hardening_postflight_passed: false
        fe_cisco_ucs_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening: FAILED at '{{ fe_cisco_ucs_security_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening failed at '{{ fe_cisco_ucs_security_hardening_failed_task }}': {{ fe_cisco_ucs_security_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening":
              component: "cisco/ucs_security_hardening"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stats_published: true
      tags:
        - always
