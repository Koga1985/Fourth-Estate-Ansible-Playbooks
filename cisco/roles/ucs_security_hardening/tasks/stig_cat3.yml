---
# STIG Category III (Low Severity) Findings Remediation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/stig_cat3']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_stig_cat3_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/stig_cat3 | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_stig_cat3_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_stig_cat3_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_stig_cat3_status: "running"
    fe_cisco_ucs_security_hardening_stig_cat3_preflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat3_postflight_passed: false
    fe_cisco_ucs_security_hardening_stig_cat3_failed_task: ""
    fe_cisco_ucs_security_hardening_stig_cat3_error: ""
    fe_cisco_ucs_security_hardening_stig_cat3_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/stig_cat3 | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/stig_cat3 | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat3: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/stig_cat3: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat3 | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/stig_cat3: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/stig_cat3: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_stig_cat3_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat3 | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat3_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: V-230560 - Configure system description
      cisco.ucs.ucs_system:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        descr: "{{ ucs_system_description }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230562 - Configure system contact information
      cisco.ucs.ucs_callhome:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        contact: "{{ fourth_estate_contact }}"
        phone: "{{ fourth_estate_phone }}"
        email: "{{ fourth_estate_email }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230565 - Configure timezone
      cisco.ucs.ucs_timezone:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        timezone: "{{ ucs_timezone }}"
      no_log: true
      when: apply_changes | bool

    - name: V-230570 - Enable configuration backup
      cisco.ucs.ucs_backup:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        type: "full-state"
        protocol: "scp"
        admin_state: "enabled"
      no_log: true
      when:
        - apply_changes | bool
        - ucs_backup_enabled | bool

    - name: V-230575 - Document network topology
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/network_topology.txt"
        mode: '0640'
        content: |
          UCS Network Topology Documentation
          ==================================
          Organization: {{ fourth_estate_org_name }}
          UCS Manager: {{ ucs_hostname }}

          This file should document the complete network topology
          including VLANs, VSANs, and connectivity details.
      delegate_to: localhost

    - name: Record STIG CAT III remediation
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/stig_cat3_remediation.txt"
        mode: '0640'
        content: |
          STIG Category III (Low) Remediation Applied
          ===========================================
          Date: {{ ansible_date_time.iso8601 }}

          V-230560: System description: Configured
          V-230562: Contact information: Configured
          V-230565: Timezone: {{ ucs_timezone }}
          V-230570: Configuration backup: {{ ucs_backup_enabled | ternary('Enabled', 'Disabled') }}
          V-230575: Network documentation: Created
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/stig_cat3 | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_stig_cat3_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_stig_cat3_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/stig_cat3: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_stig_cat3_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_stig_cat3_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/stig_cat3: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/stig_cat3 | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat3_postflight_passed: true
        fe_cisco_ucs_security_hardening_stig_cat3_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/stig_cat3 | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat3_status: "failed"
        fe_cisco_ucs_security_hardening_stig_cat3_postflight_passed: false
        fe_cisco_ucs_security_hardening_stig_cat3_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_stig_cat3_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat3 | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/stig_cat3: FAILED at '{{ fe_cisco_ucs_security_hardening_stig_cat3_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_stig_cat3_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/stig_cat3 | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/stig_cat3 failed at '{{ fe_cisco_ucs_security_hardening_stig_cat3_failed_task }}': {{ fe_cisco_ucs_security_hardening_stig_cat3_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/stig_cat3 | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat3_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_stig_cat3_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_stig_cat3_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat3 | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/stig_cat3":
              component: "cisco/ucs_security_hardening/stig_cat3"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_stig_cat3_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat3_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_stig_cat3_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_stig_cat3_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_stig_cat3_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat3_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_stig_cat3_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_stig_cat3_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_stig_cat3_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_stig_cat3_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_stig_cat3_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_stig_cat3_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/stig_cat3'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/stig_cat3 | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_stig_cat3_stats_published: true
      tags:
        - always
