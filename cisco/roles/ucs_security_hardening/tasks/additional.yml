---
# Additional tasks for ucs_security_hardening
# Cisco UCS Security Hardening - DISA STIG compliance and security controls

# Additional security hardening tasks for UCS

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/additional']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_additional_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/additional | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_additional_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_additional_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_additional_status: "running"
    fe_cisco_ucs_security_hardening_additional_preflight_passed: false
    fe_cisco_ucs_security_hardening_additional_postflight_passed: false
    fe_cisco_ucs_security_hardening_additional_failed_task: ""
    fe_cisco_ucs_security_hardening_additional_error: ""
    fe_cisco_ucs_security_hardening_additional_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/additional | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/additional | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/additional: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/additional: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/additional | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/additional: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/additional: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_additional_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/additional | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_additional_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure password policy (DISA STIG)
      cisco.ucs.ucs_managed_objects:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        objects:
          - module: ucsmsdk.mometa.aaa.AaaUserEp
            class: AaaUserEp
            properties:
              parent_mo_or_dn: "sys"
              pwd_strength_check: "yes"
      no_log: true
      when: apply_changes | bool
      tags: [security, stig]

    - name: Enable FIPS mode (DISA STIG requirement)
      cisco.ucs.ucs_managed_objects:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        objects:
          - module: ucsmsdk.mometa.sysdebug.SysdebugMEpLogPolicy
            class: SysdebugMEpLogPolicy
            properties:
              parent_mo_or_dn: "sys"
              fips_mode_enable: "yes"
      no_log: true
      when:
        - apply_changes | bool
        - enable_fips_mode | bool
      tags: [security, fips, stig]

    - name: Configure session timeout (DISA STIG)
      cisco.ucs.ucs_managed_objects:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        objects:
          - module: ucsmsdk.mometa.comm.CommHttp
            class: CommHttp
            properties:
              parent_mo_or_dn: "sys/svc-ext"
              session_timeout: "{{ session_timeout }}"
      no_log: true
      when: apply_changes | bool
      tags: [security, session, stig]

    - name: Disable insecure protocols (DISA STIG)
      cisco.ucs.ucs_managed_objects:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        objects:
          - module: ucsmsdk.mometa.comm.CommTelnet
            class: CommTelnet
            properties:
              parent_mo_or_dn: "sys/svc-ext"
              admin_state: "disabled"
          - module: ucsmsdk.mometa.comm.CommSnmp
            class: CommSnmp
            properties:
              parent_mo_or_dn: "sys/svc-ext"
              admin_state: "disabled"
              v3_privilege: "auth-priv"
      no_log: true
      when: apply_changes | bool
      tags: [security, protocols, stig]

    - name: Generate STIG compliance report
      ansible.builtin.template:
        src: stig_compliance_report.json.j2
        dest: "{{ ucs_artifacts_dir }}/ucs_stig_compliance_{{ ansible_date_time.epoch }}.json"
        mode: "0640"
      tags: [reporting, compliance, stig]

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/additional | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_additional_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_additional_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/additional: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_additional_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_additional_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/additional: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/additional | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_additional_postflight_passed: true
        fe_cisco_ucs_security_hardening_additional_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/additional | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_additional_status: "failed"
        fe_cisco_ucs_security_hardening_additional_postflight_passed: false
        fe_cisco_ucs_security_hardening_additional_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_additional_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/additional | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/additional: FAILED at '{{ fe_cisco_ucs_security_hardening_additional_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_additional_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/additional | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/additional failed at '{{ fe_cisco_ucs_security_hardening_additional_failed_task }}': {{ fe_cisco_ucs_security_hardening_additional_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/additional | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_additional_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_additional_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_additional_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/additional | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/additional":
              component: "cisco/ucs_security_hardening/additional"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_additional_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_additional_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_additional_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_additional_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_additional_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_additional_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_additional_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_additional_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_additional_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_additional_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_additional_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_additional_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/additional'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/additional | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_additional_stats_published: true
      tags:
        - always
