---
# System and Communications Protection (SC) - Cryptographic Controls

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_security_hardening/cryptography']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_security_hardening_cryptography_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_security_hardening/cryptography | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_security_hardening_cryptography_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_security_hardening_cryptography_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_security_hardening_cryptography_status: "running"
    fe_cisco_ucs_security_hardening_cryptography_preflight_passed: false
    fe_cisco_ucs_security_hardening_cryptography_postflight_passed: false
    fe_cisco_ucs_security_hardening_cryptography_failed_task: ""
    fe_cisco_ucs_security_hardening_cryptography_error: ""
    fe_cisco_ucs_security_hardening_cryptography_stats_published: false
  tags:
    - always

- name: "cisco/ucs_security_hardening/cryptography | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_security_hardening/cryptography | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_security_hardening/cryptography: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_security_hardening/cryptography: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/cryptography | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_security_hardening/cryptography: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_security_hardening/cryptography: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_security_hardening_cryptography_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_security_hardening/cryptography | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_cryptography_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: SC-8 - Configure strong TLS cipher suites
      cisco.ucs.ucs_https_cipher:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        cipher_suite: "{{ sc_cipher_suite }}"
      no_log: true
      when: apply_changes | bool

    - name: SC-8 - Disable weak SSL/TLS protocols
      cisco.ucs.ucs_https_protocol:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        tls_v1_enabled: "{{ sc_enable_tls_10 | ternary('yes', 'no') }}"
        tls_v1_1_enabled: "{{ sc_enable_tls_11 | ternary('yes', 'no') }}"
        tls_v1_2_enabled: "yes"
      no_log: true
      when: apply_changes | bool

    - name: SC-12 - Configure certificate management
      cisco.ucs.ucs_certificate:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        cert_file: "{{ sc_certificate_file }}"
        key_file: "{{ sc_certificate_key_file }}"
      no_log: true
      when:
        - apply_changes | bool
        - sc_custom_certificate | bool

    - name: SC-13 - Enforce FIPS 140-2 mode (if supported)
      ansible.builtin.debug:
        msg: "FIPS 140-2 mode: {{ sc_enforce_fips_140_2 | ternary('Enabled', 'Disabled') }}"

    - name: SC-17 - Configure public key infrastructure certificates
      ansible.builtin.debug:
        msg: "Ensure PKI certificates are properly configured and valid"

    - name: SC-23 - Protect session authenticity with strong crypto
      ansible.builtin.debug:
        msg: "Session cookies use strong cryptographic protection"

    - name: Record cryptography configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/cryptography.json"
        mode: '0640'
        content: |
          {
            "nist_controls": ["SC-8", "SC-12", "SC-13", "SC-17", "SC-23"],
            "tls_1.0": {{ sc_enable_tls_10 | to_json }},
            "tls_1.1": {{ sc_enable_tls_11 | to_json }},
            "tls_1.2": true,
            "cipher_suite": "{{ sc_cipher_suite }}",
            "fips_140_2": {{ sc_enforce_fips_140_2 | to_json }},
            "custom_certificate": {{ sc_custom_certificate | to_json }},
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_security_hardening/cryptography | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_security_hardening_cryptography_preflight_passed | bool
          - fe_cisco_ucs_security_hardening_cryptography_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_security_hardening/cryptography: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_security_hardening_cryptography_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_security_hardening_cryptography_status | default('unknown') }}.
        success_msg: "cisco/ucs_security_hardening/cryptography: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_security_hardening/cryptography | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_cryptography_postflight_passed: true
        fe_cisco_ucs_security_hardening_cryptography_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_security_hardening/cryptography | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_cryptography_status: "failed"
        fe_cisco_ucs_security_hardening_cryptography_postflight_passed: false
        fe_cisco_ucs_security_hardening_cryptography_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_security_hardening_cryptography_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/cryptography | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_security_hardening/cryptography: FAILED at '{{ fe_cisco_ucs_security_hardening_cryptography_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_security_hardening_cryptography_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_security_hardening/cryptography | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_security_hardening/cryptography failed at '{{ fe_cisco_ucs_security_hardening_cryptography_failed_task }}': {{ fe_cisco_ucs_security_hardening_cryptography_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_security_hardening/cryptography | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_cryptography_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_security_hardening_cryptography_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_security_hardening_cryptography_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_security_hardening/cryptography | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_security_hardening/cryptography":
              component: "cisco/ucs_security_hardening/cryptography"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_security_hardening_cryptography_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_security_hardening_cryptography_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_security_hardening_cryptography_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_security_hardening_cryptography_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_security_hardening_cryptography_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_security_hardening_cryptography_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_security_hardening_cryptography_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_security_hardening_cryptography_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_security_hardening_cryptography_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_security_hardening_cryptography_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_security_hardening_cryptography_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_security_hardening_cryptography_status | default('') == 'succeeded' else ['cisco/ucs_security_hardening/cryptography'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_security_hardening/cryptography | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_security_hardening_cryptography_stats_published: true
      tags:
        - always
