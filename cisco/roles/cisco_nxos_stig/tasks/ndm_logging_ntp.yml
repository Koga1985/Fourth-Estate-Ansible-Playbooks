---
# Logging and authenticated NTP
# CISC-ND-000090/000100/000110 (logging) | CISC-ND-000470/000490 (NTP)
# NIST AU-3, AU-4, AU-8

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_nxos_stig/ndm_logging_ntp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_nxos_stig_ndm_logging_ntp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status: "running"
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_preflight_passed: false
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_postflight_passed: false
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_failed_task: ""
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_error: ""
    fe_cisco_cisco_nxos_stig_ndm_logging_ntp_stats_published: false
  tags:
    - always

- name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_nxos_stig/ndm_logging_ntp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_nxos_stig/ndm_logging_ntp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_nxos_stig/ndm_logging_ntp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_nxos_stig/ndm_logging_ntp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-ND-000090 - Configure remote syslog servers
      cisco.nxos.nxos_config:
        lines:
          - "logging server {{ item.host }} {{ item.severity }} use-vrf management"
      loop: "{{ nxos_logging_servers }}"
      loop_control:
        label: "{{ item.host }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_logging_servers_result
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000090"]

    - name: CISC-ND-000100/000110 - Logging timestamp and levels
      cisco.nxos.nxos_config:
        lines:
          - logging timestamp milliseconds
          - "logging console {{ nxos_logging_level_console }}"
          - logging monitor 6
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_logging_opts
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000100", "CISC-ND-000110"]

    - name: CISC-ND-000470 - Configure authenticated NTP
      cisco.nxos.nxos_config:
        lines: "{{ ['ntp authenticate', 'ntp authentication-key ' + (nxos_ntp_key_id | string) + ' md5 ' + nxos_ntp_key, 'ntp trusted-key ' + (nxos_ntp_key_id | string)] + (nxos_ntp_servers | map('regex_replace', '^(.*)$', 'ntp server \\1 key ' + (nxos_ntp_key_id | string) + ' use-vrf management') | list) }}"
      no_log: true
      when: nxos_ntp_authenticate | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_ntp
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000470"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_nxos_stig_ndm_logging_ntp_preflight_passed | bool
          - fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_nxos_stig/ndm_logging_ntp: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status | default('unknown') }}.
        success_msg: "cisco/cisco_nxos_stig/ndm_logging_ntp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_postflight_passed: true
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status: "failed"
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_postflight_passed: false
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_nxos_stig/ndm_logging_ntp: FAILED at '{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_nxos_stig/ndm_logging_ntp failed at '{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_failed_task }}': {{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_nxos_stig_ndm_logging_ntp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_nxos_stig/ndm_logging_ntp":
              component: "cisco/cisco_nxos_stig/ndm_logging_ntp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_nxos_stig_ndm_logging_ntp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_nxos_stig_ndm_logging_ntp_status | default('') == 'succeeded' else ['cisco/cisco_nxos_stig/ndm_logging_ntp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/ndm_logging_ntp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_logging_ntp_stats_published: true
      tags:
        - always
