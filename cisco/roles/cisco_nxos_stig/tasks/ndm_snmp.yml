---
# SNMPv3 only - remove v1/v2c communities
# CISC-ND-000150/000160 | NIST SC-8, IA-2

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_nxos_stig/ndm_snmp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_nxos_stig_ndm_snmp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_nxos_stig/ndm_snmp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_nxos_stig_ndm_snmp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_nxos_stig_ndm_snmp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_nxos_stig_ndm_snmp_status: "running"
    fe_cisco_cisco_nxos_stig_ndm_snmp_preflight_passed: false
    fe_cisco_cisco_nxos_stig_ndm_snmp_postflight_passed: false
    fe_cisco_cisco_nxos_stig_ndm_snmp_failed_task: ""
    fe_cisco_cisco_nxos_stig_ndm_snmp_error: ""
    fe_cisco_cisco_nxos_stig_ndm_snmp_stats_published: false
  tags:
    - always

- name: "cisco/cisco_nxos_stig/ndm_snmp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_nxos_stig/ndm_snmp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_nxos_stig/ndm_snmp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_nxos_stig/ndm_snmp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_nxos_stig/ndm_snmp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_snmp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-ND-000150 - Remove insecure SNMP communities
      cisco.nxos.nxos_config:
        lines:
          - "no snmp-server community {{ item }}"
      loop: "{{ nxos_snmp_remove_communities }}"
      loop_control:
        label: "{{ item }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_snmp_communities
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000150"]

    - name: CISC-ND-000150/000160 - Configure SNMPv3 user (auth SHA + priv AES-128)
      cisco.nxos.nxos_config:
        lines:
          - "snmp-server user {{ nxos_snmp_v3_user }} {{ nxos_snmp_v3_role }} auth sha {{ nxos_snmp_v3_auth }} priv aes-128 {{ nxos_snmp_v3_priv }}"
      no_log: true
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_snmp_user
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-000150", "CISC-ND-000160"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_nxos_stig_ndm_snmp_preflight_passed | bool
          - fe_cisco_cisco_nxos_stig_ndm_snmp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_nxos_stig/ndm_snmp: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_nxos_stig_ndm_snmp_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_nxos_stig_ndm_snmp_status | default('unknown') }}.
        success_msg: "cisco/cisco_nxos_stig/ndm_snmp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_snmp_postflight_passed: true
        fe_cisco_cisco_nxos_stig_ndm_snmp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_snmp_status: "failed"
        fe_cisco_cisco_nxos_stig_ndm_snmp_postflight_passed: false
        fe_cisco_cisco_nxos_stig_ndm_snmp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_nxos_stig_ndm_snmp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_nxos_stig/ndm_snmp: FAILED at '{{ fe_cisco_cisco_nxos_stig_ndm_snmp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_nxos_stig_ndm_snmp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_nxos_stig/ndm_snmp failed at '{{ fe_cisco_cisco_nxos_stig_ndm_snmp_failed_task }}': {{ fe_cisco_cisco_nxos_stig_ndm_snmp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_snmp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_nxos_stig_ndm_snmp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_nxos_stig_ndm_snmp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_nxos_stig/ndm_snmp":
              component: "cisco/cisco_nxos_stig/ndm_snmp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_nxos_stig_ndm_snmp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_nxos_stig_ndm_snmp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_nxos_stig_ndm_snmp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_nxos_stig_ndm_snmp_status | default('') == 'succeeded' else ['cisco/cisco_nxos_stig/ndm_snmp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/ndm_snmp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_ndm_snmp_stats_published: true
      tags:
        - always
