---
# Layer-2 hardening and Control Plane Policing
# CISC-L2-000050 (DHCP snooping) | CISC-L2-000070 (DAI)
# CISC-L2-000020 (BPDU guard) | CISC-L2-000030 (loop guard)
# CISC-L2-000160 (native VLAN) | CISC-ND-001220 (CoPP)
# NIST SC-5, SC-7

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_nxos_stig/l2_hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_nxos_stig_l2_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_nxos_stig/l2_hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_nxos_stig_l2_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_nxos_stig_l2_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_nxos_stig_l2_hardening_status: "running"
    fe_cisco_cisco_nxos_stig_l2_hardening_preflight_passed: false
    fe_cisco_cisco_nxos_stig_l2_hardening_postflight_passed: false
    fe_cisco_cisco_nxos_stig_l2_hardening_failed_task: ""
    fe_cisco_cisco_nxos_stig_l2_hardening_error: ""
    fe_cisco_cisco_nxos_stig_l2_hardening_stats_published: false
  tags:
    - always

- name: "cisco/cisco_nxos_stig/l2_hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_nxos_stig/l2_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_nxos_stig/l2_hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_nxos_stig/l2_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/l2_hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_nxos_stig/l2_hardening: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_nxos_stig/l2_hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_nxos_stig/l2_hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_l2_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-L2-000050 - Enable DHCP feature and snooping
      cisco.nxos.nxos_config:
        lines:
          - feature dhcp
          - ip dhcp snooping
          - "ip dhcp snooping vlan {{ nxos_user_vlans | join(',') }}"
      when: nxos_enable_dhcp_snooping | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_dhcp_snoop
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000050"]

    - name: CISC-L2-000070 - Enable Dynamic ARP Inspection on user VLANs
      cisco.nxos.nxos_config:
        lines:
          - "ip arp inspection vlan {{ nxos_user_vlans | join(',') }}"
      when: nxos_enable_arp_inspection | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_dai
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000070"]

    - name: CISC-L2-000020 - Enable BPDU Guard on edge ports by default
      cisco.nxos.nxos_config:
        lines:
          - spanning-tree port type edge bpduguard default
      when: nxos_enable_bpduguard_default | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_bpduguard
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000020"]

    - name: CISC-L2-000030 - Enable Loop Guard by default
      cisco.nxos.nxos_config:
        lines:
          - spanning-tree loopguard default
      when: nxos_enable_loopguard_default | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_loopguard
      notify: save running-config
      tags: [stig_cat2, "CISC-L2-000030"]

    - name: CISC-ND-001220 - Apply Control Plane Policing profile
      cisco.nxos.nxos_config:
        lines:
          - "copp profile {{ nxos_copp_profile }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: nxos_copp
      notify: save running-config
      tags: [stig_cat2, "CISC-ND-001220"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_nxos_stig/l2_hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_nxos_stig_l2_hardening_preflight_passed | bool
          - fe_cisco_cisco_nxos_stig_l2_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_nxos_stig/l2_hardening: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_nxos_stig_l2_hardening_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_nxos_stig_l2_hardening_status | default('unknown') }}.
        success_msg: "cisco/cisco_nxos_stig/l2_hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_nxos_stig/l2_hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_l2_hardening_postflight_passed: true
        fe_cisco_cisco_nxos_stig_l2_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_nxos_stig/l2_hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_l2_hardening_status: "failed"
        fe_cisco_cisco_nxos_stig_l2_hardening_postflight_passed: false
        fe_cisco_cisco_nxos_stig_l2_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_nxos_stig_l2_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/l2_hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_nxos_stig/l2_hardening: FAILED at '{{ fe_cisco_cisco_nxos_stig_l2_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_nxos_stig_l2_hardening_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_nxos_stig/l2_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_nxos_stig/l2_hardening failed at '{{ fe_cisco_cisco_nxos_stig_l2_hardening_failed_task }}': {{ fe_cisco_cisco_nxos_stig_l2_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_nxos_stig/l2_hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_l2_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_nxos_stig_l2_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_nxos_stig_l2_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/l2_hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_nxos_stig/l2_hardening":
              component: "cisco/cisco_nxos_stig/l2_hardening"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_nxos_stig_l2_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_nxos_stig_l2_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_nxos_stig_l2_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_nxos_stig_l2_hardening_status | default('') == 'succeeded' else ['cisco/cisco_nxos_stig/l2_hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_nxos_stig/l2_hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_nxos_stig_l2_hardening_stats_published: true
      tags:
        - always
