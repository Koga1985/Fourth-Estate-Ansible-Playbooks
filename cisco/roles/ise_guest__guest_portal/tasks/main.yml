---
# tasks file for ise_guest__guest_portal
# Cisco ISE Guest Portal Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ise_guest__guest_portal']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ise_guest__guest_portal_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ise_guest__guest_portal | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ise_guest__guest_portal_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ise_guest__guest_portal_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ise_guest__guest_portal_status: "running"
    fe_cisco_ise_guest__guest_portal_preflight_passed: false
    fe_cisco_ise_guest__guest_portal_postflight_passed: false
    fe_cisco_ise_guest__guest_portal_failed_task: ""
    fe_cisco_ise_guest__guest_portal_error: ""
    fe_cisco_ise_guest__guest_portal_stats_published: false
  tags:
    - always

- name: "cisco/ise_guest__guest_portal | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ise_guest__guest_portal | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ise_guest__guest_portal: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ise_guest__guest_portal: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ise_guest__guest_portal | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ise_guest__guest_portal: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ise_guest__guest_portal: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ise_guest__guest_portal_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ise_guest__guest_portal | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ise_guest__guest_portal_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate ISE connection parameters
      ansible.builtin.assert:
        that:
          - ise_hostname is defined
          - ise_username is defined
          - ise_password is defined
        fail_msg: "Required ISE connection parameters not defined"
      tags: [validation, prerequisites]

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ ise_artifacts_dir }}"
        state: directory
        mode: "0750"
      tags: [always]

    - name: Configure guest portal
      cisco.ise.guest_portal:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
        state: present
        name: "{{ guest_portal_name }}"
        portalType: "GUEST"
        settings:
          portalSettings:
            certificateGroupTag: "{{ guest_portal_cert_group }}"
            endpointIdentityGroup: "{{ guest_endpoint_group }}"
            displayLang: "{{ guest_portal_language | default('ENGLISH') }}"
          guestChangePasswordSettings:
            allowChangePasswdAtFirstLogin: "{{ guest_allow_password_change }}"
          guestDeviceRegistrationSettings:
            allowGuestToRegisterDevices: "{{ guest_allow_device_registration }}"
          aupSettings:
            includeAup: "{{ guest_require_aup }}"
            requireAupAcceptance: "{{ guest_require_aup }}"
      no_log: true
      when: apply_changes | bool
      tags: [guest, portal]

    - name: Customize portal branding
      ansible.builtin.uri:
        url: "https://{{ ise_hostname }}/ers/config/portal/{{ guest_portal_id }}/customization"
        method: PUT
        user: "{{ ise_username }}"
        password: "{{ ise_password }}"
        force_basic_auth: true
        validate_certs: "{{ ise_verify_ssl }}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          portalCustomization:
            bannerTitle: "{{ guest_portal_banner_title }}"
            bannerImage: "{{ guest_portal_banner_image | default(omit) }}"
            backgroundColor: "{{ guest_portal_bg_color }}"
      no_log: true
      when:
        - apply_changes | bool
        - guest_portal_customization_enabled | bool
      tags: [guest, portal, branding]

    - name: Generate guest portal report
      ansible.builtin.template:
        src: ise_guest__guest_portal_report.json.j2
        dest: "{{ ise_artifacts_dir }}/guest_portal_{{ ansible_date_time.epoch }}.json"
        mode: "0640"
      tags: [reporting]

    # ----------------------------- postflight -------------------

    - name: "cisco/ise_guest__guest_portal | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ise_guest__guest_portal_preflight_passed | bool
          - fe_cisco_ise_guest__guest_portal_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ise_guest__guest_portal: postflight validation failed - preflight passed
          ={{ fe_cisco_ise_guest__guest_portal_preflight_passed | default(false) }},
          status={{ fe_cisco_ise_guest__guest_portal_status | default('unknown') }}.
        success_msg: "cisco/ise_guest__guest_portal: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ise_guest__guest_portal | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ise_guest__guest_portal_postflight_passed: true
        fe_cisco_ise_guest__guest_portal_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ise_guest__guest_portal | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ise_guest__guest_portal_status: "failed"
        fe_cisco_ise_guest__guest_portal_postflight_passed: false
        fe_cisco_ise_guest__guest_portal_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ise_guest__guest_portal_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ise_guest__guest_portal | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ise_guest__guest_portal: FAILED at '{{ fe_cisco_ise_guest__guest_portal_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ise_guest__guest_portal_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ise_guest__guest_portal | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ise_guest__guest_portal failed at '{{ fe_cisco_ise_guest__guest_portal_failed_task }}': {{ fe_cisco_ise_guest__guest_portal_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ise_guest__guest_portal | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ise_guest__guest_portal_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ise_guest__guest_portal_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ise_guest__guest_portal_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ise_guest__guest_portal | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ise_guest__guest_portal":
              component: "cisco/ise_guest__guest_portal"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ise_guest__guest_portal_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ise_guest__guest_portal_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ise_guest__guest_portal_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ise_guest__guest_portal_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ise_guest__guest_portal_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ise_guest__guest_portal_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ise_guest__guest_portal_failed_task | default('') }}"
              error: "{{ fe_cisco_ise_guest__guest_portal_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ise_guest__guest_portal_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ise_guest__guest_portal_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ise_guest__guest_portal_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ise_guest__guest_portal_status | default('') == 'succeeded' else ['cisco/ise_guest__guest_portal'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ise_guest__guest_portal | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ise_guest__guest_portal_stats_published: true
      tags:
        - always
