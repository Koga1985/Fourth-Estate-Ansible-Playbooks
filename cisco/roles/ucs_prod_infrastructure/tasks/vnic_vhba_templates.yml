---
# vNIC and vHBA template configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/vnic_vhba_templates']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status: "running"
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_error: ""
    fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/vnic_vhba_templates: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/vnic_vhba_templates: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/vnic_vhba_templates: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/vnic_vhba_templates: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create vNIC templates for fourth estate
      cisco.ucs.ucs_vnic_template:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        fabric: "{{ item.fabric }}"
        template_type: "{{ item.template_type | default('updating-template') }}"
        vlans_list: "{{ item.vlans }}"
        cdn_source: "{{ item.cdn_source | default('vnic-name') }}"
        mtu: "{{ item.mtu | default('1500') }}"
        mac_pool: "{{ item.mac_pool }}"
        network_control_policy: "{{ item.network_control_policy | default('') }}"
        qos_policy: "{{ item.qos_policy | default('') }}"
        state: present
      no_log: true
      loop: "{{ ucs_vnic_templates }}"
      when: apply_changes | bool

    - name: Create vHBA templates for SAN connectivity
      cisco.ucs.ucs_vhba_template:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        fabric: "{{ item.fabric }}"
        vsan: "{{ item.vsan }}"
        template_type: "{{ item.template_type | default('updating-template') }}"
        wwpn_pool: "{{ item.wwpn_pool }}"
        max_data_field_size: "{{ item.max_data_field_size | default('2048') }}"
        qos_policy: "{{ item.qos_policy | default('') }}"
        state: present
      no_log: true
      loop: "{{ ucs_vhba_templates }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool

    - name: Create LAN connectivity policies
      cisco.ucs.ucs_lan_connectivity:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        vnic_list: "{{ item.vnics }}"
        state: present
      no_log: true
      loop: "{{ ucs_lan_connectivity_policies }}"
      when: apply_changes | bool

    - name: Create SAN connectivity policies
      cisco.ucs.ucs_san_connectivity:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        vhba_list: "{{ item.vhbas }}"
        wwnn_pool: "{{ item.wwnn_pool }}"
        state: present
      no_log: true
      loop: "{{ ucs_san_connectivity_policies }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/vnic_vhba_templates: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/vnic_vhba_templates: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status: "failed"
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/vnic_vhba_templates: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/vnic_vhba_templates failed at '{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/vnic_vhba_templates":
              component: "cisco/ucs_prod_infrastructure/vnic_vhba_templates"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/vnic_vhba_templates'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/vnic_vhba_templates | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_vnic_vhba_templates_stats_published: true
      tags:
        - always
