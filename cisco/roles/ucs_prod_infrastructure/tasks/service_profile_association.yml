---
# Service Profile Association Tasks
# Associates service profiles with physical servers in the UCS cluster

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/service_profile_association']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_service_profile_association_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/service_profile_association | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_service_profile_association_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_service_profile_association_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_service_profile_association_status: "running"
    fe_cisco_ucs_prod_infrastructure_service_profile_association_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_service_profile_association_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_service_profile_association_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_service_profile_association_error: ""
    fe_cisco_ucs_prod_infrastructure_service_profile_association_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/service_profile_association | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/service_profile_association: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/service_profile_association: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/service_profile_association: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/service_profile_association: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profile_association_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display service profile association banner
      ansible.builtin.debug:
        msg: |
          ========================================
          Service Profile Association
          ========================================
          Organization: {{ fourth_estate_org_name }}
          Association Mode: {{ sp_association_mode | default('auto') }}
          ========================================

    - name: Query available blade servers
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: computeBlade
      no_log: true
      register: blade_servers
      delegate_to: localhost

    - name: Query available rack servers
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: computeRackUnit
      no_log: true
      register: rack_servers
      delegate_to: localhost

    - name: Display available servers
      ansible.builtin.debug:
        msg: |
          Available Servers in UCS Cluster:

          Blade Servers ({{ blade_servers.objects | length }}):
          {% for blade in blade_servers.objects %}
          - {{ blade.dn }}: {{ blade.model }} - {{ blade.oper_state }} - {{ blade.association }}
          {% endfor %}

          Rack Servers ({{ rack_servers.objects | length }}):
          {% for rack in rack_servers.objects %}
          - {{ rack.dn }}: {{ rack.model }} - {{ rack.oper_state }} - {{ rack.association }}
          {% endfor %}

    - name: Query existing service profiles
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: lsServer
        filter_str: "dn contains 'org-{{ fourth_estate_org_name }}'"
      no_log: true
      register: service_profiles
      delegate_to: localhost

    - name: Display service profiles and their association status
      ansible.builtin.debug:
        msg: |
          Service Profiles in {{ fourth_estate_org_name }}:
          {% for sp in service_profiles.objects %}
          - {{ sp.name }}:
              Type: {{ sp.type }}
              Association: {{ sp.assoc_state }}
              Server: {{ sp.pn_dn if sp.pn_dn else 'Not associated' }}
              Operational State: {{ sp.oper_state }}
          {% endfor %}

    - name: Associate service profiles with servers (manual mode)
      cisco.ucs.ucs_service_profile_association:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        service_profile_name: "{{ item.service_profile }}"
        server_dn: "{{ item.server_dn }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        state: "{{ 'present' if apply_changes else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ sp_manual_associations }}"
      when:
        - sp_manual_associations is defined
        - sp_association_mode | default('auto') == 'manual'
        - apply_changes | default(false)
      register: manual_associations
      delegate_to: localhost

    - name: Configure server pool for auto-association
      cisco.ucs.ucs_server_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        name: "{{ sp_server_pool_name | default('FourthEstate-Pool') }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        state: "{{ 'present' if apply_changes else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      when:
        - sp_association_mode | default('auto') == 'auto'
        - apply_changes | default(false)
      delegate_to: localhost

    - name: Add servers to server pool for auto-association
      ansible.builtin.debug:
        msg: "Adding server {{ item.server_dn }} to pool {{ sp_server_pool_name | default('FourthEstate-Pool') }}"
      loop: "{{ sp_pool_servers }}"
      when:
        - sp_pool_servers is defined
        - sp_association_mode | default('auto') == 'auto'

    - name: Enable auto-association on service profile template
      ansible.builtin.debug:
        msg: "Enabling auto-association for service profile template {{ item }}"
      loop: "{{ sp_templates_for_auto_assoc }}"
      when:
        - sp_templates_for_auto_assoc is defined
        - sp_association_mode | default('auto') == 'auto'

    - name: Query service profile association faults
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: faultInst
        filter_str: "affected RN contains 'ls-'"
      no_log: true
      register: sp_faults
      delegate_to: localhost

    - name: Display service profile association faults
      ansible.builtin.debug:
        msg: |
          Service Profile Association Faults:
          {% if sp_faults.objects | length > 0 %}
          {% for fault in sp_faults.objects %}
          - [{{ fault.severity }}] {{ fault.descr }}
            Affected: {{ fault.affected }}
          {% endfor %}
          {% else %}
          No association faults detected
          {% endif %}

    - name: Re-query service profiles after association
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: lsServer
        filter_str: "dn contains 'org-{{ fourth_estate_org_name }}'"
      no_log: true
      register: updated_service_profiles
      delegate_to: localhost

    - name: Generate service profile association report
      ansible.builtin.copy:
        content: |
          ================================================================================
          Service Profile Association Report
          ================================================================================
          Generated: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}
          Association Mode: {{ sp_association_mode | default('auto') }}

          Available Servers:
          - Blade Servers: {{ blade_servers.objects | length }}
          - Rack Servers: {{ rack_servers.objects | length }}
          - Total: {{ blade_servers.objects | length + rack_servers.objects | length }}

          Service Profile Association Status:
          {% for sp in updated_service_profiles.objects %}
          - {{ sp.name }}:
              Type: {{ sp.type }}
              Association State: {{ sp.assoc_state }}
              Assigned Server: {{ sp.pn_dn if sp.pn_dn else 'Not associated' }}
              Operational State: {{ sp.oper_state }}
              Configuration State: {{ sp.config_state }}
          {% endfor %}

          Association Summary:
          - Total Service Profiles: {{ updated_service_profiles.objects | length }}
          - Associated: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'associated') | list | length }}
          - Associating: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'associating') | list | length }}
          - Unassociated: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'unassociated') | list | length }}
          - Failed: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'failed') | list | length }}

          Association Faults:
          {% if sp_faults.objects | length > 0 %}
          {% for fault in sp_faults.objects %}
          - [{{ fault.severity }}] {{ fault.descr }}
            Affected: {{ fault.affected }}
          {% endfor %}
          {% else %}
          No association faults detected
          {% endif %}

          {% if sp_association_mode | default('auto') == 'manual' and sp_manual_associations is defined %}
          Manual Associations Configured:
          {% for assoc in sp_manual_associations %}
          - Service Profile: {{ assoc.service_profile }}
            Server: {{ assoc.server_dn }}
          {% endfor %}
          {% endif %}

          {% if sp_association_mode | default('auto') == 'auto' %}
          Auto-Association Configuration:
          - Server Pool: {{ sp_server_pool_name | default('FourthEstate-Pool') }}
          - Templates Enabled: {{ sp_templates_for_auto_assoc | length if sp_templates_for_auto_assoc is defined else 0 }}
          {% endif %}

          Configuration Status: {{ 'APPLIED' if apply_changes else 'DRY-RUN (no changes made)' }}
          ================================================================================
        dest: "{{ ucs_artifacts_dir }}/service_profile_association.txt"
        mode: '0644'
      delegate_to: localhost

    - name: Display service profile association summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Service Profile Association Complete
          ========================================
          Status: {{ 'APPLIED' if apply_changes else 'DRY-RUN' }}
          Total Service Profiles: {{ updated_service_profiles.objects | length }}
          Associated: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'associated') | list | length }}
          Failed: {{ updated_service_profiles.objects | selectattr('assoc_state', 'equalto', 'failed') | list | length }}
          Report: {{ ucs_artifacts_dir }}/service_profile_association.txt
          ========================================

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_service_profile_association_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_service_profile_association_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/service_profile_association: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_service_profile_association_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_service_profile_association_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/service_profile_association: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profile_association_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_service_profile_association_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profile_association_status: "failed"
        fe_cisco_ucs_prod_infrastructure_service_profile_association_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_service_profile_association_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_service_profile_association_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/service_profile_association: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_service_profile_association_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/service_profile_association failed at '{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_service_profile_association_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profile_association_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_service_profile_association_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_service_profile_association_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/service_profile_association":
              component: "cisco/ucs_prod_infrastructure/service_profile_association"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_service_profile_association_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_service_profile_association_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_service_profile_association_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_service_profile_association_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/service_profile_association'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/service_profile_association | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profile_association_stats_published: true
      tags:
        - always
