---
# Chassis and FEX discovery tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/chassis_discovery']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_chassis_discovery_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/chassis_discovery | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_status: "running"
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_error: ""
    fe_cisco_ucs_prod_infrastructure_chassis_discovery_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/chassis_discovery | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/chassis_discovery: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/chassis_discovery: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/chassis_discovery: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/chassis_discovery: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure chassis discovery policy
      cisco.ucs.ucs_chassis_discovery:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        link_aggregation_pref: "{{ ucs_chassis_link_aggregation }}"
        num_links: "{{ ucs_chassis_num_links }}"
      no_log: true
      when: apply_changes | bool

    - name: Query discovered chassis
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: equipmentChassis
      no_log: true
      register: discovered_chassis

    - name: Acknowledge chassis
      cisco.ucs.ucs_chassis:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        chassis_id: "{{ item.id }}"
        user_label: "{{ fourth_estate_org_name }}-Chassis-{{ item.id }}"
        state: present
      no_log: true
      loop: "{{ discovered_chassis.objects }}"
      when:
        - apply_changes | bool
        - discovered_chassis.objects is defined

    - name: Record chassis inventory
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/chassis_inventory.json"
        mode: '0640'
        content: "{{ discovered_chassis | to_nice_json }}"
      delegate_to: localhost
      when: discovered_chassis.objects is defined

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_chassis_discovery_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_chassis_discovery_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/chassis_discovery: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/chassis_discovery: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_status: "failed"
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/chassis_discovery: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/chassis_discovery failed at '{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_chassis_discovery_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/chassis_discovery":
              component: "cisco/ucs_prod_infrastructure/chassis_discovery"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_chassis_discovery_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_chassis_discovery_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_chassis_discovery_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_chassis_discovery_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/chassis_discovery'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/chassis_discovery | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_chassis_discovery_stats_published: true
      tags:
        - always
