---
# Validation and verification tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_validation_status: "running"
    fe_cisco_ucs_prod_infrastructure_validation_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_validation_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_validation_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_validation_error: ""
    fe_cisco_ucs_prod_infrastructure_validation_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query all faults in UCS domain
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: faultInst
        filter_string: "severity eq 'critical' or severity eq 'major'"
      no_log: true
      register: ucs_faults

    - name: Display critical and major faults
      ansible.builtin.debug:
        msg: "Found {{ ucs_faults.objects | length }} critical/major faults"
      when: ucs_faults.objects is defined

    - name: Save fault report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/fault_report.json"
        mode: '0640'
        content: "{{ ucs_faults | to_nice_json }}"
      delegate_to: localhost
      when: ucs_faults.objects is defined

    - name: Query service profile association status
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: lsServer
        distinguished_names: "org-root/org-{{ fourth_estate_org_name }}"
      no_log: true
      register: service_profiles_status

    - name: Verify service profile associations
      ansible.builtin.debug:
        msg: "Service profiles in {{ fourth_estate_org_name }}: {{ service_profiles_status.objects | length }}"

    - name: Generate deployment summary report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/deployment_summary.txt"
        mode: '0640'
        content: |
          Cisco UCS Infrastructure Deployment Summary
          ==========================================
          Organization: {{ fourth_estate_org_name }}
          UCS Manager: {{ ucs_hostname }}
          Deployment Date: {{ ansible_date_time.iso8601 }}

          Configuration Applied: {{ apply_changes | ternary('Yes', 'No - Dry Run') }}

          Service Profiles: {{ service_profiles_status.objects | length }}
          Critical/Major Faults: {{ ucs_faults.objects | length }}

          Compliance Frameworks:
          {% for framework in compliance_frameworks %}
          - {{ framework }}
          {% endfor %}

          Deployment completed successfully.
      delegate_to: localhost

    # --------------------------- evidence delivery --------------------------
    # Writing the report to ucs_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "cisco/ucs_prod_infrastructure/validation | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ ucs_artifacts_dir }}"
        patterns: "fault_report.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "cisco/ucs_prod_infrastructure/validation | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "cisco/ucs_prod_infrastructure/validation | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "cisco/ucs_prod_infrastructure/validation | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "cisco/ucs_prod_infrastructure/validation":
              component: "cisco/ucs_prod_infrastructure/validation"
              platform: "cisco"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ ucs_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_validation_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_validation_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_validation_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_validation_status: "failed"
        fe_cisco_ucs_prod_infrastructure_validation_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/validation: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/validation failed at '{{ fe_cisco_ucs_prod_infrastructure_validation_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/validation":
              component: "cisco/ucs_prod_infrastructure/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_validation_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_validation_stats_published: true
      tags:
        - always
