---
# Blade and rack server configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/server_configuration']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_server_configuration_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/server_configuration | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_server_configuration_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_server_configuration_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_server_configuration_status: "running"
    fe_cisco_ucs_prod_infrastructure_server_configuration_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_server_configuration_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_server_configuration_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_server_configuration_error: ""
    fe_cisco_ucs_prod_infrastructure_server_configuration_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/server_configuration | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/server_configuration: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/server_configuration: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/server_configuration: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/server_configuration: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_server_configuration_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query available servers
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        class_ids: computeBlade,computeRackUnit
      no_log: true
      register: available_servers

    - name: Associate service profiles from templates
      cisco.ucs.ucs_service_profile_from_template:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        source_template: "{{ item.template }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        server_pool: "{{ item.server_pool | default('') }}"
        server_assignment: "{{ item.server_assignment | default('pool') }}"
        description: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_service_profile_instances }}"
      when:
        - apply_changes | bool
        - ucs_auto_associate_servers | bool

    - name: Configure server power policies
      cisco.ucs.ucs_power_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        prio: "{{ item.priority | default('no-cap') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_power_policies }}"
      when: apply_changes | bool

    - name: Configure local disk configuration policies
      cisco.ucs.ucs_disk_group_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        raid_level: "{{ item.raid_level }}"
        configuration_mode: "{{ item.config_mode | default('automatic') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_disk_group_policies }}"
      when: apply_changes | bool

    - name: Record server configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/server_configuration.json"
        mode: '0640'
        content: |
          {
            "service_profiles": {{ ucs_service_profile_instances | to_json }},
            "power_policies": {{ ucs_power_policies | to_json }},
            "disk_policies": {{ ucs_disk_group_policies | to_json }},
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_server_configuration_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_server_configuration_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/server_configuration: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_server_configuration_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_server_configuration_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/server_configuration: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_server_configuration_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_server_configuration_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_server_configuration_status: "failed"
        fe_cisco_ucs_prod_infrastructure_server_configuration_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_server_configuration_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_server_configuration_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/server_configuration: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_server_configuration_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_server_configuration_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/server_configuration failed at '{{ fe_cisco_ucs_prod_infrastructure_server_configuration_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_server_configuration_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_server_configuration_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_server_configuration_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_server_configuration_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/server_configuration":
              component: "cisco/ucs_prod_infrastructure/server_configuration"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_server_configuration_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_server_configuration_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_server_configuration_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_server_configuration_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/server_configuration'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/server_configuration | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_server_configuration_stats_published: true
      tags:
        - always
