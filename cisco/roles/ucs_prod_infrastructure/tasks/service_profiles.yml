---
# Service profile template configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/service_profiles']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_service_profiles_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/service_profiles | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_service_profiles_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_service_profiles_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_service_profiles_status: "running"
    fe_cisco_ucs_prod_infrastructure_service_profiles_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_service_profiles_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_service_profiles_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_service_profiles_error: ""
    fe_cisco_ucs_prod_infrastructure_service_profiles_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/service_profiles | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/service_profiles: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/service_profiles: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/service_profiles: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/service_profiles: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profiles_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create service profile templates for fourth estate
      cisco.ucs.ucs_service_profile_template:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        template_type: "{{ item.template_type | default('updating-template') }}"
        uuid_pool: "{{ item.uuid_pool | default('') }}"
        description: "{{ item.description }}"
        bios_policy: "{{ item.bios_policy | default('') }}"
        boot_policy: "{{ item.boot_policy | default('') }}"
        maint_policy: "{{ item.maint_policy | default('') }}"
        power_policy: "{{ item.power_policy | default('') }}"
        local_disk_policy: "{{ item.local_disk_policy | default('') }}"
        host_firmware_package: "{{ item.host_firmware_package | default('') }}"
        state: present
      no_log: true
      loop: "{{ ucs_service_profile_templates }}"
      when: apply_changes | bool

    - name: Create BIOS policies for fourth estate servers
      cisco.ucs.ucs_bios_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        descr: "{{ item.description }}"
        reboot_on_update: "{{ item.reboot_on_update | default('yes') }}"
      no_log: true
      loop: "{{ ucs_bios_policies }}"
      when: apply_changes | bool

    - name: Create boot policies for servers
      cisco.ucs.ucs_boot_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        descr: "{{ item.description }}"
        boot_mode: "{{ item.boot_mode | default('uefi') }}"
        enforce_vnic_name: "{{ item.enforce_vnic_name | default('yes') }}"
        reboot_on_update: "{{ item.reboot_on_update | default('no') }}"
        state: present
      no_log: true
      loop: "{{ ucs_boot_policies }}"
      when: apply_changes | bool

    - name: Create maintenance policies
      cisco.ucs.ucs_maintenance_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        descr: "{{ item.description }}"
        uptime_disr: "{{ item.uptime_disr | default('user-ack') }}"
        state: present
      no_log: true
      loop: "{{ ucs_maintenance_policies }}"
      when: apply_changes | bool

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_service_profiles_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_service_profiles_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/service_profiles: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_service_profiles_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_service_profiles_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/service_profiles: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profiles_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_service_profiles_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profiles_status: "failed"
        fe_cisco_ucs_prod_infrastructure_service_profiles_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_service_profiles_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_service_profiles_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/service_profiles: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_service_profiles_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_service_profiles_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/service_profiles failed at '{{ fe_cisco_ucs_prod_infrastructure_service_profiles_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_service_profiles_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profiles_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_service_profiles_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_service_profiles_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/service_profiles":
              component: "cisco/ucs_prod_infrastructure/service_profiles"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_service_profiles_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_service_profiles_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_service_profiles_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_service_profiles_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/service_profiles'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/service_profiles | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_service_profiles_stats_published: true
      tags:
        - always
