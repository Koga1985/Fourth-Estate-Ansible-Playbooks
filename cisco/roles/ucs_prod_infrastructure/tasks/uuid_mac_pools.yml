---
# UUID and address pool configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_infrastructure/uuid_mac_pools']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status: "running"
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_preflight_passed: false
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_postflight_passed: false
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_failed_task: ""
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_error: ""
    fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_infrastructure/uuid_mac_pools: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_infrastructure/uuid_mac_pools: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_infrastructure/uuid_mac_pools: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_infrastructure/uuid_mac_pools: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create UUID suffix pools for fourth estate
      cisco.ucs.ucs_uuid_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        prefix: "{{ item.prefix }}"
        first_uuid: "{{ item.first_uuid }}"
        last_uuid: "{{ item.last_uuid }}"
        order: "{{ item.order | default('sequential') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_uuid_pools }}"
      when: apply_changes | bool

    - name: Create MAC address pools for vNICs
      cisco.ucs.ucs_mac_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        first_addr: "{{ item.first_addr }}"
        last_addr: "{{ item.last_addr }}"
        order: "{{ item.order | default('sequential') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_mac_pools }}"
      when: apply_changes | bool

    - name: Create WWNN pools for SAN
      cisco.ucs.ucs_wwn_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        purpose: node
        first_addr: "{{ item.first_addr }}"
        last_addr: "{{ item.last_addr }}"
        order: "{{ item.order | default('sequential') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_wwnn_pools }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool

    - name: Create WWPN pools for SAN (Fabric A)
      cisco.ucs.ucs_wwn_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        purpose: port
        first_addr: "{{ item.first_addr }}"
        last_addr: "{{ item.last_addr }}"
        order: "{{ item.order | default('sequential') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_wwpn_pools_a }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool

    - name: Create WWPN pools for SAN (Fabric B)
      cisco.ucs.ucs_wwn_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        purpose: port
        first_addr: "{{ item.first_addr }}"
        last_addr: "{{ item.last_addr }}"
        order: "{{ item.order | default('sequential') }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_wwpn_pools_b }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool

    - name: Create IQN suffix pools for iSCSI
      cisco.ucs.ucs_iqn_pool:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        org_dn: "org-root/org-{{ fourth_estate_org_name }}"
        prefix: "{{ item.prefix }}"
        suffix_start: "{{ item.suffix_start }}"
        suffix_end: "{{ item.suffix_end }}"
        descr: "{{ item.description }}"
        state: present
      no_log: true
      loop: "{{ ucs_iqn_pools }}"
      when:
        - apply_changes | bool
        - ucs_enable_iscsi | bool

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_preflight_passed | bool
          - fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_infrastructure/uuid_mac_pools: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_infrastructure/uuid_mac_pools: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_postflight_passed: true
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status: "failed"
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_postflight_passed: false
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_infrastructure/uuid_mac_pools: FAILED at '{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_infrastructure/uuid_mac_pools failed at '{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_failed_task }}': {{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_infrastructure/uuid_mac_pools":
              component: "cisco/ucs_prod_infrastructure/uuid_mac_pools"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_status | default('') == 'succeeded' else ['cisco/ucs_prod_infrastructure/uuid_mac_pools'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_infrastructure/uuid_mac_pools | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_infrastructure_uuid_mac_pools_stats_published: true
      tags:
        - always
