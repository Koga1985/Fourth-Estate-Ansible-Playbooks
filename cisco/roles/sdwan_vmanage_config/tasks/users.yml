---
# tasks file: users.yml for sdwan_vmanage_config
# Configure user groups and local accounts on vManage
# NIST AC-2, AC-3, AC-6 | STIG CISC-ND-000360

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_vmanage_config/users']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_vmanage_config_users_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_vmanage_config/users | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_vmanage_config_users_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_vmanage_config_users_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_vmanage_config_users_status: "running"
    fe_cisco_sdwan_vmanage_config_users_preflight_passed: false
    fe_cisco_sdwan_vmanage_config_users_postflight_passed: false
    fe_cisco_sdwan_vmanage_config_users_failed_task: ""
    fe_cisco_sdwan_vmanage_config_users_error: ""
    fe_cisco_sdwan_vmanage_config_users_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_vmanage_config/users | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_vmanage_config/users | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_vmanage_config/users: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_vmanage_config/users: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_vmanage_config/users | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_vmanage_config/users: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_vmanage_config/users: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_vmanage_config_users_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_vmanage_config/users | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_config_users_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create vManage user groups
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/admin/usergroup"
        method: POST
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          groupName: "{{ item.name }}"
          description: "{{ item.description }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201, 409]
      loop: "{{ sdwan_vmanage_user_groups }}"
      when: apply_changes | bool
      register: sdwan_groups_result
      tags: [sdwan, vmanage, users, rbac, phase16]

    - name: Create local vManage user accounts
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/admin/user"
        method: POST
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          userName: "{{ item.username }}"
          password: "{{ item.password }}"
          group: ["{{ item.group }}"]
          description: "{{ item.description }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201, 409]
      loop: "{{ sdwan_vmanage_users }}"
      when: apply_changes | bool
      no_log: true
      register: sdwan_users_result
      tags: [sdwan, vmanage, users, phase16]

    - name: Display user configuration status
      ansible.builtin.debug:
        msg:
          - "User groups created: {{ sdwan_vmanage_user_groups | length }}"
          - "Local users configured: {{ sdwan_vmanage_users | length }}"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, vmanage, users, phase16]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_vmanage_config/users | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_vmanage_config_users_preflight_passed | bool
          - fe_cisco_sdwan_vmanage_config_users_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_vmanage_config/users: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_vmanage_config_users_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_vmanage_config_users_status | default('unknown') }}.
        success_msg: "cisco/sdwan_vmanage_config/users: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_vmanage_config/users | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_config_users_postflight_passed: true
        fe_cisco_sdwan_vmanage_config_users_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_vmanage_config/users | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_config_users_status: "failed"
        fe_cisco_sdwan_vmanage_config_users_postflight_passed: false
        fe_cisco_sdwan_vmanage_config_users_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_vmanage_config_users_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_vmanage_config/users | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_vmanage_config/users: FAILED at '{{ fe_cisco_sdwan_vmanage_config_users_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_vmanage_config_users_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_vmanage_config/users | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_vmanage_config/users failed at '{{ fe_cisco_sdwan_vmanage_config_users_failed_task }}': {{ fe_cisco_sdwan_vmanage_config_users_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_vmanage_config/users | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_config_users_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_vmanage_config_users_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_vmanage_config_users_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_vmanage_config/users | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_vmanage_config/users":
              component: "cisco/sdwan_vmanage_config/users"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_vmanage_config_users_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_vmanage_config_users_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_vmanage_config_users_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_vmanage_config_users_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_vmanage_config_users_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_vmanage_config_users_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_vmanage_config_users_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_vmanage_config_users_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_vmanage_config_users_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_vmanage_config_users_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_vmanage_config_users_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_vmanage_config_users_status | default('') == 'succeeded' else ['cisco/sdwan_vmanage_config/users'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_vmanage_config/users | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_vmanage_config_users_stats_published: true
      tags:
        - always
