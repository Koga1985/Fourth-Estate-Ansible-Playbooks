---
# tasks file: compliance_report.yml for sdwan_security_hardening
# Generate STIG compliance report artifact

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/compliance_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_compliance_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/compliance_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_compliance_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_compliance_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_compliance_report_status: "running"
    fe_cisco_sdwan_security_hardening_compliance_report_preflight_passed: false
    fe_cisco_sdwan_security_hardening_compliance_report_postflight_passed: false
    fe_cisco_sdwan_security_hardening_compliance_report_failed_task: ""
    fe_cisco_sdwan_security_hardening_compliance_report_error: ""
    fe_cisco_sdwan_security_hardening_compliance_report_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/compliance_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/compliance_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/compliance_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/compliance_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/compliance_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/compliance_report: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/compliance_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_compliance_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/compliance_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_compliance_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Generate STIG compliance report
      ansible.builtin.template:
        src: sdwan_security_hardening_report.json.j2
        dest: "{{ sdwan_artifacts_dir }}/sdwan_stig_compliance_{{ ansible_date_time.epoch }}.json"
        mode: '0640'
      tags: [sdwan, security, compliance, report, artifact]

    - name: Generate STIG findings summary
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/sdwan_stig_summary_{{ ansible_date_time.epoch }}.txt"
        mode: '0640'
        content: |
          Cisco SD-WAN STIG Compliance Report
          ════════════════════════════════════════════════════════════════
          Organization:  {{ fourth_estate_org }}
          Environment:   {{ fourth_estate_environment }}
          vManage Host:  {{ sdwan_vmanage_host }}
          Generated:     {{ ansible_date_time.iso8601 }}
          Mode:          {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}
          ════════════════════════════════════════════════════════════════

          STIG References:
            - Cisco IOS XE SD-WAN Router NDM STIG V2R1
            - Cisco SD-WAN vManage NDM STIG V1R1

          NIST SP 800-53 Rev 5 Controls Implemented:
            AC-2   Account Management              - {{ enable_access_control | ternary('CONFIGURED', 'SKIPPED') }}
            AC-3   Access Enforcement (RBAC)       - {{ enable_access_control | ternary('CONFIGURED', 'SKIPPED') }}
            AC-6   Least Privilege                 - {{ enable_access_control | ternary('CONFIGURED', 'SKIPPED') }}
            AC-7   Unsuccessful Logon Attempts     - {{ enable_auth_hardening | ternary('CONFIGURED', 'SKIPPED') }}
            AC-8   System Use Notification Banner  - {{ enable_banners | ternary('CONFIGURED', 'SKIPPED') }}
            AC-11  Session Lock                    - {{ enable_session_management | ternary('CONFIGURED', 'SKIPPED') }}
            AC-12  Session Termination             - {{ enable_session_management | ternary('CONFIGURED', 'SKIPPED') }}
            AC-17  Remote Access (SSH)             - {{ enable_ssh_hardening | ternary('CONFIGURED', 'SKIPPED') }}
            AU-2   Event Logging                   - {{ enable_audit_logging | ternary('CONFIGURED', 'SKIPPED') }}
            AU-3   Content of Audit Records        - {{ enable_audit_logging | ternary('CONFIGURED', 'SKIPPED') }}
            AU-8   Time Stamps (NTP)               - {{ enable_ntp_hardening | ternary('CONFIGURED', 'SKIPPED') }}
            AU-9   Protection of Audit Information - {{ enable_audit_logging | ternary('CONFIGURED', 'SKIPPED') }}
            AU-12  Audit Record Generation         - {{ enable_audit_logging | ternary('CONFIGURED', 'SKIPPED') }}
            CM-6   Configuration Settings          - CONFIGURED (by design)
            CM-7   Least Functionality             - {{ enable_unused_services | ternary('CONFIGURED', 'SKIPPED') }}
            IA-2   Authentication                  - {{ enable_auth_hardening | ternary('CONFIGURED', 'SKIPPED') }}
            IA-3   Device Identification           - CONFIGURED (certificates)
            IA-5   Authenticator Management        - {{ enable_password_policy | ternary('CONFIGURED', 'SKIPPED') }}
            SC-8   Transmission Confidentiality    - {{ enable_crypto_tls | ternary('CONFIGURED', 'SKIPPED') }}
            SC-13  Cryptographic Protection (FIPS) - {{ enable_fips_mode | ternary('CONFIGURED', 'SKIPPED') }}
            SC-17  PKI Certificates                - CONFIGURED (certificates)
            SC-28  Protection at Rest              - {{ enable_fips_mode | ternary('CONFIGURED', 'SKIPPED') }}

          STIG Finding Status:
            CAT I  (High)   - Authentication, TLS, FIPS, Password Policy
            CAT II (Medium) - RBAC, Session, SNMP, Logging, NTP, SSH, Services
            CAT III (Low)   - Login Banner, System Info

          Compliance Frameworks: {{ compliance_frameworks | join(', ') }}
          ════════════════════════════════════════════════════════════════
      tags: [sdwan, security, compliance, report, artifact]

    # --------------------------- evidence delivery --------------------------
    # Writing the report to sdwan_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry STIG control status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the 0640 file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "cisco/sdwan_security_hardening/compliance_report | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ sdwan_artifacts_dir }}"
        patterns: "sdwan_stig_compliance_*.json,sdwan_stig_summary_*.txt"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [sdwan, security, compliance, report, artifact, evidence]

    - name: "cisco/sdwan_security_hardening/compliance_report | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [sdwan, security, compliance, report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "cisco/sdwan_security_hardening/compliance_report | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [sdwan, security, compliance, report, artifact, evidence]

    - name: "cisco/sdwan_security_hardening/compliance_report | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "cisco/sdwan_security_hardening":
              component: "cisco/sdwan_security_hardening"
              platform: "cisco"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ sdwan_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [sdwan, security, compliance, report, artifact, evidence]

    - name: Display compliance report location
      ansible.builtin.debug:
        msg:
          - "Compliance reports written to: {{ sdwan_artifacts_dir }}/"
          - "  - sdwan_stig_compliance_<epoch>.json"
          - "  - sdwan_stig_summary_<epoch>.txt"
          - >-
            {{ (fe_evidence_publish | default(true) | bool)
               | ternary('Also published to the job artifacts under fe_evidence (survives an execution-environment container).',
                         'NOT published to the job artifacts (fe_evidence_publish=false): under AAP this directory does not outlive the job.') }}
      tags: [sdwan, security, compliance, report, artifact]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/compliance_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_compliance_report_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_compliance_report_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/compliance_report: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_compliance_report_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_compliance_report_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/compliance_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/compliance_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_compliance_report_postflight_passed: true
        fe_cisco_sdwan_security_hardening_compliance_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/compliance_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_compliance_report_status: "failed"
        fe_cisco_sdwan_security_hardening_compliance_report_postflight_passed: false
        fe_cisco_sdwan_security_hardening_compliance_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_compliance_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/compliance_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/compliance_report: FAILED at '{{ fe_cisco_sdwan_security_hardening_compliance_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_compliance_report_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/compliance_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/compliance_report failed at '{{ fe_cisco_sdwan_security_hardening_compliance_report_failed_task }}': {{ fe_cisco_sdwan_security_hardening_compliance_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/compliance_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_compliance_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_compliance_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_compliance_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/compliance_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/compliance_report":
              component: "cisco/sdwan_security_hardening/compliance_report"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_compliance_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_compliance_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_compliance_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_compliance_report_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_compliance_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_compliance_report_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_compliance_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_compliance_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_compliance_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_compliance_report_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/compliance_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/compliance_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_compliance_report_stats_published: true
      tags:
        - always
