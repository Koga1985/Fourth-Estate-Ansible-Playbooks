---
# tasks file: encryption.yml for sdwan_security_hardening
# Configure TLS, cipher suites, FIPS mode, and IPSec data-plane encryption
# STIG: CISC-ND-001440 | NIST SC-8, SC-13, SC-28
# CAT: I | SRG: SRG-APP-000514-NDM-000325, SRG-APP-000439-NDM-000301

# ============================================================
# vManage TLS Configuration (web UI and API)
# Enforces TLS 1.2+; disables HTTP; FIPS-approved cipher suites
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/encryption']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_encryption_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/encryption | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_encryption_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_encryption_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_encryption_status: "running"
    fe_cisco_sdwan_security_hardening_encryption_preflight_passed: false
    fe_cisco_sdwan_security_hardening_encryption_postflight_passed: false
    fe_cisco_sdwan_security_hardening_encryption_failed_task: ""
    fe_cisco_sdwan_security_hardening_encryption_error: ""
    fe_cisco_sdwan_security_hardening_encryption_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/encryption | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/encryption | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/encryption: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/encryption: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/encryption | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/encryption: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/encryption: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_encryption_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/encryption | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_encryption_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG SC-8 [CISC-ND-001440] - Disable HTTP and enforce TLS on vManage"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/webServer"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          httpEnabled: "{{ sdwan_http_enabled | lower }}"
          httpsEnabled: "{{ sdwan_https_enabled | lower }}"
          tlsMinVersion: "{{ sdwan_min_tls_version }}"
          ciphers: "{{ sdwan_allowed_tls_ciphers | join(':') }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      register: sdwan_tls_result
      tags: [sdwan, security, stig, stig_cat1, crypto, tls, nist_sc]

    - name: "STIG SC-13 - Enable FIPS 140-2 mode on vManage"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/fips"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          fipsEnabled: "{{ sdwan_fips_enabled | lower }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when:
        - apply_changes | bool
        - sdwan_fips_enabled | bool
      register: sdwan_fips_result
      tags: [sdwan, security, stig, stig_cat1, fips, crypto, nist_sc]

    - name: "STIG SC-8 - Configure SD-WAN IPSec data-plane cipher suite"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/ipsec"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          cipherSuite: "{{ sdwan_ipsec_cipher_suite }}"
          integrity: "{{ sdwan_ipsec_integrity }}"
          rekeyInterval: "{{ sdwan_ipsec_rekey_interval }}"
          replayWindow: "{{ sdwan_ipsec_replay_window }}"
          dtlsPort: "{{ sdwan_dtls_port }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      register: sdwan_ipsec_result
      tags: [sdwan, security, stig, stig_cat1, ipsec, crypto, nist_sc]

    - name: Display encryption compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Control: CISC-ND-001440 (SC-8 - Transmission Confidentiality)"
          - "HTTP enabled: {{ sdwan_http_enabled }} (must be false)"
          - "HTTPS enabled: {{ sdwan_https_enabled }} (must be true)"
          - "Min TLS version: {{ sdwan_min_tls_version }} (DoD minimum: TLSv1.2)"
          - "FIPS 140-2 mode: {{ sdwan_fips_enabled }}"
          - "IPSec cipher: {{ sdwan_ipsec_cipher_suite }}"
          - "IPSec DH group minimum: {{ sdwan_fips_ipsec_dh_group }}"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat1, crypto, tls, nist_sc]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/encryption | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_encryption_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_encryption_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/encryption: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_encryption_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_encryption_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/encryption: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/encryption | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_encryption_postflight_passed: true
        fe_cisco_sdwan_security_hardening_encryption_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/encryption | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_encryption_status: "failed"
        fe_cisco_sdwan_security_hardening_encryption_postflight_passed: false
        fe_cisco_sdwan_security_hardening_encryption_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_encryption_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/encryption | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/encryption: FAILED at '{{ fe_cisco_sdwan_security_hardening_encryption_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_encryption_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/encryption | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/encryption failed at '{{ fe_cisco_sdwan_security_hardening_encryption_failed_task }}': {{ fe_cisco_sdwan_security_hardening_encryption_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/encryption | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_encryption_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_encryption_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_encryption_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/encryption | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/encryption":
              component: "cisco/sdwan_security_hardening/encryption"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_encryption_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_encryption_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_encryption_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_encryption_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_encryption_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_encryption_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_encryption_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_encryption_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_encryption_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_encryption_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_encryption_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_encryption_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/encryption'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/encryption | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_encryption_stats_published: true
      tags:
        - always
