---
# tasks file: unused_services.yml for sdwan_security_hardening
# Disable unused and insecure services on vManage and via templates to edge devices
# STIG: CISC-ND-001200, CISC-ND-001210 | NIST CM-7
# CAT: II | SRG: SRG-APP-000141-NDM-000249

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/unused_services']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_unused_services_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/unused_services | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_unused_services_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_unused_services_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_unused_services_status: "running"
    fe_cisco_sdwan_security_hardening_unused_services_preflight_passed: false
    fe_cisco_sdwan_security_hardening_unused_services_postflight_passed: false
    fe_cisco_sdwan_security_hardening_unused_services_failed_task: ""
    fe_cisco_sdwan_security_hardening_unused_services_error: ""
    fe_cisco_sdwan_security_hardening_unused_services_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/unused_services | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/unused_services | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/unused_services: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/unused_services: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/unused_services | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/unused_services: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/unused_services: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_unused_services_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/unused_services | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_unused_services_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG CM-7 [CISC-ND-001200] - Disable unused services on vManage"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/services"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          httpEnabled: "{{ not sdwan_disable_http_server | lower }}"
          telnetEnabled: "{{ not sdwan_disable_telnet | lower }}"
          snmpV1V2Enabled: false
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      register: sdwan_services_result
      tags: [sdwan, security, stig, stig_cat2, services, nist_cm]

    - name: Display unused services compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Controls: CISC-ND-001200, CISC-ND-001210 (CM-7 - Least Functionality)"
          - "HTTP server disabled: {{ sdwan_disable_http_server }}"
          - "Telnet disabled: {{ sdwan_disable_telnet }}"
          - "Finger disabled: {{ sdwan_disable_finger }}"
          - "TCP small servers disabled: {{ sdwan_disable_tcp_small_servers }}"
          - "UDP small servers disabled: {{ sdwan_disable_udp_small_servers }}"
          - "SNMPv1/v2c disabled: true (enforced)"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat2, services, nist_cm]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/unused_services | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_unused_services_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_unused_services_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/unused_services: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_unused_services_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_unused_services_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/unused_services: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/unused_services | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_unused_services_postflight_passed: true
        fe_cisco_sdwan_security_hardening_unused_services_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/unused_services | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_unused_services_status: "failed"
        fe_cisco_sdwan_security_hardening_unused_services_postflight_passed: false
        fe_cisco_sdwan_security_hardening_unused_services_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_unused_services_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/unused_services | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/unused_services: FAILED at '{{ fe_cisco_sdwan_security_hardening_unused_services_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_unused_services_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/unused_services | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/unused_services failed at '{{ fe_cisco_sdwan_security_hardening_unused_services_failed_task }}': {{ fe_cisco_sdwan_security_hardening_unused_services_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/unused_services | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_unused_services_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_unused_services_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_unused_services_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/unused_services | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/unused_services":
              component: "cisco/sdwan_security_hardening/unused_services"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_unused_services_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_unused_services_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_unused_services_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_unused_services_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_unused_services_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_unused_services_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_unused_services_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_unused_services_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_unused_services_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_unused_services_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_unused_services_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_unused_services_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/unused_services'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/unused_services | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_unused_services_stats_published: true
      tags:
        - always
