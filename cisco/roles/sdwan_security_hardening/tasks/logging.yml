---
# tasks file: logging.yml for sdwan_security_hardening
# Configure remote syslog to SIEM and enable full audit logging
# STIG: CISC-ND-000700, CISC-ND-000710, CISC-ND-000720 | NIST AU-2, AU-3, AU-9, AU-12
# CAT: II | SRG: SRG-APP-000091-NDM-000223, SRG-APP-000092-NDM-000225

# ============================================================
# vManage Audit Logging and Syslog Configuration
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/logging']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_logging_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/logging | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_logging_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_logging_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_logging_status: "running"
    fe_cisco_sdwan_security_hardening_logging_preflight_passed: false
    fe_cisco_sdwan_security_hardening_logging_postflight_passed: false
    fe_cisco_sdwan_security_hardening_logging_failed_task: ""
    fe_cisco_sdwan_security_hardening_logging_error: ""
    fe_cisco_sdwan_security_hardening_logging_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/logging | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/logging | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/logging: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/logging: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/logging | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/logging: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/logging: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_logging_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/logging | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_logging_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG AU-2 [CISC-ND-000700] - Configure remote syslog servers"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/syslog"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enable: true
          servers: "{{ sdwan_syslog_destinations }}"
          priority: "{{ sdwan_syslog_severity }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool and sdwan_syslog_enabled | bool
      register: sdwan_syslog_result
      tags: [sdwan, security, stig, stig_cat2, logging, audit, nist_au]

    - name: "STIG AU-12 [CISC-ND-000720] - Enable vManage audit log for all events"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/auditLog"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          auditAll: "{{ sdwan_audit_all_access | lower }}"
          auditConfiguration: "{{ sdwan_audit_config_changes | lower }}"
          auditAuthentication: "{{ sdwan_audit_auth_events | lower }}"
          auditPrivilege: "{{ sdwan_audit_privilege_use | lower }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      register: sdwan_audit_result
      tags: [sdwan, security, stig, stig_cat2, logging, audit, nist_au]

    - name: Display logging compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Controls: CISC-ND-000700/710/720 (AU-2/3/9/12 - Audit Logging)"
          - "Syslog enabled: {{ sdwan_syslog_enabled }}"
          - "Syslog severity: {{ sdwan_syslog_severity }}"
          - "Syslog destinations: {{ sdwan_syslog_destinations | length }}"
          - "Audit all access: {{ sdwan_audit_all_access }}"
          - "Audit config changes: {{ sdwan_audit_config_changes }}"
          - "Audit auth events: {{ sdwan_audit_auth_events }}"
          - "Local retention: {{ sdwan_local_log_retention_days }} days"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat2, logging, audit, nist_au]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/logging | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_logging_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_logging_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/logging: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_logging_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_logging_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/logging: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/logging | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_logging_postflight_passed: true
        fe_cisco_sdwan_security_hardening_logging_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/logging | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_logging_status: "failed"
        fe_cisco_sdwan_security_hardening_logging_postflight_passed: false
        fe_cisco_sdwan_security_hardening_logging_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_logging_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/logging | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/logging: FAILED at '{{ fe_cisco_sdwan_security_hardening_logging_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_logging_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/logging | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/logging failed at '{{ fe_cisco_sdwan_security_hardening_logging_failed_task }}': {{ fe_cisco_sdwan_security_hardening_logging_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/logging | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_logging_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_logging_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_logging_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/logging | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/logging":
              component: "cisco/sdwan_security_hardening/logging"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_logging_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_logging_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_logging_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_logging_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_logging_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_logging_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_logging_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_logging_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_logging_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_logging_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_logging_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_logging_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/logging'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/logging | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_logging_stats_published: true
      tags:
        - always
