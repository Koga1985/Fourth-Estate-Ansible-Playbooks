---
# tasks file: ntp.yml for sdwan_security_hardening
# Configure authenticated NTP with DoD-approved sources
# STIG: CISC-ND-001290, CISC-ND-001420 | NIST AU-8
# CAT: II | SRG: SRG-APP-000373-NDM-000298, SRG-APP-000374-NDM-000300

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/ntp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_ntp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/ntp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_ntp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_ntp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_ntp_status: "running"
    fe_cisco_sdwan_security_hardening_ntp_preflight_passed: false
    fe_cisco_sdwan_security_hardening_ntp_postflight_passed: false
    fe_cisco_sdwan_security_hardening_ntp_failed_task: ""
    fe_cisco_sdwan_security_hardening_ntp_error: ""
    fe_cisco_sdwan_security_hardening_ntp_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/ntp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/ntp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/ntp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/ntp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/ntp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/ntp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/ntp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_ntp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/ntp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_ntp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG AU-8 [CISC-ND-001290] - Configure authenticated NTP servers on vManage"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/ntp"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: true
          servers: "{{ sdwan_ntp_servers }}"
          authenticate: "{{ sdwan_ntp_authenticate | lower }}"
          authentication:
            - keyId: "{{ sdwan_ntp_key_id }}"
              keyType: "{{ sdwan_ntp_key_type }}"
              key: "{{ sdwan_ntp_key }}"
              trusted: true
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool and sdwan_ntp_enabled | bool
      no_log: true
      register: sdwan_ntp_result
      tags: [sdwan, security, stig, stig_cat2, ntp, nist_au]

    - name: "STIG AU-8 [CISC-ND-001290] - Verify NTP configuration (dry run)"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/ntp"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
      when: not apply_changes | bool
      register: sdwan_ntp_check
      check_mode: false
      tags: [sdwan, security, stig, stig_cat2, ntp, nist_au]

    - name: Display NTP compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Controls: CISC-ND-001290, CISC-ND-001420 (AU-8 - Time Stamps)"
          - "NTP authentication enabled: {{ sdwan_ntp_authenticate }} (must be true)"
          - "NTP servers:"
          - "{% for srv in sdwan_ntp_servers %}  - {{ srv.server }} (preferred: {{ srv.preferred }}){% endfor %}"
          - "Key ID: {{ sdwan_ntp_key_id }}"
          - "Key type: {{ sdwan_ntp_key_type }}"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat2, ntp, nist_au]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/ntp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_ntp_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_ntp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/ntp: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_ntp_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_ntp_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/ntp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/ntp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_ntp_postflight_passed: true
        fe_cisco_sdwan_security_hardening_ntp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/ntp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_ntp_status: "failed"
        fe_cisco_sdwan_security_hardening_ntp_postflight_passed: false
        fe_cisco_sdwan_security_hardening_ntp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_ntp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/ntp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/ntp: FAILED at '{{ fe_cisco_sdwan_security_hardening_ntp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_ntp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/ntp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/ntp failed at '{{ fe_cisco_sdwan_security_hardening_ntp_failed_task }}': {{ fe_cisco_sdwan_security_hardening_ntp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/ntp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_ntp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_ntp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_ntp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/ntp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/ntp":
              component: "cisco/sdwan_security_hardening/ntp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_ntp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_ntp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_ntp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_ntp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_ntp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_ntp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_ntp_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_ntp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_ntp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_ntp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_ntp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_ntp_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/ntp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/ntp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_ntp_stats_published: true
      tags:
        - always
