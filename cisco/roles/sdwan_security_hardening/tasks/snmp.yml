---
# tasks file: snmp.yml for sdwan_security_hardening
# Disable SNMPv1/v2c; configure SNMPv3 with authPriv (AES-128/SHA)
# STIG: CISC-ND-000090 | NIST SC-8
# CAT: II | SRG: SRG-APP-000411-NDM-000310

# ============================================================
# Disable insecure SNMP versions via vManage API
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/snmp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_snmp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/snmp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_snmp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_snmp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_snmp_status: "running"
    fe_cisco_sdwan_security_hardening_snmp_preflight_passed: false
    fe_cisco_sdwan_security_hardening_snmp_postflight_passed: false
    fe_cisco_sdwan_security_hardening_snmp_failed_task: ""
    fe_cisco_sdwan_security_hardening_snmp_error: ""
    fe_cisco_sdwan_security_hardening_snmp_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/snmp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/snmp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/snmp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/snmp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/snmp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/snmp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/snmp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_snmp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/snmp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_snmp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG SC-8 [CISC-ND-000090] - Disable SNMPv1 and SNMPv2c community strings"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/snmp"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          shutdown: false
          v2: false
          v3: true
          communities: []
          views:
            - name: "{{ sdwan_snmp_view_name }}"
              oid: "1.3.6.1"
              exclude: false
          groups:
            "{{ sdwan_snmp_v3_groups }}"
          users:
            "{{ sdwan_snmp_v3_users | map('combine', {'authProtocol': item.auth_protocol,
               'authPassword': item.auth_password,
               'privProtocol': item.priv_protocol,
               'privPassword': item.priv_password}) | list }}"
          trapTargets:
            "{{ sdwan_snmp_trap_destinations }}"
          sourceInterface: "{{ vault_sdwan_mgmt_interface | default('eth0') }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      no_log: true
      register: sdwan_snmp_result
      tags: [sdwan, security, stig, stig_cat2, snmp, nist_sc]

    - name: "STIG SC-8 [CISC-ND-000090] - Verify SNMP configuration (dry run)"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/snmp"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
      when: not apply_changes | bool
      register: sdwan_snmp_check
      check_mode: false
      tags: [sdwan, security, stig, stig_cat2, snmp, nist_sc]

    - name: Display SNMP compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Control: CISC-ND-000090 (SC-8 - SNMP Security)"
          - "SNMPv1 enabled: {{ sdwan_snmp_v1_enabled }} (must be false)"
          - "SNMPv2c enabled: {{ sdwan_snmp_v2c_enabled }} (must be false)"
          - "SNMPv3 enabled: {{ sdwan_snmp_v3_enabled }} (must be true)"
          - "SNMPv3 users configured: {{ sdwan_snmp_v3_users | length }}"
          - "Security level: authPriv (required)"
          - "Auth protocol: {{ sdwan_snmp_v3_users[0].auth_protocol | default('SHA') }}"
          - "Priv protocol: {{ sdwan_snmp_v3_users[0].priv_protocol | default('AES128') }}"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat2, snmp, nist_sc]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/snmp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_snmp_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_snmp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/snmp: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_snmp_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_snmp_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/snmp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/snmp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_snmp_postflight_passed: true
        fe_cisco_sdwan_security_hardening_snmp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/snmp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_snmp_status: "failed"
        fe_cisco_sdwan_security_hardening_snmp_postflight_passed: false
        fe_cisco_sdwan_security_hardening_snmp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_snmp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/snmp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/snmp: FAILED at '{{ fe_cisco_sdwan_security_hardening_snmp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_snmp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/snmp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/snmp failed at '{{ fe_cisco_sdwan_security_hardening_snmp_failed_task }}': {{ fe_cisco_sdwan_security_hardening_snmp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/snmp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_snmp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_snmp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_snmp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/snmp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/snmp":
              component: "cisco/sdwan_security_hardening/snmp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_snmp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_snmp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_snmp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_snmp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_snmp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_snmp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_snmp_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_snmp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_snmp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_snmp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_snmp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_snmp_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/snmp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/snmp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_snmp_stats_published: true
      tags:
        - always
