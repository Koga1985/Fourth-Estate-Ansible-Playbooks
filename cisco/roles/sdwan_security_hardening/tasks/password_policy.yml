---
# tasks file: password_policy.yml for sdwan_security_hardening
# Enforce DoD-compliant password policy on vManage
# STIG: CISC-ND-000530, CISC-ND-000570 | NIST IA-5
# CAT: I | SRG: SRG-APP-000166-NDM-000252, SRG-APP-000170-NDM-000257

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/password_policy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_password_policy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/password_policy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_password_policy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_password_policy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_password_policy_status: "running"
    fe_cisco_sdwan_security_hardening_password_policy_preflight_passed: false
    fe_cisco_sdwan_security_hardening_password_policy_postflight_passed: false
    fe_cisco_sdwan_security_hardening_password_policy_failed_task: ""
    fe_cisco_sdwan_security_hardening_password_policy_error: ""
    fe_cisco_sdwan_security_hardening_password_policy_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/password_policy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/password_policy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/password_policy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/password_policy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/password_policy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/password_policy: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/password_policy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_password_policy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/password_policy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_password_policy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "STIG IA-5 [CISC-ND-000530 / CISC-ND-000570] - Enforce vManage password policy"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/password"
        method: PUT
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          passwordMinLen: "{{ sdwan_password_min_length }}"
          passwordMinUpper: "{{ sdwan_password_min_uppercase }}"
          passwordMinLower: "{{ sdwan_password_min_lowercase }}"
          passwordMinNum: "{{ sdwan_password_min_digits }}"
          passwordMinSpecial: "{{ sdwan_password_min_special }}"
          passwordHistory: "{{ sdwan_password_history_count }}"
          passwordExpire: "{{ sdwan_password_max_age_days }}"
          noChangeInterval: "{{ sdwan_password_no_change_interval_hours }}"
          passwordStrength: "{{ sdwan_password_strength_check | lower }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
        status_code: [200, 201]
      when: apply_changes | bool
      no_log: true
      register: sdwan_password_policy_result
      tags: [sdwan, security, stig, stig_cat1, passwords, nist_ia]

    - name: "STIG IA-5 - Verify password policy settings (dry run)"
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/password"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
      when: not apply_changes | bool
      register: sdwan_password_check
      check_mode: false
      tags: [sdwan, security, stig, stig_cat1, passwords, nist_ia]

    - name: Display password policy compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Controls: CISC-ND-000530, CISC-ND-000570 (IA-5 - Authenticator Management)"
          - "Min length: {{ sdwan_password_min_length }} (DoD minimum: 15)"
          - "Min uppercase: {{ sdwan_password_min_uppercase }}"
          - "Min lowercase: {{ sdwan_password_min_lowercase }}"
          - "Min digits: {{ sdwan_password_min_digits }}"
          - "Min special: {{ sdwan_password_min_special }}"
          - "Password history: {{ sdwan_password_history_count }} (DoD minimum: 5)"
          - "Max age: {{ sdwan_password_max_age_days }} days (DoD maximum: 60)"
          - "Status: {{ apply_changes | ternary('APPLIED', 'CHECK ONLY') }}"
      tags: [sdwan, security, stig, stig_cat1, passwords, nist_ia]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/password_policy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_password_policy_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_password_policy_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/password_policy: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_password_policy_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_password_policy_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/password_policy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/password_policy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_password_policy_postflight_passed: true
        fe_cisco_sdwan_security_hardening_password_policy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/password_policy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_password_policy_status: "failed"
        fe_cisco_sdwan_security_hardening_password_policy_postflight_passed: false
        fe_cisco_sdwan_security_hardening_password_policy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_password_policy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/password_policy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/password_policy: FAILED at '{{ fe_cisco_sdwan_security_hardening_password_policy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_password_policy_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/password_policy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/password_policy failed at '{{ fe_cisco_sdwan_security_hardening_password_policy_failed_task }}': {{ fe_cisco_sdwan_security_hardening_password_policy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/password_policy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_password_policy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_password_policy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_password_policy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/password_policy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/password_policy":
              component: "cisco/sdwan_security_hardening/password_policy"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_password_policy_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_password_policy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_password_policy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_password_policy_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_password_policy_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_password_policy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_password_policy_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_password_policy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_password_policy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_password_policy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_password_policy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_password_policy_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/password_policy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/password_policy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_password_policy_stats_published: true
      tags:
        - always
