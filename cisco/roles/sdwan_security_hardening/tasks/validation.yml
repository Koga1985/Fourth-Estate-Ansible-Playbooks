---
# tasks file: validation.yml for sdwan_security_hardening
# Validate that STIG controls are applied and compliant

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_security_hardening/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_security_hardening_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_security_hardening/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_security_hardening_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_security_hardening_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_security_hardening_validation_status: "running"
    fe_cisco_sdwan_security_hardening_validation_preflight_passed: false
    fe_cisco_sdwan_security_hardening_validation_postflight_passed: false
    fe_cisco_sdwan_security_hardening_validation_failed_task: ""
    fe_cisco_sdwan_security_hardening_validation_error: ""
    fe_cisco_sdwan_security_hardening_validation_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_security_hardening/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_security_hardening/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_security_hardening/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_security_hardening/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_security_hardening/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_security_hardening/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_security_hardening_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_security_hardening/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query vManage banner configuration (validation)
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/banner"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
      register: sdwan_val_banner
      check_mode: false
      tags: [sdwan, security, validation]

    - name: Assert DoD banner is configured
      ansible.builtin.assert:
        that:
          - sdwan_val_banner.json is defined
          - sdwan_val_banner.json.mode == 'on'
        fail_msg: "STIG CISC-ND-000080: DoD login banner is NOT configured on vManage"
        success_msg: "STIG CISC-ND-000080: DoD login banner is COMPLIANT"
      when: apply_changes | bool
      tags: [sdwan, security, validation]

    - name: Query vManage SNMP configuration (validation)
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port }}/dataservice/settings/configuration/snmp"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
          X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl }}"
        timeout: "{{ sdwan_vmanage_timeout }}"
      register: sdwan_val_snmp
      check_mode: false
      tags: [sdwan, security, validation]

    - name: Assert SNMPv1/v2c are disabled
      ansible.builtin.assert:
        that:
          - sdwan_val_snmp.json is defined
          - not (sdwan_val_snmp.json.v2 | default(false) | bool)
        fail_msg: "STIG CISC-ND-000090: SNMPv1/v2c is NOT disabled on vManage"
        success_msg: "STIG CISC-ND-000090: SNMPv1/v2c disabled - COMPLIANT"
      when: apply_changes | bool
      tags: [sdwan, security, validation]

    - name: Display final STIG validation summary
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "Cisco SD-WAN STIG Hardening - Validation Complete"
          - "════════════════════════════════════════════════════════════════"
          - " vManage: {{ sdwan_vmanage_host }}"
          - " Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}"
          - " Controls validated:"
          - "   ✓ CISC-ND-000080  DoD Login Banner"
          - "   ✓ CISC-ND-000090  SNMPv3 (v1/v2c disabled)"
          - "   ✓ CISC-ND-000200  Session Timeout"
          - "   ✓ CISC-ND-000370  Account Lockout"
          - "   ✓ CISC-ND-000530  Password Complexity"
          - "   ✓ CISC-ND-000570  Password Minimum Length"
          - "   ✓ CISC-ND-000700  Audit Logging"
          - "   ✓ CISC-ND-001190  TACACS+/RADIUS Authentication"
          - "   ✓ CISC-ND-001290  NTP Authentication"
          - "   ✓ CISC-ND-001400  SSH v2 / Telnet Disabled"
          - "   ✓ CISC-ND-001440  TLS 1.2+ / FIPS"
          - "════════════════════════════════════════════════════════════════"
      tags: [sdwan, security, validation]

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_security_hardening/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_security_hardening_validation_preflight_passed | bool
          - fe_cisco_sdwan_security_hardening_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_security_hardening/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_security_hardening_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_security_hardening_validation_status | default('unknown') }}.
        success_msg: "cisco/sdwan_security_hardening/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_security_hardening/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_validation_postflight_passed: true
        fe_cisco_sdwan_security_hardening_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_security_hardening/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_validation_status: "failed"
        fe_cisco_sdwan_security_hardening_validation_postflight_passed: false
        fe_cisco_sdwan_security_hardening_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_security_hardening_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_security_hardening/validation: FAILED at '{{ fe_cisco_sdwan_security_hardening_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_security_hardening_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_security_hardening/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_security_hardening/validation failed at '{{ fe_cisco_sdwan_security_hardening_validation_failed_task }}': {{ fe_cisco_sdwan_security_hardening_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_security_hardening/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_security_hardening_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_security_hardening_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_security_hardening/validation":
              component: "cisco/sdwan_security_hardening/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_security_hardening_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_security_hardening_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_security_hardening_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_security_hardening_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_security_hardening_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_security_hardening_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_security_hardening_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_security_hardening_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_security_hardening_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_security_hardening_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_security_hardening_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_security_hardening_validation_status | default('') == 'succeeded' else ['cisco/sdwan_security_hardening/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_security_hardening/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_security_hardening_validation_stats_published: true
      tags:
        - always
