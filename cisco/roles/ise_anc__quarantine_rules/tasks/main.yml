---
# tasks file for ise_anc__quarantine_rules
# Cisco ISE Adaptive Network Control (ANC) Quarantine Rules
# Provides automated threat response and quarantine capabilities

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ise_anc__quarantine_rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ise_anc__quarantine_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ise_anc__quarantine_rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ise_anc__quarantine_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ise_anc__quarantine_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ise_anc__quarantine_rules_status: "running"
    fe_cisco_ise_anc__quarantine_rules_preflight_passed: false
    fe_cisco_ise_anc__quarantine_rules_postflight_passed: false
    fe_cisco_ise_anc__quarantine_rules_failed_task: ""
    fe_cisco_ise_anc__quarantine_rules_error: ""
    fe_cisco_ise_anc__quarantine_rules_stats_published: false
  tags:
    - always

- name: "cisco/ise_anc__quarantine_rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ise_anc__quarantine_rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ise_anc__quarantine_rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ise_anc__quarantine_rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ise_anc__quarantine_rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ise_anc__quarantine_rules: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ise_anc__quarantine_rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ise_anc__quarantine_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ise_anc__quarantine_rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ise_anc__quarantine_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate ISE connection parameters
      ansible.builtin.assert:
        that:
          - ise_hostname is defined
          - ise_username is defined
          - ise_password is defined
          - ise_verify_ssl is defined
        fail_msg: "Required ISE connection parameters not defined"
        quiet: true
      tags:
        - validation
        - prerequisites

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ ise_artifacts_dir }}"
        state: directory
        mode: "0750"
      tags:
        - always

    - name: Gather existing ANC policies
      cisco.ise.anc_policy_info:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
      no_log: true
      register: existing_anc_policies
      tags:
        - discovery
        - audit

    - name: Create ANC policy plan document
      ansible.builtin.copy:
        dest: "{{ ise_artifacts_dir }}/anc_quarantine_plan.json"
        mode: "0644"
        content: "{{ anc_plan_doc | to_nice_json }}"
      vars:
        anc_plan_doc:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          managed_policies: "{{ anc_policies }}"
          exceptions: "{{ anc_exceptions }}"
          existing_policies: "{{ existing_anc_policies.ise_response | default([]) }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
      tags:
        - documentation
        - audit

    - name: Configure QUARANTINE ANC policy
      cisco.ise.anc_policy:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
        state: present
        name: "{{ item.name }}"
        actions: "{{ item.actions }}"
      no_log: true
      loop: "{{ anc_policies }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - apply_changes | bool
        - item.enabled | default(true)
      notify:
        - validate anc policies
        - backup ise configuration
      tags:
        - anc
        - policies
        - quarantine

    - name: Configure ANC endpoint assignments
      cisco.ise.anc_endpoint:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
        state: present
        macAddress: "{{ item.mac_address }}"
        policyName: "{{ item.policy_name }}"
      no_log: true
      loop: "{{ anc_endpoint_assignments }}"
      loop_control:
        label: "{{ item.mac_address }}"
      when:
        - apply_changes | bool
        - anc_endpoint_assignments | length > 0
      tags:
        - anc
        - endpoints
        - quarantine

    - name: Register ANC exceptions (devices exempt from quarantine)
      ansible.builtin.set_fact:
        anc_exempted_macs: "{{ anc_exempted_macs | default([]) + [item.mac_address] }}"
      loop: "{{ anc_exceptions }}"
      loop_control:
        label: "{{ item.mac_address }}"
      when:
        - anc_exceptions | length > 0
        - item.enabled | default(true)
      tags:
        - anc
        - exceptions

    - name: Document ANC exceptions
      ansible.builtin.copy:
        dest: "{{ ise_artifacts_dir }}/anc_exceptions.json"
        mode: "0640"
        content: "{{ anc_exception_doc | to_nice_json }}"
      vars:
        anc_exception_doc:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          exceptions: "{{ anc_exceptions }}"
          exempted_macs: "{{ anc_exempted_macs | default([]) }}"
      when: anc_exceptions | length > 0
      tags:
        - documentation
        - exceptions

    - name: Configure ANC policy with DISA STIG compliance settings
      cisco.ise.anc_policy:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
        state: present
        name: "{{ item.name }}"
        actions: "{{ item.actions }}"
      no_log: true
      loop: "{{ disa_stig_anc_policies }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - apply_changes | bool
        - enable_disa_stig_compliance | bool
      tags:
        - anc
        - compliance
        - stig

    - name: Generate ANC quarantine report
      ansible.builtin.template:
        src: anc_quarantine_report.json.j2
        dest: "{{ ise_artifacts_dir }}/anc_quarantine_report_{{ ansible_date_time.epoch }}.json"
        mode: "0640"
      tags:
        - reporting
        - audit

    - name: Verify ANC policies are active
      cisco.ise.anc_policy_info:
        ise_hostname: "{{ ise_hostname }}"
        ise_username: "{{ ise_username }}"
        ise_password: "{{ ise_password }}"
        ise_verify: "{{ ise_verify_ssl }}"
      no_log: true
      register: anc_verification
      when: apply_changes | bool
      tags:
        - validation
        - verification

    # --------------------------- evidence delivery --------------------------
    # Writing the report to ise_artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "cisco/ise_anc__quarantine_rules | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ ise_artifacts_dir }}"
        patterns: "anc_quarantine_report_*.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "cisco/ise_anc__quarantine_rules | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "cisco/ise_anc__quarantine_rules | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "cisco/ise_anc__quarantine_rules | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "cisco/ise_anc__quarantine_rules":
              component: "cisco/ise_anc__quarantine_rules"
              platform: "cisco"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ ise_artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "cisco/ise_anc__quarantine_rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ise_anc__quarantine_rules_preflight_passed | bool
          - fe_cisco_ise_anc__quarantine_rules_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ise_anc__quarantine_rules: postflight validation failed - preflight passed
          ={{ fe_cisco_ise_anc__quarantine_rules_preflight_passed | default(false) }},
          status={{ fe_cisco_ise_anc__quarantine_rules_status | default('unknown') }}.
        success_msg: "cisco/ise_anc__quarantine_rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ise_anc__quarantine_rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ise_anc__quarantine_rules_postflight_passed: true
        fe_cisco_ise_anc__quarantine_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ise_anc__quarantine_rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ise_anc__quarantine_rules_status: "failed"
        fe_cisco_ise_anc__quarantine_rules_postflight_passed: false
        fe_cisco_ise_anc__quarantine_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ise_anc__quarantine_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ise_anc__quarantine_rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ise_anc__quarantine_rules: FAILED at '{{ fe_cisco_ise_anc__quarantine_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ise_anc__quarantine_rules_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ise_anc__quarantine_rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ise_anc__quarantine_rules failed at '{{ fe_cisco_ise_anc__quarantine_rules_failed_task }}': {{ fe_cisco_ise_anc__quarantine_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ise_anc__quarantine_rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ise_anc__quarantine_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ise_anc__quarantine_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ise_anc__quarantine_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ise_anc__quarantine_rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ise_anc__quarantine_rules":
              component: "cisco/ise_anc__quarantine_rules"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ise_anc__quarantine_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ise_anc__quarantine_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ise_anc__quarantine_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ise_anc__quarantine_rules_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ise_anc__quarantine_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ise_anc__quarantine_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ise_anc__quarantine_rules_failed_task | default('') }}"
              error: "{{ fe_cisco_ise_anc__quarantine_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ise_anc__quarantine_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ise_anc__quarantine_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ise_anc__quarantine_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ise_anc__quarantine_rules_status | default('') == 'succeeded' else ['cisco/ise_anc__quarantine_rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ise_anc__quarantine_rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ise_anc__quarantine_rules_stats_published: true
      tags:
        - always
