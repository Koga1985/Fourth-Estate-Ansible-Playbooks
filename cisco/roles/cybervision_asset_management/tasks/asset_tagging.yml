---
# tasks file for cybervision_asset_management - Asset group and tag configuration
# Creates criticality levels, asset groups, and pre-defined OT device categories

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_asset_management/asset_tagging']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_asset_management_asset_tagging_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_asset_management/asset_tagging | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_asset_management_asset_tagging_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_asset_management_asset_tagging_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_asset_management_asset_tagging_status: "running"
    fe_cisco_cybervision_asset_management_asset_tagging_preflight_passed: false
    fe_cisco_cybervision_asset_management_asset_tagging_postflight_passed: false
    fe_cisco_cybervision_asset_management_asset_tagging_failed_task: ""
    fe_cisco_cybervision_asset_management_asset_tagging_error: ""
    fe_cisco_cybervision_asset_management_asset_tagging_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_asset_management/asset_tagging | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_asset_management/asset_tagging | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_asset_management/asset_tagging: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_asset_management/asset_tagging: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_asset_management/asset_tagging | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_asset_management/asset_tagging: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_asset_management/asset_tagging: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_asset_management_asset_tagging_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_asset_management/asset_tagging | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_asset_tagging_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Create asset criticality labels
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/labels"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          color: "{{ item.color }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 409]
      loop: "{{ cv_criticality_levels }}"
      loop_control:
        label: "{{ item.name }}"
      register: cv_label_results
      when: apply_changes | bool

    - name: PHASE 3 - Create asset groups
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/groups"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          criticality: "{{ item.criticality }}"
          tags: "{{ item.tags }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 409]
      loop: "{{ cv_asset_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: cv_group_results
      when: apply_changes | bool

    - name: PHASE 3 - Display tagging plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would create asset groups:"
          - "{% for g in cv_asset_groups %}  - {{ g.name }} ({{ g.criticality }}): tags={{ g.tags | join(',') }}{% endfor %}"
      when: not apply_changes | bool

    - name: Save asset tagging artifact
      ansible.builtin.copy:
        content: "{{ tagging_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_asset_tagging.json"
        mode: '0640'
      vars:
        tagging_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          criticality_levels: "{{ cv_criticality_levels | map(attribute='name') | list }}"
          asset_groups: "{{ cv_asset_groups | map(attribute='name') | list }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_asset_management/asset_tagging | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_asset_management_asset_tagging_preflight_passed | bool
          - fe_cisco_cybervision_asset_management_asset_tagging_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_asset_management/asset_tagging: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_asset_management_asset_tagging_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_asset_management_asset_tagging_status | default('unknown') }}.
        success_msg: "cisco/cybervision_asset_management/asset_tagging: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_asset_management/asset_tagging | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_asset_tagging_postflight_passed: true
        fe_cisco_cybervision_asset_management_asset_tagging_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_asset_management/asset_tagging | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_asset_tagging_status: "failed"
        fe_cisco_cybervision_asset_management_asset_tagging_postflight_passed: false
        fe_cisco_cybervision_asset_management_asset_tagging_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_asset_management_asset_tagging_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_asset_management/asset_tagging | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_asset_management/asset_tagging: FAILED at '{{ fe_cisco_cybervision_asset_management_asset_tagging_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_asset_management_asset_tagging_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_asset_management/asset_tagging | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_asset_management/asset_tagging failed at '{{ fe_cisco_cybervision_asset_management_asset_tagging_failed_task }}': {{ fe_cisco_cybervision_asset_management_asset_tagging_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_asset_management/asset_tagging | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_asset_tagging_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_asset_management_asset_tagging_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_asset_management_asset_tagging_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_asset_management/asset_tagging | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_asset_management/asset_tagging":
              component: "cisco/cybervision_asset_management/asset_tagging"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_asset_management_asset_tagging_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_asset_management_asset_tagging_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_asset_management_asset_tagging_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_asset_management_asset_tagging_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_asset_management_asset_tagging_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_asset_management_asset_tagging_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_asset_management_asset_tagging_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_asset_management_asset_tagging_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_asset_management_asset_tagging_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_asset_management_asset_tagging_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_asset_management_asset_tagging_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_asset_management_asset_tagging_status | default('') == 'succeeded' else ['cisco/cybervision_asset_management/asset_tagging'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_asset_management/asset_tagging | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_asset_tagging_stats_published: true
      tags:
        - always
