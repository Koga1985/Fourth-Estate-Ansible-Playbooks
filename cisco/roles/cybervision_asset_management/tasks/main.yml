---
# tasks file for cybervision_asset_management
# Cisco Cyber Vision - OT asset discovery, inventory, tagging, and vulnerability tracking

# ============================================================
# Prerequisites (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_asset_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_asset_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_asset_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_asset_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_asset_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_asset_management_status: "running"
    fe_cisco_cybervision_asset_management_preflight_passed: false
    fe_cisco_cybervision_asset_management_postflight_passed: false
    fe_cisco_cybervision_asset_management_failed_task: ""
    fe_cisco_cybervision_asset_management_error: ""
    fe_cisco_cybervision_asset_management_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_asset_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_asset_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_asset_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_asset_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_asset_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_asset_management: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_asset_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_asset_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_asset_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 3 - Run prerequisites
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
      tags:
        - always
        - prerequisites

    # ============================================================
    # Asset Discovery Configuration
    # Passive (always on) and optional active probing
    # ============================================================
    - name: PHASE 3 - Asset discovery configuration
      ansible.builtin.include_tasks:
        file: asset_discovery.yml
        apply:
          tags:
            - cybervision
            - assets
            - discovery
            - inventory
            - phase3
      when: enable_asset_discovery | bool
      tags:
        - cybervision
        - assets
        - discovery
        - inventory
        - phase3

    # ============================================================
    # Asset Tagging and Group Organization
    # Criticality levels, OT device groups, tags
    # ============================================================
    - name: PHASE 3 - Asset tagging and group configuration
      ansible.builtin.include_tasks:
        file: asset_tagging.yml
        apply:
          tags:
            - cybervision
            - assets
            - tagging
            - groups
            - phase3
      when: enable_asset_tagging | bool
      tags:
        - cybervision
        - assets
        - tagging
        - groups
        - phase3

    # ============================================================
    # Vulnerability Tracking
    # CVE threshold configuration and report export
    # ============================================================
    - name: PHASE 3 - Vulnerability tracking configuration
      ansible.builtin.include_tasks:
        file: vulnerability_tracking.yml
        apply:
          tags:
            - cybervision
            - assets
            - vulnerabilities
            - cve
            - phase3
      when: enable_vulnerability_tracking | bool
      tags:
        - cybervision
        - assets
        - vulnerabilities
        - cve
        - phase3

    # ============================================================
    # Network Baseline Configuration
    # Capture known-good state; alert on deviations
    # ============================================================
    - name: PHASE 3 - Network baseline configuration
      ansible.builtin.include_tasks:
        file: baseline_config.yml
        apply:
          tags:
            - cybervision
            - assets
            - baseline
            - phase3
      when: enable_baseline_config | bool
      tags:
        - cybervision
        - assets
        - baseline
        - phase3

    # ============================================================
    # Post-Configuration Validation
    # ============================================================
    - name: PHASE 3 - Asset management validation
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - cybervision
            - assets
            - validation
            - phase3
      tags:
        - cybervision
        - assets
        - validation
        - phase3

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_asset_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_asset_management_preflight_passed | bool
          - fe_cisco_cybervision_asset_management_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_asset_management: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_asset_management_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_asset_management_status | default('unknown') }}.
        success_msg: "cisco/cybervision_asset_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_asset_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_postflight_passed: true
        fe_cisco_cybervision_asset_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_asset_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_status: "failed"
        fe_cisco_cybervision_asset_management_postflight_passed: false
        fe_cisco_cybervision_asset_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_asset_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_asset_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_asset_management: FAILED at '{{ fe_cisco_cybervision_asset_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_asset_management_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_asset_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_asset_management failed at '{{ fe_cisco_cybervision_asset_management_failed_task }}': {{ fe_cisco_cybervision_asset_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_asset_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_asset_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_asset_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_asset_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_asset_management":
              component: "cisco/cybervision_asset_management"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_asset_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_asset_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_asset_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_asset_management_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_asset_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_asset_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_asset_management_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_asset_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_asset_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_asset_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_asset_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_asset_management_status | default('') == 'succeeded' else ['cisco/cybervision_asset_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_asset_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_asset_management_stats_published: true
      tags:
        - always
