---
# tasks file for ucs_prod_backup_dr
# Cisco UCS Production Backup and Disaster Recovery

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_backup_dr']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_backup_dr_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_backup_dr | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_backup_dr_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_backup_dr_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_backup_dr_status: "running"
    fe_cisco_ucs_prod_backup_dr_preflight_passed: false
    fe_cisco_ucs_prod_backup_dr_postflight_passed: false
    fe_cisco_ucs_prod_backup_dr_failed_task: ""
    fe_cisco_ucs_prod_backup_dr_error: ""
    fe_cisco_ucs_prod_backup_dr_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_backup_dr | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_backup_dr | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_backup_dr: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_backup_dr: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_backup_dr | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_backup_dr: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_backup_dr: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_backup_dr_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_backup_dr | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_backup_dr_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure full-state backup
      cisco.ucs.ucs_backup:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        type: "full-state"
        protocol: "{{ backup_protocol }}"
        remote_file: "{{ backup_remote_path }}/full-state-{{ ansible_date_time.date }}.tar.gz"
        hostname_remote: "{{ backup_server }}"
        username_remote: "{{ backup_username }}"
        password_remote: "{{ backup_password }}"
        admin_state: "enabled"
        schedule: "{{ backup_schedule }}"
      when:
        - apply_changes | bool
        - backup_type in ['full-state', 'all']
      no_log: true
      tags:
        - backup
        - full_state

    - name: Configure configuration backup
      cisco.ucs.ucs_backup:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        type: "config-all"
        protocol: "{{ backup_protocol }}"
        remote_file: "{{ backup_remote_path }}/config-all-{{ ansible_date_time.date }}.xml"
        hostname_remote: "{{ backup_server }}"
        username_remote: "{{ backup_username }}"
        password_remote: "{{ backup_password }}"
        admin_state: "enabled"
        schedule: "{{ backup_schedule }}"
      when:
        - apply_changes | bool
        - backup_type in ['config-all', 'all']
      no_log: true
      tags:
        - backup
        - config

    - name: Trigger immediate backup
      cisco.ucs.ucs_backup_immediate:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        type: "{{ item }}"
        protocol: "{{ backup_protocol }}"
        remote_file: "{{ backup_remote_path }}/immediate-{{ item }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        hostname_remote: "{{ backup_server }}"
        username_remote: "{{ backup_username }}"
        password_remote: "{{ backup_password }}"
      loop: "{{ backup_immediate_types }}"
      when:
        - apply_changes | bool
        - backup_trigger_immediate | bool
      no_log: true
      tags:
        - backup
        - immediate

    - name: Document disaster recovery procedures
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/disaster_recovery_plan.txt"
        mode: '0640'
        content: |
          Cisco UCS Disaster Recovery Plan
          =================================
          Organization: Fourth Estate
          Date: {{ ansible_date_time.iso8601 }}

          BACKUP CONFIGURATION
          -------------------
          Backup Type: {{ backup_type }}
          Backup Protocol: {{ backup_protocol }}
          Backup Server: {{ backup_server }}
          Backup Schedule: {{ backup_schedule }}
          Retention Period: {{ backup_retention_days }} days

          RECOVERY TIME OBJECTIVE (RTO)
          -----------------------------
          Target RTO: {{ dr_rto_hours }} hours

          RECOVERY POINT OBJECTIVE (RPO)
          ------------------------------
          Target RPO: {{ dr_rpo_hours }} hours

          BACKUP TYPES
          ------------
          1. Full State Backup
             - Complete system backup including all configuration and operational data
             - Used for complete disaster recovery
             - File: full-state-YYYY-MM-DD.tar.gz

          2. Configuration Backup
             - System configuration only
             - Used for configuration rollback
             - File: config-all-YYYY-MM-DD.xml

          3. Logical Configuration Backup
             - Service profiles and policies
             - Used for logical configuration recovery
             - File: config-logical-YYYY-MM-DD.xml

          DISASTER RECOVERY PROCEDURES
          ---------------------------

          SCENARIO 1: Configuration Rollback
          1. Access UCS Manager
          2. Navigate to Admin > Import Configuration
          3. Select backup file (config-all or config-logical)
          4. Review changes before applying
          5. Apply configuration
          6. Verify system operation

          SCENARIO 2: Complete System Recovery
          1. Install fresh UCS Manager firmware
          2. Complete initial setup wizard
          3. Navigate to Admin > Import Configuration
          4. Select full-state backup file
          5. System will restore all configuration and state
          6. Reboot fabric interconnects if required
          7. Verify all service profiles
          8. Verify network connectivity
          9. Run health checks

          SCENARIO 3: Fabric Interconnect Failure
          1. Verify secondary FI is operational
          2. System continues operation (HA mode)
          3. Replace failed FI hardware
          4. Acknowledge new FI in UCS Manager
          5. System synchronizes configuration
          6. Verify cluster status

          SCENARIO 4: Data Center Failure
          1. Activate disaster recovery site
          2. Restore UCS Manager from backup
          3. Reconfigure network connectivity for DR site
          4. Update DNS and service discovery
          5. Verify application connectivity
          6. Monitor system health

          TESTING PROCEDURES
          ------------------
          - Test backups monthly
          - Verify backup file integrity
          - Test restoration in lab environment quarterly
          - Document test results
          - Update procedures based on test findings

          CONTACT INFORMATION
          ------------------
          Primary Contact: {{ dr_primary_contact }}
          Secondary Contact: {{ dr_secondary_contact }}
          Emergency Phone: {{ dr_emergency_phone }}
          Backup Server Admin: {{ backup_admin_contact }}

          COMPLIANCE REQUIREMENTS
          ----------------------
          - NIST 800-53 CP-9: Information System Backup
          - NIST 800-53 CP-10: Information System Recovery and Reconstitution
          - DoD STIG: Backup and recovery requirements

          BACKUP VERIFICATION
          ------------------
          - Automated backup verification enabled
          - Backup file integrity checks performed
          - Restoration tests documented
          - Off-site backup copies maintained

          CHANGE CONTROL
          --------------
          All DR plan changes require:
          - Change request approval
          - Documentation update
          - Team notification
          - Training if procedures change
      delegate_to: localhost
      tags:
        - backup
        - documentation

    - name: Create backup verification script
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/verify_backups.sh"
        mode: '0750'
        content: |
          #!/bin/bash
          # UCS Backup Verification Script

          BACKUP_SERVER="{{ backup_server }}"
          BACKUP_PATH="{{ backup_remote_path }}"
          RETENTION_DAYS="{{ backup_retention_days }}"

          echo "UCS Backup Verification"
          echo "======================="
          echo "Date: $(date)"
          echo ""

          # Check for recent backups
          echo "Checking for backups in last 24 hours..."
          # Add your verification logic here

          echo ""
          echo "Verification complete"
      delegate_to: localhost
      tags:
        - backup
        - scripts

    - name: Record backup configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/backup_config.json"
        mode: '0640'
        content: |
          {
            "backup_type": "{{ backup_type }}",
            "backup_protocol": "{{ backup_protocol }}",
            "backup_server": "{{ backup_server }}",
            "backup_schedule": "{{ backup_schedule }}",
            "retention_days": {{ backup_retention_days }},
            "dr_rto_hours": {{ dr_rto_hours }},
            "dr_rpo_hours": {{ dr_rpo_hours }},
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost
      tags:
        - backup
        - reporting

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_backup_dr | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_backup_dr_preflight_passed | bool
          - fe_cisco_ucs_prod_backup_dr_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_backup_dr: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_backup_dr_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_backup_dr_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_backup_dr: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_backup_dr | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_backup_dr_postflight_passed: true
        fe_cisco_ucs_prod_backup_dr_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_backup_dr | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_backup_dr_status: "failed"
        fe_cisco_ucs_prod_backup_dr_postflight_passed: false
        fe_cisco_ucs_prod_backup_dr_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_backup_dr_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_backup_dr | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_backup_dr: FAILED at '{{ fe_cisco_ucs_prod_backup_dr_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_backup_dr_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_backup_dr | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_backup_dr failed at '{{ fe_cisco_ucs_prod_backup_dr_failed_task }}': {{ fe_cisco_ucs_prod_backup_dr_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_backup_dr | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_backup_dr_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_backup_dr_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_backup_dr_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_backup_dr | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_backup_dr":
              component: "cisco/ucs_prod_backup_dr"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_backup_dr_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_backup_dr_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_backup_dr_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_backup_dr_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_backup_dr_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_backup_dr_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_backup_dr_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_backup_dr_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_backup_dr_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_backup_dr_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_backup_dr_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_backup_dr_status | default('') == 'succeeded' else ['cisco/ucs_prod_backup_dr'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_backup_dr | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_backup_dr_stats_published: true
      tags:
        - always
