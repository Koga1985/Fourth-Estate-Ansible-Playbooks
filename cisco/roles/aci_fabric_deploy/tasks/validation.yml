---
# tasks file for aci_fabric_deploy - Validation and Verification
# Queries fabric inventory, checks fault count, generates validation report

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_fabric_deploy/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_fabric_deploy_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_fabric_deploy/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_fabric_deploy_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_fabric_deploy_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_fabric_deploy_validation_status: "running"
    fe_cisco_aci_fabric_deploy_validation_preflight_passed: false
    fe_cisco_aci_fabric_deploy_validation_postflight_passed: false
    fe_cisco_aci_fabric_deploy_validation_failed_task: ""
    fe_cisco_aci_fabric_deploy_validation_error: ""
    fe_cisco_aci_fabric_deploy_validation_stats_published: false
  tags:
    - always

- name: "cisco/aci_fabric_deploy/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_fabric_deploy/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_fabric_deploy/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_fabric_deploy/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_fabric_deploy/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_fabric_deploy/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_fabric_deploy_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Query fabric node inventory for validation
      cisco.aci.aci_fabric_node:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_validation_inventory
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Verify registered node count matches expected count
      ansible.builtin.assert:
        that:
          - aci_validation_inventory.current is defined
        fail_msg: "Fabric inventory query failed - unable to verify node registration"
        success_msg: "Fabric inventory query succeeded"
        quiet: true
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Query fabric faults (critical and major)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=and(or(eq(faultInst.severity,\"critical\"),eq(faultInst.severity,\"major\")),wcard(faultInst.dn,\"topology/\"))&order-by=faultInst.severity|desc&page-size=50"
        method: get
      no_log: true
      register: aci_fabric_faults
      failed_when: false
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Query VLAN pool configuration for validation
      cisco.aci.aci_vlan_pool:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_vlan_pool_validation
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Query physical domain configuration for validation
      cisco.aci.aci_domain:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        domain_type: phys
        state: query
      no_log: true
      changed_when: false
      register: aci_phys_domain_validation
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Display fabric validation summary
      ansible.builtin.debug:
        msg:
          - "=== ACI Fabric Deployment Validation ==="
          - "APIC Host:           {{ aci_host }}"
          - "Fabric Name:         {{ aci_fabric_name }}"
          - "Expected Nodes:      {{ aci_nodes | length }}"
          - "Fabric Inventory:    {{ aci_validation_inventory.current | default([]) | length }} entries"
          - "Critical/Major Faults: {{ aci_fabric_faults.imdata | default([]) | length }}"
          - "VLAN Pools Found:    {{ aci_vlan_pool_validation.current | default([]) | length }}"
          - "Physical Domains:    {{ aci_phys_domain_validation.current | default([]) | length }}"
          - "Apply Changes Mode:  {{ apply_changes | bool }}"
          - "Deployment Start:    {{ aci_fabric_deploy_start_time | default('unknown') }}"
          - "Validation Time:     {{ ansible_date_time.iso8601 }}"
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Warn if critical or major faults detected
      ansible.builtin.debug:
        msg:
          - "WARNING: {{ aci_fabric_faults.imdata | default([]) | length }} critical/major fault(s) detected in ACI fabric"
          - "Review faults at: https://{{ aci_host }}/index.html#bTenants:tn-common|faults"
      when: (aci_fabric_faults.imdata | default([]) | length) > 0
      tags:
        - validation
        - verification
        - phase1

    - name: PHASE 1 - Generate fabric deployment validation report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_fabric_validation_report.json"
        mode: "0640"
        content: "{{ validation_report | to_nice_json }}"
      vars:
        validation_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          deployment_start: "{{ aci_fabric_deploy_start_time | default('unknown') }}"
          apic_host: "{{ aci_host }}"
          fabric_name: "{{ aci_fabric_name }}"
          apply_changes: "{{ apply_changes | bool }}"
          expected_node_count: "{{ aci_nodes | length }}"
          fabric_inventory_count: "{{ aci_validation_inventory.current | default([]) | length }}"
          critical_major_faults: "{{ aci_fabric_faults.imdata | default([]) | length }}"
          vlan_pools_found: "{{ aci_vlan_pool_validation.current | default([]) | length }}"
          physical_domains_found: "{{ aci_phys_domain_validation.current | default([]) | length }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
          validation_status: "{{ 'PASSED' if (aci_fabric_faults.imdata | default([]) | length) == 0 else 'WARNING - Faults Detected' }}"
      tags:
        - validation
        - verification
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_fabric_deploy/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_fabric_deploy_validation_preflight_passed | bool
          - fe_cisco_aci_fabric_deploy_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_fabric_deploy/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_fabric_deploy_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_fabric_deploy_validation_status | default('unknown') }}.
        success_msg: "cisco/aci_fabric_deploy/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_fabric_deploy/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_validation_postflight_passed: true
        fe_cisco_aci_fabric_deploy_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_fabric_deploy/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_validation_status: "failed"
        fe_cisco_aci_fabric_deploy_validation_postflight_passed: false
        fe_cisco_aci_fabric_deploy_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_fabric_deploy_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_fabric_deploy/validation: FAILED at '{{ fe_cisco_aci_fabric_deploy_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_fabric_deploy_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_fabric_deploy/validation failed at '{{ fe_cisco_aci_fabric_deploy_validation_failed_task }}': {{ fe_cisco_aci_fabric_deploy_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_fabric_deploy/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_fabric_deploy_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_fabric_deploy_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_fabric_deploy/validation":
              component: "cisco/aci_fabric_deploy/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_fabric_deploy_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_fabric_deploy_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_fabric_deploy_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_fabric_deploy_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_fabric_deploy_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_fabric_deploy_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_fabric_deploy_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_fabric_deploy_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_fabric_deploy_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_fabric_deploy_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_fabric_deploy_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_fabric_deploy_validation_status | default('') == 'succeeded' else ['cisco/aci_fabric_deploy/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_validation_stats_published: true
      tags:
        - always
