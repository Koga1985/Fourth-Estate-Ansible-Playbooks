---
# tasks file for aci_fabric_deploy - Fabric Node Registration
# Registers spine and leaf nodes, waits for discovery, validates status

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_fabric_deploy/fabric_nodes']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_fabric_deploy_fabric_nodes_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_fabric_deploy/fabric_nodes | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_fabric_deploy_fabric_nodes_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_fabric_deploy_fabric_nodes_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_fabric_deploy_fabric_nodes_status: "running"
    fe_cisco_aci_fabric_deploy_fabric_nodes_preflight_passed: false
    fe_cisco_aci_fabric_deploy_fabric_nodes_postflight_passed: false
    fe_cisco_aci_fabric_deploy_fabric_nodes_failed_task: ""
    fe_cisco_aci_fabric_deploy_fabric_nodes_error: ""
    fe_cisco_aci_fabric_deploy_fabric_nodes_stats_published: false
  tags:
    - always

- name: "cisco/aci_fabric_deploy/fabric_nodes | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_fabric_deploy/fabric_nodes: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_fabric_deploy/fabric_nodes: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_fabric_deploy/fabric_nodes: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_fabric_deploy/fabric_nodes: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_nodes_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Register spine nodes in ACI fabric
      cisco.aci.aci_fabric_node:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        node_id: "{{ item.node_id }}"
        pod_id: "{{ item.pod_id | default(aci_pod_id) }}"
        serial: "{{ item.serial }}"
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        role: spine
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_nodes | selectattr('role', 'equalto', 'spine') | list }}"
      loop_control:
        label: "{{ item.name }} (node-{{ item.node_id }})"
      register: spine_registration_results
      tags:
        - aci
        - fabric
        - nodes
        - registration
        - phase1

    - name: PHASE 1 - Register leaf nodes in ACI fabric
      cisco.aci.aci_fabric_node:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        node_id: "{{ item.node_id }}"
        pod_id: "{{ item.pod_id | default(aci_pod_id) }}"
        serial: "{{ item.serial }}"
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        role: leaf
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_nodes | selectattr('role', 'equalto', 'leaf') | list }}"
      loop_control:
        label: "{{ item.name }} (node-{{ item.node_id }})"
      register: leaf_registration_results
      tags:
        - aci
        - fabric
        - nodes
        - registration
        - phase1

    - name: PHASE 1 - Wait for fabric node discovery to complete
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/node/mo/uni/controller/nodeidentpol/nodep-{{ item.serial }}.json"
        method: get
      no_log: true
      loop: "{{ aci_nodes }}"
      loop_control:
        label: "{{ item.name }} (serial: {{ item.serial }})"
      register: node_discovery_status
      until: >-
        node_discovery_status.imdata is defined and
        node_discovery_status.imdata | length > 0
      retries: "{{ aci_node_discovery_retries }}"
      delay: "{{ aci_node_discovery_delay }}"
      when: apply_changes | bool
      tags:
        - aci
        - fabric
        - nodes
        - registration
        - phase1

    - name: PHASE 1 - Query fabric node inventory for validation
      cisco.aci.aci_fabric_node:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_fabric_inventory
      tags:
        - aci
        - fabric
        - nodes
        - registration
        - validation
        - phase1

    - name: PHASE 1 - Validate registered node count
      ansible.builtin.assert:
        that:
          - aci_fabric_inventory.current is defined
        fail_msg: "Unable to query fabric inventory - check APIC connectivity"
        quiet: true
      tags:
        - aci
        - fabric
        - nodes
        - validation
        - phase1

    - name: PHASE 1 - Display fabric node registration summary
      ansible.builtin.debug:
        msg:
          - "=== Fabric Node Registration Summary ==="
          - "Configured nodes: {{ aci_nodes | length }}"
          - "Spine nodes: {{ aci_nodes | selectattr('role', 'equalto', 'spine') | list | length }}"
          - "Leaf nodes: {{ aci_nodes | selectattr('role', 'equalto', 'leaf') | list | length }}"
          - "Apply changes: {{ apply_changes | bool }}"
      tags:
        - aci
        - fabric
        - nodes
        - phase1

    - name: PHASE 1 - Save fabric node registration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_fabric_nodes.json"
        mode: "0640"
        content: "{{ fabric_nodes_artifact | to_nice_json }}"
      vars:
        fabric_nodes_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_nodes: "{{ aci_nodes }}"
          spine_count: "{{ aci_nodes | selectattr('role', 'equalto', 'spine') | list | length }}"
          leaf_count: "{{ aci_nodes | selectattr('role', 'equalto', 'leaf') | list | length }}"
          fabric_inventory: "{{ aci_fabric_inventory.current | default([]) }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - fabric
        - nodes
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_fabric_deploy_fabric_nodes_preflight_passed | bool
          - fe_cisco_aci_fabric_deploy_fabric_nodes_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_fabric_deploy/fabric_nodes: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_fabric_deploy_fabric_nodes_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_fabric_deploy_fabric_nodes_status | default('unknown') }}.
        success_msg: "cisco/aci_fabric_deploy/fabric_nodes: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_nodes_postflight_passed: true
        fe_cisco_aci_fabric_deploy_fabric_nodes_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_nodes_status: "failed"
        fe_cisco_aci_fabric_deploy_fabric_nodes_postflight_passed: false
        fe_cisco_aci_fabric_deploy_fabric_nodes_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_fabric_deploy_fabric_nodes_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_fabric_deploy/fabric_nodes: FAILED at '{{ fe_cisco_aci_fabric_deploy_fabric_nodes_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_fabric_deploy_fabric_nodes_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_fabric_deploy/fabric_nodes failed at '{{ fe_cisco_aci_fabric_deploy_fabric_nodes_failed_task }}': {{ fe_cisco_aci_fabric_deploy_fabric_nodes_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_nodes_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_fabric_deploy_fabric_nodes_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_fabric_deploy_fabric_nodes_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_fabric_deploy/fabric_nodes":
              component: "cisco/aci_fabric_deploy/fabric_nodes"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_fabric_deploy_fabric_nodes_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_fabric_deploy_fabric_nodes_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_fabric_deploy_fabric_nodes_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_fabric_deploy_fabric_nodes_status | default('') == 'succeeded' else ['cisco/aci_fabric_deploy/fabric_nodes'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/fabric_nodes | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_nodes_stats_published: true
      tags:
        - always
