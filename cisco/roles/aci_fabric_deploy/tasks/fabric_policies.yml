---
# tasks file for aci_fabric_deploy - Fabric-Wide Policies
# Configures node control, link level, ISIS, COOP, endpoint loop protection, rogue endpoint control

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_fabric_deploy/fabric_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_fabric_deploy_fabric_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_fabric_deploy/fabric_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_fabric_deploy_fabric_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_fabric_deploy_fabric_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_fabric_deploy_fabric_policies_status: "running"
    fe_cisco_aci_fabric_deploy_fabric_policies_preflight_passed: false
    fe_cisco_aci_fabric_deploy_fabric_policies_postflight_passed: false
    fe_cisco_aci_fabric_deploy_fabric_policies_failed_task: ""
    fe_cisco_aci_fabric_deploy_fabric_policies_error: ""
    fe_cisco_aci_fabric_deploy_fabric_policies_stats_published: false
  tags:
    - always

- name: "cisco/aci_fabric_deploy/fabric_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_fabric_deploy/fabric_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_fabric_deploy/fabric_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_fabric_deploy/fabric_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_fabric_deploy/fabric_policies: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_fabric_deploy/fabric_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Configure fabric Node Control policy (MACsec and analytics)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/nodecontpol-FourthEstate-NodeCtrl.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          fabricNodeControl:
            attributes:
              dn: uni/fabric/nodecontpol-FourthEstate-NodeCtrl
              name: "FourthEstate-NodeCtrl"
              control: "Dom"
              featureSel: "analytics"
              descr: "Fourth Estate fabric node control policy"
      no_log: true
      register: node_control_result
      tags:
        - aci
        - fabric
        - policies
        - phase1

    - name: PHASE 1 - Configure fabric Link Level policy (auto-negotiation)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/infra/hintfpol-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          fabricHIfPol:
            attributes:
              dn: "uni/infra/hintfpol-{{ item.name }}"
              name: "{{ item.name }}"
              autoNeg: "{{ item.auto_neg | default('on') }}"
              speed: "{{ item.speed | default('inherit') }}"
              fecMode: "{{ item.fec_mode | default('inherit') }}"
              descr: "{{ item.description | default('') }}"
      no_log: true
      loop:
        - name: "LLP-1G-Auto"
          description: "1Gbps with auto-negotiation"
          auto_neg: "on"
          speed: "1G"
        - name: "LLP-10G-Auto"
          description: "10Gbps with auto-negotiation"
          auto_neg: "on"
          speed: "10G"
        - name: "LLP-25G-Auto"
          description: "25Gbps with auto-negotiation"
          auto_neg: "on"
          speed: "25G"
        - name: "LLP-100G-Auto"
          description: "100Gbps with auto-negotiation"
          auto_neg: "on"
          speed: "100G"
      loop_control:
        label: "{{ item.name }}"
      register: link_level_results
      tags:
        - aci
        - fabric
        - policies
        - link_level
        - phase1

    - name: PHASE 1 - Configure ISIS redistribution policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/isisdomdef-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          isisDomPol:
            attributes:
              dn: uni/fabric/isisdomdef-default
              redistribMetric: "63"
              mtu: "9126"
      no_log: true
      register: isis_result
      tags:
        - aci
        - fabric
        - policies
        - isis
        - phase1

    - name: PHASE 1 - Configure COOP group policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/pol-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          coopPol:
            attributes:
              dn: uni/fabric/pol-default
              type: "compatible"
      no_log: true
      register: coop_result
      tags:
        - aci
        - fabric
        - policies
        - coop
        - phase1

    - name: PHASE 1 - Configure endpoint loop protection policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/infra/epLoopProtectP-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          epLoopProtectPol:
            attributes:
              dn: uni/infra/epLoopProtectP-default
              adminSt: "enabled"
              action: "bd-learn-disable,port-disable"
              loopDetectIntvl: "60"
              loopDetectMult: "4"
      no_log: true
      register: ep_loop_result
      tags:
        - aci
        - fabric
        - policies
        - endpoint
        - phase1

    - name: PHASE 1 - Configure rogue endpoint control policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/infra/epCtrlP-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          epControlPol:
            attributes:
              dn: uni/infra/epCtrlP-default
              adminSt: "enabled"
              rogueEpDetectIntvl: "60"
              rogueEpDetectMult: "4"
              holdIntvl: "1800"
      no_log: true
      register: rogue_ep_result
      tags:
        - aci
        - fabric
        - policies
        - endpoint
        - rogue
        - phase1

    - name: PHASE 1 - Configure CDP interface policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/infra/cdpIfP-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          cdpIfPol:
            attributes:
              dn: "uni/infra/cdpIfP-{{ item.name }}"
              name: "{{ item.name }}"
              adminSt: "{{ item.admin_state }}"
      no_log: true
      loop:
        - name: "CDP-Enabled"
          admin_state: "enabled"
        - name: "CDP-Disabled"
          admin_state: "disabled"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - aci
        - fabric
        - policies
        - cdp
        - phase1

    - name: PHASE 1 - Configure LLDP interface policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/infra/lldpIfP-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          lldpIfPol:
            attributes:
              dn: "uni/infra/lldpIfP-{{ item.name }}"
              name: "{{ item.name }}"
              adminRxSt: "{{ item.rx_state }}"
              adminTxSt: "{{ item.tx_state }}"
      no_log: true
      loop:
        - name: "LLDP-Enabled"
          rx_state: "enabled"
          tx_state: "enabled"
        - name: "LLDP-Disabled"
          rx_state: "disabled"
          tx_state: "disabled"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - aci
        - fabric
        - policies
        - lldp
        - phase1

    - name: PHASE 1 - Configure STP interface policy (BPDU Guard)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/infra/ifPol-STP-BPDUGuard.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          stpIfPol:
            attributes:
              dn: uni/infra/ifPol-STP-BPDUGuard
              name: "STP-BPDUGuard"
              ctrl: "bpdu-guard"
      no_log: true
      tags:
        - aci
        - fabric
        - policies
        - stp
        - phase1

    - name: PHASE 1 - Save fabric policies configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_fabric_policies.json"
        mode: "0640"
        content: "{{ fabric_policies_artifact | to_nice_json }}"
      vars:
        fabric_policies_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          node_control: "{{ node_control_result.imdata | default([]) }}"
          coop_policy: "{{ coop_result.imdata | default([]) }}"
          isis_policy: "{{ isis_result.imdata | default([]) }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - fabric
        - policies
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_fabric_deploy/fabric_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_fabric_deploy_fabric_policies_preflight_passed | bool
          - fe_cisco_aci_fabric_deploy_fabric_policies_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_fabric_deploy/fabric_policies: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_fabric_deploy_fabric_policies_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_fabric_deploy_fabric_policies_status | default('unknown') }}.
        success_msg: "cisco/aci_fabric_deploy/fabric_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_fabric_deploy/fabric_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_policies_postflight_passed: true
        fe_cisco_aci_fabric_deploy_fabric_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_fabric_deploy/fabric_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_policies_status: "failed"
        fe_cisco_aci_fabric_deploy_fabric_policies_postflight_passed: false
        fe_cisco_aci_fabric_deploy_fabric_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_fabric_deploy_fabric_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/fabric_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_fabric_deploy/fabric_policies: FAILED at '{{ fe_cisco_aci_fabric_deploy_fabric_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_fabric_deploy_fabric_policies_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/fabric_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_fabric_deploy/fabric_policies failed at '{{ fe_cisco_aci_fabric_deploy_fabric_policies_failed_task }}': {{ fe_cisco_aci_fabric_deploy_fabric_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_fabric_deploy/fabric_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_fabric_deploy_fabric_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_fabric_deploy_fabric_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/fabric_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_fabric_deploy/fabric_policies":
              component: "cisco/aci_fabric_deploy/fabric_policies"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_fabric_deploy_fabric_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_fabric_deploy_fabric_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_fabric_deploy_fabric_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_fabric_deploy_fabric_policies_status | default('') == 'succeeded' else ['cisco/aci_fabric_deploy/fabric_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/fabric_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_fabric_policies_stats_published: true
      tags:
        - always
