---
# tasks file for aci_fabric_deploy - Access Policies
# Creates VLAN pools, physical domains, L3 domains, AEP, and interface policy groups

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_fabric_deploy/access_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_fabric_deploy_access_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_fabric_deploy/access_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_fabric_deploy_access_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_fabric_deploy_access_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_fabric_deploy_access_policies_status: "running"
    fe_cisco_aci_fabric_deploy_access_policies_preflight_passed: false
    fe_cisco_aci_fabric_deploy_access_policies_postflight_passed: false
    fe_cisco_aci_fabric_deploy_access_policies_failed_task: ""
    fe_cisco_aci_fabric_deploy_access_policies_error: ""
    fe_cisco_aci_fabric_deploy_access_policies_stats_published: false
  tags:
    - always

- name: "cisco/aci_fabric_deploy/access_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_fabric_deploy/access_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_fabric_deploy/access_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_fabric_deploy/access_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/access_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_fabric_deploy/access_policies: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_fabric_deploy/access_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_fabric_deploy_access_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/access_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_access_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Create VLAN pools
      cisco.aci.aci_vlan_pool:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        pool: "{{ item.name }}"
        pool_allocation_mode: "{{ item.alloc_mode }}"
        description: "{{ item.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_vlan_pools }}"
      loop_control:
        label: "{{ item.name }}"
      register: vlan_pool_results
      tags:
        - aci
        - access
        - policies
        - vlan_pools
        - phase1

    - name: PHASE 1 - Create VLAN pool encapsulation blocks
      cisco.aci.aci_vlan_pool_encap_block:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        pool: "{{ item.0.name }}"
        pool_allocation_mode: "{{ item.0.alloc_mode }}"
        block_start: "{{ item.1.range_from }}"
        block_end: "{{ item.1.range_to }}"
        block_name: "{{ item.0.name }}-block-{{ item.1.range_from }}-{{ item.1.range_to }}"
        allocation_mode: "{{ item.1.alloc_mode | default('inherit') }}"
        description: "{{ item.1.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_vlan_pools | subelements('encap_blocks') }}"
      loop_control:
        label: "{{ item.0.name }} vlan-{{ item.1.range_from }}-{{ item.1.range_to }}"
      tags:
        - aci
        - access
        - policies
        - vlan_pools
        - phase1

    - name: PHASE 1 - Create physical domains
      cisco.aci.aci_domain:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        domain: "{{ item.name }}"
        domain_type: phys
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_physical_domains }}"
      loop_control:
        label: "{{ item.name }}"
      register: phys_domain_results
      tags:
        - aci
        - access
        - policies
        - domains
        - phase1

    - name: PHASE 1 - Associate VLAN pools with physical domains
      cisco.aci.aci_domain_to_vlan_pool:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        domain: "{{ item.name }}"
        domain_type: phys
        pool: "{{ item.vlan_pool }}"
        pool_allocation_mode: static
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_physical_domains }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.vlan_pool }}"
      tags:
        - aci
        - access
        - policies
        - domains
        - phase1

    - name: PHASE 1 - Create L3 domains
      cisco.aci.aci_domain:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        domain: "{{ item.name }}"
        domain_type: l3dom
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3_domains }}"
      loop_control:
        label: "{{ item.name }}"
      register: l3_domain_results
      tags:
        - aci
        - access
        - policies
        - domains
        - l3
        - phase1

    - name: PHASE 1 - Associate VLAN pools with L3 domains
      cisco.aci.aci_domain_to_vlan_pool:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        domain: "{{ item.name }}"
        domain_type: l3dom
        pool: "{{ item.vlan_pool }}"
        pool_allocation_mode: static
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_l3_domains }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.vlan_pool }}"
      tags:
        - aci
        - access
        - policies
        - domains
        - l3
        - phase1

    - name: PHASE 1 - Create Attachable Entity Profile (AEP) for production
      cisco.aci.aci_aep:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        aep: "AEP-{{ item }}"
        description: "Fourth Estate AEP for {{ item }} traffic"
        infra_vlan: false
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop:
        - "Prod"
        - "Dev"
        - "Mgmt"
      register: aep_results
      tags:
        - aci
        - access
        - policies
        - aep
        - phase1

    - name: PHASE 1 - Associate physical domains to production AEP
      cisco.aci.aci_aep_to_domain:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        aep: "AEP-Prod"
        domain: "{{ item.name }}"
        domain_type: phys
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_physical_domains }}"
      loop_control:
        label: "AEP-Prod -> {{ item.name }}"
      when: "'Prod' in item.name"
      tags:
        - aci
        - access
        - policies
        - aep
        - phase1

    - name: PHASE 1 - Create leaf interface policy groups
      cisco.aci.aci_interface_policy_leaf_policy_group:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        policy_group: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        lag_type: "{{ item.lag_type }}"
        link_level_policy: "{{ item.link_level_policy | default(omit) }}"
        cdp_policy: "{{ item.cdp_policy | default(omit) }}"
        lldp_policy: "{{ item.lldp_policy | default(omit) }}"
        stp_interface_policy: "{{ item.stp_policy | default(omit) }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_interface_policy_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: ipg_results
      tags:
        - aci
        - access
        - policies
        - policy_groups
        - phase1

    - name: PHASE 1 - Save access policies configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_access_policies.json"
        mode: "0640"
        content: "{{ access_policies_artifact | to_nice_json }}"
      vars:
        access_policies_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          vlan_pools: "{{ aci_vlan_pools | map(attribute='name') | list }}"
          physical_domains: "{{ aci_physical_domains | map(attribute='name') | list }}"
          l3_domains: "{{ aci_l3_domains | map(attribute='name') | list }}"
          interface_policy_groups: "{{ aci_interface_policy_groups | map(attribute='name') | list }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - access
        - policies
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_fabric_deploy/access_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_fabric_deploy_access_policies_preflight_passed | bool
          - fe_cisco_aci_fabric_deploy_access_policies_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_fabric_deploy/access_policies: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_fabric_deploy_access_policies_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_fabric_deploy_access_policies_status | default('unknown') }}.
        success_msg: "cisco/aci_fabric_deploy/access_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_fabric_deploy/access_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_access_policies_postflight_passed: true
        fe_cisco_aci_fabric_deploy_access_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_fabric_deploy/access_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_access_policies_status: "failed"
        fe_cisco_aci_fabric_deploy_access_policies_postflight_passed: false
        fe_cisco_aci_fabric_deploy_access_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_fabric_deploy_access_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/access_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_fabric_deploy/access_policies: FAILED at '{{ fe_cisco_aci_fabric_deploy_access_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_fabric_deploy_access_policies_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/access_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_fabric_deploy/access_policies failed at '{{ fe_cisco_aci_fabric_deploy_access_policies_failed_task }}': {{ fe_cisco_aci_fabric_deploy_access_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_fabric_deploy/access_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_access_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_fabric_deploy_access_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_fabric_deploy_access_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/access_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_fabric_deploy/access_policies":
              component: "cisco/aci_fabric_deploy/access_policies"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_fabric_deploy_access_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_fabric_deploy_access_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_fabric_deploy_access_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_fabric_deploy_access_policies_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_fabric_deploy_access_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_fabric_deploy_access_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_fabric_deploy_access_policies_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_fabric_deploy_access_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_fabric_deploy_access_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_fabric_deploy_access_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_fabric_deploy_access_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_fabric_deploy_access_policies_status | default('') == 'succeeded' else ['cisco/aci_fabric_deploy/access_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/access_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_access_policies_stats_published: true
      tags:
        - always
