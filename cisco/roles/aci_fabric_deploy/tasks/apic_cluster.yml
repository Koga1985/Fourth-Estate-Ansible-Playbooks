---
# tasks file for aci_fabric_deploy - APIC Cluster Configuration
# Configures APIC system settings, OOB management, NTP, DNS, and syslog

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_fabric_deploy/apic_cluster']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_fabric_deploy_apic_cluster_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_fabric_deploy/apic_cluster | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_fabric_deploy_apic_cluster_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_fabric_deploy_apic_cluster_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_fabric_deploy_apic_cluster_status: "running"
    fe_cisco_aci_fabric_deploy_apic_cluster_preflight_passed: false
    fe_cisco_aci_fabric_deploy_apic_cluster_postflight_passed: false
    fe_cisco_aci_fabric_deploy_apic_cluster_failed_task: ""
    fe_cisco_aci_fabric_deploy_apic_cluster_error: ""
    fe_cisco_aci_fabric_deploy_apic_cluster_stats_published: false
  tags:
    - always

- name: "cisco/aci_fabric_deploy/apic_cluster | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_fabric_deploy/apic_cluster | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_fabric_deploy/apic_cluster: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_fabric_deploy/apic_cluster: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/apic_cluster | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_fabric_deploy/apic_cluster: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_fabric_deploy/apic_cluster: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_fabric_deploy/apic_cluster | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_apic_cluster_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 1 - Configure APIC fabric system name
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric.json
        method: post
        content:
          fabricInst:
            attributes:
              dn: uni/fabric
              name: "{{ aci_fabric_name }}"
      no_log: true
      when: apply_changes | bool
      notify:
        - backup aci configuration
      tags:
        - aci
        - apic
        - cluster
        - phase1

    - name: PHASE 1 - Configure APIC system OOB management (dry-run query)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/node/mo/uni/fabric/oob.json
        method: get
      no_log: true
      register: aci_oob_query
      when: not (apply_changes | bool)
      tags:
        - aci
        - apic
        - cluster
        - phase1

    - name: PHASE 1 - Configure NTP policy on APIC
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/time-FourthEstate-NTP.json
        method: post
        content:
          datetimePol:
            attributes:
              dn: uni/fabric/time-FourthEstate-NTP
              name: "FourthEstate-NTP"
              adminSt: "enabled"
              authSt: "disabled"
              serverState: "enabled"
            children:
              - datetimeNtpProv:
                  attributes:
                    name: "{{ item.server }}"
                    preferred: "{{ 'yes' if item.preferred else 'no' }}"
                    descr: "{{ item.description | default('') }}"
      no_log: true
      loop: "{{ aci_ntp_servers }}"
      loop_control:
        label: "{{ item.server }}"
      when: apply_changes | bool
      tags:
        - aci
        - apic
        - cluster
        - ntp
        - phase1

    - name: PHASE 1 - Query existing NTP configuration (dry-run)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/time-FourthEstate-NTP.json
        method: get
      no_log: true
      register: aci_ntp_query
      when: not (apply_changes | bool)
      tags:
        - aci
        - apic
        - cluster
        - ntp
        - phase1

    - name: PHASE 1 - Configure DNS policy on APIC
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/dnsp-FourthEstate-DNS.json
        method: post
        content:
          dnsProfile:
            attributes:
              dn: uni/fabric/dnsp-FourthEstate-DNS
              name: "FourthEstate-DNS"
              IPVerPreference: "IPv4"
            children: >-
              {{
                aci_dns_servers | map('dict2items') | map('items2dict') | map(attribute='items') | list |
                map('community.general.dict_kv', 'dnsProv') | list |
                aci_dns_servers | map('regex_replace', '.*', '') | list
              }}
      no_log: true
      when: apply_changes | bool
      tags:
        - aci
        - apic
        - cluster
        - dns
        - phase1

    - name: PHASE 1 - Configure DNS providers in DNS policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/dnsp-FourthEstate-DNS/prov-[{{ item.address }}].json"
        method: post
        content:
          dnsProv:
            attributes:
              addr: "{{ item.address }}"
              preferred: "{{ 'yes' if item.preferred else 'no' }}"
      no_log: true
      loop: "{{ aci_dns_servers }}"
      loop_control:
        label: "{{ item.address }}"
      when: apply_changes | bool
      tags:
        - aci
        - apic
        - cluster
        - dns
        - phase1

    - name: PHASE 1 - Configure DNS search domain in DNS policy
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/dnsp-FourthEstate-DNS/dom-[{{ item.domain }}].json"
        method: post
        content:
          dnsDomain:
            attributes:
              name: "{{ item.domain }}"
              isDefault: "{{ 'yes' if item.default else 'no' }}"
      no_log: true
      loop: "{{ aci_dns_search_domains }}"
      loop_control:
        label: "{{ item.domain }}"
      when: apply_changes | bool
      tags:
        - aci
        - apic
        - cluster
        - dns
        - phase1

    - name: PHASE 1 - Configure syslog remote destination
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/moncommon/slgroup-FourthEstate-Syslog.json
        method: post
        content:
          syslogGroup:
            attributes:
              dn: uni/fabric/moncommon/slgroup-FourthEstate-Syslog
              name: "FourthEstate-Syslog"
              format: "aci"
              includeMilliSeconds: "true"
            children:
              - syslogRemoteDest:
                  attributes:
                    host: "{{ aci_syslog_server }}"
                    port: "{{ aci_syslog_port }}"
                    severity: "{{ aci_syslog_severity }}"
                    facility: "{{ aci_syslog_facility }}"
                    adminState: "enabled"
                    forwardingFacility: "local0"
                    name: "FourthEstate-SyslogDest"
      no_log: true
      when:
        - apply_changes | bool
        - aci_syslog_enabled | bool
      tags:
        - aci
        - apic
        - cluster
        - syslog
        - phase1

    - name: PHASE 1 - Save APIC cluster configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_apic_cluster_config.json"
        mode: "0640"
        content: "{{ apic_cluster_artifact | to_nice_json }}"
      vars:
        apic_cluster_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          fabric_name: "{{ aci_fabric_name }}"
          pod_id: "{{ aci_pod_id }}"
          ntp_servers: "{{ aci_ntp_servers }}"
          dns_servers: "{{ aci_dns_servers }}"
          syslog_enabled: "{{ aci_syslog_enabled }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - apic
        - cluster
        - phase1

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_fabric_deploy/apic_cluster | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_fabric_deploy_apic_cluster_preflight_passed | bool
          - fe_cisco_aci_fabric_deploy_apic_cluster_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_fabric_deploy/apic_cluster: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_fabric_deploy_apic_cluster_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_fabric_deploy_apic_cluster_status | default('unknown') }}.
        success_msg: "cisco/aci_fabric_deploy/apic_cluster: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_fabric_deploy/apic_cluster | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_apic_cluster_postflight_passed: true
        fe_cisco_aci_fabric_deploy_apic_cluster_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_fabric_deploy/apic_cluster | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_apic_cluster_status: "failed"
        fe_cisco_aci_fabric_deploy_apic_cluster_postflight_passed: false
        fe_cisco_aci_fabric_deploy_apic_cluster_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_fabric_deploy_apic_cluster_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/apic_cluster | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_fabric_deploy/apic_cluster: FAILED at '{{ fe_cisco_aci_fabric_deploy_apic_cluster_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_fabric_deploy_apic_cluster_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_fabric_deploy/apic_cluster | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_fabric_deploy/apic_cluster failed at '{{ fe_cisco_aci_fabric_deploy_apic_cluster_failed_task }}': {{ fe_cisco_aci_fabric_deploy_apic_cluster_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_fabric_deploy/apic_cluster | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_apic_cluster_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_fabric_deploy_apic_cluster_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_fabric_deploy_apic_cluster_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/apic_cluster | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_fabric_deploy/apic_cluster":
              component: "cisco/aci_fabric_deploy/apic_cluster"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_fabric_deploy_apic_cluster_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_fabric_deploy_apic_cluster_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_fabric_deploy_apic_cluster_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_fabric_deploy_apic_cluster_status | default('') == 'succeeded' else ['cisco/aci_fabric_deploy/apic_cluster'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_fabric_deploy/apic_cluster | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_fabric_deploy_apic_cluster_stats_published: true
      tags:
        - always
