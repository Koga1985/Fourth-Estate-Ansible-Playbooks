---
# tasks file for ucs_prod_networking
# Cisco UCS Production Networking Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/ucs_prod_networking']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_ucs_prod_networking_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/ucs_prod_networking | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_ucs_prod_networking_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_ucs_prod_networking_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_ucs_prod_networking_status: "running"
    fe_cisco_ucs_prod_networking_preflight_passed: false
    fe_cisco_ucs_prod_networking_postflight_passed: false
    fe_cisco_ucs_prod_networking_failed_task: ""
    fe_cisco_ucs_prod_networking_error: ""
    fe_cisco_ucs_prod_networking_stats_published: false
  tags:
    - always

- name: "cisco/ucs_prod_networking | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/ucs_prod_networking | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/ucs_prod_networking: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/ucs_prod_networking: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_networking | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/ucs_prod_networking: required variable '{{ item }}' is not defined."
        success_msg: "cisco/ucs_prod_networking: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_ucs_prod_networking_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/ucs_prod_networking | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_networking_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create VLANs for fourth estate
      cisco.ucs.ucs_vlan:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        id: "{{ item.id }}"
        fabric: "{{ item.fabric | default('common') }}"
        native: "{{ item.native | default('no') }}"
        state: present
      no_log: true
      loop: "{{ ucs_vlans }}"
      when: apply_changes | bool
      tags:
        - networking
        - vlans

    - name: Create VSANs for SAN connectivity
      cisco.ucs.ucs_vsan:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        vsan_id: "{{ item.id }}"
        fabric: "{{ item.fabric }}"
        fcoe_vlan_id: "{{ item.fcoe_vlan_id | default(omit) }}"
        state: present
      no_log: true
      loop: "{{ ucs_vsans }}"
      when:
        - apply_changes | bool
        - ucs_enable_san | bool
      tags:
        - networking
        - vsans
        - san

    - name: Configure QoS policies
      cisco.ucs.ucs_qos_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        priority: "{{ item.priority }}"
        rate: "{{ item.rate | default('line-rate') }}"
        burst: "{{ item.burst | default(10240) }}"
        host_control: "{{ item.host_control | default('none') }}"
        state: present
      no_log: true
      loop: "{{ ucs_qos_policies }}"
      when: apply_changes | bool
      tags:
        - networking
        - qos

    - name: Configure network control policies
      cisco.ucs.ucs_network_control_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        cdp: "{{ item.cdp | default('enabled') }}"
        lldp_transmit: "{{ item.lldp_transmit | default('enabled') }}"
        lldp_receive: "{{ item.lldp_receive | default('enabled') }}"
        mac_register_mode: "{{ item.mac_register_mode | default('all-host-vlans') }}"
        state: present
      no_log: true
      loop: "{{ ucs_network_control_policies }}"
      when: apply_changes | bool
      tags:
        - networking
        - network_control

    - name: Configure multicast policies
      cisco.ucs.ucs_multicast_policy:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        querier_state: "{{ item.querier_state | default('disabled') }}"
        snooping_state: "{{ item.snooping_state | default('enabled') }}"
        state: present
      no_log: true
      loop: "{{ ucs_multicast_policies }}"
      when: apply_changes | bool
      tags:
        - networking
        - multicast

    - name: Configure uplink port channels
      cisco.ucs.ucs_lan_uplink_port_channel:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        name: "{{ item.name }}"
        port_channel_id: "{{ item.id }}"
        fabric: "{{ item.fabric }}"
        ports: "{{ item.ports }}"
        state: present
      no_log: true
      loop: "{{ ucs_uplink_port_channels }}"
      when: apply_changes | bool
      tags:
        - networking
        - uplinks

    - name: Record networking configuration
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/networking_config.json"
        mode: '0640'
        content: |
          {
            "vlans": {{ ucs_vlans | to_json }},
            "vsans": {{ ucs_vsans | to_json }},
            "qos_policies": {{ ucs_qos_policies | to_json }},
            "configured_at": "{{ ansible_date_time.iso8601 }}"
          }
      delegate_to: localhost
      tags:
        - networking

    # ----------------------------- postflight -------------------

    - name: "cisco/ucs_prod_networking | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_ucs_prod_networking_preflight_passed | bool
          - fe_cisco_ucs_prod_networking_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/ucs_prod_networking: postflight validation failed - preflight passed
          ={{ fe_cisco_ucs_prod_networking_preflight_passed | default(false) }},
          status={{ fe_cisco_ucs_prod_networking_status | default('unknown') }}.
        success_msg: "cisco/ucs_prod_networking: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/ucs_prod_networking | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_networking_postflight_passed: true
        fe_cisco_ucs_prod_networking_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/ucs_prod_networking | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_networking_status: "failed"
        fe_cisco_ucs_prod_networking_postflight_passed: false
        fe_cisco_ucs_prod_networking_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_ucs_prod_networking_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_networking | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/ucs_prod_networking: FAILED at '{{ fe_cisco_ucs_prod_networking_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_ucs_prod_networking_error }}
      tags:
        - always
        - rescue

    - name: "cisco/ucs_prod_networking | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/ucs_prod_networking failed at '{{ fe_cisco_ucs_prod_networking_failed_task }}': {{ fe_cisco_ucs_prod_networking_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/ucs_prod_networking | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_networking_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_ucs_prod_networking_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_prod_networking_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/ucs_prod_networking | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/ucs_prod_networking":
              component: "cisco/ucs_prod_networking"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_ucs_prod_networking_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_ucs_prod_networking_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_ucs_prod_networking_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_ucs_prod_networking_started_at | default('') }}"
              ended_at: "{{ fe_cisco_ucs_prod_networking_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_ucs_prod_networking_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_ucs_prod_networking_failed_task | default('') }}"
              error: "{{ fe_cisco_ucs_prod_networking_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_prod_networking_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_ucs_prod_networking_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_ucs_prod_networking_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_ucs_prod_networking_status | default('') == 'succeeded' else ['cisco/ucs_prod_networking'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/ucs_prod_networking | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_ucs_prod_networking_stats_published: true
      tags:
        - always
