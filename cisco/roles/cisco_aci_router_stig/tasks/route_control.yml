---
# Route control enforcement on L3Outs
# CISC-RT-000520 (inbound/outbound route filtering) | NIST AC-4, CM-7
# Sets l3extOut.enforceRtctrl to "import,export" so both directions require
# explicit route-control (default-deny) rather than permitting all routes.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_aci_router_stig/route_control']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_aci_router_stig_route_control_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_aci_router_stig/route_control | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_aci_router_stig_route_control_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_aci_router_stig_route_control_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_aci_router_stig_route_control_status: "running"
    fe_cisco_cisco_aci_router_stig_route_control_preflight_passed: false
    fe_cisco_cisco_aci_router_stig_route_control_postflight_passed: false
    fe_cisco_cisco_aci_router_stig_route_control_failed_task: ""
    fe_cisco_cisco_aci_router_stig_route_control_error: ""
    fe_cisco_cisco_aci_router_stig_route_control_stats_published: false
  tags:
    - always

- name: "cisco/cisco_aci_router_stig/route_control | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_aci_router_stig/route_control | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_aci_router_stig/route_control: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_aci_router_stig/route_control: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_aci_router_stig/route_control | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_aci_router_stig/route_control: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_aci_router_stig/route_control: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_aci_router_stig_route_control_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_aci_router_stig/route_control | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_aci_router_stig_route_control_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CISC-RT-000520 - Enforce import+export route control on L3Outs
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/{{ item.dn }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          l3extOut:
            attributes:
              dn: "{{ item.dn }}"
              name: "{{ item.name }}"
              enforceRtctrl: "import,export"
      loop: "{{ aci_l3outs_enforce_route_control }}"
      loop_control:
        label: "L3Out {{ item.name | default(item.dn) }}"
      register: aci_rtctrl_result
      tags: [stig_cat2, "CISC-RT-000520"]

    - name: Note when no L3Outs are defined for route control
      ansible.builtin.debug:
        msg: "No aci_l3outs_enforce_route_control defined - skipping route-control enforcement (CISC-RT-000520)."
      when: aci_l3outs_enforce_route_control | length == 0
      tags: [route_control]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_aci_router_stig/route_control | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_aci_router_stig_route_control_preflight_passed | bool
          - fe_cisco_cisco_aci_router_stig_route_control_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_aci_router_stig/route_control: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_aci_router_stig_route_control_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_aci_router_stig_route_control_status | default('unknown') }}.
        success_msg: "cisco/cisco_aci_router_stig/route_control: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_aci_router_stig/route_control | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_aci_router_stig_route_control_postflight_passed: true
        fe_cisco_cisco_aci_router_stig_route_control_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_aci_router_stig/route_control | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_aci_router_stig_route_control_status: "failed"
        fe_cisco_cisco_aci_router_stig_route_control_postflight_passed: false
        fe_cisco_cisco_aci_router_stig_route_control_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_aci_router_stig_route_control_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_aci_router_stig/route_control | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_aci_router_stig/route_control: FAILED at '{{ fe_cisco_cisco_aci_router_stig_route_control_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_aci_router_stig_route_control_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_aci_router_stig/route_control | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_aci_router_stig/route_control failed at '{{ fe_cisco_cisco_aci_router_stig_route_control_failed_task }}': {{ fe_cisco_cisco_aci_router_stig_route_control_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_aci_router_stig/route_control | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_aci_router_stig_route_control_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_aci_router_stig_route_control_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_aci_router_stig_route_control_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_aci_router_stig/route_control | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_aci_router_stig/route_control":
              component: "cisco/cisco_aci_router_stig/route_control"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_aci_router_stig_route_control_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_aci_router_stig_route_control_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_aci_router_stig_route_control_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_aci_router_stig_route_control_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_aci_router_stig_route_control_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_aci_router_stig_route_control_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_aci_router_stig_route_control_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_aci_router_stig_route_control_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_aci_router_stig_route_control_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_aci_router_stig_route_control_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_aci_router_stig_route_control_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_aci_router_stig_route_control_status | default('') == 'succeeded' else ['cisco/cisco_aci_router_stig/route_control'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_aci_router_stig/route_control | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_aci_router_stig_route_control_stats_published: true
      tags:
        - always
