---
# tasks file for aci_monitoring - Call Home Configuration
# Configures Cisco Call Home policy, SMTP settings, profile, destinations, and smart licensing

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_monitoring/callhome']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_monitoring_callhome_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_monitoring/callhome | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_monitoring_callhome_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_monitoring_callhome_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_monitoring_callhome_status: "running"
    fe_cisco_aci_monitoring_callhome_preflight_passed: false
    fe_cisco_aci_monitoring_callhome_postflight_passed: false
    fe_cisco_aci_monitoring_callhome_failed_task: ""
    fe_cisco_aci_monitoring_callhome_error: ""
    fe_cisco_aci_monitoring_callhome_stats_published: false
  tags:
    - always

- name: "cisco/aci_monitoring/callhome | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_monitoring/callhome | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_monitoring/callhome: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_monitoring/callhome: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/callhome | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_monitoring/callhome: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_monitoring/callhome: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_monitoring_callhome_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/callhome | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_callhome_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Configure Call Home policy on ACI fabric
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/callhome.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          callhomePol:
            attributes:
              dn: uni/fabric/callhome
              adminState: "{{ 'enabled' if aci_callhome_enabled | bool else 'disabled' }}"
              custContractId: "{{ aci_callhome_contract_id }}"
              custCustomerId: "{{ aci_callhome_customer_id }}"
              custSiteId: "{{ aci_callhome_site_id }}"
              custContactEmail: "{{ aci_callhome_email }}"
              custContact: "{{ aci_callhome_contact }}"
              custPhone: "{{ aci_callhome_phone }}"
              custAddr: "{{ aci_callhome_street_address }}"
              custOrg: "{{ aci_callhome_org_name }}"
              from: "{{ aci_callhome_from_email }}"
              replyTo: "{{ aci_callhome_reply_email }}"
              descr: "Fourth Estate ACI Call Home - automated fault notification"
      no_log: true
      register: callhome_policy_result
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    - name: PHASE 5 - Configure Call Home SMTP server settings
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/callhome/smtp.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          callhomeSmtp:
            attributes:
              dn: uni/fabric/callhome/smtp
              host: "{{ aci_callhome_smtp_server }}"
              port: "{{ aci_callhome_smtp_port | default(25) }}"
              secPort: "465"
      no_log: true
      register: callhome_smtp_result
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    - name: PHASE 5 - Configure Call Home destination profile (full-text)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/callhome/prof-FourthEstate-CallHome.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          callhomeDestProfile:
            attributes:
              dn: uni/fabric/callhome/prof-FourthEstate-CallHome
              name: "FourthEstate-CallHome"
              format: "fullTxt"
              maxMsgSz: "500000"
              reportTypes: "all"
              level: "debug"
              descr: "Fourth Estate Call Home destination profile - all severity levels"
      no_log: true
      register: callhome_profile_result
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    - name: PHASE 5 - Configure Call Home email destination
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/callhome/prof-FourthEstate-CallHome/dest.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          callhomeDest:
            attributes:
              dn: uni/fabric/callhome/prof-FourthEstate-CallHome/dest
              email: "{{ aci_callhome_email }}"
              protocol: "email"
      no_log: true
      register: callhome_dest_result
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    - name: PHASE 5 - Configure Call Home source (bind to fabric monitoring)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/moncommon/callhomesrc-FourthEstate-CallHome.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          callhomeSrc:
            attributes:
              dn: uni/fabric/moncommon/callhomesrc-FourthEstate-CallHome
              name: "FourthEstate-CallHome"
              incl: "all"
              minSev: "minor"
              descr: "Fourth Estate Call Home source - minor severity and above"
            children:
              - callhomeRsDestProfile:
                  attributes:
                    tnCallhomeDestProfileName: "FourthEstate-CallHome"
      no_log: true
      register: callhome_source_result
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    - name: PHASE 5 - Configure Call Home smart licensing integration
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/smartlic.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          smartLicP:
            attributes:
              dn: uni/fabric/smartlic
              descr: "Fourth Estate Smart Licensing integration"
      no_log: true
      register: callhome_smartlic_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - callhome
        - smartlicensing
        - phase5

    - name: PHASE 5 - Save Call Home configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_callhome_config.json"
        mode: "0640"
        content: "{{ callhome_artifact | to_nice_json }}"
      vars:
        callhome_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          callhome_enabled: "{{ aci_callhome_enabled | bool }}"
          callhome_org: "{{ aci_callhome_org_name }}"
          callhome_email: "{{ aci_callhome_email }}"
          smtp_server: "{{ aci_callhome_smtp_server }}"
          smtp_port: "{{ aci_callhome_smtp_port }}"
          destination_profile: "FourthEstate-CallHome"
          policy_status: "{{ callhome_policy_result.imdata | default([]) | length }}"
          compliance_note: "Call Home - Cisco TAC automated fault notification and smart licensing"
      tags:
        - aci
        - monitoring
        - callhome
        - phase5

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_monitoring/callhome | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_monitoring_callhome_preflight_passed | bool
          - fe_cisco_aci_monitoring_callhome_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_monitoring/callhome: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_monitoring_callhome_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_monitoring_callhome_status | default('unknown') }}.
        success_msg: "cisco/aci_monitoring/callhome: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_monitoring/callhome | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_callhome_postflight_passed: true
        fe_cisco_aci_monitoring_callhome_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_monitoring/callhome | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_callhome_status: "failed"
        fe_cisco_aci_monitoring_callhome_postflight_passed: false
        fe_cisco_aci_monitoring_callhome_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_monitoring_callhome_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/callhome | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_monitoring/callhome: FAILED at '{{ fe_cisco_aci_monitoring_callhome_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_monitoring_callhome_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/callhome | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_monitoring/callhome failed at '{{ fe_cisco_aci_monitoring_callhome_failed_task }}': {{ fe_cisco_aci_monitoring_callhome_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_monitoring/callhome | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_callhome_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_monitoring_callhome_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_monitoring_callhome_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_monitoring/callhome | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_monitoring/callhome":
              component: "cisco/aci_monitoring/callhome"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_monitoring_callhome_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_monitoring_callhome_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_monitoring_callhome_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_monitoring_callhome_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_monitoring_callhome_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_monitoring_callhome_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_monitoring_callhome_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_monitoring_callhome_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_monitoring_callhome_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_monitoring_callhome_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_monitoring_callhome_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_monitoring_callhome_status | default('') == 'succeeded' else ['cisco/aci_monitoring/callhome'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_monitoring/callhome | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_callhome_stats_published: true
      tags:
        - always
