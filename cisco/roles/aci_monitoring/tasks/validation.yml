---
# tasks file for aci_monitoring - Validation and Verification
# Verifies SNMP, syslog, and Call Home are configured; generates validation report

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_monitoring/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_monitoring_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_monitoring/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_monitoring_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_monitoring_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_monitoring_validation_status: "running"
    fe_cisco_aci_monitoring_validation_preflight_passed: false
    fe_cisco_aci_monitoring_validation_postflight_passed: false
    fe_cisco_aci_monitoring_validation_failed_task: ""
    fe_cisco_aci_monitoring_validation_error: ""
    fe_cisco_aci_monitoring_validation_stats_published: false
  tags:
    - always

- name: "cisco/aci_monitoring/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_monitoring/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_monitoring/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_monitoring/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_monitoring/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_monitoring/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_monitoring_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Query SNMP policy configuration for validation
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: get
      no_log: true
      register: snmp_validation_result
      failed_when: false
      when: enable_snmp | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Query syslog policy configuration for validation
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/slgroup-FourthEstate-Syslog.json
        method: get
      no_log: true
      register: syslog_validation_result
      failed_when: false
      when: enable_syslog | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Query syslog remote destinations for validation
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/slgroup-FourthEstate-Syslog.json?rsp-subtree=children&rsp-subtree-class=syslogRemoteDest"
        method: get
      no_log: true
      register: syslog_dest_validation_result
      failed_when: false
      when: enable_syslog | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Query Call Home policy configuration for validation
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/callhome.json
        method: get
      no_log: true
      register: callhome_validation_result
      failed_when: false
      when: enable_callhome | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Assert SNMP policy is configured
      ansible.builtin.assert:
        that:
          - snmp_validation_result is defined
          - snmp_validation_result.status is defined
          - snmp_validation_result.status == 200
        fail_msg: "SNMP policy validation failed - unable to query SNMP configuration from APIC"
        success_msg: "SNMP policy query succeeded"
        quiet: true
      when: enable_snmp | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Assert syslog policy is configured
      ansible.builtin.assert:
        that:
          - syslog_validation_result is defined
          - syslog_validation_result.status is defined
          - syslog_validation_result.status == 200
        fail_msg: "Syslog policy validation failed - unable to query syslog configuration from APIC"
        success_msg: "Syslog policy query succeeded"
        quiet: true
      when: enable_syslog | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Assert Call Home policy is configured
      ansible.builtin.assert:
        that:
          - callhome_validation_result is defined
          - callhome_validation_result.status is defined
          - callhome_validation_result.status == 200
        fail_msg: "Call Home policy validation failed - unable to query Call Home configuration from APIC"
        success_msg: "Call Home policy query succeeded"
        quiet: true
      when: enable_callhome | bool
      tags:
        - validation
        - verification

    - name: PHASE 5 - Display monitoring validation summary
      ansible.builtin.debug:
        msg:
          - "==================================================================="
          - " ACI Monitoring Validation Summary - Fourth Estate"
          - "==================================================================="
          - " APIC Host:      {{ aci_host }}"
          - " Timestamp:      {{ ansible_date_time.iso8601 }}"
          - "-------------------------------------------------------------------"
          - " SNMP Policy:    {{ 'CONFIGURED' if (snmp_validation_result.imdata | default([]) | length > 0) else ('SKIPPED' if not (enable_snmp | bool) else 'NOT FOUND') }}"
          - " Syslog Policy:  {{ 'CONFIGURED' if (syslog_validation_result.imdata | default([]) | length > 0) else ('SKIPPED' if not (enable_syslog | bool) else 'NOT FOUND') }}"
          - " Call Home:      {{ 'CONFIGURED' if (callhome_validation_result.imdata | default([]) | length > 0) else ('SKIPPED' if not (enable_callhome | bool) else 'NOT FOUND') }}"
          - "-------------------------------------------------------------------"
          - " Apply Changes:  {{ apply_changes | bool }}"
          - " Monitoring Start: {{ aci_monitoring_start_time | default('unknown') }}"
          - "==================================================================="
      tags:
        - validation
        - verification

    - name: PHASE 5 - Generate monitoring validation report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_monitoring_validation_report.json"
        mode: "0640"
        content: "{{ validation_report | to_nice_json }}"
      vars:
        validation_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          monitoring_start: "{{ aci_monitoring_start_time | default('unknown') }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          validation_results:
            snmp:
              enabled: "{{ enable_snmp | bool }}"
              configured: "{{ (snmp_validation_result.imdata | default([]) | length > 0) if enable_snmp | bool else false }}"
              http_status: "{{ snmp_validation_result.status | default('skipped') }}"
            syslog:
              enabled: "{{ enable_syslog | bool }}"
              configured: "{{ (syslog_validation_result.imdata | default([]) | length > 0) if enable_syslog | bool else false }}"
              http_status: "{{ syslog_validation_result.status | default('skipped') }}"
              remote_dest_count: "{{ (syslog_dest_validation_result.imdata | default([]) | length) if enable_syslog | bool else 0 }}"
            callhome:
              enabled: "{{ enable_callhome | bool }}"
              configured: "{{ (callhome_validation_result.imdata | default([]) | length > 0) if enable_callhome | bool else false }}"
              http_status: "{{ callhome_validation_result.status | default('skipped') }}"
            health_monitoring:
              enabled: "{{ enable_health_monitoring | bool }}"
              warn_threshold: "{{ aci_health_warn_threshold }}"
              critical_threshold: "{{ aci_health_critical_threshold }}"
            fault_management:
              enabled: "{{ enable_fault_management | bool }}"
              fail_on_critical: "{{ aci_fault_fail_on_critical | bool }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
          overall_status: "PASSED"
      tags:
        - validation
        - verification

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_monitoring/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_monitoring_validation_preflight_passed | bool
          - fe_cisco_aci_monitoring_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_monitoring/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_monitoring_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_monitoring_validation_status | default('unknown') }}.
        success_msg: "cisco/aci_monitoring/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_monitoring/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_validation_postflight_passed: true
        fe_cisco_aci_monitoring_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_monitoring/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_validation_status: "failed"
        fe_cisco_aci_monitoring_validation_postflight_passed: false
        fe_cisco_aci_monitoring_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_monitoring_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_monitoring/validation: FAILED at '{{ fe_cisco_aci_monitoring_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_monitoring_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_monitoring/validation failed at '{{ fe_cisco_aci_monitoring_validation_failed_task }}': {{ fe_cisco_aci_monitoring_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_monitoring/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_monitoring_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_monitoring_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_monitoring/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_monitoring/validation":
              component: "cisco/aci_monitoring/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_monitoring_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_monitoring_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_monitoring_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_monitoring_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_monitoring_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_monitoring_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_monitoring_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_monitoring_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_monitoring_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_monitoring_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_monitoring_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_monitoring_validation_status | default('') == 'succeeded' else ['cisco/aci_monitoring/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_monitoring/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_validation_stats_published: true
      tags:
        - always
