---
# tasks file for aci_monitoring - Health Monitoring
# Queries fabric, pod, node, and tenant health scores; checks against thresholds; generates report

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_monitoring/health_monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_monitoring_health_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_monitoring/health_monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_monitoring_health_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_monitoring_health_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_monitoring_health_monitoring_status: "running"
    fe_cisco_aci_monitoring_health_monitoring_preflight_passed: false
    fe_cisco_aci_monitoring_health_monitoring_postflight_passed: false
    fe_cisco_aci_monitoring_health_monitoring_failed_task: ""
    fe_cisco_aci_monitoring_health_monitoring_error: ""
    fe_cisco_aci_monitoring_health_monitoring_stats_published: false
  tags:
    - always

- name: "cisco/aci_monitoring/health_monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_monitoring/health_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_monitoring/health_monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_monitoring/health_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/health_monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_monitoring/health_monitoring: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_monitoring/health_monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_monitoring_health_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/health_monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_health_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Query overall fabric health score
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/topology/health.json
        method: get
      no_log: true
      register: fabric_health_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Set fabric health score fact
      ansible.builtin.set_fact:
        fabric_health_score: "{{ fabric_health_result.imdata[0].fabricHealthTotal.attributes.cur | default('unknown') }}"
      when: fabric_health_result.imdata is defined and fabric_health_result.imdata | length > 0
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Set fabric health score fact (fallback)
      ansible.builtin.set_fact:
        fabric_health_score: "unknown"
      when: fabric_health_result.imdata is not defined or fabric_health_result.imdata | length == 0
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Query pod health scores
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/class/fabricPodHealthTotal.json
        method: get
      no_log: true
      register: pod_health_result
      failed_when: false
      when: aci_monitor_pods | bool
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Query node health scores (all fabric nodes)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/class/fabricNodeHealthTotal.json?order-by=fabricNodeHealthTotal.cur|asc
        method: get
      no_log: true
      register: node_health_result
      failed_when: false
      when: aci_monitor_nodes | bool
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Query tenant health scores
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/class/fvTenant.json?rsp-subtree-include=health
        method: get
      no_log: true
      register: tenant_health_result
      failed_when: false
      when: aci_monitor_tenants | bool
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Query APIC health scores
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/class/infraWiNode.json?rsp-subtree-include=health
        method: get
      no_log: true
      register: apic_health_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Set node health facts for threshold analysis
      ansible.builtin.set_fact:
        node_health_scores: "{{ node_health_result.imdata | default([]) | map(attribute='fabricNodeHealthTotal.attributes') | list }}"
      when: aci_monitor_nodes | bool and node_health_result.imdata is defined
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Set node health facts (fallback)
      ansible.builtin.set_fact:
        node_health_scores: []
      when: not (aci_monitor_nodes | bool) or node_health_result.imdata is not defined
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Check fabric health against warning threshold
      ansible.builtin.debug:
        msg:
          - "WARNING: Fabric health score {{ fabric_health_score }} is below warning threshold {{ aci_health_warn_threshold }}"
          - "Review ACI fabric health at: https://{{ aci_host }}/index.html"
      when:
        - fabric_health_score != 'unknown'
        - fabric_health_score | int < aci_health_warn_threshold | int
        - fabric_health_score | int >= aci_health_critical_threshold | int
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Check fabric health against critical threshold
      ansible.builtin.debug:
        msg:
          - "CRITICAL: Fabric health score {{ fabric_health_score }} is below critical threshold {{ aci_health_critical_threshold }}"
          - "Immediate attention required - review faults at: https://{{ aci_host }}/index.html"
      when:
        - fabric_health_score != 'unknown'
        - fabric_health_score | int < aci_health_critical_threshold | int
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Fail on critical fabric health if configured
      ansible.builtin.fail:
        msg: "CRITICAL: Fabric health score {{ fabric_health_score }} is below critical threshold {{ aci_health_critical_threshold }} - deployment blocked"
      when:
        - aci_health_fail_on_critical | bool
        - fabric_health_score != 'unknown'
        - fabric_health_score | int < aci_health_critical_threshold | int
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Display health monitoring summary
      ansible.builtin.debug:
        msg:
          - "==================================================================="
          - " ACI Health Monitoring Summary - Fourth Estate"
          - "==================================================================="
          - " APIC Host:           {{ aci_host }}"
          - " Fabric Health Score: {{ fabric_health_score }}"
          - " Warning Threshold:   {{ aci_health_warn_threshold }}"
          - " Critical Threshold:  {{ aci_health_critical_threshold }}"
          - " Status:              {{ 'CRITICAL' if fabric_health_score != 'unknown' and fabric_health_score | int < aci_health_critical_threshold | int else ('WARNING' if fabric_health_score != 'unknown' and fabric_health_score | int < aci_health_warn_threshold | int else 'HEALTHY') }}"
          - "-------------------------------------------------------------------"
          - " Pod Count:           {{ pod_health_result.imdata | default([]) | length }}"
          - " Node Count:          {{ node_health_result.imdata | default([]) | length }}"
          - " Tenant Count:        {{ tenant_health_result.imdata | default([]) | length }}"
          - " Timestamp:           {{ ansible_date_time.iso8601 }}"
          - "==================================================================="
      tags:
        - aci
        - monitoring
        - health
        - phase5

    - name: PHASE 5 - Generate health monitoring report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_health_report.json"
        mode: "0640"
        content: "{{ health_report | to_nice_json }}"
      vars:
        health_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          fabric_health_score: "{{ fabric_health_score }}"
          health_thresholds:
            warning: "{{ aci_health_warn_threshold }}"
            critical: "{{ aci_health_critical_threshold }}"
          health_status: "{{ 'CRITICAL' if fabric_health_score != 'unknown' and fabric_health_score | int < aci_health_critical_threshold | int else ('WARNING' if fabric_health_score != 'unknown' and fabric_health_score | int < aci_health_warn_threshold | int else 'HEALTHY') }}"
          pod_count: "{{ pod_health_result.imdata | default([]) | length }}"
          pod_health_entries: "{{ pod_health_result.imdata | default([]) }}"
          node_count: "{{ node_health_result.imdata | default([]) | length }}"
          node_health_scores: "{{ node_health_scores | default([]) }}"
          tenant_count: "{{ tenant_health_result.imdata | default([]) | length }}"
          monitoring_config:
            monitor_pods: "{{ aci_monitor_pods | bool }}"
            monitor_nodes: "{{ aci_monitor_nodes | bool }}"
            monitor_tenants: "{{ aci_monitor_tenants | bool }}"
          fourth_estate_org: "{{ fourth_estate_org }}"
          fourth_estate_environment: "{{ fourth_estate_environment }}"
      tags:
        - aci
        - monitoring
        - health
        - phase5

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_monitoring/health_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_monitoring_health_monitoring_preflight_passed | bool
          - fe_cisco_aci_monitoring_health_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_monitoring/health_monitoring: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_monitoring_health_monitoring_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_monitoring_health_monitoring_status | default('unknown') }}.
        success_msg: "cisco/aci_monitoring/health_monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_monitoring/health_monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_health_monitoring_postflight_passed: true
        fe_cisco_aci_monitoring_health_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_monitoring/health_monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_health_monitoring_status: "failed"
        fe_cisco_aci_monitoring_health_monitoring_postflight_passed: false
        fe_cisco_aci_monitoring_health_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_monitoring_health_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/health_monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_monitoring/health_monitoring: FAILED at '{{ fe_cisco_aci_monitoring_health_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_monitoring_health_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/health_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_monitoring/health_monitoring failed at '{{ fe_cisco_aci_monitoring_health_monitoring_failed_task }}': {{ fe_cisco_aci_monitoring_health_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_monitoring/health_monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_health_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_monitoring_health_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_monitoring_health_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_monitoring/health_monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_monitoring/health_monitoring":
              component: "cisco/aci_monitoring/health_monitoring"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_monitoring_health_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_monitoring_health_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_monitoring_health_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_monitoring_health_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_monitoring_health_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_monitoring_health_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_monitoring_health_monitoring_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_monitoring_health_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_monitoring_health_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_monitoring_health_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_monitoring_health_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_monitoring_health_monitoring_status | default('') == 'succeeded' else ['cisco/aci_monitoring/health_monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_monitoring/health_monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_health_monitoring_stats_published: true
      tags:
        - always
