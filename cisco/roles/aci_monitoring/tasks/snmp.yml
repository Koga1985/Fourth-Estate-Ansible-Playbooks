---
# tasks file for aci_monitoring - SNMP Configuration
# Configures SNMPv3 policy, users, client groups, trap destinations, and trap format

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_monitoring/snmp']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_monitoring_snmp_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_monitoring/snmp | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_monitoring_snmp_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_monitoring_snmp_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_monitoring_snmp_status: "running"
    fe_cisco_aci_monitoring_snmp_preflight_passed: false
    fe_cisco_aci_monitoring_snmp_postflight_passed: false
    fe_cisco_aci_monitoring_snmp_failed_task: ""
    fe_cisco_aci_monitoring_snmp_error: ""
    fe_cisco_aci_monitoring_snmp_stats_published: false
  tags:
    - always

- name: "cisco/aci_monitoring/snmp | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_monitoring/snmp | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_monitoring/snmp: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_monitoring/snmp: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/snmp | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_monitoring/snmp: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_monitoring/snmp: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_monitoring_snmp_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/snmp | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_snmp_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Configure SNMP policy on ACI fabric
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpPol:
            attributes:
              dn: uni/fabric/snmppol-default
              name: "default"
              adminSt: "{{ 'enabled' if aci_snmp_enabled | bool else 'disabled' }}"
              contact: "{{ aci_snmp_contact }}"
              loc: "{{ aci_snmp_location }}"
              descr: "Fourth Estate ACI SNMP Policy - SNMPv3 enforced"
      no_log: true
      register: snmp_policy_result
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Disable SNMPv1 and SNMPv2 community strings (enforce v3-only)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/snmppol-default/community-{{ aci_snmp_community | hash('md5') | truncate(8, true, '') }}.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpCommunityP:
            attributes:
              dn: "uni/fabric/snmppol-default/community-{{ aci_snmp_community | hash('md5') | truncate(8, true, '') }}"
              name: "{{ aci_snmp_community }}"
              descr: "Fourth Estate SNMPv2c community - restricted to management network only"
      no_log: true
      register: snmp_community_result
      when: aci_snmp_version != 'v3'
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Configure SNMPv3 users on ACI fabric
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/snmppol-default/user-{{ item.username }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpUserP:
            attributes:
              dn: "uni/fabric/snmppol-default/user-{{ item.username }}"
              name: "{{ item.username }}"
              authType: "{{ item.auth_type | default('SHA') }}"
              authKey: "{{ item.auth_password }}"
              privType: "{{ item.priv_type | default('AES-128') }}"
              privKey: "{{ item.priv_password }}"
              descr: "{{ item.description | default('SNMPv3 user - Fourth Estate') }}"
      no_log: true
      loop: "{{ aci_snmp_v3_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: snmp_v3_users_result
      tags:
        - aci
        - monitoring
        - snmp
        - snmpv3
        - phase5

    - name: PHASE 5 - Configure SNMP client groups (source IP restriction)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/snmppol-default/clgrp-{{ item.name }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpClientGrpP:
            attributes:
              dn: "uni/fabric/snmppol-default/clgrp-{{ item.name }}"
              name: "{{ item.name }}"
              descr: "{{ item.description | default('SNMP client group - Fourth Estate') }}"
            children: "{{ item.clients | map(attribute='address') | zip(item.clients | map(attribute='name')) | map('zip', ['addr', 'name']) | map('items2dict') | map('combine', {'snmpClientP': {'attributes': {}}}) | list }}"
      no_log: true
      loop: "{{ aci_snmp_client_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: snmp_client_groups_result
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Configure SNMP client entries within client groups
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/snmppol-default/clgrp-{{ item.0.name }}/client-[{{ item.1.address }}].json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpClientP:
            attributes:
              dn: "uni/fabric/snmppol-default/clgrp-{{ item.0.name }}/client-[{{ item.1.address }}]"
              addr: "{{ item.1.address }}"
              name: "{{ item.1.name }}"
      no_log: true
      loop: "{{ aci_snmp_client_groups | subelements('clients') }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.name }}"
      register: snmp_client_entries_result
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Configure SNMP trap policy on ACI fabric
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/moncommon/snmpsrc-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpSrc:
            attributes:
              dn: uni/fabric/moncommon/snmpsrc-default
              name: "default"
              incl: "all"
              descr: "Fourth Estate SNMP trap source policy"
      no_log: true
      register: snmp_trap_policy_result
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Configure SNMP trap destinations
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/mo/uni/fabric/snmpdest-{{ item.host | replace('.', '-') }}-{{ item.port }}.json"
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpRemoteDest:
            attributes:
              dn: "uni/fabric/snmpdest-{{ item.host | replace('.', '-') }}-{{ item.port }}"
              host: "{{ item.host }}"
              port: "{{ item.port | default(162) }}"
              ver: "{{ item.version | default('v3') }}"
              secName: "{{ item.community | default(aci_snmp_community) }}"
              v3SecLvl: "priv"
              notifT: "traps"
              descr: "{{ item.description | default('SNMP trap destination - Fourth Estate') }}"
      no_log: true
      loop: "{{ aci_snmp_trap_destinations }}"
      loop_control:
        label: "{{ item.host }}:{{ item.port }}"
      register: snmp_trap_dest_result
      tags:
        - aci
        - monitoring
        - snmp
        - traps
        - phase5

    - name: PHASE 5 - Configure SNMP trap format (include VRF and oid)
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: /api/mo/uni/fabric/snmppol-default.json
        method: "{{ 'post' if apply_changes | bool else 'get' }}"
        content:
          snmpPol:
            attributes:
              dn: uni/fabric/snmppol-default
              name: "default"
      no_log: true
      register: snmp_format_result
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    - name: PHASE 5 - Save SNMP configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_snmp_config.json"
        mode: "0640"
        content: "{{ snmp_artifact | to_nice_json }}"
      vars:
        snmp_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          snmp_enabled: "{{ aci_snmp_enabled | bool }}"
          snmp_version: "{{ aci_snmp_version }}"
          snmp_contact: "{{ aci_snmp_contact }}"
          snmp_location: "{{ aci_snmp_location }}"
          v3_user_count: "{{ aci_snmp_v3_users | length }}"
          v3_usernames: "{{ aci_snmp_v3_users | map(attribute='username') | list }}"
          trap_destination_count: "{{ aci_snmp_trap_destinations | length }}"
          client_group_count: "{{ aci_snmp_client_groups | length }}"
          snmp_policy_status: "{{ snmp_policy_result.imdata | default([]) | length }}"
          compliance_note: "SNMPv3 with SHA auth and AES-128 priv - NIST 800-53 SC-8, IA-3"
      tags:
        - aci
        - monitoring
        - snmp
        - phase5

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_monitoring/snmp | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_monitoring_snmp_preflight_passed | bool
          - fe_cisco_aci_monitoring_snmp_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_monitoring/snmp: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_monitoring_snmp_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_monitoring_snmp_status | default('unknown') }}.
        success_msg: "cisco/aci_monitoring/snmp: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_monitoring/snmp | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_snmp_postflight_passed: true
        fe_cisco_aci_monitoring_snmp_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_monitoring/snmp | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_snmp_status: "failed"
        fe_cisco_aci_monitoring_snmp_postflight_passed: false
        fe_cisco_aci_monitoring_snmp_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_monitoring_snmp_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/snmp | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_monitoring/snmp: FAILED at '{{ fe_cisco_aci_monitoring_snmp_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_monitoring_snmp_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/snmp | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_monitoring/snmp failed at '{{ fe_cisco_aci_monitoring_snmp_failed_task }}': {{ fe_cisco_aci_monitoring_snmp_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_monitoring/snmp | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_snmp_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_monitoring_snmp_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_monitoring_snmp_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_monitoring/snmp | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_monitoring/snmp":
              component: "cisco/aci_monitoring/snmp"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_monitoring_snmp_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_monitoring_snmp_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_monitoring_snmp_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_monitoring_snmp_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_monitoring_snmp_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_monitoring_snmp_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_monitoring_snmp_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_monitoring_snmp_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_monitoring_snmp_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_monitoring_snmp_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_monitoring_snmp_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_monitoring_snmp_status | default('') == 'succeeded' else ['cisco/aci_monitoring/snmp'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_monitoring/snmp | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_snmp_stats_published: true
      tags:
        - always
