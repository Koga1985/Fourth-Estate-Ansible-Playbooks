---
# tasks file for aci_monitoring - Fault Management
# Queries faults by severity, counts them, generates fault report, warns/fails on critical faults

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_monitoring/fault_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_monitoring_fault_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_monitoring/fault_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_monitoring_fault_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_monitoring_fault_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_monitoring_fault_management_status: "running"
    fe_cisco_aci_monitoring_fault_management_preflight_passed: false
    fe_cisco_aci_monitoring_fault_management_postflight_passed: false
    fe_cisco_aci_monitoring_fault_management_failed_task: ""
    fe_cisco_aci_monitoring_fault_management_error: ""
    fe_cisco_aci_monitoring_fault_management_stats_published: false
  tags:
    - always

- name: "cisco/aci_monitoring/fault_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_monitoring/fault_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_monitoring/fault_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_monitoring/fault_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/fault_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_monitoring/fault_management: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_monitoring/fault_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_monitoring_fault_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_monitoring/fault_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_fault_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Query all current active faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?order-by=faultInst.severity|desc&page-size={{ aci_fault_page_size }}"
        method: get
      no_log: true
      register: all_faults_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Query critical faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=eq(faultInst.severity,\"critical\")&order-by=faultInst.lastTransition|desc&page-size={{ aci_fault_page_size }}"
        method: get
      no_log: true
      register: critical_faults_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Query major faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=eq(faultInst.severity,\"major\")&order-by=faultInst.lastTransition|desc&page-size={{ aci_fault_page_size }}"
        method: get
      no_log: true
      register: major_faults_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Query minor faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=eq(faultInst.severity,\"minor\")&order-by=faultInst.lastTransition|desc&page-size={{ aci_fault_page_size }}"
        method: get
      no_log: true
      register: minor_faults_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Query warning faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=eq(faultInst.severity,\"warning\")&order-by=faultInst.lastTransition|desc&page-size={{ aci_fault_page_size }}"
        method: get
      no_log: true
      register: warning_faults_result
      failed_when: false
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Set fault count facts by severity
      ansible.builtin.set_fact:
        fault_count_critical: "{{ critical_faults_result.imdata | default([]) | length }}"
        fault_count_major: "{{ major_faults_result.imdata | default([]) | length }}"
        fault_count_minor: "{{ minor_faults_result.imdata | default([]) | length }}"
        fault_count_warning: "{{ warning_faults_result.imdata | default([]) | length }}"
        fault_count_total: "{{ all_faults_result.imdata | default([]) | length }}"
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Warn if major faults are detected
      ansible.builtin.debug:
        msg:
          - "WARNING: {{ fault_count_major }} major fault(s) detected in ACI fabric"
          - "Review major faults at: https://{{ aci_host }}/index.html"
      when:
        - aci_fault_warn_on_major | bool
        - fault_count_major | int > 0
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Warn if critical faults are detected (non-failing)
      ansible.builtin.debug:
        msg:
          - "CRITICAL ALERT: {{ fault_count_critical }} critical fault(s) detected in ACI fabric"
          - "Immediate attention required!"
          - "Review critical faults at: https://{{ aci_host }}/index.html"
      when:
        - not (aci_fault_fail_on_critical | bool)
        - fault_count_critical | int > 0
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Fail if critical faults exist and configured to fail
      ansible.builtin.fail:
        msg: "CRITICAL: {{ fault_count_critical }} critical fault(s) detected in ACI fabric - deployment blocked by fault_fail_on_critical policy"
      when:
        - aci_fault_fail_on_critical | bool
        - fault_count_critical | int > 0
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Display fault management summary
      ansible.builtin.debug:
        msg:
          - "==================================================================="
          - " ACI Fault Management Summary - Fourth Estate"
          - "==================================================================="
          - " APIC Host:    {{ aci_host }}"
          - " Timestamp:    {{ ansible_date_time.iso8601 }}"
          - "-------------------------------------------------------------------"
          - " Fault Counts by Severity:"
          - "   Critical:  {{ fault_count_critical }}"
          - "   Major:     {{ fault_count_major }}"
          - "   Minor:     {{ fault_count_minor }}"
          - "   Warning:   {{ fault_count_warning }}"
          - "   Total:     {{ fault_count_total }}"
          - "-------------------------------------------------------------------"
          - " Overall Status: {{ 'CRITICAL FAULTS PRESENT' if fault_count_critical | int > 0 else ('MAJOR FAULTS PRESENT' if fault_count_major | int > 0 else ('MINOR/WARNING FAULTS' if (fault_count_minor | int + fault_count_warning | int) > 0 else 'CLEAN - No active faults')) }}"
          - "==================================================================="
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    - name: PHASE 5 - Generate fault management report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_fault_report.json"
        mode: "0640"
        content: "{{ fault_report | to_nice_json }}"
      vars:
        fault_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          fault_counts:
            critical: "{{ fault_count_critical }}"
            major: "{{ fault_count_major }}"
            minor: "{{ fault_count_minor }}"
            warning: "{{ fault_count_warning }}"
            total: "{{ fault_count_total }}"
          fault_status: "{{ 'CRITICAL' if fault_count_critical | int > 0 else ('MAJOR' if fault_count_major | int > 0 else ('MINOR' if fault_count_minor | int > 0 else ('WARNING' if fault_count_warning | int > 0 else 'CLEAN'))) }}"
          critical_faults: "{{ critical_faults_result.imdata | default([]) }}"
          major_faults: "{{ major_faults_result.imdata | default([]) }}"
          fault_policy:
            fail_on_critical: "{{ aci_fault_fail_on_critical | bool }}"
            warn_on_major: "{{ aci_fault_warn_on_major | bool }}"
            suppress_acknowledged: "{{ aci_suppress_acknowledged | bool }}"
            page_size: "{{ aci_fault_page_size }}"
          fourth_estate_org: "{{ fourth_estate_org }}"
          fourth_estate_environment: "{{ fourth_estate_environment }}"
          compliance_note: "Fault management audit trail - NIST 800-53 SI-4, SI-5, AU-6"
      tags:
        - aci
        - monitoring
        - faults
        - phase5

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_monitoring/fault_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_monitoring_fault_management_preflight_passed | bool
          - fe_cisco_aci_monitoring_fault_management_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_monitoring/fault_management: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_monitoring_fault_management_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_monitoring_fault_management_status | default('unknown') }}.
        success_msg: "cisco/aci_monitoring/fault_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_monitoring/fault_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_fault_management_postflight_passed: true
        fe_cisco_aci_monitoring_fault_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_monitoring/fault_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_fault_management_status: "failed"
        fe_cisco_aci_monitoring_fault_management_postflight_passed: false
        fe_cisco_aci_monitoring_fault_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_monitoring_fault_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/fault_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_monitoring/fault_management: FAILED at '{{ fe_cisco_aci_monitoring_fault_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_monitoring_fault_management_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_monitoring/fault_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_monitoring/fault_management failed at '{{ fe_cisco_aci_monitoring_fault_management_failed_task }}': {{ fe_cisco_aci_monitoring_fault_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_monitoring/fault_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_fault_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_monitoring_fault_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_monitoring_fault_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_monitoring/fault_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_monitoring/fault_management":
              component: "cisco/aci_monitoring/fault_management"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_monitoring_fault_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_monitoring_fault_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_monitoring_fault_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_monitoring_fault_management_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_monitoring_fault_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_monitoring_fault_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_monitoring_fault_management_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_monitoring_fault_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_monitoring_fault_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_monitoring_fault_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_monitoring_fault_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_monitoring_fault_management_status | default('') == 'succeeded' else ['cisco/aci_monitoring/fault_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_monitoring/fault_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_monitoring_fault_management_stats_published: true
      tags:
        - always
