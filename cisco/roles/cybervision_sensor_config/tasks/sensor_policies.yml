---
# tasks file for cybervision_sensor_config - Sensor reporting policies
# Defines what data sensors collect and forward to the Center

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_sensor_config/sensor_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_sensor_config_sensor_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_sensor_config/sensor_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_sensor_config_sensor_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_sensor_config_sensor_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_sensor_config_sensor_policies_status: "running"
    fe_cisco_cybervision_sensor_config_sensor_policies_preflight_passed: false
    fe_cisco_cybervision_sensor_config_sensor_policies_postflight_passed: false
    fe_cisco_cybervision_sensor_config_sensor_policies_failed_task: ""
    fe_cisco_cybervision_sensor_config_sensor_policies_error: ""
    fe_cisco_cybervision_sensor_config_sensor_policies_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_sensor_config/sensor_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_sensor_config/sensor_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_sensor_config/sensor_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_sensor_config/sensor_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_sensor_config/sensor_policies: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_sensor_config/sensor_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Query existing sensor policies
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/sensor-policies"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_existing_policies
      failed_when: false

    - name: PHASE 2 - Create or update sensor reporting policies
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/sensor-policies"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          report_flows: "{{ item.report_flows }}"
          report_alerts: "{{ item.report_alerts }}"
          report_assets: "{{ item.report_assets }}"
          report_vulnerabilities: "{{ item.report_vulnerabilities }}"
          protocol_decoders: "{{ item.protocol_decoders }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 409]
      loop: "{{ cv_sensor_policies }}"
      loop_control:
        label: "{{ item.name }}"
      register: cv_policy_results
      when: apply_changes | bool

    - name: PHASE 2 - Display policy plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would create sensor policies:"
          - "{% for p in cv_sensor_policies %}  - {{ p.name }}: decoders={{ p.protocol_decoders | join(',') }}{% endfor %}"
      when: not apply_changes | bool

    - name: Save sensor policies artifact
      ansible.builtin.copy:
        content: "{{ policy_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_sensor_policies.json"
        mode: '0640'
      vars:
        policy_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          policies: "{{ cv_sensor_policies }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_sensor_config/sensor_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_sensor_config_sensor_policies_preflight_passed | bool
          - fe_cisco_cybervision_sensor_config_sensor_policies_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_sensor_config/sensor_policies: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_sensor_config_sensor_policies_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_sensor_config_sensor_policies_status | default('unknown') }}.
        success_msg: "cisco/cybervision_sensor_config/sensor_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_policies_postflight_passed: true
        fe_cisco_cybervision_sensor_config_sensor_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_sensor_config/sensor_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_policies_status: "failed"
        fe_cisco_cybervision_sensor_config_sensor_policies_postflight_passed: false
        fe_cisco_cybervision_sensor_config_sensor_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_sensor_config_sensor_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_sensor_config/sensor_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_sensor_config/sensor_policies: FAILED at '{{ fe_cisco_cybervision_sensor_config_sensor_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_sensor_config_sensor_policies_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_sensor_config/sensor_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_sensor_config/sensor_policies failed at '{{ fe_cisco_cybervision_sensor_config_sensor_policies_failed_task }}': {{ fe_cisco_cybervision_sensor_config_sensor_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_sensor_config/sensor_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_sensor_config_sensor_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_sensor_config_sensor_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_sensor_config/sensor_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_sensor_config/sensor_policies":
              component: "cisco/cybervision_sensor_config/sensor_policies"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_sensor_config_sensor_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_sensor_config_sensor_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_sensor_config_sensor_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_sensor_config_sensor_policies_status | default('') == 'succeeded' else ['cisco/cybervision_sensor_config/sensor_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_sensor_config/sensor_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_policies_stats_published: true
      tags:
        - always
