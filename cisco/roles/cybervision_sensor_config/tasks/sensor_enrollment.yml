---
# tasks file for cybervision_sensor_config - Sensor enrollment
# Generates enrollment tokens and registers sensors with the Center

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_sensor_config/sensor_enrollment']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_sensor_config_sensor_enrollment_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_sensor_config/sensor_enrollment | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_sensor_config_sensor_enrollment_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_sensor_config_sensor_enrollment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_sensor_config_sensor_enrollment_status: "running"
    fe_cisco_cybervision_sensor_config_sensor_enrollment_preflight_passed: false
    fe_cisco_cybervision_sensor_config_sensor_enrollment_postflight_passed: false
    fe_cisco_cybervision_sensor_config_sensor_enrollment_failed_task: ""
    fe_cisco_cybervision_sensor_config_sensor_enrollment_error: ""
    fe_cisco_cybervision_sensor_config_sensor_enrollment_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_sensor_config/sensor_enrollment | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_sensor_config/sensor_enrollment: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_sensor_config/sensor_enrollment: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_sensor_config/sensor_enrollment: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_sensor_config/sensor_enrollment: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_enrollment_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Generate sensor enrollment token
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/sensors/enrollment-token"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          ttl_hours: "{{ cv_sensor_enrollment_ttl_hours }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201]
      register: cv_enrollment_token
      when: apply_changes | bool
      no_log: true

    - name: PHASE 2 - Save enrollment token artifact
      ansible.builtin.copy:
        content: "{{ token_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_enrollment_token.json"
        mode: '0600'    # Sensitive — restrict permissions
      no_log: true
      vars:
        token_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          ttl_hours: "{{ cv_sensor_enrollment_ttl_hours }}"
          token: "{{ cv_enrollment_token.json.token | default('not_generated') }}"
      when: apply_changes | bool and cv_enrollment_token is not skipped

    - name: PHASE 2 - Create sensor zones (groups)
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/groups"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          color: "{{ item.color }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 409]    # 409 = already exists
      loop: "{{ cv_sensor_zones }}"
      loop_control:
        label: "{{ item.name }}"
      register: cv_zone_results
      when: apply_changes | bool

    - name: PHASE 2 - Display zone creation plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would create sensor zones:"
          - "{% for z in cv_sensor_zones %}  - {{ z.name }}: {{ z.description }}{% endfor %}"
      when: not apply_changes | bool

    - name: PHASE 2 - Query current sensor status
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/sensors/{{ item }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 404]
      loop: "{{ groups['cv_sensors'] | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: cv_sensor_status
      failed_when: false

    - name: Save enrollment artifact
      ansible.builtin.copy:
        content: "{{ enrollment_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_sensor_enrollment.json"
        mode: '0640'
      vars:
        enrollment_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          zones_configured: "{{ cv_sensor_zones | map(attribute='name') | list }}"
          inventory_sensors: "{{ groups['cv_sensors'] | default([]) | length }}"
          enrolled_sensors: "{{ cv_enrolled_sensors.json | default([]) | length }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_sensor_config_sensor_enrollment_preflight_passed | bool
          - fe_cisco_cybervision_sensor_config_sensor_enrollment_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_sensor_config/sensor_enrollment: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_sensor_config_sensor_enrollment_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_sensor_config_sensor_enrollment_status | default('unknown') }}.
        success_msg: "cisco/cybervision_sensor_config/sensor_enrollment: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_enrollment_postflight_passed: true
        fe_cisco_cybervision_sensor_config_sensor_enrollment_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_enrollment_status: "failed"
        fe_cisco_cybervision_sensor_config_sensor_enrollment_postflight_passed: false
        fe_cisco_cybervision_sensor_config_sensor_enrollment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_sensor_config_sensor_enrollment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_sensor_config/sensor_enrollment: FAILED at '{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_sensor_config_sensor_enrollment_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_sensor_config/sensor_enrollment failed at '{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_failed_task }}': {{ fe_cisco_cybervision_sensor_config_sensor_enrollment_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_enrollment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_sensor_config_sensor_enrollment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_sensor_config_sensor_enrollment_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_sensor_config/sensor_enrollment":
              component: "cisco/cybervision_sensor_config/sensor_enrollment"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_sensor_config_sensor_enrollment_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_sensor_config_sensor_enrollment_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_sensor_config_sensor_enrollment_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_sensor_config_sensor_enrollment_status | default('') == 'succeeded' else ['cisco/cybervision_sensor_config/sensor_enrollment'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_sensor_config/sensor_enrollment | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_sensor_config_sensor_enrollment_stats_published: true
      tags:
        - always
