---
# tasks file for cybervision_monitoring - Center and sensor health monitoring
# Queries health metrics and exports health/fault reports

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_monitoring/health_monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_monitoring_health_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_monitoring/health_monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_monitoring_health_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_monitoring_health_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_monitoring_health_monitoring_status: "running"
    fe_cisco_cybervision_monitoring_health_monitoring_preflight_passed: false
    fe_cisco_cybervision_monitoring_health_monitoring_postflight_passed: false
    fe_cisco_cybervision_monitoring_health_monitoring_failed_task: ""
    fe_cisco_cybervision_monitoring_health_monitoring_error: ""
    fe_cisco_cybervision_monitoring_health_monitoring_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_monitoring/health_monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_monitoring/health_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_monitoring/health_monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_monitoring/health_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/health_monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_monitoring/health_monitoring: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_monitoring/health_monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_monitoring_health_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/health_monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_health_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Query Cyber Vision Center health
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/health"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_center_health
      failed_when: false

    - name: PHASE 5 - Configure health check thresholds
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/health/thresholds"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          check_interval_minutes: "{{ cv_health_check_interval_minutes }}"
          sensor_offline_threshold_minutes: "{{ cv_sensor_offline_threshold_minutes }}"
          disk_warning_percent: "{{ cv_center_disk_warning_percent }}"
          disk_critical_percent: "{{ cv_center_disk_critical_percent }}"
          cpu_warning_percent: "{{ cv_center_cpu_warning_percent }}"
          cpu_critical_percent: "{{ cv_center_cpu_critical_percent }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_health_thresholds_result
      when: apply_changes | bool

    - name: PHASE 5 - Query sensor health
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/sensors"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_sensor_health
      failed_when: false

    - name: PHASE 5 - Query active alerts
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/alerts?status=active&page=1&size=50"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_active_alerts
      failed_when: false

    - name: Save health monitoring artifact
      ansible.builtin.copy:
        content: "{{ health_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_health_report.json"
        mode: '0640'
      vars:
        health_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          center_status: "{{ cv_center_health.json.status | default('unknown') }}"
          center_disk_used_percent: "{{ cv_center_health.json.disk_used_percent | default('unknown') }}"
          center_cpu_percent: "{{ cv_center_health.json.cpu_percent | default('unknown') }}"
          total_sensors: "{{ cv_sensor_health.json | default([]) | length }}"
          online_sensors: "{{ cv_sensor_health.json | default([]) | selectattr('status', 'equalto', 'online') | list | length }}"
          offline_sensors: "{{ cv_sensor_health.json | default([]) | selectattr('status', 'equalto', 'offline') | list | length }}"
          active_alerts: "{{ cv_active_alerts.json.total | default(0) }}"

    - name: Display health monitoring summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - " Cyber Vision Health Summary - Fourth Estate"
          - "================================================================"
          - " Center status:     {{ cv_center_health.json.status | default('unknown') }}"
          - " Disk used:         {{ cv_center_health.json.disk_used_percent | default('N/A') }}%"
          - " CPU:               {{ cv_center_health.json.cpu_percent | default('N/A') }}%"
          - " Total sensors:     {{ cv_sensor_health.json | default([]) | length }}"
          - " Online sensors:    {{ cv_sensor_health.json | default([]) | selectattr('status', 'equalto', 'online') | list | length }}"
          - " Active alerts:     {{ cv_active_alerts.json.total | default(0) }}"
          - "================================================================"

    - name: Warn if sensors are offline
      ansible.builtin.debug:
        msg: "WARNING: {{ cv_sensor_health.json | default([]) | selectattr('status', 'equalto', 'offline') | list | length }} sensor(s) offline!"
      when:
        - cv_sensor_health.status is defined
        - cv_sensor_health.status == 200
        - cv_sensor_health.json | default([]) | selectattr('status', 'equalto', 'offline') | list | length > 0

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_monitoring/health_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_monitoring_health_monitoring_preflight_passed | bool
          - fe_cisco_cybervision_monitoring_health_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_monitoring/health_monitoring: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_monitoring_health_monitoring_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_monitoring_health_monitoring_status | default('unknown') }}.
        success_msg: "cisco/cybervision_monitoring/health_monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_monitoring/health_monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_health_monitoring_postflight_passed: true
        fe_cisco_cybervision_monitoring_health_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_monitoring/health_monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_health_monitoring_status: "failed"
        fe_cisco_cybervision_monitoring_health_monitoring_postflight_passed: false
        fe_cisco_cybervision_monitoring_health_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_monitoring_health_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/health_monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_monitoring/health_monitoring: FAILED at '{{ fe_cisco_cybervision_monitoring_health_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_monitoring_health_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/health_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_monitoring/health_monitoring failed at '{{ fe_cisco_cybervision_monitoring_health_monitoring_failed_task }}': {{ fe_cisco_cybervision_monitoring_health_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_monitoring/health_monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_health_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_monitoring_health_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_monitoring_health_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_monitoring/health_monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_monitoring/health_monitoring":
              component: "cisco/cybervision_monitoring/health_monitoring"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_monitoring_health_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_monitoring_health_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_monitoring_health_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_monitoring_health_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_monitoring_health_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_monitoring_health_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_monitoring_health_monitoring_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_monitoring_health_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_monitoring_health_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_monitoring_health_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_monitoring_health_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_monitoring_health_monitoring_status | default('') == 'succeeded' else ['cisco/cybervision_monitoring/health_monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_monitoring/health_monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_health_monitoring_stats_published: true
      tags:
        - always
