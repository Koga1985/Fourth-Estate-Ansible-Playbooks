---
# tasks file for cybervision_monitoring - Alert policy configuration
# Configures OT-specific alert rules for new devices, anomalies, vulnerabilities

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_monitoring/alerts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_monitoring_alerts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_monitoring/alerts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_monitoring_alerts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_monitoring_alerts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_monitoring_alerts_status: "running"
    fe_cisco_cybervision_monitoring_alerts_preflight_passed: false
    fe_cisco_cybervision_monitoring_alerts_postflight_passed: false
    fe_cisco_cybervision_monitoring_alerts_failed_task: ""
    fe_cisco_cybervision_monitoring_alerts_error: ""
    fe_cisco_cybervision_monitoring_alerts_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_monitoring/alerts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_monitoring/alerts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_monitoring/alerts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_monitoring/alerts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/alerts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_monitoring/alerts: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_monitoring/alerts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_monitoring_alerts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/alerts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_alerts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Configure email notification settings
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/notifications/email"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          enabled: "{{ cv_alert_email_enabled }}"
          smtp_server: "{{ cv_alert_smtp_server }}"
          smtp_port: "{{ cv_alert_smtp_port }}"
          use_tls: "{{ cv_alert_smtp_tls }}"
          from_address: "{{ cv_alert_from_address }}"
          to_addresses: "{{ cv_alert_to_addresses }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_email_config_result
      when: apply_changes | bool

    - name: PHASE 5 - Create alert policies
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/alert-policies"
        method: POST
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          category: "{{ item.category }}"
          severity: "{{ item.severity }}"
          enabled: "{{ item.enabled }}"
          notification: "{{ item.notification }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 201, 409]    # 409 = already exists
      loop: "{{ cv_alert_policies }}"
      loop_control:
        label: "{{ item.name }}"
      register: cv_alert_policy_results
      when: apply_changes | bool

    - name: PHASE 5 - Display alert policy plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would create alert policies:"
          - "{% for p in cv_alert_policies %}  - {{ p.name }} ({{ p.severity }}): category={{ p.category }}{% endfor %}"
      when: not apply_changes | bool

    - name: Save alert policy artifact
      ansible.builtin.copy:
        content: "{{ alert_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_alert_policies.json"
        mode: '0640'
      vars:
        alert_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          email_enabled: "{{ cv_alert_email_enabled }}"
          smtp_server: "{{ cv_alert_smtp_server }}"
          policies: "{{ cv_alert_policies | map(attribute='name') | list }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_monitoring/alerts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_monitoring_alerts_preflight_passed | bool
          - fe_cisco_cybervision_monitoring_alerts_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_monitoring/alerts: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_monitoring_alerts_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_monitoring_alerts_status | default('unknown') }}.
        success_msg: "cisco/cybervision_monitoring/alerts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_monitoring/alerts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_alerts_postflight_passed: true
        fe_cisco_cybervision_monitoring_alerts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_monitoring/alerts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_alerts_status: "failed"
        fe_cisco_cybervision_monitoring_alerts_postflight_passed: false
        fe_cisco_cybervision_monitoring_alerts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_monitoring_alerts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/alerts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_monitoring/alerts: FAILED at '{{ fe_cisco_cybervision_monitoring_alerts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_monitoring_alerts_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/alerts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_monitoring/alerts failed at '{{ fe_cisco_cybervision_monitoring_alerts_failed_task }}': {{ fe_cisco_cybervision_monitoring_alerts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_monitoring/alerts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_alerts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_monitoring_alerts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_monitoring_alerts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_monitoring/alerts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_monitoring/alerts":
              component: "cisco/cybervision_monitoring/alerts"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_monitoring_alerts_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_monitoring_alerts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_monitoring_alerts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_monitoring_alerts_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_monitoring_alerts_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_monitoring_alerts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_monitoring_alerts_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_monitoring_alerts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_monitoring_alerts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_monitoring_alerts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_monitoring_alerts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_monitoring_alerts_status | default('') == 'succeeded' else ['cisco/cybervision_monitoring/alerts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_monitoring/alerts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_alerts_stats_published: true
      tags:
        - always
