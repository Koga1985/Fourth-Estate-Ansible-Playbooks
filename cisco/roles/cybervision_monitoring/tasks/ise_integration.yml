---
# tasks file for cybervision_monitoring - Cisco ISE pxGrid integration
# Publishes OT asset context to ISE for TrustSec segmentation policy enforcement

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_monitoring/ise_integration']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_monitoring_ise_integration_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_monitoring/ise_integration | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_monitoring_ise_integration_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_monitoring_ise_integration_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_monitoring_ise_integration_status: "running"
    fe_cisco_cybervision_monitoring_ise_integration_preflight_passed: false
    fe_cisco_cybervision_monitoring_ise_integration_postflight_passed: false
    fe_cisco_cybervision_monitoring_ise_integration_failed_task: ""
    fe_cisco_cybervision_monitoring_ise_integration_error: ""
    fe_cisco_cybervision_monitoring_ise_integration_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_monitoring/ise_integration | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_monitoring/ise_integration | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_monitoring/ise_integration: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_monitoring/ise_integration: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/ise_integration | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_monitoring/ise_integration: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_monitoring/ise_integration: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_monitoring_ise_integration_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_monitoring/ise_integration | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_ise_integration_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 5 - Query existing ISE integration status
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/integrations/ise"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 404]
      register: cv_ise_status
      failed_when: false
      when: cv_ise_enabled | bool

    - name: PHASE 5 - Configure Cisco ISE pxGrid integration
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/integrations/ise"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          enabled: "{{ cv_ise_enabled }}"
          ise_host: "{{ cv_ise_host }}"
          pxgrid_node: "{{ cv_ise_pxgrid_node }}"
          client_cert: "{{ cv_ise_client_cert }}"
          client_key: "{{ cv_ise_client_key }}"
          ca_cert: "{{ cv_ise_ca_cert }}"
          publish_assets: "{{ cv_ise_publish_assets }}"
          publish_vulnerabilities: "{{ cv_ise_publish_vulnerabilities }}"
          publish_alerts: "{{ cv_ise_publish_alerts }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_ise_config_result
      when:
        - apply_changes | bool
        - cv_ise_enabled | bool
      no_log: true    # Certificates in body

    - name: PHASE 5 - Display ISE integration plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would configure ISE pxGrid integration:"
          - "  ISE host:             {{ cv_ise_host }}"
          - "  pxGrid node:          {{ cv_ise_pxgrid_node }}"
          - "  Publish assets:       {{ cv_ise_publish_assets }}"
          - "  Publish alerts:       {{ cv_ise_publish_alerts }}"
          - "  Publish vulns:        {{ cv_ise_publish_vulnerabilities }}"
      when: not apply_changes | bool and cv_ise_enabled | bool

    - name: Save ISE integration artifact
      ansible.builtin.copy:
        content: "{{ ise_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_ise_integration.json"
        mode: '0640'
      vars:
        ise_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          ise_enabled: "{{ cv_ise_enabled }}"
          ise_host: "{{ cv_ise_host }}"
          pxgrid_node: "{{ cv_ise_pxgrid_node }}"
          publish_assets: "{{ cv_ise_publish_assets }}"
          publish_vulnerabilities: "{{ cv_ise_publish_vulnerabilities }}"
          publish_alerts: "{{ cv_ise_publish_alerts }}"
      when: cv_ise_enabled | bool

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_monitoring/ise_integration | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_monitoring_ise_integration_preflight_passed | bool
          - fe_cisco_cybervision_monitoring_ise_integration_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_monitoring/ise_integration: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_monitoring_ise_integration_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_monitoring_ise_integration_status | default('unknown') }}.
        success_msg: "cisco/cybervision_monitoring/ise_integration: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_monitoring/ise_integration | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_ise_integration_postflight_passed: true
        fe_cisco_cybervision_monitoring_ise_integration_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_monitoring/ise_integration | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_ise_integration_status: "failed"
        fe_cisco_cybervision_monitoring_ise_integration_postflight_passed: false
        fe_cisco_cybervision_monitoring_ise_integration_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_monitoring_ise_integration_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/ise_integration | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_monitoring/ise_integration: FAILED at '{{ fe_cisco_cybervision_monitoring_ise_integration_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_monitoring_ise_integration_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_monitoring/ise_integration | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_monitoring/ise_integration failed at '{{ fe_cisco_cybervision_monitoring_ise_integration_failed_task }}': {{ fe_cisco_cybervision_monitoring_ise_integration_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_monitoring/ise_integration | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_ise_integration_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_monitoring_ise_integration_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_monitoring_ise_integration_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_monitoring/ise_integration | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_monitoring/ise_integration":
              component: "cisco/cybervision_monitoring/ise_integration"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_monitoring_ise_integration_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_monitoring_ise_integration_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_monitoring_ise_integration_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_monitoring_ise_integration_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_monitoring_ise_integration_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_monitoring_ise_integration_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_monitoring_ise_integration_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_monitoring_ise_integration_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_monitoring_ise_integration_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_monitoring_ise_integration_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_monitoring_ise_integration_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_monitoring_ise_integration_status | default('') == 'succeeded' else ['cisco/cybervision_monitoring/ise_integration'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_monitoring/ise_integration | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_monitoring_ise_integration_stats_published: true
      tags:
        - always
