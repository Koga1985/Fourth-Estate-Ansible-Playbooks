---
# Firewall policy controls
# CASA-FW-000010 (threat detection / deny-by-default posture)
# CASA-FW-000070 (ACL logging) | NIST AC-4, AU-2, SC-7

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_asa_stig/fw_policy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_asa_stig_fw_policy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_asa_stig/fw_policy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_asa_stig_fw_policy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_asa_stig_fw_policy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_asa_stig_fw_policy_status: "running"
    fe_cisco_cisco_asa_stig_fw_policy_preflight_passed: false
    fe_cisco_cisco_asa_stig_fw_policy_postflight_passed: false
    fe_cisco_cisco_asa_stig_fw_policy_failed_task: ""
    fe_cisco_cisco_asa_stig_fw_policy_error: ""
    fe_cisco_cisco_asa_stig_fw_policy_stats_published: false
  tags:
    - always

- name: "cisco/cisco_asa_stig/fw_policy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_asa_stig/fw_policy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_asa_stig/fw_policy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_asa_stig/fw_policy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/fw_policy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_asa_stig/fw_policy: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_asa_stig/fw_policy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_asa_stig_fw_policy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/fw_policy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_fw_policy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CASA-FW-000010 - Enable threat detection
      cisco.asa.asa_config:
        lines:
          - threat-detection basic-threat
          - threat-detection statistics access-list
          - threat-detection statistics tcp-intercept
      when: asa_enable_threat_detection | bool
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_threat
      notify: write memory
      tags: [stig_cat2, "CASA-FW-000010"]

    - name: CASA-FW-000070 - Append explicit deny-any-any with logging to managed ACLs
      cisco.asa.asa_config:
        lines:
          - "access-list {{ item }} extended deny ip any any log"
      loop: "{{ asa_logged_acls }}"
      loop_control:
        label: "{{ item }}"
      when:
        - asa_enable_acl_logging | bool
        - asa_logged_acls | length > 0
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_acl_deny
      notify: write memory
      tags: [stig_cat2, "CASA-FW-000070"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_asa_stig/fw_policy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_asa_stig_fw_policy_preflight_passed | bool
          - fe_cisco_cisco_asa_stig_fw_policy_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_asa_stig/fw_policy: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_asa_stig_fw_policy_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_asa_stig_fw_policy_status | default('unknown') }}.
        success_msg: "cisco/cisco_asa_stig/fw_policy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_asa_stig/fw_policy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_fw_policy_postflight_passed: true
        fe_cisco_cisco_asa_stig_fw_policy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_asa_stig/fw_policy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_fw_policy_status: "failed"
        fe_cisco_cisco_asa_stig_fw_policy_postflight_passed: false
        fe_cisco_cisco_asa_stig_fw_policy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_asa_stig_fw_policy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/fw_policy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_asa_stig/fw_policy: FAILED at '{{ fe_cisco_cisco_asa_stig_fw_policy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_asa_stig_fw_policy_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/fw_policy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_asa_stig/fw_policy failed at '{{ fe_cisco_cisco_asa_stig_fw_policy_failed_task }}': {{ fe_cisco_cisco_asa_stig_fw_policy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_asa_stig/fw_policy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_fw_policy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_asa_stig_fw_policy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_asa_stig_fw_policy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_asa_stig/fw_policy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_asa_stig/fw_policy":
              component: "cisco/cisco_asa_stig/fw_policy"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_asa_stig_fw_policy_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_asa_stig_fw_policy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_asa_stig_fw_policy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_asa_stig_fw_policy_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_asa_stig_fw_policy_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_asa_stig_fw_policy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_asa_stig_fw_policy_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_asa_stig_fw_policy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_asa_stig_fw_policy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_asa_stig_fw_policy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_asa_stig_fw_policy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_asa_stig_fw_policy_status | default('') == 'succeeded' else ['cisco/cisco_asa_stig/fw_policy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_asa_stig/fw_policy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_fw_policy_stats_published: true
      tags:
        - always
