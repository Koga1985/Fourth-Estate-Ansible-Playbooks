---
# Management access - SSH version/keys, timeouts, management ACL
# CASA-ND-000160 (timeout) | CASA-ND-001130 (SSHv2) | CASA-ND-001150 (kex/keys)
# CASA-ND-000140 (concurrent sessions) | NIST AC-12, SC-23, AC-17

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_asa_stig/ndm_mgmt_access']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_asa_stig_ndm_mgmt_access_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_asa_stig/ndm_mgmt_access | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_status: "running"
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_preflight_passed: false
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_postflight_passed: false
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_failed_task: ""
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_error: ""
    fe_cisco_cisco_asa_stig_ndm_mgmt_access_stats_published: false
  tags:
    - always

- name: "cisco/cisco_asa_stig/ndm_mgmt_access | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_asa_stig/ndm_mgmt_access: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_asa_stig/ndm_mgmt_access: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_asa_stig/ndm_mgmt_access: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_asa_stig/ndm_mgmt_access: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CASA-ND-001130 - Enforce SSH version 2 and key exchange group
      cisco.asa.asa_config:
        lines:
          - "ssh version {{ asa_ssh_version }}"
          - "ssh key-exchange group {{ asa_ssh_kex_group }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_ssh_version_cfg
      notify: write memory
      tags: [stig_cat2, "CASA-ND-001130", "CASA-ND-001150"]

    - name: CASA-ND-001150 - Generate RSA key with compliant modulus
      cisco.asa.asa_config:
        lines:
          - "crypto key generate rsa modulus {{ asa_ssh_key_modulus }} noconfirm"
      check_mode: "{{ not (apply_changes | bool) }}"
      when: apply_changes | bool
      register: asa_ssh_key
      notify: write memory
      tags: [stig_cat2, "CASA-ND-001150"]

    - name: CASA-ND-000160 - Configure idle timeouts
      cisco.asa.asa_config:
        lines:
          - "console timeout {{ asa_console_timeout_minutes }}"
          - "ssh timeout {{ asa_ssh_timeout_minutes }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_timeouts
      notify: write memory
      tags: [stig_cat2, "CASA-ND-000160"]

    - name: CASA-ND-001550 - Restrict SSH management to authorized subnets
      cisco.asa.asa_config:
        lines: "{{ asa_management_subnets | map('regex_replace', '^(.*)$', 'ssh \\1 ' + asa_mgmt_interface) | list }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_ssh_acl
      notify: write memory
      tags: [stig_cat2, "CASA-ND-001550"]

    - name: CASA-ND-001310 - Disable insecure HTTP server access defaults
      cisco.asa.asa_config:
        lines:
          - no http server enable
        # Re-enable only on a restricted interface/subnet if ASDM is required.
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_http
      notify: write memory
      tags: [stig_cat2, "CASA-ND-001310"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_asa_stig_ndm_mgmt_access_preflight_passed | bool
          - fe_cisco_cisco_asa_stig_ndm_mgmt_access_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_asa_stig/ndm_mgmt_access: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_status | default('unknown') }}.
        success_msg: "cisco/cisco_asa_stig/ndm_mgmt_access: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_postflight_passed: true
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_status: "failed"
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_postflight_passed: false
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_asa_stig/ndm_mgmt_access: FAILED at '{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_asa_stig/ndm_mgmt_access failed at '{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_failed_task }}': {{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_asa_stig_ndm_mgmt_access_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_asa_stig/ndm_mgmt_access":
              component: "cisco/cisco_asa_stig/ndm_mgmt_access"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_asa_stig_ndm_mgmt_access_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_asa_stig_ndm_mgmt_access_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_asa_stig_ndm_mgmt_access_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_asa_stig_ndm_mgmt_access_status | default('') == 'succeeded' else ['cisco/cisco_asa_stig/ndm_mgmt_access'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_asa_stig/ndm_mgmt_access | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_mgmt_access_stats_published: true
      tags:
        - always
