---
# AAA, DoD banner, password policy
# CASA-ND-000190 (AAA) | CASA-ND-000100 (banner) | CASA-ND-001440 (password policy)
# NIST IA-2, AC-8, IA-5

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cisco_asa_stig/ndm_auth']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cisco_asa_stig_ndm_auth_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cisco_asa_stig/ndm_auth | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cisco_asa_stig_ndm_auth_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cisco_asa_stig_ndm_auth_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cisco_asa_stig_ndm_auth_status: "running"
    fe_cisco_cisco_asa_stig_ndm_auth_preflight_passed: false
    fe_cisco_cisco_asa_stig_ndm_auth_postflight_passed: false
    fe_cisco_cisco_asa_stig_ndm_auth_failed_task: ""
    fe_cisco_cisco_asa_stig_ndm_auth_error: ""
    fe_cisco_cisco_asa_stig_ndm_auth_stats_published: false
  tags:
    - always

- name: "cisco/cisco_asa_stig/ndm_auth | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cisco_asa_stig/ndm_auth | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cisco_asa_stig/ndm_auth: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cisco_asa_stig/ndm_auth: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_auth | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cisco_asa_stig/ndm_auth: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cisco_asa_stig/ndm_auth: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cisco_asa_stig_ndm_auth_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_auth | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_auth_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: CASA-ND-000190 - Configure AAA server group
      cisco.asa.asa_config:
        lines:
          - "aaa-server {{ asa_aaa_server_group }} protocol {{ asa_aaa_protocol }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_aaa_group
      notify: write memory
      tags: [stig_cat2, "CASA-ND-000190"]

    - name: CASA-ND-000190 - Add TACACS+ hosts to AAA group
      cisco.asa.asa_config:
        parents: "aaa-server {{ asa_aaa_server_group }} ({{ asa_mgmt_interface }}) host {{ item.host }}"
        lines:
          - "key {{ item.key }}"
      loop: "{{ asa_tacacs_servers }}"
      loop_control:
        label: "{{ item.host }}"
      no_log: true
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_aaa_hosts
      notify: write memory
      tags: [stig_cat2, "CASA-ND-000190"]

    - name: CASA-ND-000190 - Apply AAA authentication for management planes with local fallback
      cisco.asa.asa_config:
        lines:
          - "aaa authentication ssh console {{ asa_aaa_server_group }} LOCAL"
          - "aaa authentication serial console {{ asa_aaa_server_group }} LOCAL"
          - "aaa authentication enable console {{ asa_aaa_server_group }} LOCAL"
          - "aaa authentication http console {{ asa_aaa_server_group }} LOCAL"
          - "aaa accounting command {{ asa_aaa_server_group }}"
          - "aaa accounting ssh console {{ asa_aaa_server_group }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_aaa_auth
      notify: write memory
      tags: [stig_cat2, "CASA-ND-000190", "CASA-ND-000550"]

    - name: CASA-ND-000100 - Configure DoD login banner
      cisco.asa.asa_config:
        lines: "{{ asa_login_banner_lines | map('regex_replace', '^(.*)$', 'banner login \\1') | list }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_banner
      notify: write memory
      tags: [stig_cat3, "CASA-ND-000100"]

    - name: CASA-ND-001440 - Enforce password policy
      cisco.asa.asa_config:
        lines:
          - "password-policy minimum-length {{ asa_password_min_length }}"
          - "password-policy lifetime {{ asa_password_lifetime_days }}"
          - "password-policy minimum-changes {{ asa_password_min_changes }}"
          - password-policy minimum-uppercase 1
          - password-policy minimum-lowercase 1
          - password-policy minimum-numeric 1
          - password-policy minimum-special 1
          - password-policy authenticate enable
      check_mode: "{{ not (apply_changes | bool) }}"
      register: asa_pwd_policy
      notify: write memory
      tags: [stig_cat2, "CASA-ND-001440"]

    # ----------------------------- postflight -------------------

    - name: "cisco/cisco_asa_stig/ndm_auth | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cisco_asa_stig_ndm_auth_preflight_passed | bool
          - fe_cisco_cisco_asa_stig_ndm_auth_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cisco_asa_stig/ndm_auth: postflight validation failed - preflight passed
          ={{ fe_cisco_cisco_asa_stig_ndm_auth_preflight_passed | default(false) }},
          status={{ fe_cisco_cisco_asa_stig_ndm_auth_status | default('unknown') }}.
        success_msg: "cisco/cisco_asa_stig/ndm_auth: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cisco_asa_stig/ndm_auth | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_auth_postflight_passed: true
        fe_cisco_cisco_asa_stig_ndm_auth_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cisco_asa_stig/ndm_auth | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_auth_status: "failed"
        fe_cisco_cisco_asa_stig_ndm_auth_postflight_passed: false
        fe_cisco_cisco_asa_stig_ndm_auth_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cisco_asa_stig_ndm_auth_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/ndm_auth | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cisco_asa_stig/ndm_auth: FAILED at '{{ fe_cisco_cisco_asa_stig_ndm_auth_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cisco_asa_stig_ndm_auth_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cisco_asa_stig/ndm_auth | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cisco_asa_stig/ndm_auth failed at '{{ fe_cisco_cisco_asa_stig_ndm_auth_failed_task }}': {{ fe_cisco_cisco_asa_stig_ndm_auth_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cisco_asa_stig/ndm_auth | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_auth_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cisco_asa_stig_ndm_auth_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cisco_asa_stig_ndm_auth_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cisco_asa_stig/ndm_auth | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cisco_asa_stig/ndm_auth":
              component: "cisco/cisco_asa_stig/ndm_auth"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cisco_asa_stig_ndm_auth_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cisco_asa_stig_ndm_auth_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cisco_asa_stig_ndm_auth_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cisco_asa_stig_ndm_auth_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cisco_asa_stig_ndm_auth_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cisco_asa_stig_ndm_auth_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cisco_asa_stig_ndm_auth_failed_task | default('') }}"
              error: "{{ fe_cisco_cisco_asa_stig_ndm_auth_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cisco_asa_stig_ndm_auth_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cisco_asa_stig_ndm_auth_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cisco_asa_stig_ndm_auth_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cisco_asa_stig_ndm_auth_status | default('') == 'succeeded' else ['cisco/cisco_asa_stig/ndm_auth'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cisco_asa_stig/ndm_auth | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cisco_asa_stig_ndm_auth_stats_published: true
      tags:
        - always
