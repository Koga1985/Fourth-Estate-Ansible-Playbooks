---
# tasks file for sdwan_monitoring
# Cisco SD-WAN Monitoring and Telemetry Configuration

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/sdwan_monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_sdwan_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/sdwan_monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_sdwan_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_sdwan_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_sdwan_monitoring_status: "running"
    fe_cisco_sdwan_monitoring_preflight_passed: false
    fe_cisco_sdwan_monitoring_postflight_passed: false
    fe_cisco_sdwan_monitoring_failed_task: ""
    fe_cisco_sdwan_monitoring_error: ""
    fe_cisco_sdwan_monitoring_stats_published: false
  tags:
    - always

- name: "cisco/sdwan_monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/sdwan_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/sdwan_monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/sdwan_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/sdwan_monitoring: required variable '{{ item }}' is not defined."
        success_msg: "cisco/sdwan_monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_sdwan_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/sdwan_monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include prerequisites validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
      tags:
        - always
        - prerequisites

    # ============================================================
    # Phase 20 - SNMP Monitoring (SNMPv3 only)
    # NIST SC-8 | CISC-ND-000090
    # ============================================================
    - name: PHASE 20 - Configure SNMPv3 monitoring
      ansible.builtin.include_tasks:
        file: snmp.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - snmp
            - phase20
      when: enable_snmp_monitoring | bool
      tags:
        - sdwan
        - monitoring
        - snmp
        - phase20

    # ============================================================
    # Phase 20 - Syslog and Audit Logging
    # NIST AU-2, AU-12 | CISC-ND-000700
    # ============================================================
    - name: PHASE 20 - Configure syslog monitoring
      ansible.builtin.include_tasks:
        file: syslog.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - syslog
            - logging
            - phase20
      when: enable_syslog_monitoring | bool
      tags:
        - sdwan
        - monitoring
        - syslog
        - logging
        - phase20

    # ============================================================
    # Phase 20 - Streaming Telemetry
    # Model-driven telemetry for real-time metrics
    # ============================================================
    - name: PHASE 20 - Configure streaming telemetry
      ansible.builtin.include_tasks:
        file: streaming.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - telemetry
            - streaming
            - phase20
      when: enable_streaming_telemetry | bool
      tags:
        - sdwan
        - monitoring
        - telemetry
        - streaming
        - phase20

    # ============================================================
    # Phase 20 - Alert Rules
    # Configure vManage alerts for operational and security events
    # ============================================================
    - name: PHASE 20 - Configure alert rules
      ansible.builtin.include_tasks:
        file: alerts.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - alerts
            - phase20
      when: enable_alert_rules | bool
      tags:
        - sdwan
        - monitoring
        - alerts
        - phase20

    # ============================================================
    # Phase 20 - Health Monitoring
    # ============================================================
    - name: PHASE 20 - Configure health monitoring
      ansible.builtin.include_tasks:
        file: health_check.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - health
            - phase20
      when: enable_health_monitoring | bool
      tags:
        - sdwan
        - monitoring
        - health
        - phase20

    # ============================================================
    # Phase 20 - Validation
    # ============================================================
    - name: PHASE 20 - Validate monitoring configuration
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - sdwan
            - monitoring
            - validation
            - phase20
      tags:
        - sdwan
        - monitoring
        - validation
        - phase20

    # ----------------------------- postflight -------------------

    - name: "cisco/sdwan_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_sdwan_monitoring_preflight_passed | bool
          - fe_cisco_sdwan_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/sdwan_monitoring: postflight validation failed - preflight passed
          ={{ fe_cisco_sdwan_monitoring_preflight_passed | default(false) }},
          status={{ fe_cisco_sdwan_monitoring_status | default('unknown') }}.
        success_msg: "cisco/sdwan_monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/sdwan_monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_monitoring_postflight_passed: true
        fe_cisco_sdwan_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/sdwan_monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_monitoring_status: "failed"
        fe_cisco_sdwan_monitoring_postflight_passed: false
        fe_cisco_sdwan_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_sdwan_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/sdwan_monitoring: FAILED at '{{ fe_cisco_sdwan_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_sdwan_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "cisco/sdwan_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/sdwan_monitoring failed at '{{ fe_cisco_sdwan_monitoring_failed_task }}': {{ fe_cisco_sdwan_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/sdwan_monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_sdwan_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_sdwan_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/sdwan_monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/sdwan_monitoring":
              component: "cisco/sdwan_monitoring"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_sdwan_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_sdwan_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_sdwan_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_sdwan_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_cisco_sdwan_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_sdwan_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_sdwan_monitoring_failed_task | default('') }}"
              error: "{{ fe_cisco_sdwan_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_sdwan_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_sdwan_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_sdwan_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_sdwan_monitoring_status | default('') == 'succeeded' else ['cisco/sdwan_monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/sdwan_monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_sdwan_monitoring_stats_published: true
      tags:
        - always
