---
# tasks file for cybervision_security_hardening - Compliance report generation
# NIST CA-7, CA-8

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_security_hardening/compliance_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_security_hardening_compliance_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_security_hardening/compliance_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_security_hardening_compliance_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_security_hardening_compliance_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_security_hardening_compliance_report_status: "running"
    fe_cisco_cybervision_security_hardening_compliance_report_preflight_passed: false
    fe_cisco_cybervision_security_hardening_compliance_report_postflight_passed: false
    fe_cisco_cybervision_security_hardening_compliance_report_failed_task: ""
    fe_cisco_cybervision_security_hardening_compliance_report_error: ""
    fe_cisco_cybervision_security_hardening_compliance_report_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_security_hardening/compliance_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_security_hardening/compliance_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_security_hardening/compliance_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_security_hardening/compliance_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/compliance_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_security_hardening/compliance_report: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_security_hardening/compliance_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_security_hardening_compliance_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/compliance_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_compliance_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Query current TLS settings for report
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/security/tls"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_report_tls
      failed_when: false

    - name: Query current session policy for report
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/security/session-policy"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_report_session
      failed_when: false

    - name: Query current audit settings for report
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/audit"
        method: GET
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Accept: "application/json"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: 200
      register: cv_report_audit
      failed_when: false

    - name: Generate STIG compliance report (JSON)
      ansible.builtin.copy:
        content: "{{ compliance_report | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_stig_compliance_report.json"
        mode: '0640'
      vars:
        compliance_report:
          metadata:
            report_type: "Cisco Cyber Vision DoD STIG Compliance Report"
            timestamp: "{{ ansible_date_time.iso8601 }}"
            center_host: "{{ cv_center_host }}"
            mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
            frameworks:
              - "dod_stig"
              - "nist_800_53"
          stig_controls:
            cat1_high:
              - id: "CISC-ND-001440"
                description: "HTTPS enforced, HTTP disabled"
                configured_https_only: "{{ cv_https_only }}"
                configured_min_tls: "{{ cv_min_tls_version }}"
                enabled: "{{ enable_crypto_tls | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000530"
                description: "Password strength policy"
                min_length: "{{ cv_password_min_length }}"
                history_count: "{{ cv_password_history_count }}"
                enabled: "{{ enable_auth_hardening | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000570"
                description: "Minimum password length >= 15"
                current_min: "{{ cv_password_min_length }}"
                compliant: "{{ cv_password_min_length | int >= 15 }}"
              - id: "CISC-ND-001190"
                description: "Centralized authentication"
                auth_type: "{{ cv_auth_type }}"
                enabled: "{{ enable_auth_hardening | bool }}"
                applied: "{{ apply_changes | bool }}"
            cat2_medium:
              - id: "CISC-ND-000370"
                description: "Account lockout after 3 failures"
                max_attempts: "{{ cv_lockout_max_attempts }}"
                duration_seconds: "{{ cv_lockout_duration_seconds }}"
                enabled: "{{ enable_auth_hardening | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000390"
                description: "Session idle timeout <= 600s"
                idle_timeout: "{{ cv_idle_timeout }}"
                session_timeout: "{{ cv_session_timeout }}"
                compliant: "{{ cv_idle_timeout | int <= 600 }}"
                enabled: "{{ enable_session_management | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000360"
                description: "Concurrent session limits"
                max_concurrent: "{{ cv_max_concurrent_sessions }}"
                enabled: "{{ enable_access_control | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-000700"
                description: "Audit logging enabled"
                log_auth: "{{ cv_audit_log_auth_events }}"
                log_config: "{{ cv_audit_log_config_changes }}"
                log_admin: "{{ cv_audit_log_admin_actions }}"
                enabled: "{{ enable_audit_logging | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001420"
                description: "NTP configured"
                ntp_servers: "{{ cv_ntp_servers | map(attribute='server') | list }}"
                enabled: "{{ enable_ntp_dns | bool }}"
                applied: "{{ apply_changes | bool }}"
            cat3_low:
              - id: "CISC-ND-000080"
                description: "DoD mandatory login banner"
                enabled: "{{ enable_banners | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001290"
                description: "NTP configuration"
                enabled: "{{ enable_ntp_dns | bool }}"
                applied: "{{ apply_changes | bool }}"
              - id: "CISC-ND-001470"
                description: "System contact and location"
                contact: "{{ cv_system_contact }}"
                location: "{{ cv_system_location }}"
                enabled: "{{ enable_banners | bool }}"
                applied: "{{ apply_changes | bool }}"

    - name: Generate STIG compliance summary (text)
      ansible.builtin.copy:
        content: |
          ================================================================
           Cisco Cyber Vision DoD STIG Compliance Summary — Fourth Estate
          ================================================================
           Report Date:  {{ ansible_date_time.date }}
           Center Host:  {{ cv_center_host }}
           Mode:         {{ 'CHANGES APPLIED' if apply_changes | bool else 'DRY RUN - no changes made' }}
          ----------------------------------------------------------------
           STIG Categories:
             CAT I  (High):   {{ 'ENABLED' if stig_cat1_enabled | bool else 'DISABLED' }}
             CAT II (Medium): {{ 'ENABLED' if stig_cat2_enabled | bool else 'DISABLED' }}
             CAT III (Low):   {{ 'ENABLED' if stig_cat3_enabled | bool else 'DISABLED' }}
          ----------------------------------------------------------------
           CAT I Controls (High Severity):
             CISC-ND-001440  HTTPS enforced / HTTP disabled:     {{ 'YES' if enable_crypto_tls | bool else 'SKIPPED' }}
             CISC-ND-000530  Password strength policy:           {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
             CISC-ND-000570  Min password length (15 chars):     {{ 'COMPLIANT' if cv_password_min_length | int >= 15 else 'NON-COMPLIANT' }} ({{ cv_password_min_length }} chars)
             CISC-ND-001190  Centralized auth ({{ cv_auth_type }}):     {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
          ----------------------------------------------------------------
           CAT II Controls (Medium Severity):
             CISC-ND-000370  Account lockout ({{ cv_lockout_max_attempts }} attempts):     {{ 'YES' if enable_auth_hardening | bool else 'SKIPPED' }}
             CISC-ND-000390  Session idle timeout ({{ cv_idle_timeout }}s):   {{ 'COMPLIANT' if cv_idle_timeout | int <= 600 else 'NON-COMPLIANT' }}
             CISC-ND-000360  Concurrent session limit ({{ cv_max_concurrent_sessions }}):  {{ 'YES' if enable_access_control | bool else 'SKIPPED' }}
             CISC-ND-000700  Audit logging:                      {{ 'YES' if enable_audit_logging | bool else 'SKIPPED' }}
             CISC-ND-001420  NTP configured:                     {{ 'YES' if enable_ntp_dns | bool else 'SKIPPED' }}
          ----------------------------------------------------------------
           CAT III Controls (Low Severity):
             CISC-ND-000080  DoD login banner:                   {{ 'YES' if enable_banners | bool else 'SKIPPED' }}
             CISC-ND-001290  NTP configuration:                  {{ 'YES' if enable_ntp_dns | bool else 'SKIPPED' }}
             CISC-ND-001470  System contact/location:            {{ 'YES' if enable_banners | bool else 'SKIPPED' }}
          ================================================================
           Full report: {{ artifacts_dir }}/cv_stig_compliance_report.json
          ================================================================
        dest: "{{ artifacts_dir }}/cv_stig_compliance_summary.txt"
        mode: '0640'

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          - "STIG compliance report generated:"
          - "  JSON: {{ artifacts_dir }}/cv_stig_compliance_report.json"
          - "  Text: {{ artifacts_dir }}/cv_stig_compliance_summary.txt"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_security_hardening/compliance_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_security_hardening_compliance_report_preflight_passed | bool
          - fe_cisco_cybervision_security_hardening_compliance_report_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_security_hardening/compliance_report: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_security_hardening_compliance_report_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_security_hardening_compliance_report_status | default('unknown') }}.
        success_msg: "cisco/cybervision_security_hardening/compliance_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_security_hardening/compliance_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_compliance_report_postflight_passed: true
        fe_cisco_cybervision_security_hardening_compliance_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_security_hardening/compliance_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_compliance_report_status: "failed"
        fe_cisco_cybervision_security_hardening_compliance_report_postflight_passed: false
        fe_cisco_cybervision_security_hardening_compliance_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_security_hardening_compliance_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/compliance_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_security_hardening/compliance_report: FAILED at '{{ fe_cisco_cybervision_security_hardening_compliance_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_security_hardening_compliance_report_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/compliance_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_security_hardening/compliance_report failed at '{{ fe_cisco_cybervision_security_hardening_compliance_report_failed_task }}': {{ fe_cisco_cybervision_security_hardening_compliance_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_security_hardening/compliance_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_compliance_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_security_hardening_compliance_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_security_hardening_compliance_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/compliance_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_security_hardening/compliance_report":
              component: "cisco/cybervision_security_hardening/compliance_report"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_security_hardening_compliance_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_security_hardening_compliance_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_security_hardening_compliance_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_security_hardening_compliance_report_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_security_hardening_compliance_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_security_hardening_compliance_report_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_security_hardening_compliance_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_security_hardening_compliance_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_security_hardening_compliance_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_security_hardening_compliance_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_security_hardening_compliance_report_status | default('') == 'succeeded' else ['cisco/cybervision_security_hardening/compliance_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/compliance_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_compliance_report_stats_published: true
      tags:
        - always
