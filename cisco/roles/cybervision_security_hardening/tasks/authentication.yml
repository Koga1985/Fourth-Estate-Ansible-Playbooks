---
# tasks file for cybervision_security_hardening - Authentication hardening
# DoD STIG CAT I - Centralized authentication, password policy, account lockout
# NIST IA-2, IA-5, AC-7 | STIG CISC-ND-001190, CISC-ND-000530, CISC-ND-000570, CISC-ND-000370

# ============================================================
# Password Policy (STIG CISC-ND-000530, CISC-ND-000570)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_security_hardening/authentication']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_security_hardening_authentication_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_security_hardening/authentication | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_security_hardening_authentication_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_security_hardening_authentication_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_security_hardening_authentication_status: "running"
    fe_cisco_cybervision_security_hardening_authentication_preflight_passed: false
    fe_cisco_cybervision_security_hardening_authentication_postflight_passed: false
    fe_cisco_cybervision_security_hardening_authentication_failed_task: ""
    fe_cisco_cybervision_security_hardening_authentication_error: ""
    fe_cisco_cybervision_security_hardening_authentication_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_security_hardening/authentication | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_security_hardening/authentication | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_security_hardening/authentication: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_security_hardening/authentication: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/authentication | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_security_hardening/authentication: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_security_hardening/authentication: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_security_hardening_authentication_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/authentication | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_authentication_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 4 - CISC-ND-000530/570 - Configure password policy
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/security/password-policy"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          min_length: "{{ cv_password_min_length }}"
          require_uppercase: "{{ cv_password_min_uppercase | int > 0 }}"
          require_lowercase: "{{ cv_password_min_lowercase | int > 0 }}"
          require_digits: "{{ cv_password_min_digits | int > 0 }}"
          require_special: "{{ cv_password_min_special | int > 0 }}"
          history_count: "{{ cv_password_history_count }}"
          expiry_days: "{{ cv_password_expiry_days }}"
          strength_check: "{{ cv_password_strength_check }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_pwd_policy_result
      when: apply_changes | bool

    - name: PHASE 4 - Verify password min length compliance
      ansible.builtin.assert:
        that:
          - cv_password_min_length | int >= 15
        fail_msg: "STIG CISC-ND-000570 violation: cv_password_min_length must be >= 15 (currently {{ cv_password_min_length }})"
        success_msg: "STIG CISC-ND-000570 compliant: min password length = {{ cv_password_min_length }}"

    # ============================================================
    # Account Lockout (STIG CISC-ND-000370)
    # ============================================================
    - name: PHASE 4 - CISC-ND-000370 - Configure account lockout policy
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/security/lockout-policy"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          enabled: "{{ cv_lockout_enabled }}"
          max_attempts: "{{ cv_lockout_max_attempts }}"
          window_seconds: "{{ cv_lockout_window_seconds }}"
          duration_seconds: "{{ cv_lockout_duration_seconds }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_lockout_result
      when: apply_changes | bool

    # ============================================================
    # LDAP Authentication (STIG CISC-ND-001190)
    # ============================================================
    - name: PHASE 4 - CISC-ND-001190 - Configure LDAP authentication servers
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/auth/ldap"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          enabled: "{{ cv_ldap_enabled }}"
          servers: "{{ cv_ldap_servers | map('combine', {'bind_password': '***REDACTED***'}) | list }}"
          group_mappings: "{{ cv_ldap_group_mappings }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_ldap_result
      when:
        - apply_changes | bool
        - cv_ldap_enabled | bool
      no_log: true    # LDAP bind passwords in body

    - name: PHASE 4 - Display authentication plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would configure:"
          - "  Auth type:       {{ cv_auth_type }}"
          - "  LDAP servers:    {{ cv_ldap_servers | map(attribute='host') | list }}"
          - "  Password length: {{ cv_password_min_length }} (STIG requires >= 15)"
          - "  Lockout after:   {{ cv_lockout_max_attempts }} attempts"
          - "  Lockout duration: {{ cv_lockout_duration_seconds }}s"
      when: not apply_changes | bool

    - name: Save authentication artifact
      ansible.builtin.copy:
        content: "{{ auth_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_authentication.json"
        mode: '0640'
      vars:
        auth_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          stig_controls:
            - id: "CISC-ND-001190"
              description: "Centralized authentication"
              auth_type: "{{ cv_auth_type }}"
              applied: "{{ apply_changes | bool }}"
            - id: "CISC-ND-000530"
              description: "Password strength policy"
              min_length: "{{ cv_password_min_length }}"
              applied: "{{ apply_changes | bool }}"
            - id: "CISC-ND-000570"
              description: "Min password length >= 15"
              compliant: "{{ cv_password_min_length | int >= 15 }}"
            - id: "CISC-ND-000370"
              description: "Account lockout"
              max_attempts: "{{ cv_lockout_max_attempts }}"
              duration_seconds: "{{ cv_lockout_duration_seconds }}"
              applied: "{{ apply_changes | bool }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_security_hardening/authentication | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_security_hardening_authentication_preflight_passed | bool
          - fe_cisco_cybervision_security_hardening_authentication_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_security_hardening/authentication: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_security_hardening_authentication_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_security_hardening_authentication_status | default('unknown') }}.
        success_msg: "cisco/cybervision_security_hardening/authentication: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_security_hardening/authentication | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_authentication_postflight_passed: true
        fe_cisco_cybervision_security_hardening_authentication_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_security_hardening/authentication | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_authentication_status: "failed"
        fe_cisco_cybervision_security_hardening_authentication_postflight_passed: false
        fe_cisco_cybervision_security_hardening_authentication_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_security_hardening_authentication_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/authentication | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_security_hardening/authentication: FAILED at '{{ fe_cisco_cybervision_security_hardening_authentication_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_security_hardening_authentication_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/authentication | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_security_hardening/authentication failed at '{{ fe_cisco_cybervision_security_hardening_authentication_failed_task }}': {{ fe_cisco_cybervision_security_hardening_authentication_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_security_hardening/authentication | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_authentication_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_security_hardening_authentication_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_security_hardening_authentication_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/authentication | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_security_hardening/authentication":
              component: "cisco/cybervision_security_hardening/authentication"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_security_hardening_authentication_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_security_hardening_authentication_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_security_hardening_authentication_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_security_hardening_authentication_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_security_hardening_authentication_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_security_hardening_authentication_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_security_hardening_authentication_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_security_hardening_authentication_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_security_hardening_authentication_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_security_hardening_authentication_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_security_hardening_authentication_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_security_hardening_authentication_status | default('') == 'succeeded' else ['cisco/cybervision_security_hardening/authentication'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/authentication | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_authentication_stats_published: true
      tags:
        - always
