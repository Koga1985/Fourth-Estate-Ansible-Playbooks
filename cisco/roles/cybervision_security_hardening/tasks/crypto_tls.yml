---
# tasks file for cybervision_security_hardening - TLS and cryptographic controls
# NIST SC-8 | STIG CISC-ND-001440

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/cybervision_security_hardening/crypto_tls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_cybervision_security_hardening_crypto_tls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/cybervision_security_hardening/crypto_tls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_cybervision_security_hardening_crypto_tls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_cybervision_security_hardening_crypto_tls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_cybervision_security_hardening_crypto_tls_status: "running"
    fe_cisco_cybervision_security_hardening_crypto_tls_preflight_passed: false
    fe_cisco_cybervision_security_hardening_crypto_tls_postflight_passed: false
    fe_cisco_cybervision_security_hardening_crypto_tls_failed_task: ""
    fe_cisco_cybervision_security_hardening_crypto_tls_error: ""
    fe_cisco_cybervision_security_hardening_crypto_tls_stats_published: false
  tags:
    - always

- name: "cisco/cybervision_security_hardening/crypto_tls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/cybervision_security_hardening/crypto_tls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/cybervision_security_hardening/crypto_tls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/cybervision_security_hardening/crypto_tls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/crypto_tls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/cybervision_security_hardening/crypto_tls: required variable '{{ item }}' is not defined."
        success_msg: "cisco/cybervision_security_hardening/crypto_tls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/cybervision_security_hardening/crypto_tls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_crypto_tls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 4 - CISC-ND-001440 - Configure TLS settings
      ansible.builtin.uri:
        url: "{{ cv_api_url }}/system/security/tls"
        method: PUT
        headers:
          Authorization: "Bearer {{ cv_api_token }}"
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          https_only: "{{ cv_https_only }}"
          min_tls_version: "{{ cv_min_tls_version }}"
          allowed_ciphers: "{{ cv_allowed_ciphers }}"
        validate_certs: "{{ cv_validate_certs }}"
        timeout: "{{ cv_timeout }}"
        status_code: [200, 204]
      register: cv_tls_result
      when: apply_changes | bool

    - name: PHASE 4 - Display TLS plan (dry-run)
      ansible.builtin.debug:
        msg:
          - "DRY RUN — would configure TLS:"
          - "  HTTPS only:   {{ cv_https_only }} (STIG requires HTTP disabled)"
          - "  Min TLS:      {{ cv_min_tls_version }} (STIG requires >= TLSv1.2)"
          - "  Ciphers:      {{ cv_allowed_ciphers | length }} allowed"
      when: not apply_changes | bool

    - name: Save TLS artifact
      ansible.builtin.copy:
        content: "{{ tls_artifact | to_nice_json }}"
        dest: "{{ artifacts_dir }}/cv_crypto_tls.json"
        mode: '0640'
      vars:
        tls_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          center_host: "{{ cv_center_host }}"
          mode: "{{ 'applied' if apply_changes | bool else 'dry_run' }}"
          stig_control: "CISC-ND-001440"
          https_only: "{{ cv_https_only }}"
          min_tls_version: "{{ cv_min_tls_version }}"
          allowed_ciphers: "{{ cv_allowed_ciphers }}"

    # ----------------------------- postflight -------------------

    - name: "cisco/cybervision_security_hardening/crypto_tls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_cybervision_security_hardening_crypto_tls_preflight_passed | bool
          - fe_cisco_cybervision_security_hardening_crypto_tls_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/cybervision_security_hardening/crypto_tls: postflight validation failed - preflight passed
          ={{ fe_cisco_cybervision_security_hardening_crypto_tls_preflight_passed | default(false) }},
          status={{ fe_cisco_cybervision_security_hardening_crypto_tls_status | default('unknown') }}.
        success_msg: "cisco/cybervision_security_hardening/crypto_tls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/cybervision_security_hardening/crypto_tls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_crypto_tls_postflight_passed: true
        fe_cisco_cybervision_security_hardening_crypto_tls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/cybervision_security_hardening/crypto_tls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_crypto_tls_status: "failed"
        fe_cisco_cybervision_security_hardening_crypto_tls_postflight_passed: false
        fe_cisco_cybervision_security_hardening_crypto_tls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_cybervision_security_hardening_crypto_tls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/crypto_tls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/cybervision_security_hardening/crypto_tls: FAILED at '{{ fe_cisco_cybervision_security_hardening_crypto_tls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_cybervision_security_hardening_crypto_tls_error }}
      tags:
        - always
        - rescue

    - name: "cisco/cybervision_security_hardening/crypto_tls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/cybervision_security_hardening/crypto_tls failed at '{{ fe_cisco_cybervision_security_hardening_crypto_tls_failed_task }}': {{ fe_cisco_cybervision_security_hardening_crypto_tls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/cybervision_security_hardening/crypto_tls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_crypto_tls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_cybervision_security_hardening_crypto_tls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_cybervision_security_hardening_crypto_tls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/crypto_tls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/cybervision_security_hardening/crypto_tls":
              component: "cisco/cybervision_security_hardening/crypto_tls"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_started_at | default('') }}"
              ended_at: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_failed_task | default('') }}"
              error: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_cybervision_security_hardening_crypto_tls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_cybervision_security_hardening_crypto_tls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_cybervision_security_hardening_crypto_tls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_cybervision_security_hardening_crypto_tls_status | default('') == 'succeeded' else ['cisco/cybervision_security_hardening/crypto_tls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/cybervision_security_hardening/crypto_tls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_cybervision_security_hardening_crypto_tls_stats_published: true
      tags:
        - always
