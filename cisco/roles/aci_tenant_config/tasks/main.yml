---
# tasks file for aci_tenant_config
# Cisco ACI Tenant Configuration - tenant, VRF, BD, EPG, contract, filter automation

# ============================================================
# Prerequisites and Validation (always runs)
# ============================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_status: "running"
    fe_cisco_aci_tenant_config_preflight_passed: false
    fe_cisco_aci_tenant_config_postflight_passed: false
    fe_cisco_aci_tenant_config_failed_task: ""
    fe_cisco_aci_tenant_config_error: ""
    fe_cisco_aci_tenant_config_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Run prerequisites and validation
      ansible.builtin.include_tasks:
        file: prerequisites.yml
        apply:
          tags:
            - always
            - prerequisites
            - validation
      tags:
        - always
        - prerequisites
        - validation

    # ============================================================
    # Tenant Creation
    # ============================================================
    - name: PHASE 2 - Create tenants
      ansible.builtin.include_tasks:
        file: tenants.yml
        apply:
          tags:
            - aci
            - tenants
            - phase2
      when: enable_tenants | bool
      tags:
        - aci
        - tenants
        - phase2

    # ============================================================
    # VRF Configuration
    # ============================================================
    - name: PHASE 2 - Configure VRFs
      ansible.builtin.include_tasks:
        file: vrfs.yml
        apply:
          tags:
            - aci
            - tenants
            - vrfs
            - phase2
      when: enable_vrfs | bool
      tags:
        - aci
        - tenants
        - vrfs
        - phase2

    # ============================================================
    # Bridge Domain Configuration
    # ============================================================
    - name: PHASE 2 - Configure bridge domains
      ansible.builtin.include_tasks:
        file: bridge_domains.yml
        apply:
          tags:
            - aci
            - tenants
            - bridge_domains
            - phase2
      when: enable_bridge_domains | bool
      tags:
        - aci
        - tenants
        - bridge_domains
        - phase2

    # ============================================================
    # Application Profile Configuration
    # ============================================================
    - name: PHASE 2 - Configure application profiles
      ansible.builtin.include_tasks:
        file: application_profiles.yml
        apply:
          tags:
            - aci
            - tenants
            - app_profiles
            - phase2
      when: enable_app_profiles | bool
      tags:
        - aci
        - tenants
        - app_profiles
        - phase2

    # ============================================================
    # EPG Configuration
    # ============================================================
    - name: PHASE 2 - Configure endpoint groups (EPGs)
      ansible.builtin.include_tasks:
        file: epgs.yml
        apply:
          tags:
            - aci
            - tenants
            - epgs
            - phase2
      when: enable_epgs | bool
      tags:
        - aci
        - tenants
        - epgs
        - phase2

    # ============================================================
    # Filter Configuration
    # ============================================================
    - name: PHASE 2 - Configure filters
      ansible.builtin.include_tasks:
        file: filters.yml
        apply:
          tags:
            - aci
            - tenants
            - filters
            - phase2
      when: enable_filters | bool
      tags:
        - aci
        - tenants
        - filters
        - phase2

    # ============================================================
    # Contract Configuration
    # ============================================================
    - name: PHASE 2 - Configure contracts
      ansible.builtin.include_tasks:
        file: contracts.yml
        apply:
          tags:
            - aci
            - tenants
            - contracts
            - phase2
      when: enable_contracts | bool
      tags:
        - aci
        - tenants
        - contracts
        - phase2

    # ============================================================
    # Static Path Bindings
    # ============================================================
    - name: PHASE 2 - Configure static path bindings
      ansible.builtin.include_tasks:
        file: static_paths.yml
        apply:
          tags:
            - aci
            - tenants
            - static_paths
            - phase2
      when: enable_static_paths | bool
      tags:
        - aci
        - tenants
        - static_paths
        - phase2

    # ============================================================
    # Validation and Verification
    # ============================================================
    - name: PHASE 2 - Validate tenant configuration
      ansible.builtin.include_tasks:
        file: validation.yml
        apply:
          tags:
            - validation
            - verification
            - phase2
      tags:
        - validation
        - verification
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_preflight_passed | bool
          - fe_cisco_aci_tenant_config_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_postflight_passed: true
        fe_cisco_aci_tenant_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_status: "failed"
        fe_cisco_aci_tenant_config_postflight_passed: false
        fe_cisco_aci_tenant_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config: FAILED at '{{ fe_cisco_aci_tenant_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config failed at '{{ fe_cisco_aci_tenant_config_failed_task }}': {{ fe_cisco_aci_tenant_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config":
              component: "cisco/aci_tenant_config"
              type: "role"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_status | default('') == 'succeeded' else ['cisco/aci_tenant_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_stats_published: true
      tags:
        - always
