---
# tasks file for aci_tenant_config - Validation and Verification
# Queries tenant configuration, checks for faults, generates validation report

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_validation_status: "running"
    fe_cisco_aci_tenant_config_validation_preflight_passed: false
    fe_cisco_aci_tenant_config_validation_postflight_passed: false
    fe_cisco_aci_tenant_config_validation_failed_task: ""
    fe_cisco_aci_tenant_config_validation_error: ""
    fe_cisco_aci_tenant_config_validation_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/validation: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Query all tenants for validation
      cisco.aci.aci_tenant:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_tenant_validation
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Query all VRFs for validation
      cisco.aci.aci_vrf:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_vrf_validation
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Query all bridge domains for validation
      cisco.aci.aci_bd:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_bd_validation
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Query all EPGs for validation
      cisco.aci.aci_epg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_epg_validation
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Query tenant-related faults
      cisco.aci.aci_rest:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        path: "/api/class/faultInst.json?query-target-filter=and(or(eq(faultInst.severity,\"critical\"),eq(faultInst.severity,\"major\")),wcard(faultInst.dn,\"tn-\"))&order-by=faultInst.severity|desc&page-size=50"
        method: get
      no_log: true
      register: aci_tenant_faults
      failed_when: false
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Verify configured tenants exist
      ansible.builtin.assert:
        that:
          - aci_tenant_validation.current is defined
        fail_msg: "Tenant validation query failed - check APIC connectivity"
        success_msg: "Tenant validation query succeeded"
        quiet: true
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Display tenant configuration validation summary
      ansible.builtin.debug:
        msg:
          - "=== ACI Tenant Configuration Validation ==="
          - "APIC Host:               {{ aci_host }}"
          - "Expected Tenants:        {{ aci_tenants | length }}"
          - "Tenants Found:           {{ aci_tenant_validation.current | default([]) | length }}"
          - "VRFs Found:              {{ aci_vrf_validation.current | default([]) | length }}"
          - "Bridge Domains Found:    {{ aci_bd_validation.current | default([]) | length }}"
          - "EPGs Found:              {{ aci_epg_validation.current | default([]) | length }}"
          - "Critical/Major Faults:   {{ aci_tenant_faults.imdata | default([]) | length }}"
          - "Apply Changes Mode:      {{ apply_changes | bool }}"
          - "Deployment Start:        {{ aci_tenant_deploy_start_time | default('unknown') }}"
          - "Validation Time:         {{ ansible_date_time.iso8601 }}"
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Warn if critical or major tenant faults detected
      ansible.builtin.debug:
        msg:
          - "WARNING: {{ aci_tenant_faults.imdata | default([]) | length }} critical/major fault(s) detected in ACI tenant configuration"
          - "Review faults at: https://{{ aci_host }}/index.html#bTenants"
      when: (aci_tenant_faults.imdata | default([]) | length) > 0
      tags:
        - validation
        - verification
        - phase2

    - name: PHASE 2 - Generate tenant configuration validation report artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_tenant_validation_report.json"
        mode: "0640"
        content: "{{ tenant_validation_report | to_nice_json }}"
      vars:
        tenant_validation_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          deployment_start: "{{ aci_tenant_deploy_start_time | default('unknown') }}"
          apic_host: "{{ aci_host }}"
          apply_changes: "{{ apply_changes | bool }}"
          expected_tenant_count: "{{ aci_tenants | length }}"
          tenants_found: "{{ aci_tenant_validation.current | default([]) | length }}"
          vrfs_found: "{{ aci_vrf_validation.current | default([]) | length }}"
          bridge_domains_found: "{{ aci_bd_validation.current | default([]) | length }}"
          epgs_found: "{{ aci_epg_validation.current | default([]) | length }}"
          critical_major_faults: "{{ aci_tenant_faults.imdata | default([]) | length }}"
          compliance_frameworks: "{{ compliance_frameworks }}"
          validation_status: "{{ 'PASSED' if (aci_tenant_faults.imdata | default([]) | length) == 0 else 'WARNING - Faults Detected' }}"
      tags:
        - validation
        - verification
        - phase2

    # --------------------------- evidence delivery --------------------------
    # Writing the report to artifacts_dir is not delivery. Under Ansible
    # Automation Platform the playbook runs inside an execution-environment
    # container that is destroyed when the job ends, so a file left on that
    # filesystem is gone before anyone can read it. Republishing the report
    # through set_stats puts it in the job artifacts, which AAP persists and
    # passes to downstream workflow nodes.
    #
    # These reports carry compliance status and configuration posture, not
    # credentials. Job artifacts are visible to anyone with job-read
    # permission, which is wider than the file this supplements -- set
    # fe_evidence_publish=false to keep the file as the only copy.
    # See docs/VALIDATION_AND_STATS.md#compliance-evidence-delivery.

    - name: "cisco/aci_tenant_config/validation | Evidence | Locate the generated artifacts"
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}"
        patterns: "aci_tenant_validation_report.json"
        file_type: file
      register: fe_evidence_found
      changed_when: false
      failed_when: false
      when: fe_evidence_publish | default(true) | bool
      tags: [report, artifact, evidence]

    - name: "cisco/aci_tenant_config/validation | Evidence | Read the artifacts within the size budget"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: fe_evidence_read
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int <= (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    # An artifact too large to publish must not vanish silently: say so, so the
    # operator knows the job artifacts are not the complete record.
    - name: "cisco/aci_tenant_config/validation | Evidence | Warn about artifacts that exceeded the size budget"
      ansible.builtin.debug:
        msg: >-
          Evidence artifact {{ item.path | basename }} is {{ item.size }} bytes,
          over the {{ fe_evidence_max_bytes | default(65536) }}-byte budget, and was NOT
          published to the job artifacts. It exists only at {{ item.path }}, which does
          not survive an execution-environment container. Raise fe_evidence_max_bytes
          or collect this file another way.
      loop: "{{ fe_evidence_found.files | default([]) | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - fe_evidence_publish | default(true) | bool
        - item.size | int > (fe_evidence_max_bytes | default(65536) | int)
      tags: [report, artifact, evidence]

    - name: "cisco/aci_tenant_config/validation | Evidence | Publish the artifacts as job artifacts"
      ansible.builtin.set_stats:
        data:
          fe_evidence:
            "cisco/aci_tenant_config/validation":
              component: "cisco/aci_tenant_config/validation"
              platform: "cisco"
              collected_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              source_dir: "{{ artifacts_dir }}"
              files: >-
                {{ dict(fe_evidence_read.results | default([])
                        | rejectattr('skipped', 'defined')
                        | map(attribute='item.path') | map('basename') | list
                        | zip(fe_evidence_read.results | default([])
                              | rejectattr('skipped', 'defined')
                              | map(attribute='content') | map('b64decode') | list)) }}
        aggregate: true
        per_host: false
      when:
        - fe_evidence_publish | default(true) | bool
        - fe_evidence_read.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0
      tags: [report, artifact, evidence]

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_validation_preflight_passed | bool
          - fe_cisco_aci_tenant_config_validation_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/validation: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_validation_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_validation_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_validation_postflight_passed: true
        fe_cisco_aci_tenant_config_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_validation_status: "failed"
        fe_cisco_aci_tenant_config_validation_postflight_passed: false
        fe_cisco_aci_tenant_config_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/validation: FAILED at '{{ fe_cisco_aci_tenant_config_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_validation_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/validation failed at '{{ fe_cisco_aci_tenant_config_validation_failed_task }}': {{ fe_cisco_aci_tenant_config_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/validation":
              component: "cisco/aci_tenant_config/validation"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_validation_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_validation_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_validation_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_validation_stats_published: true
      tags:
        - always
