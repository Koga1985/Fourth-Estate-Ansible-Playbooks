---
# tasks file for aci_tenant_config - Tenant Creation
# Creates ACI tenants using cisco.aci.aci_tenant

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/tenants']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_tenants_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/tenants | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_tenants_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_tenants_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_tenants_status: "running"
    fe_cisco_aci_tenant_config_tenants_preflight_passed: false
    fe_cisco_aci_tenant_config_tenants_postflight_passed: false
    fe_cisco_aci_tenant_config_tenants_failed_task: ""
    fe_cisco_aci_tenant_config_tenants_error: ""
    fe_cisco_aci_tenant_config_tenants_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/tenants | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/tenants | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/tenants: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/tenants: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/tenants | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/tenants: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/tenants: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_tenants_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/tenants | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_tenants_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Create ACI tenants
      cisco.aci.aci_tenant:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_tenants }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.enabled | default(true)
      register: tenant_creation_results
      notify:
        - backup aci configuration
      tags:
        - aci
        - tenants
        - phase2

    - name: PHASE 2 - Query tenant creation results
      cisco.aci.aci_tenant:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_tenant_query_all
      tags:
        - aci
        - tenants
        - phase2
        - validation

    - name: PHASE 2 - Display tenant creation summary
      ansible.builtin.debug:
        msg:
          - "=== Tenant Creation Summary ==="
          - "Configured tenants: {{ aci_tenants | length }}"
          - "Enabled tenants:    {{ aci_tenants | selectattr('enabled', 'defined') | selectattr('enabled') | list | length }}"
          - "Apply changes:      {{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - phase2

    - name: PHASE 2 - Save tenant creation artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_tenants.json"
        mode: "0640"
        content: "{{ tenants_artifact | to_nice_json }}"
      vars:
        tenants_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_tenants: "{{ aci_tenants }}"
          tenant_query_results: "{{ aci_tenant_query_all.current | default([]) | length }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/tenants | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_tenants_preflight_passed | bool
          - fe_cisco_aci_tenant_config_tenants_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/tenants: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_tenants_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_tenants_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/tenants: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/tenants | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_tenants_postflight_passed: true
        fe_cisco_aci_tenant_config_tenants_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/tenants | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_tenants_status: "failed"
        fe_cisco_aci_tenant_config_tenants_postflight_passed: false
        fe_cisco_aci_tenant_config_tenants_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_tenants_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/tenants | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/tenants: FAILED at '{{ fe_cisco_aci_tenant_config_tenants_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_tenants_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/tenants | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/tenants failed at '{{ fe_cisco_aci_tenant_config_tenants_failed_task }}': {{ fe_cisco_aci_tenant_config_tenants_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/tenants | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_tenants_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_tenants_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_tenants_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/tenants | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/tenants":
              component: "cisco/aci_tenant_config/tenants"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_tenants_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_tenants_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_tenants_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_tenants_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_tenants_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_tenants_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_tenants_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_tenants_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_tenants_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_tenants_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_tenants_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_tenants_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/tenants'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/tenants | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_tenants_stats_published: true
      tags:
        - always
