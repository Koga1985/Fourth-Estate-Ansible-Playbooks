---
# tasks file for aci_tenant_config - EPG Configuration
# Creates endpoint groups and attaches contracts using cisco.aci.aci_epg and aci_epg_to_contract

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/epgs']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_epgs_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/epgs | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_epgs_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_epgs_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_epgs_status: "running"
    fe_cisco_aci_tenant_config_epgs_preflight_passed: false
    fe_cisco_aci_tenant_config_epgs_postflight_passed: false
    fe_cisco_aci_tenant_config_epgs_failed_task: ""
    fe_cisco_aci_tenant_config_epgs_error: ""
    fe_cisco_aci_tenant_config_epgs_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/epgs | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/epgs | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/epgs: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/epgs: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/epgs | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/epgs: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/epgs: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_epgs_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/epgs | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_epgs_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Create endpoint groups (EPGs)
      cisco.aci.aci_epg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        ap: "{{ item.app_profile }}"
        epg: "{{ item.name }}"
        bd: "{{ item.bridge_domain }}"
        description: "{{ item.description | default('') }}"
        preferred_group: "{{ item.preferred_group | default(false) | ternary('include', 'exclude') }}"
        intra_epg_isolation: "{{ item.intra_epg_isolation | default('unenforced') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_epgs }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.app_profile }}/{{ item.name }}"
      register: epg_creation_results
      tags:
        - aci
        - tenants
        - epgs
        - phase2

    - name: PHASE 2 - Bind provider contracts to EPGs
      cisco.aci.aci_epg_to_contract:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        ap: "{{ item.0.app_profile }}"
        epg: "{{ item.0.name }}"
        contract: "{{ item.1.name }}"
        contract_type: "{{ item.1.type }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_epgs | subelements('provider_contracts', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} provides {{ item.1.name }}"
      tags:
        - aci
        - tenants
        - epgs
        - contracts
        - phase2

    - name: PHASE 2 - Bind consumer contracts to EPGs
      cisco.aci.aci_epg_to_contract:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        ap: "{{ item.0.app_profile }}"
        epg: "{{ item.0.name }}"
        contract: "{{ item.1.name }}"
        contract_type: "consumer"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_epgs | subelements('consumer_contracts', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} consumes {{ item.1.name }}"
      tags:
        - aci
        - tenants
        - epgs
        - contracts
        - phase2

    - name: PHASE 2 - Query EPGs for validation
      cisco.aci.aci_epg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_epg_query_all
      tags:
        - aci
        - tenants
        - epgs
        - phase2
        - validation

    - name: PHASE 2 - Display EPG configuration summary
      ansible.builtin.debug:
        msg:
          - "=== EPG Configuration Summary ==="
          - "Configured EPGs:  {{ aci_epgs | length }}"
          - "Apply changes:    {{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - epgs
        - phase2

    - name: PHASE 2 - Save EPG configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_epgs.json"
        mode: "0640"
        content: "{{ epg_artifact | to_nice_json }}"
      vars:
        epg_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_epgs: "{{ aci_epgs }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - epgs
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/epgs | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_epgs_preflight_passed | bool
          - fe_cisco_aci_tenant_config_epgs_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/epgs: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_epgs_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_epgs_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/epgs: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/epgs | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_epgs_postflight_passed: true
        fe_cisco_aci_tenant_config_epgs_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/epgs | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_epgs_status: "failed"
        fe_cisco_aci_tenant_config_epgs_postflight_passed: false
        fe_cisco_aci_tenant_config_epgs_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_epgs_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/epgs | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/epgs: FAILED at '{{ fe_cisco_aci_tenant_config_epgs_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_epgs_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/epgs | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/epgs failed at '{{ fe_cisco_aci_tenant_config_epgs_failed_task }}': {{ fe_cisco_aci_tenant_config_epgs_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/epgs | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_epgs_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_epgs_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_epgs_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/epgs | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/epgs":
              component: "cisco/aci_tenant_config/epgs"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_epgs_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_epgs_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_epgs_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_epgs_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_epgs_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_epgs_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_epgs_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_epgs_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_epgs_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_epgs_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_epgs_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_epgs_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/epgs'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/epgs | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_epgs_stats_published: true
      tags:
        - always
