---
# tasks file for aci_tenant_config - Static Path Bindings
# Binds EPGs to physical ports/vPCs using cisco.aci.aci_static_binding_to_epg

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/static_paths']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_static_paths_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/static_paths | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_static_paths_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_static_paths_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_static_paths_status: "running"
    fe_cisco_aci_tenant_config_static_paths_preflight_passed: false
    fe_cisco_aci_tenant_config_static_paths_postflight_passed: false
    fe_cisco_aci_tenant_config_static_paths_failed_task: ""
    fe_cisco_aci_tenant_config_static_paths_error: ""
    fe_cisco_aci_tenant_config_static_paths_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/static_paths | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/static_paths | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/static_paths: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/static_paths: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/static_paths | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/static_paths: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/static_paths: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_static_paths_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/static_paths | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_static_paths_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Create static path bindings for EPGs
      cisco.aci.aci_static_binding_to_epg:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        ap: "{{ item.app_profile }}"
        epg: "{{ item.epg }}"
        pod_id: "{{ item.pod_id | default(1) }}"
        leafs: "{{ item.leaf_id }}"
        interface: "{{ item.interface }}"
        encap_id: "{{ item.encap | regex_replace('^vlan-', '') }}"
        interface_mode: "{{ item.mode | default('regular') }}"
        interface_type: "{{ item.interface_type | default('switch_port') }}"
        deploy_immediacy: "{{ item.deploy_immediacy | default('lazy') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_static_paths }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.app_profile }}/{{ item.epg }} -> {{ item.interface }}"
      when: aci_static_paths | length > 0
      register: static_path_results
      tags:
        - aci
        - tenants
        - static_paths
        - phase2

    - name: PHASE 2 - Display static path binding summary
      ansible.builtin.debug:
        msg:
          - "=== Static Path Binding Summary ==="
          - "Configured static paths: {{ aci_static_paths | length }}"
          - "Apply changes:           {{ apply_changes | bool }}"
          - "{{ 'No static paths configured - skipping' if aci_static_paths | length == 0 else '' }}"
      tags:
        - aci
        - tenants
        - static_paths
        - phase2

    - name: PHASE 2 - Save static path bindings artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_static_paths.json"
        mode: "0640"
        content: "{{ static_paths_artifact | to_nice_json }}"
      vars:
        static_paths_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_static_paths: "{{ aci_static_paths }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - static_paths
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/static_paths | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_static_paths_preflight_passed | bool
          - fe_cisco_aci_tenant_config_static_paths_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/static_paths: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_static_paths_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_static_paths_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/static_paths: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/static_paths | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_static_paths_postflight_passed: true
        fe_cisco_aci_tenant_config_static_paths_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/static_paths | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_static_paths_status: "failed"
        fe_cisco_aci_tenant_config_static_paths_postflight_passed: false
        fe_cisco_aci_tenant_config_static_paths_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_static_paths_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/static_paths | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/static_paths: FAILED at '{{ fe_cisco_aci_tenant_config_static_paths_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_static_paths_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/static_paths | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/static_paths failed at '{{ fe_cisco_aci_tenant_config_static_paths_failed_task }}': {{ fe_cisco_aci_tenant_config_static_paths_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/static_paths | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_static_paths_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_static_paths_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_static_paths_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/static_paths | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/static_paths":
              component: "cisco/aci_tenant_config/static_paths"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_static_paths_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_static_paths_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_static_paths_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_static_paths_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_static_paths_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_static_paths_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_static_paths_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_static_paths_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_static_paths_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_static_paths_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_static_paths_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_static_paths_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/static_paths'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/static_paths | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_static_paths_stats_published: true
      tags:
        - always
