---
# tasks file for aci_tenant_config - Contract Configuration
# Creates contracts, contract subjects, and subject-to-filter bindings

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/contracts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_contracts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/contracts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_contracts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_contracts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_contracts_status: "running"
    fe_cisco_aci_tenant_config_contracts_preflight_passed: false
    fe_cisco_aci_tenant_config_contracts_postflight_passed: false
    fe_cisco_aci_tenant_config_contracts_failed_task: ""
    fe_cisco_aci_tenant_config_contracts_error: ""
    fe_cisco_aci_tenant_config_contracts_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/contracts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/contracts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/contracts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/contracts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/contracts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/contracts: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/contracts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_contracts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/contracts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_contracts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Create contracts
      cisco.aci.aci_contract:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        contract: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        scope: "{{ item.scope | default('tenant') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_contracts }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: contract_creation_results
      notify:
        - backup aci configuration
      tags:
        - aci
        - tenants
        - contracts
        - phase2

    - name: PHASE 2 - Create contract subjects
      cisco.aci.aci_contract_subject:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        contract: "{{ item.0.name }}"
        subject: "{{ item.1.name }}"
        bidirectional_filter_chains: "{{ item.1.bidirectional | default(true) }}"
        apply_both_directions: "{{ item.1.apply_both_directions | default(true) }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_contracts | subelements('subjects') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }}"
      register: contract_subject_results
      tags:
        - aci
        - tenants
        - contracts
        - phase2

    - name: PHASE 2 - Bind filters to contract subjects
      cisco.aci.aci_contract_subject_to_filter:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        contract: "{{ item.0.name }}"
        subject: "{{ item.1.name }}"
        filter: "{{ item.1.filter }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_contracts | subelements('subjects') }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.name }} -> {{ item.1.filter }}"
      when: item.1.filter is defined
      register: subject_filter_results
      tags:
        - aci
        - tenants
        - contracts
        - filters
        - phase2

    - name: PHASE 2 - Query contracts for validation
      cisco.aci.aci_contract:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_contract_query_all
      tags:
        - aci
        - tenants
        - contracts
        - phase2
        - validation

    - name: PHASE 2 - Display contract configuration summary
      ansible.builtin.debug:
        msg:
          - "=== Contract Configuration Summary ==="
          - "Configured contracts: {{ aci_contracts | length }}"
          - "Total subjects:       {{ aci_contracts | map(attribute='subjects') | map('length') | sum }}"
          - "Apply changes:        {{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - contracts
        - phase2

    - name: PHASE 2 - Save contract configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_contracts.json"
        mode: "0640"
        content: "{{ contracts_artifact | to_nice_json }}"
      vars:
        contracts_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_contracts: "{{ aci_contracts }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - contracts
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/contracts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_contracts_preflight_passed | bool
          - fe_cisco_aci_tenant_config_contracts_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/contracts: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_contracts_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_contracts_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/contracts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/contracts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_contracts_postflight_passed: true
        fe_cisco_aci_tenant_config_contracts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/contracts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_contracts_status: "failed"
        fe_cisco_aci_tenant_config_contracts_postflight_passed: false
        fe_cisco_aci_tenant_config_contracts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_contracts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/contracts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/contracts: FAILED at '{{ fe_cisco_aci_tenant_config_contracts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_contracts_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/contracts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/contracts failed at '{{ fe_cisco_aci_tenant_config_contracts_failed_task }}': {{ fe_cisco_aci_tenant_config_contracts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/contracts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_contracts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_contracts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_contracts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/contracts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/contracts":
              component: "cisco/aci_tenant_config/contracts"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_contracts_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_contracts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_contracts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_contracts_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_contracts_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_contracts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_contracts_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_contracts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_contracts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_contracts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_contracts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_contracts_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/contracts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/contracts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_contracts_stats_published: true
      tags:
        - always
