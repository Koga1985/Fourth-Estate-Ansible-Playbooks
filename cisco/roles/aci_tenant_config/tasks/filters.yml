---
# tasks file for aci_tenant_config - Filter Configuration
# Creates filters and filter entries using cisco.aci.aci_filter and aci_filter_entry

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cisco/aci_tenant_config/filters']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cisco_aci_tenant_config_filters_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cisco/aci_tenant_config/filters | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cisco_aci_tenant_config_filters_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cisco_aci_tenant_config_filters_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cisco_aci_tenant_config_filters_status: "running"
    fe_cisco_aci_tenant_config_filters_preflight_passed: false
    fe_cisco_aci_tenant_config_filters_postflight_passed: false
    fe_cisco_aci_tenant_config_filters_failed_task: ""
    fe_cisco_aci_tenant_config_filters_error: ""
    fe_cisco_aci_tenant_config_filters_stats_published: false
  tags:
    - always

- name: "cisco/aci_tenant_config/filters | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cisco/aci_tenant_config/filters | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cisco/aci_tenant_config/filters: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cisco/aci_tenant_config/filters: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/filters | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cisco/aci_tenant_config/filters: required variable '{{ item }}' is not defined."
        success_msg: "cisco/aci_tenant_config/filters: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cisco_aci_tenant_config_filters_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cisco/aci_tenant_config/filters | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_filters_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: PHASE 2 - Create filters
      cisco.aci.aci_filter:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.tenant }}"
        filter: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_filters }}"
      loop_control:
        label: "{{ item.tenant }}/{{ item.name }}"
      register: filter_creation_results
      tags:
        - aci
        - tenants
        - filters
        - phase2

    - name: PHASE 2 - Create filter entries
      cisco.aci.aci_filter_entry:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        tenant: "{{ item.0.tenant }}"
        filter: "{{ item.0.name }}"
        entry: "{{ item.1.name }}"
        ether_type: "{{ item.1.ether_type | default('ip') }}"
        ip_protocol: "{{ item.1.ip_protocol | default(omit) }}"
        dst_port: "{{ item.1.dst_port | default(omit) }}"
        dst_port_start: "{{ item.1.dst_port_start | default(omit) }}"
        dst_port_end: "{{ item.1.dst_port_end | default(omit) }}"
        stateful: "{{ item.1.stateful | default(false) }}"
        description: "{{ item.1.description | default('') }}"
        state: "{{ 'present' if apply_changes | bool else 'query' }}"
      no_log: true
      changed_when: not (apply_changes | bool)
      loop: "{{ aci_filters | subelements('filter_entries') }}"
      loop_control:
        label: "{{ item.0.tenant }}/{{ item.0.name }}/{{ item.1.name }}"
      register: filter_entry_results
      tags:
        - aci
        - tenants
        - filters
        - phase2

    - name: PHASE 2 - Query filters for validation
      cisco.aci.aci_filter:
        host: "{{ aci_host }}"
        username: "{{ aci_username }}"
        password: "{{ aci_password }}"
        validate_certs: "{{ aci_verify_ssl }}"
        use_proxy: "{{ aci_use_proxy }}"
        state: query
      no_log: true
      changed_when: false
      register: aci_filter_query_all
      tags:
        - aci
        - tenants
        - filters
        - phase2
        - validation

    - name: PHASE 2 - Display filter configuration summary
      ansible.builtin.debug:
        msg:
          - "=== Filter Configuration Summary ==="
          - "Configured filters:       {{ aci_filters | length }}"
          - "Total filter entries:     {{ aci_filters | map(attribute='filter_entries') | map('length') | sum }}"
          - "Apply changes:            {{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - filters
        - phase2

    - name: PHASE 2 - Save filter configuration artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/aci_filters.json"
        mode: "0640"
        content: "{{ filters_artifact | to_nice_json }}"
      vars:
        filters_artifact:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          configured_filters: "{{ aci_filters }}"
          apply_changes: "{{ apply_changes | bool }}"
      tags:
        - aci
        - tenants
        - filters
        - phase2

    # ----------------------------- postflight -------------------

    - name: "cisco/aci_tenant_config/filters | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cisco_aci_tenant_config_filters_preflight_passed | bool
          - fe_cisco_aci_tenant_config_filters_status in ['running', 'succeeded']
        fail_msg: >-
          cisco/aci_tenant_config/filters: postflight validation failed - preflight passed
          ={{ fe_cisco_aci_tenant_config_filters_preflight_passed | default(false) }},
          status={{ fe_cisco_aci_tenant_config_filters_status | default('unknown') }}.
        success_msg: "cisco/aci_tenant_config/filters: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cisco/aci_tenant_config/filters | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_filters_postflight_passed: true
        fe_cisco_aci_tenant_config_filters_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cisco/aci_tenant_config/filters | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_filters_status: "failed"
        fe_cisco_aci_tenant_config_filters_postflight_passed: false
        fe_cisco_aci_tenant_config_filters_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cisco_aci_tenant_config_filters_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/filters | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cisco/aci_tenant_config/filters: FAILED at '{{ fe_cisco_aci_tenant_config_filters_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cisco_aci_tenant_config_filters_error }}
      tags:
        - always
        - rescue

    - name: "cisco/aci_tenant_config/filters | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cisco/aci_tenant_config/filters failed at '{{ fe_cisco_aci_tenant_config_filters_failed_task }}': {{ fe_cisco_aci_tenant_config_filters_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cisco/aci_tenant_config/filters | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_filters_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cisco_aci_tenant_config_filters_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_aci_tenant_config_filters_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cisco/aci_tenant_config/filters | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cisco/aci_tenant_config/filters":
              component: "cisco/aci_tenant_config/filters"
              type: "role-tasks"
              platform: "cisco"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cisco_aci_tenant_config_filters_status | default('unknown') }}"
              preflight_passed: "{{ fe_cisco_aci_tenant_config_filters_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cisco_aci_tenant_config_filters_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cisco_aci_tenant_config_filters_started_at | default('') }}"
              ended_at: "{{ fe_cisco_aci_tenant_config_filters_ended_at | default('') }}"
              duration_seconds: "{{ fe_cisco_aci_tenant_config_filters_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cisco_aci_tenant_config_filters_failed_task | default('') }}"
              error: "{{ fe_cisco_aci_tenant_config_filters_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cisco_aci_tenant_config_filters_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cisco_aci_tenant_config_filters_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cisco_aci_tenant_config_filters_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cisco_aci_tenant_config_filters_status | default('') == 'succeeded' else ['cisco/aci_tenant_config/filters'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cisco/aci_tenant_config/filters | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cisco_aci_tenant_config_filters_stats_published: true
      tags:
        - always
