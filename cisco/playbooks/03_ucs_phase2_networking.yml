---
# Cisco UCS Phase 2: Networking Configuration
# Configure VLANs, VSANs, QoS, and network policies
# Run after Phase 1 infrastructure deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 2 - UCS Networking Configuration
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    ucs_artifacts_dir: "/tmp/ucs-fourth-estate-artifacts/phase2"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/03_ucs_phase2_networking | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/03_ucs_phase2_networking | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_03_ucs_phase2_networking_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_03_ucs_phase2_networking_status: "running"
            fe_cisco_03_ucs_phase2_networking_preflight_passed: false
            fe_cisco_03_ucs_phase2_networking_postflight_passed: false
            fe_cisco_03_ucs_phase2_networking_failed_task: ""
            fe_cisco_03_ucs_phase2_networking_error: ""
            fe_cisco_03_ucs_phase2_networking_stats_published: false
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/03_ucs_phase2_networking: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/03_ucs_phase2_networking: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/03_ucs_phase2_networking | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/03_ucs_phase2_networking: required variable '{{ item }}' is not defined."
            success_msg: "cisco/03_ucs_phase2_networking: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_03_ucs_phase2_networking_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/03_ucs_phase2_networking | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/03_ucs_phase2_networking | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_status: "preflight_failed"
            fe_cisco_03_ucs_phase2_networking_postflight_passed: false
            fe_cisco_03_ucs_phase2_networking_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_03_ucs_phase2_networking_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/03_ucs_phase2_networking: FAILED at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_03_ucs_phase2_networking_error }}
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/03_ucs_phase2_networking":
                  component: "cisco/03_ucs_phase2_networking"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_03_ucs_phase2_networking_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_03_ucs_phase2_networking_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_03_ucs_phase2_networking_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_03_ucs_phase2_networking_failed_task | default('') }}"
                  error: "{{ fe_cisco_03_ucs_phase2_networking_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else ['cisco/03_ucs_phase2_networking'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_stats_published: true
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/03_ucs_phase2_networking failed at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}': {{ fe_cisco_03_ucs_phase2_networking_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/03_ucs_phase2_networking | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/03_ucs_phase2_networking: preflight
              {{ 'passed' if fe_cisco_03_ucs_phase2_networking_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 2 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 2: Networking Configuration
          ════════════════════════════════════════════════════════════════
          Configuring:
            ✓ VLANs (Management, Production, DMZ)
            ✓ VSANs for SAN connectivity
            ✓ QoS policies
            ✓ Network control (CDP/LLDP)
            ✓ Multicast policies
            ✓ Uplink port channels
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 2 artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/03_ucs_phase2_networking | Guarded execution with rescue and always handling"
      block:

        - name: Configure UCS networking
          ansible.builtin.include_role:
            name: ucs_prod_networking

        - name: "cisco/03_ucs_phase2_networking | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/03_ucs_phase2_networking | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_status: "failed"
            fe_cisco_03_ucs_phase2_networking_postflight_passed: false
            fe_cisco_03_ucs_phase2_networking_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_03_ucs_phase2_networking_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/03_ucs_phase2_networking: FAILED at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_03_ucs_phase2_networking_error }}
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/03_ucs_phase2_networking failed at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}': {{ fe_cisco_03_ucs_phase2_networking_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/03_ucs_phase2_networking | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_03_ucs_phase2_networking_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_03_ucs_phase2_networking_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/03_ucs_phase2_networking":
                  component: "cisco/03_ucs_phase2_networking"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_03_ucs_phase2_networking_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_03_ucs_phase2_networking_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_03_ucs_phase2_networking_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_03_ucs_phase2_networking_failed_task | default('') }}"
                  error: "{{ fe_cisco_03_ucs_phase2_networking_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else ['cisco/03_ucs_phase2_networking'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_03_ucs_phase2_networking_status | default('') == 'failed'
            - not (fe_cisco_03_ucs_phase2_networking_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_stats_published: true
          when:
            - fe_cisco_03_ucs_phase2_networking_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 2 completion report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/phase2_complete.txt"
        mode: '0640'
        content: |
          Phase 2: Networking Configuration - COMPLETE
          ═══════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Status: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Configured:
            ✓ VLANs for network segmentation
            ✓ VSANs for SAN fabric
            ✓ QoS policies (Platinum, Gold, Best-Effort)
            ✓ Network control policies
            ✓ Multicast policies
            ✓ Uplink configurations

          Next Phase: Run 04_ucs_phase3_security.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 2 Complete!
          Next: ansible-playbook 04_ucs_phase3_security.yml
    - name: "cisco/03_ucs_phase2_networking | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/03_ucs_phase2_networking | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_03_ucs_phase2_networking_preflight_passed | bool
              - fe_cisco_03_ucs_phase2_networking_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/03_ucs_phase2_networking: postflight validation failed - preflight passed
              ={{ fe_cisco_03_ucs_phase2_networking_preflight_passed | default(false) }},
              status={{ fe_cisco_03_ucs_phase2_networking_status | default('unknown') }}.
            success_msg: "cisco/03_ucs_phase2_networking: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/03_ucs_phase2_networking | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_postflight_passed: true
            fe_cisco_03_ucs_phase2_networking_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/03_ucs_phase2_networking | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_status: "failed"
            fe_cisco_03_ucs_phase2_networking_postflight_passed: false
            fe_cisco_03_ucs_phase2_networking_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_03_ucs_phase2_networking_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/03_ucs_phase2_networking: FAILED at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_03_ucs_phase2_networking_error }}
          tags:
            - always
            - rescue

        - name: "cisco/03_ucs_phase2_networking | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/03_ucs_phase2_networking failed at '{{ fe_cisco_03_ucs_phase2_networking_failed_task }}': {{ fe_cisco_03_ucs_phase2_networking_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/03_ucs_phase2_networking | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_03_ucs_phase2_networking_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_03_ucs_phase2_networking_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/03_ucs_phase2_networking":
                  component: "cisco/03_ucs_phase2_networking"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_03_ucs_phase2_networking_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_03_ucs_phase2_networking_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_03_ucs_phase2_networking_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_03_ucs_phase2_networking_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_03_ucs_phase2_networking_failed_task | default('') }}"
                  error: "{{ fe_cisco_03_ucs_phase2_networking_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_03_ucs_phase2_networking_status | default('') == 'succeeded' else ['cisco/03_ucs_phase2_networking'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_03_ucs_phase2_networking_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_03_ucs_phase2_networking_stats_published: true
          tags:
            - always

        - name: "cisco/03_ucs_phase2_networking | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/03_ucs_phase2_networking: {{ fe_cisco_03_ucs_phase2_networking_status | default('unknown') }} in
              {{ fe_cisco_03_ucs_phase2_networking_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
