---
# Cisco SD-WAN Compliance Audit Playbook
# Audits SD-WAN fabric against DISA STIG and NIST 800-53 Rev 5
# Non-destructive: queries only, never modifies configuration
#
# Usage:
#   ansible-playbook -i inventory cisco/playbooks/11_sdwan_compliance_audit.yml --ask-vault-pass
#
# Output: Compliance audit report in /tmp/sdwan-artifacts/audit/

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: SD-WAN STIG Compliance Audit
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    apply_changes: false   # ALWAYS false for audit - never modify
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/audit"

  pre_tasks:
    - name: "cisco/11_sdwan_compliance_audit | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/11_sdwan_compliance_audit | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_11_sdwan_compliance_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_sdwan_compliance_audit_status: "running"
            fe_cisco_11_sdwan_compliance_audit_preflight_passed: false
            fe_cisco_11_sdwan_compliance_audit_postflight_passed: false
            fe_cisco_11_sdwan_compliance_audit_failed_task: ""
            fe_cisco_11_sdwan_compliance_audit_error: ""
            fe_cisco_11_sdwan_compliance_audit_stats_published: false
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/11_sdwan_compliance_audit: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/11_sdwan_compliance_audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/11_sdwan_compliance_audit | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/11_sdwan_compliance_audit: required variable '{{ item }}' is not defined."
            success_msg: "cisco/11_sdwan_compliance_audit: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_11_sdwan_compliance_audit_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/11_sdwan_compliance_audit | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_status: "preflight_failed"
            fe_cisco_11_sdwan_compliance_audit_postflight_passed: false
            fe_cisco_11_sdwan_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_sdwan_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_sdwan_compliance_audit: FAILED at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_sdwan_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_sdwan_compliance_audit":
                  component: "cisco/11_sdwan_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_sdwan_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_sdwan_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_sdwan_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_sdwan_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_sdwan_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_sdwan_compliance_audit'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_stats_published: true
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_sdwan_compliance_audit failed at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}': {{ fe_cisco_11_sdwan_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_sdwan_compliance_audit | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/11_sdwan_compliance_audit: preflight
              {{ 'passed' if fe_cisco_11_sdwan_compliance_audit_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display audit banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          SD-WAN DISA STIG COMPLIANCE AUDIT
          ════════════════════════════════════════════════════════════════
          STIG References:
            - Cisco IOS XE SD-WAN Router NDM STIG V2R1
            - Cisco SD-WAN vManage NDM STIG V1R1
          Mode: READ ONLY — No changes will be made
          ════════════════════════════════════════════════════════════════

    - name: Create audit artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Authenticate to vManage
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/j_security_check"
        method: POST
        body_format: form-urlencoded
        body:
          j_username: "{{ sdwan_vmanage_username }}"
          j_password: "{{ sdwan_vmanage_password }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
        status_code: [200, 302]
      register: sdwan_audit_auth
      no_log: true

    - name: Set session and CSRF facts
      ansible.builtin.set_fact:
        sdwan_session_cookie: "{{ sdwan_audit_auth.cookies_string }}"
      no_log: true

    - name: Get CSRF token
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/client/token"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
      register: sdwan_audit_csrf

    - name: Set CSRF token
      ansible.builtin.set_fact:
        sdwan_csrf_token: "{{ sdwan_audit_csrf.json }}"

  tasks:
    # ---- CISC-ND-000080 : DoD Login Banner (AC-8) ----
    - name: "cisco/11_sdwan_compliance_audit | Guarded execution with rescue and always handling"
      block:

        - name: "AUDIT CISC-ND-000080 - Check DoD login banner"
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/settings/configuration/banner"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_audit_banner
          tags: [audit, banners, stig_cat3]

        - name: "AUDIT CISC-ND-000080 - Assert banner is configured"
          ansible.builtin.assert:
            that:
              - sdwan_audit_banner.json.mode == 'on'
              - sdwan_audit_banner.json.bannerDetail | length > 100
            fail_msg: "FAIL: CISC-ND-000080 (AC-8) - DoD login banner NOT configured or too short"
            success_msg: "PASS: CISC-ND-000080 (AC-8) - DoD login banner is configured"
          tags: [audit, banners, stig_cat3]

        # ---- CISC-ND-000090 : SNMPv3 Required (SC-8) ----
        - name: "AUDIT CISC-ND-000090 - Check SNMP configuration"
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/settings/configuration/snmp"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_audit_snmp
          tags: [audit, snmp, stig_cat2]

        - name: "AUDIT CISC-ND-000090 - Assert SNMPv1/v2c disabled"
          ansible.builtin.assert:
            that:
              - not (sdwan_audit_snmp.json.v2 | default(false) | bool)
              - sdwan_audit_snmp.json.v3 | default(false) | bool
            fail_msg: "FAIL: CISC-ND-000090 (SC-8) - SNMPv1/v2c not disabled or SNMPv3 not enabled"
            success_msg: "PASS: CISC-ND-000090 (SC-8) - SNMPv3 enabled, v1/v2c disabled"
          tags: [audit, snmp, stig_cat2]

        # ---- CISC-ND-000370 : Account Lockout (AC-7) ----
        - name: "AUDIT CISC-ND-000370 - Check account lockout policy"
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/settings/configuration/password"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_audit_password
          tags: [audit, passwords, stig_cat1, stig_cat2]

        - name: "AUDIT CISC-ND-000370/000530/000570 - Assert password and lockout policy"
          ansible.builtin.assert:
            that:
              - (sdwan_audit_password.json.maxAttempts | default(99) | int) <= 3
              - (sdwan_audit_password.json.passwordMinLen | default(0) | int) >= 15
            fail_msg: >-
              FAIL: Password/lockout policy non-compliant.
              Lockout max attempts must be <= 3 (found: {{ sdwan_audit_password.json.maxAttempts | default('not set') }}).
              Min password length must be >= 15 (found: {{ sdwan_audit_password.json.passwordMinLen | default('not set') }}).
            success_msg: "PASS: CISC-ND-000370/530/570 - Password and lockout policy compliant"
          tags: [audit, passwords, stig_cat1, stig_cat2]

        # ---- CISC-ND-001290 : NTP Authentication (AU-8) ----
        - name: "AUDIT CISC-ND-001290 - Check NTP authentication"
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/settings/configuration/ntp"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_audit_ntp
          tags: [audit, ntp, stig_cat2]

        - name: "AUDIT CISC-ND-001290 - Assert NTP authentication is enabled"
          ansible.builtin.assert:
            that:
              - sdwan_audit_ntp.json.enabled | default(false) | bool
              - sdwan_audit_ntp.json.authenticate | default(false) | bool
              - sdwan_audit_ntp.json.servers | default([]) | length > 0
            fail_msg: "FAIL: CISC-ND-001290 (AU-8) - NTP not configured or authentication not enabled"
            success_msg: "PASS: CISC-ND-001290 (AU-8) - Authenticated NTP is configured"
          tags: [audit, ntp, stig_cat2]

      rescue:

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_status: "failed"
            fe_cisco_11_sdwan_compliance_audit_postflight_passed: false
            fe_cisco_11_sdwan_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_sdwan_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_sdwan_compliance_audit: FAILED at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_sdwan_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_sdwan_compliance_audit failed at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}': {{ fe_cisco_11_sdwan_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_sdwan_compliance_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_sdwan_compliance_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_11_sdwan_compliance_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_sdwan_compliance_audit":
                  component: "cisco/11_sdwan_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_sdwan_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_sdwan_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_sdwan_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_sdwan_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_sdwan_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_sdwan_compliance_audit'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_11_sdwan_compliance_audit_status | default('') == 'failed'
            - not (fe_cisco_11_sdwan_compliance_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_stats_published: true
          when:
            - fe_cisco_11_sdwan_compliance_audit_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate compliance audit report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/sdwan_compliance_audit_{{ ansible_date_time.epoch }}.txt"
        mode: '0640'
        content: |
          SD-WAN DISA STIG Compliance Audit Report
          ════════════════════════════════════════════════════════════════
          Organization: {{ fourth_estate_org | default('FourthEstate') }}
          vManage: {{ sdwan_vmanage_host }}
          Audited: {{ ansible_date_time.iso8601 }}
          Mode: READ ONLY (no changes made)
          ════════════════════════════════════════════════════════════════
          STIG References:
            - Cisco IOS XE SD-WAN Router NDM STIG V2R1
            - Cisco SD-WAN vManage NDM STIG V1R1

          Controls Audited:
            CISC-ND-000080  DoD Login Banner         (AC-8)
            CISC-ND-000090  SNMPv3 Required           (SC-8)
            CISC-ND-000370  Account Lockout Policy    (AC-7)
            CISC-ND-000530  Password Complexity       (IA-5)
            CISC-ND-000570  Password Min Length       (IA-5)
            CISC-ND-001290  NTP Authentication        (AU-8)

          See task output above for individual PASS/FAIL results.
          Compliance Frameworks: DoD STIG, NIST 800-53 Rev 5, FISMA
          ════════════════════════════════════════════════════════════════

    - name: Display audit completion message
      ansible.builtin.debug:
        msg: |
          SD-WAN Compliance Audit Complete.
          Report saved to: {{ sdwan_artifacts_dir }}/sdwan_compliance_audit_*.txt
    - name: "cisco/11_sdwan_compliance_audit | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/11_sdwan_compliance_audit | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_11_sdwan_compliance_audit_preflight_passed | bool
              - fe_cisco_11_sdwan_compliance_audit_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/11_sdwan_compliance_audit: postflight validation failed - preflight passed
              ={{ fe_cisco_11_sdwan_compliance_audit_preflight_passed | default(false) }},
              status={{ fe_cisco_11_sdwan_compliance_audit_status | default('unknown') }}.
            success_msg: "cisco/11_sdwan_compliance_audit: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/11_sdwan_compliance_audit | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_postflight_passed: true
            fe_cisco_11_sdwan_compliance_audit_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_status: "failed"
            fe_cisco_11_sdwan_compliance_audit_postflight_passed: false
            fe_cisco_11_sdwan_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_sdwan_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_sdwan_compliance_audit: FAILED at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_sdwan_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_sdwan_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_sdwan_compliance_audit failed at '{{ fe_cisco_11_sdwan_compliance_audit_failed_task }}': {{ fe_cisco_11_sdwan_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_sdwan_compliance_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_sdwan_compliance_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_11_sdwan_compliance_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_sdwan_compliance_audit":
                  component: "cisco/11_sdwan_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_sdwan_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_sdwan_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_sdwan_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_sdwan_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_sdwan_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_sdwan_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_sdwan_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_sdwan_compliance_audit'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_11_sdwan_compliance_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_sdwan_compliance_audit_stats_published: true
          tags:
            - always

        - name: "cisco/11_sdwan_compliance_audit | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/11_sdwan_compliance_audit: {{ fe_cisco_11_sdwan_compliance_audit_status | default('unknown') }} in
              {{ fe_cisco_11_sdwan_compliance_audit_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
