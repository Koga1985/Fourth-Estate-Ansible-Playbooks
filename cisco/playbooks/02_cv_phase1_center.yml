---
# Cisco Cyber Vision - Phase 1: Center Initial Deployment
# System setup, network config, license activation, local user management
#
# Usage:
#   ansible-playbook -i inventory playbooks/02_cv_phase1_center.yml --ask-vault-pass
#   ansible-playbook -i inventory playbooks/02_cv_phase1_center.yml \
#     -e "apply_changes=true" --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cyber Vision Phase 1 - Center Deployment
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    apply_changes: false
    artifacts_dir: "/tmp/cv-artifacts"

  pre_tasks:
    - name: "cisco/02_cv_phase1_center | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/02_cv_phase1_center | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_02_cv_phase1_center_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_cv_phase1_center_status: "running"
            fe_cisco_02_cv_phase1_center_preflight_passed: false
            fe_cisco_02_cv_phase1_center_postflight_passed: false
            fe_cisco_02_cv_phase1_center_failed_task: ""
            fe_cisco_02_cv_phase1_center_error: ""
            fe_cisco_02_cv_phase1_center_stats_published: false
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/02_cv_phase1_center: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/02_cv_phase1_center: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_cv_phase1_center | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/02_cv_phase1_center: required variable '{{ item }}' is not defined."
            success_msg: "cisco/02_cv_phase1_center: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_02_cv_phase1_center_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_cv_phase1_center | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/02_cv_phase1_center | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_status: "preflight_failed"
            fe_cisco_02_cv_phase1_center_postflight_passed: false
            fe_cisco_02_cv_phase1_center_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_cv_phase1_center_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_cv_phase1_center | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_cv_phase1_center: FAILED at '{{ fe_cisco_02_cv_phase1_center_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_cv_phase1_center_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_cv_phase1_center | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_cv_phase1_center":
                  component: "cisco/02_cv_phase1_center"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_cv_phase1_center_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_cv_phase1_center_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_cv_phase1_center_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_cv_phase1_center_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_cv_phase1_center_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_cv_phase1_center_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_cv_phase1_center_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_cv_phase1_center_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_cv_phase1_center_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else ['cisco/02_cv_phase1_center'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_stats_published: true
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_cv_phase1_center failed at '{{ fe_cisco_02_cv_phase1_center_failed_task }}': {{ fe_cisco_02_cv_phase1_center_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_cv_phase1_center | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/02_cv_phase1_center: preflight
              {{ 'passed' if fe_cisco_02_cv_phase1_center_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: '0750'
      tags: ['always']

  roles:
    - role: cybervision_center_deploy
      tags: ['center', 'phase1']
  post_tasks:
    - name: "cisco/02_cv_phase1_center | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/02_cv_phase1_center | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_02_cv_phase1_center_preflight_passed | bool
              - fe_cisco_02_cv_phase1_center_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/02_cv_phase1_center: postflight validation failed - preflight passed
              ={{ fe_cisco_02_cv_phase1_center_preflight_passed | default(false) }},
              status={{ fe_cisco_02_cv_phase1_center_status | default('unknown') }}.
            success_msg: "cisco/02_cv_phase1_center: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/02_cv_phase1_center | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_postflight_passed: true
            fe_cisco_02_cv_phase1_center_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/02_cv_phase1_center | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_status: "failed"
            fe_cisco_02_cv_phase1_center_postflight_passed: false
            fe_cisco_02_cv_phase1_center_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_cv_phase1_center_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_cv_phase1_center | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_cv_phase1_center: FAILED at '{{ fe_cisco_02_cv_phase1_center_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_cv_phase1_center_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_cv_phase1_center | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_cv_phase1_center failed at '{{ fe_cisco_02_cv_phase1_center_failed_task }}': {{ fe_cisco_02_cv_phase1_center_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_cv_phase1_center | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_cv_phase1_center_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_02_cv_phase1_center_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_cv_phase1_center":
                  component: "cisco/02_cv_phase1_center"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_cv_phase1_center_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_cv_phase1_center_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_cv_phase1_center_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_cv_phase1_center_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_cv_phase1_center_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_cv_phase1_center_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_cv_phase1_center_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_cv_phase1_center_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_cv_phase1_center_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_cv_phase1_center_status | default('') == 'succeeded' else ['cisco/02_cv_phase1_center'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_02_cv_phase1_center_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_cv_phase1_center_stats_published: true
          tags:
            - always

        - name: "cisco/02_cv_phase1_center | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/02_cv_phase1_center: {{ fe_cisco_02_cv_phase1_center_status | default('unknown') }} in
              {{ fe_cisco_02_cv_phase1_center_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
