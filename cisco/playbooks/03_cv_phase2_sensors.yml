---
# Cisco Cyber Vision - Phase 2: Sensor Configuration
# Sensor enrollment, zone creation, reporting policies, capture modes
#
# Usage:
#   ansible-playbook -i inventory playbooks/03_cv_phase2_sensors.yml --ask-vault-pass
#   ansible-playbook -i inventory playbooks/03_cv_phase2_sensors.yml \
#     -e "apply_changes=true" --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cyber Vision Phase 2 - Sensor Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    apply_changes: false
    artifacts_dir: "/tmp/cv-artifacts"

  pre_tasks:
    - name: "cisco/03_cv_phase2_sensors | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/03_cv_phase2_sensors | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_03_cv_phase2_sensors_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_03_cv_phase2_sensors_status: "running"
            fe_cisco_03_cv_phase2_sensors_preflight_passed: false
            fe_cisco_03_cv_phase2_sensors_postflight_passed: false
            fe_cisco_03_cv_phase2_sensors_failed_task: ""
            fe_cisco_03_cv_phase2_sensors_error: ""
            fe_cisco_03_cv_phase2_sensors_stats_published: false
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/03_cv_phase2_sensors: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/03_cv_phase2_sensors: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/03_cv_phase2_sensors | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/03_cv_phase2_sensors: required variable '{{ item }}' is not defined."
            success_msg: "cisco/03_cv_phase2_sensors: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_03_cv_phase2_sensors_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/03_cv_phase2_sensors | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/03_cv_phase2_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_status: "preflight_failed"
            fe_cisco_03_cv_phase2_sensors_postflight_passed: false
            fe_cisco_03_cv_phase2_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_03_cv_phase2_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/03_cv_phase2_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/03_cv_phase2_sensors: FAILED at '{{ fe_cisco_03_cv_phase2_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_03_cv_phase2_sensors_error }}
          tags:
            - always
            - rescue

        - name: "cisco/03_cv_phase2_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/03_cv_phase2_sensors":
                  component: "cisco/03_cv_phase2_sensors"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_03_cv_phase2_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_03_cv_phase2_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_03_cv_phase2_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_03_cv_phase2_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_03_cv_phase2_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_03_cv_phase2_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_03_cv_phase2_sensors_failed_task | default('') }}"
                  error: "{{ fe_cisco_03_cv_phase2_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_03_cv_phase2_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else ['cisco/03_cv_phase2_sensors'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_stats_published: true
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/03_cv_phase2_sensors failed at '{{ fe_cisco_03_cv_phase2_sensors_failed_task }}': {{ fe_cisco_03_cv_phase2_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/03_cv_phase2_sensors | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/03_cv_phase2_sensors: preflight
              {{ 'passed' if fe_cisco_03_cv_phase2_sensors_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: '0750'
      tags: ['always']

  roles:
    - role: cybervision_sensor_config
      tags: ['sensors', 'phase2']
  post_tasks:
    - name: "cisco/03_cv_phase2_sensors | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/03_cv_phase2_sensors | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_03_cv_phase2_sensors_preflight_passed | bool
              - fe_cisco_03_cv_phase2_sensors_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/03_cv_phase2_sensors: postflight validation failed - preflight passed
              ={{ fe_cisco_03_cv_phase2_sensors_preflight_passed | default(false) }},
              status={{ fe_cisco_03_cv_phase2_sensors_status | default('unknown') }}.
            success_msg: "cisco/03_cv_phase2_sensors: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/03_cv_phase2_sensors | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_postflight_passed: true
            fe_cisco_03_cv_phase2_sensors_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/03_cv_phase2_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_status: "failed"
            fe_cisco_03_cv_phase2_sensors_postflight_passed: false
            fe_cisco_03_cv_phase2_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_03_cv_phase2_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/03_cv_phase2_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/03_cv_phase2_sensors: FAILED at '{{ fe_cisco_03_cv_phase2_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_03_cv_phase2_sensors_error }}
          tags:
            - always
            - rescue

        - name: "cisco/03_cv_phase2_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/03_cv_phase2_sensors failed at '{{ fe_cisco_03_cv_phase2_sensors_failed_task }}': {{ fe_cisco_03_cv_phase2_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/03_cv_phase2_sensors | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_03_cv_phase2_sensors_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_03_cv_phase2_sensors_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/03_cv_phase2_sensors":
                  component: "cisco/03_cv_phase2_sensors"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_03_cv_phase2_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_03_cv_phase2_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_03_cv_phase2_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_03_cv_phase2_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_03_cv_phase2_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_03_cv_phase2_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_03_cv_phase2_sensors_failed_task | default('') }}"
                  error: "{{ fe_cisco_03_cv_phase2_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_03_cv_phase2_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_03_cv_phase2_sensors_status | default('') == 'succeeded' else ['cisco/03_cv_phase2_sensors'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_03_cv_phase2_sensors_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_03_cv_phase2_sensors_stats_published: true
          tags:
            - always

        - name: "cisco/03_cv_phase2_sensors | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/03_cv_phase2_sensors: {{ fe_cisco_03_cv_phase2_sensors_status | default('unknown') }} in
              {{ fe_cisco_03_cv_phase2_sensors_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
