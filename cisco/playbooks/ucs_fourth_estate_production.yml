---
# Cisco UCS Fourth Estate Production Deployment Playbook
# Complete production rollout with DoD STIG and NIST 800-53 compliance

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy Cisco UCS Infrastructure for Fourth Estate
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    # Deployment control - set to true to apply changes
    apply_changes: false

    # Artifacts directory
    ucs_artifacts_dir: "/tmp/ucs-fourth-estate-artifacts"

    # Fourth Estate Organization
    fourth_estate_org_name: "FourthEstate"
    fourth_estate_description: "Fourth Estate Organization - Free Press and Media"

    # Compliance frameworks
    compliance_frameworks:
      - "dod_stig"
      - "nist_800_53"
      - "nist_800_171"
      - "fisma_moderate"
      - "fisma_high"

  tasks:
    - name: "cisco/ucs_fourth_estate_production | Guarded execution with rescue and always handling"
      block:

        - name: Display deployment banner
          ansible.builtin.debug:
            msg: |
              ================================================================
              Cisco UCS Fourth Estate Production Deployment
              ================================================================
              Organization: {{ fourth_estate_org_name }}
              Apply Changes: {{ apply_changes }}
              Compliance: {{ compliance_frameworks | join(', ') }}
              ================================================================

        - name: Create artifacts directory
          ansible.builtin.file:
            path: "{{ ucs_artifacts_dir }}"
            state: directory
            mode: '0750'

        - name: Include UCS infrastructure deployment role
          ansible.builtin.include_role:
            name: ucs_prod_infrastructure
          tags:
            - infrastructure
            - deployment

        - name: Include UCS networking configuration role
          ansible.builtin.include_role:
            name: ucs_prod_networking
          tags:
            - networking
            - infrastructure

        - name: Include UCS security hardening role
          ansible.builtin.include_role:
            name: ucs_security_hardening
          tags:
            - security
            - hardening
            - compliance

        - name: Include UCS monitoring role
          ansible.builtin.include_role:
            name: ucs_prod_monitoring
          tags:
            - monitoring
            - health

        - name: Include UCS backup and DR role
          ansible.builtin.include_role:
            name: ucs_prod_backup_dr
          tags:
            - backup
            - dr

        - name: Generate final deployment report
          ansible.builtin.copy:
            dest: "{{ ucs_artifacts_dir }}/deployment_complete.txt"
            mode: '0640'
            content: |
              ================================================================
              Cisco UCS Fourth Estate Production Deployment - COMPLETE
              ================================================================

              Deployment Date: {{ ansible_date_time.iso8601 }}
              Organization: {{ fourth_estate_org_name }}
              Changes Applied: {{ apply_changes | ternary('YES', 'NO - DRY RUN') }}

              DEPLOYMENT SUMMARY
              ==================

              Infrastructure:
              ✓ UCS Manager configured
              ✓ Organizations created
              ✓ Service profiles deployed
              ✓ Server pools configured
              ✓ High availability enabled

              Networking:
              ✓ VLANs configured
              ✓ VSANs configured (SAN)
              ✓ QoS policies applied
              ✓ Network control policies set

              Security:
              ✓ STIG compliance implemented
              ✓ NIST 800-53 controls applied
              ✓ Access control configured
              ✓ Authentication hardened
              ✓ Audit logging enabled
              ✓ Cryptographic controls enforced
              ✓ DoD banner configured

              Monitoring:
              ✓ SNMP configured
              ✓ Call Home enabled
              ✓ Health monitoring active

              Backup & DR:
              ✓ Automated backups configured
              ✓ DR procedures documented
              ✓ RTO/RPO targets set

              COMPLIANCE FRAMEWORKS
              =====================
              {% for framework in compliance_frameworks %}
              - {{ framework }}
              {% endfor %}

              NEXT STEPS
              ==========
              {% if not apply_changes %}
              1. Review all artifacts in {{ ucs_artifacts_dir }}
              2. Verify configurations meet requirements
              3. Set apply_changes=true to apply configurations
              4. Run playbook again to deploy
              {% else %}
              1. Review deployment artifacts
              2. Verify all systems operational
              3. Test backup/restore procedures
              4. Integrate with monitoring systems
              5. Schedule compliance audits
              6. Document as-built configuration
              7. Train operations team
              {% endif %}

              ARTIFACTS LOCATION
              ==================
              All deployment artifacts saved to:
              {{ ucs_artifacts_dir }}

              Review the following files:
              - deployment_summary.txt
              - compliance_report.txt
              - disaster_recovery_plan.txt
              - network_topology.txt
              - And more...

              ================================================================
              END OF DEPLOYMENT REPORT
              ================================================================

        - name: Display deployment completion message
          ansible.builtin.debug:
            msg: |
              Deployment {{ apply_changes | ternary('APPLIED', 'PLANNED (dry-run)') }}
              Review artifacts: {{ ucs_artifacts_dir }}
              {% if not apply_changes %}
              To apply changes, run with: -e "apply_changes=true"
              {% endif %}

        - name: "cisco/ucs_fourth_estate_production | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/ucs_fourth_estate_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_status: "failed"
            fe_cisco_ucs_fourth_estate_production_postflight_passed: false
            fe_cisco_ucs_fourth_estate_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_ucs_fourth_estate_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/ucs_fourth_estate_production: FAILED at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_ucs_fourth_estate_production_error }}
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/ucs_fourth_estate_production failed at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}': {{ fe_cisco_ucs_fourth_estate_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/ucs_fourth_estate_production | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_ucs_fourth_estate_production_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_fourth_estate_production_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/ucs_fourth_estate_production":
                  component: "cisco/ucs_fourth_estate_production"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_ucs_fourth_estate_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_ucs_fourth_estate_production_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_ucs_fourth_estate_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_ucs_fourth_estate_production_failed_task | default('') }}"
                  error: "{{ fe_cisco_ucs_fourth_estate_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else ['cisco/ucs_fourth_estate_production'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_ucs_fourth_estate_production_status | default('') == 'failed'
            - not (fe_cisco_ucs_fourth_estate_production_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_stats_published: true
          when:
            - fe_cisco_ucs_fourth_estate_production_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "cisco/ucs_fourth_estate_production | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/ucs_fourth_estate_production | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_ucs_fourth_estate_production_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_ucs_fourth_estate_production_status: "running"
            fe_cisco_ucs_fourth_estate_production_preflight_passed: false
            fe_cisco_ucs_fourth_estate_production_postflight_passed: false
            fe_cisco_ucs_fourth_estate_production_failed_task: ""
            fe_cisco_ucs_fourth_estate_production_error: ""
            fe_cisco_ucs_fourth_estate_production_stats_published: false
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/ucs_fourth_estate_production: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/ucs_fourth_estate_production: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/ucs_fourth_estate_production | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/ucs_fourth_estate_production: required variable '{{ item }}' is not defined."
            success_msg: "cisco/ucs_fourth_estate_production: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_ucs_fourth_estate_production_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/ucs_fourth_estate_production | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/ucs_fourth_estate_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_status: "preflight_failed"
            fe_cisco_ucs_fourth_estate_production_postflight_passed: false
            fe_cisco_ucs_fourth_estate_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_ucs_fourth_estate_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/ucs_fourth_estate_production: FAILED at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_ucs_fourth_estate_production_error }}
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/ucs_fourth_estate_production":
                  component: "cisco/ucs_fourth_estate_production"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_ucs_fourth_estate_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_ucs_fourth_estate_production_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_ucs_fourth_estate_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_ucs_fourth_estate_production_failed_task | default('') }}"
                  error: "{{ fe_cisco_ucs_fourth_estate_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else ['cisco/ucs_fourth_estate_production'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_stats_published: true
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/ucs_fourth_estate_production failed at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}': {{ fe_cisco_ucs_fourth_estate_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/ucs_fourth_estate_production | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/ucs_fourth_estate_production: preflight
              {{ 'passed' if fe_cisco_ucs_fourth_estate_production_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "cisco/ucs_fourth_estate_production | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/ucs_fourth_estate_production | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_ucs_fourth_estate_production_preflight_passed | bool
              - fe_cisco_ucs_fourth_estate_production_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/ucs_fourth_estate_production: postflight validation failed - preflight passed
              ={{ fe_cisco_ucs_fourth_estate_production_preflight_passed | default(false) }},
              status={{ fe_cisco_ucs_fourth_estate_production_status | default('unknown') }}.
            success_msg: "cisco/ucs_fourth_estate_production: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/ucs_fourth_estate_production | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_postflight_passed: true
            fe_cisco_ucs_fourth_estate_production_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/ucs_fourth_estate_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_status: "failed"
            fe_cisco_ucs_fourth_estate_production_postflight_passed: false
            fe_cisco_ucs_fourth_estate_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_ucs_fourth_estate_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/ucs_fourth_estate_production: FAILED at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_ucs_fourth_estate_production_error }}
          tags:
            - always
            - rescue

        - name: "cisco/ucs_fourth_estate_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/ucs_fourth_estate_production failed at '{{ fe_cisco_ucs_fourth_estate_production_failed_task }}': {{ fe_cisco_ucs_fourth_estate_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/ucs_fourth_estate_production | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_ucs_fourth_estate_production_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_ucs_fourth_estate_production_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/ucs_fourth_estate_production":
                  component: "cisco/ucs_fourth_estate_production"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_ucs_fourth_estate_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_ucs_fourth_estate_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_ucs_fourth_estate_production_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_ucs_fourth_estate_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_ucs_fourth_estate_production_failed_task | default('') }}"
                  error: "{{ fe_cisco_ucs_fourth_estate_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_ucs_fourth_estate_production_status | default('') == 'succeeded' else ['cisco/ucs_fourth_estate_production'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_ucs_fourth_estate_production_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_ucs_fourth_estate_production_stats_published: true
          tags:
            - always

        - name: "cisco/ucs_fourth_estate_production | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/ucs_fourth_estate_production: {{ fe_cisco_ucs_fourth_estate_production_status | default('unknown') }} in
              {{ fe_cisco_ucs_fourth_estate_production_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
