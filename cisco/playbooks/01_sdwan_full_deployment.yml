---
# Cisco SD-WAN Full Deployment Playbook
# Orchestrates all 6 phases of SD-WAN deployment in sequence
#
# Phases:
#   Phase 15 - vManage Controller Initial Deployment
#   Phase 16 - vManage Configuration (users, templates, policies)
#   Phase 17 - vBond/vSmart Controller Configuration
#   Phase 18 - vEdge/cEdge Device Onboarding
#   Phase 19 - DISA STIG / NIST 800-53 Security Hardening
#   Phase 20 - Monitoring (SNMPv3, syslog, streaming telemetry)
#
# Usage:
#   # Dry run (default):
#   ansible-playbook -i inventory cisco/playbooks/01_sdwan_full_deployment.yml --ask-vault-pass
#
#   # Apply all phases:
#   ansible-playbook -i inventory cisco/playbooks/01_sdwan_full_deployment.yml \
#     -e apply_changes=true --ask-vault-pass
#
#   # Run specific platform:
#   ansible-playbook -i inventory cisco/playbooks/01_sdwan_full_deployment.yml \
#     --tags sdwan --ask-vault-pass
#
#   # Security hardening only:
#   ansible-playbook -i inventory cisco/playbooks/01_sdwan_full_deployment.yml \
#     --tags security -e apply_changes=true --ask-vault-pass
#
# IMPORTANT: Run ansible-galaxy collection install -r requirements.yml first
# Last Updated: 2026-04-08
# Maintained By: Fourth Estate Infrastructure Team

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cisco SD-WAN Full Deployment
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts"

    # Phase deployment control
    deploy_sdwan_vmanage: true
    deploy_sdwan_vmanage_config: true
    deploy_sdwan_controllers: true
    deploy_sdwan_vedge: true
    deploy_sdwan_security: true
    deploy_sdwan_monitoring: true

  pre_tasks:
    - name: "cisco/01_sdwan_full_deployment | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/01_sdwan_full_deployment | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_01_sdwan_full_deployment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_01_sdwan_full_deployment_status: "running"
            fe_cisco_01_sdwan_full_deployment_preflight_passed: false
            fe_cisco_01_sdwan_full_deployment_postflight_passed: false
            fe_cisco_01_sdwan_full_deployment_failed_task: ""
            fe_cisco_01_sdwan_full_deployment_error: ""
            fe_cisco_01_sdwan_full_deployment_stats_published: false
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/01_sdwan_full_deployment: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/01_sdwan_full_deployment: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/01_sdwan_full_deployment | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/01_sdwan_full_deployment: required variable '{{ item }}' is not defined."
            success_msg: "cisco/01_sdwan_full_deployment: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_01_sdwan_full_deployment_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/01_sdwan_full_deployment | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/01_sdwan_full_deployment | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_status: "preflight_failed"
            fe_cisco_01_sdwan_full_deployment_postflight_passed: false
            fe_cisco_01_sdwan_full_deployment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_01_sdwan_full_deployment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/01_sdwan_full_deployment: FAILED at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_01_sdwan_full_deployment_error }}
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/01_sdwan_full_deployment":
                  component: "cisco/01_sdwan_full_deployment"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_01_sdwan_full_deployment_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_01_sdwan_full_deployment_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_01_sdwan_full_deployment_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_01_sdwan_full_deployment_failed_task | default('') }}"
                  error: "{{ fe_cisco_01_sdwan_full_deployment_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else ['cisco/01_sdwan_full_deployment'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_stats_published: true
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/01_sdwan_full_deployment failed at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}': {{ fe_cisco_01_sdwan_full_deployment_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/01_sdwan_full_deployment | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/01_sdwan_full_deployment: preflight
              {{ 'passed' if fe_cisco_01_sdwan_full_deployment_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "cisco/01_sdwan_full_deployment | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display SD-WAN deployment banner
          ansible.builtin.debug:
            msg: |
              ════════════════════════════════════════════════════════════════
              CISCO SD-WAN FULL DEPLOYMENT - Fourth Estate
              ════════════════════════════════════════════════════════════════
              Phases:
                Phase 15  ✓ vManage Controller Deployment
                Phase 16  ✓ vManage Configuration
                Phase 17  ✓ vBond / vSmart Controllers
                Phase 18  ✓ vEdge / cEdge Onboarding
                Phase 19  ✓ DISA STIG / NIST 800-53 Hardening
                Phase 20  ✓ Monitoring & Telemetry
              ════════════════════════════════════════════════════════════════
              Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
              ════════════════════════════════════════════════════════════════

        - name: Create artifacts directory
          ansible.builtin.file:
            path: "{{ sdwan_artifacts_dir }}"
            state: directory
            mode: '0750'

        - name: "cisco/01_sdwan_full_deployment | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/01_sdwan_full_deployment | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_status: "failed"
            fe_cisco_01_sdwan_full_deployment_postflight_passed: false
            fe_cisco_01_sdwan_full_deployment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_01_sdwan_full_deployment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/01_sdwan_full_deployment: FAILED at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_01_sdwan_full_deployment_error }}
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/01_sdwan_full_deployment failed at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}': {{ fe_cisco_01_sdwan_full_deployment_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/01_sdwan_full_deployment | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_01_sdwan_full_deployment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_01_sdwan_full_deployment_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/01_sdwan_full_deployment":
                  component: "cisco/01_sdwan_full_deployment"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_01_sdwan_full_deployment_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_01_sdwan_full_deployment_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_01_sdwan_full_deployment_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_01_sdwan_full_deployment_failed_task | default('') }}"
                  error: "{{ fe_cisco_01_sdwan_full_deployment_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else ['cisco/01_sdwan_full_deployment'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_01_sdwan_full_deployment_status | default('') == 'failed'
            - not (fe_cisco_01_sdwan_full_deployment_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_stats_published: true
          when:
            - fe_cisco_01_sdwan_full_deployment_status | default('') == 'failed'
          tags:
            - always

  tasks:
    # =========================================
    # Phase 15: vManage Controller Deployment
    # =========================================
    - name: "cisco/01_sdwan_full_deployment | Guarded execution with rescue and always handling"
      block:

        - name: Phase 15 - vManage Controller Deployment
          ansible.builtin.include_role:
            name: sdwan_vmanage_deploy
          when: deploy_sdwan_vmanage | bool
          tags: ['sdwan', 'vmanage', 'deploy', 'phase15']

        # =========================================
        # Phase 16: vManage Configuration
        # =========================================
        - name: Phase 16 - vManage Configuration
          ansible.builtin.include_role:
            name: sdwan_vmanage_config
          when: deploy_sdwan_vmanage_config | bool
          tags: ['sdwan', 'vmanage', 'config', 'phase16']

        # =========================================
        # Phase 17: Controller Configuration
        # =========================================
        - name: Phase 17 - vBond and vSmart Controller Configuration
          ansible.builtin.include_role:
            name: sdwan_controllers_config
          when: deploy_sdwan_controllers | bool
          tags: ['sdwan', 'controllers', 'vbond', 'vsmart', 'phase17']

        # =========================================
        # Phase 18: Edge Device Onboarding
        # =========================================
        - name: Phase 18 - vEdge / cEdge Device Onboarding
          ansible.builtin.include_role:
            name: sdwan_vedge_onboard
          when: deploy_sdwan_vedge | bool
          tags: ['sdwan', 'vedge', 'onboarding', 'phase18']

        # =========================================
        # Phase 19: DISA STIG Security Hardening
        # =========================================
        - name: Phase 19 - DISA STIG / NIST 800-53 Security Hardening
          ansible.builtin.include_role:
            name: sdwan_security_hardening
          when: deploy_sdwan_security | bool
          tags: ['sdwan', 'security', 'stig', 'hardening', 'phase19']

        # =========================================
        # Phase 20: Monitoring and Telemetry
        # =========================================
        - name: Phase 20 - Monitoring and Telemetry
          ansible.builtin.include_role:
            name: sdwan_monitoring
          when: deploy_sdwan_monitoring | bool
          tags: ['sdwan', 'monitoring', 'telemetry', 'phase20']

        - name: "cisco/01_sdwan_full_deployment | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/01_sdwan_full_deployment | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_status: "failed"
            fe_cisco_01_sdwan_full_deployment_postflight_passed: false
            fe_cisco_01_sdwan_full_deployment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_01_sdwan_full_deployment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/01_sdwan_full_deployment: FAILED at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_01_sdwan_full_deployment_error }}
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/01_sdwan_full_deployment failed at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}': {{ fe_cisco_01_sdwan_full_deployment_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/01_sdwan_full_deployment | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_01_sdwan_full_deployment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_01_sdwan_full_deployment_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/01_sdwan_full_deployment":
                  component: "cisco/01_sdwan_full_deployment"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_01_sdwan_full_deployment_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_01_sdwan_full_deployment_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_01_sdwan_full_deployment_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_01_sdwan_full_deployment_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_01_sdwan_full_deployment_failed_task | default('') }}"
                  error: "{{ fe_cisco_01_sdwan_full_deployment_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_01_sdwan_full_deployment_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_01_sdwan_full_deployment_status | default('') == 'succeeded' else ['cisco/01_sdwan_full_deployment'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_01_sdwan_full_deployment_status | default('') == 'failed'
            - not (fe_cisco_01_sdwan_full_deployment_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/01_sdwan_full_deployment | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_stats_published: true
          when:
            - fe_cisco_01_sdwan_full_deployment_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate full deployment completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/sdwan_deployment_complete.txt"
        mode: '0640'
        content: |
          Cisco SD-WAN Full Deployment - COMPLETE
          ════════════════════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}
          Organization: {{ fourth_estate_org | default('FourthEstate') }}

          Phases Executed:
            Phase 15  ✓ vManage Controller Deployment
            Phase 16  ✓ vManage Configuration
            Phase 17  ✓ vBond / vSmart Controllers
            Phase 18  ✓ vEdge / cEdge Onboarding
            Phase 19  ✓ DISA STIG / NIST 800-53 Hardening
            Phase 20  ✓ Monitoring & Telemetry

          STIG References:
            - Cisco IOS XE SD-WAN Router NDM STIG V2R1
            - Cisco SD-WAN vManage NDM STIG V1R1

          Compliance Frameworks: DoD STIG, NIST 800-53, NIST 800-171, FISMA

          Artifacts: {{ sdwan_artifacts_dir }}/
          ════════════════════════════════════════════════════════════════

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          SD-WAN Full Deployment Complete!
          ════════════════════════════════════════════════════════════════
          Mode: {{ apply_changes | ternary('CHANGES APPLIED', 'DRY RUN') }}
          Run compliance audit: ansible-playbook cisco/playbooks/11_sdwan_compliance_audit.yml
          ════════════════════════════════════════════════════════════════
    - name: "cisco/01_sdwan_full_deployment | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/01_sdwan_full_deployment | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_01_sdwan_full_deployment_preflight_passed | bool
              - fe_cisco_01_sdwan_full_deployment_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/01_sdwan_full_deployment: postflight validation failed - preflight passed
              ={{ fe_cisco_01_sdwan_full_deployment_preflight_passed | default(false) }},
              status={{ fe_cisco_01_sdwan_full_deployment_status | default('unknown') }}.
            success_msg: "cisco/01_sdwan_full_deployment: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/01_sdwan_full_deployment | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_postflight_passed: true
            fe_cisco_01_sdwan_full_deployment_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/01_sdwan_full_deployment | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_01_sdwan_full_deployment_status: "failed"
            fe_cisco_01_sdwan_full_deployment_postflight_passed: false
            fe_cisco_01_sdwan_full_deployment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_01_sdwan_full_deployment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/01_sdwan_full_deployment | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/01_sdwan_full_deployment: FAILED at '{{ fe_cisco_01_sdwan_full_deployment_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_01_sdwan_full_deployment_error }}
