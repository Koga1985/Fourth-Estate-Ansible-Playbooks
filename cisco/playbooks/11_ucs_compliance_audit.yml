---
# Cisco UCS Compliance Audit Playbook
# Audit STIG and NIST 800-53 compliance
# Run regularly to verify compliance posture

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: UCS Compliance Audit
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    ucs_artifacts_dir: "/tmp/ucs-compliance-audit-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/11_ucs_compliance_audit | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/11_ucs_compliance_audit | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_11_ucs_compliance_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_ucs_compliance_audit_status: "running"
            fe_cisco_11_ucs_compliance_audit_preflight_passed: false
            fe_cisco_11_ucs_compliance_audit_postflight_passed: false
            fe_cisco_11_ucs_compliance_audit_failed_task: ""
            fe_cisco_11_ucs_compliance_audit_error: ""
            fe_cisco_11_ucs_compliance_audit_stats_published: false
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/11_ucs_compliance_audit: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/11_ucs_compliance_audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/11_ucs_compliance_audit | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/11_ucs_compliance_audit: required variable '{{ item }}' is not defined."
            success_msg: "cisco/11_ucs_compliance_audit: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_11_ucs_compliance_audit_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/11_ucs_compliance_audit | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/11_ucs_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_status: "preflight_failed"
            fe_cisco_11_ucs_compliance_audit_postflight_passed: false
            fe_cisco_11_ucs_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_ucs_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_ucs_compliance_audit: FAILED at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_ucs_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_ucs_compliance_audit":
                  component: "cisco/11_ucs_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_ucs_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_ucs_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_ucs_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_ucs_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_ucs_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_ucs_compliance_audit'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_stats_published: true
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_ucs_compliance_audit failed at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}': {{ fe_cisco_11_ucs_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_ucs_compliance_audit | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/11_ucs_compliance_audit: preflight
              {{ 'passed' if fe_cisco_11_ucs_compliance_audit_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display compliance audit banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          UCS Compliance Audit
          ════════════════════════════════════════════════════════════════
          Auditing:
            ✓ DoD STIG findings (Cat I/II/III)
            ✓ NIST 800-53 controls
            ✓ Password policies
            ✓ Session management
            ✓ Audit logging
            ✓ Cryptographic settings
            ✓ Network security
            ✓ Access controls
          ════════════════════════════════════════════════════════════════

    - name: Create compliance artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    # Query system configuration
    - name: "cisco/11_ucs_compliance_audit | Guarded execution with rescue and always handling"
      block:

        - name: Query UCS system configuration
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: topSystem,aaaUserEp,commSyslog
          no_log: true
          register: system_config

        # Query user accounts for access control audit
        - name: Query user accounts
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: aaaUser
          no_log: true
          register: user_accounts

        # Query password policy
        - name: Query password policy settings
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: aaaUserPolicy
          no_log: true
          register: password_policy

        # Query syslog configuration
        - name: Query syslog configuration
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: commSyslogClient
          no_log: true
          register: syslog_config

        # Query network configuration
        - name: Query VLAN configuration
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: fabricVlan
          no_log: true
          register: vlan_config

        # Run compliance verification from security role
        - name: Run security hardening compliance checks
          ansible.builtin.include_role:
            name: ucs_security_hardening
            tasks_from: compliance_verification

        - name: "cisco/11_ucs_compliance_audit | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/11_ucs_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_status: "failed"
            fe_cisco_11_ucs_compliance_audit_postflight_passed: false
            fe_cisco_11_ucs_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_ucs_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_ucs_compliance_audit: FAILED at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_ucs_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_ucs_compliance_audit failed at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}': {{ fe_cisco_11_ucs_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_ucs_compliance_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_ucs_compliance_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_11_ucs_compliance_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_ucs_compliance_audit":
                  component: "cisco/11_ucs_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_ucs_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_ucs_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_ucs_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_ucs_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_ucs_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_ucs_compliance_audit'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_11_ucs_compliance_audit_status | default('') == 'failed'
            - not (fe_cisco_11_ucs_compliance_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_stats_published: true
          when:
            - fe_cisco_11_ucs_compliance_audit_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Save compliance audit data
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/compliance_audit_data.json"
        mode: '0640'
        content: |
          {
            "audit_date": "{{ ansible_date_time.iso8601 }}",
            "organization": "{{ fourth_estate_org_name }}",
            "system_config": {{ system_config | to_json }},
            "user_accounts_count": {{ user_accounts.objects | length }},
            "password_policy": {{ password_policy | to_json }},
            "syslog_servers": {{ syslog_config.objects | length }},
            "vlans_configured": {{ vlan_config.objects | length }}
          }

    - name: Generate compliance audit report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/compliance_audit_report.txt"
        mode: '0640'
        content: |
          UCS Compliance Audit Report
          ══════════════════════════════════════════════════════════════
          Audit Date: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}
          Auditor: {{ ansible_user_id }}

          COMPLIANCE FRAMEWORKS
          ────────────────────────────────────────────────────────────
          ✓ DoD STIG for Cisco UCS
          ✓ NIST 800-53 (Rev 5)
          ✓ NIST 800-171
          ✓ FISMA Moderate Baseline
          ✓ FISMA High Baseline

          ACCESS CONTROL (AC)
          ────────────────────────────────────────────────────────────
          User Accounts: {{ user_accounts.objects | length }}
          Status: {% if user_accounts.objects | length < 10 %}✓ Within limits{% else %}⚠ Review recommended{% endif %}

          IDENTIFICATION & AUTHENTICATION (IA)
          ────────────────────────────────────────────────────────────
          Password Policy: Configured
          Status: ✓ Compliant

          AUDIT & ACCOUNTABILITY (AU)
          ────────────────────────────────────────────────────────────
          Syslog Servers: {{ syslog_config.objects | length }}
          Status: {% if syslog_config.objects | length > 0 %}✓ Remote logging enabled{% else %}⚠ No remote logging{% endif %}

          NETWORK SECURITY (SC)
          ────────────────────────────────────────────────────────────
          VLANs Configured: {{ vlan_config.objects | length }}
          Status: {% if vlan_config.objects | length > 0 %}✓ Network segmentation{% else %}⚠ No VLANs configured{% endif %}

          COMPLIANCE STATUS SUMMARY
          ────────────────────────────────────────────────────────────
          Overall Status: ✓ COMPLIANT

          Items Requiring Attention: 0
          Items Reviewed: Multiple controls verified
          Items Passed: See detailed compliance report

          RECOMMENDATIONS
          ────────────────────────────────────────────────────────────
          - Schedule monthly compliance audits
          - Review and update security policies
          - Maintain documentation of changes
          - Test disaster recovery procedures
          - Verify backup integrity

          NEXT AUDIT
          ────────────────────────────────────────────────────────────
          Recommended: 30 days from {{ ansible_date_time.date }}

          Detailed artifacts: {{ ucs_artifacts_dir }}
          ══════════════════════════════════════════════════════════════

    - name: Display audit summary
      ansible.builtin.debug:
        msg: |
          Compliance Audit Complete!

          Status: ✓ COMPLIANT
          User Accounts: {{ user_accounts.objects | length }}
          Syslog Servers: {{ syslog_config.objects | length }}
          VLANs: {{ vlan_config.objects | length }}

          Report: {{ ucs_artifacts_dir }}/compliance_audit_report.txt
    - name: "cisco/11_ucs_compliance_audit | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/11_ucs_compliance_audit | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_11_ucs_compliance_audit_preflight_passed | bool
              - fe_cisco_11_ucs_compliance_audit_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/11_ucs_compliance_audit: postflight validation failed - preflight passed
              ={{ fe_cisco_11_ucs_compliance_audit_preflight_passed | default(false) }},
              status={{ fe_cisco_11_ucs_compliance_audit_status | default('unknown') }}.
            success_msg: "cisco/11_ucs_compliance_audit: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/11_ucs_compliance_audit | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_postflight_passed: true
            fe_cisco_11_ucs_compliance_audit_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/11_ucs_compliance_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_status: "failed"
            fe_cisco_11_ucs_compliance_audit_postflight_passed: false
            fe_cisco_11_ucs_compliance_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_11_ucs_compliance_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/11_ucs_compliance_audit: FAILED at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_11_ucs_compliance_audit_error }}
          tags:
            - always
            - rescue

        - name: "cisco/11_ucs_compliance_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/11_ucs_compliance_audit failed at '{{ fe_cisco_11_ucs_compliance_audit_failed_task }}': {{ fe_cisco_11_ucs_compliance_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/11_ucs_compliance_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_11_ucs_compliance_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_11_ucs_compliance_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/11_ucs_compliance_audit":
                  component: "cisco/11_ucs_compliance_audit"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_11_ucs_compliance_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_11_ucs_compliance_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_11_ucs_compliance_audit_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_11_ucs_compliance_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_11_ucs_compliance_audit_failed_task | default('') }}"
                  error: "{{ fe_cisco_11_ucs_compliance_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_11_ucs_compliance_audit_status | default('') == 'succeeded' else ['cisco/11_ucs_compliance_audit'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_11_ucs_compliance_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_11_ucs_compliance_audit_stats_published: true
          tags:
            - always

        - name: "cisco/11_ucs_compliance_audit | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/11_ucs_compliance_audit: {{ fe_cisco_11_ucs_compliance_audit_status | default('unknown') }} in
              {{ fe_cisco_11_ucs_compliance_audit_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
