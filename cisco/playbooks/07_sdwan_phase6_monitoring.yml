---
# Cisco SD-WAN Phase 20: Monitoring and Telemetry
# Configure SNMPv3, syslog, streaming telemetry, and alerts
# Prerequisite: Phases 15-19 must be complete

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 20 - SD-WAN Monitoring and Telemetry
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/phase20"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/07_sdwan_phase6_monitoring | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/07_sdwan_phase6_monitoring | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_07_sdwan_phase6_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_07_sdwan_phase6_monitoring_status: "running"
            fe_cisco_07_sdwan_phase6_monitoring_preflight_passed: false
            fe_cisco_07_sdwan_phase6_monitoring_postflight_passed: false
            fe_cisco_07_sdwan_phase6_monitoring_failed_task: ""
            fe_cisco_07_sdwan_phase6_monitoring_error: ""
            fe_cisco_07_sdwan_phase6_monitoring_stats_published: false
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/07_sdwan_phase6_monitoring: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/07_sdwan_phase6_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/07_sdwan_phase6_monitoring | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/07_sdwan_phase6_monitoring: required variable '{{ item }}' is not defined."
            success_msg: "cisco/07_sdwan_phase6_monitoring: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_07_sdwan_phase6_monitoring_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/07_sdwan_phase6_monitoring | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_status: "preflight_failed"
            fe_cisco_07_sdwan_phase6_monitoring_postflight_passed: false
            fe_cisco_07_sdwan_phase6_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_07_sdwan_phase6_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/07_sdwan_phase6_monitoring: FAILED at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/07_sdwan_phase6_monitoring":
                  component: "cisco/07_sdwan_phase6_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_07_sdwan_phase6_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_07_sdwan_phase6_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else ['cisco/07_sdwan_phase6_monitoring'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_stats_published: true
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/07_sdwan_phase6_monitoring failed at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}': {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/07_sdwan_phase6_monitoring: preflight
              {{ 'passed' if fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 20 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 20: Monitoring and Telemetry
          ════════════════════════════════════════════════════════════════
          Configuring:
            ✓ SNMPv3 authPriv (STIG CISC-ND-000090 / NIST SC-8)
            ✓ Remote syslog to SIEM (STIG CISC-ND-000700 / NIST AU-2)
            ✓ Model-driven streaming telemetry
            ✓ vManage alert rules
            ✓ Fabric health monitoring
          ════════════════════════════════════════════════════════════════
          Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 20 artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/07_sdwan_phase6_monitoring | Guarded execution with rescue and always handling"
      block:

        - name: Configure SD-WAN monitoring
          ansible.builtin.include_role:
            name: sdwan_monitoring

      rescue:

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_status: "failed"
            fe_cisco_07_sdwan_phase6_monitoring_postflight_passed: false
            fe_cisco_07_sdwan_phase6_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_07_sdwan_phase6_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/07_sdwan_phase6_monitoring: FAILED at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/07_sdwan_phase6_monitoring failed at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}': {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_07_sdwan_phase6_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_07_sdwan_phase6_monitoring_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/07_sdwan_phase6_monitoring":
                  component: "cisco/07_sdwan_phase6_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_07_sdwan_phase6_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_07_sdwan_phase6_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else ['cisco/07_sdwan_phase6_monitoring'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'failed'
            - not (fe_cisco_07_sdwan_phase6_monitoring_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_stats_published: true
          when:
            - fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 20 completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/phase20_complete.txt"
        mode: '0640'
        content: |
          Phase 20: Monitoring and Telemetry - COMPLETE
          ══════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Configured:
            ✓ SNMPv3 authPriv monitoring
            ✓ Remote syslog to SIEM
            ✓ Streaming telemetry
            ✓ Alert rules
            ✓ Health monitoring

          SD-WAN Deployment Complete!
          Run compliance audit: ansible-playbook cisco/playbooks/11_sdwan_compliance_audit.yml

    - name: Display final deployment message
      ansible.builtin.debug:
        msg: |
          SD-WAN Deployment Complete — All 6 Phases Finished!
          Run full compliance audit: ansible-playbook cisco/playbooks/11_sdwan_compliance_audit.yml
    - name: "cisco/07_sdwan_phase6_monitoring | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/07_sdwan_phase6_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | bool
              - fe_cisco_07_sdwan_phase6_monitoring_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/07_sdwan_phase6_monitoring: postflight validation failed - preflight passed
              ={{ fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | default(false) }},
              status={{ fe_cisco_07_sdwan_phase6_monitoring_status | default('unknown') }}.
            success_msg: "cisco/07_sdwan_phase6_monitoring: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/07_sdwan_phase6_monitoring | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_postflight_passed: true
            fe_cisco_07_sdwan_phase6_monitoring_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_status: "failed"
            fe_cisco_07_sdwan_phase6_monitoring_postflight_passed: false
            fe_cisco_07_sdwan_phase6_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_07_sdwan_phase6_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/07_sdwan_phase6_monitoring: FAILED at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/07_sdwan_phase6_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/07_sdwan_phase6_monitoring failed at '{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task }}': {{ fe_cisco_07_sdwan_phase6_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_07_sdwan_phase6_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_07_sdwan_phase6_monitoring_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/07_sdwan_phase6_monitoring":
                  component: "cisco/07_sdwan_phase6_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_07_sdwan_phase6_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_07_sdwan_phase6_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_07_sdwan_phase6_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_07_sdwan_phase6_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_07_sdwan_phase6_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_07_sdwan_phase6_monitoring_status | default('') == 'succeeded' else ['cisco/07_sdwan_phase6_monitoring'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_07_sdwan_phase6_monitoring_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_07_sdwan_phase6_monitoring_stats_published: true
          tags:
            - always

        - name: "cisco/07_sdwan_phase6_monitoring | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/07_sdwan_phase6_monitoring: {{ fe_cisco_07_sdwan_phase6_monitoring_status | default('unknown') }} in
              {{ fe_cisco_07_sdwan_phase6_monitoring_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
