---
# Cisco UCS Validation and Health Check Playbook
# Verify UCS deployment and system health
# Run after deployment or as routine health check

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: UCS Validation and Health Check
  hosts: localhost
  gather_facts: yes
  any_errors_fatal: true
  connection: local

  vars:
    ucs_artifacts_dir: "/tmp/ucs-validation-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/10_ucs_validation | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/10_ucs_validation | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_10_ucs_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_ucs_validation_status: "running"
            fe_cisco_10_ucs_validation_preflight_passed: false
            fe_cisco_10_ucs_validation_postflight_passed: false
            fe_cisco_10_ucs_validation_failed_task: ""
            fe_cisco_10_ucs_validation_error: ""
            fe_cisco_10_ucs_validation_stats_published: false
          tags:
            - always

        - name: "cisco/10_ucs_validation | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/10_ucs_validation: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/10_ucs_validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/10_ucs_validation | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/10_ucs_validation: required variable '{{ item }}' is not defined."
            success_msg: "cisco/10_ucs_validation: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_10_ucs_validation_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/10_ucs_validation | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/10_ucs_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_status: "preflight_failed"
            fe_cisco_10_ucs_validation_postflight_passed: false
            fe_cisco_10_ucs_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_ucs_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_ucs_validation: FAILED at '{{ fe_cisco_10_ucs_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_ucs_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_ucs_validation":
                  component: "cisco/10_ucs_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_ucs_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_ucs_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_ucs_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_ucs_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_ucs_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_ucs_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_ucs_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else ['cisco/10_ucs_validation'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_stats_published: true
          tags:
            - always

        - name: "cisco/10_ucs_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_ucs_validation failed at '{{ fe_cisco_10_ucs_validation_failed_task }}': {{ fe_cisco_10_ucs_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_ucs_validation | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/10_ucs_validation: preflight
              {{ 'passed' if fe_cisco_10_ucs_validation_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display validation banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          UCS Validation and Health Check
          ════════════════════════════════════════════════════════════════
          Validating:
            ✓ System connectivity
            ✓ Configuration status
            ✓ Service profiles
            ✓ System faults
            ✓ Hardware health
            ✓ Firmware versions
            ✓ Network connectivity
            ✓ Security settings
          ════════════════════════════════════════════════════════════════

    - name: Create validation artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    # Connectivity validation
    - name: "cisco/10_ucs_validation | Guarded execution with rescue and always handling"
      block:

        - name: Test UCS Manager connectivity
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: topSystem
          no_log: true
          register: ucs_connectivity
          failed_when: false

        - name: Record connectivity status
          ansible.builtin.copy:
            dest: "{{ ucs_artifacts_dir }}/connectivity_status.json"
            mode: '0640'
            content: "{{ ucs_connectivity | to_nice_json }}"

        # System faults check
        - name: Query all system faults
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: faultInst
          no_log: true
          register: system_faults
          when: ucs_connectivity is succeeded

        - name: Analyze fault severity
          ansible.builtin.set_fact:
            critical_faults: "{{ system_faults.objects | selectattr('severity', 'equalto', 'critical') | list }}"
            major_faults: "{{ system_faults.objects | selectattr('severity', 'equalto', 'major') | list }}"
            minor_faults: "{{ system_faults.objects | selectattr('severity', 'equalto', 'minor') | list }}"
          when: ucs_connectivity is succeeded

        - name: Save fault analysis
          ansible.builtin.copy:
            dest: "{{ ucs_artifacts_dir }}/fault_analysis.json"
            mode: '0640'
            content: |
              {
                "total_faults": {{ system_faults.objects | length }},
                "critical": {{ critical_faults | length }},
                "major": {{ major_faults | length }},
                "minor": {{ minor_faults | length }},
                "timestamp": "{{ ansible_date_time.iso8601 }}"
              }
          when: ucs_connectivity is succeeded

        # Hardware health check
        - name: Query blade servers
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: computeBlade
          no_log: true
          register: blade_servers
          when: ucs_connectivity is succeeded

        - name: Query rack servers
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: computeRackUnit
          no_log: true
          register: rack_servers
          when: ucs_connectivity is succeeded

        - name: Query fabric interconnects
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: networkElement
          no_log: true
          register: fabric_interconnects
          when: ucs_connectivity is succeeded

        # Service profile validation
        - name: Query service profiles
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: lsServer
            distinguished_names: "org-root/org-{{ fourth_estate_org_name }}"
          no_log: true
          register: service_profiles
          when: ucs_connectivity is succeeded

        # Firmware version check
        - name: Query firmware versions
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: firmwareRunning
          no_log: true
          register: firmware_versions
          when: ucs_connectivity is succeeded

        # Power and thermal
        - name: Query power supplies
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: equipmentPsu
          no_log: true
          register: power_supplies
          when: ucs_connectivity is succeeded

        - name: "cisco/10_ucs_validation | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/10_ucs_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_status: "failed"
            fe_cisco_10_ucs_validation_postflight_passed: false
            fe_cisco_10_ucs_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_ucs_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_ucs_validation: FAILED at '{{ fe_cisco_10_ucs_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_ucs_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_ucs_validation failed at '{{ fe_cisco_10_ucs_validation_failed_task }}': {{ fe_cisco_10_ucs_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_ucs_validation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_ucs_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_10_ucs_validation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_ucs_validation":
                  component: "cisco/10_ucs_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_ucs_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_ucs_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_ucs_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_ucs_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_ucs_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_ucs_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_ucs_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else ['cisco/10_ucs_validation'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_10_ucs_validation_status | default('') == 'failed'
            - not (fe_cisco_10_ucs_validation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_stats_published: true
          when:
            - fe_cisco_10_ucs_validation_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate validation report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/validation_report.txt"
        mode: '0640'
        content: |
          UCS Validation and Health Check Report
          ══════════════════════════════════════════════════════════════
          Generated: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}

          CONNECTIVITY
          ────────────────────────────────────────────────────────────
          UCS Manager: {{ ucs_connectivity is succeeded | ternary('✓ Connected', '✗ Failed') }}

          {% if ucs_connectivity is succeeded %}
          SYSTEM FAULTS
          ────────────────────────────────────────────────────────────
          Total Faults: {{ system_faults.objects | length }}
          Critical: {{ critical_faults | length }}
          Major: {{ major_faults | length }}
          Minor: {{ minor_faults | length }}

          {% if critical_faults | length > 0 %}
          ⚠ CRITICAL FAULTS DETECTED - Immediate attention required
          {% elif major_faults | length > 0 %}
          ⚠ MAJOR FAULTS DETECTED - Attention recommended
          {% else %}
          ✓ No critical or major faults
          {% endif %}

          HARDWARE INVENTORY
          ────────────────────────────────────────────────────────────
          Blade Servers: {{ blade_servers.objects | length }}
          Rack Servers: {{ rack_servers.objects | length }}
          Fabric Interconnects: {{ fabric_interconnects.objects | length }}
          Power Supplies: {{ power_supplies.objects | length }}

          SERVICE PROFILES
          ────────────────────────────────────────────────────────────
          Total Profiles: {{ service_profiles.objects | length }}
          Organization: {{ fourth_estate_org_name }}

          FIRMWARE VERSIONS
          ────────────────────────────────────────────────────────────
          Components: {{ firmware_versions.objects | length }}
          (See firmware_versions.json for details)

          VALIDATION STATUS
          ────────────────────────────────────────────────────────────
          Overall Health: {% if critical_faults | length == 0 and major_faults | length == 0 %}✓ HEALTHY{% else %}⚠ ATTENTION NEEDED{% endif %}

          RECOMMENDATIONS
          ────────────────────────────────────────────────────────────
          {% if critical_faults | length > 0 %}
          - Address critical faults immediately
          {% endif %}
          {% if major_faults | length > 0 %}
          - Review and resolve major faults
          {% endif %}
          - Review detailed fault analysis
          - Schedule regular health checks
          - Verify backup completion
          - Test disaster recovery procedures
          {% endif %}

          Artifacts saved to: {{ ucs_artifacts_dir }}
          ══════════════════════════════════════════════════════════════

    - name: Display validation summary
      ansible.builtin.debug:
        msg: |
          Validation Complete!

          Connectivity: {{ ucs_connectivity is succeeded | ternary('✓', '✗') }}
          {% if ucs_connectivity is succeeded %}
          Total Faults: {{ system_faults.objects | length }}
          Critical: {{ critical_faults | length }}
          Major: {{ major_faults | length }}

          Artifacts: {{ ucs_artifacts_dir }}
          {% endif %}
    - name: "cisco/10_ucs_validation | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/10_ucs_validation | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_10_ucs_validation_preflight_passed | bool
              - fe_cisco_10_ucs_validation_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/10_ucs_validation: postflight validation failed - preflight passed
              ={{ fe_cisco_10_ucs_validation_preflight_passed | default(false) }},
              status={{ fe_cisco_10_ucs_validation_status | default('unknown') }}.
            success_msg: "cisco/10_ucs_validation: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/10_ucs_validation | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_postflight_passed: true
            fe_cisco_10_ucs_validation_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/10_ucs_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_status: "failed"
            fe_cisco_10_ucs_validation_postflight_passed: false
            fe_cisco_10_ucs_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_ucs_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_ucs_validation: FAILED at '{{ fe_cisco_10_ucs_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_ucs_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_ucs_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_ucs_validation failed at '{{ fe_cisco_10_ucs_validation_failed_task }}': {{ fe_cisco_10_ucs_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_ucs_validation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_ucs_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_10_ucs_validation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_ucs_validation":
                  component: "cisco/10_ucs_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_ucs_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_ucs_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_ucs_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_ucs_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_ucs_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_ucs_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_ucs_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_ucs_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_ucs_validation_status | default('') == 'succeeded' else ['cisco/10_ucs_validation'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_10_ucs_validation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_ucs_validation_stats_published: true
          tags:
            - always

        - name: "cisco/10_ucs_validation | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/10_ucs_validation: {{ fe_cisco_10_ucs_validation_status | default('unknown') }} in
              {{ fe_cisco_10_ucs_validation_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
