---
# Cisco SD-WAN Phase 15: vManage Controller Initial Deployment
# Deploy and initialize the vManage management controller
# Use for initial deployment or vManage-only configuration updates

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 15 - SD-WAN vManage Controller Deployment
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/phase15"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/02_sdwan_phase1_vmanage_deploy | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_status: "running"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed: false
            fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed: false
            fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task: ""
            fe_cisco_02_sdwan_phase1_vmanage_deploy_error: ""
            fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published: false
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/02_sdwan_phase1_vmanage_deploy: required variable '{{ item }}' is not defined."
            success_msg: "cisco/02_sdwan_phase1_vmanage_deploy: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_status: "preflight_failed"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed: false
            fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: FAILED at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_sdwan_phase1_vmanage_deploy":
                  component: "cisco/02_sdwan_phase1_vmanage_deploy"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else ['cisco/02_sdwan_phase1_vmanage_deploy'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published: true
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy failed at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}': {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: preflight
              {{ 'passed' if fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 15 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 15: vManage Controller Deployment
          ════════════════════════════════════════════════════════════════
          Deploying:
            ✓ vManage system settings (org, vBond address, timezone)
            ✓ PKI certificate configuration
            ✓ Management VPN (VPN 512) interface
            ✓ vManage HA cluster (if enabled)
          ════════════════════════════════════════════════════════════════
          Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 15 artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/02_sdwan_phase1_vmanage_deploy | Guarded execution with rescue and always handling"
      block:

        - name: Deploy vManage controller
          ansible.builtin.include_role:
            name: sdwan_vmanage_deploy

      rescue:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_status: "failed"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed: false
            fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: FAILED at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy failed at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}': {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_02_sdwan_phase1_vmanage_deploy_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_sdwan_phase1_vmanage_deploy":
                  component: "cisco/02_sdwan_phase1_vmanage_deploy"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else ['cisco/02_sdwan_phase1_vmanage_deploy'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'failed'
            - not (fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published: true
          when:
            - fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 15 completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/phase15_complete.txt"
        mode: '0640'
        content: |
          Phase 15: vManage Controller Deployment - COMPLETE
          ══════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Deployed:
            ✓ vManage system configuration
            ✓ PKI certificate configuration
            ✓ VPN 512 management interface
            ✓ HA cluster (if enabled)

          Next Phase: Run 03_sdwan_phase2_vmanage_config.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 15 Complete!
          Next: ansible-playbook cisco/playbooks/03_sdwan_phase2_vmanage_config.yml
    - name: "cisco/02_sdwan_phase1_vmanage_deploy | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | bool
              - fe_cisco_02_sdwan_phase1_vmanage_deploy_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: postflight validation failed - preflight passed
              ={{ fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | default(false) }},
              status={{ fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('unknown') }}.
            success_msg: "cisco/02_sdwan_phase1_vmanage_deploy: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed: true
            fe_cisco_02_sdwan_phase1_vmanage_deploy_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_status: "failed"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed: false
            fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: FAILED at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy failed at '{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task }}': {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_02_sdwan_phase1_vmanage_deploy_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_sdwan_phase1_vmanage_deploy":
                  component: "cisco/02_sdwan_phase1_vmanage_deploy"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('') == 'succeeded' else ['cisco/02_sdwan_phase1_vmanage_deploy'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_sdwan_phase1_vmanage_deploy_stats_published: true
          tags:
            - always

        - name: "cisco/02_sdwan_phase1_vmanage_deploy | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/02_sdwan_phase1_vmanage_deploy: {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_status | default('unknown') }} in
              {{ fe_cisco_02_sdwan_phase1_vmanage_deploy_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
