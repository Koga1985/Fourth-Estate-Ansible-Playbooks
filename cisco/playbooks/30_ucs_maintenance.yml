---
# Cisco UCS Maintenance and Configuration Updates
# For routine maintenance, updates, and configuration changes
# Safe for production use with proper change control

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: UCS Maintenance and Configuration Updates
  hosts: localhost
  gather_facts: yes
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    ucs_artifacts_dir: "/tmp/ucs-maintenance-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate"

    # Maintenance tasks - set to true for tasks to perform
    perform_backup: true
    perform_health_check: true
    update_firmware: false  # Requires careful planning
    update_security_policies: false
    update_network_config: false

  pre_tasks:
    - name: "cisco/30_ucs_maintenance | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/30_ucs_maintenance | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_30_ucs_maintenance_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_30_ucs_maintenance_status: "running"
            fe_cisco_30_ucs_maintenance_preflight_passed: false
            fe_cisco_30_ucs_maintenance_postflight_passed: false
            fe_cisco_30_ucs_maintenance_failed_task: ""
            fe_cisco_30_ucs_maintenance_error: ""
            fe_cisco_30_ucs_maintenance_stats_published: false
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/30_ucs_maintenance: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/30_ucs_maintenance: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/30_ucs_maintenance | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/30_ucs_maintenance: required variable '{{ item }}' is not defined."
            success_msg: "cisco/30_ucs_maintenance: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_30_ucs_maintenance_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/30_ucs_maintenance | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/30_ucs_maintenance | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_status: "preflight_failed"
            fe_cisco_30_ucs_maintenance_postflight_passed: false
            fe_cisco_30_ucs_maintenance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_30_ucs_maintenance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/30_ucs_maintenance: FAILED at '{{ fe_cisco_30_ucs_maintenance_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_30_ucs_maintenance_error }}
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/30_ucs_maintenance":
                  component: "cisco/30_ucs_maintenance"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_30_ucs_maintenance_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_30_ucs_maintenance_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_30_ucs_maintenance_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_30_ucs_maintenance_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_30_ucs_maintenance_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_30_ucs_maintenance_failed_task | default('') }}"
                  error: "{{ fe_cisco_30_ucs_maintenance_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else ['cisco/30_ucs_maintenance'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_stats_published: true
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/30_ucs_maintenance failed at '{{ fe_cisco_30_ucs_maintenance_failed_task }}': {{ fe_cisco_30_ucs_maintenance_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/30_ucs_maintenance | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/30_ucs_maintenance: preflight
              {{ 'passed' if fe_cisco_30_ucs_maintenance_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display maintenance banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          UCS Maintenance and Configuration Updates
          ════════════════════════════════════════════════════════════════
          Maintenance Window: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}

          Scheduled Tasks:
            - Backup: {{ perform_backup }}
            - Health Check: {{ perform_health_check }}
            - Firmware Update: {{ update_firmware }}
            - Security Policy Update: {{ update_security_policies }}
            - Network Config Update: {{ update_network_config }}

          Apply Changes: {{ apply_changes }}
          ════════════════════════════════════════════════════════════════

    - name: Create maintenance artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Record maintenance start
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/maintenance_start.txt"
        mode: '0640'
        content: |
          Maintenance Window Start: {{ ansible_date_time.iso8601 }}
          Initiated by: {{ ansible_user_id }}
          Organization: {{ fourth_estate_org_name }}

  tasks:
    # Pre-maintenance backup
    - name: "cisco/30_ucs_maintenance | Guarded execution with rescue and always handling"
      block:

        - name: Perform pre-maintenance backup
          when: perform_backup | bool
          block:
            - name: Display backup message
              ansible.builtin.debug:
                msg: "Performing pre-maintenance backup..."

            - name: Trigger immediate backup
              cisco.ucs.ucs_backup_immediate:
                hostname: "{{ ucs_hostname }}"
                username: "{{ ucs_username }}"
                password: "{{ ucs_password }}"
                type: "full-state"
                protocol: "scp"
                remote_file: "{{ backup_remote_path }}/maintenance-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
                hostname_remote: "{{ backup_server }}"
                username_remote: "{{ backup_username }}"
                password_remote: "{{ backup_password }}"
              when: apply_changes | bool
              no_log: true

        # Health check
        - name: Perform system health check
          when: perform_health_check | bool
          block:
            - name: Query system faults
              cisco.ucs.ucs_query:
                hostname: "{{ ucs_hostname }}"
                username: "{{ ucs_username }}"
                password: "{{ ucs_password }}"
                class_ids: faultInst
              no_log: true
              register: pre_maintenance_faults

            - name: Save pre-maintenance health
              ansible.builtin.copy:
                dest: "{{ ucs_artifacts_dir }}/pre_maintenance_health.json"
                mode: '0640'
                content: "{{ pre_maintenance_faults | to_nice_json }}"

        # Firmware updates
        - name: Update firmware
          when: update_firmware | bool
          block:
            - name: Display firmware update warning
              ansible.builtin.debug:
                msg: |
                  ⚠ FIRMWARE UPDATE SELECTED
                  This operation requires careful planning and may cause service disruption.
                  Ensure proper change control and approval before proceeding.

            - name: Include firmware management tasks
              ansible.builtin.include_role:
                name: ucs_prod_infrastructure
                tasks_from: firmware_management

        # Security policy updates
        - name: Update security policies
          when: update_security_policies | bool
          block:
            - name: Apply updated security hardening
              ansible.builtin.include_role:
                name: ucs_security_hardening

        # Network configuration updates
        - name: Update network configuration
          when: update_network_config | bool
          block:
            - name: Apply updated networking configuration
              ansible.builtin.include_role:
                name: ucs_prod_networking

      rescue:

        - name: "cisco/30_ucs_maintenance | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_status: "failed"
            fe_cisco_30_ucs_maintenance_postflight_passed: false
            fe_cisco_30_ucs_maintenance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_30_ucs_maintenance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/30_ucs_maintenance: FAILED at '{{ fe_cisco_30_ucs_maintenance_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_30_ucs_maintenance_error }}
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/30_ucs_maintenance failed at '{{ fe_cisco_30_ucs_maintenance_failed_task }}': {{ fe_cisco_30_ucs_maintenance_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/30_ucs_maintenance | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_30_ucs_maintenance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_30_ucs_maintenance_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/30_ucs_maintenance":
                  component: "cisco/30_ucs_maintenance"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_30_ucs_maintenance_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_30_ucs_maintenance_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_30_ucs_maintenance_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_30_ucs_maintenance_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_30_ucs_maintenance_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_30_ucs_maintenance_failed_task | default('') }}"
                  error: "{{ fe_cisco_30_ucs_maintenance_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else ['cisco/30_ucs_maintenance'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_30_ucs_maintenance_status | default('') == 'failed'
            - not (fe_cisco_30_ucs_maintenance_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_stats_published: true
          when:
            - fe_cisco_30_ucs_maintenance_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    # Post-maintenance validation
    - name: Perform post-maintenance validation
      when: apply_changes | bool
      block:
        - name: Wait for system stabilization
          ansible.builtin.pause:
            seconds: 30

        - name: Query post-maintenance faults
          cisco.ucs.ucs_query:
            hostname: "{{ ucs_hostname }}"
            username: "{{ ucs_username }}"
            password: "{{ ucs_password }}"
            class_ids: faultInst
          no_log: true
          register: post_maintenance_faults

        - name: Save post-maintenance health
          ansible.builtin.copy:
            dest: "{{ ucs_artifacts_dir }}/post_maintenance_health.json"
            mode: '0640'
            content: "{{ post_maintenance_faults | to_nice_json }}"

    - name: Generate maintenance report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/maintenance_report.txt"
        mode: '0640'
        content: |
          UCS Maintenance Report
          ══════════════════════════════════════════════════════════════
          Start Time: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}
          Performed By: {{ ansible_user_id }}
          Status: {{ apply_changes | ternary('COMPLETED', 'DRY RUN') }}

          MAINTENANCE TASKS
          ────────────────────────────────────────────────────────────
          Pre-Maintenance Backup: {{ perform_backup | ternary('✓', '-') }}
          Health Check: {{ perform_health_check | ternary('✓', '-') }}
          Firmware Update: {{ update_firmware | ternary('✓', '-') }}
          Security Policy Update: {{ update_security_policies | ternary('✓', '-') }}
          Network Config Update: {{ update_network_config | ternary('✓', '-') }}

          {% if apply_changes %}
          SYSTEM HEALTH
          ────────────────────────────────────────────────────────────
          Pre-Maintenance Faults: {{ pre_maintenance_faults.objects | length | default('N/A') }}
          Post-Maintenance Faults: {{ post_maintenance_faults.objects | length | default('N/A') }}

          {% if post_maintenance_faults.objects | length > pre_maintenance_faults.objects | length %}
          ⚠ New faults detected - review required
          {% else %}
          ✓ No new faults introduced
          {% endif %}
          {% endif %}

          RECOMMENDATIONS
          ────────────────────────────────────────────────────────────
          - Review post-maintenance health check
          - Verify all services operational
          - Monitor system for 24 hours
          - Update change management documentation
          - Schedule follow-up validation

          Artifacts: {{ ucs_artifacts_dir }}
          ══════════════════════════════════════════════════════════════

    - name: Display maintenance completion
      ansible.builtin.debug:
        msg: |
          Maintenance {{ apply_changes | ternary('Completed', 'Planned') }}!

          {% if apply_changes %}
          Review artifacts: {{ ucs_artifacts_dir }}
          Monitor system for 24 hours
          {% else %}
          This was a dry run. Set apply_changes=true to execute.
          {% endif %}
    - name: "cisco/30_ucs_maintenance | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/30_ucs_maintenance | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_30_ucs_maintenance_preflight_passed | bool
              - fe_cisco_30_ucs_maintenance_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/30_ucs_maintenance: postflight validation failed - preflight passed
              ={{ fe_cisco_30_ucs_maintenance_preflight_passed | default(false) }},
              status={{ fe_cisco_30_ucs_maintenance_status | default('unknown') }}.
            success_msg: "cisco/30_ucs_maintenance: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/30_ucs_maintenance | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_postflight_passed: true
            fe_cisco_30_ucs_maintenance_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/30_ucs_maintenance | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_status: "failed"
            fe_cisco_30_ucs_maintenance_postflight_passed: false
            fe_cisco_30_ucs_maintenance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_30_ucs_maintenance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/30_ucs_maintenance: FAILED at '{{ fe_cisco_30_ucs_maintenance_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_30_ucs_maintenance_error }}
          tags:
            - always
            - rescue

        - name: "cisco/30_ucs_maintenance | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/30_ucs_maintenance failed at '{{ fe_cisco_30_ucs_maintenance_failed_task }}': {{ fe_cisco_30_ucs_maintenance_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/30_ucs_maintenance | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_30_ucs_maintenance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_30_ucs_maintenance_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/30_ucs_maintenance":
                  component: "cisco/30_ucs_maintenance"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_30_ucs_maintenance_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_30_ucs_maintenance_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_30_ucs_maintenance_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_30_ucs_maintenance_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_30_ucs_maintenance_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_30_ucs_maintenance_failed_task | default('') }}"
                  error: "{{ fe_cisco_30_ucs_maintenance_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_30_ucs_maintenance_status | default('') == 'succeeded' else ['cisco/30_ucs_maintenance'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_30_ucs_maintenance_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_30_ucs_maintenance_stats_published: true
          tags:
            - always

        - name: "cisco/30_ucs_maintenance | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/30_ucs_maintenance: {{ fe_cisco_30_ucs_maintenance_status | default('unknown') }} in
              {{ fe_cisco_30_ucs_maintenance_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
