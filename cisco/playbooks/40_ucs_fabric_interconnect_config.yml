---
# Cisco UCS Fabric Interconnect Configuration Playbook
# Configures Fabric Interconnects A and B for Fourth Estate deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Configure Cisco UCS Fabric Interconnects
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false  # Set to true to apply configurations
    ucs_artifacts_dir: "/tmp/ucs-fabric-interconnect-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate"

    # Fabric Interconnect Configuration
    fi_cluster_mode: "ha"
    fi_mgmt_subnet: "255.255.255.0"

    # Override these with your environment values or use vault
    # fi_a_mgmt_ip: "192.168.1.10"
    # fi_b_mgmt_ip: "192.168.1.11"
    # fi_mgmt_gateway: "192.168.1.1"

  pre_tasks:
    - name: "cisco/40_ucs_fabric_interconnect_config | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/40_ucs_fabric_interconnect_config | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_40_ucs_fabric_interconnect_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_status: "running"
            fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed: false
            fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed: false
            fe_cisco_40_ucs_fabric_interconnect_config_failed_task: ""
            fe_cisco_40_ucs_fabric_interconnect_config_error: ""
            fe_cisco_40_ucs_fabric_interconnect_config_stats_published: false
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/40_ucs_fabric_interconnect_config: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/40_ucs_fabric_interconnect_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/40_ucs_fabric_interconnect_config | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/40_ucs_fabric_interconnect_config: required variable '{{ item }}' is not defined."
            success_msg: "cisco/40_ucs_fabric_interconnect_config: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_40_ucs_fabric_interconnect_config_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/40_ucs_fabric_interconnect_config | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_status: "preflight_failed"
            fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed: false
            fe_cisco_40_ucs_fabric_interconnect_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config: FAILED at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/40_ucs_fabric_interconnect_config":
                  component: "cisco/40_ucs_fabric_interconnect_config"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_40_ucs_fabric_interconnect_config_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task | default('') }}"
                  error: "{{ fe_cisco_40_ucs_fabric_interconnect_config_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else ['cisco/40_ucs_fabric_interconnect_config'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_stats_published: true
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config failed at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}': {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config: preflight
              {{ 'passed' if fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Fabric Interconnect configuration banner
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   Cisco UCS Fabric Interconnect Configuration                ║
          ║   Fourth Estate Production Deployment                        ║
          ╚══════════════════════════════════════════════════════════════╝

          Configuration Mode: {{ 'APPLY CHANGES' if apply_changes else 'DRY-RUN (no changes)' }}
          Cluster Mode: {{ fi_cluster_mode }}
          Artifacts Directory: {{ ucs_artifacts_dir }}

          ⚠️  WARNING: This playbook configures Fabric Interconnects
          ⚠️  Changes may affect network connectivity
          ⚠️  Ensure you have console access before proceeding

    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0755'

    - name: Verify UCS Manager connectivity
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: topSystem
      no_log: true
      register: ucs_connection_test
      failed_when: false

    - name: Fail if UCS Manager is not reachable
      ansible.builtin.fail:
        msg: |
          Cannot connect to UCS Manager at {{ ucs_hostname }}
          Please verify:
          - UCS Manager is accessible
          - Credentials are correct
          - Network connectivity is available
      when: ucs_connection_test.failed

    - name: Display UCS Manager information
      ansible.builtin.debug:
        msg: |
          Connected to UCS Manager:
          - Name: {{ ucs_connection_test.objects[0].name }}
          - Address: {{ ucs_connection_test.objects[0].address }}
          - Version: {{ ucs_connection_test.objects[0].version }}

  tasks:
    - name: "cisco/40_ucs_fabric_interconnect_config | Guarded execution with rescue and always handling"
      block:

        - name: Configure Fabric Interconnects
          ansible.builtin.include_role:
            name: ucs_prod_infrastructure
            tasks_from: fabric_interconnects
          tags:
            - fabric_interconnects
            - fi_config

        - name: "cisco/40_ucs_fabric_interconnect_config | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_status: "failed"
            fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed: false
            fe_cisco_40_ucs_fabric_interconnect_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config: FAILED at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config failed at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}': {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_40_ucs_fabric_interconnect_config_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/40_ucs_fabric_interconnect_config":
                  component: "cisco/40_ucs_fabric_interconnect_config"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_40_ucs_fabric_interconnect_config_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task | default('') }}"
                  error: "{{ fe_cisco_40_ucs_fabric_interconnect_config_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else ['cisco/40_ucs_fabric_interconnect_config'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'failed'
            - not (fe_cisco_40_ucs_fabric_interconnect_config_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_stats_published: true
          when:
            - fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   Fabric Interconnect Configuration Complete                 ║
          ╚══════════════════════════════════════════════════════════════╝

          Status: {{ 'APPLIED' if apply_changes else 'DRY-RUN' }}
          Artifacts: {{ ucs_artifacts_dir }}

          {% if not apply_changes %}
          ⚠️  DRY-RUN MODE: No changes were applied
          ⚠️  Review the configuration and set apply_changes=true to apply
          {% else %}
          ✓ Fabric Interconnect configuration has been applied
          ✓ Review the artifacts directory for details
          {% endif %}

          Reports Generated:
          - fabric_interconnect_config.txt

    - name: List generated artifacts
      ansible.builtin.find:
        paths: "{{ ucs_artifacts_dir }}"
        patterns: "*"
      register: artifact_files

    - name: Display artifact locations
      ansible.builtin.debug:
        msg: "{{ item.path }}"
      loop: "{{ artifact_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
    - name: "cisco/40_ucs_fabric_interconnect_config | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/40_ucs_fabric_interconnect_config | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | bool
              - fe_cisco_40_ucs_fabric_interconnect_config_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/40_ucs_fabric_interconnect_config: postflight validation failed - preflight passed
              ={{ fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | default(false) }},
              status={{ fe_cisco_40_ucs_fabric_interconnect_config_status | default('unknown') }}.
            success_msg: "cisco/40_ucs_fabric_interconnect_config: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/40_ucs_fabric_interconnect_config | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed: true
            fe_cisco_40_ucs_fabric_interconnect_config_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_status: "failed"
            fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed: false
            fe_cisco_40_ucs_fabric_interconnect_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config: FAILED at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          tags:
            - always
            - rescue

        - name: "cisco/40_ucs_fabric_interconnect_config | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config failed at '{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task }}': {{ fe_cisco_40_ucs_fabric_interconnect_config_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_40_ucs_fabric_interconnect_config_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/40_ucs_fabric_interconnect_config":
                  component: "cisco/40_ucs_fabric_interconnect_config"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_40_ucs_fabric_interconnect_config_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_40_ucs_fabric_interconnect_config_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_40_ucs_fabric_interconnect_config_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_40_ucs_fabric_interconnect_config_failed_task | default('') }}"
                  error: "{{ fe_cisco_40_ucs_fabric_interconnect_config_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_40_ucs_fabric_interconnect_config_status | default('') == 'succeeded' else ['cisco/40_ucs_fabric_interconnect_config'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_40_ucs_fabric_interconnect_config_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_40_ucs_fabric_interconnect_config_stats_published: true
          tags:
            - always

        - name: "cisco/40_ucs_fabric_interconnect_config | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/40_ucs_fabric_interconnect_config: {{ fe_cisco_40_ucs_fabric_interconnect_config_status | default('unknown') }} in
              {{ fe_cisco_40_ucs_fabric_interconnect_config_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
