---
# Cisco Cyber Vision - Phase 4: Security Hardening (DoD STIG / NIST 800-53)
# Authentication, TLS, RBAC, session management, audit logging, banners
#
# Usage:
#   # Dry-run (shows what would change)
#   ansible-playbook -i inventory playbooks/05_cv_phase4_security.yml --ask-vault-pass
#
#   # Apply all STIG controls
#   ansible-playbook -i inventory playbooks/05_cv_phase4_security.yml \
#     -e "apply_changes=true" --ask-vault-pass
#
#   # Apply only CAT I (critical) controls
#   ansible-playbook -i inventory playbooks/05_cv_phase4_security.yml \
#     --tags stig_cat1 -e "apply_changes=true" --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cyber Vision Phase 4 - Security Hardening
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    apply_changes: false
    artifacts_dir: "/tmp/cv-artifacts"
    stig_cat1_enabled: true
    stig_cat2_enabled: true
    stig_cat3_enabled: true

  pre_tasks:
    - name: "cisco/05_cv_phase4_security | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/05_cv_phase4_security | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_05_cv_phase4_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_cv_phase4_security_status: "running"
            fe_cisco_05_cv_phase4_security_preflight_passed: false
            fe_cisco_05_cv_phase4_security_postflight_passed: false
            fe_cisco_05_cv_phase4_security_failed_task: ""
            fe_cisco_05_cv_phase4_security_error: ""
            fe_cisco_05_cv_phase4_security_stats_published: false
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/05_cv_phase4_security: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/05_cv_phase4_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_cv_phase4_security | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/05_cv_phase4_security: required variable '{{ item }}' is not defined."
            success_msg: "cisco/05_cv_phase4_security: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_05_cv_phase4_security_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_cv_phase4_security | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/05_cv_phase4_security | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_status: "preflight_failed"
            fe_cisco_05_cv_phase4_security_postflight_passed: false
            fe_cisco_05_cv_phase4_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_cv_phase4_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_cv_phase4_security: FAILED at '{{ fe_cisco_05_cv_phase4_security_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_cv_phase4_security_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_cv_phase4_security":
                  component: "cisco/05_cv_phase4_security"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_cv_phase4_security_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_cv_phase4_security_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_cv_phase4_security_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_cv_phase4_security_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_cv_phase4_security_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_cv_phase4_security_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_cv_phase4_security_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else ['cisco/05_cv_phase4_security'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_stats_published: true
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_cv_phase4_security failed at '{{ fe_cisco_05_cv_phase4_security_failed_task }}': {{ fe_cisco_05_cv_phase4_security_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_cv_phase4_security | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/05_cv_phase4_security: preflight
              {{ 'passed' if fe_cisco_05_cv_phase4_security_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: '0750'
      tags: ['always']

  roles:
    - role: cybervision_security_hardening
      tags: ['security', 'stig', 'nist', 'phase4']
  post_tasks:
    - name: "cisco/05_cv_phase4_security | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/05_cv_phase4_security | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_05_cv_phase4_security_preflight_passed | bool
              - fe_cisco_05_cv_phase4_security_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/05_cv_phase4_security: postflight validation failed - preflight passed
              ={{ fe_cisco_05_cv_phase4_security_preflight_passed | default(false) }},
              status={{ fe_cisco_05_cv_phase4_security_status | default('unknown') }}.
            success_msg: "cisco/05_cv_phase4_security: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/05_cv_phase4_security | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_postflight_passed: true
            fe_cisco_05_cv_phase4_security_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/05_cv_phase4_security | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_status: "failed"
            fe_cisco_05_cv_phase4_security_postflight_passed: false
            fe_cisco_05_cv_phase4_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_cv_phase4_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_cv_phase4_security: FAILED at '{{ fe_cisco_05_cv_phase4_security_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_cv_phase4_security_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_cv_phase4_security failed at '{{ fe_cisco_05_cv_phase4_security_failed_task }}': {{ fe_cisco_05_cv_phase4_security_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_cv_phase4_security | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_cv_phase4_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_cv_phase4_security_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_cv_phase4_security":
                  component: "cisco/05_cv_phase4_security"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_cv_phase4_security_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_cv_phase4_security_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_cv_phase4_security_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_cv_phase4_security_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_cv_phase4_security_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_cv_phase4_security_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_cv_phase4_security_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else ['cisco/05_cv_phase4_security'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_05_cv_phase4_security_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_stats_published: true
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/05_cv_phase4_security: {{ fe_cisco_05_cv_phase4_security_status | default('unknown') }} in
              {{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "cisco/05_cv_phase4_security | Guarded execution with rescue and always handling"
      block:

        - name: "cisco/05_cv_phase4_security | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/05_cv_phase4_security | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_status: "failed"
            fe_cisco_05_cv_phase4_security_postflight_passed: false
            fe_cisco_05_cv_phase4_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_cv_phase4_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_cv_phase4_security: FAILED at '{{ fe_cisco_05_cv_phase4_security_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_cv_phase4_security_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_cv_phase4_security | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_cv_phase4_security failed at '{{ fe_cisco_05_cv_phase4_security_failed_task }}': {{ fe_cisco_05_cv_phase4_security_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_cv_phase4_security | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_cv_phase4_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_cv_phase4_security_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_cv_phase4_security":
                  component: "cisco/05_cv_phase4_security"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_cv_phase4_security_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_cv_phase4_security_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_cv_phase4_security_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_cv_phase4_security_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_cv_phase4_security_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_cv_phase4_security_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_cv_phase4_security_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_cv_phase4_security_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_cv_phase4_security_status | default('') == 'succeeded' else ['cisco/05_cv_phase4_security'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_05_cv_phase4_security_status | default('') == 'failed'
            - not (fe_cisco_05_cv_phase4_security_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_cv_phase4_security | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_cv_phase4_security_stats_published: true
          when:
            - fe_cisco_05_cv_phase4_security_status | default('') == 'failed'
          tags:
            - always
