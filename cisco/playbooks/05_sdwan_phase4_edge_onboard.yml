            fe_cisco_05_sdwan_phase4_edge_onboard_status: "failed"
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard: FAILED at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard failed at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}': {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_sdwan_phase4_edge_onboard_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_sdwan_phase4_edge_onboard":
                  component: "cisco/05_sdwan_phase4_edge_onboard"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
