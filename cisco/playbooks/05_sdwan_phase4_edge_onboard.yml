---
# Cisco SD-WAN Phase 18: Edge Device Onboarding
# Onboard vEdge and cEdge routers to the SD-WAN fabric
# Prerequisite: Phase 17 must be complete

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 18 - SD-WAN Edge Device Onboarding
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/phase18"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/05_sdwan_phase4_edge_onboard | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_status: "running"
            fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_failed_task: ""
            fe_cisco_05_sdwan_phase4_edge_onboard_error: ""
            fe_cisco_05_sdwan_phase4_edge_onboard_stats_published: false
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/05_sdwan_phase4_edge_onboard: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/05_sdwan_phase4_edge_onboard: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_sdwan_phase4_edge_onboard | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/05_sdwan_phase4_edge_onboard: required variable '{{ item }}' is not defined."
            success_msg: "cisco/05_sdwan_phase4_edge_onboard: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_sdwan_phase4_edge_onboard | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_status: "preflight_failed"
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard: FAILED at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_sdwan_phase4_edge_onboard":
                  component: "cisco/05_sdwan_phase4_edge_onboard"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else ['cisco/05_sdwan_phase4_edge_onboard'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_stats_published: true
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard failed at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}': {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard: preflight
              {{ 'passed' if fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "cisco/05_sdwan_phase4_edge_onboard | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display Phase 18 banner
          ansible.builtin.debug:
            msg: |
              ════════════════════════════════════════════════════════════════
              PHASE 18: Edge Device Onboarding
              ════════════════════════════════════════════════════════════════
              Onboarding:
                ✓ Device registration in vManage inventory
                ✓ Day-0 bootstrap configuration generation
                ✓ Device template attachment
                ✓ Variable injection per device
                ✓ Sync status validation
              ════════════════════════════════════════════════════════════════
              Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
              ════════════════════════════════════════════════════════════════

        - name: Create Phase 18 artifacts directory
          ansible.builtin.file:
            path: "{{ sdwan_artifacts_dir }}"
            state: directory
            mode: '0750'

        - name: "cisco/05_sdwan_phase4_edge_onboard | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_status: "failed"
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard: FAILED at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard failed at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}': {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_sdwan_phase4_edge_onboard_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_sdwan_phase4_edge_onboard":
                  component: "cisco/05_sdwan_phase4_edge_onboard"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else ['cisco/05_sdwan_phase4_edge_onboard'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'failed'
            - not (fe_cisco_05_sdwan_phase4_edge_onboard_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_stats_published: true
          when:
            - fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "cisco/05_sdwan_phase4_edge_onboard | Guarded execution with rescue and always handling"
      block:

        - name: Onboard edge devices
          ansible.builtin.include_role:
            name: sdwan_vedge_onboard

        - name: "cisco/05_sdwan_phase4_edge_onboard | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_status: "failed"
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: false
            fe_cisco_05_sdwan_phase4_edge_onboard_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard: FAILED at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_sdwan_phase4_edge_onboard failed at '{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task }}': {{ fe_cisco_05_sdwan_phase4_edge_onboard_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_sdwan_phase4_edge_onboard_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_sdwan_phase4_edge_onboard":
                  component: "cisco/05_sdwan_phase4_edge_onboard"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_sdwan_phase4_edge_onboard_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'succeeded' else ['cisco/05_sdwan_phase4_edge_onboard'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'failed'
            - not (fe_cisco_05_sdwan_phase4_edge_onboard_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_sdwan_phase4_edge_onboard | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_stats_published: true
          when:
            - fe_cisco_05_sdwan_phase4_edge_onboard_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 18 completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/phase18_complete.txt"
        mode: '0640'
        content: |
          Phase 18: Edge Device Onboarding - COMPLETE
          ══════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Devices Onboarded: {{ sdwan_edge_devices | default([]) | length }}
          Bootstrap configs saved to: {{ sdwan_artifacts_dir }}/

          Next Phase: Run 06_sdwan_phase5_security_hardening.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 18 Complete!
          Bootstrap configs saved to: {{ sdwan_artifacts_dir }}/
          Next: ansible-playbook cisco/playbooks/06_sdwan_phase5_security_hardening.yml
    - name: "cisco/05_sdwan_phase4_edge_onboard | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | bool
              - fe_cisco_05_sdwan_phase4_edge_onboard_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/05_sdwan_phase4_edge_onboard: postflight validation failed - preflight passed
              ={{ fe_cisco_05_sdwan_phase4_edge_onboard_preflight_passed | default(false) }},
              status={{ fe_cisco_05_sdwan_phase4_edge_onboard_status | default('unknown') }}.
            success_msg: "cisco/05_sdwan_phase4_edge_onboard: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/05_sdwan_phase4_edge_onboard | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_05_sdwan_phase4_edge_onboard_postflight_passed: true
            fe_cisco_05_sdwan_phase4_edge_onboard_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/05_sdwan_phase4_edge_onboard | Rescue | Capture the failing task and error detail"
