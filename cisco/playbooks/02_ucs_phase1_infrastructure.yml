---
# Cisco UCS Phase 1: Infrastructure Deployment
# Deploy base infrastructure components only
# Use for initial deployment or infrastructure-only updates

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 1 - UCS Infrastructure Deployment
  hosts: localhost
  gather_facts: yes
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    ucs_artifacts_dir: "/tmp/ucs-fourth-estate-artifacts/phase1"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/02_ucs_phase1_infrastructure | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/02_ucs_phase1_infrastructure | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_02_ucs_phase1_infrastructure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_ucs_phase1_infrastructure_status: "running"
            fe_cisco_02_ucs_phase1_infrastructure_preflight_passed: false
            fe_cisco_02_ucs_phase1_infrastructure_postflight_passed: false
            fe_cisco_02_ucs_phase1_infrastructure_failed_task: ""
            fe_cisco_02_ucs_phase1_infrastructure_error: ""
            fe_cisco_02_ucs_phase1_infrastructure_stats_published: false
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/02_ucs_phase1_infrastructure: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/02_ucs_phase1_infrastructure: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_ucs_phase1_infrastructure | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/02_ucs_phase1_infrastructure: required variable '{{ item }}' is not defined."
            success_msg: "cisco/02_ucs_phase1_infrastructure: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_02_ucs_phase1_infrastructure_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/02_ucs_phase1_infrastructure | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_status: "preflight_failed"
            fe_cisco_02_ucs_phase1_infrastructure_postflight_passed: false
            fe_cisco_02_ucs_phase1_infrastructure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_ucs_phase1_infrastructure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_ucs_phase1_infrastructure: FAILED at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_ucs_phase1_infrastructure":
                  component: "cisco/02_ucs_phase1_infrastructure"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_ucs_phase1_infrastructure_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_ucs_phase1_infrastructure_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else ['cisco/02_ucs_phase1_infrastructure'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_stats_published: true
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_ucs_phase1_infrastructure failed at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}': {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/02_ucs_phase1_infrastructure: preflight
              {{ 'passed' if fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 1 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 1: Infrastructure Deployment
          ════════════════════════════════════════════════════════════════
          Deploying:
            ✓ UCS Manager configuration
            ✓ Organizations and hierarchy
            ✓ Service profiles
            ✓ Server pools and policies
            ✓ Network/Storage templates
            ✓ Address pools
            ✓ High availability
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 1 artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/02_ucs_phase1_infrastructure | Guarded execution with rescue and always handling"
      block:

        - name: Deploy UCS infrastructure
          ansible.builtin.include_role:
            name: ucs_prod_infrastructure

        - name: "cisco/02_ucs_phase1_infrastructure | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_status: "failed"
            fe_cisco_02_ucs_phase1_infrastructure_postflight_passed: false
            fe_cisco_02_ucs_phase1_infrastructure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_ucs_phase1_infrastructure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_ucs_phase1_infrastructure: FAILED at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_ucs_phase1_infrastructure failed at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}': {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_ucs_phase1_infrastructure_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_02_ucs_phase1_infrastructure_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_ucs_phase1_infrastructure":
                  component: "cisco/02_ucs_phase1_infrastructure"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_ucs_phase1_infrastructure_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_ucs_phase1_infrastructure_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else ['cisco/02_ucs_phase1_infrastructure'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'failed'
            - not (fe_cisco_02_ucs_phase1_infrastructure_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_stats_published: true
          when:
            - fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 1 completion report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/phase1_complete.txt"
        mode: '0640'
        content: |
          Phase 1: Infrastructure Deployment - COMPLETE
          ══════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Status: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Deployed:
            ✓ UCS Manager base configuration
            ✓ Fourth Estate organization structure
            ✓ Service profile templates
            ✓ Server pools
            ✓ UUID/MAC/WWN pools
            ✓ vNIC/vHBA templates
            ✓ High availability settings

          Next Phase: Run 03_ucs_phase2_networking.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 1 Complete!
          Next: ansible-playbook 03_ucs_phase2_networking.yml
    - name: "cisco/02_ucs_phase1_infrastructure | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/02_ucs_phase1_infrastructure | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | bool
              - fe_cisco_02_ucs_phase1_infrastructure_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/02_ucs_phase1_infrastructure: postflight validation failed - preflight passed
              ={{ fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | default(false) }},
              status={{ fe_cisco_02_ucs_phase1_infrastructure_status | default('unknown') }}.
            success_msg: "cisco/02_ucs_phase1_infrastructure: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/02_ucs_phase1_infrastructure | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_postflight_passed: true
            fe_cisco_02_ucs_phase1_infrastructure_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_status: "failed"
            fe_cisco_02_ucs_phase1_infrastructure_postflight_passed: false
            fe_cisco_02_ucs_phase1_infrastructure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_02_ucs_phase1_infrastructure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/02_ucs_phase1_infrastructure: FAILED at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          tags:
            - always
            - rescue

        - name: "cisco/02_ucs_phase1_infrastructure | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/02_ucs_phase1_infrastructure failed at '{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task }}': {{ fe_cisco_02_ucs_phase1_infrastructure_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_02_ucs_phase1_infrastructure_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_02_ucs_phase1_infrastructure_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/02_ucs_phase1_infrastructure":
                  component: "cisco/02_ucs_phase1_infrastructure"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_02_ucs_phase1_infrastructure_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_02_ucs_phase1_infrastructure_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_02_ucs_phase1_infrastructure_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_02_ucs_phase1_infrastructure_failed_task | default('') }}"
                  error: "{{ fe_cisco_02_ucs_phase1_infrastructure_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_02_ucs_phase1_infrastructure_status | default('') == 'succeeded' else ['cisco/02_ucs_phase1_infrastructure'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_02_ucs_phase1_infrastructure_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_02_ucs_phase1_infrastructure_stats_published: true
          tags:
            - always

        - name: "cisco/02_ucs_phase1_infrastructure | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/02_ucs_phase1_infrastructure: {{ fe_cisco_02_ucs_phase1_infrastructure_status | default('unknown') }} in
              {{ fe_cisco_02_ucs_phase1_infrastructure_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
