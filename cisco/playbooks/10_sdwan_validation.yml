---
# Cisco SD-WAN Validation Playbook
# Validates the entire SD-WAN fabric health and connectivity
# Run after deployment to verify all components are operational

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: SD-WAN Fabric Validation
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/validation"

  pre_tasks:
    - name: "cisco/10_sdwan_validation | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/10_sdwan_validation | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_10_sdwan_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_sdwan_validation_status: "running"
            fe_cisco_10_sdwan_validation_preflight_passed: false
            fe_cisco_10_sdwan_validation_postflight_passed: false
            fe_cisco_10_sdwan_validation_failed_task: ""
            fe_cisco_10_sdwan_validation_error: ""
            fe_cisco_10_sdwan_validation_stats_published: false
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/10_sdwan_validation: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/10_sdwan_validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/10_sdwan_validation | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/10_sdwan_validation: required variable '{{ item }}' is not defined."
            success_msg: "cisco/10_sdwan_validation: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_10_sdwan_validation_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/10_sdwan_validation | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/10_sdwan_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_status: "preflight_failed"
            fe_cisco_10_sdwan_validation_postflight_passed: false
            fe_cisco_10_sdwan_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_sdwan_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_sdwan_validation: FAILED at '{{ fe_cisco_10_sdwan_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_sdwan_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_sdwan_validation":
                  component: "cisco/10_sdwan_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_sdwan_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_sdwan_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_sdwan_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_sdwan_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_sdwan_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_sdwan_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_sdwan_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else ['cisco/10_sdwan_validation'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_stats_published: true
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_sdwan_validation failed at '{{ fe_cisco_10_sdwan_validation_failed_task }}': {{ fe_cisco_10_sdwan_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_sdwan_validation | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/10_sdwan_validation: preflight
              {{ 'passed' if fe_cisco_10_sdwan_validation_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display validation banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          SD-WAN FABRIC VALIDATION
          ════════════════════════════════════════════════════════════════
          Validating:
            ✓ vManage API connectivity
            ✓ Controller registration (vBond, vSmart)
            ✓ Edge device sync status
            ✓ Control connections
            ✓ Tunnel statistics
          ════════════════════════════════════════════════════════════════

    - name: Create validation artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Authenticate to vManage
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/j_security_check"
        method: POST
        body_format: form-urlencoded
        body:
          j_username: "{{ sdwan_vmanage_username }}"
          j_password: "{{ sdwan_vmanage_password }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
        status_code: [200, 302]
      register: sdwan_val_auth
      no_log: true

    - name: Set auth facts
      ansible.builtin.set_fact:
        sdwan_session_cookie: "{{ sdwan_val_auth.cookies_string }}"
      no_log: true

    - name: Get CSRF token
      ansible.builtin.uri:
        url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/client/token"
        method: GET
        headers:
          Cookie: "{{ sdwan_session_cookie }}"
        validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
      register: sdwan_val_csrf

    - name: Set CSRF token
      ansible.builtin.set_fact:
        sdwan_csrf_token: "{{ sdwan_val_csrf.json }}"

  tasks:
    - name: "cisco/10_sdwan_validation | Guarded execution with rescue and always handling"
      block:

        - name: Check vManage API health
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/system/device/controllers"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_controllers
          tags: [validation, controllers]

        - name: Check edge device status
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/system/device/vedges"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_vedges
          tags: [validation, vedges]

        - name: Check fabric device counters
          ansible.builtin.uri:
            url: "https://{{ sdwan_vmanage_host }}:{{ sdwan_vmanage_port | default(443) }}/dataservice/device/counters"
            method: GET
            headers:
              Cookie: "{{ sdwan_session_cookie }}"
              X-XSRF-TOKEN: "{{ sdwan_csrf_token }}"
            validate_certs: "{{ sdwan_vmanage_verify_ssl | default(true) }}"
          register: sdwan_counters
          tags: [validation, health]

        - name: Assert controllers are reachable
          ansible.builtin.assert:
            that:
              - sdwan_controllers.status == 200
            fail_msg: "vManage API returned {{ sdwan_controllers.status }} — check connectivity"
            success_msg: "vManage API is healthy"
          tags: [validation]

        - name: Display validation summary
          ansible.builtin.debug:
            msg:
              - "════════════════════════════════════════════════════════════════"
              - " SD-WAN Fabric Validation Summary"
              - "════════════════════════════════════════════════════════════════"
              - " vManage API: REACHABLE"
              - " Controllers: {{ sdwan_controllers.json.data | length | default(0) }}"
              - " Edge devices: {{ sdwan_vedges.json.data | length | default(0) }}"
              - " Total devices: {{ sdwan_counters.json.data[0].totalCount | default('unknown') }}"
              - " Reachable: {{ sdwan_counters.json.data[0].reachableCount | default('unknown') }}"
              - " Unreachable: {{ sdwan_counters.json.data[0].unreachableCount | default('unknown') }}"
              - "════════════════════════════════════════════════════════════════"
          tags: [validation]

      rescue:

        - name: "cisco/10_sdwan_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_status: "failed"
            fe_cisco_10_sdwan_validation_postflight_passed: false
            fe_cisco_10_sdwan_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_sdwan_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_sdwan_validation: FAILED at '{{ fe_cisco_10_sdwan_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_sdwan_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_sdwan_validation failed at '{{ fe_cisco_10_sdwan_validation_failed_task }}': {{ fe_cisco_10_sdwan_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_sdwan_validation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_sdwan_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_10_sdwan_validation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_sdwan_validation":
                  component: "cisco/10_sdwan_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_sdwan_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_sdwan_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_sdwan_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_sdwan_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_sdwan_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_sdwan_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_sdwan_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else ['cisco/10_sdwan_validation'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_10_sdwan_validation_status | default('') == 'failed'
            - not (fe_cisco_10_sdwan_validation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_stats_published: true
          when:
            - fe_cisco_10_sdwan_validation_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Save validation report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/validation_{{ ansible_date_time.epoch }}.txt"
        mode: '0640'
        content: |
          SD-WAN Fabric Validation Report
          Generated: {{ ansible_date_time.iso8601 }}
          vManage: {{ sdwan_vmanage_host }}
          Controllers: {{ sdwan_controllers.json.data | length | default(0) }}
          Edge devices: {{ sdwan_vedges.json.data | length | default(0) }}
      tags: [always]
    - name: "cisco/10_sdwan_validation | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/10_sdwan_validation | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_10_sdwan_validation_preflight_passed | bool
              - fe_cisco_10_sdwan_validation_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/10_sdwan_validation: postflight validation failed - preflight passed
              ={{ fe_cisco_10_sdwan_validation_preflight_passed | default(false) }},
              status={{ fe_cisco_10_sdwan_validation_status | default('unknown') }}.
            success_msg: "cisco/10_sdwan_validation: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/10_sdwan_validation | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_postflight_passed: true
            fe_cisco_10_sdwan_validation_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/10_sdwan_validation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_status: "failed"
            fe_cisco_10_sdwan_validation_postflight_passed: false
            fe_cisco_10_sdwan_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_10_sdwan_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/10_sdwan_validation: FAILED at '{{ fe_cisco_10_sdwan_validation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_10_sdwan_validation_error }}
          tags:
            - always
            - rescue

        - name: "cisco/10_sdwan_validation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/10_sdwan_validation failed at '{{ fe_cisco_10_sdwan_validation_failed_task }}': {{ fe_cisco_10_sdwan_validation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/10_sdwan_validation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_10_sdwan_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_10_sdwan_validation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/10_sdwan_validation":
                  component: "cisco/10_sdwan_validation"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_10_sdwan_validation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_10_sdwan_validation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_10_sdwan_validation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_10_sdwan_validation_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_10_sdwan_validation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_10_sdwan_validation_failed_task | default('') }}"
                  error: "{{ fe_cisco_10_sdwan_validation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_10_sdwan_validation_status | default('') == 'succeeded' else ['cisco/10_sdwan_validation'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_10_sdwan_validation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_10_sdwan_validation_stats_published: true
          tags:
            - always

        - name: "cisco/10_sdwan_validation | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/10_sdwan_validation: {{ fe_cisco_10_sdwan_validation_status | default('unknown') }} in
              {{ fe_cisco_10_sdwan_validation_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
