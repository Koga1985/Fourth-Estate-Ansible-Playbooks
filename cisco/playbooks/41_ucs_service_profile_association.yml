---
# Cisco UCS Service Profile Association Playbook
# Associates service profiles with physical servers in the UCS cluster

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Associate UCS Service Profiles with Servers
  hosts: localhost
  gather_facts: yes
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false  # Set to true to apply associations
    ucs_artifacts_dir: "/tmp/ucs-sp-association-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate"

    # Association Mode: 'auto' or 'manual'
    sp_association_mode: "auto"

    # For manual mode, define associations:
    # sp_manual_associations:
    #   - service_profile: "SP-Web-01"
    #     server_dn: "sys/chassis-1/blade-1"
    #   - service_profile: "SP-App-01"
    #     server_dn: "sys/chassis-1/blade-2"

    # For auto mode, define server pool:
    # sp_server_pool_name: "FourthEstate-Pool"
    # sp_pool_servers:
    #   - server_dn: "sys/chassis-1/blade-1"
    #   - server_dn: "sys/chassis-1/blade-2"
    # sp_templates_for_auto_assoc:
    #   - "FourthEstate-Web-Template"

  pre_tasks:
    - name: "cisco/41_ucs_service_profile_association | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/41_ucs_service_profile_association | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_41_ucs_service_profile_association_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_41_ucs_service_profile_association_status: "running"
            fe_cisco_41_ucs_service_profile_association_preflight_passed: false
            fe_cisco_41_ucs_service_profile_association_postflight_passed: false
            fe_cisco_41_ucs_service_profile_association_failed_task: ""
            fe_cisco_41_ucs_service_profile_association_error: ""
            fe_cisco_41_ucs_service_profile_association_stats_published: false
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/41_ucs_service_profile_association: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/41_ucs_service_profile_association: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/41_ucs_service_profile_association | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/41_ucs_service_profile_association: required variable '{{ item }}' is not defined."
            success_msg: "cisco/41_ucs_service_profile_association: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_41_ucs_service_profile_association_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/41_ucs_service_profile_association | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/41_ucs_service_profile_association | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_status: "preflight_failed"
            fe_cisco_41_ucs_service_profile_association_postflight_passed: false
            fe_cisco_41_ucs_service_profile_association_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_41_ucs_service_profile_association_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/41_ucs_service_profile_association: FAILED at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_41_ucs_service_profile_association_error }}
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/41_ucs_service_profile_association":
                  component: "cisco/41_ucs_service_profile_association"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_41_ucs_service_profile_association_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_41_ucs_service_profile_association_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_41_ucs_service_profile_association_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_41_ucs_service_profile_association_failed_task | default('') }}"
                  error: "{{ fe_cisco_41_ucs_service_profile_association_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else ['cisco/41_ucs_service_profile_association'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_stats_published: true
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/41_ucs_service_profile_association failed at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}': {{ fe_cisco_41_ucs_service_profile_association_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/41_ucs_service_profile_association | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/41_ucs_service_profile_association: preflight
              {{ 'passed' if fe_cisco_41_ucs_service_profile_association_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display service profile association banner
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   Cisco UCS Service Profile Association                      ║
          ║   Fourth Estate Production Deployment                        ║
          ╚══════════════════════════════════════════════════════════════╝

          Configuration Mode: {{ 'APPLY CHANGES' if apply_changes else 'DRY-RUN (no changes)' }}
          Association Mode: {{ sp_association_mode | upper }}
          Organization: {{ fourth_estate_org_name }}
          Artifacts Directory: {{ ucs_artifacts_dir }}

          ⚠️  WARNING: Service profile association will bind servers
          ⚠️  Ensure servers are ready and available
          ⚠️  Server configuration may take several minutes

    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0755'

    - name: Verify UCS Manager connectivity
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: topSystem
      no_log: true
      register: ucs_connection_test
      failed_when: false

    - name: Fail if UCS Manager is not reachable
      ansible.builtin.fail:
        msg: |
          Cannot connect to UCS Manager at {{ ucs_hostname }}
          Please verify:
          - UCS Manager is accessible
          - Credentials are correct
          - Network connectivity is available
      when: ucs_connection_test.failed

    - name: Query current cluster server inventory
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: computePhysical
      no_log: true
      register: cluster_servers

    - name: Display cluster server inventory
      ansible.builtin.debug:
        msg: |
          UCS Cluster Server Inventory:
          - Total Servers: {{ cluster_servers.objects | length }}
          - Available for Association: {{ cluster_servers.objects | selectattr('association', 'equalto', 'none') | list | length }}
          - Currently Associated: {{ cluster_servers.objects | selectattr('association', 'ne', 'none') | list | length }}

  tasks:
    - name: "cisco/41_ucs_service_profile_association | Guarded execution with rescue and always handling"
      block:

        - name: Associate service profiles with servers
          ansible.builtin.include_role:
            name: ucs_prod_infrastructure
            tasks_from: service_profile_association
          tags:
            - service_profile
            - sp_association
            - association

      rescue:

        - name: "cisco/41_ucs_service_profile_association | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_status: "failed"
            fe_cisco_41_ucs_service_profile_association_postflight_passed: false
            fe_cisco_41_ucs_service_profile_association_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_41_ucs_service_profile_association_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/41_ucs_service_profile_association: FAILED at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_41_ucs_service_profile_association_error }}
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/41_ucs_service_profile_association failed at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}': {{ fe_cisco_41_ucs_service_profile_association_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/41_ucs_service_profile_association | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_41_ucs_service_profile_association_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_41_ucs_service_profile_association_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/41_ucs_service_profile_association":
                  component: "cisco/41_ucs_service_profile_association"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_41_ucs_service_profile_association_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_41_ucs_service_profile_association_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_41_ucs_service_profile_association_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_41_ucs_service_profile_association_failed_task | default('') }}"
                  error: "{{ fe_cisco_41_ucs_service_profile_association_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else ['cisco/41_ucs_service_profile_association'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_41_ucs_service_profile_association_status | default('') == 'failed'
            - not (fe_cisco_41_ucs_service_profile_association_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_stats_published: true
          when:
            - fe_cisco_41_ucs_service_profile_association_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Query final service profile status
      cisco.ucs.ucs_query:
        hostname: "{{ ucs_hostname }}"
        username: "{{ ucs_username }}"
        password: "{{ ucs_password }}"
        validate_certs: "{{ ucs_validate_certs | default(false) }}"
        class_ids: lsServer
        filter_str: "dn contains 'org-{{ fourth_estate_org_name }}'"
      no_log: true
      register: final_sp_status

    - name: Calculate association statistics
      ansible.builtin.set_fact:
        total_sps: "{{ final_sp_status.objects | length }}"
        associated_sps: "{{ final_sp_status.objects | selectattr('assoc_state', 'equalto', 'associated') | list | length }}"
        associating_sps: "{{ final_sp_status.objects | selectattr('assoc_state', 'equalto', 'associating') | list | length }}"
        unassociated_sps: "{{ final_sp_status.objects | selectattr('assoc_state', 'equalto', 'unassociated') | list | length }}"
        failed_sps: "{{ final_sp_status.objects | selectattr('assoc_state', 'equalto', 'failed') | list | length }}"

    - name: Display association summary
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║   Service Profile Association Complete                       ║
          ╚══════════════════════════════════════════════════════════════╝

          Status: {{ 'APPLIED' if apply_changes else 'DRY-RUN' }}
          Association Mode: {{ sp_association_mode | upper }}

          Service Profile Statistics:
          - Total Service Profiles: {{ total_sps }}
          - Successfully Associated: {{ associated_sps }}
          - Currently Associating: {{ associating_sps }}
          - Unassociated: {{ unassociated_sps }}
          - Failed Associations: {{ failed_sps }}

          {% if not apply_changes %}
          ⚠️  DRY-RUN MODE: No changes were applied
          ⚠️  Review the configuration and set apply_changes=true to apply
          {% else %}
          {% if failed_sps | int > 0 %}
          ⚠️  WARNING: {{ failed_sps }} service profile(s) failed association
          ⚠️  Review the artifacts for details and troubleshoot
          {% else %}
          ✓ All service profiles processed successfully
          {% endif %}
          {% if associating_sps | int > 0 %}
          ⏳ {{ associating_sps }} service profile(s) are still associating
          ⏳ This process may take 5-10 minutes per server
          ⏳ Monitor UCS Manager for completion status
          {% endif %}
          {% endif %}

          Artifacts: {{ ucs_artifacts_dir }}
          Report: service_profile_association.txt

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Next Steps:
          {% if associating_sps | int > 0 %}
          1. Monitor association progress in UCS Manager
          2. Wait for all associations to complete (5-10 min per server)
          3. Run validation playbook: ansible-playbook 10_ucs_validation.yml
          {% elif failed_sps | int > 0 %}
          1. Review association failures in {{ ucs_artifacts_dir }}/service_profile_association.txt
          2. Check UCS Manager faults for specific error messages
          3. Verify server hardware is discovered and operational
          4. Re-run this playbook after resolving issues
          {% else %}
          1. Verify server configurations in UCS Manager
          2. Run validation playbook: ansible-playbook 10_ucs_validation.yml
          3. Proceed with application deployment
          {% endif %}

    - name: List generated artifacts
      ansible.builtin.find:
        paths: "{{ ucs_artifacts_dir }}"
        patterns: "*"
      register: artifact_files

    - name: Display artifact locations
      ansible.builtin.debug:
        msg: "{{ item.path }}"
      loop: "{{ artifact_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
    - name: "cisco/41_ucs_service_profile_association | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/41_ucs_service_profile_association | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_41_ucs_service_profile_association_preflight_passed | bool
              - fe_cisco_41_ucs_service_profile_association_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/41_ucs_service_profile_association: postflight validation failed - preflight passed
              ={{ fe_cisco_41_ucs_service_profile_association_preflight_passed | default(false) }},
              status={{ fe_cisco_41_ucs_service_profile_association_status | default('unknown') }}.
            success_msg: "cisco/41_ucs_service_profile_association: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/41_ucs_service_profile_association | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_postflight_passed: true
            fe_cisco_41_ucs_service_profile_association_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/41_ucs_service_profile_association | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_status: "failed"
            fe_cisco_41_ucs_service_profile_association_postflight_passed: false
            fe_cisco_41_ucs_service_profile_association_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_41_ucs_service_profile_association_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/41_ucs_service_profile_association: FAILED at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_41_ucs_service_profile_association_error }}
          tags:
            - always
            - rescue

        - name: "cisco/41_ucs_service_profile_association | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/41_ucs_service_profile_association failed at '{{ fe_cisco_41_ucs_service_profile_association_failed_task }}': {{ fe_cisco_41_ucs_service_profile_association_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/41_ucs_service_profile_association | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_41_ucs_service_profile_association_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_41_ucs_service_profile_association_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_41_ucs_service_profile_association_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/41_ucs_service_profile_association | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/41_ucs_service_profile_association":
                  component: "cisco/41_ucs_service_profile_association"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_41_ucs_service_profile_association_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_41_ucs_service_profile_association_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_41_ucs_service_profile_association_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_41_ucs_service_profile_association_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_41_ucs_service_profile_association_failed_task | default('') }}"
                  error: "{{ fe_cisco_41_ucs_service_profile_association_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_41_ucs_service_profile_association_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_41_ucs_service_profile_association_status | default('') == 'succeeded' else ['cisco/41_ucs_service_profile_association'] }}
            aggregate: true
            per_host: false
          when:
