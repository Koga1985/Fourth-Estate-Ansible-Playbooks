---
# Cisco UCS Phase 4: Monitoring Setup
# Configure SNMP, Call Home, and health monitoring
# Run after Phase 3 security hardening

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 4 - UCS Monitoring Setup
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    ucs_artifacts_dir: "/tmp/ucs-fourth-estate-artifacts/phase4"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/05_ucs_phase4_monitoring | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/05_ucs_phase4_monitoring | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_05_ucs_phase4_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_ucs_phase4_monitoring_status: "running"
            fe_cisco_05_ucs_phase4_monitoring_preflight_passed: false
            fe_cisco_05_ucs_phase4_monitoring_postflight_passed: false
            fe_cisco_05_ucs_phase4_monitoring_failed_task: ""
            fe_cisco_05_ucs_phase4_monitoring_error: ""
            fe_cisco_05_ucs_phase4_monitoring_stats_published: false
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/05_ucs_phase4_monitoring: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/05_ucs_phase4_monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_ucs_phase4_monitoring | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/05_ucs_phase4_monitoring: required variable '{{ item }}' is not defined."
            success_msg: "cisco/05_ucs_phase4_monitoring: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_05_ucs_phase4_monitoring_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/05_ucs_phase4_monitoring | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_status: "preflight_failed"
            fe_cisco_05_ucs_phase4_monitoring_postflight_passed: false
            fe_cisco_05_ucs_phase4_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_ucs_phase4_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_ucs_phase4_monitoring: FAILED at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_ucs_phase4_monitoring":
                  component: "cisco/05_ucs_phase4_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_ucs_phase4_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_ucs_phase4_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_ucs_phase4_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_ucs_phase4_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_ucs_phase4_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else ['cisco/05_ucs_phase4_monitoring'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_stats_published: true
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_ucs_phase4_monitoring failed at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}': {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_ucs_phase4_monitoring | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/05_ucs_phase4_monitoring: preflight
              {{ 'passed' if fe_cisco_05_ucs_phase4_monitoring_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 4 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 4: Monitoring Setup
          ════════════════════════════════════════════════════════════════
          Configuring:
            ✓ SNMP v2c/v3
            ✓ SNMP trap destinations
            ✓ Call Home for proactive monitoring
            ✓ System health checks
            ✓ Power/thermal monitoring
            ✓ Compliance monitoring
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 4 artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/05_ucs_phase4_monitoring | Guarded execution with rescue and always handling"
      block:

        - name: Configure UCS monitoring
          ansible.builtin.include_role:
            name: ucs_prod_monitoring

        - name: "cisco/05_ucs_phase4_monitoring | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_status: "failed"
            fe_cisco_05_ucs_phase4_monitoring_postflight_passed: false
            fe_cisco_05_ucs_phase4_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_ucs_phase4_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_ucs_phase4_monitoring: FAILED at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_ucs_phase4_monitoring failed at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}': {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_ucs_phase4_monitoring | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_ucs_phase4_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_ucs_phase4_monitoring_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_ucs_phase4_monitoring":
                  component: "cisco/05_ucs_phase4_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_ucs_phase4_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_ucs_phase4_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_ucs_phase4_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_ucs_phase4_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_ucs_phase4_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else ['cisco/05_ucs_phase4_monitoring'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'failed'
            - not (fe_cisco_05_ucs_phase4_monitoring_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_stats_published: true
          when:
            - fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 4 completion report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/phase4_complete.txt"
        mode: '0640'
        content: |
          Phase 4: Monitoring Setup - COMPLETE
          ═══════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Status: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Monitoring Components:
            ✓ SNMP configured
            ✓ SNMP traps configured
            ✓ Call Home enabled
            ✓ Health monitoring active
            ✓ Power/thermal monitoring
            ✓ Compliance checklists generated

          Integration Points:
            - SNMP trap receivers
            - SIEM integration ready
            - Health dashboard feeds

          Next Phase: Run 06_ucs_phase5_backup_dr.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 4 Complete!
          Monitoring configured successfully.
          Next: ansible-playbook 06_ucs_phase5_backup_dr.yml
    - name: "cisco/05_ucs_phase4_monitoring | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/05_ucs_phase4_monitoring | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_05_ucs_phase4_monitoring_preflight_passed | bool
              - fe_cisco_05_ucs_phase4_monitoring_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/05_ucs_phase4_monitoring: postflight validation failed - preflight passed
              ={{ fe_cisco_05_ucs_phase4_monitoring_preflight_passed | default(false) }},
              status={{ fe_cisco_05_ucs_phase4_monitoring_status | default('unknown') }}.
            success_msg: "cisco/05_ucs_phase4_monitoring: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/05_ucs_phase4_monitoring | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_postflight_passed: true
            fe_cisco_05_ucs_phase4_monitoring_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_status: "failed"
            fe_cisco_05_ucs_phase4_monitoring_postflight_passed: false
            fe_cisco_05_ucs_phase4_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_05_ucs_phase4_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/05_ucs_phase4_monitoring: FAILED at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          tags:
            - always
            - rescue

        - name: "cisco/05_ucs_phase4_monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/05_ucs_phase4_monitoring failed at '{{ fe_cisco_05_ucs_phase4_monitoring_failed_task }}': {{ fe_cisco_05_ucs_phase4_monitoring_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/05_ucs_phase4_monitoring | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_05_ucs_phase4_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_05_ucs_phase4_monitoring_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/05_ucs_phase4_monitoring":
                  component: "cisco/05_ucs_phase4_monitoring"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_05_ucs_phase4_monitoring_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_05_ucs_phase4_monitoring_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_05_ucs_phase4_monitoring_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_05_ucs_phase4_monitoring_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_05_ucs_phase4_monitoring_failed_task | default('') }}"
                  error: "{{ fe_cisco_05_ucs_phase4_monitoring_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_05_ucs_phase4_monitoring_status | default('') == 'succeeded' else ['cisco/05_ucs_phase4_monitoring'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_05_ucs_phase4_monitoring_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_05_ucs_phase4_monitoring_stats_published: true
          tags:
            - always

        - name: "cisco/05_ucs_phase4_monitoring | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/05_ucs_phase4_monitoring: {{ fe_cisco_05_ucs_phase4_monitoring_status | default('unknown') }} in
              {{ fe_cisco_05_ucs_phase4_monitoring_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
