---
# Cisco UCS Quick Start Deployment
# Minimal viable deployment for development/testing
# Not for production use - use full deployment instead

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: UCS Quick Start Deployment (Dev/Test Only)
  hosts: localhost
  gather_facts: yes
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    ucs_artifacts_dir: "/tmp/ucs-quickstart-{{ ansible_date_time.epoch }}"
    fourth_estate_org_name: "FourthEstate-Dev"

    # Minimal features for quick start
    ucs_enable_san: false
    stig_cat1_enabled: true
    stig_cat2_enabled: false
    stig_cat3_enabled: false

  pre_tasks:
    - name: "cisco/20_ucs_quick_start | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/20_ucs_quick_start | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_20_ucs_quick_start_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_20_ucs_quick_start_status: "running"
            fe_cisco_20_ucs_quick_start_preflight_passed: false
            fe_cisco_20_ucs_quick_start_postflight_passed: false
            fe_cisco_20_ucs_quick_start_failed_task: ""
            fe_cisco_20_ucs_quick_start_error: ""
            fe_cisco_20_ucs_quick_start_stats_published: false
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/20_ucs_quick_start: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/20_ucs_quick_start: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/20_ucs_quick_start | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/20_ucs_quick_start: required variable '{{ item }}' is not defined."
            success_msg: "cisco/20_ucs_quick_start: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_20_ucs_quick_start_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/20_ucs_quick_start | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/20_ucs_quick_start | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_status: "preflight_failed"
            fe_cisco_20_ucs_quick_start_postflight_passed: false
            fe_cisco_20_ucs_quick_start_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_20_ucs_quick_start_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/20_ucs_quick_start: FAILED at '{{ fe_cisco_20_ucs_quick_start_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_20_ucs_quick_start_error }}
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/20_ucs_quick_start":
                  component: "cisco/20_ucs_quick_start"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_20_ucs_quick_start_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_20_ucs_quick_start_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_20_ucs_quick_start_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_20_ucs_quick_start_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_20_ucs_quick_start_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_20_ucs_quick_start_failed_task | default('') }}"
                  error: "{{ fe_cisco_20_ucs_quick_start_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else ['cisco/20_ucs_quick_start'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_stats_published: true
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/20_ucs_quick_start failed at '{{ fe_cisco_20_ucs_quick_start_failed_task }}': {{ fe_cisco_20_ucs_quick_start_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/20_ucs_quick_start | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/20_ucs_quick_start: preflight
              {{ 'passed' if fe_cisco_20_ucs_quick_start_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display quick start warning
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          UCS QUICK START DEPLOYMENT (DEV/TEST ONLY)
          ════════════════════════════════════════════════════════════════
          ⚠ WARNING: This is a minimal deployment for development/testing
          ⚠ NOT suitable for production use
          ⚠ Use 01_ucs_full_deployment.yml for production

          Quick Start includes:
            ✓ Basic infrastructure
            ✓ Minimal networking (no SAN)
            ✓ Essential security (STIG Cat I only)
            ✓ Basic monitoring
            ✓ No backup/DR configuration

          For production, use phased deployment (playbooks 02-06)
          ════════════════════════════════════════════════════════════════

    - name: Create quickstart artifacts directory
      ansible.builtin.file:
        path: "{{ ucs_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/20_ucs_quick_start | Guarded execution with rescue and always handling"
      block:

        - name: Deploy minimal infrastructure
          ansible.builtin.include_role:
            name: ucs_prod_infrastructure
          vars:
            ucs_enable_firmware_updates: false
            ucs_auto_associate_servers: false

        - name: Configure basic networking
          ansible.builtin.include_role:
            name: ucs_prod_networking
          vars:
            ucs_enable_san: false

        - name: Apply essential security
          ansible.builtin.include_role:
            name: ucs_security_hardening
          vars:
            stig_cat1_enabled: true
            stig_cat2_enabled: false
            stig_cat3_enabled: false

        - name: Setup basic monitoring
          ansible.builtin.include_role:
            name: ucs_prod_monitoring

      rescue:

        - name: "cisco/20_ucs_quick_start | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_status: "failed"
            fe_cisco_20_ucs_quick_start_postflight_passed: false
            fe_cisco_20_ucs_quick_start_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_20_ucs_quick_start_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/20_ucs_quick_start: FAILED at '{{ fe_cisco_20_ucs_quick_start_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_20_ucs_quick_start_error }}
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/20_ucs_quick_start failed at '{{ fe_cisco_20_ucs_quick_start_failed_task }}': {{ fe_cisco_20_ucs_quick_start_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/20_ucs_quick_start | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_20_ucs_quick_start_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_20_ucs_quick_start_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/20_ucs_quick_start":
                  component: "cisco/20_ucs_quick_start"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_20_ucs_quick_start_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_20_ucs_quick_start_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_20_ucs_quick_start_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_20_ucs_quick_start_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_20_ucs_quick_start_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_20_ucs_quick_start_failed_task | default('') }}"
                  error: "{{ fe_cisco_20_ucs_quick_start_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else ['cisco/20_ucs_quick_start'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_20_ucs_quick_start_status | default('') == 'failed'
            - not (fe_cisco_20_ucs_quick_start_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_stats_published: true
          when:
            - fe_cisco_20_ucs_quick_start_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate quick start report
      ansible.builtin.copy:
        dest: "{{ ucs_artifacts_dir }}/quickstart_report.txt"
        mode: '0640'
        content: |
          UCS Quick Start Deployment Report
          ══════════════════════════════════════════════════════════════
          ⚠ DEVELOPMENT/TEST DEPLOYMENT ONLY ⚠

          Deployed: {{ ansible_date_time.iso8601 }}
          Organization: {{ fourth_estate_org_name }}
          Status: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Deployed:
            ✓ Basic UCS infrastructure
            ✓ Minimal networking (LAN only, no SAN)
            ✓ Essential security (STIG Cat I)
            ✓ Basic monitoring

          Components NOT Included:
            ✗ SAN connectivity
            ✗ Full STIG compliance (Cat II/III)
            ✗ Comprehensive NIST 800-53 controls
            ✗ Backup and disaster recovery
            ✗ Advanced monitoring integrations

          ⚠ IMPORTANT: For Production Deployment
          ══════════════════════════════════════════════════════════════
          This quick start is NOT suitable for production.

          For production deployment, use:
            1. Full deployment: ansible-playbook 01_ucs_full_deployment.yml
            OR
            2. Phased deployment:
               - ansible-playbook 02_ucs_phase1_infrastructure.yml
               - ansible-playbook 03_ucs_phase2_networking.yml
               - ansible-playbook 04_ucs_phase3_security.yml
               - ansible-playbook 05_ucs_phase4_monitoring.yml
               - ansible-playbook 06_ucs_phase5_backup_dr.yml

          Artifacts: {{ ucs_artifacts_dir }}
          ══════════════════════════════════════════════════════════════

    - name: Display quick start completion
      ansible.builtin.debug:
        msg: |
          ⚠ QUICK START COMPLETE (DEV/TEST ONLY) ⚠

          This is a minimal deployment.
          For production, use full or phased deployment.

          Artifacts: {{ ucs_artifacts_dir }}
    - name: "cisco/20_ucs_quick_start | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/20_ucs_quick_start | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_20_ucs_quick_start_preflight_passed | bool
              - fe_cisco_20_ucs_quick_start_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/20_ucs_quick_start: postflight validation failed - preflight passed
              ={{ fe_cisco_20_ucs_quick_start_preflight_passed | default(false) }},
              status={{ fe_cisco_20_ucs_quick_start_status | default('unknown') }}.
            success_msg: "cisco/20_ucs_quick_start: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/20_ucs_quick_start | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_postflight_passed: true
            fe_cisco_20_ucs_quick_start_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/20_ucs_quick_start | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_status: "failed"
            fe_cisco_20_ucs_quick_start_postflight_passed: false
            fe_cisco_20_ucs_quick_start_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_20_ucs_quick_start_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/20_ucs_quick_start: FAILED at '{{ fe_cisco_20_ucs_quick_start_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_20_ucs_quick_start_error }}
          tags:
            - always
            - rescue

        - name: "cisco/20_ucs_quick_start | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/20_ucs_quick_start failed at '{{ fe_cisco_20_ucs_quick_start_failed_task }}': {{ fe_cisco_20_ucs_quick_start_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/20_ucs_quick_start | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_20_ucs_quick_start_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_20_ucs_quick_start_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/20_ucs_quick_start":
                  component: "cisco/20_ucs_quick_start"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_20_ucs_quick_start_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_20_ucs_quick_start_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_20_ucs_quick_start_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_20_ucs_quick_start_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_20_ucs_quick_start_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_20_ucs_quick_start_failed_task | default('') }}"
                  error: "{{ fe_cisco_20_ucs_quick_start_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_20_ucs_quick_start_status | default('') == 'succeeded' else ['cisco/20_ucs_quick_start'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_20_ucs_quick_start_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_20_ucs_quick_start_stats_published: true
          tags:
            - always

        - name: "cisco/20_ucs_quick_start | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/20_ucs_quick_start: {{ fe_cisco_20_ucs_quick_start_status | default('unknown') }} in
              {{ fe_cisco_20_ucs_quick_start_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
