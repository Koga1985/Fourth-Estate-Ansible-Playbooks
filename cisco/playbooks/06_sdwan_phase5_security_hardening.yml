---
# Cisco SD-WAN Phase 19: DISA STIG / NIST 800-53 Security Hardening
#
# Applies all DISA STIG controls from:
#   - Cisco IOS XE SD-WAN Router NDM STIG V2R1
#   - Cisco SD-WAN vManage NDM STIG V1R1
#
# STIG Controls Applied:
#   CAT I  - TACACS+/RADIUS (IA-2), Password Policy (IA-5), TLS/FIPS (SC-8)
#   CAT II - RBAC (AC-6), Account Lockout (AC-7), Session Timeout (AC-12),
#             SNMPv3 (SC-8), Audit Logging (AU-2), NTP Auth (AU-8),
#             SSH v2 (SC-8), Disable Unused Services (CM-7)
#   CAT III - DoD Login Banner (AC-8)
#
# Usage:
#   # Dry run (recommended first):
#   ansible-playbook -i inventory cisco/playbooks/06_sdwan_phase5_security_hardening.yml \
#     --ask-vault-pass
#
#   # Apply all STIG controls:
#   ansible-playbook -i inventory cisco/playbooks/06_sdwan_phase5_security_hardening.yml \
#     -e apply_changes=true --ask-vault-pass
#
#   # Apply CAT I controls only:
#   ansible-playbook -i inventory cisco/playbooks/06_sdwan_phase5_security_hardening.yml \
#     --tags stig_cat1 -e apply_changes=true --ask-vault-pass
#
#   # Check specific control:
#   ansible-playbook -i inventory cisco/playbooks/06_sdwan_phase5_security_hardening.yml \
#     --tags "authentication,passwords" --ask-vault-pass
#
# Prerequisite: Phases 15-18 must be complete (or target is an existing fabric)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 19 - SD-WAN DISA STIG Security Hardening
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/phase19"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/06_sdwan_phase5_security_hardening | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/06_sdwan_phase5_security_hardening | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_06_sdwan_phase5_security_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_status: "running"
            fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed: false
            fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed: false
            fe_cisco_06_sdwan_phase5_security_hardening_failed_task: ""
            fe_cisco_06_sdwan_phase5_security_hardening_error: ""
            fe_cisco_06_sdwan_phase5_security_hardening_stats_published: false
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/06_sdwan_phase5_security_hardening: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/06_sdwan_phase5_security_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/06_sdwan_phase5_security_hardening | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/06_sdwan_phase5_security_hardening: required variable '{{ item }}' is not defined."
            success_msg: "cisco/06_sdwan_phase5_security_hardening: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_06_sdwan_phase5_security_hardening_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/06_sdwan_phase5_security_hardening | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_status: "preflight_failed"
            fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed: false
            fe_cisco_06_sdwan_phase5_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening: FAILED at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/06_sdwan_phase5_security_hardening":
                  component: "cisco/06_sdwan_phase5_security_hardening"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_06_sdwan_phase5_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_cisco_06_sdwan_phase5_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else ['cisco/06_sdwan_phase5_security_hardening'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_stats_published: true
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening failed at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}': {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening: preflight
              {{ 'passed' if fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 19 STIG hardening banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 19: DISA STIG / NIST 800-53 Security Hardening
          ════════════════════════════════════════════════════════════════
          STIG References:
            - Cisco IOS XE SD-WAN Router NDM STIG V2R1
            - Cisco SD-WAN vManage NDM STIG V1R1

          Controls:
            CAT I  ✓ TACACS+/RADIUS AAA (CISC-ND-001190 / IA-2)
            CAT I  ✓ Password Policy 15-char min (CISC-ND-000530/570 / IA-5)
            CAT I  ✓ TLS 1.2+ / FIPS 140-2 (CISC-ND-001440 / SC-8)
            CAT II ✓ RBAC / Least Privilege (CISC-ND-000360 / AC-6)
            CAT II ✓ Account Lockout 3 attempts (CISC-ND-000370 / AC-7)
            CAT II ✓ Session Timeout 10 min (CISC-ND-000200 / AC-12)
            CAT II ✓ SNMPv3 authPriv (CISC-ND-000090 / SC-8)
            CAT II ✓ Audit Logging to SIEM (CISC-ND-000700 / AU-2)
            CAT II ✓ Authenticated NTP (CISC-ND-001290 / AU-8)
            CAT II ✓ SSH v2 / Disable Telnet (CISC-ND-001400 / SC-8)
            CAT II ✓ Disable Unused Services (CISC-ND-001200 / CM-7)
            CAT III ✓ DoD Login Banner (CISC-ND-000080 / AC-8)
          ════════════════════════════════════════════════════════════════
          Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 19 artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/06_sdwan_phase5_security_hardening | Guarded execution with rescue and always handling"
      block:

        - name: Apply SD-WAN STIG security hardening
          ansible.builtin.include_role:
            name: sdwan_security_hardening

      rescue:

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_status: "failed"
            fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed: false
            fe_cisco_06_sdwan_phase5_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening: FAILED at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening failed at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}': {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_06_sdwan_phase5_security_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/06_sdwan_phase5_security_hardening":
                  component: "cisco/06_sdwan_phase5_security_hardening"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_06_sdwan_phase5_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_cisco_06_sdwan_phase5_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else ['cisco/06_sdwan_phase5_security_hardening'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'failed'
            - not (fe_cisco_06_sdwan_phase5_security_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_stats_published: true
          when:
            - fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 19 completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/phase19_complete.txt"
        mode: '0640'
        content: |
          Phase 19: DISA STIG Security Hardening - COMPLETE
          ══════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          STIG Controls Applied:
            ✓ CISC-ND-000080  DoD Login Banner (AC-8)
            ✓ CISC-ND-000090  SNMPv3 Required (SC-8)
            ✓ CISC-ND-000200  Session Timeout (AC-12)
            ✓ CISC-ND-000360  RBAC / Least Privilege (AC-6)
            ✓ CISC-ND-000370  Account Lockout (AC-7)
            ✓ CISC-ND-000530  Password Complexity (IA-5)
            ✓ CISC-ND-000570  Password Min Length (IA-5)
            ✓ CISC-ND-000700  Audit Logging (AU-2)
            ✓ CISC-ND-001190  TACACS+/RADIUS AAA (IA-2)
            ✓ CISC-ND-001200  Disable Unused Services (CM-7)
            ✓ CISC-ND-001290  NTP Authentication (AU-8)
            ✓ CISC-ND-001400  SSH v2 / Disable Telnet (SC-8)
            ✓ CISC-ND-001440  TLS 1.2+ / FIPS (SC-8)

          Compliance Artifacts: {{ sdwan_artifacts_dir }}/
          Next Phase: Run 07_sdwan_phase6_monitoring.yml

    - name: Display STIG hardening summary
      ansible.builtin.debug:
        msg: |
          Phase 19 STIG Hardening Complete!
          Compliance reports: {{ sdwan_artifacts_dir }}/
          Next: ansible-playbook cisco/playbooks/07_sdwan_phase6_monitoring.yml
    - name: "cisco/06_sdwan_phase5_security_hardening | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/06_sdwan_phase5_security_hardening | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | bool
              - fe_cisco_06_sdwan_phase5_security_hardening_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/06_sdwan_phase5_security_hardening: postflight validation failed - preflight passed
              ={{ fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | default(false) }},
              status={{ fe_cisco_06_sdwan_phase5_security_hardening_status | default('unknown') }}.
            success_msg: "cisco/06_sdwan_phase5_security_hardening: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/06_sdwan_phase5_security_hardening | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed: true
            fe_cisco_06_sdwan_phase5_security_hardening_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_status: "failed"
            fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed: false
            fe_cisco_06_sdwan_phase5_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening: FAILED at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "cisco/06_sdwan_phase5_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening failed at '{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task }}': {{ fe_cisco_06_sdwan_phase5_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_06_sdwan_phase5_security_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/06_sdwan_phase5_security_hardening":
                  component: "cisco/06_sdwan_phase5_security_hardening"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_06_sdwan_phase5_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_06_sdwan_phase5_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_06_sdwan_phase5_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_06_sdwan_phase5_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_cisco_06_sdwan_phase5_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_06_sdwan_phase5_security_hardening_status | default('') == 'succeeded' else ['cisco/06_sdwan_phase5_security_hardening'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_06_sdwan_phase5_security_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_06_sdwan_phase5_security_hardening_stats_published: true
          tags:
            - always

        - name: "cisco/06_sdwan_phase5_security_hardening | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/06_sdwan_phase5_security_hardening: {{ fe_cisco_06_sdwan_phase5_security_hardening_status | default('unknown') }} in
              {{ fe_cisco_06_sdwan_phase5_security_hardening_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
