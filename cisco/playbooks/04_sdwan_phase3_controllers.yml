---
# Cisco SD-WAN Phase 17: Controller Configuration
# Configure vBond orchestrator and vSmart controller
# Prerequisite: Phase 16 must be complete

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Phase 17 - SD-WAN Controller Configuration
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  connection: local

  vars:
    apply_changes: false
    sdwan_artifacts_dir: "/tmp/sdwan-fourth-estate-artifacts/phase17"
    fourth_estate_org_name: "FourthEstate"

  pre_tasks:
    - name: "cisco/04_sdwan_phase3_controllers | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cisco/04_sdwan_phase3_controllers | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cisco_04_sdwan_phase3_controllers_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_04_sdwan_phase3_controllers_status: "running"
            fe_cisco_04_sdwan_phase3_controllers_preflight_passed: false
            fe_cisco_04_sdwan_phase3_controllers_postflight_passed: false
            fe_cisco_04_sdwan_phase3_controllers_failed_task: ""
            fe_cisco_04_sdwan_phase3_controllers_error: ""
            fe_cisco_04_sdwan_phase3_controllers_stats_published: false
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cisco/04_sdwan_phase3_controllers: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cisco/04_sdwan_phase3_controllers: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/04_sdwan_phase3_controllers | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cisco/04_sdwan_phase3_controllers: required variable '{{ item }}' is not defined."
            success_msg: "cisco/04_sdwan_phase3_controllers: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cisco_04_sdwan_phase3_controllers_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cisco/04_sdwan_phase3_controllers | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_status: "preflight_failed"
            fe_cisco_04_sdwan_phase3_controllers_postflight_passed: false
            fe_cisco_04_sdwan_phase3_controllers_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_04_sdwan_phase3_controllers_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/04_sdwan_phase3_controllers: FAILED at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/04_sdwan_phase3_controllers":
                  component: "cisco/04_sdwan_phase3_controllers"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_04_sdwan_phase3_controllers_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_04_sdwan_phase3_controllers_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_04_sdwan_phase3_controllers_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_04_sdwan_phase3_controllers_failed_task | default('') }}"
                  error: "{{ fe_cisco_04_sdwan_phase3_controllers_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else ['cisco/04_sdwan_phase3_controllers'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_stats_published: true
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/04_sdwan_phase3_controllers failed at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}': {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/04_sdwan_phase3_controllers | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cisco/04_sdwan_phase3_controllers: preflight
              {{ 'passed' if fe_cisco_04_sdwan_phase3_controllers_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display Phase 17 banner
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          PHASE 17: vBond / vSmart Controller Configuration
          ════════════════════════════════════════════════════════════════
          Configuring:
            ✓ vBond orchestrator registration
            ✓ vSmart controller registration
            ✓ Device certificate issuance (NIST SC-17 / IA-3)
            ✓ OMP route distribution
            ✓ vSmart control policies
          ════════════════════════════════════════════════════════════════
          Mode: {{ apply_changes | ternary('APPLYING CHANGES', 'DRY RUN') }}
          ════════════════════════════════════════════════════════════════

    - name: Create Phase 17 artifacts directory
      ansible.builtin.file:
        path: "{{ sdwan_artifacts_dir }}"
        state: directory
        mode: '0750'

  tasks:
    - name: "cisco/04_sdwan_phase3_controllers | Guarded execution with rescue and always handling"
      block:

        - name: Configure SD-WAN controllers
          ansible.builtin.include_role:
            name: sdwan_controllers_config

      rescue:

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_status: "failed"
            fe_cisco_04_sdwan_phase3_controllers_postflight_passed: false
            fe_cisco_04_sdwan_phase3_controllers_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_04_sdwan_phase3_controllers_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/04_sdwan_phase3_controllers: FAILED at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/04_sdwan_phase3_controllers failed at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}': {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/04_sdwan_phase3_controllers | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_04_sdwan_phase3_controllers_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_04_sdwan_phase3_controllers_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/04_sdwan_phase3_controllers":
                  component: "cisco/04_sdwan_phase3_controllers"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_04_sdwan_phase3_controllers_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_04_sdwan_phase3_controllers_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_04_sdwan_phase3_controllers_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_04_sdwan_phase3_controllers_failed_task | default('') }}"
                  error: "{{ fe_cisco_04_sdwan_phase3_controllers_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else ['cisco/04_sdwan_phase3_controllers'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'failed'
            - not (fe_cisco_04_sdwan_phase3_controllers_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_stats_published: true
          when:
            - fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate Phase 17 completion report
      ansible.builtin.copy:
        dest: "{{ sdwan_artifacts_dir }}/phase17_complete.txt"
        mode: '0640'
        content: |
          Phase 17: Controller Configuration - COMPLETE
          ══════════════════════════════════════════════════
          Completed: {{ ansible_date_time.iso8601 }}
          Mode: {{ apply_changes | ternary('APPLIED', 'DRY RUN') }}

          Components Configured:
            ✓ vBond orchestrator
            ✓ vSmart controller
            ✓ Device certificates
            ✓ OMP route distribution
            ✓ Control policies

          Next Phase: Run 05_sdwan_phase4_edge_onboard.yml

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          Phase 17 Complete!
          Next: ansible-playbook cisco/playbooks/05_sdwan_phase4_edge_onboard.yml
    - name: "cisco/04_sdwan_phase3_controllers | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cisco/04_sdwan_phase3_controllers | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cisco_04_sdwan_phase3_controllers_preflight_passed | bool
              - fe_cisco_04_sdwan_phase3_controllers_status in ['running', 'succeeded']
            fail_msg: >-
              cisco/04_sdwan_phase3_controllers: postflight validation failed - preflight passed
              ={{ fe_cisco_04_sdwan_phase3_controllers_preflight_passed | default(false) }},
              status={{ fe_cisco_04_sdwan_phase3_controllers_status | default('unknown') }}.
            success_msg: "cisco/04_sdwan_phase3_controllers: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cisco/04_sdwan_phase3_controllers | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_postflight_passed: true
            fe_cisco_04_sdwan_phase3_controllers_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_status: "failed"
            fe_cisco_04_sdwan_phase3_controllers_postflight_passed: false
            fe_cisco_04_sdwan_phase3_controllers_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cisco_04_sdwan_phase3_controllers_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cisco/04_sdwan_phase3_controllers: FAILED at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          tags:
            - always
            - rescue

        - name: "cisco/04_sdwan_phase3_controllers | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cisco/04_sdwan_phase3_controllers failed at '{{ fe_cisco_04_sdwan_phase3_controllers_failed_task }}': {{ fe_cisco_04_sdwan_phase3_controllers_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cisco/04_sdwan_phase3_controllers | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cisco_04_sdwan_phase3_controllers_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cisco_04_sdwan_phase3_controllers_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cisco/04_sdwan_phase3_controllers":
                  component: "cisco/04_sdwan_phase3_controllers"
                  type: "playbook"
                  platform: "cisco"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cisco_04_sdwan_phase3_controllers_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cisco_04_sdwan_phase3_controllers_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cisco_04_sdwan_phase3_controllers_started_at | default('') }}"
                  ended_at: "{{ fe_cisco_04_sdwan_phase3_controllers_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cisco_04_sdwan_phase3_controllers_failed_task | default('') }}"
                  error: "{{ fe_cisco_04_sdwan_phase3_controllers_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cisco_04_sdwan_phase3_controllers_status | default('') == 'succeeded' else ['cisco/04_sdwan_phase3_controllers'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cisco_04_sdwan_phase3_controllers_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cisco_04_sdwan_phase3_controllers_stats_published: true
          tags:
            - always

        - name: "cisco/04_sdwan_phase3_controllers | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cisco/04_sdwan_phase3_controllers: {{ fe_cisco_04_sdwan_phase3_controllers_status | default('unknown') }} in
              {{ fe_cisco_04_sdwan_phase3_controllers_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
