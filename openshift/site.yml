---
# OpenShift Container Platform Deployment Playbook
# Entry point for OpenShift platform automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass
#
# Tags:
#   - rbac: RBAC and group sync
#   - namespaces: Namespace management
#   - network: Network policies, ingress
#   - storage: Storage classes, ODF
#   - monitoring: Prometheus, alerting
#   - logging: Log forwarding
#   - gitops: ArgoCD, pipelines
#   - security: PSA, image signing, secrets
#   - compliance: Gatekeeper, compliance operator

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: OpenShift Container Platform Configuration
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Deployment control - set to true to enable each component
    deploy_rbac: true
    deploy_namespaces: true
    deploy_network_policies: true
    deploy_storage: true
    deploy_monitoring: true
    deploy_logging: true
    deploy_gitops: false
    deploy_pipelines: false
    deploy_service_mesh: false
    deploy_security: true
    deploy_compliance: true
    deploy_acm: false
    generate_drift_report: true

  tasks:
    # =========================================
    # Phase 1: RBAC & Identity
    # =========================================
    - name: "openshift/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - RBAC Baseline
          ansible.builtin.include_role:
            name: ocp_rbac_baseline
          when: deploy_rbac | bool
          tags: ['rbac', 'phase1']

        - name: Phase 1 - Group Sync
          ansible.builtin.include_role:
            name: ocp_group_sync
          when: deploy_rbac | bool
          tags: ['rbac', 'phase1']

        - name: Phase 1 - SSO Tuning
          ansible.builtin.include_role:
            name: ocp_sso_tuning
          when: deploy_rbac | bool
          tags: ['rbac', 'phase1']

        # =========================================
        # Phase 2: Namespace Management
        # =========================================
        - name: Phase 2 - Namespace Blueprints
          ansible.builtin.include_role:
            name: ocp_namespace_blueprints
          when: deploy_namespaces | bool
          tags: ['namespaces', 'phase2']

        - name: Phase 2 - Project Request Template
          ansible.builtin.include_role:
            name: ocp_project_request_template
          when: deploy_namespaces | bool
          tags: ['namespaces', 'phase2']

        - name: Phase 2 - Resource Quotas & Limits
          ansible.builtin.include_role:
            name: ocp_resource_quotas_limits
          when: deploy_namespaces | bool
          tags: ['namespaces', 'phase2']

        - name: Phase 2 - Labels & Annotations
          ansible.builtin.include_role:
            name: ocp_labels_annotations
          when: deploy_namespaces | bool
          tags: ['namespaces', 'phase2']

        # =========================================
        # Phase 3: Network Policies
        # =========================================
        - name: Phase 3 - Network Policies Baseline
          ansible.builtin.include_role:
            name: ocp_network_policies_baseline
          when: deploy_network_policies | bool
          tags: ['network', 'phase3']

        - name: Phase 3 - Routes TLS Policy
          ansible.builtin.include_role:
            name: ocp_routes_tls_policy
          when: deploy_network_policies | bool
          tags: ['network', 'phase3']

        - name: Phase 3 - Proxy Trust Bundle
          ansible.builtin.include_role:
            name: ocp_proxy_trust_bundle
          when: deploy_network_policies | bool
          tags: ['network', 'phase3']

        # =========================================
        # Phase 4: Storage
        # =========================================
        - name: Phase 4 - Storage Classes
          ansible.builtin.include_role:
            name: ocp_storage_classes
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        - name: Phase 4 - CSI Operators
          ansible.builtin.include_role:
            name: ocp_csi_operators
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        - name: Phase 4 - ODF Baseline
          ansible.builtin.include_role:
            name: ocp_odf_baseline
          when: deploy_storage | bool and (enable_odf | default(false) | bool)
          tags: ['storage', 'odf', 'phase4']

        - name: Phase 4 - Snapshot Policies
          ansible.builtin.include_role:
            name: ocp_snapshot_policies
          when: deploy_storage | bool
          tags: ['storage', 'phase4']

        # =========================================
        # Phase 5: Monitoring
        # =========================================
        - name: Phase 5 - User Workload Monitoring
          ansible.builtin.include_role:
            name: ocp_monitoring_user_workloads
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase5']

        - name: Phase 5 - Events Exporter
          ansible.builtin.include_role:
            name: ocp_events_exporter
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase5']

        # =========================================
        # Phase 6: Logging
        # =========================================
        - name: Phase 6 - Log Forwarding
          ansible.builtin.include_role:
            name: ocp_log_forwarding
          when: deploy_logging | bool
          tags: ['logging', 'phase6']

        - name: Phase 6 - Audit Configuration
          ansible.builtin.include_role:
            name: ocp_audit_config
          when: deploy_logging | bool
          tags: ['logging', 'phase6']

        # =========================================
        # Phase 7: GitOps & Pipelines (Optional)
        # =========================================
        - name: Phase 7 - ArgoCD GitOps
          ansible.builtin.include_role:
            name: ocp_argocd_gitops
          when: deploy_gitops | bool
          tags: ['gitops', 'phase7']

        - name: Phase 7 - Tekton Pipelines
          ansible.builtin.include_role:
            name: ocp_pipelines_tekton
          when: deploy_pipelines | bool
          tags: ['pipelines', 'phase7']

        - name: Phase 7 - Build Configs
          ansible.builtin.include_role:
            name: ocp_build_configs
          when: deploy_pipelines | bool
          tags: ['pipelines', 'phase7']

        # =========================================
        # Phase 8: Service Mesh (Optional)
        # =========================================
        - name: Phase 8 - Service Mesh
          ansible.builtin.include_role:
            name: ocp_service_mesh
          when: deploy_service_mesh | bool
          tags: ['servicemesh', 'phase8']

        - name: Phase 8 - Serverless Knative
          ansible.builtin.include_role:
            name: ocp_serverless_knative
          when: deploy_service_mesh | bool
          tags: ['serverless', 'phase8']

        # =========================================
        # Phase 9: Security
        # =========================================
        - name: Phase 9 - Pod Security Admission
          ansible.builtin.include_role:
            name: ocp_psa_enforce
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - SCC Legacy Management
          ansible.builtin.include_role:
            name: ocp_scc_legacy_mgmt
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - Secrets Management
          ansible.builtin.include_role:
            name: ocp_secrets_management
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - Image Signing Policy
          ansible.builtin.include_role:
            name: ocp_image_signing_policy
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - Cert Manager
          ansible.builtin.include_role:
            name: ocp_cert_manager_operator
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - Internal Registry
          ansible.builtin.include_role:
            name: ocp_internal_registry
          when: deploy_security | bool
          tags: ['security', 'phase9']

        - name: Phase 9 - Quay External Registry
          ansible.builtin.include_role:
            name: ocp_quay_external_registry
          when: deploy_security | bool
          tags: ['security', 'phase9']

        # =========================================
        # Phase 10: Compliance & Governance
        # =========================================
        - name: Phase 10 - Gatekeeper Policies
          ansible.builtin.include_role:
            name: ocp_gatekeeper_policies
          when: deploy_compliance | bool
          tags: ['compliance', 'phase10']

        # =========================================
        # Phase 11: Cluster Operations
        # =========================================
        - name: Phase 11 - Machine Configs
          ansible.builtin.include_role:
            name: ocp_machine_configs
          tags: ['operations', 'phase11']

        - name: Phase 11 - Node Tuning
          ansible.builtin.include_role:
            name: ocp_node_tuning
          tags: ['operations', 'phase11']

        - name: Phase 11 - Autoscaling (HPA/VPA)
          ansible.builtin.include_role:
            name: ocp_hpa_vpa_autoscaling
          tags: ['operations', 'phase11']

        - name: Phase 11 - Cluster Autoscaling
          ansible.builtin.include_role:
            name: ocp_autoscaling
          tags: ['operations', 'phase11']

        - name: Phase 11 - Maintenance Windows
          ansible.builtin.include_role:
            name: ocp_maintenance_windows
          tags: ['operations', 'phase11']

        - name: Phase 11 - Upgrade Channel
          ansible.builtin.include_role:
            name: ocp_upgrade_channel
          tags: ['operations', 'phase11']

        # =========================================
        # Phase 12: ACM Multi-Cluster (Optional)
        # =========================================
        - name: Phase 12 - ACM Hub
          ansible.builtin.include_role:
            name: ocp_acm_hub
          when: deploy_acm | bool
          tags: ['acm', 'phase12']

        - name: Phase 12 - ACM Cluster Sets
          ansible.builtin.include_role:
            name: ocp_acm_cluster_sets
          when: deploy_acm | bool
          tags: ['acm', 'phase12']

        - name: Phase 12 - ACM Governance
          ansible.builtin.include_role:
            name: ocp_acm_governance
          when: deploy_acm | bool
          tags: ['acm', 'phase12']

        - name: Phase 12 - Multicluster Services
          ansible.builtin.include_role:
            name: ocp_multicluster_services
          when: deploy_acm | bool
          tags: ['acm', 'phase12']

        # =========================================
        # Phase 13: Validation & Reporting
        # =========================================
        - name: Phase 13 - Preflight Drift Report
          ansible.builtin.include_role:
            name: ocp_preflight_drift_report
          when: generate_drift_report | bool
          tags: ['validation', 'phase13']

        - name: Phase 13 - Cost Management
          ansible.builtin.include_role:
            name: ocp_cost_management
          tags: ['validation', 'phase13']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== OpenShift Deployment Complete ==="
              - "Cluster: {{ ocp_cluster_name | default('production') }}"
              - "API URL: {{ ocp_api_url | default('https://api.cluster.example.com:6443') }}"
              - "RBAC: {{ 'Configured' if deploy_rbac else 'Skipped' }}"
              - "Namespaces: {{ 'Configured' if deploy_namespaces else 'Skipped' }}"
              - "Network Policies: {{ 'Configured' if deploy_network_policies else 'Skipped' }}"
              - "Storage: {{ 'Configured' if deploy_storage else 'Skipped' }}"
              - "Monitoring: {{ 'Configured' if deploy_monitoring else 'Skipped' }}"
              - "Logging: {{ 'Configured' if deploy_logging else 'Skipped' }}"
              - "GitOps: {{ 'Configured' if deploy_gitops else 'Skipped' }}"
              - "Security: {{ 'Configured' if deploy_security else 'Skipped' }}"
              - "Compliance: {{ 'Configured' if deploy_compliance else 'Skipped' }}"
              - "ACM Multi-Cluster: {{ 'Configured' if deploy_acm else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "openshift/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_openshift_site_status: "failed"
            fe_openshift_site_postflight_passed: false
            fe_openshift_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_openshift_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "openshift/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              openshift/site: FAILED at '{{ fe_openshift_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_openshift_site_error }}
          tags:
            - always
            - rescue

        - name: "openshift/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              openshift/site failed at '{{ fe_openshift_site_failed_task }}': {{ fe_openshift_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "openshift/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_openshift_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_openshift_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_openshift_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "openshift/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "openshift/site":
                  component: "openshift/site"
                  type: "playbook"
                  platform: "openshift"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_openshift_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_openshift_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_openshift_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_openshift_site_started_at | default('') }}"
                  ended_at: "{{ fe_openshift_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_openshift_site_failed_task | default('') }}"
                  error: "{{ fe_openshift_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_openshift_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_openshift_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_openshift_site_status | default('') == 'succeeded' else ['openshift/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_openshift_site_status | default('') == 'failed'
            - not (fe_openshift_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "openshift/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_openshift_site_stats_published: true
          when:
            - fe_openshift_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "openshift/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "openshift/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_openshift_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_openshift_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_openshift_site_status: "running"
            fe_openshift_site_preflight_passed: false
            fe_openshift_site_postflight_passed: false
            fe_openshift_site_failed_task: ""
            fe_openshift_site_error: ""
            fe_openshift_site_stats_published: false
          tags:
            - always

        - name: "openshift/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              openshift/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              openshift/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "openshift/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "openshift/site: required variable '{{ item }}' is not defined."
            success_msg: "openshift/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_openshift_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "openshift/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_openshift_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "openshift/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_openshift_site_status: "preflight_failed"
            fe_openshift_site_postflight_passed: false
            fe_openshift_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_openshift_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "openshift/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              openshift/site: FAILED at '{{ fe_openshift_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_openshift_site_error }}
          tags:
            - always
            - rescue

        - name: "openshift/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "openshift/site":
                  component: "openshift/site"
                  type: "playbook"
                  platform: "openshift"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_openshift_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_openshift_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_openshift_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_openshift_site_started_at | default('') }}"
                  ended_at: "{{ fe_openshift_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_openshift_site_failed_task | default('') }}"
                  error: "{{ fe_openshift_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_openshift_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_openshift_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_openshift_site_status | default('') == 'succeeded' else ['openshift/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "openshift/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_openshift_site_stats_published: true
          tags:
            - always

        - name: "openshift/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              openshift/site failed at '{{ fe_openshift_site_failed_task }}': {{ fe_openshift_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "openshift/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              openshift/site: preflight
              {{ 'passed' if fe_openshift_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "openshift/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "openshift/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_openshift_site_preflight_passed | bool
              - fe_openshift_site_status in ['running', 'succeeded']
            fail_msg: >-
              openshift/site: postflight validation failed - preflight passed
              ={{ fe_openshift_site_preflight_passed | default(false) }},
              status={{ fe_openshift_site_status | default('unknown') }}.
            success_msg: "openshift/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "openshift/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_openshift_site_postflight_passed: true
            fe_openshift_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "openshift/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_openshift_site_status: "failed"
            fe_openshift_site_postflight_passed: false
            fe_openshift_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_openshift_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "openshift/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              openshift/site: FAILED at '{{ fe_openshift_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_openshift_site_error }}
          tags:
            - always
            - rescue

        - name: "openshift/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              openshift/site failed at '{{ fe_openshift_site_failed_task }}': {{ fe_openshift_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "openshift/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_openshift_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_openshift_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_openshift_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "openshift/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "openshift/site":
                  component: "openshift/site"
                  type: "playbook"
                  platform: "openshift"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_openshift_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_openshift_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_openshift_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_openshift_site_started_at | default('') }}"
                  ended_at: "{{ fe_openshift_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_openshift_site_failed_task | default('') }}"
                  error: "{{ fe_openshift_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_openshift_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_openshift_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_openshift_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_openshift_site_status | default('') == 'succeeded' else ['openshift/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_openshift_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "openshift/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_openshift_site_stats_published: true
          tags:
            - always

        - name: "openshift/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              openshift/site: {{ fe_openshift_site_status | default('unknown') }} in
              {{ fe_openshift_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
