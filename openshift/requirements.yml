---
# OpenShift Ansible Collections Requirements
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  - name: kubernetes.core
    version: ">=2.4.0"

  # community.okd is the upstream of the certified redhat.openshift
  # collection (same modules). No role here uses either FQCN today; this is
  # kept for operators who script oc/OpenShift tasks on top of these roles.
  # redhat.openshift >=2.3.0 is Automation Hub-only and was dropped because
  # it cannot resolve from community Galaxy.
  - name: community.okd
    version: ">=2.3.0"

  - name: community.general
    version: ">=8.0.0"

  - name: ansible.posix
    version: ">=1.5.0"

# Python dependencies (install separately):
# pip install openshift kubernetes
# pip install PyYAML jmespath
