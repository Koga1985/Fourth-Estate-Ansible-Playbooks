---
# Common vars expected (override via -e or vars files):
# kubeconfig: ~/.kube/config
# context: ""
# artifacts_dir: /tmp/ocp-artifacts
# This pack assumes the kubernetes.core collection is installed.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['openshift/ocp_upgrade__channel_pause']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_openshift_ocp_upgrade__channel_pause_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "openshift/ocp_upgrade__channel_pause | Initialize validation state"
  ansible.builtin.set_fact:
    fe_openshift_ocp_upgrade__channel_pause_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_openshift_ocp_upgrade__channel_pause_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_openshift_ocp_upgrade__channel_pause_status: "running"
    fe_openshift_ocp_upgrade__channel_pause_preflight_passed: false
    fe_openshift_ocp_upgrade__channel_pause_postflight_passed: false
    fe_openshift_ocp_upgrade__channel_pause_failed_task: ""
    fe_openshift_ocp_upgrade__channel_pause_error: ""
    fe_openshift_ocp_upgrade__channel_pause_stats_published: false
  tags:
    - always

- name: "openshift/ocp_upgrade__channel_pause | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "openshift/ocp_upgrade__channel_pause | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          openshift/ocp_upgrade__channel_pause: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          openshift/ocp_upgrade__channel_pause: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "openshift/ocp_upgrade__channel_pause | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "openshift/ocp_upgrade__channel_pause: required variable '{{ item }}' is not defined."
        success_msg: "openshift/ocp_upgrade__channel_pause: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_openshift_ocp_upgrade__channel_pause_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "openshift/ocp_upgrade__channel_pause | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_openshift_ocp_upgrade__channel_pause_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set update channel
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig | default(lookup('env','KUBECONFIG')) }}"
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: ClusterVersion
          metadata: { name: version }
          spec: { channel: "{{ channel | default('stable-4.x') }}" }

    - name: Export version status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig | default(lookup('env','KUBECONFIG')) }}"
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: _cv

    - name: Write status artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/ocp-artifacts') }}/cluster_version_status.json"
        mode: "0644"
        content: "{{ _cv.resources[0] | to_nice_json }}"

    # ----------------------------- postflight -------------------

    - name: "openshift/ocp_upgrade__channel_pause | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_openshift_ocp_upgrade__channel_pause_preflight_passed | bool
          - fe_openshift_ocp_upgrade__channel_pause_status in ['running', 'succeeded']
        fail_msg: >-
          openshift/ocp_upgrade__channel_pause: postflight validation failed - preflight passed
          ={{ fe_openshift_ocp_upgrade__channel_pause_preflight_passed | default(false) }},
          status={{ fe_openshift_ocp_upgrade__channel_pause_status | default('unknown') }}.
        success_msg: "openshift/ocp_upgrade__channel_pause: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "openshift/ocp_upgrade__channel_pause | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_openshift_ocp_upgrade__channel_pause_postflight_passed: true
        fe_openshift_ocp_upgrade__channel_pause_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "openshift/ocp_upgrade__channel_pause | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_openshift_ocp_upgrade__channel_pause_status: "failed"
        fe_openshift_ocp_upgrade__channel_pause_postflight_passed: false
        fe_openshift_ocp_upgrade__channel_pause_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_openshift_ocp_upgrade__channel_pause_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "openshift/ocp_upgrade__channel_pause | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          openshift/ocp_upgrade__channel_pause: FAILED at '{{ fe_openshift_ocp_upgrade__channel_pause_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_openshift_ocp_upgrade__channel_pause_error }}
      tags:
        - always
        - rescue

    - name: "openshift/ocp_upgrade__channel_pause | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          openshift/ocp_upgrade__channel_pause failed at '{{ fe_openshift_ocp_upgrade__channel_pause_failed_task }}': {{ fe_openshift_ocp_upgrade__channel_pause_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "openshift/ocp_upgrade__channel_pause | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_openshift_ocp_upgrade__channel_pause_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_openshift_ocp_upgrade__channel_pause_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_openshift_ocp_upgrade__channel_pause_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "openshift/ocp_upgrade__channel_pause | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "openshift/ocp_upgrade__channel_pause":
              component: "openshift/ocp_upgrade__channel_pause"
              type: "tasks"
              platform: "openshift"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_openshift_ocp_upgrade__channel_pause_status | default('unknown') }}"
              preflight_passed: "{{ fe_openshift_ocp_upgrade__channel_pause_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_openshift_ocp_upgrade__channel_pause_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_openshift_ocp_upgrade__channel_pause_started_at | default('') }}"
              ended_at: "{{ fe_openshift_ocp_upgrade__channel_pause_ended_at | default('') }}"
              duration_seconds: "{{ fe_openshift_ocp_upgrade__channel_pause_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_openshift_ocp_upgrade__channel_pause_failed_task | default('') }}"
              error: "{{ fe_openshift_ocp_upgrade__channel_pause_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_openshift_ocp_upgrade__channel_pause_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_openshift_ocp_upgrade__channel_pause_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_openshift_ocp_upgrade__channel_pause_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_openshift_ocp_upgrade__channel_pause_status | default('') == 'succeeded' else ['openshift/ocp_upgrade__channel_pause'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "openshift/ocp_upgrade__channel_pause | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_openshift_ocp_upgrade__channel_pause_stats_published: true
      tags:
        - always
