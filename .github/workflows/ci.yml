name: CI

# Validates that the playbooks actually parse and lint, so "production ready"
# is a verifiable state instead of a claim. See docs/PRODUCTION_READINESS_ASSESSMENT.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ENFORCED GATE 1: YAML must parse and have no duplicate keys.
  # Catches the class of bug that aborts ansible-playbook before any task runs.
  # Requires no Ansible collections, so it is fast and runner-agnostic.
  # ---------------------------------------------------------------------------
  yaml:
    name: YAML parse + lint (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yamllint + PyYAML
        run: pip install --quiet yamllint pyyaml

      - name: YAML parse check (all .yml/.yaml must load)
        run: python3 scripts/check_yaml.py .

      - name: yamllint (syntax errors, duplicate keys, truthy, indentation)
        run: yamllint -c .yamllint .

      # Catches the failure `syntax-check[unknown-module]` is named after but
      # cannot detect here: the enforced ansible-lint job runs --offline with no
      # collections installed, so that rule fires for every non-builtin module
      # and is permanently baselined. This check is deterministic and offline --
      # every collection the repo calls must be installable from a
      # requirements.yml. It does not verify that a module exists inside a
      # collection; that needs Galaxy, see the informational job below.
      - name: Collections in use are declared in a requirements.yml
        run: python3 scripts/check_collections.py .

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 2: every Jinja expression must parse, every filter and test it
  # uses must exist, and it must render the value it claims. Nothing else here
  # proves that: a broken expression is valid YAML, passes yamllint, passes
  # ansible-lint and passes --syntax-check, then fails at run time on the
  # customer's machine. Five such expressions shipped before this gate existed
  # (| splitlines, | enumerate, | all, a pipe into a variable, and doubled {{ }}
  # braces in an embedded script) -- all in code paths molecule cannot reach,
  # because they sit behind apply_changes, behind credential preflights, or in a
  # playbook that is not a role.
  #
  # It also rejects two expressions that parse but render the wrong thing:
  # `| bool` in a JSON template (Python's True/False is not valid JSON) and a
  # read of `environment`, a play keyword that is always defined, so default()
  # never fires and the value renders as []. See docs/TESTING.md.
  #
  # Deterministic and offline: it parses and probes, never renders, so it cannot
  # execute a lookup. Known-broken expressions are tracked in
  # .jinja-check-ignore; new ones fail the build.
  # ---------------------------------------------------------------------------
  jinja:
    name: Jinja expressions parse (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + PyYAML (pinned)
        run: pip install --quiet ansible-core==2.19.11 pyyaml

      - name: Every Jinja expression parses and its filters resolve
        run: python3 scripts/check_jinja_filters.py .

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 3: no credential reaches the repository.
  #
  # The counterpart to the no_log work: that stopped credentials leaking into
  # job OUTPUT, this stops one being committed as SOURCE. Nothing checked for
  # that before.
  #
  # gitleaks' built-in rules look for high-entropy provider tokens -- AWS keys,
  # GitHub PATs. Run here they find nothing, which is correct but is not the
  # shape a secret would take in an Ansible repository. The realistic leak is an
  # ordinary password typed into a vars block, with no entropy signature at all:
  #
  #     ansible_password: Summer2024!
  #
  # .gitleaks.toml keeps every default rule and adds the rules that catch that,
  # with allowlists for the indirection this repo already uses ({{ vault_x }},
  # lookup(), CHANGE_ME). Known findings are baseline-ratcheted in
  # .gitleaks-baseline.json, the same way .ansible-lint-ignore and
  # .jinja-check-ignore work: everything currently in history is recorded, and
  # anything NEW fails the build.
  #
  # History matters as much as the working tree -- a credential committed once
  # and deleted later is still in the objects -- so this scans every ref, which
  # is why the checkout needs fetch-depth 0.
  # ---------------------------------------------------------------------------
  secrets:
    name: No committed credentials (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks needs full history, not a shallow clone

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every ref's history
        run: |
          gitleaks git . --log-opts="--all" \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact --verbose --no-banner

      - name: Scan the working tree
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact --verbose --no-banner

      # A gate that detects nothing passes quietly forever. This plants a
      # credential of each shape the custom rules exist for and asserts every
      # one is caught, and plants the indirection this repo uses and asserts
      # none is -- so a change to .gitleaks.toml that blinds the rules, or makes
      # them too broad, fails here rather than years later.
      - name: The rules still detect what they are for
        run: ./scripts/check_secret_gate.sh

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 4: the execution environment composes, per platform.
  #
  # Customers take one platform directory, not the whole repository, so
  # execution_environment/build.sh --platform <name> builds an image carrying
  # only that platform's collections. Two things can rot silently:
  #
  #   1. execution_environment/requirements.yml (the --all union) drifts from
  #      the platform requirements.yml files it is composed from, so an EE built
  #      from it is missing a collection a role needs.
  #   2. A platform's requirements.yml stops producing a valid ansible-builder
  #      definition, which is only discovered when someone tries to build it.
  #
  # This checks both without network access: the composition is pure YAML
  # merging, and 'ansible-builder create' writes a build context without
  # pulling a base image or contacting Galaxy.
  # ---------------------------------------------------------------------------
  execution-environment:
    name: EE requirements compose (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-builder + PyYAML
        run: pip install --quiet "ansible-builder>=3.0" pyyaml

      - name: The committed union matches what the platform files compose to
        run: |
          set -euo pipefail
          cd execution_environment
          ./compose-requirements.py --all -o /tmp/union-composed.yml
          python3 - <<'PYEOF'
          import sys, yaml
          committed = yaml.safe_load(open("requirements.yml"))["collections"]
          composed = yaml.safe_load(open("/tmp/union-composed.yml"))["collections"]
          a = {c["name"]: c.get("version") for c in committed}
          b = {c["name"]: c.get("version") for c in composed}
          if a == b:
              print("requirements.yml matches the composition (%d collections)" % len(a))
              sys.exit(0)
          print("execution_environment/requirements.yml is out of date.")
          print("Regenerate it:  cd execution_environment && ./compose-requirements.py --all -o requirements.yml")
          for name in sorted(set(b) - set(a)):
              print("  missing from the union:      %s %s" % (name, b[name] or ""))
          for name in sorted(set(a) - set(b)):
              print("  in the union but undeclared: %s %s" % (name, a[name] or ""))
          for name in sorted(n for n in set(a) & set(b) if a[n] != b[n]):
              print("  floor differs:               %s committed=%s composed=%s" % (name, a[name], b[name]))
          sys.exit(1)
          PYEOF

      - name: Every platform composes to a valid execution environment
        run: |
          set -euo pipefail
          cd execution_environment
          fail=0
          for platform in $(./compose-requirements.py --list | awk '{print $1}'); do
            ctx="$(mktemp -d)"
            cp execution-environment.yml requirements.txt bindep.txt "$ctx/"
            if ./compose-requirements.py --platform "$platform" -o "$ctx/requirements.yml" \
               && ansible-builder create --file "$ctx/execution-environment.yml" \
                                         --context "$ctx/context" >/dev/null; then
              echo "  ok   $platform ($(grep -c '^  - name:' "$ctx/requirements.yml" || true) collections)"
            else
              echo "  FAIL $platform"
              fail=$((fail+1))
            fi
            rm -rf "$ctx"
          done
          echo "Platforms that failed to compose: $fail"
          [ "$fail" -eq 0 ]

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 5: ansible-lint (deterministic, --offline, PINNED toolchain).
  # Uses .ansible-lint (profile + documented skips) and the .ansible-lint-ignore
  # baseline so the current tree passes and any NEW violation fails the build.
  # --offline keeps results identical regardless of Ansible Galaxy availability,
  # and the pinned ansible-core/ansible-lint versions keep the rule behavior
  # identical across runs (unpinned tools silently invalidated the baseline when
  # a new release changed syntax-check classification). The baseline was
  # regenerated against exactly these versions; bump the pins and regenerate
  # .ansible-lint-ignore (ansible-lint --offline --generate-ignore <dirs>) in
  # the same PR. Collection/roles-path-dependent rules (syntax-check,
  # load-failure) are exercised by the informational job below where
  # collections are installed.
  # ---------------------------------------------------------------------------
  ansible-lint:
    name: ansible-lint (required, baseline-ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + ansible-lint (pinned)
        run: pip install --quiet ansible-core==2.19.11 ansible-lint==26.6.0

      - name: ansible-lint (offline, baseline-ratcheted)
        run: |
          dirs=$(ls -d */ | grep -vE '^(docs|\.vscode|scripts)/' | tr -d '/' | tr '\n' ' ')
          ansible-lint --offline $dirs

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 6: ansible-playbook --syntax-check for the grab-and-go
  # playbooks that resolve with ansible-core alone (no Galaxy collections
  # needed at parse time). Deterministic on any runner. Add new entries here
  # as more playbooks become collection-free at parse time.
  # ---------------------------------------------------------------------------
  syntax-check-core:
    name: syntax-check, core-only playbooks (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core (pinned)
        run: pip install --quiet ansible-core==2.19.11

      - name: Syntax-check core-only playbooks
        run: |
          # "<roles_path> <playbook>" pairs, verified to parse with ansible-core only.
          set -e
          fail=0
          while read -r roles_path pb; do
            echo "::group::${pb}"
            if ! ANSIBLE_ROLES_PATH="$roles_path" ansible-playbook --syntax-check "$pb"; then
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done <<'EOF'
          cloud_policy/roles cloud_policy/roles/cloud_computing_srg_assessment/playbooks/run.yml
          network_policy/roles network_policy/roles/ndm_srg_assessment/playbooks/run.yml
          databases/db2/roles databases/db2/roles/db2_stig/playbooks/run.yml
          policy_as_code/roles policy_as_code/roles/app_sec_dev_stig/playbooks/run.yml
          app_web_server/roles app_web_server/roles/apache_web_server_srg/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_racf_stig/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_tss_stig/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_cics_tss_stig/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_netview_tss_stig/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_tdmf_tss_stig/playbooks/run.yml
          ibm_zos/roles ibm_zos/roles/zos_zsecure_stig/playbooks/run.yml
          EOF
          exit $fail

  # ---------------------------------------------------------------------------
  # ENFORCED GATE 7: molecule, for the roles that can run on the control node.
  # Delegated scenarios -- no container or VM -- so this needs no Docker and is
  # runner-agnostic. Only roles that make no system changes are onboarded (see
  # docs/TESTING.md); the sequence is syntax + converge + idempotence, and
  # idempotence is the part that earns its keep.
  # ---------------------------------------------------------------------------
  molecule:
    name: molecule, control-node roles (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + molecule (pinned)
        run: pip install --quiet ansible-core==2.19.11 molecule==26.8.0

      # Only delegated scenarios (managed: false) run here. A scenario using a
      # container driver needs that driver's plugin and a daemon, so it is out
      # of scope for this gate; kubernetes/roles/k8s-cluster-hardening keeps its
      # own docker-driver scenario for local use.
      - name: Run every delegated molecule scenario
        run: |
          set -o pipefail
          fail=0; total=0
          while read -r cfg; do
            # Strip from "/molecule/" onward to get the role directory. Counting
            # dirname calls is fragile: the path is
            # <role>/molecule/<scenario>/molecule.yml, so it needs three, and
            # getting it wrong cd's into the molecule directory where molecule
            # finds no scenario at all.
            cfg="${cfg#./}"
            rd="${cfg%%/molecule/*}"
            rp=$(dirname "$rd")
            scenario=$(basename "$(dirname "$cfg")")

            # Fail loudly rather than silently mis-running if the layout moves.
            if [ ! -d "${rd}/tasks" ]; then
              echo "::error file=${cfg}::derived role dir '${rd}' has no tasks/ - path derivation is wrong"
              fail=$((fail+1))
              continue
            fi

            total=$((total+1))
            echo "::group::molecule ${rd} (${scenario})"
            if ! (cd "$rd" && ANSIBLE_ROLES_PATH="${GITHUB_WORKSPACE}/${rp}" \
                  molecule test -s "$scenario"); then
              echo "::error file=${cfg}::molecule failed for ${rd}"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done < <(grep -rl 'managed: false' --include=molecule.yml . | sort)
          echo "molecule scenarios: ${total}, failed: ${fail}"
          exit $fail

  # ---------------------------------------------------------------------------
  # PROMOTABLE GATE: ansible-lint with the declared collections installed.
  #
  # The required ansible-lint job above runs --offline with no collections, so
  # syntax-check[unknown-module] fires for every non-builtin module and those
  # findings are baselined permanently in .ansible-lint-ignore. The rule can
  # therefore never catch a module that genuinely does not exist.
  #
  # This job installs the collections, which makes the rule meaningful. It
  # ratchets against its OWN baseline, .ansible-lint-ignore-online, and turns
  # itself into a blocking gate the moment that file is committed -- no edit to
  # this workflow is needed. Generate it on a Galaxy-enabled machine with
  # ./scripts/generate_online_baseline.sh (see docs/TESTING.md).
  # ---------------------------------------------------------------------------
  ansible-lint-online:
    name: ansible-lint with collections (blocking once baselined)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + ansible-lint (pinned)
        run: pip install --quiet ansible-core==2.19.11 ansible-lint==26.6.0

      - name: Is the online baseline committed?
        id: baseline
        run: |
          if [ -f .ansible-lint-ignore-online ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # A requirements file may carry a "# automation-hub-only: <collections>"
      # line to declare that its collection has no stable community-Galaxy release
      # (Red Hat Automation Hub only, e.g. ansible.controller). Install
      # failures for those files are expected here and do not count as
      # missing -- their unknown-module findings live in the online baseline.
      - name: Install declared collections
        id: collections
        continue-on-error: true
        run: |
          missing=0
          while read -r req; do
            echo "::group::ansible-galaxy install -r $req"
            if ! ansible-galaxy collection install -r "$req"; then
              if grep -q '^# automation-hub-only:' "$req"; then
                echo "expected failure (automation-hub-only): $req"
              else
                missing=$((missing+1))
              fi
            fi
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -name 'requirements.yml' -print | sort)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "requirements files that failed to install unexpectedly: $missing"

      # Blocking path: baseline committed and every collection installed, so a
      # finding is about the repository rather than about a missing collection.
      - name: ansible-lint with collections (ratcheted, blocking)
        if: steps.baseline.outputs.present == 'true' && steps.collections.outputs.missing == '0'
        run: |
          dirs=$(ls -d */ | grep -vE '^(docs|\.vscode|scripts)/' | tr -d '/' | tr '\n' ' ')
          ansible-lint -i .ansible-lint-ignore-online $dirs

      # Baseline committed but Galaxy was unreachable: report, do not fail, as
      # the findings would be install artifacts.
      - name: Galaxy unreachable, skipping the blocking check
        if: steps.baseline.outputs.present == 'true' && steps.collections.outputs.missing != '0'
        run: |
          echo "::warning::${{ steps.collections.outputs.missing }} requirements file(s) failed to install; skipping the blocking lint because findings would be install artifacts, not repository defects."

      # Not yet baselined: informational only, and says exactly how to promote.
      - name: Informational run (no online baseline yet)
        if: steps.baseline.outputs.present != 'true'
        run: |
          dirs=$(ls -d */ | grep -vE '^(docs|\.vscode|scripts)/' | tr -d '/' | tr '\n' ' ')
          ansible-lint $dirs || true
          echo ""
          echo "::notice::This job is informational because .ansible-lint-ignore-online is not committed. Run ./scripts/generate_online_baseline.sh on a machine that can reach galaxy.ansible.com and commit the result to make this a blocking gate."

      - name: Syntax-check discoverable playbooks (informational)
        continue-on-error: true
        run: |
          shopt -s globstar nullglob
          fail=0
          for pb in **/*.yml; do
            case "$pb" in .git/*|.github/*) continue;; esac
            if grep -qE '^\s*-?\s*hosts:' "$pb" 2>/dev/null; then
              if ! ansible-playbook --syntax-check "$pb" >/dev/null 2>&1; then
                echo "syntax-check could not validate: $pb"
                fail=$((fail+1))
              fi
            fi
          done
          echo "Playbooks that did not pass syntax-check (often missing collections): $fail"
