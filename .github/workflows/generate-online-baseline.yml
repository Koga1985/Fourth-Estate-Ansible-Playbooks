name: Generate online lint baseline

# Manually-dispatched maintenance job. Runs scripts/generate_online_baseline.sh
# on a Galaxy-reachable runner and pushes the resulting
# .ansible-lint-ignore-online to the branch it was dispatched on. Committing
# that file is what promotes the "ansible-lint with collections" CI job from
# informational to blocking (see .github/workflows/ci.yml).
#
# Re-dispatch this whenever the pinned ansible-core/ansible-lint versions
# change, the same way .ansible-lint-ignore is regenerated. It also re-runs
# automatically when this workflow or the generation script changes (the
# baseline commit it pushes uses GITHUB_TOKEN, which never triggers new
# workflow runs, so it cannot loop).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-online-baseline.yml"
      - "scripts/generate_online_baseline.sh"

permissions:
  contents: write

jobs:
  generate:
    name: generate + push .ansible-lint-ignore-online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + ansible-lint (pinned, same as CI)
        run: pip install --quiet ansible-core==2.19.11 ansible-lint==26.6.0

      - name: Generate the online baseline
        run: ./scripts/generate_online_baseline.sh

      - name: Sanity-check the result
        run: |
          # The script must leave the offline baseline untouched. An empty or
          # missing online baseline means the ANSIBLE_LINT_IGNORE_FILE
          # redirect was not honored and the findings were lost -- fail rather
          # than commit a baseline that would turn the blocking gate red.
          git diff --exit-code .ansible-lint-ignore
          test -s .ansible-lint-ignore-online
          echo "online baseline entries: $(grep -cvE '^\s*(#|$)' .ansible-lint-ignore-online)"

      - name: Commit and push the baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ansible-lint-ignore-online
          if git diff --cached --quiet; then
            echo "Baseline unchanged; nothing to push."
            exit 0
          fi
          git commit \
            -m "Add the online lint baseline; promote the Galaxy lint gate to blocking" \
            -m "Generated by the generate-online-baseline workflow with the pinned toolchain (ansible-core 2.19.11 / ansible-lint 26.6.0) and the declared collections installed. With this file committed, the 'ansible-lint with collections' CI job ratchets against it and blocks on new findings."
          git push origin "HEAD:${GITHUB_REF_NAME}"
