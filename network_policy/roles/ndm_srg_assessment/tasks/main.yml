---
# tasks file for ndm_srg_assessment
# Aggregates device STIG artifacts into a consolidated NDM SRG / Network
# Infrastructure Policy evidence package. Read-only.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['network_policy/ndm_srg_assessment']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_network_policy_ndm_srg_assessment_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "network_policy/ndm_srg_assessment | Initialize validation state"
  ansible.builtin.set_fact:
    fe_network_policy_ndm_srg_assessment_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_network_policy_ndm_srg_assessment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_network_policy_ndm_srg_assessment_status: "running"
    fe_network_policy_ndm_srg_assessment_preflight_passed: false
    fe_network_policy_ndm_srg_assessment_postflight_passed: false
    fe_network_policy_ndm_srg_assessment_failed_task: ""
    fe_network_policy_ndm_srg_assessment_error: ""
    fe_network_policy_ndm_srg_assessment_stats_published: false
  tags:
    - always

- name: "network_policy/ndm_srg_assessment | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "network_policy/ndm_srg_assessment | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          network_policy/ndm_srg_assessment: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          network_policy/ndm_srg_assessment: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "network_policy/ndm_srg_assessment | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "network_policy/ndm_srg_assessment: required variable '{{ item }}' is not defined."
        success_msg: "network_policy/ndm_srg_assessment: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_network_policy_ndm_srg_assessment_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "network_policy/ndm_srg_assessment | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_network_policy_ndm_srg_assessment_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      changed_when: false
      tags: [always]

    - name: Discover per-device STIG artifacts
      ansible.builtin.find:
        paths: "{{ ndm_evidence_input_dirs }}"
        patterns: "*.json"
        file_type: file
      register: ndm_found
      changed_when: false
      tags: [assess]

    - name: Load device artifacts
      ansible.builtin.set_fact:
        ndm_device_evidence: "{{ ndm_device_evidence | default([]) + [lookup('file', item.path) | from_json] }}"
      loop: "{{ ndm_found.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false
      tags: [assess]

    - name: Build flat set of device control IDs that were assessed/remediated
      ansible.builtin.set_fact:
        ndm_seen_controls: >-
          {{ ndm_device_evidence | default([])
             | map(attribute='controls', default=[])
             | flatten
             | map(attribute='id', default='')
             | select('string')
             | reject('equalto', '')
             | list | unique }}
      changed_when: false
      tags: [assess]

    - name: Assemble consolidated evidence map
      ansible.builtin.set_fact:
        ndm_assessment:
          meta:
            timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
            benchmark: "{{ stig_benchmark }}"
            version: "{{ stig_version }}"
            compliance_frameworks: "{{ compliance_frameworks }}"
            device_artifacts_found: "{{ ndm_found.files | length }}"
          ndm_srg: >-
            {{ ndm_srg_catalog | map('combine', {'evidence_present': false}) | list }}
          network_infrastructure_policy: "{{ network_infra_policy_catalog }}"
      changed_when: false
      tags: [assess]

    - name: Mark NDM SRG controls with collected device evidence
      ansible.builtin.set_fact:
        ndm_srg_evaluated: >-
          {{ ndm_srg_evaluated | default([]) + [
               item | combine({'evidence_present':
                 (item.maps | default([]) | select('in', ndm_seen_controls) | list | length > 0)})
             ] }}
      loop: "{{ ndm_srg_catalog }}"
      loop_control:
        label: "{{ item.id }}"
      changed_when: false
      tags: [assess]

    - name: Write consolidated JSON evidence artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/ndm_srg_assessment.json"
        mode: "0640"
        content: "{{ (ndm_assessment | combine({'ndm_srg': ndm_srg_evaluated | default([])})) | to_nice_json }}"
      # Evidence artifact, not managed state: content carries a fresh
      # timestamp each run, so reporting "changed" every time is noise.
      changed_when: false
      tags: [report]

    - name: Render Markdown evidence report
      ansible.builtin.template:
        src: evidence_report.md.j2
        dest: "{{ artifacts_dir }}/ndm_srg_assessment.md"
        mode: "0640"
      # Evidence artifact, not managed state: content carries a fresh
      # timestamp each run, so reporting "changed" every time is noise.
      changed_when: false
      tags: [report]

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          NDM SRG assessment: {{ ndm_found.files | length }} device artifact(s);
          {{ ndm_srg_evaluated | default([]) | selectattr('evidence_present') | list | length }}
          of {{ ndm_srg_catalog | length }} NDM SRG families have collected evidence.
          Report: {{ artifacts_dir }}/ndm_srg_assessment.md
      tags: [report]

    # ----------------------------- postflight -------------------

    - name: "network_policy/ndm_srg_assessment | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_network_policy_ndm_srg_assessment_preflight_passed | bool
          - fe_network_policy_ndm_srg_assessment_status in ['running', 'succeeded']
        fail_msg: >-
          network_policy/ndm_srg_assessment: postflight validation failed - preflight passed
          ={{ fe_network_policy_ndm_srg_assessment_preflight_passed | default(false) }},
          status={{ fe_network_policy_ndm_srg_assessment_status | default('unknown') }}.
        success_msg: "network_policy/ndm_srg_assessment: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "network_policy/ndm_srg_assessment | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_network_policy_ndm_srg_assessment_postflight_passed: true
        fe_network_policy_ndm_srg_assessment_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "network_policy/ndm_srg_assessment | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_network_policy_ndm_srg_assessment_status: "failed"
        fe_network_policy_ndm_srg_assessment_postflight_passed: false
        fe_network_policy_ndm_srg_assessment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_network_policy_ndm_srg_assessment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "network_policy/ndm_srg_assessment | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          network_policy/ndm_srg_assessment: FAILED at '{{ fe_network_policy_ndm_srg_assessment_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_network_policy_ndm_srg_assessment_error }}
      tags:
        - always
        - rescue

    - name: "network_policy/ndm_srg_assessment | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          network_policy/ndm_srg_assessment failed at '{{ fe_network_policy_ndm_srg_assessment_failed_task }}': {{ fe_network_policy_ndm_srg_assessment_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "network_policy/ndm_srg_assessment | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_network_policy_ndm_srg_assessment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_network_policy_ndm_srg_assessment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_network_policy_ndm_srg_assessment_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "network_policy/ndm_srg_assessment | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "network_policy/ndm_srg_assessment":
              component: "network_policy/ndm_srg_assessment"
              type: "role"
              platform: "network_policy"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_network_policy_ndm_srg_assessment_status | default('unknown') }}"
              preflight_passed: "{{ fe_network_policy_ndm_srg_assessment_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_network_policy_ndm_srg_assessment_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_network_policy_ndm_srg_assessment_started_at | default('') }}"
              ended_at: "{{ fe_network_policy_ndm_srg_assessment_ended_at | default('') }}"
              duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_network_policy_ndm_srg_assessment_failed_task | default('') }}"
              error: "{{ fe_network_policy_ndm_srg_assessment_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_network_policy_ndm_srg_assessment_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_network_policy_ndm_srg_assessment_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_network_policy_ndm_srg_assessment_status | default('') == 'succeeded' else ['network_policy/ndm_srg_assessment'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "network_policy/ndm_srg_assessment | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_network_policy_ndm_srg_assessment_stats_published: true
      tags:
        - always
