---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the ndm_srg_assessment role
      ansible.builtin.include_role:
        name: ndm_srg_assessment

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_network_policy_ndm_srg_assessment_preflight_passed | bool
          - fe_network_policy_ndm_srg_assessment_postflight_passed | bool
          - fe_network_policy_ndm_srg_assessment_status == 'succeeded'
        fail_msg: >-
          ndm_srg_assessment did not complete cleanly:
          status={{ fe_network_policy_ndm_srg_assessment_status | default('unset') }}
          failed_task={{ fe_network_policy_ndm_srg_assessment_failed_task | default('') }}
        success_msg: "ndm_srg_assessment completed and the validation harness reported success."
