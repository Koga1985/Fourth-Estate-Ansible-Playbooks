---
# Grab-and-go entry point for the NDM SRG / Network Infrastructure Policy
# assessment + evidence generator. Read-only; runs on the control node.
#
#   ansible-playbook network_policy/roles/ndm_srg_assessment/playbooks/run.yml
#
# Output: /tmp/ndm-srg-artifacts/ndm_srg_assessment.{json,md}
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Generate NDM SRG / Network Infrastructure Policy evidence
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: ndm_srg_assessment
  pre_tasks:
    - name: "network_policy/ndm_srg_assessment/run | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "network_policy/ndm_srg_assessment/run | Initialize validation state"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_network_policy_ndm_srg_assessment_run_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_network_policy_ndm_srg_assessment_run_status: "running"
            fe_network_policy_ndm_srg_assessment_run_preflight_passed: false
            fe_network_policy_ndm_srg_assessment_run_postflight_passed: false
            fe_network_policy_ndm_srg_assessment_run_failed_task: ""
            fe_network_policy_ndm_srg_assessment_run_error: ""
            fe_network_policy_ndm_srg_assessment_run_stats_published: false
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              network_policy/ndm_srg_assessment/run: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              network_policy/ndm_srg_assessment/run: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "network_policy/ndm_srg_assessment/run | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "network_policy/ndm_srg_assessment/run: required variable '{{ item }}' is not defined."
            success_msg: "network_policy/ndm_srg_assessment/run: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_network_policy_ndm_srg_assessment_run_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "network_policy/ndm_srg_assessment/run | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_status: "preflight_failed"
            fe_network_policy_ndm_srg_assessment_run_postflight_passed: false
            fe_network_policy_ndm_srg_assessment_run_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_network_policy_ndm_srg_assessment_run_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              network_policy/ndm_srg_assessment/run: FAILED at '{{ fe_network_policy_ndm_srg_assessment_run_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_network_policy_ndm_srg_assessment_run_error }}
          tags:
            - always
            - rescue

        - name: "network_policy/ndm_srg_assessment/run | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "network_policy/ndm_srg_assessment/run":
                  component: "network_policy/ndm_srg_assessment/run"
                  type: "playbook"
                  platform: "network_policy"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_network_policy_ndm_srg_assessment_run_status | default('unknown') }}"
                  preflight_passed: "{{ fe_network_policy_ndm_srg_assessment_run_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_network_policy_ndm_srg_assessment_run_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_network_policy_ndm_srg_assessment_run_started_at | default('') }}"
                  ended_at: "{{ fe_network_policy_ndm_srg_assessment_run_ended_at | default('') }}"
                  duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_run_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_network_policy_ndm_srg_assessment_run_failed_task | default('') }}"
                  error: "{{ fe_network_policy_ndm_srg_assessment_run_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_run_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else ['network_policy/ndm_srg_assessment/run'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_stats_published: true
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              network_policy/ndm_srg_assessment/run failed at '{{ fe_network_policy_ndm_srg_assessment_run_failed_task }}': {{ fe_network_policy_ndm_srg_assessment_run_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "network_policy/ndm_srg_assessment/run | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              network_policy/ndm_srg_assessment/run: preflight
              {{ 'passed' if fe_network_policy_ndm_srg_assessment_run_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "network_policy/ndm_srg_assessment/run | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "network_policy/ndm_srg_assessment/run | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_network_policy_ndm_srg_assessment_run_preflight_passed | bool
              - fe_network_policy_ndm_srg_assessment_run_status in ['running', 'succeeded']
            fail_msg: >-
              network_policy/ndm_srg_assessment/run: postflight validation failed - preflight passed
              ={{ fe_network_policy_ndm_srg_assessment_run_preflight_passed | default(false) }},
              status={{ fe_network_policy_ndm_srg_assessment_run_status | default('unknown') }}.
            success_msg: "network_policy/ndm_srg_assessment/run: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "network_policy/ndm_srg_assessment/run | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_postflight_passed: true
            fe_network_policy_ndm_srg_assessment_run_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_status: "failed"
            fe_network_policy_ndm_srg_assessment_run_postflight_passed: false
            fe_network_policy_ndm_srg_assessment_run_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_network_policy_ndm_srg_assessment_run_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              network_policy/ndm_srg_assessment/run: FAILED at '{{ fe_network_policy_ndm_srg_assessment_run_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_network_policy_ndm_srg_assessment_run_error }}
          tags:
            - always
            - rescue

        - name: "network_policy/ndm_srg_assessment/run | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              network_policy/ndm_srg_assessment/run failed at '{{ fe_network_policy_ndm_srg_assessment_run_failed_task }}': {{ fe_network_policy_ndm_srg_assessment_run_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "network_policy/ndm_srg_assessment/run | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_network_policy_ndm_srg_assessment_run_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_network_policy_ndm_srg_assessment_run_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "network_policy/ndm_srg_assessment/run":
                  component: "network_policy/ndm_srg_assessment/run"
                  type: "playbook"
                  platform: "network_policy"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_network_policy_ndm_srg_assessment_run_status | default('unknown') }}"
                  preflight_passed: "{{ fe_network_policy_ndm_srg_assessment_run_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_network_policy_ndm_srg_assessment_run_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_network_policy_ndm_srg_assessment_run_started_at | default('') }}"
                  ended_at: "{{ fe_network_policy_ndm_srg_assessment_run_ended_at | default('') }}"
                  duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_run_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_network_policy_ndm_srg_assessment_run_failed_task | default('') }}"
                  error: "{{ fe_network_policy_ndm_srg_assessment_run_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_network_policy_ndm_srg_assessment_run_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_network_policy_ndm_srg_assessment_run_status | default('') == 'succeeded' else ['network_policy/ndm_srg_assessment/run'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_network_policy_ndm_srg_assessment_run_stats_published | default(false) | bool)
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_network_policy_ndm_srg_assessment_run_stats_published: true
          tags:
            - always

        - name: "network_policy/ndm_srg_assessment/run | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              network_policy/ndm_srg_assessment/run: {{ fe_network_policy_ndm_srg_assessment_run_status | default('unknown') }} in
              {{ fe_network_policy_ndm_srg_assessment_run_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
