---
# Audit logging configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['elk_stack/elasticsearch_security/audit']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_elk_stack_elasticsearch_security_audit_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "elk_stack/elasticsearch_security/audit | Initialize validation state"
  ansible.builtin.set_fact:
    fe_elk_stack_elasticsearch_security_audit_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_elk_stack_elasticsearch_security_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_elk_stack_elasticsearch_security_audit_status: "running"
    fe_elk_stack_elasticsearch_security_audit_preflight_passed: false
    fe_elk_stack_elasticsearch_security_audit_postflight_passed: false
    fe_elk_stack_elasticsearch_security_audit_failed_task: ""
    fe_elk_stack_elasticsearch_security_audit_error: ""
    fe_elk_stack_elasticsearch_security_audit_stats_published: false
  tags:
    - always

- name: "elk_stack/elasticsearch_security/audit | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "elk_stack/elasticsearch_security/audit | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          elk_stack/elasticsearch_security/audit: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          elk_stack/elasticsearch_security/audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/audit | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "elk_stack/elasticsearch_security/audit: required variable '{{ item }}' is not defined."
        success_msg: "elk_stack/elasticsearch_security/audit: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_elk_stack_elasticsearch_security_audit_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/audit | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_audit_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure audit logging
      blockinfile:
        path: /etc/elasticsearch/elasticsearch.yml
        marker: "# {mark} ANSIBLE MANAGED AUDIT BLOCK"
        block: |
          xpack.security.audit.enabled: {{ elasticsearch_audit_enabled | lower }}
          {% if elasticsearch_audit_enabled %}
          xpack.security.audit.outputs: {{ elasticsearch_audit_outputs | to_json }}
          xpack.security.audit.logfile.events.include: {{ elasticsearch_audit_include_events | to_json }}
          xpack.security.audit.logfile.events.exclude: []
          xpack.security.audit.logfile.events.emit_request_body: {{ elasticsearch_audit_include_request_body | lower }}
          {% if elasticsearch_audit_exclude_users | length > 0 %}
          xpack.security.audit.logfile.events.ignore_filters.ignore_journalist_reads:
            users: {{ elasticsearch_audit_exclude_users | to_json }}
            realms: ["native"]
            actions: ["indices:data/read/*"]
          {% endif %}
          {% if elasticsearch_fourth_estate_security %}
          # Fourth Estate specific audit settings
          xpack.security.audit.logfile.events.ignore_filters.ignore_service_accounts:
            users: ["kibana_system", "logstash_system", "beats_system"]
            actions: ["cluster:monitor/*"]
          {% endif %}
          {% endif %}
        backup: yes
      notify: restart elasticsearch

    - name: Create audit log directory
      file:
        path: /var/log/elasticsearch/audit
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: '0750'
      when: elasticsearch_audit_enabled | bool

    # ----------------------------- postflight -------------------

    - name: "elk_stack/elasticsearch_security/audit | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_elk_stack_elasticsearch_security_audit_preflight_passed | bool
          - fe_elk_stack_elasticsearch_security_audit_status in ['running', 'succeeded']
        fail_msg: >-
          elk_stack/elasticsearch_security/audit: postflight validation failed - preflight passed
          ={{ fe_elk_stack_elasticsearch_security_audit_preflight_passed | default(false) }},
          status={{ fe_elk_stack_elasticsearch_security_audit_status | default('unknown') }}.
        success_msg: "elk_stack/elasticsearch_security/audit: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "elk_stack/elasticsearch_security/audit | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_audit_postflight_passed: true
        fe_elk_stack_elasticsearch_security_audit_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "elk_stack/elasticsearch_security/audit | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_audit_status: "failed"
        fe_elk_stack_elasticsearch_security_audit_postflight_passed: false
        fe_elk_stack_elasticsearch_security_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_elk_stack_elasticsearch_security_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/audit | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          elk_stack/elasticsearch_security/audit: FAILED at '{{ fe_elk_stack_elasticsearch_security_audit_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_elk_stack_elasticsearch_security_audit_error }}
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/audit | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          elk_stack/elasticsearch_security/audit failed at '{{ fe_elk_stack_elasticsearch_security_audit_failed_task }}': {{ fe_elk_stack_elasticsearch_security_audit_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "elk_stack/elasticsearch_security/audit | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_elk_stack_elasticsearch_security_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_elk_stack_elasticsearch_security_audit_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/audit | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "elk_stack/elasticsearch_security/audit":
              component: "elk_stack/elasticsearch_security/audit"
              type: "role-tasks"
              platform: "elk_stack"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_elk_stack_elasticsearch_security_audit_status | default('unknown') }}"
              preflight_passed: "{{ fe_elk_stack_elasticsearch_security_audit_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_elk_stack_elasticsearch_security_audit_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_elk_stack_elasticsearch_security_audit_started_at | default('') }}"
              ended_at: "{{ fe_elk_stack_elasticsearch_security_audit_ended_at | default('') }}"
              duration_seconds: "{{ fe_elk_stack_elasticsearch_security_audit_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_elk_stack_elasticsearch_security_audit_failed_task | default('') }}"
              error: "{{ fe_elk_stack_elasticsearch_security_audit_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_elk_stack_elasticsearch_security_audit_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_elk_stack_elasticsearch_security_audit_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_elk_stack_elasticsearch_security_audit_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_elk_stack_elasticsearch_security_audit_status | default('') == 'succeeded' else ['elk_stack/elasticsearch_security/audit'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/audit | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_audit_stats_published: true
      tags:
        - always
