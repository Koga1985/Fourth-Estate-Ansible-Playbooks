---
# Elasticsearch Security Tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['elk_stack/elasticsearch_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_elk_stack_elasticsearch_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "elk_stack/elasticsearch_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_elk_stack_elasticsearch_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_elk_stack_elasticsearch_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_elk_stack_elasticsearch_security_status: "running"
    fe_elk_stack_elasticsearch_security_preflight_passed: false
    fe_elk_stack_elasticsearch_security_postflight_passed: false
    fe_elk_stack_elasticsearch_security_failed_task: ""
    fe_elk_stack_elasticsearch_security_error: ""
    fe_elk_stack_elasticsearch_security_stats_published: false
  tags:
    - always

- name: "elk_stack/elasticsearch_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "elk_stack/elasticsearch_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          elk_stack/elasticsearch_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          elk_stack/elasticsearch_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "elk_stack/elasticsearch_security: required variable '{{ item }}' is not defined."
        success_msg: "elk_stack/elasticsearch_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_elk_stack_elasticsearch_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure Elasticsearch is installed
      stat:
        path: /usr/share/elasticsearch/bin/elasticsearch
      register: elasticsearch_binary
      failed_when: not elasticsearch_binary.stat.exists

    - name: Create certificates directory
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: elasticsearch
        mode: '0750'
      loop:
        - "{{ elasticsearch_certs_dir }}"
        - "{{ elasticsearch_certs_dir }}/ca"
        - "{{ elasticsearch_certs_dir }}/{{ ansible_hostname }}"

    - name: Include certificate generation tasks
      include_tasks: certificates.yml
      when: elasticsearch_tls_enabled | bool

    - name: Configure security in elasticsearch.yml
      blockinfile:
        path: /etc/elasticsearch/elasticsearch.yml
        marker: "# {mark} ANSIBLE MANAGED SECURITY BLOCK"
        block: "{{ lookup('template', 'security_config.yml.j2') }}"
        backup: yes
      notify: restart elasticsearch
      register: es_security_config

    - name: Create keystore if it doesn't exist
      command: /usr/share/elasticsearch/bin/elasticsearch-keystore create
      args:
        creates: /etc/elasticsearch/elasticsearch.keystore
      become: yes

    - name: Set keystore permissions
      file:
        path: /etc/elasticsearch/elasticsearch.keystore
        owner: root
        group: elasticsearch
        mode: '0660'

    - name: Include LDAP configuration
      include_tasks: ldap_config.yml
      when: elasticsearch_ldap_enabled | bool

    - name: Include Active Directory configuration
      include_tasks: ad_config.yml
      when: elasticsearch_ad_enabled | bool

    - name: Include SAML configuration
      include_tasks: saml_config.yml
      when: elasticsearch_saml_enabled | bool

    - name: Wait for Elasticsearch to start with security
      wait_for:
        host: localhost
        port: "{{ elasticsearch_http_port }}"
        delay: 15
        timeout: 300
      when: es_security_config is changed

    - name: Check if setup-passwords has been run
      stat:
        path: /etc/elasticsearch/.setup_passwords_complete
      register: setup_passwords_done

    - name: Run setup-passwords auto
      shell: |
        echo "y" | /usr/share/elasticsearch/bin/elasticsearch-setup-passwords auto > /tmp/elasticsearch_passwords.txt 2>&1
        touch /etc/elasticsearch/.setup_passwords_complete
      args:
        creates: /etc/elasticsearch/.setup_passwords_complete
      when:
        - elasticsearch_security_enabled | bool
        - not setup_passwords_done.stat.exists
        - elasticsearch_security_auto_configure | bool
      register: setup_passwords_output
      no_log: false

    - name: Save generated passwords
      copy:
        content: "{{ setup_passwords_output.stdout }}"
        dest: "/etc/elasticsearch/initial_passwords_{{ ansible_date_time.epoch }}.txt"
        owner: root
        group: root
        mode: '0600'
      when:
        - setup_passwords_output is defined
        - setup_passwords_output.changed

    - name: Include role management tasks
      include_tasks: roles.yml
      when: elasticsearch_custom_roles | length > 0

    - name: Include user management tasks
      include_tasks: users.yml
      when: elasticsearch_custom_users | length > 0

    - name: Include audit logging configuration
      include_tasks: audit.yml
      when: elasticsearch_audit_enabled | bool

    - name: Include IP filtering configuration
      include_tasks: ip_filter.yml
      when: elasticsearch_ip_filter_enabled | bool

    - name: Include API key management
      include_tasks: api_keys.yml
      when:
        - elasticsearch_api_keys_enabled | bool
        - elasticsearch_api_keys | length > 0

    - name: Display security status
      debug:
        msg:
          - "Elasticsearch security enabled: {{ elasticsearch_security_enabled }}"
          - "TLS/SSL enabled: {{ elasticsearch_tls_enabled }}"
          - "Audit logging enabled: {{ elasticsearch_audit_enabled }}"
          - "LDAP integration: {{ elasticsearch_ldap_enabled }}"
          - "SAML SSO: {{ elasticsearch_saml_enabled }}"
          - "Fourth Estate security mode: {{ elasticsearch_fourth_estate_security }}"

    # ----------------------------- postflight -------------------

    - name: "elk_stack/elasticsearch_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_elk_stack_elasticsearch_security_preflight_passed | bool
          - fe_elk_stack_elasticsearch_security_status in ['running', 'succeeded']
        fail_msg: >-
          elk_stack/elasticsearch_security: postflight validation failed - preflight passed
          ={{ fe_elk_stack_elasticsearch_security_preflight_passed | default(false) }},
          status={{ fe_elk_stack_elasticsearch_security_status | default('unknown') }}.
        success_msg: "elk_stack/elasticsearch_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "elk_stack/elasticsearch_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_postflight_passed: true
        fe_elk_stack_elasticsearch_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "elk_stack/elasticsearch_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_status: "failed"
        fe_elk_stack_elasticsearch_security_postflight_passed: false
        fe_elk_stack_elasticsearch_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_elk_stack_elasticsearch_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          elk_stack/elasticsearch_security: FAILED at '{{ fe_elk_stack_elasticsearch_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_elk_stack_elasticsearch_security_error }}
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          elk_stack/elasticsearch_security failed at '{{ fe_elk_stack_elasticsearch_security_failed_task }}': {{ fe_elk_stack_elasticsearch_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "elk_stack/elasticsearch_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_elk_stack_elasticsearch_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_elk_stack_elasticsearch_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "elk_stack/elasticsearch_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "elk_stack/elasticsearch_security":
              component: "elk_stack/elasticsearch_security"
              type: "role"
              platform: "elk_stack"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_elk_stack_elasticsearch_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_elk_stack_elasticsearch_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_elk_stack_elasticsearch_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_elk_stack_elasticsearch_security_started_at | default('') }}"
              ended_at: "{{ fe_elk_stack_elasticsearch_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_elk_stack_elasticsearch_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_elk_stack_elasticsearch_security_failed_task | default('') }}"
              error: "{{ fe_elk_stack_elasticsearch_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_elk_stack_elasticsearch_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_elk_stack_elasticsearch_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_elk_stack_elasticsearch_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_elk_stack_elasticsearch_security_status | default('') == 'succeeded' else ['elk_stack/elasticsearch_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "elk_stack/elasticsearch_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_stats_published: true
      tags:
        - always
