---
# Certificate generation and management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['elk_stack/elasticsearch_security/certificates']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_elk_stack_elasticsearch_security_certificates_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "elk_stack/elasticsearch_security/certificates | Initialize validation state"
  ansible.builtin.set_fact:
    fe_elk_stack_elasticsearch_security_certificates_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_elk_stack_elasticsearch_security_certificates_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_elk_stack_elasticsearch_security_certificates_status: "running"
    fe_elk_stack_elasticsearch_security_certificates_preflight_passed: false
    fe_elk_stack_elasticsearch_security_certificates_postflight_passed: false
    fe_elk_stack_elasticsearch_security_certificates_failed_task: ""
    fe_elk_stack_elasticsearch_security_certificates_error: ""
    fe_elk_stack_elasticsearch_security_certificates_stats_published: false
  tags:
    - always

- name: "elk_stack/elasticsearch_security/certificates | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "elk_stack/elasticsearch_security/certificates | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          elk_stack/elasticsearch_security/certificates: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          elk_stack/elasticsearch_security/certificates: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/certificates | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "elk_stack/elasticsearch_security/certificates: required variable '{{ item }}' is not defined."
        success_msg: "elk_stack/elasticsearch_security/certificates: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_elk_stack_elasticsearch_security_certificates_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/certificates | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_certificates_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if CA certificate exists
      stat:
        path: "{{ elasticsearch_ca_cert_path }}"
      register: ca_cert_exists

    - name: Generate CA private key
      openssl_privatekey:
        path: "{{ elasticsearch_ca_key_path }}"
        size: "{{ elasticsearch_cert_key_size }}"
        mode: '0600'
      when:
        - elasticsearch_generate_ca | bool
        - not ca_cert_exists.stat.exists

    - name: Generate CA certificate signing request
      openssl_csr:
        path: "{{ elasticsearch_certs_dir }}/ca/ca.csr"
        privatekey_path: "{{ elasticsearch_ca_key_path }}"
        common_name: "Fourth Estate Elasticsearch CA"
        country_name: "{{ elasticsearch_cert_country }}"
        state_or_province_name: "{{ elasticsearch_cert_state }}"
        locality_name: "{{ elasticsearch_cert_locality }}"
        organization_name: "{{ elasticsearch_cert_organization }}"
        organizational_unit_name: "{{ elasticsearch_cert_organizational_unit }}"
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: yes
        key_usage:
          - digitalSignature
          - keyCertSign
          - cRLSign
        key_usage_critical: yes
      when:
        - elasticsearch_generate_ca | bool
        - not ca_cert_exists.stat.exists

    - name: Generate self-signed CA certificate
      openssl_certificate:
        path: "{{ elasticsearch_ca_cert_path }}"
        privatekey_path: "{{ elasticsearch_ca_key_path }}"
        csr_path: "{{ elasticsearch_certs_dir }}/ca/ca.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ elasticsearch_cert_validity_days }}d"
        mode: '0644'
      when:
        - elasticsearch_generate_ca | bool
        - not ca_cert_exists.stat.exists

    - name: Generate node private key
      openssl_privatekey:
        path: "{{ elasticsearch_node_key_path }}"
        size: "{{ elasticsearch_cert_key_size }}"
        mode: '0600'
      when: elasticsearch_generate_node_certs | bool

    - name: Generate node certificate signing request
      openssl_csr:
        path: "{{ elasticsearch_certs_dir }}/{{ ansible_hostname }}/{{ ansible_hostname }}.csr"
        privatekey_path: "{{ elasticsearch_node_key_path }}"
        common_name: "{{ ansible_fqdn }}"
        country_name: "{{ elasticsearch_cert_country }}"
        state_or_province_name: "{{ elasticsearch_cert_state }}"
        locality_name: "{{ elasticsearch_cert_locality }}"
        organization_name: "{{ elasticsearch_cert_organization }}"
        organizational_unit_name: "{{ elasticsearch_cert_organizational_unit }}"
        subject_alt_name:
          - "DNS:{{ ansible_hostname }}"
          - "DNS:{{ ansible_fqdn }}"
          - "DNS:localhost"
          - "IP:{{ ansible_default_ipv4.address }}"
          - "IP:127.0.0.1"
          - "IP:::1"
        key_usage:
          - digitalSignature
          - keyEncipherment
          - dataEncipherment
        extended_key_usage:
          - serverAuth
          - clientAuth
      when: elasticsearch_generate_node_certs | bool

    - name: Sign node certificate with CA
      openssl_certificate:
        path: "{{ elasticsearch_node_cert_path }}"
        csr_path: "{{ elasticsearch_certs_dir }}/{{ ansible_hostname }}/{{ ansible_hostname }}.csr"
        provider: ownca
        ownca_path: "{{ elasticsearch_ca_cert_path }}"
        ownca_privatekey_path: "{{ elasticsearch_ca_key_path }}"
        ownca_not_after: "+{{ elasticsearch_cert_validity_days }}d"
        mode: '0644'
      when: elasticsearch_generate_node_certs | bool

    - name: Set certificate ownership
      file:
        path: "{{ item }}"
        owner: root
        group: elasticsearch
        mode: '0640'
      loop:
        - "{{ elasticsearch_node_cert_path }}"
        - "{{ elasticsearch_node_key_path }}"
        - "{{ elasticsearch_ca_cert_path }}"
      when: elasticsearch_generate_node_certs | bool

    - name: Create PKCS12 keystore for node
      openssl_pkcs12:
        action: export
        path: "{{ elasticsearch_certs_dir }}/{{ ansible_hostname }}/{{ ansible_hostname }}.p12"
        friendly_name: "{{ ansible_hostname }}"
        privatekey_path: "{{ elasticsearch_node_key_path }}"
        certificate_path: "{{ elasticsearch_node_cert_path }}"
        other_certificates: "{{ elasticsearch_ca_cert_path }}"
        state: present
        mode: '0640'
      when: elasticsearch_generate_node_certs | bool

    # ----------------------------- postflight -------------------

    - name: "elk_stack/elasticsearch_security/certificates | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_elk_stack_elasticsearch_security_certificates_preflight_passed | bool
          - fe_elk_stack_elasticsearch_security_certificates_status in ['running', 'succeeded']
        fail_msg: >-
          elk_stack/elasticsearch_security/certificates: postflight validation failed - preflight passed
          ={{ fe_elk_stack_elasticsearch_security_certificates_preflight_passed | default(false) }},
          status={{ fe_elk_stack_elasticsearch_security_certificates_status | default('unknown') }}.
        success_msg: "elk_stack/elasticsearch_security/certificates: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "elk_stack/elasticsearch_security/certificates | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_certificates_postflight_passed: true
        fe_elk_stack_elasticsearch_security_certificates_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "elk_stack/elasticsearch_security/certificates | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_certificates_status: "failed"
        fe_elk_stack_elasticsearch_security_certificates_postflight_passed: false
        fe_elk_stack_elasticsearch_security_certificates_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_elk_stack_elasticsearch_security_certificates_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/certificates | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          elk_stack/elasticsearch_security/certificates: FAILED at '{{ fe_elk_stack_elasticsearch_security_certificates_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_elk_stack_elasticsearch_security_certificates_error }}
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/certificates | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          elk_stack/elasticsearch_security/certificates failed at '{{ fe_elk_stack_elasticsearch_security_certificates_failed_task }}': {{ fe_elk_stack_elasticsearch_security_certificates_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "elk_stack/elasticsearch_security/certificates | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_certificates_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_elk_stack_elasticsearch_security_certificates_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_elk_stack_elasticsearch_security_certificates_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/certificates | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "elk_stack/elasticsearch_security/certificates":
              component: "elk_stack/elasticsearch_security/certificates"
              type: "role-tasks"
              platform: "elk_stack"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_elk_stack_elasticsearch_security_certificates_status | default('unknown') }}"
              preflight_passed: "{{ fe_elk_stack_elasticsearch_security_certificates_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_elk_stack_elasticsearch_security_certificates_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_elk_stack_elasticsearch_security_certificates_started_at | default('') }}"
              ended_at: "{{ fe_elk_stack_elasticsearch_security_certificates_ended_at | default('') }}"
              duration_seconds: "{{ fe_elk_stack_elasticsearch_security_certificates_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_elk_stack_elasticsearch_security_certificates_failed_task | default('') }}"
              error: "{{ fe_elk_stack_elasticsearch_security_certificates_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_elk_stack_elasticsearch_security_certificates_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_elk_stack_elasticsearch_security_certificates_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_elk_stack_elasticsearch_security_certificates_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_elk_stack_elasticsearch_security_certificates_status | default('') == 'succeeded' else ['elk_stack/elasticsearch_security/certificates'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/certificates | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_certificates_stats_published: true
      tags:
        - always
