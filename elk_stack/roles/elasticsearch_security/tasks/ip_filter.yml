---
# IP filtering configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['elk_stack/elasticsearch_security/ip_filter']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_elk_stack_elasticsearch_security_ip_filter_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "elk_stack/elasticsearch_security/ip_filter | Initialize validation state"
  ansible.builtin.set_fact:
    fe_elk_stack_elasticsearch_security_ip_filter_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_elk_stack_elasticsearch_security_ip_filter_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_elk_stack_elasticsearch_security_ip_filter_status: "running"
    fe_elk_stack_elasticsearch_security_ip_filter_preflight_passed: false
    fe_elk_stack_elasticsearch_security_ip_filter_postflight_passed: false
    fe_elk_stack_elasticsearch_security_ip_filter_failed_task: ""
    fe_elk_stack_elasticsearch_security_ip_filter_error: ""
    fe_elk_stack_elasticsearch_security_ip_filter_stats_published: false
  tags:
    - always

- name: "elk_stack/elasticsearch_security/ip_filter | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "elk_stack/elasticsearch_security/ip_filter | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          elk_stack/elasticsearch_security/ip_filter: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          elk_stack/elasticsearch_security/ip_filter: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/ip_filter | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "elk_stack/elasticsearch_security/ip_filter: required variable '{{ item }}' is not defined."
        success_msg: "elk_stack/elasticsearch_security/ip_filter: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_elk_stack_elasticsearch_security_ip_filter_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/ip_filter | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ip_filter_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure IP filtering
      blockinfile:
        path: /etc/elasticsearch/elasticsearch.yml
        marker: "# {mark} ANSIBLE MANAGED IP FILTER BLOCK"
        block: |
          xpack.security.transport.filter.enabled: {{ elasticsearch_ip_filter_enabled | lower }}
          xpack.security.http.filter.enabled: {{ elasticsearch_ip_filter_enabled | lower }}
          {% if elasticsearch_ip_filter_enabled %}
          {% if elasticsearch_ip_filter_allow | length > 0 %}
          xpack.security.transport.filter.allow: {{ elasticsearch_ip_filter_allow | to_json }}
          xpack.security.http.filter.allow: {{ elasticsearch_ip_filter_allow | to_json }}
          {% endif %}
          {% if elasticsearch_ip_filter_deny | length > 0 %}
          xpack.security.transport.filter.deny: {{ elasticsearch_ip_filter_deny | to_json }}
          xpack.security.http.filter.deny: {{ elasticsearch_ip_filter_deny | to_json }}
          {% endif %}
          {% endif %}
        backup: yes
      notify: restart elasticsearch

    # ----------------------------- postflight -------------------

    - name: "elk_stack/elasticsearch_security/ip_filter | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_elk_stack_elasticsearch_security_ip_filter_preflight_passed | bool
          - fe_elk_stack_elasticsearch_security_ip_filter_status in ['running', 'succeeded']
        fail_msg: >-
          elk_stack/elasticsearch_security/ip_filter: postflight validation failed - preflight passed
          ={{ fe_elk_stack_elasticsearch_security_ip_filter_preflight_passed | default(false) }},
          status={{ fe_elk_stack_elasticsearch_security_ip_filter_status | default('unknown') }}.
        success_msg: "elk_stack/elasticsearch_security/ip_filter: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "elk_stack/elasticsearch_security/ip_filter | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ip_filter_postflight_passed: true
        fe_elk_stack_elasticsearch_security_ip_filter_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "elk_stack/elasticsearch_security/ip_filter | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ip_filter_status: "failed"
        fe_elk_stack_elasticsearch_security_ip_filter_postflight_passed: false
        fe_elk_stack_elasticsearch_security_ip_filter_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_elk_stack_elasticsearch_security_ip_filter_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/ip_filter | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          elk_stack/elasticsearch_security/ip_filter: FAILED at '{{ fe_elk_stack_elasticsearch_security_ip_filter_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_elk_stack_elasticsearch_security_ip_filter_error }}
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/ip_filter | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          elk_stack/elasticsearch_security/ip_filter failed at '{{ fe_elk_stack_elasticsearch_security_ip_filter_failed_task }}': {{ fe_elk_stack_elasticsearch_security_ip_filter_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "elk_stack/elasticsearch_security/ip_filter | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ip_filter_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_elk_stack_elasticsearch_security_ip_filter_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_elk_stack_elasticsearch_security_ip_filter_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/ip_filter | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "elk_stack/elasticsearch_security/ip_filter":
              component: "elk_stack/elasticsearch_security/ip_filter"
              type: "role-tasks"
              platform: "elk_stack"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_elk_stack_elasticsearch_security_ip_filter_status | default('unknown') }}"
              preflight_passed: "{{ fe_elk_stack_elasticsearch_security_ip_filter_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_elk_stack_elasticsearch_security_ip_filter_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_elk_stack_elasticsearch_security_ip_filter_started_at | default('') }}"
              ended_at: "{{ fe_elk_stack_elasticsearch_security_ip_filter_ended_at | default('') }}"
              duration_seconds: "{{ fe_elk_stack_elasticsearch_security_ip_filter_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_elk_stack_elasticsearch_security_ip_filter_failed_task | default('') }}"
              error: "{{ fe_elk_stack_elasticsearch_security_ip_filter_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_elk_stack_elasticsearch_security_ip_filter_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_elk_stack_elasticsearch_security_ip_filter_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_elk_stack_elasticsearch_security_ip_filter_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_elk_stack_elasticsearch_security_ip_filter_status | default('') == 'succeeded' else ['elk_stack/elasticsearch_security/ip_filter'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/ip_filter | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_ip_filter_stats_published: true
      tags:
        - always
