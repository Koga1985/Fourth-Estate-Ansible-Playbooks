---
# API key management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['elk_stack/elasticsearch_security/api_keys']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_elk_stack_elasticsearch_security_api_keys_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "elk_stack/elasticsearch_security/api_keys | Initialize validation state"
  ansible.builtin.set_fact:
    fe_elk_stack_elasticsearch_security_api_keys_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_elk_stack_elasticsearch_security_api_keys_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_elk_stack_elasticsearch_security_api_keys_status: "running"
    fe_elk_stack_elasticsearch_security_api_keys_preflight_passed: false
    fe_elk_stack_elasticsearch_security_api_keys_postflight_passed: false
    fe_elk_stack_elasticsearch_security_api_keys_failed_task: ""
    fe_elk_stack_elasticsearch_security_api_keys_error: ""
    fe_elk_stack_elasticsearch_security_api_keys_stats_published: false
  tags:
    - always

- name: "elk_stack/elasticsearch_security/api_keys | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "elk_stack/elasticsearch_security/api_keys | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          elk_stack/elasticsearch_security/api_keys: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          elk_stack/elasticsearch_security/api_keys: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/api_keys | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "elk_stack/elasticsearch_security/api_keys: required variable '{{ item }}' is not defined."
        success_msg: "elk_stack/elasticsearch_security/api_keys: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_elk_stack_elasticsearch_security_api_keys_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "elk_stack/elasticsearch_security/api_keys | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_api_keys_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create API keys
      uri:
        url: "https://localhost:{{ elasticsearch_http_port }}/_security/api_key"
        method: POST
        user: "elastic"
        password: "{{ elasticsearch_elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          name: "{{ item.name }}"
          role_descriptors: "{{ item.role_descriptors }}"
          expiration: "{{ item.expiration | default('365d') }}"
        status_code: [200, 201]
      loop: "{{ elasticsearch_api_keys }}"
      register: api_key_result
      no_log: true
      until: api_key_result is succeeded
      retries: 5
      delay: 10

    - name: Save API keys to file
      copy:
        content: |
          # Elasticsearch API Keys
          # Generated: {{ ansible_date_time.iso8601 }}
          {% for result in api_key_result.results %}
          # {{ result.item.name }}
          API_KEY_{{ result.item.name | upper | regex_replace('[^A-Z0-9]', '_') }}: {{ result.json.encoded }}
          {% endfor %}
        dest: "/etc/elasticsearch/api_keys_{{ ansible_date_time.epoch }}.txt"
        owner: root
        group: root
        mode: '0600'
      when: api_key_result is changed

    # ----------------------------- postflight -------------------

    - name: "elk_stack/elasticsearch_security/api_keys | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_elk_stack_elasticsearch_security_api_keys_preflight_passed | bool
          - fe_elk_stack_elasticsearch_security_api_keys_status in ['running', 'succeeded']
        fail_msg: >-
          elk_stack/elasticsearch_security/api_keys: postflight validation failed - preflight passed
          ={{ fe_elk_stack_elasticsearch_security_api_keys_preflight_passed | default(false) }},
          status={{ fe_elk_stack_elasticsearch_security_api_keys_status | default('unknown') }}.
        success_msg: "elk_stack/elasticsearch_security/api_keys: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "elk_stack/elasticsearch_security/api_keys | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_api_keys_postflight_passed: true
        fe_elk_stack_elasticsearch_security_api_keys_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "elk_stack/elasticsearch_security/api_keys | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_api_keys_status: "failed"
        fe_elk_stack_elasticsearch_security_api_keys_postflight_passed: false
        fe_elk_stack_elasticsearch_security_api_keys_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_elk_stack_elasticsearch_security_api_keys_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/api_keys | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          elk_stack/elasticsearch_security/api_keys: FAILED at '{{ fe_elk_stack_elasticsearch_security_api_keys_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_elk_stack_elasticsearch_security_api_keys_error }}
      tags:
        - always
        - rescue

    - name: "elk_stack/elasticsearch_security/api_keys | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          elk_stack/elasticsearch_security/api_keys failed at '{{ fe_elk_stack_elasticsearch_security_api_keys_failed_task }}': {{ fe_elk_stack_elasticsearch_security_api_keys_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "elk_stack/elasticsearch_security/api_keys | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_api_keys_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_elk_stack_elasticsearch_security_api_keys_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_elk_stack_elasticsearch_security_api_keys_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/api_keys | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "elk_stack/elasticsearch_security/api_keys":
              component: "elk_stack/elasticsearch_security/api_keys"
              type: "role-tasks"
              platform: "elk_stack"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_elk_stack_elasticsearch_security_api_keys_status | default('unknown') }}"
              preflight_passed: "{{ fe_elk_stack_elasticsearch_security_api_keys_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_elk_stack_elasticsearch_security_api_keys_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_elk_stack_elasticsearch_security_api_keys_started_at | default('') }}"
              ended_at: "{{ fe_elk_stack_elasticsearch_security_api_keys_ended_at | default('') }}"
              duration_seconds: "{{ fe_elk_stack_elasticsearch_security_api_keys_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_elk_stack_elasticsearch_security_api_keys_failed_task | default('') }}"
              error: "{{ fe_elk_stack_elasticsearch_security_api_keys_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_elk_stack_elasticsearch_security_api_keys_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_elk_stack_elasticsearch_security_api_keys_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_elk_stack_elasticsearch_security_api_keys_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_elk_stack_elasticsearch_security_api_keys_status | default('') == 'succeeded' else ['elk_stack/elasticsearch_security/api_keys'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "elk_stack/elasticsearch_security/api_keys | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_elk_stack_elasticsearch_security_api_keys_stats_published: true
      tags:
        - always
