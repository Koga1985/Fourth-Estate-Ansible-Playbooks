            fail_msg: "elk_stack/site#play2: required variable '{{ item }}' is not defined."
            success_msg: "elk_stack/site#play2: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_elk_stack_site_play2_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
