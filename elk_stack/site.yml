                  postflight_passed: "{{ fe_elk_stack_site_play2_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_elk_stack_site_play2_started_at | default('') }}"
                  ended_at: "{{ fe_elk_stack_site_play2_ended_at | default('') }}"
