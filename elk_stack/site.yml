          tags:
            - always

        - name: "elk_stack/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "elk_stack/site#play1":
                  component: "elk_stack/site#play1"
                  type: "playbook"
                  platform: "elk_stack"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_elk_stack_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_elk_stack_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_elk_stack_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_elk_stack_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_elk_stack_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_elk_stack_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_elk_stack_site_play1_failed_task | default('') }}"
                  error: "{{ fe_elk_stack_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_elk_stack_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_elk_stack_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_elk_stack_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_elk_stack_site_play1_status | default('') == 'succeeded' else ['elk_stack/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_elk_stack_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "elk_stack/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_elk_stack_site_play1_stats_published: true
          tags:
            - always

        - name: "elk_stack/site#play1 | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              elk_stack/site#play1: {{ fe_elk_stack_site_play1_status | default('unknown') }} in
              {{ fe_elk_stack_site_play1_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always


- name: Verify Elasticsearch Cluster Health
  hosts: elasticsearch_master[0]
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: "elk_stack/site#play2 | Guarded execution with rescue and always handling"
      block:

        - name: Wait for cluster to be ready
          ansible.builtin.uri:
            url: "https://localhost:9200/_cluster/health"
            method: GET
            user: elastic
            password: "{{ elasticsearch_elastic_password }}"
            validate_certs: false
            status_code: 200
          no_log: true
          register: cluster_health
          until: cluster_health.json.status in ['green', 'yellow']
          retries: 30
          delay: 10
          tags: ['elasticsearch', 'verify']

        - name: Display cluster health
          ansible.builtin.debug:
            msg:
              - "Cluster: {{ cluster_health.json.cluster_name }}"
              - "Status: {{ cluster_health.json.status }}"
              - "Nodes: {{ cluster_health.json.number_of_nodes }}"
              - "Data Nodes: {{ cluster_health.json.number_of_data_nodes }}"
          tags: ['elasticsearch', 'verify']

      rescue:

        - name: "elk_stack/site#play2 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_elk_stack_site_play2_status: "failed"
