---
# tasks file for win_user_management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_user_management']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_user_management_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_user_management | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_user_management_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_user_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_user_management_status: "running"
    fe_windows_win_user_management_preflight_passed: false
    fe_windows_win_user_management_postflight_passed: false
    fe_windows_win_user_management_failed_task: ""
    fe_windows_win_user_management_error: ""
    fe_windows_win_user_management_stats_published: false
  tags:
    - always

- name: "windows/win_user_management | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_user_management | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_user_management: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_user_management: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_user_management | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_user_management: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_user_management: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_user_management_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_user_management | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_user_management_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "windows/win_user_management | No tasks are defined for this component"
      ansible.builtin.debug:
        msg: "windows/win_user_management: nothing to execute; the component is a placeholder."
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "windows/win_user_management | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_user_management_preflight_passed | bool
          - fe_windows_win_user_management_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_user_management: postflight validation failed - preflight passed
          ={{ fe_windows_win_user_management_preflight_passed | default(false) }},
          status={{ fe_windows_win_user_management_status | default('unknown') }}.
        success_msg: "windows/win_user_management: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_user_management | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_user_management_postflight_passed: true
        fe_windows_win_user_management_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_user_management | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_user_management_status: "failed"
        fe_windows_win_user_management_postflight_passed: false
        fe_windows_win_user_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_user_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_user_management | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_user_management: FAILED at '{{ fe_windows_win_user_management_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_user_management_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_user_management | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_user_management failed at '{{ fe_windows_win_user_management_failed_task }}': {{ fe_windows_win_user_management_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_user_management | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_user_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_user_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_user_management_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_user_management | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_user_management":
              component: "windows/win_user_management"
              type: "role"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_user_management_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_user_management_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_user_management_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_user_management_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_user_management_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_user_management_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_user_management_failed_task | default('') }}"
              error: "{{ fe_windows_win_user_management_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_user_management_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_user_management_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_user_management_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_user_management_status | default('') == 'succeeded' else ['windows/win_user_management'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_user_management | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_user_management_stats_published: true
      tags:
        - always
