---
# Windows DNS STIG controls (WDNS-*) - DNS servers only
# NIST AU-12, SC-8, SC-20, SC-21

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_server2022_stig/dns_server']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_server2022_stig_dns_server_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_server2022_stig/dns_server | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_server2022_stig_dns_server_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_server2022_stig_dns_server_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_server2022_stig_dns_server_status: "running"
    fe_windows_win_server2022_stig_dns_server_preflight_passed: false
    fe_windows_win_server2022_stig_dns_server_postflight_passed: false
    fe_windows_win_server2022_stig_dns_server_failed_task: ""
    fe_windows_win_server2022_stig_dns_server_error: ""
    fe_windows_win_server2022_stig_dns_server_stats_published: false
  tags:
    - always

- name: "windows/win_server2022_stig/dns_server | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_server2022_stig/dns_server | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_server2022_stig/dns_server: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_server2022_stig/dns_server: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/dns_server | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_server2022_stig/dns_server: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_server2022_stig/dns_server: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_server2022_stig_dns_server_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/dns_server | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_dns_server_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: WDNS - Enforce secure-only dynamic updates on primary zones
      ansible.windows.win_powershell:
        script: |
          param([bool]$Apply, [bool]$SecureOnly)
          $ErrorActionPreference = 'Stop'
          Import-Module DnsServer
          $changed = $false
          $zones = Get-DnsServerZone | Where-Object { $_.ZoneType -eq 'Primary' -and -not $_.IsAutoCreated -and $_.IsDsIntegrated }
          foreach ($z in $zones) {
            $desired = if ($SecureOnly) { 'Secure' } else { $z.DynamicUpdate }
            if ($z.DynamicUpdate -ne $desired) {
              $changed = $true
              if ($Apply) { Set-DnsServerPrimaryZone -Name $z.ZoneName -DynamicUpdate $desired }
            }
          }
          $Ansible.Result = @{ zones_checked = $zones.Count }
          $Ansible.Changed = $changed
        parameters:
          Apply: "{{ apply_changes | bool }}"
          SecureOnly: "{{ win_dns_secure_dynamic_updates | bool }}"
      register: win_dns_updates
      tags: ["WDNS-22-000033", dns]

    - name: WDNS - Enable DNS server event logging
      ansible.windows.win_powershell:
        script: |
          param([bool]$Apply)
          $ErrorActionPreference = 'Stop'
          Import-Module DnsServer
          $diag = Get-DnsServerDiagnostics
          $changed = (-not $diag.EnableLogFileRollover) -or (-not $diag.Queries)
          if ($changed -and $Apply) {
            Set-DnsServerDiagnostics -EnableLogFileRollover $true -Queries $true -Answers $true
          }
          $Ansible.Changed = $changed
        parameters:
          Apply: "{{ apply_changes | bool }}"
      when: win_dns_log_level_events | bool
      register: win_dns_logging
      tags: ["WDNS-22-000001", dns]

    - name: WDNS - Disable recursion on authoritative-only servers
      ansible.windows.win_powershell:
        script: |
          param([bool]$Apply)
          $ErrorActionPreference = 'Stop'
          Import-Module DnsServer
          $rec = (Get-DnsServerRecursion).Enable
          $changed = $rec -eq $true
          if ($changed -and $Apply) { Set-DnsServerRecursion -Enable $false }
          $Ansible.Changed = $changed
        parameters:
          Apply: "{{ apply_changes | bool }}"
      when: win_dns_disable_recursion | bool
      register: win_dns_recursion
      tags: ["WDNS-22-000038", dns]

    # ----------------------------- postflight -------------------

    - name: "windows/win_server2022_stig/dns_server | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_server2022_stig_dns_server_preflight_passed | bool
          - fe_windows_win_server2022_stig_dns_server_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_server2022_stig/dns_server: postflight validation failed - preflight passed
          ={{ fe_windows_win_server2022_stig_dns_server_preflight_passed | default(false) }},
          status={{ fe_windows_win_server2022_stig_dns_server_status | default('unknown') }}.
        success_msg: "windows/win_server2022_stig/dns_server: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_server2022_stig/dns_server | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_dns_server_postflight_passed: true
        fe_windows_win_server2022_stig_dns_server_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_server2022_stig/dns_server | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_dns_server_status: "failed"
        fe_windows_win_server2022_stig_dns_server_postflight_passed: false
        fe_windows_win_server2022_stig_dns_server_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_server2022_stig_dns_server_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/dns_server | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_server2022_stig/dns_server: FAILED at '{{ fe_windows_win_server2022_stig_dns_server_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_server2022_stig_dns_server_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/dns_server | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_server2022_stig/dns_server failed at '{{ fe_windows_win_server2022_stig_dns_server_failed_task }}': {{ fe_windows_win_server2022_stig_dns_server_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_server2022_stig/dns_server | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_dns_server_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_server2022_stig_dns_server_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_server2022_stig_dns_server_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_server2022_stig/dns_server | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_server2022_stig/dns_server":
              component: "windows/win_server2022_stig/dns_server"
              type: "role-tasks"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_server2022_stig_dns_server_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_server2022_stig_dns_server_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_server2022_stig_dns_server_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_server2022_stig_dns_server_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_server2022_stig_dns_server_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_server2022_stig_dns_server_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_server2022_stig_dns_server_failed_task | default('') }}"
              error: "{{ fe_windows_win_server2022_stig_dns_server_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_server2022_stig_dns_server_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_server2022_stig_dns_server_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_server2022_stig_dns_server_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_server2022_stig_dns_server_status | default('') == 'succeeded' else ['windows/win_server2022_stig/dns_server'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_server2022_stig/dns_server | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_dns_server_stats_published: true
      tags:
        - always
