---
# Windows Server 2022 STIG compliance/remediation artifact (JSON).
# In dry-run, changed: true means the control is NOT yet compliant.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_server2022_stig/compliance_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_server2022_stig_compliance_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_server2022_stig/compliance_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_server2022_stig_compliance_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_server2022_stig_compliance_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_server2022_stig_compliance_report_status: "running"
    fe_windows_win_server2022_stig_compliance_report_preflight_passed: false
    fe_windows_win_server2022_stig_compliance_report_postflight_passed: false
    fe_windows_win_server2022_stig_compliance_report_failed_task: ""
    fe_windows_win_server2022_stig_compliance_report_error: ""
    fe_windows_win_server2022_stig_compliance_report_stats_published: false
  tags:
    - always

- name: "windows/win_server2022_stig/compliance_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_server2022_stig/compliance_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_server2022_stig/compliance_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_server2022_stig/compliance_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/compliance_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_server2022_stig/compliance_report: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_server2022_stig/compliance_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_server2022_stig_compliance_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/compliance_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_compliance_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assemble result map
      ansible.builtin.set_fact:
        win_stig_results:
          meta:
            host: "{{ inventory_hostname }}"
            timestamp: "{{ ansible_date_time.iso8601 | default('') }}"
            os: "{{ ansible_facts['os_name'] | default('Windows Server 2022') }}"
            benchmark: "{{ stig_benchmark }}"
            version: "{{ stig_version }}"
            mode: "{{ 'enforce' if apply_changes | bool else 'dry-run' }}"
            roles: { domain_controller: "{{ win_is_domain_controller }}", dns_server: "{{ win_is_dns_server }}" }
            compliance_frameworks: "{{ compliance_frameworks }}"
          controls:
            - { id: "WN22-AC-*", title: "Account/password/lockout policy", would_change: "{{ win_acct.changed | default(false) }}" }
            - { id: "WN22-AU-*", title: "Advanced audit policy", would_change: "{{ win_audit.changed | default(false) }}" }
            - { id: "WN22-SO-*/CC-*", title: "Security options (registry)", would_change: "{{ (win_reg.changed | default(false)) or (win_legal.changed | default(false)) }}" }
            - { id: "AD.*", title: "AD Domain controls", would_change: "{{ win_ad_recyclebin.changed | default(false) }}", applicable: "{{ win_is_domain_controller }}" }
            - { id: "WDNS-*", title: "Windows DNS controls", would_change: "{{ (win_dns_updates.changed | default(false)) or (win_dns_logging.changed | default(false)) }}", applicable: "{{ win_is_dns_server }}" }
      tags: [report]

    - name: Write JSON compliance artifact to control node
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}_win2022_stig.json"
        mode: "0640"
        content: "{{ win_stig_results | to_nice_json }}"
      delegate_to: localhost
      tags: [report]

    - name: Summarize compliance state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ win_stig_results.controls | selectattr('would_change') | list | length }}
          of {{ win_stig_results.controls | length }} control groups
          {{ 'still need remediation (dry-run)' if not (apply_changes | bool) else 'were remediated' }}.
      tags: [report]

    # ----------------------------- postflight -------------------

    - name: "windows/win_server2022_stig/compliance_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_server2022_stig_compliance_report_preflight_passed | bool
          - fe_windows_win_server2022_stig_compliance_report_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_server2022_stig/compliance_report: postflight validation failed - preflight passed
          ={{ fe_windows_win_server2022_stig_compliance_report_preflight_passed | default(false) }},
          status={{ fe_windows_win_server2022_stig_compliance_report_status | default('unknown') }}.
        success_msg: "windows/win_server2022_stig/compliance_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_server2022_stig/compliance_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_compliance_report_postflight_passed: true
        fe_windows_win_server2022_stig_compliance_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_server2022_stig/compliance_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_compliance_report_status: "failed"
        fe_windows_win_server2022_stig_compliance_report_postflight_passed: false
        fe_windows_win_server2022_stig_compliance_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_server2022_stig_compliance_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/compliance_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_server2022_stig/compliance_report: FAILED at '{{ fe_windows_win_server2022_stig_compliance_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_server2022_stig_compliance_report_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/compliance_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_server2022_stig/compliance_report failed at '{{ fe_windows_win_server2022_stig_compliance_report_failed_task }}': {{ fe_windows_win_server2022_stig_compliance_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_server2022_stig/compliance_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_compliance_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_server2022_stig_compliance_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_server2022_stig_compliance_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_server2022_stig/compliance_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_server2022_stig/compliance_report":
              component: "windows/win_server2022_stig/compliance_report"
              type: "role-tasks"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_server2022_stig_compliance_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_server2022_stig_compliance_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_server2022_stig_compliance_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_server2022_stig_compliance_report_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_server2022_stig_compliance_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_server2022_stig_compliance_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_server2022_stig_compliance_report_failed_task | default('') }}"
              error: "{{ fe_windows_win_server2022_stig_compliance_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_server2022_stig_compliance_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_server2022_stig_compliance_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_server2022_stig_compliance_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_server2022_stig_compliance_report_status | default('') == 'succeeded' else ['windows/win_server2022_stig/compliance_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_server2022_stig/compliance_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_compliance_report_stats_published: true
      tags:
        - always
