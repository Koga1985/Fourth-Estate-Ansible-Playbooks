---
# Security options / computer configuration (registry)
# WN22-SO-* / WN22-CC-* | NIST AC-7, AC-8, IA-5, SC-8, CM-6

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_server2022_stig/security_options']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_server2022_stig_security_options_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_server2022_stig/security_options | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_server2022_stig_security_options_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_server2022_stig_security_options_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_server2022_stig_security_options_status: "running"
    fe_windows_win_server2022_stig_security_options_preflight_passed: false
    fe_windows_win_server2022_stig_security_options_postflight_passed: false
    fe_windows_win_server2022_stig_security_options_failed_task: ""
    fe_windows_win_server2022_stig_security_options_error: ""
    fe_windows_win_server2022_stig_security_options_stats_published: false
  tags:
    - always

- name: "windows/win_server2022_stig/security_options | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_server2022_stig/security_options | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_server2022_stig/security_options: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_server2022_stig/security_options: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/security_options | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_server2022_stig/security_options: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_server2022_stig/security_options: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_server2022_stig_security_options_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/security_options | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_security_options_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: WN22-SO-*/CC-* - Apply registry security settings
      ansible.windows.win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop: "{{ win_registry_settings }}"
      loop_control:
        label: "{{ item.id }} - {{ item.name }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: win_reg
      tags:
        - stig_cat2
        - "WN22-SO-000150"
        - "WN22-SO-000250"
        - "WN22-CC-000350"

    - name: WN22-SO-000040 - Configure DoD logon legal notice text
      ansible.windows.win_regedit:
        path: 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System'
        name: LegalNoticeText
        data: "{{ win_legal_notice_text }}"
        type: string
      check_mode: "{{ not (apply_changes | bool) }}"
      register: win_legal
      tags: [stig_cat2, "WN22-SO-000040"]

    # ----------------------------- postflight -------------------

    - name: "windows/win_server2022_stig/security_options | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_server2022_stig_security_options_preflight_passed | bool
          - fe_windows_win_server2022_stig_security_options_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_server2022_stig/security_options: postflight validation failed - preflight passed
          ={{ fe_windows_win_server2022_stig_security_options_preflight_passed | default(false) }},
          status={{ fe_windows_win_server2022_stig_security_options_status | default('unknown') }}.
        success_msg: "windows/win_server2022_stig/security_options: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_server2022_stig/security_options | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_security_options_postflight_passed: true
        fe_windows_win_server2022_stig_security_options_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_server2022_stig/security_options | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_security_options_status: "failed"
        fe_windows_win_server2022_stig_security_options_postflight_passed: false
        fe_windows_win_server2022_stig_security_options_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_server2022_stig_security_options_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/security_options | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_server2022_stig/security_options: FAILED at '{{ fe_windows_win_server2022_stig_security_options_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_server2022_stig_security_options_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/security_options | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_server2022_stig/security_options failed at '{{ fe_windows_win_server2022_stig_security_options_failed_task }}': {{ fe_windows_win_server2022_stig_security_options_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_server2022_stig/security_options | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_security_options_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_server2022_stig_security_options_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_server2022_stig_security_options_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_server2022_stig/security_options | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_server2022_stig/security_options":
              component: "windows/win_server2022_stig/security_options"
              type: "role-tasks"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_server2022_stig_security_options_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_server2022_stig_security_options_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_server2022_stig_security_options_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_server2022_stig_security_options_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_server2022_stig_security_options_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_server2022_stig_security_options_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_server2022_stig_security_options_failed_task | default('') }}"
              error: "{{ fe_windows_win_server2022_stig_security_options_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_server2022_stig_security_options_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_server2022_stig_security_options_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_server2022_stig_security_options_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_server2022_stig_security_options_status | default('') == 'succeeded' else ['windows/win_server2022_stig/security_options'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_server2022_stig/security_options | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_security_options_stats_published: true
      tags:
        - always
