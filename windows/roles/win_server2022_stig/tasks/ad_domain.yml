---
# Active Directory Domain STIG controls (domain controllers only)
# NIST AC-2, AC-3, AC-6, AU-9
# These are largely assessment + safe enforcement; review before applying.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_server2022_stig/ad_domain']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_server2022_stig_ad_domain_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_server2022_stig/ad_domain | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_server2022_stig_ad_domain_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_server2022_stig_ad_domain_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_server2022_stig_ad_domain_status: "running"
    fe_windows_win_server2022_stig_ad_domain_preflight_passed: false
    fe_windows_win_server2022_stig_ad_domain_postflight_passed: false
    fe_windows_win_server2022_stig_ad_domain_failed_task: ""
    fe_windows_win_server2022_stig_ad_domain_error: ""
    fe_windows_win_server2022_stig_ad_domain_stats_published: false
  tags:
    - always

- name: "windows/win_server2022_stig/ad_domain | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_server2022_stig/ad_domain | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_server2022_stig/ad_domain: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_server2022_stig/ad_domain: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/ad_domain | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_server2022_stig/ad_domain: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_server2022_stig/ad_domain: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_server2022_stig_ad_domain_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig/ad_domain | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ad_domain_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: AD - Assess domain and forest functional level
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $domain = Get-ADDomain
          $forest = Get-ADForest
          $Ansible.Result = @{
            domain_mode = $domain.DomainMode.ToString()
            forest_mode = $forest.ForestMode.ToString()
            dns_root    = $domain.DNSRoot
          }
          $Ansible.Changed = $false
      register: win_ad_levels
      changed_when: false
      tags: ["AD.0001", ad]

    - name: AD - Assess privileged group membership (Domain/Enterprise/Schema Admins)
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $groups = 'Domain Admins','Enterprise Admins','Schema Admins'
          $out = @{}
          foreach ($g in $groups) {
            try { $out[$g] = @(Get-ADGroupMember -Identity $g -ErrorAction Stop | Select-Object -Expand SamAccountName) }
            catch { $out[$g] = @() }
          }
          $Ansible.Result = $out
          $Ansible.Changed = $false
      register: win_ad_priv_groups
      changed_when: false
      tags: ["AD.0002", ad]

    - name: AD - Enforce that the AD Recycle Bin is enabled (recoverability)
      ansible.windows.win_powershell:
        script: |
          param([bool]$Apply)
          $ErrorActionPreference = 'Stop'
          Import-Module ActiveDirectory
          $forest = (Get-ADForest).RootDomain
          $feature = Get-ADOptionalFeature -Filter {Name -eq 'Recycle Bin Feature'}
          if ($feature.EnabledScopes.Count -eq 0) {
            if ($Apply) {
              Enable-ADOptionalFeature 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target $forest -Confirm:$false
            }
            $Ansible.Changed = $true
          } else { $Ansible.Changed = $false }
        parameters:
          Apply: "{{ apply_changes | bool }}"
      register: win_ad_recyclebin
      tags: ["AD.0003", ad]

    # ----------------------------- postflight -------------------

    - name: "windows/win_server2022_stig/ad_domain | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_server2022_stig_ad_domain_preflight_passed | bool
          - fe_windows_win_server2022_stig_ad_domain_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_server2022_stig/ad_domain: postflight validation failed - preflight passed
          ={{ fe_windows_win_server2022_stig_ad_domain_preflight_passed | default(false) }},
          status={{ fe_windows_win_server2022_stig_ad_domain_status | default('unknown') }}.
        success_msg: "windows/win_server2022_stig/ad_domain: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_server2022_stig/ad_domain | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ad_domain_postflight_passed: true
        fe_windows_win_server2022_stig_ad_domain_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_server2022_stig/ad_domain | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ad_domain_status: "failed"
        fe_windows_win_server2022_stig_ad_domain_postflight_passed: false
        fe_windows_win_server2022_stig_ad_domain_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_server2022_stig_ad_domain_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/ad_domain | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_server2022_stig/ad_domain: FAILED at '{{ fe_windows_win_server2022_stig_ad_domain_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_server2022_stig_ad_domain_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig/ad_domain | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_server2022_stig/ad_domain failed at '{{ fe_windows_win_server2022_stig_ad_domain_failed_task }}': {{ fe_windows_win_server2022_stig_ad_domain_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_server2022_stig/ad_domain | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ad_domain_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_server2022_stig_ad_domain_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_server2022_stig_ad_domain_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_server2022_stig/ad_domain | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_server2022_stig/ad_domain":
              component: "windows/win_server2022_stig/ad_domain"
              type: "role-tasks"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_server2022_stig_ad_domain_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_server2022_stig_ad_domain_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_server2022_stig_ad_domain_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_server2022_stig_ad_domain_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_server2022_stig_ad_domain_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_server2022_stig_ad_domain_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_server2022_stig_ad_domain_failed_task | default('') }}"
              error: "{{ fe_windows_win_server2022_stig_ad_domain_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_server2022_stig_ad_domain_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_server2022_stig_ad_domain_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_server2022_stig_ad_domain_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_server2022_stig_ad_domain_status | default('') == 'succeeded' else ['windows/win_server2022_stig/ad_domain'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_server2022_stig/ad_domain | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ad_domain_stats_published: true
      tags:
        - always
