---
# tasks file for win_server2022_stig

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['windows/win_server2022_stig']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_windows_win_server2022_stig_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "windows/win_server2022_stig | Initialize validation state"
  ansible.builtin.set_fact:
    fe_windows_win_server2022_stig_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_windows_win_server2022_stig_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_windows_win_server2022_stig_status: "running"
    fe_windows_win_server2022_stig_preflight_passed: false
    fe_windows_win_server2022_stig_postflight_passed: false
    fe_windows_win_server2022_stig_failed_task: ""
    fe_windows_win_server2022_stig_error: ""
    fe_windows_win_server2022_stig_stats_published: false
  tags:
    - always

- name: "windows/win_server2022_stig | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "windows/win_server2022_stig | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          windows/win_server2022_stig: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          windows/win_server2022_stig: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "windows/win_server2022_stig: required variable '{{ item }}' is not defined."
        success_msg: "windows/win_server2022_stig: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_windows_win_server2022_stig_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "windows/win_server2022_stig | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists on control node
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: [always]

    - name: Show run mode
      ansible.builtin.debug:
        msg: >-
          win_server2022_stig on {{ inventory_hostname }} -
          {{ 'ENFORCING' if apply_changes | bool else 'DRY-RUN / check mode only' }}
          (DC={{ win_is_domain_controller }}, DNS={{ win_is_dns_server }})
      tags: [always]

    - name: Account / password / lockout policy (WN22-AC-*)
      ansible.builtin.import_tasks: account_policy.yml
      when: stig_account_policy | bool
      tags: [stig, account]

    - name: Advanced audit policy (WN22-AU-*)
      ansible.builtin.import_tasks: audit_policy.yml
      when: stig_audit_policy | bool
      tags: [stig, audit]

    - name: Security options / computer config registry (WN22-SO-*/CC-*)
      ansible.builtin.import_tasks: security_options.yml
      when: stig_security_options | bool
      tags: [stig, security_options]

    - name: Active Directory Domain STIG controls
      ansible.builtin.import_tasks: ad_domain.yml
      when: stig_ad_domain | bool
      tags: [stig, ad]

    - name: Windows DNS STIG controls
      ansible.builtin.import_tasks: dns_server.yml
      when: stig_dns_server | bool
      tags: [stig, dns]

    - name: Compliance report
      ansible.builtin.import_tasks: compliance_report.yml
      when: stig_compliance_report | bool
      tags: [stig, report]

    # ----------------------------- postflight -------------------

    - name: "windows/win_server2022_stig | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_windows_win_server2022_stig_preflight_passed | bool
          - fe_windows_win_server2022_stig_status in ['running', 'succeeded']
        fail_msg: >-
          windows/win_server2022_stig: postflight validation failed - preflight passed
          ={{ fe_windows_win_server2022_stig_preflight_passed | default(false) }},
          status={{ fe_windows_win_server2022_stig_status | default('unknown') }}.
        success_msg: "windows/win_server2022_stig: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "windows/win_server2022_stig | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_postflight_passed: true
        fe_windows_win_server2022_stig_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "windows/win_server2022_stig | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_status: "failed"
        fe_windows_win_server2022_stig_postflight_passed: false
        fe_windows_win_server2022_stig_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_windows_win_server2022_stig_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          windows/win_server2022_stig: FAILED at '{{ fe_windows_win_server2022_stig_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_windows_win_server2022_stig_error }}
      tags:
        - always
        - rescue

    - name: "windows/win_server2022_stig | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          windows/win_server2022_stig failed at '{{ fe_windows_win_server2022_stig_failed_task }}': {{ fe_windows_win_server2022_stig_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "windows/win_server2022_stig | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_windows_win_server2022_stig_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_windows_win_server2022_stig_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "windows/win_server2022_stig | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "windows/win_server2022_stig":
              component: "windows/win_server2022_stig"
              type: "role"
              platform: "windows"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_windows_win_server2022_stig_status | default('unknown') }}"
              preflight_passed: "{{ fe_windows_win_server2022_stig_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_windows_win_server2022_stig_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_windows_win_server2022_stig_started_at | default('') }}"
              ended_at: "{{ fe_windows_win_server2022_stig_ended_at | default('') }}"
              duration_seconds: "{{ fe_windows_win_server2022_stig_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_windows_win_server2022_stig_failed_task | default('') }}"
              error: "{{ fe_windows_win_server2022_stig_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_windows_win_server2022_stig_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_windows_win_server2022_stig_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_windows_win_server2022_stig_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_windows_win_server2022_stig_status | default('') == 'succeeded' else ['windows/win_server2022_stig'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "windows/win_server2022_stig | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_windows_win_server2022_stig_stats_published: true
      tags:
        - always
