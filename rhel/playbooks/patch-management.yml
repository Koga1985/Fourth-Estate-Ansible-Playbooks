---
# playbooks/patch-management.yml - RHEL Patch Management
# DoD STIG V-204393

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: RHEL Patch Management
  hosts: rhel_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: "{{ patch_serial | default('100%') }}"

  vars:
    # Patch management settings
    rhel_security_updates_only: false
    rhel_auto_reboot: false
    rhel_reboot_delay: 300

  pre_tasks:
    - name: "rhel/patch-management | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "rhel/patch-management | Initialize validation state"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_rhel_patch_management_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_patch_management_status: "running"
            fe_rhel_patch_management_preflight_passed: false
            fe_rhel_patch_management_postflight_passed: false
            fe_rhel_patch_management_failed_task: ""
            fe_rhel_patch_management_error: ""
            fe_rhel_patch_management_stats_published: false
          tags:
            - always

        - name: "rhel/patch-management | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              rhel/patch-management: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              rhel/patch-management: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/patch-management | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "rhel/patch-management: required variable '{{ item }}' is not defined."
            success_msg: "rhel/patch-management: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_rhel_patch_management_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/patch-management | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "rhel/patch-management | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_status: "preflight_failed"
            fe_rhel_patch_management_postflight_passed: false
            fe_rhel_patch_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_patch_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/patch-management: FAILED at '{{ fe_rhel_patch_management_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_patch_management_error }}
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/patch-management":
                  component: "rhel/patch-management"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_patch_management_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_patch_management_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_patch_management_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_patch_management_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_patch_management_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_patch_management_failed_task | default('') }}"
                  error: "{{ fe_rhel_patch_management_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_patch_management_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_patch_management_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_patch_management_status | default('') == 'succeeded' else ['rhel/patch-management'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "rhel/patch-management | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_stats_published: true
          tags:
            - always

        - name: "rhel/patch-management | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/patch-management failed at '{{ fe_rhel_patch_management_failed_task }}': {{ fe_rhel_patch_management_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/patch-management | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              rhel/patch-management: preflight
              {{ 'passed' if fe_rhel_patch_management_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display patch management information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "RHEL Patch Management"
          - "=========================================="
          - "Target hosts: {{ ansible_play_hosts | length }}"
          - "Security updates only: {{ rhel_security_updates_only }}"
          - "Auto reboot: {{ rhel_auto_reboot }}"
          - "=========================================="
      tags:
        - always

    - name: Check subscription status
      ansible.builtin.command: subscription-manager status
      register: sub_status
      changed_when: false
      failed_when: false
      tags:
        - validation

  roles:
    - role: rhel/roles/rhel-patch-management
      tags:
        - patching
        - updates

  post_tasks:
    - name: Check if reboot is required
      ansible.builtin.shell: |
        LAST_KERNEL=$(rpm -q --last kernel | head -1 | awk '{print $1}' | sed 's/kernel-//')
        CURRENT_KERNEL=$(uname -r)
        if [ "$LAST_KERNEL" != "$CURRENT_KERNEL" ]; then echo "yes"; else echo "no"; fi
      register: reboot_required
      changed_when: false
      tags:
        - always

    - name: Display patch completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Patch Management Completed"
          - "=========================================="
          - "Host: {{ ansible_hostname }}"
          - "Reboot required: {{ reboot_required.stdout }}"
          - ""
          - "{% if reboot_required.stdout == 'yes' %}IMPORTANT: Reboot system to apply kernel updates{% endif %}"
          - "=========================================="
      tags:
        - always

    - name: Reboot system if required and auto_reboot is enabled
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
      when:
        - rhel_auto_reboot | bool
        - reboot_required.stdout == "yes"
      tags:
        - reboot
        - never
    - name: "rhel/patch-management | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "rhel/patch-management | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_rhel_patch_management_preflight_passed | bool
              - fe_rhel_patch_management_status in ['running', 'succeeded']
            fail_msg: >-
              rhel/patch-management: postflight validation failed - preflight passed
              ={{ fe_rhel_patch_management_preflight_passed | default(false) }},
              status={{ fe_rhel_patch_management_status | default('unknown') }}.
            success_msg: "rhel/patch-management: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "rhel/patch-management | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_postflight_passed: true
            fe_rhel_patch_management_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "rhel/patch-management | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_status: "failed"
            fe_rhel_patch_management_postflight_passed: false
            fe_rhel_patch_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_patch_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/patch-management: FAILED at '{{ fe_rhel_patch_management_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_patch_management_error }}
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/patch-management failed at '{{ fe_rhel_patch_management_failed_task }}': {{ fe_rhel_patch_management_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/patch-management | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_patch_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_patch_management_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/patch-management | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/patch-management":
                  component: "rhel/patch-management"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_patch_management_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_patch_management_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_patch_management_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_patch_management_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_patch_management_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_patch_management_failed_task | default('') }}"
                  error: "{{ fe_rhel_patch_management_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_patch_management_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_patch_management_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_patch_management_status | default('') == 'succeeded' else ['rhel/patch-management'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_rhel_patch_management_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/patch-management | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_stats_published: true
          tags:
            - always

        - name: "rhel/patch-management | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              rhel/patch-management: {{ fe_rhel_patch_management_status | default('unknown') }} in
              {{ fe_rhel_patch_management_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "rhel/patch-management | Guarded execution with rescue and always handling"
      block:

        - name: "rhel/patch-management | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "rhel/patch-management | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_status: "failed"
            fe_rhel_patch_management_postflight_passed: false
            fe_rhel_patch_management_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_patch_management_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/patch-management: FAILED at '{{ fe_rhel_patch_management_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_patch_management_error }}
          tags:
            - always
            - rescue

        - name: "rhel/patch-management | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/patch-management failed at '{{ fe_rhel_patch_management_failed_task }}': {{ fe_rhel_patch_management_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/patch-management | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_patch_management_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_patch_management_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/patch-management | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/patch-management":
                  component: "rhel/patch-management"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_patch_management_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_patch_management_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_patch_management_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_patch_management_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_patch_management_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_patch_management_failed_task | default('') }}"
                  error: "{{ fe_rhel_patch_management_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_patch_management_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_patch_management_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_patch_management_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_patch_management_status | default('') == 'succeeded' else ['rhel/patch-management'] }}
            aggregate: true
            per_host: false
          when:
            - fe_rhel_patch_management_status | default('') == 'failed'
            - not (fe_rhel_patch_management_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/patch-management | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_patch_management_stats_published: true
          when:
            - fe_rhel_patch_management_status | default('') == 'failed'
          tags:
            - always
