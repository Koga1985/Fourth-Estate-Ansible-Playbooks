---
# playbooks/system-hardening.yml - Complete RHEL System Hardening
# DoD STIG and NIST SP 800-53 Compliant

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: RHEL System Hardening
  hosts: rhel_servers
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Compliance settings
    rhel_stig_level: high
    rhel_apply_nist_controls: true
    rhel_enable_fips: false

  pre_tasks:
    - name: "rhel/system-hardening | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "rhel/system-hardening | Initialize validation state"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_rhel_system_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_system_hardening_status: "running"
            fe_rhel_system_hardening_preflight_passed: false
            fe_rhel_system_hardening_postflight_passed: false
            fe_rhel_system_hardening_failed_task: ""
            fe_rhel_system_hardening_error: ""
            fe_rhel_system_hardening_stats_published: false
          tags:
            - always

        - name: "rhel/system-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              rhel/system-hardening: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              rhel/system-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/system-hardening | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "rhel/system-hardening: required variable '{{ item }}' is not defined."
            success_msg: "rhel/system-hardening: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_rhel_system_hardening_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/system-hardening | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "rhel/system-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_status: "preflight_failed"
            fe_rhel_system_hardening_postflight_passed: false
            fe_rhel_system_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_system_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/system-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/system-hardening: FAILED at '{{ fe_rhel_system_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_system_hardening_error }}
          tags:
            - always
            - rescue

        - name: "rhel/system-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/system-hardening":
                  component: "rhel/system-hardening"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_system_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_system_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_system_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_system_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_system_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_system_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_system_hardening_failed_task | default('') }}"
                  error: "{{ fe_rhel_system_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_system_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_system_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_system_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_system_hardening_status | default('') == 'succeeded' else ['rhel/system-hardening'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "rhel/system-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_stats_published: true
          tags:
            - always

        - name: "rhel/system-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/system-hardening failed at '{{ fe_rhel_system_hardening_failed_task }}': {{ fe_rhel_system_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/system-hardening | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              rhel/system-hardening: preflight
              {{ 'passed' if fe_rhel_system_hardening_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display playbook information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "RHEL System Hardening Playbook"
          - "=========================================="
          - "Target hosts: {{ ansible_play_hosts | length }}"
          - "STIG Level: {{ rhel_stig_level }}"
          - "NIST Controls: {{ rhel_apply_nist_controls }}"
          - "=========================================="
      tags:
        - always

  roles:
    - role: rhel/roles/rhel-hardening
      tags:
        - hardening
        - security
        - stig
        - nist

    - role: rhel/roles/rhel-firewall-selinux
      tags:
        - firewall
        - selinux
        - security

    - role: rhel/roles/rhel-audit-logging
      tags:
        - audit
        - logging
        - security

  post_tasks:
    - name: Display hardening completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "System Hardening Completed"
          - "=========================================="
          - "Host: {{ ansible_hostname }}"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - ""
          - "IMPORTANT: Review changes before rebooting"
          - "Run compliance validation: ansible-playbook compliance-check.yml"
          - "=========================================="
      tags:
        - always

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_check
      tags:
        - always

    - name: Display reboot notice
      ansible.builtin.debug:
        msg:
          - "WARNING: System reboot may be required"
          - "Check /var/run/reboot-required and kernel version"
      when: reboot_check.stat.exists | default(false)
      tags:
        - always
    - name: "rhel/system-hardening | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "rhel/system-hardening | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_rhel_system_hardening_preflight_passed | bool
              - fe_rhel_system_hardening_status in ['running', 'succeeded']
            fail_msg: >-
              rhel/system-hardening: postflight validation failed - preflight passed
              ={{ fe_rhel_system_hardening_preflight_passed | default(false) }},
              status={{ fe_rhel_system_hardening_status | default('unknown') }}.
            success_msg: "rhel/system-hardening: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "rhel/system-hardening | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_postflight_passed: true
            fe_rhel_system_hardening_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "rhel/system-hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_status: "failed"
            fe_rhel_system_hardening_postflight_passed: false
            fe_rhel_system_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_system_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/system-hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/system-hardening: FAILED at '{{ fe_rhel_system_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_system_hardening_error }}
          tags:
            - always
            - rescue

        - name: "rhel/system-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/system-hardening failed at '{{ fe_rhel_system_hardening_failed_task }}': {{ fe_rhel_system_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/system-hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_system_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_system_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/system-hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/system-hardening":
                  component: "rhel/system-hardening"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_system_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_system_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_system_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_system_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_system_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_system_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_system_hardening_failed_task | default('') }}"
                  error: "{{ fe_rhel_system_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_system_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_system_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_system_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_system_hardening_status | default('') == 'succeeded' else ['rhel/system-hardening'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_rhel_system_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/system-hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_system_hardening_stats_published: true
          tags:
            - always

        - name: "rhel/system-hardening | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              rhel/system-hardening: {{ fe_rhel_system_hardening_status | default('unknown') }} in
              {{ fe_rhel_system_hardening_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
