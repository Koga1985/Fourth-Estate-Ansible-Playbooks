---
# playbooks/compliance-check.yml - RHEL Compliance Validation
# DoD STIG and NIST Compliance Checking

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: RHEL Compliance Validation
  hosts: rhel_servers
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    generate_report: true
    report_path: /tmp/compliance-{{ ansible_hostname }}-{{ ansible_date_time.epoch }}.txt

  pre_tasks:
    - name: "rhel/compliance-check | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "rhel/compliance-check | Initialize validation state"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_rhel_compliance_check_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_compliance_check_status: "running"
            fe_rhel_compliance_check_preflight_passed: false
            fe_rhel_compliance_check_postflight_passed: false
            fe_rhel_compliance_check_failed_task: ""
            fe_rhel_compliance_check_error: ""
            fe_rhel_compliance_check_stats_published: false
          tags:
            - always

        - name: "rhel/compliance-check | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              rhel/compliance-check: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              rhel/compliance-check: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/compliance-check | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "rhel/compliance-check: required variable '{{ item }}' is not defined."
            success_msg: "rhel/compliance-check: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_rhel_compliance_check_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "rhel/compliance-check | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "rhel/compliance-check | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_status: "preflight_failed"
            fe_rhel_compliance_check_postflight_passed: false
            fe_rhel_compliance_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_compliance_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: FAILED at '{{ fe_rhel_compliance_check_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_compliance_check_error }}
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/compliance-check":
                  component: "rhel/compliance-check"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_compliance_check_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_compliance_check_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_compliance_check_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_compliance_check_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_compliance_check_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_compliance_check_failed_task | default('') }}"
                  error: "{{ fe_rhel_compliance_check_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_compliance_check_status | default('') == 'succeeded' else ['rhel/compliance-check'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "rhel/compliance-check | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_stats_published: true
          tags:
            - always

        - name: "rhel/compliance-check | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/compliance-check failed at '{{ fe_rhel_compliance_check_failed_task }}': {{ fe_rhel_compliance_check_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/compliance-check | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: preflight
              {{ 'passed' if fe_rhel_compliance_check_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "rhel/compliance-check | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display compliance check information
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "RHEL Compliance Validation"
              - "=========================================="
              - "Target hosts: {{ ansible_play_hosts | length }}"
              - "Report generation: {{ generate_report }}"
              - "=========================================="
          tags:
            - always

        - name: "rhel/compliance-check | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "rhel/compliance-check | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_status: "failed"
            fe_rhel_compliance_check_postflight_passed: false
            fe_rhel_compliance_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_compliance_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: FAILED at '{{ fe_rhel_compliance_check_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_compliance_check_error }}
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/compliance-check failed at '{{ fe_rhel_compliance_check_failed_task }}': {{ fe_rhel_compliance_check_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/compliance-check | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_compliance_check_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_compliance_check_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/compliance-check | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/compliance-check":
                  component: "rhel/compliance-check"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_compliance_check_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_compliance_check_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_compliance_check_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_compliance_check_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_compliance_check_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_compliance_check_failed_task | default('') }}"
                  error: "{{ fe_rhel_compliance_check_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_compliance_check_status | default('') == 'succeeded' else ['rhel/compliance-check'] }}
            aggregate: true
            per_host: false
          when:
            - fe_rhel_compliance_check_status | default('') == 'failed'
            - not (fe_rhel_compliance_check_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/compliance-check | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_stats_published: true
          when:
            - fe_rhel_compliance_check_status | default('') == 'failed'
          tags:
            - always

  tasks:
    - name: "rhel/compliance-check | Guarded execution with rescue and always handling"
      block:

        - name: Check SSH configuration
          ansible.builtin.command: sshd -t
          register: ssh_check
          changed_when: false
          failed_when: false
          tags:
            - validation
            - ssh

        - name: Check firewall status
          ansible.builtin.command: firewall-cmd --state
          register: firewall_check
          changed_when: false
          failed_when: false
          tags:
            - validation
            - firewall

        - name: Check SELinux status
          ansible.builtin.command: getenforce
          register: selinux_check
          changed_when: false
          tags:
            - validation
            - selinux

        - name: Check audit service
          ansible.builtin.systemd:
            name: auditd
          register: audit_check
          tags:
            - validation
            - audit

        - name: Check FIPS mode
          ansible.builtin.command: fips-mode-setup --check
          register: fips_check
          changed_when: false
          failed_when: false
          tags:
            - validation
            - fips

        - name: Check for available updates
          ansible.builtin.dnf:
            list: updates
          register: updates_check
          tags:
            - validation
            - updates

        - name: Check subscription status
          ansible.builtin.command: subscription-manager status
          register: subscription_check
          changed_when: false
          failed_when: false
          tags:
            - validation

        - name: Generate compliance summary
          ansible.builtin.set_fact:
            compliance_summary:
              hostname: "{{ ansible_hostname }}"
              distribution: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
              kernel: "{{ ansible_kernel }}"
              ssh_config: "{{ 'PASS' if ssh_check.rc == 0 else 'FAIL' }}"
              firewall: "{{ firewall_check.stdout if firewall_check.rc == 0 else 'NOT RUNNING' }}"
              selinux: "{{ selinux_check.stdout }}"
              audit: "{{ 'RUNNING' if audit_check.status.ActiveState == 'active' else 'NOT RUNNING' }}"
              fips: "{{ fips_check.stdout }}"
              pending_updates: "{{ updates_check.results | length }}"
              subscription: "{{ 'ACTIVE' if 'Current' in subscription_check.stdout else 'INACTIVE' }}"
          tags:
            - report

        - name: Display compliance summary
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "Compliance Validation Summary"
              - "=========================================="
              - "Hostname: {{ compliance_summary.hostname }}"
              - "Distribution: {{ compliance_summary.distribution }}"
              - "Kernel: {{ compliance_summary.kernel }}"
              - ""
              - "SSH Configuration: {{ compliance_summary.ssh_config }}"
              - "Firewall Status: {{ compliance_summary.firewall }}"
              - "SELinux Status: {{ compliance_summary.selinux }}"
              - "Audit Service: {{ compliance_summary.audit }}"
              - "FIPS Mode: {{ compliance_summary.fips }}"
              - "Pending Updates: {{ compliance_summary.pending_updates }}"
              - "Subscription: {{ compliance_summary.subscription }}"
              - ""
              - "=========================================="
              - "Compliance Status: {% if compliance_summary.ssh_config == 'PASS' and compliance_summary.firewall == 'running' and compliance_summary.selinux in ['Enforcing', 'Permissive'] and compliance_summary.audit == 'RUNNING' %}PASS{% else %}FAIL{% endif %}"
              - "=========================================="
          tags:
            - report

        - name: Generate compliance report file
          ansible.builtin.template:
            src: ../templates/compliance-report.j2
            dest: "{{ report_path }}"
            owner: root
            group: root
            mode: '0600'
          when: generate_report | bool
          tags:
            - report

        - name: "rhel/compliance-check | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "rhel/compliance-check | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_status: "failed"
            fe_rhel_compliance_check_postflight_passed: false
            fe_rhel_compliance_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_compliance_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: FAILED at '{{ fe_rhel_compliance_check_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_compliance_check_error }}
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/compliance-check failed at '{{ fe_rhel_compliance_check_failed_task }}': {{ fe_rhel_compliance_check_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/compliance-check | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_compliance_check_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_compliance_check_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/compliance-check | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/compliance-check":
                  component: "rhel/compliance-check"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_compliance_check_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_compliance_check_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_compliance_check_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_compliance_check_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_compliance_check_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_compliance_check_failed_task | default('') }}"
                  error: "{{ fe_rhel_compliance_check_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_compliance_check_status | default('') == 'succeeded' else ['rhel/compliance-check'] }}
            aggregate: true
            per_host: false
          when:
            - fe_rhel_compliance_check_status | default('') == 'failed'
            - not (fe_rhel_compliance_check_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/compliance-check | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_stats_published: true
          when:
            - fe_rhel_compliance_check_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Display SCAP assessment instructions
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "For detailed SCAP compliance assessment:"
          - "=========================================="
          - ""
          - "Install SCAP Security Guide:"
          - "  dnf install scap-security-guide openscap-scanner"
          - ""
          - "Run STIG assessment:"
          - "  oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_stig \\"
          - "    --results /tmp/stig-results.xml \\"
          - "    --report /tmp/stig-report.html \\"
          - "    /usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
          - ""
          - "Run CIS Benchmark assessment:"
          - "  oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis \\"
          - "    --results /tmp/cis-results.xml \\"
          - "    --report /tmp/cis-report.html \\"
          - "    /usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
          - ""
          - "=========================================="
      tags:
        - report
    - name: "rhel/compliance-check | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "rhel/compliance-check | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_rhel_compliance_check_preflight_passed | bool
              - fe_rhel_compliance_check_status in ['running', 'succeeded']
            fail_msg: >-
              rhel/compliance-check: postflight validation failed - preflight passed
              ={{ fe_rhel_compliance_check_preflight_passed | default(false) }},
              status={{ fe_rhel_compliance_check_status | default('unknown') }}.
            success_msg: "rhel/compliance-check: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "rhel/compliance-check | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_postflight_passed: true
            fe_rhel_compliance_check_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "rhel/compliance-check | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_status: "failed"
            fe_rhel_compliance_check_postflight_passed: false
            fe_rhel_compliance_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_rhel_compliance_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: FAILED at '{{ fe_rhel_compliance_check_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_rhel_compliance_check_error }}
          tags:
            - always
            - rescue

        - name: "rhel/compliance-check | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              rhel/compliance-check failed at '{{ fe_rhel_compliance_check_failed_task }}': {{ fe_rhel_compliance_check_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "rhel/compliance-check | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_rhel_compliance_check_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_compliance_check_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "rhel/compliance-check | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "rhel/compliance-check":
                  component: "rhel/compliance-check"
                  type: "playbook"
                  platform: "rhel"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_rhel_compliance_check_status | default('unknown') }}"
                  preflight_passed: "{{ fe_rhel_compliance_check_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_rhel_compliance_check_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_rhel_compliance_check_started_at | default('') }}"
                  ended_at: "{{ fe_rhel_compliance_check_ended_at | default('') }}"
                  duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_rhel_compliance_check_failed_task | default('') }}"
                  error: "{{ fe_rhel_compliance_check_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_rhel_compliance_check_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_rhel_compliance_check_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_rhel_compliance_check_status | default('') == 'succeeded' else ['rhel/compliance-check'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_rhel_compliance_check_stats_published | default(false) | bool)
          tags:
            - always

        - name: "rhel/compliance-check | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_rhel_compliance_check_stats_published: true
          tags:
            - always

        - name: "rhel/compliance-check | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              rhel/compliance-check: {{ fe_rhel_compliance_check_status | default('unknown') }} in
              {{ fe_rhel_compliance_check_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
