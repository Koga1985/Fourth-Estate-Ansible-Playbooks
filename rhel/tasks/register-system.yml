---
# tasks/register-system.yml - Register system with Red Hat Subscription Manager
# DoD STIG V-204392

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/register-system']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_register_system_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/register-system | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_register_system_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_register_system_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_register_system_status: "running"
    fe_rhel_register_system_preflight_passed: false
    fe_rhel_register_system_postflight_passed: false
    fe_rhel_register_system_failed_task: ""
    fe_rhel_register_system_error: ""
    fe_rhel_register_system_stats_published: false
  tags:
    - always

- name: "rhel/register-system | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/register-system | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/register-system: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/register-system: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/register-system | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/register-system: required variable '{{ item }}' is not defined."
        success_msg: "rhel/register-system: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_register_system_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/register-system | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_register_system_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check current subscription status
      ansible.builtin.command: subscription-manager status
      register: sub_status
      changed_when: false
      failed_when: false
      tags:
        - subscription

    - name: Display current subscription status
      ansible.builtin.debug:
        msg: "{{ sub_status.stdout_lines }}"
      tags:
        - subscription

    - name: Register system with Red Hat
      community.general.redhat_subscription:
        state: present
        username: "{{ rhsm_username }}"
        password: "{{ rhsm_password }}"
        auto_attach: true
      no_log: true
      when:
        - rhsm_username is defined
        - rhsm_password is defined
        - "'Overall Status: Unknown' in sub_status.stdout or 'Overall Status: Invalid' in sub_status.stdout"
      tags:
        - subscription

    - name: Verify subscription
      ansible.builtin.command: subscription-manager status
      register: final_sub_status
      changed_when: false
      tags:
        - subscription
        - validation

    - name: Display final subscription status
      ansible.builtin.debug:
        msg: "{{ final_sub_status.stdout_lines }}"
      tags:
        - subscription
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/register-system | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_register_system_preflight_passed | bool
          - fe_rhel_register_system_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/register-system: postflight validation failed - preflight passed
          ={{ fe_rhel_register_system_preflight_passed | default(false) }},
          status={{ fe_rhel_register_system_status | default('unknown') }}.
        success_msg: "rhel/register-system: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/register-system | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_register_system_postflight_passed: true
        fe_rhel_register_system_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/register-system | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_register_system_status: "failed"
        fe_rhel_register_system_postflight_passed: false
        fe_rhel_register_system_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_register_system_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/register-system | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/register-system: FAILED at '{{ fe_rhel_register_system_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_register_system_error }}
      tags:
        - always
        - rescue

    - name: "rhel/register-system | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/register-system failed at '{{ fe_rhel_register_system_failed_task }}': {{ fe_rhel_register_system_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/register-system | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_register_system_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_register_system_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_register_system_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/register-system | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/register-system":
              component: "rhel/register-system"
              type: "tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_register_system_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_register_system_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_register_system_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_register_system_started_at | default('') }}"
              ended_at: "{{ fe_rhel_register_system_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_register_system_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_register_system_failed_task | default('') }}"
              error: "{{ fe_rhel_register_system_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_register_system_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_register_system_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_register_system_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_register_system_status | default('') == 'succeeded' else ['rhel/register-system'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/register-system | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_register_system_stats_published: true
      tags:
        - always
