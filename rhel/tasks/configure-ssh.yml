---
# tasks/configure-ssh.yml - SSH hardening configuration
# DoD STIG V-204596 through V-204612

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/configure-ssh']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_configure_ssh_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/configure-ssh | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_configure_ssh_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_configure_ssh_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_configure_ssh_status: "running"
    fe_rhel_configure_ssh_preflight_passed: false
    fe_rhel_configure_ssh_postflight_passed: false
    fe_rhel_configure_ssh_failed_task: ""
    fe_rhel_configure_ssh_error: ""
    fe_rhel_configure_ssh_stats_published: false
  tags:
    - always

- name: "rhel/configure-ssh | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/configure-ssh | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/configure-ssh: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/configure-ssh: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/configure-ssh | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/configure-ssh: required variable '{{ item }}' is not defined."
        success_msg: "rhel/configure-ssh: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_configure_ssh_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/configure-ssh | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_configure_ssh_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Backup SSH configuration
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.backup-{{ ansible_date_time.epoch }}
        remote_src: true
        mode: '0600'
      tags:
        - ssh

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      loop:
        - { key: 'PermitRootLogin', value: 'no' }
        - { key: 'PasswordAuthentication', value: 'no' }
        - { key: 'X11Forwarding', value: 'no' }
        - { key: 'MaxAuthTries', value: '3' }
        - { key: 'ClientAliveInterval', value: '600' }
        - { key: 'ClientAliveCountMax', value: '0' }
        - { key: 'Protocol', value: '2' }
      register: ssh_config_result
      tags:
        - ssh

    - name: Restart SSH service
      ansible.builtin.systemd:
        name: sshd
        state: restarted
      when: ssh_config_result.results | selectattr('changed', 'equalto', true) | list | length > 0
      tags:
        - ssh

    - name: Validate SSH configuration
      ansible.builtin.command: sshd -t
      changed_when: false
      tags:
        - ssh
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/configure-ssh | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_configure_ssh_preflight_passed | bool
          - fe_rhel_configure_ssh_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/configure-ssh: postflight validation failed - preflight passed
          ={{ fe_rhel_configure_ssh_preflight_passed | default(false) }},
          status={{ fe_rhel_configure_ssh_status | default('unknown') }}.
        success_msg: "rhel/configure-ssh: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/configure-ssh | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_configure_ssh_postflight_passed: true
        fe_rhel_configure_ssh_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/configure-ssh | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_configure_ssh_status: "failed"
        fe_rhel_configure_ssh_postflight_passed: false
        fe_rhel_configure_ssh_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_configure_ssh_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/configure-ssh | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/configure-ssh: FAILED at '{{ fe_rhel_configure_ssh_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_configure_ssh_error }}
      tags:
        - always
        - rescue

    - name: "rhel/configure-ssh | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/configure-ssh failed at '{{ fe_rhel_configure_ssh_failed_task }}': {{ fe_rhel_configure_ssh_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/configure-ssh | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_configure_ssh_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_configure_ssh_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_configure_ssh_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/configure-ssh | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/configure-ssh":
              component: "rhel/configure-ssh"
              type: "tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_configure_ssh_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_configure_ssh_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_configure_ssh_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_configure_ssh_started_at | default('') }}"
              ended_at: "{{ fe_rhel_configure_ssh_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_configure_ssh_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_configure_ssh_failed_task | default('') }}"
              error: "{{ fe_rhel_configure_ssh_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_configure_ssh_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_configure_ssh_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_configure_ssh_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_configure_ssh_status | default('') == 'succeeded' else ['rhel/configure-ssh'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/configure-ssh | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_configure_ssh_stats_published: true
      tags:
        - always
