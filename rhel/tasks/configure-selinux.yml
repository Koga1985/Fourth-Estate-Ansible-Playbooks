---
# tasks/configure-selinux.yml - SELinux configuration
# DoD STIG V-204401

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/configure-selinux']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_configure_selinux_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/configure-selinux | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_configure_selinux_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_configure_selinux_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_configure_selinux_status: "running"
    fe_rhel_configure_selinux_preflight_passed: false
    fe_rhel_configure_selinux_postflight_passed: false
    fe_rhel_configure_selinux_failed_task: ""
    fe_rhel_configure_selinux_error: ""
    fe_rhel_configure_selinux_stats_published: false
  tags:
    - always

- name: "rhel/configure-selinux | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/configure-selinux | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/configure-selinux: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/configure-selinux: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/configure-selinux | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/configure-selinux: required variable '{{ item }}' is not defined."
        success_msg: "rhel/configure-selinux: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_configure_selinux_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/configure-selinux | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_configure_selinux_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install SELinux packages
      ansible.builtin.package:
        name:
          - libselinux-python3
          - policycoreutils
          - selinux-policy-targeted
        state: present
      tags:
        - selinux

    - name: Configure SELinux to enforcing mode
      ansible.posix.selinux:
        policy: targeted
        state: enforcing
      tags:
        - selinux

    - name: Check SELinux status
      ansible.builtin.command: getenforce
      register: selinux_status
      changed_when: false
      tags:
        - selinux
        - validation

    - name: Display SELinux status
      ansible.builtin.debug:
        msg: "SELinux mode: {{ selinux_status.stdout }}"
      tags:
        - selinux
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/configure-selinux | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_configure_selinux_preflight_passed | bool
          - fe_rhel_configure_selinux_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/configure-selinux: postflight validation failed - preflight passed
          ={{ fe_rhel_configure_selinux_preflight_passed | default(false) }},
          status={{ fe_rhel_configure_selinux_status | default('unknown') }}.
        success_msg: "rhel/configure-selinux: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/configure-selinux | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_configure_selinux_postflight_passed: true
        fe_rhel_configure_selinux_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/configure-selinux | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_configure_selinux_status: "failed"
        fe_rhel_configure_selinux_postflight_passed: false
        fe_rhel_configure_selinux_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_configure_selinux_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/configure-selinux | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/configure-selinux: FAILED at '{{ fe_rhel_configure_selinux_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_configure_selinux_error }}
      tags:
        - always
        - rescue

    - name: "rhel/configure-selinux | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/configure-selinux failed at '{{ fe_rhel_configure_selinux_failed_task }}': {{ fe_rhel_configure_selinux_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/configure-selinux | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_configure_selinux_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_configure_selinux_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_configure_selinux_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/configure-selinux | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/configure-selinux":
              component: "rhel/configure-selinux"
              type: "tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_configure_selinux_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_configure_selinux_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_configure_selinux_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_configure_selinux_started_at | default('') }}"
              ended_at: "{{ fe_rhel_configure_selinux_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_configure_selinux_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_configure_selinux_failed_task | default('') }}"
              error: "{{ fe_rhel_configure_selinux_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_configure_selinux_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_configure_selinux_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_configure_selinux_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_configure_selinux_status | default('') == 'succeeded' else ['rhel/configure-selinux'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/configure-selinux | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_configure_selinux_stats_published: true
      tags:
        - always
