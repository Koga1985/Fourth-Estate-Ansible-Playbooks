---
# Accounts, PAM password quality, faillock, login.defs, session timeout
# RHEL-09-611xxx (pwquality/faillock/pwhistory) | RHEL-09-411xxx/412xxx
# NIST IA-5, AC-7, AC-11, AC-12

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel9_stig/accounts_pam']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel9_stig_accounts_pam_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel9_stig/accounts_pam | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel9_stig_accounts_pam_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel9_stig_accounts_pam_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel9_stig_accounts_pam_status: "running"
    fe_rhel_rhel9_stig_accounts_pam_preflight_passed: false
    fe_rhel_rhel9_stig_accounts_pam_postflight_passed: false
    fe_rhel_rhel9_stig_accounts_pam_failed_task: ""
    fe_rhel_rhel9_stig_accounts_pam_error: ""
    fe_rhel_rhel9_stig_accounts_pam_stats_published: false
  tags:
    - always

- name: "rhel/rhel9_stig/accounts_pam | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel9_stig/accounts_pam | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel9_stig/accounts_pam: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel9_stig/accounts_pam: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/accounts_pam | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel9_stig/accounts_pam: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel9_stig/accounts_pam: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel9_stig_accounts_pam_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/accounts_pam | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_accounts_pam_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: RHEL-09-611xxx - Configure password quality (pwquality.conf)
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
        owner: root
        group: root
        mode: "0644"
        create: true
      loop: "{{ rhel9_pwquality | dict2items }}"
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_pwquality
      tags: [stig_cat2, "RHEL-09-611055", "RHEL-09-611115", "RHEL-09-611160"]

    - name: RHEL-09-611045/611080/611085 - Configure account lockout (faillock.conf)
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
        owner: root
        group: root
        mode: "0644"
        create: true
      loop: "{{ rhel9_faillock | dict2items }}"
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_faillock
      tags: [stig_cat2, "RHEL-09-611045", "RHEL-09-611080", "RHEL-09-611085"]

    - name: RHEL-09-611047 - Ensure faillock entry present (silent option)
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^#?\s*silent'
        line: 'silent'
        create: true
        owner: root
        group: root
        mode: "0644"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_faillock_silent
      tags: [stig_cat2, "RHEL-09-611047"]

    - name: RHEL-09-611038 - Enable faillock via authselect feature
      ansible.builtin.command: authselect enable-feature with-faillock
      register: r_authselect_faillock
      changed_when: "'No existing configuration' not in r_authselect_faillock.stderr and r_authselect_faillock.rc == 0"
      failed_when:
        - r_authselect_faillock.rc != 0
        - "'No existing configuration detected' not in (r_authselect_faillock.stderr | default(''))"
      when: apply_changes | bool
      tags: [stig_cat2, "RHEL-09-611038"]

    - name: RHEL-09-611150 - Configure password history (pwhistory remember)
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^#?\s*remember\s*='
        line: "remember = {{ rhel9_pwhistory_remember }}"
        owner: root
        group: root
        mode: "0644"
        create: true
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_pwhistory
      tags: [stig_cat2, "RHEL-09-611150"]

    - name: RHEL-09-411010/411015 - Configure password aging in login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^#?\s*{{ item.key }}\s'
        line: "{{ item.key }}\t{{ item.value }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { key: "PASS_MAX_DAYS", value: "{{ rhel9_pass_max_days }}" }
        - { key: "PASS_MIN_DAYS", value: "{{ rhel9_pass_min_days }}" }
        - { key: "PASS_WARN_AGE", value: "{{ rhel9_pass_warn_age }}" }
        - { key: "UMASK", value: "{{ rhel9_umask }}" }
      loop_control:
        label: "{{ item.key }} {{ item.value }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_login_defs
      tags: [stig_cat2, "RHEL-09-411010", "RHEL-09-411015", "RHEL-09-411035"]

    - name: RHEL-09-412025 - Set default account inactivity lock (useradd)
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^#?INACTIVE='
        line: "INACTIVE={{ rhel9_account_inactive_days }}"
        owner: root
        group: root
        mode: "0644"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_useradd_inactive
      tags: [stig_cat2, "RHEL-09-412025"]

    - name: RHEL-09-412035 - Enforce interactive session timeout (TMOUT)
      ansible.builtin.copy:
        dest: /etc/profile.d/99-stig-tmout.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by rhel9_stig - RHEL-09-412035 interactive session timeout
          declare -xr TMOUT={{ rhel9_session_tmout }}
          readonly TMOUT
          export TMOUT
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_tmout
      tags: [stig_cat2, "RHEL-09-412035"]

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel9_stig/accounts_pam | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel9_stig_accounts_pam_preflight_passed | bool
          - fe_rhel_rhel9_stig_accounts_pam_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel9_stig/accounts_pam: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel9_stig_accounts_pam_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel9_stig_accounts_pam_status | default('unknown') }}.
        success_msg: "rhel/rhel9_stig/accounts_pam: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel9_stig/accounts_pam | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_accounts_pam_postflight_passed: true
        fe_rhel_rhel9_stig_accounts_pam_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel9_stig/accounts_pam | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_accounts_pam_status: "failed"
        fe_rhel_rhel9_stig_accounts_pam_postflight_passed: false
        fe_rhel_rhel9_stig_accounts_pam_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel9_stig_accounts_pam_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/accounts_pam | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel9_stig/accounts_pam: FAILED at '{{ fe_rhel_rhel9_stig_accounts_pam_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel9_stig_accounts_pam_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/accounts_pam | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel9_stig/accounts_pam failed at '{{ fe_rhel_rhel9_stig_accounts_pam_failed_task }}': {{ fe_rhel_rhel9_stig_accounts_pam_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel9_stig/accounts_pam | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_accounts_pam_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel9_stig_accounts_pam_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel9_stig_accounts_pam_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel9_stig/accounts_pam | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel9_stig/accounts_pam":
              component: "rhel/rhel9_stig/accounts_pam"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel9_stig_accounts_pam_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel9_stig_accounts_pam_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel9_stig_accounts_pam_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel9_stig_accounts_pam_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel9_stig_accounts_pam_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel9_stig_accounts_pam_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel9_stig_accounts_pam_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel9_stig_accounts_pam_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel9_stig_accounts_pam_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel9_stig_accounts_pam_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel9_stig_accounts_pam_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel9_stig_accounts_pam_status | default('') == 'succeeded' else ['rhel/rhel9_stig/accounts_pam'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel9_stig/accounts_pam | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_accounts_pam_stats_published: true
      tags:
        - always
