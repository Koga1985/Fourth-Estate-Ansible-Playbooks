---
# SSH daemon hardening via a STIG drop-in (RHEL 9 uses Include sshd_config.d/*)
# RHEL-09-255030/255035/255040/255045/255065/255090/255100/255105/255110
# NIST AC-12, AC-17, IA-2, SC-23

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel9_stig/sshd']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel9_stig_sshd_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel9_stig/sshd | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel9_stig_sshd_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel9_stig_sshd_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel9_stig_sshd_status: "running"
    fe_rhel_rhel9_stig_sshd_preflight_passed: false
    fe_rhel_rhel9_stig_sshd_postflight_passed: false
    fe_rhel_rhel9_stig_sshd_failed_task: ""
    fe_rhel_rhel9_stig_sshd_error: ""
    fe_rhel_rhel9_stig_sshd_stats_published: false
  tags:
    - always

- name: "rhel/rhel9_stig/sshd | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel9_stig/sshd | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel9_stig/sshd: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel9_stig/sshd: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/sshd | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel9_stig/sshd: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel9_stig/sshd: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel9_stig_sshd_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/sshd | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_sshd_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: RHEL-09-255xxx - Write SSH STIG drop-in configuration
      ansible.builtin.copy:
        dest: "{{ rhel9_sshd_dropin }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by rhel9_stig - DoD RHEL 9 STIG {{ stig_version }}
          Banner {{ rhel9_ssh_banner }}
          PermitRootLogin {{ rhel9_ssh_permit_root_login }}
          ClientAliveInterval {{ rhel9_ssh_client_alive_interval }}
          ClientAliveCountMax {{ rhel9_ssh_client_alive_count_max }}
          X11Forwarding {{ rhel9_ssh_x11_forwarding }}
          PermitEmptyPasswords {{ rhel9_ssh_permit_empty_passwords }}
          PrintLastLog {{ rhel9_ssh_print_last_log }}
          IgnoreRhosts {{ rhel9_ssh_ignore_rhosts }}
          GSSAPIAuthentication {{ rhel9_ssh_gss_api_auth }}
          StrictModes yes
          Compression no
          MaxAuthTries 6
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_sshd_dropin
      notify: restart sshd
      tags:
        - stig_cat2
        - "RHEL-09-255030"
        - "RHEL-09-255035"
        - "RHEL-09-255040"
        - "RHEL-09-255045"
        - "RHEL-09-255065"

    - name: RHEL-09-255120 - Validate sshd configuration syntax
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: apply_changes | bool
      tags: [stig_cat2, "RHEL-09-255120"]

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel9_stig/sshd | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel9_stig_sshd_preflight_passed | bool
          - fe_rhel_rhel9_stig_sshd_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel9_stig/sshd: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel9_stig_sshd_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel9_stig_sshd_status | default('unknown') }}.
        success_msg: "rhel/rhel9_stig/sshd: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel9_stig/sshd | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_sshd_postflight_passed: true
        fe_rhel_rhel9_stig_sshd_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel9_stig/sshd | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_sshd_status: "failed"
        fe_rhel_rhel9_stig_sshd_postflight_passed: false
        fe_rhel_rhel9_stig_sshd_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel9_stig_sshd_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/sshd | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel9_stig/sshd: FAILED at '{{ fe_rhel_rhel9_stig_sshd_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel9_stig_sshd_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/sshd | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel9_stig/sshd failed at '{{ fe_rhel_rhel9_stig_sshd_failed_task }}': {{ fe_rhel_rhel9_stig_sshd_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel9_stig/sshd | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_sshd_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel9_stig_sshd_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel9_stig_sshd_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel9_stig/sshd | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel9_stig/sshd":
              component: "rhel/rhel9_stig/sshd"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel9_stig_sshd_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel9_stig_sshd_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel9_stig_sshd_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel9_stig_sshd_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel9_stig_sshd_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel9_stig_sshd_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel9_stig_sshd_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel9_stig_sshd_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel9_stig_sshd_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel9_stig_sshd_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel9_stig_sshd_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel9_stig_sshd_status | default('') == 'succeeded' else ['rhel/rhel9_stig/sshd'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel9_stig/sshd | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_sshd_stats_published: true
      tags:
        - always
