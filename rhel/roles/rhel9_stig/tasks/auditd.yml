---
# Audit subsystem configuration
# RHEL-09-653010 (auditd present/enabled) | RHEL-09-653025/653080/653085
# NIST AU-2, AU-4, AU-5, AU-9

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel9_stig/auditd']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel9_stig_auditd_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel9_stig/auditd | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel9_stig_auditd_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel9_stig_auditd_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel9_stig_auditd_status: "running"
    fe_rhel_rhel9_stig_auditd_preflight_passed: false
    fe_rhel_rhel9_stig_auditd_postflight_passed: false
    fe_rhel_rhel9_stig_auditd_failed_task: ""
    fe_rhel_rhel9_stig_auditd_error: ""
    fe_rhel_rhel9_stig_auditd_stats_published: false
  tags:
    - always

- name: "rhel/rhel9_stig/auditd | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel9_stig/auditd | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel9_stig/auditd: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel9_stig/auditd: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/auditd | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel9_stig/auditd: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel9_stig/auditd: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel9_stig_auditd_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel9_stig/auditd | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_auditd_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: RHEL-09-653010 - Ensure auditd is enabled and running
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_auditd_service
      when: apply_changes | bool
      tags: [stig_cat2, "RHEL-09-653010"]

    - name: RHEL-09-653025/653080/653085 - Configure auditd.conf disk-handling actions
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
        owner: root
        group: root
        mode: "0640"
      loop:
        - { key: "space_left_action", value: "{{ rhel9_auditd_space_left_action }}" }
        - { key: "disk_full_action", value: "{{ rhel9_auditd_disk_full_action }}" }
        - { key: "max_log_file_action", value: "{{ rhel9_auditd_max_log_file_action }}" }
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_auditd_conf
      notify: restart auditd
      tags: [stig_cat2, "RHEL-09-653025", "RHEL-09-653080", "RHEL-09-653085"]

    - name: RHEL-09-654xxx - Deploy STIG audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/stig.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          ## Managed by rhel9_stig - DoD RHEL 9 STIG {{ stig_version }} audit rules
          ## Privilege escalation / identity (RHEL-09-654xxx)
          -w /etc/sudoers -p wa -k identity
          -w /etc/sudoers.d/ -p wa -k identity
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          ## Login/logout and session
          -w /var/log/lastlog -p wa -k logins
          -w /var/run/faillock -p wa -k logins
          ## Privileged command execution
          -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv
          -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv
          ## Discretionary access control changes
          -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
          -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr -F auid>=1000 -F auid!=unset -k perm_mod
          ## Module loading
          -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -F auid>=1000 -F auid!=unset -k modules
          ## Make the configuration immutable (must be last)
          -e 2
      check_mode: "{{ not (apply_changes | bool) }}"
      register: r_audit_rules
      notify: restart auditd
      tags: [stig_cat2, "RHEL-09-654010"]

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel9_stig/auditd | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel9_stig_auditd_preflight_passed | bool
          - fe_rhel_rhel9_stig_auditd_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel9_stig/auditd: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel9_stig_auditd_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel9_stig_auditd_status | default('unknown') }}.
        success_msg: "rhel/rhel9_stig/auditd: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel9_stig/auditd | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_auditd_postflight_passed: true
        fe_rhel_rhel9_stig_auditd_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel9_stig/auditd | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_auditd_status: "failed"
        fe_rhel_rhel9_stig_auditd_postflight_passed: false
        fe_rhel_rhel9_stig_auditd_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel9_stig_auditd_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/auditd | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel9_stig/auditd: FAILED at '{{ fe_rhel_rhel9_stig_auditd_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel9_stig_auditd_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel9_stig/auditd | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel9_stig/auditd failed at '{{ fe_rhel_rhel9_stig_auditd_failed_task }}': {{ fe_rhel_rhel9_stig_auditd_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel9_stig/auditd | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_auditd_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel9_stig_auditd_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel9_stig_auditd_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel9_stig/auditd | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel9_stig/auditd":
              component: "rhel/rhel9_stig/auditd"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel9_stig_auditd_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel9_stig_auditd_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel9_stig_auditd_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel9_stig_auditd_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel9_stig_auditd_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel9_stig_auditd_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel9_stig_auditd_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel9_stig_auditd_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel9_stig_auditd_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel9_stig_auditd_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel9_stig_auditd_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel9_stig_auditd_status | default('') == 'succeeded' else ['rhel/rhel9_stig/auditd'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel9_stig/auditd | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel9_stig_auditd_stats_published: true
      tags:
        - always
