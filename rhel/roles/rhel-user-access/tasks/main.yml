---
# tasks/main.yml - RHEL User and Access Management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-user-access']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_user_access_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-user-access | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_user_access_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_user_access_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_user_access_status: "running"
    fe_rhel_rhel_user_access_preflight_passed: false
    fe_rhel_rhel_user_access_postflight_passed: false
    fe_rhel_rhel_user_access_failed_task: ""
    fe_rhel_rhel_user_access_error: ""
    fe_rhel_rhel_user_access_stats_published: false
  tags:
    - always

- name: "rhel/rhel-user-access | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-user-access | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-user-access: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-user-access: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-user-access | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-user-access: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-user-access: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_user_access_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-user-access | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_user_access_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display user management information
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "RHEL User and Access Management"
          - "=================================="
          - "Users to manage: {{ rhel_users | length }}"
          - "Sudo groups: {{ rhel_sudo_groups }}"
          - "=================================="
      tags:
        - always

    - name: Create groups
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid | default(omit) }}"
        state: present
      loop: "{{ rhel_groups }}"
      when: rhel_groups | length > 0
      tags:
        - groups

    - name: Create/manage users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | default(omit) }}"
        password: "{{ item.password | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        create_home: true
        home: "{{ item.home | default('/home/' + item.name) }}"
      no_log: true
      loop: "{{ rhel_users }}"
      when: rhel_users | length > 0
      tags:
        - users

    - name: Set home directory permissions
      ansible.builtin.file:
        path: "{{ item.home | default('/home/' + item.name) }}"
        mode: "{{ rhel_home_dir_mode }}"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
      loop: "{{ rhel_users }}"
      when:
        - rhel_users | length > 0
        - item.state | default('present') == 'present'
      tags:
        - permissions

    - name: Configure SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_key }}"
        state: present
      loop: "{{ rhel_users }}"
      when:
        - rhel_manage_ssh_keys | bool
        - rhel_users | length > 0
        - item.ssh_key is defined
        - item.state | default('present') == 'present'
      tags:
        - ssh_keys

    - name: Configure password aging for users
      ansible.builtin.command: >
        chage --maxdays {{ rhel_password_max_days }}
              --mindays {{ rhel_password_min_days }}
              --warndays {{ rhel_password_warn_age }}
              {{ item.name }}
      loop: "{{ rhel_users }}"
      when:
        - rhel_users | length > 0
        - item.state | default('present') == 'present'
      changed_when: false
      tags:
        - users

    - name: Force password change on first login
      ansible.builtin.command: chage -d 0 {{ item.name }}
      loop: "{{ rhel_users }}"
      when:
        - rhel_force_password_change | bool
        - rhel_users | length > 0
        - item.state | default('present') == 'present'
        - item.password is defined
      changed_when: false
      tags:
        - users

    - name: Remove unauthorized users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop: "{{ rhel_remove_users }}"
      when: rhel_remove_users | length > 0
      tags:
        - users

    - name: Find inactive accounts
      ansible.builtin.shell: |
        lastlog -b {{ rhel_inactive_days }} | awk 'NR>1 && !/Never logged in/ {print $1}'
      register: inactive_users
      changed_when: false
      when: rhel_lock_inactive | bool
      tags:
        - validation

    - name: Lock inactive accounts
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop: "{{ inactive_users.stdout_lines | default([]) }}"
      when:
        - rhel_lock_inactive | bool
        - inactive_users.stdout_lines is defined
        - item not in ['root']
      tags:
        - users

    - name: Display user management completion
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "User Management Completed"
          - "=================================="
          - "Users managed: {{ rhel_users | length }}"
          - "Groups created: {{ rhel_groups | length }}"
          - "=================================="
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-user-access | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_user_access_preflight_passed | bool
          - fe_rhel_rhel_user_access_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-user-access: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_user_access_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_user_access_status | default('unknown') }}.
        success_msg: "rhel/rhel-user-access: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-user-access | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_user_access_postflight_passed: true
        fe_rhel_rhel_user_access_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-user-access | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_user_access_status: "failed"
        fe_rhel_rhel_user_access_postflight_passed: false
        fe_rhel_rhel_user_access_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_user_access_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-user-access | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-user-access: FAILED at '{{ fe_rhel_rhel_user_access_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_user_access_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-user-access | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-user-access failed at '{{ fe_rhel_rhel_user_access_failed_task }}': {{ fe_rhel_rhel_user_access_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-user-access | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_user_access_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_user_access_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_user_access_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-user-access | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-user-access":
              component: "rhel/rhel-user-access"
              type: "role"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_user_access_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_user_access_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_user_access_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_user_access_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_user_access_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_user_access_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_user_access_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_user_access_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_user_access_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_user_access_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_user_access_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_user_access_status | default('') == 'succeeded' else ['rhel/rhel-user-access'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-user-access | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_user_access_stats_published: true
      tags:
        - always
