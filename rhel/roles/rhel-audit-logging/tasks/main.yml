---
# tasks/main.yml - RHEL Audit and Logging Configuration
# DoD STIG V-204494 through V-204644

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-audit-logging']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_audit_logging_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-audit-logging | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_audit_logging_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_audit_logging_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_audit_logging_status: "running"
    fe_rhel_rhel_audit_logging_preflight_passed: false
    fe_rhel_rhel_audit_logging_postflight_passed: false
    fe_rhel_rhel_audit_logging_failed_task: ""
    fe_rhel_rhel_audit_logging_error: ""
    fe_rhel_rhel_audit_logging_stats_published: false
  tags:
    - always

- name: "rhel/rhel-audit-logging | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-audit-logging | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-audit-logging: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-audit-logging: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-audit-logging | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-audit-logging: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-audit-logging: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_audit_logging_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-audit-logging | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_audit_logging_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display audit and logging information
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "RHEL Audit and Logging Config"
          - "=================================="
          - "Audit enabled: {{ rhel_audit_enabled }}"
          - "Log retention: {{ rhel_audit_log_retention_days }} days"
          - "Remote logging: {{ rhel_remote_logging_enabled }}"
          - "=================================="
      tags:
        - always

    # Auditd Configuration
    - name: Install audit packages
      ansible.builtin.package:
        name:
          - audit
          - audispd-plugins
        state: present
      tags:
        - packages

    - name: Configure auditd
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
        state: present
      loop:
        - { key: 'max_log_file', value: "{{ rhel_audit_max_log_file }}" }
        - { key: 'num_logs', value: "{{ rhel_audit_num_logs }}" }
        - { key: 'max_log_file_action', value: "{{ rhel_audit_max_log_file_action }}" }
        - { key: 'space_left', value: "{{ rhel_audit_space_left }}" }
        - { key: 'space_left_action', value: "{{ rhel_audit_space_left_action }}" }
        - { key: 'action_mail_acct', value: "{{ rhel_audit_action_mail_acct }}" }
        - { key: 'disk_full_action', value: "{{ rhel_audit_disk_full_action }}" }
        - { key: 'disk_error_action', value: "{{ rhel_audit_disk_error_action }}" }
        - { key: 'flush', value: "{{ rhel_audit_flush }}" }
      notify: restart auditd
      tags:
        - auditd

    - name: Configure STIG-compliant audit rules
      ansible.builtin.template:
        src: audit-rules.j2
        dest: /etc/audit/rules.d/stig.rules
        owner: root
        group: root
        mode: '0640'
      when: rhel_configure_audit_rules | bool
      notify: restart auditd
      tags:
        - auditd

    - name: Add custom audit rules
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/custom.rules
        line: "{{ item }}"
        create: true
        owner: root
        group: root
        mode: '0640'
      loop: "{{ rhel_custom_audit_rules }}"
      when: rhel_custom_audit_rules | length > 0
      notify: restart auditd
      tags:
        - auditd

    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
      when: rhel_audit_enabled | bool
      tags:
        - services

    # Rsyslog Configuration
    - name: Install rsyslog
      ansible.builtin.package:
        name: rsyslog
        state: present
      tags:
        - packages

    - name: Configure rsyslog
      ansible.builtin.template:
        src: rsyslog.conf.j2
        dest: /etc/rsyslog.d/99-rhel-hardening.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart rsyslog
      tags:
        - rsyslog

    - name: Configure remote logging
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.d/remote.conf
        line: "*.* @@{{ rhel_remote_log_server }}:{{ rhel_remote_log_port }}"
        create: true
        owner: root
        group: root
        mode: '0644'
      when: rhel_remote_logging_enabled | bool
      notify: restart rsyslog
      tags:
        - rsyslog

    - name: Enable and start rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started
      when: rhel_rsyslog_enabled | bool
      tags:
        - services

    - name: Set log file permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "{{ rhel_log_file_permissions }}"
        owner: root
        group: root
      loop:
        - /var/log/messages
        - /var/log/secure
        - /var/log/maillog
        - /var/log/cron
      failed_when: false
      tags:
        - permissions

    # AIDE Configuration
    - name: Install AIDE
      ansible.builtin.package:
        name: aide
        state: present
      when: rhel_configure_aide | bool
      tags:
        - packages

    - name: Check if AIDE database exists
      ansible.builtin.stat:
        path: "{{ rhel_aide_db_path }}"
      register: aide_db
      when: rhel_configure_aide | bool
      tags:
        - aide

    - name: Configure AIDE check schedule
      ansible.builtin.cron:
        name: "AIDE integrity check"
        job: "/usr/sbin/aide --check | /usr/bin/mail -s 'AIDE Integrity Check' root"
        special_time: "{{ rhel_aide_check_schedule }}"
        user: root
        state: present
      when: rhel_configure_aide | bool
      tags:
        - aide

    - name: Display audit status
      ansible.builtin.command: auditctl -s
      register: audit_status
      changed_when: false
      tags:
        - validation

    - name: Display logging completion
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "Audit and Logging Configured"
          - "=================================="
          - "Auditd status: {{ 'Active' if rhel_audit_enabled else 'Disabled' }}"
          - "Remote logging: {{ 'Enabled' if rhel_remote_logging_enabled else 'Disabled' }}"
          - "AIDE configured: {{ 'Yes' if rhel_configure_aide else 'No' }}"
          - "=================================="
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-audit-logging | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_audit_logging_preflight_passed | bool
          - fe_rhel_rhel_audit_logging_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-audit-logging: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_audit_logging_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_audit_logging_status | default('unknown') }}.
        success_msg: "rhel/rhel-audit-logging: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-audit-logging | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_audit_logging_postflight_passed: true
        fe_rhel_rhel_audit_logging_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-audit-logging | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_audit_logging_status: "failed"
        fe_rhel_rhel_audit_logging_postflight_passed: false
        fe_rhel_rhel_audit_logging_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_audit_logging_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-audit-logging | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-audit-logging: FAILED at '{{ fe_rhel_rhel_audit_logging_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_audit_logging_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-audit-logging | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-audit-logging failed at '{{ fe_rhel_rhel_audit_logging_failed_task }}': {{ fe_rhel_rhel_audit_logging_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-audit-logging | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_audit_logging_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_audit_logging_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_audit_logging_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-audit-logging | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-audit-logging":
              component: "rhel/rhel-audit-logging"
              type: "role"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_audit_logging_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_audit_logging_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_audit_logging_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_audit_logging_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_audit_logging_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_audit_logging_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_audit_logging_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_audit_logging_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_audit_logging_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_audit_logging_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_audit_logging_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_audit_logging_status | default('') == 'succeeded' else ['rhel/rhel-audit-logging'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-audit-logging | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_audit_logging_stats_published: true
      tags:
        - always
