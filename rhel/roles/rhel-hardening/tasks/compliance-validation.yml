---
# tasks/compliance-validation.yml - Compliance Validation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/compliance-validation']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_compliance_validation_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/compliance-validation | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_compliance_validation_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_compliance_validation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_compliance_validation_status: "running"
    fe_rhel_rhel_hardening_compliance_validation_preflight_passed: false
    fe_rhel_rhel_hardening_compliance_validation_postflight_passed: false
    fe_rhel_rhel_hardening_compliance_validation_failed_task: ""
    fe_rhel_rhel_hardening_compliance_validation_error: ""
    fe_rhel_rhel_hardening_compliance_validation_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/compliance-validation | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/compliance-validation | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/compliance-validation: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/compliance-validation: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/compliance-validation | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/compliance-validation: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/compliance-validation: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_compliance_validation_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/compliance-validation | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_compliance_validation_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if OpenSCAP is installed
      ansible.builtin.package_facts:
        manager: auto
      tags:
        - validation

    - name: Validation prerequisites check
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Compliance Validation"
          - "========================================="
          - "STIG Level: {{ rhel_stig_level }}"
          - "NIST Controls: {{ rhel_apply_nist_controls }}"
          - "CIS Benchmark: {{ rhel_apply_cis_benchmark }}"
          - "========================================="
      tags:
        - validation

    - name: Check SSH configuration compliance
      ansible.builtin.command: sshd -t
      register: ssh_compliance
      changed_when: false
      failed_when: false
      tags:
        - validation

    - name: Check password policy compliance
      ansible.builtin.command: pwscore
      register: password_compliance
      changed_when: false
      failed_when: false
      tags:
        - validation

    - name: Check firewall status
      ansible.builtin.command: firewall-cmd --state
      register: firewall_status
      changed_when: false
      failed_when: false
      tags:
        - validation

    - name: Check SELinux status
      ansible.builtin.command: getenforce
      register: selinux_status
      changed_when: false
      failed_when: false
      tags:
        - validation

    - name: Check audit service status
      ansible.builtin.systemd:
        name: auditd
      register: audit_status
      tags:
        - validation

    - name: Generate compliance summary
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Compliance Validation Summary"
          - "========================================="
          - "SSH Configuration: {{ 'PASS' if ssh_compliance.rc == 0 else 'FAIL' }}"
          - "Firewall Status: {{ firewall_status.stdout if firewall_status.rc == 0 else 'Not running' }}"
          - "SELinux Status: {{ selinux_status.stdout }}"
          - "Audit Service: {{ 'Running' if audit_status.status.ActiveState == 'active' else 'Not running' }}"
          - "========================================="
          - "Review the output above for compliance status"
          - "For detailed SCAP assessment, run:"
          - "  oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_stig \\"
          - "    /usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
          - "========================================="
      tags:
        - validation
        - report

    - name: Check for compliance violations
      ansible.builtin.assert:
        that:
          - ssh_compliance.rc == 0
          - firewall_status.rc == 0
          - selinux_status.stdout in ['Enforcing', 'Permissive']
          - audit_status.status.ActiveState == 'active'
        fail_msg: "Compliance violations detected. Review the validation summary above."
        success_msg: "Basic compliance checks passed."
      when: rhel_fail_on_compliance_violations | bool
      tags:
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/compliance-validation | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_compliance_validation_preflight_passed | bool
          - fe_rhel_rhel_hardening_compliance_validation_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/compliance-validation: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_compliance_validation_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_compliance_validation_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/compliance-validation: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/compliance-validation | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_compliance_validation_postflight_passed: true
        fe_rhel_rhel_hardening_compliance_validation_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/compliance-validation | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_compliance_validation_status: "failed"
        fe_rhel_rhel_hardening_compliance_validation_postflight_passed: false
        fe_rhel_rhel_hardening_compliance_validation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_compliance_validation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/compliance-validation | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/compliance-validation: FAILED at '{{ fe_rhel_rhel_hardening_compliance_validation_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_compliance_validation_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/compliance-validation | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/compliance-validation failed at '{{ fe_rhel_rhel_hardening_compliance_validation_failed_task }}': {{ fe_rhel_rhel_hardening_compliance_validation_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/compliance-validation | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_compliance_validation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_compliance_validation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_compliance_validation_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/compliance-validation | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/compliance-validation":
              component: "rhel/rhel-hardening/compliance-validation"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_compliance_validation_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_compliance_validation_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_compliance_validation_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_compliance_validation_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_compliance_validation_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_compliance_validation_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_compliance_validation_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_compliance_validation_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_compliance_validation_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_compliance_validation_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_compliance_validation_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_compliance_validation_status | default('') == 'succeeded' else ['rhel/rhel-hardening/compliance-validation'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/compliance-validation | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_compliance_validation_stats_published: true
      tags:
        - always
