---
# tasks/password-policy.yml - Password Policy Configuration
# DoD STIG V-204405 through V-204418

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/password-policy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_password_policy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/password-policy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_password_policy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_password_policy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_password_policy_status: "running"
    fe_rhel_rhel_hardening_password_policy_preflight_passed: false
    fe_rhel_rhel_hardening_password_policy_postflight_passed: false
    fe_rhel_rhel_hardening_password_policy_failed_task: ""
    fe_rhel_rhel_hardening_password_policy_error: ""
    fe_rhel_rhel_hardening_password_policy_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/password-policy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/password-policy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/password-policy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/password-policy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/password-policy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/password-policy: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/password-policy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_password_policy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/password-policy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_password_policy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install pwquality package
      ansible.builtin.package:
        name:
          - libpwquality
          - pam
        state: present
      tags:
        - packages

    - name: Configure password quality requirements
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "^#?{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
        state: present
      loop:
        - { key: 'minlen', value: "{{ rhel_password_min_length }}" }
        - { key: 'dcredit', value: "-{{ rhel_password_min_digit }}" }
        - { key: 'ucredit', value: "-{{ rhel_password_min_upper }}" }
        - { key: 'lcredit', value: "-{{ rhel_password_min_lower }}" }
        - { key: 'ocredit', value: "-{{ rhel_password_min_special }}" }
        - { key: 'difok', value: "{{ rhel_password_min_diff }}" }
        - { key: 'maxrepeat', value: "{{ rhel_password_max_repeating }}" }
        - { key: 'maxsequence', value: "{{ rhel_password_max_consecutive }}" }
      tags:
        - pwquality

    - name: Configure password aging in login.defs (STIG V-204414, V-204415, V-204416)
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^{{ item.key }}"
        line: "{{ item.key }}\t{{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: "{{ rhel_password_max_days }}" }
        - { key: 'PASS_MIN_DAYS', value: "{{ rhel_password_min_days }}" }
        - { key: 'PASS_WARN_AGE', value: "{{ rhel_password_warn_age }}" }
      tags:
        - login_defs

    - name: Configure account inactive period (STIG V-204417)
      ansible.builtin.command: useradd -D -f {{ rhel_account_inactive_days }}
      changed_when: false
      tags:
        - useradd

    - name: Configure password hashing algorithm (STIG V-204418)
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^ENCRYPT_METHOD'
        line: "ENCRYPT_METHOD\t{{ rhel_password_hash_algorithm | upper }}"
        state: present
      tags:
        - login_defs

    - name: Configure password history in PAM (STIG V-204413)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: '^password\s+sufficient\s+pam_unix.so'
        line: "password    sufficient    pam_unix.so {{ rhel_password_hash_algorithm }} shadow nullok try_first_pass use_authtok remember={{ rhel_password_remember }}"
        state: present
      tags:
        - pam

    - name: Apply password aging to existing users
      ansible.builtin.command: chage --maxdays {{ rhel_password_max_days }} --mindays {{ rhel_password_min_days }} --warndays {{ rhel_password_warn_age }} {{ item }}
      loop: "{{ ansible_facts.getent_passwd.keys() | list }}"
      when:
        - item not in ['root', 'halt', 'sync', 'shutdown']
        - ansible_facts.getent_passwd[item][1] | int >= 1000
      changed_when: false
      failed_when: false
      tags:
        - users
        - never

    - name: Validate password policy configuration
      ansible.builtin.command: pwscore
      register: pwscore_test
      changed_when: false
      failed_when: false
      tags:
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/password-policy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_password_policy_preflight_passed | bool
          - fe_rhel_rhel_hardening_password_policy_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/password-policy: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_password_policy_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_password_policy_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/password-policy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/password-policy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_password_policy_postflight_passed: true
        fe_rhel_rhel_hardening_password_policy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/password-policy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_password_policy_status: "failed"
        fe_rhel_rhel_hardening_password_policy_postflight_passed: false
        fe_rhel_rhel_hardening_password_policy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_password_policy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/password-policy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/password-policy: FAILED at '{{ fe_rhel_rhel_hardening_password_policy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_password_policy_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/password-policy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/password-policy failed at '{{ fe_rhel_rhel_hardening_password_policy_failed_task }}': {{ fe_rhel_rhel_hardening_password_policy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/password-policy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_password_policy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_password_policy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_password_policy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/password-policy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/password-policy":
              component: "rhel/rhel-hardening/password-policy"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_password_policy_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_password_policy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_password_policy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_password_policy_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_password_policy_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_password_policy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_password_policy_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_password_policy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_password_policy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_password_policy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_password_policy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_password_policy_status | default('') == 'succeeded' else ['rhel/rhel-hardening/password-policy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/password-policy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_password_policy_stats_published: true
      tags:
        - always
