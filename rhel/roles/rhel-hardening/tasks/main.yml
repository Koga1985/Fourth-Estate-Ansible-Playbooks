---
# tasks/main.yml - RHEL System Hardening
# DoD STIG and NIST SP 800-53 Compliant

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_status: "running"
    fe_rhel_rhel_hardening_preflight_passed: false
    fe_rhel_rhel_hardening_postflight_passed: false
    fe_rhel_rhel_hardening_failed_task: ""
    fe_rhel_rhel_hardening_error: ""
    fe_rhel_rhel_hardening_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display hardening information
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "RHEL System Hardening"
          - "=================================="
          - "STIG Level: {{ rhel_stig_level }}"
          - "NIST Controls: {{ rhel_apply_nist_controls }}"
          - "CIS Benchmark: {{ rhel_apply_cis_benchmark }}"
          - "FIPS Mode: {{ rhel_enable_fips }}"
          - "=================================="
      tags:
        - always

    - name: Include pre-flight checks
      ansible.builtin.include_tasks: preflight.yml
      when: rhel_run_preflight_checks | bool
      tags:
        - preflight
        - always

    - name: Include FIPS configuration
      ansible.builtin.include_tasks: fips.yml
      when: rhel_enable_fips | bool or rhel_check_fips_status | bool
      tags:
        - fips
        - hardening
        - stig

    - name: Include SSH hardening
      ansible.builtin.include_tasks: ssh.yml
      tags:
        - ssh
        - hardening
        - stig
        - nist

    - name: Include password policy configuration
      ansible.builtin.include_tasks: password-policy.yml
      tags:
        - passwords
        - accounts
        - hardening
        - stig
        - nist

    - name: Include account security configuration
      ansible.builtin.include_tasks: account-security.yml
      tags:
        - accounts
        - security
        - hardening
        - stig

    - name: Include PAM configuration
      ansible.builtin.include_tasks: pam.yml
      tags:
        - pam
        - authentication
        - hardening
        - stig

    - name: Include file system hardening
      ansible.builtin.include_tasks: filesystem.yml
      tags:
        - filesystem
        - hardening
        - stig

    - name: Include network hardening
      ansible.builtin.include_tasks: network.yml
      tags:
        - network
        - hardening
        - stig
        - nist

    - name: Include service hardening
      ansible.builtin.include_tasks: services.yml
      tags:
        - services
        - hardening
        - stig

    - name: Include kernel hardening
      ansible.builtin.include_tasks: kernel.yml
      tags:
        - kernel
        - hardening
        - stig

    - name: Include sudo configuration
      ansible.builtin.include_tasks: sudo.yml
      tags:
        - sudo
        - hardening
        - stig

    - name: Include login banner configuration
      ansible.builtin.include_tasks: banner.yml
      tags:
        - banner
        - hardening
        - stig

    - name: Include time synchronization configuration
      ansible.builtin.include_tasks: time-sync.yml
      tags:
        - time
        - ntp
        - hardening
        - stig

    - name: Include security packages installation
      ansible.builtin.include_tasks: security-packages.yml
      when: rhel_install_security_packages | bool
      tags:
        - packages
        - security
        - hardening

    - name: Include AIDE configuration
      ansible.builtin.include_tasks: aide.yml
      when: rhel_configure_aide | bool
      tags:
        - aide
        - integrity
        - hardening
        - stig

    - name: Include crypto policy configuration
      ansible.builtin.include_tasks: crypto-policy.yml
      tags:
        - crypto
        - hardening
        - stig

    - name: Display hardening completion message
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "RHEL Hardening Completed"
          - "=================================="
          - "System has been hardened according to:"
          - "  - DoD STIG {{ rhel_stig_level }} level"
          - "  - NIST SP 800-53 Rev 5"
          - "  - CIS Benchmark controls"
          - ""
          - "IMPORTANT: Review changes and reboot if required"
          - "=================================="
      tags:
        - always

    - name: Include compliance validation
      ansible.builtin.include_tasks: compliance-validation.yml
      when: rhel_run_compliance_validation | bool
      tags:
        - validation
        - compliance
        - never

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_preflight_passed | bool
          - fe_rhel_rhel_hardening_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_postflight_passed: true
        fe_rhel_rhel_hardening_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_status: "failed"
        fe_rhel_rhel_hardening_postflight_passed: false
        fe_rhel_rhel_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening: FAILED at '{{ fe_rhel_rhel_hardening_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening failed at '{{ fe_rhel_rhel_hardening_failed_task }}': {{ fe_rhel_rhel_hardening_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening":
              component: "rhel/rhel-hardening"
              type: "role"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_status | default('') == 'succeeded' else ['rhel/rhel-hardening'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_stats_published: true
      tags:
        - always
