---
# tasks/services.yml - Service Hardening
# DoD STIG V-204494 through V-204510

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/services']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_services_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/services | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_services_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_services_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_services_status: "running"
    fe_rhel_rhel_hardening_services_preflight_passed: false
    fe_rhel_rhel_hardening_services_postflight_passed: false
    fe_rhel_rhel_hardening_services_failed_task: ""
    fe_rhel_rhel_hardening_services_error: ""
    fe_rhel_rhel_hardening_services_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/services | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/services | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/services: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/services: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/services | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/services: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/services: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_services_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/services | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_services_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Disable unnecessary services (STIG V-204494)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ rhel_services_to_disable }}"
      when: rhel_disable_unnecessary_services | bool
      failed_when: false
      tags:
        - services

    - name: Enable required services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ rhel_services_to_enable }}"
      tags:
        - services

    - name: Remove telnet client (STIG V-204497)
      ansible.builtin.package:
        name: telnet
        state: absent
      when: rhel_remove_telnet_client | bool
      tags:
        - packages

    - name: Remove rsh-client (STIG V-204498)
      ansible.builtin.package:
        name: rsh
        state: absent
      when: rhel_remove_rsh_client | bool
      tags:
        - packages

    - name: Remove ypbind (STIG V-204499)
      ansible.builtin.package:
        name: ypbind
        state: absent
      when: rhel_remove_ypbind | bool
      tags:
        - packages

    - name: Remove X11 packages (STIG V-204495)
      ansible.builtin.package:
        name: "{{ rhel_x11_packages }}"
        state: absent
      when: rhel_remove_x11_packages | bool
      tags:
        - packages

    - name: Remove additional packages
      ansible.builtin.package:
        name: "{{ rhel_packages_to_remove }}"
        state: absent
      when: rhel_packages_to_remove | length > 0
      tags:
        - packages

    - name: List all running services
      ansible.builtin.command: systemctl list-units --type=service --state=running
      register: running_services
      changed_when: false
      tags:
        - validation
        - never

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/services | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_services_preflight_passed | bool
          - fe_rhel_rhel_hardening_services_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/services: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_services_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_services_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/services: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/services | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_services_postflight_passed: true
        fe_rhel_rhel_hardening_services_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/services | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_services_status: "failed"
        fe_rhel_rhel_hardening_services_postflight_passed: false
        fe_rhel_rhel_hardening_services_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_services_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/services | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/services: FAILED at '{{ fe_rhel_rhel_hardening_services_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_services_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/services | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/services failed at '{{ fe_rhel_rhel_hardening_services_failed_task }}': {{ fe_rhel_rhel_hardening_services_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/services | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_services_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_services_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_services_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/services | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/services":
              component: "rhel/rhel-hardening/services"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_services_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_services_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_services_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_services_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_services_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_services_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_services_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_services_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_services_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_services_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_services_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_services_status | default('') == 'succeeded' else ['rhel/rhel-hardening/services'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/services | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_services_stats_published: true
      tags:
        - always
