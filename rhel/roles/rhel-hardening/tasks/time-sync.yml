---
# tasks/time-sync.yml - Time Synchronization Configuration
# DoD STIG V-204541 through V-204545

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/time-sync']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_time_sync_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/time-sync | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_time_sync_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_time_sync_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_time_sync_status: "running"
    fe_rhel_rhel_hardening_time_sync_preflight_passed: false
    fe_rhel_rhel_hardening_time_sync_postflight_passed: false
    fe_rhel_rhel_hardening_time_sync_failed_task: ""
    fe_rhel_rhel_hardening_time_sync_error: ""
    fe_rhel_rhel_hardening_time_sync_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/time-sync | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/time-sync | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/time-sync: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/time-sync: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/time-sync | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/time-sync: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/time-sync: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_time_sync_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/time-sync | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_time_sync_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install chrony (STIG V-204542)
      ansible.builtin.package:
        name: chrony
        state: present
      when: rhel_time_sync_service == 'chronyd'
      tags:
        - packages

    - name: Remove ntpd if using chronyd
      ansible.builtin.package:
        name: ntp
        state: absent
      when: rhel_time_sync_service == 'chronyd'
      tags:
        - packages

    - name: Configure chrony NTP servers (STIG V-204543)
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
      when: rhel_time_sync_service == 'chronyd'
      notify: restart chronyd
      tags:
        - chrony

    - name: Ensure chronyd is enabled and started (STIG V-204541)
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started
      when: rhel_time_sync_enabled | bool and rhel_time_sync_service == 'chronyd'
      tags:
        - services

    - name: Verify time synchronization status
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false
      failed_when: false
      when: rhel_time_sync_service == 'chronyd'
      tags:
        - validation

    - name: Display time synchronization status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines }}"
      when:
        - rhel_time_sync_service == 'chronyd'
        - chrony_status.stdout_lines is defined
      tags:
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/time-sync | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_time_sync_preflight_passed | bool
          - fe_rhel_rhel_hardening_time_sync_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/time-sync: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_time_sync_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_time_sync_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/time-sync: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/time-sync | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_time_sync_postflight_passed: true
        fe_rhel_rhel_hardening_time_sync_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/time-sync | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_time_sync_status: "failed"
        fe_rhel_rhel_hardening_time_sync_postflight_passed: false
        fe_rhel_rhel_hardening_time_sync_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_time_sync_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/time-sync | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/time-sync: FAILED at '{{ fe_rhel_rhel_hardening_time_sync_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_time_sync_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/time-sync | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/time-sync failed at '{{ fe_rhel_rhel_hardening_time_sync_failed_task }}': {{ fe_rhel_rhel_hardening_time_sync_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/time-sync | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_time_sync_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_time_sync_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_time_sync_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/time-sync | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/time-sync":
              component: "rhel/rhel-hardening/time-sync"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_time_sync_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_time_sync_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_time_sync_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_time_sync_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_time_sync_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_time_sync_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_time_sync_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_time_sync_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_time_sync_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_time_sync_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_time_sync_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_time_sync_status | default('') == 'succeeded' else ['rhel/rhel-hardening/time-sync'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/time-sync | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_time_sync_stats_published: true
      tags:
        - always
