---
# tasks/network.yml - Network Stack Hardening
# DoD STIG V-204480 through V-204493

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/network']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_network_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/network | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_network_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_network_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_network_status: "running"
    fe_rhel_rhel_hardening_network_preflight_passed: false
    fe_rhel_rhel_hardening_network_postflight_passed: false
    fe_rhel_rhel_hardening_network_failed_task: ""
    fe_rhel_rhel_hardening_network_error: ""
    fe_rhel_rhel_hardening_network_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/network | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/network | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/network: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/network: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/network | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/network: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/network: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_network_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/network | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_network_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure kernel network parameters (STIG V-204480 through V-204493)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-rhel-hardening.conf
      loop:
        - { name: 'net.ipv4.ip_forward', value: "{{ rhel_network_ip_forward }}" }
        - { name: 'net.ipv4.conf.all.send_redirects', value: "{{ rhel_network_send_redirects }}" }
        - { name: 'net.ipv4.conf.default.send_redirects', value: "{{ rhel_network_send_redirects }}" }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: "{{ rhel_network_accept_source_route }}" }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: "{{ rhel_network_accept_source_route }}" }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: "{{ rhel_network_accept_redirects }}" }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: "{{ rhel_network_accept_redirects }}" }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: "{{ rhel_network_secure_redirects }}" }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: "{{ rhel_network_secure_redirects }}" }
        - { name: 'net.ipv4.conf.all.log_martians', value: "{{ rhel_network_log_martians }}" }
        - { name: 'net.ipv4.conf.default.log_martians', value: "{{ rhel_network_log_martians }}" }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: "{{ rhel_network_ignore_icmp_broadcast }}" }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: "{{ rhel_network_ignore_bogus_icmp }}" }
        - { name: 'net.ipv4.conf.all.rp_filter', value: "{{ rhel_network_rp_filter }}" }
        - { name: 'net.ipv4.conf.default.rp_filter', value: "{{ rhel_network_rp_filter }}" }
        - { name: 'net.ipv4.tcp_syncookies', value: "{{ rhel_network_tcp_syncookies }}" }
        - { name: 'net.ipv6.conf.all.accept_ra', value: "{{ rhel_network_ipv6_accept_ra }}" }
        - { name: 'net.ipv6.conf.default.accept_ra', value: "{{ rhel_network_ipv6_accept_ra }}" }
        - { name: 'net.ipv6.conf.all.accept_redirects', value: "{{ rhel_network_ipv6_accept_redirects }}" }
        - { name: 'net.ipv6.conf.default.accept_redirects', value: "{{ rhel_network_ipv6_accept_redirects }}" }
      tags:
        - sysctl
        - network

    - name: Disable IPv6 if not used (STIG V-204492)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: '1'
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-rhel-hardening.conf
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
      when: rhel_disable_ipv6 | bool
      tags:
        - sysctl
        - network

    - name: Verify network settings
      ansible.builtin.command: sysctl -a
      register: sysctl_output
      changed_when: false
      failed_when: false
      tags:
        - validation
        - never

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/network | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_network_preflight_passed | bool
          - fe_rhel_rhel_hardening_network_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/network: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_network_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_network_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/network: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/network | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_network_postflight_passed: true
        fe_rhel_rhel_hardening_network_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/network | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_network_status: "failed"
        fe_rhel_rhel_hardening_network_postflight_passed: false
        fe_rhel_rhel_hardening_network_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_network_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/network | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/network: FAILED at '{{ fe_rhel_rhel_hardening_network_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_network_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/network | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/network failed at '{{ fe_rhel_rhel_hardening_network_failed_task }}': {{ fe_rhel_rhel_hardening_network_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/network | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_network_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_network_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_network_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/network | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/network":
              component: "rhel/rhel-hardening/network"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_network_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_network_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_network_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_network_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_network_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_network_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_network_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_network_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_network_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_network_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_network_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_network_status | default('') == 'succeeded' else ['rhel/rhel-hardening/network'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/network | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_network_stats_published: true
      tags:
        - always
