---
# tasks/pam.yml - PAM Configuration
# DoD STIG V-204431 through V-204445

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/pam']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_pam_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/pam | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_pam_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_pam_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_pam_status: "running"
    fe_rhel_rhel_hardening_pam_preflight_passed: false
    fe_rhel_rhel_hardening_pam_postflight_passed: false
    fe_rhel_rhel_hardening_pam_failed_task: ""
    fe_rhel_rhel_hardening_pam_error: ""
    fe_rhel_rhel_hardening_pam_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/pam | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/pam | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/pam: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/pam: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/pam | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/pam: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/pam: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_pam_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/pam | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_pam_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set PAM configuration files ownership (STIG V-204431)
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ rhel_pam_files_owner }}"
        group: "{{ rhel_pam_files_group }}"
        mode: "{{ rhel_pam_files_permissions }}"
      loop:
        - /etc/pam.d/system-auth
        - /etc/pam.d/password-auth
        - /etc/pam.d/login
        - /etc/pam.d/sshd
        - /etc/pam.d/su
        - /etc/pam.d/sudo
      tags:
        - permissions

    - name: Configure session timeout (STIG V-204436, V-204437)
      ansible.builtin.blockinfile:
        path: /etc/profile.d/tmout.sh
        create: true
        owner: root
        group: root
        mode: '0644'
        block: |
          # Session timeout configuration - STIG V-204437
          TMOUT={{ rhel_tmout }}
          {% if rhel_tmout_readonly %}
          readonly TMOUT
          {% endif %}
          export TMOUT
      when: rhel_configure_tmout_profile | bool
      tags:
        - session

    - name: Disable Ctrl-Alt-Del (STIG V-204440)
      ansible.builtin.systemd:
        name: ctrl-alt-del.target
        masked: true
      when: rhel_disable_ctrl_alt_del | bool
      tags:
        - systemd

    - name: Disable USB storage (STIG V-204443)
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/usb-storage.conf
        line: 'install usb-storage /bin/true'
        create: true
        owner: root
        group: root
        mode: '0644'
      when: rhel_disable_usb_storage | bool
      tags:
        - kernel_modules

    - name: Disable automounting (STIG V-204444)
      ansible.builtin.systemd:
        name: autofs
        enabled: false
        state: stopped
      when: rhel_disable_automount | bool
      failed_when: false
      tags:
        - services

    - name: Disable Bluetooth (STIG V-204445)
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/bluetooth.conf
        line: 'install bluetooth /bin/true'
        create: true
        owner: root
        group: root
        mode: '0644'
      when: rhel_disable_bluetooth | bool
      tags:
        - kernel_modules

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/pam | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_pam_preflight_passed | bool
          - fe_rhel_rhel_hardening_pam_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/pam: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_pam_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_pam_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/pam: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/pam | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_pam_postflight_passed: true
        fe_rhel_rhel_hardening_pam_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/pam | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_pam_status: "failed"
        fe_rhel_rhel_hardening_pam_postflight_passed: false
        fe_rhel_rhel_hardening_pam_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_pam_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/pam | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/pam: FAILED at '{{ fe_rhel_rhel_hardening_pam_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_pam_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/pam | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/pam failed at '{{ fe_rhel_rhel_hardening_pam_failed_task }}': {{ fe_rhel_rhel_hardening_pam_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/pam | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_pam_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_pam_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_pam_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/pam | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/pam":
              component: "rhel/rhel-hardening/pam"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_pam_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_pam_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_pam_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_pam_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_pam_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_pam_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_pam_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_pam_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_pam_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_pam_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_pam_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_pam_status | default('') == 'succeeded' else ['rhel/rhel-hardening/pam'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/pam | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_pam_stats_published: true
      tags:
        - always
