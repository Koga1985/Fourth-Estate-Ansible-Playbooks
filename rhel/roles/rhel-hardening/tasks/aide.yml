---
# tasks/aide.yml - AIDE Configuration
# DoD STIG V-204447

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['rhel/rhel-hardening/aide']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_rhel_rhel_hardening_aide_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "rhel/rhel-hardening/aide | Initialize validation state"
  ansible.builtin.set_fact:
    fe_rhel_rhel_hardening_aide_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_rhel_rhel_hardening_aide_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_rhel_rhel_hardening_aide_status: "running"
    fe_rhel_rhel_hardening_aide_preflight_passed: false
    fe_rhel_rhel_hardening_aide_postflight_passed: false
    fe_rhel_rhel_hardening_aide_failed_task: ""
    fe_rhel_rhel_hardening_aide_error: ""
    fe_rhel_rhel_hardening_aide_stats_published: false
  tags:
    - always

- name: "rhel/rhel-hardening/aide | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "rhel/rhel-hardening/aide | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          rhel/rhel-hardening/aide: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          rhel/rhel-hardening/aide: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/aide | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "rhel/rhel-hardening/aide: required variable '{{ item }}' is not defined."
        success_msg: "rhel/rhel-hardening/aide: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_rhel_rhel_hardening_aide_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "rhel/rhel-hardening/aide | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_aide_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure AIDE is installed
      ansible.builtin.package:
        name: aide
        state: present
      tags:
        - packages

    - name: Check if AIDE database exists
      ansible.builtin.stat:
        path: "{{ rhel_aide_db_path }}"
      register: aide_db
      tags:
        - validation

    - name: Initialize AIDE database
      ansible.builtin.command: aide --init
      when: not aide_db.stat.exists
      async: 3600
      poll: 30
      register: aide_init
      tags:
        - aide
        - never

    - name: Move AIDE database to correct location
      ansible.builtin.command: mv /var/lib/aide/aide.db.new.gz {{ rhel_aide_db_path }}
      when:
        - not aide_db.stat.exists
        - aide_init is defined
        - aide_init.finished is defined
      tags:
        - aide
        - never

    - name: Configure AIDE check schedule
      ansible.builtin.cron:
        name: "AIDE integrity check"
        job: "/usr/sbin/aide --check | /usr/bin/mail -s 'AIDE Integrity Check' root"
        special_time: "{{ rhel_aide_check_schedule }}"
        user: root
        state: present
      tags:
        - aide
        - cron

    - name: Display AIDE status
      ansible.builtin.debug:
        msg:
          - "AIDE configuration completed"
          - "Database path: {{ rhel_aide_db_path }}"
          - "Check schedule: {{ rhel_aide_check_schedule }}"
          - "Run 'aide --init' manually if database doesn't exist"
      tags:
        - validation

    # ----------------------------- postflight -------------------

    - name: "rhel/rhel-hardening/aide | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_rhel_rhel_hardening_aide_preflight_passed | bool
          - fe_rhel_rhel_hardening_aide_status in ['running', 'succeeded']
        fail_msg: >-
          rhel/rhel-hardening/aide: postflight validation failed - preflight passed
          ={{ fe_rhel_rhel_hardening_aide_preflight_passed | default(false) }},
          status={{ fe_rhel_rhel_hardening_aide_status | default('unknown') }}.
        success_msg: "rhel/rhel-hardening/aide: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "rhel/rhel-hardening/aide | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_aide_postflight_passed: true
        fe_rhel_rhel_hardening_aide_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "rhel/rhel-hardening/aide | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_aide_status: "failed"
        fe_rhel_rhel_hardening_aide_postflight_passed: false
        fe_rhel_rhel_hardening_aide_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_rhel_rhel_hardening_aide_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/aide | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          rhel/rhel-hardening/aide: FAILED at '{{ fe_rhel_rhel_hardening_aide_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_rhel_rhel_hardening_aide_error }}
      tags:
        - always
        - rescue

    - name: "rhel/rhel-hardening/aide | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          rhel/rhel-hardening/aide failed at '{{ fe_rhel_rhel_hardening_aide_failed_task }}': {{ fe_rhel_rhel_hardening_aide_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "rhel/rhel-hardening/aide | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_aide_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_rhel_rhel_hardening_aide_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_rhel_rhel_hardening_aide_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "rhel/rhel-hardening/aide | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "rhel/rhel-hardening/aide":
              component: "rhel/rhel-hardening/aide"
              type: "role-tasks"
              platform: "rhel"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_rhel_rhel_hardening_aide_status | default('unknown') }}"
              preflight_passed: "{{ fe_rhel_rhel_hardening_aide_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_rhel_rhel_hardening_aide_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_rhel_rhel_hardening_aide_started_at | default('') }}"
              ended_at: "{{ fe_rhel_rhel_hardening_aide_ended_at | default('') }}"
              duration_seconds: "{{ fe_rhel_rhel_hardening_aide_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_rhel_rhel_hardening_aide_failed_task | default('') }}"
              error: "{{ fe_rhel_rhel_hardening_aide_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_rhel_rhel_hardening_aide_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_rhel_rhel_hardening_aide_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_rhel_rhel_hardening_aide_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_rhel_rhel_hardening_aide_status | default('') == 'succeeded' else ['rhel/rhel-hardening/aide'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "rhel/rhel-hardening/aide | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_rhel_rhel_hardening_aide_stats_published: true
      tags:
        - always
