---
# Prereqs (group_vars/claroty.yml):
#   claroty:
#     base_url: "https://xdome.<tenant>.claroty.cloud/api"
#     token: "{{ lookup('env','CLAROTY_TOKEN') }}"
#     verify_ssl: true

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_risk__pull_findings']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_risk__pull_findings_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_risk__pull_findings | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_risk__pull_findings_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_risk__pull_findings_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_risk__pull_findings_status: "running"
    fe_claroty_claroty_risk__pull_findings_preflight_passed: false
    fe_claroty_claroty_risk__pull_findings_postflight_passed: false
    fe_claroty_claroty_risk__pull_findings_failed_task: ""
    fe_claroty_claroty_risk__pull_findings_error: ""
    fe_claroty_claroty_risk__pull_findings_stats_published: false
  tags:
    - always

- name: "claroty/claroty_risk__pull_findings | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_risk__pull_findings | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_risk__pull_findings: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_risk__pull_findings: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_risk__pull_findings | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_risk__pull_findings: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_risk__pull_findings: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_risk__pull_findings_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_risk__pull_findings | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_risk__pull_findings_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Pull open risks
      uri:
        url: "{{ claroty.base_url }}/v1/risks/search"
        method: POST
        headers: { Authorization: "Bearer {{ claroty.token }}", Content-Type: "application/json" }
        body_format: json
        body: "{{ risk_filter | default({'status':['open']}) }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ claroty.verify_ssl | default(true) }}"
      register: risks

    - name: Write risks CSV
      copy:
        dest: "{{ artifacts_dir | default('/tmp/claroty-artifacts') }}/risks.csv"
        mode: "0644"
        content: |
          id,asset,site,type,cve,cvss,risk,exploit,status
          {% for r in risks.json.items | default([]) %}
          {{ r.id | default('') }},{{ r.asset.name | default('') }},{{ r.asset.site.name | default('') }},
          {{ r.asset.type | default('') }},{{ r.cve | default('') }},{{ r.cvss | default('') }},
          {{ r.riskScore | default('') }},{{ r.exploitability | default('') }},{{ r.status | default('') }}
          {% endfor %}

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_risk__pull_findings | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_risk__pull_findings_preflight_passed | bool
          - fe_claroty_claroty_risk__pull_findings_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_risk__pull_findings: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_risk__pull_findings_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_risk__pull_findings_status | default('unknown') }}.
        success_msg: "claroty/claroty_risk__pull_findings: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_risk__pull_findings | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_risk__pull_findings_postflight_passed: true
        fe_claroty_claroty_risk__pull_findings_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_risk__pull_findings | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_risk__pull_findings_status: "failed"
        fe_claroty_claroty_risk__pull_findings_postflight_passed: false
        fe_claroty_claroty_risk__pull_findings_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_risk__pull_findings_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_risk__pull_findings | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_risk__pull_findings: FAILED at '{{ fe_claroty_claroty_risk__pull_findings_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_risk__pull_findings_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_risk__pull_findings | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_risk__pull_findings failed at '{{ fe_claroty_claroty_risk__pull_findings_failed_task }}': {{ fe_claroty_claroty_risk__pull_findings_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_risk__pull_findings | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_risk__pull_findings_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_risk__pull_findings_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_risk__pull_findings_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_risk__pull_findings | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_risk__pull_findings":
              component: "claroty/claroty_risk__pull_findings"
              type: "tasks"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_risk__pull_findings_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_risk__pull_findings_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_risk__pull_findings_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_risk__pull_findings_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_risk__pull_findings_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_risk__pull_findings_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_risk__pull_findings_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_risk__pull_findings_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_risk__pull_findings_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_risk__pull_findings_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_risk__pull_findings_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_risk__pull_findings_status | default('') == 'succeeded' else ['claroty/claroty_risk__pull_findings'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_risk__pull_findings | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_risk__pull_findings_stats_published: true
      tags:
        - always
