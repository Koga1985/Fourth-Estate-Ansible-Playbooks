---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_xdome_inventory_export']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_xdome_inventory_export_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_xdome_inventory_export | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_xdome_inventory_export_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_xdome_inventory_export_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_xdome_inventory_export_status: "running"
    fe_claroty_claroty_xdome_inventory_export_preflight_passed: false
    fe_claroty_claroty_xdome_inventory_export_postflight_passed: false
    fe_claroty_claroty_xdome_inventory_export_failed_task: ""
    fe_claroty_claroty_xdome_inventory_export_error: ""
    fe_claroty_claroty_xdome_inventory_export_stats_published: false
  tags:
    - always

- name: "claroty/claroty_xdome_inventory_export | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_xdome_inventory_export | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_xdome_inventory_export: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_xdome_inventory_export: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_export | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_xdome_inventory_export: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_xdome_inventory_export: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_xdome_inventory_export_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_export | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_export_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir
      file: { path: "{{ artifacts_dir }}", state: directory, mode: "0755" }

    - name: Determine effective delta_since
      set_fact:
        _delta_since_eff: >-
          {%- if delta_since == 'auto' -%}
          {%- set f = artifacts_dir + '/' + marker_filename -%}
          {%- if lookup('ansible.builtin.file', f, errors='ignore') | length > 0 -%}
          {{ lookup('ansible.builtin.file', f) | trim }}
          {%- else -%}
          {{ omit }}
          {%- endif -%}
          {%- elif delta_since is string and delta_since|length > 0 -%}
          {{ delta_since }}
          {%- else -%}
          {{ omit }}
          {%- endif -%}

    - name: Init results list
      set_fact: { _assets_all: [] }

    - name: Fetch assets (paginated)
      vars:
        _page: "{{ item }}"
        _body: >-
          {{
            dict2items({'page': _page, 'pageSize': page_size}) |
            items2dict | combine( {'updatedSince': _delta_since_eff} if _delta_since_eff is defined else {} )
          }}
      uri:
        url: "{{ claroty.base_url }}/v1/assets/search"
        method: POST
        body_format: json
        body: "{{ _body }}"
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        return_content: true
        status_code: 200
        validate_certs: "{{ claroty.verify_ssl | default(true) }}"
        timeout: "{{ request_timeout }}"
      register: _page_resp
      loop: "{{ range(1, max_pages + 1) | list }}"
      loop_control: { label: "page {{ item }}" }
      until: (_page_resp.json.items | default([])) | length == 0
      retries: 1
      delay: 0

    - name: Flatten asset results
      set_fact:
        _assets_all: "{{ _assets_all + (_page_resp.results | map(attribute='json') | map(attribute='items') | list | sum(start=[])) }}"

    - name: Write JSON export
      when: inventory_format in ['json','both']
      copy:
        dest: "{{ artifacts_dir }}/{{ json_filename }}"
        mode: "0644"
        content: "{{ _assets_all | to_nice_json }}"

    - name: Write CSV export
      when: inventory_format in ['csv','both']
      copy:
        dest: "{{ artifacts_dir }}/{{ csv_filename }}"
        mode: "0644"
        content: |
          {%- set fields = include_fields if include_fields|length>0 else
              ['id','name','site','type','ip','mac','vendor','model','firmware','riskScore'] -%}
          {{ fields | join(',') }}
          {%- for a in _assets_all -%}
          {%- set row = [] -%}
          {%- for f in fields -%}
          {%- set v = a.get(f, a.get('site',{}).get('name','') if f=='site' else '') -%}
          {%- set _ = row.append((v|string).replace(',', ' ')) -%}
          {%- endfor -%}
          {{ row | join(',') }}
          {%- endfor -%}

    - name: Update last_run marker (UTC ISO8601)
      copy:
        dest: "{{ artifacts_dir }}/{{ marker_filename }}"
        mode: "0644"
        content: "{{ lookup('ansible.builtin.pipe','date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_xdome_inventory_export | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_xdome_inventory_export_preflight_passed | bool
          - fe_claroty_claroty_xdome_inventory_export_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_xdome_inventory_export: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_xdome_inventory_export_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_xdome_inventory_export_status | default('unknown') }}.
        success_msg: "claroty/claroty_xdome_inventory_export: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_xdome_inventory_export | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_export_postflight_passed: true
        fe_claroty_claroty_xdome_inventory_export_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_xdome_inventory_export | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_export_status: "failed"
        fe_claroty_claroty_xdome_inventory_export_postflight_passed: false
        fe_claroty_claroty_xdome_inventory_export_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_xdome_inventory_export_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_export | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_xdome_inventory_export: FAILED at '{{ fe_claroty_claroty_xdome_inventory_export_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_xdome_inventory_export_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_export | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_xdome_inventory_export failed at '{{ fe_claroty_claroty_xdome_inventory_export_failed_task }}': {{ fe_claroty_claroty_xdome_inventory_export_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_xdome_inventory_export | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_export_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_xdome_inventory_export_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_xdome_inventory_export_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_export | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_xdome_inventory_export":
              component: "claroty/claroty_xdome_inventory_export"
              type: "role"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_xdome_inventory_export_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_xdome_inventory_export_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_inventory_export_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_inventory_export_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_inventory_export_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_export_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_inventory_export_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_inventory_export_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_inventory_export_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_inventory_export_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_export_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_inventory_export_status | default('') == 'succeeded' else ['claroty/claroty_xdome_inventory_export'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_export | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_export_stats_published: true
      tags:
        - always
