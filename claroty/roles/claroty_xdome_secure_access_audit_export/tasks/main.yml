---
# Claroty xDome Secure Remote Access - Audit Export Tasks
# Fourth Estate OT/ICS Cybersecurity

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_xdome_secure_access_audit_export']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_xdome_secure_access_audit_export_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_xdome_secure_access_audit_export | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_xdome_secure_access_audit_export_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_xdome_secure_access_audit_export_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_xdome_secure_access_audit_export_status: "running"
    fe_claroty_claroty_xdome_secure_access_audit_export_preflight_passed: false
    fe_claroty_claroty_xdome_secure_access_audit_export_postflight_passed: false
    fe_claroty_claroty_xdome_secure_access_audit_export_failed_task: ""
    fe_claroty_claroty_xdome_secure_access_audit_export_error: ""
    fe_claroty_claroty_xdome_secure_access_audit_export_stats_published: false
  tags:
    - always

- name: "claroty/claroty_xdome_secure_access_audit_export | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_xdome_secure_access_audit_export | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_xdome_secure_access_audit_export: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_xdome_secure_access_audit_export: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_audit_export | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_xdome_secure_access_audit_export: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_xdome_secure_access_audit_export: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_audit_export | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_audit_export_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ artifacts_dir }}"
        - "{{ log_dir }}"

    # Session Audit Logs
    - name: Export session audit logs
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/sessions"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
          include_recordings: "{{ forensics.session_recording_export }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
        timeout: "{{ claroty.timeout }}"
      register: session_logs
      when: "'session_logs' in audit_export.log_types"

    # User Activity Logs
    - name: Export user activity logs
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/user-activity"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: user_activity_logs
      when: "'user_activity' in audit_export.log_types"

    # Connection Logs
    - name: Export connection logs
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/connections"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: connection_logs
      when: "'connection_logs' in audit_export.log_types"

    # File Transfer Logs
    - name: Export file transfer logs
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/file-transfers"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
          include_hashes: "{{ forensics.file_transfer_hashes }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: file_transfer_logs
      when: "'file_transfer_logs' in audit_export.log_types"

    # Command Execution Logs (SSH)
    - name: Export command execution logs
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/commands"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: command_logs
      when: "'command_execution' in audit_export.log_types"

    # Failed Access Attempts
    - name: Export failed access attempts
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/failed-access"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: failed_access_logs
      when: "'failed_access' in audit_export.log_types"

    # Policy Violations
    - name: Export policy violations
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/audit/policy-violations"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          time_range: "{{ audit_export.time_range }}"
          filters: "{{ audit_export.filters }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ claroty.verify_ssl }}"
      register: policy_violation_logs
      when: "'policy_violations' in audit_export.log_types"

    # Export to CSV Format
    - name: Export audit logs to CSV
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/claroty_audit_{{ item.key }}_{{ ansible_date_time.iso8601_basic_short }}.csv"
        mode: "0644"
        content: |
          timestamp,user_email,user_type,session_id,source_ip,protocol,action,result,asset_name,site,details
          {% for log in item.value.json.items | default([]) %}
          {{ log.timestamp | default('') }},{{ log.user.email | default('') }},{{ log.user.type | default('') }},{{ log.session_id | default('') }},{{ log.source_ip | default('') }},{{ log.protocol | default('') }},{{ log.action | default('') }},{{ log.result | default('') }},{{ log.asset.name | default('') }},{{ log.asset.site | default('') }},{{ log.details | default('') | to_json }}
          {% endfor %}
      loop:
        - { key: 'sessions', value: '{{ session_logs }}' }
        - { key: 'user_activity', value: '{{ user_activity_logs }}' }
        - { key: 'connections', value: '{{ connection_logs }}' }
        - { key: 'file_transfers', value: '{{ file_transfer_logs }}' }
        - { key: 'commands', value: '{{ command_logs }}' }
        - { key: 'failed_access', value: '{{ failed_access_logs }}' }
        - { key: 'policy_violations', value: '{{ policy_violation_logs }}' }
      when:
        - audit_export.enabled
        - "'csv' in audit_export.export_formats"
        - item.value.json is defined

    # Export to JSON Format
    - name: Export audit logs to JSON
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/claroty_audit_{{ item.key }}_{{ ansible_date_time.iso8601_basic_short }}.json"
        mode: "0644"
        content: "{{ item.value.json | to_nice_json }}"
      loop:
        - { key: 'sessions', value: '{{ session_logs }}' }
        - { key: 'user_activity', value: '{{ user_activity_logs }}' }
        - { key: 'connections', value: '{{ connection_logs }}' }
        - { key: 'file_transfers', value: '{{ file_transfer_logs }}' }
        - { key: 'commands', value: '{{ command_logs }}' }
        - { key: 'failed_access', value: '{{ failed_access_logs }}' }
        - { key: 'policy_violations', value: '{{ policy_violation_logs }}' }
      when:
        - audit_export.enabled
        - "'json' in audit_export.export_formats"
        - item.value.json is defined

    # SIEM Integration - Splunk HEC
    - name: Send audit logs to Splunk HEC
      ansible.builtin.uri:
        url: "{{ siem_integration.splunk.hec_url }}"
        method: POST
        headers:
          Authorization: "Splunk {{ siem_integration.splunk.hec_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          event: "{{ item }}"
          index: "{{ siem_integration.splunk.index }}"
          sourcetype: "{{ siem_integration.splunk.sourcetype }}"
          source: "claroty_xdome"
        status_code: [200, 201]
        validate_certs: "{{ siem_integration.splunk.verify_ssl }}"
      loop: "{{ session_logs.json.items | default([]) }}"
      when:
        - siem_integration.enabled
        - siem_integration.platform == 'splunk'
        - session_logs.json is defined

    # ServiceNow Incident Creation for Policy Violations
    - name: Create ServiceNow incidents for policy violations
      ansible.builtin.uri:
        url: "https://{{ servicenow_integration.instance }}/api/now/table/{{ servicenow_integration.incident_table }}"
        method: POST
        headers:
          Authorization: "Bearer {{ servicenow_integration.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          short_description: "Claroty xDome Policy Violation - {{ item.user.email | default('Unknown') }}"
          description: |
            Policy Violation Detected

            User: {{ item.user.email | default('Unknown') }}
            Session ID: {{ item.session_id | default('N/A') }}
            Policy: {{ item.policy_name | default('N/A') }}
            Violation: {{ item.violation_details | default('') }}
            Timestamp: {{ item.timestamp | default('') }}
            Asset: {{ item.asset.name | default('N/A') }}
            Site: {{ item.asset.site | default('N/A') }}
          category: "{{ servicenow_integration.category }}"
          priority: "{{ servicenow_integration.priority }}"
          assignment_group: "{{ servicenow_integration.assignment_group }}"
          u_claroty_session_id: "{{ item.session_id | default('') }}"
        status_code: [200, 201]
        validate_certs: true
      loop: "{{ policy_violation_logs.json.items | default([]) }}"
      when:
        - servicenow_integration.enabled
        - policy_violation_logs.json is defined

    # Generate Compliance Report
    - name: Generate compliance audit report
      ansible.builtin.template:
        src: compliance_audit_report.html.j2
        dest: "{{ artifacts_dir }}/compliance_audit_report_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"
      when: compliance.enabled

    # Forensic Investigation Package
    - name: Create forensic investigation package
      ansible.builtin.archive:
        path:
          - "{{ artifacts_dir }}/claroty_audit_*_{{ ansible_date_time.iso8601_basic_short }}.*"
        dest: "{{ artifacts_dir }}/claroty_forensics_package_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
        mode: "0644"
      when: forensics.enabled

    - name: Display export summary
      ansible.builtin.debug:
        msg:
          - "=== Claroty xDome Audit Export Complete ==="
          - "Session Logs: {{ session_logs.json.items | default([]) | length }}"
          - "Connection Logs: {{ connection_logs.json.items | default([]) | length }}"
          - "File Transfers: {{ file_transfer_logs.json.items | default([]) | length }}"
          - "Command Logs: {{ command_logs.json.items | default([]) | length }}"
          - "Failed Access: {{ failed_access_logs.json.items | default([]) | length }}"
          - "Policy Violations: {{ policy_violation_logs.json.items | default([]) | length }}"
          - "Export Location: {{ artifacts_dir }}"

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_xdome_secure_access_audit_export | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_xdome_secure_access_audit_export_preflight_passed | bool
          - fe_claroty_claroty_xdome_secure_access_audit_export_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_xdome_secure_access_audit_export: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_xdome_secure_access_audit_export_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_xdome_secure_access_audit_export_status | default('unknown') }}.
        success_msg: "claroty/claroty_xdome_secure_access_audit_export: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_audit_export | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_audit_export_postflight_passed: true
        fe_claroty_claroty_xdome_secure_access_audit_export_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_xdome_secure_access_audit_export | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_audit_export_status: "failed"
        fe_claroty_claroty_xdome_secure_access_audit_export_postflight_passed: false
        fe_claroty_claroty_xdome_secure_access_audit_export_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_xdome_secure_access_audit_export_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_secure_access_audit_export | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_xdome_secure_access_audit_export: FAILED at '{{ fe_claroty_claroty_xdome_secure_access_audit_export_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_xdome_secure_access_audit_export_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_secure_access_audit_export | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_xdome_secure_access_audit_export failed at '{{ fe_claroty_claroty_xdome_secure_access_audit_export_failed_task }}': {{ fe_claroty_claroty_xdome_secure_access_audit_export_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_xdome_secure_access_audit_export | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_audit_export_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_xdome_secure_access_audit_export_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_xdome_secure_access_audit_export_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_xdome_secure_access_audit_export | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_xdome_secure_access_audit_export":
              component: "claroty/claroty_xdome_secure_access_audit_export"
              type: "role"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_secure_access_audit_export_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_secure_access_audit_export_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_audit_export_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_secure_access_audit_export_status | default('') == 'succeeded' else ['claroty/claroty_xdome_secure_access_audit_export'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_xdome_secure_access_audit_export | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_audit_export_stats_published: true
      tags:
        - always
