---
# Claroty xDome Secure Remote Access - Session Policy Configuration Tasks
# Fourth Estate OT/ICS Cybersecurity

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_xdome_secure_access_session_policy']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_xdome_secure_access_session_policy_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_xdome_secure_access_session_policy | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_xdome_secure_access_session_policy_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_xdome_secure_access_session_policy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_xdome_secure_access_session_policy_status: "running"
    fe_claroty_claroty_xdome_secure_access_session_policy_preflight_passed: false
    fe_claroty_claroty_xdome_secure_access_session_policy_postflight_passed: false
    fe_claroty_claroty_xdome_secure_access_session_policy_failed_task: ""
    fe_claroty_claroty_xdome_secure_access_session_policy_error: ""
    fe_claroty_claroty_xdome_secure_access_session_policy_stats_published: false
  tags:
    - always

- name: "claroty/claroty_xdome_secure_access_session_policy | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_xdome_secure_access_session_policy | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_xdome_secure_access_session_policy: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_xdome_secure_access_session_policy: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_session_policy | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_xdome_secure_access_session_policy: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_xdome_secure_access_session_policy: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_session_policy | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_session_policy_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ artifacts_dir }}"
        - "{{ log_dir }}"

    - name: Validate API connectivity
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/health"
        method: GET
        headers:
          Authorization: "Bearer {{ claroty.token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ claroty.verify_ssl }}"
        timeout: "{{ claroty.timeout }}"
      register: health_check

    # Session Policies Configuration
    - name: Get existing session policies
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/session-policies"
        method: GET
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        return_content: true
        status_code: 200
        validate_certs: "{{ claroty.verify_ssl }}"
      register: existing_policies

    - name: Create or update session policies
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/session-policies"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          enabled: "{{ item.enabled | default(true) }}"
          priority: "{{ item.priority | default(10) }}"
          applies_to: "{{ item.applies_to | default({}) }}"
          session_timeout: "{{ item.session_timeout | default({}) }}"
          idle_timeout: "{{ item.idle_timeout | default({}) }}"
          session_recording: "{{ item.session_recording | default({}) }}"
          file_transfer: "{{ item.file_transfer | default({}) }}"
          clipboard: "{{ item.clipboard | default({}) }}"
          printing: "{{ item.printing | default({}) }}"
          screenshot_capture: "{{ item.screenshot_capture | default({}) }}"
          screen_sharing: "{{ item.screen_sharing | default({}) }}"
          watermark: "{{ item.watermark | default({}) }}"
          concurrent_sessions: "{{ item.concurrent_sessions | default({}) }}"
          time_based_access: "{{ item.time_based_access | default({}) }}"
          ip_restrictions: "{{ item.ip_restrictions | default({}) }}"
          protocol_settings: "{{ item.protocol_settings | default({}) }}"
          security_controls: "{{ item.security_controls | default({}) }}"
          metadata:
            created_by: "{{ ansible_user_id }}"
            created_at: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 201]
        validate_certs: "{{ claroty.verify_ssl }}"
        return_content: true
      loop: "{{ session_policies }}"
      loop_control:
        label: "{{ item.name }}"
      register: created_policies

    # Apply Default Session Policy
    - name: Apply default session policy
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/session-policies/default"
        method: PUT
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ default_session_policy }}"
        status_code: [200, 201]
        validate_certs: "{{ claroty.verify_ssl }}"
      when: default_session_policy.enabled | default(true)

    # Configure Session Recording Settings
    - name: Configure global session recording settings
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/recording-settings"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          retention_days: 365
          encryption_enabled: true
          compression_enabled: true
          storage_location: "s3"
          backup_enabled: true
        status_code: [200, 201]
        validate_certs: "{{ claroty.verify_ssl }}"

    # Configure Monitoring and Alerts
    - name: Configure session policy monitoring
      ansible.builtin.uri:
        url: "{{ claroty.base_url }}/v1/secure-access/monitoring"
        method: POST
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          enabled: "{{ monitoring.enabled }}"
          alert_on_policy_violation: "{{ monitoring.alert_on_policy_violation }}"
          alert_on_failed_mfa: "{{ monitoring.alert_on_failed_mfa }}"
          alert_on_suspicious_activity: "{{ monitoring.alert_on_suspicious_activity }}"
          alert_recipients: "{{ monitoring.alert_recipients }}"
        status_code: [200, 201]
        validate_certs: "{{ claroty.verify_ssl }}"
      when: monitoring.enabled | default(true)

    # Generate Configuration Summary
    - name: Export session policies to CSV
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/session_policies_{{ ansible_date_time.iso8601_basic_short }}.csv"
        mode: "0644"
        content: |
          policy_name,enabled,session_timeout,idle_timeout,recording,file_transfer,clipboard,mfa_required,watermark,concurrent_sessions
          {% for result in created_policies.results | default([]) %}
          {{ result.item.name }},{{ result.item.enabled | default(true) }},{{ result.item.session_timeout.timeout_minutes | default('N/A') }},{{ result.item.idle_timeout.timeout_minutes | default('N/A') }},{{ result.item.session_recording.enabled | default(true) }},{{ result.item.file_transfer.policy | default('deny') }},{{ result.item.clipboard.policy | default('deny') }},{{ result.item.security_controls.require_mfa | default(true) }},{{ result.item.watermark.enabled | default(true) }},{{ result.item.concurrent_sessions.max_sessions | default(1) }}
          {% endfor %}

    - name: Generate session policy compliance report
      ansible.builtin.template:
        src: session_policy_report.html.j2
        dest: "{{ artifacts_dir }}/session_policy_report_{{ ansible_date_time.iso8601_basic_short }}.html"
        mode: "0644"
      when: reporting.enabled | default(true)

    - name: Log session policy changes for compliance
      ansible.builtin.copy:
        dest: "{{ log_dir }}/session_policy_audit_{{ ansible_date_time.iso8601_basic_short }}.log"
        mode: "0644"
        content: |
          === Claroty xDome Session Policy Configuration Audit Log ===
          Timestamp: {{ ansible_date_time.iso8601 }}
          Operator: {{ ansible_user_id }}
          Hostname: {{ ansible_hostname }}

          Session Policies Configured ({{ created_policies.results | default([]) | length }}):
          {% for result in created_policies.results | default([]) %}
          - {{ result.item.name }}
            Priority: {{ result.item.priority | default(10) }}
            Session Timeout: {{ result.item.session_timeout.timeout_minutes | default('N/A') }} min
            Idle Timeout: {{ result.item.idle_timeout.timeout_minutes | default('N/A') }} min
            Recording: {{ result.item.session_recording.enabled | default(true) }} ({{ result.item.session_recording.recording_type | default('full') }})
            File Transfer: {{ result.item.file_transfer.policy | default('deny') }}
            Clipboard: {{ result.item.clipboard.policy | default('deny') }}
            MFA Required: {{ result.item.security_controls.require_mfa | default(true) }}
          {% endfor %}

          Default Policy: {{ 'Enabled' if default_session_policy.enabled | default(true) else 'Disabled' }}
      when: compliance.log_policy_changes | default(true)

    - name: Display session policy summary
      ansible.builtin.debug:
        msg:
          - "=== Claroty xDome Session Policy Configuration Complete ==="
          - "Policies Configured: {{ created_policies.results | default([]) | length }}"
          - "Default Policy: {{ 'Enabled' if default_session_policy.enabled | default(true) else 'Disabled' }}"
          - "Session Recording: Enabled"
          - "MFA Enforcement: Enabled"
          - "Audit Log: {{ log_dir }}/session_policy_audit_{{ ansible_date_time.iso8601_basic_short }}.log"
          - "Policy CSV: {{ artifacts_dir }}/session_policies_{{ ansible_date_time.iso8601_basic_short }}.csv"

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_xdome_secure_access_session_policy | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_xdome_secure_access_session_policy_preflight_passed | bool
          - fe_claroty_claroty_xdome_secure_access_session_policy_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_xdome_secure_access_session_policy: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_xdome_secure_access_session_policy_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_xdome_secure_access_session_policy_status | default('unknown') }}.
        success_msg: "claroty/claroty_xdome_secure_access_session_policy: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_xdome_secure_access_session_policy | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_session_policy_postflight_passed: true
        fe_claroty_claroty_xdome_secure_access_session_policy_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_xdome_secure_access_session_policy | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_session_policy_status: "failed"
        fe_claroty_claroty_xdome_secure_access_session_policy_postflight_passed: false
        fe_claroty_claroty_xdome_secure_access_session_policy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_xdome_secure_access_session_policy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_secure_access_session_policy | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_xdome_secure_access_session_policy: FAILED at '{{ fe_claroty_claroty_xdome_secure_access_session_policy_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_xdome_secure_access_session_policy_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_secure_access_session_policy | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_xdome_secure_access_session_policy failed at '{{ fe_claroty_claroty_xdome_secure_access_session_policy_failed_task }}': {{ fe_claroty_claroty_xdome_secure_access_session_policy_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_xdome_secure_access_session_policy | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_session_policy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_xdome_secure_access_session_policy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_xdome_secure_access_session_policy_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_xdome_secure_access_session_policy | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_xdome_secure_access_session_policy":
              component: "claroty/claroty_xdome_secure_access_session_policy"
              type: "role"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_secure_access_session_policy_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_secure_access_session_policy_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_session_policy_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_secure_access_session_policy_status | default('') == 'succeeded' else ['claroty/claroty_xdome_secure_access_session_policy'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_xdome_secure_access_session_policy | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_secure_access_session_policy_stats_published: true
      tags:
        - always
