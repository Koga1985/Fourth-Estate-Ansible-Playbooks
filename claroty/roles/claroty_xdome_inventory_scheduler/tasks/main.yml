---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_xdome_inventory_scheduler']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_xdome_inventory_scheduler_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_xdome_inventory_scheduler | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_xdome_inventory_scheduler_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_xdome_inventory_scheduler_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_xdome_inventory_scheduler_status: "running"
    fe_claroty_claroty_xdome_inventory_scheduler_preflight_passed: false
    fe_claroty_claroty_xdome_inventory_scheduler_postflight_passed: false
    fe_claroty_claroty_xdome_inventory_scheduler_failed_task: ""
    fe_claroty_claroty_xdome_inventory_scheduler_error: ""
    fe_claroty_claroty_xdome_inventory_scheduler_stats_published: false
  tags:
    - always

- name: "claroty/claroty_xdome_inventory_scheduler | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_xdome_inventory_scheduler | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_xdome_inventory_scheduler: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_xdome_inventory_scheduler: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_scheduler | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_xdome_inventory_scheduler: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_xdome_inventory_scheduler: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_xdome_inventory_scheduler_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_scheduler | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_scheduler_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir
      file: { path: "{{ artifacts_dir }}", state: directory, mode: "0755" }

    - name: Install delta-sync wrapper
      copy:
        dest: "{{ artifacts_dir }}/claroty_delta_sync.sh"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          export PATH=/usr/local/bin:/usr/bin:/bin
          {{ cron_env | dict2items | map('join','=','') | map('regex_replace','^(.*)$','export \1') | join('\n') }}
          {{ ansible_cmd }} {{ scheduled_playbook }} >> {{ artifacts_dir }}/delta_sync.log 2>&1

    - name: Create cron entry
      cron:
        name: "Claroty xDome delta sync"
        minute: "{{ cron_schedule.split()[0] }}"
        hour: "{{ cron_schedule.split()[1] | default('*') }}"
        day: "{{ cron_schedule.split()[2] | default('*') }}"
        month: "{{ cron_schedule.split()[3] | default('*') }}"
        weekday: "{{ cron_schedule.split()[4] | default('*') }}"
        job: "{{ artifacts_dir }}/claroty_delta_sync.sh"
        state: present

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_xdome_inventory_scheduler | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_xdome_inventory_scheduler_preflight_passed | bool
          - fe_claroty_claroty_xdome_inventory_scheduler_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_xdome_inventory_scheduler: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_xdome_inventory_scheduler_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_xdome_inventory_scheduler_status | default('unknown') }}.
        success_msg: "claroty/claroty_xdome_inventory_scheduler: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_xdome_inventory_scheduler | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_scheduler_postflight_passed: true
        fe_claroty_claroty_xdome_inventory_scheduler_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_xdome_inventory_scheduler | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_scheduler_status: "failed"
        fe_claroty_claroty_xdome_inventory_scheduler_postflight_passed: false
        fe_claroty_claroty_xdome_inventory_scheduler_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_xdome_inventory_scheduler_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_scheduler | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_xdome_inventory_scheduler: FAILED at '{{ fe_claroty_claroty_xdome_inventory_scheduler_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_xdome_inventory_scheduler_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_scheduler | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_xdome_inventory_scheduler failed at '{{ fe_claroty_claroty_xdome_inventory_scheduler_failed_task }}': {{ fe_claroty_claroty_xdome_inventory_scheduler_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_xdome_inventory_scheduler | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_scheduler_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_xdome_inventory_scheduler_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_xdome_inventory_scheduler_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_scheduler | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_xdome_inventory_scheduler":
              component: "claroty/claroty_xdome_inventory_scheduler"
              type: "role"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_xdome_inventory_scheduler_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_xdome_inventory_scheduler_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_inventory_scheduler_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_inventory_scheduler_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_inventory_scheduler_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_scheduler_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_inventory_scheduler_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_inventory_scheduler_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_inventory_scheduler_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_inventory_scheduler_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_scheduler_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_inventory_scheduler_status | default('') == 'succeeded' else ['claroty/claroty_xdome_inventory_scheduler'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_scheduler | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_scheduler_stats_published: true
      tags:
        - always
