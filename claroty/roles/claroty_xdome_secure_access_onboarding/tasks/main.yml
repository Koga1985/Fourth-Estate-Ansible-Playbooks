              preflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_secure_access_onboarding_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_secure_access_onboarding_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_secure_access_onboarding_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_secure_access_onboarding_status | default('') == 'succeeded' else ['claroty/claroty_xdome_secure_access_onboarding'] }}
        aggregate: true
        per_host: false
      tags:
        - always

