---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['claroty/claroty_xdome_inventory_normalize_cmdb']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_claroty_claroty_xdome_inventory_normalize_cmdb_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "claroty/claroty_xdome_inventory_normalize_cmdb | Initialize validation state"
  ansible.builtin.set_fact:
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_status: "running"
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_preflight_passed: false
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_postflight_passed: false
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_failed_task: ""
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_error: ""
    fe_claroty_claroty_xdome_inventory_normalize_cmdb_stats_published: false
  tags:
    - always

- name: "claroty/claroty_xdome_inventory_normalize_cmdb | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          claroty/claroty_xdome_inventory_normalize_cmdb: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          claroty/claroty_xdome_inventory_normalize_cmdb: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "claroty/claroty_xdome_inventory_normalize_cmdb: required variable '{{ item }}' is not defined."
        success_msg: "claroty/claroty_xdome_inventory_normalize_cmdb: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Read exported JSON
      slurp: { src: "{{ artifacts_dir }}/{{ source_json }}" }
      register: _raw

    - name: Parse JSON content
      set_fact: { _assets: "{{ (_raw.content | b64decode) | from_json }}" }

    - name: Normalize (site/zone/criticality)
      set_fact:
        _assets_norm: "{{ _assets | map('combine', {
            'site_norm': normalize.site_map.get(item.site.name, item.site.name) if item.get('site') else None,
            'zone': (normalize.zone_rules | selectattr('match','defined') | selectattr('set','defined')
                     | selectattr('match.site','==', (normalize.site_map.get(item.site.name, item.site.name) if item.get('site') else None), default=False)
                     | selectattr('match.type','==', item.type, default=False) | list | first | default({'set':{}})).set.get('zone'),
            'criticality': normalize.criticality.by_type.get(item.type, normalize.criticality.default)
          }) | list }}"
      vars: { item: "{{ item }}" }
      loop: "{{ _assets }}"
      loop_control: { label: "{{ item.name | default('asset') }}" }
      register: _norm

    - name: Collect normalized list
      set_fact: { _assets_norm: "{{ _norm.results | map(attribute='ansible_facts._assets_norm') | list | sum(start=[]) }}" }

    - name: Write normalized CSV
      copy:
        dest: "{{ artifacts_dir }}/xdome_assets_normalized.csv"
        mode: "0644"
        content: |
          id,name,site,site_norm,zone,criticality,type,ip,mac,vendor,model,firmware,risk
          {% for a in _assets_norm %}
          {{ a.id | default('') }},{{ a.name | default('') }},{{ a.site.name | default('') }},
          {{ a.site_norm | default('') }},{{ a.zone | default('') }},{{ a.criticality | default('') }},
          {{ a.type | default('') }},{{ a.ip | default('') }},{{ a.mac | default('') }},
          {{ a.vendor | default('') }},{{ a.model | default('') }},{{ a.firmware | default('') }},
          {{ a.riskScore | default('') }}
          {% endfor %}

    - name: (Optional) Tag assets back in xDome
      when: tag_in_xdome | bool
      uri:
        url: "{{ claroty.base_url }}/v1/assets/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ claroty.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          tags:
            - "zone:{{ item.zone | default('') }}"
            - "crit:{{ item.criticality | default('') }}"
          site: "{{ item.site_norm | default(omit) }}"
        status_code: [200,204]
        validate_certs: "{{ claroty.verify_ssl | default(true) }}"
      loop: "{{ _assets_norm }}"
      loop_control: { label: "{{ item.name | default(item.id) }}" }

    - name: (Optional) Push to ServiceNow CMDB
      when: cmdb_push | bool and cmdb_system == 'servicenow'
      uri:
        url: "https://{{ servicenow.instance }}/api/now/table/{{ servicenow.table }}"
        method: POST
        headers:
          Authorization: "Bearer {{ servicenow.token }}"
          Content-Type: "application/json"
        body_format: json
        body: >-
          {%- set m = sn_payload_map -%}
          {%- set payload = {} -%}
          {%- for k,v in m.items() -%}
          {%-   set _ = payload.update({k: item.get(v) }) -%}
          {%- endfor -%}
          {{ payload | combine({'u_claroty_id': item.get('id'), 'u_claroty_zone': item.get('zone'), 'u_claroty_criticality': item.get('criticality')}) }}
        status_code: [200,201]
        return_content: true
        validate_certs: "{{ servicenow.verify_ssl | default(true) }}"
      loop: "{{ _assets_norm }}"
      loop_control: { label: "{{ item.name | default(item.id) }}" }

    # ----------------------------- postflight -------------------

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_claroty_claroty_xdome_inventory_normalize_cmdb_preflight_passed | bool
          - fe_claroty_claroty_xdome_inventory_normalize_cmdb_status in ['running', 'succeeded']
        fail_msg: >-
          claroty/claroty_xdome_inventory_normalize_cmdb: postflight validation failed - preflight passed
          ={{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_preflight_passed | default(false) }},
          status={{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_status | default('unknown') }}.
        success_msg: "claroty/claroty_xdome_inventory_normalize_cmdb: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_postflight_passed: true
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_status: "failed"
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_postflight_passed: false
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          claroty/claroty_xdome_inventory_normalize_cmdb: FAILED at '{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_error }}
      tags:
        - always
        - rescue

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          claroty/claroty_xdome_inventory_normalize_cmdb failed at '{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_failed_task }}': {{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_claroty_xdome_inventory_normalize_cmdb_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "claroty/claroty_xdome_inventory_normalize_cmdb":
              component: "claroty/claroty_xdome_inventory_normalize_cmdb"
              type: "role"
              platform: "claroty"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_status | default('unknown') }}"
              preflight_passed: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_started_at | default('') }}"
              ended_at: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_ended_at | default('') }}"
              duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_failed_task | default('') }}"
              error: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_claroty_claroty_xdome_inventory_normalize_cmdb_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_claroty_claroty_xdome_inventory_normalize_cmdb_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_claroty_claroty_xdome_inventory_normalize_cmdb_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_claroty_claroty_xdome_inventory_normalize_cmdb_status | default('') == 'succeeded' else ['claroty/claroty_xdome_inventory_normalize_cmdb'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "claroty/claroty_xdome_inventory_normalize_cmdb | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_claroty_claroty_xdome_inventory_normalize_cmdb_stats_published: true
      tags:
        - always
