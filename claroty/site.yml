---
# Claroty xDome Deployment Playbook
# Entry point for Claroty OT security platform automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Claroty xDome Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_inventory: true
    deploy_alerts: true
    deploy_secure_access: true
    deploy_segmentation: true
    deploy_vulnerability: true
    deploy_compliance: true

  tasks:
    # =========================================
    # Phase 1: Inventory Management
    # =========================================
    - name: "claroty/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Inventory Export
          ansible.builtin.include_role:
            name: claroty_xdome_inventory_export
          when: deploy_inventory | bool
          tags: ['inventory', 'phase1']

        - name: Phase 1 - Inventory Scheduler
          ansible.builtin.include_role:
            name: claroty_xdome_inventory_scheduler
          when: deploy_inventory | bool
          tags: ['inventory', 'phase1']

        - name: Phase 1 - CMDB Normalization
          ansible.builtin.include_role:
            name: claroty_xdome_inventory_normalize_cmdb
          when: deploy_inventory | bool
          tags: ['inventory', 'cmdb', 'phase1']

        # =========================================
        # Phase 2: Alert Integration
        # =========================================
        - name: Phase 2 - Alerts SIEM Integration
          ansible.builtin.include_role:
            name: claroty_xdome_alerts_siem
          when: deploy_alerts | bool
          tags: ['alerts', 'siem', 'phase2']

        # =========================================
        # Phase 3: Secure Access
        # =========================================
        - name: Phase 3 - Secure Access Onboarding
          ansible.builtin.include_role:
            name: claroty_xdome_secure_access_onboarding
          when: deploy_secure_access | bool
          tags: ['access', 'phase3']

        - name: Phase 3 - Session Policy
          ansible.builtin.include_role:
            name: claroty_xdome_secure_access_session_policy
          when: deploy_secure_access | bool
          tags: ['access', 'phase3']

        - name: Phase 3 - Audit Export
          ansible.builtin.include_role:
            name: claroty_xdome_secure_access_audit_export
          when: deploy_secure_access | bool
          tags: ['access', 'audit', 'phase3']

        # =========================================
        # Phase 4: Segmentation
        # =========================================
        - name: Phase 4 - Segmentation
          ansible.builtin.include_role:
            name: claroty_xdome_segmentation
          when: deploy_segmentation | bool
          tags: ['segmentation', 'phase4']

        # =========================================
        # Phase 5: Vulnerability Management
        # =========================================
        - name: Phase 5 - Vulnerability Risk
          ansible.builtin.include_role:
            name: claroty_xdome_vuln_risk
          when: deploy_vulnerability | bool
          tags: ['vulnerability', 'phase5']

        # =========================================
        # Phase 6: Compliance & Reporting
        # =========================================
        - name: Phase 6 - Compliance Pack
          ansible.builtin.include_role:
            name: claroty_xdome_reporting_compliance_pack
          when: deploy_compliance | bool
          tags: ['compliance', 'phase6']

        - name: Phase 6 - Executive Summary
          ansible.builtin.include_role:
            name: claroty_xdome_reporting_exec_summary
          when: deploy_compliance | bool
          tags: ['reporting', 'phase6']

        # =========================================
        # Deployment Summary
        # =========================================
        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "=== Claroty xDome Deployment Complete ==="
              - "API URL: {{ claroty_api_url }}"
              - "Inventory: {{ 'Configured' if deploy_inventory else 'Skipped' }}"
              - "Alerts/SIEM: {{ 'Configured' if deploy_alerts else 'Skipped' }}"
              - "Secure Access: {{ 'Configured' if deploy_secure_access else 'Skipped' }}"
              - "Segmentation: {{ 'Configured' if deploy_segmentation else 'Skipped' }}"
              - "Vulnerability: {{ 'Configured' if deploy_vulnerability else 'Skipped' }}"
              - "Compliance: {{ 'Configured' if deploy_compliance else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "claroty/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_claroty_site_status: "failed"
            fe_claroty_site_postflight_passed: false
            fe_claroty_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_claroty_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "claroty/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              claroty/site: FAILED at '{{ fe_claroty_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_claroty_site_error }}
          tags:
            - always
            - rescue

        - name: "claroty/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              claroty/site failed at '{{ fe_claroty_site_failed_task }}': {{ fe_claroty_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "claroty/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_claroty_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_claroty_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "claroty/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "claroty/site":
                  component: "claroty/site"
                  type: "playbook"
                  platform: "claroty"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_claroty_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_claroty_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_claroty_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_claroty_site_started_at | default('') }}"
                  ended_at: "{{ fe_claroty_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_claroty_site_failed_task | default('') }}"
                  error: "{{ fe_claroty_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_claroty_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_claroty_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_claroty_site_status | default('') == 'succeeded' else ['claroty/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_claroty_site_status | default('') == 'failed'
            - not (fe_claroty_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "claroty/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_claroty_site_stats_published: true
          when:
            - fe_claroty_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "claroty/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "claroty/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_claroty_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_claroty_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_claroty_site_status: "running"
            fe_claroty_site_preflight_passed: false
            fe_claroty_site_postflight_passed: false
            fe_claroty_site_failed_task: ""
            fe_claroty_site_error: ""
            fe_claroty_site_stats_published: false
          tags:
            - always

        - name: "claroty/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              claroty/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              claroty/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "claroty/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "claroty/site: required variable '{{ item }}' is not defined."
            success_msg: "claroty/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_claroty_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "claroty/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_claroty_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "claroty/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_claroty_site_status: "preflight_failed"
            fe_claroty_site_postflight_passed: false
            fe_claroty_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_claroty_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "claroty/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              claroty/site: FAILED at '{{ fe_claroty_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_claroty_site_error }}
          tags:
            - always
            - rescue

        - name: "claroty/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "claroty/site":
                  component: "claroty/site"
                  type: "playbook"
                  platform: "claroty"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_claroty_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_claroty_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_claroty_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_claroty_site_started_at | default('') }}"
                  ended_at: "{{ fe_claroty_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_claroty_site_failed_task | default('') }}"
                  error: "{{ fe_claroty_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_claroty_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_claroty_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_claroty_site_status | default('') == 'succeeded' else ['claroty/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "claroty/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_claroty_site_stats_published: true
          tags:
            - always

        - name: "claroty/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              claroty/site failed at '{{ fe_claroty_site_failed_task }}': {{ fe_claroty_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "claroty/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              claroty/site: preflight
              {{ 'passed' if fe_claroty_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "claroty/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "claroty/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_claroty_site_preflight_passed | bool
              - fe_claroty_site_status in ['running', 'succeeded']
            fail_msg: >-
              claroty/site: postflight validation failed - preflight passed
              ={{ fe_claroty_site_preflight_passed | default(false) }},
              status={{ fe_claroty_site_status | default('unknown') }}.
            success_msg: "claroty/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "claroty/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_claroty_site_postflight_passed: true
            fe_claroty_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "claroty/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_claroty_site_status: "failed"
            fe_claroty_site_postflight_passed: false
            fe_claroty_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_claroty_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "claroty/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              claroty/site: FAILED at '{{ fe_claroty_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_claroty_site_error }}
          tags:
            - always
            - rescue

        - name: "claroty/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              claroty/site failed at '{{ fe_claroty_site_failed_task }}': {{ fe_claroty_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "claroty/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_claroty_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_claroty_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_claroty_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "claroty/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "claroty/site":
                  component: "claroty/site"
                  type: "playbook"
                  platform: "claroty"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_claroty_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_claroty_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_claroty_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_claroty_site_started_at | default('') }}"
                  ended_at: "{{ fe_claroty_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_claroty_site_failed_task | default('') }}"
                  error: "{{ fe_claroty_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_claroty_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_claroty_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_claroty_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_claroty_site_status | default('') == 'succeeded' else ['claroty/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_claroty_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "claroty/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_claroty_site_stats_published: true
          tags:
            - always

        - name: "claroty/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              claroty/site: {{ fe_claroty_site_status | default('unknown') }} in
              {{ fe_claroty_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
