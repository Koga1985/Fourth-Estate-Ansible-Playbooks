---
# Inputs (examples):
#   artifacts_dir: "/tmp/pan-artifacts"
#   dry_run: true
#   pa_allow_delete: false
#   pa_use_panorama: false
#   device_group: null
#   vsys: "vsys1"
#   pa_address_objects, pa_address_groups, pa_service_objects, pa_service_groups

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_objects__delete_stale']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_objects__delete_stale_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_objects__delete_stale | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_objects__delete_stale_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_objects__delete_stale_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_objects__delete_stale_status: "running"
    fe_palo_alto_pa_objects__delete_stale_preflight_passed: false
    fe_palo_alto_pa_objects__delete_stale_postflight_passed: false
    fe_palo_alto_pa_objects__delete_stale_failed_task: ""
    fe_palo_alto_pa_objects__delete_stale_error: ""
    fe_palo_alto_pa_objects__delete_stale_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_objects__delete_stale | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_objects__delete_stale | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_objects__delete_stale: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_objects__delete_stale: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_objects__delete_stale | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_objects__delete_stale: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_objects__delete_stale: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_objects__delete_stale_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_objects__delete_stale | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects__delete_stale_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}"
        state: directory
        mode: "0755"

    # Address objects
    - name: Gather address objects
      paloaltonetworks.panos.panos_object_facts:
        object_type: "addresses"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      register: _addrfacts

    - name: Compute stale address objects
      ansible.builtin.set_fact:
        _desired_addr_names: "{{ (pa_address_objects | default([])) | map(attribute='name') | list }}"
        _existing_addr_names: "{{ (_addrfacts.objects | default([])) | map(attribute='name') | list }}"
        _stale_addr_names: "{{ _existing_addr_names | difference(_desired_addr_names) }}"

    - name: Write preview - addresses
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}/stale_addresses.csv"
        mode: "0644"
        content: |
          name
          {% for n in _stale_addr_names %}{{ n }}
          {% endfor %}

    # Address groups
    - name: Gather address groups
      paloaltonetworks.panos.panos_object_facts:
        object_type: "address-groups"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      register: _agfacts

    - name: Compute stale address groups
      ansible.builtin.set_fact:
        _desired_ag_names: "{{ (pa_address_groups | default([])) | map(attribute='name') | list }}"
        _existing_ag_names: "{{ (_agfacts.objects | default([])) | map(attribute='name') | list }}"
        _stale_ag_names: "{{ _existing_ag_names | difference(_desired_ag_names) }}"

    - name: Write preview - address groups
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}/stale_address_groups.csv"
        mode: "0644"
        content: |
          name
          {% for n in _stale_ag_names %}{{ n }}
          {% endfor %}

    # Services
    - name: Gather service objects
      paloaltonetworks.panos.panos_object_facts:
        object_type: "services"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      register: _svcfacts

    - name: Compute stale service objects
      ansible.builtin.set_fact:
        _desired_svc_names: "{{ (pa_service_objects | default([])) | map(attribute='name') | list }}"
        _existing_svc_names: "{{ (_svcfacts.objects | default([])) | map(attribute='name') | list }}"
        _stale_svc_names: "{{ _existing_svc_names | difference(_desired_svc_names) }}"

    - name: Write preview - services
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}/stale_services.csv"
        mode: "0644"
        content: |
          name
          {% for n in _stale_svc_names %}{{ n }}
          {% endfor %}

    # Service groups
    - name: Gather service groups
      paloaltonetworks.panos.panos_object_facts:
        object_type: "service-groups"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      register: _sgfacts

    - name: Compute stale service groups
      ansible.builtin.set_fact:
        _desired_sg_names: "{{ (pa_service_groups | default([])) | map(attribute='name') | list }}"
        _existing_sg_names: "{{ (_sgfacts.objects | default([])) | map(attribute='name') | list }}"
        _stale_sg_names: "{{ _existing_sg_names | difference(_desired_sg_names) }}"

    - name: Write preview - service groups
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}/stale_service_groups.csv"
        mode: "0644"
        content: |
          name
          {% for n in _stale_sg_names %}{{ n }}
          {% endfor %}

    - name: Stop here if dry-run
      when: (dry_run | default(true)) | bool
      ansible.builtin.debug:
        msg: "Dry-run enabled — no deletions performed. CSVs written to {{ artifacts_dir | default('/tmp/pan-artifacts') }}"

    # Destructive (opt-in)
    - name: Guardrail — require explicit pa_allow_delete=true
      when: not (dry_run | default(true)) | bool
      ansible.builtin.assert:
        that: [ pa_allow_delete | default(false) | bool ]
        fail_msg: "Deletion blocked. Set pa_allow_delete: true to proceed."

    - name: Delete stale address objects
      when: not (dry_run | default(true)) | bool
      paloaltonetworks.panos.panos_address_object:
        name: "{{ item }}"
        state: "absent"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      loop: "{{ _stale_addr_names }}"

    - name: Delete stale address groups
      when: not (dry_run | default(true)) | bool
      paloaltonetworks.panos.panos_address_group:
        name: "{{ item }}"
        state: "absent"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      loop: "{{ _stale_ag_names }}"

    - name: Delete stale services
      when: not (dry_run | default(true)) | bool
      paloaltonetworks.panos.panos_service_object:
        name: "{{ item }}"
        state: "absent"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      loop: "{{ _stale_svc_names }}"

    - name: Delete stale service groups
      when: not (dry_run | default(true)) | bool
      paloaltonetworks.panos.panos_service_group:
        name: "{{ item }}"
        state: "absent"
        device_group: "{{ device_group if pa_use_panorama | default(false) else omit }}"
        vsys: "{{ vsys | default('vsys1') if not (pa_use_panorama | default(false)) else omit }}"
      loop: "{{ _stale_sg_names }}"

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_objects__delete_stale | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_objects__delete_stale_preflight_passed | bool
          - fe_palo_alto_pa_objects__delete_stale_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_objects__delete_stale: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_objects__delete_stale_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_objects__delete_stale_status | default('unknown') }}.
        success_msg: "palo_alto/pa_objects__delete_stale: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_objects__delete_stale | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects__delete_stale_postflight_passed: true
        fe_palo_alto_pa_objects__delete_stale_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_objects__delete_stale | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects__delete_stale_status: "failed"
        fe_palo_alto_pa_objects__delete_stale_postflight_passed: false
        fe_palo_alto_pa_objects__delete_stale_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_objects__delete_stale_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_objects__delete_stale | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_objects__delete_stale: FAILED at '{{ fe_palo_alto_pa_objects__delete_stale_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_objects__delete_stale_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_objects__delete_stale | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_objects__delete_stale failed at '{{ fe_palo_alto_pa_objects__delete_stale_failed_task }}': {{ fe_palo_alto_pa_objects__delete_stale_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_objects__delete_stale | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects__delete_stale_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_objects__delete_stale_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_objects__delete_stale_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_objects__delete_stale | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_objects__delete_stale":
              component: "palo_alto/pa_objects__delete_stale"
              type: "tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_objects__delete_stale_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_objects__delete_stale_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_objects__delete_stale_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_objects__delete_stale_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_objects__delete_stale_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_objects__delete_stale_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_objects__delete_stale_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_objects__delete_stale_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_objects__delete_stale_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_objects__delete_stale_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_objects__delete_stale_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_objects__delete_stale_status | default('') == 'succeeded' else ['palo_alto/pa_objects__delete_stale'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_objects__delete_stale | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects__delete_stale_stats_published: true
      tags:
        - always
