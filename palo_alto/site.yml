---
# Palo Alto Networks Deployment Playbook
# Entry point for PAN-OS and Panorama automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Palo Alto Networks Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_baseline: true
    deploy_objects: true
    deploy_network: true
    deploy_security: true
    deploy_ssl_decryption: true
    deploy_vpn_ipsec: true
    deploy_vpn_remote: false
    deploy_userid: true
    deploy_logging: true
    deploy_panorama: true

  tasks:
    # =========================================
    # Phase 1: Platform Baseline
    # =========================================
    - name: "palo_alto/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Platform Baseline
          ansible.builtin.include_role:
            name: pa_platform_baseline
          when: deploy_baseline | bool
          tags: ['baseline', 'phase1']

        # =========================================
        # Phase 2: Objects
        # =========================================
        - name: Phase 2 - Objects Catalog
          ansible.builtin.include_role:
            name: pa_objects_catalog
          when: deploy_objects | bool
          tags: ['objects', 'phase2']

        - name: Phase 2 - PAN-OS Objects
          ansible.builtin.include_role:
            name: panos_objects
          when: deploy_objects | bool
          tags: ['objects', 'phase2']

        # =========================================
        # Phase 3: Network
        # =========================================
        - name: Phase 3 - Network Fabric
          ansible.builtin.include_role:
            name: pa_network_fabric
          when: deploy_network | bool
          tags: ['network', 'phase3']

        - name: Phase 3 - PAN-OS Network Config
          ansible.builtin.include_role:
            name: panos_network_config
          when: deploy_network | bool
          tags: ['network', 'phase3']

        # =========================================
        # Phase 4: Security & Protection
        # =========================================
        - name: Phase 4 - Protection & QoS
          ansible.builtin.include_role:
            name: pa_protection_qos
          when: deploy_security | bool
          tags: ['security', 'phase4']

        - name: Phase 4 - SSL Decryption
          ansible.builtin.include_role:
            name: pa_ssl_decryption
          when: deploy_ssl_decryption | bool
          tags: ['security', 'ssl', 'phase4']

        # =========================================
        # Phase 5: VPN
        # =========================================
        - name: Phase 5 - IPSec VPN
          ansible.builtin.include_role:
            name: pa_vpn_ipsec
          when: deploy_vpn_ipsec | bool
          tags: ['vpn', 'ipsec', 'phase5']

        - name: Phase 5 - Remote Access VPN
          ansible.builtin.include_role:
            name: pa_vpn_remoteaccess
          when: deploy_vpn_remote | bool
          tags: ['vpn', 'remote', 'phase5']

        # =========================================
        # Phase 6: User-ID
        # =========================================
        - name: Phase 6 - User-ID Identity
          ansible.builtin.include_role:
            name: pa_userid_identity
          when: deploy_userid | bool
          tags: ['userid', 'phase6']

        # =========================================
        # Phase 7: Logging & Telemetry
        # =========================================
        - name: Phase 7 - Logging Telemetry
          ansible.builtin.include_role:
            name: pa_logging_telemetry
          when: deploy_logging | bool
          tags: ['logging', 'phase7']

        # =========================================
        # Phase 8: Panorama Fleet Management
        # =========================================
        - name: Phase 8 - Panorama Fleet Package
          ansible.builtin.include_role:
            name: panorama_fleet_package
          when: deploy_panorama | bool
          tags: ['panorama', 'phase8']

        - name: Phase 8 - PAN-OS System Config
          ansible.builtin.include_role:
            name: panos_system_config
          tags: ['system', 'phase8']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== Palo Alto Networks Deployment Complete ==="
              - "SSL Decryption: {{ 'Enabled' if deploy_ssl_decryption else 'Disabled' }}"
              - "User-ID: {{ 'Enabled' if deploy_userid else 'Disabled' }}"
              - "VPN IPSec: {{ 'Configured' if deploy_vpn_ipsec else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "palo_alto/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_site_status: "failed"
            fe_palo_alto_site_postflight_passed: false
            fe_palo_alto_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/site: FAILED at '{{ fe_palo_alto_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_site_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/site failed at '{{ fe_palo_alto_site_failed_task }}': {{ fe_palo_alto_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_palo_alto_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "palo_alto/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/site":
                  component: "palo_alto/site"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_site_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_site_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_site_status | default('') == 'succeeded' else ['palo_alto/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_palo_alto_site_status | default('') == 'failed'
            - not (fe_palo_alto_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "palo_alto/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_site_stats_published: true
          when:
            - fe_palo_alto_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "palo_alto/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "palo_alto/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_palo_alto_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_palo_alto_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_site_status: "running"
            fe_palo_alto_site_preflight_passed: false
            fe_palo_alto_site_postflight_passed: false
            fe_palo_alto_site_failed_task: ""
            fe_palo_alto_site_error: ""
            fe_palo_alto_site_stats_published: false
          tags:
            - always

        - name: "palo_alto/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              palo_alto/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              palo_alto/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "palo_alto/site: required variable '{{ item }}' is not defined."
            success_msg: "palo_alto/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_palo_alto_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_palo_alto_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "palo_alto/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_site_status: "preflight_failed"
            fe_palo_alto_site_postflight_passed: false
            fe_palo_alto_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/site: FAILED at '{{ fe_palo_alto_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_site_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/site":
                  component: "palo_alto/site"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_site_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_site_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_site_status | default('') == 'succeeded' else ['palo_alto/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "palo_alto/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_site_stats_published: true
          tags:
            - always

        - name: "palo_alto/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/site failed at '{{ fe_palo_alto_site_failed_task }}': {{ fe_palo_alto_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              palo_alto/site: preflight
              {{ 'passed' if fe_palo_alto_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "palo_alto/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "palo_alto/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_palo_alto_site_preflight_passed | bool
              - fe_palo_alto_site_status in ['running', 'succeeded']
            fail_msg: >-
              palo_alto/site: postflight validation failed - preflight passed
              ={{ fe_palo_alto_site_preflight_passed | default(false) }},
              status={{ fe_palo_alto_site_status | default('unknown') }}.
            success_msg: "palo_alto/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "palo_alto/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_palo_alto_site_postflight_passed: true
            fe_palo_alto_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "palo_alto/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_site_status: "failed"
            fe_palo_alto_site_postflight_passed: false
            fe_palo_alto_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/site: FAILED at '{{ fe_palo_alto_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_site_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/site failed at '{{ fe_palo_alto_site_failed_task }}': {{ fe_palo_alto_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_palo_alto_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "palo_alto/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/site":
                  component: "palo_alto/site"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_site_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_site_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_site_status | default('') == 'succeeded' else ['palo_alto/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_palo_alto_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "palo_alto/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_site_stats_published: true
          tags:
            - always

        - name: "palo_alto/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              palo_alto/site: {{ fe_palo_alto_site_status | default('unknown') }} in
              {{ fe_palo_alto_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
