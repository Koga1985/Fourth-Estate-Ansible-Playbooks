---
# Requires: paloaltonetworks.panos collection
# Inputs (examples):
#   artifacts_dir: "/tmp/pan-artifacts"
#   vsys: "vsys1"                       # for firewalls
#   pa_use_panorama: false              # true if running against Panorama
#   device_group: "Shared-Services"     # when pa_use_panorama: true
# Notes:
#   Uses an operational command via panos_op to fetch hit counts.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_policy__hitcount_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_policy__hitcount_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_policy__hitcount_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_policy__hitcount_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_policy__hitcount_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_policy__hitcount_report_status: "running"
    fe_palo_alto_pa_policy__hitcount_report_preflight_passed: false
    fe_palo_alto_pa_policy__hitcount_report_postflight_passed: false
    fe_palo_alto_pa_policy__hitcount_report_failed_task: ""
    fe_palo_alto_pa_policy__hitcount_report_error: ""
    fe_palo_alto_pa_policy__hitcount_report_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_policy__hitcount_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_policy__hitcount_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_policy__hitcount_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_policy__hitcount_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_policy__hitcount_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_policy__hitcount_report: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_policy__hitcount_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_policy__hitcount_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_policy__hitcount_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_policy__hitcount_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Fetch security rule hit counts (firewall)
      when: not (pa_use_panorama | default(false)) | bool
      paloaltonetworks.panos.panos_op:
        cmd: |-
          <show>
            <rule-hit-count>
              <vsys>{{ vsys | default('vsys1') }}</vsys>
              <rulebase>security</rulebase>
              <type>all</type>
            </rule-hit-count>
          </show>
      register: _hc_fw

    - name: Fetch security rule hit counts (Panorama)
      when: pa_use_panorama | default(false) | bool
      paloaltonetworks.panos.panos_op:
        cmd: |-
          <show>
            <device-group>
              <name>{{ device_group }}</name>
              <pre-rulebase>
                <security>
                  <hit-count>
                    <type>all</type>
                  </hit-count>
                </security>
              </pre-rulebase>
            </device-group>
          </show>
      register: _hc_pano

    - name: Normalize hitcount XML to list
      ansible.builtin.set_fact:
        _hc_rules: >-
          {{
            (_hc_fw.stdout_xml.response.result | default({})) 
            | default((_hc_pano.stdout_xml.response.result | default({}))) 
          }}

    # NOTE: The exact XML structure can differ by PAN-OS. We handle common cases.
    - name: Build CSV from common hitcount fields
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pan-artifacts') }}/policy_hitcount.csv"
        mode: "0644"
        content: |
          name,hit_count,last_hit,first_hit,rule_uuid
          {% set rules = (_hc_rules.rule | default(_hc_rules.rules | default([]))) %}
          {% for r in (rules if rules is iterable else []) %}
          {{ (r.name | default('')) | replace(',',';') }},{{ r.hit-count | default('0') }},{{ r.get('last-hit-timestamp','') }},{{ r.get('first-hit-timestamp','') }},{{ r.get('uuid','') }}
          {% endfor %}

    - name: Tell user where CSV is
      ansible.builtin.debug:
        msg: "Hitcount CSV written to {{ artifacts_dir | default('/tmp/pan-artifacts') }}/policy_hitcount.csv"

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_policy__hitcount_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_policy__hitcount_report_preflight_passed | bool
          - fe_palo_alto_pa_policy__hitcount_report_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_policy__hitcount_report: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_policy__hitcount_report_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_policy__hitcount_report_status | default('unknown') }}.
        success_msg: "palo_alto/pa_policy__hitcount_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_policy__hitcount_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_policy__hitcount_report_postflight_passed: true
        fe_palo_alto_pa_policy__hitcount_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_policy__hitcount_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_policy__hitcount_report_status: "failed"
        fe_palo_alto_pa_policy__hitcount_report_postflight_passed: false
        fe_palo_alto_pa_policy__hitcount_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_policy__hitcount_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_policy__hitcount_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_policy__hitcount_report: FAILED at '{{ fe_palo_alto_pa_policy__hitcount_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_policy__hitcount_report_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_policy__hitcount_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_policy__hitcount_report failed at '{{ fe_palo_alto_pa_policy__hitcount_report_failed_task }}': {{ fe_palo_alto_pa_policy__hitcount_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_policy__hitcount_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_policy__hitcount_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_policy__hitcount_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_policy__hitcount_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_policy__hitcount_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_policy__hitcount_report":
              component: "palo_alto/pa_policy__hitcount_report"
              type: "tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_policy__hitcount_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_policy__hitcount_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_policy__hitcount_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_policy__hitcount_report_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_policy__hitcount_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_policy__hitcount_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_policy__hitcount_report_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_policy__hitcount_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_policy__hitcount_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_policy__hitcount_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_policy__hitcount_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_policy__hitcount_report_status | default('') == 'succeeded' else ['palo_alto/pa_policy__hitcount_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_policy__hitcount_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_policy__hitcount_report_stats_published: true
      tags:
        - always
