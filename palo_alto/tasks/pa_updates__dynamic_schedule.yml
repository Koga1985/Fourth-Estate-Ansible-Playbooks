---
# Inputs:
#   du_schedule:
#     content: { recurring: "daily", at: "03:30" }
#     antivirus: { recurring: "hourly" }
#     wildfire: { recurring: "every-15-min" }
#     url_filtering: { recurring: "daily", at: "04:10" }
#   run_now: false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_updates__dynamic_schedule']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_updates__dynamic_schedule_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_updates__dynamic_schedule | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_updates__dynamic_schedule_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_updates__dynamic_schedule_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_updates__dynamic_schedule_status: "running"
    fe_palo_alto_pa_updates__dynamic_schedule_preflight_passed: false
    fe_palo_alto_pa_updates__dynamic_schedule_postflight_passed: false
    fe_palo_alto_pa_updates__dynamic_schedule_failed_task: ""
    fe_palo_alto_pa_updates__dynamic_schedule_error: ""
    fe_palo_alto_pa_updates__dynamic_schedule_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_updates__dynamic_schedule | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_updates__dynamic_schedule | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_updates__dynamic_schedule: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_updates__dynamic_schedule: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_updates__dynamic_schedule | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_updates__dynamic_schedule: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_updates__dynamic_schedule: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_updates__dynamic_schedule_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_updates__dynamic_schedule | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_updates__dynamic_schedule_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure dynamic update schedule (PAN-OS)
      when: du_schedule is defined
      paloaltonetworks.panos.panos_dynamic_update_schedule:
        antivirus: "{{ du_schedule.antivirus | default(omit) }}"
        content: "{{ du_schedule.content | default(omit) }}"
        wildfire: "{{ du_schedule.wildfire | default(omit) }}"
        url_filtering: "{{ du_schedule.url_filtering | default(omit) }}"
        commit: false

    - name: (Optional) Trigger content update now
      when: run_now | default(false) | bool
      paloaltonetworks.panos.panos_dynamic_updates:
        update_module: "all"
        install: true
        download: true
        skip_commit: true

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_updates__dynamic_schedule | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_updates__dynamic_schedule_preflight_passed | bool
          - fe_palo_alto_pa_updates__dynamic_schedule_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_updates__dynamic_schedule: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_updates__dynamic_schedule_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_updates__dynamic_schedule_status | default('unknown') }}.
        success_msg: "palo_alto/pa_updates__dynamic_schedule: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_updates__dynamic_schedule | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_updates__dynamic_schedule_postflight_passed: true
        fe_palo_alto_pa_updates__dynamic_schedule_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_updates__dynamic_schedule | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_updates__dynamic_schedule_status: "failed"
        fe_palo_alto_pa_updates__dynamic_schedule_postflight_passed: false
        fe_palo_alto_pa_updates__dynamic_schedule_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_updates__dynamic_schedule_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_updates__dynamic_schedule | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_updates__dynamic_schedule: FAILED at '{{ fe_palo_alto_pa_updates__dynamic_schedule_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_updates__dynamic_schedule_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_updates__dynamic_schedule | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_updates__dynamic_schedule failed at '{{ fe_palo_alto_pa_updates__dynamic_schedule_failed_task }}': {{ fe_palo_alto_pa_updates__dynamic_schedule_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_updates__dynamic_schedule | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_updates__dynamic_schedule_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_updates__dynamic_schedule_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_updates__dynamic_schedule_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_updates__dynamic_schedule | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_updates__dynamic_schedule":
              component: "palo_alto/pa_updates__dynamic_schedule"
              type: "tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_updates__dynamic_schedule_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_updates__dynamic_schedule_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_updates__dynamic_schedule_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_updates__dynamic_schedule_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_updates__dynamic_schedule_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_updates__dynamic_schedule_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_updates__dynamic_schedule_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_updates__dynamic_schedule_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_updates__dynamic_schedule_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_updates__dynamic_schedule_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_updates__dynamic_schedule_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_updates__dynamic_schedule_status | default('') == 'succeeded' else ['palo_alto/pa_updates__dynamic_schedule'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_updates__dynamic_schedule | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_updates__dynamic_schedule_stats_published: true
      tags:
        - always
