---
# tasks file for panos_system_config
# Comprehensive system configuration for Palo Alto Networks firewalls
# Fourth Estate hardened configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/panos_system_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_panos_system_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/panos_system_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_panos_system_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_panos_system_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_panos_system_config_status: "running"
    fe_palo_alto_panos_system_config_preflight_passed: false
    fe_palo_alto_panos_system_config_postflight_passed: false
    fe_palo_alto_panos_system_config_failed_task: ""
    fe_palo_alto_panos_system_config_error: ""
    fe_palo_alto_panos_system_config_stats_published: false
  tags:
    - always

- name: "palo_alto/panos_system_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/panos_system_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/panos_system_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/panos_system_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/panos_system_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/panos_system_config: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/panos_system_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_panos_system_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/panos_system_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_panos_system_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set system hostname
      paloaltonetworks.panos.panos_mgtconfig:
        provider: "{{ panos_provider }}"
        hostname: "{{ panos_hostname }}"
        domain: "{{ panos_domain }}"
        dns_server_primary: "{{ panos_dns_primary }}"
        dns_server_secondary: "{{ panos_dns_secondary }}"
        ntp_server_primary: "{{ panos_ntp_primary }}"
        ntp_server_secondary: "{{ panos_ntp_secondary }}"
        timezone: "{{ panos_timezone }}"
      notify: commit panos configuration
      tags:
        - system
        - hostname

    - name: Configure login banner
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: |
          <login-banner>{{ panos_login_banner }}</login-banner>
      notify: commit panos configuration
      tags:
        - system
        - banner

    - name: Configure session timeout settings
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/management"
        element: |
          <idle-timeout>{{ panos_idle_timeout }}</idle-timeout>
      notify: commit panos configuration
      tags:
        - system
        - timeout

    - name: Configure password profile
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/mgt-config/password-complexity"
        element: |
          <enabled>yes</enabled>
          <minimum-length>{{ panos_password_min_length }}</minimum-length>
          <minimum-uppercase-letters>{{ panos_password_min_uppercase }}</minimum-uppercase-letters>
          <minimum-lowercase-letters>{{ panos_password_min_lowercase }}</minimum-lowercase-letters>
          <minimum-numeric-letters>{{ panos_password_min_numeric }}</minimum-numeric-letters>
          <minimum-special-characters>{{ panos_password_min_special }}</minimum-special-characters>
          <block-repeated-characters>{{ panos_password_block_repeated }}</block-repeated-characters>
          <block-username-inclusion>yes</block-username-inclusion>
          <password-history-count>{{ panos_password_history_count }}</password-history-count>
          <new-password-differs-by-characters>{{ panos_password_differs_by }}</new-password-differs-by-characters>
          <password-change-on-first-login>yes</password-change-on-first-login>
          <expiration-period>{{ panos_password_expiration_days }}</expiration-period>
          <expiration-warning-period>{{ panos_password_expiration_warning_days }}</expiration-warning-period>
          <post-expiration-admin-login-count>{{ panos_password_post_expiration_logins }}</post-expiration-admin-login-count>
          <post-expiration-grace-period>{{ panos_password_post_expiration_grace_days }}</post-expiration-grace-period>
      notify: commit panos configuration
      tags:
        - system
        - password

    - name: Create administrator accounts
      paloaltonetworks.panos.panos_administrator:
        provider: "{{ panos_provider }}"
        admin_username: "{{ item.username }}"
        admin_password: "{{ item.password | default(omit) }}"
        superuser: "{{ item.superuser | default(false) }}"
        role: "{{ item.role | default(omit) }}"
        password_profile: "{{ item.password_profile | default(omit) }}"
        authentication_profile: "{{ item.auth_profile | default(omit) }}"
        state: present
      loop: "{{ panos_administrators }}"
      no_log: true
      notify: commit panos configuration
      tags:
        - system
        - admin
      when: panos_administrators is defined

    - name: Configure RADIUS authentication profile for MFA
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/authentication-profile"
        element: |
          <entry name="{{ item.name }}">
            <method>
              <radius>
                <server-profile>{{ item.server_profile }}</server-profile>
                <use-userlist-as-fallback>{{ item.fallback_local | default('no') }}</use-userlist-as-fallback>
              </radius>
            </method>
            <lockout>
              <failed-attempts>{{ item.lockout_attempts | default('3') }}</failed-attempts>
              <lockout-time>{{ item.lockout_time | default('30') }}</lockout-time>
            </lockout>
          </entry>
      loop: "{{ panos_radius_profiles }}"
      notify: commit panos configuration
      tags:
        - system
        - radius
        - mfa
      when: panos_radius_profiles is defined

    - name: Configure RADIUS server profiles
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/server-profile/radius"
        element: |
          <entry name="{{ item.name }}">
            <protocol>
              <{% if item.protocol == 'CHAP' %}CHAP{% else %}PAP{% endif %}>
                <timeout>{{ item.timeout | default('5') }}</timeout>
                <retries>{{ item.retries | default('3') }}</retries>
              </{% if item.protocol == 'CHAP' %}CHAP{% else %}PAP{% endif %}>
            </protocol>
            <server>
              {% for server in item.servers %}
              <entry name="{{ server.name }}">
                <ip-address>{{ server.ip }}</ip-address>
                <secret>{{ server.secret }}</secret>
                <port>{{ server.port | default('1812') }}</port>
              </entry>
              {% endfor %}
            </server>
          </entry>
      loop: "{{ panos_radius_server_profiles }}"
      no_log: true
      notify: commit panos configuration
      tags:
        - system
        - radius
      when: panos_radius_server_profiles is defined

    - name: Configure TACACS+ authentication profile
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/authentication-profile"
        element: |
          <entry name="{{ item.name }}">
            <method>
              <tacplus>
                <server-profile>{{ item.server_profile }}</server-profile>
                <use-userlist-as-fallback>{{ item.fallback_local | default('no') }}</use-userlist-as-fallback>
              </tacplus>
            </method>
            <lockout>
              <failed-attempts>{{ item.lockout_attempts | default('3') }}</failed-attempts>
              <lockout-time>{{ item.lockout_time | default('30') }}</lockout-time>
            </lockout>
          </entry>
      loop: "{{ panos_tacacs_profiles }}"
      notify: commit panos configuration
      tags:
        - system
        - tacacs
        - mfa
      when: panos_tacacs_profiles is defined

    - name: Configure TACACS+ server profiles
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/server-profile/tacplus"
        element: |
          <entry name="{{ item.name }}">
            <timeout>{{ item.timeout | default('5') }}</timeout>
            <server>
              {% for server in item.servers %}
              <entry name="{{ server.name }}">
                <ip-address>{{ server.ip }}</ip-address>
                <secret>{{ server.secret }}</secret>
                <port>{{ server.port | default('49') }}</port>
              </entry>
              {% endfor %}
            </server>
          </entry>
      loop: "{{ panos_tacacs_server_profiles }}"
      no_log: true
      notify: commit panos configuration
      tags:
        - system
        - tacacs
      when: panos_tacacs_server_profiles is defined

    - name: Configure SNMPv3 settings
      paloaltonetworks.panos.panos_snmp_v3_server:
        provider: "{{ panos_provider }}"
        snmp_name: "{{ item.name }}"
        snmp_engineid: "{{ item.engine_id | default(omit) }}"
        snmp_authpwd: "{{ item.auth_password }}"
        snmp_privpwd: "{{ item.priv_password }}"
        snmp_version: "{{ item.version | default('v3') }}"
        snmp_v3_privprotocol: "{{ item.priv_protocol | default('AES256') }}"
        snmp_v3_authprotocol: "{{ item.auth_protocol | default('SHA256') }}"
        snmp_v3_securitylevel: "{{ item.security_level | default('authPriv') }}"
        manager: "{{ item.manager }}"
      loop: "{{ panos_snmp_v3_servers }}"
      no_log: true
      notify: commit panos configuration
      tags:
        - system
        - snmp
      when: panos_snmp_v3_servers is defined

    - name: Configure certificate import
      paloaltonetworks.panos.panos_import:
        provider: "{{ panos_provider }}"
        category: "certificate"
        certificate_name: "{{ item.name }}"
        format: "{{ item.format | default('pem') }}"
        filename: "{{ item.filename }}"
        passphrase: "{{ item.passphrase | default(omit) }}"
      loop: "{{ panos_certificates }}"
      no_log: true
      notify: commit panos configuration
      tags:
        - system
        - certificates
      when: panos_certificates is defined

    - name: Configure SSL/TLS service profile for management
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/ssl-tls-service-profile"
        element: |
          <entry name="{{ panos_mgmt_ssl_profile }}">
            <protocol-settings>
              <min-version>{{ panos_mgmt_ssl_min_version }}</min-version>
              <max-version>{{ panos_mgmt_ssl_max_version }}</max-version>
            </protocol-settings>
            <certificate>{{ panos_mgmt_ssl_certificate }}</certificate>
          </entry>
      notify: commit panos configuration
      tags:
        - system
        - ssl
      when: panos_mgmt_ssl_profile is defined

    - name: Configure syslog forwarding to SIEM
      paloaltonetworks.panos.panos_syslog_server:
        provider: "{{ panos_provider }}"
        name: "{{ item.name }}"
        server: "{{ item.server }}"
        transport: "{{ item.transport | default('TCP') }}"
        port: "{{ item.port | default('514') }}"
        format: "{{ item.format | default('BSD') }}"
        facility: "{{ item.facility | default('LOG_USER') }}"
      loop: "{{ panos_syslog_servers }}"
      notify: commit panos configuration
      tags:
        - system
        - syslog
      when: panos_syslog_servers is defined

    - name: Configure syslog profiles for system events
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/shared/log-settings/syslog"
        element: |
          <entry name="{{ item.name }}">
            <server>
              {% for server in item.servers %}
              <entry name="{{ server.name }}">
                <server>{{ server.name }}</server>
                <transport>{{ server.transport | default('TCP') }}</transport>
                <port>{{ server.port | default('514') }}</port>
                <format>{{ server.format | default('BSD') }}</format>
                <facility>{{ server.facility | default('LOG_USER') }}</facility>
              </entry>
              {% endfor %}
            </server>
            <format>
              <config>
                <escaping>
                  <escape-character>\</escape-character>
                  <escaped-characters>"</escaped-characters>
                </escaping>
              </config>
              <system>
                <escaping>
                  <escape-character>\</escape-character>
                  <escaped-characters>"</escaped-characters>
                </escaping>
              </system>
            </format>
          </entry>
      loop: "{{ panos_syslog_profiles }}"
      notify: commit panos configuration
      tags:
        - system
        - syslog
      when: panos_syslog_profiles is defined

    - name: Enable automatic security updates
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/update-schedule"
        element: |
          <threats>
            <recurring>
              <{{ panos_threat_update_schedule }}>
                <action>download-and-install</action>
                <at>{{ panos_threat_update_time }}</at>
                <threshold>{{ panos_threat_update_threshold }}</threshold>
              </{{ panos_threat_update_schedule }}>
            </recurring>
          </threats>
          <anti-virus>
            <recurring>
              <{{ panos_av_update_schedule }}>
                <action>download-and-install</action>
                <at>{{ panos_av_update_time }}</at>
              </{{ panos_av_update_schedule }}>
            </recurring>
          </anti-virus>
          <wildfire>
            <recurring>
              <every-15-mins>
                <action>download-and-install</action>
              </every-15-mins>
            </recurring>
          </wildfire>
      notify: commit panos configuration
      tags:
        - system
        - updates

    - name: Configure permitted IP addresses for management
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/mgt-config"
        element: |
          <permitted-ip>
            {% for ip in panos_permitted_mgmt_ips %}
            <entry name="{{ ip }}"/>
            {% endfor %}
          </permitted-ip>
      notify: commit panos configuration
      tags:
        - system
        - management
      when: panos_permitted_mgmt_ips is defined and panos_permitted_mgmt_ips | length > 0

    - name: Disable unused management services
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system/service"
        element: |
          <disable-telnet>yes</disable-telnet>
          <disable-http>yes</disable-http>
          <disable-snmp>{{ 'no' if panos_enable_snmp else 'yes' }}</disable-snmp>
      notify: commit panos configuration
      tags:
        - system
        - hardening

    - name: Configure audit comment requirement
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/mgt-config"
        element: |
          <require-audit-comment>yes</require-audit-comment>
      notify: commit panos configuration
      tags:
        - system
        - audit

    - name: Enable management profile logging
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: |
          <management-log-rate>high</management-log-rate>
      notify: commit panos configuration
      tags:
        - system
        - logging

    - name: Configure global timeout settings
      paloaltonetworks.panos.panos_config_element:
        provider: "{{ panos_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/setting/session"
        element: |
          <timeout>{{ panos_global_session_timeout }}</timeout>
      notify: commit panos configuration
      tags:
        - system
        - timeout

    # ----------------------------- postflight -------------------

    - name: "palo_alto/panos_system_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_panos_system_config_preflight_passed | bool
          - fe_palo_alto_panos_system_config_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/panos_system_config: postflight validation failed - preflight passed
          ={{ fe_palo_alto_panos_system_config_preflight_passed | default(false) }},
          status={{ fe_palo_alto_panos_system_config_status | default('unknown') }}.
        success_msg: "palo_alto/panos_system_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/panos_system_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_panos_system_config_postflight_passed: true
        fe_palo_alto_panos_system_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/panos_system_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_panos_system_config_status: "failed"
        fe_palo_alto_panos_system_config_postflight_passed: false
        fe_palo_alto_panos_system_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_panos_system_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/panos_system_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/panos_system_config: FAILED at '{{ fe_palo_alto_panos_system_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_panos_system_config_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/panos_system_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/panos_system_config failed at '{{ fe_palo_alto_panos_system_config_failed_task }}': {{ fe_palo_alto_panos_system_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/panos_system_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_panos_system_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_panos_system_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_panos_system_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/panos_system_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/panos_system_config":
              component: "palo_alto/panos_system_config"
              type: "role"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_panos_system_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_panos_system_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_panos_system_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_panos_system_config_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_panos_system_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_panos_system_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_panos_system_config_failed_task | default('') }}"
              error: "{{ fe_palo_alto_panos_system_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_panos_system_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_panos_system_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_panos_system_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_panos_system_config_status | default('') == 'succeeded' else ['palo_alto/panos_system_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/panos_system_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_panos_system_config_stats_published: true
      tags:
        - always
