---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_objects_catalog/prune']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_objects_catalog_prune_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_objects_catalog/prune | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_objects_catalog_prune_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_objects_catalog_prune_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_objects_catalog_prune_status: "running"
    fe_palo_alto_pa_objects_catalog_prune_preflight_passed: false
    fe_palo_alto_pa_objects_catalog_prune_postflight_passed: false
    fe_palo_alto_pa_objects_catalog_prune_failed_task: ""
    fe_palo_alto_pa_objects_catalog_prune_error: ""
    fe_palo_alto_pa_objects_catalog_prune_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_objects_catalog/prune | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_objects_catalog/prune | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_objects_catalog/prune: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_objects_catalog/prune: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_objects_catalog/prune | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_objects_catalog/prune: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_objects_catalog/prune: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_objects_catalog_prune_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_objects_catalog/prune | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects_catalog_prune_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Gather address objects
      paloaltonetworks.panos.panos_object_facts:
        object_type: "addresses"
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
      register: _addrfacts

    - name: Gather service objects
      paloaltonetworks.panos.panos_object_facts:
        object_type: "services"
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
      register: _svcfacts

    - name: Compute stale lists
      ansible.builtin.set_fact:
        _desired_addr: "{{ (address_objects | default([])) | map(attribute='name') | list }}"
        _desired_svc: "{{ (service_objects | default([])) | map(attribute='name') | list }}"
        _existing_addr: "{{ (_addrfacts.objects | default([])) | map(attribute='name') | list }}"
        _existing_svc: "{{ (_svcfacts.objects | default([])) | map(attribute='name') | list }}"
        _stale_addr: "{{ _existing_addr | difference(_desired_addr + prune.protected_names) }}"
        _stale_svc: "{{ _existing_svc | difference(_desired_svc + prune.protected_names) }}"

    - name: Write previews
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/objects_prune_preview.txt"
        mode: "0644"
        content: |
          Stale addresses:
          {% for n in _stale_addr %}- {{ n }}
          {% endfor %}
          Stale services:
          {% for n in _stale_svc %}- {{ n }}
          {% endfor %}

    - name: Stop if dry-run or deletions not allowed
      when: prune.dry_run | default(true) | bool or not (prune.allow_delete | default(false) | bool)
      ansible.builtin.debug:
        msg: "Dry-run or deletion not allowed. Preview written to {{ artifacts_dir }}/objects_prune_preview.txt"

    - name: Delete stale address objects
      when: not (prune.dry_run | default(true) | bool) and (prune.allow_delete | default(false) | bool)
      paloaltonetworks.panos.panos_address_object:
        name: "{{ item }}"
        state: absent
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
      loop: "{{ _stale_addr }}"

    - name: Delete stale service objects
      when: not (prune.dry_run | default(true) | bool) and (prune.allow_delete | default(false) | bool)
      paloaltonetworks.panos.panos_service_object:
        name: "{{ item }}"
        state: absent
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
      loop: "{{ _stale_svc }}"

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_objects_catalog/prune | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_objects_catalog_prune_preflight_passed | bool
          - fe_palo_alto_pa_objects_catalog_prune_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_objects_catalog/prune: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_objects_catalog_prune_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_objects_catalog_prune_status | default('unknown') }}.
        success_msg: "palo_alto/pa_objects_catalog/prune: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_objects_catalog/prune | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects_catalog_prune_postflight_passed: true
        fe_palo_alto_pa_objects_catalog_prune_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_objects_catalog/prune | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects_catalog_prune_status: "failed"
        fe_palo_alto_pa_objects_catalog_prune_postflight_passed: false
        fe_palo_alto_pa_objects_catalog_prune_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_objects_catalog_prune_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_objects_catalog/prune | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_objects_catalog/prune: FAILED at '{{ fe_palo_alto_pa_objects_catalog_prune_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_objects_catalog_prune_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_objects_catalog/prune | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_objects_catalog/prune failed at '{{ fe_palo_alto_pa_objects_catalog_prune_failed_task }}': {{ fe_palo_alto_pa_objects_catalog_prune_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_objects_catalog/prune | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects_catalog_prune_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_objects_catalog_prune_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_objects_catalog_prune_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_objects_catalog/prune | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_objects_catalog/prune":
              component: "palo_alto/pa_objects_catalog/prune"
              type: "role-tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_objects_catalog_prune_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_objects_catalog_prune_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_objects_catalog_prune_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_objects_catalog_prune_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_objects_catalog_prune_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_objects_catalog_prune_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_objects_catalog_prune_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_objects_catalog_prune_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_objects_catalog_prune_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_objects_catalog_prune_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_objects_catalog_prune_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_objects_catalog_prune_status | default('') == 'succeeded' else ['palo_alto/pa_objects_catalog/prune'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_objects_catalog/prune | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_objects_catalog_prune_stats_published: true
      tags:
        - always
