---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: pan_firewalls
  gather_facts: false
  roles:
    - role: pa_protection_qos
      vars:
        zpp_profiles:
          - name: "ZPP-Internet"
            flood: { syn: { enable: true, red: true, alarm_rate: 1000, activate_rate: 2000, maximal_rate: 4000 } }
        zpp_zone_bindings:
          - { zone: "untrust", profile: "ZPP-Internet" }
        dos_profiles:
          - { name: "DoS-Agg-HTTPS", type: "aggregate", max_rate: 50000, block_duration: 60 }
        dos_rules:
          - name: "DoS-from-Internet"
            from_zones: ["untrust"]
            to_zones: ["dmz"]
            source: ["any"]
            destination: ["any"]
            services: ["service-https"]
            action: "protect"
            type: "aggregate"
            profile: "DoS-Agg-HTTPS"
        qos_profiles:
          - name: "QoS-Default"
            class_bandwidth: { class1: 10000, class2: 5000, class3: 1000 }
        qos_policies:
          - name: "QoS-Web"
            from_zones: ["trust"]
            to_zones: ["untrust"]
            applications: ["web-browsing","ssl"]
            services: ["application-default"]
            class: "class2"
            interface: "ethernet1/1"
  pre_tasks:
    - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Initialize validation state"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status: "running"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed: false
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed: false
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task: ""
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error: ""
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published: false
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "palo_alto/pa_protection_qos/pa_protection_qos.example: required variable '{{ item }}' is not defined."
            success_msg: "palo_alto/pa_protection_qos/pa_protection_qos.example: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status: "preflight_failed"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed: false
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: FAILED at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/pa_protection_qos/pa_protection_qos.example":
                  component: "palo_alto/pa_protection_qos/pa_protection_qos.example"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else ['palo_alto/pa_protection_qos/pa_protection_qos.example'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published: true
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example failed at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}': {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: preflight
              {{ 'passed' if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | bool
              - fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status in ['running', 'succeeded']
            fail_msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: postflight validation failed - preflight passed
              ={{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | default(false) }},
              status={{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('unknown') }}.
            success_msg: "palo_alto/pa_protection_qos/pa_protection_qos.example: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed: true
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status: "failed"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed: false
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: FAILED at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example failed at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}': {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_protection_qos_pa_protection_qos_example_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/pa_protection_qos/pa_protection_qos.example":
                  component: "palo_alto/pa_protection_qos/pa_protection_qos.example"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else ['palo_alto/pa_protection_qos/pa_protection_qos.example'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published | default(false) | bool)
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published: true
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('unknown') }} in
              {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Guarded execution with rescue and always handling"
      block:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status: "failed"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed: false
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example: FAILED at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/pa_protection_qos/pa_protection_qos.example failed at '{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task }}': {{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_protection_qos_pa_protection_qos_example_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/pa_protection_qos/pa_protection_qos.example":
                  component: "palo_alto/pa_protection_qos/pa_protection_qos.example"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_pa_protection_qos_pa_protection_qos_example_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'succeeded' else ['palo_alto/pa_protection_qos/pa_protection_qos.example'] }}
            aggregate: true
            per_host: false
          when:
            - fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'failed'
            - not (fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published | default(false) | bool)
          tags:
            - always

        - name: "palo_alto/pa_protection_qos/pa_protection_qos.example | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_protection_qos_pa_protection_qos_example_stats_published: true
          when:
            - fe_palo_alto_pa_protection_qos_pa_protection_qos_example_status | default('') == 'failed'
          tags:
            - always
