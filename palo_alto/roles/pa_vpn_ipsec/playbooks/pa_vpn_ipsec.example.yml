---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: pan_firewalls
  gather_facts: false
  roles:
    - role: pa_vpn_ipsec
      vars:
        ike_crypto_profiles:
          - name: "ike-strong"
            dh_group: ["group14"]
            authentication: ["sha256"]
            encryption: ["aes-256-cbc"]
            lifetime_seconds: 28800
        ipsec_crypto_profiles:
          - name: "ipsec-strong"
            esp_auth: ["sha256"]
            esp_encryption: ["aes-256-gcm"]
            dh_group: ["group14"]
            lifetime_seconds: 3600
        ike_gateways:
          - name: "gw-to-branch1"
            version: "ikev2"
            interface: "ethernet1/1"
            peer_ip_value: "198.51.100.10"
            pre_shared_key: "REDACTED"
            IKEv2_proposal: "ike-strong"
        tunnel_interfaces:
          - name: "tunnel.10"
            vr: "default"
            zone: "vpn"
            ipv4_address: "10.250.0.1/30"
        ipsec_tunnels:
          - name: "ipsec-to-branch1"
            tunnel_interface: "tunnel.10"
            ak_ike_gateway: "gw-to-branch1"
            ak_ipsec_crypto_profile: "ipsec-strong"
            enable_tunnel_monitor: true
            monitor_dest_ip: "10.250.0.2"
        tunnel_static_routes:
          - { vr: "default", destination: "10.20.0.0/16", next_hop: "10.250.0.2", interface: "tunnel.10", metric: 10 }
  pre_tasks:
    - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Initialize validation state"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status: "running"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed: false
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed: false
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task: ""
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error: ""
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_stats_published: false
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: required variable '{{ item }}' is not defined."
            success_msg: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status: "preflight_failed"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed: false
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: FAILED at '{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example":
                  component: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else ['palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_stats_published: true
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example failed at '{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task }}': {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: preflight
              {{ 'passed' if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed | bool
              - fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status in ['running', 'succeeded']
            fail_msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: postflight validation failed - preflight passed
              ={{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed | default(false) }},
              status={{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('unknown') }}.
            success_msg: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed: true
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status: "failed"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed: false
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: FAILED at '{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error }}
          tags:
            - always
            - rescue

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example failed at '{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task }}': {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example":
                  component: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example"
                  type: "playbook"
                  platform: "palo_alto"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('unknown') }}"
                  preflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_started_at | default('') }}"
                  ended_at: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_ended_at | default('') }}"
                  duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_failed_task | default('') }}"
                  error: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('') == 'succeeded' else ['palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_stats_published | default(false) | bool)
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_stats_published: true
          tags:
            - always

        - name: "palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              palo_alto/pa_vpn_ipsec/pa_vpn_ipsec.example: {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_status | default('unknown') }} in
              {{ fe_palo_alto_pa_vpn_ipsec_pa_vpn_ipsec_example_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
