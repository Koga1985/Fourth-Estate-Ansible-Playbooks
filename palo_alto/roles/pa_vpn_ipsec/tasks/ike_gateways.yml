---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_vpn_ipsec/ike_gateways']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_vpn_ipsec_ike_gateways_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_vpn_ipsec/ike_gateways | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_status: "running"
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_preflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_postflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_failed_task: ""
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_error: ""
    fe_palo_alto_pa_vpn_ipsec_ike_gateways_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_vpn_ipsec/ike_gateways | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_vpn_ipsec/ike_gateways: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_vpn_ipsec/ike_gateways: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_vpn_ipsec/ike_gateways: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_vpn_ipsec/ike_gateways: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create/Update IKE Gateways
      paloaltonetworks.panos.panos_ike_gateway:
        name: "{{ item.name }}"
        version: "{{ item.version | default('ikev2') }}"
        interface: "{{ item.interface }}"
        local_ip_address: "{{ item.local_ip_address | default(omit) }}"
        peer_ip_value: "{{ item.peer_ip_value }}"
        pre_shared_key: "{{ item.pre_shared_key | default(omit) }}"
        peer_id_type: "{{ item.peer_id_type | default(omit) }}"
        local_id_type: "{{ item.local_id_type | default(omit) }}"
        local_id_value: "{{ item.local_id_value | default(omit) }}"
        liveness_check: "{{ item.liveness_check | default(true) }}"
        ikev2_proposal: "{{ item.IKEv2_proposal | default(omit) }}"
        nat_traversal: "{{ item.nat_traversal | default(true) }}"
        template: "{{ template | default(omit) if pa_use_panorama | bool else omit }}"
        template_stack: "{{ template_stack | default(omit) if pa_use_panorama | bool else omit }}"
        state: "present"
      loop: "{{ ike_gateways | default([]) }}"
      loop_control: { label: "{{ item.name }}" }
      no_log: true

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_vpn_ipsec_ike_gateways_preflight_passed | bool
          - fe_palo_alto_pa_vpn_ipsec_ike_gateways_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_vpn_ipsec/ike_gateways: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_status | default('unknown') }}.
        success_msg: "palo_alto/pa_vpn_ipsec/ike_gateways: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_postflight_passed: true
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_status: "failed"
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_postflight_passed: false
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_vpn_ipsec/ike_gateways: FAILED at '{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_vpn_ipsec/ike_gateways failed at '{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_failed_task }}': {{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_vpn_ipsec_ike_gateways_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_vpn_ipsec/ike_gateways":
              component: "palo_alto/pa_vpn_ipsec/ike_gateways"
              type: "role-tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_vpn_ipsec_ike_gateways_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_vpn_ipsec_ike_gateways_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_ike_gateways_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_vpn_ipsec_ike_gateways_status | default('') == 'succeeded' else ['palo_alto/pa_vpn_ipsec/ike_gateways'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec/ike_gateways | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ike_gateways_stats_published: true
      tags:
        - always
