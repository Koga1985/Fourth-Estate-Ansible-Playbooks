---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_vpn_ipsec']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_vpn_ipsec_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_vpn_ipsec | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_vpn_ipsec_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_vpn_ipsec_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_vpn_ipsec_status: "running"
    fe_palo_alto_pa_vpn_ipsec_preflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_postflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_failed_task: ""
    fe_palo_alto_pa_vpn_ipsec_error: ""
    fe_palo_alto_pa_vpn_ipsec_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_vpn_ipsec | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_vpn_ipsec | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_vpn_ipsec: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_vpn_ipsec: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_vpn_ipsec: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_vpn_ipsec: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_vpn_ipsec_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

    - name: Configure IKE crypto profiles
      import_tasks: ike_crypto.yml

    - name: Configure IPsec crypto profiles
      import_tasks: ipsec_crypto.yml

    - name: Configure IKE gateways
      import_tasks: ike_gateways.yml

    - name: Configure tunnel interfaces
      import_tasks: tunnel_interfaces.yml

    - name: Configure IPsec tunnels
      import_tasks: ipsec_tunnels.yml

    - name: "Optional: static routes for tunnel next-hops"
      import_tasks: static_routes.yml

    - name: "Optional: monitor tunnels and export CSV"
      import_tasks: monitoring.yml

    - name: Commit changes
      when: commit_after_changes | bool
      paloaltonetworks.panos.panos_commit:
        description: "{{ commit_description }}"

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_vpn_ipsec | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_vpn_ipsec_preflight_passed | bool
          - fe_palo_alto_pa_vpn_ipsec_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_vpn_ipsec: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_vpn_ipsec_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_vpn_ipsec_status | default('unknown') }}.
        success_msg: "palo_alto/pa_vpn_ipsec: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_postflight_passed: true
        fe_palo_alto_pa_vpn_ipsec_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_vpn_ipsec | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_status: "failed"
        fe_palo_alto_pa_vpn_ipsec_postflight_passed: false
        fe_palo_alto_pa_vpn_ipsec_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_vpn_ipsec_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_vpn_ipsec: FAILED at '{{ fe_palo_alto_pa_vpn_ipsec_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_vpn_ipsec_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_vpn_ipsec failed at '{{ fe_palo_alto_pa_vpn_ipsec_failed_task }}': {{ fe_palo_alto_pa_vpn_ipsec_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_vpn_ipsec | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_vpn_ipsec_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_vpn_ipsec_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_vpn_ipsec":
              component: "palo_alto/pa_vpn_ipsec"
              type: "role"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_vpn_ipsec_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_vpn_ipsec_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_vpn_ipsec_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_vpn_ipsec_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_vpn_ipsec_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_vpn_ipsec_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_vpn_ipsec_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_vpn_ipsec_status | default('') == 'succeeded' else ['palo_alto/pa_vpn_ipsec'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_stats_published: true
      tags:
        - always
