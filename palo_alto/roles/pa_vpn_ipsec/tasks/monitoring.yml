---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_vpn_ipsec/monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_vpn_ipsec_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_vpn_ipsec/monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_vpn_ipsec_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_vpn_ipsec_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_vpn_ipsec_monitoring_status: "running"
    fe_palo_alto_pa_vpn_ipsec_monitoring_preflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_monitoring_postflight_passed: false
    fe_palo_alto_pa_vpn_ipsec_monitoring_failed_task: ""
    fe_palo_alto_pa_vpn_ipsec_monitoring_error: ""
    fe_palo_alto_pa_vpn_ipsec_monitoring_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_vpn_ipsec/monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_vpn_ipsec/monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_vpn_ipsec/monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_vpn_ipsec/monitoring: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_vpn_ipsec/monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Monitor tunnels (IKE/IPsec) and export CSVs
      when: vpn_monitoring.enabled | default(true) | bool
      block:
        - name: Show IKE SAs
          paloaltonetworks.panos.panos_op:
            cmd: "<show><vpn><ike-sa></ike-sa></vpn></show>"
          register: _ike

        - name: Show IPsec SAs
          paloaltonetworks.panos.panos_op:
            cmd: "<show><vpn><ipsec-sa></ipsec-sa></vpn></show>"
          register: _ipsec

        - name: Write IKE status CSV
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/{{ vpn_monitoring.csv_prefix | default('vpn_status') }}_ike.csv"
            mode: "0644"
            content: |
              peer,state,local_ip,peer_ip,phase1
              {% set entries = _ike.stdout_xml.response.result.ike-sa | default([]) %}
              {% for e in (entries if entries is iterable else [entries]) %}
              {{ e.peer | default('') }},{{ e.state | default('') }},{{ e.localip | default('') }},{{ e.peerip | default('') }},{{ e.version | default('') }}
              {% endfor %}

        - name: Write IPsec status CSV
          ansible.builtin.copy:
            dest: "{{ artifacts_dir }}/{{ vpn_monitoring.csv_prefix | default('vpn_status') }}_ipsec.csv"
            mode: "0644"
            content: |
              peer,state,tunnel,spi_encr,spi_auth
              {% set entries = _ipsec.stdout_xml.response.result.tunnel | default([]) %}
              {% for t in (entries if entries is iterable else [entries]) %}
              {{ t.peer | default('') }},{{ t.state | default('') }},{{ t.name | default('') }},{{ t.enc | default('') }},{{ t.auth | default('') }}
              {% endfor %}

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_vpn_ipsec_monitoring_preflight_passed | bool
          - fe_palo_alto_pa_vpn_ipsec_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_vpn_ipsec/monitoring: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_vpn_ipsec_monitoring_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_vpn_ipsec_monitoring_status | default('unknown') }}.
        success_msg: "palo_alto/pa_vpn_ipsec/monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_monitoring_postflight_passed: true
        fe_palo_alto_pa_vpn_ipsec_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_monitoring_status: "failed"
        fe_palo_alto_pa_vpn_ipsec_monitoring_postflight_passed: false
        fe_palo_alto_pa_vpn_ipsec_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_vpn_ipsec_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_vpn_ipsec/monitoring: FAILED at '{{ fe_palo_alto_pa_vpn_ipsec_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_vpn_ipsec_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_vpn_ipsec/monitoring failed at '{{ fe_palo_alto_pa_vpn_ipsec_monitoring_failed_task }}': {{ fe_palo_alto_pa_vpn_ipsec_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_vpn_ipsec_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_vpn_ipsec_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_vpn_ipsec/monitoring":
              component: "palo_alto/pa_vpn_ipsec/monitoring"
              type: "role-tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_vpn_ipsec_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_vpn_ipsec_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_vpn_ipsec_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_vpn_ipsec_monitoring_status | default('') == 'succeeded' else ['palo_alto/pa_vpn_ipsec/monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_vpn_ipsec/monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_vpn_ipsec_monitoring_stats_published: true
      tags:
        - always
