---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_ssl_decryption/bypass_category']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_ssl_decryption_bypass_category_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_ssl_decryption/bypass_category | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_ssl_decryption_bypass_category_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_ssl_decryption_bypass_category_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_ssl_decryption_bypass_category_status: "running"
    fe_palo_alto_pa_ssl_decryption_bypass_category_preflight_passed: false
    fe_palo_alto_pa_ssl_decryption_bypass_category_postflight_passed: false
    fe_palo_alto_pa_ssl_decryption_bypass_category_failed_task: ""
    fe_palo_alto_pa_ssl_decryption_bypass_category_error: ""
    fe_palo_alto_pa_ssl_decryption_bypass_category_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_ssl_decryption/bypass_category | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_ssl_decryption/bypass_category: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_ssl_decryption/bypass_category: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_ssl_decryption/bypass_category: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_ssl_decryption/bypass_category: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_bypass_category_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure custom URL category for BYPASS exists
      paloaltonetworks.panos.panos_custom_url_category:
        name: "{{ decrypt_bypass_category }}"
        type: "URL List"
        sites: "{{ bypass_urls | default([]) }}"
        description: "Decryption bypass set (managed by Ansible)"
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
        state: "present"

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_ssl_decryption_bypass_category_preflight_passed | bool
          - fe_palo_alto_pa_ssl_decryption_bypass_category_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_ssl_decryption/bypass_category: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_ssl_decryption_bypass_category_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_ssl_decryption_bypass_category_status | default('unknown') }}.
        success_msg: "palo_alto/pa_ssl_decryption/bypass_category: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_bypass_category_postflight_passed: true
        fe_palo_alto_pa_ssl_decryption_bypass_category_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_bypass_category_status: "failed"
        fe_palo_alto_pa_ssl_decryption_bypass_category_postflight_passed: false
        fe_palo_alto_pa_ssl_decryption_bypass_category_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_ssl_decryption_bypass_category_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_ssl_decryption/bypass_category: FAILED at '{{ fe_palo_alto_pa_ssl_decryption_bypass_category_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_ssl_decryption_bypass_category_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_ssl_decryption/bypass_category failed at '{{ fe_palo_alto_pa_ssl_decryption_bypass_category_failed_task }}': {{ fe_palo_alto_pa_ssl_decryption_bypass_category_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_bypass_category_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_ssl_decryption_bypass_category_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_ssl_decryption_bypass_category_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_ssl_decryption/bypass_category":
              component: "palo_alto/pa_ssl_decryption/bypass_category"
              type: "role-tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_ssl_decryption_bypass_category_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_ssl_decryption_bypass_category_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_ssl_decryption_bypass_category_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_ssl_decryption_bypass_category_status | default('') == 'succeeded' else ['palo_alto/pa_ssl_decryption/bypass_category'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_ssl_decryption/bypass_category | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_bypass_category_stats_published: true
      tags:
        - always
