---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['palo_alto/pa_ssl_decryption/rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_palo_alto_pa_ssl_decryption_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "palo_alto/pa_ssl_decryption/rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_palo_alto_pa_ssl_decryption_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_palo_alto_pa_ssl_decryption_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_palo_alto_pa_ssl_decryption_rules_status: "running"
    fe_palo_alto_pa_ssl_decryption_rules_preflight_passed: false
    fe_palo_alto_pa_ssl_decryption_rules_postflight_passed: false
    fe_palo_alto_pa_ssl_decryption_rules_failed_task: ""
    fe_palo_alto_pa_ssl_decryption_rules_error: ""
    fe_palo_alto_pa_ssl_decryption_rules_stats_published: false
  tags:
    - always

- name: "palo_alto/pa_ssl_decryption/rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "palo_alto/pa_ssl_decryption/rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          palo_alto/pa_ssl_decryption/rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          palo_alto/pa_ssl_decryption/rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "palo_alto/pa_ssl_decryption/rules: required variable '{{ item }}' is not defined."
        success_msg: "palo_alto/pa_ssl_decryption/rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_palo_alto_pa_ssl_decryption_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create/Update Decryption Rules
      vars:
        _act: >-
          {{
            (item.action | default('decrypt')) if (decryption_enforce | default(false)) 
            else 'no-decrypt' if (item.action | default('decrypt')) == 'decrypt' else item.action | default('no-decrypt')
          }}
      paloaltonetworks.panos.panos_decryption_rule:
        name: "{{ item.name }}"
        from_zone: "{{ item.from_zones | default(['any']) }}"
        to_zone: "{{ item.to_zones | default(['any']) }}"
        source_ip: "{{ item.source | default(['any']) }}"
        destination_ip: "{{ item.destination | default(['any']) }}"
        service: "{{ item.services | default(['any']) }}"
        category: "{{ item.categories | default(['any']) }}"
        action: "{{ _act }}"
        decryption_profile: "{{ item.profile | default(omit) }}"
        device_group: "{{ device_group if pa_use_panorama | bool else omit }}"
        vsys: "{{ vsys if not (pa_use_panorama | bool) else omit }}"
        state: "present"
      loop: "{{ decryption_rules | default([]) }}"
      loop_control: { label: "{{ item.name }} ({{ _act }})" }

    # ----------------------------- postflight -------------------

    - name: "palo_alto/pa_ssl_decryption/rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_palo_alto_pa_ssl_decryption_rules_preflight_passed | bool
          - fe_palo_alto_pa_ssl_decryption_rules_status in ['running', 'succeeded']
        fail_msg: >-
          palo_alto/pa_ssl_decryption/rules: postflight validation failed - preflight passed
          ={{ fe_palo_alto_pa_ssl_decryption_rules_preflight_passed | default(false) }},
          status={{ fe_palo_alto_pa_ssl_decryption_rules_status | default('unknown') }}.
        success_msg: "palo_alto/pa_ssl_decryption/rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "palo_alto/pa_ssl_decryption/rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_rules_postflight_passed: true
        fe_palo_alto_pa_ssl_decryption_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "palo_alto/pa_ssl_decryption/rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_rules_status: "failed"
        fe_palo_alto_pa_ssl_decryption_rules_postflight_passed: false
        fe_palo_alto_pa_ssl_decryption_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_palo_alto_pa_ssl_decryption_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_ssl_decryption/rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          palo_alto/pa_ssl_decryption/rules: FAILED at '{{ fe_palo_alto_pa_ssl_decryption_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_palo_alto_pa_ssl_decryption_rules_error }}
      tags:
        - always
        - rescue

    - name: "palo_alto/pa_ssl_decryption/rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          palo_alto/pa_ssl_decryption/rules failed at '{{ fe_palo_alto_pa_ssl_decryption_rules_failed_task }}': {{ fe_palo_alto_pa_ssl_decryption_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "palo_alto/pa_ssl_decryption/rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_palo_alto_pa_ssl_decryption_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_palo_alto_pa_ssl_decryption_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "palo_alto/pa_ssl_decryption/rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "palo_alto/pa_ssl_decryption/rules":
              component: "palo_alto/pa_ssl_decryption/rules"
              type: "role-tasks"
              platform: "palo_alto"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_palo_alto_pa_ssl_decryption_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_palo_alto_pa_ssl_decryption_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_palo_alto_pa_ssl_decryption_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_palo_alto_pa_ssl_decryption_rules_started_at | default('') }}"
              ended_at: "{{ fe_palo_alto_pa_ssl_decryption_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_palo_alto_pa_ssl_decryption_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_palo_alto_pa_ssl_decryption_rules_failed_task | default('') }}"
              error: "{{ fe_palo_alto_pa_ssl_decryption_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_palo_alto_pa_ssl_decryption_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_palo_alto_pa_ssl_decryption_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_palo_alto_pa_ssl_decryption_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_palo_alto_pa_ssl_decryption_rules_status | default('') == 'succeeded' else ['palo_alto/pa_ssl_decryption/rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "palo_alto/pa_ssl_decryption/rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_palo_alto_pa_ssl_decryption_rules_stats_published: true
      tags:
        - always
