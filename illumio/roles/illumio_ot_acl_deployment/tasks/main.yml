---
# tasks/main.yml — illumio_ot_acl_deployment
# Orchestrates sub-tasks based on ot_run_mode (set by the calling playbook).
# Do not call this role directly — use playbook 01 or 02.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ot_acl_deployment']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ot_acl_deployment_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ot_acl_deployment | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ot_acl_deployment_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ot_acl_deployment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ot_acl_deployment_status: "running"
    fe_illumio_illumio_ot_acl_deployment_preflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_postflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_failed_task: ""
    fe_illumio_illumio_ot_acl_deployment_error: ""
    fe_illumio_illumio_ot_acl_deployment_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ot_acl_deployment | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ot_acl_deployment | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ot_acl_deployment: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ot_acl_deployment: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ot_acl_deployment: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ot_acl_deployment: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ot_acl_deployment_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ ot_artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Set common PCE API headers
      ansible.builtin.set_fact:
        illumio_headers:
          Accept: "application/json"
          Content-Type: "application/json"
          X-Illumio-Org: "{{ org_id }}"

    # ── Detect mode (playbook 01) ─────────────────────────────────────────────────
    - name: Detect new pending ACLs
      ansible.builtin.include_tasks: "includes/illumio_ot__detect_new_acls.yml"
      when: ot_run_mode == 'detect'

    - name: Alert network team (detect mode)
      ansible.builtin.include_tasks: "includes/illumio_ot__alert_network_team.yml"
      when:
        - ot_run_mode == 'detect'
        - ot_new_acls_detected | default(false) | bool
        - ot_notify_on_detect | default(true) | bool

    # ── Deploy mode (playbook 02) ─────────────────────────────────────────────────
    - name: Validate ACL definitions
      ansible.builtin.include_tasks: "includes/illumio_ot__validate_acls.yml"
      when: ot_run_mode == 'deploy'

    - name: Apply ACLs to PCE
      ansible.builtin.include_tasks: "includes/illumio_ot__apply_acls.yml"
      when: ot_run_mode == 'deploy'

    - name: Promote policy to active enforcement
      ansible.builtin.include_tasks: "includes/illumio_ot__promote_policy.yml"
      when:
        - ot_run_mode == 'deploy'
        - apply_changes | bool
        - promote_policy | bool

    - name: Alert network team (deploy mode)
      ansible.builtin.include_tasks: "includes/illumio_ot__alert_network_team.yml"
      when:
        - ot_run_mode == 'deploy'
        - apply_changes | bool
        - ot_notify_on_deploy | default(true) | bool

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ot_acl_deployment | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ot_acl_deployment_preflight_passed | bool
          - fe_illumio_illumio_ot_acl_deployment_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ot_acl_deployment: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ot_acl_deployment_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ot_acl_deployment_status | default('unknown') }}.
        success_msg: "illumio/illumio_ot_acl_deployment: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_postflight_passed: true
        fe_illumio_illumio_ot_acl_deployment_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ot_acl_deployment | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_status: "failed"
        fe_illumio_illumio_ot_acl_deployment_postflight_passed: false
        fe_illumio_illumio_ot_acl_deployment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ot_acl_deployment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ot_acl_deployment: FAILED at '{{ fe_illumio_illumio_ot_acl_deployment_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ot_acl_deployment_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ot_acl_deployment failed at '{{ fe_illumio_illumio_ot_acl_deployment_failed_task }}': {{ fe_illumio_illumio_ot_acl_deployment_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ot_acl_deployment | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ot_acl_deployment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ot_acl_deployment_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ot_acl_deployment":
              component: "illumio/illumio_ot_acl_deployment"
              type: "role"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ot_acl_deployment_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ot_acl_deployment_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ot_acl_deployment_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ot_acl_deployment_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ot_acl_deployment_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ot_acl_deployment_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ot_acl_deployment_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ot_acl_deployment_status | default('') == 'succeeded' else ['illumio/illumio_ot_acl_deployment'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_stats_published: true
      tags:
        - always
