---
# illumio_ot__detect_new_acls.yml
#
# Polls the PCE for pending (draft, not-yet-provisioned) security policy items,
# compares them against the on-disk baseline from the previous run, and exposes
# the delta as facts that the alert task uses.
#
# Sets facts:
#   ot_new_acls_detected  (bool)   — true when there are new pending items
#   ot_new_acl_count      (int)    — number of newly-detected items
#   ot_new_acl_items      (list)   — the new pending rule objects
#   ot_all_pending_items  (list)   — full current pending list (for report)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status: "running"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_preflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_postflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_failed_task: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_error: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ ot_artifacts_dir }}"
        state: directory
        mode: '0750'

    - name: Set common PCE API headers
      ansible.builtin.set_fact:
        illumio_headers:
          Accept: "application/json"
          Content-Type: "application/json"
          X-Illumio-Org: "{{ org_id }}"

    # ── Step 1: Query PCE pending policy ─────────────────────────────────────────
    - name: Query PCE for pending (draft) security policy — rule sets
      ansible.builtin.uri:
        url: "{{ pce_url }}/api/v2/orgs/{{ org_id }}/sec_policy/pending"
        method: GET
        user: "{{ api_user }}"
        password: "{{ api_key }}"
        force_basic_auth: true
        validate_certs: "{{ verify_ssl | default(true) }}"
        headers: "{{ illumio_headers }}"
        return_content: true
        status_code: [200, 204]
      no_log: true
      register: _pce_pending_raw
      retries: 3
      delay: 5
      until: _pce_pending_raw.status in [200, 204]

    - name: Query PCE audit log for recent rule-create events
      ansible.builtin.uri:
        url: "{{ pce_url }}/api/v2/orgs/{{ org_id }}/events?event_type=sec_rule.create&max_results=50"
        method: GET
        user: "{{ api_user }}"
        password: "{{ api_key }}"
        force_basic_auth: true
        validate_certs: "{{ verify_ssl | default(true) }}"
        headers: "{{ illumio_headers }}"
        return_content: true
        status_code: [200, 204]
      no_log: true
      register: _pce_audit_raw
      retries: 3
      delay: 5
      until: _pce_audit_raw.status in [200, 204]

    - name: Parse pending policy response
      ansible.builtin.set_fact:
        _pending_policy: "{{ _pce_pending_raw.json | default({}) }}"
        _audit_events: "{{ _pce_audit_raw.json | default([]) }}"

    # Flatten all pending rule hrefs from the pending policy object.
    # The PCE pending response contains keys like rule_sets, ip_lists, services.
    - name: Collect pending rule HREFs
      ansible.builtin.set_fact:
        _pending_rule_hrefs: >-
          {{
            ((_pending_policy.rule_sets | default([])) | map(attribute='href') | list)
            + ((_pending_policy.ip_lists | default([])) | map(attribute='href') | list)
            + ((_pending_policy.services | default([])) | map(attribute='href') | list)
          }}

    - name: Collect pending items (full objects for reporting)
      ansible.builtin.set_fact:
        ot_all_pending_items: >-
          {{
            (_pending_policy.rule_sets | default([]))
            + (_pending_policy.ip_lists | default([]))
            + (_pending_policy.services | default([]))
          }}

    # ── Step 2: Load or initialize baseline ──────────────────────────────────────
    - name: Check whether baseline file exists
      ansible.builtin.stat:
        path: "{{ ot_acl_baseline_file }}"
      register: _baseline_stat

    - name: Load existing baseline
      ansible.builtin.slurp:
        src: "{{ ot_acl_baseline_file }}"
      register: _baseline_raw
      when: _baseline_stat.stat.exists and not (reset_baseline | bool)

    - name: Parse baseline HREFs
      ansible.builtin.set_fact:
        _baseline_hrefs: "{{ (_baseline_raw.content | b64decode | from_json) if (_baseline_stat.stat.exists and not reset_baseline | bool) else [] }}"

    # ── Step 3: Compute delta ─────────────────────────────────────────────────────
    - name: Identify new pending HREFs (not in baseline)
      ansible.builtin.set_fact:
        _new_hrefs: "{{ _pending_rule_hrefs | difference(_baseline_hrefs) }}"

    - name: Filter full pending objects to new-only
      ansible.builtin.set_fact:
        ot_new_acl_items: >-
          {{
            ot_all_pending_items
            | selectattr('href', 'in', _new_hrefs)
            | list
          }}

    - name: Expose detection facts
      ansible.builtin.set_fact:
        ot_new_acl_count: "{{ ot_new_acl_items | length }}"
        ot_new_acls_detected: "{{ (ot_new_acl_items | length) > 0 }}"

    - name: Report detection result
      ansible.builtin.debug:
        msg:
          - "PCE pending objects   : {{ ot_all_pending_items | length }}"
          - "Baseline known HREFs  : {{ _baseline_hrefs | length }}"
          - "New (delta) objects   : {{ ot_new_acl_count }}"
          - "{% if ot_new_acls_detected | bool %}!! New ACLs require network team review{% else %}All clear — no new items since last scan{% endif %}"

    # ── Step 4: Update baseline ───────────────────────────────────────────────────
    - name: Persist updated baseline (current pending = new known state)
      ansible.builtin.copy:
        dest: "{{ ot_acl_baseline_file }}"
        content: "{{ _pending_rule_hrefs | to_nice_json }}"
        mode: '0640'

    # ── Step 5: Save pending report ───────────────────────────────────────────────
    - name: Save pending ACL report artifact
      ansible.builtin.copy:
        dest: "{{ ot_acl_pending_file }}"
        mode: '0640'
        content: "{{ ot_all_pending_items | to_nice_json }}"

    - name: Save timestamped detection report
      ansible.builtin.copy:
        dest: "{{ ot_acl_report_file }}"
        mode: '0640'
        content: |
          {{
            {
              'scan_time': ansible_date_time.iso8601,
              'pce_url': pce_url,
              'org_id': org_id,
              'total_pending': ot_all_pending_items | length,
              'new_since_last_scan': ot_new_acl_count,
              'new_items': ot_new_acl_items,
              'all_pending': ot_all_pending_items,
              'audit_events_sampled': _audit_events | length
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_preflight_passed | bool
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status | default('unknown') }}.
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_postflight_passed: true
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status: "failed"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_postflight_passed: false
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls: FAILED at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls failed at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_failed_task }}': {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls":
              component: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_status | default('') == 'succeeded' else ['illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__detect_new_acls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__detect_new_acls_stats_published: true
      tags:
        - always
