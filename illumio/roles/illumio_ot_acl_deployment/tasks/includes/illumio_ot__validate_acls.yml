---
# illumio_ot__validate_acls.yml
#
# Validates the ot_acls list before any PCE changes are attempted.
# Checks:
#   1. ot_acls is defined and non-empty
#   2. Each ACL has required fields
#   3. Services use OT-allowlisted protocols (warn or fail based on ot_strict_protocol_validation)
#   4. Purdue level boundary rules are not violated (if purdue_src/dst provided)
#
# This task always runs (including dry runs) and never modifies PCE.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status: "running"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_preflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_postflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_failed_task: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_error: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Assert ot_acls is defined and non-empty
      ansible.builtin.assert:
        that:
          - ot_acls is defined
          - ot_acls | length > 0
        fail_msg: >
          ot_acls is empty or undefined. Define at least one ACL entry in your
          inventory_ot file under [localhost:vars]. See inventory_ot.example for
          the full variable format.

    - name: Validate required fields on each ACL entry
      ansible.builtin.assert:
        that:
          - item.name is defined and item.name | length > 0
          - item.rule_set_name is defined and item.rule_set_name | length > 0
          - item.services is defined and item.services | length > 0
          - item.providers is defined and item.providers | length > 0
          - item.consumers is defined and item.consumers | length > 0
        fail_msg: >
          ACL entry {{ loop.index }} is missing required fields.
          Each entry needs: name, rule_set_name, services, providers, consumers.
          Offending entry: {{ item | to_json }}
      loop: "{{ ot_acls }}"
      loop_control:
        label: "{{ item.name | default('entry-' + loop.index | string) }}"

    - name: Validate service provider/consumer type field
      ansible.builtin.assert:
        that:
          - provider.type in ['label', 'ip_list']
        fail_msg: >
          ACL '{{ item.name }}' has a provider with type '{{ provider.type }}'.
          Valid types are: label, ip_list.
      loop: "{{ ot_acls }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        provider: "{{ item.providers | first }}"
      when: item.providers | length > 0

    # ── Protocol allowlist check ──────────────────────────────────────────────────
    - name: Build allowed port/proto lookup set
      ansible.builtin.set_fact:
        _allowed_svc_set: >-
          {{
            ot_allowed_protocols
            | map(attribute='port') | zip(ot_allowed_protocols | map(attribute='proto'))
            | map('join', '/')
            | list
          }}

    - name: Check ACL services against OT protocol allowlist
      ansible.builtin.assert:
        that:
          - (svc.port | string + '/' + svc.proto) in _allowed_svc_set
            or not (ot_strict_protocol_validation | default(false) | bool)
        fail_msg: >
          ACL '{{ item.name }}' uses port {{ svc.port }}/{{ svc.proto }} which is
          NOT in the OT protocol allowlist. Either add it to ot_allowed_protocols
          or set ot_strict_protocol_validation: false to warn-only.
          Current allowlist: {{ _allowed_svc_set | join(', ') }}
      loop: "{{ ot_acls }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        svc: "{{ item.services | first }}"
      when: item.services | length > 0

    - name: Warn on non-allowlisted protocols (strict mode off)
      ansible.builtin.debug:
        msg: >-
          WARNING: ACL '{{ item.name }}' uses port {{ svc.port }}/{{ svc.proto }}
          which is NOT in ot_allowed_protocols. Verify this is intentional before
          applying to the OT environment.
      loop: "{{ ot_acls }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        svc: "{{ item.services | first }}"
      when:
        - not (ot_strict_protocol_validation | default(false) | bool)
        - item.services | length > 0
        - (svc.port | string + '/' + svc.proto) not in _allowed_svc_set

    # ── Purdue boundary check ─────────────────────────────────────────────────────
    - name: Check Purdue model level boundaries
      ansible.builtin.assert:
        that:
          - >-
            not (ot_enforce_purdue_boundaries | default(true) | bool)
            or item.purdue_src is not defined
            or item.purdue_dst is not defined
            or ((item.purdue_src | float - item.purdue_dst | float) | abs) <= (ot_purdue_max_level_jump | default(1))
        fail_msg: >
          ACL '{{ item.name }}' spans Purdue levels {{ item.purdue_src }} → {{ item.purdue_dst }}
          ({{ ((item.purdue_src | float - item.purdue_dst | float) | abs) | round(1) }} levels).
          Maximum allowed jump is {{ ot_purdue_max_level_jump }}.
          Either reduce the scope of this rule or set ot_enforce_purdue_boundaries: false.
      loop: "{{ ot_acls }}"
      loop_control:
        label: "{{ item.name | default('acl-' + loop.index | string) }}"
      when:
        - item.purdue_src is defined
        - item.purdue_dst is defined

    # ── Summary ───────────────────────────────────────────────────────────────────
    - name: Display validation summary
      ansible.builtin.debug:
        msg: |-
          ═══ ACL Validation Complete ═══
          ACLs validated     : {{ ot_acls | length }}
          Strict protocols   : {{ ot_strict_protocol_validation | default(false) }}
          Purdue boundaries  : {{ ot_enforce_purdue_boundaries | default(true) }}
          Max Purdue jump    : {{ ot_purdue_max_level_jump | default(1) }}
          All checks passed.
          ACLs to process:
          {% for acl in ot_acls %}
            {{ loop.index }}. {{ acl.name }}
               Rule set : {{ acl.rule_set_name }}
               Services : {{ acl.services | map(attribute='port') | list | join(', ') }}
               Enabled  : {{ acl.enabled | default(true) }}
          {% endfor %}

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_preflight_passed | bool
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status | default('unknown') }}.
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_postflight_passed: true
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status: "failed"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_postflight_passed: false
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls: FAILED at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls failed at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_failed_task }}': {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls":
              component: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_status | default('') == 'succeeded' else ['illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__validate_acls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__validate_acls_stats_published: true
      tags:
        - always
