---
# illumio_ot__alert_network_team.yml
#
# Sends notifications to the network team via email and/or webhook.
# Works in both detect mode (new ACLs found) and deploy mode (deployment done).
# All notification methods are individually gated by their *_enabled variable,
# so customers can enable only what they use.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status: "running"
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_preflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_postflight_passed: false
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_failed_task: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_error: ""
    fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set alert subject — detect mode
      ansible.builtin.set_fact:
        ot_alert_subject: >-
          {{ ot_alert_subject_prefix }}
          {{ ot_new_acl_count | default(0) }} new pending OT ACL(s) require review
          — {{ pce_url }}
        ot_alert_event_type: "DETECTION"
      when: ot_run_mode | default('detect') == 'detect'

    - name: Set alert subject — deploy mode
      ansible.builtin.set_fact:
        ot_alert_subject: >-
          {{ ot_alert_subject_prefix }}
          OT ACL deployment {{ 'COMPLETE' if apply_changes | bool else 'DRY-RUN COMPLETE' }}
          — {{ pce_url }}
        ot_alert_event_type: "DEPLOYMENT"
      when: ot_run_mode | default('detect') == 'deploy'

    # ── Build plain-text email body ───────────────────────────────────────────────
    - name: Build email body — detect mode
      ansible.builtin.set_fact:
        ot_alert_body: |
          ======================================================================
          ILLUMIO OT ACL MONITOR — ACTION REQUIRED
          ======================================================================

          New pending ACL(s) have been detected in the Illumio PCE that have not
          yet been provisioned (enforced). A network team member must review these
          changes and run the deployment playbook to approve and apply them.

          Detection Summary
          -----------------
          PCE URL         : {{ pce_url }}
          Organisation    : {{ org_id }}
          Detected at     : {{ ansible_date_time.iso8601 }}
          New ACL objects : {{ ot_new_acl_count | default(0) }}

          New Pending Items
          -----------------
          {% for item in ot_new_acl_items | default([]) %}
          {{ loop.index }}. {{ item.name | default(item.href) }}
             HREF    : {{ item.href | default('N/A') }}
             Updated : {{ item.updated_at | default('N/A') }}
          {% endfor %}

          Next Steps
          ----------
          1. Review the full pending report:
               {{ ot_acl_pending_file }}

          2. If the changes are approved, run the deployment playbook:
               ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
                 -i illumio/inventory_ot --ask-vault-pass \
                 -e "apply_changes=true"

          3. To promote to active enforcement (traffic affected):
               ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
                 -i illumio/inventory_ot --ask-vault-pass \
                 -e "apply_changes=true promote_policy=true"

          ======================================================================
          This message was generated automatically by Ansible.
          Do not reply to this email.
          ======================================================================
      when: ot_run_mode | default('detect') == 'detect'

    - name: Build email body — deploy mode
      ansible.builtin.set_fact:
        ot_alert_body: |
          ======================================================================
          ILLUMIO OT ACL DEPLOYMENT — {{ 'COMPLETE' if apply_changes | bool else 'DRY-RUN COMPLETE' }}
          ======================================================================

          An OT ACL deployment playbook has completed on {{ pce_url }}.

          Deployment Summary
          ------------------
          PCE URL         : {{ pce_url }}
          Organisation    : {{ org_id }}
          Operator        : {{ ansible_user_id }}
          Completed at    : {{ ansible_date_time.iso8601 }}
          Dry run only    : {{ dry_run | default(true) }}
          Rules applied   : {{ apply_changes | default(false) }}
          Policy promoted : {{ promote_policy | default(false) }}
          ACLs processed  : {{ ot_acls | default([]) | length }}

          ACLs Processed
          --------------
          {% for acl in ot_acls | default([]) %}
          {{ loop.index }}. {{ acl.name }}
             Rule Set : {{ acl.rule_set_name }}
             Services : {{ acl.services | map(attribute='port') | list | join(', ') }}
             Ticket   : {{ acl.ticket_ref | default('N/A') }}
          {% endfor %}

          Policy Status
          -------------
          {% if apply_changes | bool and promote_policy | bool %}
          ACTIVE — rules are now enforced in the OT environment.
          {% elif apply_changes | bool %}
          DRAFT — rules are in PCE but NOT yet enforced.
          Run with promote_policy=true to enforce.
          {% else %}
          DRY RUN — no changes were made to PCE policy.
          {% endif %}

          Artifacts saved to: {{ ot_artifacts_dir }}

          ======================================================================
          This message was generated automatically by Ansible.
          ======================================================================
      when: ot_run_mode | default('detect') == 'deploy'

    # ── Build webhook payload ─────────────────────────────────────────────────────
    - name: Build webhook payload
      ansible.builtin.set_fact:
        ot_webhook_payload:
          event_type: "illumio_ot_acl_{{ ot_alert_event_type | lower }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          pce_url: "{{ pce_url }}"
          org_id: "{{ org_id | string }}"
          operator: "{{ ansible_user_id }}"
          summary:
            new_acl_count: "{{ ot_new_acl_count | default(ot_acls | default([]) | length) | int }}"
            apply_changes: "{{ apply_changes | default(false) | bool }}"
            promote_policy: "{{ promote_policy | default(false) | bool }}"
            dry_run: "{{ dry_run | default(true) | bool }}"
          message: "{{ ot_alert_subject }}"

    # ── Send notifications ────────────────────────────────────────────────────────
    - name: Send email alert to network team
      community.general.mail:
        host: "{{ ot_smtp_host }}"
        port: "{{ ot_smtp_port | int }}"
        username: "{{ ot_smtp_username | default(omit) }}"
        password: "{{ ot_smtp_password | default(omit) }}"
        from: "{{ ot_alert_email_from }}"
        to: "{{ ot_alert_email_to }}"
        cc: "{{ ot_alert_email_cc | default(omit) }}"
        subject: "{{ ot_alert_subject }}"
        body: "{{ ot_alert_body }}"
      when: ot_email_enabled | default(true) | bool
      ignore_errors: true
      no_log: true

    - name: Send webhook notification
      ansible.builtin.uri:
        url: "{{ ot_webhook_url }}"
        method: POST
        headers: "{{ ot_webhook_headers | default({'Content-Type': 'application/json'}) }}"
        body_format: json
        body: "{{ ot_webhook_payload }}"
        validate_certs: "{{ ot_webhook_verify_ssl | default(true) }}"
        status_code: [200, 201, 202, 204]
      when:
        - ot_webhook_enabled | default(false) | bool
        - ot_webhook_url | default('') | length > 0
      ignore_errors: true

    - name: Log event to syslog
      community.general.syslogger:
        msg: >-
          illumio-ot-acl {{ ot_alert_event_type | lower }}:
          {{ ot_alert_subject }}
        priority: "info"
        facility: "local4"
      when: ot_syslog_enabled | default(false) | bool
      ignore_errors: true

    - name: Confirm notifications dispatched
      ansible.builtin.debug:
        msg:
          - "Notifications sent:"
          - "  Email   : {{ ot_email_enabled | default(true) | bool }}"
          - "  Webhook : {{ ot_webhook_enabled | default(false) | bool }}"
          - "  Syslog  : {{ ot_syslog_enabled | default(false) | bool }}"
          - "  Subject : {{ ot_alert_subject }}"

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_preflight_passed | bool
          - fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status | default('unknown') }}.
        success_msg: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_postflight_passed: true
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status: "failed"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_postflight_passed: false
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team: FAILED at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team failed at '{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_failed_task }}': {{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team":
              component: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_status | default('') == 'succeeded' else ['illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ot_acl_deployment/includes/illumio_ot__alert_network_team | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ot_acl_deployment_includes_illumio_ot__alert_network_team_stats_published: true
      tags:
        - always
