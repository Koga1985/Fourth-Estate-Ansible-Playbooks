---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ven_fleet']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ven_fleet_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ven_fleet | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ven_fleet_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ven_fleet_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ven_fleet_status: "running"
    fe_illumio_illumio_ven_fleet_preflight_passed: false
    fe_illumio_illumio_ven_fleet_postflight_passed: false
    fe_illumio_illumio_ven_fleet_failed_task: ""
    fe_illumio_illumio_ven_fleet_error: ""
    fe_illumio_illumio_ven_fleet_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ven_fleet | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ven_fleet | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ven_fleet: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ven_fleet: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ven_fleet | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ven_fleet: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ven_fleet: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ven_fleet_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ven_fleet | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven_fleet_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Download installers (optional)
      when: platforms is defined and (platforms | length > 0)
      ansible.builtin.include_tasks: "includes/illumio_ven__download_installer.yml"

    - name: Install & pair on Linux (optional)
      when: install_linux | default(false) | bool
      ansible.builtin.include_tasks: "includes/illumio_ven__install_linux.yml"

    - name: Install & pair on Windows (optional)
      when: install_windows | default(false) | bool
      ansible.builtin.include_tasks: "includes/illumio_ven__install_windows.yml"

    - name: Upgrade VEN fleet (optional)
      when: upgrade_targets is defined
      ansible.builtin.include_tasks: "includes/illumio_ven__upgrade.yml"

    - name: Unpair / decom (optional)
      when: decom_targets is defined
      ansible.builtin.include_tasks: "includes/illumio_ven__unpair_decom.yml"

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ven_fleet | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ven_fleet_preflight_passed | bool
          - fe_illumio_illumio_ven_fleet_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ven_fleet: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ven_fleet_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ven_fleet_status | default('unknown') }}.
        success_msg: "illumio/illumio_ven_fleet: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ven_fleet | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven_fleet_postflight_passed: true
        fe_illumio_illumio_ven_fleet_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ven_fleet | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven_fleet_status: "failed"
        fe_illumio_illumio_ven_fleet_postflight_passed: false
        fe_illumio_illumio_ven_fleet_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ven_fleet_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ven_fleet | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ven_fleet: FAILED at '{{ fe_illumio_illumio_ven_fleet_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ven_fleet_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ven_fleet | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ven_fleet failed at '{{ fe_illumio_illumio_ven_fleet_failed_task }}': {{ fe_illumio_illumio_ven_fleet_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ven_fleet | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven_fleet_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ven_fleet_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ven_fleet_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ven_fleet | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ven_fleet":
              component: "illumio/illumio_ven_fleet"
              type: "role"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ven_fleet_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ven_fleet_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ven_fleet_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ven_fleet_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ven_fleet_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ven_fleet_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ven_fleet_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ven_fleet_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ven_fleet_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ven_fleet_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ven_fleet_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ven_fleet_status | default('') == 'succeeded' else ['illumio/illumio_ven_fleet'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ven_fleet | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven_fleet_stats_published: true
      tags:
        - always
