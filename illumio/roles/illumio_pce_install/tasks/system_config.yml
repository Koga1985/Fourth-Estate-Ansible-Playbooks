---
# System configuration for PCE installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_pce_install/system_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_pce_install_system_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_pce_install/system_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_pce_install_system_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_pce_install_system_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_pce_install_system_config_status: "running"
    fe_illumio_illumio_pce_install_system_config_preflight_passed: false
    fe_illumio_illumio_pce_install_system_config_postflight_passed: false
    fe_illumio_illumio_pce_install_system_config_failed_task: ""
    fe_illumio_illumio_pce_install_system_config_error: ""
    fe_illumio_illumio_pce_install_system_config_stats_published: false
  tags:
    - always

- name: "illumio/illumio_pce_install/system_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_pce_install/system_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_pce_install/system_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_pce_install/system_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/system_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_pce_install/system_config: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_pce_install/system_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_pce_install_system_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/system_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_system_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install required system packages
      package:
        name: "{{ illumio_pce_system_packages }}"
        state: present
      retries: 3
      delay: 10

    - name: Configure kernel parameters for PCE
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-illumio-pce.conf
        reload: yes
        state: present
      loop:
        - { name: 'net.ipv4.ip_forward', value: '1' }
        - { name: 'net.ipv4.ip_nonlocal_bind', value: '1' }
        - { name: 'net.core.somaxconn', value: '4096' }
        - { name: 'net.ipv4.tcp_max_syn_backlog', value: '4096' }
        - { name: 'net.core.netdev_max_backlog', value: '5000' }
        - { name: 'net.ipv4.tcp_fin_timeout', value: '30' }
        - { name: 'net.ipv4.tcp_keepalive_time', value: '300' }
        - { name: 'net.ipv4.tcp_keepalive_probes', value: '5' }
        - { name: 'net.ipv4.tcp_keepalive_intvl', value: '15' }
        - { name: 'vm.swappiness', value: '10' }
        - { name: 'fs.file-max', value: '2097152' }

    - name: Configure system limits for PCE
      pam_limits:
        domain: "{{ item.domain }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { domain: '*', type: 'soft', item: 'nofile', value: '65536' }
        - { domain: '*', type: 'hard', item: 'nofile', value: '65536' }
        - { domain: '*', type: 'soft', item: 'nproc', value: '65536' }
        - { domain: '*', type: 'hard', item: 'nproc', value: '65536' }

    - name: Create Illumio system user
      user:
        name: "{{ illumio_pce_user }}"
        comment: "Illumio PCE Service Account"
        system: yes
        shell: /bin/bash
        home: "{{ illumio_pce_data_dir }}"
        createhome: no

    - name: Create PCE directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0755'
      loop:
        - "{{ illumio_pce_data_dir }}"
        - "{{ illumio_pce_data_dir }}/data"
        - "{{ illumio_pce_data_dir }}/log"
        - "{{ illumio_pce_data_dir }}/runtime"
        - "{{ illumio_pce_data_dir }}/tmp"
        - "{{ illumio_pce_config_dir }}"
        - /opt/illumio-pce

    - name: Configure transparent huge pages (disable for better performance)
      copy:
        content: |
          #!/bin/bash
          if test -f /sys/kernel/mm/transparent_hugepage/enabled; then
            echo never > /sys/kernel/mm/transparent_hugepage/enabled
          fi
          if test -f /sys/kernel/mm/transparent_hugepage/defrag; then
            echo never > /sys/kernel/mm/transparent_hugepage/defrag
          fi
        dest: /etc/rc.d/init.d/disable-thp
        mode: '0755'
      when: ansible_distribution_major_version == "7"

    - name: Create systemd service for transparent huge pages (RHEL 8/9)
      copy:
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=basic.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo never | tee /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag'

          [Install]
          WantedBy=basic.target
        dest: /etc/systemd/system/disable-thp.service
        mode: '0644'
      when: ansible_distribution_major_version in ["8", "9"]

    - name: Enable disable-thp service
      systemd:
        name: disable-thp
        enabled: yes
        state: started
        daemon_reload: yes
      when: ansible_distribution_major_version in ["8", "9"]

    - name: Disable and stop firewalld (if using iptables)
      systemd:
        name: firewalld
        enabled: no
        state: stopped
      when:
        - illumio_pce_use_iptables | bool
        - ansible_distribution_major_version in ["7", "8", "9"]
      failed_when: false

    - name: Configure NTP/Chrony for time synchronization
      package:
        name: "{{ 'chrony' if ansible_distribution_major_version in ['8', '9'] else 'ntp' }}"
        state: present

    - name: Start and enable time synchronization service
      systemd:
        name: "{{ 'chronyd' if ansible_distribution_major_version in ['8', '9'] else 'ntpd' }}"
        enabled: yes
        state: started

    - name: Configure hostname
      hostname:
        name: "{{ illumio_pce_fqdn | default(ansible_fqdn) }}"
      when: illumio_pce_fqdn is defined

    - name: Update /etc/hosts with PCE hostname
      lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ illumio_pce_fqdn | default(ansible_fqdn) }} {{ ansible_hostname }}"
        regexp: "^{{ ansible_default_ipv4.address }}"
        state: present

    - name: Disable SELinux temporarily (will configure later)
      selinux:
        policy: targeted
        state: permissive
      when:
        - ansible_selinux.status == "enabled"
        - not illumio_pce_selinux_enforcing | bool

    - name: Create PCE environment file
      template:
        src: pce_environment.j2
        dest: /etc/illumio-pce/environment
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0600'

    - name: Configure log rotation for PCE
      template:
        src: logrotate.j2
        dest: /etc/logrotate.d/illumio-pce
        mode: '0644'

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_pce_install/system_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_pce_install_system_config_preflight_passed | bool
          - fe_illumio_illumio_pce_install_system_config_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_pce_install/system_config: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_pce_install_system_config_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_pce_install_system_config_status | default('unknown') }}.
        success_msg: "illumio/illumio_pce_install/system_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_pce_install/system_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_system_config_postflight_passed: true
        fe_illumio_illumio_pce_install_system_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_pce_install/system_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_system_config_status: "failed"
        fe_illumio_illumio_pce_install_system_config_postflight_passed: false
        fe_illumio_illumio_pce_install_system_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_pce_install_system_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/system_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_pce_install/system_config: FAILED at '{{ fe_illumio_illumio_pce_install_system_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_pce_install_system_config_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/system_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_pce_install/system_config failed at '{{ fe_illumio_illumio_pce_install_system_config_failed_task }}': {{ fe_illumio_illumio_pce_install_system_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_pce_install/system_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_system_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_pce_install_system_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_pce_install_system_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_pce_install/system_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_pce_install/system_config":
              component: "illumio/illumio_pce_install/system_config"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_pce_install_system_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_pce_install_system_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_pce_install_system_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_pce_install_system_config_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_pce_install_system_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_pce_install_system_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_pce_install_system_config_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_pce_install_system_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_pce_install_system_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_pce_install_system_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_pce_install_system_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_pce_install_system_config_status | default('') == 'succeeded' else ['illumio/illumio_pce_install/system_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_pce_install/system_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_system_config_stats_published: true
      tags:
        - always
