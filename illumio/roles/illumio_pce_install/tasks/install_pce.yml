---
# Illumio PCE installation tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_pce_install/install_pce']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_pce_install_install_pce_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_pce_install/install_pce | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_pce_install_install_pce_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_pce_install_install_pce_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_pce_install_install_pce_status: "running"
    fe_illumio_illumio_pce_install_install_pce_preflight_passed: false
    fe_illumio_illumio_pce_install_install_pce_postflight_passed: false
    fe_illumio_illumio_pce_install_install_pce_failed_task: ""
    fe_illumio_illumio_pce_install_install_pce_error: ""
    fe_illumio_illumio_pce_install_install_pce_stats_published: false
  tags:
    - always

- name: "illumio/illumio_pce_install/install_pce | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_pce_install/install_pce | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_pce_install/install_pce: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_pce_install/install_pce: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/install_pce | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_pce_install/install_pce: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_pce_install/install_pce: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_pce_install_install_pce_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/install_pce | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_install_pce_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create PCE installation directory
      file:
        path: /tmp/illumio-pce-install
        state: directory
        mode: '0755'

    - name: Download PCE installation package (online)
      get_url:
        url: "{{ illumio_pce_package_url }}"
        dest: "/tmp/illumio-pce-install/{{ illumio_pce_package_file }}"
        mode: '0644'
        timeout: 300
      when: illumio_pce_online_install | bool

    - name: Copy PCE installation package (offline)
      copy:
        src: "{{ illumio_pce_package_local_path }}"
        dest: "/tmp/illumio-pce-install/{{ illumio_pce_package_file }}"
        mode: '0644'
      when: not illumio_pce_online_install | bool

    - name: Extract PCE installation package
      unarchive:
        src: "/tmp/illumio-pce-install/{{ illumio_pce_package_file }}"
        dest: /tmp/illumio-pce-install/
        remote_src: yes
        creates: /tmp/illumio-pce-install/illumio-pce

    - name: Find PCE installation directory
      find:
        paths: /tmp/illumio-pce-install
        patterns: "illumio-pce-*"
        file_type: directory
      register: pce_install_dir

    - name: Set PCE installation directory fact
      set_fact:
        pce_installer_path: "{{ pce_install_dir.files[0].path }}"

    - name: Create PCE installation configuration
      template:
        src: install_config.json.j2
        dest: "{{ pce_installer_path }}/install_config.json"
        mode: '0600'

    - name: Run PCE installation script
      shell: |
        cd {{ pce_installer_path }}
        ./install.sh --config install_config.json
      args:
        creates: /opt/illumio-pce/illumio-pce-ctl
      register: pce_install_result
      environment:
        ILLUMIO_PCE_ADMIN_PASSWORD: "{{ illumio_pce_admin_password }}"

    - name: Display installation output
      debug:
        var: pce_install_result.stdout_lines
      when: pce_install_result.changed

    - name: Create PCE runtime configuration
      template:
        src: runtime_env.yml.j2
        dest: /etc/illumio-pce/runtime_env.yml
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0600'

    - name: Create PCE service override directory
      file:
        path: /etc/systemd/system/illumio-pce.service.d
        state: directory
        mode: '0755'

    - name: Configure PCE service overrides
      copy:
        content: |
          [Service]
          LimitNOFILE=65536
          LimitNPROC=65536
          Environment="ILLUMIO_PCE_DATA_DIR={{ illumio_pce_data_dir }}"
          Environment="ILLUMIO_PCE_CONFIG_DIR={{ illumio_pce_config_dir }}"
        dest: /etc/systemd/system/illumio-pce.service.d/override.conf
        mode: '0644'
      notify: daemon-reload

    - name: Create PCE control script wrapper
      template:
        src: pce-ctl-wrapper.sh.j2
        dest: /usr/local/bin/pce-ctl
        mode: '0755'

    - name: Set proper ownership on PCE directories
      file:
        path: "{{ item }}"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        recurse: yes
      loop:
        - /opt/illumio-pce
        - "{{ illumio_pce_data_dir }}"
        - "{{ illumio_pce_config_dir }}"

    - name: Enable PCE service
      systemd:
        name: illumio-pce
        enabled: yes
        daemon_reload: yes

    - name: Check PCE service status
      systemd:
        name: illumio-pce
        state: started
      register: pce_service_status

    - name: Wait for PCE to be ready
      uri:
        url: "https://{{ illumio_pce_fqdn }}:{{ illumio_pce_port }}/health"
        method: GET
        validate_certs: no
        status_code: 200
      register: pce_health_check
      until: pce_health_check.status == 200
      retries: 30
      delay: 10
      when: pce_service_status.changed

    - name: Get PCE version
      shell: /opt/illumio-pce/illumio-pce-ctl version
      register: installed_pce_version
      changed_when: false

    - name: Display installed PCE version
      debug:
        msg: "Illumio PCE {{ installed_pce_version.stdout }} installed successfully"

    - name: Create PCE CLI configuration for admin user
      template:
        src: illumio_cli_config.j2
        dest: "/home/{{ illumio_pce_user }}/.illumio/config.yml"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0600'

    - name: Generate initial API key for automation
      uri:
        url: "https://{{ illumio_pce_fqdn }}:{{ illumio_pce_port }}/api/v2/users/login"
        method: POST
        user: "{{ illumio_pce_admin_user }}"
        password: "{{ illumio_pce_admin_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          pce_fqdn: "{{ illumio_pce_fqdn }}"
          org_id: 1
        status_code: 200
      register: pce_login_response
      no_log: true
      when: illumio_pce_generate_api_key | bool

    - name: Save PCE session token
      set_fact:
        pce_session_token: "{{ pce_login_response.json.auth_token }}"
      no_log: true
      when:
        - illumio_pce_generate_api_key | bool
        - pce_login_response.json.auth_token is defined

    - name: Cleanup installation files
      file:
        path: /tmp/illumio-pce-install
        state: absent
      when: illumio_pce_cleanup_install_files | bool

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_pce_install/install_pce | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_pce_install_install_pce_preflight_passed | bool
          - fe_illumio_illumio_pce_install_install_pce_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_pce_install/install_pce: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_pce_install_install_pce_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_pce_install_install_pce_status | default('unknown') }}.
        success_msg: "illumio/illumio_pce_install/install_pce: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_pce_install/install_pce | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_install_pce_postflight_passed: true
        fe_illumio_illumio_pce_install_install_pce_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_pce_install/install_pce | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_install_pce_status: "failed"
        fe_illumio_illumio_pce_install_install_pce_postflight_passed: false
        fe_illumio_illumio_pce_install_install_pce_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_pce_install_install_pce_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/install_pce | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_pce_install/install_pce: FAILED at '{{ fe_illumio_illumio_pce_install_install_pce_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_pce_install_install_pce_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/install_pce | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_pce_install/install_pce failed at '{{ fe_illumio_illumio_pce_install_install_pce_failed_task }}': {{ fe_illumio_illumio_pce_install_install_pce_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_pce_install/install_pce | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_install_pce_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_pce_install_install_pce_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_pce_install_install_pce_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_pce_install/install_pce | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_pce_install/install_pce":
              component: "illumio/illumio_pce_install/install_pce"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_pce_install_install_pce_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_pce_install_install_pce_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_pce_install_install_pce_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_pce_install_install_pce_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_pce_install_install_pce_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_pce_install_install_pce_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_pce_install_install_pce_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_pce_install_install_pce_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_pce_install_install_pce_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_pce_install_install_pce_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_pce_install_install_pce_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_pce_install_install_pce_status | default('') == 'succeeded' else ['illumio/illumio_pce_install/install_pce'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_pce_install/install_pce | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_install_pce_stats_published: true
      tags:
        - always
