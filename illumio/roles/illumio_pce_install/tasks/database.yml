---
# PostgreSQL database installation and configuration for PCE

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_pce_install/database']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_pce_install_database_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_pce_install/database | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_pce_install_database_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_pce_install_database_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_pce_install_database_status: "running"
    fe_illumio_illumio_pce_install_database_preflight_passed: false
    fe_illumio_illumio_pce_install_database_postflight_passed: false
    fe_illumio_illumio_pce_install_database_failed_task: ""
    fe_illumio_illumio_pce_install_database_error: ""
    fe_illumio_illumio_pce_install_database_stats_published: false
  tags:
    - always

- name: "illumio/illumio_pce_install/database | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_pce_install/database | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_pce_install/database: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_pce_install/database: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/database | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_pce_install/database: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_pce_install/database: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_pce_install_database_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/database | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_database_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install PostgreSQL repository (RHEL/CentOS)
      yum:
        name: "{{ illumio_pce_postgresql_repo_url }}"
        state: present
        disable_gpg_check: yes
      when: ansible_distribution_major_version in ["7", "8", "9"]

    - name: Disable default PostgreSQL module (RHEL 8/9)
      command: dnf -qy module disable postgresql
      when: ansible_distribution_major_version in ["8", "9"]
      changed_when: false

    - name: Install PostgreSQL packages
      package:
        name:
          - "postgresql{{ illumio_pce_postgresql_version }}-server"
          - "postgresql{{ illumio_pce_postgresql_version }}-contrib"
          - "postgresql{{ illumio_pce_postgresql_version }}"
          - python3-psycopg2
        state: present

    - name: Check if PostgreSQL is initialized
      stat:
        path: "{{ illumio_pce_postgresql_data_dir }}/PG_VERSION"
      register: pg_initialized

    - name: Initialize PostgreSQL database
      command: "/usr/pgsql-{{ illumio_pce_postgresql_version }}/bin/postgresql-{{ illumio_pce_postgresql_version }}-setup initdb"
      when: not pg_initialized.stat.exists

    - name: Configure PostgreSQL for PCE
      template:
        src: postgresql.conf.j2
        dest: "{{ illumio_pce_postgresql_data_dir }}/postgresql.conf"
        owner: postgres
        group: postgres
        mode: '0600'
      notify: restart postgresql

    - name: Configure PostgreSQL authentication
      template:
        src: pg_hba.conf.j2
        dest: "{{ illumio_pce_postgresql_data_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: '0600'
      notify: restart postgresql

    - name: Start and enable PostgreSQL
      systemd:
        name: "postgresql-{{ illumio_pce_postgresql_version }}"
        enabled: yes
        state: started

    - name: Wait for PostgreSQL to be ready
      wait_for:
        port: 5432
        host: localhost
        timeout: 30

    - name: Create PCE database
      postgresql_db:
        name: "{{ illumio_pce_database_name }}"
        encoding: UTF8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        template: template0
        state: present
      become: yes
      become_user: postgres

    - name: Create PCE database user
      postgresql_user:
        name: "{{ illumio_pce_database_user }}"
        password: "{{ illumio_pce_database_password }}"
        encrypted: yes
        state: present
      become: yes
      become_user: postgres
      no_log: true

    - name: Grant privileges to PCE database user
      postgresql_privs:
        database: "{{ illumio_pce_database_name }}"
        privs: ALL
        type: database
        role: "{{ illumio_pce_database_user }}"
        state: present
      become: yes
      become_user: postgres

    - name: Enable required PostgreSQL extensions
      postgresql_ext:
        name: "{{ item }}"
        db: "{{ illumio_pce_database_name }}"
        state: present
      loop:
        - pg_stat_statements
        - pgcrypto
      become: yes
      become_user: postgres

    - name: Configure PostgreSQL for PCE cluster (if cluster mode)
      include_tasks: database_cluster.yml
      when: illumio_pce_cluster_mode | bool

    - name: Create database backup directory
      file:
        path: "{{ illumio_pce_database_backup_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Configure automated database backups
      cron:
        name: "Illumio PCE database backup"
        minute: "0"
        hour: "{{ illumio_pce_backup_hour }}"
        job: "/usr/pgsql-{{ illumio_pce_postgresql_version }}/bin/pg_dump -U {{ illumio_pce_database_user }} -Fc {{ illumio_pce_database_name }} > {{ illumio_pce_database_backup_dir }}/pce_backup_$(date +\\%Y\\%m\\%d_\\%H\\%M\\%S).dump"
        user: postgres
      when: illumio_pce_enable_db_backup | bool

    - name: Create database backup cleanup script
      copy:
        content: |
          #!/bin/bash
          # Keep only last {{ illumio_pce_backup_retention_days }} days of backups
          find {{ illumio_pce_database_backup_dir }} -name "pce_backup_*.dump" -mtime +{{ illumio_pce_backup_retention_days }} -delete
        dest: /usr/local/bin/cleanup_pce_backups.sh
        mode: '0755'
      when: illumio_pce_enable_db_backup | bool

    - name: Schedule backup cleanup
      cron:
        name: "Cleanup old PCE database backups"
        minute: "30"
        hour: "{{ illumio_pce_backup_hour }}"
        job: "/usr/local/bin/cleanup_pce_backups.sh"
        user: postgres
      when: illumio_pce_enable_db_backup | bool

    - name: Configure PostgreSQL connection pooling (PgBouncer)
      include_tasks: pgbouncer.yml
      when: illumio_pce_use_pgbouncer | bool

    - name: Verify database connectivity
      postgresql_ping:
        db: "{{ illumio_pce_database_name }}"
        login_host: "{{ illumio_pce_database_host }}"
        login_user: "{{ illumio_pce_database_user }}"
        login_password: "{{ illumio_pce_database_password }}"
      no_log: true

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_pce_install/database | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_pce_install_database_preflight_passed | bool
          - fe_illumio_illumio_pce_install_database_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_pce_install/database: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_pce_install_database_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_pce_install_database_status | default('unknown') }}.
        success_msg: "illumio/illumio_pce_install/database: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_pce_install/database | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_database_postflight_passed: true
        fe_illumio_illumio_pce_install_database_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_pce_install/database | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_database_status: "failed"
        fe_illumio_illumio_pce_install_database_postflight_passed: false
        fe_illumio_illumio_pce_install_database_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_pce_install_database_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/database | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_pce_install/database: FAILED at '{{ fe_illumio_illumio_pce_install_database_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_pce_install_database_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/database | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_pce_install/database failed at '{{ fe_illumio_illumio_pce_install_database_failed_task }}': {{ fe_illumio_illumio_pce_install_database_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_pce_install/database | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_database_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_pce_install_database_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_pce_install_database_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_pce_install/database | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_pce_install/database":
              component: "illumio/illumio_pce_install/database"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_pce_install_database_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_pce_install_database_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_pce_install_database_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_pce_install_database_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_pce_install_database_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_pce_install_database_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_pce_install_database_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_pce_install_database_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_pce_install_database_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_pce_install_database_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_pce_install_database_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_pce_install_database_status | default('') == 'succeeded' else ['illumio/illumio_pce_install/database'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_pce_install/database | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_database_stats_published: true
      tags:
        - always
