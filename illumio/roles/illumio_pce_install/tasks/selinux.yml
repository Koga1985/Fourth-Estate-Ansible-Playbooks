---
# SELinux configuration for PCE

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_pce_install/selinux']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_pce_install_selinux_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_pce_install/selinux | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_pce_install_selinux_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_pce_install_selinux_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_pce_install_selinux_status: "running"
    fe_illumio_illumio_pce_install_selinux_preflight_passed: false
    fe_illumio_illumio_pce_install_selinux_postflight_passed: false
    fe_illumio_illumio_pce_install_selinux_failed_task: ""
    fe_illumio_illumio_pce_install_selinux_error: ""
    fe_illumio_illumio_pce_install_selinux_stats_published: false
  tags:
    - always

- name: "illumio/illumio_pce_install/selinux | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_pce_install/selinux | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_pce_install/selinux: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_pce_install/selinux: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/selinux | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_pce_install/selinux: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_pce_install/selinux: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_pce_install_selinux_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/selinux | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_selinux_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install SELinux management tools
      package:
        name:
          - policycoreutils-python-utils
          - setools-console
        state: present
      when: ansible_distribution_major_version in ["8", "9"]

    - name: Install SELinux management tools (RHEL 7)
      package:
        name:
          - policycoreutils-python
          - setools-console
        state: present
      when: ansible_distribution_major_version == "7"

    - name: Set SELinux file contexts for PCE directories
      sefcontext:
        target: "{{ item.path }}(/.*)?"
        setype: "{{ item.setype }}"
        state: present
      loop:
        - { path: '/opt/illumio-pce', setype: 'usr_t' }
        - { path: '{{ illumio_pce_data_dir }}', setype: 'var_lib_t' }
        - { path: '{{ illumio_pce_data_dir }}/log', setype: 'var_log_t' }
        - { path: '{{ illumio_pce_config_dir }}', setype: 'etc_t' }

    - name: Apply SELinux file contexts
      command: restorecon -R {{ item }}
      loop:
        - /opt/illumio-pce
        - "{{ illumio_pce_data_dir }}"
        - "{{ illumio_pce_config_dir }}"
      changed_when: true

    - name: Allow PCE to bind to required ports
      seport:
        ports: "{{ item }}"
        proto: tcp
        setype: http_port_t
        state: present
      loop:
        - 8443
        - 8444
        - 8445
        - 8446

    - name: Create SELinux policy module for PCE
      copy:
        content: |
          module illumio_pce 1.0;

          require {
            type unconfined_t;
            type usr_t;
            type var_lib_t;
            type http_port_t;
            class tcp_socket { bind listen accept };
            class file { read write execute open };
          }

          # Allow PCE to bind to custom ports
          allow unconfined_t http_port_t:tcp_socket { bind listen accept };

          # Allow PCE to read/write data files
          allow unconfined_t var_lib_t:file { read write open };

          # Allow PCE to execute binaries
          allow unconfined_t usr_t:file execute;
        dest: /tmp/illumio_pce.te
        mode: '0644'

    - name: Compile SELinux policy module
      shell: |
        checkmodule -M -m -o /tmp/illumio_pce.mod /tmp/illumio_pce.te
        semodule_package -o /tmp/illumio_pce.pp -m /tmp/illumio_pce.mod
      args:
        creates: /tmp/illumio_pce.pp

    - name: Install SELinux policy module
      command: semodule -i /tmp/illumio_pce.pp
      register: semodule_install
      changed_when: semodule_install.rc == 0

    - name: Allow PCE network connections
      seboolean:
        name: "{{ item }}"
        state: yes
        persistent: yes
      loop:
        - httpd_can_network_connect
        - httpd_can_network_connect_db
      when: ansible_distribution_major_version in ["7", "8", "9"]

    - name: Set SELinux to enforcing mode (if configured)
      selinux:
        policy: targeted
        state: enforcing
      when: illumio_pce_selinux_enforcing | bool

    - name: Verify SELinux status
      command: getenforce
      register: selinux_status
      changed_when: false

    - name: Display SELinux status
      debug:
        msg: "SELinux is currently in {{ selinux_status.stdout }} mode"

    - name: Check for SELinux denials
      shell: ausearch -m avc -ts recent | grep illumio || echo "No recent SELinux denials found"
      register: selinux_denials
      changed_when: false
      failed_when: false

    - name: Display SELinux denials (if any)
      debug:
        var: selinux_denials.stdout_lines
      when: "'denied' in selinux_denials.stdout"

    - name: Create SELinux troubleshooting guide
      copy:
        content: |
          Illumio PCE SELinux Configuration
          =================================

          Current Status: {{ selinux_status.stdout }}

          Configured Ports:
          - 8443/tcp (PCE Web Console)
          - 8444/tcp (Service Core)
          - 8445/tcp (Event Service)
          - 8446/tcp (Management)

          File Contexts:
          - /opt/illumio-pce: usr_t
          - {{ illumio_pce_data_dir }}: var_lib_t
          - {{ illumio_pce_data_dir }}/log: var_log_t
          - {{ illumio_pce_config_dir }}: etc_t

          Troubleshooting SELinux Issues:
          1. Check for denials:
             ausearch -m avc -ts recent | grep illumio

          2. Generate policy from denials:
             ausearch -m avc -ts recent | audit2allow -M illumio_pce_custom
             semodule -i illumio_pce_custom.pp

          3. Temporarily set to permissive (troubleshooting only):
             setenforce 0

          4. Check file contexts:
             ls -Z /opt/illumio-pce
             ls -Z {{ illumio_pce_data_dir }}

          5. Restore file contexts:
             restorecon -R /opt/illumio-pce
             restorecon -R {{ illumio_pce_data_dir }}

        dest: /etc/illumio-pce/selinux-guide.txt
        mode: '0644'

    - name: Cleanup temporary SELinux files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/illumio_pce.te
        - /tmp/illumio_pce.mod
        - /tmp/illumio_pce.pp

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_pce_install/selinux | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_pce_install_selinux_preflight_passed | bool
          - fe_illumio_illumio_pce_install_selinux_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_pce_install/selinux: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_pce_install_selinux_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_pce_install_selinux_status | default('unknown') }}.
        success_msg: "illumio/illumio_pce_install/selinux: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_pce_install/selinux | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_selinux_postflight_passed: true
        fe_illumio_illumio_pce_install_selinux_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_pce_install/selinux | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_selinux_status: "failed"
        fe_illumio_illumio_pce_install_selinux_postflight_passed: false
        fe_illumio_illumio_pce_install_selinux_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_pce_install_selinux_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/selinux | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_pce_install/selinux: FAILED at '{{ fe_illumio_illumio_pce_install_selinux_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_pce_install_selinux_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/selinux | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_pce_install/selinux failed at '{{ fe_illumio_illumio_pce_install_selinux_failed_task }}': {{ fe_illumio_illumio_pce_install_selinux_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_pce_install/selinux | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_selinux_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_pce_install_selinux_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_pce_install_selinux_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_pce_install/selinux | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_pce_install/selinux":
              component: "illumio/illumio_pce_install/selinux"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_pce_install_selinux_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_pce_install_selinux_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_pce_install_selinux_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_pce_install_selinux_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_pce_install_selinux_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_pce_install_selinux_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_pce_install_selinux_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_pce_install_selinux_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_pce_install_selinux_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_pce_install_selinux_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_pce_install_selinux_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_pce_install_selinux_status | default('') == 'succeeded' else ['illumio/illumio_pce_install/selinux'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_pce_install/selinux | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_selinux_stats_published: true
      tags:
        - always
