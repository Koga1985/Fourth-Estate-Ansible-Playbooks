---
# SSL/TLS certificate configuration for PCE

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_pce_install/certificates']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_pce_install_certificates_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_pce_install/certificates | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_pce_install_certificates_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_pce_install_certificates_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_pce_install_certificates_status: "running"
    fe_illumio_illumio_pce_install_certificates_preflight_passed: false
    fe_illumio_illumio_pce_install_certificates_postflight_passed: false
    fe_illumio_illumio_pce_install_certificates_failed_task: ""
    fe_illumio_illumio_pce_install_certificates_error: ""
    fe_illumio_illumio_pce_install_certificates_stats_published: false
  tags:
    - always

- name: "illumio/illumio_pce_install/certificates | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_pce_install/certificates | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_pce_install/certificates: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_pce_install/certificates: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/certificates | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_pce_install/certificates: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_pce_install/certificates: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_pce_install_certificates_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_pce_install/certificates | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_certificates_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create certificate directory
      file:
        path: "{{ illumio_pce_cert_dir }}"
        state: directory
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0700'

    - name: Copy SSL certificate
      copy:
        src: "{{ illumio_pce_ssl_cert_file }}"
        dest: "{{ illumio_pce_cert_dir }}/server.crt"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0644'
      when: illumio_pce_ssl_cert_file is defined
      notify: restart illumio-pce

    - name: Copy SSL private key
      copy:
        src: "{{ illumio_pce_ssl_key_file }}"
        dest: "{{ illumio_pce_cert_dir }}/server.key"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0600'
      when: illumio_pce_ssl_key_file is defined
      no_log: true
      notify: restart illumio-pce

    - name: Copy SSL CA certificate chain
      copy:
        src: "{{ illumio_pce_ssl_ca_file }}"
        dest: "{{ illumio_pce_cert_dir }}/ca-bundle.crt"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0644'
      when: illumio_pce_ssl_ca_file is defined
      notify: restart illumio-pce

    - name: Generate self-signed certificate (if no cert provided)
      block:
        - name: Install OpenSSL
          package:
            name: openssl
            state: present

        - name: Generate private key
          openssl_privatekey:
            path: "{{ illumio_pce_cert_dir }}/server.key"
            size: 4096
            owner: "{{ illumio_pce_user }}"
            group: "{{ illumio_pce_group }}"
            mode: '0600'

        - name: Generate certificate signing request
          openssl_csr:
            path: "{{ illumio_pce_cert_dir }}/server.csr"
            privatekey_path: "{{ illumio_pce_cert_dir }}/server.key"
            common_name: "{{ illumio_pce_fqdn }}"
            subject_alt_name:
              - "DNS:{{ illumio_pce_fqdn }}"
              - "DNS:{{ ansible_hostname }}"
              - "IP:{{ ansible_default_ipv4.address }}"
            organization_name: "{{ illumio_pce_org_name | default('Fourth Estate') }}"
            country_name: "{{ illumio_pce_cert_country | default('US') }}"
            state_or_province_name: "{{ illumio_pce_cert_state | default('DC') }}"
            locality_name: "{{ illumio_pce_cert_locality | default('Washington') }}"

        - name: Generate self-signed certificate
          openssl_certificate:
            path: "{{ illumio_pce_cert_dir }}/server.crt"
            privatekey_path: "{{ illumio_pce_cert_dir }}/server.key"
            csr_path: "{{ illumio_pce_cert_dir }}/server.csr"
            provider: selfsigned
            selfsigned_not_after: "+3650d"
            owner: "{{ illumio_pce_user }}"
            group: "{{ illumio_pce_group }}"
            mode: '0644'

        - name: Create CA bundle from self-signed cert
          copy:
            src: "{{ illumio_pce_cert_dir }}/server.crt"
            dest: "{{ illumio_pce_cert_dir }}/ca-bundle.crt"
            remote_src: yes
            owner: "{{ illumio_pce_user }}"
            group: "{{ illumio_pce_group }}"
            mode: '0644'

      when:
        - illumio_pce_ssl_cert_file is not defined
        - illumio_pce_generate_selfsigned_cert | bool

    - name: Validate certificate and key match
      shell: |
        cert_md5=$(openssl x509 -noout -modulus -in {{ illumio_pce_cert_dir }}/server.crt | openssl md5)
        key_md5=$(openssl rsa -noout -modulus -in {{ illumio_pce_cert_dir }}/server.key | openssl md5)
        if [ "$cert_md5" = "$key_md5" ]; then
          echo "Certificate and key match"
          exit 0
        else
          echo "Certificate and key do not match"
          exit 1
        fi
      register: cert_validation
      changed_when: false

    - name: Configure PCE to use certificates
      blockinfile:
        path: /etc/illumio-pce/runtime_env.yml
        marker: "# {mark} ANSIBLE MANAGED - SSL CERTIFICATES"
        block: |
          ssl_certificate_file: {{ illumio_pce_cert_dir }}/server.crt
          ssl_certificate_key_file: {{ illumio_pce_cert_dir }}/server.key
          ssl_ca_certificate_file: {{ illumio_pce_cert_dir }}/ca-bundle.crt
          ssl_protocols: "TLSv1.2 TLSv1.3"
          ssl_ciphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0600'
      notify: restart illumio-pce

    - name: Configure VEN certificate trust
      copy:
        src: "{{ illumio_pce_cert_dir }}/ca-bundle.crt"
        dest: /etc/illumio-pce/ven-ca-bundle.crt
        remote_src: yes
        owner: "{{ illumio_pce_user }}"
        group: "{{ illumio_pce_group }}"
        mode: '0644'

    - name: Add PCE CA to system trust store (RHEL/CentOS)
      copy:
        src: "{{ illumio_pce_cert_dir }}/ca-bundle.crt"
        dest: /etc/pki/ca-trust/source/anchors/illumio-pce-ca.crt
        remote_src: yes
        mode: '0644'
      notify: update-ca-trust

    - name: Update CA trust store
      command: update-ca-trust extract
      when: ansible_os_family == "RedHat"

    - name: Set certificate expiration reminder
      cron:
        name: "Check PCE certificate expiration"
        minute: "0"
        hour: "8"
        day: "1"
        job: "openssl x509 -checkend 2592000 -noout -in {{ illumio_pce_cert_dir }}/server.crt || echo 'PCE certificate expires within 30 days' | mail -s 'PCE Certificate Expiration Warning' {{ illumio_pce_admin_email }}"
      when: illumio_pce_admin_email is defined

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_pce_install/certificates | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_pce_install_certificates_preflight_passed | bool
          - fe_illumio_illumio_pce_install_certificates_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_pce_install/certificates: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_pce_install_certificates_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_pce_install_certificates_status | default('unknown') }}.
        success_msg: "illumio/illumio_pce_install/certificates: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_pce_install/certificates | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_certificates_postflight_passed: true
        fe_illumio_illumio_pce_install_certificates_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_pce_install/certificates | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_certificates_status: "failed"
        fe_illumio_illumio_pce_install_certificates_postflight_passed: false
        fe_illumio_illumio_pce_install_certificates_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_pce_install_certificates_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/certificates | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_pce_install/certificates: FAILED at '{{ fe_illumio_illumio_pce_install_certificates_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_pce_install_certificates_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_pce_install/certificates | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_pce_install/certificates failed at '{{ fe_illumio_illumio_pce_install_certificates_failed_task }}': {{ fe_illumio_illumio_pce_install_certificates_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_pce_install/certificates | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_certificates_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_pce_install_certificates_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_pce_install_certificates_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_pce_install/certificates | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_pce_install/certificates":
              component: "illumio/illumio_pce_install/certificates"
              type: "role-tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_pce_install_certificates_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_pce_install_certificates_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_pce_install_certificates_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_pce_install_certificates_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_pce_install_certificates_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_pce_install_certificates_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_pce_install_certificates_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_pce_install_certificates_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_pce_install_certificates_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_pce_install_certificates_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_pce_install_certificates_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_pce_install_certificates_status | default('') == 'succeeded' else ['illumio/illumio_pce_install/certificates'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_pce_install/certificates | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_pce_install_certificates_stats_published: true
      tags:
        - always
