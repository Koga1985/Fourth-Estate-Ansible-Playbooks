---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_int__servicenow_change']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_int__servicenow_change_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_int__servicenow_change | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_int__servicenow_change_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_int__servicenow_change_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_int__servicenow_change_status: "running"
    fe_illumio_illumio_int__servicenow_change_preflight_passed: false
    fe_illumio_illumio_int__servicenow_change_postflight_passed: false
    fe_illumio_illumio_int__servicenow_change_failed_task: ""
    fe_illumio_illumio_int__servicenow_change_error: ""
    fe_illumio_illumio_int__servicenow_change_stats_published: false
  tags:
    - always

- name: "illumio/illumio_int__servicenow_change | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_int__servicenow_change | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_int__servicenow_change: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_int__servicenow_change: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_int__servicenow_change | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_int__servicenow_change: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_int__servicenow_change: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_int__servicenow_change_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_int__servicenow_change | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_int__servicenow_change_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/illumio-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Set common headers
      ansible.builtin.set_fact:
        illumio_headers:
          Accept: "application/json"
          Content-Type: "application/json"
          X-Illumio-Org: "{{ org_id }}"

    - name: Assert change payload
      ansible.builtin.assert:
        that: [ snow.url is defined, snow.user is defined, snow.token is defined, change is defined ]
        fail_msg: "Provide snow creds and change (short_description, description, payload)."

    - name: Open change for policy promotion
      ansible.builtin.uri:
        url: "{{ snow.url }}/api/now/table/{{ snow.change_table | default('change_request') }}"
        method: POST
        force_basic_auth: true
        url_username: "{{ snow.user }}"
        url_password: "{{ snow.token }}"
        headers: { "Content-Type": "application/json" }
        body_format: json
        body: "{{ change }}"
        status_code: 200,201
      register: _chg

    - name: Save change artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/illumio-artifacts') }}/servicenow_change.json"
        mode: "0644"
        content: "{{ _chg.json | default(_chg.content) }}"

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_int__servicenow_change | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_int__servicenow_change_preflight_passed | bool
          - fe_illumio_illumio_int__servicenow_change_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_int__servicenow_change: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_int__servicenow_change_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_int__servicenow_change_status | default('unknown') }}.
        success_msg: "illumio/illumio_int__servicenow_change: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_int__servicenow_change | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_int__servicenow_change_postflight_passed: true
        fe_illumio_illumio_int__servicenow_change_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_int__servicenow_change | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_int__servicenow_change_status: "failed"
        fe_illumio_illumio_int__servicenow_change_postflight_passed: false
        fe_illumio_illumio_int__servicenow_change_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_int__servicenow_change_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_int__servicenow_change | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_int__servicenow_change: FAILED at '{{ fe_illumio_illumio_int__servicenow_change_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_int__servicenow_change_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_int__servicenow_change | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_int__servicenow_change failed at '{{ fe_illumio_illumio_int__servicenow_change_failed_task }}': {{ fe_illumio_illumio_int__servicenow_change_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_int__servicenow_change | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_int__servicenow_change_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_int__servicenow_change_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_int__servicenow_change_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_int__servicenow_change | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_int__servicenow_change":
              component: "illumio/illumio_int__servicenow_change"
              type: "tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_int__servicenow_change_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_int__servicenow_change_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_int__servicenow_change_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_int__servicenow_change_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_int__servicenow_change_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_int__servicenow_change_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_int__servicenow_change_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_int__servicenow_change_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_int__servicenow_change_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_int__servicenow_change_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_int__servicenow_change_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_int__servicenow_change_status | default('') == 'succeeded' else ['illumio/illumio_int__servicenow_change'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_int__servicenow_change | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_int__servicenow_change_stats_published: true
      tags:
        - always
