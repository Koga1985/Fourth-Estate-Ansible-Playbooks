---
# =============================================================================
# Illumio OT ACL Monitor — Playbook 01
# =============================================================================
#
# PURPOSE:
#   Polls the Illumio PCE for new or pending ACL/security-rule changes in OT-
#   labeled workload scopes, compares them against the last known baseline, and
#   alerts the network team whenever new items are detected. This playbook is
#   designed to run on a schedule (cron / AAP schedule) OR manually, and it
#   produces no firewall changes itself — it only detects and alerts.
#
# WORKFLOW:
#   1. Connect to PCE and query pending (draft, not yet provisioned) policy
#   2. Load previous baseline from disk (created on first run)
#   3. Diff — anything in pending but NOT in baseline is "new"
#   4. If new ACLs found → email network team + optional webhook
#   5. Persist updated baseline so next run only alerts on truly new items
#   6. Save a human-readable report artifact for audit trail
#
# SCHEDULING (choose one):
#   # Linux cron — every 15 minutes
#   */15 * * * * ansible-playbook /opt/playbooks/illumio/playbooks/01_illumio_ot_acl_monitor.yml \
#     -i /opt/playbooks/illumio/inventory_ot --ask-vault-pass 2>&1 | logger -t illumio-ot-monitor
#
#   # Ansible Automation Platform — add a Schedule to the Job Template
#   # Set the schedule frequency in AAP; no cron line needed.
#
# USAGE:
#   # Standard scan (alerts only on new items since last run)
#   ansible-playbook illumio/playbooks/01_illumio_ot_acl_monitor.yml \
#     -i illumio/inventory_ot --ask-vault-pass
#
#   # Reset baseline — treat ALL current pending items as new (re-alerts)
#   ansible-playbook illumio/playbooks/01_illumio_ot_acl_monitor.yml \
#     -i illumio/inventory_ot --ask-vault-pass -e "reset_baseline=true"
#
#   # Scan only — skip alerting (useful for debugging)
#   ansible-playbook illumio/playbooks/01_illumio_ot_acl_monitor.yml \
#     -i illumio/inventory_ot --ask-vault-pass --tags detect
#
# AFTER THIS PLAYBOOK:
#   When alerts fire, the network team reviews the pending ACL report at:
#     {{ ot_artifacts_dir }}/acl_pending.json
#   Then runs playbook 02 to deploy approved ACLs:
#     ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml ...
# =============================================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Illumio OT ACL Monitor — Detect and Alert
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: false

  vars:
    # ── Override these in inventory_ot or pass via -e ───────────────────────
    # pce_url:    set in inventory_ot (e.g. https://pce.example.com:8443)
    # org_id:     set in inventory_ot (e.g. 1)
    # api_user:   "{{ vault_illumio_api_user }}"   — from vault
    # api_key:    "{{ vault_illumio_api_key }}"    — from vault

    # Detection control
    reset_baseline: false          # true → treat all current pending as new

    # Artifacts
    ot_artifacts_dir: /tmp/illumio-ot-artifacts
    verify_ssl: true

    # Role mode — do not change
    ot_run_mode: detect

  pre_tasks:
    - name: "illumio/01_illumio_ot_acl_monitor | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "illumio/01_illumio_ot_acl_monitor | Initialize validation state"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_illumio_01_illumio_ot_acl_monitor_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_01_illumio_ot_acl_monitor_status: "running"
            fe_illumio_01_illumio_ot_acl_monitor_preflight_passed: false
            fe_illumio_01_illumio_ot_acl_monitor_postflight_passed: false
            fe_illumio_01_illumio_ot_acl_monitor_failed_task: ""
            fe_illumio_01_illumio_ot_acl_monitor_error: ""
            fe_illumio_01_illumio_ot_acl_monitor_stats_published: false
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              illumio/01_illumio_ot_acl_monitor: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              illumio/01_illumio_ot_acl_monitor: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "illumio/01_illumio_ot_acl_monitor | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "illumio/01_illumio_ot_acl_monitor: required variable '{{ item }}' is not defined."
            success_msg: "illumio/01_illumio_ot_acl_monitor: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_illumio_01_illumio_ot_acl_monitor_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "illumio/01_illumio_ot_acl_monitor | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_status: "preflight_failed"
            fe_illumio_01_illumio_ot_acl_monitor_postflight_passed: false
            fe_illumio_01_illumio_ot_acl_monitor_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_01_illumio_ot_acl_monitor_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/01_illumio_ot_acl_monitor: FAILED at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/01_illumio_ot_acl_monitor":
                  component: "illumio/01_illumio_ot_acl_monitor"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_01_illumio_ot_acl_monitor_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task | default('') }}"
                  error: "{{ fe_illumio_01_illumio_ot_acl_monitor_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else ['illumio/01_illumio_ot_acl_monitor'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_stats_published: true
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/01_illumio_ot_acl_monitor failed at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}': {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              illumio/01_illumio_ot_acl_monitor: preflight
              {{ 'passed' if fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "illumio/01_illumio_ot_acl_monitor | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display monitor banner
          ansible.builtin.debug:
            msg:
              - "══════════════════════════════════════════════════════════════════════"
              - " Illumio OT ACL Monitor"
              - " PCE  : {{ pce_url }}"
              - " Org  : {{ org_id }}"
              - " Time : {{ ansible_date_time.iso8601 }}"
              - " Mode : Detect-only (no changes to firewall policy)"
              - "══════════════════════════════════════════════════════════════════════"
          tags: ['always']

        - name: Create artifacts directory
          ansible.builtin.file:
            path: "{{ ot_artifacts_dir }}"
            state: directory
            mode: '0750'
          tags: ['always']

        - name: "illumio/01_illumio_ot_acl_monitor | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_status: "failed"
            fe_illumio_01_illumio_ot_acl_monitor_postflight_passed: false
            fe_illumio_01_illumio_ot_acl_monitor_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_01_illumio_ot_acl_monitor_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/01_illumio_ot_acl_monitor: FAILED at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/01_illumio_ot_acl_monitor failed at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}': {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_01_illumio_ot_acl_monitor_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_01_illumio_ot_acl_monitor_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/01_illumio_ot_acl_monitor":
                  component: "illumio/01_illumio_ot_acl_monitor"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_01_illumio_ot_acl_monitor_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task | default('') }}"
                  error: "{{ fe_illumio_01_illumio_ot_acl_monitor_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else ['illumio/01_illumio_ot_acl_monitor'] }}
            aggregate: true
            per_host: false
          when:
            - fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'failed'
            - not (fe_illumio_01_illumio_ot_acl_monitor_stats_published | default(false) | bool)
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_stats_published: true
          when:
            - fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'failed'
          tags:
            - always

  tasks:
    # ── PHASE 1: Detect ───────────────────────────────────────────────────────
    - name: "illumio/01_illumio_ot_acl_monitor | Guarded execution with rescue and always handling"
      block:

        - name: "PHASE 1: Detect new OT ACLs in PCE pending policy"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__detect_new_acls.yml"
          tags: ['detect', 'phase1']

        # ── PHASE 2: Alert ────────────────────────────────────────────────────────
        - name: "PHASE 2: Alert network team of new pending ACLs"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__alert_network_team.yml"
          when:
            - ot_new_acls_detected | default(false) | bool
            - ot_notify_on_detect | default(true) | bool
          tags: ['alert', 'phase2']

        - name: "PHASE 2 (skip): No new ACLs — alert suppressed"
          ansible.builtin.debug:
            msg: "No new pending ACLs detected since last scan. No alert sent."
          when: not (ot_new_acls_detected | default(false) | bool)
          tags: ['alert', 'phase2']

        - name: "illumio/01_illumio_ot_acl_monitor | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_status: "failed"
            fe_illumio_01_illumio_ot_acl_monitor_postflight_passed: false
            fe_illumio_01_illumio_ot_acl_monitor_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_01_illumio_ot_acl_monitor_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/01_illumio_ot_acl_monitor: FAILED at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          tags:
            - always
            - rescue

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/01_illumio_ot_acl_monitor failed at '{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task }}': {{ fe_illumio_01_illumio_ot_acl_monitor_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_01_illumio_ot_acl_monitor_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_01_illumio_ot_acl_monitor_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/01_illumio_ot_acl_monitor":
                  component: "illumio/01_illumio_ot_acl_monitor"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_01_illumio_ot_acl_monitor_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_01_illumio_ot_acl_monitor_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_01_illumio_ot_acl_monitor_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_01_illumio_ot_acl_monitor_failed_task | default('') }}"
                  error: "{{ fe_illumio_01_illumio_ot_acl_monitor_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_01_illumio_ot_acl_monitor_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'succeeded' else ['illumio/01_illumio_ot_acl_monitor'] }}
            aggregate: true
            per_host: false
          when:
            - fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'failed'
            - not (fe_illumio_01_illumio_ot_acl_monitor_stats_published | default(false) | bool)
          tags:
            - always

        - name: "illumio/01_illumio_ot_acl_monitor | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_stats_published: true
          when:
            - fe_illumio_01_illumio_ot_acl_monitor_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Display scan summary
      ansible.builtin.debug:
        msg: |-
          ══════════════════════════════════════════════════════════════════════
           OT ACL Monitor — Scan Complete
           New ACLs detected : {{ ot_new_acl_count | default(0) }}
           Pending file      : {{ ot_artifacts_dir }}/acl_pending.json
           Baseline file     : {{ ot_artifacts_dir }}/acl_baseline.json
          {% if ot_new_acls_detected | default(false) %}
           !! ACTION REQUIRED — Review pending ACLs and run playbook 02:
              ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
                -i illumio/inventory_ot --ask-vault-pass
          {% else %}
           All clear — no new ACLs detected.
          {% endif %}
          ══════════════════════════════════════════════════════════════════════
      tags: ['always']
    - name: "illumio/01_illumio_ot_acl_monitor | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "illumio/01_illumio_ot_acl_monitor | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | bool
              - fe_illumio_01_illumio_ot_acl_monitor_status in ['running', 'succeeded']
            fail_msg: >-
              illumio/01_illumio_ot_acl_monitor: postflight validation failed - preflight passed
              ={{ fe_illumio_01_illumio_ot_acl_monitor_preflight_passed | default(false) }},
              status={{ fe_illumio_01_illumio_ot_acl_monitor_status | default('unknown') }}.
            success_msg: "illumio/01_illumio_ot_acl_monitor: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "illumio/01_illumio_ot_acl_monitor | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_illumio_01_illumio_ot_acl_monitor_postflight_passed: true
            fe_illumio_01_illumio_ot_acl_monitor_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "illumio/01_illumio_ot_acl_monitor | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
