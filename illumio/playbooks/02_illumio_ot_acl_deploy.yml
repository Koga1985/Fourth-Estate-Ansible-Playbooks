---
# =============================================================================
# Illumio OT ACL Deploy — Playbook 02
# =============================================================================
#
# PURPOSE:
#   Manually-triggered deployment of approved ACLs into the Illumio PCE for
#   OT environments. This playbook MUST be run by a human after reviewing the
#   alert produced by playbook 01. It is safe by default (dry_run: true) and
#   requires explicit operator confirmation to apply or promote changes.
#
# WORKFLOW:
#   1. Display a full summary of ACLs to be deployed (always — dry run or not)
#   2. Validate ACLs against OT zone policy (Purdue model, protocol allowlist)
#   3. [dry_run: true]  Stop here — show what WOULD happen. No PCE changes.
#   4. [apply_changes: true]  Create/update rules in PCE draft policy
#   5. [promote_policy: true]  Provision draft → active (live enforcement)
#   6. Notify network team on completion
#
# SAFETY GATES:
#   dry_run: true         → default; validates and previews only (no PCE writes)
#   apply_changes: true   → writes rules to PCE draft (NOT yet enforced)
#   promote_policy: true  → promotes draft to active (traffic NOW affected)
#                           Requires apply_changes: true as well.
#   brownout_enabled: true → checks estimated traffic impact before promoting;
#                            aborts if newly-blocked flows exceed deny_threshold
#
# CUSTOMER QUICK START:
#   Step 1 — Define your ACLs in inventory_ot under [localhost:vars]:
#             ot_acls:
#               - name: "Allow HMI to PLC Modbus"
#                 rule_set_name: "OT Control Zone Rules"
#                 ...  (see inventory_ot.example for full format)
#
#   Step 2 — Dry run (always do this first):
#     ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
#       -i illumio/inventory_ot --ask-vault-pass
#
#   Step 3 — Apply to PCE draft (rules created, not yet enforced):
#     ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
#       -i illumio/inventory_ot --ask-vault-pass \
#       -e "apply_changes=true"
#
#   Step 4 — Promote to active enforcement (traffic is now affected):
#     ansible-playbook illumio/playbooks/02_illumio_ot_acl_deploy.yml \
#       -i illumio/inventory_ot --ask-vault-pass \
#       -e "apply_changes=true promote_policy=true"
#
# TAG SHORTCUTS:
#   --tags validate           Run validation only (no PCE calls)
#   --tags apply              Run apply only (skip validation gate output)
#   --tags promote            Run promotion only (assumes rules already in PCE)
#   --skip-tags notify        Skip end-of-run notifications
# =============================================================================

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Illumio OT ACL Deploy — Manual Deployment Gate
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    # ── Override these in inventory_ot or pass via -e ───────────────────────
    # pce_url:    set in inventory_ot
    # org_id:     set in inventory_ot
    # api_user:   "{{ vault_illumio_api_user }}"
    # api_key:    "{{ vault_illumio_api_key }}"

    # ── Safety gates (override with -e to advance) ───────────────────────────
    dry_run: true              # false to write to PCE
    apply_changes: false       # true to create/update rules in PCE draft
    promote_policy: false      # true to provision draft → active enforcement

    # ── Blast-radius guard for promotion ────────────────────────────────────
    brownout_enabled: true     # check traffic impact before promoting
    deny_threshold: 0          # max newly-blocked flows tolerated (0 = zero tolerance)

    # ── Artifacts ────────────────────────────────────────────────────────────
    ot_artifacts_dir: /tmp/illumio-ot-artifacts
    verify_ssl: true

    # ── Role mode — do not change ────────────────────────────────────────────
    ot_run_mode: deploy

  pre_tasks:
    - name: "illumio/02_illumio_ot_acl_deploy | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "illumio/02_illumio_ot_acl_deploy | Initialize validation state"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_illumio_02_illumio_ot_acl_deploy_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_02_illumio_ot_acl_deploy_status: "running"
            fe_illumio_02_illumio_ot_acl_deploy_preflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_failed_task: ""
            fe_illumio_02_illumio_ot_acl_deploy_error: ""
            fe_illumio_02_illumio_ot_acl_deploy_stats_published: false
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              illumio/02_illumio_ot_acl_deploy: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              illumio/02_illumio_ot_acl_deploy: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "illumio/02_illumio_ot_acl_deploy | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "illumio/02_illumio_ot_acl_deploy: required variable '{{ item }}' is not defined."
            success_msg: "illumio/02_illumio_ot_acl_deploy: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_illumio_02_illumio_ot_acl_deploy_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "illumio/02_illumio_ot_acl_deploy | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_status: "preflight_failed"
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_02_illumio_ot_acl_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: FAILED at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/02_illumio_ot_acl_deploy":
                  component: "illumio/02_illumio_ot_acl_deploy"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task | default('') }}"
                  error: "{{ fe_illumio_02_illumio_ot_acl_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else ['illumio/02_illumio_ot_acl_deploy'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_stats_published: true
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/02_illumio_ot_acl_deploy failed at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}': {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: preflight
              {{ 'passed' if fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "illumio/02_illumio_ot_acl_deploy | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Validate safety gate logic
          ansible.builtin.assert:
            that:
              - not (promote_policy | bool and not apply_changes | bool)
            fail_msg: >
              promote_policy=true requires apply_changes=true.
              You must write rules to PCE before promoting them.
              Add -e "apply_changes=true promote_policy=true" to promote.
          tags: ['always']

        - name: Display deployment banner
          ansible.builtin.debug:
            msg: |-
              ══════════════════════════════════════════════════════════════════════
               Illumio OT ACL Deploy
               PCE            : {{ pce_url }}
               Org            : {{ org_id }}
               Operator       : {{ ansible_user_id }}
               Time           : {{ ansible_date_time.iso8601 }}
              ────────────────────────────────────────────────────────────────────
               dry_run        : {{ dry_run }}
               apply_changes  : {{ apply_changes }}
               promote_policy : {{ promote_policy }}
               brownout_check : {{ brownout_enabled }}
               deny_threshold : {{ deny_threshold }} flows
              ────────────────────────────────────────────────────────────────────
              {% if dry_run | bool %}
               !! DRY RUN — no changes will be made to PCE policy
               !! To apply: add -e 'apply_changes=true'
              {% elif not promote_policy | bool %}
               !! Rules will be written to PCE DRAFT only (not yet enforced)
               !! To enforce: add -e 'apply_changes=true promote_policy=true'
              {% else %}
               !! LIVE ENFORCEMENT — traffic will be affected after promotion
              {% endif %}
              ══════════════════════════════════════════════════════════════════════
          tags: ['always']

        - name: Create artifacts directory
          ansible.builtin.file:
            path: "{{ ot_artifacts_dir }}"
            state: directory
            mode: '0750'
          tags: ['always']

        - name: Record deployment start
          ansible.builtin.copy:
            dest: "{{ ot_artifacts_dir }}/deploy_start_{{ ansible_date_time.date }}.txt"
            content: |
              OT ACL Deployment
              Operator   : {{ ansible_user_id }}
              PCE        : {{ pce_url }}
              Org        : {{ org_id }}
              Started    : {{ ansible_date_time.iso8601 }}
              dry_run    : {{ dry_run }}
              apply      : {{ apply_changes }}
              promote    : {{ promote_policy }}
            mode: '0640'
          tags: ['always']

        - name: "illumio/02_illumio_ot_acl_deploy | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_status: "failed"
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_02_illumio_ot_acl_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: FAILED at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/02_illumio_ot_acl_deploy failed at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}': {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_02_illumio_ot_acl_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_02_illumio_ot_acl_deploy_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/02_illumio_ot_acl_deploy":
                  component: "illumio/02_illumio_ot_acl_deploy"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task | default('') }}"
                  error: "{{ fe_illumio_02_illumio_ot_acl_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else ['illumio/02_illumio_ot_acl_deploy'] }}
            aggregate: true
            per_host: false
          when:
            - fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'failed'
            - not (fe_illumio_02_illumio_ot_acl_deploy_stats_published | default(false) | bool)
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_stats_published: true
          when:
            - fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'failed'
          tags:
            - always

  tasks:
    # ── PHASE 1: Validate ─────────────────────────────────────────────────────
    - name: "illumio/02_illumio_ot_acl_deploy | Guarded execution with rescue and always handling"
      block:

        - name: "PHASE 1: Validate ACL definitions against OT zone policy"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__validate_acls.yml"
          tags: ['validate', 'phase1']

        # ── PHASE 2: Apply (dry-run safe) ─────────────────────────────────────────
        - name: "PHASE 2: Apply ACLs to PCE draft policy"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__apply_acls.yml"
          tags: ['apply', 'phase2']

        # ── PHASE 3: Promote (gated) ──────────────────────────────────────────────
        - name: "PHASE 3: Promote draft policy to active enforcement"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__promote_policy.yml"
          when:
            - apply_changes | bool
            - promote_policy | bool
          tags: ['promote', 'phase3']

        - name: "PHASE 3 (skip): Promotion not requested"
          ansible.builtin.debug:
            msg:
              - "Promotion skipped — rules are in PCE draft."
              - "To enforce: re-run with -e 'apply_changes=true promote_policy=true'"
          when: not (apply_changes | bool and promote_policy | bool)
          tags: ['promote', 'phase3']

        # ── PHASE 4: Notify ───────────────────────────────────────────────────────
        - name: "PHASE 4: Send deployment completion notification"
          ansible.builtin.include_role:
            name: illumio_ot_acl_deployment
            tasks_from: "includes/illumio_ot__alert_network_team.yml"
          when:
            - apply_changes | bool
            - ot_notify_on_deploy | default(true) | bool
          tags: ['notify', 'phase4']

        - name: "illumio/02_illumio_ot_acl_deploy | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_status: "failed"
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_02_illumio_ot_acl_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: FAILED at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/02_illumio_ot_acl_deploy failed at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}': {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_02_illumio_ot_acl_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_02_illumio_ot_acl_deploy_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/02_illumio_ot_acl_deploy":
                  component: "illumio/02_illumio_ot_acl_deploy"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task | default('') }}"
                  error: "{{ fe_illumio_02_illumio_ot_acl_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else ['illumio/02_illumio_ot_acl_deploy'] }}
            aggregate: true
            per_host: false
          when:
            - fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'failed'
            - not (fe_illumio_02_illumio_ot_acl_deploy_stats_published | default(false) | bool)
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_stats_published: true
          when:
            - fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |-
          ══════════════════════════════════════════════════════════════════════
           OT ACL Deploy — Complete
           ACLs processed   : {{ ot_acls | default([]) | length }}
           ACLs applied     : {{ ot_acls_applied | default(0) }}
           Artifacts        : {{ ot_artifacts_dir }}
          {% if apply_changes | bool and promote_policy | bool %}
           Policy status    : PROMOTED — rules are now ACTIVE and enforced
          {% elif apply_changes | bool %}
           Policy status    : DRAFT — rules in PCE but NOT yet enforced
           Next step        : promote with -e 'apply_changes=true promote_policy=true'
          {% else %}
           Policy status    : DRY RUN — no changes made to PCE
           Next step        : apply with -e 'apply_changes=true'
          {% endif %}
          ══════════════════════════════════════════════════════════════════════
      tags: ['always']
    - name: "illumio/02_illumio_ot_acl_deploy | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "illumio/02_illumio_ot_acl_deploy | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | bool
              - fe_illumio_02_illumio_ot_acl_deploy_status in ['running', 'succeeded']
            fail_msg: >-
              illumio/02_illumio_ot_acl_deploy: postflight validation failed - preflight passed
              ={{ fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) }},
              status={{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }}.
            success_msg: "illumio/02_illumio_ot_acl_deploy: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "illumio/02_illumio_ot_acl_deploy | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: true
            fe_illumio_02_illumio_ot_acl_deploy_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_status: "failed"
            fe_illumio_02_illumio_ot_acl_deploy_postflight_passed: false
            fe_illumio_02_illumio_ot_acl_deploy_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_illumio_02_illumio_ot_acl_deploy_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: FAILED at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          tags:
            - always
            - rescue

        - name: "illumio/02_illumio_ot_acl_deploy | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              illumio/02_illumio_ot_acl_deploy failed at '{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task }}': {{ fe_illumio_02_illumio_ot_acl_deploy_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_illumio_02_illumio_ot_acl_deploy_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_02_illumio_ot_acl_deploy_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "illumio/02_illumio_ot_acl_deploy":
                  component: "illumio/02_illumio_ot_acl_deploy"
                  type: "playbook"
                  platform: "illumio"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }}"
                  preflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_illumio_02_illumio_ot_acl_deploy_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_started_at | default('') }}"
                  ended_at: "{{ fe_illumio_02_illumio_ot_acl_deploy_ended_at | default('') }}"
                  duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_illumio_02_illumio_ot_acl_deploy_failed_task | default('') }}"
                  error: "{{ fe_illumio_02_illumio_ot_acl_deploy_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_illumio_02_illumio_ot_acl_deploy_status | default('') == 'succeeded' else ['illumio/02_illumio_ot_acl_deploy'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_illumio_02_illumio_ot_acl_deploy_stats_published | default(false) | bool)
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_illumio_02_illumio_ot_acl_deploy_stats_published: true
          tags:
            - always

        - name: "illumio/02_illumio_ot_acl_deploy | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              illumio/02_illumio_ot_acl_deploy: {{ fe_illumio_02_illumio_ot_acl_deploy_status | default('unknown') }} in
              {{ fe_illumio_02_illumio_ot_acl_deploy_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
