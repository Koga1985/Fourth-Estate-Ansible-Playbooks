---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['illumio/illumio_ven__download_installer']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_illumio_illumio_ven__download_installer_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "illumio/illumio_ven__download_installer | Initialize validation state"
  ansible.builtin.set_fact:
    fe_illumio_illumio_ven__download_installer_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_illumio_illumio_ven__download_installer_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_illumio_illumio_ven__download_installer_status: "running"
    fe_illumio_illumio_ven__download_installer_preflight_passed: false
    fe_illumio_illumio_ven__download_installer_postflight_passed: false
    fe_illumio_illumio_ven__download_installer_failed_task: ""
    fe_illumio_illumio_ven__download_installer_error: ""
    fe_illumio_illumio_ven__download_installer_stats_published: false
  tags:
    - always

- name: "illumio/illumio_ven__download_installer | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "illumio/illumio_ven__download_installer | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          illumio/illumio_ven__download_installer: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          illumio/illumio_ven__download_installer: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ven__download_installer | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "illumio/illumio_ven__download_installer: required variable '{{ item }}' is not defined."
        success_msg: "illumio/illumio_ven__download_installer: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_illumio_illumio_ven__download_installer_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "illumio/illumio_ven__download_installer | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven__download_installer_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts dir
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/illumio-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Set common headers
      ansible.builtin.set_fact:
        illumio_headers:
          Accept: "application/json"
          Content-Type: "application/json"
          X-Illumio-Org: "{{ org_id }}"

    - name: Assert platform list
      ansible.builtin.assert:
        that: [ platforms is defined, platforms | length > 0 ]
        fail_msg: "Provide platforms like: ['linux-x86_64','windows-x64']"

    - name: Download VEN installers (endpoint path may vary)
      ansible.builtin.get_url:
        url: "{{ pce_url }}/api/v2/orgs/{{ org_id }}/software/ven/{{ item }}/latest"
        dest: "{{ artifacts_dir | default('/tmp/illumio-artifacts') }}/illumio-ven-{{ item }}.pkg"
        validate_certs: "{{ verify_ssl | default(true) }}"
        headers:
          Authorization: "Basic {{ (api_user + ':' + api_key) | b64encode }}"
          X-Illumio-Org: "{{ org_id }}"
        mode: "0644"
      loop: "{{ platforms }}"
      loop_control: { label: "{{ item }}" }

    # ----------------------------- postflight -------------------

    - name: "illumio/illumio_ven__download_installer | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_illumio_illumio_ven__download_installer_preflight_passed | bool
          - fe_illumio_illumio_ven__download_installer_status in ['running', 'succeeded']
        fail_msg: >-
          illumio/illumio_ven__download_installer: postflight validation failed - preflight passed
          ={{ fe_illumio_illumio_ven__download_installer_preflight_passed | default(false) }},
          status={{ fe_illumio_illumio_ven__download_installer_status | default('unknown') }}.
        success_msg: "illumio/illumio_ven__download_installer: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "illumio/illumio_ven__download_installer | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven__download_installer_postflight_passed: true
        fe_illumio_illumio_ven__download_installer_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "illumio/illumio_ven__download_installer | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven__download_installer_status: "failed"
        fe_illumio_illumio_ven__download_installer_postflight_passed: false
        fe_illumio_illumio_ven__download_installer_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_illumio_illumio_ven__download_installer_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ven__download_installer | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          illumio/illumio_ven__download_installer: FAILED at '{{ fe_illumio_illumio_ven__download_installer_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_illumio_illumio_ven__download_installer_error }}
      tags:
        - always
        - rescue

    - name: "illumio/illumio_ven__download_installer | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          illumio/illumio_ven__download_installer failed at '{{ fe_illumio_illumio_ven__download_installer_failed_task }}': {{ fe_illumio_illumio_ven__download_installer_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "illumio/illumio_ven__download_installer | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven__download_installer_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_illumio_illumio_ven__download_installer_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_illumio_illumio_ven__download_installer_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "illumio/illumio_ven__download_installer | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "illumio/illumio_ven__download_installer":
              component: "illumio/illumio_ven__download_installer"
              type: "tasks"
              platform: "illumio"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_illumio_illumio_ven__download_installer_status | default('unknown') }}"
              preflight_passed: "{{ fe_illumio_illumio_ven__download_installer_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_illumio_illumio_ven__download_installer_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_illumio_illumio_ven__download_installer_started_at | default('') }}"
              ended_at: "{{ fe_illumio_illumio_ven__download_installer_ended_at | default('') }}"
              duration_seconds: "{{ fe_illumio_illumio_ven__download_installer_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_illumio_illumio_ven__download_installer_failed_task | default('') }}"
              error: "{{ fe_illumio_illumio_ven__download_installer_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_illumio_illumio_ven__download_installer_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_illumio_illumio_ven__download_installer_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_illumio_illumio_ven__download_installer_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_illumio_illumio_ven__download_installer_status | default('') == 'succeeded' else ['illumio/illumio_ven__download_installer'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "illumio/illumio_ven__download_installer | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_illumio_illumio_ven__download_installer_stats_published: true
      tags:
        - always
