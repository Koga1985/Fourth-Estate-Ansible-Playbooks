# tasks/infoblox_inventory_model.yml
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_inventory_model']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_inventory_model_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_inventory_model | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_inventory_model_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_inventory_model_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_inventory_model_status: "running"
    fe_infoblox_infoblox_inventory_model_preflight_passed: false
    fe_infoblox_infoblox_inventory_model_postflight_passed: false
    fe_infoblox_infoblox_inventory_model_failed_task: ""
    fe_infoblox_infoblox_inventory_model_error: ""
    fe_infoblox_infoblox_inventory_model_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_inventory_model | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_inventory_model | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_inventory_model: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_inventory_model: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_inventory_model | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_inventory_model: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_inventory_model: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_inventory_model_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_inventory_model | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_inventory_model_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Build Infoblox provider
      ansible.builtin.set_fact:
        nios_provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          validate_certs: "{{ nios_validate_certs | default(false) }}"

    # -------------------- Extensible Attribute DEFINITIONS --------------------
    # Standardize EA schema first, so all objects can use the same keys/flags.
    # Types: string | integer | date | list | url | email | checkbox (per docs)
      no_log: true
    - name: Ensure EA definitions exist
      infoblox.nios_modules.nios_extensible_attribute:
        name: "{{ item.name }}"
        type: "{{ item.type | default('string') }}"
        comment: "{{ item.comment | default(omit) }}"
        default_value: "{{ item.default_value | default(omit) }}"
        flags: "{{ item.flags | default(omit) }}"  # e.g., "CI" (Cloud API + Inheritable)
        list_values: "{{ item.list_values | default(omit) }}"  # when type: list
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ ea_definitions | default([]) }}"

    # -------------------- NETWORK (DHCP/IPAM) VIEWS --------------------------
    - name: Ensure Network Views (DHCP/IPAM views)
      infoblox.nios_modules.nios_network_view:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ network_views | default([]) }}"

    # -------------------- DNS VIEWS ------------------------------------------
    - name: Ensure DNS Views
      infoblox.nios_modules.nios_dns_view:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ dns_views | default([]) }}"

    # -------------------- VLANs ----------------------------------------------
    # If you use VLAN views/ranges, set parent accordingly (defaults to 'default').
    - name: Ensure VLANs
      infoblox.nios_modules.nios_vlan:
        name: "{{ item.name }}"
        id: "{{ item.id }}"
        parent: "{{ item.parent | default('default') }}"   # vlanview or vlanrange
        description: "{{ item.description | default(omit) }}"
        contact: "{{ item.contact | default(omit) }}"
        department: "{{ item.department | default(omit) }}"
        reserved: "{{ item.reserved | default(omit) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ vlans | default([]) }}"

    # -------------------- NETWORK CONTAINERS ---------------------------------
    # Create/maintain supernets (containers) per network view and tag with EAs.
    - name: Ensure IPv4 Network CONTAINERS
      infoblox.nios_modules.nios_network:
        network: "{{ item.cidr }}"
        network_view: "{{ item.view | default('default') }}"
        comment: "{{ item.comment | default(omit) }}"
        container: true           # <-- creates a network *container* (not a leaf network)
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ network_containers_v4 | default([]) }}"

    - name: Ensure IPv6 Network CONTAINERS
      infoblox.nios_modules.nios_network:
        network: "{{ item.cidr }}"
        network_view: "{{ item.view | default('default') }}"
        comment: "{{ item.comment | default(omit) }}"
        container: true
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ network_containers_v6 | default([]) }}"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_inventory_model | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_inventory_model_preflight_passed | bool
          - fe_infoblox_infoblox_inventory_model_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_inventory_model: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_inventory_model_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_inventory_model_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_inventory_model: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_inventory_model | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_inventory_model_postflight_passed: true
        fe_infoblox_infoblox_inventory_model_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_inventory_model | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_inventory_model_status: "failed"
        fe_infoblox_infoblox_inventory_model_postflight_passed: false
        fe_infoblox_infoblox_inventory_model_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_inventory_model_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_inventory_model | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_inventory_model: FAILED at '{{ fe_infoblox_infoblox_inventory_model_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_inventory_model_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_inventory_model | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_inventory_model failed at '{{ fe_infoblox_infoblox_inventory_model_failed_task }}': {{ fe_infoblox_infoblox_inventory_model_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_inventory_model | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_inventory_model_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_inventory_model_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_inventory_model_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_inventory_model | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_inventory_model":
              component: "infoblox/infoblox_inventory_model"
              type: "tasks"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_inventory_model_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_inventory_model_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_inventory_model_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_inventory_model_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_inventory_model_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_inventory_model_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_inventory_model_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_inventory_model_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_inventory_model_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_inventory_model_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_inventory_model_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_inventory_model_status | default('') == 'succeeded' else ['infoblox/infoblox_inventory_model'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_inventory_model | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_inventory_model_stats_published: true
      tags:
        - always
