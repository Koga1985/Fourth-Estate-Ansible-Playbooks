# tasks/infoblox_dhcp_reservations.yml
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dhcp_reservations']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dhcp_reservations_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dhcp_reservations | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dhcp_reservations_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dhcp_reservations_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dhcp_reservations_status: "running"
    fe_infoblox_infoblox_dhcp_reservations_preflight_passed: false
    fe_infoblox_infoblox_dhcp_reservations_postflight_passed: false
    fe_infoblox_infoblox_dhcp_reservations_failed_task: ""
    fe_infoblox_infoblox_dhcp_reservations_error: ""
    fe_infoblox_infoblox_dhcp_reservations_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dhcp_reservations | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dhcp_reservations | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dhcp_reservations: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dhcp_reservations: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dhcp_reservations | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dhcp_reservations: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dhcp_reservations: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dhcp_reservations_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dhcp_reservations | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_reservations_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        network_view: "{{ network_view | default('default') }}"
        dhcp_reservations: "{{ dhcp_reservations | default([]) }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-dhcp-reservations') }}"

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Provider (Infoblox SDK)
      ansible.builtin.set_fact:
        nios_provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          wapi_version: "{{ nios_wapi_version }}"
          ssl_verify: "{{ nios_validate_certs }}"

    # Create / update / delete fixed-address reservations by MAC
      no_log: true
    - name: Ensure DHCP fixed-address reservations
      vars:
        _opts: >-
          {{
            (item.options | default([])) + (
              item.routers is defined
                | ternary([{'name': 'routers', 'value': (item.routers | join(','))}], [])
            ) + (
              item.domain_name is defined
                | ternary([{'name': 'domain-name', 'value': item.domain_name}], [])
            ) + (
              item.dns_servers is defined
                | ternary([{'name': 'domain-name-servers', 'value': (item.dns_servers | join(','))}], [])
            )
          }}
      infoblox.nios_modules.nios_fixed_address:
        provider: "{{ nios_provider }}"
        name: "{{ item.name | default(omit) }}"                 # Hostname (optional but recommended)
        mac: "{{ item.mac | lower }}"                           # Reservation key
        match_type: "{{ item.match_type | default('MAC_ADDRESS') }}"
        ipv4addr: "{{ item.ip | default(omit) }}"               # Optional if you want static IP; omit to let NIOS pick
        network_view: "{{ item.network_view | default(network_view) }}"
        comment: "{{ item.comment | default(omit) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        options: "{{ _opts if _opts | length > 0 else omit }}"
        # Other useful knobs you may use as needed:
        # bootfile: "{{ item.bootfile | default(omit) }}"
        # next_server: "{{ item.next_server | default(omit) }}"
        # use_bootfile: "{{ item.use_bootfile | default(omit) }}"
        # use_next_server: "{{ item.use_next_server | default(omit) }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ dhcp_reservations }}"
      loop_control:
        label: "{{ item.name | default(item.mac) }}"

    - name: Save summary artifact (names/MACs only)
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/dhcp_reservations_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "count": (dhcp_reservations | length),
              "items": dhcp_reservations
                      | map('extract', attribute='mac')
                      | list
            } | to_nice_json
          }}

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Managed {{ dhcp_reservations | length }} fixed-address reservation(s)"
          - "Artifact: {{ artifact_dir }}/dhcp_reservations_summary.json"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dhcp_reservations | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dhcp_reservations_preflight_passed | bool
          - fe_infoblox_infoblox_dhcp_reservations_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dhcp_reservations: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dhcp_reservations_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dhcp_reservations_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dhcp_reservations: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dhcp_reservations | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_reservations_postflight_passed: true
        fe_infoblox_infoblox_dhcp_reservations_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dhcp_reservations | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_reservations_status: "failed"
        fe_infoblox_infoblox_dhcp_reservations_postflight_passed: false
        fe_infoblox_infoblox_dhcp_reservations_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dhcp_reservations_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dhcp_reservations | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dhcp_reservations: FAILED at '{{ fe_infoblox_infoblox_dhcp_reservations_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dhcp_reservations_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dhcp_reservations | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dhcp_reservations failed at '{{ fe_infoblox_infoblox_dhcp_reservations_failed_task }}': {{ fe_infoblox_infoblox_dhcp_reservations_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dhcp_reservations | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_reservations_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dhcp_reservations_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dhcp_reservations_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dhcp_reservations | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dhcp_reservations":
              component: "infoblox/infoblox_dhcp_reservations"
              type: "tasks"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dhcp_reservations_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dhcp_reservations_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dhcp_reservations_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dhcp_reservations_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dhcp_reservations_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dhcp_reservations_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dhcp_reservations_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dhcp_reservations_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dhcp_reservations_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dhcp_reservations_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dhcp_reservations_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dhcp_reservations_status | default('') == 'succeeded' else ['infoblox/infoblox_dhcp_reservations'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dhcp_reservations | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_reservations_stats_published: true
      tags:
        - always
