# tasks/infoblox_subnet_lifecycle.yml
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_subnet_lifecycle']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_subnet_lifecycle_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_subnet_lifecycle | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_subnet_lifecycle_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_subnet_lifecycle_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_subnet_lifecycle_status: "running"
    fe_infoblox_infoblox_subnet_lifecycle_preflight_passed: false
    fe_infoblox_infoblox_subnet_lifecycle_postflight_passed: false
    fe_infoblox_infoblox_subnet_lifecycle_failed_task: ""
    fe_infoblox_infoblox_subnet_lifecycle_error: ""
    fe_infoblox_infoblox_subnet_lifecycle_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_subnet_lifecycle | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_subnet_lifecycle | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_subnet_lifecycle: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_subnet_lifecycle: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_subnet_lifecycle | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_subnet_lifecycle: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_subnet_lifecycle: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_subnet_lifecycle_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_subnet_lifecycle | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_subnet_lifecycle_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        network_view: "{{ network_view | default('default') }}"
        subnet_requests: "{{ subnet_requests | default([]) }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-subnet-lifecycle') }}"
        lifecycle_ea_key: "{{ lifecycle_ea_key | default('Lifecycle') }}"      # EA to mark: requested/approved/active/deprecated
        ticket_ea_key: "{{ ticket_ea_key | default('RequestID') }}"            # EA to stash ticket/change id

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

    # Helper lookups ------------------------------------------------------
      no_log: true
    - name: Lookup all network containers (for next_available network)
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/networkcontainer"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 10000
          "_return_fields+": "network,network_view,_ref,extattrs,comment"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: _containers
      failed_when: false

    - name: Map containers by CIDR
      ansible.builtin.set_fact:
        _cont_by_cidr: "{{ dict( ((_containers.json.result | default([])) | map(attribute='network') | list) | zip(_containers.json.result | default([])) ) }}"

    - name: Lookup existing networks snapshot
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/network"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 20000
          "_return_fields+": "network,network_view,_ref,comment,extattrs"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: _nets
      failed_when: false

    - name: Map networks by CIDR
      ansible.builtin.set_fact:
        _net_by_cidr: "{{ dict( ((_nets.json.result | default([])) | map(attribute='network') | list) | zip(_nets.json.result | default([])) ) }}"

    # Work log
    - name: Init lifecycle log
      ansible.builtin.set_fact:
        _lifecycle_log: []

    # ---------------------------------------------------------------------
    # Handler per request item
    # Each item supports keys (use what applies):
    #   action: request|approve|create|deprecate|subdivide
    #   cidr: "10.50.0.0/24"             # for approve/create/deprecate/subdivide
    #   container: "10.50.0.0/16"        # for create (next_available)
    #   new_prefix: 26                    # for subdivide (new child prefix)
    #   view: "default"
    #   comment: "why/what"
    #   request_id: "CHG0123456"
    #   extattrs: { Site: { value: "BR50" }, App: { value: "Retail" } }  # merged on create/approve/deprecate
    # ---------------------------------------------------------------------
    - name: Process subnet lifecycle items
      vars:
        VIEW: "{{ item.view | default(network_view) }}"
      block:
        # ---------------- request (no changes, just log / artifact) -----------
        - name: Record REQUEST
          when: item.action == "request"
          ansible.builtin.set_fact:
            _lifecycle_log: "{{ _lifecycle_log + [ {'action':'request','requested':item} ] }}"

        # ---------------- approve -> set EA on an existing network ------------
        - name: "APPROVE: set EAs on existing network"
          when: item.action == "approve" and item.cidr is defined and _net_by_cidr.get(item.cidr) is defined
          vars:
            _ref: "{{ _net_by_cidr[item.cidr]._ref }}"
            _merged_ea: >-
              {{
                (_net_by_cidr[item.cidr].extattrs | default({}))
                  | combine({ lifecycle_ea_key: {'value': 'approved'} }, recursive=True)
                  | combine( item.extattrs | default({}), recursive=True )
                  | combine( { ticket_ea_key: {'value': item.request_id } } if item.request_id is defined else {}, recursive=True )
              }}
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { extattrs: "{{ _merged_ea }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: approve_put
          failed_when: false

        - name: "APPROVE: log when network missing"
          when: item.action == "approve" and (item.cidr is not defined or _net_by_cidr.get(item.cidr) is not defined)
          ansible.builtin.set_fact:
            _lifecycle_log: "{{ _lifecycle_log + [ {'action':'approve','skipped':'network-not-found','item':item} ] }}"

        # ---------------- create -> cidr or next_available --------------------
        - name: "CREATE: get next available network (if container & prefix given)"
          when: item.action == "create" and (item.cidr is not defined) and (item.container is defined) and (item.new_prefix is defined) and (_cont_by_cidr.get(item.container) is defined)
          vars:
            _cref: "{{ _cont_by_cidr[item.container]._ref }}"
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _cref }}?_function=next_available_network"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body:
              num: 1
              cidr: "{{ item.new_prefix }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: navn
          failed_when: false

        - name: "CREATE: compute target CIDR"
          when: item.action == "create"
          ansible.builtin.set_fact:
            _target_cidr: >-
              {% if item.cidr is defined %}{{ item.cidr }}
              {% elif (navn.json | default({})).networks is defined and (navn.json.networks | length) > 0 %}{{ navn.json.networks[0] }}
              {% else %}{{ omit }}{% endif %}

        - name: "CREATE: ensure network present"
          when: item.action == "create" and _target_cidr is defined
          infoblox.nios_modules.nios_network:
            network: "{{ _target_cidr }}"
            network_view: "{{ VIEW }}"
            comment: "{{ item.comment | default(omit) }}"
            extattrs: >-
              {{
                (item.extattrs | default({}))
                  | combine({ lifecycle_ea_key: {'value': 'active'} }, recursive=True)
                  | combine( { ticket_ea_key: {'value': item.request_id } } if item.request_id is defined else {}, recursive=True )
              }}
            state: present

        - name: "CREATE: log insufficient info"
          when: item.action == "create" and (_target_cidr is not defined)
          ansible.builtin.set_fact:
            _lifecycle_log: "{{ _lifecycle_log + [ {'action':'create','skipped':'no-cidr-nor-next_available','item':item} ] }}"

        # ---------------- deprecate -> mark EAs (non-destructive) -------------
        - name: "DEPRECATE: set EA on existing network"
          when: item.action == "deprecate" and item.cidr is defined and _net_by_cidr.get(item.cidr) is defined
          vars:
            _ref: "{{ _net_by_cidr[item.cidr]._ref }}"
            _merged_ea: >-
              {{
                (_net_by_cidr[item.cidr].extattrs | default({}))
                  | combine({ lifecycle_ea_key: {'value': 'deprecated'} }, recursive=True)
                  | combine( item.extattrs | default({}), recursive=True )
                  | combine( { ticket_ea_key: {'value': item.request_id } } if item.request_id is defined else {}, recursive=True )
              }}
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { extattrs: "{{ _merged_ea }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: deprecate_put
          failed_when: false

        - name: "DEPRECATE: log when network missing"
          when: item.action == "deprecate" and (item.cidr is not defined or _net_by_cidr.get(item.cidr) is not defined)
          ansible.builtin.set_fact:
            _lifecycle_log: "{{ _lifecycle_log + [ {'action':'deprecate','skipped':'network-not-found','item':item} ] }}"

        # ---------------- subdivide -> split network to smaller prefix --------
        - name: "SUBDIVIDE: split network via WAPI (best-effort)"
          when: item.action == "subdivide" and item.cidr is defined and item.new_prefix is defined and _net_by_cidr.get(item.cidr) is defined
          vars:
            _nref: "{{ _net_by_cidr[item.cidr]._ref }}"
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _nref }}?_function=split_network"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body:
              prefix: "{{ item.new_prefix }}"     # desired child prefix (e.g., 26 to split /24 into /26s)
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: split_post
          failed_when: false

        - name: "SUBDIVIDE: log when missing bits"
          when: item.action == "subdivide" and (item.cidr is not defined or item.new_prefix is not defined or _net_by_cidr.get(item.cidr) is not defined)
          ansible.builtin.set_fact:
            _lifecycle_log: "{{ _lifecycle_log + [ {'action':'subdivide','skipped':'missing-cidr-or-prefix-or-network-not-found','item':item} ] }}"
      loop: "{{ subnet_requests }}"
      loop_control: { label: "{{ item.action }} {{ item.cidr | default(item.container | default('')) }}" }

    # ---------------------------------------------------------------------
    # Artifact
    # ---------------------------------------------------------------------
    - name: Save subnet lifecycle artifact
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/subnet_lifecycle_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "requests": subnet_requests,
              "log": _lifecycle_log
            } | to_nice_json
          }}

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Processed {{ subnet_requests | length }} subnet lifecycle item(s)"
          - "Artifact: {{ artifact_dir }}/subnet_lifecycle_summary.json"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_subnet_lifecycle | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_subnet_lifecycle_preflight_passed | bool
          - fe_infoblox_infoblox_subnet_lifecycle_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_subnet_lifecycle: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_subnet_lifecycle_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_subnet_lifecycle_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_subnet_lifecycle: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_subnet_lifecycle | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_subnet_lifecycle_postflight_passed: true
        fe_infoblox_infoblox_subnet_lifecycle_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_subnet_lifecycle | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_subnet_lifecycle_status: "failed"
        fe_infoblox_infoblox_subnet_lifecycle_postflight_passed: false
        fe_infoblox_infoblox_subnet_lifecycle_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_subnet_lifecycle_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_subnet_lifecycle | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_subnet_lifecycle: FAILED at '{{ fe_infoblox_infoblox_subnet_lifecycle_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_subnet_lifecycle_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_subnet_lifecycle | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_subnet_lifecycle failed at '{{ fe_infoblox_infoblox_subnet_lifecycle_failed_task }}': {{ fe_infoblox_infoblox_subnet_lifecycle_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_subnet_lifecycle | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_subnet_lifecycle_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_subnet_lifecycle_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_subnet_lifecycle_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_subnet_lifecycle | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_subnet_lifecycle":
              component: "infoblox/infoblox_subnet_lifecycle"
              type: "tasks"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_subnet_lifecycle_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_subnet_lifecycle_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_subnet_lifecycle_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_subnet_lifecycle_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_subnet_lifecycle_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_subnet_lifecycle_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_subnet_lifecycle_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_subnet_lifecycle_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_subnet_lifecycle_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_subnet_lifecycle_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_subnet_lifecycle_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_subnet_lifecycle_status | default('') == 'succeeded' else ['infoblox/infoblox_subnet_lifecycle'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_subnet_lifecycle | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_subnet_lifecycle_stats_published: true
      tags:
        - always
