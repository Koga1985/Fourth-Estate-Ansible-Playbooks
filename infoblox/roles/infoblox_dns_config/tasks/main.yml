---
# tasks file for infoblox_dns_config
# Infoblox DNS Service Configuration for Fourth Estate Agencies
# Manages DNS forwarders, DNSSEC, RRL, caching, and logging

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dns_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dns_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dns_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dns_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dns_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dns_config_status: "running"
    fe_infoblox_infoblox_dns_config_preflight_passed: false
    fe_infoblox_infoblox_dns_config_postflight_passed: false
    fe_infoblox_infoblox_dns_config_failed_task: ""
    fe_infoblox_infoblox_dns_config_error: ""
    fe_infoblox_infoblox_dns_config_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dns_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dns_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dns_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dns_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dns_config: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dns_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dns_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure Infoblox connection variables are defined
      ansible.builtin.assert:
        that:
          - infoblox_grid_master is defined
          - infoblox_username is defined
          - infoblox_password is defined
        fail_msg: "Required Infoblox connection variables are not defined"

    - name: Configure global DNS properties
      infoblox.nios_modules.nios_dns_view:
        name: "default"
        network_view: "default"
        comment: "Default DNS view for Fourth Estate"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dns
        - views

    - name: Configure DNS views for Split DNS
      infoblox.nios_modules.nios_dns_view:
        name: "{{ item.name }}"
        network_view: "{{ item.network_view | default('default') }}"
        comment: "{{ item.comment }}"
        enable_blacklist: "{{ item.enable_blacklist | default(false) }}"
        enable_fixed_rrset_order_fqdns: "{{ item.enable_fixed_rrset_order | default(false) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dns_views }}"
      when: infoblox_dns_views is defined
      tags:
        - infoblox
        - dns
        - views
        - splitdns

    - name: Configure DNS forwarders
      infoblox.nios_modules.nios_nsgroup_forwardingmember:
        name: "{{ infoblox_forwarder_group_name }}"
        comment: "DNS forwarders for Fourth Estate"
        forwarding_servers:
          - address: "{{ item.address }}"
            name: "{{ item.name }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dns_forwarders }}"
      when: infoblox_dns_forwarders is defined
      tags:
        - infoblox
        - dns
        - forwarders

    - name: Configure root hints
      infoblox.nios_modules.nios_roothint:
        root_server_ip: "{{ item.ip }}"
        root_server_name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_root_hints }}"
      when:
        - infoblox_configure_root_hints | bool
        - infoblox_root_hints is defined
      tags:
        - infoblox
        - dns
        - roothints

    - name: Configure DNSSEC settings
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          enable_dnssec: "{{ infoblox_enable_dnssec }}"
          enable_dnssec_validation: "{{ infoblox_enable_dnssec_validation }}"
          dnssec_validation_policy: "{{ infoblox_dnssec_validation_policy }}"
          dnssec_key_algorithm: "{{ infoblox_dnssec_key_algorithm }}"
          dnssec_ksk_size: "{{ infoblox_dnssec_ksk_size }}"
          dnssec_zsk_size: "{{ infoblox_dnssec_zsk_size }}"
          dnssec_ksk_rollover_mechanism: "{{ infoblox_dnssec_ksk_rollover }}"
          dnssec_zsk_rollover_mechanism: "{{ infoblox_dnssec_zsk_rollover }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_dnssec | bool
      tags:
        - infoblox
        - dns
        - dnssec

    - name: Configure Response Rate Limiting (RRL) for DDoS protection
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          enable_rrl: "{{ infoblox_enable_rrl }}"
          rrl_ipv4_prefix_length: "{{ infoblox_rrl_ipv4_prefix }}"
          rrl_ipv6_prefix_length: "{{ infoblox_rrl_ipv6_prefix }}"
          rrl_responses_per_second: "{{ infoblox_rrl_responses_per_second }}"
          rrl_errors_per_second: "{{ infoblox_rrl_errors_per_second }}"
          rrl_nxdomains_per_second: "{{ infoblox_rrl_nxdomains_per_second }}"
          rrl_slip_ratio: "{{ infoblox_rrl_slip_ratio }}"
          rrl_window: "{{ infoblox_rrl_window }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_rrl | bool
      tags:
        - infoblox
        - dns
        - rrl
        - security

    - name: Configure recursive queries settings
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          allow_recursive_queries: "{{ infoblox_allow_recursive_queries }}"
          recursive_query_list: "{{ infoblox_recursive_query_acl }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dns
        - recursion

    - name: Configure DNS query source address
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          query_source_address: "{{ infoblox_dns_query_source }}"
          query_source_address_v6: "{{ infoblox_dns_query_source_v6 | default(omit) }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_dns_query_source is defined
      tags:
        - infoblox
        - dns
        - query

    - name: Configure DNS cache settings
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          max_cache_ttl: "{{ infoblox_max_cache_ttl }}"
          max_ncache_ttl: "{{ infoblox_max_ncache_ttl }}"
          max_cached_lifetime: "{{ infoblox_max_cached_lifetime }}"
          lame_ttl: "{{ infoblox_lame_ttl }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dns
        - cache

    - name: Configure DNS logging for security analysis
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          enable_query_logging: "{{ infoblox_enable_query_logging }}"
          log_queries: "{{ infoblox_log_queries }}"
          log_rpz_actions: "{{ infoblox_log_rpz_actions }}"
          enable_dns_stats: "{{ infoblox_enable_dns_stats }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dns
        - logging

    - name: Configure DNS query ACLs
      infoblox.nios_modules.nios_zone:
        fqdn: "{{ item.fqdn }}"
        view: "{{ item.view | default('default') }}"
        zone_format: "FORWARD"
        allow_query:
          - "{{ item.allow_query }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dns_query_acls }}"
      when: infoblox_dns_query_acls is defined
      tags:
        - infoblox
        - dns
        - acl

    - name: Configure DNS blackhole ACL (query source restrictions)
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          blackhole_list: "{{ infoblox_dns_blackhole_list }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_dns_blackhole_list is defined
      tags:
        - infoblox
        - dns
        - security
        - blackhole

    - name: Configure DNS64 for IPv6 transition (if needed)
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          enable_dns64: "{{ infoblox_enable_dns64 }}"
          dns64_prefix: "{{ infoblox_dns64_prefix | default(omit) }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_dns64 | bool
      tags:
        - infoblox
        - dns
        - ipv6

    - name: Configure DNS notification settings
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          notify_delay: "{{ infoblox_notify_delay }}"
          also_notify: "{{ infoblox_also_notify | default(omit) }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dns
        - notify

    - name: Configure sortlist for query response ordering
      infoblox.nios_modules.nios_grid_dns:
        grid_dns_properties:
          sortlist: "{{ infoblox_dns_sortlist }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_dns_sortlist is defined
      tags:
        - infoblox
        - dns
        - sortlist

    - name: Display DNS configuration summary
      ansible.builtin.debug:
        msg:
          - "DNS Views Configured: {{ infoblox_dns_views | length if infoblox_dns_views is defined else 1 }}"
          - "DNSSEC Enabled: {{ infoblox_enable_dnssec }}"
          - "Response Rate Limiting: {{ infoblox_enable_rrl }}"
          - "Query Logging Enabled: {{ infoblox_enable_query_logging }}"
          - "Recursive Queries: {{ infoblox_allow_recursive_queries }}"
      tags:
        - infoblox
        - dns

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dns_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dns_config_preflight_passed | bool
          - fe_infoblox_infoblox_dns_config_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dns_config: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dns_config_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dns_config_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dns_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dns_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_config_postflight_passed: true
        fe_infoblox_infoblox_dns_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dns_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_config_status: "failed"
        fe_infoblox_infoblox_dns_config_postflight_passed: false
        fe_infoblox_infoblox_dns_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dns_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dns_config: FAILED at '{{ fe_infoblox_infoblox_dns_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dns_config_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dns_config failed at '{{ fe_infoblox_infoblox_dns_config_failed_task }}': {{ fe_infoblox_infoblox_dns_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dns_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dns_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dns_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dns_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dns_config":
              component: "infoblox/infoblox_dns_config"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dns_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dns_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dns_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dns_config_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dns_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dns_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dns_config_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dns_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dns_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dns_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dns_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dns_config_status | default('') == 'succeeded' else ['infoblox/infoblox_dns_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dns_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_config_stats_published: true
      tags:
        - always
