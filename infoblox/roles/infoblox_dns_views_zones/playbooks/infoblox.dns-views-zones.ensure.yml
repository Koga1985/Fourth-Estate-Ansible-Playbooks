            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_postflight_passed: false
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure: FAILED at '{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure":
                  component: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_started_at | default('') }}"
