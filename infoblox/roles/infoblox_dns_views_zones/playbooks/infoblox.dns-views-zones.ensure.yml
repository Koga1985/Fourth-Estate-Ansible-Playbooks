---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: infoblox_dns_views_zones
      vars:
        nios_host: "nios.example.local"
        nios_username: "{{ lookup('env','NIOS_USER') }}"
        nios_password: "{{ lookup('env','NIOS_PASS') }}"
        nios_validate_certs: false
        nios_wapi_version: "v2.12"

        dns_views:
          - { name: "default", state: present }
          - { name: "Corp-View", state: present, comment: "corp split-horizon" }

        zones_auth:
          - { fqdn: "corp.example.com", view: "Corp-View", ns_group: "Grid Primary", state: present }
          - { fqdn: "10.20.0.0/16", view: "Corp-View", zone_format: "IPV4", state: present }

        zones_forward:
          - fqdn: "partner.example.net"
            view: "Corp-View"
            forwarders_only: true
            forward_to:
              - { name: "ns1.partner", address: "203.0.113.10" }
              - { name: "ns2.partner", address: "203.0.113.11" }

        zones_stub:
          - fqdn: "branch.corp.example.com"
            view: "Corp-View"
            stub_from:
              - { name: "dc1.branch", address: "10.50.0.10" }
              - { name: "dc2.branch", address: "10.50.0.11" }
  pre_tasks:
    - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Initialize validation state"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_status: "running"
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_preflight_passed: false
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_postflight_passed: false
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_failed_task: ""
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_error: ""
            fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_stats_published: false
          tags:
            - always

        - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure: required variable '{{ item }}' is not defined."
            success_msg: "infoblox/infoblox_dns_views_zones/infoblox.dns-views-zones.ensure: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_infoblox_infoblox_dns_views_zones_infoblox_dns_views_zones_ensure_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

