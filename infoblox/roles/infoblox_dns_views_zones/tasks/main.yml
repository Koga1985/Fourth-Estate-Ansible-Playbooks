---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dns_views_zones']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dns_views_zones_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dns_views_zones | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dns_views_zones_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dns_views_zones_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dns_views_zones_status: "running"
    fe_infoblox_infoblox_dns_views_zones_preflight_passed: false
    fe_infoblox_infoblox_dns_views_zones_postflight_passed: false
    fe_infoblox_infoblox_dns_views_zones_failed_task: ""
    fe_infoblox_infoblox_dns_views_zones_error: ""
    fe_infoblox_infoblox_dns_views_zones_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dns_views_zones | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dns_views_zones | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dns_views_zones: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dns_views_zones: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_views_zones | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dns_views_zones: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dns_views_zones: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dns_views_zones_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_views_zones | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_views_zones_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0

    - name: Set provider fact
      ansible.builtin.set_fact:
        nios_provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          validate_certs: "{{ nios_validate_certs }}"

      no_log: true
    - name: Ensure DNS views
      infoblox.nios_modules.nios_dns_view:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ dns_views | default([]) }}"

    - name: Ensure authoritative zones
      infoblox.nios_modules.nios_zone:
        name: "{{ item.fqdn }}"
        view: "{{ item.view | default('default') }}"
        ns_group: "{{ item.ns_group | default(omit) }}"
        grid_primary: "{{ item.grid_primary | default(omit) }}"
        grid_secondaries: "{{ item.grid_secondaries | default(omit) }}"
        zone_format: "{{ item.zone_format | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ zones_auth | default([]) }}"
      when: zones_auth is defined

    - name: Build WAPI base URL
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"

    - name: Ensure forward zones (WAPI zone_forward)
      vars: { z: "{{ item }}" }
      block:
        - name: Get forward zone
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_forward"
            method: GET
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              fqdn: "{{ z.fqdn }}"
              view: "{{ z.view | default('default') }}"
          no_log: true
          register: fwd_get

        - name: Upsert forward zone
          no_log: true
          when: z.state | default('present') == 'present'
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_forward"
            method: "{{ ((fwd_get.json.result | length) > 0) | ternary('PUT', 'POST') }}"
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            status_code: [200,201]
            headers: { Content-Type: "application/json" }
            body_format: json
            body: >-
              {%- set payload = {
                "fqdn": z.fqdn,
                "view": (z.view | default('default')),
                "forwarders_only": (z.forwarders_only | default(true)),
                "forward_to": (z.forward_to | default([]))
              } -%}
              {%- if (fwd_get.json.result | length) > 0 -%}
              {{ payload | combine({"_ref": fwd_get.json.result[0]["_ref"]}) }}
              {%- else -%}
              {{ payload }}
              {%- endif -%}

        - name: Delete forward zone
          no_log: true
          when: z.state | default('present') == 'absent' and (fwd_get.json.result | length) > 0
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ fwd_get.json.result[0]._ref }}"
            method: DELETE
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            status_code: [200]
      loop: "{{ zones_forward | default([]) }}"

    - name: Ensure stub zones (WAPI zone_stub)
      vars: { z: "{{ item }}" }
      block:
        - name: Get stub zone
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_stub"
            method: GET
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              fqdn: "{{ z.fqdn }}"
              view: "{{ z.view | default('default') }}"
          no_log: true
          register: stub_get

        - name: Upsert stub zone
          no_log: true
          when: z.state | default('present') == 'present'
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_stub"
            method: "{{ ((stub_get.json.result | length) > 0) | ternary('PUT', 'POST') }}"
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            status_code: [200,201]
            headers: { Content-Type: "application/json" }
            body_format: json
            body: >-
              {%- set payload = {
                "fqdn": z.fqdn,
                "view": (z.view | default('default')),
                "stub_from": (z.stub_from | default([]))
              } -%}
              {%- if (stub_get.json.result | length) > 0 -%}
              {{ payload | combine({"_ref": stub_get.json.result[0]["_ref"]}) }}
              {%- else -%}
              {{ payload }}
              {%- endif -%}

        - name: Delete stub zone
          no_log: true
          when: z.state | default('present') == 'absent' and (stub_get.json.result | length) > 0
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ stub_get.json.result[0]._ref }}"
            method: DELETE
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
            status_code: [200]
      loop: "{{ zones_stub | default([]) }}"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dns_views_zones | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dns_views_zones_preflight_passed | bool
          - fe_infoblox_infoblox_dns_views_zones_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dns_views_zones: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dns_views_zones_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dns_views_zones_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dns_views_zones: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dns_views_zones | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_views_zones_postflight_passed: true
        fe_infoblox_infoblox_dns_views_zones_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dns_views_zones | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_views_zones_status: "failed"
        fe_infoblox_infoblox_dns_views_zones_postflight_passed: false
        fe_infoblox_infoblox_dns_views_zones_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dns_views_zones_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_views_zones | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dns_views_zones: FAILED at '{{ fe_infoblox_infoblox_dns_views_zones_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dns_views_zones_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_views_zones | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dns_views_zones failed at '{{ fe_infoblox_infoblox_dns_views_zones_failed_task }}': {{ fe_infoblox_infoblox_dns_views_zones_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dns_views_zones | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_views_zones_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dns_views_zones_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dns_views_zones_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dns_views_zones | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dns_views_zones":
              component: "infoblox/infoblox_dns_views_zones"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dns_views_zones_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dns_views_zones_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dns_views_zones_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dns_views_zones_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dns_views_zones_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dns_views_zones_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dns_views_zones_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dns_views_zones_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dns_views_zones_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dns_views_zones_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dns_views_zones_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dns_views_zones_status | default('') == 'succeeded' else ['infoblox/infoblox_dns_views_zones'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dns_views_zones | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_views_zones_stats_published: true
      tags:
        - always
