---
# tasks file for infoblox_dhcp_config
# Infoblox DHCP Service Configuration for Fourth Estate Agencies
# Manages DHCP service, failover, options, filters, reservations, and logging

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dhcp_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dhcp_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dhcp_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dhcp_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dhcp_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dhcp_config_status: "running"
    fe_infoblox_infoblox_dhcp_config_preflight_passed: false
    fe_infoblox_infoblox_dhcp_config_postflight_passed: false
    fe_infoblox_infoblox_dhcp_config_failed_task: ""
    fe_infoblox_infoblox_dhcp_config_error: ""
    fe_infoblox_infoblox_dhcp_config_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dhcp_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dhcp_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dhcp_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dhcp_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dhcp_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dhcp_config: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dhcp_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dhcp_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dhcp_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure Infoblox connection variables are defined
      ansible.builtin.assert:
        that:
          - infoblox_grid_master is defined
          - infoblox_username is defined
          - infoblox_password is defined
        fail_msg: "Required Infoblox connection variables are not defined"

    - name: Configure global DHCP properties
      infoblox.nios_modules.nios_grid_dhcp_properties:
        enable_dhcp: "{{ infoblox_enable_dhcp }}"
        enable_dhcp_thresholds: "{{ infoblox_enable_dhcp_thresholds }}"
        authority: "{{ infoblox_dhcp_authority }}"
        email_list: "{{ infoblox_dhcp_email_list }}"
        enable_email_warnings: "{{ infoblox_enable_dhcp_email_warnings }}"
        enable_snmp_warnings: "{{ infoblox_enable_dhcp_snmp_warnings }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dhcp
        - config

    - name: Configure DHCP failover associations
      infoblox.nios_modules.nios_dhcp_failover:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        primary_server: "{{ item.primary_server }}"
        secondary_server: "{{ item.secondary_server }}"
        failover_port: "{{ item.failover_port | default(647) }}"
        max_response_delay: "{{ item.max_response_delay | default(60) }}"
        max_unacked_updates: "{{ item.max_unacked_updates | default(10) }}"
        mclt: "{{ item.mclt | default(3600) }}"
        load_balance_split: "{{ item.load_balance_split | default(128) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_failover_pairs }}"
      when: infoblox_dhcp_failover_pairs is defined
      tags:
        - infoblox
        - dhcp
        - failover
        - ha

    - name: Configure DHCP option definitions (custom options)
      infoblox.nios_modules.nios_dhcp_option:
        name: "{{ item.name }}"
        code: "{{ item.code }}"
        type: "{{ item.type }}"
        comment: "{{ item.comment | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_custom_options }}"
      when: infoblox_dhcp_custom_options is defined
      tags:
        - infoblox
        - dhcp
        - options

    - name: Configure global DHCP options
      infoblox.nios_modules.nios_grid_dhcp_properties:
        options:
          - name: "domain-name"
            value: "{{ infoblox_dhcp_domain_name }}"
          - name: "domain-name-servers"
            value: "{{ infoblox_dhcp_dns_servers | join(',') }}"
          - name: "routers"
            value: "{{ infoblox_dhcp_default_gateway }}"
          - name: "ntp-servers"
            value: "{{ infoblox_dhcp_ntp_servers | join(',') }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_configure_global_dhcp_options | bool
      tags:
        - infoblox
        - dhcp
        - options

    - name: Configure DHCP MAC address filters
      infoblox.nios_modules.nios_mac_filter_address:
        filter: "{{ item.mac_address }}"
        comment: "{{ item.comment | default(omit) }}"
        authentication_time: "{{ item.authentication_time | default(omit) }}"
        expiration_time: "{{ item.expiration_time | default(omit) }}"
        fingerprint: "{{ item.fingerprint | default(omit) }}"
        is_registered_user: "{{ item.is_registered_user | default(false) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_mac_filters }}"
      when: infoblox_dhcp_mac_filters is defined
      tags:
        - infoblox
        - dhcp
        - filters
        - security

    - name: Configure DHCP fingerprint filters
      infoblox.nios_modules.nios_fingerprint_filter:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        device_class: "{{ item.device_class }}"
        vendor_id: "{{ item.vendor_id | default(omit) }}"
        option_sequence: "{{ item.option_sequence | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_fingerprint_filters }}"
      when: infoblox_dhcp_fingerprint_filters is defined
      tags:
        - infoblox
        - dhcp
        - filters

    - name: Configure DHCP lease time settings
      infoblox.nios_modules.nios_grid_dhcp_properties:
        lease_time: "{{ infoblox_dhcp_default_lease_time }}"
        pxe_lease_time: "{{ infoblox_dhcp_pxe_lease_time }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dhcp
        - lease

    - name: Configure fixed address reservations
      infoblox.nios_modules.nios_fixed_address:
        ipaddr: "{{ item.ip_address }}"
        mac: "{{ item.mac_address }}"
        name: "{{ item.hostname | default(omit) }}"
        comment: "{{ item.comment | default('Fourth Estate DHCP reservation') }}"
        network_view: "{{ item.network_view | default('default') }}"
        options: "{{ item.options | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_reservations }}"
      when: infoblox_dhcp_reservations is defined
      tags:
        - infoblox
        - dhcp
        - reservations

    - name: Configure DHCP relay agents
      infoblox.nios_modules.nios_dhcp_relay:
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        servers: "{{ item.servers }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      loop: "{{ infoblox_dhcp_relay_agents }}"
      when: infoblox_dhcp_relay_agents is defined
      tags:
        - infoblox
        - dhcp
        - relay

    - name: Configure PXE boot settings
      infoblox.nios_modules.nios_grid_dhcp_properties:
        pxe_boot_server: "{{ infoblox_pxe_boot_server }}"
        pxe_boot_file: "{{ infoblox_pxe_boot_file }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when:
        - infoblox_enable_pxe_boot | bool
        - infoblox_pxe_boot_server is defined
      tags:
        - infoblox
        - dhcp
        - pxe

    - name: Configure Dynamic DNS (DDNS) integration
      infoblox.nios_modules.nios_grid_dhcp_properties:
        enable_ddns: "{{ infoblox_enable_ddns }}"
        ddns_domainname: "{{ infoblox_ddns_domain }}"
        ddns_generate_hostname: "{{ infoblox_ddns_generate_hostname }}"
        ddns_server_always_updates: "{{ infoblox_ddns_server_always_updates }}"
        ddns_ttl: "{{ infoblox_ddns_ttl }}"
        ddns_update_fixed_addresses: "{{ infoblox_ddns_update_fixed_addresses }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_ddns | bool
      tags:
        - infoblox
        - dhcp
        - ddns

    - name: Configure DHCP logging for security and compliance
      infoblox.nios_modules.nios_grid_dhcp_properties:
        enable_dhcp_audit_log: "{{ infoblox_enable_dhcp_audit_log }}"
        log_lease_events: "{{ infoblox_log_dhcp_lease_events }}"
        enable_fingerprint_tracking: "{{ infoblox_enable_fingerprint_tracking }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      tags:
        - infoblox
        - dhcp
        - logging
        - audit

    - name: Configure DHCP threshold warnings
      infoblox.nios_modules.nios_grid_dhcp_properties:
        enable_dhcp_thresholds: true
        threshold_email_addresses: "{{ infoblox_dhcp_threshold_emails }}"
        threshold_warning: "{{ infoblox_dhcp_threshold_warning }}"
        threshold_critical: "{{ infoblox_dhcp_threshold_critical }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_dhcp_thresholds | bool
      tags:
        - infoblox
        - dhcp
        - monitoring

    - name: Configure IPv6 DHCP (DHCPv6) if enabled
      infoblox.nios_modules.nios_grid_dhcp_properties:
        enable_dhcpv6: "{{ infoblox_enable_dhcpv6 }}"
        dhcpv6_options: "{{ infoblox_dhcpv6_options | default(omit) }}"
        state: present
        provider:
          host: "{{ infoblox_grid_master }}"
          username: "{{ infoblox_username }}"
          password: "{{ infoblox_password }}"
          wapi_version: "{{ infoblox_wapi_version }}"
          validate_certs: "{{ infoblox_validate_certs }}"
      no_log: true
      when: infoblox_enable_dhcpv6 | bool
      tags:
        - infoblox
        - dhcp
        - ipv6

    - name: Display DHCP configuration summary
      ansible.builtin.debug:
        msg:
          - "DHCP Service Enabled: {{ infoblox_enable_dhcp }}"
          - "Failover Pairs: {{ infoblox_dhcp_failover_pairs | length if infoblox_dhcp_failover_pairs is defined else 0 }}"
          - "DDNS Integration: {{ infoblox_enable_ddns }}"
          - "Reservations Configured: {{ infoblox_dhcp_reservations | length if infoblox_dhcp_reservations is defined else 0 }}"
          - "Default Lease Time: {{ infoblox_dhcp_default_lease_time }} seconds"
      tags:
        - infoblox
        - dhcp

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dhcp_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dhcp_config_preflight_passed | bool
          - fe_infoblox_infoblox_dhcp_config_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dhcp_config: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dhcp_config_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dhcp_config_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dhcp_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dhcp_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_config_postflight_passed: true
        fe_infoblox_infoblox_dhcp_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dhcp_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_config_status: "failed"
        fe_infoblox_infoblox_dhcp_config_postflight_passed: false
        fe_infoblox_infoblox_dhcp_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dhcp_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dhcp_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dhcp_config: FAILED at '{{ fe_infoblox_infoblox_dhcp_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dhcp_config_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dhcp_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dhcp_config failed at '{{ fe_infoblox_infoblox_dhcp_config_failed_task }}': {{ fe_infoblox_infoblox_dhcp_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dhcp_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dhcp_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dhcp_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dhcp_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dhcp_config":
              component: "infoblox/infoblox_dhcp_config"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dhcp_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dhcp_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dhcp_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dhcp_config_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dhcp_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dhcp_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dhcp_config_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dhcp_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dhcp_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dhcp_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dhcp_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dhcp_config_status | default('') == 'succeeded' else ['infoblox/infoblox_dhcp_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dhcp_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dhcp_config_stats_published: true
      tags:
        - always
