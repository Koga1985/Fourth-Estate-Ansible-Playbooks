---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_grid_upgrade']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_grid_upgrade_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_grid_upgrade | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_grid_upgrade_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_grid_upgrade_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_grid_upgrade_status: "running"
    fe_infoblox_infoblox_grid_upgrade_preflight_passed: false
    fe_infoblox_infoblox_grid_upgrade_postflight_passed: false
    fe_infoblox_infoblox_grid_upgrade_failed_task: ""
    fe_infoblox_infoblox_grid_upgrade_error: ""
    fe_infoblox_infoblox_grid_upgrade_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_grid_upgrade | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_grid_upgrade | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_grid_upgrade: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_grid_upgrade: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_grid_upgrade | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_grid_upgrade: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_grid_upgrade: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_grid_upgrade_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_grid_upgrade | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_upgrade_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Please set nios_host/nios_username/nios_password."

    - name: Ensure plan directory exists
      ansible.builtin.file:
        path: "{{ plan_dir }}"
        state: directory
        mode: "0755"

    - name: Set WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

    # ---------------- PRECHECKS ----------------
      no_log: true
    - name: WAPI grid info
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid"
        method: GET
        return_content: true
        status_code: [200]
        params: { _return_as_object: 1 }
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: grid_get

    - name: List members with versions
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/member"
        method: GET
        return_content: true
        status_code: [200]
        params: { _return_as_object: 1, _max_results: 1000, _return_fields%2B: "host_name,platform,hardware_type,service_status,virtual_cpu_status,product_version" }
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: members_list

    - name: Optionally ping-check members
      when: ping_check | bool
      ansible.builtin.shell: "ping -c 1 -W 1 {{ item['vip_setting']['address'] | default(item['lan1']['v4addr'] | default('')) }} >/dev/null 2>&1 && echo OK || echo FAIL"
      args: { executable: /bin/bash }
      loop: "{{ (members_list.json.result | default([])) }}"
      loop_control: { label: "{{ item.name | default(item.host_name | default('member')) }}" }
      register: ping_results
      changed_when: false
      failed_when: false

    - name: Write precheck summary
      ansible.builtin.copy:
        dest: "{{ plan_dir }}/precheck.json"
        mode: "0644"
        content: >-
          {{
            {
              "grid": (grid_get.json.result[0] | default({})),
              "members": (members_list.json.result | default([])),
              "ping": (ping_results.results | default([]) | map(attribute='stdout') | list),
              "target_version": target_version
            } | to_nice_json
          }}

    # ---------------- IMAGE STAGING ----------------
    - name: Download image from URL (if provided)
      when: image_url | length > 0
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ plan_dir }}/nios_image.bin"
        mode: "0644"
      register: dl_img

    - name: Set image path fact
      ansible.builtin.set_fact:
        _img_path: >-
          {%- if image_file | length > 0 -%}{{ image_file }}
          {%- elif dl_img is defined -%}{{ dl_img.dest }}
          {%- else -%}""{%- endif -%}

    - name: Fail if attempting real run without image
      when: (not dry_run | bool) and (_img_path | length == 0)
      ansible.builtin.fail:
        msg: "No image_file or downloadable image_url specified."

    - name: Optional SHA256 checksum verify
      when: checksum_sha256 | length > 0 and (_img_path | length > 0)
      ansible.builtin.shell: "sha256sum {{ _img_path }} | awk '{print $1}'"
      register: shasum
      changed_when: false

    - name: Assert checksum matches
      when: checksum_sha256 | length > 0 and (_img_path | length > 0)
      ansible.builtin.assert:
        that: [ "shasum.stdout.strip() == checksum_sha256" ]
        fail_msg: "SHA256 mismatch for NIOS image."

    # Upload via WAPI (best-effort). Some versions support /grid?_function=upload_file
    - name: Upload image to Grid (best-effort; may vary by NIOS)
      when: (not dry_run | bool) and (_img_path | length > 0)
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=upload_file"
        method: POST
        body_format: form-multipart
        body:
          file: "{{ lookup('file', _img_path) }}"
          filename: "nios_image.bin"
        status_code: [200,201,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: upload_resp
      failed_when: false

    - name: Save upload response
      when: upload_resp is defined
      ansible.builtin.copy:
        dest: "{{ plan_dir }}/upload_response.json"
        mode: "0644"
        content: "{{ upload_resp | to_nice_json }}"

    # ---------------- WAVES / DRAIN / SCHEDULE ----------------
    - name: Iterate waves to create plan files and (optionally) schedule
      vars:
        w: "{{ item }}"
      block:
        - name: Write wave plan
          ansible.builtin.copy:
            dest: "{{ plan_dir }}/{{ w.name | default('wave') }}.json"
            mode: "0644"
            content: >-
              {{
                {
                  "wave": w,
                  "target_version": target_version,
                  "activate_now": activate_now,
                  "reboot_after_activate": reboot_after_activate
                } | to_nice_json
              }}

        - name: Best-effort service drain (DNS/DHCP) by member — plan-only or execute
          vars:
            drain: "{{ w.drain_services | default([]) }}"
          block:
            - name: Disable DNS service (plan-only when dry_run=true)
              when: "'dns' in drain"
              ansible.builtin.debug:
                msg: "Would disable DNS on members in wave {{ w.name }} (dry_run={{ dry_run }})"
            - name: Disable DHCP service (plan-only when dry_run=true)
              when: "'dhcp' in drain"
              ansible.builtin.debug:
                msg: "Would disable DHCP on members in wave {{ w.name }} (dry_run={{ dry_run }})"
      loop: "{{ waves | default([]) }}"

    # ---------------- ACTIVATE / REBOOT (best-effort) ----------------
    - name: Attempt activation (best-effort; may require specific NIOS function)
      when: (not dry_run | bool) and (activate_now | bool)
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=activate_software"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: >-
          { "reboot_after_activate": {{ reboot_after_activate | bool | tojson }} }
        status_code: [200,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: activate_resp
      failed_when: false

    - name: Save activate response (if any)
      when: activate_resp is defined
      ansible.builtin.copy:
        dest: "{{ plan_dir }}/activate_response.json"
        mode: "0644"
        content: "{{ activate_resp | to_nice_json }}"

    # ---------------- REPORT ----------------
    - name: Write final report
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0644"
        content: >-
          {{
            {
              "grid": (grid_get.json.result[0] | default({})),
              "members": (members_list.json.result | default([])),
              "target_version": target_version,
              "dry_run": dry_run,
              "image": _img_path | default(""),
              "upload_response": (upload_resp | default({})),
              "activate_response": (activate_resp | default({})),
              "waves": waves,
              "plan_dir": plan_dir,
              "timestamp": ansible_date_time.iso8601
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_grid_upgrade | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_grid_upgrade_preflight_passed | bool
          - fe_infoblox_infoblox_grid_upgrade_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_grid_upgrade: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_grid_upgrade_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_grid_upgrade_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_grid_upgrade: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_grid_upgrade | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_upgrade_postflight_passed: true
        fe_infoblox_infoblox_grid_upgrade_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_grid_upgrade | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_upgrade_status: "failed"
        fe_infoblox_infoblox_grid_upgrade_postflight_passed: false
        fe_infoblox_infoblox_grid_upgrade_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_grid_upgrade_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_grid_upgrade | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_grid_upgrade: FAILED at '{{ fe_infoblox_infoblox_grid_upgrade_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_grid_upgrade_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_grid_upgrade | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_grid_upgrade failed at '{{ fe_infoblox_infoblox_grid_upgrade_failed_task }}': {{ fe_infoblox_infoblox_grid_upgrade_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_grid_upgrade | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_upgrade_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_grid_upgrade_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_grid_upgrade_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_grid_upgrade | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_grid_upgrade":
              component: "infoblox/infoblox_grid_upgrade"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_grid_upgrade_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_grid_upgrade_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_grid_upgrade_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_grid_upgrade_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_grid_upgrade_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_grid_upgrade_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_grid_upgrade_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_grid_upgrade_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_grid_upgrade_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_grid_upgrade_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_grid_upgrade_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_grid_upgrade_status | default('') == 'succeeded' else ['infoblox/infoblox_grid_upgrade'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_grid_upgrade | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_upgrade_stats_published: true
      tags:
        - always
