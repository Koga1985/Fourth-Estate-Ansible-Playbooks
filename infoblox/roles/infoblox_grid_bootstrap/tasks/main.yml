---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_grid_bootstrap']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_grid_bootstrap_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_grid_bootstrap | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_grid_bootstrap_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_grid_bootstrap_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_grid_bootstrap_status: "running"
    fe_infoblox_infoblox_grid_bootstrap_preflight_passed: false
    fe_infoblox_infoblox_grid_bootstrap_postflight_passed: false
    fe_infoblox_infoblox_grid_bootstrap_failed_task: ""
    fe_infoblox_infoblox_grid_bootstrap_error: ""
    fe_infoblox_infoblox_grid_bootstrap_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_grid_bootstrap | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_grid_bootstrap | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_grid_bootstrap: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_grid_bootstrap: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_grid_bootstrap | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_grid_bootstrap: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_grid_bootstrap: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_grid_bootstrap_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_grid_bootstrap | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_bootstrap_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate credentials
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Please set nios_host/nios_username/nios_password."

    - name: Set WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

      no_log: true
    - name: Ensure token directory exists
      ansible.builtin.file:
        path: "{{ token_dir }}"
        state: directory
        mode: "0755"

    # ---------------- GRID SETTINGS ----------------
    - name: Read Grid object
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid"
        method: GET
        return_content: true
        status_code: [200]
        params: { _return_as_object: 1 }
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: grid_get

    - name: Update Grid NTP/SNMP/SMTP settings (best-effort)
      vars:
        gref: "{{ grid_get.json.result[0]._ref }}"
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/{{ gref }}"
        method: PUT
        status_code: [200]
        headers: { Content-Type: "application/json" }
        body_format: json
        body: >-
          {%- set p = {} -%}
          {%- if ntp_servers is defined and (ntp_servers|length) > 0 -%}{%- set _ = p.update({'ntp_servers': ntp_servers}) -%}{%- endif -%}
          {%- if smtp.relay | default('') -%}{%- set _ = p.update({'email_relay_server': smtp.relay }) -%}{%- endif -%}
          {%- if smtp.sender | default('') -%}{%- set _ = p.update({'email_from': smtp.sender }) -%}{%- endif -%}
          {%- if snmp.ro_communities | default([]) -%}{%- set _ = p.update({'snmp_ro_community': (snmp.ro_communities | first) }) -%}{%- endif -%}
          {%- if snmp.sys_contact | default('') -%}{%- set _ = p.update({'snmp_sys_contact': snmp.sys_contact }) -%}{%- endif -%}
          {%- if snmp.sys_location | default('') -%}{%- set _ = p.update({'snmp_sys_location': snmp.sys_location }) -%}{%- endif -%}
          {{ p }}
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: grid_update
      when: (ntp_servers|length) > 0 or (smtp.relay|default('')|length) > 0 or (smtp.sender|default('')|length) > 0 or (snmp.ro_communities|default([])|length) > 0 or (snmp.sys_contact|default('')|length) > 0 or (snmp.sys_location|default('')|length) > 0

    - name: Rotate 'admin' password (optional)
      when: admin_password_rotate | length > 0
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=update_admin_password"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: { "admin_password": "{{ admin_password_rotate }}" }
        status_code: [200]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: admin_pw_update

    # ---------------- MEMBERS / HA ----------------
    - name: Ensure member objects exist (best-effort create/ensure)
      vars:
        m: "{{ item }}"
      block:
        - name: Lookup member by name
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/member"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              name: "{{ m.name }}"
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: mem_get

        - name: Create/update standalone member
          when: not m.ha or not m.ha.enabled | default(false)
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/member{{ ((mem_get.json.result|length) > 0) | ternary('', '') }}"
            method: "{{ ((mem_get.json.result|length) > 0) | ternary('PUT', 'POST') }}"
            headers: { Content-Type: "application/json" }
            body_format: json
            body: >-
              {%- set payload = {
                "name": m.name,
                "platform": (m.platform | default(omit)),
                "comment": (m.comment | default(omit)),
                "lan1": (m.lan1_ipv4 | default(omit))
              } -%}
              {%- if (mem_get.json.result | length) > 0 -%}
              {{ payload | combine({"_ref": mem_get.json.result[0]["_ref"]}) }}
              {%- else -%}
              {{ payload }}
              {%- endif -%}
            status_code: [200,201]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: mem_upd

        - name: Create/update HA member (VIP + nodes) [best-effort]
          when: m.ha and m.ha.enabled | default(false)
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/member"
            method: "{{ ((mem_get.json.result|length) > 0) | ternary('PUT', 'POST') }}"
            headers: { Content-Type: "application/json" }
            body_format: json
            body: >-
              {%- set ha = m.ha -%}
              {%- set payload = {
                "name": m.name,
                "comment": (m.comment | default(omit)),
                "vip_setting": { "address": ha.vip },
                "node_info": [
                  { "lan1": ha.node1_lan1 },
                  { "lan1": ha.node2_lan1 }
                ]
              } -%}
              {%- if (mem_get.json.result | length) > 0 -%}
              {{ payload | combine({"_ref": mem_get.json.result[0]["_ref"]}) }}
              {%- else -%}
              {{ payload }}
              {%- endif -%}
            status_code: [200,201]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: ha_upd

        - name: Try to create join token (if requested; may not be supported on older NIOS)
          when: m.join_token | default(false)
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/grid?_function=generate_join_token"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { "member_name": "{{ m.name }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: token_resp
          failed_when: false

        - name: Save join helper file (if token present)
          when: token_resp.json.token is defined
          ansible.builtin.copy:
            dest: "{{ token_dir }}/{{ m.name }}.join.txt"
            mode: "0644"
            content: |-
              # Member Join Token for {{ m.name }}
              TOKEN={{ token_resp.json.token }}
              # On the prospective member's console/CLI:
              # set membership grid enable
              # set membership token $TOKEN
              # set membership grid address {{ nios_host }}
              # set membership join
      loop: "{{ members | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    # ---------------- LICENSE CHECK / REPORT ----------------
    - name: Grid license summary
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid/license"
        method: GET
        return_content: true
        status_code: [200]
        params: { _return_as_object: 1 }
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: lic_get
      failed_when: false

    - name: Members list for report
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/member"
        method: GET
        return_content: true
        status_code: [200]
        params: { _return_as_object: 1, _max_results: 1000 }
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: members_list

    - name: Write report JSON
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0644"
        content: >-
          {{
            {
              "grid": grid_name,
              "settings_changed": (grid_update is defined),
              "admin_pw_rotated": (admin_pw_update is defined),
              "license": (lic_get.json if (lic_get is defined and lic_get.json is defined) else {}),
              "members": (members_list.json.result | default([])),
              "timestamp": ansible_date_time.iso8601
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_grid_bootstrap | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_grid_bootstrap_preflight_passed | bool
          - fe_infoblox_infoblox_grid_bootstrap_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_grid_bootstrap: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_grid_bootstrap_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_grid_bootstrap_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_grid_bootstrap: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_grid_bootstrap | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_bootstrap_postflight_passed: true
        fe_infoblox_infoblox_grid_bootstrap_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_grid_bootstrap | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_bootstrap_status: "failed"
        fe_infoblox_infoblox_grid_bootstrap_postflight_passed: false
        fe_infoblox_infoblox_grid_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_grid_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_grid_bootstrap | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_grid_bootstrap: FAILED at '{{ fe_infoblox_infoblox_grid_bootstrap_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_grid_bootstrap_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_grid_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_grid_bootstrap failed at '{{ fe_infoblox_infoblox_grid_bootstrap_failed_task }}': {{ fe_infoblox_infoblox_grid_bootstrap_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_grid_bootstrap | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_grid_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_grid_bootstrap_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_grid_bootstrap | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_grid_bootstrap":
              component: "infoblox/infoblox_grid_bootstrap"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_grid_bootstrap_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_grid_bootstrap_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_grid_bootstrap_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_grid_bootstrap_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_grid_bootstrap_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_grid_bootstrap_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_grid_bootstrap_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_grid_bootstrap_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_grid_bootstrap_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_grid_bootstrap_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_grid_bootstrap_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_grid_bootstrap_status | default('') == 'succeeded' else ['infoblox/infoblox_grid_bootstrap'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_grid_bootstrap | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_grid_bootstrap_stats_published: true
      tags:
        - always
