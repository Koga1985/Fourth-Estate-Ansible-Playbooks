---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: infoblox_dnssec
      vars:
        nios_host: "nios.example.local"
        nios_username: "{{ lookup('env','NIOS_USER') }}"
        nios_password: "{{ lookup('env','NIOS_PASS') }}"
        nios_validate_certs: false
        nios_wapi_version: "v2.12"
        zones_dnssec:
          - fqdn: "corp.example.com"
            view: "default"
            enable: true
            nsec3: true
            ksk_algorithm: "RSASHA256"
            ksk_size: 2048
            zsk_algorithm: "RSASHA256"
            zsk_size: 1024
        ds_out_dir: "/tmp/infoblox-dnssec-ds"
        ds_json_path: "/tmp/infoblox-dnssec-ds/ds_records.json"
  pre_tasks:
    - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Initialize validation state"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status: "running"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed: false
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed: false
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task: ""
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error: ""
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published: false
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "infoblox/infoblox_dnssec/infoblox.dnssec.enable: required variable '{{ item }}' is not defined."
            success_msg: "infoblox/infoblox_dnssec/infoblox.dnssec.enable: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status: "preflight_failed"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed: false
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: FAILED at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/infoblox_dnssec/infoblox.dnssec.enable":
                  component: "infoblox/infoblox_dnssec/infoblox.dnssec.enable"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_started_at | default('') }}"
                  ended_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_ended_at | default('') }}"
                  duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task | default('') }}"
                  error: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else ['infoblox/infoblox_dnssec/infoblox.dnssec.enable'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published: true
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable failed at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}': {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: preflight
              {{ 'passed' if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | bool
              - fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status in ['running', 'succeeded']
            fail_msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: postflight validation failed - preflight passed
              ={{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | default(false) }},
              status={{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('unknown') }}.
            success_msg: "infoblox/infoblox_dnssec/infoblox.dnssec.enable: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed: true
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status: "failed"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed: false
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: FAILED at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable failed at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}': {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/infoblox_dnssec/infoblox.dnssec.enable":
                  component: "infoblox/infoblox_dnssec/infoblox.dnssec.enable"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_started_at | default('') }}"
                  ended_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_ended_at | default('') }}"
                  duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task | default('') }}"
                  error: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else ['infoblox/infoblox_dnssec/infoblox.dnssec.enable'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published | default(false) | bool)
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published: true
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('unknown') }} in
              {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Guarded execution with rescue and always handling"
      block:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status: "failed"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed: false
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable: FAILED at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              infoblox/infoblox_dnssec/infoblox.dnssec.enable failed at '{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task }}': {{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/infoblox_dnssec/infoblox.dnssec.enable":
                  component: "infoblox/infoblox_dnssec/infoblox.dnssec.enable"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_started_at | default('') }}"
                  ended_at: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_ended_at | default('') }}"
                  duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_failed_task | default('') }}"
                  error: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'succeeded' else ['infoblox/infoblox_dnssec/infoblox.dnssec.enable'] }}
            aggregate: true
            per_host: false
          when:
            - fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'failed'
            - not (fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published | default(false) | bool)
          tags:
            - always

        - name: "infoblox/infoblox_dnssec/infoblox.dnssec.enable | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_stats_published: true
          when:
            - fe_infoblox_infoblox_dnssec_infoblox_dnssec_enable_status | default('') == 'failed'
          tags:
            - always
