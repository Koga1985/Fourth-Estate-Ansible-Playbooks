---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dnssec']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dnssec_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dnssec | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dnssec_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dnssec_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dnssec_status: "running"
    fe_infoblox_infoblox_dnssec_preflight_passed: false
    fe_infoblox_infoblox_dnssec_postflight_passed: false
    fe_infoblox_infoblox_dnssec_failed_task: ""
    fe_infoblox_infoblox_dnssec_error: ""
    fe_infoblox_infoblox_dnssec_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dnssec | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dnssec | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dnssec: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dnssec: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dnssec | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dnssec: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dnssec: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dnssec_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dnssec | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dnssec_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate credentials
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Please set nios_host/nios_username/nios_password."

    - name: Set WAPI base
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

    # Optionally create zones if missing
      no_log: true
    - name: Ensure zones exist (when allow_create=true)
      no_log: true
      when: item.allow_create | default(false)
      infoblox.nios_modules.nios_zone:
        name: "{{ item.fqdn }}"
        view: "{{ item.view | default('default') }}"
        ns_group: "{{ item.ns_group | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          validate_certs: "{{ nios_validate_certs }}"
      loop: "{{ zones_dnssec | default([]) }}"

    - name: Make DS output directory
      ansible.builtin.file:
        path: "{{ ds_out_dir }}"
        state: directory
        mode: "0755"

    - name: Apply DNSSEC settings via WAPI and collect DS data
      vars:
        z: "{{ item }}"
      block:
        - name: Lookup zone_auth by fqdn/view
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_auth"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              fqdn: "{{ z.fqdn }}"
              view: "{{ z.view | default('default') }}"
            headers: {}
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: zone_get

        - name: Fail if zone missing (and not created)
          when: (zone_get.json.result | length) == 0
          ansible.builtin.fail:
            msg: "Zone {{ z.fqdn }} (view {{ z.view | default('default') }}) not found. Set allow_create: true to create."

        - name: Build DNSSEC payload
          ansible.builtin.set_fact:
            _dnssec_payload: >-
              {%- set p = {} -%}
              {%- if z.enable is defined -%}{%- set _ = p.update({'dnssec_enable': z.enable|bool }) -%}{%- endif -%}
              {%- if z.nsec3 is defined -%}{%- set _ = p.update({'dnssec_nsec3_enable': z.nsec3|bool }) -%}{%- endif -%}
              {%- if z.nsec3_optout is defined -%}{%- set _ = p.update({'dnssec_nsec3_optout': z.nsec3_optout|bool }) -%}{%- endif -%}
              {%- if z.ksk_algorithm is defined -%}{%- set _ = p.update({'dnssec_ksk_algorithm': z.ksk_algorithm }) -%}{%- endif -%}
              {%- if z.ksk_size is defined -%}{%- set _ = p.update({'dnssec_ksk_size': z.ksk_size|int }) -%}{%- endif -%}
              {%- if z.zsk_algorithm is defined -%}{%- set _ = p.update({'dnssec_zsk_algorithm': z.zsk_algorithm }) -%}{%- endif -%}
              {%- if z.zsk_size is defined -%}{%- set _ = p.update({'dnssec_zsk_size': z.zsk_size|int }) -%}{%- endif -%}
              {%- if z.rollover is defined -%}{%- set _ = p.update({'extattrs': {'ROLLOVER_KSK_DAYS': {'value': (z.rollover.ksk_days|default(365)) }, 'ROLLOVER_ZSK_DAYS': {'value': (z.rollover.zsk_days|default(30)) }}}) -%}{%- endif -%}
              {{ p }}

        - name: Update zone DNSSEC settings
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ zone_get.json.result[0]._ref }}"
            method: PUT
            status_code: [200]
            headers:
              Content-Type: "application/json"
            body_format: json
            body: "{{ _dnssec_payload }}"
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"

        - name: Re-read zone with DS fields
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ zone_get.json.result[0]._ref }}?_return_fields%2B=fqdn,view,dnssec_enable,dnssec_signed,dnssec_ds_data"
            method: GET
            return_content: true
            status_code: [200]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: zone_after

        - name: Write DS file per zone (if available)
          when: zone_after.json.dnssec_ds_data is defined and zone_after.json.dnssec_ds_data | length > 0
          ansible.builtin.copy:
            content: |-
              # DS records for {{ zone_after.json.fqdn }} (view {{ zone_after.json.view }})
              {% for ds in zone_after.json.dnssec_ds_data %}
              {{ zone_after.json.fqdn }}. {{ ds.ttl | default('3600') }} IN DS {{ ds.key_tag }} {{ ds.algorithm }} {{ ds.digest_type }} {{ ds.digest }}
              {% endfor %}
            dest: "{{ ds_out_dir }}/{{ zone_after.json.fqdn | replace('/','_') }}.ds.txt"
            mode: "0644"

        - name: Append DS JSON aggregate
          ansible.builtin.lineinfile:
            path: "{{ ds_json_path }}"
            create: true
            line: "{{ {'fqdn': zone_after.json.fqdn, 'view': zone_after.json.view, 'dnssec_enable': zone_after.json.dnssec_enable, 'dnssec_signed': zone_after.json.dnssec_signed, 'ds': (zone_after.json.dnssec_ds_data | default([])) } | to_json }}"
            insertafter: EOF
      loop: "{{ zones_dnssec | default([]) }}"
      loop_control:
        label: "{{ item.fqdn }} ({{ item.view | default('default') }})"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dnssec | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dnssec_preflight_passed | bool
          - fe_infoblox_infoblox_dnssec_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dnssec: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dnssec_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dnssec_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dnssec: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dnssec | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dnssec_postflight_passed: true
        fe_infoblox_infoblox_dnssec_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dnssec | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dnssec_status: "failed"
        fe_infoblox_infoblox_dnssec_postflight_passed: false
        fe_infoblox_infoblox_dnssec_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dnssec_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dnssec | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dnssec: FAILED at '{{ fe_infoblox_infoblox_dnssec_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dnssec_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dnssec | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dnssec failed at '{{ fe_infoblox_infoblox_dnssec_failed_task }}': {{ fe_infoblox_infoblox_dnssec_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dnssec | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dnssec_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dnssec_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dnssec_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dnssec | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dnssec":
              component: "infoblox/infoblox_dnssec"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dnssec_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dnssec_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dnssec_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dnssec_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dnssec_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dnssec_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dnssec_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dnssec_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dnssec_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dnssec_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dnssec_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dnssec_status | default('') == 'succeeded' else ['infoblox/infoblox_dnssec'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dnssec | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dnssec_stats_published: true
      tags:
        - always
