---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_dns_records']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_dns_records_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_dns_records | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_dns_records_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_dns_records_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_dns_records_status: "running"
    fe_infoblox_infoblox_dns_records_preflight_passed: false
    fe_infoblox_infoblox_dns_records_postflight_passed: false
    fe_infoblox_infoblox_dns_records_failed_task: ""
    fe_infoblox_infoblox_dns_records_error: ""
    fe_infoblox_infoblox_dns_records_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_dns_records | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_dns_records | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_dns_records: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_dns_records: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_records | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_dns_records: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_dns_records: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_dns_records_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_dns_records | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_records_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Please set nios_host/nios_username/nios_password."

    - name: Build provider
      ansible.builtin.set_fact:
        nios_provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          validate_certs: "{{ nios_validate_certs }}"

    # -------- Load/merge external data files (optional) --------
      no_log: true
    - name: Initialize merged record containers
      ansible.builtin.set_fact:
        _hosts: "{{ hosts | default([]) | list }}"
        _a: "{{ a_records | default([]) | list }}"
        _aaaa: "{{ aaaa_records | default([]) | list }}"
        _cname: "{{ cname_records | default([]) | list }}"
        _mx: "{{ mx_records | default([]) | list }}"
        _srv: "{{ srv_records | default([]) | list }}"
        _txt: "{{ txt_records | default([]) | list }}"
        _ns: "{{ ns_records | default([]) | list }}"

    - name: Include each record file and extend lists
      vars:
        _file: "{{ item }}"
      block:
        - name: Load vars from {{ _file }}
          ansible.builtin.include_vars:
            file: "{{ _file }}"
            name: _fromfile
        - name: Merge records from {{ _file }}
          ansible.builtin.set_fact:
            _hosts: "{{ _hosts + (_fromfile.hosts | default([])) }}"
            _a: "{{ _a + (_fromfile.a_records | default([])) }}"
            _aaaa: "{{ _aaaa + (_fromfile.aaaa_records | default([])) }}"
            _cname: "{{ _cname + (_fromfile.cname_records | default([])) }}"
            _mx: "{{ _mx + (_fromfile.mx_records | default([])) }}"
            _srv: "{{ _srv + (_fromfile.srv_records | default([])) }}"
            _txt: "{{ _txt + (_fromfile.txt_records | default([])) }}"
            _ns: "{{ _ns + (_fromfile.ns_records | default([])) }}"
      loop: "{{ record_files | default([]) }}"

    # -------- Normalize TTLs --------
    - name: Normalize TTLs across all records
      ansible.builtin.set_fact:
        _hosts: "{{ _hosts | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
      loop: "{{ _hosts }}"
      loop_control: { loop_var: item }

    - name: Normalize TTLs for simple records
      ansible.builtin.set_fact:
        _a: "{{ _a | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _aaaa: "{{ _aaaa | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _cname: "{{ _cname | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _mx: "{{ _mx | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _srv: "{{ _srv | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _txt: "{{ _txt | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"
        _ns: "{{ _ns | map('combine', {'ttl': (ttl_default if (enforce_ttl and (item.ttl is not defined or item.ttl|int <= 0)) else (item.ttl | default(ttl_default)))}) | list }}"

    # -------- Host records --------
    - name: Ensure host records
      infoblox.nios_modules.nios_host_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        ipv4: "{{ item.ipv4 | default(omit) }}"
        ipv6: "{{ item.ipv6 | default(omit) }}"
        aliases: "{{ item.aliases | default(omit) }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _hosts }}"

    # -------- A records --------
    - name: Ensure A records
      infoblox.nios_modules.nios_a_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        ipv4addr: "{{ item.address }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _a }}"

    # -------- AAAA records --------
    - name: Ensure AAAA records
      infoblox.nios_modules.nios_aaaa_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        ipv6addr: "{{ item.address }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _aaaa }}"

    # -------- CNAME records --------
    - name: Ensure CNAME records
      infoblox.nios_modules.nios_cname_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        canonical: "{{ item.canonical }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _cname }}"

    # -------- MX records --------
    - name: Ensure MX records
      infoblox.nios_modules.nios_mx_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        mail_exchanger: "{{ item.mail_exchanger }}"
        preference: "{{ item.preference | default(10) }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _mx }}"

    # -------- SRV records --------
    - name: Ensure SRV records
      infoblox.nios_modules.nios_srv_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        priority: "{{ item.priority | default(0) }}"
        weight: "{{ item.weight | default(0) }}"
        port: "{{ item.port }}"
        target: "{{ item.target }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _srv }}"

    # -------- TXT records --------
    - name: Ensure TXT records
      infoblox.nios_modules.nios_txt_record:
        name: "{{ item.name }}"
        view: "{{ item.view | default(dns_view) }}"
        text: "{{ item.text }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _txt }}"

    # -------- NS records --------
    - name: Ensure NS records
      infoblox.nios_modules.nios_ns_record:
        zone: "{{ item.zone }}"
        view: "{{ item.view | default(dns_view) }}"
        name_server: "{{ item.name_server }}"
        ttl: "{{ item.ttl | default(ttl_default) }}"
        state: "{{ item.state | default('present') }}"
        provider: "{{ nios_provider }}"
      loop: "{{ _ns }}"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_dns_records | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_dns_records_preflight_passed | bool
          - fe_infoblox_infoblox_dns_records_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_dns_records: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_dns_records_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_dns_records_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_dns_records: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_dns_records | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_records_postflight_passed: true
        fe_infoblox_infoblox_dns_records_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_dns_records | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_records_status: "failed"
        fe_infoblox_infoblox_dns_records_postflight_passed: false
        fe_infoblox_infoblox_dns_records_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_dns_records_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_records | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_dns_records: FAILED at '{{ fe_infoblox_infoblox_dns_records_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_dns_records_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_dns_records | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_dns_records failed at '{{ fe_infoblox_infoblox_dns_records_failed_task }}': {{ fe_infoblox_infoblox_dns_records_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_dns_records | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_records_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_dns_records_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_dns_records_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_dns_records | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_dns_records":
              component: "infoblox/infoblox_dns_records"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_dns_records_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_dns_records_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_dns_records_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_dns_records_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_dns_records_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_dns_records_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_dns_records_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_dns_records_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_dns_records_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_dns_records_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_dns_records_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_dns_records_status | default('') == 'succeeded' else ['infoblox/infoblox_dns_records'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_dns_records | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_dns_records_stats_published: true
      tags:
        - always
