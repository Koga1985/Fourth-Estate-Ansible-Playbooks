---
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Infoblox Day-0 Bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    nios_host: "{{ lookup('env','NIOS_HOST') | default('nios.example.local', true) }}"
    nios_username: "{{ lookup('env','NIOS_USER') }}"
    nios_password: "{{ lookup('env','NIOS_PASS') }}"
    nios_validate_certs: false
    nios_wapi_version: "v2.12"

    grid_master_vip: "10.0.0.10"
    grid_name: "PROD-GRID"
    grid_members:
      - { name: "ib-member-1", mgmt_ip: "10.0.0.11", vip: "10.0.0.111", ha_pair: false }
      - { name: "ib-member-2", mgmt_ip: "10.0.0.12", vip: "10.0.0.112", ha_pair: false }

    ntp_servers: ["0.pool.ntp.org", "1.pool.ntp.org"]
    syslog_targets: ["10.0.0.50"]
    smtp_relay: "smtp.example.com"
    snmp_trap_receivers: ["10.0.0.51"]

    id_sources: []

    network_views: [ { name: "default", comment: "Default NV" } ]
    dns_views: [ { name: "default", comment: "Default DNS view" } ]
    network_containers_v4: [ { cidr: "10.0.0.0/8", comment: "Corp IPv4 supernet" } ]
    network_containers_v6: []
    zones_auth: [ { fqdn: "corp.example.com", view: "default", ns_group: "Grid Primary" } ]

    ea_policies:
      - selector: { object: "networkcontainer", network_view: "default", cidrs: ["10.0.0.0/8"] }
        extattrs:
          Environment: { value: "prod" }
          Owner: { value: "NetOps" }
          BusinessUnit: { value: "CorpIT" }

    tsig_keys:
      - { name: "axfr-internal", algorithm: "hmac-sha256", secret: "{{ lookup('env','TSIG_AXFR_SECRET') }}" }
    named_acls:
      - name: "ACL-Internal"
        entries:
          - { type: "network", value: "10.0.0.0/8" }
          - { type: "network", value: "172.16.0.0/12" }
          - { type: "network", value: "192.168.0.0/16" }
    dns_view_policies:
      - { view: "default", recursion_enabled: true, query_acl: "ACL-Internal", recursion_acl: "ACL-Internal" }

    rpz_dns_view: "default"
    rpz_zones:
      - { name: "corp-threats.rpz", primary_type: "primary", grid_primary: "Grid Primary", comment: "Internal blocklist RPZ" }
    rpz_enforcement_order: ["corp-threats.rpz"]
    rpz_sync: false

    dhcp_networks: []
    dhcp_ranges: []
    dhcp_failover_pairs: []

    artifact_root: "/tmp/infoblox-day0"

  pre_tasks:
    - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Initialize validation state"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status: "running"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed: false
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed: false
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task: ""
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error: ""
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_stats_published: false
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "infoblox/day0_deploy_config/infoblox.day0.bootstrap: required variable '{{ item }}' is not defined."
            success_msg: "infoblox/day0_deploy_config/infoblox.day0.bootstrap: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status: "preflight_failed"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed: false
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/day0_deploy_config/infoblox.day0.bootstrap":
                  component: "infoblox/day0_deploy_config/infoblox.day0.bootstrap"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox.day0.bootstrap'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_stats_published: true
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap failed at '{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: preflight
              {{ 'passed' if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Ensure day-0 artifact folders
      ansible.builtin.file:
        path: "{{ artifact_root }}"
        state: directory
        mode: "0755"
      tags: [always]

  roles:
    - { role: infoblox_grid_bootstrap, tags: ['10-bootstrap'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          grid_name: grid_name, grid_master_vip: grid_master_vip, grid_members: grid_members,
          ntp_servers: ntp_servers, syslog_targets: syslog_targets,
          smtp_relay: smtp_relay, snmp_trap_receivers: snmp_trap_receivers,
          artifact_dir: artifact_root ~ '/10-bootstrap'
        }
      }

    - { role: dns_views_zones, tags: ['30-inventory'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          network_views: network_views, dns_views: dns_views,
          network_containers_v4: network_containers_v4, network_containers_v6: network_containers_v6,
          zones_auth: zones_auth, artifact_dir: artifact_root ~ '/30-inventory'
        }
      }

    - { role: infoblox_tsig_acls, tags: ['40-security'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          tsig_keys: tsig_keys, named_acls: named_acls, dns_view_policies: dns_view_policies,
          artifact_dir: artifact_root ~ '/40-security'
        }
      }

    - { role: infoblox_rpz_policies, tags: ['45-rpz'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          rpz_dns_view: rpz_dns_view, rpz_zones: rpz_zones, rpz_enforcement_order: rpz_enforcement_order,
          rpz_sync: rpz_sync, artifact_dir: artifact_root ~ '/45-rpz'
        }
      }

    - { role: infoblox_extattrs_enforce, tags: ['50-ea'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          ea_policies: ea_policies, artifact_dir: artifact_root ~ '/50-ea'
        }
      }

    - { role: infoblox_dhcp_scopes, tags: ['60-dhcp'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          dhcp_networks: dhcp_networks, dhcp_ranges: dhcp_ranges,
          artifact_dir: artifact_root ~ '/60-dhcp'
        }
      }
    - { role: infoblox_dhcp_failover, tags: ['60-dhcp', '60-failover'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          network_view: 'default', dhcp_failover_pairs: dhcp_failover_pairs,
          artifact_dir: artifact_root ~ '/60-failover'
        }
      }

    - { role: infoblox_audit_compliance, tags: ['90-audit'],
        vars: {
          nios_host: nios_host, nios_username: nios_username, nios_password: nios_password,
          nios_validate_certs: nios_validate_certs, nios_wapi_version: nios_wapi_version,
          desired_files: [], report_dir: artifact_root ~ '/90-audit'
        }
      }
  post_tasks:
    - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed | bool
              - fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status in ['running', 'succeeded']
            fail_msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: postflight validation failed - preflight passed
              ={{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed | default(false) }},
              status={{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('unknown') }}.
            success_msg: "infoblox/day0_deploy_config/infoblox.day0.bootstrap: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed: true
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status: "failed"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed: false
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error }}
          tags:
            - always
            - rescue

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap failed at '{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "infoblox/day0_deploy_config/infoblox.day0.bootstrap":
                  component: "infoblox/day0_deploy_config/infoblox.day0.bootstrap"
                  type: "playbook"
                  platform: "infoblox"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('unknown') }}"
                  preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_started_at | default('') }}"
                  ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_ended_at | default('') }}"
                  duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_failed_task | default('') }}"
                  error: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox.day0.bootstrap'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_stats_published | default(false) | bool)
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_stats_published: true
          tags:
            - always

        - name: "infoblox/day0_deploy_config/infoblox.day0.bootstrap | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              infoblox/day0_deploy_config/infoblox.day0.bootstrap: {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_status | default('unknown') }} in
              {{ fe_infoblox_day0_deploy_config_infoblox_day0_bootstrap_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
