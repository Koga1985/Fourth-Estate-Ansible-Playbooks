---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/infoblox_extattrs_enforce']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status: "running"
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_preflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_postflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_failed_task: ""
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_error: ""
    fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_extattrs_enforce: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/infoblox_extattrs_enforce: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/infoblox_extattrs_enforce: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/infoblox_extattrs_enforce: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-ea-enforce') }}"
        ea_policies: "{{ ea_policies | default([]) }}"
        _ea_supported_types: ["network", "networkcontainer", "range", "zone_auth"]

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

      no_log: true
    - name: Discover current objects (networks / containers / ranges / zones)
      vars:
        _queries:
          - { type: "network",          path: "network",              fields: "network,network_view,comment,extattrs" }
          - { type: "networkcontainer", path: "networkcontainer",     fields: "network,network_view,comment,extattrs" }
          - { type: "range",            path: "range",                fields: "start_addr,end_addr,network,network_view,comment,extattrs" }
          - { type: "zone_auth",        path: "zone_auth",            fields: "fqdn,view,comment,extattrs" }
      block:
        - name: GET {{ item.type }}
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ item.path }}"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              _max_results: 10000
              "_return_fields+": "{{ item.fields }}"
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: _fetch
          loop: "{{ _queries | selectattr('type','in', _ea_supported_types) | list }}"
          loop_control: { label: "{{ item.type }}" }

        - name: Build maps by type
          ansible.builtin.set_fact:
            _objs:
              network:          "{{ ( _fetch.results | selectattr('item.type','equalto','network') | first ).json.result | default([]) }}"
              networkcontainer: "{{ ( _fetch.results | selectattr('item.type','equalto','networkcontainer') | first ).json.result | default([]) }}"
              range:            "{{ ( _fetch.results | selectattr('item.type','equalto','range') | first ).json.result | default([]) }}"
              zone_auth:        "{{ ( _fetch.results | selectattr('item.type','equalto','zone_auth') | first ).json.result | default([]) }}"
      rescue:
        - ansible.builtin.set_fact:
            _objs: { network: [], networkcontainer: [], range: [], zone_auth: [] }

    - name: Initialize report structure
      ansible.builtin.set_fact:
        _ea_changes: []

    - name: Enforce golden EAs per policy
      vars:
        SEL: "{{ item.selector | default({}) }}"
        OBJTYPE: "{{ SEL.object | default('network') }}"
        _target_list: >-
          {%- set items = _objs[OBJTYPE] | default([]) -%}
          {%- if OBJTYPE in ['network','range','networkcontainer'] and (SEL.network_view | default(None)) -%}
            {%- set items = items | selectattr('network_view','equalto', SEL.network_view) | list -%}
          {%- elif OBJTYPE == 'zone_auth' and (SEL.dns_view | default(None)) -%}
            {%- set items = items | selectattr('view','equalto', SEL.dns_view) | list -%}
          {%- endif -%}
          {%- if (SEL.cidrs | default([])) | length > 0 and OBJTYPE in ['network','networkcontainer'] -%}
            {%- set items = items | selectattr('network','defined') | selectattr('network','search', ('^(' ~ (SEL.cidrs | map('regex_escape') | join('|')) ~ ')')) | list -%}
          {%- endif -%}
          {{ items }}
        _ea_match: "{{ SEL.match_ea | default({}) }}"
        _desired_ea: "{{ item.extattrs | default({}) }}"
      when: OBJTYPE in _ea_supported_types
      block:
        - name: Filter by EA matches if requested
          ansible.builtin.set_fact:
            _candidates: >-
              {%- set arr = [] -%}
              {%- for o in _target_list -%}
                {%- set ok = true -%}
                {%- for k,v in _ea_match.items() -%}
                  {%- set cur = (o.extattrs | default({})).get(k, {}) -%}
                  {%- if (cur.get('value') | default(None)) != v -%}
                    {%- set ok = false -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ok -%}{%- set _ = arr.append(o) -%}{%- endif -%}
              {%- endfor -%}
              {{ arr }}

        - name: Build updates for each candidate (merge desired EAs)
          ansible.builtin.set_fact:
            _ea_updates: >-
              {%- set updates = [] -%}
              {%- for o in _candidates -%}
                {%- set merged = (o.extattrs | default({})) | combine(_desired_ea, recursive=True) -%}
                {%- set _ = updates.append({'_ref': o._ref, 'extattrs': merged}) -%}
              {%- endfor -%}
              {{ updates }}

        - name: PUT EAs onto objects (best-effort)
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ item2._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { extattrs: "{{ item2.extattrs }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          loop: "{{ _ea_updates }}"
          loop_control: { loop_var: item2, label: "{{ item2._ref }}" }
          register: _ea_put
          failed_when: false

        - name: Append change summary
          ansible.builtin.set_fact:
            _ea_changes: "{{ _ea_changes + [ { 'object': OBJTYPE, 'selector': SEL, 'count': (_ea_updates | length) } ] }}"
      loop: "{{ ea_policies }}"
      loop_control: { label: "{{ (item.selector.object | default('network')) ~ ' policy' }}" }

    - name: Save EA enforcement artifact
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/ea_enforcement_summary.json"
        mode: "0644"
        content: >-
          {{ { "policies": ea_policies, "changes": _ea_changes } | to_nice_json }}

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Applied {{ _ea_changes | map(attribute='count') | list | sum | default(0) }} EA updates across {{ _ea_changes | length }} policy(ies)"
          - "Artifact: {{ artifact_dir }}/ea_enforcement_summary.json"

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_extattrs_enforce: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/infoblox_extattrs_enforce: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_postflight_passed: true
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status: "failed"
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_postflight_passed: false
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/infoblox_extattrs_enforce: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/infoblox_extattrs_enforce failed at '{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/infoblox_extattrs_enforce":
              component: "infoblox/day0_deploy_config/infoblox_extattrs_enforce"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox_extattrs_enforce'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_extattrs_enforce | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_extattrs_enforce_stats_published: true
      tags:
        - always
