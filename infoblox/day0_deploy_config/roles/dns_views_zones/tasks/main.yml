---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/dns_views_zones']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_dns_views_zones_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/dns_views_zones | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_dns_views_zones_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_dns_views_zones_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_dns_views_zones_status: "running"
    fe_infoblox_day0_deploy_config_dns_views_zones_preflight_passed: false
    fe_infoblox_day0_deploy_config_dns_views_zones_postflight_passed: false
    fe_infoblox_day0_deploy_config_dns_views_zones_failed_task: ""
    fe_infoblox_day0_deploy_config_dns_views_zones_error: ""
    fe_infoblox_day0_deploy_config_dns_views_zones_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/dns_views_zones | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/dns_views_zones | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/dns_views_zones: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/dns_views_zones: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/dns_views_zones | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/dns_views_zones: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/dns_views_zones: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/dns_views_zones | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_dns_views_zones_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate vars
      ansible.builtin.assert:
        that:
          - nios_host|length > 0
          - nios_username|length > 0
          - nios_password|length > 0

    - name: Provider
      ansible.builtin.set_fact:
        nios_provider:
          host: "{{ nios_host }}"
          username: "{{ nios_username }}"
          password: "{{ nios_password }}"
          ssl_verify: "{{ nios_validate_certs | default(false) }}"
          wapi_version: "{{ nios_wapi_version | default('v2.12') }}"

      no_log: true
    - name: Ensure network views
      infoblox.nios_modules.nios_network_view:
        provider: "{{ nios_provider }}"
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        state: present
      loop: "{{ network_views | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Ensure DNS views
      infoblox.nios_modules.nios_dns_view:
        provider: "{{ nios_provider }}"
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        state: present
      loop: "{{ dns_views | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Ensure IPv4 network containers
      infoblox.nios_modules.nios_network:
        provider: "{{ nios_provider }}"
        network: "{{ item.cidr }}"
        network_view: "{{ item.network_view | default('default') }}"
        comment: "{{ item.comment | default(omit) }}"
        configure_for_dhcp: false
        state: present
      loop: "{{ network_containers_v4 | default([]) }}"
      loop_control: { label: "{{ item.cidr }}" }

    - name: Ensure authoritative zones
      infoblox.nios_modules.nios_zone:
        provider: "{{ nios_provider }}"
        fqdn: "{{ item.fqdn }}"
        view: "{{ item.view | default('default') }}"
        ns_group: "{{ item.ns_group | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
        state: present
      loop: "{{ zones_auth | default([]) }}"
      loop_control: { label: "{{ item.fqdn }}" }

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/dns_views_zones | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_dns_views_zones_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_dns_views_zones_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/dns_views_zones: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_dns_views_zones_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_dns_views_zones_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/dns_views_zones: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/dns_views_zones | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_dns_views_zones_postflight_passed: true
        fe_infoblox_day0_deploy_config_dns_views_zones_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/dns_views_zones | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_dns_views_zones_status: "failed"
        fe_infoblox_day0_deploy_config_dns_views_zones_postflight_passed: false
        fe_infoblox_day0_deploy_config_dns_views_zones_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_dns_views_zones_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/dns_views_zones | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/dns_views_zones: FAILED at '{{ fe_infoblox_day0_deploy_config_dns_views_zones_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_dns_views_zones_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/dns_views_zones | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/dns_views_zones failed at '{{ fe_infoblox_day0_deploy_config_dns_views_zones_failed_task }}': {{ fe_infoblox_day0_deploy_config_dns_views_zones_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/dns_views_zones | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_dns_views_zones_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_dns_views_zones_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_dns_views_zones_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/dns_views_zones | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/dns_views_zones":
              component: "infoblox/day0_deploy_config/dns_views_zones"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_dns_views_zones_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_dns_views_zones_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_dns_views_zones_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_dns_views_zones_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/dns_views_zones'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/dns_views_zones | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_dns_views_zones_stats_published: true
      tags:
        - always
