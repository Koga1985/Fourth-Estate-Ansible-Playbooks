---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/infoblox_rpz_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_infoblox_rpz_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status: "running"
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_preflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_postflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_failed_task: ""
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_error: ""
    fe_infoblox_day0_deploy_config_infoblox_rpz_policies_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_rpz_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/infoblox_rpz_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/infoblox_rpz_policies: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/infoblox_rpz_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        rpz_dns_view: "{{ rpz_dns_view | default('default') }}"
        rpz_zones: "{{ rpz_zones | default([]) }}"
        rpz_enforcement_order: "{{ rpz_enforcement_order | default([]) }}"
        rpz_sync: "{{ rpz_sync | default(false) }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-rpz') }}"

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

      no_log: true
    - name: Get DNS view ref for RPZ operations
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/dns_view"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          name: "{{ rpz_dns_view }}"
          "_return_fields+": "name,_ref"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: rpz_view
      failed_when: false

    - name: Set fact for view
      ansible.builtin.set_fact:
        _view_ref: "{{ (rpz_view.json.result|default([]))[0]._ref | default(omit) }}"

    - name: Get existing RPZ zones
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/zone_rpz"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 5000
          "_return_fields+": "fqdn,primary_type,grid_primary,view,_ref,comment"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: rpz_z_get
      failed_when: false

    - name: Map existing RPZ zones by name
      ansible.builtin.set_fact:
        _rpz_by_name: "{{ dict( ((rpz_z_get.json.result | default([])) | map(attribute='fqdn') | list) | zip(rpz_z_get.json.result | default([])) ) }}"

    - name: Ensure RPZ zones (create/update best-effort)
      vars:
        _name: "{{ item.name }}"
        _payload:
          fqdn: "{{ item.name }}"
          view: "{{ rpz_dns_view }}"
          primary_type: "{{ item.primary_type | default('primary') }}"
          grid_primary: "{{ item.grid_primary | default(omit) }}"
          comment: "{{ item.comment | default(omit) }}"
      block:
        - name: Create RPZ when missing
          when: _rpz_by_name.get(_name) is not defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/zone_rpz"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,201,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: rpz_create
          failed_when: false

        - name: Update RPZ when present
          when: _rpz_by_name.get(_name) is defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _rpz_by_name[_name]._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: rpz_update
          failed_when: false
      loop: "{{ rpz_zones }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Refresh RPZ zones after changes
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/zone_rpz"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 5000
          "_return_fields+": "fqdn,_ref,view"
          view: "{{ rpz_dns_view }}"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: rpz_post
      failed_when: false

    - name: Index updated zones
      ansible.builtin.set_fact:
        _rpz_by_name: "{{ dict( ((rpz_post.json.result | default([])) | map(attribute='fqdn') | list) | zip(rpz_post.json.result | default([])) ) }}"

    - name: Enforce RPZ enforcement order (best-effort, fields can vary)
      when: (_view_ref is defined) and (rpz_enforcement_order | length > 0)
      block:
        - name: Try put 'rpz_policy_zones_order'
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _view_ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body:
              rpz_policy_zones_order: "{{ rpz_enforcement_order | map('extract', _rpz_by_name) | map(attribute='_ref') | list | select('defined') | list }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: order_put1
          failed_when: false

        - name: Try put 'response_policy_zones_order' (alternate)
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _view_ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body:
              response_policy_zones_order: "{{ rpz_enforcement_order | map('extract', _rpz_by_name) | map(attribute='_ref') | list | select('defined') | list }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: order_put2
          failed_when: false

    - name: "Optional: trigger RPZ refresh on zones (best-effort)"
      when: rpz_sync | bool
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/{{ (_rpz_by_name[item.name]._ref | default('zone_rpz:dummy')) }}?_function=refresh"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: {}
        status_code: [200,400,404]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      loop: "{{ rpz_zones }}"
      loop_control: { label: "{{ item.name }}" }
      register: rpz_refresh
      failed_when: false

    - name: Artifact summary
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/rpz_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "view": rpz_dns_view,
              "zones": rpz_zones,
              "order": rpz_enforcement_order,
              "sync_requested": rpz_sync
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_infoblox_rpz_policies_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_rpz_policies: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/infoblox_rpz_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_postflight_passed: true
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status: "failed"
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_postflight_passed: false
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/infoblox_rpz_policies: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/infoblox_rpz_policies failed at '{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_rpz_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/infoblox_rpz_policies":
              component: "infoblox/day0_deploy_config/infoblox_rpz_policies"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_rpz_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_infoblox_rpz_policies_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox_rpz_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_rpz_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_rpz_policies_stats_published: true
      tags:
        - always
