---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/infoblox_dhcp_failover']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status: "running"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_preflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_postflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_failed_task: ""
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_error: ""
    fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_failover: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_failover: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/infoblox_dhcp_failover: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/infoblox_dhcp_failover: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: ERROR
      ansible.builtin.fail:
        msg: "Full DHCP failover task body not found in this environment. Please paste the earlier provided full content."

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_failover: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/infoblox_dhcp_failover: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_postflight_passed: true
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status: "failed"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_postflight_passed: false
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_failover: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_failover failed at '{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/infoblox_dhcp_failover":
              component: "infoblox/day0_deploy_config/infoblox_dhcp_failover"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox_dhcp_failover'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_failover | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_failover_stats_published: true
      tags:
        - always
