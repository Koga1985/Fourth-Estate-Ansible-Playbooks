---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/infoblox_grid_bootstrap']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status: "running"
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_preflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_postflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_failed_task: ""
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_error: ""
    fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_grid_bootstrap: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/infoblox_grid_bootstrap: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/infoblox_grid_bootstrap: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/infoblox_grid_bootstrap: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate vars
      ansible.builtin.assert:
        that:
          - nios_host|length > 0
          - nios_username|length > 0
          - nios_password|length > 0

    - name: Setup base facts
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version | default('v2.12') }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs | default(false) }}"

      no_log: true
    - name: Configure NTP servers (Grid) - best-effort
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=set_ntp"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: { ntp_servers: "{{ ntp_servers | default([]) }}" }
        status_code: [200,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: ntp_set
      failed_when: false

    - name: Configure syslog (Grid) - best-effort
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=set_syslog_servers"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: { syslog_servers: "{{ syslog_targets | default([]) }}" }
        status_code: [200,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: syslog_set
      failed_when: false

    - name: Fetch Grid ref
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid"
        method: GET
        return_content: true
        status_code: [200]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: grid_get

    - name: Update SMTP relay (best-effort)
      when: smtp_relay is defined and smtp_relay|length > 0 and (grid_get.json._ref is defined)
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/{{ grid_get.json._ref }}"
        method: PUT
        headers: { Content-Type: "application/json" }
        body_format: json
        body: { smtp_server: "{{ smtp_relay }}" }
        status_code: [200,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      failed_when: false

    - name: Configure SNMP traps (Grid) - best-effort
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/grid?_function=set_snmp_trap_receivers"
        method: POST
        headers: { Content-Type: "application/json" }
        body_format: json
        body: { trap_receivers: "{{ snmp_trap_receivers | default([]) }}" }
        status_code: [200,400]
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: snmp_set
      failed_when: false

    - name: Artifact
      ansible.builtin.copy:
        dest: "{{ artifact_dir | default('/tmp/infoblox-grid-bootstrap') }}/grid_bootstrap_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "ntp_servers": ntp_servers | default([]),
              "syslog_targets": syslog_targets | default([]),
              "smtp_relay": smtp_relay | default(''),
              "snmp_trap_receivers": snmp_trap_receivers | default([]),
              "notes": "Member join not automated here; configure via OVA/CLI and then manage with roles."
            } | to_nice_json
          }}

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_grid_bootstrap: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/infoblox_grid_bootstrap: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_postflight_passed: true
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status: "failed"
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_postflight_passed: false
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/infoblox_grid_bootstrap: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/infoblox_grid_bootstrap failed at '{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/infoblox_grid_bootstrap":
              component: "infoblox/day0_deploy_config/infoblox_grid_bootstrap"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox_grid_bootstrap'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_grid_bootstrap | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_grid_bootstrap_stats_published: true
      tags:
        - always
