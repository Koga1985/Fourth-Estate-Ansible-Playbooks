---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/day0_deploy_config/infoblox_dhcp_scopes']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status: "running"
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_preflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_postflight_passed: false
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_failed_task: ""
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_error: ""
    fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_stats_published: false
  tags:
    - always

- name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_scopes: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_scopes: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/day0_deploy_config/infoblox_dhcp_scopes: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/day0_deploy_config/infoblox_dhcp_scopes: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        network_view: "{{ network_view | default('default') }}"
        dhcp_networks: "{{ dhcp_networks | default([]) }}"
        dhcp_ranges: "{{ dhcp_ranges | default([]) }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-dhcp-scopes') }}"

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build WAPI base & creds (for lease timers / fallback)
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          http_user: "{{ nios_username }}"
          http_password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

    - name: Ensure IPv4 networks exist and set options
      infoblox.nios_modules.nios_network:
        network: "{{ item.cidr }}"
        network_view: "{{ item.network_view | default(network_view) }}"
        comment: "{{ item.comment | default(omit) }}"
        options: >-
          {{
            (item.options | default([])) + (
              item.routers is defined
                | ternary([{'name': 'routers', 'value': (item.routers | join(','))}], [])
            ) + (
              item.domain_name is defined
                | ternary([{'name': 'domain-name', 'value': item.domain_name}], [])
            ) + (
              item.dns_servers is defined
                | ternary([{'name': 'domain-name-servers', 'value': (item.dns_servers | join(','))}], [])
            )
          }}
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: present
      loop: "{{ dhcp_networks }}"
      loop_control: { label: "{{ item.cidr }}" }

    - name: Apply network lease_time via WAPI (best-effort)
      when: item.lease_time is defined
      vars:
        _view: "{{ item.network_view | default(network_view) }}"
      block:
        - name: Lookup network ref
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/network"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              network_view: "{{ _view }}"
              network: "{{ item.cidr }}"
              "_return_fields+": "network,network_view,_ref,lease_time"
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
          no_log: true
          register: _net_get

        - name: PUT lease_time on network
          no_log: true
          when: (_net_get.json.result | default([])) | length > 0
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _net_get.json.result[0]._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { lease_time: "{{ item.lease_time }}" }
            status_code: [200,400]
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
          register: _net_put
          failed_when: false
      loop: "{{ dhcp_networks }}"
      loop_control: { label: "{{ item.cidr }} (lease_time)" }

    - name: Ensure IPv4 ranges exist and set options
      infoblox.nios_modules.nios_range:
        start_addr: "{{ item.start }}"
        end_addr: "{{ item.end }}"
        network_view: "{{ item.network_view | default(network_view) }}"
        comment: "{{ item.comment | default(omit) }}"
        network: "{{ item.network | default(omit) }}"
        options: >-
          {{
            (item.options | default([])) + (
              item.routers is defined
                | ternary([{'name': 'routers', 'value': (item.routers | join(','))}], [])
            ) + (
              item.domain_name is defined
                | ternary([{'name': 'domain-name', 'value': item.domain_name}], [])
            ) + (
              item.dns_servers is defined
                | ternary([{'name': 'domain-name-servers', 'value': (item.dns_servers | join(','))}], [])
            )
          }}
        extattrs: "{{ item.extattrs | default(omit) }}"
        state: present
      loop: "{{ dhcp_ranges }}"
      loop_control: { label: "{{ item.start }}-{{ item.end }}" }

    - name: Apply range lease_time via WAPI (best-effort)
      when: item.lease_time is defined
      block:
        - name: Lookup range ref
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/range"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              start_addr: "{{ item.start }}"
              end_addr: "{{ item.end }}"
              "_return_fields+": "start_addr,end_addr,_ref,lease_time"
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
          no_log: true
          register: _range_get

        - name: PUT lease_time on range
          no_log: true
          when: (_range_get.json.result | default([])) | length > 0
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _range_get.json.result[0]._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { lease_time: "{{ item.lease_time }}" }
            status_code: [200,400]
            user: "{{ nios_username }}"
            password: "{{ nios_password }}"
            force_basic_auth: true
            validate_certs: "{{ nios_validate_certs }}"
          register: _range_put
          failed_when: false
      loop: "{{ dhcp_ranges }}"
      loop_control: { label: "{{ item.start }}-{{ item.end }} (lease_time)" }

    - name: Save summary artifact
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/dhcp_scopes_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "networks_count": (dhcp_networks | length),
              "ranges_count": (dhcp_ranges | length),
              "note": "Options applied via modules; lease_time via WAPI best-effort."
            } | to_nice_json
          }}

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Managed {{ dhcp_networks | length }} networks and {{ dhcp_ranges | length }} ranges"
          - "Artifact: {{ artifact_dir }}/dhcp_scopes_summary.json"

    # ----------------------------- postflight -------------------

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_preflight_passed | bool
          - fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_scopes: postflight validation failed - preflight passed
          ={{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_preflight_passed | default(false) }},
          status={{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status | default('unknown') }}.
        success_msg: "infoblox/day0_deploy_config/infoblox_dhcp_scopes: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_postflight_passed: true
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status: "failed"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_postflight_passed: false
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_scopes: FAILED at '{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/day0_deploy_config/infoblox_dhcp_scopes failed at '{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_failed_task }}': {{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/day0_deploy_config/infoblox_dhcp_scopes":
              component: "infoblox/day0_deploy_config/infoblox_dhcp_scopes"
              type: "role"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_failed_task | default('') }}"
              error: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_status | default('') == 'succeeded' else ['infoblox/day0_deploy_config/infoblox_dhcp_scopes'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/day0_deploy_config/infoblox_dhcp_scopes | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_day0_deploy_config_infoblox_dhcp_scopes_stats_published: true
      tags:
        - always
