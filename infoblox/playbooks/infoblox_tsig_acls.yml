# tasks/infoblox_tsig_acls.yml
---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['infoblox/infoblox_tsig_acls']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_infoblox_infoblox_tsig_acls_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "infoblox/infoblox_tsig_acls | Initialize validation state"
  ansible.builtin.set_fact:
    fe_infoblox_infoblox_tsig_acls_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_infoblox_infoblox_tsig_acls_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_infoblox_infoblox_tsig_acls_status: "running"
    fe_infoblox_infoblox_tsig_acls_preflight_passed: false
    fe_infoblox_infoblox_tsig_acls_postflight_passed: false
    fe_infoblox_infoblox_tsig_acls_failed_task: ""
    fe_infoblox_infoblox_tsig_acls_error: ""
    fe_infoblox_infoblox_tsig_acls_stats_published: false
  tags:
    - always

- name: "infoblox/infoblox_tsig_acls | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "infoblox/infoblox_tsig_acls | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          infoblox/infoblox_tsig_acls: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          infoblox/infoblox_tsig_acls: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_tsig_acls | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "infoblox/infoblox_tsig_acls: required variable '{{ item }}' is not defined."
        success_msg: "infoblox/infoblox_tsig_acls: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_infoblox_infoblox_tsig_acls_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "infoblox/infoblox_tsig_acls | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_tsig_acls_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate Infoblox connection vars
      ansible.builtin.assert:
        that:
          - nios_host | length > 0
          - nios_username | length > 0
          - nios_password | length > 0
        fail_msg: "Set nios_host / nios_username / nios_password."

    - name: Defaults
      ansible.builtin.set_fact:
        nios_validate_certs: "{{ nios_validate_certs | default(false) }}"
        nios_wapi_version: "{{ nios_wapi_version | default('v2.12') }}"
        artifact_dir: "{{ artifact_dir | default('/tmp/infoblox-tsig-acls') }}"
        dns_view_policies: "{{ dns_view_policies | default([]) }}"   # see examples below
        tsig_keys: "{{ tsig_keys | default([]) }}"
        named_acls: "{{ named_acls | default([]) }}"

    - name: Ensure artifact directory
      ansible.builtin.file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: "0755"

    - name: Build WAPI base & creds
      ansible.builtin.set_fact:
        _wapi_base: "https://{{ nios_host }}/wapi/{{ nios_wapi_version }}"
        _creds:
          user: "{{ nios_username }}"
          password: "{{ nios_password }}"
          force_basic_auth: true
          validate_certs: "{{ nios_validate_certs }}"

    # ------------------------------------------------------------
    # 1) DISCOVERY
    # ------------------------------------------------------------
      no_log: true
    - name: Get DNS views (for policy updates)
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/dns_view"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 5000
          "_return_fields+": "name,_ref,recursion,match_clients,comment,extattrs,allow_query,query_acl,recursion_acl"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: views_get

    - name: Get existing TSIG keys (try tsigkey then tsig_key)
      block:
        - ansible.builtin.uri:
            url: "{{ _wapi_base }}/tsigkey"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              _max_results: 5000
              "_return_fields+": "name,algorithm,secret,_ref,comment,extattrs"
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: tsig_a
          failed_when: false

        - ansible.builtin.uri:
            url: "{{ _wapi_base }}/tsig_key"
            method: GET
            return_content: true
            status_code: [200]
            params:
              _return_as_object: 1
              _max_results: 5000
              "_return_fields+": "name,algorithm,secret,_ref,comment,extattrs"
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: tsig_b
          failed_when: false
      rescue: []

    - name: Choose TSIG endpoint & map
      ansible.builtin.set_fact:
        _tsig_endpoint: >-
          {% if (tsig_a.status | default(0)) == 200 %}tsigkey{% else %}tsig_key{% endif %}
        _tsig_existing: >-
          {% if (tsig_a.status | default(0)) == 200 %}{{ tsig_a.json.result | default([]) }}{% else %}{{ tsig_b.json.result | default([]) }}{% endif %}
        _tsig_by_name: "{{ dict( ((_tsig_existing | default([])) | map(attribute='name') | list) | zip(_tsig_existing | default([])) ) }}"

    - name: Get existing Named ACLs
      ansible.builtin.uri:
        url: "{{ _wapi_base }}/namedacl"
        method: GET
        return_content: true
        status_code: [200]
        params:
          _return_as_object: 1
          _max_results: 5000
          "_return_fields+": "name,acl,_ref,comment,extattrs"
        url_username: "{{ _creds.user }}"
        url_password: "{{ _creds.password }}"
        force_basic_auth: "{{ _creds.force_basic_auth }}"
        validate_certs: "{{ _creds.validate_certs }}"
      register: acls_get
      failed_when: false

    - name: Map views and ACLs
      ansible.builtin.set_fact:
        _views_by_name: "{{ dict( ((views_get.json.result | default([])) | map(attribute='name') | list) | zip(views_get.json.result | default([])) ) }}"
        _acl_by_name: "{{ dict( ((acls_get.json.result | default([])) | map(attribute='name') | list) | zip(acls_get.json.result | default([])) ) }}"

    # ------------------------------------------------------------
    # 2) ENSURE TSIG KEYS
    #    { name, algorithm, secret, comment, extattrs }
    # ------------------------------------------------------------
    - name: Ensure TSIG keys (create/update best-effort)
      no_log: true
      vars:
        _name: "{{ item.name }}"
        _payload:
          name: "{{ item.name }}"
          algorithm: "{{ item.algorithm | default('hmac-sha256') }}"
          secret: "{{ item.secret }}"
          comment: "{{ item.comment | default(omit) }}"
          extattrs: "{{ item.extattrs | default(omit) }}"
      block:
        - name: Create TSIG key when missing
          when: _tsig_by_name.get(_name) is not defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _tsig_endpoint }}"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,201,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: tsig_create
          failed_when: false

        - name: Update TSIG key when present
          when: _tsig_by_name.get(_name) is defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _tsig_by_name[_name]._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: tsig_update
          failed_when: false
      loop: "{{ tsig_keys }}"
      loop_control: { label: "{{ item.name }}" }

    # ------------------------------------------------------------
    # 3) ENSURE NAMED ACLs
    #    Schema:
    #      - name: ACL-Corp
    #        entries:
    #          - type: "network"  value: "10.0.0.0/8"
    #          - type: "ip"       value: "192.0.2.10"
    #          - type: "acl"      value: "Another-ACL"
    #          - type: "tsig"     value: "key-name"
    # ------------------------------------------------------------
    - name: Build ACL entry objects per item
      ansible.builtin.set_fact:
        _acl_entries: >-
          {{
            item.entries | default([]) | map('combine', {}) | list | map('community.general.dict_kv', 'dummy', 0) | list
          }}
      loop: "{{ named_acls }}"
      register: _acl_dummy   # just to iterate and set facts per item (not used directly)
      changed_when: false

    - name: Ensure Named ACLs (create/update best-effort)
      vars:
        _name: "{{ item.name }}"
        _entries: >-
          {# Convert simplified entries -> WAPI acl[] best-effort #}
          {%- set out = [] -%}
          {%- for e in item.entries | default([]) -%}
            {%- if e.type in ['network','cidr'] -%}
              {%- set _ = out.append({'network': e.value}) -%}
            {%- elif e.type in ['ip','host'] -%}
              {%- set _ = out.append({'address': e.value}) -%}
            {%- elif e.type == 'acl' -%}
              {%- set ref = (_acl_by_name.get(e.value) or {}) .get('_ref', e.value) -%}
              {%- set _ = out.append({'acl': ref}) -%}
            {%- elif e.type == 'tsig' -%}
              {%- set tref = (_tsig_by_name.get(e.value) or {}) .get('_ref', e.value) -%}
              {%- set _ = out.append({'tsig_key': tref}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _payload:
          name: "{{ item.name }}"
          comment: "{{ item.comment | default(omit) }}"
          extattrs: "{{ item.extattrs | default(omit) }}"
          acl: "{{ _entries if (_entries | length) > 0 else omit }}"
      block:
        - name: Create Named ACL when missing
          when: _acl_by_name.get(_name) is not defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/namedacl"
            method: POST
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,201,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: acl_create
          failed_when: false

        - name: Update Named ACL when present
          when: _acl_by_name.get(_name) is defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _acl_by_name[_name]._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: "{{ _payload }}"
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: acl_update
          failed_when: false
      loop: "{{ named_acls }}"
      loop_control: { label: "{{ item.name }}" }

    # ------------------------------------------------------------
    # 4) APPLY PER-VIEW POLICIES
    #    dns_view_policies items:
    #      - view: "default"
    #        recursion_enabled: true|false
    #        query_acl: "ACL-Corp"            # named ACL name (optional)
    #        recursion_acl: "ACL-Helpdesk"    # named ACL name (optional)
    #        match_clients: ["ACL-Corp","192.0.2.10","10.0.0.0/8"]  # optional mixed list
    # ------------------------------------------------------------
    - name: Apply DNS view policies (best-effort PUTs)
      vars:
        _v: "{{ _views_by_name.get(item.view) }}"
        _query_acl_ref: "{{ (_acl_by_name.get(item.query_acl) or {}) .get('_ref', omit) }}"
        _rec_acl_ref: "{{ (_acl_by_name.get(item.recursion_acl) or {}) .get('_ref', omit) }}"
        _mc_list: >-
          {# Build match_clients list from mix of ACL names / IPs/CIDRs #}
          {%- set arr = [] -%}
          {%- for x in (item.match_clients | default([])) -%}
            {%- set a_ref = (_acl_by_name.get(x) or {}) .get('_ref') -%}
            {%- if a_ref -%}
              {%- set _ = arr.append({'acl': a_ref}) -%}
            {%- elif '/' in x or ('.' in x) -%}
              {%- set _ = arr.append({'network': x}) -%}
            {%- else -%}
              {%- set _ = arr.append({'address': x}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ arr }}
      when: _v is defined
      block:
        - name: Set recursion boolean (if provided)
          when: item.recursion_enabled is defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _v._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { recursion: "{{ item.recursion_enabled | bool }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: put_recursion
          failed_when: false

        - name: Set query ACL (try allow_query then query_acl)
          when: item.query_acl is defined
          block:
            - ansible.builtin.uri:
                url: "{{ _wapi_base }}/{{ _v._ref }}"
                method: PUT
                headers: { Content-Type: "application/json" }
                body_format: json
                body: { allow_query: [ { "acl": "{{ _query_acl_ref }}" } ] }
                status_code: [200,400]
                url_username: "{{ _creds.user }}"
                url_password: "{{ _creds.password }}"
                force_basic_auth: "{{ _creds.force_basic_auth }}"
                validate_certs: "{{ _creds.validate_certs }}"
              register: put_query1
              failed_when: false

            - ansible.builtin.uri:
                url: "{{ _wapi_base }}/{{ _v._ref }}"
                method: PUT
                headers: { Content-Type: "application/json" }
                body_format: json
                body: { query_acl: "{{ _query_acl_ref }}" }
                status_code: [200,400]
                url_username: "{{ _creds.user }}"
                url_password: "{{ _creds.password }}"
                force_basic_auth: "{{ _creds.force_basic_auth }}"
                validate_certs: "{{ _creds.validate_certs }}"
              register: put_query2
              failed_when: false

        - name: Set recursion ACL (try recursion_acl field)
          when: item.recursion_acl is defined
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _v._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { recursion_acl: "{{ _rec_acl_ref }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: put_recacl
          failed_when: false

        - name: Set match_clients (split-horizon clients)
          when: (item.match_clients | default([])) | length > 0
          ansible.builtin.uri:
            url: "{{ _wapi_base }}/{{ _v._ref }}"
            method: PUT
            headers: { Content-Type: "application/json" }
            body_format: json
            body: { match_clients: "{{ _mc_list }}" }
            status_code: [200,400]
            url_username: "{{ _creds.user }}"
            url_password: "{{ _creds.password }}"
            force_basic_auth: "{{ _creds.force_basic_auth }}"
            validate_certs: "{{ _creds.validate_certs }}"
          register: put_matchclients
          failed_when: false
      loop: "{{ dns_view_policies }}"
      loop_control: { label: "{{ item.view }}" }

    # ------------------------------------------------------------
    # 5) ARTIFACT
    # ------------------------------------------------------------
    - name: Save summary artifact
      ansible.builtin.copy:
        dest: "{{ artifact_dir }}/tsig_acls_policies_summary.json"
        mode: "0644"
        content: >-
          {{
            {
              "views_seen": (views_get.json.result | default([])) | map(attribute='name') | list,
              "tsig_endpoint": _tsig_endpoint,
              "tsig_keys_requested": (tsig_keys | map(attribute='name') | list),
              "named_acls_requested": (named_acls | map(attribute='name') | list),
              "dns_view_policies": dns_view_policies
            } | to_nice_json
          }}

    - name: Done
      ansible.builtin.debug:
        msg:
          - "TSIG keys processed: {{ tsig_keys | length }}"
          - "Named ACLs processed: {{ named_acls | length }}"
          - "DNS view policies processed: {{ dns_view_policies | length }}"
          - "Artifact: {{ artifact_dir }}/tsig_acls_policies_summary.json"

    # ----------------------------- postflight -------------------

    - name: "infoblox/infoblox_tsig_acls | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_infoblox_infoblox_tsig_acls_preflight_passed | bool
          - fe_infoblox_infoblox_tsig_acls_status in ['running', 'succeeded']
        fail_msg: >-
          infoblox/infoblox_tsig_acls: postflight validation failed - preflight passed
          ={{ fe_infoblox_infoblox_tsig_acls_preflight_passed | default(false) }},
          status={{ fe_infoblox_infoblox_tsig_acls_status | default('unknown') }}.
        success_msg: "infoblox/infoblox_tsig_acls: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "infoblox/infoblox_tsig_acls | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_tsig_acls_postflight_passed: true
        fe_infoblox_infoblox_tsig_acls_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "infoblox/infoblox_tsig_acls | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_tsig_acls_status: "failed"
        fe_infoblox_infoblox_tsig_acls_postflight_passed: false
        fe_infoblox_infoblox_tsig_acls_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_infoblox_infoblox_tsig_acls_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_tsig_acls | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          infoblox/infoblox_tsig_acls: FAILED at '{{ fe_infoblox_infoblox_tsig_acls_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_infoblox_infoblox_tsig_acls_error }}
      tags:
        - always
        - rescue

    - name: "infoblox/infoblox_tsig_acls | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          infoblox/infoblox_tsig_acls failed at '{{ fe_infoblox_infoblox_tsig_acls_failed_task }}': {{ fe_infoblox_infoblox_tsig_acls_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "infoblox/infoblox_tsig_acls | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_tsig_acls_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_infoblox_infoblox_tsig_acls_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_infoblox_infoblox_tsig_acls_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "infoblox/infoblox_tsig_acls | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "infoblox/infoblox_tsig_acls":
              component: "infoblox/infoblox_tsig_acls"
              type: "tasks"
              platform: "infoblox"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_infoblox_infoblox_tsig_acls_status | default('unknown') }}"
              preflight_passed: "{{ fe_infoblox_infoblox_tsig_acls_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_infoblox_infoblox_tsig_acls_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_infoblox_infoblox_tsig_acls_started_at | default('') }}"
              ended_at: "{{ fe_infoblox_infoblox_tsig_acls_ended_at | default('') }}"
              duration_seconds: "{{ fe_infoblox_infoblox_tsig_acls_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_infoblox_infoblox_tsig_acls_failed_task | default('') }}"
              error: "{{ fe_infoblox_infoblox_tsig_acls_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_infoblox_infoblox_tsig_acls_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_infoblox_infoblox_tsig_acls_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_infoblox_infoblox_tsig_acls_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_infoblox_infoblox_tsig_acls_status | default('') == 'succeeded' else ['infoblox/infoblox_tsig_acls'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "infoblox/infoblox_tsig_acls | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_infoblox_infoblox_tsig_acls_stats_published: true
      tags:
        - always
