---
# Deploy health check scripts

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_monitoring/deploy_health_checks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_monitoring_deploy_health_checks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_monitoring/deploy_health_checks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_monitoring_deploy_health_checks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_monitoring_deploy_health_checks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_monitoring_deploy_health_checks_status: "running"
    fe_splunk_splunk_monitoring_deploy_health_checks_preflight_passed: false
    fe_splunk_splunk_monitoring_deploy_health_checks_postflight_passed: false
    fe_splunk_splunk_monitoring_deploy_health_checks_failed_task: ""
    fe_splunk_splunk_monitoring_deploy_health_checks_error: ""
    fe_splunk_splunk_monitoring_deploy_health_checks_stats_published: false
  tags:
    - always

- name: "splunk/splunk_monitoring/deploy_health_checks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_monitoring/deploy_health_checks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_monitoring/deploy_health_checks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_monitoring/deploy_health_checks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_monitoring/deploy_health_checks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_monitoring/deploy_health_checks: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_monitoring/deploy_health_checks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_monitoring/deploy_health_checks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_monitoring_deploy_health_checks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create monitoring scripts directory
      ansible.builtin.file:
        path: "{{ splunk_home }}/bin/monitoring"
        state: directory
        owner: "{{ splunk_user }}"
        mode: '0750'

    - name: Deploy Splunk health check script
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/bin/monitoring/health_check.sh"
        content: |
          #!/bin/bash
          # Splunk Health Check Script
          SPLUNK_HOME={{ splunk_home }}

          echo "=== Splunk Health Check ==="
          echo "Timestamp: $(date)"

          # Check Splunkd status
          if $SPLUNK_HOME/bin/splunk status | grep -q "splunkd is running"; then
            echo "[OK] Splunkd is running"
          else
            echo "[CRITICAL] Splunkd is not running"
            exit 2
          fi

          # Check disk usage
          DISK_USAGE=$(df -h $SPLUNK_HOME | tail -1 | awk '{print $5}' | sed 's/%//')
          if [ $DISK_USAGE -gt {{ monitoring_disk_threshold }} ]; then
            echo "[WARNING] Disk usage is ${DISK_USAGE}%"
          else
            echo "[OK] Disk usage is ${DISK_USAGE}%"
          fi

          # Check for errors in internal logs
          ERROR_COUNT=$(grep -c ERROR $SPLUNK_HOME/var/log/splunk/splunkd.log | tail -100 || echo 0)
          echo "[INFO] Recent errors: $ERROR_COUNT"

          echo "=== Health Check Complete ==="
        owner: "{{ splunk_user }}"
        mode: '0750'

    - name: Schedule health checks
      ansible.builtin.cron:
        name: "Splunk health check"
        minute: "*/5"
        job: "{{ splunk_home }}/bin/monitoring/health_check.sh >> {{ splunk_home }}/var/log/splunk/health_check.log 2>&1"
        user: "{{ splunk_user }}"
      when: monitoring_enable_health_checks | bool

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_monitoring/deploy_health_checks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_monitoring_deploy_health_checks_preflight_passed | bool
          - fe_splunk_splunk_monitoring_deploy_health_checks_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_monitoring/deploy_health_checks: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_monitoring_deploy_health_checks_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_monitoring_deploy_health_checks_status | default('unknown') }}.
        success_msg: "splunk/splunk_monitoring/deploy_health_checks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_monitoring/deploy_health_checks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_monitoring_deploy_health_checks_postflight_passed: true
        fe_splunk_splunk_monitoring_deploy_health_checks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_monitoring/deploy_health_checks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_monitoring_deploy_health_checks_status: "failed"
        fe_splunk_splunk_monitoring_deploy_health_checks_postflight_passed: false
        fe_splunk_splunk_monitoring_deploy_health_checks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_monitoring_deploy_health_checks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_monitoring/deploy_health_checks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_monitoring/deploy_health_checks: FAILED at '{{ fe_splunk_splunk_monitoring_deploy_health_checks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_monitoring_deploy_health_checks_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_monitoring/deploy_health_checks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_monitoring/deploy_health_checks failed at '{{ fe_splunk_splunk_monitoring_deploy_health_checks_failed_task }}': {{ fe_splunk_splunk_monitoring_deploy_health_checks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_monitoring/deploy_health_checks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_monitoring_deploy_health_checks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_monitoring_deploy_health_checks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_monitoring_deploy_health_checks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_monitoring/deploy_health_checks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_monitoring/deploy_health_checks":
              component: "splunk/splunk_monitoring/deploy_health_checks"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_monitoring_deploy_health_checks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_monitoring_deploy_health_checks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_monitoring_deploy_health_checks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_monitoring_deploy_health_checks_status | default('') == 'succeeded' else ['splunk/splunk_monitoring/deploy_health_checks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_monitoring/deploy_health_checks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_monitoring_deploy_health_checks_stats_published: true
      tags:
        - always
