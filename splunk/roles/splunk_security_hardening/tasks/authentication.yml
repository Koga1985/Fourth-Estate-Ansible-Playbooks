---
# Authentication Hardening (NIST 800-53 IA family)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_security_hardening/authentication']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_security_hardening_authentication_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_security_hardening/authentication | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_security_hardening_authentication_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_security_hardening_authentication_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_security_hardening_authentication_status: "running"
    fe_splunk_splunk_security_hardening_authentication_preflight_passed: false
    fe_splunk_splunk_security_hardening_authentication_postflight_passed: false
    fe_splunk_splunk_security_hardening_authentication_failed_task: ""
    fe_splunk_splunk_security_hardening_authentication_error: ""
    fe_splunk_splunk_security_hardening_authentication_stats_published: false
  tags:
    - always

- name: "splunk/splunk_security_hardening/authentication | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_security_hardening/authentication | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_security_hardening/authentication: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_security_hardening/authentication: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_security_hardening/authentication | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_security_hardening/authentication: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_security_hardening/authentication: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_security_hardening_authentication_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_security_hardening/authentication | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_authentication_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Enforce multi-factor authentication
      ansible.builtin.debug:
        msg: "MFA should be configured through LDAP/SAML or third-party app"
      when: ia_enforce_mfa | bool
      tags:
        - authentication
        - mfa

    - name: Configure password policy
      ansible.builtin.blockinfile:
        path: "{{ splunk_home }}/etc/system/local/authentication.conf"
        block: |
          [authentication]
          minPasswordLength = {{ ia_password_min_length }}
          minPasswordDigit = 1
          minPasswordLowercase = 1
          minPasswordUppercase = 1
          minPasswordSpecial = 1
          passwordHistoryCount = {{ ia_password_history_count }}
          enablePasswordHistory = true
        marker: "# {mark} ANSIBLE MANAGED AUTHENTICATION BLOCK"
      notify: restart splunk
      tags:
        - authentication
        - password

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_security_hardening/authentication | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_security_hardening_authentication_preflight_passed | bool
          - fe_splunk_splunk_security_hardening_authentication_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_security_hardening/authentication: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_security_hardening_authentication_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_security_hardening_authentication_status | default('unknown') }}.
        success_msg: "splunk/splunk_security_hardening/authentication: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_security_hardening/authentication | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_authentication_postflight_passed: true
        fe_splunk_splunk_security_hardening_authentication_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_security_hardening/authentication | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_authentication_status: "failed"
        fe_splunk_splunk_security_hardening_authentication_postflight_passed: false
        fe_splunk_splunk_security_hardening_authentication_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_security_hardening_authentication_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_security_hardening/authentication | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_security_hardening/authentication: FAILED at '{{ fe_splunk_splunk_security_hardening_authentication_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_security_hardening_authentication_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_security_hardening/authentication | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_security_hardening/authentication failed at '{{ fe_splunk_splunk_security_hardening_authentication_failed_task }}': {{ fe_splunk_splunk_security_hardening_authentication_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_security_hardening/authentication | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_authentication_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_security_hardening_authentication_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_security_hardening_authentication_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_security_hardening/authentication | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_security_hardening/authentication":
              component: "splunk/splunk_security_hardening/authentication"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_security_hardening_authentication_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_security_hardening_authentication_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_security_hardening_authentication_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_security_hardening_authentication_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_security_hardening_authentication_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_security_hardening_authentication_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_security_hardening_authentication_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_security_hardening_authentication_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_security_hardening_authentication_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_security_hardening_authentication_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_security_hardening_authentication_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_security_hardening_authentication_status | default('') == 'succeeded' else ['splunk/splunk_security_hardening/authentication'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_security_hardening/authentication | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_authentication_stats_published: true
      tags:
        - always
