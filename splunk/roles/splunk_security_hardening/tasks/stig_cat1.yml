---
# STIG Category I (High Severity) Findings Remediation
# These are critical security controls that must be implemented

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_security_hardening/stig_cat1']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_security_hardening_stig_cat1_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_security_hardening/stig_cat1 | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_security_hardening_stig_cat1_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_security_hardening_stig_cat1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_security_hardening_stig_cat1_status: "running"
    fe_splunk_splunk_security_hardening_stig_cat1_preflight_passed: false
    fe_splunk_splunk_security_hardening_stig_cat1_postflight_passed: false
    fe_splunk_splunk_security_hardening_stig_cat1_failed_task: ""
    fe_splunk_splunk_security_hardening_stig_cat1_error: ""
    fe_splunk_splunk_security_hardening_stig_cat1_stats_published: false
  tags:
    - always

- name: "splunk/splunk_security_hardening/stig_cat1 | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_security_hardening/stig_cat1 | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_security_hardening/stig_cat1: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_security_hardening/stig_cat1: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_security_hardening/stig_cat1 | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_security_hardening/stig_cat1: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_security_hardening/stig_cat1: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_security_hardening_stig_cat1_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_security_hardening/stig_cat1 | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_stig_cat1_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: V-258100 - Disable SSLv3 and TLS 1.0/1.1
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        regexp: '^sslVersions'
        line: "sslVersions = tls1.2, tls1.3"
        insertafter: '^\[sslConfig\]'
      notify: restart splunk
      tags:
        - CAT1
        - V-258100
        - tls

    - name: V-258102 - Enable FIPS 140-2 mode
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        regexp: '^fipsMode'
        line: "fipsMode = strict"
        insertafter: '^\[fips\]'
      when: sc_enforce_fips_140_2 | bool
      notify: restart splunk
      tags:
        - CAT1
        - V-258102
        - fips

    - name: V-258104 - Enforce strong cipher suites
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        regexp: '^cipherSuite'
        line: "cipherSuite = {{ sc_cipher_suite }}"
        insertafter: '^\[sslConfig\]'
      notify: restart splunk
      tags:
        - CAT1
        - V-258104
        - ciphers

    - name: V-258106 - Disable anonymous access
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        regexp: '^allowRemoteLogin'
        line: "allowRemoteLogin = requireSetPassword"
        insertafter: '^\[general\]'
      when: ia_disable_anonymous_access | bool
      notify: restart splunk
      tags:
        - CAT1
        - V-258106
        - authentication

    - name: V-258108 - Enable comprehensive audit logging
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/audit.conf"
        content: |
          [auditTrail]
          enableAuditTrail = true
          filepath = {{ splunk_home }}/var/log/splunk/audit.log

          [searchActivity]
          enableSearchActivity = true

          [adminActivity]
          enableAdminActivity = true

          [dataAccessActivity]
          enableDataAccessActivity = true
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      when: au_enable_comprehensive_logging | bool
      notify: restart splunk
      tags:
        - CAT1
        - V-258108
        - audit

    - name: V-258110 - Disable default admin account (create new admin first)
      ansible.builtin.debug:
        msg: "WARNING: Ensure a new administrative account is created before disabling default admin"
      when: ac_disable_default_accounts | bool
      tags:
        - CAT1
        - V-258110
        - accounts

    - name: V-258112 - Configure session timeout
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/web.conf"
        regexp: '^sessionTimeout'
        line: "sessionTimeout = {{ ac_session_timeout_minutes }}"
        insertafter: '^\[settings\]'
      notify: restart splunk
      tags:
        - CAT1
        - V-258112
        - session

    - name: V-258114 - Protect audit logs from modification
      ansible.builtin.file:
        path: "{{ splunk_home }}/var/log/splunk/audit.log"
        attributes: +i
      when:
        - au_audit_log_immutable | bool
        - ansible_os_family == "RedHat"
      failed_when: false
      tags:
        - CAT1
        - V-258114
        - audit

    - name: V-258116 - Disable insecure protocols
      ansible.builtin.blockinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        block: |
          [httpServer]
          disableDefaultPort = true
          allowSslRenegotiation = false
          allowSslCompression = false
        marker: "# {mark} CAT1 V-258116 ANSIBLE MANAGED BLOCK"
      notify: restart splunk
      tags:
        - CAT1
        - V-258116
        - protocols

    - name: V-258118 - Enable certificate validation
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        regexp: '^sslVerifyServerCert'
        line: "sslVerifyServerCert = true"
        insertafter: '^\[sslConfig\]'
      notify: restart splunk
      tags:
        - CAT1
        - V-258118
        - certificates

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_security_hardening/stig_cat1 | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_security_hardening_stig_cat1_preflight_passed | bool
          - fe_splunk_splunk_security_hardening_stig_cat1_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_security_hardening/stig_cat1: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_security_hardening_stig_cat1_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_security_hardening_stig_cat1_status | default('unknown') }}.
        success_msg: "splunk/splunk_security_hardening/stig_cat1: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_security_hardening/stig_cat1 | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_stig_cat1_postflight_passed: true
        fe_splunk_splunk_security_hardening_stig_cat1_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_security_hardening/stig_cat1 | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_stig_cat1_status: "failed"
        fe_splunk_splunk_security_hardening_stig_cat1_postflight_passed: false
        fe_splunk_splunk_security_hardening_stig_cat1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_security_hardening_stig_cat1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_security_hardening/stig_cat1 | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_security_hardening/stig_cat1: FAILED at '{{ fe_splunk_splunk_security_hardening_stig_cat1_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_security_hardening_stig_cat1_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_security_hardening/stig_cat1 | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_security_hardening/stig_cat1 failed at '{{ fe_splunk_splunk_security_hardening_stig_cat1_failed_task }}': {{ fe_splunk_splunk_security_hardening_stig_cat1_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_security_hardening/stig_cat1 | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_stig_cat1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_security_hardening_stig_cat1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_security_hardening_stig_cat1_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_security_hardening/stig_cat1 | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_security_hardening/stig_cat1":
              component: "splunk/splunk_security_hardening/stig_cat1"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_security_hardening_stig_cat1_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_security_hardening_stig_cat1_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_security_hardening_stig_cat1_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_security_hardening_stig_cat1_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_security_hardening_stig_cat1_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_security_hardening_stig_cat1_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_security_hardening_stig_cat1_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_security_hardening_stig_cat1_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_security_hardening_stig_cat1_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_security_hardening_stig_cat1_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_security_hardening_stig_cat1_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_security_hardening_stig_cat1_status | default('') == 'succeeded' else ['splunk/splunk_security_hardening/stig_cat1'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_security_hardening/stig_cat1 | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_security_hardening_stig_cat1_stats_published: true
      tags:
        - always
