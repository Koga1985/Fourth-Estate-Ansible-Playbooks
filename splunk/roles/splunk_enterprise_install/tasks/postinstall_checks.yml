---
# Post-installation validation tasks
# STIG V-258072 - Installation Verification

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/postinstall_checks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_postinstall_checks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/postinstall_checks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_postinstall_checks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_postinstall_checks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_postinstall_checks_status: "running"
    fe_splunk_splunk_enterprise_install_postinstall_checks_preflight_passed: false
    fe_splunk_splunk_enterprise_install_postinstall_checks_postflight_passed: false
    fe_splunk_splunk_enterprise_install_postinstall_checks_failed_task: ""
    fe_splunk_splunk_enterprise_install_postinstall_checks_error: ""
    fe_splunk_splunk_enterprise_install_postinstall_checks_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/postinstall_checks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/postinstall_checks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/postinstall_checks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/postinstall_checks: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/postinstall_checks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postinstall_checks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check Splunk version
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk version"
      become: yes
      become_user: "{{ splunk_user }}"
      register: splunk_version_output
      changed_when: false
      tags:
        - validation
        - version

    - name: Display installed Splunk version
      ansible.builtin.debug:
        msg: "{{ splunk_version_output.stdout_lines }}"
      tags:
        - validation
        - version

    - name: Verify Splunk is responding to API calls
      ansible.builtin.uri:
        url: "https://{{ splunk_bind_ip }}:{{ splunk_mgmt_port }}/services/server/info"
        method: GET
        user: admin
        password: "{{ splunk_admin_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: splunk_api_check
      no_log: true
      tags:
        - validation
        - api

    - name: Verify FIPS mode (if enabled)
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk btool server list fips"
      become: yes
      become_user: "{{ splunk_user }}"
      register: fips_check
      changed_when: false
      when: splunk_enable_fips | bool
      tags:
        - validation
        - fips

    - name: Verify TLS configuration
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk btool server list sslConfig"
      become: yes
      become_user: "{{ splunk_user }}"
      register: tls_check
      changed_when: false
      tags:
        - validation
        - tls

    - name: Check audit logging configuration
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk btool audit list"
      become: yes
      become_user: "{{ splunk_user }}"
      register: audit_check
      changed_when: false
      tags:
        - validation
        - audit

    - name: Verify firewall rules (if configured)
      ansible.builtin.command: firewall-cmd --list-all
      register: firewall_check
      changed_when: false
      when:
        - splunk_configure_firewall | bool
        - ansible_os_family == "RedHat"
      tags:
        - validation
        - firewall

    - name: Create post-installation validation report
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/var/log/splunk/installation_validation.log"
        content: |
          Splunk Enterprise Installation Validation Report
          Generated: {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}

          ==============================================

          Splunk Version:
          {{ splunk_version_output.stdout }}

          FIPS Mode:
          {{ fips_check.stdout if splunk_enable_fips else 'Not Enabled' }}

          TLS Configuration:
          {{ tls_check.stdout }}

          Audit Configuration:
          {{ audit_check.stdout }}

          Compliance Frameworks:
          {{ splunk_compliance_frameworks | join(', ') }}

          ==============================================
          Installation completed successfully
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      tags:
        - validation
        - report

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_postinstall_checks_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_postinstall_checks_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/postinstall_checks: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_postinstall_checks_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_postinstall_checks_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/postinstall_checks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postinstall_checks_postflight_passed: true
        fe_splunk_splunk_enterprise_install_postinstall_checks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postinstall_checks_status: "failed"
        fe_splunk_splunk_enterprise_install_postinstall_checks_postflight_passed: false
        fe_splunk_splunk_enterprise_install_postinstall_checks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_postinstall_checks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/postinstall_checks: FAILED at '{{ fe_splunk_splunk_enterprise_install_postinstall_checks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_postinstall_checks_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/postinstall_checks failed at '{{ fe_splunk_splunk_enterprise_install_postinstall_checks_failed_task }}': {{ fe_splunk_splunk_enterprise_install_postinstall_checks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postinstall_checks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_postinstall_checks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_postinstall_checks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/postinstall_checks":
              component: "splunk/splunk_enterprise_install/postinstall_checks"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_postinstall_checks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_postinstall_checks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_postinstall_checks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_postinstall_checks_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/postinstall_checks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/postinstall_checks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postinstall_checks_stats_published: true
      tags:
        - always
