---
# File permissions hardening tasks
# STIG V-258050 - Secure File Permissions

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/file_permissions']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_file_permissions_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/file_permissions | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_file_permissions_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_file_permissions_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_file_permissions_status: "running"
    fe_splunk_splunk_enterprise_install_file_permissions_preflight_passed: false
    fe_splunk_splunk_enterprise_install_file_permissions_postflight_passed: false
    fe_splunk_splunk_enterprise_install_file_permissions_failed_task: ""
    fe_splunk_splunk_enterprise_install_file_permissions_error: ""
    fe_splunk_splunk_enterprise_install_file_permissions_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/file_permissions | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/file_permissions | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/file_permissions: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/file_permissions: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/file_permissions | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/file_permissions: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/file_permissions: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_file_permissions_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/file_permissions | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_file_permissions_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set strict permissions on Splunk home directory
      ansible.builtin.file:
        path: "{{ splunk_home }}"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0755'
      tags:
        - permissions
        - security

    - name: Set strict permissions on configuration files (STIG V-258052)
      ansible.builtin.file:
        path: "{{ splunk_home }}/etc"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0700'
        recurse: true
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - config

    - name: Set permissions on sensitive credential files (STIG V-258054)
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      loop:
        - "{{ splunk_home }}/etc/system/local/user-seed.conf"
        - "{{ splunk_home }}/etc/auth/passwd"
        - "{{ splunk_home }}/etc/auth/splunk.secret"
      when: splunk_enforce_strict_permissions | bool
      failed_when: false
      tags:
        - permissions
        - security
        - credentials

    - name: Set permissions on TLS certificates and keys (STIG V-258056)
      ansible.builtin.file:
        path: "{{ splunk_home }}/etc/auth/mycerts"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0700'
        recurse: true
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - certificates

    - name: Set permissions on private keys to 0600 (STIG V-258058)
      ansible.builtin.shell: |
        find {{ splunk_home }}/etc/auth/mycerts -name "*key*" -type f -exec chmod 0600 {} \;
        find {{ splunk_home }}/etc/auth/mycerts -name "*key*" -type f -exec chown {{ splunk_user }}:{{ splunk_group }} {} \;
      changed_when: false
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - keys

    - name: Remove world-readable permissions on log files (STIG V-258060)
      ansible.builtin.file:
        path: "{{ splunk_home }}/var/log/splunk"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0750'
        recurse: true
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - logs

    - name: Set permissions on audit logs (NIST 800-53 AU-9, STIG V-258062)
      ansible.builtin.file:
        path: "{{ splunk_audit_log_path }}"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      when:
        - splunk_enforce_strict_permissions | bool
        - splunk_audit_log_path is defined
      failed_when: false
      tags:
        - permissions
        - security
        - audit

    - name: Remove SUID/SGID bits from binaries (STIG V-258064)
      ansible.builtin.shell: |
        find {{ splunk_home }}/bin -type f \( -perm -4000 -o -perm -2000 \) -exec chmod ug-s {} \;
      changed_when: false
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - suid

    - name: Verify no world-writable files exist (STIG V-258066)
      ansible.builtin.shell: |
        find {{ splunk_home }} -type f -perm -0002 -ls
      register: world_writable_files
      changed_when: false
      failed_when: world_writable_files.stdout != ""
      when: splunk_enforce_strict_permissions | bool
      tags:
        - permissions
        - security
        - validation

    - name: Set immutable flag on critical configuration files (STIG V-258068)
      ansible.builtin.file:
        path: "{{ item }}"
        attributes: +i
      loop:
        - "{{ splunk_home }}/etc/splunk-launch.conf"
        - "{{ splunk_home }}/etc/system/local/server.conf"
      when:
        - splunk_enforce_strict_permissions | bool
        - ansible_os_family == "RedHat"
      failed_when: false
      tags:
        - permissions
        - security
        - immutable

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/file_permissions | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_file_permissions_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_file_permissions_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/file_permissions: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_file_permissions_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_file_permissions_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/file_permissions: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/file_permissions | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_file_permissions_postflight_passed: true
        fe_splunk_splunk_enterprise_install_file_permissions_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/file_permissions | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_file_permissions_status: "failed"
        fe_splunk_splunk_enterprise_install_file_permissions_postflight_passed: false
        fe_splunk_splunk_enterprise_install_file_permissions_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_file_permissions_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/file_permissions | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/file_permissions: FAILED at '{{ fe_splunk_splunk_enterprise_install_file_permissions_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_file_permissions_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/file_permissions | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/file_permissions failed at '{{ fe_splunk_splunk_enterprise_install_file_permissions_failed_task }}': {{ fe_splunk_splunk_enterprise_install_file_permissions_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/file_permissions | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_file_permissions_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_file_permissions_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_file_permissions_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/file_permissions | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/file_permissions":
              component: "splunk/splunk_enterprise_install/file_permissions"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_file_permissions_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_file_permissions_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_file_permissions_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_file_permissions_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_file_permissions_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_file_permissions_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_file_permissions_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_file_permissions_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_file_permissions_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_file_permissions_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_file_permissions_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_file_permissions_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/file_permissions'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/file_permissions | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_file_permissions_stats_published: true
      tags:
        - always
