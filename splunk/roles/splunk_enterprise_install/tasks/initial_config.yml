---
# Initial Splunk configuration tasks
# STIG V-258018 - Base Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/initial_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_initial_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/initial_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_initial_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_initial_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_initial_config_status: "running"
    fe_splunk_splunk_enterprise_install_initial_config_preflight_passed: false
    fe_splunk_splunk_enterprise_install_initial_config_postflight_passed: false
    fe_splunk_splunk_enterprise_install_initial_config_failed_task: ""
    fe_splunk_splunk_enterprise_install_initial_config_error: ""
    fe_splunk_splunk_enterprise_install_initial_config_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/initial_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/initial_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/initial_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/initial_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/initial_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/initial_config: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/initial_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_initial_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/initial_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_initial_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create Splunk server.conf configuration
      ansible.builtin.template:
        src: server.conf.j2
        dest: "{{ splunk_home }}/etc/system/local/server.conf"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - server

    - name: Create Splunk web.conf configuration (STIG V-258020)
      ansible.builtin.template:
        src: web.conf.j2
        dest: "{{ splunk_home }}/etc/system/local/web.conf"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - web
        - ssl

    - name: Create Splunk inputs.conf configuration
      ansible.builtin.template:
        src: inputs.conf.j2
        dest: "{{ splunk_home }}/etc/system/local/inputs.conf"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - inputs

    - name: Create Splunk outputs.conf configuration
      ansible.builtin.template:
        src: outputs.conf.j2
        dest: "{{ splunk_home }}/etc/system/local/outputs.conf"
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - outputs

    - name: Configure password policy (NIST 800-63B, STIG V-258022)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/authentication.conf"
        content: |
          [authentication]
          minPasswordLength = {{ splunk_admin_password_min_length }}
          minPasswordDigit = 1
          minPasswordLowercase = 1
          minPasswordUppercase = 1
          minPasswordSpecial = 1
          passwordHistoryCount = 24
          enablePasswordHistory = true
          constantLoginTime = 3s
          lockoutAttempts = 3
          lockoutThresholdMins = 15
          lockoutMins = 15
          enableWebLoginTimeout = true
          webLoginTimeout = {{ splunk_ui_session_timeout }}
          webLoginIdleTimeout = {{ splunk_ui_idle_timeout }}
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - authentication
        - password
        - security

    - name: Configure audit logging (NIST 800-53 AU family, STIG V-258024)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/audit.conf"
        content: |
          [auditTrail]
          enableAuditTrail = {{ splunk_enable_audit_trail | lower }}
          filepath = {{ splunk_audit_log_path }}

          [searchActivity]
          enableSearchActivity = {{ splunk_audit_all_searches | lower }}

          [adminActivity]
          enableAdminActivity = {{ splunk_audit_admin_actions | lower }}
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - audit
        - logging
        - security

    - name: Configure login banner (STIG V-258026)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/alert_actions.conf"
        content: |
          [default]
          # DoD Standard Mandatory Notice and Consent Banner
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      when: splunk_login_banner_enabled | bool
      tags:
        - config
        - banner
        - compliance

    - name: Create login banner file
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/apps/search/default/data/ui/views/login.xml"
        content: |
          <view template="login.html">
            <module name="Message" layoutPanel="messaging">
              <param name="filter">*</param>
              <param name="clearOnJobDispatch">False</param>
              <param name="maxSize">1</param>
            </module>
            <module name="Message" layoutPanel="messaging">
              <param name="message">{{ splunk_login_banner_text | replace('\n', '<br/>') }}</param>
              <param name="severity">info</param>
            </module>
          </view>
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0644'
      when: splunk_login_banner_enabled | bool
      tags:
        - config
        - banner
        - ui

    - name: Configure resource limits (STIG V-258028)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/limits.conf"
        content: |
          [search]
          max_concurrent_searches = {{ splunk_max_concurrent_searches }}
          max_searches_per_cpu = {{ splunk_max_searches_per_cpu }}
          max_mem_usage_mb = {{ splunk_search_process_memory_limit }}

          [thruput]
          maxKBps = 0

          [scheduler]
          max_searches_perc = 50
          auto_summary_perc = 50
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - limits
        - performance

    - name: Configure index settings (NIST 800-53 AU-11)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/indexes.conf"
        content: |
          [default]
          maxDataSize = {{ splunk_max_data_size }}
          maxHotBuckets = {{ splunk_max_hot_buckets }}
          maxWarmDBCount = {{ splunk_max_warm_db_count }}
          frozenTimePeriodInSecs = {{ splunk_frozen_time_period_in_secs }}
          repFactor = {{ splunk_index_replication_factor }}

          [_internal]
          maxDataSize = auto_high_volume
          frozenTimePeriodInSecs = {{ splunk_log_retention_days * 86400 }}

          [_audit]
          maxDataSize = auto
          frozenTimePeriodInSecs = {{ splunk_log_retention_days * 86400 }}
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - config
        - indexes
        - storage

    - name: Disable sending usage data (STIG V-258030)
      ansible.builtin.lineinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        line: |
          [telemetry]
          sendAnonymizedUsage = false
          sendAnonymizedWebAnalytics = false

          [phonehome]
          sendLicenseUsage = false
        create: yes
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      when: not splunk_send_usage_data | bool
      notify: restart splunk
      tags:
        - config
        - privacy
        - telemetry

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/initial_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_initial_config_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_initial_config_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/initial_config: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_initial_config_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_initial_config_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/initial_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/initial_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_initial_config_postflight_passed: true
        fe_splunk_splunk_enterprise_install_initial_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/initial_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_initial_config_status: "failed"
        fe_splunk_splunk_enterprise_install_initial_config_postflight_passed: false
        fe_splunk_splunk_enterprise_install_initial_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_initial_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/initial_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/initial_config: FAILED at '{{ fe_splunk_splunk_enterprise_install_initial_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_initial_config_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/initial_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/initial_config failed at '{{ fe_splunk_splunk_enterprise_install_initial_config_failed_task }}': {{ fe_splunk_splunk_enterprise_install_initial_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/initial_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_initial_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_initial_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_initial_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/initial_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/initial_config":
              component: "splunk/splunk_enterprise_install/initial_config"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_initial_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_initial_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_initial_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_initial_config_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_initial_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_initial_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_initial_config_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_initial_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_initial_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_initial_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_initial_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_initial_config_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/initial_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/initial_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_initial_config_stats_published: true
      tags:
        - always
