---
# Pre-installation validation tasks
# STIG V-258000 - System Requirements Validation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/preinstall_checks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_preinstall_checks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/preinstall_checks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_preinstall_checks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_preinstall_checks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_preinstall_checks_status: "running"
    fe_splunk_splunk_enterprise_install_preinstall_checks_preflight_passed: false
    fe_splunk_splunk_enterprise_install_preinstall_checks_postflight_passed: false
    fe_splunk_splunk_enterprise_install_preinstall_checks_failed_task: ""
    fe_splunk_splunk_enterprise_install_preinstall_checks_error: ""
    fe_splunk_splunk_enterprise_install_preinstall_checks_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/preinstall_checks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/preinstall_checks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/preinstall_checks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/preinstall_checks: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/preinstall_checks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preinstall_checks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Verify license acceptance
      ansible.builtin.assert:
        that:
          - splunk_accept_license | bool
        fail_msg: "Splunk license must be accepted. Set splunk_accept_license: true"
        success_msg: "Splunk license acceptance confirmed"
      tags:
        - validation
        - license

    - name: Verify admin password is set
      ansible.builtin.assert:
        that:
          - splunk_admin_password is defined
          - splunk_admin_password | length >= splunk_admin_password_min_length
        fail_msg: "Admin password must be set and meet minimum length of {{ splunk_admin_password_min_length }} characters"
        success_msg: "Admin password meets requirements"
      tags:
        - validation
        - security

    - name: Check operating system compatibility
      ansible.builtin.assert:
        that:
          - ansible_os_family in splunk_supported_os_families
        fail_msg: "Operating system {{ ansible_os_family }} is not supported"
        success_msg: "Operating system {{ ansible_os_family }} is supported"
      when: splunk_check_os_compatibility | bool
      tags:
        - validation
        - os

    - name: Gather system memory facts
      ansible.builtin.setup:
        filter: ansible_memory_mb
      tags:
        - validation
        - memory

    - name: Validate minimum memory requirements
      ansible.builtin.assert:
        that:
          - ansible_memory_mb.real.total >= (splunk_min_memory_gb * 1024)
        fail_msg: "System has {{ ansible_memory_mb.real.total }} MB, requires {{ splunk_min_memory_gb * 1024 }} MB"
        success_msg: "Memory requirements met: {{ ansible_memory_mb.real.total }} MB available"
      when: splunk_check_memory | bool
      tags:
        - validation
        - memory

    - name: Check available disk space
      ansible.builtin.shell: df -BG {{ splunk_home | dirname }} | tail -1 | awk '{print $4}' | sed 's/G//'
      register: available_disk_space
      changed_when: false
      when: splunk_check_disk_space | bool
      tags:
        - validation
        - disk

    - name: Validate minimum disk space requirements
      ansible.builtin.assert:
        that:
          - available_disk_space.stdout | int >= splunk_min_disk_gb
        fail_msg: "Insufficient disk space: {{ available_disk_space.stdout }}GB available, {{ splunk_min_disk_gb }}GB required"
        success_msg: "Disk space requirements met: {{ available_disk_space.stdout }}GB available"
      when: splunk_check_disk_space | bool
      tags:
        - validation
        - disk

    - name: Check if required ports are available
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 5
      loop:
        - "{{ splunk_web_port }}"
        - "{{ splunk_mgmt_port }}"
        - "{{ splunk_splunktcp_port }}"
        - "{{ splunk_kvstore_port }}"
      when: splunk_check_network_ports | bool
      ignore_errors: true
      register: port_check
      tags:
        - validation
        - network

    - name: Warn about ports already in use
      ansible.builtin.debug:
        msg: "Warning: Port {{ item.item }} may already be in use"
      loop: "{{ port_check.results }}"
      when:
        - splunk_check_network_ports | bool
        - item.failed is defined
        - item.failed
      tags:
        - validation
        - network

    - name: Check if Splunk is already installed
      ansible.builtin.stat:
        path: "{{ splunk_home }}/bin/splunk"
      register: splunk_binary
      tags:
        - validation
        - install

    - name: Get existing Splunk version if installed
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk version --accept-license --answer-yes --no-prompt"
      register: existing_splunk_version
      when: splunk_binary.stat.exists
      changed_when: false
      failed_when: false
      tags:
        - validation
        - install

    - name: Display existing Splunk installation
      ansible.builtin.debug:
        msg: "Splunk is already installed: {{ existing_splunk_version.stdout_lines | default('Unknown version') }}"
      when:
        - splunk_binary.stat.exists
        - existing_splunk_version is defined
      tags:
        - validation
        - install

    - name: Verify TLS certificates exist (if custom certs are configured)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ splunk_server_cert }}"
        - "{{ splunk_server_key }}"
        - "{{ splunk_ca_cert }}"
      register: cert_files
      when:
        - not splunk_use_default_tls_certs
        - item != ''
      failed_when:
        - not cert_files.results[0].stat.exists
      tags:
        - validation
        - tls
        - certificates

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_preinstall_checks_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_preinstall_checks_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/preinstall_checks: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_preinstall_checks_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_preinstall_checks_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/preinstall_checks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preinstall_checks_postflight_passed: true
        fe_splunk_splunk_enterprise_install_preinstall_checks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preinstall_checks_status: "failed"
        fe_splunk_splunk_enterprise_install_preinstall_checks_postflight_passed: false
        fe_splunk_splunk_enterprise_install_preinstall_checks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_preinstall_checks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/preinstall_checks: FAILED at '{{ fe_splunk_splunk_enterprise_install_preinstall_checks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_preinstall_checks_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/preinstall_checks failed at '{{ fe_splunk_splunk_enterprise_install_preinstall_checks_failed_task }}': {{ fe_splunk_splunk_enterprise_install_preinstall_checks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preinstall_checks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_preinstall_checks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_preinstall_checks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/preinstall_checks":
              component: "splunk/splunk_enterprise_install/preinstall_checks"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_preinstall_checks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_preinstall_checks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_preinstall_checks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_preinstall_checks_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/preinstall_checks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/preinstall_checks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preinstall_checks_stats_published: true
      tags:
        - always
