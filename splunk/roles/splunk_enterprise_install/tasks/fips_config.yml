---
# FIPS 140-2 configuration tasks
# NIST 800-53 SC-13, STIG V-258032

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/fips_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_fips_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/fips_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_fips_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_fips_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_fips_config_status: "running"
    fe_splunk_splunk_enterprise_install_fips_config_preflight_passed: false
    fe_splunk_splunk_enterprise_install_fips_config_postflight_passed: false
    fe_splunk_splunk_enterprise_install_fips_config_failed_task: ""
    fe_splunk_splunk_enterprise_install_fips_config_error: ""
    fe_splunk_splunk_enterprise_install_fips_config_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/fips_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/fips_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/fips_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/fips_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/fips_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/fips_config: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/fips_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_fips_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/fips_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_fips_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if OpenSSL FIPS module is available
      ansible.builtin.command: openssl version
      register: openssl_version
      changed_when: false
      tags:
        - fips
        - validation

    - name: Enable FIPS mode in Splunk
      ansible.builtin.blockinfile:
        path: "{{ splunk_home }}/etc/system/local/server.conf"
        marker: "# {mark} ANSIBLE MANAGED FIPS/SSL BLOCK"
        block: |
          [general]
          allowSslRenegotiation = false
          trustedIP = {{ splunk_allowed_management_networks | join(', ') }}

          [sslConfig]
          enableSplunkdSSL = true
          useClientSSLCompression = false
          useSplunkdClientSSLCompression = false
          sslVersions = {{ splunk_ssl_versions }}
          ecdhCurves = {{ splunk_ecdh_curves }}
          cipherSuite = {{ splunk_cipher_suite }}
          requireClientCert = false
          sslVerifyServerCert = {{ splunk_cert_validation_strict | lower }}

          [fips]
          fipsMode = {{ splunk_fips_mode }}
          sslCommonNameToCheck =
          sslAltNameToCheck =
        create: true
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      notify: restart splunk
      tags:
        - fips
        - config
        - ssl

    - name: Verify FIPS module installation (RedHat/CentOS)
      ansible.builtin.yum:
        name:
          - dracut-fips
          - dracut-fips-aesni
        state: present
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int >= 8
      tags:
        - fips
        - packages

    - name: Check FIPS mode status
      ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
      register: fips_status
      changed_when: false
      failed_when: false
      tags:
        - fips
        - validation

    - name: Display FIPS mode status
      ansible.builtin.debug:
        msg: "System FIPS mode: {{ 'Enabled' if fips_status.stdout == '1' else 'Disabled' }}"
      tags:
        - fips
        - validation

    - name: Warn if FIPS is not enabled at OS level
      ansible.builtin.debug:
        msg: "WARNING: FIPS mode is not enabled at the OS level. For full FIPS compliance, enable FIPS at the system level."
      when: fips_status.stdout != '1'
      tags:
        - fips
        - validation

    - name: Create FIPS verification script
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/bin/verify_fips.sh"
        content: |
          #!/bin/bash
          # FIPS Mode Verification Script
          # Verifies FIPS compliance for Splunk Enterprise

          echo "=== FIPS Compliance Verification ==="
          echo

          # Check OS FIPS mode
          echo "1. Checking OS FIPS mode..."
          if [ -f /proc/sys/crypto/fips_enabled ]; then
            FIPS_OS=$(cat /proc/sys/crypto/fips_enabled)
            if [ "$FIPS_OS" = "1" ]; then
              echo "   [PASS] OS FIPS mode is ENABLED"
            else
              echo "   [WARN] OS FIPS mode is DISABLED"
            fi
          else
            echo "   [WARN] Cannot determine OS FIPS status"
          fi
          echo

          # Check Splunk FIPS configuration
          echo "2. Checking Splunk FIPS configuration..."
          {{ splunk_home }}/bin/splunk btool server list fips --debug
          echo

          # Check OpenSSL version
          echo "3. Checking OpenSSL version..."
          openssl version
          echo

          # Verify TLS settings
          echo "4. Checking TLS configuration..."
          {{ splunk_home }}/bin/splunk btool server list sslConfig --debug
          echo

          echo "=== Verification Complete ==="
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0750'
      tags:
        - fips
        - validation
        - scripts

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/fips_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_fips_config_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_fips_config_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/fips_config: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_fips_config_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_fips_config_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/fips_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/fips_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_fips_config_postflight_passed: true
        fe_splunk_splunk_enterprise_install_fips_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/fips_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_fips_config_status: "failed"
        fe_splunk_splunk_enterprise_install_fips_config_postflight_passed: false
        fe_splunk_splunk_enterprise_install_fips_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_fips_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/fips_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/fips_config: FAILED at '{{ fe_splunk_splunk_enterprise_install_fips_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_fips_config_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/fips_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/fips_config failed at '{{ fe_splunk_splunk_enterprise_install_fips_config_failed_task }}': {{ fe_splunk_splunk_enterprise_install_fips_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/fips_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_fips_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_fips_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_fips_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/fips_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/fips_config":
              component: "splunk/splunk_enterprise_install/fips_config"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_fips_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_fips_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_fips_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_fips_config_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_fips_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_fips_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_fips_config_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_fips_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_fips_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_fips_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_fips_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_fips_config_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/fips_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/fips_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_fips_config_stats_published: true
      tags:
        - always
