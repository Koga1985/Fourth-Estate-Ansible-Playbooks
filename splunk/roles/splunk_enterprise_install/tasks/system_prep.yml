---
# System preparation tasks
# STIG V-258002 - System Hardening for Splunk

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/system_prep']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_system_prep_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/system_prep | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_system_prep_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_system_prep_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_system_prep_status: "running"
    fe_splunk_splunk_enterprise_install_system_prep_preflight_passed: false
    fe_splunk_splunk_enterprise_install_system_prep_postflight_passed: false
    fe_splunk_splunk_enterprise_install_system_prep_failed_task: ""
    fe_splunk_splunk_enterprise_install_system_prep_error: ""
    fe_splunk_splunk_enterprise_install_system_prep_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/system_prep | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/system_prep | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/system_prep: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/system_prep: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/system_prep | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/system_prep: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/system_prep: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_system_prep_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/system_prep | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_system_prep_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install required system packages (RedHat/CentOS)
      ansible.builtin.yum:
        name:
          - wget
          - tar
          - gzip
          - openssl
          - python3
          - python3-pip
          - libselinux-python3
          - policycoreutils-python-utils
        state: present
      when: ansible_os_family == "RedHat"
      tags:
        - packages
        - system

    - name: Install required system packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - wget
          - tar
          - gzip
          - openssl
          - python3
          - python3-pip
          - python3-selinux
          - policycoreutils
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      tags:
        - packages
        - system

    - name: Create Splunk group
      ansible.builtin.group:
        name: "{{ splunk_group }}"
        gid: "{{ splunk_group_gid }}"
        state: present
      tags:
        - user
        - group

    - name: Create Splunk user
      ansible.builtin.user:
        name: "{{ splunk_user }}"
        uid: "{{ splunk_user_uid }}"
        group: "{{ splunk_group }}"
        shell: "{{ splunk_user_shell }}"
        home: "{{ splunk_home }}"
        comment: "Splunk Service Account"
        system: yes
        create_home: no
      tags:
        - user
        - account

    - name: Set secure password aging for Splunk user (STIG V-258004)
      ansible.builtin.command: chage -M 60 -m 1 -W 7 {{ splunk_user }}
      changed_when: false
      tags:
        - user
        - security
        - stig

    - name: Create Splunk installation directory
      ansible.builtin.file:
        path: "{{ splunk_home }}"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: "0755"
      tags:
        - directories
        - permissions

    - name: Create Splunk data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: "0700"
      loop:
        - "{{ splunk_db }}"
        - "{{ splunk_home }}/var/log/splunk"
        - "{{ splunk_home }}/var/run/splunk"
        - "{{ splunk_home }}/etc/auth"
        - "{{ splunk_home }}/etc/apps"
      tags:
        - directories
        - permissions

    - name: Create backup directory if enabled
      ansible.builtin.file:
        path: "{{ splunk_backup_path }}"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: "0700"
      when: splunk_enable_backup | bool
      tags:
        - directories
        - backup

    - name: Set system ulimits for Splunk user (STIG V-258006)
      ansible.builtin.pam_limits:
        domain: "{{ splunk_user }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { type: 'soft', item: 'nofile', value: '65536' }
        - { type: 'hard', item: 'nofile', value: '65536' }
        - { type: 'soft', item: 'nproc', value: '20480' }
        - { type: 'hard', item: 'nproc', value: '20480' }
        - { type: 'soft', item: 'fsize', value: 'unlimited' }
        - { type: 'hard', item: 'fsize', value: 'unlimited' }
      tags:
        - ulimits
        - performance

    - name: Configure kernel parameters for Splunk (STIG V-258008)
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_set: yes
      loop:
        - { name: 'vm.swappiness', value: '10' }
        - { name: 'net.core.rmem_max', value: '26214400' }
        - { name: 'net.core.wmem_max', value: '26214400' }
        - { name: 'net.ipv4.tcp_rmem', value: '4096 87380 26214400' }
        - { name: 'net.ipv4.tcp_wmem', value: '4096 65536 26214400' }
        - { name: 'net.core.netdev_max_backlog', value: '5000' }
      tags:
        - kernel
        - performance

    - name: Disable Transparent Huge Pages (THP) for better performance
      ansible.builtin.lineinfile:
        path: /etc/rc.local
        line: "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
        create: yes
        mode: '0755'
      tags:
        - performance
        - thp

    - name: Disable THP immediately
      ansible.builtin.shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: false
      failed_when: false
      tags:
        - performance
        - thp

    - name: Configure system timezone to UTC (STIG V-258010)
      community.general.timezone:
        name: UTC
      tags:
        - system
        - timezone

    - name: Ensure NTP/Chrony is configured (STIG V-258012)
      ansible.builtin.service:
        name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'ntp' }}"
        state: started
        enabled: yes
      tags:
        - ntp
        - time
        - security

    - name: Create systemd directory for Splunk
      ansible.builtin.file:
        path: /etc/systemd/system
        state: directory
        mode: '0755'
      tags:
        - systemd
        - service

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/system_prep | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_system_prep_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_system_prep_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/system_prep: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_system_prep_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_system_prep_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/system_prep: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/system_prep | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_system_prep_postflight_passed: true
        fe_splunk_splunk_enterprise_install_system_prep_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/system_prep | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_system_prep_status: "failed"
        fe_splunk_splunk_enterprise_install_system_prep_postflight_passed: false
        fe_splunk_splunk_enterprise_install_system_prep_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_system_prep_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/system_prep | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/system_prep: FAILED at '{{ fe_splunk_splunk_enterprise_install_system_prep_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_system_prep_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/system_prep | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/system_prep failed at '{{ fe_splunk_splunk_enterprise_install_system_prep_failed_task }}': {{ fe_splunk_splunk_enterprise_install_system_prep_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/system_prep | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_system_prep_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_system_prep_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_system_prep_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/system_prep | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/system_prep":
              component: "splunk/splunk_enterprise_install/system_prep"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_system_prep_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_system_prep_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_system_prep_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_system_prep_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_system_prep_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_system_prep_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_system_prep_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_system_prep_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_system_prep_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_system_prep_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_system_prep_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_system_prep_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/system_prep'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/system_prep | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_system_prep_stats_published: true
      tags:
        - always
