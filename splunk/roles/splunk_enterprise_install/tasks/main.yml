---
# tasks file for splunk_enterprise_install
# DoD STIG and NIST 800-53 Compliant Splunk Installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_status: "running"
    fe_splunk_splunk_enterprise_install_preflight_passed: false
    fe_splunk_splunk_enterprise_install_postflight_passed: false
    fe_splunk_splunk_enterprise_install_failed_task: ""
    fe_splunk_splunk_enterprise_install_error: ""
    fe_splunk_splunk_enterprise_install_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include pre-installation validation tasks
      ansible.builtin.include_tasks: preinstall_checks.yml
      tags:
        - splunk
        - preinstall
        - validation

    - name: Include system preparation tasks
      ansible.builtin.include_tasks: system_prep.yml
      tags:
        - splunk
        - system
        - preparation

    - name: Include Splunk package installation tasks
      ansible.builtin.include_tasks: install_package.yml
      tags:
        - splunk
        - install
        - package

    - name: Include initial configuration tasks
      ansible.builtin.include_tasks: initial_config.yml
      tags:
        - splunk
        - config
        - initial

    - name: Include FIPS configuration tasks
      ansible.builtin.include_tasks: fips_config.yml
      when: splunk_enable_fips | bool
      tags:
        - splunk
        - fips
        - security

    - name: Include TLS/SSL configuration tasks
      ansible.builtin.include_tasks: tls_config.yml
      tags:
        - splunk
        - tls
        - ssl
        - security

    - name: Include authentication configuration tasks
      ansible.builtin.include_tasks: authentication_config.yml
      tags:
        - splunk
        - authentication
        - ldap
        - saml

    - name: Include clustering configuration tasks
      ansible.builtin.include_tasks: clustering_config.yml
      when: splunk_cluster_mode != 'none'
      tags:
        - splunk
        - clustering
        - ha

    - name: Include indexer configuration tasks
      ansible.builtin.include_tasks: indexer_config.yml
      when: splunk_cluster_mode in ['master', 'peer'] or splunk_cluster_mode == 'none'
      tags:
        - splunk
        - indexer
        - storage

    - name: Include search head configuration tasks
      ansible.builtin.include_tasks: search_head_config.yml
      when: splunk_shc_mode | bool or splunk_cluster_mode == 'searchhead'
      tags:
        - splunk
        - search_head
        - shc

    - name: Include deployment client configuration tasks
      ansible.builtin.include_tasks: deployment_client.yml
      when: splunk_deployment_server != ''
      tags:
        - splunk
        - deployment
        - client

    - name: Include license configuration tasks
      ansible.builtin.include_tasks: license_config.yml
      when: splunk_license_file != '' or splunk_license_master != ''
      tags:
        - splunk
        - license

    - name: Include file permissions hardening tasks
      ansible.builtin.include_tasks: file_permissions.yml
      tags:
        - splunk
        - permissions
        - security
        - stig

    - name: Include SELinux configuration tasks
      ansible.builtin.include_tasks: selinux_config.yml
      when:
        - splunk_selinux_enabled | bool
        - ansible_selinux.status is defined
        - ansible_selinux.status == 'enabled'
      tags:
        - splunk
        - selinux
        - security

    - name: Include firewall configuration tasks
      ansible.builtin.include_tasks: firewall_config.yml
      when: splunk_configure_firewall | bool
      tags:
        - splunk
        - firewall
        - network
        - security

    - name: Include service configuration tasks
      ansible.builtin.include_tasks: service_config.yml
      tags:
        - splunk
        - service
        - systemd

    - name: Include post-installation validation tasks
      ansible.builtin.include_tasks: postinstall_checks.yml
      tags:
        - splunk
        - postinstall
        - validation

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_postflight_passed: true
        fe_splunk_splunk_enterprise_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_status: "failed"
        fe_splunk_splunk_enterprise_install_postflight_passed: false
        fe_splunk_splunk_enterprise_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install: FAILED at '{{ fe_splunk_splunk_enterprise_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install failed at '{{ fe_splunk_splunk_enterprise_install_failed_task }}': {{ fe_splunk_splunk_enterprise_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install":
              component: "splunk/splunk_enterprise_install"
              type: "role"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_stats_published: true
      tags:
        - always
