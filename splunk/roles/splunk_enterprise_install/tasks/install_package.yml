---
# Splunk package installation tasks
# STIG V-258014 - Secure Software Installation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_enterprise_install/install_package']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_enterprise_install_install_package_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_enterprise_install/install_package | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_enterprise_install_install_package_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_enterprise_install_install_package_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_enterprise_install_install_package_status: "running"
    fe_splunk_splunk_enterprise_install_install_package_preflight_passed: false
    fe_splunk_splunk_enterprise_install_install_package_postflight_passed: false
    fe_splunk_splunk_enterprise_install_install_package_failed_task: ""
    fe_splunk_splunk_enterprise_install_install_package_error: ""
    fe_splunk_splunk_enterprise_install_install_package_stats_published: false
  tags:
    - always

- name: "splunk/splunk_enterprise_install/install_package | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_enterprise_install/install_package | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_enterprise_install/install_package: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_enterprise_install/install_package: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/install_package | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_enterprise_install/install_package: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_enterprise_install/install_package: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_enterprise_install_install_package_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_enterprise_install/install_package | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_install_package_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set Splunk package filename
      ansible.builtin.set_fact:
        splunk_package_name: "{{ splunk_product }}-{{ splunk_version }}-{{ splunk_build }}-linux-{{ splunk_architecture | replace('_', '-') }}.tgz"
      tags:
        - package
        - download

    - name: Download Splunk package
      ansible.builtin.get_url:
        url: "{{ splunk_package_url }}/{{ splunk_version }}/linux/{{ splunk_package_name }}"
        dest: "/tmp/{{ splunk_package_name }}"
        mode: '0600'
        timeout: 300
        validate_certs: yes
      register: splunk_download
      tags:
        - package
        - download

    - name: Verify package checksum (if verification enabled)
      ansible.builtin.stat:
        path: "/tmp/{{ splunk_package_name }}"
        checksum_algorithm: sha256
      register: package_stat
      when: splunk_verify_checksum | bool
      tags:
        - package
        - verification
        - security

    - name: Extract Splunk package
      ansible.builtin.unarchive:
        src: "/tmp/{{ splunk_package_name }}"
        dest: "{{ splunk_home | dirname }}"
        remote_src: yes
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        creates: "{{ splunk_home }}/bin/splunk"
      tags:
        - package
        - install

    - name: Set ownership of Splunk installation
      ansible.builtin.file:
        path: "{{ splunk_home }}"
        state: directory
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        recurse: yes
      tags:
        - package
        - permissions

    - name: Remove installation package
      ansible.builtin.file:
        path: "/tmp/{{ splunk_package_name }}"
        state: absent
      when: splunk_cleanup_installer | bool
      tags:
        - package
        - cleanup

    - name: Create Splunk service user seed file (STIG V-258016)
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/etc/system/local/user-seed.conf"
        content: |
          [user_info]
          USERNAME = admin
          PASSWORD = {{ splunk_admin_password }}
        owner: "{{ splunk_user }}"
        group: "{{ splunk_group }}"
        mode: '0600'
      no_log: true
      tags:
        - config
        - security
        - credentials

    - name: Accept Splunk license and start for first time
      ansible.builtin.command: >
        {{ splunk_home }}/bin/splunk start
        --accept-license
        --answer-yes
        --no-prompt
        --seed-passwd {{ splunk_admin_password }}
      become: yes
      become_user: "{{ splunk_user }}"
      environment:
        SPLUNK_HOME: "{{ splunk_home }}"
      register: splunk_first_start
      changed_when: "'Splunk has started' in splunk_first_start.stdout"
      failed_when: splunk_first_start.rc != 0
      no_log: true
      tags:
        - service
        - start
        - license

    - name: Wait for Splunk management port to be available
      ansible.builtin.wait_for:
        port: "{{ splunk_mgmt_port }}"
        host: "{{ splunk_bind_ip }}"
        delay: 5
        timeout: 300
        state: started
      tags:
        - service
        - validation

    - name: Stop Splunk for configuration
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk stop"
      become: yes
      become_user: "{{ splunk_user }}"
      environment:
        SPLUNK_HOME: "{{ splunk_home }}"
      changed_when: false
      tags:
        - service
        - stop

    - name: Configure Splunk to start at boot
      ansible.builtin.command: >
        {{ splunk_home }}/bin/splunk enable boot-start
        -user {{ splunk_user }}
        -systemd-managed 1
        --accept-license
        --answer-yes
        --no-prompt
      when: splunk_enable_boot_start | bool
      changed_when: true
      tags:
        - service
        - boot
        - systemd

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_enterprise_install/install_package | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_enterprise_install_install_package_preflight_passed | bool
          - fe_splunk_splunk_enterprise_install_install_package_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_enterprise_install/install_package: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_enterprise_install_install_package_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_enterprise_install_install_package_status | default('unknown') }}.
        success_msg: "splunk/splunk_enterprise_install/install_package: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_enterprise_install/install_package | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_install_package_postflight_passed: true
        fe_splunk_splunk_enterprise_install_install_package_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_enterprise_install/install_package | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_install_package_status: "failed"
        fe_splunk_splunk_enterprise_install_install_package_postflight_passed: false
        fe_splunk_splunk_enterprise_install_install_package_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_enterprise_install_install_package_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/install_package | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_enterprise_install/install_package: FAILED at '{{ fe_splunk_splunk_enterprise_install_install_package_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_enterprise_install_install_package_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_enterprise_install/install_package | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_enterprise_install/install_package failed at '{{ fe_splunk_splunk_enterprise_install_install_package_failed_task }}': {{ fe_splunk_splunk_enterprise_install_install_package_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_enterprise_install/install_package | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_install_package_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_enterprise_install_install_package_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_enterprise_install_install_package_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/install_package | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_enterprise_install/install_package":
              component: "splunk/splunk_enterprise_install/install_package"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_enterprise_install_install_package_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_enterprise_install_install_package_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_enterprise_install_install_package_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_enterprise_install_install_package_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_enterprise_install_install_package_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_enterprise_install_install_package_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_enterprise_install_install_package_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_enterprise_install_install_package_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_enterprise_install_install_package_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_enterprise_install_install_package_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_enterprise_install_install_package_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_enterprise_install_install_package_status | default('') == 'succeeded' else ['splunk/splunk_enterprise_install/install_package'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_enterprise_install/install_package | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_enterprise_install_install_package_stats_published: true
      tags:
        - always
