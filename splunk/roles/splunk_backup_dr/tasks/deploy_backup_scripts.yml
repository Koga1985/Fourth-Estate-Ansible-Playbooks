---
# Deploy backup scripts

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['splunk/splunk_backup_dr/deploy_backup_scripts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_splunk_splunk_backup_dr_deploy_backup_scripts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "splunk/splunk_backup_dr/deploy_backup_scripts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_status: "running"
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_preflight_passed: false
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_postflight_passed: false
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_failed_task: ""
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_error: ""
    fe_splunk_splunk_backup_dr_deploy_backup_scripts_stats_published: false
  tags:
    - always

- name: "splunk/splunk_backup_dr/deploy_backup_scripts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          splunk/splunk_backup_dr/deploy_backup_scripts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          splunk/splunk_backup_dr/deploy_backup_scripts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "splunk/splunk_backup_dr/deploy_backup_scripts: required variable '{{ item }}' is not defined."
        success_msg: "splunk/splunk_backup_dr/deploy_backup_scripts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Deploy Splunk backup script
      ansible.builtin.copy:
        dest: "{{ splunk_home }}/bin/backup_splunk.sh"
        content: |
          #!/bin/bash
          # Splunk Backup Script - DoD STIG Compliant
          SPLUNK_HOME={{ splunk_home }}
          BACKUP_PATH={{ backup_path }}
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="$BACKUP_PATH/splunk_backup_$TIMESTAMP.tar.gz"

          echo "Starting Splunk backup at $(date)"

          # Create backup
          tar czf "$BACKUP_FILE" \
            --exclude='$SPLUNK_HOME/var/lib/splunk/*' \
            $SPLUNK_HOME/etc \
            $SPLUNK_HOME/var/log

          # Encrypt backup if enabled
          {% if backup_encryption_enabled %}
          openssl enc -aes-256-cbc -salt -in "$BACKUP_FILE" -out "${BACKUP_FILE}.enc" -k "{{ backup_encryption_key }}"
          rm -f "$BACKUP_FILE"
          BACKUP_FILE="${BACKUP_FILE}.enc"
          {% endif %}

          # Verify backup
          if [ -f "$BACKUP_FILE" ]; then
            echo "Backup completed successfully: $BACKUP_FILE"
            ls -lh "$BACKUP_FILE"
          else
            echo "ERROR: Backup failed"
            exit 1
          fi

          # Remove old backups
          find $BACKUP_PATH -name "splunk_backup_*.tar.gz*" -mtime +{{ backup_retention_days }} -delete

          echo "Backup completed at $(date)"
        owner: "{{ splunk_user }}"
        mode: '0750'
      no_log: true

    - name: Schedule backup job
      ansible.builtin.cron:
        name: "Splunk backup"
        minute: "{{ backup_schedule.split()[0] }}"
        hour: "{{ backup_schedule.split()[1] }}"
        day: "{{ backup_schedule.split()[2] }}"
        month: "{{ backup_schedule.split()[3] }}"
        weekday: "{{ backup_schedule.split()[4] }}"
        job: "{{ splunk_home }}/bin/backup_splunk.sh >> {{ backup_path }}/logs/backup.log 2>&1"
        user: "{{ splunk_user }}"

    # ----------------------------- postflight -------------------

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_splunk_splunk_backup_dr_deploy_backup_scripts_preflight_passed | bool
          - fe_splunk_splunk_backup_dr_deploy_backup_scripts_status in ['running', 'succeeded']
        fail_msg: >-
          splunk/splunk_backup_dr/deploy_backup_scripts: postflight validation failed - preflight passed
          ={{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_preflight_passed | default(false) }},
          status={{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_status | default('unknown') }}.
        success_msg: "splunk/splunk_backup_dr/deploy_backup_scripts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_postflight_passed: true
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_status: "failed"
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_postflight_passed: false
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          splunk/splunk_backup_dr/deploy_backup_scripts: FAILED at '{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_error }}
      tags:
        - always
        - rescue

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          splunk/splunk_backup_dr/deploy_backup_scripts failed at '{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_failed_task }}': {{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_splunk_backup_dr_deploy_backup_scripts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "splunk/splunk_backup_dr/deploy_backup_scripts":
              component: "splunk/splunk_backup_dr/deploy_backup_scripts"
              type: "role-tasks"
              platform: "splunk"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_status | default('unknown') }}"
              preflight_passed: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_started_at | default('') }}"
              ended_at: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_ended_at | default('') }}"
              duration_seconds: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_failed_task | default('') }}"
              error: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_splunk_splunk_backup_dr_deploy_backup_scripts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_splunk_splunk_backup_dr_deploy_backup_scripts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_splunk_splunk_backup_dr_deploy_backup_scripts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_splunk_splunk_backup_dr_deploy_backup_scripts_status | default('') == 'succeeded' else ['splunk/splunk_backup_dr/deploy_backup_scripts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "splunk/splunk_backup_dr/deploy_backup_scripts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_splunk_splunk_backup_dr_deploy_backup_scripts_stats_published: true
      tags:
        - always
