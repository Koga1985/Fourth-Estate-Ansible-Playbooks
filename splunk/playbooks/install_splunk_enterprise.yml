---
# Main playbook for Splunk Enterprise installation
# DoD STIG and NIST 800-53 Compliant Installation
#
# Usage: ansible-playbook -i inventory splunk/playbooks/install_splunk_enterprise.yml
#
# Requirements:
#   - Ansible 2.12+
#   - Target hosts with RHEL 8/9 or Ubuntu 20.04/22.04
#   - Vault file with credentials configured

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Install and Configure Splunk Enterprise
  hosts: splunk_servers
  any_errors_fatal: true
  become: yes
  vars_files:
    - ../vars/vault.yml

  roles:
    - role: ../roles/splunk_enterprise_install
      tags: ['install', 'splunk']

    - role: ../roles/splunk_security_hardening
      tags: ['security', 'hardening', 'stig']

    - role: ../roles/splunk_monitoring
      tags: ['monitoring', 'health']

    - role: ../roles/splunk_backup_dr
      tags: ['backup', 'dr']

  post_tasks:
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "=== Splunk Enterprise Installation Complete ==="
          - "Host: {{ inventory_hostname }}"
          - "Splunk Home: {{ splunk_home }}"
          - "Web URL: https://{{ ansible_fqdn }}:{{ splunk_web_port }}"
          - "Management Port: {{ splunk_mgmt_port }}"
          - "FIPS Mode: {{ 'Enabled' if splunk_enable_fips else 'Disabled' }}"
          - "Compliance: DoD STIG, NIST 800-53, FISMA"
          - "=============================================="
    - name: "splunk/install_splunk_enterprise | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/install_splunk_enterprise | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_install_splunk_enterprise_preflight_passed | bool
              - fe_splunk_install_splunk_enterprise_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/install_splunk_enterprise: postflight validation failed - preflight passed
              ={{ fe_splunk_install_splunk_enterprise_preflight_passed | default(false) }},
              status={{ fe_splunk_install_splunk_enterprise_status | default('unknown') }}.
            success_msg: "splunk/install_splunk_enterprise: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/install_splunk_enterprise | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_postflight_passed: true
            fe_splunk_install_splunk_enterprise_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/install_splunk_enterprise | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_status: "failed"
            fe_splunk_install_splunk_enterprise_postflight_passed: false
            fe_splunk_install_splunk_enterprise_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_install_splunk_enterprise_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/install_splunk_enterprise: FAILED at '{{ fe_splunk_install_splunk_enterprise_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_install_splunk_enterprise_error }}
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/install_splunk_enterprise failed at '{{ fe_splunk_install_splunk_enterprise_failed_task }}': {{ fe_splunk_install_splunk_enterprise_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/install_splunk_enterprise | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_install_splunk_enterprise_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_install_splunk_enterprise_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/install_splunk_enterprise":
                  component: "splunk/install_splunk_enterprise"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_install_splunk_enterprise_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_install_splunk_enterprise_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_install_splunk_enterprise_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_install_splunk_enterprise_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_install_splunk_enterprise_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_install_splunk_enterprise_failed_task | default('') }}"
                  error: "{{ fe_splunk_install_splunk_enterprise_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else ['splunk/install_splunk_enterprise'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_install_splunk_enterprise_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_stats_published: true
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/install_splunk_enterprise: {{ fe_splunk_install_splunk_enterprise_status | default('unknown') }} in
              {{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  pre_tasks:
    - name: "splunk/install_splunk_enterprise | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/install_splunk_enterprise | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_install_splunk_enterprise_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_install_splunk_enterprise_status: "running"
            fe_splunk_install_splunk_enterprise_preflight_passed: false
            fe_splunk_install_splunk_enterprise_postflight_passed: false
            fe_splunk_install_splunk_enterprise_failed_task: ""
            fe_splunk_install_splunk_enterprise_error: ""
            fe_splunk_install_splunk_enterprise_stats_published: false
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/install_splunk_enterprise: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/install_splunk_enterprise: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/install_splunk_enterprise | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/install_splunk_enterprise: required variable '{{ item }}' is not defined."
            success_msg: "splunk/install_splunk_enterprise: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_install_splunk_enterprise_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/install_splunk_enterprise | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/install_splunk_enterprise | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_status: "preflight_failed"
            fe_splunk_install_splunk_enterprise_postflight_passed: false
            fe_splunk_install_splunk_enterprise_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_install_splunk_enterprise_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/install_splunk_enterprise: FAILED at '{{ fe_splunk_install_splunk_enterprise_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_install_splunk_enterprise_error }}
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/install_splunk_enterprise":
                  component: "splunk/install_splunk_enterprise"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_install_splunk_enterprise_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_install_splunk_enterprise_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_install_splunk_enterprise_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_install_splunk_enterprise_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_install_splunk_enterprise_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_install_splunk_enterprise_failed_task | default('') }}"
                  error: "{{ fe_splunk_install_splunk_enterprise_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else ['splunk/install_splunk_enterprise'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_stats_published: true
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/install_splunk_enterprise failed at '{{ fe_splunk_install_splunk_enterprise_failed_task }}': {{ fe_splunk_install_splunk_enterprise_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/install_splunk_enterprise | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/install_splunk_enterprise: preflight
              {{ 'passed' if fe_splunk_install_splunk_enterprise_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "splunk/install_splunk_enterprise | Guarded execution with rescue and always handling"
      block:

        - name: "splunk/install_splunk_enterprise | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "splunk/install_splunk_enterprise | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_status: "failed"
            fe_splunk_install_splunk_enterprise_postflight_passed: false
            fe_splunk_install_splunk_enterprise_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_install_splunk_enterprise_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/install_splunk_enterprise: FAILED at '{{ fe_splunk_install_splunk_enterprise_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_install_splunk_enterprise_error }}
          tags:
            - always
            - rescue

        - name: "splunk/install_splunk_enterprise | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/install_splunk_enterprise failed at '{{ fe_splunk_install_splunk_enterprise_failed_task }}': {{ fe_splunk_install_splunk_enterprise_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/install_splunk_enterprise | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_install_splunk_enterprise_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_install_splunk_enterprise_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/install_splunk_enterprise":
                  component: "splunk/install_splunk_enterprise"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_install_splunk_enterprise_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_install_splunk_enterprise_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_install_splunk_enterprise_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_install_splunk_enterprise_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_install_splunk_enterprise_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_install_splunk_enterprise_failed_task | default('') }}"
                  error: "{{ fe_splunk_install_splunk_enterprise_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_install_splunk_enterprise_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_install_splunk_enterprise_status | default('') == 'succeeded' else ['splunk/install_splunk_enterprise'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_install_splunk_enterprise_status | default('') == 'failed'
            - not (fe_splunk_install_splunk_enterprise_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/install_splunk_enterprise | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_install_splunk_enterprise_stats_published: true
          when:
            - fe_splunk_install_splunk_enterprise_status | default('') == 'failed'
          tags:
            - always
