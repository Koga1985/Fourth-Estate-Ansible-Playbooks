---
# Playbook for deploying Splunk Universal Forwarders
# Usage: ansible-playbook -i inventory splunk/playbooks/deploy_forwarders.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy Splunk Universal Forwarders
  hosts: forwarder_targets
  any_errors_fatal: true
  become: yes
  vars_files:
    - ../vars/vault.yml

  roles:
    - role: ../roles/splunk_forwarder
      tags: ['forwarder', 'install']

  post_tasks:
    - name: Verify forwarder is sending data
      ansible.builtin.wait_for:
        port: 9997
        host: "{{ splunk_indexers[0].split(':')[0] }}"
        timeout: 30
      delegate_to: localhost

    - name: Display forwarder summary
      ansible.builtin.debug:
        msg:
          - "=== Splunk Forwarder Deployment Complete ==="
          - "Host: {{ inventory_hostname }}"
          - "Forwarding to: {{ splunk_indexers | join(', ') }}"
          - "TLS Enabled: {{ splunk_forwarder_enable_ssl }}"
          - "FIPS Mode: {{ splunk_forwarder_fips_mode }}"
    - name: "splunk/deploy_forwarders | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/deploy_forwarders | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_deploy_forwarders_preflight_passed | bool
              - fe_splunk_deploy_forwarders_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/deploy_forwarders: postflight validation failed - preflight passed
              ={{ fe_splunk_deploy_forwarders_preflight_passed | default(false) }},
              status={{ fe_splunk_deploy_forwarders_status | default('unknown') }}.
            success_msg: "splunk/deploy_forwarders: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/deploy_forwarders | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_postflight_passed: true
            fe_splunk_deploy_forwarders_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/deploy_forwarders | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_status: "failed"
            fe_splunk_deploy_forwarders_postflight_passed: false
            fe_splunk_deploy_forwarders_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_deploy_forwarders_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/deploy_forwarders | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/deploy_forwarders: FAILED at '{{ fe_splunk_deploy_forwarders_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_deploy_forwarders_error }}
          tags:
            - always
            - rescue

        - name: "splunk/deploy_forwarders | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/deploy_forwarders failed at '{{ fe_splunk_deploy_forwarders_failed_task }}': {{ fe_splunk_deploy_forwarders_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/deploy_forwarders | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_deploy_forwarders_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_deploy_forwarders_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/deploy_forwarders | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/deploy_forwarders":
                  component: "splunk/deploy_forwarders"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_deploy_forwarders_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_deploy_forwarders_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_deploy_forwarders_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_deploy_forwarders_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_deploy_forwarders_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_deploy_forwarders_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_deploy_forwarders_failed_task | default('') }}"
                  error: "{{ fe_splunk_deploy_forwarders_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_deploy_forwarders_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else ['splunk/deploy_forwarders'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_deploy_forwarders_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/deploy_forwarders | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_stats_published: true
          tags:
            - always

        - name: "splunk/deploy_forwarders | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/deploy_forwarders: {{ fe_splunk_deploy_forwarders_status | default('unknown') }} in
              {{ fe_splunk_deploy_forwarders_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  pre_tasks:
    - name: "splunk/deploy_forwarders | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/deploy_forwarders | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_deploy_forwarders_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_deploy_forwarders_status: "running"
            fe_splunk_deploy_forwarders_preflight_passed: false
            fe_splunk_deploy_forwarders_postflight_passed: false
            fe_splunk_deploy_forwarders_failed_task: ""
            fe_splunk_deploy_forwarders_error: ""
            fe_splunk_deploy_forwarders_stats_published: false
          tags:
            - always

        - name: "splunk/deploy_forwarders | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/deploy_forwarders: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/deploy_forwarders: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/deploy_forwarders | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/deploy_forwarders: required variable '{{ item }}' is not defined."
            success_msg: "splunk/deploy_forwarders: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_deploy_forwarders_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/deploy_forwarders | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/deploy_forwarders | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_status: "preflight_failed"
            fe_splunk_deploy_forwarders_postflight_passed: false
            fe_splunk_deploy_forwarders_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_deploy_forwarders_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/deploy_forwarders | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/deploy_forwarders: FAILED at '{{ fe_splunk_deploy_forwarders_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_deploy_forwarders_error }}
          tags:
            - always
            - rescue

        - name: "splunk/deploy_forwarders | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/deploy_forwarders":
                  component: "splunk/deploy_forwarders"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_deploy_forwarders_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_deploy_forwarders_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_deploy_forwarders_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_deploy_forwarders_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_deploy_forwarders_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_deploy_forwarders_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_deploy_forwarders_failed_task | default('') }}"
                  error: "{{ fe_splunk_deploy_forwarders_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_deploy_forwarders_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_deploy_forwarders_status | default('') == 'succeeded' else ['splunk/deploy_forwarders'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/deploy_forwarders | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_deploy_forwarders_stats_published: true
          tags:
            - always

        - name: "splunk/deploy_forwarders | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/deploy_forwarders failed at '{{ fe_splunk_deploy_forwarders_failed_task }}': {{ fe_splunk_deploy_forwarders_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/deploy_forwarders | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/deploy_forwarders: preflight
              {{ 'passed' if fe_splunk_deploy_forwarders_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
