---
# Standalone task: Restart Splunk service
# Usage: ansible-playbook -i inventory splunk/playbooks/restart_splunk.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Restart Splunk Enterprise
  hosts: splunk_servers
  become: yes
  vars:
    splunk_home: "/opt/splunk"
    splunk_user: "splunk"

  tasks:
    - name: "splunk/tasks/restart_splunk | Guarded execution with rescue and always handling"
      block:

        - name: Check Splunk service status
          ansible.builtin.systemd:
            name: Splunkd
            state: started
          register: splunk_status

        - name: Restart Splunk service
          ansible.builtin.systemd:
            name: Splunkd
            state: restarted
            daemon_reload: yes

        - name: Wait for Splunk to be available
          ansible.builtin.wait_for:
            port: 8089
            delay: 10
            timeout: 300

        - name: Verify Splunk is running
          ansible.builtin.command: "{{ splunk_home }}/bin/splunk status"
          become_user: "{{ splunk_user }}"
          register: status_output
          changed_when: false

        - name: Display status
          ansible.builtin.debug:
            msg: "{{ status_output.stdout_lines }}"

        - name: "splunk/tasks/restart_splunk | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "splunk/tasks/restart_splunk | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_status: "failed"
            fe_splunk_tasks_restart_splunk_postflight_passed: false
            fe_splunk_tasks_restart_splunk_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_restart_splunk_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/restart_splunk: FAILED at '{{ fe_splunk_tasks_restart_splunk_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_restart_splunk_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/restart_splunk failed at '{{ fe_splunk_tasks_restart_splunk_failed_task }}': {{ fe_splunk_tasks_restart_splunk_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/restart_splunk | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_restart_splunk_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tasks_restart_splunk_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/restart_splunk":
                  component: "splunk/tasks/restart_splunk"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_restart_splunk_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_restart_splunk_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_restart_splunk_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_restart_splunk_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_restart_splunk_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_restart_splunk_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_restart_splunk_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else ['splunk/tasks/restart_splunk'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_tasks_restart_splunk_status | default('') == 'failed'
            - not (fe_splunk_tasks_restart_splunk_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_stats_published: true
          when:
            - fe_splunk_tasks_restart_splunk_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "splunk/tasks/restart_splunk | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/tasks/restart_splunk | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_tasks_restart_splunk_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_restart_splunk_status: "running"
            fe_splunk_tasks_restart_splunk_preflight_passed: false
            fe_splunk_tasks_restart_splunk_postflight_passed: false
            fe_splunk_tasks_restart_splunk_failed_task: ""
            fe_splunk_tasks_restart_splunk_error: ""
            fe_splunk_tasks_restart_splunk_stats_published: false
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/tasks/restart_splunk: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/tasks/restart_splunk: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tasks/restart_splunk | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/tasks/restart_splunk: required variable '{{ item }}' is not defined."
            success_msg: "splunk/tasks/restart_splunk: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_tasks_restart_splunk_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tasks/restart_splunk | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/tasks/restart_splunk | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_status: "preflight_failed"
            fe_splunk_tasks_restart_splunk_postflight_passed: false
            fe_splunk_tasks_restart_splunk_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_restart_splunk_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/restart_splunk: FAILED at '{{ fe_splunk_tasks_restart_splunk_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_restart_splunk_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/restart_splunk":
                  component: "splunk/tasks/restart_splunk"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_restart_splunk_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_restart_splunk_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_restart_splunk_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_restart_splunk_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_restart_splunk_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_restart_splunk_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_restart_splunk_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else ['splunk/tasks/restart_splunk'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_stats_published: true
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/restart_splunk failed at '{{ fe_splunk_tasks_restart_splunk_failed_task }}': {{ fe_splunk_tasks_restart_splunk_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/restart_splunk | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/restart_splunk: preflight
              {{ 'passed' if fe_splunk_tasks_restart_splunk_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "splunk/tasks/restart_splunk | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/tasks/restart_splunk | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_tasks_restart_splunk_preflight_passed | bool
              - fe_splunk_tasks_restart_splunk_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/tasks/restart_splunk: postflight validation failed - preflight passed
              ={{ fe_splunk_tasks_restart_splunk_preflight_passed | default(false) }},
              status={{ fe_splunk_tasks_restart_splunk_status | default('unknown') }}.
            success_msg: "splunk/tasks/restart_splunk: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/tasks/restart_splunk | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_postflight_passed: true
            fe_splunk_tasks_restart_splunk_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/tasks/restart_splunk | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_status: "failed"
            fe_splunk_tasks_restart_splunk_postflight_passed: false
            fe_splunk_tasks_restart_splunk_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_restart_splunk_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/restart_splunk: FAILED at '{{ fe_splunk_tasks_restart_splunk_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_restart_splunk_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/restart_splunk | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/restart_splunk failed at '{{ fe_splunk_tasks_restart_splunk_failed_task }}': {{ fe_splunk_tasks_restart_splunk_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/restart_splunk | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_restart_splunk_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tasks_restart_splunk_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/restart_splunk":
                  component: "splunk/tasks/restart_splunk"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_restart_splunk_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_restart_splunk_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_restart_splunk_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_restart_splunk_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_restart_splunk_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_restart_splunk_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_restart_splunk_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_restart_splunk_status | default('') == 'succeeded' else ['splunk/tasks/restart_splunk'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_tasks_restart_splunk_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_restart_splunk_stats_published: true
          tags:
            - always

        - name: "splunk/tasks/restart_splunk | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/restart_splunk: {{ fe_splunk_tasks_restart_splunk_status | default('unknown') }} in
              {{ fe_splunk_tasks_restart_splunk_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
