---
# Functional test playbook for Splunk installation
# Usage: ansible-playbook -i inventory splunk/playbooks/tests/test_installation.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Test Splunk Installation
  hosts: splunk_servers
  any_errors_fatal: true
  become: yes
  vars:
    splunk_home: "/opt/splunk"
    splunk_user: "splunk"

  tasks:
    - name: "splunk/tests/test_installation | Guarded execution with rescue and always handling"
      block:

        - name: Test - Verify Splunk binary exists
          ansible.builtin.stat:
            path: "{{ splunk_home }}/bin/splunk"
          register: splunk_binary
          failed_when: not splunk_binary.stat.exists

        - name: Test - Verify Splunk user exists
          ansible.builtin.user:
            name: "{{ splunk_user }}"
            state: present
          check_mode: yes
          register: user_check
          failed_when: user_check.changed

        - name: Test - Verify Splunk service is running
          ansible.builtin.systemd:
            name: Splunkd
            state: started
          check_mode: yes
          register: service_check

        - name: Test - Verify web port is listening
          ansible.builtin.wait_for:
            port: 8000
            timeout: 10
          register: web_port_check

        - name: Test - Verify management port is listening
          ansible.builtin.wait_for:
            port: 8089
            timeout: 10
          register: mgmt_port_check

        - name: Test - Verify Splunk responds to API
          ansible.builtin.uri:
            url: "https://localhost:8089/services/server/info"
            method: GET
            user: admin
            password: "{{ splunk_admin_password }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: 200
          register: api_check
          no_log: true

        - name: Test - Verify FIPS mode configuration
          ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list fips | grep 'fipsMode = strict'"
          become_user: "{{ splunk_user }}"
          register: fips_check
          changed_when: false
          failed_when: fips_check.rc != 0

        - name: Test - Verify TLS configuration
          ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list sslConfig | grep 'sslVersions.*tls1.2'"
          become_user: "{{ splunk_user }}"
          register: tls_check
          changed_when: false
          failed_when: tls_check.rc != 0

        - name: Test - Verify audit logging is enabled
          ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool audit list | grep 'enableAuditTrail = true'"
          become_user: "{{ splunk_user }}"
          register: audit_check
          changed_when: false
          failed_when: audit_check.rc != 0

        - name: Test - Verify file permissions are secure
          ansible.builtin.shell: |
            ls -la {{ splunk_home }}/etc/system/local/*.conf | awk '{print $1}' | grep -v '^-rw-------'
          register: perms_check
          changed_when: false
          failed_when: perms_check.stdout != ""

        - name: Test Results Summary
          ansible.builtin.debug:
            msg:
              - "=== Splunk Installation Test Results ==="
              - "Host: {{ inventory_hostname }}"
              - "Binary: {{ 'PASS' if splunk_binary.stat.exists else 'FAIL' }}"
              - "User: {{ 'PASS' if not user_check.changed else 'FAIL' }}"
              - "Service: {{ 'PASS' if service_check.status.ActiveState == 'active' else 'FAIL' }}"
              - "Web Port: {{ 'PASS' if web_port_check is success else 'FAIL' }}"
              - "API: {{ 'PASS' if api_check.status == 200 else 'FAIL' }}"
              - "FIPS: {{ 'PASS' if fips_check.rc == 0 else 'FAIL' }}"
              - "TLS: {{ 'PASS' if tls_check.rc == 0 else 'FAIL' }}"
              - "Audit: {{ 'PASS' if audit_check.rc == 0 else 'FAIL' }}"
              - "Permissions: {{ 'PASS' if perms_check.stdout == '' else 'FAIL' }}"
              - "========================================"
              - "Overall: ALL TESTS PASSED"

        - name: "splunk/tests/test_installation | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "splunk/tests/test_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_status: "failed"
            fe_splunk_tests_test_installation_postflight_passed: false
            fe_splunk_tests_test_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_installation: FAILED at '{{ fe_splunk_tests_test_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_installation_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_installation failed at '{{ fe_splunk_tests_test_installation_failed_task }}': {{ fe_splunk_tests_test_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_installation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_installation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_installation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_installation":
                  component: "splunk/tests/test_installation"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_installation_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_installation_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else ['splunk/tests/test_installation'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_tests_test_installation_status | default('') == 'failed'
            - not (fe_splunk_tests_test_installation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_stats_published: true
          when:
            - fe_splunk_tests_test_installation_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "splunk/tests/test_installation | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/tests/test_installation | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_tests_test_installation_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_installation_status: "running"
            fe_splunk_tests_test_installation_preflight_passed: false
            fe_splunk_tests_test_installation_postflight_passed: false
            fe_splunk_tests_test_installation_failed_task: ""
            fe_splunk_tests_test_installation_error: ""
            fe_splunk_tests_test_installation_stats_published: false
          tags:
            - always

        - name: "splunk/tests/test_installation | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/tests/test_installation: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/tests/test_installation: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_installation | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/tests/test_installation: required variable '{{ item }}' is not defined."
            success_msg: "splunk/tests/test_installation: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_tests_test_installation_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_installation | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/tests/test_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_status: "preflight_failed"
            fe_splunk_tests_test_installation_postflight_passed: false
            fe_splunk_tests_test_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_installation: FAILED at '{{ fe_splunk_tests_test_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_installation_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_installation":
                  component: "splunk/tests/test_installation"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_installation_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_installation_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else ['splunk/tests/test_installation'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_installation failed at '{{ fe_splunk_tests_test_installation_failed_task }}': {{ fe_splunk_tests_test_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_installation | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_installation: preflight
              {{ 'passed' if fe_splunk_tests_test_installation_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "splunk/tests/test_installation | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/tests/test_installation | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_tests_test_installation_preflight_passed | bool
              - fe_splunk_tests_test_installation_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/tests/test_installation: postflight validation failed - preflight passed
              ={{ fe_splunk_tests_test_installation_preflight_passed | default(false) }},
              status={{ fe_splunk_tests_test_installation_status | default('unknown') }}.
            success_msg: "splunk/tests/test_installation: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/tests/test_installation | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_postflight_passed: true
            fe_splunk_tests_test_installation_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/tests/test_installation | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_status: "failed"
            fe_splunk_tests_test_installation_postflight_passed: false
            fe_splunk_tests_test_installation_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_installation_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_installation: FAILED at '{{ fe_splunk_tests_test_installation_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_installation_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_installation | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_installation failed at '{{ fe_splunk_tests_test_installation_failed_task }}': {{ fe_splunk_tests_test_installation_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_installation | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_installation_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_installation_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_installation":
                  component: "splunk/tests/test_installation"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_installation_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_installation_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_installation_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_installation_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_installation_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_installation_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_installation_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_installation_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_installation_status | default('') == 'succeeded' else ['splunk/tests/test_installation'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_tests_test_installation_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_installation_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_installation | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_installation: {{ fe_splunk_tests_test_installation_status | default('unknown') }} in
              {{ fe_splunk_tests_test_installation_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
