---
# Functional test for Splunk forwarders
# Usage: ansible-playbook -i inventory splunk/playbooks/tests/test_forwarder.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Test Splunk Universal Forwarder
  hosts: forwarder_targets
  any_errors_fatal: true
  become: yes
  vars:
    splunk_forwarder_home: "/opt/splunkforwarder"
    splunk_user: "splunk"

  tasks:
    - name: "splunk/tests/test_forwarder | Guarded execution with rescue and always handling"
      block:

        - name: Test - Verify forwarder binary exists
          ansible.builtin.stat:
            path: "{{ splunk_forwarder_home }}/bin/splunk"
          register: forwarder_binary
          failed_when: not forwarder_binary.stat.exists

        - name: Test - Verify forwarder service is running
          ansible.builtin.systemd:
            name: SplunkForwarder
            state: started
          check_mode: yes
          register: forwarder_service

        - name: Test - Verify outputs.conf exists
          ansible.builtin.stat:
            path: "{{ splunk_forwarder_home }}/etc/system/local/outputs.conf"
          register: outputs_conf
          failed_when: not outputs_conf.stat.exists

        - name: Test - Verify inputs.conf exists
          ansible.builtin.stat:
            path: "{{ splunk_forwarder_home }}/etc/system/local/inputs.conf"
          register: inputs_conf
          failed_when: not inputs_conf.stat.exists

        - name: Test - Verify TLS is enabled for forwarding
          ansible.builtin.shell: grep -i "sslVerifyServerCert" {{ splunk_forwarder_home }}/etc/system/local/outputs.conf
          register: tls_forwarder
          changed_when: false
          failed_when: tls_forwarder.rc != 0

        - name: Forwarder Test Results
          ansible.builtin.debug:
            msg:
              - "=== Forwarder Test Results ==="
              - "Host: {{ inventory_hostname }}"
              - "Binary: {{ 'PASS' if forwarder_binary.stat.exists else 'FAIL' }}"
              - "Service: {{ 'PASS' if forwarder_service.status.ActiveState == 'active' else 'FAIL' }}"
              - "Outputs Config: {{ 'PASS' if outputs_conf.stat.exists else 'FAIL' }}"
              - "Inputs Config: {{ 'PASS' if inputs_conf.stat.exists else 'FAIL' }}"
              - "TLS Enabled: {{ 'PASS' if tls_forwarder.rc == 0 else 'FAIL' }}"
              - "==============================="
              - "Overall: ALL TESTS PASSED"

        - name: "splunk/tests/test_forwarder | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "splunk/tests/test_forwarder | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_status: "failed"
            fe_splunk_tests_test_forwarder_postflight_passed: false
            fe_splunk_tests_test_forwarder_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_forwarder_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_forwarder: FAILED at '{{ fe_splunk_tests_test_forwarder_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_forwarder_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_forwarder failed at '{{ fe_splunk_tests_test_forwarder_failed_task }}': {{ fe_splunk_tests_test_forwarder_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_forwarder | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_forwarder_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_forwarder_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_forwarder":
                  component: "splunk/tests/test_forwarder"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_forwarder_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_forwarder_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_forwarder_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_forwarder_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_forwarder_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_forwarder_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_forwarder_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else ['splunk/tests/test_forwarder'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_tests_test_forwarder_status | default('') == 'failed'
            - not (fe_splunk_tests_test_forwarder_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_stats_published: true
          when:
            - fe_splunk_tests_test_forwarder_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "splunk/tests/test_forwarder | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/tests/test_forwarder | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_tests_test_forwarder_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_forwarder_status: "running"
            fe_splunk_tests_test_forwarder_preflight_passed: false
            fe_splunk_tests_test_forwarder_postflight_passed: false
            fe_splunk_tests_test_forwarder_failed_task: ""
            fe_splunk_tests_test_forwarder_error: ""
            fe_splunk_tests_test_forwarder_stats_published: false
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/tests/test_forwarder: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/tests/test_forwarder: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_forwarder | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/tests/test_forwarder: required variable '{{ item }}' is not defined."
            success_msg: "splunk/tests/test_forwarder: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_tests_test_forwarder_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_forwarder | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/tests/test_forwarder | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_status: "preflight_failed"
            fe_splunk_tests_test_forwarder_postflight_passed: false
            fe_splunk_tests_test_forwarder_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_forwarder_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_forwarder: FAILED at '{{ fe_splunk_tests_test_forwarder_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_forwarder_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_forwarder":
                  component: "splunk/tests/test_forwarder"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_forwarder_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_forwarder_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_forwarder_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_forwarder_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_forwarder_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_forwarder_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_forwarder_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else ['splunk/tests/test_forwarder'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_forwarder failed at '{{ fe_splunk_tests_test_forwarder_failed_task }}': {{ fe_splunk_tests_test_forwarder_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_forwarder | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_forwarder: preflight
              {{ 'passed' if fe_splunk_tests_test_forwarder_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "splunk/tests/test_forwarder | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/tests/test_forwarder | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_tests_test_forwarder_preflight_passed | bool
              - fe_splunk_tests_test_forwarder_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/tests/test_forwarder: postflight validation failed - preflight passed
              ={{ fe_splunk_tests_test_forwarder_preflight_passed | default(false) }},
              status={{ fe_splunk_tests_test_forwarder_status | default('unknown') }}.
            success_msg: "splunk/tests/test_forwarder: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/tests/test_forwarder | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_postflight_passed: true
            fe_splunk_tests_test_forwarder_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/tests/test_forwarder | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_status: "failed"
            fe_splunk_tests_test_forwarder_postflight_passed: false
            fe_splunk_tests_test_forwarder_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_forwarder_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_forwarder: FAILED at '{{ fe_splunk_tests_test_forwarder_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_forwarder_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_forwarder | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_forwarder failed at '{{ fe_splunk_tests_test_forwarder_failed_task }}': {{ fe_splunk_tests_test_forwarder_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_forwarder | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_forwarder_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_forwarder_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_forwarder":
                  component: "splunk/tests/test_forwarder"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_forwarder_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_forwarder_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_forwarder_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_forwarder_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_forwarder_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_forwarder_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_forwarder_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_forwarder_status | default('') == 'succeeded' else ['splunk/tests/test_forwarder'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_tests_test_forwarder_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_forwarder_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_forwarder | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_forwarder: {{ fe_splunk_tests_test_forwarder_status | default('unknown') }} in
              {{ fe_splunk_tests_test_forwarder_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
