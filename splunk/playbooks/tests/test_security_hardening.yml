---
# Functional test for security hardening
# Usage: ansible-playbook -i inventory splunk/playbooks/tests/test_security_hardening.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Test Splunk Security Hardening
  hosts: splunk_servers
  any_errors_fatal: true
  become: true
  vars:
    splunk_home: "/opt/splunk"
    splunk_user: "splunk"

  tasks:
    - name: "splunk/tests/test_security_hardening | Guarded execution with rescue and always handling"
      block:

        - name: Test - STIG CAT I findings remediation
          block:
            - name: Verify SSLv3 and TLS 1.0/1.1 are disabled
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list sslConfig | grep sslVersions | grep -v 'ssl3\\|tls1.0\\|tls1.1'"
              become_user: "{{ splunk_user }}"
              register: ssl_versions
              changed_when: false

            - name: Verify FIPS mode is enabled
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list fips | grep 'fipsMode = strict'"
              become_user: "{{ splunk_user }}"
              register: fips_mode
              changed_when: false

            - name: Verify strong ciphers are configured
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list sslConfig | grep cipherSuite | grep -i 'ECDHE\\|AES256'"
              become_user: "{{ splunk_user }}"
              register: cipher_suite
              changed_when: false

        - name: Test - Password policy enforcement
          block:
            - name: Verify minimum password length
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool authentication list | grep 'minPasswordLength' | grep -E '(1[5-9]|[2-9][0-9])'"
              become_user: "{{ splunk_user }}"
              register: password_length
              changed_when: false

            - name: Verify password complexity
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool authentication list | grep 'minPasswordDigit\\|minPasswordLowercase\\|minPasswordUppercase'"
              become_user: "{{ splunk_user }}"
              register: password_complexity
              changed_when: false

        - name: Test - Audit logging configuration
          block:
            - name: Verify audit trail is enabled
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool audit list | grep 'enableAuditTrail = true'"
              become_user: "{{ splunk_user }}"
              register: audit_trail
              changed_when: false

            - name: Verify audit log exists and is protected
              ansible.builtin.stat:
                path: "{{ splunk_home }}/var/log/splunk/audit.log"
              register: audit_log
              failed_when: not audit_log.stat.exists or audit_log.stat.mode != '0600'

        - name: Test - Network security controls
          block:
            - name: Verify trusted IP configuration
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list general | grep trustedIP"
              become_user: "{{ splunk_user }}"
              register: trusted_ip
              changed_when: false

            - name: Verify default port is disabled
              ansible.builtin.shell: "{{ splunk_home }}/bin/splunk btool server list httpServer | grep 'disableDefaultPort = true'"
              become_user: "{{ splunk_user }}"
              register: default_port
              changed_when: false

        - name: Security Hardening Test Results
          ansible.builtin.debug:
            msg:
              - "=== Security Hardening Test Results ==="
              - "Host: {{ inventory_hostname }}"
              - "SSL/TLS: {{ 'PASS' if ssl_versions.rc == 0 else 'FAIL' }}"
              - "FIPS Mode: {{ 'PASS' if fips_mode.rc == 0 else 'FAIL' }}"
              - "Cipher Suite: {{ 'PASS' if cipher_suite.rc == 0 else 'FAIL' }}"
              - "Password Length: {{ 'PASS' if password_length.rc == 0 else 'FAIL' }}"
              - "Password Complexity: {{ 'PASS' if password_complexity.rc == 0 else 'FAIL' }}"
              - "Audit Trail: {{ 'PASS' if audit_trail.rc == 0 else 'FAIL' }}"
              - "Audit Log Protected: {{ 'PASS' if audit_log.stat.mode == '0600' else 'FAIL' }}"
              - "Network Security: {{ 'PASS' if trusted_ip.rc == 0 else 'FAIL' }}"
              - "============================================"
              - "STIG Compliance: VERIFIED"

        - name: "splunk/tests/test_security_hardening | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "splunk/tests/test_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_status: "failed"
            fe_splunk_tests_test_security_hardening_postflight_passed: false
            fe_splunk_tests_test_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_security_hardening: FAILED at '{{ fe_splunk_tests_test_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_security_hardening failed at '{{ fe_splunk_tests_test_security_hardening_failed_task }}': {{ fe_splunk_tests_test_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_security_hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_security_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_security_hardening":
                  component: "splunk/tests/test_security_hardening"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else ['splunk/tests/test_security_hardening'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_tests_test_security_hardening_status | default('') == 'failed'
            - not (fe_splunk_tests_test_security_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_stats_published: true
          when:
            - fe_splunk_tests_test_security_hardening_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "splunk/tests/test_security_hardening | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/tests/test_security_hardening | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_tests_test_security_hardening_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_security_hardening_status: "running"
            fe_splunk_tests_test_security_hardening_preflight_passed: false
            fe_splunk_tests_test_security_hardening_postflight_passed: false
            fe_splunk_tests_test_security_hardening_failed_task: ""
            fe_splunk_tests_test_security_hardening_error: ""
            fe_splunk_tests_test_security_hardening_stats_published: false
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/tests/test_security_hardening: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/tests/test_security_hardening: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_security_hardening | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/tests/test_security_hardening: required variable '{{ item }}' is not defined."
            success_msg: "splunk/tests/test_security_hardening: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_tests_test_security_hardening_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tests/test_security_hardening | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/tests/test_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_status: "preflight_failed"
            fe_splunk_tests_test_security_hardening_postflight_passed: false
            fe_splunk_tests_test_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_security_hardening: FAILED at '{{ fe_splunk_tests_test_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_security_hardening":
                  component: "splunk/tests/test_security_hardening"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else ['splunk/tests/test_security_hardening'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_security_hardening failed at '{{ fe_splunk_tests_test_security_hardening_failed_task }}': {{ fe_splunk_tests_test_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_security_hardening | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_security_hardening: preflight
              {{ 'passed' if fe_splunk_tests_test_security_hardening_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "splunk/tests/test_security_hardening | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/tests/test_security_hardening | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_tests_test_security_hardening_preflight_passed | bool
              - fe_splunk_tests_test_security_hardening_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/tests/test_security_hardening: postflight validation failed - preflight passed
              ={{ fe_splunk_tests_test_security_hardening_preflight_passed | default(false) }},
              status={{ fe_splunk_tests_test_security_hardening_status | default('unknown') }}.
            success_msg: "splunk/tests/test_security_hardening: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/tests/test_security_hardening | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_postflight_passed: true
            fe_splunk_tests_test_security_hardening_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/tests/test_security_hardening | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_status: "failed"
            fe_splunk_tests_test_security_hardening_postflight_passed: false
            fe_splunk_tests_test_security_hardening_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tests_test_security_hardening_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_security_hardening: FAILED at '{{ fe_splunk_tests_test_security_hardening_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tests_test_security_hardening_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tests/test_security_hardening | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tests/test_security_hardening failed at '{{ fe_splunk_tests_test_security_hardening_failed_task }}': {{ fe_splunk_tests_test_security_hardening_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tests/test_security_hardening | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tests_test_security_hardening_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tests_test_security_hardening_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tests/test_security_hardening":
                  component: "splunk/tests/test_security_hardening"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tests_test_security_hardening_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tests_test_security_hardening_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tests_test_security_hardening_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tests_test_security_hardening_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tests_test_security_hardening_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tests_test_security_hardening_failed_task | default('') }}"
                  error: "{{ fe_splunk_tests_test_security_hardening_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tests_test_security_hardening_status | default('') == 'succeeded' else ['splunk/tests/test_security_hardening'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_tests_test_security_hardening_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tests_test_security_hardening_stats_published: true
          tags:
            - always

        - name: "splunk/tests/test_security_hardening | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/tests/test_security_hardening: {{ fe_splunk_tests_test_security_hardening_status | default('unknown') }} in
              {{ fe_splunk_tests_test_security_hardening_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
