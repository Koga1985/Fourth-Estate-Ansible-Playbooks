---
# Standalone task: Immediate Splunk backup
# Usage: ansible-playbook -i inventory splunk/tasks/backup_now.yml

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Execute Splunk Backup
  hosts: splunk_servers
  become: yes
  vars:
    splunk_home: "/opt/splunk"
    splunk_user: "splunk"
    backup_path: "/backup/splunk"

  tasks:
    - name: "splunk/tasks/backup_now | Guarded execution with rescue and always handling"
      block:

        - name: Verify backup script exists
          ansible.builtin.stat:
            path: "{{ splunk_home }}/bin/backup_splunk.sh"
          register: backup_script

        - name: Execute backup
          ansible.builtin.command: "{{ splunk_home }}/bin/backup_splunk.sh"
          become_user: "{{ splunk_user }}"
          when: backup_script.stat.exists
          register: backup_result

        - name: Display backup results
          ansible.builtin.debug:
            msg: "{{ backup_result.stdout_lines }}"
          when: backup_script.stat.exists

        - name: Warning if backup script missing
          ansible.builtin.debug:
            msg: "WARNING: Backup script not found. Run splunk_backup_dr role first."
          when: not backup_script.stat.exists

      rescue:

        - name: "splunk/tasks/backup_now | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_status: "failed"
            fe_splunk_tasks_backup_now_postflight_passed: false
            fe_splunk_tasks_backup_now_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_backup_now_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/backup_now: FAILED at '{{ fe_splunk_tasks_backup_now_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_backup_now_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/backup_now failed at '{{ fe_splunk_tasks_backup_now_failed_task }}': {{ fe_splunk_tasks_backup_now_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/backup_now | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_backup_now_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tasks_backup_now_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/backup_now":
                  component: "splunk/tasks/backup_now"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_backup_now_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_backup_now_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_backup_now_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_backup_now_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_backup_now_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_backup_now_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_backup_now_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else ['splunk/tasks/backup_now'] }}
            aggregate: true
            per_host: false
          when:
            - fe_splunk_tasks_backup_now_status | default('') == 'failed'
            - not (fe_splunk_tasks_backup_now_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_stats_published: true
          when:
            - fe_splunk_tasks_backup_now_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "splunk/tasks/backup_now | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "splunk/tasks/backup_now | Initialize validation state"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_splunk_tasks_backup_now_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_backup_now_status: "running"
            fe_splunk_tasks_backup_now_preflight_passed: false
            fe_splunk_tasks_backup_now_postflight_passed: false
            fe_splunk_tasks_backup_now_failed_task: ""
            fe_splunk_tasks_backup_now_error: ""
            fe_splunk_tasks_backup_now_stats_published: false
          tags:
            - always

        - name: "splunk/tasks/backup_now | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              splunk/tasks/backup_now: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              splunk/tasks/backup_now: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tasks/backup_now | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "splunk/tasks/backup_now: required variable '{{ item }}' is not defined."
            success_msg: "splunk/tasks/backup_now: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_splunk_tasks_backup_now_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "splunk/tasks/backup_now | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "splunk/tasks/backup_now | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_status: "preflight_failed"
            fe_splunk_tasks_backup_now_postflight_passed: false
            fe_splunk_tasks_backup_now_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_backup_now_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/backup_now: FAILED at '{{ fe_splunk_tasks_backup_now_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_backup_now_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/backup_now":
                  component: "splunk/tasks/backup_now"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_backup_now_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_backup_now_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_backup_now_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_backup_now_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_backup_now_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_backup_now_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_backup_now_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else ['splunk/tasks/backup_now'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_stats_published: true
          tags:
            - always

        - name: "splunk/tasks/backup_now | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/backup_now failed at '{{ fe_splunk_tasks_backup_now_failed_task }}': {{ fe_splunk_tasks_backup_now_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/backup_now | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/backup_now: preflight
              {{ 'passed' if fe_splunk_tasks_backup_now_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "splunk/tasks/backup_now | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "splunk/tasks/backup_now | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_splunk_tasks_backup_now_preflight_passed | bool
              - fe_splunk_tasks_backup_now_status in ['running', 'succeeded']
            fail_msg: >-
              splunk/tasks/backup_now: postflight validation failed - preflight passed
              ={{ fe_splunk_tasks_backup_now_preflight_passed | default(false) }},
              status={{ fe_splunk_tasks_backup_now_status | default('unknown') }}.
            success_msg: "splunk/tasks/backup_now: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "splunk/tasks/backup_now | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_postflight_passed: true
            fe_splunk_tasks_backup_now_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "splunk/tasks/backup_now | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_status: "failed"
            fe_splunk_tasks_backup_now_postflight_passed: false
            fe_splunk_tasks_backup_now_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_splunk_tasks_backup_now_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/backup_now: FAILED at '{{ fe_splunk_tasks_backup_now_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_splunk_tasks_backup_now_error }}
          tags:
            - always
            - rescue

        - name: "splunk/tasks/backup_now | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              splunk/tasks/backup_now failed at '{{ fe_splunk_tasks_backup_now_failed_task }}': {{ fe_splunk_tasks_backup_now_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "splunk/tasks/backup_now | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_splunk_tasks_backup_now_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_splunk_tasks_backup_now_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "splunk/tasks/backup_now":
                  component: "splunk/tasks/backup_now"
                  type: "playbook"
                  platform: "splunk"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_splunk_tasks_backup_now_status | default('unknown') }}"
                  preflight_passed: "{{ fe_splunk_tasks_backup_now_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_splunk_tasks_backup_now_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_splunk_tasks_backup_now_started_at | default('') }}"
                  ended_at: "{{ fe_splunk_tasks_backup_now_ended_at | default('') }}"
                  duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_splunk_tasks_backup_now_failed_task | default('') }}"
                  error: "{{ fe_splunk_tasks_backup_now_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_splunk_tasks_backup_now_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_splunk_tasks_backup_now_status | default('') == 'succeeded' else ['splunk/tasks/backup_now'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_splunk_tasks_backup_now_stats_published | default(false) | bool)
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_splunk_tasks_backup_now_stats_published: true
          tags:
            - always

        - name: "splunk/tasks/backup_now | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              splunk/tasks/backup_now: {{ fe_splunk_tasks_backup_now_status | default('unknown') }} in
              {{ fe_splunk_tasks_backup_now_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
