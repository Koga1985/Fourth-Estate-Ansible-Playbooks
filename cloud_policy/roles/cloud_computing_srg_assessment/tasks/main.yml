---
# tasks file for cloud_computing_srg_assessment
# Maps CC SRG / FedRAMP control families to provider roles and aggregates any
# provider assessment artifacts. Read-only.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cloud_policy/cloud_computing_srg_assessment']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cloud_policy_cloud_computing_srg_assessment_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cloud_policy/cloud_computing_srg_assessment | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cloud_policy_cloud_computing_srg_assessment_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cloud_policy_cloud_computing_srg_assessment_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cloud_policy_cloud_computing_srg_assessment_status: "running"
    fe_cloud_policy_cloud_computing_srg_assessment_preflight_passed: false
    fe_cloud_policy_cloud_computing_srg_assessment_postflight_passed: false
    fe_cloud_policy_cloud_computing_srg_assessment_failed_task: ""
    fe_cloud_policy_cloud_computing_srg_assessment_error: ""
    fe_cloud_policy_cloud_computing_srg_assessment_stats_published: false
  tags:
    - always

- name: "cloud_policy/cloud_computing_srg_assessment | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cloud_policy/cloud_computing_srg_assessment | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cloud_policy/cloud_computing_srg_assessment: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cloud_policy/cloud_computing_srg_assessment: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cloud_policy/cloud_computing_srg_assessment | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cloud_policy/cloud_computing_srg_assessment: required variable '{{ item }}' is not defined."
        success_msg: "cloud_policy/cloud_computing_srg_assessment: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cloud_policy_cloud_computing_srg_assessment_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cloud_policy/cloud_computing_srg_assessment | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cloud_policy_cloud_computing_srg_assessment_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      changed_when: false
      tags: [always]

    - name: Show run mode
      ansible.builtin.debug:
        msg: >-
          cloud_computing_srg_assessment ({{ stig_version }}, {{ cloud_impact_level }}) -
          providers in scope: {{ cloud_providers_in_scope | join(', ') }}
      tags: [always]

    - name: Discover per-provider assessment artifacts
      ansible.builtin.find:
        paths: "{{ cc_evidence_input_dirs }}"
        patterns: "*.json"
        file_type: file
      register: cc_found
      changed_when: false
      tags: [assess]

    - name: Evaluate CC SRG / FedRAMP control families against implementing roles
      ansible.builtin.set_fact:
        cc_srg_evaluated: >-
          {{ cc_srg_evaluated | default([]) + [
               item | combine({
                 'implementing_roles': in_scope_roles,
                 'coverage': ('covered' if (in_scope_roles | length > 0) else 'gap - no role for in-scope providers')
               })
             ] }}
      vars:
        in_scope_roles: >-
          {{ cloud_providers_in_scope
             | map('extract', item.roles)
             | select('defined')
             | map('default', [])
             | flatten
             | select('string') | list }}
      loop: "{{ cc_srg_catalog }}"
      loop_control:
        label: "{{ item.id }}"
      changed_when: false
      tags: [assess]

    - name: Assemble evidence package
      ansible.builtin.set_fact:
        cc_assessment:
          meta:
            timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
            benchmark: "{{ stig_benchmark }}"
            version: "{{ stig_version }}"
            impact_level: "{{ cloud_impact_level }}"
            providers_in_scope: "{{ cloud_providers_in_scope }}"
            provider_artifacts_found: "{{ cc_found.files | length }}"
            compliance_frameworks: "{{ compliance_frameworks }}"
          control_families: "{{ cc_srg_evaluated | default([]) }}"
          dod_specific: "{{ cc_srg_dod_specific }}"
          saas: "{{ saas_catalog }}"
      changed_when: false
      tags: [assess]

    - name: Write JSON evidence artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/cloud_computing_srg_assessment.json"
        mode: "0640"
        content: "{{ cc_assessment | to_nice_json }}"
      tags: [report]

    - name: Render Markdown evidence report
      ansible.builtin.template:
        src: cc_srg_report.md.j2
        dest: "{{ artifacts_dir }}/cloud_computing_srg_assessment.md"
        mode: "0640"
      tags: [report]

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          Cloud Computing SRG ({{ cloud_impact_level }}):
          {{ cc_srg_evaluated | default([]) | selectattr('coverage', 'equalto', 'covered') | list | length }}
          of {{ cc_srg_catalog | length }} control families covered by in-scope provider roles;
          {{ cc_found.files | length }} provider artifact(s) found.
          Report: {{ artifacts_dir }}/cloud_computing_srg_assessment.md
      tags: [report]

    # ----------------------------- postflight -------------------

    - name: "cloud_policy/cloud_computing_srg_assessment | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cloud_policy_cloud_computing_srg_assessment_preflight_passed | bool
          - fe_cloud_policy_cloud_computing_srg_assessment_status in ['running', 'succeeded']
        fail_msg: >-
          cloud_policy/cloud_computing_srg_assessment: postflight validation failed - preflight passed
          ={{ fe_cloud_policy_cloud_computing_srg_assessment_preflight_passed | default(false) }},
          status={{ fe_cloud_policy_cloud_computing_srg_assessment_status | default('unknown') }}.
        success_msg: "cloud_policy/cloud_computing_srg_assessment: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cloud_policy/cloud_computing_srg_assessment | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cloud_policy_cloud_computing_srg_assessment_postflight_passed: true
        fe_cloud_policy_cloud_computing_srg_assessment_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cloud_policy/cloud_computing_srg_assessment | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cloud_policy_cloud_computing_srg_assessment_status: "failed"
        fe_cloud_policy_cloud_computing_srg_assessment_postflight_passed: false
        fe_cloud_policy_cloud_computing_srg_assessment_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cloud_policy_cloud_computing_srg_assessment_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cloud_policy/cloud_computing_srg_assessment | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cloud_policy/cloud_computing_srg_assessment: FAILED at '{{ fe_cloud_policy_cloud_computing_srg_assessment_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cloud_policy_cloud_computing_srg_assessment_error }}
      tags:
        - always
        - rescue

    - name: "cloud_policy/cloud_computing_srg_assessment | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cloud_policy/cloud_computing_srg_assessment failed at '{{ fe_cloud_policy_cloud_computing_srg_assessment_failed_task }}': {{ fe_cloud_policy_cloud_computing_srg_assessment_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cloud_policy/cloud_computing_srg_assessment | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cloud_policy_cloud_computing_srg_assessment_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cloud_policy_cloud_computing_srg_assessment_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cloud_policy_cloud_computing_srg_assessment_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cloud_policy/cloud_computing_srg_assessment | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cloud_policy/cloud_computing_srg_assessment":
              component: "cloud_policy/cloud_computing_srg_assessment"
              type: "role"
              platform: "cloud_policy"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cloud_policy_cloud_computing_srg_assessment_status | default('unknown') }}"
              preflight_passed: "{{ fe_cloud_policy_cloud_computing_srg_assessment_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cloud_policy_cloud_computing_srg_assessment_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cloud_policy_cloud_computing_srg_assessment_started_at | default('') }}"
              ended_at: "{{ fe_cloud_policy_cloud_computing_srg_assessment_ended_at | default('') }}"
              duration_seconds: "{{ fe_cloud_policy_cloud_computing_srg_assessment_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cloud_policy_cloud_computing_srg_assessment_failed_task | default('') }}"
              error: "{{ fe_cloud_policy_cloud_computing_srg_assessment_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cloud_policy_cloud_computing_srg_assessment_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cloud_policy_cloud_computing_srg_assessment_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cloud_policy_cloud_computing_srg_assessment_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cloud_policy_cloud_computing_srg_assessment_status | default('') == 'succeeded' else ['cloud_policy/cloud_computing_srg_assessment'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cloud_policy/cloud_computing_srg_assessment | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cloud_policy_cloud_computing_srg_assessment_stats_published: true
      tags:
        - always
