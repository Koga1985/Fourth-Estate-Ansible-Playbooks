---
# tasks file for netapp_cluster_setup
# NetApp ONTAP Cluster Setup and Configuration
# Fourth Estate Production-Ready Implementation

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['netapp/netapp_cluster_setup']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_netapp_netapp_cluster_setup_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "netapp/netapp_cluster_setup | Initialize validation state"
  ansible.builtin.set_fact:
    fe_netapp_netapp_cluster_setup_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_netapp_netapp_cluster_setup_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_netapp_netapp_cluster_setup_status: "running"
    fe_netapp_netapp_cluster_setup_preflight_passed: false
    fe_netapp_netapp_cluster_setup_postflight_passed: false
    fe_netapp_netapp_cluster_setup_failed_task: ""
    fe_netapp_netapp_cluster_setup_error: ""
    fe_netapp_netapp_cluster_setup_stats_published: false
  tags:
    - always

- name: "netapp/netapp_cluster_setup | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "netapp/netapp_cluster_setup | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          netapp/netapp_cluster_setup: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          netapp/netapp_cluster_setup: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "netapp/netapp_cluster_setup | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "netapp/netapp_cluster_setup: required variable '{{ item }}' is not defined."
        success_msg: "netapp/netapp_cluster_setup: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_netapp_netapp_cluster_setup_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "netapp/netapp_cluster_setup | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_netapp_netapp_cluster_setup_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Install NetApp ONTAP collection
      ansible.builtin.command:
        cmd: ansible-galaxy collection install netapp.ontap --force
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: netapp_cluster_install_collection | bool

    - name: Verify cluster accessibility
      netapp.ontap.na_ontap_info:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        gather_subset:
          - cluster_identity_info
      no_log: true
      register: cluster_info
      delegate_to: localhost

    - name: Display cluster information
      ansible.builtin.debug:
        msg: "Cluster Name: {{ cluster_info.ontap_info.cluster_identity_info.cluster_name }}, Version: {{ cluster_info.ontap_info.cluster_identity_info.version }}"
      when: netapp_cluster_debug | bool

    - name: Configure cluster name
      netapp.ontap.na_ontap_cluster:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        cluster_name: "{{ netapp_cluster_name }}"
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_name is defined

    - name: Configure cluster contact information
      netapp.ontap.na_ontap_cluster:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        cluster_contact: "{{ netapp_cluster_contact }}"
        cluster_location: "{{ netapp_cluster_location }}"
      no_log: true
      delegate_to: localhost
      when:
        - netapp_cluster_contact is defined
        - netapp_cluster_location is defined

    - name: Configure DNS settings
      netapp.ontap.na_ontap_dns:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        vserver: "{{ netapp_cluster_name }}"
        domains: "{{ netapp_cluster_dns_domains }}"
        nameservers: "{{ netapp_cluster_dns_nameservers }}"
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_configure_dns | bool

    - name: Configure NTP servers
      netapp.ontap.na_ontap_ntp:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        server_name: "{{ item }}"
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_ntp_servers }}"
      when: netapp_cluster_configure_ntp | bool

    - name: Configure timezone
      netapp.ontap.na_ontap_command:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        command: ['cluster', 'date', 'modify', '-timezone', '{{ netapp_cluster_timezone }}']
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_timezone is defined
      changed_when: true

    - name: Create aggregates
      netapp.ontap.na_ontap_aggregate:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        nodes: "{{ item.nodes }}"
        disk_count: "{{ item.disk_count }}"
        raid_type: "{{ item.raid_type | default('raid_dp') }}"
        raid_size: "{{ item.raid_size | default(omit) }}"
        is_mirrored: "{{ item.is_mirrored | default(false) }}"
        snaplock_type: "{{ item.snaplock_type | default(omit) }}"
        encryption: "{{ item.encryption | default(netapp_cluster_aggregate_encryption) }}"
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_aggregates }}"
      when: netapp_cluster_create_aggregates | bool
      notify: validate aggregate status

    - name: Configure AutoSupport
      netapp.ontap.na_ontap_autosupport:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        node_name: "{{ item }}"
        state: present
        mail_hosts: "{{ netapp_cluster_autosupport_mail_hosts }}"
        noteto: "{{ netapp_cluster_autosupport_noteto }}"
        from_address: "{{ netapp_cluster_autosupport_from }}"
        support: "{{ netapp_cluster_autosupport_support }}"
        transport: "{{ netapp_cluster_autosupport_transport }}"
        is_enabled: true
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_nodes }}"
      when: netapp_cluster_configure_autosupport | bool

    - name: Configure SNMP
      netapp.ontap.na_ontap_snmp:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        community_name: "{{ netapp_cluster_snmp_community }}"
        access_control: "{{ netapp_cluster_snmp_access_control }}"
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_configure_snmp | bool

    - name: Configure SNMP traphost
      netapp.ontap.na_ontap_snmp_traphosts:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        ip_address: "{{ item }}"
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_snmp_traphosts }}"
      when:
        - netapp_cluster_configure_snmp | bool
        - netapp_cluster_snmp_traphosts | length > 0

    - name: Configure cluster peer relationships
      netapp.ontap.na_ontap_cluster_peer:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        source_intercluster_lifs: "{{ item.source_intercluster_lifs }}"
        dest_intercluster_lifs: "{{ item.dest_intercluster_lifs }}"
        passphrase: "{{ item.passphrase }}"
        dest_hostname: "{{ item.dest_hostname }}"
        dest_username: "{{ item.dest_username | default(netapp_cluster_username) }}"
        dest_password: "{{ item.dest_password | default(netapp_cluster_password) }}"
        encryption_protocol_proposed: "{{ item.encryption_protocol | default('tls_psk') }}"
      delegate_to: localhost
      loop: "{{ netapp_cluster_peer_relationships }}"
      when: netapp_cluster_configure_peer | bool
      no_log: true

    - name: Create broadcast domains
      netapp.ontap.na_ontap_broadcast_domain:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        mtu: "{{ item.mtu | default(1500) }}"
        ipspace: "{{ item.ipspace | default('Default') }}"
        ports: "{{ item.ports }}"
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_broadcast_domains }}"
      when: netapp_cluster_create_broadcast_domains | bool

    - name: Configure cluster management interface
      netapp.ontap.na_ontap_interface:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        interface_name: "{{ netapp_cluster_mgmt_lif_name }}"
        home_port: "{{ netapp_cluster_mgmt_home_port }}"
        home_node: "{{ netapp_cluster_mgmt_home_node }}"
        address: "{{ netapp_cluster_mgmt_ip }}"
        netmask: "{{ netapp_cluster_mgmt_netmask }}"
        role: cluster_mgmt
        vserver: "{{ netapp_cluster_name }}"
        firewall_policy: mgmt
        is_auto_revert: true
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_configure_mgmt_lif | bool

    - name: Create intercluster LIFs
      netapp.ontap.na_ontap_interface:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        interface_name: "{{ item.name }}"
        home_port: "{{ item.home_port }}"
        home_node: "{{ item.home_node }}"
        address: "{{ item.address }}"
        netmask: "{{ item.netmask }}"
        role: intercluster
        vserver: "{{ netapp_cluster_name }}"
        firewall_policy: intercluster
        is_auto_revert: true
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_intercluster_lifs }}"
      when: netapp_cluster_create_intercluster_lifs | bool

    - name: Configure disk assignment policy
      netapp.ontap.na_ontap_command:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        command: ['storage', 'disk', 'option', 'modify', '-node', '{{ item }}', '-autoassign', '{{ netapp_cluster_disk_autoassign }}']
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_nodes }}"
      when: netapp_cluster_configure_disk_assignment | bool
      changed_when: true

    - name: Enable cluster HA
      netapp.ontap.na_ontap_command:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        command: ['cluster', 'ha', 'modify', '-configured', 'true']
      no_log: true
      delegate_to: localhost
      when: netapp_cluster_enable_ha | bool
      changed_when: true

    - name: Configure service processor network
      netapp.ontap.na_ontap_service_processor_network:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        node: "{{ item.node }}"
        address_type: ipv4
        is_enabled: true
        dhcp: "{{ item.dhcp | default('none') }}"
        ip_address: "{{ item.ip_address }}"
        netmask: "{{ item.netmask }}"
        gateway_ip_address: "{{ item.gateway }}"
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_sp_network }}"
      when: netapp_cluster_configure_sp | bool

    - name: Configure licenses
      netapp.ontap.na_ontap_license:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        state: present
        license_codes: "{{ netapp_cluster_licenses }}"
      delegate_to: localhost
      when:
        - netapp_cluster_configure_licenses | bool
        - netapp_cluster_licenses | length > 0
      no_log: true

    - name: Configure system node settings
      netapp.ontap.na_ontap_command:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        command: ['system', 'node', 'modify', '-node', '{{ item.node }}', '-location', '{{ item.location }}', '-asset-tag', '{{ item.asset_tag | default(omit) }}']
      no_log: true
      delegate_to: localhost
      loop: "{{ netapp_cluster_node_settings }}"
      when: netapp_cluster_configure_node_settings | bool
      changed_when: true

    - name: Verify cluster health
      netapp.ontap.na_ontap_info:
        hostname: "{{ netapp_cluster_hostname }}"
        username: "{{ netapp_cluster_username }}"
        password: "{{ netapp_cluster_password }}"
        https: true
        validate_certs: "{{ netapp_cluster_validate_certs }}"
        gather_subset:
          - cluster_node_info
          - aggregate_info
          - net_interface_info
      no_log: true
      register: cluster_health_check
      delegate_to: localhost
      when: netapp_cluster_verify_health | bool

    - name: Display cluster health status
      ansible.builtin.debug:
        msg: "Cluster setup completed. Nodes: {{ cluster_health_check.ontap_info.cluster_node_info | length }}, Aggregates: {{ cluster_health_check.ontap_info.aggregate_info | length }}"
      when:
        - netapp_cluster_verify_health | bool
        - netapp_cluster_debug | bool

    # ----------------------------- postflight -------------------

    - name: "netapp/netapp_cluster_setup | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_netapp_netapp_cluster_setup_preflight_passed | bool
          - fe_netapp_netapp_cluster_setup_status in ['running', 'succeeded']
        fail_msg: >-
          netapp/netapp_cluster_setup: postflight validation failed - preflight passed
          ={{ fe_netapp_netapp_cluster_setup_preflight_passed | default(false) }},
          status={{ fe_netapp_netapp_cluster_setup_status | default('unknown') }}.
        success_msg: "netapp/netapp_cluster_setup: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "netapp/netapp_cluster_setup | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_netapp_netapp_cluster_setup_postflight_passed: true
        fe_netapp_netapp_cluster_setup_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "netapp/netapp_cluster_setup | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_netapp_netapp_cluster_setup_status: "failed"
        fe_netapp_netapp_cluster_setup_postflight_passed: false
        fe_netapp_netapp_cluster_setup_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_netapp_netapp_cluster_setup_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "netapp/netapp_cluster_setup | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          netapp/netapp_cluster_setup: FAILED at '{{ fe_netapp_netapp_cluster_setup_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_netapp_netapp_cluster_setup_error }}
      tags:
        - always
        - rescue

    - name: "netapp/netapp_cluster_setup | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          netapp/netapp_cluster_setup failed at '{{ fe_netapp_netapp_cluster_setup_failed_task }}': {{ fe_netapp_netapp_cluster_setup_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "netapp/netapp_cluster_setup | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_netapp_netapp_cluster_setup_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_netapp_netapp_cluster_setup_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_netapp_netapp_cluster_setup_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "netapp/netapp_cluster_setup | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "netapp/netapp_cluster_setup":
              component: "netapp/netapp_cluster_setup"
              type: "role"
              platform: "netapp"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_netapp_netapp_cluster_setup_status | default('unknown') }}"
              preflight_passed: "{{ fe_netapp_netapp_cluster_setup_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_netapp_netapp_cluster_setup_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_netapp_netapp_cluster_setup_started_at | default('') }}"
              ended_at: "{{ fe_netapp_netapp_cluster_setup_ended_at | default('') }}"
              duration_seconds: "{{ fe_netapp_netapp_cluster_setup_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_netapp_netapp_cluster_setup_failed_task | default('') }}"
              error: "{{ fe_netapp_netapp_cluster_setup_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_netapp_netapp_cluster_setup_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_netapp_netapp_cluster_setup_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_netapp_netapp_cluster_setup_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_netapp_netapp_cluster_setup_status | default('') == 'succeeded' else ['netapp/netapp_cluster_setup'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "netapp/netapp_cluster_setup | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_netapp_netapp_cluster_setup_stats_published: true
      tags:
        - always
