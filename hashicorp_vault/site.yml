            msg: >-
              hashicorp_vault/site#play2: FAILED at '{{ fe_hashicorp_vault_site_play2_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_hashicorp_vault_site_play2_error }}
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play2 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              hashicorp_vault/site#play2 failed at '{{ fe_hashicorp_vault_site_play2_failed_task }}': {{ fe_hashicorp_vault_site_play2_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "hashicorp_vault/site#play2 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play2_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_hashicorp_vault_site_play2_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_site_play2_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "hashicorp_vault/site#play2 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
