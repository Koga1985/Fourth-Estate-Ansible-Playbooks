---
# HashiCorp Vault Deployment Playbook
# Entry point for Vault automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Vault Server Installation
  hosts: vault_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  vars:
    deploy_install: true
    deploy_cluster: true
    deploy_ha: true

  tasks:
    - name: "hashicorp_vault/site#play1 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Vault Installation
          ansible.builtin.include_role:
            name: vault_install
          when: deploy_install | bool
          tags: ['install', 'phase1']

        - name: Phase 2 - Cluster Configuration
          ansible.builtin.include_role:
            name: vault_cluster
          when: deploy_cluster | bool
          tags: ['cluster', 'phase2']

        - name: Phase 3 - HA Configuration
          ansible.builtin.include_role:
            name: vault_ha_config
          when: deploy_ha | bool
          tags: ['ha', 'phase3']

      rescue:

        - name: "hashicorp_vault/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_status: "failed"
            fe_hashicorp_vault_site_play1_postflight_passed: false
            fe_hashicorp_vault_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_hashicorp_vault_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              hashicorp_vault/site#play1: FAILED at '{{ fe_hashicorp_vault_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_hashicorp_vault_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              hashicorp_vault/site#play1 failed at '{{ fe_hashicorp_vault_site_play1_failed_task }}': {{ fe_hashicorp_vault_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "hashicorp_vault/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_hashicorp_vault_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "hashicorp_vault/site#play1":
                  component: "hashicorp_vault/site#play1"
                  type: "playbook"
                  platform: "hashicorp_vault"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_hashicorp_vault_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_hashicorp_vault_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_hashicorp_vault_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_hashicorp_vault_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_hashicorp_vault_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_hashicorp_vault_site_play1_failed_task | default('') }}"
                  error: "{{ fe_hashicorp_vault_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else ['hashicorp_vault/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - fe_hashicorp_vault_site_play1_status | default('') == 'failed'
            - not (fe_hashicorp_vault_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_stats_published: true
          when:
            - fe_hashicorp_vault_site_play1_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "hashicorp_vault/site#play1 | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "hashicorp_vault/site#play1 | Initialize validation state"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_hashicorp_vault_site_play1_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_hashicorp_vault_site_play1_status: "running"
            fe_hashicorp_vault_site_play1_preflight_passed: false
            fe_hashicorp_vault_site_play1_postflight_passed: false
            fe_hashicorp_vault_site_play1_failed_task: ""
            fe_hashicorp_vault_site_play1_error: ""
            fe_hashicorp_vault_site_play1_stats_published: false
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              hashicorp_vault/site#play1: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              hashicorp_vault/site#play1: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "hashicorp_vault/site#play1 | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "hashicorp_vault/site#play1: required variable '{{ item }}' is not defined."
            success_msg: "hashicorp_vault/site#play1: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_hashicorp_vault_site_play1_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "hashicorp_vault/site#play1 | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "hashicorp_vault/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_status: "preflight_failed"
            fe_hashicorp_vault_site_play1_postflight_passed: false
            fe_hashicorp_vault_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_hashicorp_vault_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              hashicorp_vault/site#play1: FAILED at '{{ fe_hashicorp_vault_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_hashicorp_vault_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "hashicorp_vault/site#play1":
                  component: "hashicorp_vault/site#play1"
                  type: "playbook"
                  platform: "hashicorp_vault"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_hashicorp_vault_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_hashicorp_vault_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_hashicorp_vault_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_hashicorp_vault_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_hashicorp_vault_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_hashicorp_vault_site_play1_failed_task | default('') }}"
                  error: "{{ fe_hashicorp_vault_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else ['hashicorp_vault/site#play1'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_stats_published: true
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              hashicorp_vault/site#play1 failed at '{{ fe_hashicorp_vault_site_play1_failed_task }}': {{ fe_hashicorp_vault_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "hashicorp_vault/site#play1 | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              hashicorp_vault/site#play1: preflight
              {{ 'passed' if fe_hashicorp_vault_site_play1_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "hashicorp_vault/site#play1 | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "hashicorp_vault/site#play1 | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_hashicorp_vault_site_play1_preflight_passed | bool
              - fe_hashicorp_vault_site_play1_status in ['running', 'succeeded']
            fail_msg: >-
              hashicorp_vault/site#play1: postflight validation failed - preflight passed
              ={{ fe_hashicorp_vault_site_play1_preflight_passed | default(false) }},
              status={{ fe_hashicorp_vault_site_play1_status | default('unknown') }}.
            success_msg: "hashicorp_vault/site#play1: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "hashicorp_vault/site#play1 | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_postflight_passed: true
            fe_hashicorp_vault_site_play1_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "hashicorp_vault/site#play1 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_status: "failed"
            fe_hashicorp_vault_site_play1_postflight_passed: false
            fe_hashicorp_vault_site_play1_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_hashicorp_vault_site_play1_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              hashicorp_vault/site#play1: FAILED at '{{ fe_hashicorp_vault_site_play1_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_hashicorp_vault_site_play1_error }}
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play1 | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              hashicorp_vault/site#play1 failed at '{{ fe_hashicorp_vault_site_play1_failed_task }}': {{ fe_hashicorp_vault_site_play1_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "hashicorp_vault/site#play1 | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_hashicorp_vault_site_play1_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_site_play1_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "hashicorp_vault/site#play1":
                  component: "hashicorp_vault/site#play1"
                  type: "playbook"
                  platform: "hashicorp_vault"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_hashicorp_vault_site_play1_status | default('unknown') }}"
                  preflight_passed: "{{ fe_hashicorp_vault_site_play1_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_hashicorp_vault_site_play1_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_hashicorp_vault_site_play1_started_at | default('') }}"
                  ended_at: "{{ fe_hashicorp_vault_site_play1_ended_at | default('') }}"
                  duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_hashicorp_vault_site_play1_failed_task | default('') }}"
                  error: "{{ fe_hashicorp_vault_site_play1_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_hashicorp_vault_site_play1_status | default('') == 'succeeded' else ['hashicorp_vault/site#play1'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_hashicorp_vault_site_play1_stats_published | default(false) | bool)
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play1_stats_published: true
          tags:
            - always

        - name: "hashicorp_vault/site#play1 | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              hashicorp_vault/site#play1: {{ fe_hashicorp_vault_site_play1_status | default('unknown') }} in
              {{ fe_hashicorp_vault_site_play1_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always


- name: Vault Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_auth: true
    deploy_secrets: true
    deploy_policies: true
    deploy_pki: true
    deploy_database: true
    deploy_transit: true
    deploy_audit: true

  tasks:
    - name: "hashicorp_vault/site#play2 | Guarded execution with rescue and always handling"
      block:

        - name: Phase 4 - Auth Methods
          ansible.builtin.include_role:
            name: vault_auth_methods
          when: deploy_auth | bool
          tags: ['auth', 'phase4']

        - name: Phase 5 - Policies
          ansible.builtin.include_role:
            name: vault_policies
          when: deploy_policies | bool
          tags: ['policies', 'phase5']

        - name: Phase 6 - Secrets Engines
          ansible.builtin.include_role:
            name: vault_secrets_engine
          when: deploy_secrets | bool
          tags: ['secrets', 'phase6']

        - name: Phase 7 - PKI Secrets Engine
          ansible.builtin.include_role:
            name: vault_pki
          when: deploy_pki | bool
          tags: ['pki', 'phase7']

        - name: Phase 8 - Database Secrets
          ansible.builtin.include_role:
            name: vault_database_secrets
          when: deploy_database | bool
          tags: ['database', 'phase8']

        - name: Phase 9 - Transit Encryption
          ansible.builtin.include_role:
            name: vault_transit_encryption
          when: deploy_transit | bool
          tags: ['transit', 'phase9']

        - name: Phase 10 - Audit Logging
          ansible.builtin.include_role:
            name: vault_audit_logging
          when: deploy_audit | bool
          tags: ['audit', 'phase10']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== HashiCorp Vault Deployment Complete ==="
              - "Cluster: {{ vault_cluster_name | default('production-vault') }}"
              - "API Address: {{ vault_api_addr }}"
              - "TLS: {{ 'Enabled' if vault_tls_enabled | default(true) else 'Disabled' }}"
              - "Audit: {{ 'Enabled' if deploy_audit else 'Disabled' }}"
          tags: ['always']

      rescue:

        - name: "hashicorp_vault/site#play2 | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_hashicorp_vault_site_play2_status: "failed"
            fe_hashicorp_vault_site_play2_postflight_passed: false
            fe_hashicorp_vault_site_play2_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_hashicorp_vault_site_play2_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "hashicorp_vault/site#play2 | Rescue | Report the failure"
