---
# HashiCorp Vault HA Configuration Tasks
# Fourth Estate Production Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['hashicorp_vault/vault_ha_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_hashicorp_vault_vault_ha_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "hashicorp_vault/vault_ha_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_hashicorp_vault_vault_ha_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_hashicorp_vault_vault_ha_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_hashicorp_vault_vault_ha_config_status: "running"
    fe_hashicorp_vault_vault_ha_config_preflight_passed: false
    fe_hashicorp_vault_vault_ha_config_postflight_passed: false
    fe_hashicorp_vault_vault_ha_config_failed_task: ""
    fe_hashicorp_vault_vault_ha_config_error: ""
    fe_hashicorp_vault_vault_ha_config_stats_published: false
  tags:
    - always

- name: "hashicorp_vault/vault_ha_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "hashicorp_vault/vault_ha_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          hashicorp_vault/vault_ha_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          hashicorp_vault/vault_ha_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_ha_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "hashicorp_vault/vault_ha_config: required variable '{{ item }}' is not defined."
        success_msg: "hashicorp_vault/vault_ha_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_hashicorp_vault_vault_ha_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_ha_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_ha_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate HA configuration
      ansible.builtin.assert:
        that:
          - vault_ha_enabled | bool
          - vault_cluster_members | default([]) | length >= 3
        fail_msg: "HA requires at least 3 cluster members"
        quiet: true
      tags: [vault, ha, validate]

    - name: Check HA status
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/sys/ha-status"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        validate_certs: false
      register: ha_status
      when: vault_root_token is defined
      tags: [vault, ha, status]

    - name: Display HA status
      ansible.builtin.debug:
        msg:
          - "HA Enabled: {{ ha_status.json.ha_enabled | default('N/A') }}"
          - "Active Node: {{ ha_status.json.leader_address | default('N/A') }}"
          - "Active Cluster: {{ ha_status.json.cluster_id | default('N/A') }}"
      when: ha_status is defined and ha_status.json is defined
      tags: [vault, ha, status]

    - name: Configure HAProxy load balancer
      when:
        - vault_loadbalancer_enabled | bool
        - vault_loadbalancer_type == 'haproxy'
        - inventory_hostname in groups['loadbalancers'] | default([])
      block:
        - name: Install HAProxy
          ansible.builtin.package:
            name: haproxy
            state: present

        - name: Configure HAProxy for Vault
          ansible.builtin.template:
            src: haproxy.cfg.j2
            dest: /etc/haproxy/haproxy.cfg
            owner: root
            group: root
            mode: '0644'
            validate: 'haproxy -f %s -c'
          notify: restart haproxy

        - name: Enable and start HAProxy
          ansible.builtin.systemd:
            name: haproxy
            enabled: true
            state: started

      tags: [vault, ha, loadbalancer]

    - name: Configure request forwarding
      when: vault_request_forwarding_enabled | bool
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/sys/config/state/sanitized"
        method: GET
        validate_certs: false
      register: vault_config_state
      tags: [vault, ha, forwarding]

    - name: Enable performance standbys (Enterprise)
      when:
        - vault_enterprise | default(false) | bool
        - vault_performance_standby_enabled | bool
      block:
        - name: Configure performance standby
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/sys/replication/performance/primary/enable"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_root_token }}"
            validate_certs: false
          when:
            - vault_is_cluster_primary | default(false) | bool
            - vault_root_token is defined

      tags: [vault, ha, performance-standby]

    - name: Create HA monitoring script
      when: vault_ha_monitoring_enabled | bool
      ansible.builtin.template:
        src: vault-ha-monitor.sh.j2
        dest: /usr/local/bin/vault-ha-monitor.sh
        owner: root
        group: root
        mode: '0750'
      tags: [vault, ha, monitoring]

    - name: Configure HA monitoring cron
      when: vault_ha_monitoring_enabled | bool
      ansible.builtin.cron:
        name: "Vault HA monitoring"
        minute: "*/5"
        job: "/usr/local/bin/vault-ha-monitor.sh >> {{ vault_log_path }}/ha-monitor.log 2>&1"
        user: root
      tags: [vault, ha, monitoring]

    - name: Create HA backup script
      when: vault_ha_backup_enabled | bool
      ansible.builtin.template:
        src: vault-ha-backup.sh.j2
        dest: /usr/local/bin/vault-ha-backup.sh
        owner: root
        group: root
        mode: '0750'
      tags: [vault, ha, backup]

    - name: Configure HA backup cron
      when: vault_ha_backup_enabled | bool
      ansible.builtin.cron:
        name: "Vault HA backup"
        minute: "{{ vault_ha_backup_schedule.split()[0] }}"
        hour: "{{ vault_ha_backup_schedule.split()[1] }}"
        job: "/usr/local/bin/vault-ha-backup.sh >> {{ vault_log_path }}/ha-backup.log 2>&1"
        user: root
      tags: [vault, ha, backup]

    - name: Validate cluster quorum
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/sys/storage/raft/configuration"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        validate_certs: false
      register: raft_config
      when:
        - vault_root_token is defined
        - vault_storage_type | default('raft') == 'raft'
      tags: [vault, ha, quorum]

    - name: Display quorum status
      ansible.builtin.debug:
        msg: "Raft cluster has {{ raft_config.json.data.config.servers | length }} nodes"
      when:
        - raft_config is defined
        - raft_config.json is defined
      tags: [vault, ha, quorum]

    # ----------------------------- postflight -------------------

    - name: "hashicorp_vault/vault_ha_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_hashicorp_vault_vault_ha_config_preflight_passed | bool
          - fe_hashicorp_vault_vault_ha_config_status in ['running', 'succeeded']
        fail_msg: >-
          hashicorp_vault/vault_ha_config: postflight validation failed - preflight passed
          ={{ fe_hashicorp_vault_vault_ha_config_preflight_passed | default(false) }},
          status={{ fe_hashicorp_vault_vault_ha_config_status | default('unknown') }}.
        success_msg: "hashicorp_vault/vault_ha_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "hashicorp_vault/vault_ha_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_ha_config_postflight_passed: true
        fe_hashicorp_vault_vault_ha_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "hashicorp_vault/vault_ha_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_ha_config_status: "failed"
        fe_hashicorp_vault_vault_ha_config_postflight_passed: false
        fe_hashicorp_vault_vault_ha_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_hashicorp_vault_vault_ha_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_ha_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          hashicorp_vault/vault_ha_config: FAILED at '{{ fe_hashicorp_vault_vault_ha_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_hashicorp_vault_vault_ha_config_error }}
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_ha_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          hashicorp_vault/vault_ha_config failed at '{{ fe_hashicorp_vault_vault_ha_config_failed_task }}': {{ fe_hashicorp_vault_vault_ha_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "hashicorp_vault/vault_ha_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_ha_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_hashicorp_vault_vault_ha_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_vault_ha_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "hashicorp_vault/vault_ha_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "hashicorp_vault/vault_ha_config":
              component: "hashicorp_vault/vault_ha_config"
              type: "role"
              platform: "hashicorp_vault"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_hashicorp_vault_vault_ha_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_hashicorp_vault_vault_ha_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_hashicorp_vault_vault_ha_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_hashicorp_vault_vault_ha_config_started_at | default('') }}"
              ended_at: "{{ fe_hashicorp_vault_vault_ha_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_hashicorp_vault_vault_ha_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_hashicorp_vault_vault_ha_config_failed_task | default('') }}"
              error: "{{ fe_hashicorp_vault_vault_ha_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_vault_ha_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_hashicorp_vault_vault_ha_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_hashicorp_vault_vault_ha_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_hashicorp_vault_vault_ha_config_status | default('') == 'succeeded' else ['hashicorp_vault/vault_ha_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "hashicorp_vault/vault_ha_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_ha_config_stats_published: true
      tags:
        - always
