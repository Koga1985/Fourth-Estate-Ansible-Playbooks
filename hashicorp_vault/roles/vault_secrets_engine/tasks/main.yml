---
# HashiCorp Vault Secrets Engine Tasks
# Fourth Estate Production Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['hashicorp_vault/vault_secrets_engine']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_hashicorp_vault_vault_secrets_engine_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "hashicorp_vault/vault_secrets_engine | Initialize validation state"
  ansible.builtin.set_fact:
    fe_hashicorp_vault_vault_secrets_engine_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_hashicorp_vault_vault_secrets_engine_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_hashicorp_vault_vault_secrets_engine_status: "running"
    fe_hashicorp_vault_vault_secrets_engine_preflight_passed: false
    fe_hashicorp_vault_vault_secrets_engine_postflight_passed: false
    fe_hashicorp_vault_vault_secrets_engine_failed_task: ""
    fe_hashicorp_vault_vault_secrets_engine_error: ""
    fe_hashicorp_vault_vault_secrets_engine_stats_published: false
  tags:
    - always

- name: "hashicorp_vault/vault_secrets_engine | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "hashicorp_vault/vault_secrets_engine | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          hashicorp_vault/vault_secrets_engine: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          hashicorp_vault/vault_secrets_engine: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_secrets_engine | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "hashicorp_vault/vault_secrets_engine: required variable '{{ item }}' is not defined."
        success_msg: "hashicorp_vault/vault_secrets_engine: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_hashicorp_vault_vault_secrets_engine_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_secrets_engine | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_secrets_engine_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Enable KV v2 secrets engines
      community.hashi_vault.vault_write:
        url: "{{ vault_api_addr }}"
        ca_cert: "{{ vault_tls_ca_file }}"
        token: "{{ vault_root_token }}"
        path: "sys/mounts/{{ item.path }}"
        data:
          type: kv-v2
          description: "{{ item.description }}"
          config:
            max_versions: "{{ item.max_versions }}"
            cas_required: "{{ item.cas_required }}"
            delete_version_after: "{{ item.delete_version_after }}"
      no_log: true
      loop: "{{ vault_kv_engines }}"
      when: vault_root_token is defined
      tags: [vault, secrets, kv]

    - name: Enable SSH secrets engines
      community.hashi_vault.vault_write:
        url: "{{ vault_api_addr }}"
        ca_cert: "{{ vault_tls_ca_file }}"
        token: "{{ vault_root_token }}"
        path: "sys/mounts/{{ item.path }}"
        data:
          type: ssh
          description: "{{ item.description }}"
      no_log: true
      loop: "{{ vault_ssh_engines }}"
      when: vault_root_token is defined
      tags: [vault, secrets, ssh]

    - name: Generate SSH CA key
      when:
        - vault_ssh_ca_generate | bool
        - vault_root_token is defined
      block:
        - name: Generate SSH CA for each engine
          community.hashi_vault.vault_write:
            url: "{{ vault_api_addr }}"
            ca_cert: "{{ vault_tls_ca_file }}"
            token: "{{ vault_root_token }}"
            path: "{{ item.path }}/config/ca"
            data:
              generate_signing_key: true
              key_type: "{{ vault_ssh_ca_key_type }}"
              key_bits: "{{ vault_ssh_ca_key_bits }}"
          no_log: true
          loop: "{{ vault_ssh_engines }}"

        - name: Configure SSH CA roles
          community.hashi_vault.vault_write:
            url: "{{ vault_api_addr }}"
            ca_cert: "{{ vault_tls_ca_file }}"
            token: "{{ vault_root_token }}"
            path: "{{ item.0.path }}/roles/{{ item.1.name }}"
            data:
              key_type: "ca"
              ttl: "{{ item.1.ttl | default(item.0.ttl) }}"
              max_ttl: "{{ item.1.max_ttl | default(item.0.max_ttl) }}"
              allowed_users: "{{ item.1.allowed_users | default(item.0.allowed_users) }}"
              default_user: "{{ item.1.default_user | default(item.0.default_user) }}"
              allow_user_certificates: true
          no_log: true
          loop: "{{ vault_ssh_engines | subelements('roles', skip_missing=True) }}"

      tags: [vault, secrets, ssh, ca]

    - name: Enable TOTP secrets engines
      community.hashi_vault.vault_write:
        url: "{{ vault_api_addr }}"
        ca_cert: "{{ vault_tls_ca_file }}"
        token: "{{ vault_root_token }}"
        path: "sys/mounts/{{ item.path }}"
        data:
          type: totp
          description: "{{ item.description }}"
      no_log: true
      loop: "{{ vault_totp_engines }}"
      when: vault_root_token is defined
      tags: [vault, secrets, totp]

    - name: Create namespaces (Enterprise)
      when:
        - vault_enterprise | default(false) | bool
        - vault_secrets_namespaces | length > 0
        - vault_root_token is defined
      block:
        - name: Create namespace
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/sys/namespaces/{{ item.name }}"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_root_token }}"
            validate_certs: false
            status_code: [200, 204]
          loop: "{{ vault_secrets_namespaces }}"

      tags: [vault, secrets, namespaces]

    - name: List enabled secrets engines
      community.hashi_vault.vault_read:
        url: "{{ vault_api_addr }}"
        ca_cert: "{{ vault_tls_ca_file }}"
        token: "{{ vault_root_token }}"
        path: "sys/mounts"
      no_log: true
      register: vault_mounts
      when: vault_root_token is defined
      tags: [vault, secrets, list]

    - name: Display enabled secrets engines
      ansible.builtin.debug:
        msg: "Enabled secrets engines: {{ vault_mounts.data.keys() | list }}"
      when:
        - vault_mounts is defined
        - vault_mounts.data is defined
      tags: [vault, secrets, list]

    # ----------------------------- postflight -------------------

    - name: "hashicorp_vault/vault_secrets_engine | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_hashicorp_vault_vault_secrets_engine_preflight_passed | bool
          - fe_hashicorp_vault_vault_secrets_engine_status in ['running', 'succeeded']
        fail_msg: >-
          hashicorp_vault/vault_secrets_engine: postflight validation failed - preflight passed
          ={{ fe_hashicorp_vault_vault_secrets_engine_preflight_passed | default(false) }},
          status={{ fe_hashicorp_vault_vault_secrets_engine_status | default('unknown') }}.
        success_msg: "hashicorp_vault/vault_secrets_engine: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "hashicorp_vault/vault_secrets_engine | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_secrets_engine_postflight_passed: true
        fe_hashicorp_vault_vault_secrets_engine_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "hashicorp_vault/vault_secrets_engine | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_secrets_engine_status: "failed"
        fe_hashicorp_vault_vault_secrets_engine_postflight_passed: false
        fe_hashicorp_vault_vault_secrets_engine_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_hashicorp_vault_vault_secrets_engine_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_secrets_engine | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          hashicorp_vault/vault_secrets_engine: FAILED at '{{ fe_hashicorp_vault_vault_secrets_engine_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_hashicorp_vault_vault_secrets_engine_error }}
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_secrets_engine | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          hashicorp_vault/vault_secrets_engine failed at '{{ fe_hashicorp_vault_vault_secrets_engine_failed_task }}': {{ fe_hashicorp_vault_vault_secrets_engine_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "hashicorp_vault/vault_secrets_engine | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_secrets_engine_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_hashicorp_vault_vault_secrets_engine_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_vault_secrets_engine_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "hashicorp_vault/vault_secrets_engine | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "hashicorp_vault/vault_secrets_engine":
              component: "hashicorp_vault/vault_secrets_engine"
              type: "role"
              platform: "hashicorp_vault"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_hashicorp_vault_vault_secrets_engine_status | default('unknown') }}"
              preflight_passed: "{{ fe_hashicorp_vault_vault_secrets_engine_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_hashicorp_vault_vault_secrets_engine_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_hashicorp_vault_vault_secrets_engine_started_at | default('') }}"
              ended_at: "{{ fe_hashicorp_vault_vault_secrets_engine_ended_at | default('') }}"
              duration_seconds: "{{ fe_hashicorp_vault_vault_secrets_engine_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_hashicorp_vault_vault_secrets_engine_failed_task | default('') }}"
              error: "{{ fe_hashicorp_vault_vault_secrets_engine_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_vault_secrets_engine_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_hashicorp_vault_vault_secrets_engine_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_hashicorp_vault_vault_secrets_engine_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_hashicorp_vault_vault_secrets_engine_status | default('') == 'succeeded' else ['hashicorp_vault/vault_secrets_engine'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "hashicorp_vault/vault_secrets_engine | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_secrets_engine_stats_published: true
      tags:
        - always
