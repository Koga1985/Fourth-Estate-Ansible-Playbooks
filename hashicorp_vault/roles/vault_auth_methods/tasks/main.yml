---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['hashicorp_vault/vault_auth_methods']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_hashicorp_vault_vault_auth_methods_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "hashicorp_vault/vault_auth_methods | Initialize validation state"
  ansible.builtin.set_fact:
    fe_hashicorp_vault_vault_auth_methods_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_hashicorp_vault_vault_auth_methods_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_hashicorp_vault_vault_auth_methods_status: "running"
    fe_hashicorp_vault_vault_auth_methods_preflight_passed: false
    fe_hashicorp_vault_vault_auth_methods_postflight_passed: false
    fe_hashicorp_vault_vault_auth_methods_failed_task: ""
    fe_hashicorp_vault_vault_auth_methods_error: ""
    fe_hashicorp_vault_vault_auth_methods_stats_published: false
  tags:
    - always

- name: "hashicorp_vault/vault_auth_methods | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "hashicorp_vault/vault_auth_methods | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          hashicorp_vault/vault_auth_methods: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          hashicorp_vault/vault_auth_methods: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_auth_methods | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "hashicorp_vault/vault_auth_methods: required variable '{{ item }}' is not defined."
        success_msg: "hashicorp_vault/vault_auth_methods: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_hashicorp_vault_vault_auth_methods_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "hashicorp_vault/vault_auth_methods | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_auth_methods_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: "hashicorp_vault/vault_auth_methods | No tasks are defined for this component"
      ansible.builtin.debug:
        msg: "hashicorp_vault/vault_auth_methods: nothing to execute; the component is a placeholder."
      tags:
        - always

    # ----------------------------- postflight -------------------

    - name: "hashicorp_vault/vault_auth_methods | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_hashicorp_vault_vault_auth_methods_preflight_passed | bool
          - fe_hashicorp_vault_vault_auth_methods_status in ['running', 'succeeded']
        fail_msg: >-
          hashicorp_vault/vault_auth_methods: postflight validation failed - preflight passed
          ={{ fe_hashicorp_vault_vault_auth_methods_preflight_passed | default(false) }},
          status={{ fe_hashicorp_vault_vault_auth_methods_status | default('unknown') }}.
        success_msg: "hashicorp_vault/vault_auth_methods: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "hashicorp_vault/vault_auth_methods | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_auth_methods_postflight_passed: true
        fe_hashicorp_vault_vault_auth_methods_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "hashicorp_vault/vault_auth_methods | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_auth_methods_status: "failed"
        fe_hashicorp_vault_vault_auth_methods_postflight_passed: false
        fe_hashicorp_vault_vault_auth_methods_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_hashicorp_vault_vault_auth_methods_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_auth_methods | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          hashicorp_vault/vault_auth_methods: FAILED at '{{ fe_hashicorp_vault_vault_auth_methods_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_hashicorp_vault_vault_auth_methods_error }}
      tags:
        - always
        - rescue

    - name: "hashicorp_vault/vault_auth_methods | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          hashicorp_vault/vault_auth_methods failed at '{{ fe_hashicorp_vault_vault_auth_methods_failed_task }}': {{ fe_hashicorp_vault_vault_auth_methods_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "hashicorp_vault/vault_auth_methods | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_auth_methods_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_hashicorp_vault_vault_auth_methods_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_hashicorp_vault_vault_auth_methods_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "hashicorp_vault/vault_auth_methods | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "hashicorp_vault/vault_auth_methods":
              component: "hashicorp_vault/vault_auth_methods"
              type: "role"
              platform: "hashicorp_vault"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_hashicorp_vault_vault_auth_methods_status | default('unknown') }}"
              preflight_passed: "{{ fe_hashicorp_vault_vault_auth_methods_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_hashicorp_vault_vault_auth_methods_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_hashicorp_vault_vault_auth_methods_started_at | default('') }}"
              ended_at: "{{ fe_hashicorp_vault_vault_auth_methods_ended_at | default('') }}"
              duration_seconds: "{{ fe_hashicorp_vault_vault_auth_methods_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_hashicorp_vault_vault_auth_methods_failed_task | default('') }}"
              error: "{{ fe_hashicorp_vault_vault_auth_methods_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_hashicorp_vault_vault_auth_methods_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_hashicorp_vault_vault_auth_methods_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_hashicorp_vault_vault_auth_methods_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_hashicorp_vault_vault_auth_methods_status | default('') == 'succeeded' else ['hashicorp_vault/vault_auth_methods'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "hashicorp_vault/vault_auth_methods | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_hashicorp_vault_vault_auth_methods_stats_published: true
      tags:
        - always
