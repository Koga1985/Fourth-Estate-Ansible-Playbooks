---
# F5 BIG-IP SSL Certificate Management Tasks
# Fourth Estate Production Standards

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['f5_bigip/f5_bigip_ssl']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_f5_bigip_f5_bigip_ssl_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "f5_bigip/f5_bigip_ssl | Initialize validation state"
  ansible.builtin.set_fact:
    fe_f5_bigip_f5_bigip_ssl_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_f5_bigip_f5_bigip_ssl_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_f5_bigip_f5_bigip_ssl_status: "running"
    fe_f5_bigip_f5_bigip_ssl_preflight_passed: false
    fe_f5_bigip_f5_bigip_ssl_postflight_passed: false
    fe_f5_bigip_f5_bigip_ssl_failed_task: ""
    fe_f5_bigip_f5_bigip_ssl_error: ""
    fe_f5_bigip_f5_bigip_ssl_stats_published: false
  tags:
    - always

- name: "f5_bigip/f5_bigip_ssl | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "f5_bigip/f5_bigip_ssl | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          f5_bigip/f5_bigip_ssl: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          f5_bigip/f5_bigip_ssl: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_ssl | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "f5_bigip/f5_bigip_ssl: required variable '{{ item }}' is not defined."
        success_msg: "f5_bigip/f5_bigip_ssl: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_f5_bigip_f5_bigip_ssl_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_ssl | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_ssl_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Import SSL Certificates and Keys
      f5networks.f5_modules.bigip_ssl_certificate:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        content: "{{ item.cert_content }}"
        partition: "{{ item.partition | default('Common') }}"
        state: present
      loop: "{{ f5_bigip_ssl_certificates }}"
      when: f5_bigip_ssl_certificates is defined and f5_bigip_ssl_certificates | length > 0
      no_log: true
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_certificates

    - name: Import SSL Private Keys
      f5networks.f5_modules.bigip_ssl_key:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        content: "{{ item.key_content }}"
        passphrase: "{{ item.passphrase | default(omit) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: present
      loop: "{{ f5_bigip_ssl_certificates }}"
      when:
        - f5_bigip_ssl_certificates is defined
        - f5_bigip_ssl_certificates | length > 0
        - item.key_content is defined
      no_log: true
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_keys

    - name: Import CA Certificate Bundles
      f5networks.f5_modules.bigip_ssl_certificate:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        content: "{{ item.bundle_content }}"
        partition: "{{ item.partition | default('Common') }}"
        state: present
      loop: "{{ f5_bigip_ssl_cert_bundles }}"
      when: f5_bigip_ssl_cert_bundles is defined and f5_bigip_ssl_cert_bundles | length > 0
      no_log: true
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_ca_bundles

    - name: Create Client SSL Profiles
      f5networks.f5_modules.bigip_profile_client_ssl:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        parent: "{{ item.parent | default('clientssl') }}"
        cert_key_chain: "{{ item.cert_key_chain | default(omit) }}"
        ciphers: "{{ item.ciphers | default(f5_bigip_ssl_default_ciphers) }}"
        options: "{{ item.options | default(f5_bigip_ssl_protocols) }}"
        secure_renegotiation: "{{ item.secure_renegotiation | default(f5_bigip_ssl_secure_renegotiation) }}"
        sni_default: "{{ item.sni_default | default(false) }}"
        sni_require: "{{ item.sni_require | default(f5_bigip_sni_require) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: present
      loop: "{{ f5_bigip_client_ssl_profiles }}"
      when: f5_bigip_client_ssl_profiles is defined and f5_bigip_client_ssl_profiles | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_client_ssl_profiles

    - name: Create Server SSL Profiles
      f5networks.f5_modules.bigip_profile_server_ssl:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        parent: "{{ item.parent | default('serverssl') }}"
        ciphers: "{{ item.ciphers | default(f5_bigip_ssl_default_ciphers) }}"
        options: "{{ item.options | default(f5_bigip_ssl_protocols) }}"
        peer_cert_mode: "{{ item.peer_cert_mode | default('ignore') }}"
        secure_renegotiation: "{{ item.secure_renegotiation | default(f5_bigip_ssl_secure_renegotiation) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: present
      loop: "{{ f5_bigip_server_ssl_profiles }}"
      when: f5_bigip_server_ssl_profiles is defined and f5_bigip_server_ssl_profiles | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_server_ssl_profiles

    - name: Configure OCSP Stapling
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify ltm profile client-ssl {{ item.name }} ocsp-stapling enabled"
      loop: "{{ f5_bigip_client_ssl_profiles }}"
      when:
        - f5_bigip_ocsp_enabled | bool
        - f5_bigip_ocsp_stapling | bool
        - f5_bigip_client_ssl_profiles is defined
      notify: Save F5 Configuration
      tags:
        - f5_ssl
        - f5_ocsp

    - name: Check SSL Certificate Expiration
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "run /sys crypto check-cert {{ item.name }}.crt"
      loop: "{{ f5_bigip_ssl_certificates }}"
      when: f5_bigip_ssl_certificates is defined and f5_bigip_ssl_certificates | length > 0
      register: f5_cert_check
      changed_when: false
      failed_when: false
      tags:
        - f5_ssl
        - f5_cert_check

    - name: Display Certificate Expiration Information
      ansible.builtin.debug:
        msg: "Certificate {{ item.item.name }}: {{ item.stdout_lines | default('Unable to check') }}"
      loop: "{{ f5_cert_check.results }}"
      when:
        - f5_cert_check is defined
        - f5_cert_check.results is defined
      loop_control:
        label: "{{ item.item.name }}"
      tags:
        - f5_ssl
        - f5_cert_check

    - name: Verify SSL Profile Configuration
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "list ltm profile client-ssl"
          - "list ltm profile server-ssl"
      register: f5_ssl_profiles_output
      changed_when: false
      tags:
        - f5_ssl
        - f5_verify

    - name: Ensure Configuration is Saved
      f5networks.f5_modules.bigip_config:
        provider: "{{ f5_bigip_provider }}"
        save: true
      when: f5_bigip_save_config | bool
      tags:
        - f5_ssl
        - f5_save

    # ----------------------------- postflight -------------------

    - name: "f5_bigip/f5_bigip_ssl | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_f5_bigip_f5_bigip_ssl_preflight_passed | bool
          - fe_f5_bigip_f5_bigip_ssl_status in ['running', 'succeeded']
        fail_msg: >-
          f5_bigip/f5_bigip_ssl: postflight validation failed - preflight passed
          ={{ fe_f5_bigip_f5_bigip_ssl_preflight_passed | default(false) }},
          status={{ fe_f5_bigip_f5_bigip_ssl_status | default('unknown') }}.
        success_msg: "f5_bigip/f5_bigip_ssl: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "f5_bigip/f5_bigip_ssl | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_ssl_postflight_passed: true
        fe_f5_bigip_f5_bigip_ssl_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "f5_bigip/f5_bigip_ssl | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_ssl_status: "failed"
        fe_f5_bigip_f5_bigip_ssl_postflight_passed: false
        fe_f5_bigip_f5_bigip_ssl_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_f5_bigip_f5_bigip_ssl_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_ssl | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          f5_bigip/f5_bigip_ssl: FAILED at '{{ fe_f5_bigip_f5_bigip_ssl_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_f5_bigip_f5_bigip_ssl_error }}
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_ssl | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          f5_bigip/f5_bigip_ssl failed at '{{ fe_f5_bigip_f5_bigip_ssl_failed_task }}': {{ fe_f5_bigip_f5_bigip_ssl_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "f5_bigip/f5_bigip_ssl | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_ssl_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_f5_bigip_f5_bigip_ssl_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_f5_bigip_ssl_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "f5_bigip/f5_bigip_ssl | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "f5_bigip/f5_bigip_ssl":
              component: "f5_bigip/f5_bigip_ssl"
              type: "role"
              platform: "f5_bigip"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_f5_bigip_f5_bigip_ssl_status | default('unknown') }}"
              preflight_passed: "{{ fe_f5_bigip_f5_bigip_ssl_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_f5_bigip_f5_bigip_ssl_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_f5_bigip_f5_bigip_ssl_started_at | default('') }}"
              ended_at: "{{ fe_f5_bigip_f5_bigip_ssl_ended_at | default('') }}"
              duration_seconds: "{{ fe_f5_bigip_f5_bigip_ssl_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_f5_bigip_f5_bigip_ssl_failed_task | default('') }}"
              error: "{{ fe_f5_bigip_f5_bigip_ssl_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_f5_bigip_f5_bigip_ssl_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_f5_bigip_f5_bigip_ssl_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_f5_bigip_f5_bigip_ssl_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_f5_bigip_f5_bigip_ssl_status | default('') == 'succeeded' else ['f5_bigip/f5_bigip_ssl'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "f5_bigip/f5_bigip_ssl | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_ssl_stats_published: true
      tags:
        - always
