---
# F5 BIG-IP Node Management Tasks
# Fourth Estate Production Standards

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['f5_bigip/f5_bigip_node']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_f5_bigip_f5_bigip_node_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "f5_bigip/f5_bigip_node | Initialize validation state"
  ansible.builtin.set_fact:
    fe_f5_bigip_f5_bigip_node_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_f5_bigip_f5_bigip_node_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_f5_bigip_f5_bigip_node_status: "running"
    fe_f5_bigip_f5_bigip_node_preflight_passed: false
    fe_f5_bigip_f5_bigip_node_postflight_passed: false
    fe_f5_bigip_f5_bigip_node_failed_task: ""
    fe_f5_bigip_f5_bigip_node_error: ""
    fe_f5_bigip_f5_bigip_node_stats_published: false
  tags:
    - always

- name: "f5_bigip/f5_bigip_node | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "f5_bigip/f5_bigip_node | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          f5_bigip/f5_bigip_node: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          f5_bigip/f5_bigip_node: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_node | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "f5_bigip/f5_bigip_node: required variable '{{ item }}' is not defined."
        success_msg: "f5_bigip/f5_bigip_node: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_f5_bigip_f5_bigip_node_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_node | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_node_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create or Update IP-Based Nodes
      f5networks.f5_modules.bigip_node:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        address: "{{ item.address | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        monitors: "{{ item.monitor | default(f5_bigip_node_monitor_default) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: "{{ item.state | default('present') }}"
        session: "{{ item.session | default(f5_bigip_node_session_default) }}"
        connection_limit: "{{ item.connection_limit | default(f5_bigip_node_connection_limit) }}"
        rate_limit: "{{ item.rate_limit | default(f5_bigip_node_rate_limit) }}"
        ratio: "{{ item.ratio | default(f5_bigip_node_ratio_default) }}"
      loop: "{{ f5_bigip_nodes }}"
      when:
        - f5_bigip_nodes is defined
        - f5_bigip_nodes | length > 0
        - item.address is defined
      notify: Save F5 Configuration
      tags:
        - f5_nodes
        - f5_backend

    - name: Create or Update FQDN-Based Nodes
      f5networks.f5_modules.bigip_node:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        fqdn: "{{ item.fqdn }}"
        fqdn_auto_populate: "{{ item.fqdn_auto_populate | default(true) }}"
        fqdn_address_type: "{{ item.fqdn_address_type | default('ipv4') }}"
        fqdn_down_interval: "{{ item.fqdn_down_interval | default(5) }}"
        fqdn_up_interval: "{{ item.fqdn_up_interval | default(3600) }}"
        description: "{{ item.description | default(omit) }}"
        monitors: "{{ item.monitor | default(f5_bigip_node_monitor_default) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ f5_bigip_nodes }}"
      when:
        - f5_bigip_nodes is defined
        - f5_bigip_nodes | length > 0
        - item.fqdn is defined
      notify: Save F5 Configuration
      tags:
        - f5_nodes
        - f5_fqdn_nodes

    - name: Create FQDN Nodes from Dedicated List
      f5networks.f5_modules.bigip_node:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        fqdn: "{{ item.fqdn }}"
        fqdn_auto_populate: "{{ item.fqdn_auto_populate | default(true) }}"
        fqdn_address_type: "{{ item.fqdn_address_type | default('ipv4') }}"
        fqdn_down_interval: "{{ item.fqdn_down_interval | default(5) }}"
        fqdn_up_interval: "{{ item.fqdn_up_interval | default(3600) }}"
        description: "{{ item.description | default(omit) }}"
        monitors: "{{ item.monitor | default(f5_bigip_node_monitor_default) }}"
        partition: "{{ item.partition | default('Common') }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ f5_bigip_fqdn_nodes }}"
      when: f5_bigip_fqdn_nodes is defined and f5_bigip_fqdn_nodes | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_nodes
        - f5_fqdn_nodes

    - name: Set Node State (Enable/Disable/Force Offline)
      f5networks.f5_modules.bigip_node:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        session: "{{ item.session | default(f5_bigip_node_session_default) }}"
        monitor_state: "{{ item.monitor_state | default(f5_bigip_node_state_default) }}"
        partition: "{{ item.partition | default('Common') }}"
      loop: "{{ f5_bigip_nodes }}"
      when:
        - f5_bigip_nodes is defined
        - f5_bigip_nodes | length > 0
        - item.session is defined or item.monitor_state is defined
      notify: Save F5 Configuration
      tags:
        - f5_nodes
        - f5_node_state

    - name: Query Node Status
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "show ltm node"
      register: f5_node_status
      changed_when: false
      tags:
        - f5_nodes
        - f5_verify

    - name: Display Node Status
      ansible.builtin.debug:
        var: f5_node_status.stdout_lines
      when: f5_node_status is defined
      tags:
        - f5_nodes
        - f5_verify

    - name: Ensure Configuration is Saved
      f5networks.f5_modules.bigip_config:
        provider: "{{ f5_bigip_provider }}"
        save: true
      when: f5_bigip_save_config | bool
      tags:
        - f5_nodes
        - f5_save

    # ----------------------------- postflight -------------------

    - name: "f5_bigip/f5_bigip_node | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_f5_bigip_f5_bigip_node_preflight_passed | bool
          - fe_f5_bigip_f5_bigip_node_status in ['running', 'succeeded']
        fail_msg: >-
          f5_bigip/f5_bigip_node: postflight validation failed - preflight passed
          ={{ fe_f5_bigip_f5_bigip_node_preflight_passed | default(false) }},
          status={{ fe_f5_bigip_f5_bigip_node_status | default('unknown') }}.
        success_msg: "f5_bigip/f5_bigip_node: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "f5_bigip/f5_bigip_node | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_node_postflight_passed: true
        fe_f5_bigip_f5_bigip_node_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "f5_bigip/f5_bigip_node | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_node_status: "failed"
        fe_f5_bigip_f5_bigip_node_postflight_passed: false
        fe_f5_bigip_f5_bigip_node_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_f5_bigip_f5_bigip_node_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_node | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          f5_bigip/f5_bigip_node: FAILED at '{{ fe_f5_bigip_f5_bigip_node_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_f5_bigip_f5_bigip_node_error }}
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_node | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          f5_bigip/f5_bigip_node failed at '{{ fe_f5_bigip_f5_bigip_node_failed_task }}': {{ fe_f5_bigip_f5_bigip_node_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "f5_bigip/f5_bigip_node | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_node_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_f5_bigip_f5_bigip_node_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_f5_bigip_node_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "f5_bigip/f5_bigip_node | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "f5_bigip/f5_bigip_node":
              component: "f5_bigip/f5_bigip_node"
              type: "role"
              platform: "f5_bigip"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_f5_bigip_f5_bigip_node_status | default('unknown') }}"
              preflight_passed: "{{ fe_f5_bigip_f5_bigip_node_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_f5_bigip_f5_bigip_node_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_f5_bigip_f5_bigip_node_started_at | default('') }}"
              ended_at: "{{ fe_f5_bigip_f5_bigip_node_ended_at | default('') }}"
              duration_seconds: "{{ fe_f5_bigip_f5_bigip_node_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_f5_bigip_f5_bigip_node_failed_task | default('') }}"
              error: "{{ fe_f5_bigip_f5_bigip_node_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_f5_bigip_f5_bigip_node_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_f5_bigip_f5_bigip_node_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_f5_bigip_f5_bigip_node_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_f5_bigip_f5_bigip_node_status | default('') == 'succeeded' else ['f5_bigip/f5_bigip_node'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "f5_bigip/f5_bigip_node | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_node_stats_published: true
      tags:
        - always
