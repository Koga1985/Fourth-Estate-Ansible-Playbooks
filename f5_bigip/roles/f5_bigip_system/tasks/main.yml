---
# F5 BIG-IP System Configuration Tasks
# Fourth Estate Production Standards

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['f5_bigip/f5_bigip_system']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_f5_bigip_f5_bigip_system_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "f5_bigip/f5_bigip_system | Initialize validation state"
  ansible.builtin.set_fact:
    fe_f5_bigip_f5_bigip_system_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_f5_bigip_f5_bigip_system_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_f5_bigip_f5_bigip_system_status: "running"
    fe_f5_bigip_f5_bigip_system_preflight_passed: false
    fe_f5_bigip_f5_bigip_system_postflight_passed: false
    fe_f5_bigip_f5_bigip_system_failed_task: ""
    fe_f5_bigip_f5_bigip_system_error: ""
    fe_f5_bigip_f5_bigip_system_stats_published: false
  tags:
    - always

- name: "f5_bigip/f5_bigip_system | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "f5_bigip/f5_bigip_system | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          f5_bigip/f5_bigip_system: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          f5_bigip/f5_bigip_system: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_system | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "f5_bigip/f5_bigip_system: required variable '{{ item }}' is not defined."
        success_msg: "f5_bigip/f5_bigip_system: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_f5_bigip_f5_bigip_system_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_system | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_system_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set System Hostname
      f5networks.f5_modules.bigip_hostname:
        provider: "{{ f5_bigip_provider }}"
        hostname: "{{ f5_bigip_hostname }}"
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_hostname

    - name: Configure DNS Settings
      f5networks.f5_modules.bigip_device_dns:
        provider: "{{ f5_bigip_provider }}"
        name_servers: "{{ f5_bigip_dns_nameservers }}"
        search: "{{ f5_bigip_dns_search_domains }}"
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_dns

    - name: Configure NTP Servers
      f5networks.f5_modules.bigip_device_ntp:
        provider: "{{ f5_bigip_provider }}"
        ntp_servers: "{{ f5_bigip_ntp_servers }}"
        timezone: "{{ f5_bigip_timezone }}"
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_ntp

    - name: Configure SNMP Contact and Location
      f5networks.f5_modules.bigip_snmp:
        provider: "{{ f5_bigip_provider }}"
        contact: "{{ f5_bigip_snmp_contact }}"
        location: "{{ f5_bigip_snmp_location }}"
      when: f5_bigip_snmp_enabled | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_snmp

    - name: Configure SNMPv3 Users
      f5networks.f5_modules.bigip_snmp_trap:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        snmp_version: "3"
        community: "{{ item.name }}"
        destination: "{{ item.destination | default(omit) }}"
      no_log: true
      loop: "{{ f5_bigip_snmp_v3_users }}"
      when:
        - f5_bigip_snmp_enabled | bool
        - f5_bigip_snmp_v3_enabled | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_snmp

    - name: Configure SNMP Allowed Addresses
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify sys snmp allowed-addresses replace-all-with { {{ f5_bigip_snmp_allowed_addresses | join(' ') }} }"
      when:
        - f5_bigip_snmp_enabled | bool
        - f5_bigip_snmp_allowed_addresses is defined
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_snmp

    - name: Configure Syslog Remote Servers
      f5networks.f5_modules.bigip_remote_syslog:
        provider: "{{ f5_bigip_provider }}"
        remote_host: "{{ item.host }}"
        remote_port: "{{ item.port | default(514) }}"
      loop: "{{ f5_bigip_syslog_servers }}"
      when: f5_bigip_syslog_enabled | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_syslog

    - name: Configure SSH Access
      f5networks.f5_modules.bigip_device_sshd:
        provider: "{{ f5_bigip_provider }}"
        banner: enabled
        banner_text: "{{ f5_bigip_ssh_banner }}"
        inactivity_timeout: "{{ f5_bigip_ssh_timeout }}"
        allow: "{{ f5_bigip_ssh_access_addresses }}"
      when: f5_bigip_ssh_enabled | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_ssh
        - f5_hardening

    - name: Configure HTTPD (GUI) Settings
      f5networks.f5_modules.bigip_device_httpd:
        provider: "{{ f5_bigip_provider }}"
        auth_pam_idle_timeout: 1200
        ssl_port: "{{ f5_bigip_httpd_ssl_port }}"
        ssl_protocols: "{{ f5_bigip_httpd_ssl_protocol }}"
        ssl_cipher_suite: "{{ f5_bigip_httpd_ssl_ciphersuite }}"
        redirect_http_to_https: "{{ f5_bigip_httpd_redirect_http_to_https | bool }}"
      when: f5_bigip_httpd_enabled | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_httpd
        - f5_hardening

    - name: Configure HTTPD Allowed Addresses
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify sys httpd allow replace-all-with { {{ f5_bigip_httpd_allow_addresses | join(' ') }} }"
      when:
        - f5_bigip_httpd_enabled | bool
        - f5_bigip_httpd_allow_addresses is defined
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_httpd
        - f5_hardening

    - name: Configure System Database Variables
      f5networks.f5_modules.bigip_sys_db:
        provider: "{{ f5_bigip_provider }}"
        key: "{{ item.name }}"
        value: "{{ item.value }}"
      loop: "{{ f5_bigip_db_variables }}"
      when: f5_bigip_db_variables is defined
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_performance

    - name: Configure Global Settings
      f5networks.f5_modules.bigip_sys_global:
        provider: "{{ f5_bigip_provider }}"
        gui_setup: disabled
        security_banner: "{{ f5_bigip_gui_security_banner | bool }}"
        banner_text: "{{ f5_bigip_gui_security_banner_text }}"
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_security

    - name: Configure Auto Phone Home (Disable)
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify sys software update auto-check disabled"
          - "modify sys software update auto-phonehome disabled"
      when: not f5_bigip_auto_check_updates | bool
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_security

    - name: Create Additional Admin Users
      f5networks.f5_modules.bigip_user:
        provider: "{{ f5_bigip_provider }}"
        username_credential: "{{ item.username }}"
        password_credential: "{{ item.password }}"
        partition_access: "{{ item.partition_access }}"
        shell: "{{ item.shell | default('tmsh') }}"
        update_password: on_create
      loop: "{{ f5_bigip_admin_users }}"
      when: f5_bigip_admin_users is defined and f5_bigip_admin_users | length > 0
      no_log: true
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_users

    - name: Configure Password Policy
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify auth password-policy minimum-length {{ f5_bigip_password_policy.min_length }}"
          - "modify auth password-policy required-lowercase {{ f5_bigip_password_policy.required_lowercase }}"
          - "modify auth password-policy required-uppercase {{ f5_bigip_password_policy.required_uppercase }}"
          - "modify auth password-policy required-numeric {{ f5_bigip_password_policy.required_numeric }}"
          - "modify auth password-policy required-special {{ f5_bigip_password_policy.required_special }}"
          - "modify auth password-policy max-duration {{ f5_bigip_password_policy.max_age }}"
          - "modify auth password-policy min-duration {{ f5_bigip_password_policy.min_age }}"
          - "modify auth password-policy password-memory {{ f5_bigip_password_policy.history }}"
          - "modify auth password-policy max-login-failures {{ f5_bigip_password_policy.max_login_failures }}"
          - "modify auth password-policy lockout-duration {{ f5_bigip_password_policy.lockout_duration }}"
      notify: Save F5 Configuration
      tags:
        - f5_system
        - f5_security
        - f5_password_policy

    - name: Apply F5 License
      f5networks.f5_modules.bigip_device_license:
        provider: "{{ f5_bigip_provider }}"
        license_key: "{{ f5_bigip_license_key }}"
      no_log: true
      when:
        - f5_bigip_license_key is defined
        - f5_bigip_license_key != ""
      tags:
        - f5_system
        - f5_license
        - never

    - name: Verify License Status
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "show sys license"
      register: f5_license_output
      when: f5_bigip_license_check | bool
      changed_when: false
      tags:
        - f5_system
        - f5_license

    - name: Display License Information
      ansible.builtin.debug:
        var: f5_license_output.stdout_lines
      when:
        - f5_bigip_license_check | bool
        - f5_license_output is defined
      tags:
        - f5_system
        - f5_license

    - name: Ensure Configuration is Saved
      f5networks.f5_modules.bigip_config:
        provider: "{{ f5_bigip_provider }}"
        save: true
      when: f5_bigip_save_config | bool
      tags:
        - f5_system
        - f5_save

    # ----------------------------- postflight -------------------

    - name: "f5_bigip/f5_bigip_system | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_f5_bigip_f5_bigip_system_preflight_passed | bool
          - fe_f5_bigip_f5_bigip_system_status in ['running', 'succeeded']
        fail_msg: >-
          f5_bigip/f5_bigip_system: postflight validation failed - preflight passed
          ={{ fe_f5_bigip_f5_bigip_system_preflight_passed | default(false) }},
          status={{ fe_f5_bigip_f5_bigip_system_status | default('unknown') }}.
        success_msg: "f5_bigip/f5_bigip_system: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "f5_bigip/f5_bigip_system | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_system_postflight_passed: true
        fe_f5_bigip_f5_bigip_system_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "f5_bigip/f5_bigip_system | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_system_status: "failed"
        fe_f5_bigip_f5_bigip_system_postflight_passed: false
        fe_f5_bigip_f5_bigip_system_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_f5_bigip_f5_bigip_system_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_system | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          f5_bigip/f5_bigip_system: FAILED at '{{ fe_f5_bigip_f5_bigip_system_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_f5_bigip_f5_bigip_system_error }}
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_system | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          f5_bigip/f5_bigip_system failed at '{{ fe_f5_bigip_f5_bigip_system_failed_task }}': {{ fe_f5_bigip_f5_bigip_system_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "f5_bigip/f5_bigip_system | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_system_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_f5_bigip_f5_bigip_system_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_f5_bigip_system_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "f5_bigip/f5_bigip_system | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "f5_bigip/f5_bigip_system":
              component: "f5_bigip/f5_bigip_system"
              type: "role"
              platform: "f5_bigip"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_f5_bigip_f5_bigip_system_status | default('unknown') }}"
              preflight_passed: "{{ fe_f5_bigip_f5_bigip_system_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_f5_bigip_f5_bigip_system_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_f5_bigip_f5_bigip_system_started_at | default('') }}"
              ended_at: "{{ fe_f5_bigip_f5_bigip_system_ended_at | default('') }}"
              duration_seconds: "{{ fe_f5_bigip_f5_bigip_system_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_f5_bigip_f5_bigip_system_failed_task | default('') }}"
              error: "{{ fe_f5_bigip_f5_bigip_system_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_f5_bigip_f5_bigip_system_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_f5_bigip_f5_bigip_system_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_f5_bigip_f5_bigip_system_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_f5_bigip_f5_bigip_system_status | default('') == 'succeeded' else ['f5_bigip/f5_bigip_system'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "f5_bigip/f5_bigip_system | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_system_stats_published: true
      tags:
        - always
