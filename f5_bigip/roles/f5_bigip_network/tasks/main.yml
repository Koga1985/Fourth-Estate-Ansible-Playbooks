---
# F5 BIG-IP Network Configuration Tasks
# Fourth Estate Production Standards

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['f5_bigip/f5_bigip_network']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_f5_bigip_f5_bigip_network_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "f5_bigip/f5_bigip_network | Initialize validation state"
  ansible.builtin.set_fact:
    fe_f5_bigip_f5_bigip_network_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_f5_bigip_f5_bigip_network_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_f5_bigip_f5_bigip_network_status: "running"
    fe_f5_bigip_f5_bigip_network_preflight_passed: false
    fe_f5_bigip_f5_bigip_network_postflight_passed: false
    fe_f5_bigip_f5_bigip_network_failed_task: ""
    fe_f5_bigip_f5_bigip_network_error: ""
    fe_f5_bigip_f5_bigip_network_stats_published: false
  tags:
    - always

- name: "f5_bigip/f5_bigip_network | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "f5_bigip/f5_bigip_network | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          f5_bigip/f5_bigip_network: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          f5_bigip/f5_bigip_network: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_network | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "f5_bigip/f5_bigip_network: required variable '{{ item }}' is not defined."
        success_msg: "f5_bigip/f5_bigip_network: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_f5_bigip_f5_bigip_network_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "f5_bigip/f5_bigip_network | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_network_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure Network Interfaces
      f5networks.f5_modules.bigip_interface:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        enabled: "{{ item.enabled | default(true) }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ f5_bigip_interfaces }}"
      when: f5_bigip_interfaces is defined and f5_bigip_interfaces | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_interfaces

    - name: Create VLANs
      f5networks.f5_modules.bigip_vlan:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        tag: "{{ item.tag | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        tagged_interfaces: "{{ item.interfaces | selectattr('tagged', 'defined') | selectattr('tagged', 'equalto', true) | map(attribute='name') | list | default(omit) }}"
        untagged_interfaces: "{{ item.interfaces | selectattr('tagged', 'defined') | selectattr('tagged', 'equalto', false) | map(attribute='name') | list | default(omit) }}"
        mtu: "{{ item.mtu | default(f5_bigip_default_mtu) }}"
      loop: "{{ f5_bigip_vlans }}"
      when: f5_bigip_vlans is defined and f5_bigip_vlans | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_vlans

    - name: Configure Trunks (Link Aggregation)
      f5networks.f5_modules.bigip_trunk:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        interfaces: "{{ item.interfaces }}"
        lacp_enabled: "{{ item.lacp_enabled | default(true) }}"
        lacp_mode: "{{ item.lacp_mode | default('active') }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ f5_bigip_trunks }}"
      when: f5_bigip_trunks is defined and f5_bigip_trunks | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_trunks

    - name: Create Self IPs
      f5networks.f5_modules.bigip_selfip:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        address: "{{ item.address }}"
        netmask: "{{ item.netmask }}"
        vlan: "{{ item.vlan }}"
        allow_service: "{{ item.allow_service | default(f5_bigip_port_lockdown_default) }}"
        traffic_group: "{{ item.traffic_group | default('traffic-group-local-only') }}"
        route_domain: "{{ item.route_domain | default(omit) }}"
      loop: "{{ f5_bigip_selfips }}"
      when: f5_bigip_selfips is defined and f5_bigip_selfips | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_selfips

    - name: Configure Static Routes
      f5networks.f5_modules.bigip_static_route:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        destination: "{{ item.destination }}"
        netmask: "{{ item.netmask }}"
        gateway_address: "{{ item.gateway_address }}"
        description: "{{ item.description | default(omit) }}"
        route_domain: "{{ item.route_domain | default(omit) }}"
      loop: "{{ f5_bigip_static_routes }}"
      when: f5_bigip_static_routes is defined and f5_bigip_static_routes | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_routes

    - name: Configure Route Domains
      f5networks.f5_modules.bigip_routedomain:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name | default(item.id | string) }}"
        id: "{{ item.id }}"
        description: "{{ item.description | default(omit) }}"
        vlans: "{{ item.vlans | default(omit) }}"
      loop: "{{ f5_bigip_route_domains }}"
      when: f5_bigip_route_domains is defined and f5_bigip_route_domains | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_route_domains

    - name: Configure Management Route
      f5networks.f5_modules.bigip_management_route:
        provider: "{{ f5_bigip_provider }}"
        gateway: "{{ f5_bigip_management_route.gateway }}"
        network: "{{ f5_bigip_management_route.network | default('default') }}"
      when: f5_bigip_management_route is defined
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_management_route

    - name: Configure Network Tunnels
      f5networks.f5_modules.bigip_tunnel:
        provider: "{{ f5_bigip_provider }}"
        name: "{{ item.name }}"
        profile: "{{ item.profile }}"
        local_address: "{{ item.local_address }}"
        remote_address: "{{ item.remote_address }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ f5_bigip_tunnels }}"
      when: f5_bigip_tunnels is defined and f5_bigip_tunnels | length > 0
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_tunnels

    - name: Configure MAC Masquerading
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "modify cm traffic-group {{ item.traffic_group }} mac {{ item.mac_address }}"
      loop: "{{ f5_bigip_mac_masquerade_addresses }}"
      when:
        - f5_bigip_mac_masquerade_enabled | bool
        - f5_bigip_mac_masquerade_addresses is defined
      notify: Save F5 Configuration
      tags:
        - f5_network
        - f5_mac_masquerade
        - f5_ha

    - name: Verify Network Configuration
      f5networks.f5_modules.bigip_command:
        provider: "{{ f5_bigip_provider }}"
        commands:
          - "show net vlan"
          - "show net self"
          - "show net route"
      register: f5_network_output
      changed_when: false
      tags:
        - f5_network
        - f5_verify

    - name: Display Network Configuration
      ansible.builtin.debug:
        var: f5_network_output.stdout_lines
      when: f5_network_output is defined
      tags:
        - f5_network
        - f5_verify

    - name: Ensure Configuration is Saved
      f5networks.f5_modules.bigip_config:
        provider: "{{ f5_bigip_provider }}"
        save: true
      when: f5_bigip_save_config | bool
      tags:
        - f5_network
        - f5_save

    # ----------------------------- postflight -------------------

    - name: "f5_bigip/f5_bigip_network | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_f5_bigip_f5_bigip_network_preflight_passed | bool
          - fe_f5_bigip_f5_bigip_network_status in ['running', 'succeeded']
        fail_msg: >-
          f5_bigip/f5_bigip_network: postflight validation failed - preflight passed
          ={{ fe_f5_bigip_f5_bigip_network_preflight_passed | default(false) }},
          status={{ fe_f5_bigip_f5_bigip_network_status | default('unknown') }}.
        success_msg: "f5_bigip/f5_bigip_network: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "f5_bigip/f5_bigip_network | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_network_postflight_passed: true
        fe_f5_bigip_f5_bigip_network_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "f5_bigip/f5_bigip_network | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_network_status: "failed"
        fe_f5_bigip_f5_bigip_network_postflight_passed: false
        fe_f5_bigip_f5_bigip_network_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_f5_bigip_f5_bigip_network_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_network | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          f5_bigip/f5_bigip_network: FAILED at '{{ fe_f5_bigip_f5_bigip_network_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_f5_bigip_f5_bigip_network_error }}
      tags:
        - always
        - rescue

    - name: "f5_bigip/f5_bigip_network | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          f5_bigip/f5_bigip_network failed at '{{ fe_f5_bigip_f5_bigip_network_failed_task }}': {{ fe_f5_bigip_f5_bigip_network_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "f5_bigip/f5_bigip_network | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_network_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_f5_bigip_f5_bigip_network_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_f5_bigip_network_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "f5_bigip/f5_bigip_network | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "f5_bigip/f5_bigip_network":
              component: "f5_bigip/f5_bigip_network"
              type: "role"
              platform: "f5_bigip"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_f5_bigip_f5_bigip_network_status | default('unknown') }}"
              preflight_passed: "{{ fe_f5_bigip_f5_bigip_network_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_f5_bigip_f5_bigip_network_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_f5_bigip_f5_bigip_network_started_at | default('') }}"
              ended_at: "{{ fe_f5_bigip_f5_bigip_network_ended_at | default('') }}"
              duration_seconds: "{{ fe_f5_bigip_f5_bigip_network_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_f5_bigip_f5_bigip_network_failed_task | default('') }}"
              error: "{{ fe_f5_bigip_f5_bigip_network_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_f5_bigip_f5_bigip_network_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_f5_bigip_f5_bigip_network_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_f5_bigip_f5_bigip_network_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_f5_bigip_f5_bigip_network_status | default('') == 'succeeded' else ['f5_bigip/f5_bigip_network'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "f5_bigip/f5_bigip_network | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_f5_bigip_f5_bigip_network_stats_published: true
      tags:
        - always
