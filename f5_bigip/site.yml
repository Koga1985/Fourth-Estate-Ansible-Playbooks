---
# F5 BIG-IP Deployment Playbook
# Entry point for F5 load balancer automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: F5 BIG-IP Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_system: true
    deploy_network: true
    deploy_ha: true
    deploy_ssl: true
    deploy_monitors: true
    deploy_pools: true
    deploy_virtual_servers: true
    deploy_profiles: true
    deploy_persistence: true
    deploy_irules: true
    deploy_asm: true

  tasks:
    - name: "f5_bigip/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - System Configuration
          ansible.builtin.include_role:
            name: f5_bigip_system
          when: deploy_system | bool
          tags: ['system', 'phase1']

        - name: Phase 2 - Network Configuration
          ansible.builtin.include_role:
            name: f5_bigip_network
          when: deploy_network | bool
          tags: ['network', 'phase2']

        - name: Phase 4 - SSL Certificates
          ansible.builtin.include_role:
            name: f5_bigip_ssl
          when: deploy_ssl | bool
          tags: ['ssl', 'phase4']

        - name: Phase 6 - Nodes
          ansible.builtin.include_role:
            name: f5_bigip_node
          tags: ['nodes', 'phase6']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== F5 BIG-IP Deployment Complete ==="
              - "HA Enabled: {{ f5_ha_enabled | default(true) }}"
              - "ASM/WAF: {{ 'Enabled' if deploy_asm else 'Disabled' }}"
          tags: ['always']

        - name: "f5_bigip/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "f5_bigip/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_status: "failed"
            fe_f5_bigip_site_postflight_passed: false
            fe_f5_bigip_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_f5_bigip_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              f5_bigip/site: FAILED at '{{ fe_f5_bigip_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_f5_bigip_site_error }}
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              f5_bigip/site failed at '{{ fe_f5_bigip_site_failed_task }}': {{ fe_f5_bigip_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "f5_bigip/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_f5_bigip_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "f5_bigip/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "f5_bigip/site":
                  component: "f5_bigip/site"
                  type: "playbook"
                  platform: "f5_bigip"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_f5_bigip_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_f5_bigip_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_f5_bigip_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_f5_bigip_site_started_at | default('') }}"
                  ended_at: "{{ fe_f5_bigip_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_f5_bigip_site_failed_task | default('') }}"
                  error: "{{ fe_f5_bigip_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_f5_bigip_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_f5_bigip_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_f5_bigip_site_status | default('') == 'succeeded' else ['f5_bigip/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_f5_bigip_site_status | default('') == 'failed'
            - not (fe_f5_bigip_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "f5_bigip/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_stats_published: true
          when:
            - fe_f5_bigip_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "f5_bigip/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "f5_bigip/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_f5_bigip_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_f5_bigip_site_status: "running"
            fe_f5_bigip_site_preflight_passed: false
            fe_f5_bigip_site_postflight_passed: false
            fe_f5_bigip_site_failed_task: ""
            fe_f5_bigip_site_error: ""
            fe_f5_bigip_site_stats_published: false
          tags:
            - always

        - name: "f5_bigip/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              f5_bigip/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              f5_bigip/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "f5_bigip/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "f5_bigip/site: required variable '{{ item }}' is not defined."
            success_msg: "f5_bigip/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_f5_bigip_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "f5_bigip/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "f5_bigip/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_status: "preflight_failed"
            fe_f5_bigip_site_postflight_passed: false
            fe_f5_bigip_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_f5_bigip_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              f5_bigip/site: FAILED at '{{ fe_f5_bigip_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_f5_bigip_site_error }}
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "f5_bigip/site":
                  component: "f5_bigip/site"
                  type: "playbook"
                  platform: "f5_bigip"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_f5_bigip_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_f5_bigip_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_f5_bigip_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_f5_bigip_site_started_at | default('') }}"
                  ended_at: "{{ fe_f5_bigip_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_f5_bigip_site_failed_task | default('') }}"
                  error: "{{ fe_f5_bigip_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_f5_bigip_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_f5_bigip_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_f5_bigip_site_status | default('') == 'succeeded' else ['f5_bigip/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "f5_bigip/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_stats_published: true
          tags:
            - always

        - name: "f5_bigip/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              f5_bigip/site failed at '{{ fe_f5_bigip_site_failed_task }}': {{ fe_f5_bigip_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "f5_bigip/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              f5_bigip/site: preflight
              {{ 'passed' if fe_f5_bigip_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "f5_bigip/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "f5_bigip/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_f5_bigip_site_preflight_passed | bool
              - fe_f5_bigip_site_status in ['running', 'succeeded']
            fail_msg: >-
              f5_bigip/site: postflight validation failed - preflight passed
              ={{ fe_f5_bigip_site_preflight_passed | default(false) }},
              status={{ fe_f5_bigip_site_status | default('unknown') }}.
            success_msg: "f5_bigip/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "f5_bigip/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_postflight_passed: true
            fe_f5_bigip_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "f5_bigip/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_status: "failed"
            fe_f5_bigip_site_postflight_passed: false
            fe_f5_bigip_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_f5_bigip_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              f5_bigip/site: FAILED at '{{ fe_f5_bigip_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_f5_bigip_site_error }}
          tags:
            - always
            - rescue

        - name: "f5_bigip/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              f5_bigip/site failed at '{{ fe_f5_bigip_site_failed_task }}': {{ fe_f5_bigip_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "f5_bigip/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_f5_bigip_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_f5_bigip_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "f5_bigip/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "f5_bigip/site":
                  component: "f5_bigip/site"
                  type: "playbook"
                  platform: "f5_bigip"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_f5_bigip_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_f5_bigip_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_f5_bigip_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_f5_bigip_site_started_at | default('') }}"
                  ended_at: "{{ fe_f5_bigip_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_f5_bigip_site_failed_task | default('') }}"
                  error: "{{ fe_f5_bigip_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_f5_bigip_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_f5_bigip_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_f5_bigip_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_f5_bigip_site_status | default('') == 'succeeded' else ['f5_bigip/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_f5_bigip_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "f5_bigip/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_f5_bigip_site_stats_published: true
          tags:
            - always

        - name: "f5_bigip/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              f5_bigip/site: {{ fe_f5_bigip_site_status | default('unknown') }} in
              {{ fe_f5_bigip_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
