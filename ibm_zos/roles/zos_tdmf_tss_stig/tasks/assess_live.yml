---
# Live read-only assessment via ibm.ibm_zos_core (dynamically included).
# Runs only when zos_live_assessment=true and zos_target is set.
# READ-ONLY: display + TSO/RACF list commands only. Never issues a change.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['ibm_zos/zos_tdmf_tss_stig/assess_live']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_ibm_zos_zos_tdmf_tss_stig_assess_live_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Initialize validation state"
  ansible.builtin.set_fact:
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status: "running"
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_preflight_passed: false
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_postflight_passed: false
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_failed_task: ""
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_error: ""
    fe_ibm_zos_zos_tdmf_tss_stig_assess_live_stats_published: false
  tags:
    - always

- name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          ibm_zos/zos_tdmf_tss_stig/assess_live: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          ibm_zos/zos_tdmf_tss_stig/assess_live: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "ibm_zos/zos_tdmf_tss_stig/assess_live: required variable '{{ item }}' is not defined."
        success_msg: "ibm_zos/zos_tdmf_tss_stig/assess_live: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Run operator (display) verification commands
      ibm.ibm_zos_core.zos_operator:
        cmd: "{{ item.command }}"
      delegate_to: "{{ zos_target }}"
      loop: "{{ zos_catalog | selectattr('command', 'match', '^D ') | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: zos_oper_results
      ignore_errors: true
      tags: [live]

    - name: Run TSO/RACF verification commands
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "{{ item.command }}"
      delegate_to: "{{ zos_target }}"
      loop: "{{ zos_catalog | rejectattr('command', 'match', '^D ') | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: zos_tso_results
      ignore_errors: true
      tags: [live]

    - name: Write live evidence artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ zos_slug }}_live_evidence.json"
        mode: "0640"
        content: "{{ {'target': zos_target, 'operator': zos_oper_results.results | default([]), 'tso': zos_tso_results.results | default([])} | to_nice_json }}"
      delegate_to: localhost
      tags: [live]

    # ----------------------------- postflight -------------------

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_ibm_zos_zos_tdmf_tss_stig_assess_live_preflight_passed | bool
          - fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status in ['running', 'succeeded']
        fail_msg: >-
          ibm_zos/zos_tdmf_tss_stig/assess_live: postflight validation failed - preflight passed
          ={{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_preflight_passed | default(false) }},
          status={{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status | default('unknown') }}.
        success_msg: "ibm_zos/zos_tdmf_tss_stig/assess_live: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_postflight_passed: true
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status: "failed"
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_postflight_passed: false
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          ibm_zos/zos_tdmf_tss_stig/assess_live: FAILED at '{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_error }}
      tags:
        - always
        - rescue

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          ibm_zos/zos_tdmf_tss_stig/assess_live failed at '{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_failed_task }}': {{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_ibm_zos_zos_tdmf_tss_stig_assess_live_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "ibm_zos/zos_tdmf_tss_stig/assess_live":
              component: "ibm_zos/zos_tdmf_tss_stig/assess_live"
              type: "role-tasks"
              platform: "ibm_zos"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status | default('unknown') }}"
              preflight_passed: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_started_at | default('') }}"
              ended_at: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_ended_at | default('') }}"
              duration_seconds: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_failed_task | default('') }}"
              error: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_ibm_zos_zos_tdmf_tss_stig_assess_live_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_ibm_zos_zos_tdmf_tss_stig_assess_live_status | default('') == 'succeeded' else ['ibm_zos/zos_tdmf_tss_stig/assess_live'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "ibm_zos/zos_tdmf_tss_stig/assess_live | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_ibm_zos_zos_tdmf_tss_stig_assess_live_stats_published: true
      tags:
        - always
