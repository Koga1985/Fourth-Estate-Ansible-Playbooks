---
# VAST Data Deployment Playbook
# Entry point for VAST storage automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: VAST Data Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_config: true
    deploy_security: true
    deploy_monitoring: true
    deploy_backup: true

  tasks:
    - name: "vast/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - VAST Configuration
          ansible.builtin.include_role:
            name: vast_config
          when: deploy_config | bool
          tags: ['config', 'phase1']

        - name: Phase 2 - Security Hardening
          ansible.builtin.include_role:
            name: vast_security_hardening
          when: deploy_security | bool
          tags: ['security', 'phase2']

        - name: Phase 3 - Monitoring
          ansible.builtin.include_role:
            name: vast_monitoring
          when: deploy_monitoring | bool
          tags: ['monitoring', 'phase3']

        - name: Phase 4 - Backup & DR
          ansible.builtin.include_role:
            name: vast_backup_dr
          when: deploy_backup | bool
          tags: ['backup', 'phase4']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== VAST Deployment Complete ==="
              - "Cluster: {{ vast_cluster_name | default('production') }}"
          tags: ['always']

      rescue:

        - name: "vast/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_site_status: "failed"
            fe_vast_site_postflight_passed: false
            fe_vast_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/site: FAILED at '{{ fe_vast_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_site_error }}
          tags:
            - always
            - rescue

        - name: "vast/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/site failed at '{{ fe_vast_site_failed_task }}': {{ fe_vast_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/site":
                  component: "vast/site"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_site_started_at | default('') }}"
                  ended_at: "{{ fe_vast_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_site_failed_task | default('') }}"
                  error: "{{ fe_vast_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_site_status | default('') == 'succeeded' else ['vast/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_vast_site_status | default('') == 'failed'
            - not (fe_vast_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_site_stats_published: true
          when:
            - fe_vast_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "vast/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vast/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vast_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vast_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_site_status: "running"
            fe_vast_site_preflight_passed: false
            fe_vast_site_postflight_passed: false
            fe_vast_site_failed_task: ""
            fe_vast_site_error: ""
            fe_vast_site_stats_published: false
          tags:
            - always

        - name: "vast/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vast/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vast/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vast/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vast/site: required variable '{{ item }}' is not defined."
            success_msg: "vast/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vast_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vast/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vast_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "vast/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_site_status: "preflight_failed"
            fe_vast_site_postflight_passed: false
            fe_vast_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/site: FAILED at '{{ fe_vast_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_site_error }}
          tags:
            - always
            - rescue

        - name: "vast/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/site":
                  component: "vast/site"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_site_started_at | default('') }}"
                  ended_at: "{{ fe_vast_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_site_failed_task | default('') }}"
                  error: "{{ fe_vast_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_site_status | default('') == 'succeeded' else ['vast/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vast/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_site_stats_published: true
          tags:
            - always

        - name: "vast/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/site failed at '{{ fe_vast_site_failed_task }}': {{ fe_vast_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vast/site: preflight
              {{ 'passed' if fe_vast_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "vast/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "vast/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_vast_site_preflight_passed | bool
              - fe_vast_site_status in ['running', 'succeeded']
            fail_msg: >-
              vast/site: postflight validation failed - preflight passed
              ={{ fe_vast_site_preflight_passed | default(false) }},
              status={{ fe_vast_site_status | default('unknown') }}.
            success_msg: "vast/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "vast/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_vast_site_postflight_passed: true
            fe_vast_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "vast/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_site_status: "failed"
            fe_vast_site_postflight_passed: false
            fe_vast_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/site: FAILED at '{{ fe_vast_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_site_error }}
          tags:
            - always
            - rescue

        - name: "vast/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/site failed at '{{ fe_vast_site_failed_task }}': {{ fe_vast_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/site":
                  component: "vast/site"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_site_started_at | default('') }}"
                  ended_at: "{{ fe_vast_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_site_failed_task | default('') }}"
                  error: "{{ fe_vast_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_site_status | default('') == 'succeeded' else ['vast/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_vast_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_site_stats_published: true
          tags:
            - always

        - name: "vast/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              vast/site: {{ fe_vast_site_status | default('unknown') }} in
              {{ fe_vast_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
