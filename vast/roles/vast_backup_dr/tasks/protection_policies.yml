---
# Protection policy configuration tasks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_backup_dr/protection_policies']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_backup_dr_protection_policies_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_backup_dr/protection_policies | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_backup_dr_protection_policies_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_backup_dr_protection_policies_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_backup_dr_protection_policies_status: "running"
    fe_vast_vast_backup_dr_protection_policies_preflight_passed: false
    fe_vast_vast_backup_dr_protection_policies_postflight_passed: false
    fe_vast_vast_backup_dr_protection_policies_failed_task: ""
    fe_vast_vast_backup_dr_protection_policies_error: ""
    fe_vast_vast_backup_dr_protection_policies_stats_published: false
  tags:
    - always

- name: "vast/vast_backup_dr/protection_policies | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_backup_dr/protection_policies | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_backup_dr/protection_policies: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_backup_dr/protection_policies: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_backup_dr/protection_policies | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_backup_dr/protection_policies: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_backup_dr/protection_policies: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_backup_dr_protection_policies_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_backup_dr/protection_policies | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_backup_dr_protection_policies_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create protection policies
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/protection/policies"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          snapshot_frequency: "{{ item.snapshot_frequency }}"
          snapshot_retention_hours: "{{ item.snapshot_retention }}"
          replication_enabled: "{{ item.replication_enabled }}"
        status_code: [200, 201, 409]
      no_log: true
      delegate_to: localhost
      loop: "{{ vast_protection_policies }}"
      tags:
        - policies
        - protection

    - name: Get all protection policies
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/protection/policies"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_all_policies
      delegate_to: localhost
      changed_when: false
      tags:
        - policies

    - name: Display configured policies
      ansible.builtin.debug:
        msg: "Total Protection Policies: {{ vast_all_policies.json | default([]) | length }}"
      when: vast_all_policies.json is defined
      tags:
        - policies

    # ----------------------------- postflight -------------------

    - name: "vast/vast_backup_dr/protection_policies | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_backup_dr_protection_policies_preflight_passed | bool
          - fe_vast_vast_backup_dr_protection_policies_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_backup_dr/protection_policies: postflight validation failed - preflight passed
          ={{ fe_vast_vast_backup_dr_protection_policies_preflight_passed | default(false) }},
          status={{ fe_vast_vast_backup_dr_protection_policies_status | default('unknown') }}.
        success_msg: "vast/vast_backup_dr/protection_policies: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_backup_dr/protection_policies | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_backup_dr_protection_policies_postflight_passed: true
        fe_vast_vast_backup_dr_protection_policies_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_backup_dr/protection_policies | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_backup_dr_protection_policies_status: "failed"
        fe_vast_vast_backup_dr_protection_policies_postflight_passed: false
        fe_vast_vast_backup_dr_protection_policies_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_backup_dr_protection_policies_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_backup_dr/protection_policies | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_backup_dr/protection_policies: FAILED at '{{ fe_vast_vast_backup_dr_protection_policies_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_backup_dr_protection_policies_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_backup_dr/protection_policies | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_backup_dr/protection_policies failed at '{{ fe_vast_vast_backup_dr_protection_policies_failed_task }}': {{ fe_vast_vast_backup_dr_protection_policies_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_backup_dr/protection_policies | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_backup_dr_protection_policies_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_backup_dr_protection_policies_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_backup_dr_protection_policies_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_backup_dr/protection_policies | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_backup_dr/protection_policies":
              component: "vast/vast_backup_dr/protection_policies"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_backup_dr_protection_policies_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_backup_dr_protection_policies_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_backup_dr_protection_policies_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_backup_dr_protection_policies_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_backup_dr_protection_policies_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_backup_dr_protection_policies_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_backup_dr_protection_policies_failed_task | default('') }}"
              error: "{{ fe_vast_vast_backup_dr_protection_policies_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_backup_dr_protection_policies_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_backup_dr_protection_policies_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_backup_dr_protection_policies_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_backup_dr_protection_policies_status | default('') == 'succeeded' else ['vast/vast_backup_dr/protection_policies'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_backup_dr/protection_policies | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_backup_dr_protection_policies_stats_published: true
      tags:
        - always
