---
# Alerting configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_monitoring/alerting']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_monitoring_alerting_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_monitoring/alerting | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_monitoring_alerting_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_monitoring_alerting_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_monitoring_alerting_status: "running"
    fe_vast_vast_monitoring_alerting_preflight_passed: false
    fe_vast_vast_monitoring_alerting_postflight_passed: false
    fe_vast_vast_monitoring_alerting_failed_task: ""
    fe_vast_vast_monitoring_alerting_error: ""
    fe_vast_vast_monitoring_alerting_stats_published: false
  tags:
    - always

- name: "vast/vast_monitoring/alerting | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_monitoring/alerting | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_monitoring/alerting: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_monitoring/alerting: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_monitoring/alerting | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_monitoring/alerting: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_monitoring/alerting: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_monitoring_alerting_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_monitoring/alerting | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_monitoring_alerting_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure email alerting
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/alerts/email"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_alert_email_enabled }}"
          recipients: "{{ vast_alert_email_recipients }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when:
        - vast_alert_email_enabled | bool
        - vast_alert_email_recipients | length > 0
      tags:
        - alerts
        - email

    - name: Configure capacity threshold alerts
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/alerts/thresholds"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          capacity_threshold_percent: "{{ vast_alert_on_capacity_threshold }}"
          alert_on_performance_degradation: "{{ vast_alert_on_performance_degradation }}"
          alert_on_hardware_failure: "{{ vast_alert_on_hardware_failure }}"
          alert_on_security_events: "{{ vast_alert_on_security_events }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - alerts
        - thresholds

    - name: Get current active alerts
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/alerts/active"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_active_alerts
      delegate_to: localhost
      changed_when: false
      tags:
        - alerts

    - name: Display active alerts
      ansible.builtin.debug:
        msg: "Active Alerts: {{ vast_active_alerts.json | default([]) | length }}"
      when: vast_active_alerts.json is defined
      tags:
        - alerts

    # ----------------------------- postflight -------------------

    - name: "vast/vast_monitoring/alerting | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_monitoring_alerting_preflight_passed | bool
          - fe_vast_vast_monitoring_alerting_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_monitoring/alerting: postflight validation failed - preflight passed
          ={{ fe_vast_vast_monitoring_alerting_preflight_passed | default(false) }},
          status={{ fe_vast_vast_monitoring_alerting_status | default('unknown') }}.
        success_msg: "vast/vast_monitoring/alerting: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_monitoring/alerting | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_monitoring_alerting_postflight_passed: true
        fe_vast_vast_monitoring_alerting_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_monitoring/alerting | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_monitoring_alerting_status: "failed"
        fe_vast_vast_monitoring_alerting_postflight_passed: false
        fe_vast_vast_monitoring_alerting_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_monitoring_alerting_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_monitoring/alerting | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_monitoring/alerting: FAILED at '{{ fe_vast_vast_monitoring_alerting_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_monitoring_alerting_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_monitoring/alerting | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_monitoring/alerting failed at '{{ fe_vast_vast_monitoring_alerting_failed_task }}': {{ fe_vast_vast_monitoring_alerting_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_monitoring/alerting | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_monitoring_alerting_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_monitoring_alerting_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_monitoring_alerting_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_monitoring/alerting | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_monitoring/alerting":
              component: "vast/vast_monitoring/alerting"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_monitoring_alerting_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_monitoring_alerting_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_monitoring_alerting_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_monitoring_alerting_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_monitoring_alerting_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_monitoring_alerting_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_monitoring_alerting_failed_task | default('') }}"
              error: "{{ fe_vast_vast_monitoring_alerting_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_monitoring_alerting_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_monitoring_alerting_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_monitoring_alerting_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_monitoring_alerting_status | default('') == 'succeeded' else ['vast/vast_monitoring/alerting'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_monitoring/alerting | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_monitoring_alerting_stats_published: true
      tags:
        - always
