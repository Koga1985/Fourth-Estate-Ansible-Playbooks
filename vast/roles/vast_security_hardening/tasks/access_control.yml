---
# Access Control hardening tasks
# NIST 800-53 AC family, STIG V-238197

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_security_hardening/access_control']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_security_hardening_access_control_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_security_hardening/access_control | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_security_hardening_access_control_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_security_hardening_access_control_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_security_hardening_access_control_status: "running"
    fe_vast_vast_security_hardening_access_control_preflight_passed: false
    fe_vast_vast_security_hardening_access_control_postflight_passed: false
    fe_vast_vast_security_hardening_access_control_failed_task: ""
    fe_vast_vast_security_hardening_access_control_error: ""
    fe_vast_vast_security_hardening_access_control_stats_published: false
  tags:
    - always

- name: "vast/vast_security_hardening/access_control | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_security_hardening/access_control | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_security_hardening/access_control: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_security_hardening/access_control: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/access_control | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_security_hardening/access_control: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_security_hardening/access_control: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_security_hardening_access_control_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/access_control | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_access_control_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure LDAP integration for centralized authentication
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/ldap"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_enable_ldap }}"
          server: "{{ vast_ldap_server }}"
          port: "{{ vast_ldap_port }}"
          use_ssl: "{{ vast_ldap_use_ssl }}"
          base_dn: "{{ vast_ldap_base_dn }}"
        status_code: [200, 201, 409]
      no_log: true
      delegate_to: localhost
      when:
        - vast_enable_ldap | bool
        - vast_ldap_server != ''
      tags:
        - ldap
        - authentication

    - name: Configure Active Directory integration (DoD PKI)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/activedirectory"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_enable_active_directory }}"
          domain: "{{ vast_ad_domain }}"
          use_kerberos: "{{ vast_require_kerberos }}"
        status_code: [200, 201, 409]
      no_log: true
      delegate_to: localhost
      when:
        - vast_enable_active_directory | bool
        - vast_ad_domain != ''
      tags:
        - active_directory
        - kerberos

    - name: Disable anonymous access (STIG requirement)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/access"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          allow_anonymous: false
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when: vast_disable_anonymous_access | bool
      tags:
        - anonymous_access
        - stig

    - name: Configure role-based access control (RBAC)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/rbac"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: true
          enforce_least_privilege: true
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - rbac
        - least_privilege

    - name: Enable access-based enumeration (ABE)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/shares/abe"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_enable_access_based_enumeration }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when: vast_enable_access_based_enumeration | bool
      tags:
        - abe
        - privacy

    - name: Configure session timeout (STIG V-238201)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/sessions"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          timeout_minutes: "{{ vast_session_timeout_minutes }}"
          max_concurrent_sessions: "{{ vast_max_concurrent_sessions }}"
          audit_sessions: "{{ vast_enable_session_audit }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - session_management
        - timeout

    # ----------------------------- postflight -------------------

    - name: "vast/vast_security_hardening/access_control | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_security_hardening_access_control_preflight_passed | bool
          - fe_vast_vast_security_hardening_access_control_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_security_hardening/access_control: postflight validation failed - preflight passed
          ={{ fe_vast_vast_security_hardening_access_control_preflight_passed | default(false) }},
          status={{ fe_vast_vast_security_hardening_access_control_status | default('unknown') }}.
        success_msg: "vast/vast_security_hardening/access_control: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_security_hardening/access_control | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_access_control_postflight_passed: true
        fe_vast_vast_security_hardening_access_control_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_security_hardening/access_control | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_access_control_status: "failed"
        fe_vast_vast_security_hardening_access_control_postflight_passed: false
        fe_vast_vast_security_hardening_access_control_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_security_hardening_access_control_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/access_control | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_security_hardening/access_control: FAILED at '{{ fe_vast_vast_security_hardening_access_control_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_security_hardening_access_control_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/access_control | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_security_hardening/access_control failed at '{{ fe_vast_vast_security_hardening_access_control_failed_task }}': {{ fe_vast_vast_security_hardening_access_control_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_security_hardening/access_control | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_access_control_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_security_hardening_access_control_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_security_hardening_access_control_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_security_hardening/access_control | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_security_hardening/access_control":
              component: "vast/vast_security_hardening/access_control"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_security_hardening_access_control_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_security_hardening_access_control_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_security_hardening_access_control_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_security_hardening_access_control_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_security_hardening_access_control_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_security_hardening_access_control_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_security_hardening_access_control_failed_task | default('') }}"
              error: "{{ fe_vast_vast_security_hardening_access_control_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_security_hardening_access_control_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_security_hardening_access_control_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_security_hardening_access_control_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_security_hardening_access_control_status | default('') == 'succeeded' else ['vast/vast_security_hardening/access_control'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_security_hardening/access_control | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_access_control_stats_published: true
      tags:
        - always
