---
# Compliance verification tasks
# STIG V-238217

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_security_hardening/compliance_check']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_security_hardening_compliance_check_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_security_hardening/compliance_check | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_security_hardening_compliance_check_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_security_hardening_compliance_check_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_security_hardening_compliance_check_status: "running"
    fe_vast_vast_security_hardening_compliance_check_preflight_passed: false
    fe_vast_vast_security_hardening_compliance_check_postflight_passed: false
    fe_vast_vast_security_hardening_compliance_check_failed_task: ""
    fe_vast_vast_security_hardening_compliance_check_error: ""
    fe_vast_vast_security_hardening_compliance_check_stats_published: false
  tags:
    - always

- name: "vast/vast_security_hardening/compliance_check | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_security_hardening/compliance_check | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_security_hardening/compliance_check: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_security_hardening/compliance_check: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/compliance_check | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_security_hardening/compliance_check: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_security_hardening/compliance_check: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_security_hardening_compliance_check_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/compliance_check | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_compliance_check_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Generate compliance report
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/compliance/report"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          frameworks: "{{ vast_compliance_frameworks }}"
          include_remediation: true
        status_code: [200, 201]
        return_content: true
      no_log: true
      register: vast_compliance_report
      delegate_to: localhost
      when: vast_generate_compliance_reports | bool
      tags:
        - compliance
        - reporting

    - name: Check STIG compliance status
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/compliance/stig"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_stig_status
      delegate_to: localhost
      changed_when: false
      tags:
        - stig
        - compliance

    - name: Display STIG compliance status
      ansible.builtin.debug:
        msg:
          - "STIG Compliance Status: {{ vast_stig_status.json.overall_status | default('unknown') }}"
          - "Findings: {{ vast_stig_status.json.findings | default([]) | length }}"
          - "CAT I (Critical): {{ vast_stig_status.json.cat1_findings | default(0) }}"
          - "CAT II (High): {{ vast_stig_status.json.cat2_findings | default(0) }}"
          - "CAT III (Medium): {{ vast_stig_status.json.cat3_findings | default(0) }}"
      when: vast_stig_status.json is defined
      tags:
        - stig
        - compliance

    - name: Check NIST 800-53 compliance
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/compliance/nist-800-53"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_nist_status
      delegate_to: localhost
      changed_when: false
      tags:
        - nist
        - compliance

    - name: Verify FIPS 140-2 mode is active
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/fips/status"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_fips_status
      delegate_to: localhost
      changed_when: false
      tags:
        - fips
        - verification

    - name: Assert FIPS mode is enabled
      ansible.builtin.assert:
        that:
          - vast_fips_status.json.enabled | default(false) | bool
        fail_msg: "FIPS 140-2 mode is NOT enabled - DoD requirement not met"
        success_msg: "FIPS 140-2 mode is enabled"
      when:
        - vast_fips_140_2_mode | bool
        - vast_fips_status.json is defined
      tags:
        - fips
        - verification

    - name: Verify encryption at rest is enabled
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/encryption/status"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_encryption_status
      delegate_to: localhost
      changed_when: false
      tags:
        - encryption
        - verification

    - name: Create compliance summary
      ansible.builtin.set_fact:
        vast_compliance_summary:
          fips_enabled: "{{ vast_fips_status.json.enabled | default(false) }}"
          encryption_at_rest: "{{ vast_encryption_status.json.at_rest_enabled | default(false) }}"
          encryption_in_transit: "{{ vast_encryption_status.json.in_transit_enabled | default(false) }}"
          audit_logging: "{{ vast_enable_audit_logging }}"
          smb1_disabled: "{{ vast_disable_smb1 }}"
      tags:
        - compliance
        - summary

    - name: Display compliance summary
      ansible.builtin.debug:
        var: vast_compliance_summary
      tags:
        - compliance
        - summary

    # ----------------------------- postflight -------------------

    - name: "vast/vast_security_hardening/compliance_check | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_security_hardening_compliance_check_preflight_passed | bool
          - fe_vast_vast_security_hardening_compliance_check_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_security_hardening/compliance_check: postflight validation failed - preflight passed
          ={{ fe_vast_vast_security_hardening_compliance_check_preflight_passed | default(false) }},
          status={{ fe_vast_vast_security_hardening_compliance_check_status | default('unknown') }}.
        success_msg: "vast/vast_security_hardening/compliance_check: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_security_hardening/compliance_check | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_compliance_check_postflight_passed: true
        fe_vast_vast_security_hardening_compliance_check_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_security_hardening/compliance_check | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_compliance_check_status: "failed"
        fe_vast_vast_security_hardening_compliance_check_postflight_passed: false
        fe_vast_vast_security_hardening_compliance_check_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_security_hardening_compliance_check_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/compliance_check | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_security_hardening/compliance_check: FAILED at '{{ fe_vast_vast_security_hardening_compliance_check_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_security_hardening_compliance_check_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/compliance_check | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_security_hardening/compliance_check failed at '{{ fe_vast_vast_security_hardening_compliance_check_failed_task }}': {{ fe_vast_vast_security_hardening_compliance_check_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_security_hardening/compliance_check | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_compliance_check_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_security_hardening_compliance_check_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_security_hardening_compliance_check_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_security_hardening/compliance_check | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_security_hardening/compliance_check":
              component: "vast/vast_security_hardening/compliance_check"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_security_hardening_compliance_check_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_security_hardening_compliance_check_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_security_hardening_compliance_check_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_security_hardening_compliance_check_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_security_hardening_compliance_check_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_security_hardening_compliance_check_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_security_hardening_compliance_check_failed_task | default('') }}"
              error: "{{ fe_vast_vast_security_hardening_compliance_check_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_security_hardening_compliance_check_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_security_hardening_compliance_check_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_security_hardening_compliance_check_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_security_hardening_compliance_check_status | default('') == 'succeeded' else ['vast/vast_security_hardening/compliance_check'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_security_hardening/compliance_check | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_compliance_check_stats_published: true
      tags:
        - always
