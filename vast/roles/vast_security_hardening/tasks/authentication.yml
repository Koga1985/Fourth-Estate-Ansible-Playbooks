---
# Authentication hardening tasks
# NIST 800-63B, STIG V-238199

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_security_hardening/authentication']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_security_hardening_authentication_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_security_hardening/authentication | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_security_hardening_authentication_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_security_hardening_authentication_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_security_hardening_authentication_status: "running"
    fe_vast_vast_security_hardening_authentication_preflight_passed: false
    fe_vast_vast_security_hardening_authentication_postflight_passed: false
    fe_vast_vast_security_hardening_authentication_failed_task: ""
    fe_vast_vast_security_hardening_authentication_error: ""
    fe_vast_vast_security_hardening_authentication_stats_published: false
  tags:
    - always

- name: "vast/vast_security_hardening/authentication | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_security_hardening/authentication | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_security_hardening/authentication: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_security_hardening/authentication: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/authentication | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_security_hardening/authentication: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_security_hardening/authentication: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_security_hardening_authentication_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_security_hardening/authentication | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_authentication_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure password complexity requirements (STIG)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/password-policy"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          min_length: "{{ vast_password_min_length }}"
          require_uppercase: true
          require_lowercase: true
          require_numbers: true
          require_special_chars: true
          max_age_days: "{{ vast_password_max_age_days }}"
          history_count: "{{ vast_password_history_count }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when: vast_password_complexity_required | bool
      tags:
        - password_policy
        - stig

    - name: Configure account lockout policy (STIG V-238199)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/lockout-policy"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          threshold: "{{ vast_account_lockout_threshold }}"
          duration_minutes: "{{ vast_account_lockout_duration_minutes }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - lockout_policy
        - stig

    - name: Enable multi-factor authentication (NIST 800-63B AAL2)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/mfa"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_require_mfa }}"
          methods: "{{ vast_mfa_methods }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when: vast_require_mfa | bool
      tags:
        - mfa
        - two_factor

    - name: Configure Kerberos authentication (DoD requirement)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/kerberos"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          enabled: "{{ vast_require_kerberos }}"
          require_for_nfs: true
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when: vast_require_kerberos | bool
      tags:
        - kerberos
        - strong_auth

    - name: Disable local admin accounts except emergency access
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/users/local"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_local_users
      delegate_to: localhost
      changed_when: false
      tags:
        - local_accounts

    - name: Audit local administrative accounts
      ansible.builtin.debug:
        msg: "Local admin accounts found: {{ vast_local_users.json | length | default(0) }}"
      when: vast_local_users.json is defined
      tags:
        - local_accounts
        - audit

    # ----------------------------- postflight -------------------

    - name: "vast/vast_security_hardening/authentication | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_security_hardening_authentication_preflight_passed | bool
          - fe_vast_vast_security_hardening_authentication_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_security_hardening/authentication: postflight validation failed - preflight passed
          ={{ fe_vast_vast_security_hardening_authentication_preflight_passed | default(false) }},
          status={{ fe_vast_vast_security_hardening_authentication_status | default('unknown') }}.
        success_msg: "vast/vast_security_hardening/authentication: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_security_hardening/authentication | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_authentication_postflight_passed: true
        fe_vast_vast_security_hardening_authentication_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_security_hardening/authentication | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_authentication_status: "failed"
        fe_vast_vast_security_hardening_authentication_postflight_passed: false
        fe_vast_vast_security_hardening_authentication_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_security_hardening_authentication_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/authentication | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_security_hardening/authentication: FAILED at '{{ fe_vast_vast_security_hardening_authentication_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_security_hardening_authentication_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_security_hardening/authentication | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_security_hardening/authentication failed at '{{ fe_vast_vast_security_hardening_authentication_failed_task }}': {{ fe_vast_vast_security_hardening_authentication_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_security_hardening/authentication | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_authentication_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_security_hardening_authentication_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_security_hardening_authentication_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_security_hardening/authentication | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_security_hardening/authentication":
              component: "vast/vast_security_hardening/authentication"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_security_hardening_authentication_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_security_hardening_authentication_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_security_hardening_authentication_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_security_hardening_authentication_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_security_hardening_authentication_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_security_hardening_authentication_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_security_hardening_authentication_failed_task | default('') }}"
              error: "{{ fe_vast_vast_security_hardening_authentication_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_security_hardening_authentication_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_security_hardening_authentication_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_security_hardening_authentication_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_security_hardening_authentication_status | default('') == 'succeeded' else ['vast/vast_security_hardening/authentication'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_security_hardening/authentication | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_security_hardening_authentication_stats_published: true
      tags:
        - always
