---
# Network configuration tasks for VAST

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_config/network_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_config_network_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_config/network_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_config_network_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_config_network_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_config_network_config_status: "running"
    fe_vast_vast_config_network_config_preflight_passed: false
    fe_vast_vast_config_network_config_postflight_passed: false
    fe_vast_vast_config_network_config_failed_task: ""
    fe_vast_vast_config_network_config_error: ""
    fe_vast_vast_config_network_config_stats_published: false
  tags:
    - always

- name: "vast/vast_config/network_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_config/network_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_config/network_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_config/network_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/network_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_config/network_config: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_config/network_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_config_network_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/network_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_config_network_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get existing VIP pools
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/vippools"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_existing_vip_pools
      delegate_to: localhost
      changed_when: false
      tags:
        - vip

    - name: Check if VIP pool exists
      ansible.builtin.set_fact:
        vast_vip_pool_exists: "{{ vast_existing_vip_pools.json | selectattr('name', 'equalto', vast_vip_pool_name) | list | length > 0 }}"
      when: vast_existing_vip_pools.json is defined
      tags:
        - vip

    - name: Create VIP pool if configured and doesn't exist
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/vippools"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          name: "{{ vast_vip_pool_name }}"
          ip_range_start: "{{ vast_vip_pool_start }}"
          ip_range_end: "{{ vast_vip_pool_end }}"
          subnet: "{{ vast_vip_pool_subnet }}"
          gateway: "{{ vast_vip_pool_gateway }}"
        status_code: [201, 200]
      no_log: true
      delegate_to: localhost
      when:
        - vast_vip_pool_start != ''
        - vast_vip_pool_end != ''
        - vast_vip_pool_subnet != ''
        - not (vast_vip_pool_exists | default(false))
      tags:
        - vip

    - name: Configure DNS servers
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/clusters/{{ vast_cluster_id }}/dns"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          domain: "{{ vast_cluster_domain }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when:
        - vast_cluster_id is defined and vast_cluster_id != ''
        - vast_cluster_domain is defined
      tags:
        - dns

    - name: Configure NTP servers (DoD STIG requirement)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/clusters/{{ vast_cluster_id }}/ntp"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          ntp_servers: "{{ vast_ntp_servers | default([]) }}"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      when:
        - vast_cluster_id is defined and vast_cluster_id != ''
        - vast_ntp_servers is defined
      tags:
        - ntp
        - time_sync

    # ----------------------------- postflight -------------------

    - name: "vast/vast_config/network_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_config_network_config_preflight_passed | bool
          - fe_vast_vast_config_network_config_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_config/network_config: postflight validation failed - preflight passed
          ={{ fe_vast_vast_config_network_config_preflight_passed | default(false) }},
          status={{ fe_vast_vast_config_network_config_status | default('unknown') }}.
        success_msg: "vast/vast_config/network_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_config/network_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_config_network_config_postflight_passed: true
        fe_vast_vast_config_network_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_config/network_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_config_network_config_status: "failed"
        fe_vast_vast_config_network_config_postflight_passed: false
        fe_vast_vast_config_network_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_config_network_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_config/network_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_config/network_config: FAILED at '{{ fe_vast_vast_config_network_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_config_network_config_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_config/network_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_config/network_config failed at '{{ fe_vast_vast_config_network_config_failed_task }}': {{ fe_vast_vast_config_network_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_config/network_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_config_network_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_config_network_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_config_network_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_config/network_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_config/network_config":
              component: "vast/vast_config/network_config"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_config_network_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_config_network_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_config_network_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_config_network_config_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_config_network_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_config_network_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_config_network_config_failed_task | default('') }}"
              error: "{{ fe_vast_vast_config_network_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_config_network_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_config_network_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_config_network_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_config_network_config_status | default('') == 'succeeded' else ['vast/vast_config/network_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_config/network_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_config_network_config_stats_published: true
      tags:
        - always
