---
# Prerequisites and validation tasks for VAST configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_config/prerequisites']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_config_prerequisites_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_config/prerequisites | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_config_prerequisites_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_config_prerequisites_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_config_prerequisites_status: "running"
    fe_vast_vast_config_prerequisites_preflight_passed: false
    fe_vast_vast_config_prerequisites_postflight_passed: false
    fe_vast_vast_config_prerequisites_failed_task: ""
    fe_vast_vast_config_prerequisites_error: ""
    fe_vast_vast_config_prerequisites_stats_published: false
  tags:
    - always

- name: "vast/vast_config/prerequisites | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_config/prerequisites | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_config/prerequisites: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_config/prerequisites: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/prerequisites | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_config/prerequisites: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_config/prerequisites: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_config_prerequisites_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/prerequisites | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_config_prerequisites_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate required variables are defined
      ansible.builtin.assert:
        that:
          - vast_mgmt_host is defined
          - vast_mgmt_user is defined
          - vast_mgmt_password is defined
          - vast_cluster_name is defined
        fail_msg: "Required VAST configuration variables are not defined"
        success_msg: "All required variables are defined"
      tags:
        - validation

    - name: Check VAST management server connectivity
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/system"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        status_code: [200, 401, 403]
        timeout: 10
      no_log: true
      register: vast_connectivity_check
      failed_when: false
      changed_when: false
      delegate_to: localhost
      tags:
        - connectivity

    - name: Fail if VAST management server is unreachable
      ansible.builtin.fail:
        msg: "Cannot reach VAST management server at {{ vast_mgmt_host }}:{{ vast_mgmt_port }}"
      when: vast_connectivity_check is failed or vast_connectivity_check.status == -1
      tags:
        - connectivity

    - name: Get VAST cluster information
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/clusters"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_cluster_info
      delegate_to: localhost
      changed_when: false
      tags:
        - discovery

    - name: Set VAST cluster facts
      ansible.builtin.set_fact:
        vast_cluster_id: "{{ vast_cluster_info.json[0].id | default('') }}"
        vast_cluster_version: "{{ vast_cluster_info.json[0].sw_version | default('unknown') }}"
      when: vast_cluster_info.json is defined and vast_cluster_info.json | length > 0
      tags:
        - discovery

    - name: Display VAST cluster information
      ansible.builtin.debug:
        msg:
          - "VAST Cluster Name: {{ vast_cluster_name }}"
          - "VAST Cluster Version: {{ vast_cluster_version | default('unknown') }}"
          - "Management Host: {{ vast_mgmt_host }}"
      tags:
        - discovery

    - name: Ensure SSL certificate is present if SSL verification is enabled
      ansible.builtin.stat:
        path: "{{ vast_ssl_cert_path }}"
      register: vast_ssl_cert
      when: vast_verify_ssl | bool
      delegate_to: localhost
      tags:
        - ssl

    - name: Warn if SSL certificate is not found
      ansible.builtin.debug:
        msg: "WARNING: SSL verification is enabled but certificate not found at {{ vast_ssl_cert_path }}"
      when:
        - vast_verify_ssl | bool
        - not vast_ssl_cert.stat.exists
      tags:
        - ssl

    # ----------------------------- postflight -------------------

    - name: "vast/vast_config/prerequisites | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_config_prerequisites_preflight_passed | bool
          - fe_vast_vast_config_prerequisites_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_config/prerequisites: postflight validation failed - preflight passed
          ={{ fe_vast_vast_config_prerequisites_preflight_passed | default(false) }},
          status={{ fe_vast_vast_config_prerequisites_status | default('unknown') }}.
        success_msg: "vast/vast_config/prerequisites: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_config/prerequisites | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_config_prerequisites_postflight_passed: true
        fe_vast_vast_config_prerequisites_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_config/prerequisites | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_config_prerequisites_status: "failed"
        fe_vast_vast_config_prerequisites_postflight_passed: false
        fe_vast_vast_config_prerequisites_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_config_prerequisites_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_config/prerequisites | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_config/prerequisites: FAILED at '{{ fe_vast_vast_config_prerequisites_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_config_prerequisites_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_config/prerequisites | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_config/prerequisites failed at '{{ fe_vast_vast_config_prerequisites_failed_task }}': {{ fe_vast_vast_config_prerequisites_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_config/prerequisites | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_config_prerequisites_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_config_prerequisites_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_config_prerequisites_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_config/prerequisites | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_config/prerequisites":
              component: "vast/vast_config/prerequisites"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_config_prerequisites_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_config_prerequisites_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_config_prerequisites_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_config_prerequisites_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_config_prerequisites_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_config_prerequisites_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_config_prerequisites_failed_task | default('') }}"
              error: "{{ fe_vast_vast_config_prerequisites_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_config_prerequisites_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_config_prerequisites_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_config_prerequisites_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_config_prerequisites_status | default('') == 'succeeded' else ['vast/vast_config/prerequisites'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_config/prerequisites | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_config_prerequisites_stats_published: true
      tags:
        - always
