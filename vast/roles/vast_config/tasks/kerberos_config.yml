---
# Kerberos configuration tasks for VAST

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_config/kerberos_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_config_kerberos_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_config/kerberos_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_config_kerberos_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_config_kerberos_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_config_kerberos_config_status: "running"
    fe_vast_vast_config_kerberos_config_preflight_passed: false
    fe_vast_vast_config_kerberos_config_postflight_passed: false
    fe_vast_vast_config_kerberos_config_failed_task: ""
    fe_vast_vast_config_kerberos_config_error: ""
    fe_vast_vast_config_kerberos_config_stats_published: false
  tags:
    - always

- name: "vast/vast_config/kerberos_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_config/kerberos_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_config/kerberos_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_config/kerberos_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/kerberos_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_config/kerberos_config: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_config/kerberos_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_config_kerberos_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/kerberos_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_config_kerberos_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get current Kerberos configuration
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/kerberos"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
        status_code: [200, 404]
      no_log: true
      register: vast_kerberos_current
      delegate_to: localhost
      changed_when: false
      tags:
        - kerberos
        - discovery

    - name: Configure Kerberos realm
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/kerberos"
        method: "{{ 'POST' if vast_kerberos_current.status == 404 else 'PATCH' }}"
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          realm: "{{ vast_kerberos_realm }}"
          kdc: "{{ vast_kerberos_kdc }}"
          enabled: true
        status_code: [200, 201, 204]
      no_log: true
      delegate_to: localhost
      when:
        - vast_kerberos_realm != ''
        - vast_kerberos_kdc != ''
      tags:
        - kerberos
        - authentication

    - name: Generate Kerberos keytab
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/kerberos/keytab"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          realm: "{{ vast_kerberos_realm }}"
          principal: "nfs/{{ vast_cluster_name }}.{{ vast_cluster_domain }}@{{ vast_kerberos_realm }}"
        status_code: [200, 201]
      no_log: true
      register: vast_kerberos_keytab
      delegate_to: localhost
      when:
        - vast_kerberos_realm != ''
      tags:
        - kerberos
        - keytab

    - name: Enable Kerberos authentication for NFS
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/nfs"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          kerberos_enabled: true
          kerberos_realm: "{{ vast_kerberos_realm }}"
          supported_sec_flavors:
            - "krb5"
            - "krb5i"
            - "krb5p"
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - kerberos
        - nfs

    - name: Display Kerberos configuration status
      ansible.builtin.debug:
        msg:
          - "Kerberos Realm: {{ vast_kerberos_realm }}"
          - "KDC Server: {{ vast_kerberos_kdc }}"
          - "Keytab Generated: {{ 'Yes' if vast_kerberos_keytab is changed else 'Already exists' }}"
      when: vast_kerberos_keytab is defined
      tags:
        - kerberos

    # ----------------------------- postflight -------------------

    - name: "vast/vast_config/kerberos_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_config_kerberos_config_preflight_passed | bool
          - fe_vast_vast_config_kerberos_config_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_config/kerberos_config: postflight validation failed - preflight passed
          ={{ fe_vast_vast_config_kerberos_config_preflight_passed | default(false) }},
          status={{ fe_vast_vast_config_kerberos_config_status | default('unknown') }}.
        success_msg: "vast/vast_config/kerberos_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_config/kerberos_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_config_kerberos_config_postflight_passed: true
        fe_vast_vast_config_kerberos_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_config/kerberos_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_config_kerberos_config_status: "failed"
        fe_vast_vast_config_kerberos_config_postflight_passed: false
        fe_vast_vast_config_kerberos_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_config_kerberos_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_config/kerberos_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_config/kerberos_config: FAILED at '{{ fe_vast_vast_config_kerberos_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_config_kerberos_config_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_config/kerberos_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_config/kerberos_config failed at '{{ fe_vast_vast_config_kerberos_config_failed_task }}': {{ fe_vast_vast_config_kerberos_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_config/kerberos_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_config_kerberos_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_config_kerberos_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_config_kerberos_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_config/kerberos_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_config/kerberos_config":
              component: "vast/vast_config/kerberos_config"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_config_kerberos_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_config_kerberos_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_config_kerberos_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_config_kerberos_config_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_config_kerberos_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_config_kerberos_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_config_kerberos_config_failed_task | default('') }}"
              error: "{{ fe_vast_vast_config_kerberos_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_config_kerberos_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_config_kerberos_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_config_kerberos_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_config_kerberos_config_status | default('') == 'succeeded' else ['vast/vast_config/kerberos_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_config/kerberos_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_config_kerberos_config_stats_published: true
      tags:
        - always
