---
# User and RBAC configuration tasks for VAST

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['vast/vast_config/user_rbac_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_vast_vast_config_user_rbac_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "vast/vast_config/user_rbac_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_vast_vast_config_user_rbac_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_vast_vast_config_user_rbac_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_vast_vast_config_user_rbac_config_status: "running"
    fe_vast_vast_config_user_rbac_config_preflight_passed: false
    fe_vast_vast_config_user_rbac_config_postflight_passed: false
    fe_vast_vast_config_user_rbac_config_failed_task: ""
    fe_vast_vast_config_user_rbac_config_error: ""
    fe_vast_vast_config_user_rbac_config_stats_published: false
  tags:
    - always

- name: "vast/vast_config/user_rbac_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "vast/vast_config/user_rbac_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          vast/vast_config/user_rbac_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          vast/vast_config/user_rbac_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/user_rbac_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "vast/vast_config/user_rbac_config: required variable '{{ item }}' is not defined."
        success_msg: "vast/vast_config/user_rbac_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_vast_vast_config_user_rbac_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "vast/vast_config/user_rbac_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_vast_vast_config_user_rbac_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get existing local users
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/users"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_users_existing
      delegate_to: localhost
      changed_when: false
      tags:
        - users
        - rbac
        - discovery

    - name: Create local users
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/users"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          username: "{{ item.username }}"
          password: "{{ item.password }}"
          role: "{{ item.role }}"
          enabled: "{{ item.enabled | default(true) }}"
        status_code: [200, 201, 409]
      loop: "{{ vast_local_users }}"
      when:
        - vast_local_users is defined
        - vast_local_users | length > 0
        - vast_users_existing.json | selectattr('username', 'equalto', item.username) | list | length == 0
      delegate_to: localhost
      no_log: true
      tags:
        - users
        - rbac

    - name: Get existing custom roles
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/roles"
        method: GET
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        return_content: true
      no_log: true
      register: vast_roles_existing
      delegate_to: localhost
      changed_when: false
      tags:
        - rbac
        - discovery

    - name: Create custom RBAC roles
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/roles"
        method: POST
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          permissions: "{{ item.permissions }}"
        status_code: [200, 201, 409]
      no_log: true
      loop: "{{ vast_custom_roles }}"
      when:
        - vast_custom_roles is defined
        - vast_custom_roles | length > 0
        - vast_roles_existing.json | selectattr('name', 'equalto', item.name) | list | length == 0
      delegate_to: localhost
      tags:
        - rbac
        - roles

    - name: Configure password policy (DoD STIG requirement)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/password-policy"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          min_length: "{{ vast_global_settings.min_password_length }}"
          complexity_required: "{{ vast_global_settings.password_complexity_required }}"
          max_age_days: 60
          history_count: 24
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - rbac
        - security
        - password_policy

    - name: Configure session timeout (NIST 800-53 AC-12)
      ansible.builtin.uri:
        url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/session"
        method: PATCH
        user: "{{ vast_mgmt_user }}"
        password: "{{ vast_mgmt_password }}"
        force_basic_auth: true
        validate_certs: "{{ vast_verify_ssl }}"
        body_format: json
        body:
          timeout_minutes: "{{ vast_global_settings.session_timeout_minutes }}"
          max_concurrent_sessions: 3
        status_code: [200, 204]
      no_log: true
      delegate_to: localhost
      tags:
        - rbac
        - security
        - session

    - name: Display user and RBAC configuration
      ansible.builtin.debug:
        msg:
          - "Local users created: {{ vast_local_users | length }}"
          - "Custom roles created: {{ vast_custom_roles | length }}"
          - "Password policy: Minimum {{ vast_global_settings.min_password_length }} characters"
          - "Session timeout: {{ vast_global_settings.session_timeout_minutes }} minutes"
      tags:
        - users
        - rbac

    # ----------------------------- postflight -------------------

    - name: "vast/vast_config/user_rbac_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_vast_vast_config_user_rbac_config_preflight_passed | bool
          - fe_vast_vast_config_user_rbac_config_status in ['running', 'succeeded']
        fail_msg: >-
          vast/vast_config/user_rbac_config: postflight validation failed - preflight passed
          ={{ fe_vast_vast_config_user_rbac_config_preflight_passed | default(false) }},
          status={{ fe_vast_vast_config_user_rbac_config_status | default('unknown') }}.
        success_msg: "vast/vast_config/user_rbac_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "vast/vast_config/user_rbac_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_vast_vast_config_user_rbac_config_postflight_passed: true
        fe_vast_vast_config_user_rbac_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "vast/vast_config/user_rbac_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_vast_vast_config_user_rbac_config_status: "failed"
        fe_vast_vast_config_user_rbac_config_postflight_passed: false
        fe_vast_vast_config_user_rbac_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_vast_vast_config_user_rbac_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "vast/vast_config/user_rbac_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          vast/vast_config/user_rbac_config: FAILED at '{{ fe_vast_vast_config_user_rbac_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_vast_vast_config_user_rbac_config_error }}
      tags:
        - always
        - rescue

    - name: "vast/vast_config/user_rbac_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          vast/vast_config/user_rbac_config failed at '{{ fe_vast_vast_config_user_rbac_config_failed_task }}': {{ fe_vast_vast_config_user_rbac_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "vast/vast_config/user_rbac_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_vast_vast_config_user_rbac_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_vast_vast_config_user_rbac_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_vast_config_user_rbac_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "vast/vast_config/user_rbac_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "vast/vast_config/user_rbac_config":
              component: "vast/vast_config/user_rbac_config"
              type: "role-tasks"
              platform: "vast"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_vast_vast_config_user_rbac_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_vast_vast_config_user_rbac_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_vast_vast_config_user_rbac_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_vast_vast_config_user_rbac_config_started_at | default('') }}"
              ended_at: "{{ fe_vast_vast_config_user_rbac_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_vast_vast_config_user_rbac_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_vast_vast_config_user_rbac_config_failed_task | default('') }}"
              error: "{{ fe_vast_vast_config_user_rbac_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_vast_vast_config_user_rbac_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_vast_vast_config_user_rbac_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_vast_vast_config_user_rbac_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_vast_vast_config_user_rbac_config_status | default('') == 'succeeded' else ['vast/vast_config/user_rbac_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "vast/vast_config/user_rbac_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_vast_vast_config_user_rbac_config_stats_published: true
      tags:
        - always
