---
# Production deployment playbook for VAST Data Storage
# This playbook performs full configuration, hardening, and monitoring setup
# Suitable for Fourth Estate production environments

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy VAST Data Storage - Production Ready
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars_files:
    - ../vars/production.yml
    - ../vars/vault.yml  # Encrypted with ansible-vault

  pre_tasks:
    - name: "vast/deploy_production | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vast/deploy_production | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vast_deploy_production_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_deploy_production_status: "running"
            fe_vast_deploy_production_preflight_passed: false
            fe_vast_deploy_production_postflight_passed: false
            fe_vast_deploy_production_failed_task: ""
            fe_vast_deploy_production_error: ""
            fe_vast_deploy_production_stats_published: false
          tags:
            - always

        - name: "vast/deploy_production | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vast/deploy_production: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vast/deploy_production: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vast/deploy_production | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vast/deploy_production: required variable '{{ item }}' is not defined."
            success_msg: "vast/deploy_production: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vast_deploy_production_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vast/deploy_production | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "vast/deploy_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_status: "preflight_failed"
            fe_vast_deploy_production_postflight_passed: false
            fe_vast_deploy_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_deploy_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: FAILED at '{{ fe_vast_deploy_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_deploy_production_error }}
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/deploy_production":
                  component: "vast/deploy_production"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_deploy_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_deploy_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_deploy_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_deploy_production_started_at | default('') }}"
                  ended_at: "{{ fe_vast_deploy_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_deploy_production_failed_task | default('') }}"
                  error: "{{ fe_vast_deploy_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_deploy_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_deploy_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_deploy_production_status | default('') == 'succeeded' else ['vast/deploy_production'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vast/deploy_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_stats_published: true
          tags:
            - always

        - name: "vast/deploy_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/deploy_production failed at '{{ fe_vast_deploy_production_failed_task }}': {{ fe_vast_deploy_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/deploy_production | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: preflight
              {{ 'passed' if fe_vast_deploy_production_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "vast/deploy_production | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Display deployment information
          ansible.builtin.debug:
            msg:
              - "Deploying VAST Data Storage Configuration"
              - "Environment: Production"
              - "Target Cluster: {{ vast_mgmt_host }}"
              - "Compliance: DoD STIG, NIST 800-53"

        - name: "vast/deploy_production | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "vast/deploy_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_status: "failed"
            fe_vast_deploy_production_postflight_passed: false
            fe_vast_deploy_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_deploy_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: FAILED at '{{ fe_vast_deploy_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_deploy_production_error }}
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/deploy_production failed at '{{ fe_vast_deploy_production_failed_task }}': {{ fe_vast_deploy_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/deploy_production | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_deploy_production_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_deploy_production_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/deploy_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/deploy_production":
                  component: "vast/deploy_production"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_deploy_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_deploy_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_deploy_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_deploy_production_started_at | default('') }}"
                  ended_at: "{{ fe_vast_deploy_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_deploy_production_failed_task | default('') }}"
                  error: "{{ fe_vast_deploy_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_deploy_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_deploy_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_deploy_production_status | default('') == 'succeeded' else ['vast/deploy_production'] }}
            aggregate: true
            per_host: false
          when:
            - fe_vast_deploy_production_status | default('') == 'failed'
            - not (fe_vast_deploy_production_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/deploy_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_stats_published: true
          when:
            - fe_vast_deploy_production_status | default('') == 'failed'
          tags:
            - always

  roles:
    - role: ../roles/vast_config
      tags: ['config', 'base']

    - role: ../roles/vast_security_hardening
      tags: ['security', 'hardening', 'stig']

    - role: ../roles/vast_monitoring
      tags: ['monitoring', 'alerting']

    - role: ../roles/vast_backup_dr
      tags: ['backup', 'dr']

  post_tasks:
    - name: Verify compliance status
      ansible.builtin.include_tasks: ../tasks/verify_compliance.yml
      tags: ['verification', 'compliance']

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "VAST deployment completed successfully"
          - "Security hardening: Applied"
          - "Monitoring: Configured"
          - "Backup/DR: Enabled"
          - "Next steps: Review compliance report and configure application access"
    - name: "vast/deploy_production | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "vast/deploy_production | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_vast_deploy_production_preflight_passed | bool
              - fe_vast_deploy_production_status in ['running', 'succeeded']
            fail_msg: >-
              vast/deploy_production: postflight validation failed - preflight passed
              ={{ fe_vast_deploy_production_preflight_passed | default(false) }},
              status={{ fe_vast_deploy_production_status | default('unknown') }}.
            success_msg: "vast/deploy_production: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "vast/deploy_production | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_postflight_passed: true
            fe_vast_deploy_production_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "vast/deploy_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_status: "failed"
            fe_vast_deploy_production_postflight_passed: false
            fe_vast_deploy_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_deploy_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: FAILED at '{{ fe_vast_deploy_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_deploy_production_error }}
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/deploy_production failed at '{{ fe_vast_deploy_production_failed_task }}': {{ fe_vast_deploy_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/deploy_production | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_deploy_production_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_deploy_production_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/deploy_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/deploy_production":
                  component: "vast/deploy_production"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_deploy_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_deploy_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_deploy_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_deploy_production_started_at | default('') }}"
                  ended_at: "{{ fe_vast_deploy_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_deploy_production_failed_task | default('') }}"
                  error: "{{ fe_vast_deploy_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_deploy_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_deploy_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_deploy_production_status | default('') == 'succeeded' else ['vast/deploy_production'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_vast_deploy_production_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/deploy_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_stats_published: true
          tags:
            - always

        - name: "vast/deploy_production | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: {{ fe_vast_deploy_production_status | default('unknown') }} in
              {{ fe_vast_deploy_production_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "vast/deploy_production | Guarded execution with rescue and always handling"
      block:

        - name: "vast/deploy_production | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "vast/deploy_production | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_status: "failed"
            fe_vast_deploy_production_postflight_passed: false
            fe_vast_deploy_production_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_deploy_production_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/deploy_production: FAILED at '{{ fe_vast_deploy_production_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_deploy_production_error }}
          tags:
            - always
            - rescue

        - name: "vast/deploy_production | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/deploy_production failed at '{{ fe_vast_deploy_production_failed_task }}': {{ fe_vast_deploy_production_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/deploy_production | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_deploy_production_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_deploy_production_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/deploy_production | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/deploy_production":
                  component: "vast/deploy_production"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_deploy_production_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_deploy_production_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_deploy_production_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_deploy_production_started_at | default('') }}"
                  ended_at: "{{ fe_vast_deploy_production_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_deploy_production_failed_task | default('') }}"
                  error: "{{ fe_vast_deploy_production_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_deploy_production_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_deploy_production_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_deploy_production_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_deploy_production_status | default('') == 'succeeded' else ['vast/deploy_production'] }}
            aggregate: true
            per_host: false
          when:
            - fe_vast_deploy_production_status | default('') == 'failed'
            - not (fe_vast_deploy_production_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/deploy_production | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_deploy_production_stats_published: true
          when:
            - fe_vast_deploy_production_status | default('') == 'failed'
          tags:
            - always
