---
# Create VAST filesystem/view playbook
# Simple playbook for creating new filesystems with proper security

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Create VAST Filesystem
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars_files:
    - ../vars/production.yml
    - ../vars/vault.yml

  vars_prompt:
    - name: view_name
      prompt: "Enter filesystem name"
      private: false

    - name: view_path
      prompt: "Enter filesystem path"
      private: false
      default: "/vms"

    - name: view_quota_gb
      prompt: "Enter quota size in GB (0 for unlimited)"
      private: false
      default: "0"

  tasks:
    - name: "vast/create_filesystem | Guarded execution with rescue and always handling"
      block:

        - name: Validate input
          ansible.builtin.assert:
            that:
              - view_name is defined
              - view_name | length > 0
              - view_path is defined
            fail_msg: "Invalid input parameters"

        - name: Create VAST view/filesystem
          ansible.builtin.include_tasks: ../tasks/create_view.yml
          vars:
            view_protocols: ['nfs', 'smb']
            view_snapshot_enabled: true

        - name: Apply security settings to new view
          ansible.builtin.uri:
            url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/views/{{ view_name }}/security"
            method: PATCH
            user: "{{ vast_mgmt_user }}"
            password: "{{ vast_mgmt_password }}"
            force_basic_auth: true
            validate_certs: "{{ vast_verify_ssl }}"
            body_format: json
            body:
              enforce_encryption: true
              require_signing: true
            status_code: [200, 204]
          delegate_to: localhost
          no_log: true

        - name: Display filesystem information
          ansible.builtin.debug:
            msg:
              - "Filesystem created successfully"
              - "Name: {{ view_name }}"
              - "Path: {{ view_path }}"
              - "Quota: {{ view_quota_gb }}GB"
              - "Security: Encryption and signing enabled"

        - name: "vast/create_filesystem | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "vast/create_filesystem | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_status: "failed"
            fe_vast_create_filesystem_postflight_passed: false
            fe_vast_create_filesystem_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_create_filesystem_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/create_filesystem: FAILED at '{{ fe_vast_create_filesystem_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_create_filesystem_error }}
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/create_filesystem failed at '{{ fe_vast_create_filesystem_failed_task }}': {{ fe_vast_create_filesystem_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/create_filesystem | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_create_filesystem_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_create_filesystem_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/create_filesystem | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/create_filesystem":
                  component: "vast/create_filesystem"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_create_filesystem_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_create_filesystem_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_create_filesystem_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_create_filesystem_started_at | default('') }}"
                  ended_at: "{{ fe_vast_create_filesystem_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_create_filesystem_failed_task | default('') }}"
                  error: "{{ fe_vast_create_filesystem_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_create_filesystem_status | default('') == 'succeeded' else ['vast/create_filesystem'] }}
            aggregate: true
            per_host: false
          when:
            - fe_vast_create_filesystem_status | default('') == 'failed'
            - not (fe_vast_create_filesystem_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/create_filesystem | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_stats_published: true
          when:
            - fe_vast_create_filesystem_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "vast/create_filesystem | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vast/create_filesystem | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vast_create_filesystem_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_create_filesystem_status: "running"
            fe_vast_create_filesystem_preflight_passed: false
            fe_vast_create_filesystem_postflight_passed: false
            fe_vast_create_filesystem_failed_task: ""
            fe_vast_create_filesystem_error: ""
            fe_vast_create_filesystem_stats_published: false
          tags:
            - always

        - name: "vast/create_filesystem | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vast/create_filesystem: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vast/create_filesystem: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vast/create_filesystem | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vast/create_filesystem: required variable '{{ item }}' is not defined."
            success_msg: "vast/create_filesystem: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vast_create_filesystem_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vast/create_filesystem | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "vast/create_filesystem | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_status: "preflight_failed"
            fe_vast_create_filesystem_postflight_passed: false
            fe_vast_create_filesystem_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_create_filesystem_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/create_filesystem: FAILED at '{{ fe_vast_create_filesystem_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_create_filesystem_error }}
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/create_filesystem":
                  component: "vast/create_filesystem"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_create_filesystem_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_create_filesystem_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_create_filesystem_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_create_filesystem_started_at | default('') }}"
                  ended_at: "{{ fe_vast_create_filesystem_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_create_filesystem_failed_task | default('') }}"
                  error: "{{ fe_vast_create_filesystem_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_create_filesystem_status | default('') == 'succeeded' else ['vast/create_filesystem'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vast/create_filesystem | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_stats_published: true
          tags:
            - always

        - name: "vast/create_filesystem | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/create_filesystem failed at '{{ fe_vast_create_filesystem_failed_task }}': {{ fe_vast_create_filesystem_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/create_filesystem | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vast/create_filesystem: preflight
              {{ 'passed' if fe_vast_create_filesystem_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "vast/create_filesystem | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "vast/create_filesystem | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_vast_create_filesystem_preflight_passed | bool
              - fe_vast_create_filesystem_status in ['running', 'succeeded']
            fail_msg: >-
              vast/create_filesystem: postflight validation failed - preflight passed
              ={{ fe_vast_create_filesystem_preflight_passed | default(false) }},
              status={{ fe_vast_create_filesystem_status | default('unknown') }}.
            success_msg: "vast/create_filesystem: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "vast/create_filesystem | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_postflight_passed: true
            fe_vast_create_filesystem_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "vast/create_filesystem | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_status: "failed"
            fe_vast_create_filesystem_postflight_passed: false
            fe_vast_create_filesystem_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_create_filesystem_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/create_filesystem: FAILED at '{{ fe_vast_create_filesystem_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_create_filesystem_error }}
          tags:
            - always
            - rescue

        - name: "vast/create_filesystem | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/create_filesystem failed at '{{ fe_vast_create_filesystem_failed_task }}': {{ fe_vast_create_filesystem_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/create_filesystem | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_create_filesystem_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_create_filesystem_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/create_filesystem | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/create_filesystem":
                  component: "vast/create_filesystem"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_create_filesystem_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_create_filesystem_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_create_filesystem_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_create_filesystem_started_at | default('') }}"
                  ended_at: "{{ fe_vast_create_filesystem_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_create_filesystem_failed_task | default('') }}"
                  error: "{{ fe_vast_create_filesystem_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_create_filesystem_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_create_filesystem_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_create_filesystem_status | default('') == 'succeeded' else ['vast/create_filesystem'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_vast_create_filesystem_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/create_filesystem | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_create_filesystem_stats_published: true
          tags:
            - always

        - name: "vast/create_filesystem | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              vast/create_filesystem: {{ fe_vast_create_filesystem_status | default('unknown') }} in
              {{ fe_vast_create_filesystem_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
