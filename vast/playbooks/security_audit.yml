---
# Security audit playbook for VAST Data Storage
# Performs comprehensive security and compliance checks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: VAST Security Audit - DoD STIG and NIST Compliance
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars_files:
    - ../vars/production.yml
    - ../vars/vault.yml

  tasks:
    - name: "vast/security_audit | Guarded execution with rescue and always handling"
      block:

        - name: Run security hardening checks (read-only)
          ansible.builtin.include_role:
            name: ../roles/vast_security_hardening
            tasks_from: compliance_check.yml
          tags: ['audit', 'compliance']

        - name: Check encryption status
          ansible.builtin.uri:
            url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/encryption/status"
            method: GET
            user: "{{ vast_mgmt_user }}"
            password: "{{ vast_mgmt_password }}"
            force_basic_auth: true
            validate_certs: "{{ vast_verify_ssl }}"
            return_content: true
          register: encryption_status
          delegate_to: localhost
          no_log: true

        - name: Check FIPS mode status
          ansible.builtin.uri:
            url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/security/fips/status"
            method: GET
            user: "{{ vast_mgmt_user }}"
            password: "{{ vast_mgmt_password }}"
            force_basic_auth: true
            validate_certs: "{{ vast_verify_ssl }}"
            return_content: true
          register: fips_status
          delegate_to: localhost
          no_log: true

        - name: Check audit logging status
          ansible.builtin.uri:
            url: "https://{{ vast_mgmt_host }}:{{ vast_mgmt_port }}/api/{{ vast_api_version }}/audit/config"
            method: GET
            user: "{{ vast_mgmt_user }}"
            password: "{{ vast_mgmt_password }}"
            force_basic_auth: true
            validate_certs: "{{ vast_verify_ssl }}"
            return_content: true
          register: audit_status
          delegate_to: localhost
          no_log: true

        - name: Generate security audit report
          ansible.builtin.template:
            src: ../templates/security_report.j2
            dest: "/tmp/vast_security_audit_{{ ansible_date_time.date }}.txt"
          vars:
            report_date: "{{ ansible_date_time.iso8601 }}"
            cluster_name: "{{ vast_cluster_name }}"
          delegate_to: localhost

        - name: Display audit summary
          ansible.builtin.debug:
            msg:
              - "Security Audit Completed"
              - "FIPS Mode: {{ fips_status.json.enabled | default('unknown') }}"
              - "Encryption at Rest: {{ encryption_status.json.at_rest_enabled | default('unknown') }}"
              - "Audit Logging: {{ audit_status.json.enabled | default('unknown') }}"
              - "Report saved to: /tmp/vast_security_audit_{{ ansible_date_time.date }}.txt"

      rescue:

        - name: "vast/security_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_security_audit_status: "failed"
            fe_vast_security_audit_postflight_passed: false
            fe_vast_security_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_security_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/security_audit: FAILED at '{{ fe_vast_security_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_security_audit_error }}
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/security_audit failed at '{{ fe_vast_security_audit_failed_task }}': {{ fe_vast_security_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/security_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_security_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_security_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_security_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/security_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/security_audit":
                  component: "vast/security_audit"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_security_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_security_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_security_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_security_audit_started_at | default('') }}"
                  ended_at: "{{ fe_vast_security_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_security_audit_failed_task | default('') }}"
                  error: "{{ fe_vast_security_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_security_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_security_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_security_audit_status | default('') == 'succeeded' else ['vast/security_audit'] }}
            aggregate: true
            per_host: false
          when:
            - fe_vast_security_audit_status | default('') == 'failed'
            - not (fe_vast_security_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/security_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_security_audit_stats_published: true
          when:
            - fe_vast_security_audit_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "vast/security_audit | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "vast/security_audit | Initialize validation state"
          ansible.builtin.set_fact:
            fe_vast_security_audit_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_vast_security_audit_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_security_audit_status: "running"
            fe_vast_security_audit_preflight_passed: false
            fe_vast_security_audit_postflight_passed: false
            fe_vast_security_audit_failed_task: ""
            fe_vast_security_audit_error: ""
            fe_vast_security_audit_stats_published: false
          tags:
            - always

        - name: "vast/security_audit | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              vast/security_audit: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              vast/security_audit: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "vast/security_audit | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "vast/security_audit: required variable '{{ item }}' is not defined."
            success_msg: "vast/security_audit: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_vast_security_audit_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "vast/security_audit | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_vast_security_audit_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "vast/security_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_security_audit_status: "preflight_failed"
            fe_vast_security_audit_postflight_passed: false
            fe_vast_security_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_security_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/security_audit: FAILED at '{{ fe_vast_security_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_security_audit_error }}
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/security_audit":
                  component: "vast/security_audit"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_security_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_security_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_security_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_security_audit_started_at | default('') }}"
                  ended_at: "{{ fe_vast_security_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_security_audit_failed_task | default('') }}"
                  error: "{{ fe_vast_security_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_security_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_security_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_security_audit_status | default('') == 'succeeded' else ['vast/security_audit'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "vast/security_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_security_audit_stats_published: true
          tags:
            - always

        - name: "vast/security_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/security_audit failed at '{{ fe_vast_security_audit_failed_task }}': {{ fe_vast_security_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/security_audit | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              vast/security_audit: preflight
              {{ 'passed' if fe_vast_security_audit_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "vast/security_audit | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "vast/security_audit | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_vast_security_audit_preflight_passed | bool
              - fe_vast_security_audit_status in ['running', 'succeeded']
            fail_msg: >-
              vast/security_audit: postflight validation failed - preflight passed
              ={{ fe_vast_security_audit_preflight_passed | default(false) }},
              status={{ fe_vast_security_audit_status | default('unknown') }}.
            success_msg: "vast/security_audit: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "vast/security_audit | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_vast_security_audit_postflight_passed: true
            fe_vast_security_audit_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "vast/security_audit | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_vast_security_audit_status: "failed"
            fe_vast_security_audit_postflight_passed: false
            fe_vast_security_audit_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_vast_security_audit_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              vast/security_audit: FAILED at '{{ fe_vast_security_audit_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_vast_security_audit_error }}
          tags:
            - always
            - rescue

        - name: "vast/security_audit | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              vast/security_audit failed at '{{ fe_vast_security_audit_failed_task }}': {{ fe_vast_security_audit_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "vast/security_audit | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_vast_security_audit_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_vast_security_audit_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_vast_security_audit_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "vast/security_audit | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "vast/security_audit":
                  component: "vast/security_audit"
                  type: "playbook"
                  platform: "vast"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_vast_security_audit_status | default('unknown') }}"
                  preflight_passed: "{{ fe_vast_security_audit_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_vast_security_audit_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_vast_security_audit_started_at | default('') }}"
                  ended_at: "{{ fe_vast_security_audit_ended_at | default('') }}"
                  duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_vast_security_audit_failed_task | default('') }}"
                  error: "{{ fe_vast_security_audit_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_vast_security_audit_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_vast_security_audit_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_vast_security_audit_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_vast_security_audit_status | default('') == 'succeeded' else ['vast/security_audit'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_vast_security_audit_stats_published | default(false) | bool)
          tags:
            - always

        - name: "vast/security_audit | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_vast_security_audit_stats_published: true
          tags:
            - always

        - name: "vast/security_audit | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              vast/security_audit: {{ fe_vast_security_audit_status | default('unknown') }} in
              {{ fe_vast_security_audit_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
