---
# Check Point Deployment Playbook
# Entry point for Check Point firewall automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Check Point Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_services: true
    deploy_access_policy: true
    deploy_threat_prevention: true
    deploy_identity: true
    deploy_inventory: true

  tasks:
    - name: "checkpoint/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Services Catalog
          ansible.builtin.include_role:
            name: cp_services_catalog
          when: deploy_services | bool
          tags: ['services', 'phase1']

        - name: Phase 2 - Access Policy
          ansible.builtin.include_role:
            name: cp_access_policy
          when: deploy_access_policy | bool
          tags: ['policy', 'phase2']

        - name: Phase 3 - Threat Prevention
          ansible.builtin.include_role:
            name: cp_threat_prevention
          when: deploy_threat_prevention | bool
          tags: ['threat', 'phase3']

        - name: Phase 4 - Identity Awareness
          ansible.builtin.include_role:
            name: cp_identity_awareness
          when: deploy_identity | bool
          tags: ['identity', 'phase4']

        - name: Phase 5 - Inventory Model
          ansible.builtin.include_role:
            name: cp_inventory_model
          when: deploy_inventory | bool
          tags: ['inventory', 'phase5']

        - name: Phase 6 - Inventory Prune
          ansible.builtin.include_role:
            name: cp_inventory_prune
          tags: ['inventory', 'hygiene', 'phase6']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== Check Point Deployment Complete ==="
              - "Policy Package: {{ checkpoint_policy_package | default('Standard') }}"
              - "Threat Prevention: {{ 'Enabled' if deploy_threat_prevention else 'Skipped' }}"
              - "Identity Awareness: {{ 'Enabled' if deploy_identity else 'Skipped' }}"
          tags: ['always']

      rescue:

        - name: "checkpoint/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_checkpoint_site_status: "failed"
            fe_checkpoint_site_postflight_passed: false
            fe_checkpoint_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_checkpoint_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              checkpoint/site: FAILED at '{{ fe_checkpoint_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_checkpoint_site_error }}
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              checkpoint/site failed at '{{ fe_checkpoint_site_failed_task }}': {{ fe_checkpoint_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "checkpoint/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_checkpoint_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_checkpoint_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "checkpoint/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "checkpoint/site":
                  component: "checkpoint/site"
                  type: "playbook"
                  platform: "checkpoint"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_checkpoint_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_checkpoint_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_checkpoint_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_checkpoint_site_started_at | default('') }}"
                  ended_at: "{{ fe_checkpoint_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_checkpoint_site_failed_task | default('') }}"
                  error: "{{ fe_checkpoint_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_checkpoint_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_checkpoint_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_checkpoint_site_status | default('') == 'succeeded' else ['checkpoint/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_checkpoint_site_status | default('') == 'failed'
            - not (fe_checkpoint_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "checkpoint/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_checkpoint_site_stats_published: true
          when:
            - fe_checkpoint_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "checkpoint/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "checkpoint/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_checkpoint_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_checkpoint_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_checkpoint_site_status: "running"
            fe_checkpoint_site_preflight_passed: false
            fe_checkpoint_site_postflight_passed: false
            fe_checkpoint_site_failed_task: ""
            fe_checkpoint_site_error: ""
            fe_checkpoint_site_stats_published: false
          tags:
            - always

        - name: "checkpoint/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              checkpoint/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              checkpoint/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "checkpoint/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "checkpoint/site: required variable '{{ item }}' is not defined."
            success_msg: "checkpoint/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_checkpoint_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "checkpoint/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_checkpoint_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "checkpoint/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_checkpoint_site_status: "preflight_failed"
            fe_checkpoint_site_postflight_passed: false
            fe_checkpoint_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_checkpoint_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              checkpoint/site: FAILED at '{{ fe_checkpoint_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_checkpoint_site_error }}
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "checkpoint/site":
                  component: "checkpoint/site"
                  type: "playbook"
                  platform: "checkpoint"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_checkpoint_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_checkpoint_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_checkpoint_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_checkpoint_site_started_at | default('') }}"
                  ended_at: "{{ fe_checkpoint_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_checkpoint_site_failed_task | default('') }}"
                  error: "{{ fe_checkpoint_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_checkpoint_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_checkpoint_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_checkpoint_site_status | default('') == 'succeeded' else ['checkpoint/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "checkpoint/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_checkpoint_site_stats_published: true
          tags:
            - always

        - name: "checkpoint/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              checkpoint/site failed at '{{ fe_checkpoint_site_failed_task }}': {{ fe_checkpoint_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "checkpoint/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              checkpoint/site: preflight
              {{ 'passed' if fe_checkpoint_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "checkpoint/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "checkpoint/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_checkpoint_site_preflight_passed | bool
              - fe_checkpoint_site_status in ['running', 'succeeded']
            fail_msg: >-
              checkpoint/site: postflight validation failed - preflight passed
              ={{ fe_checkpoint_site_preflight_passed | default(false) }},
              status={{ fe_checkpoint_site_status | default('unknown') }}.
            success_msg: "checkpoint/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "checkpoint/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_checkpoint_site_postflight_passed: true
            fe_checkpoint_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "checkpoint/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_checkpoint_site_status: "failed"
            fe_checkpoint_site_postflight_passed: false
            fe_checkpoint_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_checkpoint_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              checkpoint/site: FAILED at '{{ fe_checkpoint_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_checkpoint_site_error }}
          tags:
            - always
            - rescue

        - name: "checkpoint/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              checkpoint/site failed at '{{ fe_checkpoint_site_failed_task }}': {{ fe_checkpoint_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "checkpoint/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_checkpoint_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_checkpoint_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "checkpoint/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "checkpoint/site":
                  component: "checkpoint/site"
                  type: "playbook"
                  platform: "checkpoint"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_checkpoint_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_checkpoint_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_checkpoint_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_checkpoint_site_started_at | default('') }}"
                  ended_at: "{{ fe_checkpoint_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_checkpoint_site_failed_task | default('') }}"
                  error: "{{ fe_checkpoint_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_checkpoint_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_checkpoint_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_checkpoint_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_checkpoint_site_status | default('') == 'succeeded' else ['checkpoint/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_checkpoint_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "checkpoint/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_checkpoint_site_stats_published: true
          tags:
            - always

        - name: "checkpoint/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              checkpoint/site: {{ fe_checkpoint_site_status | default('unknown') }} in
              {{ fe_checkpoint_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
