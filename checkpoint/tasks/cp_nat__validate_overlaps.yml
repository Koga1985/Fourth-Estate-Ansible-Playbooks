---
# Heuristic validation of NAT overlaps/conflicts.
# Flags:
#  • Duplicate original tuple (Src/Dst/Svc) used in multiple rules
#  • Earlier broader rule (Any or equal) that may shadow a later specific rule
#  • Same original tuple but different translation (potential conflict)
#
# Vars:
#   policy_package: "Standard"
#   artifacts_dir: "/tmp/checkpoint-artifacts"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_nat__validate_overlaps']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_nat__validate_overlaps_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_nat__validate_overlaps | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_nat__validate_overlaps_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_nat__validate_overlaps_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_nat__validate_overlaps_status: "running"
    fe_checkpoint_cp_nat__validate_overlaps_preflight_passed: false
    fe_checkpoint_cp_nat__validate_overlaps_postflight_passed: false
    fe_checkpoint_cp_nat__validate_overlaps_failed_task: ""
    fe_checkpoint_cp_nat__validate_overlaps_error: ""
    fe_checkpoint_cp_nat__validate_overlaps_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_nat__validate_overlaps | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_nat__validate_overlaps | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_nat__validate_overlaps: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_nat__validate_overlaps: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__validate_overlaps | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_nat__validate_overlaps: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_nat__validate_overlaps: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_nat__validate_overlaps_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__validate_overlaps | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__validate_overlaps_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _pkg: "{{ policy_package | default('Standard') }}"
        _art: "{{ artifacts_dir | default('/tmp/checkpoint-artifacts') }}"

    - name: Ensure artifact folder
      ansible.builtin.file:
        path: "{{ _art }}"
        state: directory
        mode: "0755"

    - name: Fetch NAT rulebase (standard)
      check_point.mgmt.cp_mgmt_show_nat_rulebase:
        package: "{{ _pkg }}"
        details_level: "standard"
      register: _nat

    - name: Normalize NAT rules
      ansible.builtin.set_fact:
        _nat_rules: >-
          {%- set out = [] -%}
          {%- for r in _nat.rulebase | default([]) if r.get('type') == 'nat-rule' -%}
            {%- set osrc = (r.get('original-source',[]) | map(attribute='name') | list) | default(['Any']) -%}
            {%- set odst = (r.get('original-destination',[]) | map(attribute='name') | list) | default(['Any']) -%}
            {%- set osvc = (r.get('original-service',[]) | map(attribute='name') | list) | default(['Any']) -%}
            {%- set tsrc = r.get('translated-source','Original') -%}
            {%- set tdst = r.get('translated-destination','Original') -%}
            {%- set tsvc = r.get('translated-service','Original') -%}
            {%- set meth = r.get('method','static') -%}
            {%- set _ = out.append({
                'idx': loop.index0,
                'uid': r.get('uid',''),
                'name': r.get('name',''),
                'position': r.get('position',''),
                'enabled': r.get('enabled', true),
                'method': meth,
                'osrc': osrc, 'odst': odst, 'osvc': osvc,
                'tsrc': tsrc, 'tdst': tdst, 'tsvc': tsvc
              }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Find duplicate original tuples
      ansible.builtin.set_fact:
        _dupes: >-
          {%- set seen = {} -%}
          {%- set out = [] -%}
          {%- for r in _nat_rules -%}
            {%- set key = (r.osrc | join('|')) ~ '|' ~ (r.odst | join('|')) ~ '|' ~ (r.osvc | join('|')) -%}
            {%- if key in seen -%}
              {%- set _ = out.append(seen[key]) -%}
              {%- set _ = out.append(r) -%}
            {%- else -%}
              {%- set _ = seen.update({key: r}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | unique }}

    - name: Find conflicts (same original, different translation)
      ansible.builtin.set_fact:
        _conflicts: >-
          {%- set out = [] -%}
          {%- for a in _nat_rules -%}
            {%- for b in _nat_rules if b.idx > a.idx -%}
              {%- set same_orig = (a.osrc == b.osrc) and (a.odst == b.odst) and (a.osvc == b.osvc) -%}
              {%- set diff_trans = (a.tsrc != b.tsrc) or (a.tdst != b.tdst) or (a.tsvc != b.tsvc) -%}
              {%- if same_orig and diff_trans -%}
                {%- set _ = out.append({'first': a, 'second': b}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Find potential shadowing (earlier broader)
      ansible.builtin.set_fact:
        _shadow: >-
          {%- set out = [] -%}
          {%- for r in _nat_rules -%}
            {%- for e in _nat_rules if e.idx < r.idx -%}
              {%- set src_ok = ('Any' in e.osrc) or (e.osrc == r.osrc) -%}
              {%- set dst_ok = ('Any' in e.odst) or (e.odst == r.odst) -%}
              {%- set svc_ok = ('Any' in e.osvc) or (e.osvc == r.osvc) -%}
              {%- if src_ok and dst_ok and svc_ok and r.enabled -%}
                {%- set _ = out.append({'earlier': e, 'later': r}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Write CSV — duplicates
      ansible.builtin.copy:
        dest: "{{ _art }}/nat_duplicates.csv"
        mode: "0644"
        content: |
          uid,name,position,osrc,odst,osvc,method,tsrc,tdst,tsvc
          {% for r in _dupes %}
          {{ r.uid }},{{ r.name | replace(',',';') }},{{ r.position }},"{{ r.osrc | join('|') }}","{{ r.odst | join('|') }}","{{ r.osvc | join('|') }}",{{ r.method }},{{ r.tsrc }},{{ r.tdst }},{{ r.tsvc }}
          {% endfor %}

    - name: Write CSV — conflicts
      ansible.builtin.copy:
        dest: "{{ _art }}/nat_conflicts.csv"
        mode: "0644"
        content: |
          first_uid,first_name,second_uid,second_name,osrc,odst,osvc,first_trans,second_trans
          {% for p in _conflicts %}
          {{ p.first.uid }},{{ p.first.name | replace(',',';') }},{{ p.second.uid }},{{ p.second.name | replace(',',';') }},"{{ p.first.osrc | join('|') }}","{{ p.first.odst | join('|') }}","{{ p.first.osvc | join('|') }}","{{ p.first.tsrc }}|{{ p.first.tdst }}|{{ p.first.tsvc }}","{{ p.second.tsrc }}|{{ p.second.tdst }}|{{ p.second.tsvc }}"
          {% endfor %}

    - name: Write CSV — shadowing (heuristic)
      ansible.builtin.copy:
        dest: "{{ _art }}/nat_shadowing.csv"
        mode: "0644"
        content: |
          earlier_name,earlier_pos,later_name,later_pos,osrc,odst,osvc,earlier_trans,later_trans
          {% for s in _shadow %}
          {{ s.earlier.name | replace(',',';') }},{{ s.earlier.position }},{{ s.later.name | replace(',',';') }},{{ s.later.position }},"{{ s.later.osrc | join('|') }}","{{ s.later.odst | join('|') }}","{{ s.later.osvc | join('|') }}","{{ s.earlier.tsrc }}|{{ s.earlier.tdst }}|{{ s.earlier.tsvc }}","{{ s.later.tsrc }}|{{ s.later.tdst }}|{{ s.later.tsvc }}"
          {% endfor %}

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Duplicates: {{ _dupes | length }} → {{ _art }}/nat_duplicates.csv"
          - "Conflicts: {{ _conflicts | length }} → {{ _art }}/nat_conflicts.csv"
          - "Shadowing: {{ _shadow | length }} → {{ _art }}/nat_shadowing.csv"

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_nat__validate_overlaps | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_nat__validate_overlaps_preflight_passed | bool
          - fe_checkpoint_cp_nat__validate_overlaps_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_nat__validate_overlaps: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_nat__validate_overlaps_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_nat__validate_overlaps_status | default('unknown') }}.
        success_msg: "checkpoint/cp_nat__validate_overlaps: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_nat__validate_overlaps | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__validate_overlaps_postflight_passed: true
        fe_checkpoint_cp_nat__validate_overlaps_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_nat__validate_overlaps | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__validate_overlaps_status: "failed"
        fe_checkpoint_cp_nat__validate_overlaps_postflight_passed: false
        fe_checkpoint_cp_nat__validate_overlaps_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_nat__validate_overlaps_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__validate_overlaps | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_nat__validate_overlaps: FAILED at '{{ fe_checkpoint_cp_nat__validate_overlaps_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_nat__validate_overlaps_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__validate_overlaps | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_nat__validate_overlaps failed at '{{ fe_checkpoint_cp_nat__validate_overlaps_failed_task }}': {{ fe_checkpoint_cp_nat__validate_overlaps_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_nat__validate_overlaps | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__validate_overlaps_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_nat__validate_overlaps_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_nat__validate_overlaps_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_nat__validate_overlaps | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_nat__validate_overlaps":
              component: "checkpoint/cp_nat__validate_overlaps"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_nat__validate_overlaps_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_nat__validate_overlaps_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_nat__validate_overlaps_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_nat__validate_overlaps_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_nat__validate_overlaps_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_nat__validate_overlaps_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_nat__validate_overlaps_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_nat__validate_overlaps_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_nat__validate_overlaps_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_nat__validate_overlaps_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_nat__validate_overlaps_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_nat__validate_overlaps_status | default('') == 'succeeded' else ['checkpoint/cp_nat__validate_overlaps'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_nat__validate_overlaps | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__validate_overlaps_stats_published: true
      tags:
        - always
