---
# Configure HTTPS Inspection certificate settings.
# Works with the generic API for broad R8x support.
# Vars:
#   https_ca_settings:
#     enabled: true
#     certificate_type: "internal"   # internal | pki
#     ca_name: "HTTPS-INSPECT-CA"    # for internal
#     trust_chain: |                 # optional PEM chain for PKI
#       -----BEGIN CERTIFICATE-----
#       ...
#       -----END CERTIFICATE-----

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_https__install_ca']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_https__install_ca_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_https__install_ca | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_https__install_ca_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_https__install_ca_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_https__install_ca_status: "running"
    fe_checkpoint_cp_https__install_ca_preflight_passed: false
    fe_checkpoint_cp_https__install_ca_postflight_passed: false
    fe_checkpoint_cp_https__install_ca_failed_task: ""
    fe_checkpoint_cp_https__install_ca_error: ""
    fe_checkpoint_cp_https__install_ca_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_https__install_ca | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_https__install_ca | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_https__install_ca: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_https__install_ca: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_https__install_ca | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_https__install_ca: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_https__install_ca: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_https__install_ca_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_https__install_ca | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_https__install_ca_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Set HTTPS Inspection certificate settings
      check_point.mgmt.cp_mgmt_api_call:
        command: "set-https-inspection"
        parameters:
          enabled: "{{ https_ca_settings.enabled | default(true) }}"
          certificate-type: "{{ https_ca_settings.certificate_type | default('internal') }}"
          ca: "{{ https_ca_settings.ca_name | default(omit) }}"
          trust-chain: "{{ https_ca_settings.trust_chain | default(omit) }}"

    - name: Publish HTTPS CA config
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_https__install_ca | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_https__install_ca_preflight_passed | bool
          - fe_checkpoint_cp_https__install_ca_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_https__install_ca: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_https__install_ca_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_https__install_ca_status | default('unknown') }}.
        success_msg: "checkpoint/cp_https__install_ca: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_https__install_ca | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_https__install_ca_postflight_passed: true
        fe_checkpoint_cp_https__install_ca_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_https__install_ca | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_https__install_ca_status: "failed"
        fe_checkpoint_cp_https__install_ca_postflight_passed: false
        fe_checkpoint_cp_https__install_ca_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_https__install_ca_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_https__install_ca | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_https__install_ca: FAILED at '{{ fe_checkpoint_cp_https__install_ca_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_https__install_ca_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_https__install_ca | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_https__install_ca failed at '{{ fe_checkpoint_cp_https__install_ca_failed_task }}': {{ fe_checkpoint_cp_https__install_ca_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_https__install_ca | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_https__install_ca_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_https__install_ca_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_https__install_ca_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_https__install_ca | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_https__install_ca":
              component: "checkpoint/cp_https__install_ca"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_https__install_ca_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_https__install_ca_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_https__install_ca_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_https__install_ca_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_https__install_ca_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_https__install_ca_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_https__install_ca_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_https__install_ca_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_https__install_ca_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_https__install_ca_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_https__install_ca_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_https__install_ca_status | default('') == 'succeeded' else ['checkpoint/cp_https__install_ca'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_https__install_ca | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_https__install_ca_stats_published: true
      tags:
        - always
