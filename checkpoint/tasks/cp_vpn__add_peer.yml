---
# Create/Update interoperable (3rd-party) VPN peers.
# Vars:
#   vpn_peers:
#     - name: "peer-branch1"
#       ip_address: "203.0.113.10"
#       auth_method: "shared-secret"   # or "certificate"
#       psk: "{{ vault_branch1_psk }}" # required for shared-secret
#       color: "blue"
#       comments: "Branch 1"
#   publish_changes: false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_vpn__add_peer']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_vpn__add_peer_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_vpn__add_peer | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_vpn__add_peer_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_vpn__add_peer_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_vpn__add_peer_status: "running"
    fe_checkpoint_cp_vpn__add_peer_preflight_passed: false
    fe_checkpoint_cp_vpn__add_peer_postflight_passed: false
    fe_checkpoint_cp_vpn__add_peer_failed_task: ""
    fe_checkpoint_cp_vpn__add_peer_error: ""
    fe_checkpoint_cp_vpn__add_peer_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_vpn__add_peer | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_vpn__add_peer | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_vpn__add_peer: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_vpn__add_peer: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_vpn__add_peer | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_vpn__add_peer: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_vpn__add_peer: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_vpn__add_peer_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_vpn__add_peer | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__add_peer_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate input
      ansible.builtin.assert:
        that: [ vpn_peers is iterable ]
        quiet: true

    - name: Create/Update interoperable devices
      check_point.mgmt.cp_mgmt_interoperable_device:
        state: present
        name: "{{ item.name }}"
        ip_address: "{{ item.ip_address }}"
        color: "{{ item.color | default(omit) }}"
        comments: "{{ item.comments | default(omit) }}"
        authentication:
          method: "{{ item.auth_method | default('shared-secret') }}"
          shared_secret: "{{ (item.auth_method | default('shared-secret')) == 'shared-secret' | ternary(item.psk, omit) }}"
      no_log: true
      loop: "{{ vpn_peers }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Publish VPN peers
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_vpn__add_peer | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_vpn__add_peer_preflight_passed | bool
          - fe_checkpoint_cp_vpn__add_peer_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_vpn__add_peer: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_vpn__add_peer_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_vpn__add_peer_status | default('unknown') }}.
        success_msg: "checkpoint/cp_vpn__add_peer: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_vpn__add_peer | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__add_peer_postflight_passed: true
        fe_checkpoint_cp_vpn__add_peer_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_vpn__add_peer | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__add_peer_status: "failed"
        fe_checkpoint_cp_vpn__add_peer_postflight_passed: false
        fe_checkpoint_cp_vpn__add_peer_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_vpn__add_peer_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_vpn__add_peer | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_vpn__add_peer: FAILED at '{{ fe_checkpoint_cp_vpn__add_peer_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_vpn__add_peer_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_vpn__add_peer | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_vpn__add_peer failed at '{{ fe_checkpoint_cp_vpn__add_peer_failed_task }}': {{ fe_checkpoint_cp_vpn__add_peer_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_vpn__add_peer | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__add_peer_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_vpn__add_peer_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_vpn__add_peer_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_vpn__add_peer | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_vpn__add_peer":
              component: "checkpoint/cp_vpn__add_peer"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_vpn__add_peer_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_vpn__add_peer_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_vpn__add_peer_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_vpn__add_peer_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_vpn__add_peer_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_vpn__add_peer_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_vpn__add_peer_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_vpn__add_peer_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_vpn__add_peer_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_vpn__add_peer_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_vpn__add_peer_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_vpn__add_peer_status | default('') == 'succeeded' else ['checkpoint/cp_vpn__add_peer'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_vpn__add_peer | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__add_peer_stats_published: true
      tags:
        - always
