---
# Enable Identity Awareness on gateways/clusters.
# Vars:
#   ia_gateways:
#     - { name: "dc-gw1", identity_aware: true }
#     - { name: "branch-gw", identity_aware: true }
#   publish_changes: false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_ia__enable_gateway']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_ia__enable_gateway_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_ia__enable_gateway | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_ia__enable_gateway_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_ia__enable_gateway_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_ia__enable_gateway_status: "running"
    fe_checkpoint_cp_ia__enable_gateway_preflight_passed: false
    fe_checkpoint_cp_ia__enable_gateway_postflight_passed: false
    fe_checkpoint_cp_ia__enable_gateway_failed_task: ""
    fe_checkpoint_cp_ia__enable_gateway_error: ""
    fe_checkpoint_cp_ia__enable_gateway_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_ia__enable_gateway | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_ia__enable_gateway | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_ia__enable_gateway: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_ia__enable_gateway: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_ia__enable_gateway | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_ia__enable_gateway: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_ia__enable_gateway: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_ia__enable_gateway_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_ia__enable_gateway | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_ia__enable_gateway_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Enable IA on simple gateways
      check_point.mgmt.cp_mgmt_simple_gateway:
        name: "{{ item.name }}"
        identity_aware: "{{ item.identity_aware | default(true) }}"
        state: present
      loop: "{{ ia_gateways | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Publish IA toggle
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_ia__enable_gateway | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_ia__enable_gateway_preflight_passed | bool
          - fe_checkpoint_cp_ia__enable_gateway_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_ia__enable_gateway: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_ia__enable_gateway_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_ia__enable_gateway_status | default('unknown') }}.
        success_msg: "checkpoint/cp_ia__enable_gateway: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_ia__enable_gateway | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_ia__enable_gateway_postflight_passed: true
        fe_checkpoint_cp_ia__enable_gateway_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_ia__enable_gateway | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_ia__enable_gateway_status: "failed"
        fe_checkpoint_cp_ia__enable_gateway_postflight_passed: false
        fe_checkpoint_cp_ia__enable_gateway_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_ia__enable_gateway_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_ia__enable_gateway | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_ia__enable_gateway: FAILED at '{{ fe_checkpoint_cp_ia__enable_gateway_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_ia__enable_gateway_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_ia__enable_gateway | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_ia__enable_gateway failed at '{{ fe_checkpoint_cp_ia__enable_gateway_failed_task }}': {{ fe_checkpoint_cp_ia__enable_gateway_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_ia__enable_gateway | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_ia__enable_gateway_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_ia__enable_gateway_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_ia__enable_gateway_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_ia__enable_gateway | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_ia__enable_gateway":
              component: "checkpoint/cp_ia__enable_gateway"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_ia__enable_gateway_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_ia__enable_gateway_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_ia__enable_gateway_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_ia__enable_gateway_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_ia__enable_gateway_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_ia__enable_gateway_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_ia__enable_gateway_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_ia__enable_gateway_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_ia__enable_gateway_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_ia__enable_gateway_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_ia__enable_gateway_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_ia__enable_gateway_status | default('') == 'succeeded' else ['checkpoint/cp_ia__enable_gateway'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_ia__enable_gateway | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_ia__enable_gateway_stats_published: true
      tags:
        - always
