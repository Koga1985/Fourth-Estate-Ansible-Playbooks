---
# Create TP exceptions with optional expiry and ticket tagging.
# Vars:
#   tp_layer: "Threat Prevention"
#   tp_exceptions:
#     - name: "Allow Legacy SMB Scanner"
#       position: "top"
#       source: ["legacy-scanner"]
#       destination: ["fileservers"]
#       service: ["microsoft-ds"]
#       protections: ["IPS","Anti-Virus"]    # or ["Any"]
#       track: "log"                         # log | none
#       expiration: "2026-03-31"             # ISO date (optional)
#       comments: "CHG-12345 temporary exception"
#       enabled: true
#       tags: ["ticket:CHG-12345","owner:netops"]

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_tp__exceptions']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_tp__exceptions_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_tp__exceptions | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_tp__exceptions_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_tp__exceptions_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_tp__exceptions_status: "running"
    fe_checkpoint_cp_tp__exceptions_preflight_passed: false
    fe_checkpoint_cp_tp__exceptions_postflight_passed: false
    fe_checkpoint_cp_tp__exceptions_failed_task: ""
    fe_checkpoint_cp_tp__exceptions_error: ""
    fe_checkpoint_cp_tp__exceptions_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_tp__exceptions | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_tp__exceptions | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_tp__exceptions: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_tp__exceptions: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_tp__exceptions | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_tp__exceptions: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_tp__exceptions: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_tp__exceptions_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_tp__exceptions | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_tp__exceptions_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _tp_layer: "{{ tp_layer | default('Threat Prevention') }}"

    - name: Create/Update TP exceptions
      check_point.mgmt.cp_mgmt_threat_exception:
        layer: "{{ _tp_layer }}"
        name: "{{ item.name }}"
        position: "{{ item.position | default('top') }}"
        source: "{{ item.source | default(['Any']) }}"
        destination: "{{ item.destination | default(['Any']) }}"
        service: "{{ item.service | default(['Any']) }}"
        protections: "{{ item.protections | default(['Any']) }}"
        track: "{{ item.track | default('log') }}"
        comments: "{{ item.comments | default(omit) }}"
        tags: "{{ item.tags | default(omit) }}"
        time: >-
          {{
            (item.expiration is defined)
              | ternary({ 'type': 'range', 'to': item.expiration }, omit)
          }}
        enabled: "{{ item.enabled | default(true) }}"
        state: present
      loop: "{{ tp_exceptions | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_tp__exceptions | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_tp__exceptions_preflight_passed | bool
          - fe_checkpoint_cp_tp__exceptions_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_tp__exceptions: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_tp__exceptions_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_tp__exceptions_status | default('unknown') }}.
        success_msg: "checkpoint/cp_tp__exceptions: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_tp__exceptions | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_tp__exceptions_postflight_passed: true
        fe_checkpoint_cp_tp__exceptions_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_tp__exceptions | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_tp__exceptions_status: "failed"
        fe_checkpoint_cp_tp__exceptions_postflight_passed: false
        fe_checkpoint_cp_tp__exceptions_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_tp__exceptions_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_tp__exceptions | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_tp__exceptions: FAILED at '{{ fe_checkpoint_cp_tp__exceptions_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_tp__exceptions_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_tp__exceptions | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_tp__exceptions failed at '{{ fe_checkpoint_cp_tp__exceptions_failed_task }}': {{ fe_checkpoint_cp_tp__exceptions_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_tp__exceptions | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_tp__exceptions_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_tp__exceptions_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_tp__exceptions_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_tp__exceptions | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_tp__exceptions":
              component: "checkpoint/cp_tp__exceptions"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_tp__exceptions_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_tp__exceptions_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_tp__exceptions_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_tp__exceptions_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_tp__exceptions_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_tp__exceptions_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_tp__exceptions_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_tp__exceptions_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_tp__exceptions_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_tp__exceptions_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_tp__exceptions_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_tp__exceptions_status | default('') == 'succeeded' else ['checkpoint/cp_tp__exceptions'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_tp__exceptions | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_tp__exceptions_stats_published: true
      tags:
        - always
