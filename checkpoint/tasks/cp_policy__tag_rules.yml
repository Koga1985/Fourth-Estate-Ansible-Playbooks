---
# Add or update rule tags (owner/app/ticket/etc.).
# Select rules by name, UID, or simple filter query.
# Vars (use ONE of the selectors):
#   cp_layer: "Network"
#   tag_set: ["owner:netops","ticket:CHG1234"]
#   rule_names: ["Allow Web to App","DB Admin SSH"]   # optional
#   rule_uids: ["<uid1>","<uid2>"]                    # optional
#   filter_query: "app-foo"                           # optional (mgmt filter)
# Behavior: merges tags with existing tags.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_policy__tag_rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_policy__tag_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_policy__tag_rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_policy__tag_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_policy__tag_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_policy__tag_rules_status: "running"
    fe_checkpoint_cp_policy__tag_rules_preflight_passed: false
    fe_checkpoint_cp_policy__tag_rules_postflight_passed: false
    fe_checkpoint_cp_policy__tag_rules_failed_task: ""
    fe_checkpoint_cp_policy__tag_rules_error: ""
    fe_checkpoint_cp_policy__tag_rules_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_policy__tag_rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_policy__tag_rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_policy__tag_rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_policy__tag_rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__tag_rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_policy__tag_rules: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_policy__tag_rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_policy__tag_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__tag_rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__tag_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _cp_layer: "{{ cp_layer | default('Network') }}"

    - name: Select rules by filter (if provided)
      when: filter_query is defined
      check_point.mgmt.cp_mgmt_show_access_rulebase:
        name: "{{ _cp_layer }}"
        details_level: "standard"
        use_object_dictionnary: false
        filter: "{{ filter_query }}"
      register: _flt

    - name: Select rules by name (if provided)
      when: rule_names is defined
      check_point.mgmt.cp_mgmt_show_access_rulebase:
        name: "{{ _cp_layer }}"
        details_level: "standard"
        use_object_dictionnary: false
      register: _all

    - name: Build target UID list
      ansible.builtin.set_fact:
        _uids_from_filter: "{{ (_flt.access_rulebase | default([])) | map(attribute='uid') | list }}"
        _uids_from_names: >-
          {% set out = [] %}
          {% for r in (_all.access_rulebase | default([])) %}
            {% if r.name in (rule_names | default([])) %}{% set _ = out.append(r.uid) %}{% endif %}
          {% endfor %}
          {{ out }}
        _uids_final: >-
          {{
            ((rule_uids | default([]))
             + (_uids_from_filter | default([]))
             + (_uids_from_names | default([]))) | unique
          }}

    - name: Update tags on selected rules
      when: (_uids_final | length) > 0
      check_point.mgmt.cp_mgmt_set_access_rule:
        layer: "{{ _cp_layer }}"
        uid: "{{ item }}"
        tags: "{{ tag_set }}"
      loop: "{{ _uids_final }}"
      loop_control: { label: "{{ item }}" }

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_policy__tag_rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_policy__tag_rules_preflight_passed | bool
          - fe_checkpoint_cp_policy__tag_rules_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_policy__tag_rules: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_policy__tag_rules_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_policy__tag_rules_status | default('unknown') }}.
        success_msg: "checkpoint/cp_policy__tag_rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_policy__tag_rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__tag_rules_postflight_passed: true
        fe_checkpoint_cp_policy__tag_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_policy__tag_rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__tag_rules_status: "failed"
        fe_checkpoint_cp_policy__tag_rules_postflight_passed: false
        fe_checkpoint_cp_policy__tag_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_policy__tag_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__tag_rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_policy__tag_rules: FAILED at '{{ fe_checkpoint_cp_policy__tag_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_policy__tag_rules_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__tag_rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_policy__tag_rules failed at '{{ fe_checkpoint_cp_policy__tag_rules_failed_task }}': {{ fe_checkpoint_cp_policy__tag_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_policy__tag_rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__tag_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_policy__tag_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_policy__tag_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_policy__tag_rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_policy__tag_rules":
              component: "checkpoint/cp_policy__tag_rules"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_policy__tag_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_policy__tag_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_policy__tag_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_policy__tag_rules_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_policy__tag_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_policy__tag_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_policy__tag_rules_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_policy__tag_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_policy__tag_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_policy__tag_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_policy__tag_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_policy__tag_rules_status | default('') == 'succeeded' else ['checkpoint/cp_policy__tag_rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_policy__tag_rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__tag_rules_stats_published: true
      tags:
        - always
