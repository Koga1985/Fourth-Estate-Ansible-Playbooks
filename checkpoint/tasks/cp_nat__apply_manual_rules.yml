---
# Create/Update manual NAT rules from YAML.
# Optional pre-clean by name prefix.
#
# Vars:
#   policy_package: "Standard"
#   nat_rules:
#     - name: "WEB_SNAT_Prod"
#       position: "top"  # or "below <rule/section name>" etc.
#       original_source: ["web-servers"]
#       original_destination: ["Any"]
#       original_service: ["http","https"]
#       translated_source: "Original"       # or "Hide", "192.0.2.10"
#       translated_destination: "Original"  # or IP/FQDN object name
#       translated_service: "Original"      # rarely changed
#       method: "static"  # or "hide"
#       enabled: true
#       comments: "SNAT web to egress VIP"
#   remove_by_name_prefix: []   # e.g. ["WEB_SNAT_"]
#   publish_changes: true|false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_nat__apply_manual_rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_nat__apply_manual_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_nat__apply_manual_rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_nat__apply_manual_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_nat__apply_manual_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_nat__apply_manual_rules_status: "running"
    fe_checkpoint_cp_nat__apply_manual_rules_preflight_passed: false
    fe_checkpoint_cp_nat__apply_manual_rules_postflight_passed: false
    fe_checkpoint_cp_nat__apply_manual_rules_failed_task: ""
    fe_checkpoint_cp_nat__apply_manual_rules_error: ""
    fe_checkpoint_cp_nat__apply_manual_rules_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_nat__apply_manual_rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_nat__apply_manual_rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_nat__apply_manual_rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_nat__apply_manual_rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__apply_manual_rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_nat__apply_manual_rules: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_nat__apply_manual_rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_nat__apply_manual_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__apply_manual_rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__apply_manual_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _pkg: "{{ policy_package | default('Standard') }}"
        _rules: "{{ nat_rules | default([]) }}"
        _prefixes: "{{ remove_by_name_prefix | default([]) }}"

    - name: (Optional) fetch NAT rulebase for cleanup
      when: _prefixes | length > 0
      check_point.mgmt.cp_mgmt_show_nat_rulebase:
        package: "{{ _pkg }}"
        details_level: "standard"
      register: _nat_rb_for_delete

    - name: (Optional) gather rule UIDs to delete by name prefix
      when: _prefixes | length > 0
      ansible.builtin.set_fact:
        _delete_uids: >-
          {%- set out = [] -%}
          {%- for r in _nat_rb_for_delete.rulebase | default([]) -%}
            {%- if r.get('type') == 'nat-rule' -%}
              {%- set n = r.get('name','') -%}
              {%- for p in _prefixes -%}
                {%- if n.startswith(p) -%}{%- set _ = out.append({'uid': r.uid, 'name': n, 'position': r.position}) -%}{%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | unique }}

    - name: (Optional) delete selected rules by UID
      when: _prefixes | length > 0 and (_delete_uids | length) > 0
      check_point.mgmt.cp_mgmt_delete_nat_rule:
        package: "{{ _pkg }}"
        uid: "{{ item.uid }}"
      loop: "{{ _delete_uids }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Create/Update manual NAT rules
      check_point.mgmt.cp_mgmt_nat_rule:
        package: "{{ _pkg }}"
        state: present
        name: "{{ item.name }}"
        position: "{{ item.position | default('top') }}"
        method: "{{ item.method | default('static') }}"
        enabled: "{{ item.enabled | default(true) }}"
        comments: "{{ item.comments | default(omit) }}"

        original_source: "{{ item.original_source | default(['Any']) }}"
        original_destination: "{{ item.original_destination | default(['Any']) }}"
        original_service: "{{ item.original_service | default(['Any']) }}"

        translated_source: "{{ item.translated_source | default('Original') }}"
        translated_destination: "{{ item.translated_destination | default('Original') }}"
        translated_service: "{{ item.translated_service | default('Original') }}"
      loop: "{{ _rules }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Publish NAT rule changes
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_nat__apply_manual_rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_nat__apply_manual_rules_preflight_passed | bool
          - fe_checkpoint_cp_nat__apply_manual_rules_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_nat__apply_manual_rules: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_nat__apply_manual_rules_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_nat__apply_manual_rules_status | default('unknown') }}.
        success_msg: "checkpoint/cp_nat__apply_manual_rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_nat__apply_manual_rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__apply_manual_rules_postflight_passed: true
        fe_checkpoint_cp_nat__apply_manual_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_nat__apply_manual_rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__apply_manual_rules_status: "failed"
        fe_checkpoint_cp_nat__apply_manual_rules_postflight_passed: false
        fe_checkpoint_cp_nat__apply_manual_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_nat__apply_manual_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__apply_manual_rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_nat__apply_manual_rules: FAILED at '{{ fe_checkpoint_cp_nat__apply_manual_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_nat__apply_manual_rules_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__apply_manual_rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_nat__apply_manual_rules failed at '{{ fe_checkpoint_cp_nat__apply_manual_rules_failed_task }}': {{ fe_checkpoint_cp_nat__apply_manual_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_nat__apply_manual_rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__apply_manual_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_nat__apply_manual_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_nat__apply_manual_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_nat__apply_manual_rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_nat__apply_manual_rules":
              component: "checkpoint/cp_nat__apply_manual_rules"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_nat__apply_manual_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_nat__apply_manual_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_nat__apply_manual_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_nat__apply_manual_rules_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_nat__apply_manual_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_nat__apply_manual_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_nat__apply_manual_rules_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_nat__apply_manual_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_nat__apply_manual_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_nat__apply_manual_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_nat__apply_manual_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_nat__apply_manual_rules_status | default('') == 'succeeded' else ['checkpoint/cp_nat__apply_manual_rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_nat__apply_manual_rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__apply_manual_rules_stats_published: true
      tags:
        - always
