---
# Install policy package to targets. Supports serial/parallel batches.
# Vars:
#   policy_package: "Standard"
#   install_targets: ["gw1","gw2","gw3"]
#   parallel_batches: 2         # install N gateways at a time (default 1 = serial)
#   access: true|false          # install Network layer (default: true)
#   threat_prevention: true|false   # install TP layer (default: true)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_policy__install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_policy__install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_policy__install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_policy__install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_policy__install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_policy__install_status: "running"
    fe_checkpoint_cp_policy__install_preflight_passed: false
    fe_checkpoint_cp_policy__install_postflight_passed: false
    fe_checkpoint_cp_policy__install_failed_task: ""
    fe_checkpoint_cp_policy__install_error: ""
    fe_checkpoint_cp_policy__install_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_policy__install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_policy__install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_policy__install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_policy__install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_policy__install: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_policy__install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_policy__install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _pkg: "{{ policy_package | default('Standard') }}"
        _targets: "{{ install_targets | default([]) }}"
        _batch: "{{ parallel_batches | default(1) | int }}"
        _access: "{{ access | default(true) | bool }}"
        _tp: "{{ threat_prevention | default(true) | bool }}"

    - name: Fail if no targets
      ansible.builtin.assert:
        that: [ _targets | length > 0 ]
        fail_msg: "No install_targets provided."

    - name: Compute batches
      ansible.builtin.set_fact:
        _target_batches: >-
          {% set out = [] %}
          {% for i in range(0, (_targets | length), _batch) %}
          {% set _ = out.append(_targets[i:(i+_batch)]) %}
          {% endfor %}
          {{ out }}

    - name: Install policy (batch loop)
      check_point.mgmt.cp_mgmt_install_policy:
        policy_package: "{{ _pkg }}"
        targets: "{{ item }}"
        access: "{{ _access }}"
        threat_prevention: "{{ _tp }}"
        install_on_all_cluster_members_or_fail: true
        evaluate_policy: true
      loop: "{{ _target_batches }}"
      loop_control: { label: "{{ item | join(',') }}" }

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_policy__install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_policy__install_preflight_passed | bool
          - fe_checkpoint_cp_policy__install_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_policy__install: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_policy__install_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_policy__install_status | default('unknown') }}.
        success_msg: "checkpoint/cp_policy__install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_policy__install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__install_postflight_passed: true
        fe_checkpoint_cp_policy__install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_policy__install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__install_status: "failed"
        fe_checkpoint_cp_policy__install_postflight_passed: false
        fe_checkpoint_cp_policy__install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_policy__install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_policy__install: FAILED at '{{ fe_checkpoint_cp_policy__install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_policy__install_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_policy__install failed at '{{ fe_checkpoint_cp_policy__install_failed_task }}': {{ fe_checkpoint_cp_policy__install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_policy__install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_policy__install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_policy__install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_policy__install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_policy__install":
              component: "checkpoint/cp_policy__install"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_policy__install_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_policy__install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_policy__install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_policy__install_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_policy__install_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_policy__install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_policy__install_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_policy__install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_policy__install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_policy__install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_policy__install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_policy__install_status | default('') == 'succeeded' else ['checkpoint/cp_policy__install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_policy__install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__install_stats_published: true
      tags:
        - always
