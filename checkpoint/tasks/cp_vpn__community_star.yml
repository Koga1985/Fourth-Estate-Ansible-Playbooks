---
# Create/Update star VPN communities.
# Vars:
#   vpn_communities:
#     - name: "HUB-SPOKES"
#       center_gateways: ["dc-gw1"]           # CP gateways/cluster objects
#       satellite_gateways: ["peer-branch1","peer-branch2"]  # peers or CP GWs
#       encryption_method: "ikev2"
#       shared_secrets:                       # optional per-satellite overrides
#         - { peer: "peer-branch1", psk: "{{ vault_branch1_psk }}" }
#       ike_phase1:
#         ike_encryption: ["aes-256","aes-128"]
#         ike_integrity: ["sha256"]
#         ike_dh_groups: [14,19]
#         ike_lifetime_minutes: 1440
#       ipsec_phase2:
#         enc: ["aes-256","aes-128"]
#         int: ["sha256"]
#         pfs_groups: [14]
#         lifetime_minutes: 60
#       vpn_domain_type: "community"          # "community" or "user-defined"
#       vpn_perform_nat_traversal: true
#   publish_changes: false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_vpn__community_star']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_vpn__community_star_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_vpn__community_star | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_vpn__community_star_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_vpn__community_star_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_vpn__community_star_status: "running"
    fe_checkpoint_cp_vpn__community_star_preflight_passed: false
    fe_checkpoint_cp_vpn__community_star_postflight_passed: false
    fe_checkpoint_cp_vpn__community_star_failed_task: ""
    fe_checkpoint_cp_vpn__community_star_error: ""
    fe_checkpoint_cp_vpn__community_star_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_vpn__community_star | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_vpn__community_star | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_vpn__community_star: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_vpn__community_star: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_vpn__community_star | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_vpn__community_star: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_vpn__community_star: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_vpn__community_star_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_vpn__community_star | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__community_star_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create/Update star communities
      check_point.mgmt.cp_mgmt_vpn_community_star:
        state: present
        name: "{{ item.name }}"
        center_gateways: "{{ item.center_gateways }}"
        satellite_gateways: "{{ item.satellite_gateways }}"
        encryption_method: "{{ item.encryption_method | default('ikev2') }}"
        ike_phase_1:
          encryption: "{{ item.ike_phase1.ike_encryption | default(omit) }}"
          integrity: "{{ item.ike_phase1.ike_integrity | default(omit) }}"
          diffie_hellman_group: "{{ item.ike_phase1.ike_dh_groups | default(omit) }}"
          life_time_minutes: "{{ item.ike_phase1.ike_lifetime_minutes | default(omit) }}"
        ike_phase_2:
          encryption: "{{ item.ipsec_phase2.enc | default(omit) }}"
          integrity: "{{ item.ipsec_phase2.int | default(omit) }}"
          pfs_dh_group: "{{ item.ipsec_phase2.pfs_groups | default(omit) }}"
          life_time_minutes: "{{ item.ipsec_phase2.lifetime_minutes | default(omit) }}"
        vpn_domain_type: "{{ item.vpn_domain_type | default('community') }}"
        nat_traversal: "{{ item.vpn_perform_nat_traversal | default(true) }}"
      loop: "{{ vpn_communities | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: (Optional) set per-peer PSKs via generic API
      when: (item.shared_secrets | default([])) | length > 0
      loop: "{{ vpn_communities | default([]) }}"
      loop_control: { label: "{{ item.name }}" }
      vars:
        _shared: "{{ item.shared_secrets }}"
      block:
        - name: Apply peer PSKs
          check_point.mgmt.cp_mgmt_api_call:
            command: "set-vpn-community-star"
            parameters:
              name: "{{ item.name }}"
              tunnels: >
                {{
                  _shared | map('combine', {'shared-secret': 'psk'}) | list
                  | map('combine', {'peer-object': attribute('peer')}) | list
                }}
          vars:
            attribute: "peer"

    - name: Publish community changes
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_vpn__community_star | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_vpn__community_star_preflight_passed | bool
          - fe_checkpoint_cp_vpn__community_star_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_vpn__community_star: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_vpn__community_star_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_vpn__community_star_status | default('unknown') }}.
        success_msg: "checkpoint/cp_vpn__community_star: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_vpn__community_star | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__community_star_postflight_passed: true
        fe_checkpoint_cp_vpn__community_star_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_vpn__community_star | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__community_star_status: "failed"
        fe_checkpoint_cp_vpn__community_star_postflight_passed: false
        fe_checkpoint_cp_vpn__community_star_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_vpn__community_star_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_vpn__community_star | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_vpn__community_star: FAILED at '{{ fe_checkpoint_cp_vpn__community_star_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_vpn__community_star_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_vpn__community_star | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_vpn__community_star failed at '{{ fe_checkpoint_cp_vpn__community_star_failed_task }}': {{ fe_checkpoint_cp_vpn__community_star_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_vpn__community_star | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__community_star_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_vpn__community_star_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_vpn__community_star_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_vpn__community_star | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_vpn__community_star":
              component: "checkpoint/cp_vpn__community_star"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_vpn__community_star_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_vpn__community_star_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_vpn__community_star_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_vpn__community_star_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_vpn__community_star_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_vpn__community_star_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_vpn__community_star_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_vpn__community_star_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_vpn__community_star_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_vpn__community_star_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_vpn__community_star_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_vpn__community_star_status | default('') == 'succeeded' else ['checkpoint/cp_vpn__community_star'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_vpn__community_star | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_vpn__community_star_stats_published: true
      tags:
        - always
