---
# Creates/updates Network subnets and Address Ranges.
# Vars expected:
#   cp_networks:
#     - name: prod-net
#       subnet: 10.10.0.0
#       mask: 16
#       color: red
#       comment: "Prod /16"
#   cp_address_ranges:
#     - name: dr-range
#       start: 10.20.50.10
#       end: 10.20.50.200
#       color: yellow
#       comment: "DR range"
#   publish_changes: true|false (optional)

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_objects__create_networks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_objects__create_networks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_objects__create_networks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_objects__create_networks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_objects__create_networks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_objects__create_networks_status: "running"
    fe_checkpoint_cp_objects__create_networks_preflight_passed: false
    fe_checkpoint_cp_objects__create_networks_postflight_passed: false
    fe_checkpoint_cp_objects__create_networks_failed_task: ""
    fe_checkpoint_cp_objects__create_networks_error: ""
    fe_checkpoint_cp_objects__create_networks_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_objects__create_networks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_objects__create_networks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_objects__create_networks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_objects__create_networks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_objects__create_networks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_objects__create_networks: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_objects__create_networks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_objects__create_networks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_objects__create_networks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_objects__create_networks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Validate input lists
      ansible.builtin.assert:
        that:
          - cp_networks is iterable or cp_networks is not defined
          - cp_address_ranges is iterable or cp_address_ranges is not defined
        quiet: true

    - name: Create / update Network subnets
      when: (cp_networks | default([])) | length > 0
      check_point.mgmt.cp_mgmt_network:
        state: present
        name: "{{ item.name }}"
        subnet: "{{ item.subnet }}"
        mask_length: "{{ item.mask }}"
        color: "{{ item.color | default(omit) }}"
        comments: "{{ item.comment | default(omit) }}"
      loop: "{{ cp_networks | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create / update Address Ranges
      when: (cp_address_ranges | default([])) | length > 0
      check_point.mgmt.cp_mgmt_address_range:
        state: present
        name: "{{ item.name }}"
        ip_address_first: "{{ item.start }}"
        ip_address_last: "{{ item.end }}"
        color: "{{ item.color | default(omit) }}"
        comments: "{{ item.comment | default(omit) }}"
      loop: "{{ cp_address_ranges | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Publish (networks/ranges)
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_objects__create_networks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_objects__create_networks_preflight_passed | bool
          - fe_checkpoint_cp_objects__create_networks_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_objects__create_networks: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_objects__create_networks_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_objects__create_networks_status | default('unknown') }}.
        success_msg: "checkpoint/cp_objects__create_networks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_objects__create_networks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_objects__create_networks_postflight_passed: true
        fe_checkpoint_cp_objects__create_networks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_objects__create_networks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_objects__create_networks_status: "failed"
        fe_checkpoint_cp_objects__create_networks_postflight_passed: false
        fe_checkpoint_cp_objects__create_networks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_objects__create_networks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_objects__create_networks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_objects__create_networks: FAILED at '{{ fe_checkpoint_cp_objects__create_networks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_objects__create_networks_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_objects__create_networks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_objects__create_networks failed at '{{ fe_checkpoint_cp_objects__create_networks_failed_task }}': {{ fe_checkpoint_cp_objects__create_networks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_objects__create_networks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_objects__create_networks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_objects__create_networks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_objects__create_networks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_objects__create_networks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_objects__create_networks":
              component: "checkpoint/cp_objects__create_networks"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_objects__create_networks_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_objects__create_networks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_objects__create_networks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_objects__create_networks_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_objects__create_networks_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_objects__create_networks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_objects__create_networks_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_objects__create_networks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_objects__create_networks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_objects__create_networks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_objects__create_networks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_objects__create_networks_status | default('') == 'succeeded' else ['checkpoint/cp_objects__create_networks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_objects__create_networks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_objects__create_networks_stats_published: true
      tags:
        - always
