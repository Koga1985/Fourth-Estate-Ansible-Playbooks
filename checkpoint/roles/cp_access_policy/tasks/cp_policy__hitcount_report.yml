---
# Export zero/low-hit rules to CSV for a given layer.
# Fourth Estate compliance: Quarterly rule hygiene review required
# DISA STIG NET-FW-010: Remove unused firewall rules
# Vars:
#   cp_layer: "Network"
#   hit_threshold: 0            # 0 = zero-hit; 10 = low-hit, etc.
#   artifacts_dir: "/tmp/checkpoint-artifacts"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_access_policy/cp_policy__hitcount_report']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status: "running"
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_preflight_passed: false
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_postflight_passed: false
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_failed_task: ""
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_error: ""
    fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_access_policy/cp_policy__hitcount_report: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_access_policy/cp_policy__hitcount_report: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_access_policy/cp_policy__hitcount_report: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_access_policy/cp_policy__hitcount_report: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _cp_layer: "{{ cp_layer | default('Network') }}"
        _thresh: "{{ hit_threshold | default(0) | int }}"
        _art_dir: "{{ artifacts_dir | default('/tmp/checkpoint-artifacts') }}"

    - name: Ensure artifact folder
      ansible.builtin.file:
        path: "{{ _art_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Fetch rulebase with hits
      check_point.mgmt.cp_mgmt_show_access_rulebase:
        name: "{{ _cp_layer }}"
        details_level: "standard"
        use_object_dictionnary: false
        show_hits: true
      register: _rb

    - name: Calculate hit statistics
      ansible.builtin.set_fact:
        _zero_hit_rules: >-
          {% set out = [] %}
          {% for r in _rb.access_rulebase | default([]) %}
          {% set hits = r.get('hits',{}).get('value',0) %}
          {% if hits | int == 0 %}
          {% set _ = out.append(r) %}
          {% endif %}
          {% endfor %}
          {{ out }}
        _low_hit_rules: >-
          {% set out = [] %}
          {% for r in _rb.access_rulebase | default([]) %}
          {% set hits = r.get('hits',{}).get('value',0) %}
          {% if hits | int > 0 and hits | int <= _thresh %}
          {% set _ = out.append(r) %}
          {% endif %}
          {% endfor %}
          {{ out }}

    - name: Build CSV of rules with hits <= threshold
      ansible.builtin.copy:
        dest: "{{ _art_dir }}/policy_hitcount_{{ _cp_layer | lower }}.csv"
        mode: "0644"
        content: |
          name,uid,position,hits,last_hit,enabled,action,source,destination,service,comments
          {% for r in _rb.access_rulebase | default([]) %}
          {% set hits = r.get('hits',{}).get('value',0) %}
          {% if hits | int <= _thresh %}
          {{ r.name | replace(',',';') }},{{ r.uid }},{{ r.position }},{{ hits }},{{ r.get('hits',{}).get('last-date','Never') }},{{ r.enabled }},{{ r.action }},{{ (r.get('source',[]) | map(attribute='name') | list | join(';')) | default('Any') }},{{ (r.get('destination',[]) | map(attribute='name') | list | join(';')) | default('Any') }},{{ (r.get('service',[]) | map(attribute='name') | list | join(';')) | default('Any') }},{{ r.get('comments','') | replace(',',';') }}
          {% endif %}
          {% endfor %}
      delegate_to: localhost

    - name: Generate Fourth Estate compliance report
      ansible.builtin.copy:
        dest: "{{ _art_dir }}/fourth_estate_hitcount_report_{{ ansible_date_time.date }}.txt"
        mode: "0640"
        content: |
          ==========================================================================
                        FOURTH ESTATE SECURITY COMPLIANCE REPORT
                        Check Point Firewall Rule Hygiene Review
          ==========================================================================

          Report Generated: {{ ansible_date_time.iso8601 }}
          Policy Layer: {{ _cp_layer }}
          Hit Count Threshold: {{ _thresh }}
          Report Period: Last 90 days

          EXECUTIVE SUMMARY
          -----------------
          Total Rules Analyzed: {{ _rb.access_rulebase | default([]) | length }}
          Zero Hit Rules: {{ _zero_hit_rules | length }}
          Low Hit Rules (<= {{ _thresh }}): {{ _low_hit_rules | length }}
          Rules Requiring Review: {{ (_zero_hit_rules | length) + (_low_hit_rules | length) }}

          COMPLIANCE REQUIREMENTS
          -----------------------
          - DISA STIG NET-FW-010: Firewall must remove or disable unused rules
          - Fourth Estate Policy: Quarterly rule hygiene reviews mandatory
          - All zero-hit rules > 90 days must be evaluated for removal
          - Business justification required for long-standing zero-hit rules

          FINDINGS
          --------
          {% if _zero_hit_rules | length > 0 %}
          Zero Hit Rules (Never Matched):
          {% for rule in _zero_hit_rules %}
            Rule: {{ rule.name }}
            Position: {{ rule.position }}
            Action: {{ rule.action }}
            Status: {{ 'Enabled' if rule.enabled else 'Disabled' }}
            Recommendation: {% if rule.enabled %}Review for removal{% else %}Safe to delete{% endif %}

          {% endfor %}
          {% else %}
          No zero-hit rules found - COMPLIANT
          {% endif %}

          {% if _low_hit_rules | length > 0 %}
          Low Hit Rules ({{ _thresh }} or fewer matches):
          {% for rule in _low_hit_rules %}
            Rule: {{ rule.name }}
            Hits: {{ rule.get('hits',{}).get('value',0) }}
            Last Hit: {{ rule.get('hits',{}).get('last-date','Unknown') }}
            Recommendation: Verify still required

          {% endfor %}
          {% endif %}

          RECOMMENDATIONS
          ---------------
          1. Review all zero-hit rules with security team
          2. Document business justification for retention
          3. Create change control for rule removal
          4. Archive removed rules in configuration management
          5. Schedule next review in 90 days

          COMPLIANCE STATUS
          -----------------
          {% if (_zero_hit_rules | length) + (_low_hit_rules | length) == 0 %}
          STATUS: COMPLIANT - No unused rules detected
          {% elif (_zero_hit_rules | length) + (_low_hit_rules | length) < 10 %}
          STATUS: ATTENTION REQUIRED - {{ (_zero_hit_rules | length) + (_low_hit_rules | length) }} rules need review
          {% else %}
          STATUS: NON-COMPLIANT - Immediate action required on {{ (_zero_hit_rules | length) + (_low_hit_rules | length) }} rules
          {% endif %}

          REVIEW SIGN-OFF
          ---------------
          Security Analyst: _____________________________ Date: __________
          Network Engineer: _____________________________ Date: __________
          ISSO/ISSM: ____________________________________ Date: __________

          Report File: {{ _art_dir }}/policy_hitcount_{{ _cp_layer | lower }}.csv
          ==========================================================================
      delegate_to: localhost

    - name: Display report summary
      ansible.builtin.debug:
        msg:
          - "Hitcount Report Generated: {{ _art_dir }}/policy_hitcount_{{ _cp_layer | lower }}.csv"
          - "Compliance Report: {{ _art_dir }}/fourth_estate_hitcount_report_{{ ansible_date_time.date }}.txt"
          - "Total Rules: {{ _rb.access_rulebase | default([]) | length }}"
          - "Zero Hit Rules: {{ _zero_hit_rules | length }}"
          - "Low Hit Rules: {{ _low_hit_rules | length }}"
          - "Rules Requiring Review: {{ (_zero_hit_rules | length) + (_low_hit_rules | length) }}"

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_preflight_passed | bool
          - fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_access_policy/cp_policy__hitcount_report: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status | default('unknown') }}.
        success_msg: "checkpoint/cp_access_policy/cp_policy__hitcount_report: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_postflight_passed: true
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status: "failed"
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_postflight_passed: false
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_access_policy/cp_policy__hitcount_report: FAILED at '{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_access_policy/cp_policy__hitcount_report failed at '{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_failed_task }}': {{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_access_policy/cp_policy__hitcount_report":
              component: "checkpoint/cp_access_policy/cp_policy__hitcount_report"
              type: "role-tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_status | default('') == 'succeeded' else ['checkpoint/cp_access_policy/cp_policy__hitcount_report'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_access_policy/cp_policy__hitcount_report | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_access_policy_cp_policy__hitcount_report_stats_published: true
      tags:
        - always
