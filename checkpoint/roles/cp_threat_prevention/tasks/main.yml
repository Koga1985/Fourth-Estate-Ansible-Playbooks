---
# Threat Prevention lifecycle tasks; import individually via tags as needed.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_threat_prevention']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_threat_prevention_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_threat_prevention | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_threat_prevention_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_threat_prevention_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_threat_prevention_status: "running"
    fe_checkpoint_cp_threat_prevention_preflight_passed: false
    fe_checkpoint_cp_threat_prevention_postflight_passed: false
    fe_checkpoint_cp_threat_prevention_failed_task: ""
    fe_checkpoint_cp_threat_prevention_error: ""
    fe_checkpoint_cp_threat_prevention_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_threat_prevention | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_threat_prevention | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_threat_prevention: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_threat_prevention: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_threat_prevention | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_threat_prevention: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_threat_prevention: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_threat_prevention_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_threat_prevention | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create/Update TP profile
      import_tasks: cp_tp__create_profile.yml
      tags: [tp, profile]

    - name: Apply TP rules
      import_tasks: cp_tp__apply_rules.yml
      tags: [tp, rules]

    - name: Apply TP exceptions
      import_tasks: cp_tp__exceptions.yml
      tags: [tp, exceptions]

    - name: Configure IPS update channel
      import_tasks: cp_tp__ips_update_channel.yml
      tags: [tp, ips, updates]

    - name: Publish + Install TP policy
      import_tasks: cp_tp__publish_install.yml
      tags: [tp, publish, install]

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_threat_prevention | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_threat_prevention_preflight_passed | bool
          - fe_checkpoint_cp_threat_prevention_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_threat_prevention: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_threat_prevention_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_threat_prevention_status | default('unknown') }}.
        success_msg: "checkpoint/cp_threat_prevention: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_threat_prevention | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_postflight_passed: true
        fe_checkpoint_cp_threat_prevention_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_threat_prevention | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_status: "failed"
        fe_checkpoint_cp_threat_prevention_postflight_passed: false
        fe_checkpoint_cp_threat_prevention_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_threat_prevention_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_threat_prevention | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_threat_prevention: FAILED at '{{ fe_checkpoint_cp_threat_prevention_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_threat_prevention_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_threat_prevention | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_threat_prevention failed at '{{ fe_checkpoint_cp_threat_prevention_failed_task }}': {{ fe_checkpoint_cp_threat_prevention_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_threat_prevention | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_threat_prevention_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_threat_prevention_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_threat_prevention | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_threat_prevention":
              component: "checkpoint/cp_threat_prevention"
              type: "role"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_threat_prevention_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_threat_prevention_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_threat_prevention_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_threat_prevention_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_threat_prevention_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_threat_prevention_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_threat_prevention_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_threat_prevention_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_threat_prevention_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_threat_prevention_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_threat_prevention_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_threat_prevention_status | default('') == 'succeeded' else ['checkpoint/cp_threat_prevention'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_threat_prevention | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_stats_published: true
      tags:
        - always
