---
# Create/Update a Threat Prevention profile with sane defaults.
# Fourth Estate compliance: All threat prevention must be in PREVENT mode
# DISA STIG: NET-IPS-010, NET-FW-030 compliance
# Vars:
#   tp_profile_name: "TP-Baseline"
#   tp_profile_desc: "Baseline: recommended protections; Prevent medium+"
#   tp_profile_mode: "optimized"     # or "strict" / "custom"
#   publish_changes: true|false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_threat_prevention/cp_tp__create_profile']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status: "running"
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_preflight_passed: false
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_postflight_passed: false
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_failed_task: ""
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_error: ""
    fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_threat_prevention/cp_tp__create_profile: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_threat_prevention/cp_tp__create_profile: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_threat_prevention/cp_tp__create_profile: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_threat_prevention/cp_tp__create_profile: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Fourth Estate compliance - validate TP profile settings
      ansible.builtin.assert:
        that:
          - tp_profile_name is defined
          - tp_profile_name | length > 0
          - tp_profile_mode in ['optimized', 'strict', 'custom']
        fail_msg: "Threat Prevention profile configuration invalid"
        success_msg: "TP profile settings validated"

    - name: Create/Update Threat Prevention profile
      check_point.mgmt.cp_mgmt_threat_profile:
        name: "{{ tp_profile_name }}"
        active_protections: "recommended"     # follow Check Point recommendations
        optimize_security_profiles: "{{ (tp_profile_mode | default('optimized')) == 'optimized' }}"
        detect_malicious_mail_content: true
        antivirus: "prevent"                  # Fourth Estate: must be prevent
        anti_bot: "prevent"                   # Fourth Estate: must be prevent
        ips:
          mode: "prevent"                     # DISA STIG: must be prevent for high/critical
          performance_impact: "medium_or_lower"
          severity: "medium_or_higher"        # Fourth Estate minimum: medium
        comments: "{{ tp_profile_desc | default('Fourth Estate Security Baseline - STIG Compliant') }}"
        state: present
      register: tp_profile_result

    - name: Generate TP profile documentation
      ansible.builtin.template:
        src: tp_profile.j2
        dest: "{{ artifacts_dir | default('/tmp/checkpoint-artifacts') }}/tp_profile_{{ tp_profile_name }}.txt"
        mode: '0640'
      delegate_to: localhost

    - name: Log TP profile creation
      ansible.builtin.debug:
        msg:
          - "Threat Prevention profile created: {{ tp_profile_name }}"
          - "Mode: {{ tp_profile_mode }}"
          - "IPS: PREVENT mode (STIG compliant)"
          - "Anti-Virus: PREVENT mode (Fourth Estate compliant)"
          - "Anti-Bot: PREVENT mode (Fourth Estate compliant)"

    - name: Publish profile changes
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_preflight_passed | bool
          - fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_threat_prevention/cp_tp__create_profile: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status | default('unknown') }}.
        success_msg: "checkpoint/cp_threat_prevention/cp_tp__create_profile: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_postflight_passed: true
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status: "failed"
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_postflight_passed: false
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_threat_prevention/cp_tp__create_profile: FAILED at '{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_threat_prevention/cp_tp__create_profile failed at '{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_failed_task }}': {{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_threat_prevention/cp_tp__create_profile":
              component: "checkpoint/cp_threat_prevention/cp_tp__create_profile"
              type: "role-tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_status | default('') == 'succeeded' else ['checkpoint/cp_threat_prevention/cp_tp__create_profile'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_threat_prevention/cp_tp__create_profile | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_threat_prevention_cp_tp__create_profile_stats_published: true
      tags:
        - always
