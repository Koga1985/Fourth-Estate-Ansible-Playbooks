
[checkpoint_mgmt]
mgmt-1 ansible_host=192.0.2.10

[checkpoint_mgmt:vars]
ansible_network_os=check_point.gaia
ansible_connection=httpapi
ansible_httpapi_use_ssl=true
ansible_httpapi_validate_certs=true
ansible_httpapi_port=443
ansible_user=api_user
# Do not put a password here. Keep it in an ansible-vault file and
# reference it, or inject it from Automation Controller at launch.
ansible_password=CHANGE_ME
