---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status: "running"
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_preflight_passed: false
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_postflight_passed: false
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_failed_task: ""
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_error: ""
    fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure AD identity provider (generic API)
      check_point.mgmt.cp_mgmt_api_call:
        command: "set-identity-awareness-settings"
        parameters:
          ad-integrations:
            - name: "{{ item.name }}"
              ad-domain: "{{ item.ad_domain }}"
              servers: "{{ item.servers }}"
              username: "{{ item.user }}"
              password: "{{ item.password }}"
              use-ssl: "{{ item.use_ssl | default(true) }}"
              fetch-interval: "{{ item.fetch_interval_minutes | default(5) }}"
      loop: "{{ ia_identity_sources | default([]) }}"
      no_log: true

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_preflight_passed | bool
          - fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status | default('unknown') }}.
        success_msg: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_postflight_passed: true
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status: "failed"
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_postflight_passed: false
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors: FAILED at '{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors failed at '{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_failed_task }}': {{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors":
              component: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors"
              type: "role-tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_status | default('') == 'succeeded' else ['checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_day0_deploy_configure/cp_identity_awareness/cp_ia__ad_connectors | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_day0_deploy_configure_cp_identity_awareness_cp_ia__ad_connectors_stats_published: true
      tags:
        - always
