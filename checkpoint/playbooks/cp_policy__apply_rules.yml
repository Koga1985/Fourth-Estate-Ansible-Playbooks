---
# Create (or replace) rule blocks from YAML.
# Optional cleanup by a "managed tag" before creating new rules.
# Vars:
#   cp_layer: "Network"
#   managed_tag: "ansible-managed"     # if set, pre-delete existing rules with this tag
#   cp_access_rules:
#     - name: "Allow Web to App"
#       position: "below 10-Prod-Web"
#       source: ["web-servers"]
#       destination: ["app-servers"]
#       service: ["http","https"]
#       action: "Accept"
#       track: "Log"
#       enabled: true
#       time: "Any"
#       install_on: ["Policy Targets"]
#       tags: ["ansible-managed","owner:netops","app:payments"]

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_policy__apply_rules']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_policy__apply_rules_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_policy__apply_rules | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_policy__apply_rules_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_policy__apply_rules_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_policy__apply_rules_status: "running"
    fe_checkpoint_cp_policy__apply_rules_preflight_passed: false
    fe_checkpoint_cp_policy__apply_rules_postflight_passed: false
    fe_checkpoint_cp_policy__apply_rules_failed_task: ""
    fe_checkpoint_cp_policy__apply_rules_error: ""
    fe_checkpoint_cp_policy__apply_rules_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_policy__apply_rules | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_policy__apply_rules | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_policy__apply_rules: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_policy__apply_rules: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__apply_rules | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_policy__apply_rules: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_policy__apply_rules: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_policy__apply_rules_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_policy__apply_rules | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__apply_rules_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _cp_layer: "{{ cp_layer | default('Network') }}"
        _managed_tag: "{{ managed_tag | default(omit) }}"

    - name: (Optional) fetch existing rules with managed tag
      when: _managed_tag is defined
      check_point.mgmt.cp_mgmt_show_access_rulebase:
        name: "{{ _cp_layer }}"
        details_level: "standard"
        use_object_dictionnary: false
        filter: "{{ _managed_tag }}"
      register: _existing_tagged

    - name: (Optional) delete previously managed rules (by uid)
      when: _managed_tag is defined and (_existing_tagged.access_rulebase | default([])) | length > 0
      check_point.mgmt.cp_mgmt_delete_access_rule:
        layer: "{{ _cp_layer }}"
        uid: "{{ item.uid }}"
      loop: "{{ _existing_tagged.access_rulebase | list }}"
      loop_control: { label: "{{ item.name | default(item.uid) }}" }

    - name: Create/Update access rules
      check_point.mgmt.cp_mgmt_access_rule:
        layer: "{{ _cp_layer }}"
        name: "{{ item.name }}"
        position: "{{ item.position | default('top') }}"
        source: "{{ item.source | default(['Any']) }}"
        destination: "{{ item.destination | default(['Any']) }}"
        service: "{{ item.service | default(['Any']) }}"
        action: "{{ item.action | default('Accept') }}"
        track: "{{ item.track | default('Log') }}"
        enabled: "{{ item.enabled | default(true) }}"
        time: "{{ item.time | default('Any') }}"
        install_on: "{{ item.install_on | default(['Policy Targets']) }}"
        tags: "{{ item.tags | default(omit) }}"
        state: present
      loop: "{{ cp_access_rules | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_policy__apply_rules | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_policy__apply_rules_preflight_passed | bool
          - fe_checkpoint_cp_policy__apply_rules_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_policy__apply_rules: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_policy__apply_rules_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_policy__apply_rules_status | default('unknown') }}.
        success_msg: "checkpoint/cp_policy__apply_rules: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_policy__apply_rules | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__apply_rules_postflight_passed: true
        fe_checkpoint_cp_policy__apply_rules_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_policy__apply_rules | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__apply_rules_status: "failed"
        fe_checkpoint_cp_policy__apply_rules_postflight_passed: false
        fe_checkpoint_cp_policy__apply_rules_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_policy__apply_rules_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__apply_rules | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_policy__apply_rules: FAILED at '{{ fe_checkpoint_cp_policy__apply_rules_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_policy__apply_rules_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_policy__apply_rules | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_policy__apply_rules failed at '{{ fe_checkpoint_cp_policy__apply_rules_failed_task }}': {{ fe_checkpoint_cp_policy__apply_rules_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_policy__apply_rules | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__apply_rules_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_policy__apply_rules_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_policy__apply_rules_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_policy__apply_rules | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_policy__apply_rules":
              component: "checkpoint/cp_policy__apply_rules"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_policy__apply_rules_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_policy__apply_rules_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_policy__apply_rules_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_policy__apply_rules_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_policy__apply_rules_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_policy__apply_rules_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_policy__apply_rules_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_policy__apply_rules_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_policy__apply_rules_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_policy__apply_rules_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_policy__apply_rules_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_policy__apply_rules_status | default('') == 'succeeded' else ['checkpoint/cp_policy__apply_rules'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_policy__apply_rules | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_policy__apply_rules_stats_published: true
      tags:
        - always
