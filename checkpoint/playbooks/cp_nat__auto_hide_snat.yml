---
# Toggle auto hide-SNAT on Host / Network objects (object-level NAT).
#
# Vars (any subset):
#   cp_hosts_hide_nat:
#     - { name: "web-servers-egress", enabled: true, hide_behind: "gateway" }  # gateway|ip
#     - { name: "legacy-app", enabled: true, hide_behind: "ip", ip: "198.51.100.10" }
#   cp_networks_hide_nat:
#     - { name: "prod-net", enabled: false }
#   publish_changes: true|false

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_nat__auto_hide_snat']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_nat__auto_hide_snat_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_nat__auto_hide_snat | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_nat__auto_hide_snat_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_nat__auto_hide_snat_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_nat__auto_hide_snat_status: "running"
    fe_checkpoint_cp_nat__auto_hide_snat_preflight_passed: false
    fe_checkpoint_cp_nat__auto_hide_snat_postflight_passed: false
    fe_checkpoint_cp_nat__auto_hide_snat_failed_task: ""
    fe_checkpoint_cp_nat__auto_hide_snat_error: ""
    fe_checkpoint_cp_nat__auto_hide_snat_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_nat__auto_hide_snat | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_nat__auto_hide_snat | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_nat__auto_hide_snat: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_nat__auto_hide_snat: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__auto_hide_snat | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_nat__auto_hide_snat: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_nat__auto_hide_snat: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_nat__auto_hide_snat_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_nat__auto_hide_snat | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__auto_hide_snat_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure auto hide NAT on hosts
      when: (cp_hosts_hide_nat | default([])) | length > 0
      check_point.mgmt.cp_mgmt_host:
        name: "{{ item.name }}"
        state: present
        nat_settings:
          auto_rule: "{{ item.enabled | default(true) | bool }}"
          method: "{{ (item.enabled | default(true)) | bool | ternary('hide', omit) }}"
          hide_behind: >-
            {{
              (item.enabled | default(true)) | bool
              | ternary( (item.hide_behind | default('gateway')), omit)
            }}
          ipv4_address: >-
            {{
              (item.enabled | default(true)) and (item.hide_behind | default('gateway')) == 'ip'
              | ternary(item.ip, omit)
            }}
      loop: "{{ cp_hosts_hide_nat | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Configure auto hide NAT on networks
      when: (cp_networks_hide_nat | default([])) | length > 0
      check_point.mgmt.cp_mgmt_network:
        name: "{{ item.name }}"
        state: present
        nat_settings:
          auto_rule: "{{ item.enabled | default(true) | bool }}"
          method: "{{ (item.enabled | default(true)) | bool | ternary('hide', omit) }}"
          hide_behind: >-
            {{
              (item.enabled | default(true)) | bool
              | ternary( (item.hide_behind | default('gateway')), omit)
            }}
          ipv4_address: >-
            {{
              (item.enabled | default(true)) and (item.hide_behind | default('gateway')) == 'ip'
              | ternary(item.ip, omit)
            }}
      loop: "{{ cp_networks_hide_nat | default([]) }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Publish object NAT changes
      when: publish_changes | default(false) | bool
      check_point.mgmt.cp_mgmt_publish:

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_nat__auto_hide_snat | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_nat__auto_hide_snat_preflight_passed | bool
          - fe_checkpoint_cp_nat__auto_hide_snat_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_nat__auto_hide_snat: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_nat__auto_hide_snat_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_nat__auto_hide_snat_status | default('unknown') }}.
        success_msg: "checkpoint/cp_nat__auto_hide_snat: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_nat__auto_hide_snat | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__auto_hide_snat_postflight_passed: true
        fe_checkpoint_cp_nat__auto_hide_snat_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_nat__auto_hide_snat | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__auto_hide_snat_status: "failed"
        fe_checkpoint_cp_nat__auto_hide_snat_postflight_passed: false
        fe_checkpoint_cp_nat__auto_hide_snat_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_nat__auto_hide_snat_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__auto_hide_snat | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_nat__auto_hide_snat: FAILED at '{{ fe_checkpoint_cp_nat__auto_hide_snat_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_nat__auto_hide_snat_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_nat__auto_hide_snat | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_nat__auto_hide_snat failed at '{{ fe_checkpoint_cp_nat__auto_hide_snat_failed_task }}': {{ fe_checkpoint_cp_nat__auto_hide_snat_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_nat__auto_hide_snat | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__auto_hide_snat_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_nat__auto_hide_snat_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_nat__auto_hide_snat_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_nat__auto_hide_snat | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_nat__auto_hide_snat":
              component: "checkpoint/cp_nat__auto_hide_snat"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_nat__auto_hide_snat_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_nat__auto_hide_snat_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_nat__auto_hide_snat_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_nat__auto_hide_snat_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_nat__auto_hide_snat_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_nat__auto_hide_snat_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_nat__auto_hide_snat_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_nat__auto_hide_snat_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_nat__auto_hide_snat_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_nat__auto_hide_snat_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_nat__auto_hide_snat_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_nat__auto_hide_snat_status | default('') == 'succeeded' else ['checkpoint/cp_nat__auto_hide_snat'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_nat__auto_hide_snat | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_nat__auto_hide_snat_stats_published: true
      tags:
        - always
