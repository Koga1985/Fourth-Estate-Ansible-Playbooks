---
# Exports objects/services/groups to CSV files under artifacts directory.
# Vars expected:
#   artifacts_dir: "/tmp/checkpoint-artifacts"   # default below if not set
#   export_types: ["host","network","address-range","group","service-tcp","service-udp","application-site","application-site-category"]

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['checkpoint/cp_inventory__export_csv']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_checkpoint_cp_inventory__export_csv_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "checkpoint/cp_inventory__export_csv | Initialize validation state"
  ansible.builtin.set_fact:
    fe_checkpoint_cp_inventory__export_csv_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_checkpoint_cp_inventory__export_csv_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_checkpoint_cp_inventory__export_csv_status: "running"
    fe_checkpoint_cp_inventory__export_csv_preflight_passed: false
    fe_checkpoint_cp_inventory__export_csv_postflight_passed: false
    fe_checkpoint_cp_inventory__export_csv_failed_task: ""
    fe_checkpoint_cp_inventory__export_csv_error: ""
    fe_checkpoint_cp_inventory__export_csv_stats_published: false
  tags:
    - always

- name: "checkpoint/cp_inventory__export_csv | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "checkpoint/cp_inventory__export_csv | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          checkpoint/cp_inventory__export_csv: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          checkpoint/cp_inventory__export_csv: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_inventory__export_csv | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "checkpoint/cp_inventory__export_csv: required variable '{{ item }}' is not defined."
        success_msg: "checkpoint/cp_inventory__export_csv: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_checkpoint_cp_inventory__export_csv_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "checkpoint/cp_inventory__export_csv | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_inventory__export_csv_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Defaults
      ansible.builtin.set_fact:
        _art_dir: "{{ artifacts_dir | default('/tmp/checkpoint-artifacts') }}"
        _export_types: "{{ export_types | default(['host','network','address-range','group','service-tcp','service-udp','application-site','application-site-category']) }}"

    - name: Ensure artifact folder
      ansible.builtin.file:
        path: "{{ _art_dir }}"
        state: directory
        mode: "0755"

    - name: Fetch objects by type
      check_point.mgmt.cp_mgmt_show_objects:
        type: "{{ item }}"
        limit: 1000
        details_level: standard
      loop: "{{ _export_types }}"
      register: _objs

    - name: Build type→rows map
      ansible.builtin.set_fact:
        _rows: >-
          {%- set out = {} -%}
          {%- for r in _objs.results -%}
            {%- set t = r['item'] -%}
            {%- set arr = [] -%}
            {%- for o in r['objects'] | default([]) -%}
              {%- set _ = arr.append({
                'name': o.get('name',''),
                'type': t,
                'ip': o.get('ip-address','') or o.get('subnet4','') or o.get('ip-address-first',''),
                'mask_or_end': o.get('mask-length','') or o.get('ip-address-last',''),
                'port': o.get('port',''),
                'color': o.get('color',''),
                'comments': o.get('comments','')
              }) -%}
            {%- endfor -%}
            {%- set _ = out.update({ t: arr }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Write CSV files per type
      ansible.builtin.copy:
        dest: "{{ _art_dir }}/{{ item.key }}.csv"
        mode: "0644"
        content: |
          name,type,ip,mask_or_end,port,color,comments
          {% for row in item.value %}
          {{ row.name | replace(',',';') }},{{ row.type }},{{ row.ip }},{{ row.mask_or_end }},{{ row.port }},{{ row.color }},{{ row.comments | replace(',',';') }}
          {% endfor %}
      loop: "{{ _rows | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # ----------------------------- postflight -------------------

    - name: "checkpoint/cp_inventory__export_csv | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_checkpoint_cp_inventory__export_csv_preflight_passed | bool
          - fe_checkpoint_cp_inventory__export_csv_status in ['running', 'succeeded']
        fail_msg: >-
          checkpoint/cp_inventory__export_csv: postflight validation failed - preflight passed
          ={{ fe_checkpoint_cp_inventory__export_csv_preflight_passed | default(false) }},
          status={{ fe_checkpoint_cp_inventory__export_csv_status | default('unknown') }}.
        success_msg: "checkpoint/cp_inventory__export_csv: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "checkpoint/cp_inventory__export_csv | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_inventory__export_csv_postflight_passed: true
        fe_checkpoint_cp_inventory__export_csv_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "checkpoint/cp_inventory__export_csv | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_inventory__export_csv_status: "failed"
        fe_checkpoint_cp_inventory__export_csv_postflight_passed: false
        fe_checkpoint_cp_inventory__export_csv_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_checkpoint_cp_inventory__export_csv_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_inventory__export_csv | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          checkpoint/cp_inventory__export_csv: FAILED at '{{ fe_checkpoint_cp_inventory__export_csv_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_checkpoint_cp_inventory__export_csv_error }}
      tags:
        - always
        - rescue

    - name: "checkpoint/cp_inventory__export_csv | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          checkpoint/cp_inventory__export_csv failed at '{{ fe_checkpoint_cp_inventory__export_csv_failed_task }}': {{ fe_checkpoint_cp_inventory__export_csv_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "checkpoint/cp_inventory__export_csv | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_inventory__export_csv_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_checkpoint_cp_inventory__export_csv_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_checkpoint_cp_inventory__export_csv_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "checkpoint/cp_inventory__export_csv | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "checkpoint/cp_inventory__export_csv":
              component: "checkpoint/cp_inventory__export_csv"
              type: "tasks"
              platform: "checkpoint"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_checkpoint_cp_inventory__export_csv_status | default('unknown') }}"
              preflight_passed: "{{ fe_checkpoint_cp_inventory__export_csv_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_checkpoint_cp_inventory__export_csv_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_checkpoint_cp_inventory__export_csv_started_at | default('') }}"
              ended_at: "{{ fe_checkpoint_cp_inventory__export_csv_ended_at | default('') }}"
              duration_seconds: "{{ fe_checkpoint_cp_inventory__export_csv_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_checkpoint_cp_inventory__export_csv_failed_task | default('') }}"
              error: "{{ fe_checkpoint_cp_inventory__export_csv_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_checkpoint_cp_inventory__export_csv_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_checkpoint_cp_inventory__export_csv_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_checkpoint_cp_inventory__export_csv_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_checkpoint_cp_inventory__export_csv_status | default('') == 'succeeded' else ['checkpoint/cp_inventory__export_csv'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "checkpoint/cp_inventory__export_csv | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_checkpoint_cp_inventory__export_csv_stats_published: true
      tags:
        - always
