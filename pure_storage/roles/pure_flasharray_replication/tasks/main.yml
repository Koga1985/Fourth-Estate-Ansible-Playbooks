---
# Pure Storage FlashArray Replication Management
# Handles ActiveCluster, ActiveDR, array pairing, and replication policies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_replication']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_replication_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_replication | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_replication_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_replication_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_replication_status: "running"
    fe_pure_storage_pure_flasharray_replication_preflight_passed: false
    fe_pure_storage_pure_flasharray_replication_postflight_passed: false
    fe_pure_storage_pure_flasharray_replication_failed_task: ""
    fe_pure_storage_pure_flasharray_replication_error: ""
    fe_pure_storage_pure_flasharray_replication_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_replication | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_replication | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_replication: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_replication: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_replication | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_replication: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_replication: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_replication_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_replication | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_replication_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create array connections for replication
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        target_url: "{{ item.target_url }}"
        target_api: "{{ item.target_api_token }}"
        connection: "replication"
        state: present
      loop: "{{ flasharray_replication_targets }}"
      when: flasharray_replication_targets is defined
      no_log: true

    - name: Configure ActiveCluster (synchronous replication)
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        target_url: "{{ item.target_url }}"
        target_api: "{{ item.target_api_token }}"
        connection: "sync-replication"
        transport: "{{ item.transport | default('ip') }}"
        state: present
      loop: "{{ flasharray_activecluster_arrays }}"
      when: flasharray_activecluster_arrays is defined
      no_log: true

    - name: Create pods for ActiveCluster
      purefa_pod:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ flasharray_activecluster_pods }}"
      when: flasharray_activecluster_pods is defined

    - name: Stretch pods across arrays (ActiveCluster)
      purefa_pod:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pod_name }}"
        stretch: "{{ item.target_array }}"
        state: present
      loop: "{{ flasharray_stretched_pods }}"
      when: flasharray_stretched_pods is defined

    - name: Add volumes to pods
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pod_name }}::{{ item.volume_name }}"
        size: "{{ item.size }}"
        state: present
      loop: "{{ flasharray_pod_volumes }}"
      when: flasharray_pod_volumes is defined

    - name: Configure ActiveDR (asynchronous replication)
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        target: "{{ item.target_array }}"
        state: present
      loop: "{{ flasharray_activedr_pgroups }}"
      when: flasharray_activedr_pgroups is defined

    - name: Configure replication schedules
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        enabled: true
        replicate_enabled: true
        replicate_frequency: "{{ item.replicate_frequency }}"
        target: "{{ item.target_array }}"
        state: present
      loop: "{{ flasharray_replication_schedules }}"
      when: flasharray_replication_schedules is defined

    - name: Set replication bandwidth limits
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        target_url: "{{ item.target_url }}"
        target_api: "{{ item.target_api_token }}"
        bandwidth: "{{ item.bandwidth_limit }}"
        state: present
      loop: "{{ flasharray_replication_bandwidth }}"
      when: flasharray_replication_bandwidth is defined
      no_log: true

    - name: Configure replication networks
      purefa_network:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.interface }}"
        address: "{{ item.address }}"
        netmask: "{{ item.netmask }}"
        gateway: "{{ item.gateway | default(omit) }}"
        mtu: "{{ item.mtu | default(9000) }}"
        services:
          - replication
        state: present
      loop: "{{ flasharray_replication_interfaces }}"
      when: flasharray_replication_interfaces is defined

    - name: Enable continuous replication
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        target: "{{ item.target_array }}"
        replicate_enabled: true
        state: present
      loop: "{{ flasharray_continuous_replication }}"
      when: flasharray_continuous_replication is defined

    - name: Configure RPO targets
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        replicate_frequency: "{{ item.rpo_seconds }}"
        target: "{{ item.target_array }}"
        state: present
      loop: "{{ flasharray_rpo_targets }}"
      when: flasharray_rpo_targets is defined

    - name: Pause replication for maintenance
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        replicate_enabled: false
        state: present
      loop: "{{ flasharray_pause_replication }}"
      when: flasharray_pause_replication is defined

    - name: Resume replication after maintenance
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        replicate_enabled: true
        state: present
      loop: "{{ flasharray_resume_replication }}"
      when: flasharray_resume_replication is defined

    - name: Promote replica to primary (failover)
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        promote: true
        state: present
      loop: "{{ flasharray_failover_pgroups }}"
      when: flasharray_failover_pgroups is defined

    - name: Demote primary to replica (failback)
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        demote: true
        state: present
      loop: "{{ flasharray_failback_pgroups }}"
      when: flasharray_failback_pgroups is defined

    - name: Monitor replication lag
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - pgroups
      register: replication_status

    - name: Configure WAN optimization
      purefa_network:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.interface }}"
        mtu: 9000  # Jumbo frames for replication
        state: present
      loop: "{{ flasharray_replication_interfaces }}"
      when: flasharray_replication_interfaces is defined

    - name: Set up Fourth Estate DR replication
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        target: "{{ flasharray_dr_site_array }}"
        replicate_enabled: true
        state: present
      loop: "{{ flasharray_fourth_estate_dr_pgroups }}"
      when:
        - flasharray_fourth_estate_dr_pgroups is defined
        - flasharray_dr_site_array is defined
      tags:
        - dr
        - fourth-estate

    - name: Replication management summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Replication Management Complete"
          - "Replication Targets: {{ flasharray_replication_targets | default([]) | length }}"
          - "ActiveCluster Arrays: {{ flasharray_activecluster_arrays | default([]) | length }}"
          - "ActiveCluster Pods: {{ flasharray_activecluster_pods | default([]) | length }}"
          - "ActiveDR Protection Groups: {{ flasharray_activedr_pgroups | default([]) | length }}"
          - "Replication Schedules: {{ flasharray_replication_schedules | default([]) | length }}"
          - "Bandwidth Limits: {{ flasharray_replication_bandwidth | default([]) | length }} configured"
          - "Continuous Replication: {{ flasharray_continuous_replication | default([]) | length }} PGs"
          - "Fourth Estate DR: {{ flasharray_dr_site_array | default('Not configured') }}"
          - "ActiveCluster RPO: 0 seconds (synchronous)"
          - "ActiveDR RPO: {{ flasharray_default_rpo_minutes | default(15) }} minutes"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_replication | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_replication_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_replication_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_replication: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_replication_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_replication_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_replication: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_replication | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_replication_postflight_passed: true
        fe_pure_storage_pure_flasharray_replication_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_replication | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_replication_status: "failed"
        fe_pure_storage_pure_flasharray_replication_postflight_passed: false
        fe_pure_storage_pure_flasharray_replication_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_replication_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_replication | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_replication: FAILED at '{{ fe_pure_storage_pure_flasharray_replication_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_replication_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_replication | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_replication failed at '{{ fe_pure_storage_pure_flasharray_replication_failed_task }}': {{ fe_pure_storage_pure_flasharray_replication_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_replication | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_replication_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_replication_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_replication_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_replication | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_replication":
              component: "pure_storage/pure_flasharray_replication"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_replication_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_replication_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_replication_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_replication_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_replication_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_replication_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_replication_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_replication_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_replication_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_replication_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_replication_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_replication_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_replication'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_replication | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_replication_stats_published: true
      tags:
        - always
