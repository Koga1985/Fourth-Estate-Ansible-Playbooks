---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    apply_changes: false
  tasks:
    - name: Run the pure_fb_data_protection role
      ansible.builtin.include_role:
        name: pure_fb_data_protection

    - name: Assert the validation harness reported success
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_fb_data_protection_preflight_passed | bool
          - fe_pure_storage_pure_fb_data_protection_postflight_passed | bool
          - fe_pure_storage_pure_fb_data_protection_status == 'succeeded'
        fail_msg: >-
          pure_fb_data_protection did not complete cleanly:
          status={{ fe_pure_storage_pure_fb_data_protection_status | default('unset') }}
          failed_task={{ fe_pure_storage_pure_fb_data_protection_failed_task | default('') }}
        success_msg: "pure_fb_data_protection completed and the validation harness reported success."
