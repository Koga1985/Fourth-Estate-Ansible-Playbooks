---
# Pure Storage FlashArray Configuration
# Advanced array configuration including directory services, SAML, audit logging, and security

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_config_status: "running"
    fe_pure_storage_pure_flasharray_config_preflight_passed: false
    fe_pure_storage_pure_flasharray_config_postflight_passed: false
    fe_pure_storage_pure_flasharray_config_failed_task: ""
    fe_pure_storage_pure_flasharray_config_error: ""
    fe_pure_storage_pure_flasharray_config_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_config: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure array settings
      purefa_arrayname:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ flasharray_name }}"
      when: flasharray_name is defined

    - name: Configure SNMP v3 monitoring
      purefa_snmp:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        version: "{{ item.version }}"
        auth_protocol: "{{ item.auth_protocol | default('SHA') }}"
        auth_passphrase: "{{ item.auth_passphrase }}"
        privacy_protocol: "{{ item.privacy_protocol | default('AES') }}"
        privacy_passphrase: "{{ item.privacy_passphrase }}"
        user: "{{ item.user }}"
        host: "{{ item.host }}"
        state: present
      loop: "{{ flasharray_snmp_managers }}"
      when: flasharray_snmp_managers is defined
      no_log: true

    - name: Configure SNMP v3 community (if required)
      purefa_snmp:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        community: "{{ item.community }}"
        host: "{{ item.host }}"
        version: "v2c"
        state: present
      loop: "{{ flasharray_snmp_v2_managers }}"
      when: flasharray_snmp_v2_managers is defined
      no_log: true

    - name: Configure Active Directory
      purefa_ds:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        dstype: "ad"
        uri: "{{ flasharray_ad_servers }}"
        base_dn: "{{ flasharray_ad_base_dn }}"
        bind_user: "{{ flasharray_ad_bind_user }}"
        bind_password: "{{ flasharray_ad_bind_password }}"
        enable: true
        state: present
      when:
        - flasharray_ad_enabled | default(false)
        - flasharray_ad_servers is defined
      no_log: true

    - name: Configure LDAP
      purefa_ds:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        dstype: "ldap"
        uri: "{{ flasharray_ldap_servers }}"
        base_dn: "{{ flasharray_ldap_base_dn }}"
        bind_user: "{{ flasharray_ldap_bind_user }}"
        bind_password: "{{ flasharray_ldap_bind_password }}"
        enable: true
        state: present
      when:
        - flasharray_ldap_enabled | default(false)
        - flasharray_ldap_servers is defined
      no_log: true

    - name: Configure directory service roles
      purefa_dsrole:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        role: "{{ item.role }}"
        group: "{{ item.group }}"
        group_base: "{{ item.group_base }}"
        state: present
      loop: "{{ flasharray_ds_roles }}"
      when: flasharray_ds_roles is defined

    - name: Configure SAML SSO
      purefa_saml:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ flasharray_saml_name }}"
        enabled: true
        url: "{{ flasharray_saml_idp_url }}"
        metadata_url: "{{ flasharray_saml_metadata_url }}"
        x509_cert: "{{ lookup('file', flasharray_saml_cert) }}"
        state: present
      when:
        - flasharray_saml_enabled | default(false)
        - flasharray_saml_idp_url is defined

    - name: Enable multi-admin approval
      purefa_policy:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "multi_admin_approval"
        enabled: true
        state: present
      when: flasharray_multi_admin_enabled | default(false)

    - name: Configure audit log retention
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - config
      register: audit_config

    - name: Create API tokens for automation
      purefa_apiclient:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        role: "{{ item.role }}"
        state: present
      loop: "{{ flasharray_api_clients }}"
      when: flasharray_api_clients is defined
      register: api_tokens

    - name: Display API tokens (save securely)
      ansible.builtin.debug:
        msg: "API Client {{ item.item.name }} created - save token securely"
      loop: "{{ api_tokens.results }}"
      when:
        - api_tokens is defined
        - not ansible_check_mode
      no_log: false

    - name: Configure email relay settings
      purefa_smtp:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        sender_domain: "{{ flasharray_smtp_sender_domain }}"
        relay_host: "{{ flasharray_smtp_relay_host }}"
        user: "{{ flasharray_smtp_user | default(omit) }}"
        password: "{{ flasharray_smtp_password | default(omit) }}"
        state: present
      when: flasharray_smtp_relay_host is defined
      no_log: true

    - name: Configure alert recipients
      purefa_alert:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        address: "{{ item.address }}"
        enabled: "{{ item.enabled | default(true) }}"
        severity: "{{ item.severity | default(['info', 'warning', 'critical']) }}"
        state: present
      loop: "{{ flasharray_alert_recipients }}"
      when: flasharray_alert_recipients is defined

    - name: Configure syslog forwarding
      purefa_syslog:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        address: "{{ item.address }}"
        port: "{{ item.port | default(514) }}"
        protocol: "{{ item.protocol | default('tcp') }}"
        state: present
      loop: "{{ flasharray_syslog_servers }}"
      when: flasharray_syslog_servers is defined

    - name: Install custom SSL certificate
      purefa_cert:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        certificate: "{{ lookup('file', flasharray_ssl_certificate) }}"
        key: "{{ lookup('file', flasharray_ssl_key) }}"
        passphrase: "{{ flasharray_ssl_passphrase | default(omit) }}"
        state: present
      when:
        - flasharray_ssl_certificate is defined
        - flasharray_ssl_key is defined
      no_log: true
      notify: verify ssl certificate

    - name: Configure session timeout
      purefa_timeout:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        timeout: "{{ flasharray_idle_timeout }}"

    - name: Enable array banner message
      purefa_banner:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        banner: "{{ flasharray_login_banner }}"
        state: present
      when: flasharray_login_banner is defined

    - name: Configure NTP servers with authentication
      purefa_ntp:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        ntp_servers: "{{ flasharray_ntp_servers }}"
        key: "{{ flasharray_ntp_key | default(omit) }}"
        key_id: "{{ flasharray_ntp_key_id | default(omit) }}"
        state: present
      when: flasharray_ntp_servers is defined

    - name: Enable remote support (Pure1)
      purefa_phonehome:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        state: present
      when: flasharray_phonehome_enabled | default(true)

    - name: Configure support proxy if needed
      purefa_proxy:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        host: "{{ flasharray_support_proxy_host }}"
        port: "{{ flasharray_support_proxy_port }}"
        state: present
      when:
        - flasharray_support_proxy_enabled | default(false)
        - flasharray_support_proxy_host is defined

    - name: Set array location and contact
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - config
      register: array_config

    - name: Enable SafeMode (immutable snapshots)
      purefa_eula:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        state: signed
      when: flasharray_safemode_enabled | default(true)

    - name: Configuration summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Configuration Complete"
          - "Directory Services: {{ 'Active Directory' if flasharray_ad_enabled | default(false) else ('LDAP' if flasharray_ldap_enabled | default(false) else 'Local Only') }}"
          - "SAML SSO: {{ flasharray_saml_enabled | default(false) | ternary('Enabled', 'Disabled') }}"
          - "Multi-Admin Approval: {{ flasharray_multi_admin_enabled | default(false) | ternary('Enabled', 'Disabled') }}"
          - "SNMP Monitoring: {{ (flasharray_snmp_managers | default([]) | length > 0) | ternary('Configured', 'Not Configured') }}"
          - "Syslog Forwarding: {{ (flasharray_syslog_servers | default([]) | length > 0) | ternary('Configured', 'Not Configured') }}"
          - "Email Alerts: {{ (flasharray_alert_recipients | default([]) | length > 0) | ternary('Configured', 'Not Configured') }}"
          - "Pure1 Remote Support: {{ flasharray_phonehome_enabled | default(true) | ternary('Enabled', 'Disabled') }}"
          - "Session Timeout: {{ flasharray_idle_timeout }} minutes"
          - "Audit Retention: {{ flasharray_audit_retention_days | default(365) }} days"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_config_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_config_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_config: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_config_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_config_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_config_postflight_passed: true
        fe_pure_storage_pure_flasharray_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_config_status: "failed"
        fe_pure_storage_pure_flasharray_config_postflight_passed: false
        fe_pure_storage_pure_flasharray_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_config: FAILED at '{{ fe_pure_storage_pure_flasharray_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_config_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_config failed at '{{ fe_pure_storage_pure_flasharray_config_failed_task }}': {{ fe_pure_storage_pure_flasharray_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_config":
              component: "pure_storage/pure_flasharray_config"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_config_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_config_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_config_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_config_stats_published: true
      tags:
        - always
