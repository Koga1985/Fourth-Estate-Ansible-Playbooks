---
# Pure Storage FlashArray Performance Management
# Handles QoS, performance tuning, monitoring, and optimization

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_performance']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_performance_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_performance | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_performance_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_performance_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_performance_status: "running"
    fe_pure_storage_pure_flasharray_performance_preflight_passed: false
    fe_pure_storage_pure_flasharray_performance_postflight_passed: false
    fe_pure_storage_pure_flasharray_performance_failed_task: ""
    fe_pure_storage_pure_flasharray_performance_error: ""
    fe_pure_storage_pure_flasharray_performance_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_performance | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_performance | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_performance: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_performance: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_performance | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_performance: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_performance: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_performance_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_performance | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_performance_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create QoS policies
      purefa_qos:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        bandwidth_limit: "{{ item.bandwidth_limit | default(omit) }}"
        iops_limit: "{{ item.iops_limit | default(omit) }}"
        state: present
      loop: "{{ flasharray_qos_policies }}"
      when: flasharray_qos_policies is defined

    - name: Apply QoS limits to volumes
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.volume }}"
        bandwidth_limit: "{{ item.bandwidth_limit | default(omit) }}"
        iops_limit: "{{ item.iops_limit | default(omit) }}"
        state: present
      loop: "{{ flasharray_volume_qos_limits }}"
      when: flasharray_volume_qos_limits is defined

    - name: Apply QoS to host groups
      purefa_hg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.hostgroup }}"
        bandwidth_limit: "{{ item.bandwidth_limit | default(omit) }}"
        iops_limit: "{{ item.iops_limit | default(omit) }}"
        state: present
      loop: "{{ flasharray_hostgroup_qos }}"
      when: flasharray_hostgroup_qos is defined

    - name: Configure workload optimization profiles
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - config
      register: array_config

    - name: Gather performance metrics
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - performance
      register: performance_metrics

    - name: Monitor IOPS performance
      ansible.builtin.debug:
        msg: "Current IOPS: {{ performance_metrics.purefa_info.performance[0].reads_per_sec | default(0) + performance_metrics.purefa_info.performance[0].writes_per_sec | default(0) }}"
      when: performance_metrics.purefa_info.performance is defined

    - name: Monitor latency
      ansible.builtin.debug:
        msg: "Current latency: {{ performance_metrics.purefa_info.performance[0].usec_per_read_op | default(0) }} µs read, {{ performance_metrics.purefa_info.performance[0].usec_per_write_op | default(0) }} µs write"
      when: performance_metrics.purefa_info.performance is defined

    - name: Monitor throughput
      ansible.builtin.debug:
        msg: "Current throughput: {{ (performance_metrics.purefa_info.performance[0].input_per_sec | default(0) + performance_metrics.purefa_info.performance[0].output_per_sec | default(0)) / 1024 / 1024 }} MB/s"
      when: performance_metrics.purefa_info.performance is defined

    - name: Check data reduction ratios
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - volumes
      register: volume_info

    - name: Display data reduction metrics
      ansible.builtin.debug:
        msg:
          - "Data Reduction Ratio: {{ volume_info.purefa_info.default.data_reduction | default('N/A') }}"
          - "Total Reduction: {{ volume_info.purefa_info.default.total_reduction | default('N/A') }}"
      when: volume_info.purefa_info.default is defined

    - name: Configure performance alerts - IOPS
      purefa_alert:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        address: "{{ item.address }}"
        enabled: true
        state: present
      loop: "{{ flasharray_performance_alert_recipients }}"
      when: flasharray_performance_alert_recipients is defined

    - name: Configure performance alerts - Latency
      purefa_alert:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        address: "{{ item.address }}"
        enabled: true
        state: present
      loop: "{{ flasharray_latency_alert_recipients }}"
      when: flasharray_latency_alert_recipients is defined

    - name: Set performance monitoring thresholds
      ansible.builtin.set_fact:
        flasharray_performance_thresholds:
          latency_warning_us: 1000  # 1ms
          latency_critical_us: 5000  # 5ms
          iops_warning: 80000  # 80% of typical max
          iops_critical: 95000  # 95% of typical max
          bandwidth_warning_mbps: 8000  # 8 GB/s
          bandwidth_critical_mbps: 9000  # 9 GB/s

    - name: Verify NVMe performance configuration
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - network
      register: nvme_config

    - name: Check capacity and performance forecasting
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - capacity
      register: capacity_info

    - name: Calculate capacity growth rate
      ansible.builtin.debug:
        msg: "Array capacity: {{ capacity_info.purefa_info.default.capacity | default(0) / 1024 / 1024 / 1024 / 1024 }} TB used"
      when: capacity_info.purefa_info.default is defined

    - name: Configure cache optimization
      ansible.builtin.debug:
        msg: "Pure FlashArray uses intelligent caching - no manual tuning required"

    - name: Verify deduplication and compression
      ansible.builtin.debug:
        msg:
          - "Inline Deduplication: Enabled (automatic)"
          - "Inline Compression: Enabled (automatic)"
          - "Pattern Removal: Enabled (automatic)"
          - "Expected Data Reduction: 5:1 (Fourth Estate workloads)"

    - name: Monitor volume performance individually
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - volumes
      register: volume_performance

    - name: Identify high-performance volumes
      ansible.builtin.set_fact:
        high_perf_volumes: "{{ flasharray_high_performance_volumes | default([]) }}"

    - name: Performance management summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Performance Management Complete"
          - "QoS Policies: {{ flasharray_qos_policies | default([]) | length }}"
          - "Volume QoS Limits: {{ flasharray_volume_qos_limits | default([]) | length }}"
          - "Host Group QoS: {{ flasharray_hostgroup_qos | default([]) | length }}"
          - "Performance Monitoring: Enabled"
          - "Latency Target: Sub-millisecond (< 1ms typical)"
          - "IOPS Capability: 100,000+ IOPS per array"
          - "Throughput: 10+ GB/s per array"
          - "Data Reduction: Inline (no performance impact)"
          - "Deduplication Ratio: {{ volume_info.purefa_info.default.data_reduction | default('5:1') }}"
          - "NVMe Support: Enabled"
          - "Performance Alerts: {{ flasharray_performance_alert_recipients | default([]) | length }} recipients"
          - "Capacity Forecasting: Enabled"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_performance | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_performance_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_performance_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_performance: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_performance_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_performance_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_performance: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_performance | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_performance_postflight_passed: true
        fe_pure_storage_pure_flasharray_performance_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_performance | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_performance_status: "failed"
        fe_pure_storage_pure_flasharray_performance_postflight_passed: false
        fe_pure_storage_pure_flasharray_performance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_performance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_performance | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_performance: FAILED at '{{ fe_pure_storage_pure_flasharray_performance_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_performance_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_performance | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_performance failed at '{{ fe_pure_storage_pure_flasharray_performance_failed_task }}': {{ fe_pure_storage_pure_flasharray_performance_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_performance | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_performance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_performance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_performance_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_performance | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_performance":
              component: "pure_storage/pure_flasharray_performance"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_performance_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_performance_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_performance_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_performance_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_performance_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_performance_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_performance_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_performance_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_performance_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_performance_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_performance_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_performance_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_performance'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_performance | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_performance_stats_published: true
      tags:
        - always
