---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_fa_ops_governance']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_fa_ops_governance_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_fa_ops_governance | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_fa_ops_governance_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_fa_ops_governance_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_fa_ops_governance_status: "running"
    fe_pure_storage_pure_fa_ops_governance_preflight_passed: false
    fe_pure_storage_pure_fa_ops_governance_postflight_passed: false
    fe_pure_storage_pure_fa_ops_governance_failed_task: ""
    fe_pure_storage_pure_fa_ops_governance_error: ""
    fe_pure_storage_pure_fa_ops_governance_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_fa_ops_governance | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_fa_ops_governance | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_fa_ops_governance: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_fa_ops_governance: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_fa_ops_governance | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_fa_ops_governance: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_fa_ops_governance: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_fa_ops_governance_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_fa_ops_governance | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_fa_ops_governance_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Include fa_alerts__email_syslog.yml
      ansible.builtin.import_tasks: fa_alerts__email_syslog.yml
    - name: Include fa_phonehome__toggle.yml
      ansible.builtin.import_tasks: fa_phonehome__toggle.yml
    - name: Include fa_support__bundle_collect.yml
      ansible.builtin.import_tasks: fa_support__bundle_collect.yml
    - name: Include fa_perf__metrics_export.yml
      ansible.builtin.import_tasks: fa_perf__metrics_export.yml
    - name: Include fa_space__report.yml
      ansible.builtin.import_tasks: fa_space__report.yml
    - name: Include fa_rbac__users_roles.yml
      ansible.builtin.import_tasks: fa_rbac__users_roles.yml
    - name: Include fa_banner_login__set.yml
      ansible.builtin.import_tasks: fa_banner_login__set.yml
    - name: Include fa_immutable__retention.yml
      ansible.builtin.import_tasks: fa_immutable__retention.yml
    - name: Include fa_upgrade__purity_non_disruptive.yml
      ansible.builtin.import_tasks: fa_upgrade__purity_non_disruptive.yml
    - name: Include fa_backup__config_export.yml
      ansible.builtin.import_tasks: fa_backup__config_export.yml

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_fa_ops_governance | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_fa_ops_governance_preflight_passed | bool
          - fe_pure_storage_pure_fa_ops_governance_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_fa_ops_governance: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_fa_ops_governance_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_fa_ops_governance_status | default('unknown') }}.
        success_msg: "pure_storage/pure_fa_ops_governance: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_fa_ops_governance | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_fa_ops_governance_postflight_passed: true
        fe_pure_storage_pure_fa_ops_governance_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_fa_ops_governance | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_fa_ops_governance_status: "failed"
        fe_pure_storage_pure_fa_ops_governance_postflight_passed: false
        fe_pure_storage_pure_fa_ops_governance_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_fa_ops_governance_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_fa_ops_governance | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_fa_ops_governance: FAILED at '{{ fe_pure_storage_pure_fa_ops_governance_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_fa_ops_governance_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_fa_ops_governance | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_fa_ops_governance failed at '{{ fe_pure_storage_pure_fa_ops_governance_failed_task }}': {{ fe_pure_storage_pure_fa_ops_governance_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_fa_ops_governance | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_fa_ops_governance_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_fa_ops_governance_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_fa_ops_governance_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_fa_ops_governance | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_fa_ops_governance":
              component: "pure_storage/pure_fa_ops_governance"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_fa_ops_governance_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_fa_ops_governance_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_fa_ops_governance_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_fa_ops_governance_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_fa_ops_governance_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_fa_ops_governance_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_fa_ops_governance_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_fa_ops_governance_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_fa_ops_governance_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_fa_ops_governance_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_fa_ops_governance_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_fa_ops_governance_status | default('') == 'succeeded' else ['pure_storage/pure_fa_ops_governance'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_fa_ops_governance | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_fa_ops_governance_stats_published: true
      tags:
        - always
