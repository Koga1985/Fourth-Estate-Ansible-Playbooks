---
# Pure Storage FlashArray Protection Management
# Handles protection groups, snapshots, SafeMode, and data protection policies

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_protection']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_protection_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_protection | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_protection_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_protection_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_protection_status: "running"
    fe_pure_storage_pure_flasharray_protection_preflight_passed: false
    fe_pure_storage_pure_flasharray_protection_postflight_passed: false
    fe_pure_storage_pure_flasharray_protection_failed_task: ""
    fe_pure_storage_pure_flasharray_protection_error: ""
    fe_pure_storage_pure_flasharray_protection_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_protection | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_protection | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_protection: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_protection: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_protection | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_protection: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_protection: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_protection_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_protection | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_protection_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create protection groups
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: present
      loop: "{{ flasharray_protection_groups }}"
      when: flasharray_protection_groups is defined

    - name: Add volumes to protection groups
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        volume: "{{ item.volume }}"
        state: present
      loop: "{{ flasharray_pg_volumes }}"
      when: flasharray_pg_volumes is defined

    - name: Add hosts to protection groups
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        host: "{{ item.host }}"
        state: present
      loop: "{{ flasharray_pg_hosts }}"
      when: flasharray_pg_hosts is defined

    - name: Add host groups to protection groups
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        hostgroup: "{{ item.hostgroup }}"
        state: present
      loop: "{{ flasharray_pg_hostgroups }}"
      when: flasharray_pg_hostgroups is defined

    - name: Configure snapshot schedules (15-minute)
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        enabled: true
        snap_frequency: 900  # 15 minutes
        snap_at: "{{ item.snap_at | default(omit) }}"
        days: "{{ item.days | default(7) }}"
        state: present
      loop: "{{ flasharray_pg_15min_schedule }}"
      when: flasharray_pg_15min_schedule is defined

    - name: Configure snapshot schedules (hourly)
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        enabled: true
        snap_frequency: 3600  # 1 hour
        snap_at: "{{ item.snap_at | default(omit) }}"
        days: "{{ item.days | default(30) }}"
        state: present
      loop: "{{ flasharray_pg_hourly_schedule }}"
      when: flasharray_pg_hourly_schedule is defined

    - name: Configure snapshot schedules (daily)
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        enabled: true
        snap_frequency: 86400  # 24 hours
        snap_at: "{{ item.snap_at | default('02:00') }}"
        days: "{{ item.days | default(365) }}"
        state: present
      loop: "{{ flasharray_pg_daily_schedule }}"
      when: flasharray_pg_daily_schedule is defined

    - name: Enable SafeMode snapshots (immutable, ransomware protection)
      purefa_pg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        eradication_config: "{{ item.eradication_config | default('24hours') }}"
        state: present
      loop: "{{ flasharray_safemode_protection_groups }}"
      when: flasharray_safemode_protection_groups is defined

    - name: Configure retention policies
      purefa_policy:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        enabled: true
        retention: "{{ item.retention }}"
        state: present
      loop: "{{ flasharray_retention_policies }}"
      when: flasharray_retention_policies is defined

    - name: Create manual snapshots
      purefa_snap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.source }}"
        suffix: "{{ item.suffix }}"
        state: present
      loop: "{{ flasharray_manual_snapshots }}"
      when: flasharray_manual_snapshots is defined
      register: manual_snapshots

    - name: Create protection group snapshots
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.pg_name }}"
        suffix: "{{ item.suffix }}"
        now: true
        state: present
      loop: "{{ flasharray_pg_manual_snapshots }}"
      when: flasharray_pg_manual_snapshots is defined

    - name: Restore volume from snapshot
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.volume }}"
        source: "{{ item.snapshot }}"
        overwrite: true
        state: present
      loop: "{{ flasharray_volume_restores }}"
      when: flasharray_volume_restores is defined

    - name: Configure consistency groups
      purefa_vg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ flasharray_consistency_groups }}"
      when: flasharray_consistency_groups is defined

    - name: Add volumes to consistency groups
      purefa_vg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.cg_name }}"
        volume: "{{ item.volume }}"
        state: present
      loop: "{{ flasharray_cg_volumes }}"
      when: flasharray_cg_volumes is defined

    - name: Create consistency group snapshots
      purefa_snap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.cg_name }}"
        suffix: "{{ item.suffix }}"
        state: present
      loop: "{{ flasharray_cg_snapshots }}"
      when: flasharray_cg_snapshots is defined

    - name: Configure eradication timer
      purefa_eradication:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        timer: "{{ flasharray_eradication_timer }}"
        state: present
      when: flasharray_eradication_timer is defined

    - name: Delete old snapshots
      purefa_snap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ flasharray_snapshots_to_delete }}"
      when: flasharray_snapshots_to_delete is defined

    - name: Create Fourth Estate evidence preservation snapshots
      purefa_pgsnap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ flasharray_evidence_pg }}"
        suffix: "evidence-{{ ansible_date_time.date }}"
        now: true
        state: present
      when: flasharray_evidence_pg is defined
      tags:
        - evidence
        - compliance

    - name: Verify snapshot catalog
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - snapshots
      register: snapshot_catalog

    - name: Protection management summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Protection Management Complete"
          - "Protection Groups: {{ flasharray_protection_groups | default([]) | length }}"
          - "Snapshot Schedules Configured: Yes"
          - "  - 15-minute snapshots: {{ flasharray_pg_15min_schedule | default([]) | length }} PGs"
          - "  - Hourly snapshots: {{ flasharray_pg_hourly_schedule | default([]) | length }} PGs"
          - "  - Daily snapshots: {{ flasharray_pg_daily_schedule | default([]) | length }} PGs"
          - "SafeMode Protection Groups: {{ flasharray_safemode_protection_groups | default([]) | length }}"
          - "Manual Snapshots Created: {{ flasharray_manual_snapshots | default([]) | length }}"
          - "Consistency Groups: {{ flasharray_consistency_groups | default([]) | length }}"
          - "Eradication Timer: {{ flasharray_eradication_timer | default('24 hours') }}"
          - "Snapshot Retention: Short-term (7d), Medium-term (30d), Long-term (365d+)"
          - "Ransomware Protection: SafeMode enabled (immutable snapshots)"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_protection | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_protection_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_protection_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_protection: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_protection_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_protection_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_protection: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_protection | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_protection_postflight_passed: true
        fe_pure_storage_pure_flasharray_protection_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_protection | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_protection_status: "failed"
        fe_pure_storage_pure_flasharray_protection_postflight_passed: false
        fe_pure_storage_pure_flasharray_protection_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_protection_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_protection | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_protection: FAILED at '{{ fe_pure_storage_pure_flasharray_protection_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_protection_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_protection | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_protection failed at '{{ fe_pure_storage_pure_flasharray_protection_failed_task }}': {{ fe_pure_storage_pure_flasharray_protection_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_protection | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_protection_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_protection_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_protection_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_protection | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_protection":
              component: "pure_storage/pure_flasharray_protection"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_protection_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_protection_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_protection_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_protection_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_protection_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_protection_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_protection_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_protection_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_protection_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_protection_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_protection_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_protection_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_protection'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_protection | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_protection_stats_published: true
      tags:
        - always
