---
# Pure Storage FlashArray Host Management
# Handles host objects, initiators, host groups, and volume mappings

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_hosts']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_hosts_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_hosts | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_hosts_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_hosts_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_hosts_status: "running"
    fe_pure_storage_pure_flasharray_hosts_preflight_passed: false
    fe_pure_storage_pure_flasharray_hosts_postflight_passed: false
    fe_pure_storage_pure_flasharray_hosts_failed_task: ""
    fe_pure_storage_pure_flasharray_hosts_error: ""
    fe_pure_storage_pure_flasharray_hosts_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_hosts | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_hosts | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_hosts: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_hosts: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_hosts | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_hosts: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_hosts: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_hosts_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_hosts | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_hosts_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create host objects
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        personality: "{{ item.personality | default('linux') }}"
        iqn: "{{ item.iqn | default(omit) }}"
        wwns: "{{ item.wwns | default(omit) }}"
        nqn: "{{ item.nqn | default(omit) }}"
        state: present
      loop: "{{ flasharray_hosts }}"
      when: flasharray_hosts is defined

    - name: Create host groups
      purefa_hg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ flasharray_host_groups }}"
      when: flasharray_host_groups is defined

    - name: Add hosts to host groups
      purefa_hg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.hg_name }}"
        host: "{{ item.host_name }}"
        state: present
      loop: "{{ flasharray_hg_members }}"
      when: flasharray_hg_members is defined

    - name: Configure iSCSI hosts with IQN
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        iqn: "{{ item.iqn }}"
        personality: "{{ item.personality | default('linux') }}"
        state: present
      loop: "{{ flasharray_iscsi_hosts }}"
      when: flasharray_iscsi_hosts is defined

    - name: Configure Fibre Channel hosts with WWNs
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        wwns: "{{ item.wwns }}"
        personality: "{{ item.personality | default('linux') }}"
        state: present
      loop: "{{ flasharray_fc_hosts }}"
      when: flasharray_fc_hosts is defined

    - name: Configure NVMe-oF hosts with NQN
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        nqn: "{{ item.nqn }}"
        personality: "{{ item.personality | default('linux') }}"
        state: present
      loop: "{{ flasharray_nvme_hosts }}"
      when: flasharray_nvme_hosts is defined

    - name: Configure ESXi hosts
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        wwns: "{{ item.wwns | default(omit) }}"
        iqn: "{{ item.iqn | default(omit) }}"
        personality: "esxi"
        state: present
      loop: "{{ flasharray_esxi_hosts }}"
      when: flasharray_esxi_hosts is defined

    - name: Configure Windows hosts
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        wwns: "{{ item.wwns | default(omit) }}"
        iqn: "{{ item.iqn | default(omit) }}"
        personality: "windows"
        state: present
      loop: "{{ flasharray_windows_hosts }}"
      when: flasharray_windows_hosts is defined

    - name: Enable CHAP authentication for iSCSI hosts
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        iqn: "{{ item.iqn }}"
        target_user: "{{ item.chap_user }}"
        target_password: "{{ item.chap_password }}"
        state: present
      loop: "{{ flasharray_iscsi_chap_hosts }}"
      when: flasharray_iscsi_chap_hosts is defined
      no_log: true

    - name: Map volumes to hosts
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        host: "{{ item.host }}"
        volume: "{{ item.volume }}"
        lun: "{{ item.lun | default(omit) }}"
        state: present
      loop: "{{ flasharray_host_volumes }}"
      when: flasharray_host_volumes is defined

    - name: Map volumes to host groups
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        hostgroup: "{{ item.hostgroup }}"
        volume: "{{ item.volume }}"
        lun: "{{ item.lun | default(omit) }}"
        state: present
      loop: "{{ flasharray_hostgroup_volumes }}"
      when: flasharray_hostgroup_volumes is defined

    - name: Set preferred arrays for hosts
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        preferred_array: "{{ item.preferred_array }}"
        state: present
      loop: "{{ flasharray_host_preferred_arrays }}"
      when: flasharray_host_preferred_arrays is defined

    - name: Remove host volume connections
      purefa_connect:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        host: "{{ item.host }}"
        volume: "{{ item.volume }}"
        state: absent
      loop: "{{ flasharray_disconnect_volumes }}"
      when: flasharray_disconnect_volumes is defined

    - name: Delete host objects
      purefa_host:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ flasharray_hosts_to_delete }}"
      when: flasharray_hosts_to_delete is defined

    - name: Create VMware cluster host group
      purefa_hg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ flasharray_vmware_cluster_name }}"
        state: present
      when: flasharray_vmware_cluster_name is defined

    - name: Create Kubernetes cluster host group
      purefa_hg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ flasharray_k8s_cluster_name }}"
        state: present
      when: flasharray_k8s_cluster_name is defined

    - name: Verify multipath configuration
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - hosts
      register: host_info

    - name: Host management summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Host Management Complete"
          - "Hosts Created: {{ flasharray_hosts | default([]) | length }}"
          - "Host Groups Created: {{ flasharray_host_groups | default([]) | length }}"
          - "iSCSI Hosts: {{ flasharray_iscsi_hosts | default([]) | length }}"
          - "Fibre Channel Hosts: {{ flasharray_fc_hosts | default([]) | length }}"
          - "NVMe-oF Hosts: {{ flasharray_nvme_hosts | default([]) | length }}"
          - "ESXi Hosts: {{ flasharray_esxi_hosts | default([]) | length }}"
          - "Volume Mappings: {{ flasharray_host_volumes | default([]) | length }}"
          - "CHAP Authentication: {{ flasharray_iscsi_chap_hosts | default([]) | length }} hosts"
          - "Multipath: Enabled (verify on hosts)"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_hosts | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_hosts_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_hosts_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_hosts: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_hosts_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_hosts_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_hosts: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_hosts | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_hosts_postflight_passed: true
        fe_pure_storage_pure_flasharray_hosts_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_hosts | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_hosts_status: "failed"
        fe_pure_storage_pure_flasharray_hosts_postflight_passed: false
        fe_pure_storage_pure_flasharray_hosts_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_hosts_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_hosts | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_hosts: FAILED at '{{ fe_pure_storage_pure_flasharray_hosts_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_hosts_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_hosts | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_hosts failed at '{{ fe_pure_storage_pure_flasharray_hosts_failed_task }}': {{ fe_pure_storage_pure_flasharray_hosts_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_hosts | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_hosts_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_hosts_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_hosts_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_hosts | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_hosts":
              component: "pure_storage/pure_flasharray_hosts"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_hosts_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_hosts_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_hosts_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_hosts_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_hosts_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_hosts_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_hosts_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_hosts_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_hosts_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_hosts_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_hosts_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_hosts_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_hosts'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_hosts | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_hosts_stats_published: true
      tags:
        - always
