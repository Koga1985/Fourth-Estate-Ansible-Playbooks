---
# Pure Storage FlashArray Volume Management
# Handles volume creation, snapshots, cloning, QoS, and lifecycle management

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/pure_flasharray_volumes']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_pure_flasharray_volumes_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/pure_flasharray_volumes | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_pure_flasharray_volumes_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_pure_flasharray_volumes_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_pure_flasharray_volumes_status: "running"
    fe_pure_storage_pure_flasharray_volumes_preflight_passed: false
    fe_pure_storage_pure_flasharray_volumes_postflight_passed: false
    fe_pure_storage_pure_flasharray_volumes_failed_task: ""
    fe_pure_storage_pure_flasharray_volumes_error: ""
    fe_pure_storage_pure_flasharray_volumes_stats_published: false
  tags:
    - always

- name: "pure_storage/pure_flasharray_volumes | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/pure_flasharray_volumes | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/pure_flasharray_volumes: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/pure_flasharray_volumes: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_volumes | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/pure_flasharray_volumes: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/pure_flasharray_volumes: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_pure_flasharray_volumes_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/pure_flasharray_volumes | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_volumes_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create volumes
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        size: "{{ item.size }}"
        eradicate: "{{ item.eradicate | default(false) }}"
        state: present
      loop: "{{ flasharray_volumes }}"
      when: flasharray_volumes is defined
      register: volume_creation

    - name: Create volumes with QoS limits
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        size: "{{ item.size }}"
        qos: "{{ item.qos | default(omit) }}"
        bandwidth_limit: "{{ item.bandwidth_limit | default(omit) }}"
        iops_limit: "{{ item.iops_limit | default(omit) }}"
        state: present
      loop: "{{ flasharray_volumes_with_qos }}"
      when: flasharray_volumes_with_qos is defined

    - name: Create volume groups
      purefa_vg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ flasharray_volume_groups }}"
      when: flasharray_volume_groups is defined

    - name: Add volumes to volume groups
      purefa_vg:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.vg_name }}"
        volume: "{{ item.volume_name }}"
        state: present
      loop: "{{ flasharray_vg_volumes }}"
      when: flasharray_vg_volumes is defined

    - name: Create volume snapshots
      purefa_snap:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.volume }}"
        suffix: "{{ item.suffix | default(ansible_date_time.iso8601_basic_short) }}"
        state: present
      loop: "{{ flasharray_volume_snapshots }}"
      when: flasharray_volume_snapshots is defined
      register: snapshot_creation

    - name: Clone volumes from snapshots
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        source: "{{ item.source }}"
        overwrite: "{{ item.overwrite | default(false) }}"
        state: present
      loop: "{{ flasharray_volume_clones }}"
      when: flasharray_volume_clones is defined

    - name: Set volume QoS policies
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        qos: "{{ item.qos_policy }}"
        state: present
      loop: "{{ flasharray_volume_qos }}"
      when: flasharray_volume_qos is defined

    - name: Apply volume tags
      purefa_volume_tags:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.volume }}"
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ flasharray_volume_tags }}"
      when: flasharray_volume_tags is defined

    - name: Resize volumes
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        size: "{{ item.new_size }}"
        state: present
      loop: "{{ flasharray_volume_resize }}"
      when: flasharray_volume_resize is defined

    - name: Create instant copies (zero-copy clones)
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.clone_name }}"
        source: "{{ item.source_volume }}"
        state: present
      loop: "{{ flasharray_instant_copies }}"
      when: flasharray_instant_copies is defined

    - name: Promote volumes from snapshots
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.volume }}"
        source: "{{ item.snapshot }}"
        overwrite: true
        state: present
      loop: "{{ flasharray_volume_promotions }}"
      when: flasharray_volume_promotions is defined

    - name: Delete volumes (with eradication timer)
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ flasharray_volumes_to_delete }}"
      when: flasharray_volumes_to_delete is defined

    - name: Eradicate volumes immediately
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        eradicate: true
        state: absent
      loop: "{{ flasharray_volumes_to_eradicate }}"
      when: flasharray_volumes_to_eradicate is defined

    - name: Recover deleted volumes
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item }}"
        state: present
      loop: "{{ flasharray_volumes_to_recover }}"
      when: flasharray_volumes_to_recover is defined

    - name: Create production volumes for Fourth Estate
      purefa_volume:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        name: "{{ item.name }}"
        size: "{{ item.size }}"
        state: present
      loop: "{{ flasharray_production_volumes }}"
      when: flasharray_production_volumes is defined
      tags:
        - production
        - volumes

    - name: Apply volume encryption validation
      purefa_info:
        fa_url: "{{ flasharray_url }}"
        api_token: "{{ flasharray_api_token }}"
        gather_subset:
          - volumes
      register: volume_info

    - name: Volume management summary
      ansible.builtin.debug:
        msg:
          - "FlashArray Volume Management Complete"
          - "Volumes Created: {{ (flasharray_volumes | default([]) | length) + (flasharray_production_volumes | default([]) | length) }}"
          - "Volume Groups: {{ flasharray_volume_groups | default([]) | length }}"
          - "Snapshots Created: {{ flasharray_volume_snapshots | default([]) | length }}"
          - "Clones Created: {{ flasharray_volume_clones | default([]) | length }}"
          - "QoS Policies Applied: {{ flasharray_volume_qos | default([]) | length }}"
          - "Encryption: Enabled (AES-256, all volumes encrypted at rest)"
          - "Thin Provisioning: Enabled"
          - "Inline Deduplication: Enabled"
          - "Inline Compression: Enabled"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/pure_flasharray_volumes | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_pure_flasharray_volumes_preflight_passed | bool
          - fe_pure_storage_pure_flasharray_volumes_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/pure_flasharray_volumes: postflight validation failed - preflight passed
          ={{ fe_pure_storage_pure_flasharray_volumes_preflight_passed | default(false) }},
          status={{ fe_pure_storage_pure_flasharray_volumes_status | default('unknown') }}.
        success_msg: "pure_storage/pure_flasharray_volumes: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/pure_flasharray_volumes | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_volumes_postflight_passed: true
        fe_pure_storage_pure_flasharray_volumes_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/pure_flasharray_volumes | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_volumes_status: "failed"
        fe_pure_storage_pure_flasharray_volumes_postflight_passed: false
        fe_pure_storage_pure_flasharray_volumes_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_pure_flasharray_volumes_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_volumes | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/pure_flasharray_volumes: FAILED at '{{ fe_pure_storage_pure_flasharray_volumes_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_pure_flasharray_volumes_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/pure_flasharray_volumes | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/pure_flasharray_volumes failed at '{{ fe_pure_storage_pure_flasharray_volumes_failed_task }}': {{ fe_pure_storage_pure_flasharray_volumes_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/pure_flasharray_volumes | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_volumes_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_pure_flasharray_volumes_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_pure_flasharray_volumes_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/pure_flasharray_volumes | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/pure_flasharray_volumes":
              component: "pure_storage/pure_flasharray_volumes"
              type: "role"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_pure_flasharray_volumes_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_pure_flasharray_volumes_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_pure_flasharray_volumes_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_pure_flasharray_volumes_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_pure_flasharray_volumes_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_pure_flasharray_volumes_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_pure_flasharray_volumes_failed_task | default('') }}"
              error: "{{ fe_pure_storage_pure_flasharray_volumes_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_pure_flasharray_volumes_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_pure_flasharray_volumes_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_pure_flasharray_volumes_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_pure_flasharray_volumes_status | default('') == 'succeeded' else ['pure_storage/pure_flasharray_volumes'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/pure_flasharray_volumes | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_pure_flasharray_volumes_stats_published: true
      tags:
        - always
