---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/fb_array__facts_export']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_fb_array__facts_export_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/fb_array__facts_export | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_fb_array__facts_export_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_fb_array__facts_export_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_fb_array__facts_export_status: "running"
    fe_pure_storage_fb_array__facts_export_preflight_passed: false
    fe_pure_storage_fb_array__facts_export_postflight_passed: false
    fe_pure_storage_fb_array__facts_export_failed_task: ""
    fe_pure_storage_fb_array__facts_export_error: ""
    fe_pure_storage_fb_array__facts_export_stats_published: false
  tags:
    - always

- name: "pure_storage/fb_array__facts_export | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/fb_array__facts_export | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/fb_array__facts_export: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/fb_array__facts_export: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fb_array__facts_export | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/fb_array__facts_export: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/fb_array__facts_export: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_fb_array__facts_export_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fb_array__facts_export | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_array__facts_export_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default('/tmp/pure-artifacts') }}"
        state: directory
        mode: "0755"

    - name: Collect FlashBlade facts
      purestorage.flashblade.purefb_info:
        fb_url: "{{ fb_url }}"
        api_token: "{{ fb_token }}"
        gather_subset:
          - array
          - blades
          - networks
          - buckets
          - filesystems
          - smb
          - nfs
      register: fb_facts

    - name: Write JSON facts
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pure-artifacts') }}/fb_facts.json"
        mode: "0644"
        content: "{{ fb_facts | to_nice_json }}"

    - name: Write quick CSV summary
      ansible.builtin.copy:
        dest: "{{ artifacts_dir | default('/tmp/pure-artifacts') }}/fb_facts_summary.csv"
        mode: "0644"
        content: |
          model,purity_fb,capacity_total,capacity_used,blades,mgmt_ip
          {{ fb_facts.array_info.model | default('') }},
          {{ fb_facts.array_info.version | default('') }},
          {{ fb_facts.space_info.total_space | default('') | default('') }},
          {{ fb_facts.space_info.total_used | default('') | default('') }},
          {{ (fb_facts.blades_info | default([])) | length }},
          {{ fb_facts.networks_info.management_ip | default('') | default('') }}

    # ----------------------------- postflight -------------------

    - name: "pure_storage/fb_array__facts_export | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_fb_array__facts_export_preflight_passed | bool
          - fe_pure_storage_fb_array__facts_export_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/fb_array__facts_export: postflight validation failed - preflight passed
          ={{ fe_pure_storage_fb_array__facts_export_preflight_passed | default(false) }},
          status={{ fe_pure_storage_fb_array__facts_export_status | default('unknown') }}.
        success_msg: "pure_storage/fb_array__facts_export: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/fb_array__facts_export | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_array__facts_export_postflight_passed: true
        fe_pure_storage_fb_array__facts_export_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/fb_array__facts_export | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_array__facts_export_status: "failed"
        fe_pure_storage_fb_array__facts_export_postflight_passed: false
        fe_pure_storage_fb_array__facts_export_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_fb_array__facts_export_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/fb_array__facts_export | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/fb_array__facts_export: FAILED at '{{ fe_pure_storage_fb_array__facts_export_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_fb_array__facts_export_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/fb_array__facts_export | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/fb_array__facts_export failed at '{{ fe_pure_storage_fb_array__facts_export_failed_task }}': {{ fe_pure_storage_fb_array__facts_export_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/fb_array__facts_export | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_array__facts_export_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_fb_array__facts_export_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_fb_array__facts_export_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/fb_array__facts_export | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/fb_array__facts_export":
              component: "pure_storage/fb_array__facts_export"
              type: "tasks"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_fb_array__facts_export_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_fb_array__facts_export_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_fb_array__facts_export_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_fb_array__facts_export_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_fb_array__facts_export_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_fb_array__facts_export_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_fb_array__facts_export_failed_task | default('') }}"
              error: "{{ fe_pure_storage_fb_array__facts_export_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_fb_array__facts_export_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_fb_array__facts_export_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_fb_array__facts_export_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_fb_array__facts_export_status | default('') == 'succeeded' else ['pure_storage/fb_array__facts_export'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/fb_array__facts_export | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_array__facts_export_stats_published: true
      tags:
        - always
