---
# Purpose: Provision a FlashArray volume, map it to ESXi (host or hostgroup), rescan HBAs,
# and create a VMFS datastore. vVol path includes VASA registration placeholder.
#
# Example vars:
# datastore:
#   name: ds_app01
#   type: vmfs                # vmfs | vvol
#   size: 1T
#   hostgroup: "esx-prod-a"   # or host: "esx-01"
#   vmfs_version: 6
#   lun: 210
#
# vvol (optional):
#   vasa:
#     url: "https://array.example.com:8084"
#     username: "pureuser"
#     password: "{{ vault_pure_vasa_pass }}"
#   spbm_policy: "Pure-Default-vVol"
#

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/fa_vmware__datastore_create']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_fa_vmware__datastore_create_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/fa_vmware__datastore_create | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_fa_vmware__datastore_create_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_fa_vmware__datastore_create_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_fa_vmware__datastore_create_status: "running"
    fe_pure_storage_fa_vmware__datastore_create_preflight_passed: false
    fe_pure_storage_fa_vmware__datastore_create_postflight_passed: false
    fe_pure_storage_fa_vmware__datastore_create_failed_task: ""
    fe_pure_storage_fa_vmware__datastore_create_error: ""
    fe_pure_storage_fa_vmware__datastore_create_stats_published: false
  tags:
    - always

- name: "pure_storage/fa_vmware__datastore_create | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/fa_vmware__datastore_create | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/fa_vmware__datastore_create: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/fa_vmware__datastore_create: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fa_vmware__datastore_create | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/fa_vmware__datastore_create: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/fa_vmware__datastore_create: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_fa_vmware__datastore_create_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fa_vmware__datastore_create | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_vmware__datastore_create_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure FA volume exists (for VMFS path)
      when: datastore.type | lower == 'vmfs'
      purestorage.flasharray.purefa_volume:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        name: "{{ datastore.name }}"
        size: "{{ datastore.size }}"
        state: present

    - name: Map LUN to host/hostgroup
      when: datastore.type | lower == 'vmfs'
      purestorage.flasharray.purefa_connect:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        volume: "{{ datastore.name }}"
        host: "{{ datastore.host | default(omit) }}"
        hgroup: "{{ datastore.hostgroup | default(omit) }}"
        lun: "{{ datastore.lun | default(omit) }}"
        state: present

    - name: Rescan HBAs on all hosts in cluster
      no_log: true
      when: datastore.type | lower == 'vmfs'
      community.vmware.vmware_host_scanhba:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        cluster_name: "{{ vcenter_cluster }}"
        esxi_hostname: null

    - name: Create VMFS datastore on each host (implicitly attached to cluster)
      no_log: true
      when: datastore.type | lower == 'vmfs'
      community.vmware.vmware_host_datastore:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datastore_name: "{{ datastore.name }}"
        datastore_type: vmfs
        vmfs_version: "{{ datastore.vmfs_version | default(6) }}"
        state: present
        # If your module supports disk selection, specify canonical name(s):
        # disk_name: "naa.624a9370f1b5..."

    # --- vVol path (guarded / requires VASA registered) ---
    - name: (vVol) Register VASA provider (placeholder if module not present)
      no_log: true
      when: datastore.type | lower == 'vvol' and vvol.vasa is defined
      community.vmware.vmware_storage_profile_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
      register: _spbm
      # NOTE: If your environment needs provider registration, add a separate task using
      # the appropriate module (varies by collection version). Keep credentials in vault.

    - name: (vVol) Create vVol datastore (requires Pure VASA registered in vCenter)
      when: datastore.type | lower == 'vvol'
      ansible.builtin.debug:
        msg: "Create vVol datastore '{{ datastore.name }}' via vCenter once VASA is registered. Attach policy '{{ vvol.spbm_policy | default('default') }}'."

    # ----------------------------- postflight -------------------

    - name: "pure_storage/fa_vmware__datastore_create | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_fa_vmware__datastore_create_preflight_passed | bool
          - fe_pure_storage_fa_vmware__datastore_create_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/fa_vmware__datastore_create: postflight validation failed - preflight passed
          ={{ fe_pure_storage_fa_vmware__datastore_create_preflight_passed | default(false) }},
          status={{ fe_pure_storage_fa_vmware__datastore_create_status | default('unknown') }}.
        success_msg: "pure_storage/fa_vmware__datastore_create: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/fa_vmware__datastore_create | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_vmware__datastore_create_postflight_passed: true
        fe_pure_storage_fa_vmware__datastore_create_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/fa_vmware__datastore_create | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_vmware__datastore_create_status: "failed"
        fe_pure_storage_fa_vmware__datastore_create_postflight_passed: false
        fe_pure_storage_fa_vmware__datastore_create_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_fa_vmware__datastore_create_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/fa_vmware__datastore_create | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/fa_vmware__datastore_create: FAILED at '{{ fe_pure_storage_fa_vmware__datastore_create_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_fa_vmware__datastore_create_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/fa_vmware__datastore_create | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/fa_vmware__datastore_create failed at '{{ fe_pure_storage_fa_vmware__datastore_create_failed_task }}': {{ fe_pure_storage_fa_vmware__datastore_create_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/fa_vmware__datastore_create | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_vmware__datastore_create_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_fa_vmware__datastore_create_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_fa_vmware__datastore_create_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/fa_vmware__datastore_create | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/fa_vmware__datastore_create":
              component: "pure_storage/fa_vmware__datastore_create"
              type: "tasks"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_fa_vmware__datastore_create_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_fa_vmware__datastore_create_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_fa_vmware__datastore_create_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_fa_vmware__datastore_create_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_fa_vmware__datastore_create_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_fa_vmware__datastore_create_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_fa_vmware__datastore_create_failed_task | default('') }}"
              error: "{{ fe_pure_storage_fa_vmware__datastore_create_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_fa_vmware__datastore_create_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_fa_vmware__datastore_create_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_fa_vmware__datastore_create_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_fa_vmware__datastore_create_status | default('') == 'succeeded' else ['pure_storage/fa_vmware__datastore_create'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/fa_vmware__datastore_create | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_vmware__datastore_create_stats_published: true
      tags:
        - always
