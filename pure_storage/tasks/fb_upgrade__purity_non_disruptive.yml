---
# vars example:
# upgrade:
#   target_version: "x.y.z"
#   maintenance_window_ok: true
#   dry_run: true

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/fb_upgrade__purity_non_disruptive']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_fb_upgrade__purity_non_disruptive_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/fb_upgrade__purity_non_disruptive | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_fb_upgrade__purity_non_disruptive_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_fb_upgrade__purity_non_disruptive_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_fb_upgrade__purity_non_disruptive_status: "running"
    fe_pure_storage_fb_upgrade__purity_non_disruptive_preflight_passed: false
    fe_pure_storage_fb_upgrade__purity_non_disruptive_postflight_passed: false
    fe_pure_storage_fb_upgrade__purity_non_disruptive_failed_task: ""
    fe_pure_storage_fb_upgrade__purity_non_disruptive_error: ""
    fe_pure_storage_fb_upgrade__purity_non_disruptive_stats_published: false
  tags:
    - always

- name: "pure_storage/fb_upgrade__purity_non_disruptive | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/fb_upgrade__purity_non_disruptive: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/fb_upgrade__purity_non_disruptive: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/fb_upgrade__purity_non_disruptive: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/fb_upgrade__purity_non_disruptive: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_upgrade__purity_non_disruptive_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Gather array health (fallback via REST)
      ansible.builtin.uri:
        url: "{{ fb_url }}/api/1.12/array/health"
        method: GET
        headers: { api-token: "{{ fb_token }}" }
        return_content: true
        status_code: 200
        validate_certs: "{{ fb_validate_certs | default(false) }}"
      register: fb_health

    - name: Guardrail — abort if any component unhealthy
      ansible.builtin.fail:
        msg: "Array health not green; refusing to upgrade"
      when: fb_health.json.status | lower != 'healthy'

    - name: (Dry run) Show intended upgrade
      when: upgrade.dry_run | default(true)
      ansible.builtin.debug:
        msg: "Would upgrade Purity//FB to {{ upgrade.target_version }} (current health: {{ fb_health.json.status }})"

    - name: Trigger Purity//FB upgrade (fallback via REST)
      when: not (upgrade.dry_run | default(true)) and upgrade.maintenance_window_ok | default(false)
      ansible.builtin.uri:
        url: "{{ fb_url }}/api/1.12/array/upgrade"
        method: POST
        headers: { api-token: "{{ fb_token }}", Content-Type: "application/json" }
        body_format: json
        body: { target: "{{ upgrade.target_version }}" }
        status_code: [200,202]
        validate_certs: "{{ fb_validate_certs | default(false) }}"

    # ----------------------------- postflight -------------------

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_fb_upgrade__purity_non_disruptive_preflight_passed | bool
          - fe_pure_storage_fb_upgrade__purity_non_disruptive_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/fb_upgrade__purity_non_disruptive: postflight validation failed - preflight passed
          ={{ fe_pure_storage_fb_upgrade__purity_non_disruptive_preflight_passed | default(false) }},
          status={{ fe_pure_storage_fb_upgrade__purity_non_disruptive_status | default('unknown') }}.
        success_msg: "pure_storage/fb_upgrade__purity_non_disruptive: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_upgrade__purity_non_disruptive_postflight_passed: true
        fe_pure_storage_fb_upgrade__purity_non_disruptive_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_upgrade__purity_non_disruptive_status: "failed"
        fe_pure_storage_fb_upgrade__purity_non_disruptive_postflight_passed: false
        fe_pure_storage_fb_upgrade__purity_non_disruptive_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_fb_upgrade__purity_non_disruptive_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/fb_upgrade__purity_non_disruptive: FAILED at '{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_fb_upgrade__purity_non_disruptive_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/fb_upgrade__purity_non_disruptive failed at '{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_failed_task }}': {{ fe_pure_storage_fb_upgrade__purity_non_disruptive_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_upgrade__purity_non_disruptive_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_fb_upgrade__purity_non_disruptive_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_fb_upgrade__purity_non_disruptive_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/fb_upgrade__purity_non_disruptive":
              component: "pure_storage/fb_upgrade__purity_non_disruptive"
              type: "tasks"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_failed_task | default('') }}"
              error: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_fb_upgrade__purity_non_disruptive_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_fb_upgrade__purity_non_disruptive_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_fb_upgrade__purity_non_disruptive_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_fb_upgrade__purity_non_disruptive_status | default('') == 'succeeded' else ['pure_storage/fb_upgrade__purity_non_disruptive'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/fb_upgrade__purity_non_disruptive | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_fb_upgrade__purity_non_disruptive_stats_published: true
      tags:
        - always
