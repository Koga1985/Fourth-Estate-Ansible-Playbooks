---
# vars example:
# snap_policies:
#   - pgroup: pg-app01
#     schedule:
#       per_hour: 4
#       per_day: 24
#       per_week: 12
#     retention:
#       keep_for: "30d"

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['pure_storage/fa_snap_policy__enforce']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_pure_storage_fa_snap_policy__enforce_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "pure_storage/fa_snap_policy__enforce | Initialize validation state"
  ansible.builtin.set_fact:
    fe_pure_storage_fa_snap_policy__enforce_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_pure_storage_fa_snap_policy__enforce_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_pure_storage_fa_snap_policy__enforce_status: "running"
    fe_pure_storage_fa_snap_policy__enforce_preflight_passed: false
    fe_pure_storage_fa_snap_policy__enforce_postflight_passed: false
    fe_pure_storage_fa_snap_policy__enforce_failed_task: ""
    fe_pure_storage_fa_snap_policy__enforce_error: ""
    fe_pure_storage_fa_snap_policy__enforce_stats_published: false
  tags:
    - always

- name: "pure_storage/fa_snap_policy__enforce | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "pure_storage/fa_snap_policy__enforce | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          pure_storage/fa_snap_policy__enforce: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          pure_storage/fa_snap_policy__enforce: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fa_snap_policy__enforce | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "pure_storage/fa_snap_policy__enforce: required variable '{{ item }}' is not defined."
        success_msg: "pure_storage/fa_snap_policy__enforce: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_pure_storage_fa_snap_policy__enforce_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "pure_storage/fa_snap_policy__enforce | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_snap_policy__enforce_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Enforce snapshot schedules on protection groups
      purestorage.flasharray.purefa_pg:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        pgroup: "{{ item.pgroup }}"
        state: present
        # Scheduling knobs vary with collection version; common fields shown below.
        snap: true
        per_hour: "{{ item.schedule.per_hour | default(omit) }}"
        per_day: "{{ item.schedule.per_day | default(omit) }}"
        per_week: "{{ item.schedule.per_week | default(omit) }}"
        per_month: "{{ item.schedule.per_month | default(omit) }}"
        replicate_enabled: "{{ item.schedule.replicate | default(omit) }}"
      loop: "{{ snap_policies | default([]) }}"
      loop_control: { label: "{{ item.pgroup }}" }

    # ----------------------------- postflight -------------------

    - name: "pure_storage/fa_snap_policy__enforce | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_pure_storage_fa_snap_policy__enforce_preflight_passed | bool
          - fe_pure_storage_fa_snap_policy__enforce_status in ['running', 'succeeded']
        fail_msg: >-
          pure_storage/fa_snap_policy__enforce: postflight validation failed - preflight passed
          ={{ fe_pure_storage_fa_snap_policy__enforce_preflight_passed | default(false) }},
          status={{ fe_pure_storage_fa_snap_policy__enforce_status | default('unknown') }}.
        success_msg: "pure_storage/fa_snap_policy__enforce: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "pure_storage/fa_snap_policy__enforce | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_snap_policy__enforce_postflight_passed: true
        fe_pure_storage_fa_snap_policy__enforce_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "pure_storage/fa_snap_policy__enforce | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_snap_policy__enforce_status: "failed"
        fe_pure_storage_fa_snap_policy__enforce_postflight_passed: false
        fe_pure_storage_fa_snap_policy__enforce_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_pure_storage_fa_snap_policy__enforce_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "pure_storage/fa_snap_policy__enforce | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          pure_storage/fa_snap_policy__enforce: FAILED at '{{ fe_pure_storage_fa_snap_policy__enforce_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_pure_storage_fa_snap_policy__enforce_error }}
      tags:
        - always
        - rescue

    - name: "pure_storage/fa_snap_policy__enforce | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          pure_storage/fa_snap_policy__enforce failed at '{{ fe_pure_storage_fa_snap_policy__enforce_failed_task }}': {{ fe_pure_storage_fa_snap_policy__enforce_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "pure_storage/fa_snap_policy__enforce | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_snap_policy__enforce_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_pure_storage_fa_snap_policy__enforce_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_pure_storage_fa_snap_policy__enforce_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "pure_storage/fa_snap_policy__enforce | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "pure_storage/fa_snap_policy__enforce":
              component: "pure_storage/fa_snap_policy__enforce"
              type: "tasks"
              platform: "pure_storage"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_pure_storage_fa_snap_policy__enforce_status | default('unknown') }}"
              preflight_passed: "{{ fe_pure_storage_fa_snap_policy__enforce_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_pure_storage_fa_snap_policy__enforce_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_pure_storage_fa_snap_policy__enforce_started_at | default('') }}"
              ended_at: "{{ fe_pure_storage_fa_snap_policy__enforce_ended_at | default('') }}"
              duration_seconds: "{{ fe_pure_storage_fa_snap_policy__enforce_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_pure_storage_fa_snap_policy__enforce_failed_task | default('') }}"
              error: "{{ fe_pure_storage_fa_snap_policy__enforce_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_pure_storage_fa_snap_policy__enforce_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_pure_storage_fa_snap_policy__enforce_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_pure_storage_fa_snap_policy__enforce_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_pure_storage_fa_snap_policy__enforce_status | default('') == 'succeeded' else ['pure_storage/fa_snap_policy__enforce'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "pure_storage/fa_snap_policy__enforce | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_pure_storage_fa_snap_policy__enforce_stats_published: true
      tags:
        - always
