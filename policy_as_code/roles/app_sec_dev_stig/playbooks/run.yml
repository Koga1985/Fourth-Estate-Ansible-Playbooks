---
# Grab-and-go entry point for the Application Security & Development STIG gate.
# Runs on the CI runner / control node against an application source tree.
#
# Report-only (default):
#   ansible-playbook run.yml -e app_src_dir=/path/to/app/repo
# Enforce the gate (fail the build on violations):
#   ansible-playbook run.yml -e app_src_dir=/path/to/app/repo -e enforce_gate=true
# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Application Security & Development STIG gate
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: app_sec_dev_stig
  pre_tasks:
    - name: "policy_as_code/app_sec_dev_stig/run | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "policy_as_code/app_sec_dev_stig/run | Initialize validation state"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_policy_as_code_app_sec_dev_stig_run_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_app_sec_dev_stig_run_status: "running"
            fe_policy_as_code_app_sec_dev_stig_run_preflight_passed: false
            fe_policy_as_code_app_sec_dev_stig_run_postflight_passed: false
            fe_policy_as_code_app_sec_dev_stig_run_failed_task: ""
            fe_policy_as_code_app_sec_dev_stig_run_error: ""
            fe_policy_as_code_app_sec_dev_stig_run_stats_published: false
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              policy_as_code/app_sec_dev_stig/run: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              policy_as_code/app_sec_dev_stig/run: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/app_sec_dev_stig/run | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "policy_as_code/app_sec_dev_stig/run: required variable '{{ item }}' is not defined."
            success_msg: "policy_as_code/app_sec_dev_stig/run: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_policy_as_code_app_sec_dev_stig_run_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/app_sec_dev_stig/run | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_status: "preflight_failed"
            fe_policy_as_code_app_sec_dev_stig_run_postflight_passed: false
            fe_policy_as_code_app_sec_dev_stig_run_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_app_sec_dev_stig_run_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/app_sec_dev_stig/run: FAILED at '{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_app_sec_dev_stig_run_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/app_sec_dev_stig/run":
                  component: "policy_as_code/app_sec_dev_stig/run"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_app_sec_dev_stig_run_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_run_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_run_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_app_sec_dev_stig_run_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_app_sec_dev_stig_run_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_run_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_app_sec_dev_stig_run_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_run_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else ['policy_as_code/app_sec_dev_stig/run'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_stats_published: true
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/app_sec_dev_stig/run failed at '{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task }}': {{ fe_policy_as_code_app_sec_dev_stig_run_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/app_sec_dev_stig/run: preflight
              {{ 'passed' if fe_policy_as_code_app_sec_dev_stig_run_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "policy_as_code/app_sec_dev_stig/run | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "policy_as_code/app_sec_dev_stig/run | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_policy_as_code_app_sec_dev_stig_run_preflight_passed | bool
              - fe_policy_as_code_app_sec_dev_stig_run_status in ['running', 'succeeded']
            fail_msg: >-
              policy_as_code/app_sec_dev_stig/run: postflight validation failed - preflight passed
              ={{ fe_policy_as_code_app_sec_dev_stig_run_preflight_passed | default(false) }},
              status={{ fe_policy_as_code_app_sec_dev_stig_run_status | default('unknown') }}.
            success_msg: "policy_as_code/app_sec_dev_stig/run: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "policy_as_code/app_sec_dev_stig/run | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_postflight_passed: true
            fe_policy_as_code_app_sec_dev_stig_run_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_status: "failed"
            fe_policy_as_code_app_sec_dev_stig_run_postflight_passed: false
            fe_policy_as_code_app_sec_dev_stig_run_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_app_sec_dev_stig_run_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/app_sec_dev_stig/run: FAILED at '{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_app_sec_dev_stig_run_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/app_sec_dev_stig/run | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/app_sec_dev_stig/run failed at '{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task }}': {{ fe_policy_as_code_app_sec_dev_stig_run_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_app_sec_dev_stig_run_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_app_sec_dev_stig_run_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/app_sec_dev_stig/run":
                  component: "policy_as_code/app_sec_dev_stig/run"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_app_sec_dev_stig_run_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_run_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_run_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_app_sec_dev_stig_run_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_app_sec_dev_stig_run_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_run_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_app_sec_dev_stig_run_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_app_sec_dev_stig_run_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_run_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_app_sec_dev_stig_run_status | default('') == 'succeeded' else ['policy_as_code/app_sec_dev_stig/run'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_policy_as_code_app_sec_dev_stig_run_stats_published | default(false) | bool)
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_app_sec_dev_stig_run_stats_published: true
          tags:
            - always

        - name: "policy_as_code/app_sec_dev_stig/run | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/app_sec_dev_stig/run: {{ fe_policy_as_code_app_sec_dev_stig_run_status | default('unknown') }} in
              {{ fe_policy_as_code_app_sec_dev_stig_run_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
