---
# tasks file for app_sec_dev_stig

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['policy_as_code/app_sec_dev_stig']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_policy_as_code_app_sec_dev_stig_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "policy_as_code/app_sec_dev_stig | Initialize validation state"
  ansible.builtin.set_fact:
    fe_policy_as_code_app_sec_dev_stig_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_policy_as_code_app_sec_dev_stig_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_policy_as_code_app_sec_dev_stig_status: "running"
    fe_policy_as_code_app_sec_dev_stig_preflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_postflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_failed_task: ""
    fe_policy_as_code_app_sec_dev_stig_error: ""
    fe_policy_as_code_app_sec_dev_stig_stats_published: false
  tags:
    - always

- name: "policy_as_code/app_sec_dev_stig | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "policy_as_code/app_sec_dev_stig | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          policy_as_code/app_sec_dev_stig: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          policy_as_code/app_sec_dev_stig: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "policy_as_code/app_sec_dev_stig: required variable '{{ item }}' is not defined."
        success_msg: "policy_as_code/app_sec_dev_stig: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_policy_as_code_app_sec_dev_stig_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Ensure artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0750"
      changed_when: false
      tags: [always]

    - name: Show run mode
      ansible.builtin.debug:
        msg: >-
          app_sec_dev_stig ({{ stig_benchmark }} {{ stig_version }}) on {{ app_name }}
          ({{ app_src_dir }}) - gate {{ 'ENFORCED (build fails on violation)' if enforce_gate | bool else 'report-only' }}
      tags: [always]

    - name: Detect available security scanners
      ansible.builtin.shell: "command -v {{ item.value.bin }}"
      args:
        executable: /bin/bash
      loop: "{{ appsec_tools | dict2items }}"
      loop_control:
        label: "{{ item.value.bin }}"
      register: appsec_detect
      changed_when: false
      failed_when: false
      tags: [scan]

    - name: Build scanner availability map
      ansible.builtin.set_fact:
        appsec_available: "{{ appsec_available | default({}) | combine({item.item.key: (item.rc == 0)}) }}"
      loop: "{{ appsec_detect.results }}"
      loop_control:
        label: "{{ item.item.value.bin }} ({{ 'found' if item.rc == 0 else 'missing' }})"
      tags: [scan]

    - name: Run secret detection (APSC-DV-001740)
      ansible.builtin.import_tasks: scan_secrets.yml
      when: scan_secrets | bool and appsec_available.secrets | default(false)
      tags: [scan, secrets]

    - name: Run SAST (APSC-DV-002400/002560/003215)
      ansible.builtin.import_tasks: scan_sast.yml
      when: scan_sast | bool and appsec_available.sast | default(false)
      tags: [scan, sast]

    - name: Run dependency / SCA scan (APSC-DV-003235/002950)
      ansible.builtin.import_tasks: scan_dependencies.yml
      when: scan_dependencies | bool and appsec_available.dependencies | default(false)
      tags: [scan, sca]

    - name: Run IaC scan (APSC-DV-003180)
      ansible.builtin.import_tasks: scan_iac.yml
      when: scan_iac | bool and appsec_available.iac | default(false)
      tags: [scan, iac]

    - name: Generate compliance evidence and apply gate
      ansible.builtin.import_tasks: evidence_and_gate.yml
      tags: [always, report, gate]

    # ----------------------------- postflight -------------------

    - name: "policy_as_code/app_sec_dev_stig | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_policy_as_code_app_sec_dev_stig_preflight_passed | bool
          - fe_policy_as_code_app_sec_dev_stig_status in ['running', 'succeeded']
        fail_msg: >-
          policy_as_code/app_sec_dev_stig: postflight validation failed - preflight passed
          ={{ fe_policy_as_code_app_sec_dev_stig_preflight_passed | default(false) }},
          status={{ fe_policy_as_code_app_sec_dev_stig_status | default('unknown') }}.
        success_msg: "policy_as_code/app_sec_dev_stig: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_postflight_passed: true
        fe_policy_as_code_app_sec_dev_stig_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "policy_as_code/app_sec_dev_stig | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_status: "failed"
        fe_policy_as_code_app_sec_dev_stig_postflight_passed: false
        fe_policy_as_code_app_sec_dev_stig_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_policy_as_code_app_sec_dev_stig_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          policy_as_code/app_sec_dev_stig: FAILED at '{{ fe_policy_as_code_app_sec_dev_stig_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_policy_as_code_app_sec_dev_stig_error }}
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          policy_as_code/app_sec_dev_stig failed at '{{ fe_policy_as_code_app_sec_dev_stig_failed_task }}': {{ fe_policy_as_code_app_sec_dev_stig_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "policy_as_code/app_sec_dev_stig | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_policy_as_code_app_sec_dev_stig_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_app_sec_dev_stig_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "policy_as_code/app_sec_dev_stig":
              component: "policy_as_code/app_sec_dev_stig"
              type: "role"
              platform: "policy_as_code"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_policy_as_code_app_sec_dev_stig_status | default('unknown') }}"
              preflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_policy_as_code_app_sec_dev_stig_started_at | default('') }}"
              ended_at: "{{ fe_policy_as_code_app_sec_dev_stig_ended_at | default('') }}"
              duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_policy_as_code_app_sec_dev_stig_failed_task | default('') }}"
              error: "{{ fe_policy_as_code_app_sec_dev_stig_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_policy_as_code_app_sec_dev_stig_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_policy_as_code_app_sec_dev_stig_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_policy_as_code_app_sec_dev_stig_status | default('') == 'succeeded' else ['policy_as_code/app_sec_dev_stig'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_stats_published: true
      tags:
        - always
