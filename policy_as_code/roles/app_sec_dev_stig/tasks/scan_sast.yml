---
# Static application security testing (semgrep) - APSC-DV-002400/002560/003215

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['policy_as_code/app_sec_dev_stig/scan_sast']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_policy_as_code_app_sec_dev_stig_scan_sast_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "policy_as_code/app_sec_dev_stig/scan_sast | Initialize validation state"
  ansible.builtin.set_fact:
    fe_policy_as_code_app_sec_dev_stig_scan_sast_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_policy_as_code_app_sec_dev_stig_scan_sast_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_policy_as_code_app_sec_dev_stig_scan_sast_status: "running"
    fe_policy_as_code_app_sec_dev_stig_scan_sast_preflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_scan_sast_postflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_scan_sast_failed_task: ""
    fe_policy_as_code_app_sec_dev_stig_scan_sast_error: ""
    fe_policy_as_code_app_sec_dev_stig_scan_sast_stats_published: false
  tags:
    - always

- name: "policy_as_code/app_sec_dev_stig/scan_sast | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          policy_as_code/app_sec_dev_stig/scan_sast: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          policy_as_code/app_sec_dev_stig/scan_sast: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "policy_as_code/app_sec_dev_stig/scan_sast: required variable '{{ item }}' is not defined."
        success_msg: "policy_as_code/app_sec_dev_stig/scan_sast: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_scan_sast_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Run SAST scan
      ansible.builtin.command: "{{ appsec_tools.sast.cmd }}"
      args:
        chdir: "{{ app_src_dir }}"
      register: sast_run
      changed_when: false
      failed_when: false
      tags: [sast]

    - name: Read SAST report
      ansible.builtin.slurp:
        src: "{{ appsec_tools.sast.report }}"
      register: sast_report_raw
      failed_when: false
      changed_when: false
      tags: [sast]

    - name: Record SAST findings
      ansible.builtin.set_fact:
        appsec_findings: >-
          {{ appsec_findings | default({}) | combine({
               'sast': {
                 'tool': appsec_tools.sast.bin,
                 'ran': true,
                 'count': results | length,
                 'high': results | selectattr('extra.severity', 'defined') | selectattr('extra.severity', 'equalto', 'ERROR') | list | length,
                 'critical': 0,
                 'report': appsec_tools.sast.report
               }}) }}
      vars:
        results: >-
          {{ (sast_report_raw.content | b64decode | from_json).results | default([])
             if (sast_report_raw.content is defined) else [] }}
      tags: [sast]

    # ----------------------------- postflight -------------------

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_policy_as_code_app_sec_dev_stig_scan_sast_preflight_passed | bool
          - fe_policy_as_code_app_sec_dev_stig_scan_sast_status in ['running', 'succeeded']
        fail_msg: >-
          policy_as_code/app_sec_dev_stig/scan_sast: postflight validation failed - preflight passed
          ={{ fe_policy_as_code_app_sec_dev_stig_scan_sast_preflight_passed | default(false) }},
          status={{ fe_policy_as_code_app_sec_dev_stig_scan_sast_status | default('unknown') }}.
        success_msg: "policy_as_code/app_sec_dev_stig/scan_sast: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_scan_sast_postflight_passed: true
        fe_policy_as_code_app_sec_dev_stig_scan_sast_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_scan_sast_status: "failed"
        fe_policy_as_code_app_sec_dev_stig_scan_sast_postflight_passed: false
        fe_policy_as_code_app_sec_dev_stig_scan_sast_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_policy_as_code_app_sec_dev_stig_scan_sast_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          policy_as_code/app_sec_dev_stig/scan_sast: FAILED at '{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_policy_as_code_app_sec_dev_stig_scan_sast_error }}
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          policy_as_code/app_sec_dev_stig/scan_sast failed at '{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_failed_task }}': {{ fe_policy_as_code_app_sec_dev_stig_scan_sast_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_scan_sast_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_policy_as_code_app_sec_dev_stig_scan_sast_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_app_sec_dev_stig_scan_sast_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "policy_as_code/app_sec_dev_stig/scan_sast":
              component: "policy_as_code/app_sec_dev_stig/scan_sast"
              type: "role-tasks"
              platform: "policy_as_code"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_status | default('unknown') }}"
              preflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_started_at | default('') }}"
              ended_at: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_ended_at | default('') }}"
              duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_failed_task | default('') }}"
              error: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_policy_as_code_app_sec_dev_stig_scan_sast_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_policy_as_code_app_sec_dev_stig_scan_sast_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_scan_sast_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_policy_as_code_app_sec_dev_stig_scan_sast_status | default('') == 'succeeded' else ['policy_as_code/app_sec_dev_stig/scan_sast'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig/scan_sast | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_scan_sast_stats_published: true
      tags:
        - always
