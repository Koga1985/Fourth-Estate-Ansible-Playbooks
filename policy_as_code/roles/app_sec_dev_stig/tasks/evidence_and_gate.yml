---
# Aggregate scanner findings, map to APSC-DV controls, write evidence, gate.

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['policy_as_code/app_sec_dev_stig/evidence_and_gate']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Initialize validation state"
  ansible.builtin.set_fact:
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status: "running"
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_preflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_postflight_passed: false
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_failed_task: ""
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_error: ""
    fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_stats_published: false
  tags:
    - always

- name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          policy_as_code/app_sec_dev_stig/evidence_and_gate: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          policy_as_code/app_sec_dev_stig/evidence_and_gate: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "policy_as_code/app_sec_dev_stig/evidence_and_gate: required variable '{{ item }}' is not defined."
        success_msg: "policy_as_code/app_sec_dev_stig/evidence_and_gate: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Initialize findings map if no scanners ran
      ansible.builtin.set_fact:
        appsec_findings: "{{ appsec_findings | default({}) }}"
      tags: [report]

    - name: Compute severity totals
      ansible.builtin.set_fact:
        appsec_total_critical: "{{ appsec_findings.values() | map(attribute='critical') | map('int') | sum }}"
        appsec_total_high: "{{ appsec_findings.values() | map(attribute='high') | map('int') | sum }}"
        appsec_secret_count: "{{ appsec_findings.secrets.count | default(0) | int }}"
      tags: [report]

    - name: Evaluate APSC-DV control catalog against collected evidence
      ansible.builtin.set_fact:
        appsec_controls_eval: >-
          {{ appsec_controls_eval | default([]) + [
               item | combine({
                 'evidence_collected': (item.evidence is not none) and (appsec_available[item.evidence] | default(false)),
                 'findings': (appsec_findings[item.evidence].count | default(0)) if (item.evidence is not none) else 'n/a',
                 'result': (
                   'manual-review' if item.status == 'manual'
                   else ('tool-not-available' if not (appsec_available[item.evidence] | default(false))
                         else ('pass' if (appsec_findings[item.evidence].count | default(0) | int) == 0 else 'findings'))
                 )
               })
             ] }}
      loop: "{{ app_sec_dev_catalog }}"
      loop_control:
        label: "{{ item.id }}"
      tags: [report]

    - name: Assemble evidence package
      ansible.builtin.set_fact:
        appsec_evidence:
          meta:
            application: "{{ app_name }}"
            source: "{{ app_src_dir }}"
            timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
            benchmark: "{{ stig_benchmark }}"
            version: "{{ stig_version }}"
            gate: "{{ 'enforced' if enforce_gate | bool else 'report-only' }}"
            compliance_frameworks: "{{ compliance_frameworks }}"
          scanners:
            available: "{{ appsec_available }}"
            findings: "{{ appsec_findings }}"
          totals:
            critical: "{{ appsec_total_critical | int }}"
            high: "{{ appsec_total_high | int }}"
            secrets: "{{ appsec_secret_count | int }}"
          controls: "{{ appsec_controls_eval | default([]) }}"
      tags: [report]

    - name: Write JSON evidence artifact
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ app_name }}_app_sec_dev_stig.json"
        mode: "0640"
        content: "{{ appsec_evidence | to_nice_json }}"
      tags: [report]

    - name: Render Markdown evidence report
      ansible.builtin.template:
        src: appsec_report.md.j2
        dest: "{{ artifacts_dir }}/{{ app_name }}_app_sec_dev_stig.md"
        mode: "0640"
      tags: [report]

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          {{ app_name }}: critical={{ appsec_total_critical }}, high={{ appsec_total_high }},
          secrets={{ appsec_secret_count }};
          scanners available={{ appsec_available | dict2items | selectattr('value') | map(attribute='key') | list }}.
          Evidence: {{ artifacts_dir }}/{{ app_name }}_app_sec_dev_stig.md
      tags: [report]

    - name: APSC-DV gate - fail build when policy thresholds exceeded
      ansible.builtin.assert:
        that:
          - (appsec_total_critical | int) <= (gate_max_critical | int)
          - (appsec_total_high | int) <= (gate_max_high | int)
          - (not (gate_fail_on_secrets | bool)) or ((appsec_secret_count | int) == 0)
        fail_msg: >-
          APSC-DV gate FAILED: critical={{ appsec_total_critical }} (max {{ gate_max_critical }}),
          high={{ appsec_total_high }} (max {{ gate_max_high }}), secrets={{ appsec_secret_count }}.
        success_msg: "APSC-DV gate PASSED."
      when: enforce_gate | bool
      tags: [gate]

    # ----------------------------- postflight -------------------

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_preflight_passed | bool
          - fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status in ['running', 'succeeded']
        fail_msg: >-
          policy_as_code/app_sec_dev_stig/evidence_and_gate: postflight validation failed - preflight passed
          ={{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_preflight_passed | default(false) }},
          status={{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status | default('unknown') }}.
        success_msg: "policy_as_code/app_sec_dev_stig/evidence_and_gate: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_postflight_passed: true
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status: "failed"
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_postflight_passed: false
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          policy_as_code/app_sec_dev_stig/evidence_and_gate: FAILED at '{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_error }}
      tags:
        - always
        - rescue

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          policy_as_code/app_sec_dev_stig/evidence_and_gate failed at '{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_failed_task }}': {{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "policy_as_code/app_sec_dev_stig/evidence_and_gate":
              component: "policy_as_code/app_sec_dev_stig/evidence_and_gate"
              type: "role-tasks"
              platform: "policy_as_code"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status | default('unknown') }}"
              preflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_started_at | default('') }}"
              ended_at: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_ended_at | default('') }}"
              duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_failed_task | default('') }}"
              error: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_status | default('') == 'succeeded' else ['policy_as_code/app_sec_dev_stig/evidence_and_gate'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "policy_as_code/app_sec_dev_stig/evidence_and_gate | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_policy_as_code_app_sec_dev_stig_evidence_and_gate_stats_published: true
      tags:
        - always
