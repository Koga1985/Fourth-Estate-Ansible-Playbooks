---
# Policy as Code - Master Playbook
# Orchestrates all Fourth Estate compliance policies
#
# Usage:
#   # Dry-run (check mode - safe, default)
#   ansible-playbook site.yml -i inventory/production.yml
#
#   # Apply all policies
#   ansible-playbook site.yml -i inventory/production.yml -e "apply_changes=true"
#
#   # Apply specific control family
#   ansible-playbook site.yml -i inventory/production.yml -e "apply_changes=true" --tags nist_ia
#
#   # Apply only Category I (High) findings
#   ansible-playbook site.yml -i inventory/production.yml -e "apply_changes=true" --tags stig_cat1

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Policy as Code - Fourth Estate Compliance
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  serial: "{{ deployment_serial | default('100%') }}"

  vars:
    # Global policy settings
    apply_changes: false  # Default to dry-run for safety
    policy_artifacts_dir: "/tmp/policy-artifacts"
    validate_paths: true

    # Deployment controls
    deployment_serial: "100%"  # Number/percentage of hosts to run simultaneously
    stop_on_failure: true

  pre_tasks:
    - name: "policy_as_code/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "policy_as_code/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_policy_as_code_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_site_status: "running"
            fe_policy_as_code_site_preflight_passed: false
            fe_policy_as_code_site_postflight_passed: false
            fe_policy_as_code_site_failed_task: ""
            fe_policy_as_code_site_error: ""
            fe_policy_as_code_site_stats_published: false
          tags:
            - always

        - name: "policy_as_code/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              policy_as_code/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              policy_as_code/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "policy_as_code/site: required variable '{{ item }}' is not defined."
            success_msg: "policy_as_code/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_policy_as_code_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "policy_as_code/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_status: "preflight_failed"
            fe_policy_as_code_site_postflight_passed: false
            fe_policy_as_code_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/site: FAILED at '{{ fe_policy_as_code_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_site_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/site":
                  component: "policy_as_code/site"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_site_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_site_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_site_status | default('') == 'succeeded' else ['policy_as_code/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "policy_as_code/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_stats_published: true
          tags:
            - always

        - name: "policy_as_code/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/site failed at '{{ fe_policy_as_code_site_failed_task }}': {{ fe_policy_as_code_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/site: preflight
              {{ 'passed' if fe_policy_as_code_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Display deployment information
      ansible.builtin.debug:
        msg: |
          ========================================
          Policy as Code Deployment
          ========================================
          Target: {{ inventory_hostname }}
          Dry Run: {{ not (apply_changes | default(false) | bool) }}
          Serial Execution: {{ deployment_serial }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ========================================
      run_once: true
      delegate_to: localhost
      tags: [always]

    - name: Verify Ansible version meets requirements
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.12.0', '>=')
        fail_msg: "Ansible 2.12.0 or higher required"
        success_msg: "Ansible version {{ ansible_version.full }} is compatible"
      run_once: true
      delegate_to: localhost
      tags: [always]

    - name: Warning for production deployment
      ansible.builtin.pause:
        prompt: |
          ========================================
          WARNING: PRODUCTION DEPLOYMENT
          ========================================
          You are about to apply Policy as Code to: {{ inventory_hostname }}
          This will enforce DoD STIG and NIST 800-53 security controls.

          Changes include:
          - Password policies (15+ chars, complexity, expiration)
          - Session timeouts (10-15 minutes)
          - Audit logging (remote syslog)
          - Cryptographic settings (FIPS 140-2, TLS 1.2+)

          Press Enter to continue or Ctrl+C to abort...
      when:
        - apply_changes | bool
        - deployment_environment | default('test') == 'production'
      run_once: true
      delegate_to: localhost
      tags: [always]

  tasks:
    # ============================================
    # NIST IA Family - Identification & Authentication
    # ============================================

    - name: "policy_as_code/site | Guarded execution with rescue and always handling"
      block:

        - name: Include IA-5 Password Policy
          ansible.builtin.include_tasks: policies/identification_auth/password_policy.yml
          tags: [nist_ia, nist_ia_5, stig_cat1, password_policy]

        # ============================================
        # NIST AC Family - Access Control
        # ============================================

        - name: Include AC-12 Session Timeout Policy
          ansible.builtin.include_tasks: policies/access_control/session_timeout.yml
          tags: [nist_ac, nist_ac_12, stig_cat2, session_timeout]

        # ============================================
        # NIST AU Family - Audit & Accountability
        # ============================================

        - name: Include AU-2/AU-12 Audit Logging Policy
          ansible.builtin.include_tasks: policies/audit_accountability/audit_logging.yml
          tags: [nist_au, nist_au_2, nist_au_12, stig_cat2, audit_logging]

        # ============================================
        # NIST SC Family - System & Communications Protection
        # ============================================

        - name: Include SC-8/SC-13 Cryptographic Protection Policy
          ansible.builtin.include_tasks: policies/system_communications/cryptographic_protection.yml
          tags: [nist_sc, nist_sc_8, nist_sc_13, stig_cat1, cryptography]

      rescue:

        - name: "policy_as_code/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_status: "failed"
            fe_policy_as_code_site_postflight_passed: false
            fe_policy_as_code_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/site: FAILED at '{{ fe_policy_as_code_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_site_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/site failed at '{{ fe_policy_as_code_site_failed_task }}': {{ fe_policy_as_code_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "policy_as_code/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/site":
                  component: "policy_as_code/site"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_site_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_site_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_site_status | default('') == 'succeeded' else ['policy_as_code/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_policy_as_code_site_status | default('') == 'failed'
            - not (fe_policy_as_code_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "policy_as_code/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_stats_published: true
          when:
            - fe_policy_as_code_site_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate consolidated compliance report
      ansible.builtin.template:
        src: templates/compliance_report.j2
        dest: "{{ policy_artifacts_dir }}/compliance_report_{{ inventory_hostname }}_{{ ansible_date_time.date }}.html"
        mode: "0640"
      delegate_to: localhost
      when: apply_changes | bool
      ignore_errors: true
      tags: [always, reporting]

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Policy Deployment Complete
          ========================================
          Target: {{ inventory_hostname }}
          Dry Run: {{ not (apply_changes | default(false) | bool) }}
          Artifacts: {{ policy_artifacts_dir }}

          {% if apply_changes | bool %}
          CHANGES APPLIED - System is now DoD/NIST compliant
          {% else %}
          DRY RUN COMPLETE - No changes made to system
          {% endif %}

          Next Steps:
          {% if not (apply_changes | bool) %}
          1. Review artifacts in {{ policy_artifacts_dir }}
          2. Verify dry-run results meet requirements
          3. Re-run with -e "apply_changes=true" to apply
          {% else %}
          1. Review compliance artifacts
          2. Verify system functionality
          3. Update change control documentation
          4. Schedule periodic re-verification
          {% endif %}
          ========================================
      tags: [always]

# Handler for system reload if FIPS mode enabled
    - name: "policy_as_code/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "policy_as_code/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_policy_as_code_site_preflight_passed | bool
              - fe_policy_as_code_site_status in ['running', 'succeeded']
            fail_msg: >-
              policy_as_code/site: postflight validation failed - preflight passed
              ={{ fe_policy_as_code_site_preflight_passed | default(false) }},
              status={{ fe_policy_as_code_site_status | default('unknown') }}.
            success_msg: "policy_as_code/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "policy_as_code/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_postflight_passed: true
            fe_policy_as_code_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "policy_as_code/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_status: "failed"
            fe_policy_as_code_site_postflight_passed: false
            fe_policy_as_code_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/site: FAILED at '{{ fe_policy_as_code_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_site_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/site failed at '{{ fe_policy_as_code_site_failed_task }}': {{ fe_policy_as_code_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "policy_as_code/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/site":
                  component: "policy_as_code/site"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_site_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_site_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_site_status | default('') == 'succeeded' else ['policy_as_code/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_policy_as_code_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "policy_as_code/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_site_stats_published: true
          tags:
            - always

        - name: "policy_as_code/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/site: {{ fe_policy_as_code_site_status | default('unknown') }} in
              {{ fe_policy_as_code_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  handlers:
    - name: reload_system
      ansible.builtin.debug:
        msg: "System reload required for FIPS mode to take effect"
      listen: "fips_enabled"
