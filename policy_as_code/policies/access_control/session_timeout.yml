---
# NIST 800-53 AC-12: Session Termination
# DoD STIG Findings: V-230286, V-230287
# Severity: Category II (Medium)
#
# This policy enforces DoD session timeout requirements:
# - Absolute session timeout: 15 minutes of inactivity
# - Console session timeout: 10 minutes
# - SSH/Web session timeout: 15 minutes
# - Automatic logout on timeout

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: NIST AC-12 - Session Termination Policy
  hosts: all
  gather_facts: true

  vars:
    # Policy metadata
    control_id: "AC-12"
    policy_name: "Session Termination - Timeout Enforcement"
    nist_family: "Access Control"
    nist_baseline: ["LOW", "MODERATE", "HIGH"]
    stig_findings:
      - "V-230286"  # Console session timeout
      - "V-230287"  # Remote session timeout
    severity: "Category II"

    # Policy parameters (DoD STIG compliant defaults)
    ac_console_timeout_minutes: 10
    ac_ssh_timeout_minutes: 15
    ac_web_timeout_minutes: 15
    ac_absolute_timeout_minutes: 60

    # Execution control
    apply_changes: false
    policy_artifacts_dir: "/tmp/policy-artifacts"
    validate_paths: true

  pre_tasks:
    - name: "policy_as_code/policies/access_control/session_timeout | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "policy_as_code/policies/access_control/session_timeout | Initialize validation state"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_policy_as_code_policies_access_control_session_timeout_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_policies_access_control_session_timeout_status: "running"
            fe_policy_as_code_policies_access_control_session_timeout_preflight_passed: false
            fe_policy_as_code_policies_access_control_session_timeout_postflight_passed: false
            fe_policy_as_code_policies_access_control_session_timeout_failed_task: ""
            fe_policy_as_code_policies_access_control_session_timeout_error: ""
            fe_policy_as_code_policies_access_control_session_timeout_stats_published: false
          tags:
            - always

        - name: "policy_as_code/policies/access_control/session_timeout | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              policy_as_code/policies/access_control/session_timeout: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              policy_as_code/policies/access_control/session_timeout: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/policies/access_control/session_timeout | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "policy_as_code/policies/access_control/session_timeout: required variable '{{ item }}' is not defined."
            success_msg: "policy_as_code/policies/access_control/session_timeout: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_policy_as_code_policies_access_control_session_timeout_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "policy_as_code/policies/access_control/session_timeout | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_status: "preflight_failed"
            fe_policy_as_code_policies_access_control_session_timeout_postflight_passed: false
            fe_policy_as_code_policies_access_control_session_timeout_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_policies_access_control_session_timeout_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/policies/access_control/session_timeout: FAILED at '{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_policies_access_control_session_timeout_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/policies/access_control/session_timeout":
                  component: "policy_as_code/policies/access_control/session_timeout"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_policies_access_control_session_timeout_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_policies_access_control_session_timeout_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_policies_access_control_session_timeout_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_policies_access_control_session_timeout_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_policies_access_control_session_timeout_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_policies_access_control_session_timeout_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_policies_access_control_session_timeout_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_policies_access_control_session_timeout_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else ['policy_as_code/policies/access_control/session_timeout'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_stats_published: true
          tags:
            - always

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/policies/access_control/session_timeout failed at '{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task }}': {{ fe_policy_as_code_policies_access_control_session_timeout_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/policies/access_control/session_timeout: preflight
              {{ 'passed' if fe_policy_as_code_policies_access_control_session_timeout_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: Include compliance common library
      ansible.builtin.include_tasks: ../../library/compliance_common.yml
      tags: [always]

  tasks:
    # ============================================
    # NIST AC-12 - Console Session Timeout
    # DoD STIG V-230286
    # ============================================

    - name: "policy_as_code/policies/access_control/session_timeout | Guarded execution with rescue and always handling"
      block:

        - name: AC-12 - Query current console session timeout
          ansible.builtin.command:
            cmd: show running-config | include "exec-timeout"
          register: current_console_timeout
          changed_when: false
          failed_when: false
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, query]

        - name: AC-12 - Set console session timeout to {{ ac_console_timeout_minutes }} minutes
          ansible.builtin.command:
            cmd: |
              configure terminal
              line console 0
              exec-timeout {{ ac_console_timeout_minutes }} 0
              end
          when:
            - apply_changes | bool
            - current_console_timeout.stdout is not search(ac_console_timeout_minutes | string)
          register: set_console_timeout
          changed_when: set_console_timeout.rc == 0
          tags: [nist_ac_12, stig_cat2, session_timeout, apply]

        - name: AC-12 - Verify console session timeout
          ansible.builtin.command:
            cmd: show running-config | include "line console" -A 5
          register: verify_console_timeout
          changed_when: false
          failed_when: verify_console_timeout.stdout is not search("exec-timeout " + (ac_console_timeout_minutes | string))
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, verify]

        - name: AC-12 - Generate console timeout compliance artifact
          ansible.builtin.include_tasks: ../../library/artifact_generator.yml
          vars:
            control_description: "Console session timeout enforcement (10 minutes)"
            implementation_status: >-
              {{ 'COMPLIANT' if (verify_console_timeout.stdout is search("exec-timeout " + (ac_console_timeout_minutes | string))) else 'NON_COMPLIANT' }}
            implementation_details:
              finding: "V-230286"
              requirement: "Console sessions must terminate after 10 minutes of inactivity"
              current_setting: "{{ verify_console_timeout.stdout | default('Not configured') }}"
              expected_setting: "exec-timeout {{ ac_console_timeout_minutes }} 0"
              changed: "{{ set_console_timeout.changed | default(false) }}"
            applied_settings:
              timeout_minutes: "{{ ac_console_timeout_minutes }}"
              interface: "console 0"
            verification_method: "Automated - CLI verification"
            verification_status: >-
              {{ 'Verified' if (verify_console_timeout.rc == 0) else 'Failed' }}
          tags: [nist_ac_12, stig_cat2, artifact]

        # ============================================
        # NIST AC-12 - VTY (SSH/Telnet) Session Timeout
        # DoD STIG V-230287
        # ============================================

        - name: AC-12 - Query current VTY session timeout
          ansible.builtin.command:
            cmd: show running-config | include "line vty" -A 5
          register: current_vty_timeout
          changed_when: false
          failed_when: false
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, query]

        - name: AC-12 - Set VTY session timeout to {{ ac_ssh_timeout_minutes }} minutes
          ansible.builtin.command:
            cmd: |
              configure terminal
              line vty 0 4
              exec-timeout {{ ac_ssh_timeout_minutes }} 0
              end
          when:
            - apply_changes | bool
            - current_vty_timeout.stdout is not search("exec-timeout " + (ac_ssh_timeout_minutes | string))
          register: set_vty_timeout
          changed_when: set_vty_timeout.rc == 0
          tags: [nist_ac_12, stig_cat2, session_timeout, apply]

        - name: AC-12 - Verify VTY session timeout
          ansible.builtin.command:
            cmd: show running-config | include "line vty" -A 5
          register: verify_vty_timeout
          changed_when: false
          failed_when: verify_vty_timeout.stdout is not search("exec-timeout " + (ac_ssh_timeout_minutes | string))
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, verify]

        - name: AC-12 - Generate VTY timeout compliance artifact
          ansible.builtin.include_tasks: ../../library/artifact_generator.yml
          vars:
            control_description: "VTY (SSH) session timeout enforcement (15 minutes)"
            implementation_status: >-
              {{ 'COMPLIANT' if (verify_vty_timeout.stdout is search("exec-timeout " + (ac_ssh_timeout_minutes | string))) else 'NON_COMPLIANT' }}
            implementation_details:
              finding: "V-230287"
              requirement: "Remote sessions must terminate after 15 minutes of inactivity"
              current_setting: "{{ verify_vty_timeout.stdout | default('Not configured') }}"
              expected_setting: "exec-timeout {{ ac_ssh_timeout_minutes }} 0"
              changed: "{{ set_vty_timeout.changed | default(false) }}"
            applied_settings:
              timeout_minutes: "{{ ac_ssh_timeout_minutes }}"
              interface: "vty 0 4"
            verification_method: "Automated - CLI verification"
            verification_status: >-
              {{ 'Verified' if (verify_vty_timeout.rc == 0) else 'Failed' }}
          tags: [nist_ac_12, stig_cat2, artifact]

        # ============================================
        # NIST AC-12 - Web UI Session Timeout
        # Additional DoD Requirement
        # ============================================

        - name: AC-12 - Query current web session timeout
          ansible.builtin.command:
            cmd: show running-config | include "ip http timeout-policy"
          register: current_web_timeout
          changed_when: false
          failed_when: false
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, query]

        - name: AC-12 - Set web session timeout to {{ ac_web_timeout_minutes }} minutes
          ansible.builtin.command:
            cmd: |
              configure terminal
              ip http timeout-policy idle {{ ac_web_timeout_minutes }} life {{ ac_absolute_timeout_minutes }} requests 100
              end
          when:
            - apply_changes | bool
            - current_web_timeout.stdout is not search("idle " + (ac_web_timeout_minutes | string))
          register: set_web_timeout
          changed_when: set_web_timeout.rc == 0
          tags: [nist_ac_12, stig_cat2, session_timeout, apply]

        - name: AC-12 - Verify web session timeout
          ansible.builtin.command:
            cmd: show running-config | include "ip http timeout-policy"
          register: verify_web_timeout
          changed_when: false
          failed_when: verify_web_timeout.stdout is not search("idle " + (ac_web_timeout_minutes | string))
          check_mode: false
          tags: [nist_ac_12, stig_cat2, session_timeout, verify]

        - name: AC-12 - Generate web timeout compliance artifact
          ansible.builtin.include_tasks: ../../library/artifact_generator.yml
          vars:
            control_description: "Web UI session timeout enforcement (15 minutes idle)"
            implementation_status: >-
              {{ 'COMPLIANT' if (verify_web_timeout.stdout is search("idle " + (ac_web_timeout_minutes | string))) else 'NON_COMPLIANT' }}
            implementation_details:
              finding: "Additional DoD Requirement"
              requirement: "Web UI sessions must terminate after 15 minutes of inactivity"
              current_setting: "{{ verify_web_timeout.stdout | default('Not configured') }}"
              expected_setting: "ip http timeout-policy idle {{ ac_web_timeout_minutes }} life {{ ac_absolute_timeout_minutes }}"
              changed: "{{ set_web_timeout.changed | default(false) }}"
            applied_settings:
              idle_timeout_minutes: "{{ ac_web_timeout_minutes }}"
              absolute_timeout_minutes: "{{ ac_absolute_timeout_minutes }}"
              max_requests: 100
            verification_method: "Automated - CLI verification"
            verification_status: >-
              {{ 'Verified' if (verify_web_timeout.rc == 0) else 'Failed' }}
          tags: [nist_ac_12, stig_cat2, artifact]

        # ============================================
        # NIST AC-12(1) - User-Initiated Logouts
        # ============================================

        - name: AC-12(1) - Verify logout capability exists
          ansible.builtin.command:
            cmd: show version | include "IOS"
          register: verify_logout
          changed_when: false
          check_mode: false
          tags: [nist_ac_12, session_timeout, verify]

        - name: AC-12(1) - Generate logout capability artifact
          ansible.builtin.include_tasks: ../../library/artifact_generator.yml
          vars:
            control_description: "User-initiated logout capability"
            implementation_status: "COMPLIANT"
            implementation_details:
              requirement: "System must provide capability for users to directly initiate session logout"
              implementation: "Native IOS/NX-OS logout command available"
              commands_available:
                - "logout"
                - "exit"
                - "quit"
            verification_method: "Design Review"
            verification_status: "Verified"
          tags: [nist_ac_12, artifact]

      rescue:

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_status: "failed"
            fe_policy_as_code_policies_access_control_session_timeout_postflight_passed: false
            fe_policy_as_code_policies_access_control_session_timeout_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_policy_as_code_policies_access_control_session_timeout_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              policy_as_code/policies/access_control/session_timeout: FAILED at '{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_policy_as_code_policies_access_control_session_timeout_error }}
          tags:
            - always
            - rescue

        - name: "policy_as_code/policies/access_control/session_timeout | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              policy_as_code/policies/access_control/session_timeout failed at '{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task }}': {{ fe_policy_as_code_policies_access_control_session_timeout_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_policy_as_code_policies_access_control_session_timeout_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_policy_as_code_policies_access_control_session_timeout_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "policy_as_code/policies/access_control/session_timeout":
                  component: "policy_as_code/policies/access_control/session_timeout"
                  type: "playbook"
                  platform: "policy_as_code"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_policy_as_code_policies_access_control_session_timeout_status | default('unknown') }}"
                  preflight_passed: "{{ fe_policy_as_code_policies_access_control_session_timeout_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_policy_as_code_policies_access_control_session_timeout_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_policy_as_code_policies_access_control_session_timeout_started_at | default('') }}"
                  ended_at: "{{ fe_policy_as_code_policies_access_control_session_timeout_ended_at | default('') }}"
                  duration_seconds: "{{ fe_policy_as_code_policies_access_control_session_timeout_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_policy_as_code_policies_access_control_session_timeout_failed_task | default('') }}"
                  error: "{{ fe_policy_as_code_policies_access_control_session_timeout_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_policy_as_code_policies_access_control_session_timeout_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'succeeded' else ['policy_as_code/policies/access_control/session_timeout'] }}
            aggregate: true
            per_host: false
          when:
            - fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'failed'
            - not (fe_policy_as_code_policies_access_control_session_timeout_stats_published | default(false) | bool)
          tags:
            - always

        - name: "policy_as_code/policies/access_control/session_timeout | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_policy_as_code_policies_access_control_session_timeout_stats_published: true
          when:
            - fe_policy_as_code_policies_access_control_session_timeout_status | default('') == 'failed'
          tags:
            - always

  post_tasks:
    - name: Generate consolidated AC-12 compliance summary
      ansible.builtin.copy:
        dest: "{{ current_artifact_dir }}/AC-12_summary_{{ inventory_hostname }}.json"
        mode: "0640"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        content: |
          {
            "control": "NIST 800-53 AC-12: Session Termination",
            "policy": "Session Timeout Enforcement",
            "severity": "Category II (Medium)",
            "stig_findings": {{ stig_findings | to_json }},
            "target_system": "{{ inventory_hostname }}",
            "execution_timestamp": "{{ ansible_date_time.iso8601 }}",
            "dry_run": {{ not (apply_changes | default(false) | bool) }},
            "compliance_checks": {
              "console_timeout": {
                "required_minutes": {{ ac_console_timeout_minutes }},
                "status": "{{ 'COMPLIANT' if (verify_console_timeout.stdout is search('exec-timeout ' + (ac_console_timeout_minutes | string))) else 'NON_COMPLIANT' }}"
              },
              "vty_timeout": {
                "required_minutes": {{ ac_ssh_timeout_minutes }},
                "status": "{{ 'COMPLIANT' if (verify_vty_timeout.stdout is search('exec-timeout ' + (ac_ssh_timeout_minutes | string))) else 'NON_COMPLIANT' }}"
              },
              "web_timeout": {
                "idle_minutes": {{ ac_web_timeout_minutes }},
                "absolute_minutes": {{ ac_absolute_timeout_minutes }},
                "status": "{{ 'COMPLIANT' if (verify_web_timeout.stdout is search('idle ' + (ac_web_timeout_minutes | string))) else 'NON_COMPLIANT' }}"
              },
              "user_logout": {
                "required": true,
                "status": "COMPLIANT"
              }
            },
            "overall_status": "{{ 'COMPLIANT' if ((verify_console_timeout.stdout is search('exec-timeout ' + (ac_console_timeout_minutes | string))) and (verify_vty_timeout.stdout is search('exec-timeout ' + (ac_ssh_timeout_minutes | string))) and (verify_web_timeout.stdout is search('idle ' + (ac_web_timeout_minutes | string)))) else 'NON_COMPLIANT' }}"
          }
      delegate_to: localhost
      tags: [always, summary]

    - name: Display execution summary
      ansible.builtin.debug:
        msg: |
          ========================================
          AC-12 Session Timeout Execution Complete
          ========================================
          Target: {{ inventory_hostname }}
          Dry Run: {{ not (apply_changes | default(false) | bool) }}
          Artifacts: {{ current_artifact_dir }}

          Compliance Status:
