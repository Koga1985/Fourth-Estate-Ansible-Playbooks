---
# Deploy Cohesity Virtual Edition nodes

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_install/deploy_ve']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_install_deploy_ve_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_install/deploy_ve | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_install_deploy_ve_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_install_deploy_ve_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_install_deploy_ve_status: "running"
    fe_cohesity_cohesity_cluster_install_deploy_ve_preflight_passed: false
    fe_cohesity_cohesity_cluster_install_deploy_ve_postflight_passed: false
    fe_cohesity_cohesity_cluster_install_deploy_ve_failed_task: ""
    fe_cohesity_cohesity_cluster_install_deploy_ve_error: ""
    fe_cohesity_cohesity_cluster_install_deploy_ve_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_install/deploy_ve | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_install/deploy_ve: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_install/deploy_ve: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_install/deploy_ve: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_install/deploy_ve: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_deploy_ve_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Deploy Cohesity VE nodes on VMware
      when: cohesity_ve_platform == "vmware"
      block:
        - name: Check if OVA file exists
          ansible.builtin.stat:
            path: "{{ cohesity_ve_ova_path }}"
          register: ova_file
          delegate_to: localhost

        - name: Fail if OVA file not found
          ansible.builtin.fail:
            msg: "OVA file not found at {{ cohesity_ve_ova_path }}"
          when: not ova_file.stat.exists

        - name: Deploy Cohesity VE from OVA
          community.vmware.vmware_deploy_ovf:
            hostname: "{{ cohesity_ve_vcenter_host }}"
            username: "{{ cohesity_ve_vcenter_username }}"
            password: "{{ cohesity_ve_vcenter_password }}"
            datacenter: "{{ cohesity_ve_datacenter }}"
            cluster: "{{ cohesity_ve_cluster }}"
            datastore: "{{ cohesity_ve_datastore }}"
            name: "{{ cohesity_ve_vm_name_prefix }}-{{ item.node_id }}"
            networks:
              "VM Network": "{{ cohesity_ve_network }}"
            ovf: "{{ cohesity_ve_ova_path }}"
            power_on: false
            validate_certs: false
            wait: true
            wait_for_ip_address: false
            properties:
              vami.hostname: "{{ item.hostname }}"
              vami.ip0.eth0: "{{ item.ip_address }}"
              vami.netmask0.eth0: "{{ cohesity_cluster_subnet_mask }}"
              vami.gateway.eth0: "{{ cohesity_cluster_gateway }}"
              vami.DNS.eth0: "{{ cohesity_cluster_dns_servers[0] }}"
          no_log: true
          loop: "{{ cohesity_nodes }}"
          loop_control:
            label: "{{ item.hostname }}"
          delegate_to: localhost
          register: vm_deploy

        - name: Configure VM CPU and memory settings
          community.vmware.vmware_guest:
            hostname: "{{ cohesity_ve_vcenter_host }}"
            username: "{{ cohesity_ve_vcenter_username }}"
            password: "{{ cohesity_ve_vcenter_password }}"
            datacenter: "{{ cohesity_ve_datacenter }}"
            name: "{{ cohesity_ve_vm_name_prefix }}-{{ item.node_id }}"
            state: present
            hardware:
              memory_mb: 16384
              num_cpus: 8
              num_cpu_cores_per_socket: 4
            validate_certs: false
          no_log: true
          loop: "{{ cohesity_nodes }}"
          loop_control:
            label: "{{ item.hostname }}"
          delegate_to: localhost

        - name: Add data disks to VE nodes
          community.vmware.vmware_guest_disk:
            hostname: "{{ cohesity_ve_vcenter_host }}"
            username: "{{ cohesity_ve_vcenter_username }}"
            password: "{{ cohesity_ve_vcenter_password }}"
            datacenter: "{{ cohesity_ve_datacenter }}"
            name: "{{ cohesity_ve_vm_name_prefix }}-{{ item.0.node_id }}"
            disk:
              - size_gb: 500
                type: thin
                datastore: "{{ cohesity_ve_datastore }}"
                controller_type: 'paravirtual'
                controller_number: 1
                unit_number: "{{ item.1 }}"
            validate_certs: false
          no_log: true
          loop: "{{ cohesity_nodes | product(range(0, cohesity_disk_config.data_disk_count)) | list }}"
          loop_control:
            label: "{{ item.0.hostname }} - Disk {{ item.1 }}"
          delegate_to: localhost

        - name: Power on VE nodes
          community.vmware.vmware_guest_powerstate:
            hostname: "{{ cohesity_ve_vcenter_host }}"
            username: "{{ cohesity_ve_vcenter_username }}"
            password: "{{ cohesity_ve_vcenter_password }}"
            name: "{{ cohesity_ve_vm_name_prefix }}-{{ item.node_id }}"
            state: powered-on
            validate_certs: false
          no_log: true
          loop: "{{ cohesity_nodes }}"
          loop_control:
            label: "{{ item.hostname }}"
          delegate_to: localhost

        - name: Wait for VE nodes to boot
          ansible.builtin.pause:
            seconds: 120

    - name: Deploy Cohesity VE on Azure
      when: cohesity_ve_platform == "azure"
      block:
        - name: Create Azure resource group
          azure.azcollection.azure_rm_resourcegroup:
            name: "rg-cohesity-{{ cohesity_cluster_name }}"
            location: eastus
          delegate_to: localhost

        - name: Deploy Cohesity VE VMs on Azure
          azure.azcollection.azure_rm_virtualmachine:
            resource_group: "rg-cohesity-{{ cohesity_cluster_name }}"
            name: "{{ item.hostname }}"
            vm_size: Standard_D8s_v3
            admin_username: admin
            admin_password: "{{ cohesity_admin_password }}"
            network_interfaces: "{{ item.hostname }}-nic"
            image:
              offer: cohesity-dataplatform
              publisher: cohesity
              sku: cohesity-6_6
              version: latest
            data_disks:
              - lun: 0
                disk_size_gb: 500
                managed_disk_type: Premium_LRS
          no_log: true
          loop: "{{ cohesity_nodes }}"
          loop_control:
            label: "{{ item.hostname }}"
          delegate_to: localhost

    - name: Display VE deployment summary
      ansible.builtin.debug:
        msg:
          - "Virtual Edition deployment completed"
          - "Platform: {{ cohesity_ve_platform }}"
          - "Nodes deployed: {{ cohesity_nodes | length }}"
          - "Waiting for nodes to become accessible..."

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_install_deploy_ve_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_install_deploy_ve_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_install/deploy_ve: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_install_deploy_ve_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_install_deploy_ve_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_install/deploy_ve: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_deploy_ve_postflight_passed: true
        fe_cohesity_cohesity_cluster_install_deploy_ve_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_deploy_ve_status: "failed"
        fe_cohesity_cohesity_cluster_install_deploy_ve_postflight_passed: false
        fe_cohesity_cohesity_cluster_install_deploy_ve_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_install_deploy_ve_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_install/deploy_ve: FAILED at '{{ fe_cohesity_cohesity_cluster_install_deploy_ve_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_install_deploy_ve_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_install/deploy_ve failed at '{{ fe_cohesity_cohesity_cluster_install_deploy_ve_failed_task }}': {{ fe_cohesity_cohesity_cluster_install_deploy_ve_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_deploy_ve_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_install_deploy_ve_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_install_deploy_ve_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_install/deploy_ve":
              component: "cohesity/cohesity_cluster_install/deploy_ve"
              type: "role-tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_install_deploy_ve_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_install_deploy_ve_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_deploy_ve_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_install_deploy_ve_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_install/deploy_ve'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/deploy_ve | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_deploy_ve_stats_published: true
      tags:
        - always
