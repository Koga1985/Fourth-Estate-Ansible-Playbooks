---
# Post-installation validation checks

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_install/post_checks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_install_post_checks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_install/post_checks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_install_post_checks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_install_post_checks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_install_post_checks_status: "running"
    fe_cohesity_cohesity_cluster_install_post_checks_preflight_passed: false
    fe_cohesity_cohesity_cluster_install_post_checks_postflight_passed: false
    fe_cohesity_cohesity_cluster_install_post_checks_failed_task: ""
    fe_cohesity_cohesity_cluster_install_post_checks_error: ""
    fe_cohesity_cohesity_cluster_install_post_checks_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_install/post_checks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_install/post_checks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_install/post_checks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_install/post_checks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/post_checks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_install/post_checks: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_install/post_checks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_install_post_checks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/post_checks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_post_checks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Authenticate for post-checks
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/accessTokens"
        method: POST
        body_format: json
        body:
          username: "{{ cohesity_admin_username }}"
          password: "{{ cohesity_admin_password }}"
          domain: "LOCAL"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 201
      register: auth_check
      no_log: true

    - name: Set API token for post-checks
      ansible.builtin.set_fact:
        post_check_token: "{{ auth_check.json.accessToken }}"
      no_log: true

    - name: Verify cluster health
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/cluster"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: cluster_health

    - name: Display cluster health status
      ansible.builtin.debug:
        msg:
          - "Cluster Health: {{ cluster_health.json.clusterState | default('Unknown') }}"
          - "Software Version: {{ cluster_health.json.clusterSoftwareVersion | default('Unknown') }}"
          - "Cluster ID: {{ cluster_health.json.id | default('Unknown') }}"

    - name: Verify all nodes are online
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/nodes"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: nodes_status

    - name: Check individual node status
      ansible.builtin.assert:
        that:
          - item.nodeIncarnationId is defined
          - item.nodeStatus is defined
        fail_msg: "Node {{ item.id }} status check failed"
        success_msg: "Node {{ item.id }} is online"
      loop: "{{ nodes_status.json }}"
      loop_control:
        label: "Node {{ item.id }}"

    - name: Verify storage domain exists
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/viewBoxes"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: storage_domains

    - name: Validate storage domain configuration
      ansible.builtin.assert:
        that:
          - storage_domains.json | length > 0
        fail_msg: "No storage domains found"
        success_msg: "Storage domain created successfully"

    - name: Check cluster capacity
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/statistics/storage"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: storage_stats

    - name: Display storage capacity
      ansible.builtin.debug:
        msg:
          - "Total Capacity: {{ (storage_stats.json.physicalCapacityBytes | default(0) / 1024 / 1024 / 1024) | round(2) }} GB"
          - "Used Capacity: {{ (storage_stats.json.physicalUsedBytes | default(0) / 1024 / 1024 / 1024) | round(2) }} GB"
          - "Available: {{ ((storage_stats.json.physicalCapacityBytes | default(0) - storage_stats.json.physicalUsedBytes | default(0)) / 1024 / 1024 / 1024) | round(2) }} GB"
      when: storage_stats.json is defined

    - name: Verify encryption status
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/cluster/encryption"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: encryption_status
      when: cohesity_encryption_enabled | bool

    - name: Validate encryption is enabled
      ansible.builtin.assert:
        that:
          - encryption_status.json.encryptionEnabled is defined
          - encryption_status.json.encryptionEnabled == true
        fail_msg: "Encryption is not enabled"
        success_msg: "Encryption at rest is enabled"
      when:
        - cohesity_encryption_enabled | bool
        - encryption_status.json is defined

    - name: Check NTP synchronization
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/network/ntpServers"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: ntp_config

    - name: Verify NTP servers are configured
      ansible.builtin.assert:
        that:
          - ntp_config.json | length > 0
        fail_msg: "NTP servers not configured"
        success_msg: "NTP servers configured: {{ ntp_config.json | length }}"

    - name: Check DNS configuration
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/network/nameServers"
        method: GET
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      register: dns_config

    - name: Verify DNS servers are configured
      ansible.builtin.assert:
        that:
          - dns_config.json | length > 0
        fail_msg: "DNS servers not configured"
        success_msg: "DNS servers configured: {{ dns_config.json | length }}"

    - name: Test SMTP configuration
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/smtpServer/test"
        method: POST
        headers:
          Authorization: "Bearer {{ post_check_token }}"
        body_format: json
        body:
          emailTo: "{{ cohesity_admin_email }}"
          subject: "Cohesity Cluster Installation Complete"
          message: "Cluster {{ cohesity_cluster_name }} has been successfully installed and configured."
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 204]
      ignore_errors: yes
      register: smtp_test

    - name: Display SMTP test result
      ansible.builtin.debug:
        msg: "SMTP test {{ 'succeeded' if smtp_test.status in [200, 204] else 'failed' }}"

    - name: Generate post-installation report
      ansible.builtin.template:
        src: post-install-report.j2
        dest: "/tmp/cohesity-install-report-{{ ansible_date_time.date }}.txt"
        mode: '0644'
      delegate_to: localhost

    - name: Display post-check summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Post-Installation Checks Complete"
          - "All validation checks passed successfully"
          - "Cluster is ready for production use"
          - "Report saved: /tmp/cohesity-install-report-{{ ansible_date_time.date }}.txt"
          - "=========================================="

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_install/post_checks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_install_post_checks_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_install_post_checks_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_install/post_checks: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_install_post_checks_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_install_post_checks_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_install/post_checks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_install/post_checks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_post_checks_postflight_passed: true
        fe_cohesity_cohesity_cluster_install_post_checks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_install/post_checks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_post_checks_status: "failed"
        fe_cohesity_cohesity_cluster_install_post_checks_postflight_passed: false
        fe_cohesity_cohesity_cluster_install_post_checks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_install_post_checks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/post_checks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_install/post_checks: FAILED at '{{ fe_cohesity_cohesity_cluster_install_post_checks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_install_post_checks_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/post_checks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_install/post_checks failed at '{{ fe_cohesity_cohesity_cluster_install_post_checks_failed_task }}': {{ fe_cohesity_cohesity_cluster_install_post_checks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_install/post_checks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_post_checks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_install_post_checks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_install_post_checks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/post_checks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_install/post_checks":
              component: "cohesity/cohesity_cluster_install/post_checks"
              type: "role-tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_install_post_checks_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_install_post_checks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_install_post_checks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_install_post_checks_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_install_post_checks_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_post_checks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_install_post_checks_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_install_post_checks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_install_post_checks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_install_post_checks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_post_checks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_install_post_checks_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_install/post_checks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/post_checks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_post_checks_stats_published: true
      tags:
        - always
