---
# tasks file for cohesity_cluster_install

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_install']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_install_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_install | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_install_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_install_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_install_status: "running"
    fe_cohesity_cohesity_cluster_install_preflight_passed: false
    fe_cohesity_cohesity_cluster_install_postflight_passed: false
    fe_cohesity_cohesity_cluster_install_failed_task: ""
    fe_cohesity_cohesity_cluster_install_error: ""
    fe_cohesity_cohesity_cluster_install_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_install | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_install | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_install: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_install: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_install: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_install: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_install_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display Cohesity cluster installation banner
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Cohesity Cluster Installation"
          - "Cluster Name: {{ cohesity_cluster_name }}"
          - "Deployment Type: {{ cohesity_deployment_type }}"
          - "=========================================="

    - name: Validate installation prerequisites
      ansible.builtin.include_tasks: pre_checks.yml
      when: cohesity_pre_checks_enabled | bool

    - name: Deploy Virtual Edition nodes
      ansible.builtin.include_tasks: deploy_ve.yml
      when: cohesity_deployment_type == "ve"

    - name: Configure physical appliance nodes
      ansible.builtin.include_tasks: configure_physical.yml
      when: cohesity_deployment_type == "physical"

    - name: Wait for nodes to become accessible
      ansible.builtin.wait_for:
        host: "{{ item.ip_address }}"
        port: 22
        state: started
        delay: 30
        timeout: 600
      loop: "{{ cohesity_nodes }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Bootstrap Cohesity cluster
      ansible.builtin.include_tasks: bootstrap_cluster.yml

    - name: Wait for cluster services to be ready
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/basicClusterInfo"
        method: GET
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
        timeout: "{{ cohesity_api_timeout }}"
      register: cluster_ready
      until: cluster_ready.status == 200
      retries: 30
      delay: 60
      ignore_errors: yes

    - name: Authenticate to Cohesity cluster
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/accessTokens"
        method: POST
        body_format: json
        body:
          username: "{{ cohesity_admin_username }}"
          password: "{{ cohesity_admin_password }}"
          domain: "LOCAL"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 201
      register: cohesity_auth
      no_log: true

    - name: Set Cohesity API token fact
      ansible.builtin.set_fact:
        cohesity_api_token: "{{ cohesity_auth.json.accessToken }}"
      no_log: true

    - name: Configure cluster network settings
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/clusterPartitions"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          clusterPartitionName: "{{ cohesity_cluster_name }}"
          vips: "{{ cohesity_cluster_vips }}"
          gateway: "{{ cohesity_cluster_gateway }}"
          subnetMask: "{{ cohesity_cluster_subnet_mask }}"
          mtuBytes: "{{ cohesity_network_config.mtu_size }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 201]
      register: network_config

    - name: Configure DNS servers
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/network/nameServers"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          nameServers: "{{ cohesity_cluster_dns_servers }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Configure NTP servers
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/network/ntpServers"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          ntpServers: "{{ cohesity_cluster_ntp_servers }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Configure timezone
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/cluster"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          timezone: "{{ cohesity_timezone }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Apply Cohesity license
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/licenseAgreement"
        method: POST
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          licenseKey: "{{ cohesity_license_key }}"
          signedVersion: 1
          signedByUser: "{{ cohesity_admin_username }}"
          signedTime: "{{ ansible_date_time.epoch }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 201]
      no_log: true
      when: cohesity_license_key is defined

    - name: Configure SMTP settings
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/smtpServer"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          server: "{{ cohesity_smtp_server }}"
          port: "{{ cohesity_smtp_port }}"
          username: "{{ cohesity_smtp_username }}"
          password: "{{ cohesity_smtp_password }}"
          useTls: "{{ cohesity_smtp_use_tls }}"
          fromAddress: "{{ cohesity_smtp_from_address }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      no_log: true

    - name: Enable encryption at rest
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/cluster/encryption"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          enableEncryption: "{{ cohesity_encryption_enabled }}"
          enableFipsMode: "{{ cohesity_fips_mode_enabled }}"
          rotationPeriodDays: "{{ cohesity_encryption_key_rotation_days }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      when: cohesity_encryption_enabled | bool

    - name: Create default storage domain
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/viewBoxes"
        method: POST
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          name: "{{ cohesity_storage_domain_name }}"
          compressionPolicy: "{{ 'kCompressionLow' if cohesity_storage_domain_compression else 'kCompressionNone' }}"
          deduplicationEnabled: "{{ cohesity_storage_domain_deduplication }}"
          encryptionPolicy: "{{ 'kEncryptionStrong' if cohesity_storage_domain_encryption else 'kEncryptionNone' }}"
          storagePolicy:
            deduplicationEnabled: "{{ cohesity_storage_domain_deduplication }}"
            compressionEnabled: "{{ cohesity_storage_domain_compression }}"
            encryptionEnabled: "{{ cohesity_storage_domain_encryption }}"
            numFailuresTolerated: "{{ cohesity_disk_config.data_fault_tolerance }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 201]
      register: storage_domain

    - name: Configure cluster audit logging
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/auditLog"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          enabled: true
          retentionDays: 365
          logLevel: "kInfo"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Configure support settings
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}/irisservices/api/v1/public/cluster/support"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          enabled: "{{ cohesity_support_enabled }}"
          enablePhoneHome: "{{ cohesity_phone_home_enabled }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Add cluster nodes to inventory
      ansible.builtin.add_host:
        name: "{{ item.hostname }}"
        groups: cohesity_cluster
        ansible_host: "{{ item.ip_address }}"
      loop: "{{ cohesity_nodes }}"
      loop_control:
        label: "{{ item.hostname }}"
      changed_when: false

    - name: Run post-installation checks
      ansible.builtin.include_tasks: post_checks.yml
      when: cohesity_post_checks_enabled | bool

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Cohesity Cluster Installation Complete"
          - "Cluster Name: {{ cohesity_cluster_name }}"
          - "Cluster VIP: {{ cohesity_cluster_vips[0] }}"
          - "Web Interface: {{ cohesity_api_protocol }}://{{ cohesity_cluster_vips[0] }}"
          - "Admin Username: {{ cohesity_admin_username }}"
          - "Storage Domain: {{ cohesity_storage_domain_name }}"
          - "Encryption: {{ 'Enabled' if cohesity_encryption_enabled else 'Disabled' }}"
          - "=========================================="

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_install | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_install_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_install_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_install: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_install_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_install_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_install: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_install | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_postflight_passed: true
        fe_cohesity_cohesity_cluster_install_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_install | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_status: "failed"
        fe_cohesity_cohesity_cluster_install_postflight_passed: false
        fe_cohesity_cohesity_cluster_install_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_install_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_install: FAILED at '{{ fe_cohesity_cohesity_cluster_install_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_install_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_install failed at '{{ fe_cohesity_cohesity_cluster_install_failed_task }}': {{ fe_cohesity_cohesity_cluster_install_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_install | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_install_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_install_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_install":
              component: "cohesity/cohesity_cluster_install"
              type: "role"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_install_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_install_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_install_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_install_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_install_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_install_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_install_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_install_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_install_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_install_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_install'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_stats_published: true
      tags:
        - always
