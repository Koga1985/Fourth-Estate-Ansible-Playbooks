---
# Pre-installation checks for Cohesity cluster

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_install/pre_checks']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_install_pre_checks_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_install/pre_checks | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_install_pre_checks_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_install_pre_checks_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_install_pre_checks_status: "running"
    fe_cohesity_cohesity_cluster_install_pre_checks_preflight_passed: false
    fe_cohesity_cohesity_cluster_install_pre_checks_postflight_passed: false
    fe_cohesity_cohesity_cluster_install_pre_checks_failed_task: ""
    fe_cohesity_cohesity_cluster_install_pre_checks_error: ""
    fe_cohesity_cohesity_cluster_install_pre_checks_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_install/pre_checks | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_install/pre_checks | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_install/pre_checks: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_install/pre_checks: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/pre_checks | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_install/pre_checks: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_install/pre_checks: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_install/pre_checks | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_pre_checks_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check required variables are defined
      ansible.builtin.assert:
        that:
          - cohesity_cluster_name is defined
          - cohesity_cluster_vips is defined
          - cohesity_nodes is defined
          - cohesity_admin_password is defined
        fail_msg: "Required variables are not defined. Please check your configuration."
        success_msg: "All required variables are defined."

    - name: Validate minimum node count
      ansible.builtin.assert:
        that:
          - cohesity_nodes | length >= 3
        fail_msg: "Cohesity cluster requires minimum 3 nodes. Current: {{ cohesity_nodes | length }}"
        success_msg: "Node count validation passed: {{ cohesity_nodes | length }} nodes"

    - name: Check VIP addresses are not in use
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 22
        state: stopped
        timeout: 5
      loop: "{{ cohesity_cluster_vips }}"
      ignore_errors: true
      register: vip_check

    - name: Validate VIP availability
      ansible.builtin.assert:
        that:
          - vip_check.results | selectattr('failed', 'equalto', false) | list | length == cohesity_cluster_vips | length
        fail_msg: "One or more VIP addresses are already in use"
        success_msg: "All VIP addresses are available"
      when: vip_check is defined

    - name: Check if license key is provided for production deployment
      ansible.builtin.debug:
        msg: "WARNING: No license key provided. Cluster will run in trial mode."
      when: cohesity_license_key is not defined or cohesity_license_key == ""

    - name: Validate network configuration
      ansible.builtin.assert:
        that:
          - cohesity_cluster_gateway is defined
          - cohesity_cluster_subnet_mask is defined
          - cohesity_cluster_dns_servers | length >= 1
          - cohesity_cluster_ntp_servers | length >= 1
        fail_msg: "Network configuration is incomplete"
        success_msg: "Network configuration validation passed"

    - name: Check disk space for Virtual Edition deployment
      ansible.builtin.shell: |
        df -BG {{ cohesity_ve_ova_path | dirname }} | tail -1 | awk '{print $4}' | sed 's/G//'
      register: disk_space
      changed_when: false
      when: cohesity_deployment_type == "ve" and cohesity_ve_platform == "vmware"

    - name: Validate sufficient disk space
      ansible.builtin.assert:
        that:
          - disk_space.stdout | int >= 100
        fail_msg: "Insufficient disk space. Required: 100GB, Available: {{ disk_space.stdout }}GB"
        success_msg: "Sufficient disk space available: {{ disk_space.stdout }}GB"
      when:
        - cohesity_deployment_type == "ve"
        - disk_space is defined
        - disk_space.stdout is defined

    - name: Verify vCenter connectivity for VE deployment
      community.vmware.vmware_about_info:
        hostname: "{{ cohesity_ve_vcenter_host }}"
        username: "{{ cohesity_ve_vcenter_username }}"
        password: "{{ cohesity_ve_vcenter_password }}"
        validate_certs: false
      no_log: true
      delegate_to: localhost
      register: vcenter_info
      when: cohesity_deployment_type == "ve" and cohesity_ve_platform == "vmware"

    - name: Display vCenter version
      ansible.builtin.debug:
        msg: "vCenter version: {{ vcenter_info.about_info.version }}"
      when: vcenter_info is defined and vcenter_info.about_info is defined

    - name: Check if encryption keys directory exists
      ansible.builtin.file:
        path: /etc/cohesity/encryption
        state: directory
        mode: '0700'
      when: cohesity_encryption_enabled | bool

    - name: Display pre-check summary
      ansible.builtin.debug:
        msg:
          - "Pre-installation checks completed successfully"
          - "Deployment Type: {{ cohesity_deployment_type }}"
          - "Node Count: {{ cohesity_nodes | length }}"
          - "Encryption: {{ 'Enabled' if cohesity_encryption_enabled else 'Disabled' }}"
          - "FIPS Mode: {{ 'Enabled' if cohesity_fips_mode_enabled else 'Disabled' }}"

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_install/pre_checks | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_install_pre_checks_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_install_pre_checks_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_install/pre_checks: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_install_pre_checks_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_install_pre_checks_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_install/pre_checks: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_install/pre_checks | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_pre_checks_postflight_passed: true
        fe_cohesity_cohesity_cluster_install_pre_checks_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_install/pre_checks | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_pre_checks_status: "failed"
        fe_cohesity_cohesity_cluster_install_pre_checks_postflight_passed: false
        fe_cohesity_cohesity_cluster_install_pre_checks_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_install_pre_checks_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/pre_checks | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_install/pre_checks: FAILED at '{{ fe_cohesity_cohesity_cluster_install_pre_checks_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_install_pre_checks_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_install/pre_checks | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_install/pre_checks failed at '{{ fe_cohesity_cohesity_cluster_install_pre_checks_failed_task }}': {{ fe_cohesity_cohesity_cluster_install_pre_checks_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_install/pre_checks | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_pre_checks_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_install_pre_checks_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_install_pre_checks_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/pre_checks | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_install/pre_checks":
              component: "cohesity/cohesity_cluster_install/pre_checks"
              type: "role-tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_install_pre_checks_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_install_pre_checks_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_install_pre_checks_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_install_pre_checks_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_install/pre_checks'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_install/pre_checks | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_install_pre_checks_stats_published: true
      tags:
        - always
