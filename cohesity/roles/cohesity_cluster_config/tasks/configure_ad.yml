---
# Configure Active Directory integration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_config/configure_ad']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_config_configure_ad_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_config/configure_ad | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_config_configure_ad_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_config_configure_ad_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_config_configure_ad_status: "running"
    fe_cohesity_cohesity_cluster_config_configure_ad_preflight_passed: false
    fe_cohesity_cohesity_cluster_config_configure_ad_postflight_passed: false
    fe_cohesity_cohesity_cluster_config_configure_ad_failed_task: ""
    fe_cohesity_cohesity_cluster_config_configure_ad_error: ""
    fe_cohesity_cohesity_cluster_config_configure_ad_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_config/configure_ad | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_config/configure_ad | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_config/configure_ad: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_config/configure_ad: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_ad | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_config/configure_ad: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_config/configure_ad: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_ad | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_ad_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Check if Active Directory is already configured
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/activeDirectory"
        method: GET
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 404]
      register: ad_status

    - name: Join Active Directory domain
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/activeDirectory"
        method: POST
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          domainName: "{{ cohesity_ad_domain }}"
          preferredDomainControllers: "{{ cohesity_ad_preferred_dc }}"
          userName: "{{ cohesity_ad_username }}"
          userPassword: "{{ cohesity_ad_password }}"
          ouName: "{{ cohesity_ad_ou_path }}"
          workgroup: "{{ cohesity_ad_workgroup | default(omit) }}"
          ldapProvider: "{{ cohesity_ad_ldap_provider }}"
          userIdMapping:
            type: "{{ cohesity_ad_user_id_mapping }}"
          enableAesEncryption: true
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: [200, 201]
      no_log: true
      when: ad_status.status == 404

    - name: Update Active Directory configuration
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/activeDirectory/{{ cohesity_ad_domain }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          preferredDomainControllers: "{{ cohesity_ad_preferred_dc }}"
          machineAccountsOuPath: "{{ cohesity_ad_ou_path }}"
          trustedDomains: "{{ cohesity_ad_trusted_domains }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200
      when: ad_status.status == 200

    - name: Display AD configuration status
      ansible.builtin.debug:
        msg: "Active Directory domain {{ cohesity_ad_domain }} configured successfully"

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_config/configure_ad | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_config_configure_ad_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_config_configure_ad_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_config/configure_ad: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_config_configure_ad_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_config_configure_ad_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_config/configure_ad: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_ad | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_ad_postflight_passed: true
        fe_cohesity_cohesity_cluster_config_configure_ad_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_config/configure_ad | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_ad_status: "failed"
        fe_cohesity_cohesity_cluster_config_configure_ad_postflight_passed: false
        fe_cohesity_cohesity_cluster_config_configure_ad_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_config_configure_ad_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config/configure_ad | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_config/configure_ad: FAILED at '{{ fe_cohesity_cohesity_cluster_config_configure_ad_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_config_configure_ad_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config/configure_ad | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_config/configure_ad failed at '{{ fe_cohesity_cohesity_cluster_config_configure_ad_failed_task }}': {{ fe_cohesity_cohesity_cluster_config_configure_ad_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_config/configure_ad | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_ad_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_config_configure_ad_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_config_configure_ad_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config/configure_ad | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_config/configure_ad":
              component: "cohesity/cohesity_cluster_config/configure_ad"
              type: "role-tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_config_configure_ad_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_config_configure_ad_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_configure_ad_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_config_configure_ad_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_config/configure_ad'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config/configure_ad | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_ad_stats_published: true
      tags:
        - always
