---
# tasks file for cohesity_cluster_config

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_config']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_config_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_config | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_config_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_config_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_config_status: "running"
    fe_cohesity_cohesity_cluster_config_preflight_passed: false
    fe_cohesity_cohesity_cluster_config_postflight_passed: false
    fe_cohesity_cohesity_cluster_config_failed_task: ""
    fe_cohesity_cohesity_cluster_config_error: ""
    fe_cohesity_cohesity_cluster_config_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_config | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_config | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_config: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_config: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_config: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_config: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_config_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Display Cohesity cluster configuration banner
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Cohesity Cluster Configuration"
          - "Cluster VIP: {{ cohesity_cluster_vip }}"
          - "=========================================="

    - name: Authenticate to Cohesity cluster
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/accessTokens"
        method: POST
        body_format: json
        body:
          username: "{{ cohesity_admin_username }}"
          password: "{{ cohesity_admin_password }}"
          domain: "LOCAL"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 201
      register: cohesity_auth
      no_log: true

    - name: Set Cohesity API token fact
      ansible.builtin.set_fact:
        cohesity_api_token: "{{ cohesity_auth.json.accessToken }}"
      no_log: true

    - name: Configure Active Directory integration
      ansible.builtin.include_tasks: configure_ad.yml
      when: cohesity_ad_enabled | bool

    - name: Configure LDAP integration
      ansible.builtin.include_tasks: configure_ldap.yml
      when: cohesity_ldap_enabled | bool

    - name: Configure Kerberos
      ansible.builtin.include_tasks: configure_kerberos.yml
      when: cohesity_kerberos_enabled | bool

    - name: Create local user accounts
      ansible.builtin.include_tasks: create_users.yml
      when: cohesity_local_users is defined and cohesity_local_users | length > 0

    - name: Configure RBAC with AD groups
      ansible.builtin.include_tasks: configure_rbac.yml
      when: cohesity_ad_groups is defined and cohesity_ad_groups | length > 0

    - name: Create custom roles
      ansible.builtin.include_tasks: create_custom_roles.yml
      when: cohesity_custom_roles is defined and cohesity_custom_roles | length > 0

    - name: Create storage domains
      ansible.builtin.include_tasks: create_storage_domains.yml
      when: cohesity_storage_domains is defined and cohesity_storage_domains | length > 0

    - name: Configure syslog forwarding
      ansible.builtin.include_tasks: configure_syslog.yml
      when: cohesity_syslog_enabled | bool

    - name: Configure SNMP
      ansible.builtin.include_tasks: configure_snmp.yml
      when: cohesity_snmp_enabled | bool

    - name: Configure SSL certificates
      ansible.builtin.include_tasks: configure_certificates.yml
      when: cohesity_ssl_certificate_enabled | bool

    - name: Configure security settings
      ansible.builtin.include_tasks: configure_security.yml

    - name: Configure IP allowlist
      ansible.builtin.include_tasks: configure_ip_allowlist.yml
      when: cohesity_ip_allowlist_enabled | bool

    - name: Configure multi-tenancy
      ansible.builtin.include_tasks: configure_multitenancy.yml
      when: cohesity_multi_tenancy_enabled | bool

    - name: Configure global settings
      ansible.builtin.include_tasks: configure_global_settings.yml

    - name: Configure email notifications
      ansible.builtin.include_tasks: configure_notifications.yml
      when: cohesity_email_notifications is defined

    - name: Configure ransomware protection
      ansible.builtin.include_tasks: configure_ransomware_protection.yml

    - name: Configure compliance settings
      ansible.builtin.include_tasks: configure_compliance.yml

    - name: Configure network interface groups
      ansible.builtin.include_tasks: configure_network.yml
      when: cohesity_network_interface_groups is defined

    - name: Configure QoS policies
      ansible.builtin.include_tasks: configure_qos.yml
      when: cohesity_qos_policies is defined

    - name: Configure maintenance windows
      ansible.builtin.include_tasks: configure_maintenance.yml
      when: cohesity_maintenance_windows is defined

    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Cohesity Cluster Configuration Complete"
          - "Active Directory: {{ 'Enabled' if cohesity_ad_enabled else 'Disabled' }}"
          - "Kerberos: {{ 'Enabled' if cohesity_kerberos_enabled else 'Disabled' }}"
          - "Multi-tenancy: {{ 'Enabled' if cohesity_multi_tenancy_enabled else 'Disabled' }}"
          - "Ransomware Protection: {{ 'Enabled' if cohesity_ransomware_protection.enable_datalock else 'Disabled' }}"
          - "=========================================="

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_config | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_config_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_config_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_config: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_config_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_config_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_config: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_config | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_postflight_passed: true
        fe_cohesity_cohesity_cluster_config_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_config | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_status: "failed"
        fe_cohesity_cohesity_cluster_config_postflight_passed: false
        fe_cohesity_cohesity_cluster_config_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_config_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_config: FAILED at '{{ fe_cohesity_cohesity_cluster_config_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_config_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_config failed at '{{ fe_cohesity_cohesity_cluster_config_failed_task }}': {{ fe_cohesity_cohesity_cluster_config_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_config | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_config_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_config_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_config":
              component: "cohesity/cohesity_cluster_config"
              type: "role"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_config_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_config_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_config_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_config_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_config_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_config_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_config_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_config_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_config_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_config_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_config'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_stats_published: true
      tags:
        - always
