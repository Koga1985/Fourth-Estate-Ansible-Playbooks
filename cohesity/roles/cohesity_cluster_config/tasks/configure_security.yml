---
# Configure security settings

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_cluster_config/configure_security']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_cluster_config_configure_security_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_cluster_config/configure_security | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_cluster_config_configure_security_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_cluster_config_configure_security_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_cluster_config_configure_security_status: "running"
    fe_cohesity_cohesity_cluster_config_configure_security_preflight_passed: false
    fe_cohesity_cohesity_cluster_config_configure_security_postflight_passed: false
    fe_cohesity_cohesity_cluster_config_configure_security_failed_task: ""
    fe_cohesity_cohesity_cluster_config_configure_security_error: ""
    fe_cohesity_cohesity_cluster_config_configure_security_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_cluster_config/configure_security | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_cluster_config/configure_security | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_cluster_config/configure_security: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_cluster_config/configure_security: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_security | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_cluster_config/configure_security: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_cluster_config/configure_security: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_cluster_config_configure_security_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_security | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_security_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure password policy
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/cluster/security"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          passwordPolicy:
            minPasswordLength: "{{ cohesity_security_settings.password_min_length }}"
            requireComplexPassword: "{{ cohesity_security_settings.password_complexity }}"
            passwordExpiryDays: "{{ cohesity_security_settings.password_expiry_days }}"
          sessionPolicy:
            sessionTimeoutMinutes: "{{ cohesity_security_settings.session_timeout_minutes }}"
          loginPolicy:
            maxFailedLoginAttempts: "{{ cohesity_security_settings.max_failed_login_attempts }}"
            lockoutDurationMinutes: "{{ cohesity_security_settings.lockout_duration_minutes }}"
          enableMultiFactorAuth: "{{ cohesity_security_settings.enable_multi_factor_auth }}"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Configure audit logging
      ansible.builtin.uri:
        url: "{{ cohesity_api_protocol }}://{{ cohesity_cluster_vip }}/irisservices/api/v1/public/auditLog"
        method: PUT
        headers:
          Authorization: "Bearer {{ cohesity_api_token }}"
        body_format: json
        body:
          enabled: "{{ cohesity_security_settings.enable_audit_logging }}"
          retentionDays: "{{ cohesity_security_settings.audit_log_retention_days }}"
          logLevel: "kInfo"
        validate_certs: "{{ cohesity_api_verify_ssl }}"
        status_code: 200

    - name: Display security configuration status
      ansible.builtin.debug:
        msg:
          - "Security settings configured:"
          - "Password min length: {{ cohesity_security_settings.password_min_length }}"
          - "Session timeout: {{ cohesity_security_settings.session_timeout_minutes }} minutes"
          - "MFA: {{ 'Enabled' if cohesity_security_settings.enable_multi_factor_auth else 'Disabled' }}"
          - "Audit logging: {{ cohesity_security_settings.audit_log_retention_days }} days retention"

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_cluster_config/configure_security | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_cluster_config_configure_security_preflight_passed | bool
          - fe_cohesity_cohesity_cluster_config_configure_security_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_cluster_config/configure_security: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_cluster_config_configure_security_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_cluster_config_configure_security_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_cluster_config/configure_security: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_cluster_config/configure_security | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_security_postflight_passed: true
        fe_cohesity_cohesity_cluster_config_configure_security_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_cluster_config/configure_security | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_security_status: "failed"
        fe_cohesity_cohesity_cluster_config_configure_security_postflight_passed: false
        fe_cohesity_cohesity_cluster_config_configure_security_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_cluster_config_configure_security_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config/configure_security | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_cluster_config/configure_security: FAILED at '{{ fe_cohesity_cohesity_cluster_config_configure_security_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_cluster_config_configure_security_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_cluster_config/configure_security | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_cluster_config/configure_security failed at '{{ fe_cohesity_cohesity_cluster_config_configure_security_failed_task }}': {{ fe_cohesity_cohesity_cluster_config_configure_security_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_cluster_config/configure_security | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_security_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_cluster_config_configure_security_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_cluster_config_configure_security_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config/configure_security | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_cluster_config/configure_security":
              component: "cohesity/cohesity_cluster_config/configure_security"
              type: "role-tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_cluster_config_configure_security_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_cluster_config_configure_security_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_cluster_config_configure_security_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_cluster_config_configure_security_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_cluster_config_configure_security_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_configure_security_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_cluster_config_configure_security_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_cluster_config_configure_security_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_cluster_config_configure_security_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_cluster_config_configure_security_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_cluster_config_configure_security_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_cluster_config_configure_security_status | default('') == 'succeeded' else ['cohesity/cohesity_cluster_config/configure_security'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_cluster_config/configure_security | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_cluster_config_configure_security_stats_published: true
      tags:
        - always
