---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_job_run_now']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_job_run_now_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_job_run_now | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_job_run_now_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_job_run_now_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_job_run_now_status: "running"
    fe_cohesity_cohesity_job_run_now_preflight_passed: false
    fe_cohesity_cohesity_job_run_now_postflight_passed: false
    fe_cohesity_cohesity_job_run_now_failed_task: ""
    fe_cohesity_cohesity_job_run_now_error: ""
    fe_cohesity_cohesity_job_run_now_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_job_run_now | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_job_run_now | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_job_run_now: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_job_run_now: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_job_run_now | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_job_run_now: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_job_run_now: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_job_run_now_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_job_run_now | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_job_run_now_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get job id by name
      ansible.builtin.uri:
        url: "{{ cohesity_url }}/v2/data-protect/protection-groups?environment=VMware&names={{ job_name | urlencode }}"
        method: GET
        headers: { Authorization: "Bearer {{ cohesity_token }}" }
        return_content: true
        status_code: [200]
        validate_certs: "{{ cohesity_verify_tls }}"
      register: job

    - name: Start on-demand backup
      ansible.builtin.uri:
        url: "{{ cohesity_url }}/v2/data-protect/protection-groups/{{ (job.json|first).id }}/run"
        method: POST
        headers:
          Authorization: "Bearer {{ cohesity_token }}"
          Content-Type: "application/json"
        body_format: json
        body: { runType: "OnDemand" }
        status_code: [200,202]
        validate_certs: "{{ cohesity_verify_tls }}"
      register: run_start

    - name: Wait until run completes (poll)
      vars:
        run_timeout_sec: "{{ run_timeout_sec | default(3600) }}"
        poll_every_sec: "{{ poll_every_sec | default(15) }}"
        run_state: "{{ (runs.json | sort(attribute='startTime') | last) | default({}) }}"

    - name: Fail if the run did not succeed
      until: run_state.status in ['Succeeded','Failed','Canceled','Warning']
      retries: "{{ (run_timeout_sec // poll_every_sec) | int }}"
      delay: "{{ poll_every_sec }}"
      ansible.builtin.uri:
        url: "{{ cohesity_url }}/v2/data-protect/runs?protectionGroupIds={{ (job.json|first).id }}"
        method: GET
        headers: { Authorization: "Bearer {{ cohesity_token }}" }
        return_content: true
        status_code: [200]
        validate_certs: "{{ cohesity_verify_tls }}"
      register: runs
      changed_when: false
      when: run_state.status not in ['Succeeded','Warning']
      ansible.builtin.fail:
        msg: "Cohesity run ended with status {{ run_state.status }}"

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_job_run_now | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_job_run_now_preflight_passed | bool
          - fe_cohesity_cohesity_job_run_now_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_job_run_now: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_job_run_now_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_job_run_now_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_job_run_now: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_job_run_now | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_job_run_now_postflight_passed: true
        fe_cohesity_cohesity_job_run_now_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_job_run_now | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_job_run_now_status: "failed"
        fe_cohesity_cohesity_job_run_now_postflight_passed: false
        fe_cohesity_cohesity_job_run_now_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_job_run_now_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_job_run_now | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_job_run_now: FAILED at '{{ fe_cohesity_cohesity_job_run_now_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_job_run_now_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_job_run_now | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_job_run_now failed at '{{ fe_cohesity_cohesity_job_run_now_failed_task }}': {{ fe_cohesity_cohesity_job_run_now_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_job_run_now | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_job_run_now_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_job_run_now_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_job_run_now_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_job_run_now | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_job_run_now":
              component: "cohesity/cohesity_job_run_now"
              type: "tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_job_run_now_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_job_run_now_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_job_run_now_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_job_run_now_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_job_run_now_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_job_run_now_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_job_run_now_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_job_run_now_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_job_run_now_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_job_run_now_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_job_run_now_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_job_run_now_status | default('') == 'succeeded' else ['cohesity/cohesity_job_run_now'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_job_run_now | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_job_run_now_stats_published: true
      tags:
        - always
