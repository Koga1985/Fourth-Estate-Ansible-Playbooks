---

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['cohesity/cohesity_policy_ensure']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_cohesity_cohesity_policy_ensure_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "cohesity/cohesity_policy_ensure | Initialize validation state"
  ansible.builtin.set_fact:
    fe_cohesity_cohesity_policy_ensure_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_cohesity_cohesity_policy_ensure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_cohesity_cohesity_policy_ensure_status: "running"
    fe_cohesity_cohesity_policy_ensure_preflight_passed: false
    fe_cohesity_cohesity_policy_ensure_postflight_passed: false
    fe_cohesity_cohesity_policy_ensure_failed_task: ""
    fe_cohesity_cohesity_policy_ensure_error: ""
    fe_cohesity_cohesity_policy_ensure_stats_published: false
  tags:
    - always

- name: "cohesity/cohesity_policy_ensure | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "cohesity/cohesity_policy_ensure | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          cohesity/cohesity_policy_ensure: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          cohesity/cohesity_policy_ensure: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_policy_ensure | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "cohesity/cohesity_policy_ensure: required variable '{{ item }}' is not defined."
        success_msg: "cohesity/cohesity_policy_ensure: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_cohesity_cohesity_policy_ensure_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "cohesity/cohesity_policy_ensure | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_policy_ensure_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Get Cohesity policies
      ansible.builtin.uri:
        url: "{{ cohesity_url }}/v2/policies"
        method: GET
        headers: { Authorization: "Bearer {{ cohesity_token }}" }
        return_content: true
        status_code: [200]
        validate_certs: "{{ cohesity_verify_tls }}"
      register: pols

    - name: Create or update policy
      vars:
        cur: "{{ (pols.json | selectattr('name','equalto', policy_name) | list | first) | default({}) }}"
      ansible.builtin.uri:
        url: "{{ cohesity_url }}/v2/policies{{ '' if (cur|length)==0 else '/' + cur.id }}"
        method: "{{ 'POST' if (cur|length)==0 else 'PUT' }}"
        headers:
          Authorization: "Bearer {{ cohesity_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ policy_name }}"
          description: "{{ policy_description | default('VM nightly + archive') }}"
          backupSchedule:
            periodic: { frequency: "Daily", hour: 1 }     # 01:00 nightly
          retention:
            local: { days: "{{ local_retention_days | default(30) }}" }
            archive: >-
              {{
                (archive_enabled | default(false)) |
                ternary( {'months': archive_retention_months | default(12)}, omit )
              }}
          # Optional extras:
          priority: "High"
          qosPolicy: "BackupHDD"                          # or "BackupSSD" depending on platform
        status_code: [200,201]
        validate_certs: "{{ cohesity_verify_tls }}"

    # ----------------------------- postflight -------------------

    - name: "cohesity/cohesity_policy_ensure | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_cohesity_cohesity_policy_ensure_preflight_passed | bool
          - fe_cohesity_cohesity_policy_ensure_status in ['running', 'succeeded']
        fail_msg: >-
          cohesity/cohesity_policy_ensure: postflight validation failed - preflight passed
          ={{ fe_cohesity_cohesity_policy_ensure_preflight_passed | default(false) }},
          status={{ fe_cohesity_cohesity_policy_ensure_status | default('unknown') }}.
        success_msg: "cohesity/cohesity_policy_ensure: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "cohesity/cohesity_policy_ensure | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_policy_ensure_postflight_passed: true
        fe_cohesity_cohesity_policy_ensure_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "cohesity/cohesity_policy_ensure | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_policy_ensure_status: "failed"
        fe_cohesity_cohesity_policy_ensure_postflight_passed: false
        fe_cohesity_cohesity_policy_ensure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_cohesity_cohesity_policy_ensure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_policy_ensure | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          cohesity/cohesity_policy_ensure: FAILED at '{{ fe_cohesity_cohesity_policy_ensure_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_cohesity_cohesity_policy_ensure_error }}
      tags:
        - always
        - rescue

    - name: "cohesity/cohesity_policy_ensure | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          cohesity/cohesity_policy_ensure failed at '{{ fe_cohesity_cohesity_policy_ensure_failed_task }}': {{ fe_cohesity_cohesity_policy_ensure_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "cohesity/cohesity_policy_ensure | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_policy_ensure_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_cohesity_cohesity_policy_ensure_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_cohesity_policy_ensure_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "cohesity/cohesity_policy_ensure | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "cohesity/cohesity_policy_ensure":
              component: "cohesity/cohesity_policy_ensure"
              type: "tasks"
              platform: "cohesity"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_cohesity_cohesity_policy_ensure_status | default('unknown') }}"
              preflight_passed: "{{ fe_cohesity_cohesity_policy_ensure_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_cohesity_cohesity_policy_ensure_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_cohesity_cohesity_policy_ensure_started_at | default('') }}"
              ended_at: "{{ fe_cohesity_cohesity_policy_ensure_ended_at | default('') }}"
              duration_seconds: "{{ fe_cohesity_cohesity_policy_ensure_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_cohesity_cohesity_policy_ensure_failed_task | default('') }}"
              error: "{{ fe_cohesity_cohesity_policy_ensure_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_cohesity_cohesity_policy_ensure_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_cohesity_cohesity_policy_ensure_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_cohesity_cohesity_policy_ensure_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_cohesity_cohesity_policy_ensure_status | default('') == 'succeeded' else ['cohesity/cohesity_policy_ensure'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "cohesity/cohesity_policy_ensure | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_cohesity_cohesity_policy_ensure_stats_published: true
      tags:
        - always
