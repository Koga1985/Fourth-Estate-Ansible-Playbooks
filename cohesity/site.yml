---
# Cohesity Data Protection Playbook
# Entry point for Cohesity backup automation
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory site.yml --ask-vault-pass

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Cohesity Configuration
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true

  vars:
    deploy_cluster: true
    deploy_policies: true
    deploy_agents: true
    deploy_views: true
    deploy_cloud_archive: true
    deploy_recovery: false

  tasks:
    - name: "cohesity/site | Guarded execution with rescue and always handling"
      block:

        - name: Phase 1 - Cluster Installation
          ansible.builtin.include_role:
            name: cohesity_cluster_install
          when: deploy_cluster | bool
          tags: ['cluster', 'install', 'phase1']

        - name: Phase 2 - Cluster Configuration
          ansible.builtin.include_role:
            name: cohesity_cluster_config
          when: deploy_cluster | bool
          tags: ['cluster', 'config', 'phase2']

        - name: Phase 3 - Protection Policies
          ansible.builtin.include_role:
            name: cohesity_protection_policies
          when: deploy_policies | bool
          tags: ['policies', 'phase3']

        - name: Phase 4 - Agent Deployment
          ansible.builtin.include_role:
            name: cohesity_agents
          when: deploy_agents | bool
          tags: ['agents', 'phase4']

        - name: Phase 5 - Views Configuration
          ansible.builtin.include_role:
            name: cohesity_views
          when: deploy_views | bool
          tags: ['views', 'phase5']

        - name: Phase 6 - Cloud Archive
          ansible.builtin.include_role:
            name: cohesity_cloud_archive
          when: deploy_cloud_archive | bool
          tags: ['cloud', 'archive', 'phase6']

        - name: Phase 7 - Recovery Operations
          ansible.builtin.include_role:
            name: cohesity_recovery
          when: deploy_recovery | bool
          tags: ['recovery', 'phase7']

        - name: Display summary
          ansible.builtin.debug:
            msg:
              - "=== Cohesity Deployment Complete ==="
              - "Cluster: {{ cohesity_cluster_name | default('Production-Cohesity') }}"
              - "Cloud Archive: {{ 'Enabled' if deploy_cloud_archive else 'Disabled' }}"
          tags: ['always']

        - name: "cohesity/site | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "cohesity/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cohesity_site_status: "failed"
            fe_cohesity_site_postflight_passed: false
            fe_cohesity_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cohesity_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cohesity/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cohesity/site: FAILED at '{{ fe_cohesity_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cohesity_site_error }}
          tags:
            - always
            - rescue

        - name: "cohesity/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cohesity/site failed at '{{ fe_cohesity_site_failed_task }}': {{ fe_cohesity_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cohesity/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cohesity_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cohesity_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cohesity/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cohesity/site":
                  component: "cohesity/site"
                  type: "playbook"
                  platform: "cohesity"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cohesity_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cohesity_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cohesity_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cohesity_site_started_at | default('') }}"
                  ended_at: "{{ fe_cohesity_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cohesity_site_failed_task | default('') }}"
                  error: "{{ fe_cohesity_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cohesity_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cohesity_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cohesity_site_status | default('') == 'succeeded' else ['cohesity/site'] }}
            aggregate: true
            per_host: false
          when:
            - fe_cohesity_site_status | default('') == 'failed'
            - not (fe_cohesity_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cohesity/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cohesity_site_stats_published: true
          when:
            - fe_cohesity_site_status | default('') == 'failed'
          tags:
            - always
  pre_tasks:
    - name: "cohesity/site | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "cohesity/site | Initialize validation state"
          ansible.builtin.set_fact:
            fe_cohesity_site_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_cohesity_site_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cohesity_site_status: "running"
            fe_cohesity_site_preflight_passed: false
            fe_cohesity_site_postflight_passed: false
            fe_cohesity_site_failed_task: ""
            fe_cohesity_site_error: ""
            fe_cohesity_site_stats_published: false
          tags:
            - always

        - name: "cohesity/site | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              cohesity/site: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              cohesity/site: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "cohesity/site | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "cohesity/site: required variable '{{ item }}' is not defined."
            success_msg: "cohesity/site: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_cohesity_site_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "cohesity/site | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_cohesity_site_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "cohesity/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cohesity_site_status: "preflight_failed"
            fe_cohesity_site_postflight_passed: false
            fe_cohesity_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cohesity_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cohesity/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cohesity/site: FAILED at '{{ fe_cohesity_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cohesity_site_error }}
          tags:
            - always
            - rescue

        - name: "cohesity/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cohesity/site":
                  component: "cohesity/site"
                  type: "playbook"
                  platform: "cohesity"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cohesity_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cohesity_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cohesity_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cohesity_site_started_at | default('') }}"
                  ended_at: "{{ fe_cohesity_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cohesity_site_failed_task | default('') }}"
                  error: "{{ fe_cohesity_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cohesity_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cohesity_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cohesity_site_status | default('') == 'succeeded' else ['cohesity/site'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "cohesity/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cohesity_site_stats_published: true
          tags:
            - always

        - name: "cohesity/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cohesity/site failed at '{{ fe_cohesity_site_failed_task }}': {{ fe_cohesity_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cohesity/site | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              cohesity/site: preflight
              {{ 'passed' if fe_cohesity_site_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
  post_tasks:
    - name: "cohesity/site | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "cohesity/site | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_cohesity_site_preflight_passed | bool
              - fe_cohesity_site_status in ['running', 'succeeded']
            fail_msg: >-
              cohesity/site: postflight validation failed - preflight passed
              ={{ fe_cohesity_site_preflight_passed | default(false) }},
              status={{ fe_cohesity_site_status | default('unknown') }}.
            success_msg: "cohesity/site: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "cohesity/site | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_cohesity_site_postflight_passed: true
            fe_cohesity_site_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "cohesity/site | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_cohesity_site_status: "failed"
            fe_cohesity_site_postflight_passed: false
            fe_cohesity_site_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_cohesity_site_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "cohesity/site | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              cohesity/site: FAILED at '{{ fe_cohesity_site_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_cohesity_site_error }}
          tags:
            - always
            - rescue

        - name: "cohesity/site | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              cohesity/site failed at '{{ fe_cohesity_site_failed_task }}': {{ fe_cohesity_site_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "cohesity/site | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_cohesity_site_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_cohesity_site_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_cohesity_site_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "cohesity/site | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "cohesity/site":
                  component: "cohesity/site"
                  type: "playbook"
                  platform: "cohesity"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_cohesity_site_status | default('unknown') }}"
                  preflight_passed: "{{ fe_cohesity_site_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_cohesity_site_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_cohesity_site_started_at | default('') }}"
                  ended_at: "{{ fe_cohesity_site_ended_at | default('') }}"
                  duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_cohesity_site_failed_task | default('') }}"
                  error: "{{ fe_cohesity_site_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_cohesity_site_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_cohesity_site_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_cohesity_site_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_cohesity_site_status | default('') == 'succeeded' else ['cohesity/site'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_cohesity_site_stats_published | default(false) | bool)
          tags:
            - always

        - name: "cohesity/site | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_cohesity_site_stats_published: true
          tags:
            - always

        - name: "cohesity/site | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              cohesity/site: {{ fe_cohesity_site_status | default('unknown') }} in
              {{ fe_cohesity_site_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
