---
# CrowdStrike Falcon Sensor Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['crowdstrike/falcon_sensor_install/configure']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_crowdstrike_falcon_sensor_install_configure_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "crowdstrike/falcon_sensor_install/configure | Initialize validation state"
  ansible.builtin.set_fact:
    fe_crowdstrike_falcon_sensor_install_configure_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_crowdstrike_falcon_sensor_install_configure_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_crowdstrike_falcon_sensor_install_configure_status: "running"
    fe_crowdstrike_falcon_sensor_install_configure_preflight_passed: false
    fe_crowdstrike_falcon_sensor_install_configure_postflight_passed: false
    fe_crowdstrike_falcon_sensor_install_configure_failed_task: ""
    fe_crowdstrike_falcon_sensor_install_configure_error: ""
    fe_crowdstrike_falcon_sensor_install_configure_stats_published: false
  tags:
    - always

- name: "crowdstrike/falcon_sensor_install/configure | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "crowdstrike/falcon_sensor_install/configure | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          crowdstrike/falcon_sensor_install/configure: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          crowdstrike/falcon_sensor_install/configure: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/configure | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "crowdstrike/falcon_sensor_install/configure: required variable '{{ item }}' is not defined."
        success_msg: "crowdstrike/falcon_sensor_install/configure: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_crowdstrike_falcon_sensor_install_configure_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/configure | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_configure_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Configure sensor backend (Linux)
      ansible.builtin.command: /opt/CrowdStrike/falconctl -s --backend={{ falcon_sensor_backend }}
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_sensor_backend != 'auto'
      changed_when: true

    - name: Configure tamper protection (Linux)
      ansible.builtin.command: /opt/CrowdStrike/falconctl -s --feature=tamper-protection --enable={{ 'true' if falcon_tamper_protection else 'false' }}
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']
      changed_when: true

    - name: Configure proxy settings (Linux)
      ansible.builtin.command: >
        /opt/CrowdStrike/falconctl -s
        --aph={{ falcon_proxy_host }}
        --app={{ falcon_proxy_port }}
        --apd={{ 'true' if falcon_proxy_disable_ssl else 'false' }}
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_proxy_enabled | bool
      changed_when: true

    - name: Configure sensor grouping tags
      ansible.builtin.command: /opt/CrowdStrike/falconctl -s --grouping-tags={{ falcon_sensor_grouping_tags | join(',') }}
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_sensor_grouping_tags | length > 0
      changed_when: true

    - name: Display configuration status
      ansible.builtin.debug:
        msg: "Falcon sensor configured successfully"

    # ----------------------------- postflight -------------------

    - name: "crowdstrike/falcon_sensor_install/configure | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_crowdstrike_falcon_sensor_install_configure_preflight_passed | bool
          - fe_crowdstrike_falcon_sensor_install_configure_status in ['running', 'succeeded']
        fail_msg: >-
          crowdstrike/falcon_sensor_install/configure: postflight validation failed - preflight passed
          ={{ fe_crowdstrike_falcon_sensor_install_configure_preflight_passed | default(false) }},
          status={{ fe_crowdstrike_falcon_sensor_install_configure_status | default('unknown') }}.
        success_msg: "crowdstrike/falcon_sensor_install/configure: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/configure | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_configure_postflight_passed: true
        fe_crowdstrike_falcon_sensor_install_configure_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "crowdstrike/falcon_sensor_install/configure | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_configure_status: "failed"
        fe_crowdstrike_falcon_sensor_install_configure_postflight_passed: false
        fe_crowdstrike_falcon_sensor_install_configure_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_crowdstrike_falcon_sensor_install_configure_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/configure | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          crowdstrike/falcon_sensor_install/configure: FAILED at '{{ fe_crowdstrike_falcon_sensor_install_configure_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_crowdstrike_falcon_sensor_install_configure_error }}
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/configure | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          crowdstrike/falcon_sensor_install/configure failed at '{{ fe_crowdstrike_falcon_sensor_install_configure_failed_task }}': {{ fe_crowdstrike_falcon_sensor_install_configure_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "crowdstrike/falcon_sensor_install/configure | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_configure_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_crowdstrike_falcon_sensor_install_configure_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_falcon_sensor_install_configure_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/configure | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "crowdstrike/falcon_sensor_install/configure":
              component: "crowdstrike/falcon_sensor_install/configure"
              type: "role-tasks"
              platform: "crowdstrike"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_crowdstrike_falcon_sensor_install_configure_status | default('unknown') }}"
              preflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_configure_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_configure_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_crowdstrike_falcon_sensor_install_configure_started_at | default('') }}"
              ended_at: "{{ fe_crowdstrike_falcon_sensor_install_configure_ended_at | default('') }}"
              duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_configure_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_crowdstrike_falcon_sensor_install_configure_failed_task | default('') }}"
              error: "{{ fe_crowdstrike_falcon_sensor_install_configure_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_crowdstrike_falcon_sensor_install_configure_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_crowdstrike_falcon_sensor_install_configure_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_configure_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_crowdstrike_falcon_sensor_install_configure_status | default('') == 'succeeded' else ['crowdstrike/falcon_sensor_install/configure'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/configure | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_configure_stats_published: true
      tags:
        - always
