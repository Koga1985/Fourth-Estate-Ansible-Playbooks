---
# CrowdStrike Falcon Sensor Monitoring

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['crowdstrike/falcon_sensor_install/monitoring']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_crowdstrike_falcon_sensor_install_monitoring_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "crowdstrike/falcon_sensor_install/monitoring | Initialize validation state"
  ansible.builtin.set_fact:
    fe_crowdstrike_falcon_sensor_install_monitoring_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_crowdstrike_falcon_sensor_install_monitoring_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_crowdstrike_falcon_sensor_install_monitoring_status: "running"
    fe_crowdstrike_falcon_sensor_install_monitoring_preflight_passed: false
    fe_crowdstrike_falcon_sensor_install_monitoring_postflight_passed: false
    fe_crowdstrike_falcon_sensor_install_monitoring_failed_task: ""
    fe_crowdstrike_falcon_sensor_install_monitoring_error: ""
    fe_crowdstrike_falcon_sensor_install_monitoring_stats_published: false
  tags:
    - always

- name: "crowdstrike/falcon_sensor_install/monitoring | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "crowdstrike/falcon_sensor_install/monitoring | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          crowdstrike/falcon_sensor_install/monitoring: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          crowdstrike/falcon_sensor_install/monitoring: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/monitoring | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "crowdstrike/falcon_sensor_install/monitoring: required variable '{{ item }}' is not defined."
        success_msg: "crowdstrike/falcon_sensor_install/monitoring: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/monitoring | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_monitoring_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Create sensor health check script
      ansible.builtin.copy:
        dest: /usr/local/bin/falcon-health-check.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # CrowdStrike Falcon Health Check

          echo "Checking Falcon sensor status..."

          # Check if service is running
          if systemctl is-active --quiet falcon-sensor; then
            echo "✓ Falcon sensor service is running"
          else
            echo "✗ Falcon sensor service is NOT running"
            exit 1
          fi

          # Check if sensor has AID
          AID=$(/opt/CrowdStrike/falconctl -g --aid 2>/dev/null | grep -oP 'aid="\K[^"]+')
          if [ -n "$AID" ]; then
            echo "✓ Sensor is registered (AID: ${AID:0:8}...)"
          else
            echo "✗ Sensor is NOT registered"
            exit 1
          fi

          # Check RFM state
          RFM=$(/opt/CrowdStrike/falconctl -g --rfm-state 2>/dev/null)
          echo "  RFM State: $RFM"

          echo "Falcon sensor health check complete"
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Create sensor health check cron job
      ansible.builtin.cron:
        name: "Falcon sensor health check"
        minute: "0"
        hour: "*"
        job: "/usr/local/bin/falcon-health-check.sh > /var/log/falcon-health.log 2>&1"
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Display monitoring configuration
      ansible.builtin.debug:
        msg: "Falcon sensor monitoring configured"

    # ----------------------------- postflight -------------------

    - name: "crowdstrike/falcon_sensor_install/monitoring | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_crowdstrike_falcon_sensor_install_monitoring_preflight_passed | bool
          - fe_crowdstrike_falcon_sensor_install_monitoring_status in ['running', 'succeeded']
        fail_msg: >-
          crowdstrike/falcon_sensor_install/monitoring: postflight validation failed - preflight passed
          ={{ fe_crowdstrike_falcon_sensor_install_monitoring_preflight_passed | default(false) }},
          status={{ fe_crowdstrike_falcon_sensor_install_monitoring_status | default('unknown') }}.
        success_msg: "crowdstrike/falcon_sensor_install/monitoring: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/monitoring | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_monitoring_postflight_passed: true
        fe_crowdstrike_falcon_sensor_install_monitoring_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "crowdstrike/falcon_sensor_install/monitoring | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_monitoring_status: "failed"
        fe_crowdstrike_falcon_sensor_install_monitoring_postflight_passed: false
        fe_crowdstrike_falcon_sensor_install_monitoring_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_crowdstrike_falcon_sensor_install_monitoring_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/monitoring | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          crowdstrike/falcon_sensor_install/monitoring: FAILED at '{{ fe_crowdstrike_falcon_sensor_install_monitoring_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_crowdstrike_falcon_sensor_install_monitoring_error }}
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/monitoring | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          crowdstrike/falcon_sensor_install/monitoring failed at '{{ fe_crowdstrike_falcon_sensor_install_monitoring_failed_task }}': {{ fe_crowdstrike_falcon_sensor_install_monitoring_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "crowdstrike/falcon_sensor_install/monitoring | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_monitoring_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_crowdstrike_falcon_sensor_install_monitoring_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_falcon_sensor_install_monitoring_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/monitoring | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "crowdstrike/falcon_sensor_install/monitoring":
              component: "crowdstrike/falcon_sensor_install/monitoring"
              type: "role-tasks"
              platform: "crowdstrike"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_status | default('unknown') }}"
              preflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_started_at | default('') }}"
              ended_at: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_ended_at | default('') }}"
              duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_failed_task | default('') }}"
              error: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_crowdstrike_falcon_sensor_install_monitoring_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_crowdstrike_falcon_sensor_install_monitoring_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_monitoring_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_crowdstrike_falcon_sensor_install_monitoring_status | default('') == 'succeeded' else ['crowdstrike/falcon_sensor_install/monitoring'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/monitoring | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_monitoring_stats_published: true
      tags:
        - always
