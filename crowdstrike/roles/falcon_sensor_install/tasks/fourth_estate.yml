---
# CrowdStrike Falcon Fourth Estate Configuration

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# The task file body below is wrapped in an Ansible block/rescue/always structure:
#
#   block   preflight validation runs first, then the original task file body, then
#           postflight validation. Any failure transfers control to rescue.
#   rescue  records which task failed and why, then re-raises so a failure is
#           never silently swallowed. Set fe_validation_continue_on_error=true
#           to record the failure and keep going instead.
#   always  computes the run duration and publishes the outcome through
#           ansible.builtin.set_stats, so a wrapping playbook, AWX/AAP or CI can
#           consume the result without scraping log output.
#
# Published stats (see docs/VALIDATION_AND_STATS.md):
#   fe_validation_results['crowdstrike/falcon_sensor_install/fourth_estate']  per-component record
#   fe_validation_executions / _succeeded / _failed / _duration_seconds
#   fe_validation_failed_components
#
# Add component-specific preflight checks without editing this file by setting
#   fe_crowdstrike_falcon_sensor_install_fourth_estate_required_vars: [var_one, var_two]
# ---------------------------------------------------------------------------

- name: "crowdstrike/falcon_sensor_install/fourth_estate | Initialize validation state"
  ansible.builtin.set_fact:
    fe_crowdstrike_falcon_sensor_install_fourth_estate_start_epoch: "{{ now(fmt='%s') | int }}"
    fe_crowdstrike_falcon_sensor_install_fourth_estate_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fe_crowdstrike_falcon_sensor_install_fourth_estate_status: "running"
    fe_crowdstrike_falcon_sensor_install_fourth_estate_preflight_passed: false
    fe_crowdstrike_falcon_sensor_install_fourth_estate_postflight_passed: false
    fe_crowdstrike_falcon_sensor_install_fourth_estate_failed_task: ""
    fe_crowdstrike_falcon_sensor_install_fourth_estate_error: ""
    fe_crowdstrike_falcon_sensor_install_fourth_estate_stats_published: false
  tags:
    - always

- name: "crowdstrike/falcon_sensor_install/fourth_estate | Guarded execution with preflight and postflight validation"
  block:

    # ----------------------------- preflight --------------------

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Preflight | Verify the control node meets the minimum ansible-core version"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
        fail_msg: >-
          crowdstrike/falcon_sensor_install/fourth_estate: requires ansible-core
          {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
          found {{ ansible_version.full }}.
        success_msg: >-
          crowdstrike/falcon_sensor_install/fourth_estate: ansible-core {{ ansible_version.full }} satisfies the minimum.
        quiet: true
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Preflight | Verify every declared required variable is defined"
      ansible.builtin.assert:
        that:
          - vars[item] is defined
        fail_msg: "crowdstrike/falcon_sensor_install/fourth_estate: required variable '{{ item }}' is not defined."
        success_msg: "crowdstrike/falcon_sensor_install/fourth_estate: required variable '{{ item }}' is defined."
        quiet: true
      loop: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_required_vars | default([]) }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - always
        - preflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Preflight | Record that preflight validation passed"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_fourth_estate_preflight_passed: true
      tags:
        - always
        - preflight
        - validation

    # ----------------------------- execute ----------------------

    - name: Apply Fourth Estate sensor tags
      ansible.builtin.command: >
        /opt/CrowdStrike/falconctl -s --tags=Fourth-Estate,Source-Protection,Journalist-Workstation
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_source_protection | bool
      changed_when: true

    - name: Enable enhanced logging for Fourth Estate
      ansible.builtin.command: /opt/CrowdStrike/falconctl -s --trace=info
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_enhanced_logging | bool
      changed_when: true

    - name: Configure STIG compliance mode
      ansible.builtin.command: /opt/CrowdStrike/falconctl -s --feature=stig-compliance --enable=true
      when:
        - ansible_os_family in ['RedHat', 'Debian', 'Suse']
        - falcon_stig_mode | bool
      changed_when: true
      failed_when: false

    - name: Display Fourth Estate configuration
      ansible.builtin.debug:
        msg: "Fourth Estate specific Falcon configuration applied"

    # ----------------------------- postflight -------------------

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Postflight | Verify the guarded body ran after a passing preflight"
      ansible.builtin.assert:
        that:
          - fe_crowdstrike_falcon_sensor_install_fourth_estate_preflight_passed | bool
          - fe_crowdstrike_falcon_sensor_install_fourth_estate_status in ['running', 'succeeded']
        fail_msg: >-
          crowdstrike/falcon_sensor_install/fourth_estate: postflight validation failed - preflight passed
          ={{ fe_crowdstrike_falcon_sensor_install_fourth_estate_preflight_passed | default(false) }},
          status={{ fe_crowdstrike_falcon_sensor_install_fourth_estate_status | default('unknown') }}.
        success_msg: "crowdstrike/falcon_sensor_install/fourth_estate: postflight validation passed."
        quiet: true
      tags:
        - always
        - postflight
        - validation

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Postflight | Record the successful outcome"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_fourth_estate_postflight_passed: true
        fe_crowdstrike_falcon_sensor_install_fourth_estate_status: "succeeded"
      tags:
        - always
        - postflight
        - validation

  rescue:

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Rescue | Capture the failing task and error detail"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_fourth_estate_status: "failed"
        fe_crowdstrike_falcon_sensor_install_fourth_estate_postflight_passed: false
        fe_crowdstrike_falcon_sensor_install_fourth_estate_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
        fe_crowdstrike_falcon_sensor_install_fourth_estate_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Rescue | Report the failure"
      ansible.builtin.debug:
        msg: >-
          crowdstrike/falcon_sensor_install/fourth_estate: FAILED at '{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_failed_task }}' on
          {{ inventory_hostname }} - {{ fe_crowdstrike_falcon_sensor_install_fourth_estate_error }}
      tags:
        - always
        - rescue

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Rescue | Re-raise the failure unless the caller opted to continue"
      ansible.builtin.fail:
        msg: >-
          crowdstrike/falcon_sensor_install/fourth_estate failed at '{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_failed_task }}': {{ fe_crowdstrike_falcon_sensor_install_fourth_estate_error }}
      when: not (fe_validation_continue_on_error | default(false) | bool)
      tags:
        - always
        - rescue

  always:

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Always | Compute the execution duration"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_fourth_estate_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        fe_crowdstrike_falcon_sensor_install_fourth_estate_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_falcon_sensor_install_fourth_estate_start_epoch | default(0) | int) }}"
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Always | Publish the validation result with set_stats"
      ansible.builtin.set_stats:
        data:
          fe_validation_results:
            "crowdstrike/falcon_sensor_install/fourth_estate":
              component: "crowdstrike/falcon_sensor_install/fourth_estate"
              type: "role-tasks"
              platform: "crowdstrike"
              host: "{{ inventory_hostname }}"
              status: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_status | default('unknown') }}"
              preflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_preflight_passed | default(false) | bool }}"
              postflight_passed: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_postflight_passed | default(false) | bool }}"
              started_at: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_started_at | default('') }}"
              ended_at: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_ended_at | default('') }}"
              duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_duration_seconds | default(0) | int }}"
              failed_task: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_failed_task | default('') }}"
              error: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_error | default('') }}"
              check_mode: "{{ ansible_check_mode | default(false) | bool }}"
          fe_validation_executions: 1
          fe_validation_succeeded: "{{ 1 if fe_crowdstrike_falcon_sensor_install_fourth_estate_status | default('') == 'succeeded' else 0 }}"
          fe_validation_failed: "{{ 0 if fe_crowdstrike_falcon_sensor_install_fourth_estate_status | default('') == 'succeeded' else 1 }}"
          fe_validation_duration_seconds: "{{ fe_crowdstrike_falcon_sensor_install_fourth_estate_duration_seconds | default(0) | int }}"
          fe_validation_failed_components: >-
            {{ [] if fe_crowdstrike_falcon_sensor_install_fourth_estate_status | default('') == 'succeeded' else ['crowdstrike/falcon_sensor_install/fourth_estate'] }}
        aggregate: true
        per_host: false
      tags:
        - always

    - name: "crowdstrike/falcon_sensor_install/fourth_estate | Always | Mark the validation statistics as published"
      ansible.builtin.set_fact:
        fe_crowdstrike_falcon_sensor_install_fourth_estate_stats_published: true
      tags:
        - always
