---
# CrowdStrike Falcon Sensor Deployment Playbook
# Fourth Estate production-ready EDR deployment

# ---------------------------------------------------------------------------
# Fourth Estate preflight / postflight validation harness
#
# Every play below carries a block/rescue/always validation wrapper:
#
#   pre_tasks   preflight validation. On failure it records the reason,
#               publishes the outcome with set_stats and aborts the play
#               before any role or task runs.
#   tasks       the original task list, wrapped so a failure is captured
#               (which task, which error) and then re-raised.
#   post_tasks  postflight validation, then the run record is published with
#               ansible.builtin.set_stats.
#
# Set fe_validation_continue_on_error=true to record failures and keep going.
# See docs/VALIDATION_AND_STATS.md for the published stats schema.
# ---------------------------------------------------------------------------

- name: Deploy CrowdStrike Falcon Sensors
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars:
    # Override these variables at runtime or in inventory
    # ansible-playbook deploy_falcon_sensors.yml -e "falcon_cid=YOUR_CID"
    falcon_cid: "{{ lookup('env', 'FALCON_CID') }}"
    falcon_installation_token: "{{ lookup('env', 'FALCON_TOKEN') }}"
    falcon_cloud: "us-gov-1"
    falcon_fourth_estate_enabled: true

  pre_tasks:
    - name: "crowdstrike/deploy_falcon_sensors | Preflight validation"
      tags:
        - always
        - preflight
        - validation
      block:

        - name: "crowdstrike/deploy_falcon_sensors | Initialize validation state"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_start_epoch: "{{ now(fmt='%s') | int }}"
            fe_crowdstrike_deploy_falcon_sensors_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_crowdstrike_deploy_falcon_sensors_status: "running"
            fe_crowdstrike_deploy_falcon_sensors_preflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_failed_task: ""
            fe_crowdstrike_deploy_falcon_sensors_error: ""
            fe_crowdstrike_deploy_falcon_sensors_stats_published: false
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Preflight | Verify the control node meets the minimum ansible-core version"
          ansible.builtin.assert:
            that:
              - ansible_version.full is version(fe_validation_min_ansible_version | default('2.12'), '>=')
            fail_msg: >-
              crowdstrike/deploy_falcon_sensors: requires ansible-core
              {{ fe_validation_min_ansible_version | default('2.12') }} or newer,
              found {{ ansible_version.full }}.
            success_msg: >-
              crowdstrike/deploy_falcon_sensors: ansible-core {{ ansible_version.full }} satisfies the minimum.
            quiet: true
          tags:
            - always
            - preflight
            - validation

        - name: "crowdstrike/deploy_falcon_sensors | Preflight | Verify every declared required variable is defined"
          ansible.builtin.assert:
            that:
              - vars[item] is defined
            fail_msg: "crowdstrike/deploy_falcon_sensors: required variable '{{ item }}' is not defined."
            success_msg: "crowdstrike/deploy_falcon_sensors: required variable '{{ item }}' is defined."
            quiet: true
          loop: "{{ fe_crowdstrike_deploy_falcon_sensors_required_vars | default([]) }}"
          loop_control:
            label: "{{ item }}"
          tags:
            - always
            - preflight
            - validation

        - name: "crowdstrike/deploy_falcon_sensors | Preflight | Record that preflight validation passed"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_preflight_passed: true
          tags:
            - always
            - preflight
            - validation

      rescue:

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_status: "preflight_failed"
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_crowdstrike_deploy_falcon_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: FAILED at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "crowdstrike/deploy_falcon_sensors":
                  component: "crowdstrike/deploy_falcon_sensors"
                  type: "playbook"
                  platform: "crowdstrike"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_crowdstrike_deploy_falcon_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_crowdstrike_deploy_falcon_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_crowdstrike_deploy_falcon_sensors_failed_task | default('') }}"
                  error: "{{ fe_crowdstrike_deploy_falcon_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else ['crowdstrike/deploy_falcon_sensors'] }}
            aggregate: true
            per_host: false
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_stats_published: true
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              crowdstrike/deploy_falcon_sensors failed at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}': {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "crowdstrike/deploy_falcon_sensors | Always | Report the preflight outcome"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: preflight
              {{ 'passed' if fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) | bool else 'FAILED' }}
              on {{ inventory_hostname }}.
          tags:
            - always
    - name: "crowdstrike/deploy_falcon_sensors | Guarded pre_tasks with rescue and always handling"
      block:

        - name: Validate Falcon CID is provided
          ansible.builtin.assert:
            that:
              - falcon_cid is defined
              - falcon_cid | length > 0
            fail_msg: "Falcon CID must be provided via -e falcon_cid=YOUR_CID or FALCON_CID env var"

        - name: Display deployment information
          ansible.builtin.debug:
            msg:
              - "Deploying CrowdStrike Falcon sensors"
              - "Target hosts: {{ ansible_play_hosts | length }}"
              - "Falcon Cloud: {{ falcon_cloud }}"
              - "Fourth Estate Mode: {{ falcon_fourth_estate_enabled }}"

        - name: "crowdstrike/deploy_falcon_sensors | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_status: "failed"
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_crowdstrike_deploy_falcon_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: FAILED at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              crowdstrike/deploy_falcon_sensors failed at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}': {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "crowdstrike/deploy_falcon_sensors | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_crowdstrike_deploy_falcon_sensors_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_deploy_falcon_sensors_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "crowdstrike/deploy_falcon_sensors":
                  component: "crowdstrike/deploy_falcon_sensors"
                  type: "playbook"
                  platform: "crowdstrike"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_crowdstrike_deploy_falcon_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_crowdstrike_deploy_falcon_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_crowdstrike_deploy_falcon_sensors_failed_task | default('') }}"
                  error: "{{ fe_crowdstrike_deploy_falcon_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else ['crowdstrike/deploy_falcon_sensors'] }}
            aggregate: true
            per_host: false
          when:
            - fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'failed'
            - not (fe_crowdstrike_deploy_falcon_sensors_stats_published | default(false) | bool)
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_stats_published: true
          when:
            - fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'failed'
          tags:
            - always

  roles:
    - role: falcon_sensor_install

  post_tasks:
    - name: Verify sensor deployment
      ansible.builtin.command: /opt/CrowdStrike/falconctl -g --aid
      register: deployment_verify
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']

    - name: Display deployment results
      ansible.builtin.debug:
        msg: "Falcon sensor deployed successfully on {{ inventory_hostname }}"
    - name: "crowdstrike/deploy_falcon_sensors | Postflight validation"
      tags:
        - always
        - postflight
        - validation
      block:

        - name: "crowdstrike/deploy_falcon_sensors | Postflight | Verify the guarded body ran after a passing preflight"
          ansible.builtin.assert:
            that:
              - fe_crowdstrike_deploy_falcon_sensors_preflight_passed | bool
              - fe_crowdstrike_deploy_falcon_sensors_status in ['running', 'succeeded']
            fail_msg: >-
              crowdstrike/deploy_falcon_sensors: postflight validation failed - preflight passed
              ={{ fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) }},
              status={{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }}.
            success_msg: "crowdstrike/deploy_falcon_sensors: postflight validation passed."
            quiet: true
          tags:
            - always
            - postflight
            - validation

        - name: "crowdstrike/deploy_falcon_sensors | Postflight | Record the successful outcome"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: true
            fe_crowdstrike_deploy_falcon_sensors_status: "succeeded"
          tags:
            - always
            - postflight
            - validation

      rescue:

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_status: "failed"
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_crowdstrike_deploy_falcon_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: FAILED at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              crowdstrike/deploy_falcon_sensors failed at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}': {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "crowdstrike/deploy_falcon_sensors | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_crowdstrike_deploy_falcon_sensors_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_deploy_falcon_sensors_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "crowdstrike/deploy_falcon_sensors":
                  component: "crowdstrike/deploy_falcon_sensors"
                  type: "playbook"
                  platform: "crowdstrike"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_crowdstrike_deploy_falcon_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_crowdstrike_deploy_falcon_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_crowdstrike_deploy_falcon_sensors_failed_task | default('') }}"
                  error: "{{ fe_crowdstrike_deploy_falcon_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else ['crowdstrike/deploy_falcon_sensors'] }}
            aggregate: true
            per_host: false
          when:
            - not (fe_crowdstrike_deploy_falcon_sensors_stats_published | default(false) | bool)
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_stats_published: true
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Report the run summary"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: {{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }} in
              {{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) }}s on {{ inventory_hostname }}.
          tags:
            - always
  tasks:
    - name: "crowdstrike/deploy_falcon_sensors | Guarded execution with rescue and always handling"
      block:

        - name: "crowdstrike/deploy_falcon_sensors | Flush notified handlers inside the guarded block"
          ansible.builtin.meta: flush_handlers
          tags:
            - always

      rescue:

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Capture the failing task and error detail"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_status: "failed"
            fe_crowdstrike_deploy_falcon_sensors_postflight_passed: false
            fe_crowdstrike_deploy_falcon_sensors_failed_task: "{{ ansible_failed_task.name | default('unknown task') }}"
            fe_crowdstrike_deploy_falcon_sensors_error: "{{ ansible_failed_result.msg | default('no error detail reported') }}"
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Report the failure"
          ansible.builtin.debug:
            msg: >-
              crowdstrike/deploy_falcon_sensors: FAILED at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}' on
              {{ inventory_hostname }} - {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          tags:
            - always
            - rescue

        - name: "crowdstrike/deploy_falcon_sensors | Rescue | Re-raise the failure unless the caller opted to continue"
          ansible.builtin.fail:
            msg: >-
              crowdstrike/deploy_falcon_sensors failed at '{{ fe_crowdstrike_deploy_falcon_sensors_failed_task }}': {{ fe_crowdstrike_deploy_falcon_sensors_error }}
          when: not (fe_validation_continue_on_error | default(false) | bool)
          tags:
            - always
            - rescue

      always:

        - name: "crowdstrike/deploy_falcon_sensors | Always | Compute the execution duration"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_ended_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            fe_crowdstrike_deploy_falcon_sensors_duration_seconds: "{{ (now(fmt='%s') | int) - (fe_crowdstrike_deploy_falcon_sensors_start_epoch | default(0) | int) }}"
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Publish the validation result with set_stats"
          ansible.builtin.set_stats:
            data:
              fe_validation_results:
                "crowdstrike/deploy_falcon_sensors":
                  component: "crowdstrike/deploy_falcon_sensors"
                  type: "playbook"
                  platform: "crowdstrike"
                  host: "{{ inventory_hostname }}"
                  status: "{{ fe_crowdstrike_deploy_falcon_sensors_status | default('unknown') }}"
                  preflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_preflight_passed | default(false) | bool }}"
                  postflight_passed: "{{ fe_crowdstrike_deploy_falcon_sensors_postflight_passed | default(false) | bool }}"
                  started_at: "{{ fe_crowdstrike_deploy_falcon_sensors_started_at | default('') }}"
                  ended_at: "{{ fe_crowdstrike_deploy_falcon_sensors_ended_at | default('') }}"
                  duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
                  failed_task: "{{ fe_crowdstrike_deploy_falcon_sensors_failed_task | default('') }}"
                  error: "{{ fe_crowdstrike_deploy_falcon_sensors_error | default('') }}"
                  check_mode: "{{ ansible_check_mode | default(false) | bool }}"
              fe_validation_executions: 1
              fe_validation_succeeded: "{{ 1 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 0 }}"
              fe_validation_failed: "{{ 0 if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else 1 }}"
              fe_validation_duration_seconds: "{{ fe_crowdstrike_deploy_falcon_sensors_duration_seconds | default(0) | int }}"
              fe_validation_failed_components: >-
                {{ [] if fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'succeeded' else ['crowdstrike/deploy_falcon_sensors'] }}
            aggregate: true
            per_host: false
          when:
            - fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'failed'
            - not (fe_crowdstrike_deploy_falcon_sensors_stats_published | default(false) | bool)
          tags:
            - always

        - name: "crowdstrike/deploy_falcon_sensors | Always | Mark the validation statistics as published"
          ansible.builtin.set_fact:
            fe_crowdstrike_deploy_falcon_sensors_stats_published: true
          when:
            - fe_crowdstrike_deploy_falcon_sensors_status | default('') == 'failed'
          tags:
            - always
